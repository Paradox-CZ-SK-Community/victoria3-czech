l_polish:
 je_brazilian_nation_building: "Integrace brazilského národa"
 je_brazilian_nation_building_reason: "Brazílie je kolonií bez mateřské země; stát bez národa. Vykovat jednotnou identitu ze všech národů, které obývají tuto rozlehlou zemi, bude vyžadovat pečlivé úvahy, dokončení herkulovských úkolů a pevnou ruku. Je jednotná, sjednocená Brazílie skutečně možná?"
 je_brazilian_nation_building_ragamuffin_war_south: "#bold Ragamuffin War#! skončila a kulturní nepokoje [SCOPE.sCulture('sulista_culture').GetName] v domovinách [SCOPE.sCulture('sulista_culture').GetNameNoFormatting] klesly pod #bold 10%#!."
 je_brazilian_nation_building_ragamuffin_war_done: "#bold Ragamuffin War#! skončila a [concept_devastation] ve všech státech s domovinami [SCOPE.sCulture('amazonic_culture').GetName] klesla pod #bold 5%#!."
 je_brazilian_nation_building_brazilian_national_hero_owned: "Byl vyhlášen regionální #bold [concept_brz_national_hero]#!, který lze využít v propagandě."
 je_brazilian_nation_building_integrate_nordestino: "Integrovat Nordestinos"
 je_brazilian_nation_building_integrate_nordestino_past_tense: "Nordestinos jsou Brazilci"
 je_brazilian_nation_building_integrate_nordestino_desc: "Abychom přivedli obyvatele severovýchodu do jednoty a skutečně je smířili s novým národním uspořádáním, musíme odstranit jeden z největších zdrojů neklidu v regionu — instituci, která vyvolává jak výkřiky odsouzení, tak volání po jejím věčném zachování."
 je_brazilian_nation_building_integrate_nordestino_tt: "Každý [SCOPE.sCulture('nordestino_culture').GetName] [concept_pop] na celém světě se stane [SCOPE.sCulture('brazilian_culture').GetName]."
 je_brazilian_nation_building_integrate_nordestino_complete_tt: "[SCOPE.sCulture('nordestino_culture').GetName] byl integrován do kultury [SCOPE.sCulture('brazilian_culture').GetName]"
 je_brazilian_nation_building_integrate_nordestino_removal_tt: "Každá [SCOPE.sCulture('nordestino_culture').GetName] [concept_homeland] bude odstraněna z našich zemí."
 je_brazilian_nation_building_integrate_sulista: "Integrovat Sulisty"
 je_brazilian_nation_building_integrate_sulista_past_tense: "Sulisté jsou Brazilci"
 je_brazilian_nation_building_integrate_sulista_desc: "Gaúchos na jihu jasně cítili, že jejich zájmy nejsou v souladu se zájmy Brazílie. Povstání Farrapos zřetelně ukázalo, jak hluboká je v současnosti tato propast. Zklidnění nespokojenosti Farroupilha bude vyžadovat jak mrkvičku, tak hůl."
 je_brazilian_nation_building_integrate_sulista_tt: "Každý [SCOPE.sCulture('sulista_culture').GetName] [concept_pop] na celém světě se stane [SCOPE.sCulture('brazilian_culture').GetName]."
 je_brazilian_nation_building_integrate_sulista_complete_tt: "[SCOPE.sCulture('sulista_culture').GetName] byl integrován do kultury [SCOPE.sCulture('brazilian_culture').GetName]"
 je_brazilian_nation_building_integrate_sulista_removal_tt: "Každá [SCOPE.sCulture('sulista_culture').GetName] [concept_homeland] bude odstraněna z našich zemí."
 je_brazilian_nation_building_integrate_paulista: "Integrovat Paulisty"
 je_brazilian_nation_building_integrate_paulista_past_tense: "Paulisté jsou Brazilci"
 je_brazilian_nation_building_integrate_paulista_desc: "Hrdí obyvatelé São Paula kráčejí vlastí cestou a obchodují na svých trzích. Vybudování ekonomické role pro tento region, která zapadne do širšího brazilského trhu, bude klíčové pro vytvoření společné národní identity s nimi."
 je_brazilian_nation_building_integrate_paulista_tt: "Každý [SCOPE.sCulture('paulista_culture').GetName] [concept_pop] na celém světě se stane [SCOPE.sCulture('brazilian_culture').GetName]."
 je_brazilian_nation_building_integrate_paulista_je_tt: "Journal Entry #bold River of Coffee#! je aktivován a dokončen"
 je_brazilian_nation_building_integrate_paulista_complete_tt: "[SCOPE.sCulture('paulista_culture').GetName] byl integrován do kultury [SCOPE.sCulture('brazilian_culture').GetName]"
 je_brazilian_nation_building_integrate_paulista_removal_tt: "Každá [SCOPE.sCulture('paulista_culture').GetName] [concept_homeland] bude odstraněna z našich zemí."
 je_brazilian_nation_building_integrate_amazonic: "Integrovat Amazoniky"
 je_brazilian_nation_building_integrate_amazonic_past_tense: "Amazonici jsou Brazilci"
 je_brazilian_nation_building_integrate_amazonic_desc: "Naše severní území jsou plná nespokojenosti a odtržena od obchodu a politiky zbytku Brazílie. Integrace Amazonie vyžaduje uklidnění roztříštěných severanů a stabilizaci regionu rozvráceného povstáními."
 je_brazilian_nation_building_integrate_amazonic_tt: "Každý [SCOPE.sCulture('amazonic_culture').GetName] [concept_pop] na celém světě se stane [SCOPE.sCulture('brazilian_culture').GetName]."
 je_brazilian_nation_building_integrate_amazonic_complete_tt: "[SCOPE.sCulture('amazonic_culture').GetName] byl integrován do kultury [SCOPE.sCulture('brazilian_culture').GetName]"
 je_brazilian_nation_building_integrate_amazonic_removal_tt: "Každá [SCOPE.sCulture('amazonic_culture').GetName] [concept_homeland] bude odstraněna z našich zemí."
 culture_brazil.1.t: "Nový národní hrdina"
 culture_brazil.1.d: "[SCOPE.sCharacter('brazilian_national_hero').GetFullName] se na bojišti osvědčil a po ohromném vítězství v [SCOPE.sState('state').GetName] se [SCOPE.sCharacter('brazilian_national_hero').GetSheHe] stal poutací hvězdou pro národ a pro lidi [SCOPE.sCulture('brazilian_national_hero_culture').GetName]."
 culture_brazil.1.f: ""Od Porto Alegre po Belém si myslím, že se všichni shodneme, že to, čeho dnes [SCOPE.sCharacter('brazilian_national_hero').GetFullNameNoFormatting] dosáhl, bylo nic menšího než zázrak. Na [SCOPE.sCharacter('brazilian_national_hero').GetHerHim] navrhuji přípitek! Viva [SCOPE.sCharacter('brazilian_national_hero').GetLastNameNoFormatting]!""
 culture_brazil.1.a: "[SCOPE.sCharacter('brazilian_national_hero').GetPrimaryRoleTitle] [SCOPE.sCharacter('brazilian_national_hero').GetLastName] je [concept_brz_national_hero] Brazílie!"
 culture_brazil.1.hero_clarification: "[SCOPE.sCharacter('brazilian_national_hero').GetFullName] může využít svůj status [SCOPE.sCharacter('brazilian_national_hero').GetHerHis] jako [concept_brz_national_hero] k integraci lidí [SCOPE.sCulture('brazilian_national_hero_culture').GetName]"
 culture_brazil.1.b: "Raději bychom tuto výjimečnou osobu odsoudili."
 culture_brazil.2.t: "Brasilidade"
 culture_brazil.2.d: "Naše snahy upevnit jednotnou národní identitu se po mnohé práci podařily. Tento pojem brazilskosti, tato #italic Brasilidade#!, se nyní rozprostírá po celé zemi."
 culture_brazil.2.f: ""Naše země, náš lid, jsou něco souvislejšího než nějaká slepená mozaika. Ne, národ vše spojuje jako přítoky vlévající se do Amazonky—Brazílie není mozaika, je to #italic akvarel#!.""
 culture_brazil.2.a: "Ó, má brazilská Brazílie!"
 culture_brazil.2.b: "Tato Brazílie může být vaše!"
 culture_brazil.3.t: "Integrace Paulistů"
 culture_brazil.3.d: "Lidé [SCOPE.sCulture('paulista_culture').GetName], obyvatelé São Paula a caipirové z vnitrozemí, se smířili s centrální vládou a rostoucím národním hnutím [SCOPE.sCulture('brazilian_culture').GetName]."
 culture_brazil.3.f: ""#italic Tiché břehy Ipiranga zaslechly,\nvýrazný pokřik hrdého lidu,\nA slunce Svobody v zářících paprscích,\nzažehlo v domovině nebe v onen okamžik.#!"" #–Národní hymna Brazílie"
 culture_brazil.3.a: "Ó milovaná, uctívaná vlast! Ať žije, ať žije!"
 culture_brazil.4.t: "Integrace Sulistů"
 culture_brazil.4.d: "Lidé [SCOPE.sCulture('sulista_culture').GetName] z Paraná a Iguazú a kovbojové jihu se smířili s centrální vládou a rostoucím národním hnutím [SCOPE.sCulture('brazilian_culture').GetName]."
 culture_brazil.4.f: ""Nebesa, slunce, země a barva. To je to, co je na naší zemi nejkrásnější. A více, co dělá z Brazílie místo, kde všechno, co se zasází, roste."\n\n"Ale otče, proč si nemůžeme nechat naše těžce vydělané? Je to fér, když pro to dřeme."\n\n"A kdo myslíš, že dělá tvoje nástroje? Moje boty? Oblečení tvé matky? Brazílie potřebuje naše bavlny a kávu, stejně jako my potřebujeme jejich železo a mléko. Jsme silnější společně, synu.""
 culture_brazil.4.a: "Ó milovaná, uctívaná vlast! Ať žije, ať žije!"
 culture_brazil.5.t: "Integrace Amazoniků"
 culture_brazil.5.d: "Lidé [SCOPE.sCulture('amazonic_culture').GetName] ze severu a osadníci hranic Amazonie se smířili s centrální vládou a rostoucím národním hnutím [SCOPE.sCulture('brazilian_culture').GetName]."
 culture_brazil.5.f: ""Severní státy jsou s námi a jdou za námi!"\n\nZ publika vystoupilo něco víc než jásot. Úleva, jako sestra starající se o bratra? Možná otčův triumf nad tím, že měl pravdu? Možná to nebylo důležité, protože celý dům byl přiveden blíže k jednotě."
 culture_brazil.5.a: "Ó milovaná, uctívaná vlast! Ať žije, ať žije!"
 culture_brazil.6.t: "Integrace Nordestinů"
 culture_brazil.6.d: "Lidé [SCOPE.sCulture('nordestino_culture').GetName] z Bahia, Pernambuco a celého severovýchodu se smířili s centrální vládou a rostoucím národním hnutím [SCOPE.sCulture('brazilian_culture').GetName]."
 culture_brazil.6.f: ""Náboženství, Nezávislost, Jednota, Svoboda—to jsou hesla Brazílie. Teď si jistě všichni kladete otázku, co tu dělá kněz a sběrač kávy. Kdo zná odpověď?"\n\n"Jsme Brazilci. To je to, co od nás země žádá."\n\n"Dám půlbody. Ano, jsme všichni Brazilci. Ale ne, země žádá, abychom si vážili všeho, co máme. Neboť jsme #italic vším#!, co máme.""
 culture_brazil.6.a: "Ó milovaná, uctívaná vlast! Ať žije, ať žije!"
 brz_perfido: "Pérfido"
 brz_brasil_brasileiro: "Brasil Brasileiro"
 brz_brasil_pra_mim: "Brasil! Prá mim!"
 je_south_american_national_identity: "Nová národní identita"
 je_south_american_national_identity_reason: "Ačkoliv jsme kdysi byli součástí větší kontinuity, sdíleli společnou koloniální vládu a vedení s našimi sousedy, od získání nezávislosti jsme se značně odklonili. Je čas plně přijmout novou identitu [SCOPE.sCulture('new_national_culture').GetName]."
 je_south_american_national_identity_integrate_a_state: "Prosadit národní identitu"
 je_south_american_national_identity_integrate_a_state_desc: "Zahajuje kampaň na podporu integrace naší nové národní kultury po zemi a přiděluje nové domoviny [SCOPE.sCulture('new_national_culture').GetName] v našich [SCOPE.sCulture('old_national_culture').GetName] [Concept('concept_incorporated_state', '$concept_incorporated_states$')]."
 new_culture_has_25_percent_tt: "Obyvatelstvo tohoto státu je alespoň #variable 25%#! [SCOPE.sCulture('new_national_culture').GetName]"
 culture_south_america.1.t: "Národní základy"
 culture_south_america.1.d: "Národní probuzení v naší zemi vedlo ke vzniku výrazné identity [SCOPE.sCulture('new_national_culture').GetName] mezi vedoucími nacionalisty."
 culture_south_america.1.f: ""Náš posvátný pokřik je náš a jen náš! Uslyšte zvuk zlomených řetězů a uvidíte posvátný chrám vztyčený zákonu, míru a jednotě! Jak modré je nebe, jak slavná je vlast!""
 culture_south_america.1.a: "[SCOPE.sCulture('old_south_american_culture').GetName] již ne—nyní jsme lid [SCOPE.sCulture('new_national_culture').GetName]!"
 culture_south_america.1.b: "Jsme dědici většího ideálu!"
 culture_south_america.2.t: "Národní hodnoty"
 culture_south_america.2.d: "Vzestup lidí v regionech sousedících s [SCOPE.sState('south_american_culture_state').GetName] začal přijímat jejich novou identitu [SCOPE.sCulture('new_national_culture').GetName]."
 culture_south_america.2.f: ""Jaká vznešená země je to, která pojímá tak krásný lid? Milovaná vlast, milovaná země, patřím tobě!"\n\nDav poetovu květnatou řeč zdvořile ocenil. Ačkoliv jeho slova byla... květnatá, pocit byl stále oceněn."
 culture_south_america.2.a: "Vítejte v národě [SCOPE.sCulture('new_national_culture').GetName]!"
 culture_south_america.3.t: "Národ [SCOPE.sCulture('new_national_culture').GetName]"
 culture_south_america.3.d: "Ze všech koutů země lidé mluví o své domovině [SCOPE.sCulture('new_national_culture').GetName]. Identita [SCOPE.sCulture('old_national_culture').GetName] již neexistuje."
 culture_south_america.3.f: "Vlajka mávala na centrálním náměstí, zatímco průvod obcházel, trumpety hřměly a bubny jednotně tloukly. „Ať slunce zradí své světlo dříve, než někdy porušíme slavný slib, který jsme dali své vlasti!“ burácel dav, upřímněji než kdy předtím."
 culture_south_america.3.a: "Sláva lidu [SCOPE.sCulture('new_national_culture').GetName]!"
 every_pop_converts_tt: "Každý [SCOPE.sCulture('old_national_culture').GetName] [concept_pop] v této zemi se [Concept('concept_assimilation','$concept_assimilate$')] do [SCOPE.sCulture('new_national_culture').GetName]"
 south_america_culture_convert_cooldown_tt: "Rozhodnutí #bold Prosadit národní identitu#! nebylo použito v posledních #bold pět let#!"
 modifier_assimilation_nnc: "Rozkvétající národní identita"
 75_percent_of_upper_pops_assimilate_tt: "#v 75%#! [SCOPE.sCulture('old_south_american_culture').GetName] [Concept('concept_upper_strata','Upper Strata')] [Concept('concept_pop', '$concept_pops$')] v [ROOT.GetCountry.GetCapital.GetName] se asimiluje do [SCOPE.sCulture('new_national_culture').GetName] [concept_culture]"
 75_percent_of_upper_pops_assimilate_global_tt: "#v 75%#! [SCOPE.sCulture('old_south_american_culture').GetName] [Concept('concept_upper_strata','Upper Strata')] [Concept('concept_pop', '$concept_pops$')] v tomto [concept_state] se asimiluje do [SCOPE.sCulture('new_national_culture').GetName] [concept_culture]"
 is_university_gov_admin_or_urban_center_tt: "Budova je [GetBuildingType('building_urban_center').GetName], [GetBuildingType('building_university').GetName] nebo [GetBuildingType('building_government_administration').GetName]"
 is_barracks_or_naval_administration_tt: "Budova je [GetBuildingType('building_barrack').GetName] nebo [GetBuildingType('building_naval_administration').GetName]"
