 great_game_core_progress_bar_name: "Velká hra" # todo: NEW TRANSLATION
 great_game_core_progress_bar_britain_desc: "[GetGlobalVariable('great_game_gbr_progress').GetValue|1]#!" # todo: NEW TRANSLATION
 great_game_core_progress_bar_russia_desc: "[GetGlobalVariable('great_game_rus_progress').GetValue|1]#!" # todo: NEW TRANSLATION
 je_great_game_control: "Velká hra" # todo: NEW TRANSLATION
 je_great_game_control_reason: "Pokrok směrem k #bold levému#! konci lišty bude v prospěch #v $GBR$#!, zatímco pokrok směrem k #bold pravému#! konci bude v prospěch #v $RUS$#!.\n\nOd počátku devatenáctého století se #bold Velká hra#! stala obecně pojmenováním konfliktů mezi #v $GBR$#! a #v $RUS$#! o vliv nad [GetGeographicRegion('geographic_region_central_asia_old').GetName] a okolím. Obě vlády považovaly komplexní vojenské vítězství proti druhé za nemožné, a tak se #bold Velká hra#! vedla sérií nepřímých střetů o vliv nad zeměmi na linii mezi oběma státy.\n\n#bold Vítězství:#!\n[SCOPE.GetRootScope.GetCountry.GetCustom('great_game_victory_caucasus')][SCOPE.GetRootScope.GetCountry.GetCustom('great_game_victory_kazakhstan')][SCOPE.GetRootScope.GetCountry.GetCustom('great_game_victory_khanates')][SCOPE.GetRootScope.GetCountry.GetCustom('great_game_victory_afghanistan')][SCOPE.GetRootScope.GetCountry.GetCustom('great_game_victory_persia')][SCOPE.GetRootScope.GetCountry.GetCustom('great_game_victory_korea')]\n#bold Postupy:#!\n#variable Russia#! - Vynucení smlouvy z Turkmenčaje\n#variable Britain#! - Úspěšná expedice do Buchary\n[SCOPE.GetRootScope.GetCountry.GetCustom('great_game_advance_chinese_border')][SCOPE.GetRootScope.GetCountry.GetCustom('great_game_advance_consolidated_british_india')][SCOPE.GetRootScope.GetCountry.GetCustom('great_game_advance_manchurian_railway')][SCOPE.GetRootScope.GetCountry.GetCustom('great_game_advance_contained_russian_pacific')][SCOPE.GetRootScope.GetCountry.GetCustom('great_game_advance_trans_siberian_railway')]" # todo: NEW TRANSLATION
