 je_consolidate_afghanistan_torkestan_line_desc: "Vytyčení hranice podél pohoří Torkestan zajistí více jižního Pamíru a tádžickou část Afghánistánu pro nás, za cenu přímé hranice s Kašmírem." # todo: NEW TRANSLATION
