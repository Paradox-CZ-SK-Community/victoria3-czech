 je_consolidate_afghanistan_objective: "Konsolidovat Afghánistán" # todo: NEW TRANSLATION
 je_consolidate_afghanistan_objective_reason: "Nejasné hranice Afghánistánu představují příležitost pro krizi a ničivou válku v Pamíru. Abychom stabilizovali hranici mezi námi a naším protivníkem, musíme spolupracovat na upevnění afghánského státu." # todo: NEW TRANSLATION
 je_consolidate_afghanistan: "Pamirská delimitace" # todo: NEW TRANSLATION
 je_consolidate_afghanistan_reason: "Porézní a nejasné hranice afghánských států slouží jako záminka pro konflikty v oblasti Pamíru. Vyjednávání s [SCOPE.sCountry('rival_gp_scope').GetName] za účelem vymezení mezinárodně uznávaných hranic Afghánistánu výrazně sníží riziko války v Pamíru.\n\nNávrhy [ROOT.GetCountry.GetAdjective]:\n• #v $AFG$#! vzdá se všech nároků mimo své uznané hranice\n[SCOPE.GetRootScope.GetCountry.GetCustom('afghanistan_delineation_northern_proposal')]\n[SCOPE.GetRootScope.GetCountry.GetCustom('afghanistan_delineation_southeastern_proposal')][SCOPE.GetRootScope.GetCountry.GetCustom('afghanistan_delineation_offer_compensation')][SCOPE.GetRootScope.GetCountry.GetCustom('afghanistan_delineation_threaten_reprisals')]\n\nNávrhy [SCOPE.sCountry('rival_gp_scope').GetName]:\n• #v $AFG$#! vzdá se všech nároků mimo své uznané hranice\n[SCOPE.sCountry('rival_gp_scope').GetCustom('afghanistan_delineation_northern_proposal')]\n[SCOPE.sCountry('rival_gp_scope').GetCustom('afghanistan_delineation_southeastern_proposal')][SCOPE.sCountry('rival_gp_scope').GetCustom('afghanistan_delineation_offer_compensation')][SCOPE.sCountry('rival_gp_scope').GetCustom('afghanistan_delineation_threaten_reprisals')]" # todo: NEW TRANSLATION
