 lobby_core.1.b: "Manuálně spustit katalyzátor." # todo: NEW TRANSLATION
 lobby_core.1.c: "Ručně vytvořit loby." # todo: NEW TRANSLATION
 lobby_core.1.d: "Ručně vytvořit loby nadřazeného." # todo: NEW TRANSLATION
