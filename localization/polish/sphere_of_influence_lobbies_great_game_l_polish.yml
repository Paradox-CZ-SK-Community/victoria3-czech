 je_the_eastern_border_treaty_of_aigun_desc: "Území #bold Amur#! je prakticky izolované od zbytku Číny a vhodné k osídlení. Vojenské posílení ve východní Sibiři by mělo přimět čínskou vládu vzdát se území bez konfliktu." # todo: NEW TRANSLATION
