 lobby_events.1.t: "Revoluce zrazena" # todo: NEW TRANSLATION
 lobby_events.1.d_join: "Aby se vyhnuli obviněním z komunismu a zaujali tvrdou zahraniční politiku, vedení [GetIdeology('ideology_social_democrat').GetName] v [SCOPE.gsInterestGroup('relevant_ig').GetCustom('IG_L_TT')] začalo se přibližovat k [SCOPE.sPoliticalLobby('relevant_lobby').GetName]." # todo: NEW TRANSLATION # todo: NAME CASE
 lobby_events.1.d_form: "Aby se vyhnuli obviněním z komunismu a zaujali tvrdou zahraniční politiku, vedení [GetIdeology('ideology_social_democrat').GetName] v [SCOPE.gsInterestGroup('relevant_ig').GetCustom('IG_L_TT')] připravilo půdu pro loby vystupující proti zájmům [SCOPE.sCountry('relevant_country').GetAdjective]." # todo: NEW TRANSLATION # todo: NAME CASE
 lobby_events.1.f: "\"Spojili jsme se, abychom bojovali proti komunismu,\" řekl [SCOPE.gsInterestGroup('relevant_ig').GetLeader.GetSheHe], \"protože jej označili jako nepřítele demokracie. Bez demokracie není svoboda. Násilí, ať ho používá kdokoli, je vždy reakční.\"\n\nOdezva byla chabá, potlesk roztroušený natolik, že šlo identifikovat jednotlivé účastníky. Ale bylo to více, než [SCOPE.gsInterestGroup('relevant_ig').GetLeader.GetSheHe] kdy od tohoto publika dostal." # todo: NEW TRANSLATION
 lobby_events.1.a: "Jejich vlastenectví dává dobrý příklad." # todo: NEW TRANSLATION
 lobby_events.1.b: "Jejich vlastenectví dává dobrý příklad." # todo: NEW TRANSLATION
 lobby_events.1.c: "Měli by se vyhnout těmto zahraničním zapletením." # todo: NEW TRANSLATION
 lobby_events.2.t: "Naše utlačované sourozence" # todo: NEW TRANSLATION
 lobby_events.2.d_join: "Zveřejněná svědectví diskriminace [SCOPE.sReligion('relevant_religion').GetName] v [SCOPE.sCountry('relevant_country').GetName] přiměla [SCOPE.gsInterestGroup('relevant_ig').GetCustom('IG_A_TT')] přidat se k [SCOPE.sPoliticalLobby('relevant_lobby').GetName]." # todo: NEW TRANSLATION # todo: NAME CASE
 lobby_events.2.d_form: "Zveřejněná svědectví diskriminace [SCOPE.sReligion('relevant_religion').GetName] v [SCOPE.sCountry('relevant_country').GetName] přiměla [SCOPE.gsInterestGroup('relevant_ig').GetCustom('IG_A_TT')] začít lobbovat za nepřátelský postoj vůči [SCOPE.sCountry('relevant_country').GetName]." # todo: NEW TRANSLATION # todo: NAME CASE
 lobby_events.2.f: "\"I oni mohou najít odpuštění, ano, ale taková věc vyžaduje pokání, a vláda [SCOPE.sCountry('relevant_country').GetAdjectiveNoFormatting] je definicí neodpuštěné arogance.\"\n\n\"Jak milosrdné.\"\n\n\"A přesto já ukazuji daleko více než jejich [SCOPE.sCountry('relevant_country').GetRuler.GetPrimaryRoleTitle]!\"\n\nByl naštvaný - to bylo jasné přislušnému atašé. A pokud by měl volbu, brzy by zemi srovnal se zemí." # todo: NEW TRANSLATION
 lobby_events.2.a: "Když slova selžou, musíme přinést meč." # todo: NEW TRANSLATION
 lobby_events.2.b: "Když slova selžou, musíme přinést meč." # todo: NEW TRANSLATION
 lobby_events.2.c: "Chtějí způsobit mezinárodní incident kvůli #italic tomuto#!?" # todo: NEW TRANSLATION
 lobby_events.3.t: "Technické talenty" # todo: NEW TRANSLATION
 lobby_events.3.d_join: "Inspirováni zručností [SCOPE.sCountry('relevant_country').GetAdjectiveNoFormatting] [GetPopType('engineers').GetName] a [GetPopType('academics').GetName], technicky založení členové [SCOPE.gsInterestGroup('relevant_ig').GetCustom('IG_G_TT')] se začali přibližovat k [SCOPE.sPoliticalLobby('relevant_lobby').GetName]." # todo: NEW TRANSLATION # todo: NAME CASE
 lobby_events.3.d_form: "Inspirováni zručností [SCOPE.sCountry('relevant_country').GetAdjectiveNoFormatting] [GetPopType('engineers').GetName] a [GetPopType('academics').GetName], technicky založení členové [SCOPE.gsInterestGroup('relevant_ig').GetCustom('IG_G_TT')] začali lobbovat ve prospěch bližších vazeb s [SCOPE.sCountry('relevant_country').GetName]." # todo: NEW TRANSLATION # todo: NAME CASE
 lobby_events.3.f: "\"Podle našich měřítek? S metodami, které používají v továrnách, často ušetří polovinu člověkodiny na výrobu stejného výstupu. Budova, kterou jsem navštívil, měla docela inovativní osvětlení. Představte si, že směny mohou být denně o hodinu delší...\"\n\nJeho vousatý druh už vytahoval papír a rýsoval propojení mezi různými sadami výpočtů. Když byly dvě sumy postaveny vedle sebe, vypustil nízké písknutí." # todo: NEW TRANSLATION
 lobby_events.3.a: "Společně uděláme velké kroky." # todo: NEW TRANSLATION
 lobby_events.3.b: "Společně uděláme velké kroky." # todo: NEW TRANSLATION
 lobby_events.3.c: "Naše výtvory výrazně převyšují ty levné [SCOPE.sCountry('relevant_country').GetAdjectiveNoFormatting] hračky." # todo: NEW TRANSLATION
 lobby_events.4.t: "Už to není stejné" # todo: NEW TRANSLATION
 lobby_events.4.d: "Porážka [SCOPE.sCountry('relevant_country').GetAdjectiveNoFormatting] [SCOPE.gsInterestGroup('relevant_foreign_ig').GetCustom('IG_G_TT')] v revoluci zlomila zájem [SCOPE.gsInterestGroup('relevant_ig').GetCustom('IG_G')] o podporu [SCOPE.sPoliticalLobby('relevant_lobby').GetName]. Přestali prosazovat bližší vazby s [SCOPE.sCountry('relevant_country').GetName]." # todo: NEW TRANSLATION # todo: NAME CASE
 lobby_events.4.f: "Dopisy, které posílali, zůstaly nezodpovězené. Diskrétní návštěva potvrdila jejich nejhorší obavy - budova, kterou kdysi vlastnili, byla zkonfiskována a nyní v ní sídlil apatický advokát, jeho praxe a rozšířená rodina. Ten nový muž byl přítel ministra - ten, který právě bojoval o svou pozici v doslovném smyslu. Okamžité náznaky kulek stále zanechávaly rány na fasádě a dávaly definitivní důkaz, že náhrada nebude poskytnuta." # todo: NEW TRANSLATION
 lobby_events.4.a: "Veškerá jejich práce byla ztracena během okamžiku." # todo: NEW TRANSLATION
 lobby_events.4.b: "Zdá se, že jsou jen první z mnoha." # todo: NEW TRANSLATION
 many_igs_leave_lobby_tt: "[SCOPE.gsInterestGroup('leaving_ig').GetName] opouští [SCOPE.sPoliticalLobby('relevant_lobby').GetName]" # todo: NEW TRANSLATION
 lobby_events.5.t: "Kapitalní zájmy" # todo: NEW TRANSLATION
 lobby_events.5.d_join: "Zájem [SCOPE.gsInterestGroup('relevant_ig').GetCustom('IG_G_TT')] na ziskovém obchodu s [SCOPE.sGoods('relevant_goods').GetCustom('GDS_I_TT')] s [SCOPE.sCountry('relevant_country').GetName] přiměl je přidat se k [SCOPE.sPoliticalLobby('relevant_lobby').GetName]." # todo: NEW TRANSLATION # todo: NAME CASE
 lobby_events.5.d_form: "Zájem [SCOPE.gsInterestGroup('relevant_ig').GetCustom('IG_G_TT')] na ziskovém obchodu s [SCOPE.sGoods('relevant_goods').GetCustom('GDS_I_TT')] s [SCOPE.sCountry('relevant_country').GetName] přiměl je začít lobbovat pro bližší vazby s [SCOPE.sCountry('relevant_country').GetNameNoFormatting]." # todo: NEW TRANSLATION # todo: NAME CASE
 lobby_events.5.f: "\"Zvýšený objem neumožňuje více rizika?\"\n\n\"Právě naopak. Když do kapes vstoupí příval peněz, člověk sklidí mánii. Jeden další groš číšníkovi, dříve šokující poplatek uhrazen s úsměvem. Pokud si člověk nedá pozor, přestane se dívat do svých účetních knih. Platí #italic více#! než dříve - a to je cesta k zhroucení.\"\n\n\"Výborný bod. Opraví to nasazení válečných lodí?\"\n\n\"Lépe doufat. Pokud ne, možná nějaké dary pomohou.\"" # todo: NEW TRANSLATION
 lobby_events.5.a: "Na zdraví naší prosperity." # todo: NEW TRANSLATION
 lobby_events.5.b: "Na zdraví naší prosperity." # todo: NEW TRANSLATION
 lobby_events.5.c: "Náš vztah by měl zůstat přísně transakční." # todo: NEW TRANSLATION
 lobby_events.6.t: "Bývalí přátelé" # todo: NEW TRANSLATION
 lobby_events.6.d: "Dezerenti vedení [SCOPE.gsInterestGroup('relevant_ig').GetCustom('IG_G_TT')] se valí pryč z [SCOPE.sPoliticalLobby('relevant_lobby').GetName], odcizeni komunistickou vládou v [SCOPE.sCountry('relevant_country').GetName]." # todo: NEW TRANSLATION # todo: NAME CASE
 lobby_events.6.f: "\"Během měsíců Komunisté uhasili ducha [SCOPE.sCountry('relevant_country').GetAdjectiveNoFormatting] národa. Vykořenili starý společenský řád a strhli památky kultury. Naši muži v [SCOPE.sCountry('relevant_country').GetCapital.GetCityHubName] sotva unikli živí.\"\n\nAtašé tomu věřil. Slova muže jako by řezala vzduch obrazem rudých vlajek, bajonetů, kouře vystupujícího z komína ambasády.\n\n\"Vidím,\" řekl, tón cvičené uctivosti. \"Srazím výbor hned.\"" # todo: NEW TRANSLATION
 lobby_events.6.a: "To by nemělo překvapit." # todo: NEW TRANSLATION
 lobby_events.6.b: "Můžeme omezit rozsah tohoto odchodu?" # todo: NEW TRANSLATION
 lobby_events.7.t: "Proletářská solidarita" # todo: NEW TRANSLATION
 lobby_events.7.d_join_defect: "Ideologicky [SCOPE.sIdeology('relevant_ideology').GetName] orientovaná [SCOPE.gsInterestGroup('relevant_ig').GetName] se od [SCOPE.sPoliticalLobby('old_lobby').GetName] odvrátila k [SCOPE.sPoliticalLobby('relevant_lobby').GetName] ve jménu mezinárodní solidarity s proletariátem [SCOPE.sCountry('relevant_country').GetName]." # todo: NEW TRANSLATION
 lobby_events.7.d_join: "Ideologicky [SCOPE.sIdeology('relevant_ideology').GetName] orientovaná [SCOPE.gsInterestGroup('relevant_ig').GetName] se přidala k [SCOPE.sPoliticalLobby('relevant_lobby').GetName], cítí mezinárodní solidaritu s proletariátem [SCOPE.sCountry('relevant_country').GetName]." # todo: NEW TRANSLATION
 lobby_events.7.d_defect: "Ideologicky [SCOPE.sIdeology('relevant_ideology').GetName] orientovaná [SCOPE.gsInterestGroup('relevant_ig').GetName] se odvrátila od [SCOPE.sPoliticalLobby('old_lobby').GetName] a připojila se k podpoře jejich [SCOPE.sCountry('relevant_country').GetAdjectiveNoFormatting] spojenců." # todo: NEW TRANSLATION
 lobby_events.7.d_form: "Ideologicky [SCOPE.sIdeology('relevant_ideology').GetName] orientovaná [SCOPE.gsInterestGroup('relevant_ig').GetName] začala lobbovat ve prospěch podpory svých [SCOPE.sCountry('relevant_country').GetAdjectiveNoFormatting] spojenců." # todo: NEW TRANSLATION
 lobby_events.7.f: "\"Komunisté opovrhují, že skrývají své názory a cíle. Otevřeně prohlašují, že svého cíle lze dosáhnout pouze násilným svržení všech stávajících společenských podmínek. Nechť vládnoucí třídy se třesou před komunistickou revolucí. Pracující mají co ztratit kromě řetězů. Mají svět k získání.\n\nPracující všech zemí, spojte se!\"" # todo: NEW TRANSLATION
 lobby_events.7.a: "Solidarita navěky!" # todo: NEW TRANSLATION
 lobby_events.7.b: "Jejich pravé loajality se odkrývají." # todo: NEW TRANSLATION
 lobby_events.7.c: "Ať dělají, co chtějí, neposloucháme je." # todo: NEW TRANSLATION
 lobby_events.8.t: "Sjednocení" # todo: NEW TRANSLATION
 lobby_events.8.d: "[SCOPE.gsInterestGroup('first_party_member').GetName], významní podporovatelé [SCOPE.sParty('relevant_party').GetCustom('PARTY_G_TT')], navrhují zařadit podporu [SCOPE.sPoliticalLobby('relevant_lobby').GetName] do oficiální stranické platformy." # todo: NEW TRANSLATION # todo: NAME CASE
 lobby_events.8.f: "\"Zvážil jsem rizika a jsem ochoten to prosadit. Fakt je ten, že voliči se nikdy nezajímali o nic mimo naše hranice. I kdyby klima silně změnilo postoj vůči [SCOPE.sCountry('relevant_country').GetNameNoFormatting] v nadcházejících měsících, můžeme se stále ucházet s vnitřní politikou bez kompromisů s širšími principy.\"\n\n\"Vidím důvod. Přesto bych se chtěl dozvědět víc před závazkem. Postoj naší země nesmí být veden ideologickými náladami, ale tvrdou potřebou.\"" # todo: NEW TRANSLATION
 lobby_events.8.a: "Strana stojí spolu v tom." # todo: NEW TRANSLATION
 lobby_events.8.b: "A budeme obviněni z cizí manipulace?" # todo: NEW TRANSLATION
 lobby_events.8.c: "To by mohlo prospět předvolební kampani strany." # todo: NEW TRANSLATION
 lobby_events.9.t: "Použití zbraní" # todo: NEW TRANSLATION
 lobby_events.9.d_join: "Imponováni využitím sofistikovaných [SCOPE.GetRootScope.GetCountry.GetCustom('impressive_miltech_text')] armádou [SCOPE.sCountry('relevant_country').GetAdjective], [SCOPE.gsInterestGroup('relevant_ig').GetName] se začali přibližovat k [SCOPE.sPoliticalLobby('relevant_lobby').GetName]." # todo: NEW TRANSLATION
 lobby_events.9.d_form: "Imponováni využitím sofistikovaných #v [SCOPE.GetRootScope.GetCountry.GetCustom('impressive_miltech_text')]#! armádou [SCOPE.sCountry('relevant_country').GetAdjectiveNoFormatting], [SCOPE.gsInterestGroup('relevant_ig').GetName] začali lobbovat pro bližší vazby s [SCOPE.sCountry('relevant_country').GetNameNoFormatting]." # todo: NEW TRANSLATION
 lobby_events.9.f: "Zprávy z [SCOPE.sCountry('relevant_country').GetNameNoFormatting] obíhaly místnost tak často, že hrany papírů změkly. Někteří byli v úžasu, jiní opatrnější. Někteří prostě odmítali věřit napsanému.\n\n\"Věřím,\" řekl důstojník na konci stolu, \"že pokud to dokážou oni, dokážeme to i my. Do té doby bychom měli zajistit, aby ty zbraně nebyly namířeny proti nám.\"" # todo: NEW TRANSLATION
 lobby_events.9.a: "[SCOPE.sCountry('relevant_country').GetAdjectiveNoFormatting] model stojí za následování." # todo: NEW TRANSLATION
 lobby_events.9.b: "[SCOPE.sCountry('relevant_country').GetAdjectiveNoFormatting] model stojí za následování." # todo: NEW TRANSLATION
 lobby_events.9.c: "Neměli by být tolik ohromeni." # todo: NEW TRANSLATION
 impressive_miltech_tanks: "Pohyblivá pancéřová vozidla" # todo: NEW TRANSLATION
 impressive_miltech_breech_loading_artillery: "Zadní nabíjení dělostřelectva" # todo: NEW TRANSLATION
 impressive_miltech_ironclads: "Železné lodě" # todo: NEW TRANSLATION
 impressive_miltech_auto_machine_guns: "Automatické kulomety" # todo: NEW TRANSLATION
 lobby_events.10.t: "Zahraniční inspirace" # todo: NEW TRANSLATION
 lobby_events.10.d: "[SCOPE.gsInterestGroup('relevant_ig').GetName] získala fascinaci [SCOPE.sCountry('relevant_country').GetName], považuje jej za vzor modernizace státu [ROOT.GetCountry.GetAdjective]. Analýzy zákonů a technologií [SCOPE.sCountry('relevant_country').GetAdjectiveNoFormatting] zaplňují jejich publikace." # todo: NEW TRANSLATION
 lobby_events.10.f: "[SCOPE.gsInterestGroup('relevant_ig').GetLeader.GetSheHe|U] vyvinul vizi. Železnice z [ROOT.GetCountry.GetCapital.GetCityHubName] k [ROOT.GetCountry.GetCapital.GetFarmHubName], plánovaná města se širokými, plynově osvícenými bulváry, zdravá a profesionální byrokracie. Západní státy a jejich spojenci to měli, mezi mnoha dalšími věcmi. [ROOT.GetCountry.GetNameNoFormatting] by to také mohl mít - nic mu v tom nebránilo.\n\nAle to nebyla celá pravda a [SCOPE.gsInterestGroup('relevant_ig').GetLeader.GetSheHe] to dobře věděl. Každý importovaný vynález nese s sebou břemeno, riziko stát se provincií [SCOPE.sCountry('relevant_country').GetAdjectiveNoFormatting]. Jak má [SCOPE.gsInterestGroup('relevant_ig').GetLeader.GetSheHe] nalézt rovnováhu?" # todo: NEW TRANSLATION
 lobby_events.10.a: "Můžeme mnoho získat z bližších vztahů se Západem." # todo: NEW TRANSLATION
 lobby_events.10.b: "Můžeme mnoho získat z bližších vztahů se Západem." # todo: NEW TRANSLATION
 lobby_events.10.c: "Jejich posedlost ohrožuje naši suverenitu." # todo: NEW TRANSLATION
 lobby_events.11.t: "Koncert přerušen" # todo: NEW TRANSLATION
 lobby_events.11.d_leave: "Ohrané agresivní narušení Koncertu evropských mocností [SCOPE.sCountry('relevant_country').GetName] pobouřilo dříve pro-[SCOPE.sCountry('relevant_country').GetAdjectiveNoFormatting] [SCOPE.gsInterestGroup('relevant_ig').GetName] a opustili [SCOPE.sPoliticalLobby('relevant_lobby').GetName]." # todo: NEW TRANSLATION
 lobby_events.11.d_join: "Ohrané agresivní narušení Koncertu evropských mocností [SCOPE.sCountry('relevant_country').GetName] pobouřilo [SCOPE.gsInterestGroup('relevant_ig').GetCustom('IG_A_TT')] a přimělo je přidat se k [SCOPE.sPoliticalLobby('relevant_lobby').GetName]." # todo: NEW TRANSLATION # todo: NAME CASE
 lobby_events.11.d_form: "Vypuknutí války v Evropě, vyvolané agresí [SCOPE.sCountry('relevant_country').GetName], přimělo [SCOPE.gsInterestGroup('relevant_ig').GetCustom('IG_A_TT')] začít lobbovat proti zájmům [SCOPE.sCountry('relevant_country').GetAdjectiveNoFormatting]." # todo: NEW TRANSLATION # todo: NAME CASE
 lobby_events.11.f: "\"Ti zatracení blázni! Měl jsem tam investice! Myslí si jejich [SCOPE.sCountry('relevant_country').GetRuler.GetPrimaryRoleTitle], že je Napoleon? Kdo bude další, aby toho využil?\"\n\n\"Dánové, tipuji.\"\n\n\"Ano, ano, Dánové... asi tak. Každopádně, víte, co dělat.\"\n\nOdešel s bouchnutými dveřmi a mračivým výrazem. Sekretář zůstal a už připravil obálku adresovanou [SCOPE.sCountry('relevant_country').GetCapital.GetCityHubName]. S trochou štěstí dorazí během měsíce a něco z toho bude možné zachránit." # todo: NEW TRANSLATION
 lobby_events.11.a: "[SCOPE.sCountry('relevant_country').GetNameNoFormatting] měl vždy možnost zvolit jinak." # todo: NEW TRANSLATION
 lobby_events.11.b: "[SCOPE.sCountry('relevant_country').GetNameNoFormatting] měl vždy možnost zvolit jinak." # todo: NEW TRANSLATION
 lobby_events.11.c: "Bude potřeba mnohem víc, aby to odčinili." # todo: NEW TRANSLATION
 lobby_events.11.e: "Jak rychle couvají." # todo: NEW TRANSLATION
 has_war_with_cover_tt: "Je ve válce s touto zemí" # todo: NEW TRANSLATION
 is_valid_lobby_target_tt: "Je platným cílem [concept_political_lobby]" # todo: NEW TRANSLATION
 lobby_events.12.t: "Umělecká inspirace" # todo: NEW TRANSLATION
 lobby_events.12.d_join: "Okouzleni nádhernou [SCOPE.GetRootScope.GetCountry.GetCustom('impressive_cultech_text')] produkcí [SCOPE.sCountry('relevant_country').GetAdjective] umělců, [SCOPE.gsInterestGroup('relevant_ig').GetName] se přidali k [SCOPE.sPoliticalLobby('relevant_lobby').GetName]." # todo: NEW TRANSLATION
 lobby_events.12.d_form: "Okouzleni krásnou [SCOPE.GetRootScope.GetCountry.GetCustom('impressive_cultech_text')] produkcí [SCOPE.sCountry('relevant_country').GetAdjectiveNoFormatting] umělců, [SCOPE.gsInterestGroup('relevant_ig').GetName] začali lobbovat pro bližší vztahy s [SCOPE.sCountry('relevant_country').GetName]." # todo: NEW TRANSLATION
 lobby_events.12.f: "[SCOPE.sCountry('relevant_country').GetAdjectiveNoFormatting] impresionismus. Slova do sebe zapadala jako francouzské víno nebo čínské hedvábí, nabývajíc význam větší než součet částí. Mohl by strávit zbytek života v této galerii, dovézt dost děl na pokrytí každé stěny svého domu a přesto zůstat stejně ohromen jako při prvním pohledu.\n\nKaždý obraz byl oknem do kultury, které by mohl strávit život pokusem porozumět, každý tah štětcem naplněný vitalitou z cizího semene. Kolik o [SCOPE.sCountry('relevant_country').GetNameNoFormatting] by mohl pochopit skrze tato díla, kdyby měl čas a schopnosti?" # todo: NEW TRANSLATION
 lobby_events.12.a: "Co za kulturu!" # todo: NEW TRANSLATION
 lobby_events.12.b: "Co za kulturu!" # todo: NEW TRANSLATION
 lobby_events.12.c: "Co za kulturu?" # todo: NEW TRANSLATION
 impressive_cultech_romanticism: "romantické umění" # todo: NEW TRANSLATION
 impressive_cultech_realism: "realistické umění" # todo: NEW TRANSLATION
 impressive_cultech_camera: "fotografie" # todo: NEW TRANSLATION
 impressive_cultech_film: "filmy" # todo: NEW TRANSLATION
 lobby_events.13.t: "Nestálé davy" # todo: NEW TRANSLATION
 lobby_events.13.d: "Populistická základna [SCOPE.gsInterestGroup('relevant_ig').GetCustom('IG_G_TT')] se obrátila proti podpoře zahraničních zapojení. Tlak zevnitř přiměl skupinu vzdálit se od [SCOPE.sPoliticalLobby('relevant_lobby').GetName]." # todo: NEW TRANSLATION # todo: NAME CASE
 lobby_events.13.f: "#bold [ROOT.GetCountry.GetAdjectiveNoFormatting] na prvním místě#!\n\nLidé říkají - NE zahraničním zapojením a NE zahraničním smlouvám!\n\n#italic PROSPERITA doma, nebo CHAOS v zahraničí? ŽÁDNÁ ZAHRANIČNÍ MOC by úspěšně neudržela útok na opevněný [ROOT.GetCountry.GetNameNoFormatting]!#!" # todo: NEW TRANSLATION
 lobby_events.13.a: "Bylo chybou spoléhat na ně." # todo: NEW TRANSLATION
 lobby_events.13.b: "Musí se držet dál od těchto populistických přílivů." # todo: NEW TRANSLATION
 lobby_events.14.t: "Kupujte, nebo jinak" # todo: NEW TRANSLATION
 lobby_events.14.d: "Skupina zastupující ty z [SCOPE.gsInterestGroup('relevant_ig').GetCustom('IG_G_TT')], kteří mají zájem na obchodu [SCOPE.sGoods('relevant_goods').GetName], začala tlačit vládu k akci proti [SCOPE.sCountry('relevant_country').GetName], cituje jejich nepřátelské obchodní praktiky." # todo: NEW TRANSLATION # todo: NAME CASE
 lobby_events.14.f: "Všichni byli celý den v kanceláři ministra zahraničí. Muži bohatí a vlivní, známí ministerstvu, opakující stejné stížnosti: \"[SCOPE.sCountry('relevant_country').GetAdjectiveNoFormatting] obchodní válka\", \"omezení volného pohybu zboží\" a \"zabavení nerealizovaných zisků\".\n\nJen co se chystal zamknout dveře na konci dne, zazvonil zvonek. Energie z něj vyprchala, téměř spadl na koberec. S grimassou udělal další krok a otevřel dveře.\n\n\"Ano pane. Pokud byste si sedl...\"" # todo: NEW TRANSLATION
 lobby_events.14.a: "Je to pochopitelné." # todo: NEW TRANSLATION
 lobby_events.14.b: "Nebudeme měnit postoj na povel." # todo: NEW TRANSLATION
 lobby_events.15.t: "Dobré, ne cizí" # todo: NEW TRANSLATION
 lobby_events.15.d_join: "Příliv zahraničních investic od [SCOPE.sCountry('relevant_country').GetName] vyvolal obavy nacionalistických skupin. [SCOPE.gsInterestGroup('relevant_ig').GetName] se obávali zahraniční subverze a přidali se k [SCOPE.sPoliticalLobby('relevant_lobby').GetName]." # todo: NEW TRANSLATION
 lobby_events.15.d_form: "Příliv zahraničních investic od [SCOPE.sCountry('relevant_country').GetName] vyvolal obavy nacionalistických skupin. [SCOPE.gsInterestGroup('relevant_ig').GetName] začali lobbovat proti zájmům [SCOPE.sCountry('relevant_country').GetAdjectiveNoFormatting]." # todo: NEW TRANSLATION
 lobby_events.15.f: "\"Staví všechny své továrny z lepenky a olověných čipů, a jejich ocel je vhodná jen na břitvy. A i tak, pokud je použijete, můžete mít modřiny!\"\n\nKruh mužů u stolu se rozesmál. Muž s červenou mašlí dal vědět, a pokračoval. \"Když jim dovolíme kupovat naše pozemky, do roka bude [SCOPE.sCountry('relevant_country').GetAdjectiveNoFormatting] špión v každém dívčím pokoji. Znám je dobře. Strávil jsem měsíc v [SCOPE.sCountry('relevant_country').GetCapital.GetCityHubName], víte...\"" # todo: NEW TRANSLATION
 lobby_events.15.a: "Co s tím uděláme?" # todo: NEW TRANSLATION
 lobby_events.15.b: "Sbírka paranoidních dětí." # todo: NEW TRANSLATION
 lobby_events.16.t: "Těžké milovat" # todo: NEW TRANSLATION
 lobby_events.16.d: "Vypuknutí ozbrojených střetů mezi [ROOT.GetCountry.GetName] a [SCOPE.sCountry('relevant_country').GetName] mělo katastrofální dopad na [SCOPE.sPoliticalLobby('relevant_lobby').GetName]. Jeho kdysi věrní podporovatelé začali odcházet." # todo: NEW TRANSLATION
 lobby_events.16.f: "První střely padly, když spali, a probudili se v odlišném světě. Do týdne se veškerá solidarita mezi stranami rozplynula a na ulici získali nepřátelské pohledy, kdykoli přišli do své kanceláře. Po třetím přísném policistovi, který přišel zajistit, že jsou v souladu s požárními předpisy, i ti nejoddanější praskli. Všechno bylo vyklizeno a kufry byly naplněny, sedadla ponechána nakřivo." # todo: NEW TRANSLATION
 lobby_events.16.a: "Měli by prchnout, dokud si zachovají reputaci." # todo: NEW TRANSLATION
 lobby_events.16.b: "Je nejlepší připravit se na den, kdy tato válka skončí." # todo: NEW TRANSLATION
 lobby_events.17.t: "Kam dál" # todo: NEW TRANSLATION
 lobby_events.17.d: "S měnícím se postojem [SCOPE.gsInterestGroup('relevant_ig').GetCustom('IG_G_TT')] vůči [SCOPE.sCountry('relevant_country').GetName] začalo vedení zvažovat přehodnocení podpory pro [SCOPE.sPoliticalLobby('relevant_lobby').GetName]." # todo: NEW TRANSLATION # todo: NAME CASE
 lobby_events.17.f: "Bylo obtížnější získat schůzky na ministerstvu zahraničí. Počáteční zájem vyprchal a aktivity loby se staly šumem na pozadí [ROOT.GetCountry.GetCapital.GetCityHubName]. [SCOPE.gsInterestGroup('relevant_ig').GetNameNoFormatting] byli první, kdo o zájem přišli, jejich zástupci zklamaní nedostatkem novinek a pak už ani nechtěli číst noviny.\n\n\"Proč bychom se měli starat o dění v [SCOPE.sCountry('relevant_country').GetCapital.GetCityHubName]?\" tázali se mladší členové. Staří nevěděli, jak odpovědět." # todo: NEW TRANSLATION
 lobby_events.17.a: "Je čas na změnu kurzu." # todo: NEW TRANSLATION
 lobby_events.17.b: "Proč měnit něco, co funguje?" # todo: NEW TRANSLATION
 remains_in_lobby_tt: "[SCOPE.gsInterestGroup('relevant_ig').GetName] zůstane v [SCOPE.sPoliticalLobby('relevant_lobby').GetName]" # todo: NEW TRANSLATION
 lobby_events.18.t: "Právé hranice" # todo: NEW TRANSLATION
 lobby_events.18.d_join: "Ferventně nacionalistický [SCOPE.gsInterestGroup('relevant_ig').GetName] obrátil rétoriku směrem k [SCOPE.sCountry('relevant_country').GetName] a její provincii [SCOPE.sState('revanchist_state').GetName]. Přidali se k [SCOPE.sPoliticalLobby('relevant_lobby').GetName] v naději uskutečnit územní ambice." # todo: NEW TRANSLATION
 lobby_events.18.d_form: "Ferventně nacionalistický [SCOPE.gsInterestGroup('relevant_ig').GetName] obrátil rétoriku směrem k [SCOPE.sCountry('relevant_country').GetName] a její provincii [SCOPE.sState('revanchist_state').GetName]. Začali lobbovat za nepřátelské kroky vůči [SCOPE.sCountry('relevant_country').GetNameNoFormatting] k dosažení územních ambicí." # todo: NEW TRANSLATION
 lobby_events.18.f: "\"Je nezpochybnitelné, že [SCOPE.sState('revanchist_state').GetNameNoFormatting] má zřetelně [ROOT.GetCountry.GetAdjectiveNoFormatting] charakter. Ve skutečnosti tato oblast patřila několika předchůdcům států, jejichž dědictví dnes ztělesňujeme. Zaprvé...\"\n\nÚředník seděl zdvořile, když muž u předního pódia představil svůj výklad. Když vytáhl starodávný mince, která prý byla nalezena pod [SCOPE.sState('revanchist_state').GetCityHubName], publikum vybuchlo v jásot. Tleskal přesto mechanicky. Jeho mysl už byla pryč v době mečů a plachetnic. Vzít [SCOPE.sState('revanchist_state').GetNameNoFormatting] zpět byl záležitostí současnosti, dělostřelectva a granátů. Vše ostatní by se dalo domluvit později." # todo: NEW TRANSLATION
 lobby_events.18.a: "[SCOPE.sState('revanchist_state').GetNameNoFormatting] je právoplatně [ROOT.GetCountry.GetAdjectiveNoFormatting]!" # todo: NEW TRANSLATION
 lobby_events.18.b: "Tvrdě odmítáme toto šermování." # todo: NEW TRANSLATION
 lobby_events.19.t: "Mraky na obzoru" # todo: NEW TRANSLATION
 lobby_events.19.d_join_country: "Podřízení [SCOPE.sCountry('relevant_subject').GetName] [SCOPE.sCountry('relevant_country').GetName] vyvolalo obavy v [SCOPE.gsInterestGroup('relevant_ig').GetCustom('IG_L_TT')], že i náš stát se může stát obětí. Jejich obavy je přiměly přidat se k [SCOPE.sPoliticalLobby('relevant_lobby').GetName]." # todo: NEW TRANSLATION # todo: NAME CASE
 lobby_events.19.d_form_country: "Podřízení [SCOPE.sCountry('relevant_subject').GetName] [SCOPE.sCountry('relevant_country').GetName] vyvolalo obavy v [SCOPE.gsInterestGroup('relevant_ig').GetCustom('IG_L_TT')], že i náš stát se může stát obětí. Jejich obavy je přiměly začít lobbovat proti zájmům [SCOPE.sCountry('relevant_country').GetAdjectiveNoFormatting]." # todo: NEW TRANSLATION # todo: NAME CASE
 lobby_events.19.d_join_state: "Přítomnost nedaleké [SCOPE.sCountry('relevant_country').GetAdjective] kolonie [SCOPE.sState('relevant_colonial_state').GetName] vyvolala obavy v [SCOPE.gsInterestGroup('relevant_ig').GetCustom('IG_L_TT')], že i náš stát může být podobně pohlcen. To je přimělo přidat se k [SCOPE.sPoliticalLobby('relevant_lobby').GetName]." # todo: NEW TRANSLATION # todo: NAME CASE
 lobby_events.19.d_form_state: "Přítomnost nedaleké [SCOPE.sCountry('relevant_country').GetAdjective] kolonie [SCOPE.sState('relevant_colonial_state').GetName] vyvolala obavy v [SCOPE.gsInterestGroup('relevant_ig').GetCustom('IG_L_TT')], že i náš stát může být podobně pohlcen. To je přimělo začít lobbovat proti zájmům [SCOPE.sCountry('relevant_country').GetAdjectiveNoFormatting]." # todo: NEW TRANSLATION # todo: NAME CASE
 lobby_events.19.f: "\"Je vše dobře naplněno strachem. Není to hanba. Jejich dosah se rozprostírá po celém světě jako mořský příšera a pojídá, co je zranitelné. Dosahují bez selhání a hrozí nám skoro ze všech stran. Ještě jsme nespadli, a to má svůj důvod.\"\n\nByla to křehká naděje. [SCOPE.gsInterestGroup('relevant_ig').GetLeader.GetLastNameNoFormatting] mohl vidět jen jedinou trávovou stéblo po lesním požáru.\n\n\"Musíme se soustředit na tyto důvody a použít je jako zbraň. Potřebujeme čas a musíte nám ho koupit.\"" # todo: NEW TRANSLATION
 lobby_events.19.a: "Měli pravdu ve své obavě z hrozby [SCOPE.sCountry('relevant_country').GetAdjectiveNoFormatting]." # todo: NEW TRANSLATION
 lobby_events.19.b: "Nepřátelství by mohlo vyprovokovat to, čeho se bojí." # todo: NEW TRANSLATION
 lobby_events.20.t: "Rozprostření" # todo: NEW TRANSLATION
 lobby_events.20.d: "Omezené politické zdroje [SCOPE.gsInterestGroup('relevant_ig').GetCustom('IG_G_TT')] přiměly vedení zpochybnit členství jak v [SCOPE.sPoliticalLobby('relevant_lobby_1').GetName], tak v [SCOPE.sPoliticalLobby('relevant_lobby_2').GetName]." # todo: NEW TRANSLATION # todo: NAME CASE
 lobby_events.20.f: "\"A na kancelářské potřeby průměrně...\" Auditor otočil stránku na příslušný záznam a proběhl sloupec očima. \"Tři sta korun měsíčně.\"\n\nPro muže přes stůl začal svět točit. \"Jste si jist?\"\n\n\"A tisíc dvě stě za služební cesty.\"\n\n\"...prosím?\" požádal. \"Mohu mít kopii manifestu? Potřebuji se setkat s kolegy.\"" # todo: NEW TRANSLATION
 lobby_events.20.a: "Není důvod zůstávat v [SCOPE.sPoliticalLobby('relevant_lobby_1').GetNameNoFormatting]." # todo: NEW TRANSLATION
 lobby_events.20.b: "Členství v [SCOPE.sPoliticalLobby('relevant_lobby_2').GetNameNoFormatting] již není užitečné." # todo: NEW TRANSLATION
 lobby_events.20.c: "Opustit kterékoliv by bylo nerozumné." # todo: NEW TRANSLATION
