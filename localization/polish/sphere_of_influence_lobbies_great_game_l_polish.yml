 je_disrupt_russian_caucasus: "Narušit ruský Kavkaz" # todo: NEW TRANSLATION
 je_disrupt_russian_caucasus_reason: "Zrodný stát Čečens, ležící na Černém moři v kavkazském regionu, představuje příležitost zbrzdit ruskou konsolidaci v regionu. Prodloužit uznání čečénského státu a zajistit jeho pokračující existenci musí být naší prioritou." # todo: NEW TRANSLATION
 circassia_dead_tt: "#v $CIR$#! byl poražen" # todo: NEW TRANSLATION
 je_secure_persian_border: "Zajistit perskou hranici" # todo: NEW TRANSLATION
 je_secure_persian_border_reason: "Přítomnost povstaleckých států na Severním Kavkaze ohrožuje naši kontrolu nad regionem a tím i naši schopnost prosazovat moc na Blízkém východě. Dlouhotrvající kavkazská válka musí skončit ve prospěch našeho národa." # todo: NEW TRANSLATION
 je_codify_chinese_border: "Kodifikovat čínskou hranici" # todo: NEW TRANSLATION
 je_codify_chinese_border_reason: "Naše hranice s Čínou je dlouhá a neformalizovaná. Snažit se vytyčit formální hranici mezi naším státem a Čínou by mohlo umožnit štědré převody území do naší kontroly a minimalizovat riziko budoucích hraničních konfliktů." # todo: NEW TRANSLATION
 china_doesnt_have_claim_tt: "Žádný zahraniční [concept_country] nemá [concept_claim] na [SCOPE.sStateRegion('amur_scope').GetName], [SCOPE.sStateRegion('primorye_scope').GetName], [SCOPE.sStateRegion('jetisy_scope').GetName], nebo [SCOPE.sStateRegion('altai_scope').GetName]" # todo: NEW TRANSLATION
 je_consolidate_central_asia: "Konsolidovat državy ve Střední Asii" # todo: NEW TRANSLATION
 je_consolidate_central_asia_reason: "Region Střední Asie byl dlouho mimo naši kontrolu, spravován roztroušenými chanáty a emiraty. Abychom zajistili přístup k Indii, musíme zajistit podřízenost středníchasijských států, ať už jako [Concept('concept_subject', '$concept_subjects$')|l] nebo přímou dobytím." # todo: NEW TRANSLATION
 owned_by_this_country_or_subjects_tt: "Vlastněno [ROOT.GetCountry.GetName] nebo jejími [Concept('concept_subject', '$concept_subjects$')|l]" # todo: NEW TRANSLATION
 completely_owned_by_this_country_or_subjects_tt: "Úplně vlastněno [ROOT.GetCountry.GetName] nebo jejími [Concept('concept_subject', '$concept_subjects$')|l]" # todo: NEW TRANSLATION
 je_chinese_concessions: "Získat mandžuské koncese" # todo: NEW TRANSLATION
 je_chinese_concessions_reason: "Region Mandžuska obsahuje několik oblastí, které mohou sloužit jako hodnotné přístavy s teplou vodou. Získání smluvních koncesí a výstavba železnic v regionu výrazně posílí naši projekci moci v Pacifiku." # todo: NEW TRANSLATION
 owned_by_russia_or_chinese_country: "Stát je vlastněn touto zemí, nebo jinou zemí s $manchu$ nebo $han$ [concept_primary_cultures]" # todo: NEW TRANSLATION
 je_pacify_kazakh_steppes: "Pacifikovat kazašskou step" # todo: NEW TRANSLATION
 je_pacify_kazakh_steppes_reason: "Ačkoliv jsme formálně rozšířili naši autoritu nad různými kazašskými chanáty v raném osmnáctém století, efektivní správa kazašské stepi se ukázala být obtížná. Naše reorganizace regionu v roce 1828 oficiálně nahradila každého bývalého chána ruským jmenovaným [Concept('concept_ruler','$RULER_TITLE_SENIOR_SULTAN$')], ale problém banditství a široké nespokojenosti s jejich vládou přetrvává. Abychom to vyřešili, musí být tři żúzy úspěšně uklidněny a přivedeny pod přímou ruskou kontrolu." # todo: NEW TRANSLATION
 je_acquire_korean_protectorate: "Zajistit korejský protektorát" # todo: NEW TRANSLATION
 je_acquire_korean_protectorate_reason: "Korejský poloostrov představuje příležitost pro další rozšíření našeho vlivu do Východní Asie a Tichého oceánu. Správně rozvinuté Korea pod naším dohledem by mohla soupeřit s Japonskem a posílit naše dalekovýchodní državy proti cizí invazi." # todo: NEW TRANSLATION
 je_counter_russian_pacific_influence: "Zadržet ruský pacifický vliv" # todo: NEW TRANSLATION
 je_counter_russian_pacific_influence_reason: "Ruské získání kvalitních přístavů na jejich pacifickém pobřeží představuje nepřijatelné riziko ztráty námořní nadvlády v severním Pacifiku. Abychom omezili jejich vliv v regionu, musíme hledat spolehlivého spojence mezi nezávislými mocnostmi regionu." # todo: NEW TRANSLATION
 capital_in_various_east_asian_regions_tt: "[concept_capital_state] je v #bold Japonsku#!, #bold Mandžusku#!, #bold Severní Číně#!, #bold Jižní Číně#! nebo #bold Indonésii#! [concept_strategic_region]" # todo: NEW TRANSLATION
 je_consolidate_british_india: "Rozšířit Britskou Indii" # todo: NEW TRANSLATION
 je_consolidate_british_india_reason: "Existence nezávislých států na okrajích [SCOPE.sCountry('india_scope').GetName] představuje příležitost rozšířit a obohatit naše kolonie v regionu a také odstranit možné cesty, jimiž by naši oponenti mohli ohrožovat vysoce ziskové země Indie." # todo: NEW TRANSLATION
 raj_expanded_westward_tt: "Všechny [Concept('concept_country', '$concept_countries$')|l] v [GetGeographicRegion('geographic_region_india').GetName] jsou [Concept('concept_subject', '$concept_subjects$')|l] [SCOPE.sCountry('britain_scope').GetName] nebo jejích subjektů" # todo: NEW TRANSLATION
 raj_expanded_eastwards_tt: "Všechny [Concept('concept_state', '$concept_states$')|l] v [GetGeographicRegion('geographic_region_burma').GetName] jsou kontrolovány [SCOPE.sCountry('britain_scope').GetName] nebo jejími [Concept('concept_subject', '$concept_subjects$')|l]" # todo: NEW TRANSLATION
 je_pamir_expedition_objective: "Utkat se o ruské Pamíry" # todo: NEW TRANSLATION
 je_pamir_expedition_objective_reason: "Nedávné ruské rozšíření do pohoří Pamir představuje nesnesitelnou hrozbu našim zájmům v Indii. Vytvoření nárazníkového státu v Tádžikistánu by Rusko ponížilo a poskytlo našim zájmům na jihu Pamíru trochu prostoru k nadechnutí, za cenu vysokého rizika #bold přímé války#! mezi #v $RUS$#! a #v $GBR$#!.\n\nTuto možnost je třeba zkoumat opatrně." # todo: NEW TRANSLATION
 pamir_expedition_dismissed_tt: "Tuto možnost #bold zamítneme#!" # todo: NEW TRANSLATION
 je_pamir_expedition_dismiss_button: "Odmítnout návrh" # todo: NEW TRANSLATION
 je_pamir_expedition_dismiss_button_desc: "Tento návrh je téměř jistě vedením k zničující plnohodnotné válce proti Rusku. Je nejlepší, když se nikdy znovu nedostane na světlo." # todo: NEW TRANSLATION
 does_not_own_tajikistan_tt: "#v $RUS$#! nevlastní stát v #bold Tádžikistánu#! [concept_state_region]" # todo: NEW TRANSLATION
 does_not_own_tajikistan_subject_tt: "Nevlastní stát v #bold Tádžikistánu#! [concept_state_region]" # todo: NEW TRANSLATION
 britain_owns_tajikistan_tt: "#v $GBR$#! má stát v #bold Tádžikistánu#! [concept_state_region]" # todo: NEW TRANSLATION
