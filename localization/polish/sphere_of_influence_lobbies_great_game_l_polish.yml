 movement_events.1.t: "O politice vlády" # todo: NEW TRANSLATION
 movement_events.1.d1: "[SCOPE.sCharacter('relevant_agitator').GetFullName], jménem [SCOPE.sPoliticalMovement('relevant_movement').GetName], vydal leták ostře kritizující vládní politiku. Leták [SCOPE.sCharacter('relevant_agitator').GetHerHis|U] se stal populárním mezi reformními kruhy." # todo: NEW TRANSLATION
 movement_events.1.d2: "Spojenci [SCOPE.gsInterestGroup('relevant_ig').GetCustom('IG_G_TT')] v [SCOPE.sPoliticalMovement('relevant_movement').GetName] vydali leták ostře kritizující vládní politiku. Leták se stal populárním mezi reformními kruhy." # todo: NEW TRANSLATION # todo: NAME CASE
 movement_events.1.f: "#bold O politice [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]#!\n\nVelký projev přednesený před váženou [ROOT.GetCountry.GetCapital.GetCityHubName] Společností pro reformu v polovině října.\n\nCHYBA V SLOŽENÍ - Po přečtení první stránky projevu přejděte na stranu 5 a pak na strany 4 a 6." # todo: NEW TRANSLATION
 movement_events.1.a: "Musíme respektovat zásadu svobodného vyjadřování." # todo: NEW TRANSLATION
 movement_events.1.b: "Zabavte tento leták, kdekoliv se objeví." # todo: NEW TRANSLATION
 movement_events.1.c: "Zahájit šetření k identifikaci autorů." # todo: NEW TRANSLATION
 movement_events.2.t: "Reformní společnost [SCOPE.sCountry('relevant_country').GetAdjectiveNoFormatting]" # todo: NEW TRANSLATION
 movement_events.2.d1: "[SCOPE.sCharacter('relevant_agitator').GetFullName] pomohl založit národní organizaci věnovanou sjednocení [SCOPE.sPoliticalMovement('relevant_movement').GetName] pod národním vedením." # todo: NEW TRANSLATION
 movement_events.2.d2: "Agentky [SCOPE.gsInterestGroup('relevant_ig').GetCustom('IG_G_TT')] založili národní organizaci věnovanou sjednocení [SCOPE.sPoliticalMovement('relevant_movement').GetName] pod národním vedením." # todo: NEW TRANSLATION # todo: NAME CASE
 movement_events.2.f: "\"Stojí za zmínku, pokud uspějeme, co pak budeme dělat? Tato struktura, kterou budujeme, může přetrvat generace. Nechat ji zaniknout by byla tragédie.\"\n\n\"Nelze spoléhat na to, že všichni, kteří se přidají, budou nést pochodeň dál. Náš tábor obsahuje mnoho lidí, každý s vlastním důvodem proč naslouchat. Nesmíme jim naznačit, že po nich požadujeme poslušnost v jiných záležitostech.\"" # todo: NEW TRANSLATION
 movement_events.2.a: "Jsou v nejhorším případě neškodní." # todo: NEW TRANSLATION
 movement_events.2.b: "Pošlete jim tvrdé připomenutí našeho nesouhlasu." # todo: NEW TRANSLATION
 movement_events.2.c: "[SCOPE.sCharacter('relevant_agitator').GetFullName] je [SCOPE.sCharacter('relevant_agitator').GetWomanMan] hodný sledování." # todo: NEW TRANSLATION
 movement_events.3.t: "[SCOPE.sState('relevant_state').GetNameNoFormatting] politická unie" # todo: NEW TRANSLATION
 movement_events.3.d: "Organizátoři napojení na [SCOPE.sPoliticalMovement('relevant_movement').GetName] založili organizaci věnovanou podpoře účasti obyvatel na politice v regionu [SCOPE.sState('relevant_state').GetNameNoFormatting]." # todo: NEW TRANSLATION
 movement_events.3.f: "\"Přímou příčinou našich potíží,\" prohlásil řečník, \"je koncentrace moci v třídě, která je náchylná k lenivosti a spiknutí. Je naší povinností tedy sesbírat úsilí pracujících vrstev proti jejich manipulacím a přivést je k velkému morálnímu střetu - souboj politické pravdy a práva proti politickému rozvratu a nespravedlnosti.\"\n\nByl to dobrý sentiment, pomyslel si jeden posluchač, pokud byl náchylný k milosrdenství. Pokud nebyl... děsil se, jak špatně by šlo takové spiknutí interpretovat." # todo: NEW TRANSLATION
 movement_events.3.a: "Lidé začali dát hlas." # todo: NEW TRANSLATION
 movement_events.3.b: "Uzavřete to, než to vyroste mimo kontrolu." # todo: NEW TRANSLATION
 movement_events.4.t: "Petenti oslovili vládu" # todo: NEW TRANSLATION
 movement_events.4.d: "Několik prominentních podporovatelů [SCOPE.sPoliticalMovement('relevant_movement').GetName] se obrátilo na vládu s ambiciózní peticí k prosazení jejich agendy. Petice byla propagována jako nutný výchozí bod mezi členy hnutí." # todo: NEW TRANSLATION
 movement_events.4.f: "Na papíře bylo alespoň sto podpisů, některé nezřetelně zdobené, jiné generická jména, která by úředník musel zázrakem dedukce zúžit. To je výhoda petice - po určitém počtu už je nemožné potrestat každý podpis.\n\nKdyž by jeden člověk nesouhlasil, bylo by snadné ho odhalit, ale když jich je tisíc, stává se to mnohem obtížnějším." # todo: NEW TRANSLATION
 movement_events.4.a: "Umožnit debatu o vznesených otázkách." # todo: NEW TRANSLATION
 movement_events.4.b: "Formální postupy vlády musí být dodrženy." # todo: NEW TRANSLATION
 movement_events.4.c: "Zahajte vyšetřování tohoto pohodlného seznamu jmen." # todo: NEW TRANSLATION
 movement_events.5.t: "Občanská konvence v [SCOPE.sState('relevant_state').GetCityHubName]" # todo: NEW TRANSLATION
 movement_events.5.d: "[SCOPE.sPoliticalMovement('relevant_movement').GetName] se sešla v [SCOPE.sState('relevant_state').GetCityHubName] aby získala podporu a veřejně probrala specifika [SCOPE.sLawType('relevant_law').GetName]. Akce přilákala značnou pozornost místních obyvatel." # todo: NEW TRANSLATION
 movement_events.5.f: "\"Rád vás znovu vidím. Měl jste dobrou cestu?\"\n\n\"Měl. Cesty jsou v této části roku hrozné. Málem jsem dorazil pozdě... pochvala řidiči.\"\n\n\"Zaslouží si zvýšení?\"\n\n\"Kéž by! Pokud mi zbyde něco v kapse, snad.\"" # todo: NEW TRANSLATION
 movement_events.5.a: "Jak živá debata!" # todo: NEW TRANSLATION
 movement_events.5.b: "Okamžitě to zakázat." # todo: NEW TRANSLATION
 movement_events.6.t: "Protesty napříč [SCOPE.sState('relevant_state').GetNameNoFormatting]" # todo: NEW TRANSLATION
 movement_events.6.d: "[SCOPE.sPoliticalMovement('relevant_movement').GetName] zorganizovalo masové protesty napříč regionem [SCOPE.sState('relevant_state').GetName]. I když protesty zatím zůstaly pokojné, místní úřady mají obavy z možné násilnosti." # todo: NEW TRANSLATION
 movement_events.6.f: "Bylo to více lidí, než kdy viděl. [SCOPE.sState('relevant_state').GetFarmHubName], kdysi tiché a známé téměř venkovským charakterem, ožilo křičícími hlasy a vlajícími vlajkami. Přemýšlel, jestli někdo z jeho sousedů je v davu. Vždycky si myslel, že s nimi nemá nic společného. Možná se mýlil." # todo: NEW TRANSLATION
 movement_events.6.a: "Nechte je vyjádřit své obavy." # todo: NEW TRANSLATION
 movement_events.6.b: "Úřady musí zasáhnout a tyto projevy zastavit." # todo: NEW TRANSLATION
 movement_events.7.t: "Zdi a lepidlo" # todo: NEW TRANSLATION
 movement_events.7.d1: "[SCOPE.sCharacter('relevant_agitator').GetFullName] zorganizoval celonárodní kampaň vyvěšování plakátů za [SCOPE.sPoliticalMovement('relevant_movement').GetName]. V některých městech nebyla zeď neznačena pro [SCOPE.sLawType('relevant_law').GetName]." # todo: NEW TRANSLATION
 movement_events.7.d2: "Stoupenci [SCOPE.gsInterestGroup('relevant_ig').GetFullName] zorganizovali celonárodní kampaň vyvěšování plakátů za [SCOPE.sPoliticalMovement('relevant_movement').GetName]. V některých městech nebyla zeď bez pro-[SCOPE.sLawType('relevant_law').GetName] plakátu." # todo: NEW TRANSLATION
 movement_events.7.f: "#bold Neděle: Shromáždění za [SCOPE.sLawType('relevant_law').GetNameNoFormatting]#!\n\nSetkání ve VŠECH OBECNÍCH DOMÁCH, 19:00–20:00. PROKAŽTE PODPORU spravedlivé věci [SCOPE.sLawType('relevant_law').GetNameNoFormatting]!\n\n#italic Občerstvení k dispozici v 19:30 pro všechny účastníky. Předplatné místního \"Advokáta\" pro další informace.#!" # todo: NEW TRANSLATION
 movement_events.7.a: "Opláchnou se deštěm." # todo: NEW TRANSLATION
 movement_events.7.b: "Nechte tyto zdi okamžitě očistit." # todo: NEW TRANSLATION
 movement_events.8.t: "Za mřížemi" # todo: NEW TRANSLATION
 movement_events.8.d: "Zadržení a údajné špatné zacházení se neukázněným protestujícím napojeným na [SCOPE.sPoliticalMovement('relevant_movement').GetName] vyvolalo rozhořčení mezi jeho spolubojovníky. Byly domluveny další demonstrace žádající jeho propuštění." # todo: NEW TRANSLATION
 movement_events.8.f: "Vězení bylo žalostné místo. Železné tyče, kamenné zdi a studené podlahy. V posledních týdnech si stráže zvykly tleskat občas hůlkami po mřížích, když procházely, což znemožňovalo spánek. Nemohl ani uniknout ve snech, protože napětí z bdělého světa začalo pronikat i do jeho spánku.\n\nA to vše za to, že strčil policistu pryč? Zpočátku toho litoval. Nyní však mohl říci, že každý z nich si to zasloužil, a víc." # todo: NEW TRANSLATION
 movement_events.8.a: "Možná lze zařídit předčasné propuštění za dobré chování." # todo: NEW TRANSLATION
 movement_events.8.b: "Neuděláme výjimky kvůli pár hulvátům." # todo: NEW TRANSLATION
 movement_events.9.t: "Vlna stávky v [SCOPE.sState('relevant_state').GetName]" # todo: NEW TRANSLATION
 movement_events.9.d: "Vlna pracovní stávky inspirovaná [SCOPE.sPoliticalMovement('relevant_movement').GetName] otřásla průmyslem v [SCOPE.sState('relevant_state').GetName]. Stávkující pracovníci se připojili k protestům ve více městech regionu." # todo: NEW TRANSLATION
 movement_events.9.f: "Důstojník očekával, že dělníci budou jiní. Neumytí, znečištění průmyslovými výpary, promočení potem. Nebyli. Měli stejné oblečení jako o víkendech, čistí. V očích byla hrdost. Místo ustaraného výrazu vyčerpaných mužů stáli vzdorovitě, s tvářemi zatvrdlými, rukama svírajícími transparenty volající po světě a více." # todo: NEW TRANSLATION
 movement_events.9.a: "Dejte na vědomí, že uznáváme jejich požadavky." # todo: NEW TRANSLATION
 movement_events.9.b: "Dejte je zpět do práce!" # todo: NEW TRANSLATION
 movement_events.10.t: "Nadouvaní pod nohama" # todo: NEW TRANSLATION
 movement_events.10.d: "Demonstrace organizovaná [SCOPE.sPoliticalMovement('relevant_movement').GetName] v [SCOPE.sState('relevant_state').GetName] byla násilně rozehnána policií, což vedlo k několika úmrtím a těžkým zraněním. Vzpomínky na incident se staly bojovým pokřikem disidentů." # todo: NEW TRANSLATION
 movement_events.10.f: "Usmíval se, když nařídil koni prorazit dav. Jeho výraz se jí vryl do paměti jako kyselina do kovu. Jaký to byl muž, který udržel takovou hrůznou klidnost mezi výkřiky, zlomenými kostmi, tryskající krví? Když lidé utíkali kolem něj, nařídil důstojníkům vpřed... a pak co?\n\nUprostřed rozmazané lidské hrůzy se schovala v ledabylé zavřené hospodě. Mnozí jiní neměli to štěstí. Když procházela místem, kde se demonstrace konala, nedokázala říci, kolik z lidí na dlažbě ještě dýchalo." # todo: NEW TRANSLATION
 movement_events.10.a: "Pokárat důstojníky zodpovědné." # todo: NEW TRANSLATION
 movement_events.10.b: "Dostali rozkaz rozehnat. Policie není vinná." # todo: NEW TRANSLATION
 movement_events.11.t: "Advokát z [SCOPE.sState('relevant_state').GetCityHubName]" # todo: NEW TRANSLATION
 movement_events.11.d: "Explicitně stranické noviny založené členy [SCOPE.sPoliticalMovement('relevant_movement').GetName] v [SCOPE.sState('relevant_state').GetCityHubName] vydaly své první číslo. Mezi reklamami a politickými karikaturami přinášejí nemilosrdnou kritiku vládní politiky." # todo: NEW TRANSLATION
 movement_events.11.f: "Mělo to jistý génius. Tištěné na nejlevnějším papíře, šetří se inkoustem, zaplněné reklamami a velkým písmem, dalo se vydat ziskové vydání za jediný haléř, zatímco konkurence prodávala za pět až desetkrát více. Pokud noviny bezostyšně a neúnavně obhajovaly určitou myšlenku, mohl by každý dělník ve městě o nich vědět do večera. Pokud konkurenti odmítli klesnout tak nízko, byli odpovědní za své vlastní udusení." # todo: NEW TRANSLATION
 movement_events.11.a: "Jak dlouho může stranický tisk vydržet?" # todo: NEW TRANSLATION
 movement_events.11.b: "Cože? Odepřete jim tiskovou licenci." # todo: NEW TRANSLATION
 movement_events.12.t: "Prázdné kapsy" # todo: NEW TRANSLATION
 movement_events.12.d: "Řada vnímaných špatných rozhodnutí [SCOPE.sPoliticalMovement('relevant_movement').GetName] vedla k výraznému poklesu schopnosti hnutí získávat peníze. Mnozí bohatí sympatizanti tiše zastavili svou podporu." # todo: NEW TRANSLATION
 movement_events.12.f: "\"Nechceme působit stranicky.\" Vždy stejné klišé. Organizátor přešel po svém malém kancelářském prostoru, sevřená pěst až do bodu, kdy měl pocit, že mu prsty prasknou. Občas mrkl na neotevřené obálky na stole, z nichž věděl, že každá zopakuje nějakou variaci téže věci.\n\n\"Stranický\" - co to vlastně znamená? Že jim na něčem záleží? Že si zvolili něco víc než počítání peněz ve svém trezoru? Má něco důležitého, co zlepší společnost. Mohli by učinit totéž. V tom světle jak může být stranickost špatná?" # todo: NEW TRANSLATION
 movement_events.12.a: "Možná najdou alternativní zdroje financí." # todo: NEW TRANSLATION
 movement_events.12.b: "Vše jednou umírá, některé dříve než jiné." # todo: NEW TRANSLATION
 movement_events.13.t: "[SCOPE.sPoliticalMovement('relevant_movement').GetName] organizuje v [SCOPE.sState('relevant_state').GetName]" # todo: NEW TRANSLATION
 movement_events.13.d: "Organizátoři napojení na [SCOPE.sPoliticalMovement('relevant_movement').GetName] zahájili cílenou kampaň k povzbuzení podpory [SCOPE.sLawType('relevant_law').GetNameNoFormatting] v [SCOPE.sState('relevant_state').GetName]." # todo: NEW TRANSLATION
 movement_events.13.f: "Obyvatelé každého regionu rádi říkají, že jejich domov má dlouhou a jedinečnou historii pevné komunity. Organizátor téměř souhlasil. Problémem bylo, že tato komunita často neplatila k cizákům. Byl už mnohokrát vyhozen, ale pokračoval. Pokud by dokázal vnést správnou frázi do správných kruhů, i nápad, který byl zpočátku odmítnut, by mohl začít nacházet oporu." # todo: NEW TRANSLATION
 movement_events.13.a: "V [SCOPE.sState('relevant_state').GetNameNoFormatting] je mnoho ochotných uší." # todo: NEW TRANSLATION
 movement_events.13.b: "Musí se starat o praktičtější věci." # todo: NEW TRANSLATION
 movement_events.14.t: "Studenti se přidávají k [SCOPE.sPoliticalMovement('relevant_movement').GetName]" # todo: NEW TRANSLATION
 movement_events.14.d: "Skupina studentů z [SCOPE.sBuilding('relevant_university').GetName] v [SCOPE.sState('relevant_state').GetName] zorganizovala demonstraci na podporu [SCOPE.sPoliticalMovement('relevant_movement').GetName]. Projev inspiroval další studenty k připojení." # todo: NEW TRANSLATION
 movement_events.14.f: "Přednáškový sál byl pustý. Vždy chyběl jeden nebo dva studenti pro nemoci, cesty či rodinné záležitosti, ale nic takovéhoto rozsahu. Byly tři nebo čtyři studenty na řadu, každý ostrými kontury proti prázdným sedadlům po stranách. Bylo to materiál na přednášku sám o sobě. Jako kupa písku, jejíž zrnka odfoukla vítr, dokud se její tvar náhle nezměnil, tak bylo dříve to, co bylo třídou." # todo: NEW TRANSLATION
 movement_events.14.a: "Mládež povede [ROOT.GetCountry.GetNameNoFormatting] do budoucnosti!" # todo: NEW TRANSLATION
 movement_events.14.b: "Měli by se soustředit na studium." # todo: NEW TRANSLATION
 movement_events.15.t: "Kontroverzní témata" # todo: NEW TRANSLATION
 movement_events.15.d: "Akce organizovaná [SCOPE.sPoliticalMovement('relevant_movement').GetName] se změnila v rvačku, když protivníci hnutí infiltraci dav. Když dorazila policie, žádný účastník nechtěl podat konzistentní výpověď." # todo: NEW TRANSLATION
 movement_events.15.f: "Většina z nich měla alespoň jednu modřinu, rozříznuté rty nebo krvavý nos. Jeho zranění bylo méně čestné než většina. Narazil kyčlí do rohu stolu při spěchu k východu a málem narazil do přicházejícího žandára. Vznikly dvě rozporné verze událostí. Jednu řekne detektivovi a druhou přátelům." # todo: NEW TRANSLATION
 movement_events.15.a: "Dejte jim den ve vězení, aby vychladli." # todo: NEW TRANSLATION
 movement_events.15.b: "Usilovat o obvinění organizátorů akce." # todo: NEW TRANSLATION
