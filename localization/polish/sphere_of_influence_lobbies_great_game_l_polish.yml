 modifier_failed_korean_intervention: "Ponižující selhání v Koreji" # todo: NEW TRANSLATION
 modifier_victory_in_korean_intervention: "Vítězství v Koreji" # todo: NEW TRANSLATION
 modifier_empress_myeongseong: "Královna Min" # todo: NEW TRANSLATION
 je_donghak_movement: "Hnutí Donghak" # todo: NEW TRANSLATION
 je_donghak_movement_reason: "Donghak, neboli Východní učení, se začalo šířit mezi [GetPopType('peasants').GetName] v [ROOT.GetCountry.GetName] jako reakce na otevření země vnějšímu světu. Následovníci Donghak, často spjatí s [SCOPE.gsInterestGroup('donghak_ig').GetCustom('IG_I_TT')], prosazují rovnost a práva pro všechny a odmítnutí cizího vlivu.\n\nInfrastruktura, kterou následovníci Donghak vytvořili, se rozšiřuje po celé zemi a může posloužit jako prostředek k rychlé organizaci povstání v budoucnu." # todo: NEW TRANSLATION # todo: NAME CASE
 donghak_petition_complete_tt: "Dokončil #bold Gyojo Shinwon#! [concept_journal_entry]" # todo: NEW TRANSLATION
 je_gyojo_shinwon: "Gyojo Shinwon" # todo: NEW TRANSLATION
 je_gyojo_shinwon_reason: "Následovníci Donghak mezi [SCOPE.gsInterestGroup('donghak_ig').GetCustom('IG_I_TT')] předložili vládě petici, v níž žádají toleranci doktríny Donghak, vypovězení cizinců a popravu zkorumpovaných členů [SCOPE.gsInterestGroup('yangban_ig').GetCustom('IG_G_TT')].\n\nVláda, která slíbila vyslechnout požadavky hnutí, dočasně snížila sociální neklid ze strany jeho přívrženců, ale otočit se zády k petentům jistě povede k obnovené revoluční činnosti." # todo: NEW TRANSLATION # todo: NAME CASE
 je_korean_rebellion: "Korejské povstání" # todo: NEW TRANSLATION
 je_korean_rebellion_reason: "Povstání, které vypuklo napříč [SCOPE.sCountry('korea_scope').GetName], ohrožuje rovnováhu moci v zemi. Svržení [SCOPE.sCharacter('korea_ruler_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('korea_ruler_scope').GetFullName] jistě povede k nezávislosti [SCOPE.sCountry('korea_scope').GetNameNoFormatting] a vytvoří příležitosti pro evropské mocnosti získat vliv na poloostrově." # todo: NEW TRANSLATION
 korean_ruler_retained_tt: "[SCOPE.sCharacter('korea_ruler_scope').GetFullName] zůstává [SCOPE.sCharacter('korea_ruler_scope').GetPrimaryRoleTitle] [SCOPE.sCountry('korea_scope').GetName]" # todo: NEW TRANSLATION
 korean_ruler_deposed_tt: "Vláda [SCOPE.sCountry('korea_scope').GetName] byla sesazena [concept_revolution]" # todo: NEW TRANSLATION
 japan_demands_korea_tt: "[SCOPE.sCountry('japan_scope').GetName] bude mít možnost získat #bold další vliv#! v [SCOPE.sCountry('korea_scope').GetName]" # todo: NEW TRANSLATION
 je_korean_rebellion_government_victory: "Pro dosažení #b vládního#! vítězství:\n" # todo: NEW TRANSLATION
 je_korean_rebellion_on_government_victory: "Při #b vládním#! vítězství:\n$EFFECT$" # todo: NEW TRANSLATION
 je_korean_rebellion_rebel_victory: "Pro dosažení #b povstaleckého#! vítězství:\n" # todo: NEW TRANSLATION
 je_korean_rebellion_on_rebel_victory: "Při #b povstaleckém#! vítězství:\n$EFFECT$" # todo: NEW TRANSLATION
 korea_fail_condition_war_tt: "[SCOPE.sCountry('korea_rebellion_scope').GetName] je ve [concept_war] s [SCOPE.sCountry('korea_scope').GetName]" # todo: NEW TRANSLATION
 korea_fail_condition_rebels_tt: "Nestanuli jsme na straně [SCOPE.sCountry('korea_rebellion_scope').GetName] ve jeho [concept_diplomatic_play] proti [SCOPE.sCountry('korea_scope').GetName]" # todo: NEW TRANSLATION
 korea_fail_condition_gov_tt: "Nestanuli jsme na straně [SCOPE.sCountry('korea_scope').GetName] ve jeho [concept_diplomatic_play] proti [SCOPE.sCountry('korea_rebellion_scope').GetName]" # todo: NEW TRANSLATION
 gg_korea.1.t: "Donghak" # todo: NEW TRANSLATION
 gg_korea.1.d: "[GetPopType('peasants').GetName] inspirovaní filosofií Donghak se začali organizovat po celém [ROOT.GetCountry.GetName]. Jejich volání po sociální rovnosti, náboženské toleranci a vypuzení cizího vlivu je stále těžší ignorovat." # todo: NEW TRANSLATION
 gg_korea.1.f: "Přecházejíce do roku Xinyou, přicházeli ke mně učenci ze všech stran a ptali se, \"S božským duchem sestupujícím, mistře, co to znamená?\"\n\nOdpověděl jsem, \"To obsahuje princip nevyčerpatelného návratu.\"\n\n\"Jak tedy nazveme tuto cestu?\"\n\n\"Je to Cesta Nebes.\"\n\n\"Je odlišná od Západní cesty?\"\n\n\"Západní učení má své odlišnosti, jako zaklínadla bez obsahu. Přesto je hnutí stejné, cesta jednotná, ale princip nikoli.\"" # todo: NEW TRANSLATION
 gg_korea.1.a: "Hrozí další rolnické povstání?" # todo: NEW TRANSLATION
 gg_korea_effect_tt: "Zatímco #v Hnutí Donghak#! je aktivní, [SCOPE.gsInterestGroup('donghak_ig').GetName] bude posílena a [Concept('concept_revolution','$concept_revolutions$')|l] představuje větší hrozbu pro naši zemi" # todo: NEW TRANSLATION
 gg_korea.2.t: "Donghakské povstání" # todo: NEW TRANSLATION
 gg_korea.2.d: "Nespokojenost mezi [SCOPE.gsInterestGroup('donghak_ig').GetCustom('IG_I_TT')] vyústila v začátky otevřeného konfliktu. Napříč [ROOT.GetCountry.GetName] rolníci využili infrastrukturu Donghak k organizaci revoluce." # todo: NEW TRANSLATION # todo: NAME CASE
 gg_korea.2.f: "Příkazy byly rozšířeny všem ve městě. Měli se co nejrychleji dostat do [ROOT.GetCountry.GetCapital.GetCityHubName], vyhnat cizince a zabít každého člena rodiny [SCOPE.sCharacter('gov_leader_scope').GetLastNameNoFormatting].\n\nMělo jít o milosrdný pochod, šetřící nevinné a jejich majetek, platící za své zásoby a prokazující všem svou věrnost a zbožnost. Bylo to co nejdále od chování vládních vojáků." # todo: NEW TRANSLATION
 gg_korea.2.a: "Povolat vojsko a připravit se na bitvu." # todo: NEW TRANSLATION
 gg_korea.3.t: "Východní učení" # todo: NEW TRANSLATION
 gg_korea.3.d: "Nová doktrína, Donghak, se objevila v provincii [SCOPE.sState('choi_je_woo_state').GetName], prosazovaná [SCOPE.sCharacter('choi_je_woo_scope').GetFullName]. Volá po rovnosti pro všechny a zřízení ráje na Zemi." # todo: NEW TRANSLATION
 gg_korea.3.f: "\"S vítězstvími a dobytím Západu se zdá úspěch nevyhnutelný, přesto přináší zkázu všeho, nářek nevyhnutelného pádu. Jak tedy zajistíme národ a přineseme lidem mír? Ach, v této době lidé nevědí o svém štěstí; slyšíce tato slova, někteří souhlasí, jiní nesouhlasí, diskutují v uličkách, strach vyplývá z nedostatku ctnosti.\"" # todo: NEW TRANSLATION
 gg_korea.3.a: "Balzám na trápení lidu." # todo: NEW TRANSLATION
 gg_korea.3.b: "Podvodník a hrozba pro svět." # todo: NEW TRANSLATION
 gg_korea.4.ta: "Petice Samrye" # todo: NEW TRANSLATION
 gg_korea.4.tb: "Petice [SCOPE.sState('petition_state').GetFarmHubName]" # todo: NEW TRANSLATION
 gg_korea.4.d: "Věřící Donghak předložili vládě [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetLastName] seznam reforem. Patří mezi ně náboženská tolerance, vypovězení cizinců a poprava zkorumpovaných úředníků." # todo: NEW TRANSLATION
 gg_korea.4.f: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] se seznámil s následovníky Donghak skrze zprávy o jejich organizování na venkově a z početných malých petic a dopisů, které byly posílány jak [ROOT.GetCountry.GetRuler.GetHerselfHimself], tak [ROOT.GetCountry.GetRuler.GetHerHis] úředníkům. Vše mělo stejný ráz – prohlášení o nejvyšší loajalitě vůči [ROOT.GetCountry.GetRuler.GetHerHim], následované vysvětlením jejich požadavků.\n\nNebyla to první svého druhu, zamyslel se [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle], ale rozhodně nejvíc viditelná. Jeho možnosti byly dvě. Odstřihnout nově organizované rolnictvo, nebo si popudit vlastní dvůr?" # todo: NEW TRANSLATION
 gg_korea.4.a: "Hrozit odvetou, pokud se nerozptýlí." # todo: NEW TRANSLATION
 gg_korea.4.b: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] vyslechne tuto petici." # todo: NEW TRANSLATION
 gg_korea.5.t: "Nebe díky trpělivosti" # todo: NEW TRANSLATION
 gg_korea.5.d: "Pečlivými reformami a spoluprací s [SCOPE.gsInterestGroup('donghak_ig').GetCustom('IG_I_TT')] se nám podařilo uklidnit hnutí Donghak. [ROOT.GetCountry.GetName] zůstane izolované od světa, ale učiní tak v harmonii." # todo: NEW TRANSLATION # todo: NAME CASE
 gg_korea.5.f: "Poslední lodě opustily přístavy a brány byly zavřeny. Kdesi nad mořem nějaký evropský obchodník jistě upadl v šok a posílal dopisy každému vládnímu činiteli, kterého znal. Západoevropané se vrátí – to bylo jisté, a je stejně jisté, že se vrátí ozbrojení.\n\nBylo na lidech [ROOT.GetCountry.GetCapital.GetPortHubName] něco nového, jakési neviditelné napětí, které je provázelo v každodenním životě. Už se nebáli lodí a děl a už se navzájem nepovažovali za největší hrozbu. Až se Západoevropané vrátí, nebude tam vnitřní rozkol, který by šlo využít – a jaká expedice si poradí s rezervní armádou milionů?" # todo: NEW TRANSLATION
 gg_korea.5.a: "Prosadili jsme spravedlnost a bratrství." # todo: NEW TRANSLATION
 gg_korea.5.b: "Postavíme ráj mezi horami." # todo: NEW TRANSLATION
 gg_korea.6.t: "Nechat na pospas" # todo: NEW TRANSLATION
 gg_korea.6.d: "Po nepřiměřeně dlouhém čekání na slibované reformy došla trpělivost hnutí Donghak. Postoj [SCOPE.gsInterestGroup('donghak_ig').GetCustom('IG_G_TT')] je nyní zrazený a klíčí v něm povstání." # todo: NEW TRANSLATION # todo: NAME CASE
 gg_korea.6.f: "Ztratili dalšího poslové. Přes naděje jeho rodiny inspektor předpokládal, že ho už nikdy neuvidí. Výběrčí daní, sčítací komisaři, poslové, policisté – všichni začali v této oblasti mizet, pokud se příliš vzdálili od silnic. Nebývalo to vždy se všemi, ale bylo to dost – atmosféra v posádkách se změnila z chladné lhostejnosti na teror, a to se zdálo trvalé.\n\nMísto jednotného státu se [ROOT.GetCountry.GetNameNoFormatting] začala jevit jako souostroví měst spojených nejtenčím vláknem, obklopené obrovským a hrozným mořem opovržení." # todo: NEW TRANSLATION
 gg_korea.6.a: "Musíme žít s následky." # todo: NEW TRANSLATION
 gg_korea.7.ta: "Donghakské povstání" # todo: NEW TRANSLATION
 gg_korea.7.tb: "Povstání v [SCOPE.sState('korea_rebellion_capital').GetCityHubName]" # todo: NEW TRANSLATION
 gg_korea.7.d.japan: "Povstání explodovalo napříč [SCOPE.sCountry('korea_scope').GetName], ohrožujíc vládu [SCOPE.sCountry('korea_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('korea_scope').GetRuler.GetFullName]. Povstání představuje vynikající příležitost zvýšit náš vliv v [SCOPE.sCountry('korea_scope').GetNameNoFormatting] na úkor [SCOPE.sCountry('china_scope').GetName]." # todo: NEW TRANSLATION
 gg_korea.7.d.china: "Povstání explodovalo napříč [SCOPE.sCountry('korea_scope').GetName], ohrožujíc vládu loajálního [SCOPE.sCountry('korea_scope').GetRuler.GetPrimaryRoleTitle]. Pokud povstání svrhne vládu, [SCOPE.sCountry('korea_scope').GetNameNoFormatting] se jistě stane bezbrannou vůči cizím mocnostem." # todo: NEW TRANSLATION
 gg_korea.7.f: "Jakmile telegraf dorazil, celá místnost se vzbudila k činnosti. Zpráva z [SCOPE.sCountry('korea_scope').GetNameNoFormatting] byla dlouhá a bolestná - za jiných okolností by ti, kdo ji četli, pocítili, že jim ubývá vzduchu. Teď už ne. Věděli, že nejsou jediní, kdo ji čte, a že na druhé straně Východního moře se jejich rivalové připravují stejně. Ať po zemi, či po moři, šlo nyní o to, kdo mobilizuje rychleji." # todo: NEW TRANSLATION
 gg_korea.7.a: "Je třeba udržet [SCOPE.sCountry('korea_scope').GetAdjective] vládu." # todo: NEW TRANSLATION
 gg_korea.7.b: "Vítězství povstalců by napomohlo našim zájmům." # todo: NEW TRANSLATION
 gg_korea.7.c: "Nemáme o to zájem." # todo: NEW TRANSLATION
 gg_korea.8.t: "Příležitosti v [SCOPE.sCountry('korea_scope').GetName]" # todo: NEW TRANSLATION
 gg_korea.8.d: "Naše porážka povstání v [SCOPE.sCountry('korea_scope').GetNameNoFormatting] nám poskytla možnost diktovat příznivé poválečné uspořádání. Nárokovat, aby [SCOPE.sCountry('china_scope').GetName] oficiálně uznala nezávislost [SCOPE.sCountry('korea_scope').GetNameNoFormatting], nám umožní efektivněji konsolidovat vliv v regionu." # todo: NEW TRANSLATION
 gg_korea.8.f: "\"Yangban jsou z velké části beznadějní, ale někteří ministři jsou vnímaví k modernějším směrům.\"\n\n\"Kdo?\"\n\n\"[SCOPE.sCharacter('industrialists_leader_scope').GetLastNameNoFormatting], [SCOPE.sCharacter('intelligentsia_leader_scope').GetLastNameNoFormatting], možná [SCOPE.sCharacter('pb_leader_scope').GetLastNameNoFormatting]. Máme spoustu kandidátů do nouzové vlády. Budou nadšení, že dostanou šanci prosadit, co chtějí.\"" # todo: NEW TRANSLATION
 gg_korea.8.a: "Poslat požadavky." # todo: NEW TRANSLATION
 gg_korea.8.b: "Neměli bychom ohrozit náš vztah s [SCOPE.sCountry('china_scope').GetName]." # todo: NEW TRANSLATION
 china_demanded_to_cede_korea_tt: "[SCOPE.sCountry('china_scope').GetName] bude nucena postoupit #v $KOR$#!, nebo čelit [concept_war]" # todo: NEW TRANSLATION
 gg_korea.9.t: "[SCOPE.sCountry('japan_scope').GetName] požaduje stažení z [SCOPE.sCountry('korea_scope').GetName]" # todo: NEW TRANSLATION
 gg_korea.9.d: "Vláda [SCOPE.sCountry('japan_scope').GetAdjectiveNoFormatting] nám poslala seznam požadavků, z nichž hlavním je naše stažení z [SCOPE.sCountry('korea_scope').GetNameNoFormatting]. Jejich požadavky podpořily zbývající síly na korejském poloostrově, které odmítly stáhnout se po porážce povstání." # todo: NEW TRANSLATION
 gg_korea.9.f: "Tiskař pohlížel na edikt s jistým děsem. Představoval se mu jako valící se mrak dýmu, každý řádek temnější než ten předchozí. Události gradovaly do temného crescenda, chaos se stočil v povstání. [SCOPE.sCountry('japan_scope').GetAdjectiveNoFormatting] byli tvrdě odsouzeni, jejich přestupky byly vypsány jako pušky v popravčím čtverci.\n\n\"Těžko racionálně vysvětlitelné\", \"nevyprovokované\", \"nedostatečné zdůvodnění\". Trýznivá eufemismy rozrušené vlády. Jedna, která, pokud náhle nezmění kurz, nevyhnutelně směřovala k válce." # todo: NEW TRANSLATION
 gg_korea.9.a: "Korea je zátěží, které bychom se rádi zbavili." # todo: NEW TRANSLATION
 gg_korea.9.b: "Nepřijmeme další cizí ústupek." # todo: NEW TRANSLATION
 korea_monarchy.1.t: "Nemocný král" # todo: NEW TRANSLATION
 korea_monarchy.1.d: "Navzdory svému mládí byl [SCOPE.sCharacter('heonjong_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('heonjong_scope').GetFullName] zasažen těžkou nemocí. [SCOPE.sCharacter('heonjong_scope').GetHerHis|U] rychlé zhoršení vyvolalo obavy, že [SCOPE.sCharacter('heonjong_scope').GetSheHe] nemá už dlouho co dělat na tomto světě." # todo: NEW TRANSLATION
 korea_monarchy.1.f: "Nebyla to první nemoc, které čelil, ani pátá. Stav krále začal od chvíle, kdy nastoupil na trůn, zrcadlit stav země - jak ji sužovaly povodně a monzuny, tak on chorobami, nebo zprávami o korupci a velezradě na dvoře. Někdy se bál, že nezanechá žádné dědictví, že vláda strávená pouze bojem s krizemi bude jeho nástupci připadat jako plýtvání. Možná se mýlil, pomyslel si, neboť možná nebude mít žádné nástupce." # todo: NEW TRANSLATION
 korea_monarchy.1.a: "Linie Jeongjo končí." # todo: NEW TRANSLATION
 korea_monarchy.1.b: "[SCOPE.sCharacter('heonjong_scope').GetHerHis|U] lékaři musí vědět o nějaké léčbě." # todo: NEW TRANSLATION
 korea_monarchy.2.t: "Prázdný dům" # todo: NEW TRANSLATION
 korea_monarchy.2.d: "Úmrtí všech mužských dětí [SCOPE.sCharacter('cheoljong_scope').GetFullName] a nedostatek blízkých příbuzných, kteří by mohli nárokovat trůn, zanechaly nástupnictví nemocného [SCOPE.sCharacter('cheoljong_scope').GetPrimaryRoleTitle] nejisté. Klán Andong Kim nominoval [SCOPE.sCharacter('gojong_scope').GetFullName] jako nástupce [SCOPE.sCharacter('cheoljong_scope').GetHerHis]." # todo: NEW TRANSLATION
 korea_monarchy.2.f: "\"Opět upoután na lůžko, bez dědice. Je ještě nějaká naděje?\"\n\n\"Dělá, co může, ale naše naděje mohou být marné. Slyšela jsi o události před pár dny, s magistrátem?\"\n\n\"Ne, pověz mi.\"\n\n\"Musel králi připomenout, kdo je, a prosil ho, aby zachoval svou vládu. Nejprve jsem byl naštvaný - ale teď mu to nemohu vyčítat.\"" # todo: NEW TRANSLATION
 korea_monarchy.2.a: "Ród Yi přetrvá." # todo: NEW TRANSLATION
 korea_monarchy.3.t: "Královna Min" # todo: NEW TRANSLATION
 korea_monarchy.3.d: "[SCOPE.sCharacter('myeongseong_scope').GetFullName], politicky průbojná úřední manželka [SCOPE.sCharacter('gojong_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('gojong_scope').GetFullName], si vybudovala pevné postavení na [ROOT.GetCountry.GetAdjective] dvoře. Její patronát silně prospěje [SCOPE.sCharacter('myeongseong_scope').GetInterestGroup.GetCustom('IG_D_TT')]." # todo: NEW TRANSLATION # todo: NAME CASE
 korea_monarchy.3.f: "\"Při každé příležitosti jsem byl ohromen půvabem a milým vystupováním královny, její pozornou laskavostí, výjimečným intelektem a silou, a její pozoruhodnou schopností konverzace i přes prostředníka. Není divu, že měla výjimečný politický vliv a vliv na [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] a mnohé další. Byla obklopena nepřáteli, všichni hořcí proti ní, protože díky svému talentu a síle dosadila členy své rodiny téměř do všech hlavních úřadů státu.\n\nJejí život byl bojem. Bojovala se vším svým půvabem, mazaností a moudrostí o moc, o důstojnost a bezpečí svého muže a syna a za pád těch, kteří jí odporovali.\"" # todo: NEW TRANSLATION
 korea_monarchy.3.a: "Její patronát bude zásadní pro modernizaci." # todo: NEW TRANSLATION
 korea_monarchy.3.b: "Měla by se soustředit na své dvorské povinnosti." # todo: NEW TRANSLATION
