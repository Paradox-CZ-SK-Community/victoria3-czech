 je_unify_afghanistan_objective: "Sjednotit Afghánistán" # todo: NEW TRANSLATION
 je_unify_afghanistan_objective_reason: "Pád Durraniovské říše nechal Afghánistán v konstantním občanském rozvratu mezi drobnými uchazeči o trůn. Abychom odvrátili přibližující se evropské mocnosti, musíme vytvořit jednotný a trvalý afghánský stát." # todo: NEW TRANSLATION
 je_unify_afghanistan: "Afghánské znovusjednocení" # todo: NEW TRANSLATION
 je_unify_afghanistan_reason: "Nástupnická krize po smrti Timura Šáha Durrani v roce 1793 vrhla bývalou Durraniovskou říši do období nekonečných občanských bojů. S hrozbou evropských mocností obcházejících ze všech stran musíme ukončit toto období bojujících knížectví a znovu vybudovat jednotný Afghánistán.\n\nAčkoliv požádání evropské [concept_great_power] o pomoc při znovusjednocení nám může zajistit jejich podporu, jejich #bold protivníci#! se stanou vůči našim cílům více nepřátelští." # todo: NEW TRANSLATION
