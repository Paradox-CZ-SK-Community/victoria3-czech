 lobby_proposal.1.t: "Požadavek [SCOPE.sPoliticalLobby('relevant_lobby').GetName]" # todo: NEW TRANSLATION
 lobby_proposal.1.d: "[SCOPE.sPoliticalLobby('relevant_lobby').GetName] požádal, abychom [SCOPE.GetRootScope.GetCountry.GetCustom('pro_lobby_demand_text_def')] [SCOPE.sCountry('third_party_country').GetName]. [SCOPE.sCountry('third_party_country').GetNameNoFormatting] je známý protivník zájmů [SCOPE.sCountry('relevant_country').GetAdjective]." # todo: NEW TRANSLATION
 lobby_proposal.1.f: "\"Musíme být co nejkomplexnější. Jakýkoli jiný přístup je nezodpovědný. Agrese [SCOPE.sCountry('third_party_country').GetAdjectiveNoFormatting] je stará jako hory.\"\n\n\"Obávám se, že by to mohlo vypadat, že používáme vlastní národ jako figuru na šachovnici pro zahraniční mocnost. Co byste řekl, kdyby nás někdo na to dotázal?\"\n\n\"Okolnostní slaďování nás nepodřídí. V tomto případě jsou zájmy [SCOPE.sCountry('relevant_country').GetAdjectiveNoFormatting] zároveň zájmy [ROOT.GetCountry.GetAdjectiveNoFormatting]. Je to tak jednoduché.\"" # todo: NEW TRANSLATION
 lobby_proposal.1.a: "Zabýváme se tím." # todo: NEW TRANSLATION
 lobby_proposal.1.b: "To není v našem zájmu." # todo: NEW TRANSLATION
 lobby_proposal.2.t: "Požadavek [SCOPE.sPoliticalLobby('relevant_lobby').GetName]" # todo: NEW TRANSLATION
 lobby_proposal.2.d: "[SCOPE.sPoliticalLobby('relevant_lobby').GetName] požádal, abychom [SCOPE.GetRootScope.GetCountry.GetCustom('anti_lobby_demand_text_def')] [SCOPE.sCountry('relevant_country').GetName]. Úspěšné provedení návrhu získá vládě značné sympatie od loby." # todo: NEW TRANSLATION
 lobby_proposal.2.f: "\"A těm, kteří by odmítli a upřednostnili zachování statusu quo?\"\n\nNebyla žádná váhání. Odpověď zněla procvičeně, protože byla. Tento člověk byl proaktivní, trávil hodiny přemítáním a předvídáním možných útoků.\n\n\"Odpověděl bych, že bychom je nikdy neměli nechat, aby se k nám přiblížili natolik. Přátelství postavené na klamu je nicotné a získané dobré úmysly jsou iluzorní.\"" # todo: NEW TRANSLATION
 lobby_proposal.2.a: "Prozkoumáme to." # todo: NEW TRANSLATION
 lobby_proposal.2.b: "To není v našem zájmu." # todo: NEW TRANSLATION
 lobby_proposal.3.t: "[SCOPE.sPoliticalLobby('relevant_lobby').GetName] nabízí příležitost" # todo: NEW TRANSLATION
 lobby_proposal.3.d: "[SCOPE.sPoliticalLobby('relevant_lobby').GetName] nám nabídl příležitost [SCOPE.GetRootScope.GetCountry.GetCustom('pro_lobby_opportunity_text_def')] [SCOPE.sCountry('relevant_country').GetName]. Loby nabízí využít své kontakty k usnadnění vyjednávacího procesu." # todo: NEW TRANSLATION
 lobby_proposal.3.f: "Vyjednávání, vedená pod stolem s představitelem [SCOPE.sCountry('relevant_country').GetAdjectiveNoFormatting] vlády, byla dlouhá a náročná. Představitel věděl, že jedná s skupinou bez moci odpovídající jejich vlastní, a podle toho upravil strategii. Přesto se dohodli. Nic nebylo písemně potvrzeno, ale to nebylo důležité. Když vláda poslala oficiální kopii - pokud ji poslala -, našla by již připravenou odpověď v [SCOPE.sCountry('relevant_country').GetCapital.GetCityHubName]." # todo: NEW TRANSLATION
 lobby_proposal.3.a: "Rádi to prozkoumáme." # todo: NEW TRANSLATION
 lobby_proposal.3.b: "To není v našem zájmu." # todo: NEW TRANSLATION
 lobby_proposal.4.t: "[SCOPE.sPoliticalLobby('relevant_lobby').GetName] nabízí příležitost" # todo: NEW TRANSLATION
 lobby_proposal.4.d: "[SCOPE.sPoliticalLobby('relevant_lobby').GetName] nám nabídl příležitost [SCOPE.GetRootScope.GetCountry.GetCustom('anti_lobby_opportunity_text_def')] [SCOPE.sCountry('third_party_country').GetName]. Jejich návrh, pokud bude přijat, je zamýšlen k oslabování zájmů [SCOPE.sCountry('relevant_country').GetAdjective]." # todo: NEW TRANSLATION
 lobby_proposal.4.f: "Byla to zahalená agrese, která by teoreticky mohla oslovit jak horlivé jingoisty, tak ty, kteří preferují zmírnění ztrát. Donutila by nepřítele reagovat a možná by ho to přimělo k nepřiměřenému střetu na podnětné manévry.\n\n\"Plán bojovat s [SCOPE.sCountry('relevant_country').GetNameNoFormatting] až do posledního [SCOPE.sCountry('third_party_country').GetAdjectiveNoFormatting],\" poznamenal jeden ministr. Zástupce zrudl. Připravil si odpovědi, ale žádná z nich se nehodila úplně." # todo: NEW TRANSLATION
 lobby_proposal.4.a: "Rádi to provedeme." # todo: NEW TRANSLATION
 lobby_proposal.4.b: "To není v našem zájmu." # todo: NEW TRANSLATION
