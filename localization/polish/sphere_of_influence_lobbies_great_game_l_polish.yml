 gg_afghanistan.1.d: "[Concept('concept_great_power','$concept_great_powers$')] [SCOPE.sCountry('gp_scope').GetName] a [SCOPE.sCountry('rival_gp_scope').GetName] se vzájemně dohodly na plánu „vyřešit dlouhotrvající hraniční spory v Afghánistánu“. Navrhovaná smlouva vyžaduje ústupky od našeho státu." # todo: NEW TRANSLATION
 gg_afghanistan.1.f: "Tón byl jako u dokumentu měnícího svět, který by přinesl regionu na staletí mír. Každý ústupek od [ROOT.GetCountry.GetName] byl formulován jako laskavost jedné z konkurenčních mocností, převod půdy nárokované jednou ze stran na lidi, kteří tam již žijí. Velvyslanec si s údivem pomyslel, že [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] byl o dohodě vůbec informován." # todo: NEW TRANSLATION
 gg_afghanistan.1.a: "Nemáme jinou volbu než přijmout." # todo: NEW TRANSLATION
 gg_afghanistan.1.b: "Odmítnout to v nejsilnějších možných termínech." # todo: NEW TRANSLATION
 gg_afghanistan.2.t: "Afghánistán odmítá navrhovanou dohodu" # todo: NEW TRANSLATION
 gg_afghanistan.2.d: "[SCOPE.sCountry('afghanistan_scope').GetRuler.GetPrimaryRoleTitle] poslal [SCOPE.sCountry('afghanistan_scope').GetRuler.GetHerHis] odpověď na navrhovanou [SCOPE.sCountry('gp_scope').GetAdjectiveNoFormatting]-[SCOPE.sCountry('rival_gp_scope').GetAdjectiveNoFormatting] dohodu - pevné zamítnutí. S afghánskou vládou neochotnou vynutit smlouvu v její současné podobě možná budeme muset provést úpravy." # todo: NEW TRANSLATION
 gg_afghanistan.2.f: "Když odcházel, kurýr zcela očekával, že pohledy společníků [SCOPE.sCountry('afghanistan_scope').GetRuler.GetPrimaryRoleTitle] mu propálí ocas kabátu. Stál za ním tisíce pušek, miliony liber, flotily honosných plavidel - ale nic z toho v té chvíli nehrálo roli, daleko od jakéhokoliv pobřeží, s nejbližší posádkou na míle daleko." # todo: NEW TRANSLATION
 gg_afghanistan.2.a: "Zpět k náčrtkům." # todo: NEW TRANSLATION
 gg_afghanistan.3.t: "Afghánistán žádá o pomoc" # todo: NEW TRANSLATION
 gg_afghanistan.3.d: "[SCOPE.sCountry('afghan_nation_scope').GetName] požádal o naši pomoc při reunifikaci Afghánistánu. Zajištění přátelského afghánského státu bude užitečné jako nástroj proti našim rivalům v regionu." # todo: NEW TRANSLATION
 gg_afghanistan.3.f: "Mapa byla nejlépe řečeno volně definována. Výběr států vzniklých z rozpadu Durraniovské říše, znázorňující válející se větve Barakzaiů a Durraniů, stejně jako pokusy o znázornění oblastí ovládaných místními kmeny a povstaleckými provinciemi. Vyslanec položil dopis na blízký stůl a podíval se na brýlatého důstojníka, do kterého právě vstoupil.\n\n\"[SCOPE.sCountry('afghan_nation_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('afghan_nation_scope').GetNameNoFormatting],\" začal, \"to je ten modrý, žádá naši pomoc při 'potlačení vzpurných provincií a obnovení legitimní vlády v Afghánistánu'. Máme se na to podívat, nebo mám připravit generickou odpověď?\"" # todo: NEW TRANSLATION
 gg_afghanistan.3.a: "Výborná příležitost." # todo: NEW TRANSLATION
 gg_afghanistan.3.b: "Nemáme o to zájem." # todo: NEW TRANSLATION
 gg_afghanistan.4.t: "Afghánské znovusjednocení" # todo: NEW TRANSLATION
 gg_afghanistan.4.d: "S porážkou poslední vzpurné provincie skončily občanské války vyvolané pádem Durraniovské říše. [ROOT.GetCountry.GetRuler.GetFullName] je nyní jediným legitimním [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetName]." # todo: NEW TRANSLATION
 gg_afghanistan.4.f: "Války byly nejjednodušší částí, zamyslel se [ROOT.GetCountry.GetRuler.GetSheHe]. Řízení loajality kmenů a [ROOT.GetCountry.GetRuler.GetHerHis] podřízených bylo vždy složitější, a teď bude muset udělat totéž v celostátním měřítku. Kdyby vláda polevila, jak dlouho by trvalo, než přijde další vlna povstání? Je to vzácně, téměř neobyčejně, kdo dokáže zvítězit jak ve válce, tak v míru.\n\nProzatím je však čas slavit. Lidé jsou veselí a žádají projev. [ROOT.GetCountry.GetRuler.GetSheHe|U] jim ho pronesou." # todo: NEW TRANSLATION
 gg_afghanistan.4.a: "Je ještě mnoho země k znovudobytí." # todo: NEW TRANSLATION
 gg_afghanistan.4.b: "Udržíme náš stát tak dlouho, jak jen to půjde." # todo: NEW TRANSLATION
 gg_afghanistan.5.t: "Překřížené čáry" # todo: NEW TRANSLATION
 gg_afghanistan.5.d: "Náš návrh na severní hranici #v $AFG$#! je v rozporu s návrhem vyjednávacího týmu [SCOPE.sCountry('sender_scope').GetAdjective] natolik, že nelze dosáhnout kompromisu. Jedna strana se musí ustoupit, aby mohl vyjednávací proces pokračovat." # todo: NEW TRANSLATION
 gg_afghanistan.5.f: "Na severním Afghánistánu byly nakresleny tři čáry různými barvami inkoustu. Divoce se rozcházely, klikatily se přes pohoří Torkestan a Amu Darya, turkmenskou poušť a jižní Pamír, depresivně málo překryvů se objevovalo jako duhové skvrny, kde inkoust úplně prosákl papír.\n\n\"Měli bychom to zkusit znovu,\" vykřikl jeden z představitelů a ostatní přikývli skrz sevřené zuby." # todo: NEW TRANSLATION
 gg_afghanistan.5.a: "Přijmeme návrh [SCOPE.sCountry('sender_scope').GetAdjective]." # todo: NEW TRANSLATION
 gg_afghanistan.5.b: "Přijmeme návrh [SCOPE.sCountry('sender_scope').GetAdjective]." # todo: NEW TRANSLATION
 gg_afghanistan.5.c: "Přijmeme návrh [SCOPE.sCountry('sender_scope').GetAdjective]." # todo: NEW TRANSLATION
 gg_afghanistan.5.e: "Naše rozhodnutí je konečné. [SCOPE.sCountry('sender_scope').GetAdjective] musí ustoupit." # todo: NEW TRANSLATION
 gg_afghanistan.6.t: "Překřížené čáry" # todo: NEW TRANSLATION
 gg_afghanistan.6.d: "Náš návrh pro jihozápadní hranici #v $AFG$#! je v rozporu s návrhem vyjednávacího týmu [SCOPE.sCountry('sender_scope').GetAdjective] natolik, že nelze dosáhnout kompromisu. Jedna strana se musí ustoupit, aby mohl vyjednávací proces pokračovat." # todo: NEW TRANSLATION
 gg_afghanistan.6.f: "Na severovýchodní Indii byly nakresleny tři čáry různými barvami inkoustu. Divoce se rozcházely, klikatily se přes řeku Indus a Balúčskou poušť, tvoříc svévolné tvary, jak se kroutily přes vlnící se hory Kakar, depresivně málo překryvů se objevovalo jako duhové skvrny, kde inkoust úplně prosákl papír.\n\n\"Měli bychom to zkusit znovu,\" vykřikl jeden z představitelů a ostatní přikývli skrz sevřené zuby." # todo: NEW TRANSLATION
 gg_afghanistan.6.a: "Přijmeme návrh [SCOPE.sCountry('sender_scope').GetAdjective]." # todo: NEW TRANSLATION
 gg_afghanistan.6.b: "Přijmeme návrh [SCOPE.sCountry('sender_scope').GetAdjective]." # todo: NEW TRANSLATION
 gg_afghanistan.6.c: "Přijmeme návrh [SCOPE.sCountry('sender_scope').GetAdjective]." # todo: NEW TRANSLATION
