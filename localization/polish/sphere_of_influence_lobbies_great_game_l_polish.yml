 gg_core.1.t: "Velký triumf" # todo: NEW TRANSLATION
 gg_core.1.d: "Prostřednictvím intrik, obratné diplomacie a rozhodných válečných činů jsme dovedli Velkou hru k příznivému závěru. Naše vítězství přineslo [ROOT.GetCountry.GetName] slávu a [SCOPE.sCountry('opponent_scope').GetName] ponížení na světové scéně." # todo: NEW TRANSLATION
 gg_core.1.f: "I noviny [SCOPE.sCountry('opponent_scope').GetAdjectiveNoFormatting] to teď psaly. Titulky, které dříve otáčely i velká neúspěchy ve zdánlivá vítězství a výzvy po revanci, působily klidně a podle všeho vážně informovaly o zahraničních záležitostech, jako by hegemonie [ROOT.GetCountry.GetAdjectiveNoFormatting] byla něčím, co tu vždy bylo. Velvyslanec se zadíval na rozložené noviny a obrátil se na úředníka, který sotva skrýval své nadšení.\n\n\"Pošlete mi jednu kopii pro mě,\" řekl, \"rád bych si ji pověsil na zeď.\"" # todo: NEW TRANSLATION
 gg_core.1.a: "Drahokam v naší koruně nemající obdoby." # todo: NEW TRANSLATION
 gg_core.2.t: "Velká porážka" # todo: NEW TRANSLATION
 gg_core.2.d: "Rozhodující vítězství [SCOPE.sCountry('opponent_scope').GetAdjective] na bojištích Velké hry přinesla [ROOT.GetCountry.GetName] obrovské ponížení na světové scéně. Konflikt skončil a skončil naší porážkou." # todo: NEW TRANSLATION
 gg_core.2.f: "\"Poslední desetiletí jsme strávili v nádherném snu naší vlastní nekázně, bezcílně chybovali od jednoho nevkusného vměšování k druhému. Jednou rukou jsme švihali po cílech, které byly těsně mimo náš dosah, a druhou jsme odcizili ty, kteří byli kdysi nakloněni. Velká hra nemohla být nikdy vyhrána - naše rané omyly nás paralyzovaly dlouho předtím, než jsme je rozpoznali, dříve než jsme si vůbec uvědomili, že hrajeme.\"" # todo: NEW TRANSLATION
 gg_core.2.a: "Uplynula naše zlatá doba?" # todo: NEW TRANSLATION
 gg_core.3.t: "Pat" # todo: NEW TRANSLATION
 gg_core.3.d: "Navzdory enormním výdajům v boji o mezinárodní vliv ani [ROOT.GetCountry.GetName] ani [SCOPE.sCountry('opponent_scope').GetName] nedosáhli rozhodujícího vítězství ve Velké hře. Obě strany z konfliktu vyšly potlučené a neschopné porazit druhou." # todo: NEW TRANSLATION
 gg_core.3.f: "Ještě před tím, než byla hra v polovině, o ní už vycházely výklady. Cestovatelské deníky, rozjímání o tom, co viděli v Buchaře nebo Kábulu. Konsenzus nikdy nebyl dosažen, i když se objevily chvíle, kdy nějaké prchavé vítězství učinilo módním prohlašovat britskou či ruskou převahu.\n\nTeď se ale objevovalo jedno vyústění, které si ani jedna země nemohla hrdě přiznat. Velká hra jako bláznovství. Odtud už byl jen krůček k novému dramatu, hledání politika, na něhož by bylo možné svalit vinu." # todo: NEW TRANSLATION
 gg_core.3.a: "Příliš málo na to, aby stálo za to." # todo: NEW TRANSLATION
 gg_core.4.t: "Konec her" # todo: NEW TRANSLATION
 gg_core.4.d: "Velká hra, která kdysi považovala naše domovy za hřiště mezi cizími mocnostmi, byla ukončena. Poslední [SCOPE.sCountry('russia_scope').GetAdjective] a [SCOPE.sCountry('britain_scope').GetAdjective] síly opustily Střední Asii, vyhnány nikoli machinacemi druhého, ale našimi vlastními činy." # todo: NEW TRANSLATION
 gg_core.4.f: "V tento den se noviny daly snáze sehnat. Ministr jich nasbíral značnou sbírku - The Times z [SCOPE.sCountry('britain_scope').GetCapital.GetCityHubName], [SCOPE.sCountry('russia_scope').GetCapital.GetCityHubName] Record, Correspondent z Paříže. Minulý týden psaly o návratu vojenské výpravy. Tento týden o rezignaci jeho protějšku v [SCOPE.sCountry('britain_scope').GetAdjectiveNoFormatting]. Dvanáct menších zpráv, které napovídaly o jejich bolestivé realitě. Selhali a snažili se zachovat tvář. Mohou být pyšní a nechtít to vyslovit nahlas - ale on to věděl, a předpokládal, že i jejich vlastní lidé to vědí." # todo: NEW TRANSLATION
 gg_core.4.a: "Teď nás budou navždy oslovovat jako sobě rovné." # todo: NEW TRANSLATION
