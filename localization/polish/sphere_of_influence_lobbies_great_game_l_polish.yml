 je_maintain_afghan_protectorate: "Zajistit afghánský protektorát" # todo: NEW TRANSLATION
 je_maintain_afghan_protectorate_reason: "Horské pohraničí mezi Indickým subkontinentem a stepemi Střední Asie ukrývá klíč k vytvoření pevné a výhodné hranice proti našemu rivalovi. Abychom zajistili ochranu svých zájmů a trasu k útoku na naše protivníky, musíme získat stabilní [Concept('concept_subject', '$concept_subjects$')|l] v celém afghánském regionu." # todo: NEW TRANSLATION
