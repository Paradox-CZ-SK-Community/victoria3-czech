 russo_chinese.4.t: "Smlouva z Aigunu" # todo: NEW TRANSLATION
 russo_chinese.4.d: "Intenzivní vojenské posílení na Sibiři podnítilo jednání mezi diplomaty zastupujícími [ROOT.GetCountry.GetAdjective] a [SCOPE.sCountry('china_scope').GetAdjective] státy. Byla sestavena smlouva, která zajistí vzájemná navigační práva na řece Amur a předá území [SCOPE.sState('amur_scope').GetName] státu [ROOT.GetCountry.GetName]." # todo: NEW TRANSLATION
 russo_chinese.4.f: "\"Levý břeh řeky Amur, počínaje řekou Argun až k ústí řeky Amur, bude majetkem [ROOT.GetCountry.GetAdjectiveNoFormatting] státu, a pravý břeh po proudu až k řece Ussuri bude majetkem [SCOPE.sCountry('china_scope').GetAdjectiveNoFormatting] státu.\n\nOblasti a země od řeky Ussuri až k moři, až do vymezení hranice mezi oběma státy, budou společným majetkem [SCOPE.sCountry('china_scope').GetAdjectiveNoFormatting] a [ROOT.GetCountry.GetAdjectiveNoFormatting] států. Pouze plavidla [SCOPE.sCountry('china_scope').GetAdjectiveNoFormatting] a ruských států budou moci plout po Amuru, Sungari a Ussuri; plavidla všech ostatních cizích států tyto řeky nebudou plout...\"" # todo: NEW TRANSLATION
 russo_chinese.4.a: "Ať je to provedeno přesně a nedotknutelně, navěky." # todo: NEW TRANSLATION
 emu_war.1.t: "Válka s emu" # todo: NEW TRANSLATION
 emu_war.1.d: "[GetPopType('farmers').GetName] v [SCOPE.sState('westralia_state').GetName] si stěžují, že [SCOPE.gsInterestGroup('armed_forces_ig').GetName] je nedostatečně chrání. Jméno jejich nejhroznějšího nepřítele: Dromaius novaehollandiae." # todo: NEW TRANSLATION
 emu_war.1.f: "\"Připomeň mi znovu, proč nakládáme tolik nábojů na tuhle glorifikovanou honičku kachen.\"\n\n\"Kachny? Myslíš, že lovíme vodní ptactvo? Omyl, hlupáku. Kéž by ti Bůh pomohl, kdybys udělal chybu a měl se potkat s těmi drápy. A pokud jo, nebudu ti vracet vnitřnosti zpět.\" \n\n\"Dobře, dobře, sakra, chlape. Jen mi to připadá přehnané.\"" # todo: NEW TRANSLATION
 emu_war.1.a: "Dobrá, pošlete tam #italic někoho#!." # todo: NEW TRANSLATION
 emu_war.1.b: "Měli bychom jim taky vystavit formální deklaraci války?" # todo: NEW TRANSLATION
