 fund_lobbies_events.1.t: "Síť nedůvěry" # todo: NEW TRANSLATION
 fund_lobbies_events.1.d: "Příliv lobbystických peněz z [SCOPE.sCountry('relevant_country').GetAdjective] do [ROOT.GetCountry.GetAdjective] politiky výrazně zvýšil domácí napětí. Fámy a obvinění, že určité politické osobnosti jsou agenty [SCOPE.sCountry('relevant_country').GetAdjectiveNoFormatting], se staly běžnými." # todo: NEW TRANSLATION
 fund_lobbies_events.1.f: "\"Mám často pocit, že se dnes nedá nic udělat. Ptali se mě na nákup jednoho mého bratrance - ženy, kterou jsem potkal jen jednou.\"\n\n\"Kdo se ptal?\"\n\n\"Jeden z mužů z pokladny. Řekl jsem mu přesně to, co vám teď říkám.\"\n\n\"Jsou napjatí. Přisuzuji to tomu blbci dole. Stříbro z [SCOPE.sCountry('relevant_country').GetCapital.GetFarmHubName], a on to použil pro schůzku s ministrem? Pustili jsme ho k dobré věci a teď to kazí druhým.\"" # todo: NEW TRANSLATION
 fund_lobbies_events.1.a: "Jste [ROOT.GetCountry.GetAdjectiveNoFormatting], pane, nebo [SCOPE.sCountry('relevant_country').GetAdjectiveNoFormatting]?" # todo: NEW TRANSLATION
 fund_lobbies_events.1.b: "Kdo kdy slyšel o poctivém politikovi?" # todo: NEW TRANSLATION
 fund_lobbies_events.2.t: "Komu odpovídáte?" # todo: NEW TRANSLATION
 fund_lobbies_events.2.d: "Anonymní autor spojený s [SCOPE.gsInterestGroup('opposing_ig').GetCustom('IG_I_TT')] napsal polemiku útočící na vazby [SCOPE.gsInterestGroup('relevant_ig').GetCustom('IG_G_TT')] na [SCOPE.sPoliticalLobby('relevant_lobby').GetName]. Dokument je obviňuje ze stání na straně cizí zpravodajské služby [SCOPE.sCountry('relevant_country').GetAdjective]." # todo: NEW TRANSLATION # todo: NAME CASE
 fund_lobbies_events.2.f: "\"Máme sklony předpokládat nejlepší záměry, a to je atribut, který jsme poslední, kdo by odsoudil. Představme si svět bez [SCOPE.sCountry('relevant_country').GetNameNoFormatting] a tedy bez [SCOPE.sPoliticalLobby('relevant_lobby').GetNameNoFormatting]. V tom světě bychom věřili, že [SCOPE.gsInterestGroup('relevant_ig').GetLeader.GetCustom('getMsMr')] [SCOPE.gsInterestGroup('relevant_ig').GetLeader.GetLastNameNoFormatting] jedná plně poctivě.\n\n[SCOPE.gsInterestGroup('relevant_ig').GetLeader.GetSheHe|U] si zaslouží dobrý první dojem. Nicméně je na nás objektivně upozornit na nedostatky. Proto za každou korunu, kterou [SCOPE.gsInterestGroup('relevant_ig').GetLeader.GetSheHe] přijme od [SCOPE.sCountry('relevant_country').GetAdjectiveNoFormatting] ambasády, musíme upravit náš dobrý první dojem...\"" # todo: NEW TRANSLATION
 fund_lobbies_events.2.a: "Tyto pomluvy nemají místo ve společnosti." # todo: NEW TRANSLATION
 fund_lobbies_events.2.b: "Je to pravda, víte." # todo: NEW TRANSLATION
 fund_lobbies_events.2.c: "Vyšetřili jsme to sami a nenašli nic." # todo: NEW TRANSLATION
 fund_lobbies_events.3.t: "Důkaz pravdy" # todo: NEW TRANSLATION
 fund_lobbies_events.3.d: "Zprávy o penězích [SCOPE.sCountry('relevant_country').GetAdjective] končících v rukou domácích aktérů nakloněných k nim vedly [SCOPE.sPoliticalLobby('relevant_lobby').GetName] k sérii odsudků namířených proti oponentům." # todo: NEW TRANSLATION
 fund_lobbies_events.3.f: "Potvrzení bylo pocitem, který [SCOPE.gsInterestGroup('relevant_ig').GetLeader.GetLastNameNoFormatting] pociťoval čím dál častěji. Zprávy na jeho stole potvrdily to, co varoval roky - pronikání [SCOPE.sCountry('relevant_country').GetAdjectiveNoFormatting] vlivu do nejvyšších míst vedení. Rivalové [SCOPE.gsInterestGroup('relevant_ig').GetLeader.GetHerHis] se stali podezřelými a spojenci vnímáni jako chytré insidery.\n\nBude to vyžadovat práci. Tato potvrzení půjdou i jinam a jiní budou mít stejný nápad. Je to závod a kdo začne první, má velkou šanci vyhrát." # todo: NEW TRANSLATION
 fund_lobbies_events.3.a: "Získali statuse autority." # todo: NEW TRANSLATION
 fund_lobbies_events.3.b: "I rozbitý hodiny někdy ukazují správný čas." # todo: NEW TRANSLATION
 fund_lobbies_events.4.t: "Nad poměry" # todo: NEW TRANSLATION
 fund_lobbies_events.4.d: "[SCOPE.sCharacter('relevant_character').GetFullName], prominentní spojenec [SCOPE.sPoliticalLobby('relevant_lobby').GetName], byl nedávno spatřen žijící nad své možnosti. Oponenti tvrdí, že jeho životní styl je umořen dary od [SCOPE.sCountry('relevant_country').GetAdjective]." # todo: NEW TRANSLATION
 fund_lobbies_events.4.f: "Nové bydlení [SCOPE.sCharacter('relevant_character').GetFullNameNoFormatting] bylo ihned viditelné. Čerstvě vyleštěný štuk se lišil od opotřebovaných fasád sousedů, které vyzařovaly tichou důstojnost. U něj nic takového nebylo. Uspořádal bujarou hostinu, která splývala dny bez přestávky.\n\nPohled na to vyvolal otázku u všech pozorovatelů. Vznášela se v ovzduší, jasná a naléhavá. Jak je to možné?" # todo: NEW TRANSLATION
 fund_lobbies_events.4.a: "Zahajte vyšetřování zdroje tohoto bohatství." # todo: NEW TRANSLATION
 fund_lobbies_events.4.b: "Možná [SCOPE.sCharacter('relevant_character').GetSheHe] prostě udělal(a) nějaké dobré investice." # todo: NEW TRANSLATION
 fund_lobbies_events.4.c: "Proč by si někdo kdy zvolil být chudý?" # todo: NEW TRANSLATION
 character_sent_to_jail_tt: "[SCOPE.sCharacter('relevant_character').GetFullName] bude shledán vinným z korupce a uvězněn" # todo: NEW TRANSLATION
 character_exonerated_tt: "[SCOPE.sCharacter('relevant_character').GetFullName] bude zproštěn všech obvinění" # todo: NEW TRANSLATION
 fund_lobbies_events.5.t: "Nestydatý oportunismus" # todo: NEW TRANSLATION
 fund_lobbies_events.5.d: "S přílivem [SCOPE.sCountry('relevant_country').GetAdjective] peněz na lobbování pocítily prvky [SCOPE.gsInterestGroup('relevant_ig').GetCustom('IG_G_TT')] příležitost obohatit se a posílit svou moc. Začaly se přibližovat k [SCOPE.sPoliticalLobby('relevant_lobby').GetName]." # todo: NEW TRANSLATION # todo: NAME CASE
 fund_lobbies_events.5.f: "Malá část z nich si našla výmluvy. Ještě menší část si našla dobré výmluvy, eseje představující řetězce argumentů rozprostírající se na stovkách stran. Většina z nich to však neudělala. Tvrdili, že jejich volba byla ovlivněna přáteli, nebo zvěrstvy nepřátel [SCOPE.sCountry('relevant_country').GetNameNoFormatting], nebo jejich neomylným smyslem pro spravedlnost.\n\nAle proč tedy, ptali se jejich kritici, k této epifanii došli až nyní? Proč ne tehdy, když byly jejich pokladnice chudé a jediné, co měli, byly jejich zásady?\n\nNikdo z nich na to nedokázal odpovědět." # todo: NEW TRANSLATION
 fund_lobbies_events.5.a: "Měli by se stydět." # todo: NEW TRANSLATION
 fund_lobbies_events.5.b: "Je nejlepší předpokládat, že mají k tomu lepší důvod." # todo: NEW TRANSLATION
 fund_lobbies_events.5.c: "Pokud se naskytne příležitost - využijte ji!" # todo: NEW TRANSLATION
