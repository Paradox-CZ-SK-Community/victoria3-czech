 demand_return_of_koh_i_noor_desc: "Naši bývalí koloniální pánové odstranili legendární diamant Koh-i-Noor z Indie během své vlády a uložili jej do vlastních trezorů. Vydáme požadavek na vrácení uloupeného národního majetku."
