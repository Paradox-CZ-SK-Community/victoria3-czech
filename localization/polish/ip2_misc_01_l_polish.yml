 sepoy_mutiny_events.11.t: "Ctihodná Společnost"
 sepoy_mutiny_events.11.d: "Dobrovolná despotie [ROOT.GetCountry.GetName] vedla k výraznému zlepšení ve všech aspektech veřejného života. Okamžité riziko domorodého povstání bylo zdoláno a Společnost vládne pevně."
 sepoy_mutiny_events.11.f: ""Málo která vláda, i za mnohem příznivějších okolností, se pokusila o tolik pro blaho svých poddaných nebo realizovala tolik ze svých pokusů s úspěchem. Vláda cizinců nad lidem, který je nejvíce obtížné pochopit a ještě těžší zlepšit, má právo být na sebe hrdá za to, co dokázala; a rozhodně nelze obvinit, že nedosáhla více.\" \n\n— John Stuart Mill, #italic Memorandum of the Improvements in the Administration of India during the Last Thirty Years#!"
 sepoy_mutiny_events.11.a: "Na příkaz [ROOT.GetCountry.GetTopOverlord.GetRuler.GetPrimaryRoleTitle] a Parlamentu."
 sepoy_mutiny_events.11.b: "Ať naše vláda už nikdy není ohrožena."
