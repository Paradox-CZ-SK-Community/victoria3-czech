 CAN_USE_DOCTRINE_OF_LAPSE_INSTEAD: "Můžete místo toho použít [GetDiplomaticActionType('invoke_doctrine_of_lapse').GetName]"
 britain_might_abandon_india_tt: "Pokud vypukne [concept_civil_war], může se [ROOT.GetCountry.GetTopOverlord.GetName] rozhodnout #b opustit Indii#!"
 princely_state_lapsed_tt: "[SCOPE.sCountry('target_country').GetName] obdrží [Concept('concept_diplomatic_demand', '$concept_diplomatic_demand_short$')|l] o #b anexi#!"
 india_nationalism_events.1.t: "Anarchie"
 india_nationalism_events.1.d: "Nekontrolované neklidné dění v [SCOPE.sCountry('india_scope').GetName] vedlo k vypuknutí občanské války napříč indickým subkontinentem. Osobnosti z [ROOT.GetCountry.GetAdjective] společnosti navrhly opuštění rozpadajícího se subkontinentu svému osudu."
 india_nationalism_events.1.f: "[SCOPE.sCharacter('british_politician_scope').GetFullNameNoFormatting], starší politik a profesor orientalistiky, byl tázán na stav Indie a zda je naděje na obnovení vlády. Řekl:\n\n\"Jsou to starodávný národ, příliš starý na to, aby se naučil umění vládnutí. Vedeni svými takzvanými vůdci, je pro ně nejlepším výsledkem chaos. Byli jsme jejich dobrotivými vůdci; bez nás jsou zjevně ztraceni.\""
 india_nationalism_events.1.a: "Evakuujte náš personál a umyjte si ruce od této záležitosti."
 india_nationalism_events.1.b: "Indii jsme už uklidnili dříve. Stane se to znovu."
 india_nationalism_events.2.t: "Evakuace"
 india_nationalism_events.2.d: "Vypuknutí otevřené občanské války po celé Indii zlomilo odhodlání vlády [SCOPE.sCountry('overlord_scope').GetAdjective]. Nařídila zrušení naší správy a okamžitou evakuaci všech [SCOPE.sCountry('overlord_scope').GetAdjectiveNoFormatting] občanů z Indie."
 india_nationalism_events.2.f: "#bold [TimeKeeper.GetCurrentDate.GetString]#!\n#bold Imperial [ROOT.GetCountry.GetCapital.GetCityHubName] Gymkhana Club#!\nVšem členům,\nS velkým zármutkem Vás musím požádat opustit svou povinnost k Indii. Její nevděčný lid pohrdl rukou, která ho vychovala. Rozlučte se s našimi velkými díly a udělejte místo pro přístavy, které vybudovali naši předkové; odplujeme z nich naposledy."
 india_nationalism_events.2.a: "Spalte naše dokumenty a běžte k přístavům."
 india_nationalism_events.2.b: "Oznámíme oficiální předání moci [SCOPE.sCountry('revolution_scope').GetRuler.GetFullName]."
 india_nationalism_events.2.c: "Vyčleníme si vlastní území v [SCOPE.sState('calcutta_scope').GetCityHubName]."
