 notification_koh_i_noor_returned_desc: "Vláda [SCOPE.sCountry('koh_i_noor_owner_scope').GetAdjective] souhlasila s vrácením diamantu Koh-i-Noor [ROOT.GetCountry.GetNameNoFlag], jako symbolu usmíření mezi nimi a jejich bývalými koloniálními poddanými."
 notification_koh_i_noor_returned_tooltip: "#header $notification_koh_i_noor_returned_name$#!\n$TOOLTIP_DELIMITER$\n$notification_koh_i_noor_returned_desc$"
 notification_koh_i_noor_not_returned_name: "[SCOPE.sCountry('koh_i_noor_owner_scope').GetName] odmítá vrátit diamant Koh-i-Noor"
 notification_koh_i_noor_not_returned_desc: "Současní držitelé diamantu Koh-i-Noor v [SCOPE.sCountry('koh_i_noor_owner_scope').GetName] odmítli diamant vrátit a tvrdí, že jim náleží podle podmínek smlouvy podepsané s jeho předchozími vlastníky."
