 je_federation_of_india: "Federace Indie"
 je_federation_of_india_reason: "[SCOPE.GetRootScope.GetCountry.GetCustom('get_federation_of_india_intro_text')]\n\nDokud je tento [concept_journal_entry] aktivní, [concept_princely_state] [Concept('concept_subject', '$concept_subjects$')|l] s nízkým [concept_liberty_desire] a vysokými [concept_relations] budou občas žádat o přistoupení do [SCOPE.GetRootScope.GetCountry.GetCustom('get_federation_union')].\n\n#b Soukromá renta:#!\nBývalí vládci #b knížecích států#! budou mít nárok na státní důchod jako kompenzaci za přistoupení k [SCOPE.GetRootScope.GetCountry.GetCustom('get_federation_union')]. Platby $concept_privy_purse$ přidají #b Národní výdaje#! @money![GetPlayer.MakeScope.ScriptValue('privy_purse_multiplier_base')|D-] násobeno počtem #b knížecích států#! anektovaných pomocí tohoto [concept_journal_entry].[SCOPE.GetRootScope.GetCountry.GetCustom('get_federation_of_india_diploplay_text')]"
 je_federation_of_india_reason_intro_home_rule: "Podle podmínek #b Indického zákona o domácím vládnutí#! může jakýkoli #b knížecí stát#! žádat o přistoupení do [ROOT.GetCountry.GetName]."
 je_federation_of_india_reason_intro_independence: "Proces naší nezávislosti zanechal množství autonomních #b knížecích států#! roztroušených po subkontinentu. Pokud tyto koloniální pozůstatky neintegrujeme do [ROOT.GetCountry.GetNameNoFlag], jejich pokračující existence by mohla poskytnout záminku pro další rozdělení našeho národa."
 je_federation_of_india_reason_diploplay_info_tt: "\n\n@information! Nezávislé indické státy mohou být anektovány do [ROOT.GetCountry.GetName] prostřednictvím $dp_unify_india$ [concept_diplomatic_play]"
 privy_purse_payments_total_tt: "Naše současné platby [concept_privy_purse] činí @money![GetPlayer.MakeScope.ScriptValue('privy_purse_value')|D-]"
