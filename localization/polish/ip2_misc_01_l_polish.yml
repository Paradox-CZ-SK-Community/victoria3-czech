 princely_state_creation.1.t: "Agentura Balúčistán"
 princely_state_creation.1.d: "S akvizicí [SCOPE.sState('baluchistan_state').GetName] jsme zřídili Agenturu Balúčistán k koordinaci správy regionu. Byly předloženy návrhy na vrácení částí Balúčistánu do místní vlády."
 princely_state_creation.1.f: ""Jedno státové uspořádání by zvýšilo naši administrativní odpovědnost. Ať tito malí muži vládnou svým malým okresům. Mezitím se můžeme soustředit na posádky na hranicích. Zajistěte, aby žádné afghánské, perské ani ruské sny o přiblížení se k nám neuspěly."\n\n"Dejte pěti mužům pět států k vládnutí a vytvoříte pět vládců, kteří sní o jejich zjednocení. Indie už má více princů než celá Evropa, opravdu si přejete k tomu přidat další?""
 princely_state_creation.1.a: "Rozdělte jižní regiony našim věrným princům."
 princely_state_creation.1.b: "Rozdělte region, s kalátskou autoritou nad Makaranem."
 princely_state_creation.1.c: "Založte stát Kalat s devatenáctihlavňovým pozdravem."
 princely_state_creation.1.e: "Vysoký komisař může převzít plnou kontrolu nad provincií."
 princely_state_creation.2.t: "Získání Sindhu"
 princely_state_creation.2.d: "Před naší akvizicí [SCOPE.sState('sindh_state').GetName] byl region rozdělen mezi různé větve dynastie Talpur. Byly předloženy návrhy na zřízení knížecího státu v Sindhu pod poslušnými talpurskými vládci."
 princely_state_creation.2.f: ""Peccavi", zněl telegram. Adjutant pohlédl na svého nadřízeného a pozvedl obočí.\n\n\"Následuje zpráva: 'Peccavi'. Kódové slovo?\"\n\nDůstojník pohlédl vzhůru od hlášení, které četl. \"Zahrál jsem hřích\", řekl.\n\n\"Myslíš, že má Sindh?\"\n\n\"Ano, má Sindh.\"\n\n\"Rozumím.\""
 princely_state_creation.2.a: "Umožněte severní talpurské dynastii zůstat u moci."
 princely_state_creation.2.b: "Založte celý Sindh jako stát s devatenáctihlavňovým pozdravem."
 princely_state_creation.2.c: "Připojte celý Sindh k Bombyjské prezidenci."
 princely_state_creation.3.t: "Severozápadní hranice"
 princely_state_creation.3.d: "Naše získání [SCOPE.sState('pashtunistan_state').GetName] přiblížilo naši hranici k pohoří Pamír. Byly učiněny návrhy delegovat správu tohoto odlehlého regionu poslušným místním vládcům."
 princely_state_creation.3.f: ""Knížecí státy tak blízko nepřátelských hranic? Nezodpovědné a bláhové. Získali jsme území, tak ho udržme."\n\n"Stráž území a jeho správa jsou dvě různé záležitosti. Proč vynakládat muže a prostředky na řízení státu, když můžeme nechat místní vládce vládnout a nechat jejich daně financovat naše posádky?""
 princely_state_creation.3.a: "Udělete regionu autonomii věrným vládcům."
 princely_state_creation.3.b: "Rozšiřte území Chitralu na celé severní oblasti."
 princely_state_creation.3.c: "Místní vládci se ukázali jako nespolehliví."
 princely_state_creation.4.t: "Smlouva z Amritsaru"
 princely_state_creation.4.d: "Naše nově získaná provincie [SCOPE.sState('kashmir_state').GetName] byla kdysi mocným královstvím. Byly předloženy návrhy na zřízení nového, silného knížecího státu k správě regionu."
 princely_state_creation.4.f: ""Hindové nemají rádi Mohamedány, Mohamedáni nemají rádi Sikhy a Sikhové nemají rádi nikoho. Který princ by je všechny mohl zkrotit?\"\n\n\"Takže místo toho, abyste nechali nějakého bláhového prince, aby se je pokusil udržet v mezích, chcete, abychom to udělali my? Záleží vám tak málo na spánku?\""
 princely_state_creation.4.a: "Založte Džammú a Kašmír jako stát s jednadvaceti hlavňovým pozdravem."
 princely_state_creation.4.b: "Taková smlouva není nutná."
 princely_state_creation.5.t: "Šanské státy"
 princely_state_creation.5.d: "Nově získané [SCOPE.sState('shan_state').GetName] jsou organizovány jako složitá mozaika různých šanských knížectví. Byly předloženy návrhy je organizovat jako konfederaci knížecích států za stávajících forem vlády, se sdíleným rezidentem."
 princely_state_creation.5.f: ""Tyto pohraniční oblasti jsou velkým zdrojem příjmů, ale potížemi pro správu. Fragmentované a hornaté, potrvá to, než si naši lidé zvyknou na terén."\n\n"Možná můžeme inspirovat historii. Spojte šanské saofy do federace. Mohou vládnout, jak chtějí, pokud centrální fond dostane svou část. Jak čas půjde, naši správci se naučí cesty a federace už nebude potřeba.""
 princely_state_creation.5.a: "Udělejte jim autonomii pod jejich vlastními vládci se sdíleným rezidentem."
 princely_state_creation.5.b: "Začleňte je jako Šanský distrikt."
