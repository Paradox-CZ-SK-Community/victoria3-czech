 notification_combatting_hindu_german_conspiracy_name: "Zjištěno hindu-[SCOPE.sCountry('enemy_great_power_scope').GetName] spiknutí"
 notification_combatting_hindu_german_conspiracy_desc: "Naše zpravodajská služba v [SCOPE.sCountry('india_scope').GetName] odhalila spiknutí zahrnující indické revolucionáře spolupracující s agenty vlády [SCOPE.sCountry('enemy_great_power_scope').GetAdjective]. [SCOPE.sCountry('india_scope').GetAdjective] správa zahajuje razii, aby zadržela podezřelé."
 notification_combatting_hindu_german_conspiracy_tooltip: "#header $notification_combatting_hindu_german_conspiracy_name$#!\n$TOOLTIP_DELIMITER$\n$notification_combatting_hindu_german_conspiracy_desc$"
 notification_not_combatting_hindu_german_conspiracy_name: "Zjištěno hindu-[SCOPE.sCountry('enemy_great_power_scope').GetName] spiknutí"
 notification_not_combatting_hindu_german_conspiracy_desc: "Naše zpravodajská služba v [SCOPE.sCountry('india_scope').GetName] odhalila spiknutí zahrnující indické revolucionáře spolupracující s agenty vlády [SCOPE.sCountry('enemy_great_power_scope').GetAdjective]. [SCOPE.sCountry('india_scope').GetAdjective] správa byla v prověřování méně aktivní."
