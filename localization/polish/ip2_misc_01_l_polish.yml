 invite_princely_states_cooldown_tt: "Neprovedeno v posledním #b roce#!"
 je_federation_of_india_invite_princely_states: "Pozvat knížecí státy"
 je_federation_of_india_invite_princely_states_desc: "Podle naší ústavy se jakýkoli knížecí stát, který si přeje přistoupit k [ROOT.GetCountry.GetNameNoFlag], může tak učinit. Pokud chceme, můžeme tento proces urychlit hromadným pozváním těch knížecích států, které udržují obzvlášť dobré vztahy s námi."
 federation_of_india.1.t: "[SCOPE.sCountry('india_scope').GetNameNoFlag] nabízí přistoupení"
 federation_of_india.1.d: "Vláda [SCOPE.sCountry('india_scope').GetNameNoFlag] formálně pozvala [ROOT.GetCountry.GetName] k přistoupení k [SCOPE.sCountry('india_scope').GetCustom('get_federation_union')] [SCOPE.sCountry('india_scope').GetNameNoFormatting]. Zatímco [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] a jeho rodina obdrží státní přídavek, jejich čas jako nezávislého vládce skončí."
 federation_of_india.1.f: ""Já, _______, vládce _______, ve výkonu své suverenity nad mým státem tímto vykonávám tento nástroj přistoupení a,\n\n1. tímto prohlašuji, že přistupuji k [ROOT.GetCountry.GetCustom('get_federation_union')] $BHT$ s úmyslem, že [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle], Federální zákonodárný sbor, Federální soud a jakýkoli jiný orgán založený pro účely [ROOT.GetCountry.GetCustom('get_federation_union')] budou, z titulu tohoto mého nástroje přistoupení, ale vždy za podmínek zde uvedených, vykonávat ve vztahu ke státu _______.""
 federation_of_india.1.a: "Podepsat instrument přistoupení."
 federation_of_india.1.b: "Naše suverenita se nedá koupit."
 federation_of_india.2.t: "Indie nedělitelná"
 federation_of_india.2.d: "Poslední z knížecích států byly začleněny do [SCOPE.sCountry('india_scope').GetCustom('get_federation_union')]. Autorita [ROOT.GetCountry.GetName] nyní zasahuje po celém subkontinentu."
 federation_of_india.2.f: ""Jsi vládcem myslí všech lidí,\nrozhodovatelem osudu Indie.\nTvé jméno povzbuzuje srdce Paňdžábu, Sindhu, Gudžarátu a Marathy,\nDravidy, Orissy a Bengálska.\nZní v horách Vindhya a Himálaje, mísí se s hudbou Jamuny a Gangy\na zpívají jej vlny Indického oceánu.\nModlí se za tvé požehnání a zpívají tvou chválu.\nZáchrana všech lidí spočívá ve tvé ruce,\nty, rozhodovatel osudu Indie.\nVítězství, vítězství, vítězství tobě.\"\n\n— Rabindranath Tagore, \"Jana Gana Mana\""
 federation_of_india.2.a: "Vítězství, vítězství, vítězství tobě!"
 federation_of_india.3.t: "Žádný kompromis"
 federation_of_india.3.d_cr: "Vzestup komunistické vlády v [ROOT.GetCountry.GetName] způsobil kolaps vztahů se zbylými knížecími státy. Pokud tyto koloniální pozůstatky mají být smazány z mapy, bude to čelem k bodu bajonetu."
 federation_of_india.3.d_infamy: "Agrese [ROOT.GetCountry.GetAdjective] vlády způsobila kolaps vztahů se zbylými knížecími státy. Pokud mají být integrovány do [SCOPE.sCountry('india_scope').GetCustom('get_federation_union')], bude to čelem k bajonetu."
 federation_of_india.3.f: ""Povaha vlády, která se prohlašuje, že reprezentuje celou Indii, je zásadně neslučitelná s povahou státu [SCOPE.sCountry('relevant_country').GetNameNoFormatting]. Prokázala, že není ochotna dosáhnout rovnocenných dohod s ostatními indickými státy. Obávám se, že bez zásadní změny diplomatické politiky vlády [ROOT.GetCountry.GetRuler.GetLastNameNoFormatting] nemůže žádná strana dosáhnout konstruktivního a trvalého urovnání ohledně [ROOT.GetCountry.GetCustom('get_federation_union')].\n\nProhlašuji proto, já, suverén [SCOPE.sCountry('relevant_country').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('relevant_country').GetNameNoFormatting], v souladu s ostatními panovníky indických států, své nepřítomné přistoupení k [ROOT.GetCountry.GetCustom('get_federation_union')] dokud nebude dosaženo spravedlivého řešení.""
 federation_of_india.3.a: "Indie bude jednotná, perem nebo mečem."
 federation_of_india.3.b: "Revoluce v hedvábných rukavicích neexistuje."
 federation_of_india.4.t: "[SCOPE.sCountry('relevant_princely_state').GetName] žádá o přistoupení"
 federation_of_india.4.d: "[SCOPE.sCountry('relevant_princely_state').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('relevant_princely_state').GetNameNoFlag] požádal o přistoupení svého státu k [ROOT.GetCountry.GetCustom('get_federation_union')] $BHT$."
 federation_of_india.4.f: ""Já, [SCOPE.sCountry('relevant_princely_state').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('relevant_princely_state').GetRuler.GetLastNameNoFormatting], vládce [SCOPE.sCountry('relevant_princely_state').GetNameNoFormatting], v výkonu své suverenity nad mým státem tímto vykonávám tento nástroj přistoupení a,\n\n1. tímto prohlašuji, že přistupuji k [ROOT.GetCountry.GetCustom('get_federation_union')] $BHT$ s úmyslem, že [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle], Federální zákonodárný sbor, Federální soud a jakýkoli jiný orgán založený pro účely [ROOT.GetCountry.GetCustom('get_federation_union')] budou, z titulu tohoto mého nástroje přistoupení, ale vždy za podmínek zde uvedených, vykonávat ve vztahu ke státu [SCOPE.sCountry('relevant_princely_state').GetNameNoFormatting].\""
 federation_of_india.4.a: "Moudrá volba."
 federation_of_india.4.b: "Nemáme potřebu dalšího území."
