 india_colonial_government: "Koloniální guvernéři"
 je_india_nationalism: "Indický národ"
 je_india_nationalism_reason: "Zánik dobré vůle mezi umírněnými nacionalistickými vůdci a koloniální vládou [ROOT.GetCountry.GetTopOverlord.GetAdjectiveNoFormatting] vedl k radikalizaci indického národního hnutí směrem k #b úplné nezávislosti#!. Ti, kteří zůstali oddáni cíli [SCOPE.gsInterestGroup('government_scope').GetName], se obávají, že pokud nebudou učiněny mimořádné kroky, bude [ROOT.GetCountry.GetName] brzy #bold učiněn neovladatelným#!."
 india_independent_tt: "#v India#! dosáhla pokojně nezávislosti"
 india_independence_movement_defeated_tt: "#b Indické národní hnutí#! se stalo politicky irelevantním"
 modifier_syrian_ambitions: "Ambice v Sýrii"
 invoke_doctrine_of_lapse: "Uplatnit doktrínu vypršení"
