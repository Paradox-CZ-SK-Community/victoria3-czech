 india_nationalism_events.6.t: "India League"
 india_nationalism_events.6.d_1: "Indičtí nacionalisté žijící v [ROOT.GetCountry.GetCapital.GetCityHubName] založili India League, organizaci věnující se obhajobě indické nezávislosti. Členství Ligy zahrnuje několik členů parlamentu ze strany [SCOPE.sParty('india_league_party').GetName]."
 india_nationalism_events.6.d_2: "Indičtí nacionalisté žijící v [ROOT.GetCountry.GetCapital.GetCityHubName] založili India League, organizaci věnující se obhajobě indické nezávislosti. Mezi členy jsou i prominentní politické osobnosti jako [SCOPE.sCharacter('india_league_character').GetFullName]."
 india_nationalism_events.6.f: ""Johne, byl jsem na odpoledním čaji s dámami a mladá žena k nám přišla s nejzajímavější peticí. Zpočátku jsem si myslel, že jde o nějaký žert od Emmy. Víš, jaké má nápady. Ale zdá se, že ta žena to myslela vážně. Řekla, že je součástí India League a prosazuje nezávislost Indie. Když bylo jasné, že to není žert, zeptali jsme se, kdo podle nich povede Indii. Jako by to celé nebylo směšné, navrhli, že by se měli vést sami!\n\nNevím, kde ti mladí berou ty nápady. Předpokládám, že je to cena za to, že některé ty Indy necháme studovat a pracovat zde!\""
 india_nationalism_events.6.a: "Ušlechtilá věc."
 india_nationalism_events.6.b: "Jak... zvláštní z jejich strany."
 india_nationalism_events.7.t: "Stav Indie"
 india_nationalism_events.7.d: "India League vydala zprávu o podmínkách v [SCOPE.sCountry('india_scope').GetName], zdůrazňující extrémní chudobu a represivní politiky vůči nacionalistickým aktivistům."
 india_nationalism_events.7.f: "Důstojník se zadíval na telegram na svém stole, úšklebek mu cukl koutkem úst. Guvernérní generál mu psal, že si stěžuje na India League a jejich rozsáhlý dokument o zacházení s Indy v Indii. Guvernér byl rozzuřen, že Ministerstvo vnitřních věcí Ligu nechalo dýchat. Guvernér měl svá sympatie, ale důstojník se nemohl ubránit smíchu. Přeci jen, indický lid zná svou situaci. Co hodlá Liga dosáhnout? Jen zrádce by je podporoval. Že jim dovolili studovat v této velké zemi, bylo už dost laskavé."
 india_nationalism_events.7.a: "S tím je třeba něco udělat."
 india_nationalism_events.7.b: "Naříděte zákaz jejich práce v Indii."
 notification_prisoner_out_of_jail_name: "[SCOPE.sCharacter('prisoner_scope').GetFullName] propuštěn z vězení"
 notification_prisoner_out_of_jail_desc: "[SCOPE.sCharacter('prisoner_scope').GetFullName], dříve zatčený za činnost související s [SCOPE.sCharacter('prisoner_scope').GetHerHis] politickými aktivitami, byl propuštěn z vězení."
