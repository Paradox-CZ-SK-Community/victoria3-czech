 je_india_home_rule: "Domácí vládnutí Indie"
 je_india_home_rule_reason: "Napříč [SCOPE.sCountry('india_scope').GetName] roste národní vědomí mezi domorodým indickým obyvatelstvem. Indičtí rodáci vzdělaní ve školách [SCOPE.sCountry('overlord_scope').GetAdjectiveNoFlag] a zaměstnaní koloniální správou začínají požadovat rovnoprávný status v impériu, větší ekonomické příležitosti a konečné zavedení domácí vlády pro celou Indii.\n\nDokud je tento [concept_journal_entry] aktivní, budeme mít možnost žádat [SCOPE.sCountry('overlord_scope').GetName] o větší autonomii a další místní reformy. Šance, že tyto petice budou přijaty, závisí na stavu #bold ukazatele postupu#!."
 je_india_nationalism_britain: "Indické národní hnutí"
 je_india_nationalism_britain_reason: "Napříč [SCOPE.sCountry('india_scope').GetName] roste národní vědomí mezi domorodým indickým obyvatelstvem. Indičtí rodáci vzdělaní ve školách [SCOPE.sCountry('overlord_scope').GetAdjectiveNoFlag] a zaměstnaní koloniální správou začínají požadovat rovnoprávný status v institucích impéria, větší ekonomické příležitosti a samosprávu pro Indii.\n\nDokud je tento [concept_journal_entry] aktivní, bude mít [SCOPE.sCountry('india_scope').GetAdjective] národní hnutí možnost nám podávat žádosti o větší autonomii a další místní reformy. Následky odmítnutí těchto žádostí závisí na stavu #bold ukazatele postupu#!.\n\n@warning! Pokud se [Concept('concept_activism','$concept_activism_short$')|l] indického národního hnutí příliš zvýší, hnutí se přesměruje k #bold úplné nezávislosti#!."
 preserve_british_rule_forever_tt: "Zachovat [ROOT.GetCountry.GetAdjective] vládu nad #v $BHT$#! co nejdéle"
 india_home_rule_events.1.t: "Zákon o domácím vládnutí Indie"
 india_home_rule_events.1.d: "Po dlouhém období reforem a jednání s domorodými indickými vůdci schválil Parlament [ROOT.GetCountry.GetTopOverlord.GetAdjective] zákon reorganizující bývalý Raj na Dominion Indie."
 india_home_rule_events.1.f: ""Od tohoto dne dále bude kolonie Indie, která byla pod přímou korunovou správou, tvořit Dominion Indie. Tento Dominion, pod korunou Spojeného království Velké Británie, bude mít vlastní zákonodárnou pravomoc, pokud tím nebude narušena, odporována nebo protirečena autorita samotné koruny.""
 india_home_rule_events.1.a: "Využili jsme příležitost."
 south_asian_primary_cultures_tt: "Všechny #bold jihoasijské#! [Concept('concept_culture', '$concept_cultures$')|l] s [Concept('concept_homeland','$concept_homelands$')|l] v naší zemi se stanou [concept_primary_cultures]"
 india_home_rule_events.2.t: "Indická správa žádá vládní reformu"
 india_home_rule_events.2.d: "Tváří v tvář tlaku ze strany indického národního hnutí požádala vláda [SCOPE.sCountry('india_scope').GetName] o naše schválení uskutečnit demokratické volby do pozic v indické administraci."
 india_home_rule_events.2.f: "Žádost byla uvítána v Sněmovně lordů s jistým pobavením.\n\"K volbám,\" poznamenal jeden lord, \"je třeba umět číst. Jak očekává indická správa, s jejími otřesnými mírami gramotnosti, že lidé rozeznají mezi Rajem a Ramem?\""
 india_home_rule_events.2.a: "Indové nejsou schopni odpovědné vlády."
 india_home_rule_events.2.b: "Nezbytný krok k stabilizaci naší správy."
 india_home_rule_events.2.c: "Vypracujte reformu sami a přikážete ji vykonat."
 india_home_rule_events.3.t: "Mučednictví"
 india_home_rule_events.3.d: "Uprostřed pokojného protestu v [SCOPE.sState('jallianwala_bagh_state').GetFarmHubName] proti naší potlačovací politice indického národního hnutí jednotka [ROOT.GetCountry.GetAdjective] armády pod velením [SCOPE.sCharacter('dyer_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('dyer_scope').GetFullName] otevřela palbu na dav. Stovky Indů byly zabity a tisíce zraněny."
 india_home_rule_events.3.f: ""Události v [SCOPE.sState('jallianwala_bagh_state').GetFarmHubName] možná utišily rebelianty ve městě, ale vyvolaly národní pobouření.\n\nKdekoli jdu, vidím lidi protestovat, jednotní. Všichni opakují stejné slovo, jedno slovo, 'Azadi', 'Svoboda'.""
 india_home_rule_events.3.a: "To musí být okamžitě zakryto."
 india_home_rule_events.4.t: "Klesající spirála"
 india_home_rule_events.4.d: "Navzdory našim snahám situaci zadržet se zpráva o masakru v [SCOPE.sState('jallianwala_bagh_state').GetFarmHubName] rozšířila po celé [SCOPE.sState('jallianwala_bagh_state').GetName]. V hlavních městech začaly propukávat nepokoje, když Indové protestují proti vraždám."
 india_home_rule_events.4.f: "V reakci na potlačení amritsarského povstání v neděli se lid Indie vydal do pouličních nepokojů.\n\n\"Preč s britským imperialismem! Preč s britskými špinavými psy!\", křičeli na britské úředníky na cestě do práce v pondělí ráno."
 india_home_rule_events.4.a: "Zadržte [SCOPE.sCharacter('dyer_scope').GetLastName] a přislibte, že bude vykonána spravedlnost."
 india_home_rule_events.4.b: "Vyslat armádu k uklidnění nepokojů."
 india_home_rule_events.4.c: "Nasadit letectvo k rozehnání davů."
 india_home_rule_events.5.t: "Vyšetřovací výbor pro nepokoje"
 india_home_rule_events.5.d: "S narůstajícím pobouřením nad činy [SCOPE.gsInterestGroup('army_ig').GetName] byl ustaven vládní výbor k prošetření masakru v [SCOPE.sState('jallianwala_bagh_state').GetFarmHubName]. Rozhovor s [SCOPE.sCharacter('dyer_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('dyer_scope').GetLastName] odhalil [SCOPE.sCharacter('dyer_scope').GetHerHis] údajnou motivaci - zachovat [SCOPE.sCharacter('dyer_scope').GetHerHis] čest."
 india_home_rule_events.5.f: ""Myslíte, že jste mohl rozptýlit dav bez palby?\"\n\n\"Kdybych je rozehnal bez palby a oni se vrátili, vypadal bych jako blázen. Smáli by se mi.\"\n\n\"Předpokládejme, že průchod do zahrady byl dostatečný pro průjezd obrněných vozů, otevřel byste s kulomety palbu?\"\n\n\"Myslím, že pravděpodobně ano.\"\n\n\"V tom případě by byly oběti mnohem vyšší?\"\n\n\"Ano.\""
 india_home_rule_events.5.a: "Okamžitě odvolat [SCOPE.sCharacter('dyer_scope').GetLastName] do [ROOT.GetCountry.GetTopOverlord.GetCapital.GetCityHubName]."
 india_home_rule_events.5.b: "Tento muž musí být potrestán."
 dyer_returns_home_tt: "[SCOPE.sCharacter('dyer_scope').GetLastName] bude ponechán rezignovat bez trestu a vrátí se do [ROOT.GetCountry.GetTopOverlord.GetName] se zachovanou ctí"
 dyer_disgraced_tt: "[SCOPE.sCharacter('dyer_scope').GetLastName] bude zbaven(a) hodnosti a vyznamenání a deportován(a) zpět do [ROOT.GetCountry.GetTopOverlord.GetName]"
 india_home_rule_events.6.t: "Návrat domů"
 india_home_rule_events.6.d: "Bývalý brigádní generál [SCOPE.sCharacter('dyer_scope').GetLastName] se vrátil do [ROOT.GetCountry.GetName] po skončení vyšetřování masakru v [SCOPE.sState('jallianwala_bagh_state').GetFarmHubName]. [SCOPE.sCharacter('dyer_scope').GetCustom('dyer_fate')]"
 india_home_rule_events.6.f: "Ve výčepu nikdo neočekával, že bude panující nálada v pátek tak rozpolcená; pro jednu skupinu ten den nebyla žádná hra. Přesto byl předmět [SCOPE.sCharacter('dyer_scope').GetFullNameNoFormatting] všechny rozházel. Polovina tam byla pro jeho hanobení; nazývali ho řezníkem Pundžábu. Druhá polovina se snažila vybrat peníze na meč cti a pouzdro na peníze, které nějaký novinář plánoval dát [SCOPE.sCharacter('dyer_scope').GetLastNameNoFormatting] příští týden."
 india_home_rule_events.6.a: "Můžeme považovat tuto záležitost za uzavřenou."
 india_home_rule_events.6.b: "Sbírka a meč? Jak zvrácené to je?"
 india_home_rule_events.7.t: "Indické národní hnutí"
 india_home_rule_events.7.d: "Nacionální vědomí v Indii začíná růst mezi [ROOT.GetCountry.GetAdjective]-vzdělanými [SCOPE.gsInterestGroup('intelligentsia_ig').GetName] a [SCOPE.gsInterestGroup('petty_bourgeoisie_ig').GetName], jejichž ekonomické zájmy se dostávají do rozporu s [ROOT.GetCountry.GetAdjectiveNoFormatting] podniky. Jejich požadavky sahají od větší samosprávy až po úplnou nezávislost."
 india_home_rule_events.7.f: "Když jsem šel do skladu, našel jsem cestu zatarasenou všemi dělníky. Nezaútočili, ale jejich záměr byl jasný, dnes se nic neudělá. Uvědomil jsem si svou slabost, odstoupil a dal si druhý šálek čaje. Tam jsem slyšel dva dělníky, muže, kteří mi dříve sloužili.\n\n\"Žádali jsme o jídlo a oni nás nechali hladovět. Žádali jsme, abychom byli vyslyšeni, a umlčeli nás kulkami. A přesto po nás chtějí, abychom sloužili? Abychom poslouchali? Už ne. Uvidíme, co udělají bez Indů.\""
 india_home_rule_events.7.a: "Musíme to pozorně sledovat."
 india_home_rule_events.7.b: "Jejich požadavky mohou mít určité opodstatnění."
 independence_lobby_formed_tt: "[SCOPE.sPoliticalLobby('relevant_lobby').GetName] byla založena a podporuje větší autonomii od [ROOT.GetCountry.GetOverlord.GetName]"
 india_home_rule_events.8.t: "Indické národní hnutí"
 india_home_rule_events.8.d: "Národní vědomí v Indii začíná růst mezi našimi domorodými [SCOPE.gsInterestGroup('intelligentsia_ig').GetName] a [SCOPE.gsInterestGroup('petty_bourgeoisie_ig').GetName], jejichž ekonomické zájmy se střetávají s podniky [ROOT.GetCountry.GetAdjectiveNoFormatting]. Jejich požadavky sahají od samosprávy po úplnou nezávislost."
 india_home_rule_events.8.f: "#bold Indičtí poddaní se stávají zrádnými! Volají po úplné nezávislosti#!\n\nZatímco mnoho byrokratů zůstává věrno britské vládě, veřejnost se obrátila proti ní. Mnozí ospravedlňují svůj zrádný úmysl tvrzením, že samospráva je jejich vrozené právo.\n\nSněmovna lordů debatovala záležitost. Někteří věří, že jde o přirozené eskalování po neúspěchu debat o Domácím vládnutí. Jiní tvrdí, že je to práce několika rebelujících podněcovatelů. Jeden člen, který si přál zůstat v anonymitě, řekl: \"[SCOPE.gsInterestGroup('intelligentsia_ig').GetLeader.GetFullNameNoFormatting] nevede Indii k způsobilé samosprávě. Britský Raj musí pokračovat, pevný a neochvějný ve své správě spravedlnosti všem lidem.\""
 india_home_rule_events.8.a: "Pečlivě to sledujte."
 india_home_rule_events.8.b: "Vzpírají se odpovědné vládě samé."
 affect_bar_india_policies_tt: "Dokud je #v $je_india_nationalism_britain$#! [concept_journal_entry] aktivní, můžeme obdržet žádosti o reformy od [SCOPE.sCountry('india_scope').GetName]"
 india_home_rule_events.9.t: "Reformy Montagu–Chelmsford"
 india_home_rule_events.9.d: "V reakci na rostoucí národní agitaci proti vládě [SCOPE.sCountry('overlord_scope').GetAdjective'] autorizovala [SCOPE.sCountry('overlord_scope').GetAdjectiveNoFormatting] řadu vládních reforem v [ROOT.GetCountry.GetName]. Zřizují několik volených orgánů, které pomohou při správě Indie."
 india_home_rule_events.9.f: ""KDEŽTO je deklarovanou politikou Parlamentu umožnit stále větší zapojení Indů do každé části indické správy a postupný rozvoj samosprávných institucí, s cílem postupného uskutečnění odpovědné vlády v [SCOPE.sCountry('overlord_scope').GetAdjectiveNoFormatting] Indii jako nedílné části impéria:\nA jelikož pokrok v uplatňování této politiky lze dosáhnout jen postupnými kroky, je vhodné nyní podniknout podstatné kroky v tomto směru...\""
 india_home_rule_events.9.a: "Projev dobrotivosti."
 india_home_rule_events.9.b: "Příliš málo a příliš pozdě."
 simon_commission_in_ten_years_tt: "Za #v 10#! let posoudí [SCOPE.sCountry('overlord_scope').GetAdjective] vládní komise výsledky těchto reforem"
 india_home_rule_events.10.t: "Indická statutární komise"
 india_home_rule_events.10.d_1: "Vláda se rozhodla okamžitě vyslat komisi do [SCOPE.sCountry('india_scope').GetName] k projednání ústavní reformy. Vznikly politické rozpory ohledně toho, zda by komise měla mít indické členy."
 india_home_rule_events.10.d_2: "Jak bylo naplánováno, vláda začala sestavovat komisi, kterou pošle do [SCOPE.sCountry('india_scope').GetName] diskutovat ústavní reformu. Vznikly politické rozpory ohledně toho, zda by komise měla mít indické členy."
 india_home_rule_events.10.f: ""Jak můžete navrhnout takový krok? Pokud máme tvrdit, že jim přejeme vládnout sami sobě, musíme jim dát příležitost ukázat, že na to mají.\"\n\n\"Musíte vidět, že pokud je zahrneme, celý účel Komise bude ohrožen. Stane se z ní nejednotné těleso, rozdělené stranicky a nábožensky. Když dáte dvěma Indům jakýkoli řídící orgán, vrátí se se třemi názory a monoklem.\"\n\n\"Kandidáti, které jsem shromáždil, jsou všichni vzdělaní v Oxfordu, pane. Pokud je to pravda, vina je jen na nás.\""
 india_home_rule_events.10.a: "Jsou to [ROOT.GetCountry.GetAdjectiveNoFormatting] poddaní a budou mít [ROOT.GetCountry.GetAdjectiveNoFormatting] komisi."
 india_home_rule_events.10.b: "Indický lid musí mít roli ve své vlastní vládě."
 ideology_sympathetic_to_indians_tt: "Vedoucí [concept_leader] tohoto [concept_interest_group] má [concept_ideology] sympatizující s #v indickou#! věcí"
 commission_sent_conservative_tt: "Do [SCOPE.sCountry('india_scope').GetName] bude vyslána výhradně bílá komise ke zvážení ústavní reformy"
 commission_sent_liberal_tt: "Do [SCOPE.sCountry('india_scope').GetName] bude vyslána společná [ROOT.GetCountry.GetAdjectiveNoFormatting]-indická komise ke zvážení ústavní reformy"
 india_home_rule_events.11.t: "Komise [SCOPE.sCharacter('simon_scope').GetLastNameNoFormatting]"
 india_home_rule_events.11.d_1: "Vláda [SCOPE.sCountry('overlord_scope').GetAdjective] vyslala komisi do [ROOT.GetCountry.GetCapital.GetCityHubName], aby zhodnotila potřebu další ústavní reformy v Indii. Bylo pozváno několik místních indických vůdců, aby se komise zúčastnili."
 india_home_rule_events.11.d_2: "Vláda [SCOPE.sCountry('overlord_scope').GetAdjective] vyslala komisi do [ROOT.GetCountry.GetCapital.GetCityHubName], aby zhodnotila potřebu další ústavní reformy v Indii. Celá evropská komise vyvolala nespokojenost mezi indickými nacionalisty."
 india_home_rule_events.11.f_1: "Britové poslali sedm mužů, tři z nich byli Indové. Mnozí z Kongresu byli šokováni, když zpráva dorazila do [ROOT.GetCountry.GetCapital.GetCityHubName]. Umírnění vítali toto jako vítězství a už si představovali rovné postavení pod vlastním parlamentním systémem. Radikálové poukázali na to, že symbolická indická přítomnost na Komisi může sloužit jen vládním záměrům, zmírnit protesty na přijatelné úrovni a pak nadějný lid zradit. Poprvé za několik let se přístup jevil opravdu nejistý."
 india_home_rule_events.11.f_2: "Policie vyčistila přístav, ale cesty ven byly ztracené. Černé prapory lemovaly ulice, opatřené nacionalistickými slogany a požadavky, aby komisaři odešli zpátky do [SCOPE.sCountry('overlord_scope').GetCapital.GetCityHubName]. Kousek ovoce dopadl na vedoucí automobil a přilepil se na okno. Pro ty uvnitř pomalu kapající šťávy vypadaly jako krev."
 india_home_rule_events.11.a: "Možná z toho něco vzejde."
 india_home_rule_events.11.b: "Vyhlásíme bojkot tohoto urážlivého představení."
 india_home_rule_events.11.c: "Krok vpřed pro [SCOPE.sCountry('overlord_scope').GetAdjectiveNoFormatting]-indické vztahy."
 india_home_rule_events.11.e: "Vynechá se z toho něco?"
 india_home_rule_events.11.g: "Nespokojíme se s ničím menším než plnou nezávislostí!"
