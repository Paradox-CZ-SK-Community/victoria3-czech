 british_dictates.1.t: "[SCOPE.sCountry('overlord_scope').GetAdjectiveNoFormatting] Nařízení"
 british_dictates.1.d: "[SCOPE.GetRootScope.GetCountry.GetCustom('india_governing_body')] v [SCOPE.sCountry('overlord_scope').GetCapital.GetCityHubName] vydal pokyny, abychom zvýšili počet [SCOPE.GetRootScope.GetCountry.GetCustom('eic_plantation_type')] v [ROOT.GetCountry.GetName]."
 british_dictates.1.f: "Pro oči [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetLastNameNoFormatting],\n\nmám tu čest Vás informovat, pro vědomost ctihodného [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle], že po období jednání s [SCOPE.GetRootScope.GetCountry.GetCustom('india_oversight_board')] vydal [SCOPE.GetRootScope.GetCountry.GetCustom('india_governing_body')] následující soupis směrnic, aby objasnil své současné priority v Indii. Pro více informací prosím nahlédněte do přiložených směrnic.\n\nPodepsán,\n[SCOPE.sCharacter('board_of_control_character').GetFullNameNoFormatting]\n[SCOPE.GetRootScope.GetCountry.GetCustom('india_oversight_board')]"
 british_dictates.1.a: "Začneme ihned."
 british_dictates.1.b: "To není v našich současných možnostech."
 british_dictates.2.t: "[SCOPE.sCountry('overlord_scope').GetAdjectiveNoFormatting] Nařízení"
 british_dictates.2.d: "Vzhledem k současnému válečnému stavu, kterému čelí [SCOPE.sCountry('overlord_scope').GetName], vydal [SCOPE.GetRootScope.GetCountry.GetCustom('india_governing_body')] pokyny, abychom rozšířili velikost našeho stálého vojska."
 british_dictates.2.f: "Pro oči [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetLastNameNoFormatting],\n\nmám tu čest Vás informovat, pro vědomost ctihodného [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle], že [SCOPE.GetRootScope.GetCountry.GetCustom('india_governing_body')] vydal následující soupis směrnic, aby objasnil své současné priority v Indii. Pro více informací prosím nahlédněte do přiložených směrnic.\n\nPodepsán,\n[SCOPE.sCharacter('board_of_control_character').GetFullNameNoFormatting]\n[SCOPE.GetRootScope.GetCountry.GetCustom('india_oversight_board')]"
