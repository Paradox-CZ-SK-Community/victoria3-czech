 british_dictates.3.f: "Pro oči [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetLastNameNoFormatting],\n\nmám tu čest Vás informovat, pro vědomost ctihodného [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle], že [SCOPE.GetRootScope.GetCountry.GetCustom('india_governing_body')] vydal následující soupis směrnic, aby objasnil své současné priority v Indii. Pro více informací prosím nahlédněte do přiložených směrnic.\n\nPodepsán,\n[SCOPE.sCharacter('board_of_control_character').GetFullNameNoFormatting]\n[SCOPE.GetRootScope.GetCountry.GetCustom('india_oversight_board')]"
 british_dictates.3.a.1: "Začneme ihned."
 british_dictates.3.a.2: "Požadavky [SCOPE.GetRootScope.GetCountry.GetCustom('india_governing_body')] převažují nad potřebou [ROOT.GetCountry.GetLawBeingEnacted.GetName]."
 british_dictates.3.b: "Nyní není nejlepší čas pro toto."
