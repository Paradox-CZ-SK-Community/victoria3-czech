 TITLE_LADY: "Lady"
 TITLE_LORD: "Lord"
 india_events.2.t: "Delhijský Durbar"
 india_events.2.d: "Správa [ROOT.GetCountry.GetTopOverlord.GetAdjective] plánuje velký durbar v [SCOPE.sState('delhi_scope').GetCityHubName], aby oficiálně prohlásila [SCOPE.sCharacter('monarch_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('monarch_scope').GetFullName] za [SCOPE.sCharacter('monarch_scope').GetCustom('getEmpressEmperor')] Indie. Důstojníci z celé [ROOT.GetCountry.GetTopOverlord.GetAdjectiveNoFormatting] Indie byli pozváni."
 india_events.2.f: ""Hosté byli všichni usazeni, fanfáry heraldů přesně v poledne oznámily příchod viceroye. Vojenské kapely hrály pochod a [SCOPE.sCharacter('ruler_scope').GetCustom('getLadyLord')] [SCOPE.sCharacter('viceroy_scope').GetLastNameNoFormatting], doprovázen(a) [SCOPE.sCharacter('viceroy_scope').GetCustom('getLadyLordSpouse')] [SCOPE.sCharacter('viceroy_scope').GetLastNameNoFormatting], jejich dcerami a personálem, postoupil(a) do pavilonu. [SCOPE.sCharacter('viceroy_scope').GetHerHis|U] Excelence usedl(a) na trůn, oděn(a) v rouše Velkého mistra Hvězdy Indie, hrála se státní hymna, poctové hlídky pozvedly zbraně zatímco celé obrovské shromáždění vstalo jako jeden muž. Hlavní herald byl poté vyzván k přečtení proklamace. Zazněla opět fanfára a [SCOPE.sCharacter('monarch_scope').GetHerHis|U] Veličenstvo bylo prohlášeno [SCOPE.sCharacter('monarch_scope').GetCustom('getEmpressEmperor')] Indie.""
 india_events.2.a: "Šah městu šáh padíšách. Kéž Bůh žehná [SCOPE.sCharacter('monarch_scope').GetHerHim]."
 india_events.2.b: "Příležitost projevit [SCOPE.sCharacter('monarch_scope').GetHerHim] naši věrnost a jednu skromnou žádost."
 indian_independence_request_tt: "\"Prosíme [SCOPE.sCharacter('monarch_scope').GetHerHim|U] Veličenstvo, aby udělilo #b Indii#! stejné politické a sociální postavení, jaké požívají #b britští#! poddaní.\""
 india_events.3.t: "Hora světla"
 india_events.3.d: "Po dobytí [SCOPE.sState('punjab_scope').GetCityHubName] silami [ROOT.GetCountry.GetAdjectiveNoFormatting] jsme získali legendární diamant Koh-i-Noor."
 india_events.3.f: ""Milorde, podrobná zpráva o pokladu [SCOPE.sState('punjab_scope').GetCityHubName] je připravena. Pozoruhodné jsou tři drahokamy: Daria-i-noor, Khiraj-i-alam a samozřejmě Koh-i-noor."\n\n"Výborně. Tyto Indy mám mnohem raději než ty za Atlantikem. Koneckonců, diamant je lepší přírůstek do čepice než pírko, nemyslíte?"\n\n"Zcela souhlasím, milorde."\n\n"Připravte je k převozu. Musí být přítomny na Velké výstavě. Důkaz našeho vítězství na východě.""
 india_events.3.a: "Předat diamant jako válečnou kořist [SCOPE.sCountry('overlord_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('overlord_scope').GetRuler.GetFirstNameNoFormatting]."
 india_events.3.b: "Přepravit diamant do naší trezoru v [ROOT.GetCountry.GetCapital.GetCityHubName]."
 koh_i_noor_in_europe_tt: "Evropská #bold země#! [concept_country] zabavila #bold Koh-i-Noor#! diamant"
 owns_koh_i_noor_tt: "Vlastní #bold Koh-i-Noor#! diamant"
 demand_return_of_diamond_tt: "Budeme požadovat, aby [SCOPE.sCountry('diamond_country').GetName] vrátila #bold Koh-i-Noor#! diamant"
 returned_koh_i_noor_tt: "#bold Koh-i-Noor#! diamant bude vrácen Indii"
 india_events.4.t: "[SCOPE.sCountry('india_scope').GetName] požaduje vrácení Koh-i-Nooru"
 india_events.4.d_1: "Národ [SCOPE.sCountry('india_scope').GetNameNoFlag], nedávno nezávislý na naší vládě, požádal o vrácení diamantu Koh-i-Noor. Diamant je nyní držen v našich trezorech jako válečná kořist."
 india_events.4.d_2: "Národ [SCOPE.sCountry('india_scope').GetNameNoFlag] požádal o vrácení diamantu Koh-i-Noor. Diamant je nyní držen v našich trezorech jako válečná kořist."
 india_events.4.f: ""Pane premiére, Koruna nepovažovala Koh-i-noor za cenný, když si jej poprvé přivlastnila. Určitě jim nebude vadit, když jej vrátíme?"\n\n"Vysoký komisaři, zjistíte, že získání nezávislosti je snazší než snažit se získat šperk zpět z rukou Koruny."\n\n"Ale oni jich mají tolik!"\n\n"Také jsme měli mnoho kolonií. Podívejte se, jak to dopadlo.""
 india_events.4.a: "Je náš podle smlouvy a práva dobytí."
 india_events.4.b: "Cenné věci mají být utráceny."
 india_events.5.t: "Deccanské nepokoje"
 india_events.5.d: "Zadlužené [GetPopType('peasants').GetName] v [SCOPE.sState('riots_site_scope').GetName] zahájili sérii povstání proti místním lichvářům, s cílem zničit záznamy o svých dluzích."
 india_events.5.f: ""Pane, rolníci spalují záznamy o svých dluzích. V některých případech útočí i na lichváře. Máme poslat policii, aby zasáhla?"\n\nKout úst guvernéra se pohnul. \"No, není to nijak překvapivé.\"\n\n\"Pane?\"\n\n\"Slovo pro rolníka v hindštině je ryot. Ryot povstal - proč jsme překvapeni?\""
 india_events.5.a: "Pošlete armádu k potlačení povstání."
 india_events.5.b: "Zrušte tyto dluhy, než se nepokoje zhorší."
 slaves_freed_in_state_tt: "Všichni [GetPopType('slaves').GetName] v [SCOPE.sState('riots_site_scope').GetName] budou emancipováni"
 india_events.6.t: "Hindu-[SCOPE.sCountry('enemy_great_power_scope').GetAdjectiveNoFormatting] spiknutí"
 india_events.6.d: "Naše zpravodajská služba odhalila spiknutí zahrnující indické revolucionáře spojené s agenty vlády [SCOPE.sCountry('enemy_great_power_scope').GetAdjective]. Mají v úmyslu organizovat panevropské povstání proti vládě [SCOPE.sCountry('overlord_scope').GetAdjective]."
 india_events.6.f: ""Zřejmě se spiklenci nazývali Ghadar party."\n\n"To je zábavné."\n\n"Pročpak, milorde?"\n\n"Ghadar znamená rebelii. Ale Gaddari znamená zrada. Podivné, není, jak je rozdíl otázkou pohledu.""
 india_events.6.a: "Musíme ihned zasáhnout."
 india_events.6.b: "Buďme ostražití, ale nejednejme ukvapeně."
 conspiracy_trials_in_30_days_tt: "Podezřelí spiklenci budou postaveni před soud za #v 30#! dní"
 india_events.7.t: "Procesy spiknutí v [SCOPE.sState('conspiracy_trial_state').GetCityHubName]"
 india_events.7.d: "Ve městě [SCOPE.sState('conspiracy_trial_state').GetCityHubName] bylo před soud postaveno několik set členů indických nezávislostních organizací za spiknutí s agenty [SCOPE.sCountry('enemy_great_power_scope').GetAdjective] s cílem podvrátit vládu [SCOPE.sCountry('overlord_scope').GetAdjective]."
 india_events.7.f: "Noviny a lid sledovaly proces s velkým zájmem. Pro některé to byl znak rostoucího nespokojení. Pro jiné to bylo důkazem, že žádný puč, ať už vedený Angličany nebo Indy, nemůže podkopat Korunu. Pro většinu místních to však bylo pouze to, co to bylo. Důstojný průvod tří set mužů, odsouzených jeden za druhým."
 india_events.7.a: "Doufejme, že je to konec."
 india_events.7.b: "Čtyřicet dva trestů smrti vytvoří čtyřicet dva mučedníky."
 india_events.8.t: "Phool Walon Ki Sair"
 india_events.8.d_1: "Město Dillí se sešlo, aby oslavilo harmonii mezi hinduisty a muslimy festivalem Phool Walon Ki Sair. [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] učinil(a) svoji tradiční návštěvu a sledoval(a) Sair ze Zahar Mahalu."
 india_events.8.d_2: "Město Dillí se sešlo, aby oslavilo tradiční indický festival Phool Walon Ki Sair. Příležitost oslavuje komunitární harmonii mezi hinduisty a muslimy."
 india_events.8.d_3: "Město Dillí se sešlo, aby oslavilo harmonii mezi hinduisty a muslimy festivalem Phool Walon Ki Sair. Květinové oběti jsou kladeny na městské svatyně, a tanec i zpěv zaplňují ulice."
 india_events.8.f: "Hudba duní vzduchem, provoněná tisíci květin. Lidé po celém městě se shromažďují, hinduisté i muslimové. Jejich náboženství není zapomenuto, ale obvyklé napětí bylo nahrazeno vzájemnou láskou k tanci, modlitbě a jídlu."
 india_events.8.a: "Krásná ukázka harmonie a barev."
 india_events.8.b: "Existuje jasné nebezpečí politizace festivalu."
 india_events.8.c: "Nabídněte oficiální příspěvek na vystoupení."
 india_events.9.t: "Indická armáda"
 india_events.9.d: "[SCOPE.gsInterestGroup('government_scope').GetName] vydala příkaz sjednotit tři [SCOPE.gsInterestGroup('presidency_armies').GetName] do jediného celku - [ROOT.GetCountry.GetAdjectiveNoFormatting] armády."
 india_events.9.f: ""Na tom se pracovalo už dlouho. Iracionální, jak říkají, s velkou redundancí. Jsem překvapen, že to prošlo telegrafem.\"\n\n"Relikt společnosti, ano, souhlasím. Myslíte, že jsme si ponechali příliš mnoho jejich struktury?"\n\n"Co jiného jsme mohli udělat? Indie není příliš flexibilní zemí. Pro reformy jako tuto je čtyřicet let docela rychlé.""
 india_events.9.a: "Vítězství efektivity."
 india_events.9.b: "Příležitost dále začlenit domorodé jednotky."
 india_events.10.t: "Dohnavurské společenství"
 india_events.10.d: "[SCOPE.sCharacter('carmichael_scope').GetFullName], křesťanská misionářka působící v [SCOPE.sState('dohnavur_state').GetName], se proslavila v regionu poskytováním útočiště dětem nuceným do prostituce. Založila ministerstvo k podpoře své činnosti."
 india_events.10.f: ""Často se nás žádá, abychom vyprávěli příběhy konvertitů; a jistě by nadchly, neboť cesta úniku, kterou Bůh otevírá, je někdy, jako Petrovo z vězení, zázračná; a pravda je podivnější než fikce a mnohem zajímavější. Ale my, kdo pracujeme v brlohu Hrůzy a víme, jak bojuje, aby získal svou kořist zpět, i poté, co unikla, bojíme se tyto příběhy příliš vyprávět, a cítíme, že mlčení je nejbezpečnější a, jak se to může některým zdát zvláštní, prozatím nejvíce oslavuje Boha.""
 india_events.10.a: "Její věc si zaslouží oficiální dar."
 india_events.10.b: "Nemůžeme být vnímáni jako sponzoři misionářů."
 india_events.11.t: "[SCOPE.sCharacter('simon_scope').GetLastNameNoFormatting] Jděte zpět"
 india_events.11.d: "[SCOPE.sCharacter('mehta_scope').GetFullName], dítě místního soudce, byla spatřena účastnit se protestů proti Komisi [SCOPE.sCharacter('simon_scope').GetLastNameNoFormatting] v [SCOPE.sState('mehta_state').GetName]. Ona a další dětské protestující čelí policii oblečeni v barvách indické vlajky."
 india_events.11.f: "Jejich věk je neochránil před pozorností koloniální policie. Před týdnem čelily návalu s lathí, desítky dospělých s obušky rozptýlily jejich piket a svrhaly vlastní vlajku, kterou si samy vyrobily. Vrátily se ke svým rodičům se slzami, krev prosakovala z odřené dlaně a kolen.\n\nNyní, místo držení vlajky, kterou by jim mohli vyrvat z rukou, si ji přehodily přes ramena jako oděv. I kdyby děti znovu srazili, jejich oblečení světu ukáže jejich věc."
 india_events.11.a: "Taková statečnost v tak mladém věku."
 india_events.11.b: "Její otec ponese následky."
 india_events.12.t: "S Bouří k míru"
 india_events.12.d: "[SCOPE.sCharacter('besant_scope').GetFullName], bývalá socialistická aktivistka, která se stala teosofkou, oznámila svůj úmysl odcestovat z [ROOT.GetCountry.GetCapital.GetCityHubName] do Indie. Brzy se připojí ke svým teosofickým kolegům v jejich centrále v [SCOPE.sState('madras_state').GetName]."
 india_events.12.f: ""Nucená naléhavost nutí mě mluvit pravdu, jak ji vidím, ať už řeč potěší nebo rozzlobí, ať přinese chválu nebo kárání. To věrnost pravdě musím uchovat bez poskvrny, ať přátelství selžou nebo lidské vazby se rozpadnou. Může mě zavést do pustiny, přesto jí musím následovat; může mě připravit o veškerou lásku, přesto ji budu následovat; i kdyby mě měla zabít, přesto v ní budu důvěřovat; a nežádám na svém náhrobku jiné epitaf než:\n\n'POKUSILA SE NÁSLEDOVAT PRAVDU.'""
 india_events.12.a: "Ať má bezpečnou cestu."
 india_events.12.b: "Společnost ji potřebuje v [ROOT.GetCountry.GetCapital.GetCityHubName]."
 india_events.13.t: "Světový Učitel"
 india_events.13.d: "Členové Teosofické společnosti v [SCOPE.sState('madras_state').GetName] prohlásili mladého [SCOPE.sCharacter('krishnamurti_scope').GetFullName] za pravděpodobné budoucí nádobí božské entity Pána Maitréyi. [SCOPE.sCharacter('besant_scope').GetFullName], teosofická aktivistka, se snaží chlapce adoptovat."
 india_events.13.f: "Monzun ještě nepřišel a obloha byla stále bez mráčku. Chlapec stál na pláži a bezcílně sledoval příboje. Ztracený, odtažitý, oddělený od všeho kolem nehmotnou bariérou. Jeho otec se prodíral pískem a položil mu ruku na rameno. Chlapec se na něj znovu podíval a vzpomínka na moře tiše pominula."
 india_events.13.a: "[SCOPE.sCharacter('besant_scope').GetSheHe|U] mu umožní naplnit jeho plný potenciál."
 india_events.13.b: "Chlapec patří ke svému otci, daleko od okultismu."
 krishnamurti_chain_end_tt: "[SCOPE.sCharacter('krishnamurti_scope').GetFullName] bude žít obyčejný život se svou rodinou"
 krishnamurti_chain_adopted_tt: "[SCOPE.sCharacter('krishnamurti_scope').GetFullName] bude adoptován Teosofickou společností a vychován, aby se stal #bold Světovým Učitelem#!"
 india_events.14.t: "Řád Hvězdy na Východě"
 india_events.14.d: "Teosofická společnost založila organizaci věnovanou přípravě světa na příchod božského Pána Maitréyi. [SCOPE.sCharacter('krishnamurti_scope').GetFullName], považovaný za budoucí nádobí tohoto bytí, byl jmenován hlavou organizace."
 india_events.14.f: "#bold Deklarace principů#!\n\n1. Věříme, že se brzy objeví velký Učitel, a chceme žít tak, abychom mu byli hodni, až přijde.\n\n2. Budeme se snažit udržovat ho v mysli vždy a dělat ve jeho jménu, dle našich nejlepších schopností, veškerou práci, která nám v každodenních povinnostech přijde.\n\n3. V mezích našich běžných povinností se pokusíme věnovat část našeho času každý den určité práci, která může pomoci připravit jeho příchod."
 india_events.14.a: "Prostředek k inspirování světa."
 india_events.14.b: "Řád k uskutečnění naší pozemské agendy."
 india_events.15.t: "Božské inspirování"
 india_events.15.d: "Během ústraní v [SCOPE.sState('california_state').GetName] byl [SCOPE.sCharacter('krishnamurti_scope').GetFullName] zasažen podivnými fyzickými příznaky a silným pocitem 'jinakosti'. [SCOPE.sCharacter('krishnamurti_scope').GetSheHe|U] a jeho doprovod z Teosofické společnosti věří, že jde o mystický proces."
 india_events.15.f: ""Jako by vše ztuhlo. Není žádný pohyb, žádné mručení, úplná prázdnota všech myšlenek, všeho vidění. Není interpret, který by přeložil, pozoroval nebo cenzuroval. Nepomíjející rozlehlost, která je naprosto klidná a tichá. Není prostoru, ani času pokrývat tento prostor. Zde jsou počátek i konec všech věcí. O tom se opravdu nedá nic říci.""
 india_events.15.a: "Může to být pravda? Je dotčen božským?"
 india_events.15.b: "Tento muž je jen znepokojený, nic víc."
 india_events.16.t: "Země bez cesty"
 india_events.16.d: "Na výročním shromáždění Řádu Hvězdy v [SCOPE.sState('star_camp_state').GetName] [SCOPE.sCharacter('krishnamurti_scope').GetFullName] odmítl své stoupence a prohlásil Řád za rozpuštěný. Teosofická společnost byla touto zprávou zaskočena."
 india_events.16.f: ""Trvám na tom, že pravda je země bez cesty, a k ní se nelze přiblížit žádnou cestou, žádným náboženstvím, žádnou sektou. To je můj názor a držím se ho absolutně a bezpodmínečně. Pravda, která je bezmezné, nepodmíněné, nepřístupné žádnou cestou, nemůže být organizována; a neměla by žádná organizace být vytvořena, aby vedla nebo nutila lidi po určité cestě. Toto není žádné velké dílo, protože nechci následovníky, a myslím to vážně. V okamžiku, kdy někoho sledujete, přestáváte následovat Pravdu.""
 india_events.16.a: "Příčině svobody není potřeba vůdce."
 india_events.16.b: "Jen Světový Učitel by mohl být tak skromný."
 india_events.16.c: "Možná už je čas, aby odešel do ústraní."
 india_events.17.t: "Spiknutí v [SCOPE.sState('khudiram_state').GetFarmHubName]"
 india_events.17.d: "Průvod kočárů ulicemi [SCOPE.sState('khudiram_state').GetFarmHubName] byl přerušen bombovým útokem, který zabil dvě ženy [ROOT.GetCountry.GetTopOverlord.GetAdjectiveNoFormatting]. Jeden z pachatelů, [SCOPE.sCharacter('khudiram_scope').GetFullName], byl zadržen."
 india_events.17.f: "Na mladíkovi nebyla náznaku strachu, ani s ozbrojeným policistou po boku a nepřátelským soudcem před ním. Stál vzpřímeně, ramena uvolněná a jeho tvář nesla blažený úsměv.\n\nVýsledek procesu nebyl nikdy ve hře, i přes schopnou obhajobu. Jeho přečin byl fatální a jeho konec jistý od chvíle, kdy ho policie spatřila. Starosti světa opustily jeho tělo a zbylo jen zajistit, že bude zapamatován."
 india_events.17.a: "Jeho zločiny si zaslouží popravu oběšením."
 india_events.17.b: "Doživotní vězení zabrání tomu, aby se stal mučedníkem."
