 notification_koh_i_noor_sent_name: "Diamant Koh-i-Noor předán panovníkovi"
 notification_koh_i_noor_sent_desc: "Legendární diamant Koh-i-Noor, dříve vlastněný Mughalskou, Perskou a Sikhskou říší, byl dobyt našimi silami a odeslán do [SCOPE.sCountry('overlord_scope').GetCapital.GetCityHubName] na příkaz [SCOPE.sCountry('india_scope').GetRuler.GetPrimaryRoleTitle] Indie. Diamant byl předán [SCOPE.sCountry('overlord_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('overlord_scope').GetRuler.GetFullName] jako válečná kořist."
