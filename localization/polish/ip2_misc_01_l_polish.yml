 je_india_home_rule_request_democracy_permission: "Žádat o vládní reformu"
 je_india_home_rule_request_democracy_permission_desc: "Volání národních vůdců po samosprávě zesílilo natolik, že je nelze ignorovat. Musíme požádat našeho suveréna o povolení udělit potřebné ústupky tímto směrem.\nPokud [SCOPE.sCountry('overlord_scope').GetName] souhlasí, budeme moci přijmout #b $lawgroup_distribution_of_power$#! [Concept('concept_law', '$concept_laws$')|l]"
 je_india_nationalism_britain_indian_self_governance: "Oprávnit indickou samosprávu"
 je_india_nationalism_britain_indian_self_governance_desc: "Despota v Indii je zjevně neudržitelný. Abychom uchovali naši koloniální správu, musíme nabídnout Indům více příležitostí účastnit se vlastní správy."
 je_india_nationalism_britain_dispatch_simon_commission: "Vyslat statutární komisi"
 je_india_nationalism_britain_dispatch_simon_commission_desc: "Naše předchozí reformy indické správy se v očích mnoha nacionalistů ukázaly jako nedostatečné. Vyslání komise ke studiu další ústavní reformy poslouží jako projev našeho trvalého závazku k indické samosprávě."
