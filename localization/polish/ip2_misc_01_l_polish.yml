 jail.1.t: "Do vězení"
 jail.1.d: "[SCOPE.sCharacter('prisoner_scope').GetFullName] byl zatčen a postaven před soud za trestné činy související s [SCOPE.sCharacter('prisoner_scope').GetHerHis] politickou agitací. [SCOPE.sCharacter('prisoner_scope').GetSheHe|U] čelí nepřátelskému soudci a dlouhému trestu odnětí svobody, pokud bude shledán(a) vinným."
 jail.1.f: ""[SCOPE.sCharacter('prisoner_scope').GetCustom('getMsMr')] [SCOPE.sCharacter('prisoner_scope').GetLastNameNoFormatting], prosím stůjte a přistupte k řečništi."\n\n[SCOPE.sCharacter('prisoner_scope').GetSheHe|U] poslechl(a). Mít odpor nemělo smysl. Proces nebyl dlouhý ani spravedlivý podle běžných měřítek. Nešlo o to, zda bude [SCOPE.sCharacter('prisoner_scope').GetSheHe] shledán(a) vinným, ale jak přísný trest bude vynesen.\n\n\"[SCOPE.sCharacter('prisoner_scope').GetCustom('getMsMr')] [SCOPE.sCharacter('prisoner_scope').GetLastNameNoFormatting], byl(a) shledán(a) vinným z trestného činu vzbuzování nenávisti. Po důkladném přezkoumání okolností tohoto případu soud tímto odsuzuje vás...\""
 jail.1.a: "Tříleté vězení, aby si [SCOPE.sCharacter('prisoner_scope').GetHerHim] pamatoval(a) své místo."
 jail.1.b: "Pětiletý trest ho/ji odstraní z veřejného života."
 jail.1.c: "[SCOPE.sCharacter('prisoner_scope').GetSheHe|U] prověřil(a) naši trpělivost. Deset let."
 jail.1.e: "Nechceme skandál. Nechte [SCOPE.sCharacter('prisoner_scope').GetHerHim] projít s napomenutím."
