 granted_india_home_rule_tt: "Rozhodli jsme se udělit [SCOPE.sCountry('india_scope').GetName] #bold Domácí vládnutí#!"
 no_south_asian_primary_cultures_tt: "Žádná z našich [Concept('concept_primary_cultures','$concept_primary_cultures$')|l] nemá rys #v $heritage_group_south_asian$#!"
