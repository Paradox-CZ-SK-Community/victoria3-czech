 most_european_pops_abandon_india_tt: "Velké množství #bold evropských#! [Concept('concept_pop','$concept_pops$')|l] evakuuje [ROOT.GetCountry.GetName]"
 some_european_pops_abandon_india_tt: "Mnoho našich #bold evropských#! [Concept('concept_pop','$concept_population$')|l] se evakuuje do [SCOPE.sState('calcutta_scope').GetName]"
 bengal_free_state_tt: "Prohlásíme suverenitu jako #bold $dyn_c_bengal_free_state$#!"
 india_nationalism_events.3.t: "Solný pochod"
 india_nationalism_events.3.d: "Indičtí aktivisté za nezávislost vedení [SCOPE.sCharacter('prisoner_scope').GetFullName] pochodovali k moři v [SCOPE.sState('salt_march_state').GetName], aby protestovali proti státnímu monopolu na sůl. Po příjezdu na pobřeží úmyslně porušili zákon sběrem soli."
 india_nationalism_events.3.f: "#bold Solný výtržek v [SCOPE.sState('salt_march_state').GetPortHubName]!#!\n\nDne [TimeKeeper.GetCurrentDate.GetString] dorazila velká skupina do [SCOPE.sState('salt_march_state').GetPortHubName] s jasným úmyslem porušit imperiální zákon. Sbírali mořskou vodu a vařili ji na sůl. Téměř všichni shromáždění byli zatčeni.\n\nZeptali jsme se vůdce pochodu, významného člena [SCOPE.sPoliticalLobby('anti_overlord_lobby').GetNameNoFormatting], co hodlají dělat se solí. Vysvětlil, že považují solný daňový monopol za nesnesitelný a chtějí prostřednictvím tohoto nenásilného protestu uplatnit své právo na samosprávu. Pokud čtenářovi připadá směšné, není sám! Ale aspoň můžeme být ujištěni, že národní hnutí je v rukou bezúhonných lidí."
 india_nationalism_events.3.a: "Naše věznice mají pro ně místo."
 india_nationalism_events.3.b: "Zdravíme porušovatele zákona!"
 modifier_salt_tax_protests: "Protesty proti solné dani"
 india_nationalism_events.4.t: "Natal Indian Congress"
 india_nationalism_events.4.d: "Indický právník [SCOPE.sCharacter('gandhi_scope').GetFullName] založil Natal Indian Congress, organizaci věnovanou obhajobě práv indické komunity v [ROOT.GetCountry.GetAdjective]."
 india_nationalism_events.4.f: "#bold Další zrádný hlas#!\n\n[Dne TimeKeeper.GetCurrentDate.GetString] byl založen Natal Indian Congress—další organizace v řadě nespokojených skupin. Veden mladým indickým advokátem [SCOPE.sCharacter('gandhi_scope').GetFullNameNoFormatting], jejich pozornost se zdá být zaměřena na utrpení Indů. Naši ostří čtenáři najdou v tom málo překvapivého, jelikož [SCOPE.sCharacter('gandhi_scope').GetLastNameNoFormatting] nedávno požadoval právo volit pro indické obyvatele. Možná si můžeme najít útěchu v tom, že navzdory svým vznešeným myšlenkám zůstávají tyto skupiny roztříštěné."
 india_nationalism_events.4.a: "Indická komunita našla svého zastánce."
 india_nationalism_events.4.b: "Uvidíme, jak si poradí s davem v [SCOPE.sState('gandhi_state').GetCityHubName]."
 india_nationalism_events.5.t: "Satyagraha"
 india_nationalism_events.5.d: "Po mnoha letech v zahraničí se [SCOPE.sCharacter('gandhi_scope').GetFullName] vrátil do [ROOT.GetCountry.GetName]. Uplatnil svou teorii Satyagraha, neboli 'držet se pravdy', v podpoře indického hnutí za nezávislost."
 india_nationalism_events.5.f: "Když advokát, nedávno navrátilý ze zahraničí, mluvil šestou hodinu, konvence byla bez nálady.\n\n\"Jiskřivý mladý muž!\" poznamenal člen Kongresu.\n\n\"Kdo si myslí, že je?\" odpověděl jiný, \"vypadá, že si myslí, že je nejchytřejší v místnosti; jeho každé prohlášení dává volné munici našim nepřátelům.\""
 india_nationalism_events.5.a: "Hrdina se vrátil do své rodné země."
 india_nationalism_events.5.b: "Naříděte novinám, aby to utajily."
 notification_gandhi_leaves_name: "[SCOPE.sCharacter('gandhi_scope').GetLastName] opouští [SCOPE.sCountry('gandhi_exit_scope').GetName]"
 notification_gandhi_leaves_desc: "[SCOPE.sCharacter('gandhi_scope').GetFullName] opustil [SCOPE.sCountry('gandhi_exit_scope').GetName], aby podpořil indické hnutí za nezávislost."
