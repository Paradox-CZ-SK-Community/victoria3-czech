 notification_koh_i_noor_not_sent_name: "Diamant Koh-i-Noor zůstává v Indii"
 notification_koh_i_noor_not_sent_desc: "Legendární diamant Koh-i-Noor, dříve vlastněný Mughalskou, Perskou a Sikhskou říší, byl dobyt našimi silami v Indii. Diamant byl uložen do trezoru v [SCOPE.sCountry('india_scope').GetCapital.GetCityHubName] jako válečná kořist."
 notification_koh_i_noor_not_sent_tooltip: "#header $notification_koh_i_noor_not_sent_name$#!\n$TOOLTIP_DELIMITER$\n$notification_koh_i_noor_not_sent_desc$"
