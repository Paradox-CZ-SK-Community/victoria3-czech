 bic_end_company_rule_desc: "Experiment vlády soukromé korporace dospěl. Pokud chceme normalizovat vztahy s našimi poddanými, musíme Indii přenést pod přímou správu Parlamentu a [GetPlayer.GetTopOverlord.GetRuler.GetPrimaryRoleTitle]."
