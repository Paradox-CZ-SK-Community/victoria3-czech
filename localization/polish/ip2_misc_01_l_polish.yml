 india_events.1.t: "Kaisar-i-Hind"
 india_events.1.d_1: "S ustavením korunové správy nad Indií požádal [SCOPE.sCharacter('ruler_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('ruler_scope').GetFullName] premiéra, aby mu nabídl titul „[SCOPE.sCharacter('ruler_scope').GetCustom('getEmpressEmperor')] Indie“."
 india_events.1.d_2: "S ustavením korunové správy nad Indií přijal [SCOPE.sCharacter('ruler_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('ruler_scope').GetFullName] titul „[SCOPE.sCharacter('ruler_scope').GetCustom('getEmpressEmperor')] Indie“."
 india_events.1.f_1: ""Nechť je tímto stanoveno královskou mocí [SCOPE.sCharacter('ruler_scope').GetPrimaryRoleTitle], se souhlasem a radou Pánů duchovních a světských a Poslanců, shromážděných v tomto Parlamentu, a pod autoritou téhož, co následuje:\n\nBude povoleno [SCOPE.sCharacter('ruler_scope').GetHerHis|U] nejmilostivější Veličenstvu, s cílem takového uznání převodu Správy Indie, udělit svolením Královského proklamace pod Velkou pečetí Spojeného království, takové dodatky ke stylu a titulům náležejícím Imperiální koruně Spojeného království a jejím závislostem, jak se [SCOPE.sCharacter('ruler_scope').GetHerHis|U] Veličenstvu bude zdát vhodné.""
 india_events.1.f_2: ""Nechť je tímto stanoveno královskou mocí [SCOPE.sCharacter('ruler_scope').GetPrimaryRoleTitle], se souhlasem a radou Pánů duchovních a světských, co následuje:\n\nBude povoleno [SCOPE.sCharacter('ruler_scope').GetHerHis|U] nejmilostivější Veličenstvu, s cílem takového uznání převodu Správy Indie, udělit svolením Královského proklamace pod Velkou pečetí Spojeného království, takové dodatky ke stylu a titulům náležejícím Imperiální koruně Spojeného království a jejím závislostem, jak se [SCOPE.sCharacter('ruler_scope').GetHerHis|U] Veličenstvu bude zdát vhodné.""
 india_events.1.a: "Bůh ochraňuj [SCOPE.sCharacter('ruler_scope').GetCustom('getEmpressEmperor')]!"
 india_events.1.b: "Doporučte [SCOPE.sCharacter('ruler_scope').GetHerHim] proti tomuto kroku."
 india_events.1.c: "\"[SCOPE.sCharacter('ruler_scope').GetCustom('getEmpressEmperor')] Velké Británie, Irska a Indie\" by vytvořil ještě velkolepější titul."
