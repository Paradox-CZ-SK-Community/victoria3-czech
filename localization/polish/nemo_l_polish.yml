l_polish:
 notification_nemo_appears_notification_name: "Princ zmizel" # todo: NEW TRANSLATION
 notification_nemo_appears_notification_desc: "Zbavený dědic anektovaného [concept_princely_state] zmizel. Rezident Společnosti hlásí, že mladý princ za soumraku zamířil do loděnic a už se nevrátil." # todo: NEW TRANSLATION
 nemo_events.2.t: "Zkáza lodi Společnosti plující do Indie" # todo: NEW TRANSLATION
 nemo_events.2.d: "Obchodní loď [SCOPE.GetRootScope.GetCountry.GetAdjective] se potopila na otevřeném moři u pobřeží státu [SCOPE.sState('nemo_coast_state_scope').GetName]. Podle těch, kterým se podařilo dostat zpět na břeh, nic nevyhlíželo nebezpečí a na obzoru nebyla vidět žádná plachta." # todo: NEW TRANSLATION
 nemo_events.2.d_repeat: "Další obchodní loď směřující do Evropy se potopila u pobřeží státu [SCOPE.sState('nemo_coast_state_scope').GetName]." # todo: NEW TRANSLATION
 nemo_events.2.f: "„Moře nepatří despotům. Na jeho hladině mohou lidé stále uplatňovat nespravedlivé zákony, bojovat, trhat se navzájem na kusy a nechat se unášet hrůzami pozemského světa.“\n\n—Jules Verne, #italic 20 000 mil pod mořem#!" # todo: NEW TRANSLATION
 nemo_events.2.a: "Lidská mysl si libuje ve velkolepých představách nadpřirozených bytostí." # todo: NEW TRANSLATION
 nemo_events.2.b: "Ujistěte správní radu, že naše flotila ochrání obchodní trasy." # todo: NEW TRANSLATION
 nemo_patrol_promise_tt_a: "Slíbili jsme, že naše [concept_fleet] bude doprovázet [Concept('concept_supply_ship','$concept_supply_ships|q$')] na [Concept('concept_shipping_lane','$concept_shipping_lanes|q$')] v okolí [GetGeographicRegion('geographic_region_india').GetName]" # todo: NEW TRANSLATION
 nemo_patrol_promise_tt_b: "@warning! Pokud při příštím útoku nájezdníka nebude žádná [concept_fleet] zajišťovat doprovod, veřejnost bude nespokojená" # todo: NEW TRANSLATION
 nemo_events.3.t: "Slib napsaný na vodě" # todo: NEW TRANSLATION
 nemo_events.3.d: "Přestože bylo moře klidné a vítr příznivý, další obchodní konvoj zmizel v moři. Ti, kdo sledují aktuální dění, se rozhořčili nad tím, že správní rada nedostála svým povinnostem." # todo: NEW TRANSLATION
 nemo_events.3.f: "„Velké hlubiny oceánu jsou nám zcela neznámé. Olovnice do nich nedosáhne. Co se děje v těch odlehlých hlubinách — jací tvorové tam žijí či mohou žít, dvanáct nebo patnáct mil pod hladinou vod ... to si sotva dokážeme představit.“\n\n—Jules Verne, #italic 20 000 mil pod mořem#!" # todo: NEW TRANSLATION
 nemo_events.3.a: "Můžeme vzdorovat lidským zákonům, ale přírodním se vzepřít nedokážeme." # todo: NEW TRANSLATION
 nemo_events.4.t: "Děla proti pobřeží" # todo: NEW TRANSLATION
 nemo_events.4.d: "To, co už tak dlouho děsilo posádky naší obchodní flotily, obrátilo svou pozornost k našemu pobřeží a odhalilo se. Zpod vln se vynořila obrovská nepřirozená železná obluda a začala ostřelovat naše přístavy! Její postup podél pobřeží vyznačují sloupy kouře viditelné na míle daleko ve vnitrozemí." # todo: NEW TRANSLATION
 nemo_events.4.f: "„I nyní, když píšu tyto řádky, jsou mé vzpomínky tak živé, že se mě zmocňuje bezděčný děs a zdá se mi, že nemohu dýchat.“\n\n—Jules Verne, #italic 20 000 mil pod mořem#!" # todo: NEW TRANSLATION
 nemo_events.4.a: "Přirazte k ní a zmocněte se jí. Pokud to půjde, zajměte ji nepoškozenou." # todo: NEW TRANSLATION
 nemo_events.4.b: "Držte se dál a potopte ji dalekonosnými děly." # todo: NEW TRANSLATION
 nemo_events.4.c: "Na moři nemáme nic, čím bychom proti ní mohli zasáhnout. Nechme děla ztichnout a smiřme se s následky." # todo: NEW TRANSLATION
 nemo_unopposed_bombardment_tt: "Protože jí nečelí žádná eskadra, #b Nautilus#! ostřeluje pobřeží, jak se jí zlíbí" # todo: NEW TRANSLATION
 nemo_squadron_damage_heavy_tt: "Eskadra, která se s ní střetne, utrpí při přiblížení #b těžké poškození#!; její lodě rozdrtí vzájemná palba" # todo: NEW TRANSLATION
 nemo_squadron_damage_light_tt: "Eskadra, která se s ní střetne, utrpí při přestřelce na dálku #b určité poškození#!." # todo: NEW TRANSLATION
 nemo_nautilus_captured_tt: "#b Nautilus#! je zajat nepoškozený a zařazen do seznamu lodí Společnosti. Jeho podoba bude k dispozici našim ponorkovým flotilám" # todo: NEW TRANSLATION
 nemo_nautilus_sunk_tt: "#b Nautilus#! se rozlomí a potopí i se svým kapitánem na palubě" # todo: NEW TRANSLATION
 nemo_nautilus_escaped_tt: "#b Nautilus#! zmizí pod kouřovou clonou a už ji nikdo nenajde" # todo: NEW TRANSLATION
 nemo_events.5.t: "Bez vlajky, bez národa" # todo: NEW TRANSLATION
 nemo_events.5.d: "Útoky ustaly. Všudypřítomné nebezpečí, které tížilo celý Indický oceán, vystřídalo jemné šplouchání vln na klidném moři." # todo: NEW TRANSLATION
 nemo_events.5.f: "„Moře je vším. Pokrývá sedm desetin zemského povrchu. Jeho vzduch je čistý a zdravý. Je to nesmírná poušť, kde člověk nikdy není sám, neboť cítí, jak všude kolem pulzuje život. Moře je ztělesněním nadpřirozené a podivuhodné existence. Není ničím jiným než láskou a citem; je to ‚Živoucí nekonečno‘, jak řekl jeden z vašich básníků.“\n\n—Jules Verne, #italic 20 000 mil pod mořem#!" # todo: NEW TRANSLATION
 nemo_events.5.a: "Kdyby nebylo hromu, lidé by se blesků příliš nebáli." # todo: NEW TRANSLATION
 nemo_becomes_agitator_tt: "Kapitán Nemo vstupuje do [concept_exile] jako [concept_agitator]." # todo: NEW TRANSLATION
 nemo_nautilus_ship_name: "Nautilus" # todo: NEW TRANSLATION
 ship_graphics_type_nautilus: "Nautilus" # todo: NEW TRANSLATION
 ship_graphics_type_nautilus_desc: "„Na #italic Nautilu#! lidé neztrácejí odvahu. Není se čeho obávat... když se ponoří pod hladinu, zavládne naprostý klid. To je, pane, dokonalost plavidel!“\n\n—Jules Verne, #italic 20 000 mil pod mořem#!" # todo: NEW TRANSLATION
 nemo_dies_tt: "[SCOPE.sCharacter('nemo_scope').GetFullName] umírá" # todo: NEW TRANSLATION
 nemo_shipping_losses: "Ztráty způsobené nájezdníkem" # todo: NEW TRANSLATION
 nemo_promised_protection: "Doprovázené konvoje" # todo: NEW TRANSLATION
 nemo_broken_promise_country: "Planý slib" # todo: NEW TRANSLATION
 nemo_broken_promise_IG: "$nemo_broken_promise_country$" # todo: NEW TRANSLATION
 nemo_scourge_ended: "Hrozba pominula" # todo: NEW TRANSLATION
 nemo_nautilus_captured: "Nautilus zajat" # todo: NEW TRANSLATION
 notification_nemo_nautilus_captured_notification_name: "Nautilus zajat" # todo: NEW TRANSLATION
 notification_nemo_nautilus_captured_notification_desc: "Po těžce vybojované bitvě se výsadkáři zmocnili ponorky dřív, než ji její posádka stačila potopit. Tento technický zázrak je nyní náš!" # todo: NEW TRANSLATION
 notification_nemo_nautilus_sunk_notification_name: "Nautilus potopen" # todo: NEW TRANSLATION
 notification_nemo_nautilus_sunk_notification_desc: "Ponorka byla pod čarou ponoru rozstřílena a potopila se i s celou posádkou. Nic se nepodařilo vyzvednout a na břeh nebyl dopraven žádný přeživší, kterého bychom mohli vyslechnout." # todo: NEW TRANSLATION
 notification_nemo_nautilus_escaped_notification_name: "Nautilus unikl" # todo: NEW TRANSLATION
 notification_nemo_nautilus_escaped_notification_desc: "Ponorka zmizela pod vlnami a už se nevynořila. Její konečný osud zatím není znám." # todo: NEW TRANSLATION
