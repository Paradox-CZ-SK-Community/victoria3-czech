 POLITICAL_LOBBY_MEMBER_SUPPORT_TT: "#T Podpora lobby#!\n[PoliticalLobby.CalcJoinWeight(InterestGroup.Self)|v0] ($POLITICAL_LOBBY_MEMBER_SUPPORT$)\n\nPokud podpora klesne na #v 0#!, [InterestGroup.GetName] pravděpodobně opustí [PoliticalLobby.GetName]\n$TOOLTIP_DELIMITER$\n#title Tato podpora je způsobena:#!#indent_newline:3 \n[PoliticalLobby.CalcJoinWeightDesc(InterestGroup.Self)]#!"
