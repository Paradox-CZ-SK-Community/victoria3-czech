 concept_company_category_short: "Kategorie" # todo: NEW TRANSLATION
 concept_company_categories_short: "Kategorie" # todo: NEW TRANSLATION
 concept_company_category_desc: "A $concept_company_category$ popisuje, které druhy [Concept('concept_pop','populace')] se podílejí na vlastnictví [Concept('concept_company','společnost')]. Určuje, které [Concept('concept_production_method','výrobní metody')] jsou dostupné v [Concept('concept_company_hq','ředitelství společnosti')], a tím formuje, které [Concept('concept_profession','profese')] jsou tam zaměstnány. Také určuje, kdo obdrží podíl z [Concept('concept_dividends','dividend')] a zda $concept_company$ platí [Concept('concept_government_dividends','vládní dividendy')] nebo ne.\n\n#title Tyto $concept_company_categories_short$ jsou:#!#indent_newline:3 \n#b $company_category_capitalist_owned$#!#indent_newline:3 \n$company_category_capitalist_owned_desc$#!\n\n#b $company_category_aristocrat_owned$#!#indent_newline:3 \n$company_category_aristocrat_owned_desc$#!\n\n#b $company_category_shopkeeper_owned$#!#indent_newline:3 \n$company_category_shopkeeper_owned_desc$#!\n\n#b $company_category_bureaucrat_owned$#!#indent_newline:3 \n$company_category_bureaucrat_owned_desc$#!\n\n#b $company_category_academic_owned$#!#indent_newline:3 \n$company_category_academic_owned_desc$#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 concept_concept: "Koncept"
 concept_concepts: "Koncepty"
 concept_concept_desc: "Jedná se o herní koncept, který lze tzv. tooltipovat s jiným [Concept('concept_concept', 'konceptem')] uvnitř."
 concept_sol: "Životní standard"
 concept_sol_desc: "$concept_sol$ měří životní podmínky [Concept('concept_pop','populace')|l], přičemž základním ukazatelem je její [Concept('concept_wealth','bohatství')|l]. Životní úroveň ovlivňuje [Concept('concept_pop_growth','míru porodnosti a úmrtnosti')] a při každé změně může způsobit, že se populace stanou buď více [Concept('concept_radical','radikálními')], nebo naopak [Concept('concept_loyalist','loajálními')]. Průměrný životní standard v daném [Concept('concept_state','státě')] ovlivňuje jeho [Concept('concept_migration_pull','migrační přitažlivost')|l]." # todo: CHANGED (predtym: $concept_sol$ měří životní podmínky [Concept('concept_pop','$concept_pop_possessive|q$')], přičemž základním ukazatelem )
 concept_cold: "Chlad" # todo: NEW TRANSLATION
 concept_cold_desc: "Jak chladné je počasí v [concept_state], což určuje zeměpisná poloha a aktuální roční období. Účinky chladu závisí na [concept_cold_intensity]." # todo: NEW TRANSLATION
 concept_cold_intensity: "Intenzita chladu" # todo: NEW TRANSLATION
 concept_cold_intensity_insignificant: "Zanedbatelná" # todo: NEW TRANSLATION
 concept_cold_intensity_moderate: "Střední" # todo: NEW TRANSLATION
 concept_cold_intensity_severe: "Silná" # todo: NEW TRANSLATION
 concept_cold_intensity_desc: "$concept_cold_intensity$ oblasti [concept_state_region] závisí na tom, jaký v ní panuje [concept_cold]. #b $concept_cold_intensity_moderate$#! a #b $concept_cold_intensity_severe$#! $concept_cold$ snižuje [concept_ship_speed], zvyšuje množství [Concept('concept_supply_ship','$concept_supply_ships|q$')] potřebných v [concept_sea_node] a snižuje [concept_world_market_access] [Concept('concept_state','$concept_states|q$')], jejichž [concept_world_market_hub] se k moři dostává přes něj.\n\n#title Úrovně $concept_cold_intensity$:#!#indent_newline:3 \n#b $concept_cold_intensity_insignificant$#!: méně než #v [GetDefine('NSeasons','MODERATE_COLD_EFFECT_THRESHOLD')|%0]#! $concept_cold$\n#b $concept_cold_intensity_moderate$#!: #v [GetDefine('NSeasons','MODERATE_COLD_EFFECT_THRESHOLD')|%0]#! $concept_cold$ nebo více\n#b $concept_cold_intensity_severe$#!: #v [GetDefine('NSeasons','SEVERE_COLD_EFFECT_THRESHOLD')|%0]#! $concept_cold$ nebo více#!" # todo: NEW TRANSLATION
 concept_expected_sol: "Očekávaný minimální životní standard"
 concept_expected_sol_short: "Životní minimum"
 concept_expected_sol_desc: "$concept_expected_sol$ je nejnižší [Concept('concept_sol','životní standard')|l], který je [Concept('concept_pop','populace')|l] ochotna tolerovat. Toto číslo se odvíjí od toho, zda populace je součástí [Concept('concept_lower_strata', 'nižší třídy')], [Concept('concept_middle_strata', 'střední třídy')] nebo [Concept('concept_upper_strata', 'vyšší třídy')] a je upraveno podle [Concept('concept_literacy', 'gramotnosti')] a může být pozměněno určitými [Concept('concept_technology', 'technologiemi')]. Pokud má populace nižší životní standard než životní minimum, bude se postupně více [Concept('concept_radical', 'radikalizovat')]. $concept_pops$ s životním standardem nad životním minimem se stále stanou více radikálními, pokaždé když se jejich životní standard sníží." # todo: CHANGED (predtym: $concept_expected_sol$ je nejnižší [concept_sol], který je [Concept('concept_pop','$concept_pop$')] ochotna tolerovat. T)
 concept_famine: "Hladomor"
 concept_famines: "Hladomory"
 concept_famine_desc: "$concept_famine$ je výsledkem velké části [Concept('concept_pop','populace')|l] ve [Concept('concept_state','státě')], která trpí [Concept('concept_starvation','hladem')]. Je primárně politickou klasifikací, která má přitáhnout pozornost k tragedii těch, kdo potřebují pomoc ve vaší společnosti.\n\n$concept_famine$ je vyhlášen ve [Concept('concept_state','státě')], pokud jsou splněny všechny tyto podmínky:\n$EFFECT_LIST_BULLET$alespoň #b #r [GetDefine('NPops', 'FAMINE_POPULATION_SHARE_IN_STARVATION')|0%]#!#! z populace hladuje\n$EFFECT_LIST_BULLET$alespoň #b #r [GetDefine('NPops', 'FAMINE_POPULATION_SHARE_IN_SEVERE_STARVATION')|%0]#!#! trpí těžkým hladomorem.\n$EFFECT_LIST_BULLET$stát #b nepatří #! [Concept('concept_decentralized_nation','decentralizovanému národu')]" # todo: CHANGED (predtym: $concept_famine$ je výsledkem toho, že velká část [Concept('concept_pop','$concept_population|q$')] ve [Concept('concept)
 concept_food_security: "Potravinová bezpečnost"
 concept_food_security_desc: "$concept_food_security$ měří, jak snadné nebo obtížné je pro [Concept('concept_pop','populaci')] získat veškeré potraviny potřebné k přežití. Pokud potravinová bezpečnost populace klesne příliš nízko, začne trpět [Concept('concept_starvation','hladem')]. Čím nižší potravinová bezpečnost, tím tvrdší budou účinky hladu.\n\nExistují dva hlavní faktory, které ovlivňují potravinovou bezpečnost. Prvním z nich je, zda je [GetPopNeed('popneed_basic_food').GetName|l] dostupné [Concept('concept_shortage','v dostatečném množství')] pro [Concept('concept_pop_needs','potřeby populace')|l]. Druhý faktor se zakládá na tom, kolik [Concept('concept_money','peněz')] populace utrácí za [GetPopNeed('popneed_basic_food').GetNameNoFormatting|l] ve srovnání s jeho očekávanými náklady na základě ceny." # todo: CHANGED (predtym: $concept_food_security$ měří, jak snadné nebo obtížné je pro [Concept('concept_pop','$concept_pop$')] získat veškeré pot)
 concept_starvation: "Hlad"
 concept_starving: "Hladovějící"
 concept_mild_starvation: "Mírné hladovění"
 concept_mild_starvation_short: "Mírné"
 concept_severe_starvation: "Těžký hladomor"
 concept_severe_starvation_short: "Těžký"
 concept_starvation_desc: "[Concept('concept_pop','Populace')] se považuje za hladovějící, pokud je jejich [Concept('concept_food_security','potravinová bezpečnost')|l] příliš nízká. To může být způsobeno tím, že [Concept('concept_pop','populace')|l] má příliš nízké [Concept('concept_wealth','bohatství')|l], nebo jednoduše proto, že [GetPopNeed('popneed_basic_food').GetName|l] je pro populaci nedostatkovým zbožím.\n\n#b $concept_mild_starvation$#! začíná na #b #v [GetDefine('NPops', 'FOOD_SECURITY_STARVATION_THRESHOLD')|0%]#!#! potravinové bezpečnosti a má snížené účinky.\n[GetStaticModifier('starvation_penalty').GetDesc]\n\n#r $concept_severe_starvation$#! dochází při #b #v [GetDefine('NPops', 'FOOD_SECURITY_SEVERE_STARVATION_THRESHOLD')|0%]#!#! potravinové bezpečnosti a má přísnější účinky. Pokud se to ponechá bez povšimnutí, povede to k úmrtí populace.\n[GetStaticModifier('severe_starvation_penalty').GetDesc]\n\nNavíc populace, kteří trpí hladem, se také časem [Concept('concept_radical','radikalizují')]. Kolik lidí se radikalizuje (a jakým tempem) závisí na tom, jak nízká je jejich [Concept('concept_food_security','potravinová bezpečnost')|l]." # todo: CHANGED (predtym: [Concept('concept_pop','$concept_pop$')] se považuje za $concept_starving$, pokud je její [Concept('concept_food_securit)
 concept_harvest_condition: "Podmínky sklizně"
 concept_harvest_conditions: "Podmínky sklizně"
 concept_harvest_condition_desc: "$concept_harvest_condition$ jsou událostí, která primárně ovlivňuje venkovský sektor [Concept('concept_country','země')|l] s proměnlivou [Concept('concept_harvest_condition_intensity','intenzitou')], trváním a rozsahem. Obecně se jedná o přírodní jev a může mít buď #g pozitivní#! nebo #r negativní#! účinky na [Concept('concept_state','státy')|l], které ovlivňuje. [Concept('concept_harvest_conditions','Podmínky sklizně')] mají většinu dopadů na [Concept('concept_throughput','efektivitu')] zemědělských [Concept('concept_building','budov')], ale také mohou mít dopad na vaši [Concept('concept_pop','populaci')] a [Concept('concept_states','státy')|l] jiným způsobem, například snížením dostupné [Concept('concept_infrastructure','infrastruktury')].\n\n[Concept('concept_harvest_conditions','Podmínky sklizně')] často ovlivní [Concept('concept_states','státy')|l], které se nachází v okolí jejich #b epicentra#!. V takových případech se [Concept('concept_harvest_condition_intensity','intenzita podmínek sklízně')] obvykle zmenší, jak se vzdálenost od #b epicentra#! zvyšuje.\n\n#title Potenciální [Concept('concept_harvest_conditions','podmínky sklizně')]:#!#indent_newline:3 \n[GetHarvestConditionTypesList]#!" # todo: CONCEPT CASE
 concept_harvest_condition_intensity: "Intenzita podmínek sklízně"
 concept_harvest_condition_intensity_short: "Intenzita"
 concept_harvest_condition_intensity_desc: "$concept_harvest_condition_intensity_short$ [Concept('concept_harvest_condition','podmínek sklizně')] násobí její efekty na [Concept('concept_state','stát')|l]. Čím blíže se stát nachází k epicentru, tím vyšší bude pravděpodobně [Concept('concept_harvest_condition_intensity_short','intenzita')|l]."
 concept_pop_growth: "Populační růst"
 concept_pop_growth_birthrate_and_mortality: "Míra porodnosti a úmrtnosti"
 concept_pop_growth_birthrate: "Míra porodnosti"
 concept_pop_growth_mortality: "Úmrtnost"
 concept_pop_growth_desc: "Čistý počet [Concept('concept_individual','jednotlivců')], který [Concept('concept_pop','populace')|l] získává nebo ztrácí v průběhu času, je řízen její mírou porodnosti a úmrtnosti. Obe metriky jsou řízeny [Concept('concept_sol','životním standardem')] a modifikovány faktory jako nemoc, nebezpečné pracovní podmínky, prospěšné [Concept('concept_institution','instituce')|l] a dostupný životní prostor.\n\n@information! Externí změny ve velikosti populace kvůli např. [Concept('concept_migration','migraci')] nebo [Concept('concept_war','válečným')] [Concept('concept_casualties','ztrátám')] nejsou považovány za růst populace." # todo: CHANGED (predtym: Čistý počet [Concept('concept_individual','$concept_individuals|q$')], který [Concept('concept_pop','$concept_pop$')] zí)
 concept_individual: "Jednotlivec"
 concept_individuals: "Jednotlivci"
 concept_individual_desc: "Jedinec je jediná osoba uvnitř [Concept('concept_pop','populace')|l], která může být buď [Concept('concept_working_adults','pracující dospělý')|l] nebo [Concept('concept_dependents','závislá osoba')|l]. Všechny [Concept('concept_pop','populace')|l] se skládají z jednotlivců se stejnou [Concept('concept_culture','kulturou')], [Concept('concept_religion','náboženstvím')], [Concept('concept_profession','profesí')] a [Concept('concept_building','pracovištěm')]." # todo: CHANGED (predtym: Jedinec je jedna osoba v rámci [Concept('concept_pop','populace')|l], která může být buď [Concept('concept_working_adult)
 concept_jobseeker: "Uchazeč"
 concept_jobseekers: "Uchazeči"
 concept_jobseeking: "Hledání práce"
 concept_jobseeker_desc: "Uchazeč je [Concept('concept_working_adults','pracující dospělý')|l] se záporní negativním [Concept('concept_job_satisfaction','spokojeností s prací')], který nepracuje ve [Concept('concept_government_building','vládní budově')] nebo v [Concept('concept_building','budově')], která je [Concept('concept_subsidies','dotována')]."
 concept_building: "Budova"
 concept_buildings: "Budovy"
 concept_building_industry: "Průmysl"
 concept_building_industries: "Průmysly"
 concept_building_possessive: "Budovy"
 concept_buildings_possessive: "Budov"
 concept_building_workplace: "Pracoviště"
 concept_building_desc: "$concept_buildings$ řídí ekonomiku vaší [Concept('concept_country','zemi')|l] prostřednictvím [Concept('concept_good_production','výroby')] (a [Concept('concept_good_consumption','spotřeby')]) [Concept('concept_good','zboží')|l]. Mohou také produkovat řadu dalších užitečných věcí, jako je [Concept('concept_bureaucracy','byrokracie')|l], [Concept('concept_infrastructure','infrastruktura')|l] a [GetGoods('merchant_marine').GetName|l].\n\nK vykonávání jejich funkcí vyžadují [Concept('concept_workforce','pracovní sílu')|l] složenou z [Concept('concept_pop','populací')|l] různých [Concept('concept_profession','profesí')], kteří za svoji práci dostávají [Concept('concept_building_wage','mzdu')].\n\nJakou funkci plní konkrétní budova určují její aktivní [Concept('concept_production_method','výrobní metody')|l], a velikost její dopadu na produkci určuje její [Concept('concept_building_level','úroveň')|l].[AddLocalizationIf(GetPlayer.IsValid,'concept_building_desc_added')]" # todo: CHANGED (predtym: $concept_buildings$ řídí ekonomiku vaší [Concept('concept_country','$concept_country_possessive|q$')] prostřednictvím [c)
 concept_building_desc_added: "\n\nMůžete [Concept('concept_construction','postavit')|l] nové nebo rozšířit stávající budovy v každém vašem [Concept('concept_state','státě')] pomocí budovy [GetBuildingType('building_construction_sector').GetName]." # todo: CHANGED (predtym: \n\nMůžete [Concept('concept_construction','$concept_construct|q$')] nové nebo rozšířit stávající $concept_buildings$ v )
 concept_building_group: "Skupina budov"
 concept_building_groups: "Skupiny budov"
 concept_building_group_desc: "$concept_building_group$ je skupina [Concept('concept_building','budov')], obvykle používaná k popisu podobných budov, které jsou potřeba k splnění určitých podmínek, například pro [Concept('concept_journal_entry','záznam v deníku')].\n\n#title Běžné $concept_building_groups$ jsou:#!#indent_newline:3 \n• [GetBuildingGroup('bg_agriculture').GetName]\n• [GetBuildingGroup('bg_plantations').GetName]\n• [GetBuildingGroup('bg_staple_crops').GetName]#!" # todo: CHANGED (predtym: $concept_building_group$ je skupina [Concept('concept_building','$concept_buildings|q$')], obvykle používaná k popisu po)
 concept_company: "Společnost"
 concept_companies: "Společnosti"
 concept_company_possessive: "Společnost"
 concept_company_desc: "$concept_companies$ jsou spojeny s jedním nebo několika typy [Concept('concept_building','budov')] v [Concept('concept_country','zemi')]. Po jejich založení v této zemi zvyšují [Concept('concept_throughput','efektivitu')] a @construction![Nbsp] [Concept('concept_construction','efektivitu výstavby')] svých přidružených budov. Míra, do jaké společnost poskytuje výhody, závisí na relativním hodnocení [Concept('concept_prestige','prestiže')] dané země v porovnání se zeměmi v #v Top [GetDefine('NDiplomacy','TOP_PRESTIGE_RANK_BONUS_THRESHOLD')]#!, které dostávají ještě silnější bonusy.\n\n$concept_companies$ disponují skórem [Concept('concept_prosperity','prosperity')], které se zvyšuje z vysoké [Concept('concept_productivity','produktivity')] a může poskytnout dodatečné bonusy pro svou zemi." # todo: CHANGED (predtym: $concept_companies$ jsou spojeny s jedním nebo několika typy [Concept('concept_building','$concept_buildings|q$')] v [Co)
 concept_prosperity: "Prosperita"
 concept_prosperous: "Prosperujúci"
 concept_prosperity_desc: "$concept_companies$ mají skóre prosperity, které závisí na jejich [Concept('concept_productivity','produktivitě')]. Když má společnost prosperitu alespoň [GetDefine('NEconomy','COMPANY_PROSPERITY_BONUS_ACTIVATION_THRESHOLD')|v0], bude se považovat za prosperující a aktivuje se bonusový [Concept('concept_modifier','modifikátor')|l] pro její [Concept('concept_country','zemi')].\nPokud prosperita prosperující společnosti klesne pod [GetDefine('NEconomy','COMPANY_PROSPERITY_BONUS_DEACTIVATION_THRESHOLD')|v0], přestane být považována za prosperující a její bonusový [Concept('concept_modifier','modifikátor')|l] bude deaktivován."
 concept_building_level: "Úroveň budovy"
 concept_building_level_short: "Úroveň"
 concept_building_levels: "Úrovně budovy"
 concept_building_levels_short: "Úrovně"
 concept_building_levels_parenthetical_plural: "Úroveň budovy"
 concept_building_levels_parenthetical_plural_short: "Úroveň"
 concept_building_level_desc: "$concept_building_level_short$ [Concept('concept_building','Budova')|l] škáluje aktuální [Concept('concept_good_consumption', 'spotřebu')], [Concept('concept_good_production', 'výrobu')] a požadavky na [Concept('concept_workforce', 'pracovní sílu')], a může mít vliv na [Concept('concept_economy_of_scale','úspory z rozsahu')|l].\n\nRozšíření úrovně budovy obvykle vyžaduje [Concept('concept_construction', 'výstavbu')], ačkoliv některé úrovně budovy se automaticky přizpůsobují na základě dalších faktorů, jako jsou [Concept('concept_infrastructure','infrastruktura')|l], míra [Concept('concept_conscription_center','odvodů')|l], nebo nevyužitá [Concept('concept_arable_land','orná půda')|l].\n\nKaždá úroveň je buď [Concept('concept_privately_owned','soukromě vlastněná')] nebo je v [Concept('concept_nationally_owned','národním vlastnictví')].\n\nMaximální úroveň, na kterou může být [Concept('concept_building','budova')|l] rozšířena, může záviset na [Concept('concept_resource_potential','potenciálu zdrojů')] nebo [Concept('concept_arable_land','orní půde')] ve [Concept('concept_state','státě')]." # todo: CHANGED (predtym: $concept_building_level_short$ [Concept('concept_building','budovy')] škáluje aktuální [concept_good_consumption], [conc)
 concept_diplomatic_play: "Diplomatická hra"
 concept_diplomatic_play_short: "Hra"
 concept_diplomatic_plays: "Diplomatické hry"
 concept_diplomatic_plays_short: "Hry"
 concept_diplomatic_play_negotiated: "Jednaný"
 concept_diplomatic_play_desc: "$concept_diplomatic_play$ je období nepřátelských diplomatických jednání mezi dvěma nebo více [Concept('concept_country','zemí')], které nastává poté, co jedna země vznesla vůči jiné požadavek na ústupek. Pro zahájení diplomatické hry musíte mít dostatečně vysokou [Concept('concept_interest_tier','úroveň zájmu')|l] v příslušném [Concept('concept_strategic_region','strategickém regionu')], což vás zároveň opravňuje účastnit se diplomatických her jako třetí strana v daném strategickém regionu.\n\n$concept_diplomatic_play$ bude [Concept('concept_escalation', 'eskalován')] během tří fází: [Concept('concept_opening_moves','počátečních kroků')], [Concept('concept_diplomatic_maneuvers','diplomatických manévrů')|l] a [Concept('concept_countdown_to_war','odpočtu do války')|l]. Tyto fáze stanovují podmínky případné [Concept('concept_peace_deal','mírové smlouvy')], pokud diplomatické hry eskalují do [Concept('concept_war','války')|l]. $concept_war$ lze odvrátit, pokud buď [Concept('concept_initiator','iniciátor')|l], nebo [Concept('concept_target','cíl')|l] hra ustoupí a přizná druhé straně její [Concept('concept_primary_demand','primární požadavky')]." # todo: CHANGED (predtym: $concept_diplomatic_play$ je období nepřátelských diplomatických jednání mezi dvěma nebo více [Concept('concept_country')
 concept_sympathy: "Sympatie"
 concept_sympathy_desc: "Všechny AI řízené [Concept('concept_country','země')|l] zapojené do [Concept('concept_diplomatic_play','diplomatické hry')] začínají s úrovní sympatii pro každou stranu, což ovlivňuje, jak pravděpodobné je, že je podpoří v konfliktu. AI [Concept('concept_country','země')|l] mají tendenci mít vyšší sympatie pro [Concept('concept_target','cíl')|l], pro země, se kterými mají [Concept('concept_diplomatic_pact','diplomatické pakty')|l], a pro ty, kteří se staví proti [Concept('concept_country','zemi')] s vysokou [Concept('concept_infamy','infamii')]. $concept_sympathy$ můžou také vzrůst v průběhu [Concept('concept_diplomatic_play','diplomatické hry')], protože strana, která získá mocné zastánce nebo hromadí [Concept('concept_infamy','infamii')] přidávaním [Concept('concept_war_goal','válečných cílů')] často generuje sympatie pro opačnou stranu." # todo: CHANGED (predtym: Všechny AI řízené [Concept('concept_country','$concept_countries|q$')] zapojené do [concept_diplomatic_play] začínají s )
 concept_neutrality: "Neutralita"
 concept_neutrality_desc: "Všechny AI řízené [Concept('concept_country','země')|l] zapojené do [Concept('concept_diplomatic_play','diplomatické hry')] mají úroveň [Concept('concept_neutrality','neutrality')] založenou na jejich vnitřních podmínkách a obecné úrovni zájmu o účastníky hry. Čím vyšší je jejich [Concept('concept_neutrality','neutralita')|l], tím obtížnější bude přesvědčit tihle [Concept('concept_country','země')|l], aby se zapojili do hry."
 concept_confidence: "Sebevědomí"
 concept_confidence_desc: "Umělou inteligencí ovládaná [Concept('concept_country','země')|l], která je jedním z hlavních účastníků v [Concept('concept_diplomatic_play','diplomatické hře')], má úroveň [Concept('concept_confidence','sebevědomí')|l], jež se odvíjí od její vnitřní situace a od toho, jak pravděpodobné se jí jeví vítězství v případné válce. Pravděpodobnost, že se AI [Concept('concept_country','země')|l] rozhodne ustoupit, přímo závisí na jejím [Concept('concept_confidence','sebevědomí')|l] — i když ani nízká úroveň [Concept('concept_confidence','sebevědomí')|l] nezaručuje ústup, zejména pokud by znamenal její anexi."
 concept_maneuver: "Manévr" # todo: CHANGED (predtym: Manéver)
 concept_maneuvers: "Manévry"
 concept_maneuver_desc: "$concept_maneuvers$ mohou být utraceny za akce v [Concept('concept_diplomatic_play','diplomatické hře')], včetně požadování dalších [Concept('concept_war_goal','válečných cílů')] nebo [Concept('concept_sway','ovlivňování')|l] jiných [Concept('concept_country','zemí')] na svou stranu. Množství manévrů, které máte, je omezeno vaší [Concept('concept_rank','hodností')]." # todo: CHANGED (predtym: $concept_maneuvers$ lze využít k podnikání akcí v [Concept('concept_diplomatic_play','diplomatické hře')], včetně nároko)
 concept_opening_moves: "Počáteční kroky"
 concept_opening_moves_desc: "Fáze počátečních kroků je první fází [Concept('concept_diplomatic_play','diplomatické hry')]. V této fázi si [Concept('concept_target','cíle')|l] nastaví svůj primární [Concept('concept_war_goal','válečný cíl')|l], a obě strany - jak  [Concept('concept_initiator','iniciátor')|l], tak i cíl, si mohou nárokovat další [Concept('concept_war_goal','válečné cíle')|l] pomocí [Concept('concept_maneuver','manévrů')]." # todo: CHANGED (predtym: Fáze [concept_opening_moves] je první fází [Concept('concept_diplomatic_play','diplomatické hry')]. V této fázi [concept)
 concept_diplomatic_maneuvers: "Diplomatické manévry"
 concept_diplomatic_maneuvers_desc: "$concept_diplomatic_maneuvers$ jsou druhou fází [Concept('concept_diplomatic_play','diplomatické hry')]. V této fázi se [Concept('concept_initiator','iniciátor')|l] a [Concept('concept_target','cíl')|l] mohou pokusit [Concept('concept_sway','ovlivnit')] ostatní [Concept('concept_country','země')|l], aby se přiklonili na jejich stranu, nebo si nárokovat další [Concept('concept_war_goal','válečné cíle')|l] pro sebe, za cenu [Concept('concept_maneuver', 'manévrů')]." # todo: CONCEPT CASE
 concept_countdown_to_war: "Odpočet do války"
 concept_countdown_to_war_desc: "Fáze $concept_countdown_to_war$ je třetí a poslední fází [Concept('concept_diplomatic_play','diplomatické hry')]. [Concept('concept_war','Válka')] se jeví jako nevyhnutelná, obě strany horečně dělají přípravy nebo zvažují jakékoli poslední možnosti ustoupit.\n\n@information! Typické přípravy na válku zahrnují: [Concept('concept_mobilize_army','mobilizace')|l] [Concept('concept_army','armád')], udělování svým [Concept('concept_general','generálům')] [Concept('concept_order','rozkazy')] na postup nebo obranu [Concept('concept_front','front')|l], povolávání [Concept('concept_conscript_battalion', 'odvedenců')] a povyšování vašich generálů pro zvýšení jejich [Concept('concept_command_limit', 'velitelského limitu')] tam, kde je to nutné." # todo: CHANGED (predtym: Fáze $concept_countdown_to_war$ je třetí a poslední fází [Concept('concept_diplomatic_play','diplomatické hry')]. [Conce)
 concept_war_leader: "Válečný vůdce"
 concept_war_leaders: "Váleční vůdci"
 concept_war_leader_desc: "Jedna [Concept('concept_country','země')|l] na každé straně [Concept('concept_war','války')] je považována za válečného vůdce tyhle strany, obvykle (ale ne vždy) to bývá [Concept('concept_initiator','iniciátor')|l] [Concept('concept_diplomatic_play','diplomatické hry')] a jeho [Concept('concept_target','cíl')|l]. Jen oni mohou navrhnout [Concept('concept_peace_deal','mírové smlouvy')|l], přičemž každá smlouva musí být ratifikována všemi vyjednávajícími členy války, aby byla přijata." # todo: CHANGED (predtym: Jedna [Concept('concept_country','země')|l] na každé straně [Concept('concept_war','války')] je považována za $concept_w)
 concept_initiator: "Iniciátor"
 concept_initiator_desc: "[Concept('concept_country','Země')], která začala [Concept('concept_diplomatic_play','diplomatickou hru')]."
 concept_target: "Cíl"
 concept_target_desc: "Cílová [Concept('concept_country','země')|l] v [Concept('concept_diplomatic_play','diplomatické hre')]."
 concept_homeland: "Domovina"
 concept_homelands: "Domoviny"
 concept_homeland_desc: "Domoviny pro jednotlivé [Concept('concept_culture','kultury')|l] se skládají z těch [Concept('concept_state_region','státních oblastí')], které [Concept('concept_pop','populace')|l] této kultury považují za své historické nebo přirozené území. Populace mají větší tendenci [Concept('concept_migration','migrovat')] do svých domovin než do jiných [Concept('concept_state','států')], a populace, které se tam nacházejí, nikdy nezváží [Concept('concept_assimilation','asimilování')|l].\n\nZahájení [Concept('concept_diplomatic_play','diplomatické hry')] k dobytí státu považovaného za domovinu jedné z vašich [Concept('concept_primary_cultures','primárních kultur')] je považováno za relativně legitimní a bude generovat podstatně méně [Concept('concept_infamy','infamie')] než obvykle." # todo: CHANGED (predtym: [Concept('concept_culture','$concept_culture_possessive|q$')] $concept_homelands$ se skládají z těch [Concept('concept_s)
 concept_mobilization_option: "Mobilizační možnost"
 concept_mobilization_option_short: "Možnost"
 concept_mobilization_options: "Mobilizační možnosti"
 concept_mobilization_option_desc: "[Concept('concept_army','Armáda')] může být v čase míru upravená libovolnou kombinací mobilizačních možností. Každá možnost přináší určitý náklad ve formě [Concept('concept_good','zboží')|l] a ovlivňuje všechny [Concept('concept_battalion','prapory')|l] v armádě po jejím [Concept('concept_mobilize_army','zmobilizování')]." # todo: CHANGED (predtym: [Concept('concept_army','$concept_army$')] může být v době míru vybavena libovolným počtem $concept_mobilization_options)
 concept_mobilize_army: "Mobilizace armády"
 concept_mobilize_army_mobilize: "Mobilizovat"
 concept_mobilize_army_mobilizing: "Mobilizace"
 concept_mobilize_army_mobilized: "Mobilizováno"
 concept_mobilize_army_mobilization: "Mobilizace"
 concept_mobilize_army_demobilize: "Demobilizovat"
 concept_mobilize_army_demobilized: "Demobilizovaný"
 concept_mobilize_army_demobilization: "Demobilizace"
 concept_mobilize_army_desc: "$concept_mobilize_army_mobilizing$ [Concept('concept_army','Armáda')|l] okamžitě zahájí proces mobilizace pro všechny vybrané [Concept('concept_battalion','prapory')|l]. Mobilizovaná [Concept('concept_army','armáda')|l] se automaticky demobilizuje, jakmile [Concept('concept_country','země')|l] přestane být ve [Concept('concept_war','válce')]. Předčasná demobilizace během aktivní války je možná, ale vyžaduje čas a značné náklady." # todo: CHANGED (predtym: $concept_mobilize_army_mobilizing$ [Concept('concept_army','armádu')|l] okamžitě zahájí proces $concept_mobilize_army_mo)
 concept_mobilize_battalion: "Mobilizovat prapor"
 concept_mobilize_battalion_demobilized: "Demobilizovaný"
 concept_mobilize_battalion_mobilize: "Mobilizovat"
 concept_mobilize_battalion_mobilizing: "Mobilizace"
 concept_mobilize_battalion_mobilized: "Mobilizováno"
 concept_mobilize_battalions_mobilized: "Mobilizované prapory"
 concept_mobilize_battalion_mobilization: "Mobilizace"
 concept_mobilize_battalion_mobilized_manpower: "Mobilizovaný personál"
 concept_mobilize_battalion_desc: "[Concept('concept_battalion','Prapory')] v [Concept('concept_mobilize_army','mobilizované')] [Concept('concept_army','armádě')] okamžitě začínají s mobilizací rychlostí založené na [Concept('concept_infrastructure','infrastruktuře')] jejich [Concept('concept_state','státu')], přičemž lepší [Concept('concept_infrastructure','infrastruktura')|l] znamená, že lze mobilizovat více praporů najednou. Mobilizované a mobilizovány prapory spotřebovávají více [Concept('concept_military_good','vojenského zboží')] na základě vybraných [Concept('concept_mobilization_option','mobilizačních možností')] [Concept('concept_army','armád')|l], ale jsou plně připravené následovat jakéhokoliv [Concept('concept_general','generála')] do [Concept('concept_battle','bitvy')]." # todo: CHANGED (predtym: [Concept('concept_battalion','$concept_battalions|q$')] v [Concept('concept_mobilize_army','$concept_mobilize_army_mobil)
 concept_fully_mobilized_battalions: "Plně mobilizované prapory"
 concept_fully_mobilized_battalions_desc: "Plně mobilizované [Concept('concept_battalion','prapory')|l] [Concept('concept_country','země')] zahrnují všechny [Concept('concept_mobilize_army', 'mobilizované')] prapory v [Concept('concept_army','armádách')], které již prošly [Concept('concept_mobilize_battalion','mobilizací')] a jsou plně připraveny následovat jakéhokoli z armádních [Concept('concept_general','generálů')] do [Concept('concept_battle','bitvy')]." # todo: CHANGED (predtym: Plně mobilizované [Concept('concept_battalion','$concept_battalions|q$')] [Concept('concept_country','$concept_country_p)
 concept_available_battalions: "Dostupné prapory"
 concept_available_battalions_desc: "Dostupné [Concept('concept_battalion','prapory')|l] [Concept('concept_country','země')] zahrnují všechny prapory aktuálně povolány do služby [SelectLocalization(GetPlayer.IsValid,'concept_available_battalions_desc_added','kasárnami')] a/nebo [Concept('concept_conscription_center','náborovými centrami')]." # todo: CHANGED (predtym: Dostupné [Concept('concept_battalion','$concept_battalions|q$')] [Concept('concept_country','$concept_country_possessive)
 concept_available_battalions_desc_added: "[GetBuildingType('building_barrack').GetName]"
 concept_potential_battalions: "Potenciální prapor"
 concept_potential_regulars: "Potenciální pravidelní vojáci"
 concept_potential_conscripts: "Potenciální odvedenci"
 concept_potential_battalions_desc: "Maximální potenciální počet [Concept('concept_battalion','praporů')] [Concept('concept_country','země')|l] je součtem jeho potenciálních pravidelných praporů a potenciálních [Concept('concept_conscript_battalion','praporů odvedenců')].\n\n#b Potenciální pravidelní prapory#!: počet praporů, které aktuálně postavené budovy [SelectLocalization(GetPlayer.IsValid,'concept_potential_battalions_desc_added','kasárny')] [Concept('concept_country','země')|l] podporují\n\n#b Potenciální prapory#!: počet praporů, které by dodali budovy [SelectLocalization(GetPlayer.IsValid,'concept_potential_battalions_desc_additional','zápis konzervace')] v [Concept('concept_country','zemi')], pokud by byl [Concept('concept_conscription_center','odvod')|l] aktivován ve všech [Concept('concept_state','státech')]" # todo: CHANGED (predtym: Maximální potenciální počet [Concept('concept_battalion','$concept_battalions|q$')] [Concept('concept_country','$concept)
 concept_potential_battalions_desc_added: "[GetBuildingType('building_barrack').GetName]"
 concept_potential_battalions_desc_additional: "[GetBuildingType('building_conscription_center').GetName]"
 concept_conscription_center: "Odvodové středisko"
 concept_conscription_centers: "Odvodová střediska"
 concept_conscription_center_conscription: "Odvod"
 concept_conscripted: "Odvedený"
 concept_conscription: "Odvod"
 concept_conscription_center_desc: "Když je [Concept('concept_state','stát')|l] během [Concept('concept_diplomatic_play','diplomatické hry')] nebo [Concept('concept_war','války')] mobilizován, objeví se v něm [SelectLocalization(GetPlayer.IsValid,'concept_conscription_center_desc_added','centrum pro povinnou službu')] s [Concept('concept_building_level','úrovní')] odpovídající [#v míre odvodů#!] a velikosti [Concept('concept_pop','populace')|l] ve státě. Tato [Concept('concept_military_building','vojenská budova')|l] rekrutuje civilní [Concept('concept_workforce','pracovní sílu')] do [Concept('concept_conscript_battalion','praporů')], které budou automaticky přiřazeny k [Concept('concept_general','generálům')] ve svých [Concept('concept_hq','velitelstvích')], jakmile budou vytvořeny.\n\nPo válce se všechna $concept_conscription_centers$ deaktivují a odvedené prapory se rozpustí. $concept_pops$, která se vrátí do civilní služby, nemá zaručeno, že se vrátí k předchozí [Concept('concept_profession','profesi')], ale musí si hledat nové možnosti zaměstnání." # todo: CHANGED (predtym: Když je [Concept('concept_state','$concept_state$')] během [Concept('concept_diplomatic_play','diplomatické hry')] nebo )
 concept_conscription_center_desc_added: "[GetBuildingType('building_conscription_center').GetName]"
 concept_conscription_limit: "Limit odvedenců"
 concept_conscription_limit_short: "Limit"
 concept_conscription_limit_desc: "Maximální počet [Concept('concept_conscript_battalion', 'odvedených praporů')], které [Concept('concept_state','stát')|l] může rekrutovat. $concept_conscription_limit$ se vypočítává z [Concept('concept_workforce','pracovní síly')] určitého státu vynásobeného jeho mírou odvodů. Nemůže přesáhnout maximální limit odvodů stanovený vaším [Concept('concept_law','zákonem')] [GetLawGroup('lawgroup_army_model').GetName]." # todo: CHANGED (predtym: Maximální počet [Concept('concept_conscript_battalion','$concept_conscript_battalions|q$')], které [Concept('concept_sta)
 concept_strategic_objective: "Strategický cíl"
 concept_strategic_objectives: "Strategické cíle"
 concept_strategic_objective_short: "Cíl"
 concept_strategic_objective_desc: "$concept_strategic_objective$ může být přiřazen k armádě. Pokud je některý [Concept('concept_state','stát')|l] – nepřátelský nebo přátelský – přiřazen jako strategický cíl armády, všichni její postupující [Concept('concept_general','generálové')|l] se budou snažit posouvat [Concept('concept_front','frontu')] směrem k tomuto státu. Pokud je daný stát pod přátelskou kontrolou, armáda se zaměří na rozšíření obranného perimetru kolem něj. Při obraně se generálové zaměří na obranu státu a okolních oblastí a budou upřednostňovat obranné [Concept('concept_battle','bitvy')|l], které se nacházejí nejblíže ke strategickému cíli.\n\nJedna armáda může mít pouze jeden strategický cíl, ale více armád může sdílet ten samý strategický cíl v podobě konkrétního státu." # todo: CHANGED (predtym: $concept_strategic_objective$ může být přiřazen k [Concept('concept_army','$concept_army$')]. Pokud je nepřátelský nebo )
 concept_conscript_battalion: "Odvedený prapor"
 concept_conscript_battalions: "Odvedené prapory"
 concept_conscript_battalion_short: "Odvedenec"
 concept_conscript_battalions_short: "Odvedenci"
 concept_conscript_battalion_drafting: "Povolávání"
 concept_conscript_battalion_desc: "$concept_conscript_battalions$ jsou dočasné [Concept('concept_battalion','prapory')|l] rekrutované a udržované z civilní [Concept('concept_pop','populace')|l] [Concept('concept_conscription_center','odvodových středisk')] a aktivované během [Concept('concept_diplomatic_play','diplomatické hry')|l] nebo [Concept('concept_war','války')].\n\n@information! Pozor, odvedené prapory se nepočítají do [Concept('concept_command_limit','velitelského limitu')] [Concept('concept_army','armády')], dokud nejsou skutečně povolány a nasazeny." # todo: CHANGED (predtym: $concept_conscript_battalions$ jsou dočasné [Concept('concept_battalion','$concept_battalions|q$')] rekrutované a udržov)
 concept_front: "Fronta"
 concept_fronts: "Fronty"
 concept_front_desc: "Sbírka [Concept('concept_province','provincí')] na hranici [Concept('concept_theater','válčiště')|l] mezi dvěma [Concept('concept_country', 'zeměmi')] ve [Concept('concept_war','válce')|l] mezi sebou. [Concept('concept_general','Generálové')] mohou vydat [Concept('concept_order','rozkaz')|l] k postupu nebo obraně fronty, což může vést k [Concept('concept_battle','bitvám')], které mění velikost válčiště a místo fronty." # todo: CHANGED (predtym: Soubor [Concept('concept_province','$concept_provinces|q$')] na hranici [Concept('concept_theater','$concept_theaters|q$)
 concept_advancement_progress: "Pokrok v postupu"
 concept_advancement_progress_desc: "[Concept('concept_order','Rozkazy')] [Concept('concept_general','generálů')] k postupu na [Concept('concept_front','frontě')] akumulují denně [Concept('concept_advancement_progress','pokrok v postupu')|l] v závislosti na jejich [Concept('concept_advancement_speed','rychlosti postupu')].\nJakmile dosáhne [Concept('concept_advancement_progress','pokrok v postupu')|l] na [Concept('concept_front','frontě')] [GetDefine('NMilitary','BATTLE_PLAN_ADVANCE_PROGRESS_TO_LAUNCH')|v0], začne se [Concept('concept_battle','bitva')|l]. Když na [Concept('concept_front','frontě')] probíhá [Concept('concept_battle','bitva')|l], [Concept('concept_advancement_progress','pokrok v postupu')|l] pro danou [Concept('concept_front','frontu')] bude pozastaven." # todo: CHANGED (predtym: [Concept('concept_order','$concept_ordered|q$')] [Concept('concept_general','$concept_generals|q$')] k postupu na [Conce)
 concept_advancement_speed: "Rychlost postupu"
 concept_advancement_speed_desc: "Jak rychle může [Concept('concept_general','generál')|l] postupovat na své [Concept('concept_front','frontě')] akumulováním [Concept('concept_advancement_progress','pokroku v postupu')].\n$concept_general$ bez [Concept('concept_mobilize_battalion','mobilizovaných')] [Concept('concept_battalion','praporů')] má efektivní [Concept('concept_advancement_speed','rychlost postupu')|l] rovnou nule."
 concept_province: "Provincie"
 concept_provinces: "Provincie"
 concept_province_possessive: "Provincie"
 concept_province_land: "Území provincie"
 concept_province_desc: "Dílčí oblasti [Concept('concept_state','států')], z nichž každý má vlastní [Concept('concept_terrain','terén')|l]. $concept_provinces$ jsou převáděny mezi státy během [Concept('concept_colony','kolonizace')|l] a mohou být dočasně převáděny mezi [Concept('concept_theater','válčišti')] během [Concept('concept_war','války')] v důsledku výsledků [Concept('concept_battle','bitev')]." # todo: CHANGED (predtym: Dílčí oblasti [Concept('concept_state','$concept_states|q$')], z nichž každá má vlastní [concept_terrain]. $concept_prov)
 concept_battle_condition: "Bojové podmínky"
 concept_battle_conditions: "Podmínky bitvy"
 concept_battle_condition_short: "Podmínka"
 concept_battle_condition_desc: "Během [Concept('concept_battle','bitvy')|l] bude každá strana ovlivněna [Concept('concept_battle_condition','bojovými podmínkami')|l], které ovlivňují výsledek. Jaká podmínka nastane závisí na mnoha faktorech, které často zahrnují [Concept('concept_character_trait','charakterové rysy')|l] [Concept('concept_commander','velitelů')] odpovědných za tuto stranu." # todo: CHANGED (predtym: Během [Concept('concept_battle','$concept_battles|q$')] bude každá strana ovlivněna [Concept('concept_battle_condition',)
 concept_naval_battle_condition: "Podmínka námořního boje"
 concept_naval_battle_conditions: "Podmínky námořního boje"
 concept_naval_battle_condition_short: "Podmínka"
 concept_naval_battle_condition_desc: "[Concept('concept_naval_battle','Námořní bitvy')] jsou ovlivněny $concept_naval_battle_condition$, které působí na všechny zúčastněné v bitvě. Která $concept_naval_battle_condition_short$ platí, závisí na několika faktorech, často včetně případných [Concept('concept_harvest_condition','podmínek sklizně')] ovlivňujících lokaci $concept_naval_battle$." # todo: CONCEPT CASE
 concept_army: "Armáda"
 concept_armies: "Armády"
 concept_army_possessive: "armádní"
 concept_army_long: "Armádní formace"
 concept_army_desc: "$concept_army$ je část vašich pozemních sil, skládající se z #bold pěchoty#!, #bold dělostřelectva#! a #bold jízdy#!. [Concept('concept_army','Armádě')] mohou být dány rozkazy jako #bold $advance$#! nebo #bold $defend$#!." # todo: CHANGED (predtym: Armáda je pozemní [Concept('concept_military_formation','$concept_military_formation|q$')] složená z $combat_unit_group_)
 concept_fleet: "Loďstvo"
 concept_fleets: "Loďstva"
 concept_fleet_possessive: "loďství"
 concept_fleet_long: "Tvorba loďstva"
 concept_fleet_desc: "$concept_fleet$ je námořní [Concept('concept_military_formation','vojenská formace')|l] složená z [Concept('concept_ship','lodí')|l], které velí [Concept('concept_admiral','admirál')|l], jenž celé formaci propůjčuje bonusy ze svých [Concept('concept_character_trait','rysů postavy')|l] a [Concept('concept_order','rozkazů')|l].\n\nFlotilu lze vyslat na [Concept('concept_naval_mission','námořní mise')|l], jako jsou [GetNavalMissionType('naval_mission_type_intercept').GetName], [GetNavalMissionType('naval_mission_type_blockade').GetName] a [GetNavalMissionType('naval_mission_type_port_bombardment').GetName], které pokrývají několik [Concept('concept_sea_node','námořních oblastí')|l]. V [Concept('concept_naval_battle','námořních bitvách')|l] se střetne s každou nepřátelskou flotilou, kterou najde (nebo která najde ji).\n\nBudování [Concept('concept_fleet','flotil')|l] obvykle trvá dlouho a mnoho lodí časem zastará, protože je nelze vždy vylepšit. Než příliš investujete do velkých flotil, dobře si to rozmyslete." # todo: CHANGED (predtym: Flotila je námořní [Concept('concept_military_formation','$concept_military_formation|q$')] složená z [Concept('concept_)
 concept_battle: "Bitva"
 concept_battles: "Bitvy"
 concept_battle_desc: "Když se dva [Concept('concept_commander','velitelé')|l] potkají a dostanou se do konfliktu během [Concept('concept_war','války')], oni a jejich [Concept('concept_unit','vojenské jednotky')|l] se střetnou v pokusu způsobit si [Concept('concept_casualties','ztráty')|l] a poškodit si navzájem [Concept('concept_morale','morálku')]. Strana, které dojde její [Concept('concept_manpower','personál')|l] nebo se bude [Concept('concept_morale_demoralized','demoralizována')] jako první, se stáhne a nechá zvítězit druhou stranu.\n\nNa zemi se bitvy konají v [Concept('concept_province','provincích')] sousedících s [Concept('concept_front','frontou')|l], když se jeden [Concept('concept_general','generál')|l] pokouší zabrat nebo znovuobsadit [Concept('concept_province_land','půdu')|l]. Vítěz buď dobude více provincí, nebo zabrání nepříteli v tom, aby tak učinil.\n\nNa moři se bitvy konají v mořských uzlech, když jeden [Concept('concept_admiral','admirál')|l] zachytí druhého v důsledku konfliktních [Concept('concept_order','rozkazů')]. Vítěz zanechává svého protivníka poškozeného a nutí ho vrátit se do přístavu na opravy, čímž mu brání v provádění jeho rozkazu na nějakou dobu." # todo: CHANGED (predtym: Když se dva [Concept('concept_commander','$concept_commanders|q$')] střetnou během [concept_war], oni a jejich [Concept()
 concept_naval_battle: "Námořní bitva"
 concept_naval_battles: "Námořní bitvy"
 concept_naval_battle_desc: "Když se dva [Concept('concept_commander','velitelé')] setkají a střetnou během [Concept('concept_war','války')], oni a jejich [Concept('concept_ship','lodě')] se střetnou ve snaze způsobit [Concept('concept_casualties','ztráty')] a potopit protivníkovy $concept_ships$. Strana, jejíž $concept_ships$ byly všechny zničeny nebo ustoupily, se stáhne a ponechá druhé straně vítězství.\n\n$concept_naval_battles$ probíhají v Sea Node, když jeden [Concept('concept_admiral','admirál')] zachytí druhého kvůli konfliktu v [Concept('concept_order','rozkazech')]. Vítěz zanechá protivníka poškozeného a donutí jej vrátit se do přístavu na opravu, čímž mu dočasně znemožní vykonat jeho $concept_order$." # todo: CONCEPT CASE
 concept_timed_modifier: "Dočasný modifikátor"
 concept_timed_modifiers: "Dočasné modifikátory"
 concept_timed: "Dočasně"
 concept_timed_modifier_desc: "[Concept('concept_modifier','Modifikátor')] s datem expirace, po kterém zmizí. $concept_timed_modifiers$ mohou udržovat svůj plný účinek až do jeho data expirace, nebo postupně odeznívat až do dosažení cílového data."
 concept_modifier: "Modifikátor"
 concept_modifiers: "Modifikátory"
 concept_modifier_desc: "Jakákoli úprava hodnoty od její normy se považuje za $concept_modifier$. Tyto mohou být trvalé nebo [Concept('concept_timed_modifier','dočasně')], a jejich původ lze vždy vysledovat zpět k něčemu jako [Concept('concept_law','zákon')], [Concept('concept_technology','technologie')], [Concept('concept_institution','instituce')], [Concept('concept_building','budova')], [Concept('concept_character_trait','charakterový rys')] nebo dokonce k volbě provedené během speciální události. Hodnoty upravené $concept_modifiers$ mají všechny nápovědy, které vysvětlují úplný seznam zdrojů a jejich hodnot."
 concept_terrain: "Terén"
 concept_terrain_desc: "$concept_terrain$ v [Concept('concept_province','provincii')] určuje její [Concept('concept_combat_width','šířku bojiště')] a jak nestálé a nepředvídatelné budou [Concept('concept_battle','bitvy')|l] v této provincii. [Concept('concept_general','Generálové')] mohou být také více nebo méně zkušení v boji v různých typech terénu.\n\n$concept_terrain$ dané provincie se může změnit v důsledku výstavby [Concept('concept_building','budov')] ve [Concept('concept_state','státě')]." # todo: CHANGED (predtym: [Concept('concept_province','$concept_province_possessive|q$')] $concept_terrain$ určuje její [concept_combat_width] a t)
 concept_strategic_region: "Strategický region"
 concept_strategic_region_short: "Region"
 concept_strategic_regions: "Strategické regiony"
 concept_strategic_regions_short: "Regiony"
 concept_strategic_region_desc: "Kolekce [Concept('concept_state_region','regionů států')] považovaných za oblast strategické důležitosti. [Concept('concept_country','Země')|l] mají [Concept('concept_interest','zájem')|l] ve všech regionech, kde vlastní [Concept('concept_province','území provincie')|l], a mohou projektovat další [Concept('concept_interest','zájmy')|l] v jiných strategických regionech, pokud je jejich [Concept('concept_rank','hodnost')|l] dostatečně vysoká." # todo: CHANGED (predtym: Soubor [Concept('concept_state_region','$concept_state_regions|q$')] považovaný za oblast strategického významu. [Concep)
 concept_regional_objective: "Regionální cíl" # todo: NEW TRANSLATION
 concept_regional_objectives: "Regionální cíle" # todo: NEW TRANSLATION
 concept_regional_objective_desc: "Konkrétní cíl, kterého se [concept_country] snaží dosáhnout v [concept_strategic_region] v závislosti na postoji, který tam zaujímá: [concept_strategic_region_stance]." # todo: NEW TRANSLATION
 concept_strategic_region_stance: "AI postoj v strategickém regionu"
 concept_strategic_region_stance_short: "Postoj"
 concept_strategic_region_stances_short: "Postoje"
 concept_strategic_region_stance_desc: "$concept_strategic_region_stance_short$ je indikátorem zahraničněpolitických názorů [Concept('concept_country','zemí')] v konkrétním [Concept('concept_strategic_region','strategickém regionu')].\n\nTo může ovlivnit, jak se $concept_country$ zachová k [Concept('concept_diplomatic_play','diplomatické hře')] nebo zda chce takovou akci zahájit samo, stejně jako [Concept('concept_attitude','postoj')], které vůči $concept_countries$ v tom $concept_strategic_region_short$ rozvine." # todo: CONCEPT CASE
 concept_sway: "Ovlivnění"
 concept_swaying: "Ovlivňování"
 concept_swayed: "Ovlivněno"
 concept_sway_desc: "[Concept('concept_initiator','Iniciátor')] nebo [Concept('concept_target','cíl')|l] v [Concept('concept_diplomatic_play','diplomatické hře')] se může pokusit ovlivnit jakoukoliv jinou [Concept('concept_country','zemi')] s dostatečně vysokou [Concept('concept_interest_tier','úrovní zájmu')] ve [Concept('concept_strategic_region','strategickém regionu')] na svou stranu tím, že nabídne [Concept('concept_war_goal','válečný cíl')|l] nebo jiný příslib, jako je [Concept('concept_obligation','závazek')|l]. Pokus o ovlivnění země stojí [Concept('concept_maneuver','manévry')|l], a šance, že země řízená AI přijme nabídku závisí na vašich [Concept('concept_relations','vztazích')] a jejich [Concept('concept_attitude','postoji')] vůči vám, stejně jako vůči vašemu protivníkovi." # todo: CHANGED (predtym: [Concept('concept_initiator','Iniciátor')] nebo [Concept('concept_target','cíl')|l] v [Concept('concept_diplomatic_play')
 concept_offer_support: "Nabídnout podporu"
 concept_offer_of_support: "Nabídka podpory"
 concept_offer_support_desc: "Účastník [Concept('concept_diplomatic_play','diplomatické hry')] může nabídnou podporu [Concept('concept_initiator','iniciátorovi')] nebo [Concept('concept_target','cíli')]. Funguje to stejně jako [Concept('concept_sway','ovlivnění')|l], s tím rozdílem, že potenciální podporovatel stanoví podmínky, za co je ochoten podpořit, ale nevyžaduje žádný [Concept('concept_maneuver','manévry')|l] pro obě strany." # todo: CHANGED (predtym: Účastník [Concept('concept_diplomatic_play','$concept_diplomatic_play$')] může nabídnout podporu [concept_initiator] neb)
 concept_diplomatic_demand: "Diplomatický požadavek"
 concept_diplomatic_demands: "Diplomatické požadavky"
 concept_diplomatic_demand_short: "Požadavek"
 concept_diplomatic_demands_short: "Požadavky"
 concept_diplomatic_demand_desc: "$concept_diplomatic_demand$ je jediný [Concept('concept_war_goal','válečný cíl')|l], který jedna [Concept('concept_country','země')|l] požaduje od jiné. Pokud je [Concept('concept_diplomatic_demand','diplomatický požadavek')|l] odmítnut, začne [Concept('concept_diplomatic_play','diplomatická hra')|l] s požadovaným [Concept('concept_war_goal','válečným cílem')] jako [Concept('concept_primary_demand','primárním požadavkem')] ze strany [Concept('concept_initiator','iniciátora')]."
 concept_diplomatic_action: "Diplomatická akce"
 concept_diplomatic_actions: "Diplomatické akce"
 concept_diplomatic_actions_short: "Akce"
 concept_diplomatic_action_desc: "Široký termín pro interakce mezi dvěma [Concept('concept_country','zeměmi')] zahrnující [Concept('concept_instant_diplomatic_action','okamžité diplomatické akce')|l], [Concept('concept_ongoing_diplomatic_action','probíhající diplomatické akce')|l] a [Concept('concept_diplomatic_pact','diplomatické pakty')|l]. Liší se od [Concept('concept_diplomatic_play','diplomatických her')] tím, že třetí strana nemá právo vyjádřit se k její výsledku a není zde riziko, že akce sama o sobě může vyústit ve [Concept('concept_war','válku')]."
 concept_subject_action: "Akce závislé země"
 concept_subject_actions: "Akce závislé země"
 concept_subject_action_desc: "Typ [Concept('concept_diplomatic_action','diplomatické akce')|l], kterou mohou [Concept('concept_subject','závislé země')|l] mohou vykonat proti svému [Concept('concept_overlord','vládci')]."
 concept_overlord_action: "Akce vládce"
 concept_overlord_actions: "Akce vládce"
 concept_overlord_action_desc: "Typ [Concept('concept_diplomatic_action','diplomatické akce')], který můžou [Concept('concept_overlord','vládci')|l] vydat vůči svým [Concept('concept_subject','závislým zemím')]."
 concept_bloc_member_action: "Akce člena bloku"
 concept_bloc_member_actions: "Akce člena bloku"
 concept_bloc_member_action_desc: "Typ [Concept('concept_diplomatic_action','diplomatické akce')|l], který mohou [Concept('concept_power_bloc_member','členové bloku')|l] vykonávat proti jiným [Concept('concept_power_bloc_member','členům')], včetně [Concept('concept_power_bloc_leader','vůdce bloku')|l]."
 concept_bloc_leader_action: "Akce vůdce bloku"
 concept_bloc_leader_actions: "Akce vůdce bloku"
 concept_bloc_leader_action_desc: "Typ [Concept('concept_diplomatic_action','diplomatické akce')|l], kterou můžou vykonávat [Concept('concept_power_bloc_leader','vůdcové bloku')|l] vůči [Concept('concept_power_bloc_member','členům')]."
 concept_government_building: "Vládní budova"
 concept_government_buildings: "Vládní budovy"
 concept_government_building_desc: "[Concept('concept_building','Budova')] vlastněná a řízená [Concept('concept_government','vládou')] pomocí prostředků z [Concept('concept_treasury','pokladny')].\n\n$concept_government_buildings$ nemají [Concept('concept_good_production','výrobu')] [Concept('concept_good','zboží')|l] a tudíž žádné [Concept('concept_revenue','příjmy')|l], ale produkují množství dalších zdrojů důležitých pro provoz [Concept('concept_country','země')|l] jako [Concept('concept_bureaucracy','byrokracie')|l], [Concept('concept_infrastructure','infrastruktura')|l], [GetGoods('merchant_marine').GetName|l], a [Concept('concept_unit','vojenské jednotky')|l].\n\nPracovní síla nevojenských vládních budov je placena podle [Concept('concept_government_wage','vládní mzdy')], zatímco u [Concept('concept_military_building','vojenských budov')] je placena podle [Concept('concept_military_wage','vojenské mzdy')].\n\n$concept_government_buildings$ jsou vždy plně [Concept('concept_nationally_owned','vlastněny státem')]" # todo: CHANGED (predtym: [Concept('concept_building','Budova')] vlastněná a provozovaná [Concept('concept_government','vládou')] za použití prost)
 concept_military_building: "Vojenská budova"
 concept_military_buildings: "Vojenské budovy"
 concept_military_building_army_and_navy: "Armáda a námořnictvo"
 concept_military_building_desc: "[Concept('concept_government_building','Vládní budovy')] používané k výcviku, udržování a zásobování [Concept('concept_battalion','praporů')] a [Concept('concept_ship','lodí')] pro armádu a námořnictví [Concept('concept_country','země')]. [Concept('concept_workforce','Pracovní síla')] vojenských budov je placena podle [Concept('concept_military_wage','vojenské mzdy')]." # todo: CHANGED (predtym: [Concept('concept_government_building','$concept_government_buildings|q$')] používané k výcviku, udržování a zásobování )
 concept_incorporated_state: "Začleněný stát"
 concept_incorporated_states: "Začlenené státy"
 concept_incorporate_state: "Začlenit stát"
 concept_incorporated_state_possessive: "Začleněného státu"
 concept_incorporate: "Začlenit"
 concept_incorporated: "Začlenen"
 concept_incorporating: "Začleňování"
 concept_incorporation: "Začleňování"
 concept_incorporated_state_desc: "[Concept('concept_state','Státy')], které jsou plně integrovány do [Concept('concept_country','země')|l]. [Concept('concept_pop','Populace')] v začleněných státech platí daně, získává přístup k výhodám z [Concept('concept_institution', 'institucí')] a plně se účastní politického života země. [Concept('concept_unincorporated_state','Nezačleněné státy')] mohou být začleněny prostřednictvím někdy zdlouhavého procesu." # todo: CHANGED (predtym: [Concept('concept_state','$concept_states|q$')], které jsou plně integrovány do [concept_country]. [Concept('concept_pop)
 concept_capacity: "Kapacita"
 concept_capacities: "Kapacity"
 concept_capacity_desc: "Měření schopností vaši [Concept('concept_country','země')|l] v jedné ze tří oblastí: [Concept('concept_bureaucracy','byrokracie')], [Concept('concept_authority','autority')] a [Concept('concept_influence','vlivu')].\n\n$concept_capacities$ nejsou uchovávány a používány, ale neustále generovány z různých zdrojů a neustále spotřebovávány různými projekty, které převádzkujete. Zbývající zůstatek v každé oblasti je zobrazen v horním panelu.\n\nPřebytek [Concept('concept_capacity','kapacity')|l] poskytne vaši zemi drobný bonus, zatímco nedostatek [Concept('concept_capacity','kapacity')|l] způsobí velké penalizace." # todo: CHANGED (predtym: Měření schopností vaší [Concept('concept_country','$concept_country_possessive|q$')] v jedné ze tří oblastí: [concept_bu)
 concept_bureaucracy: "Byrokracie"
 concept_bureaucracy_desc: "@bur! Byrokracie je [Concept('concept_capacity','kapacita')|l] používaná k udržení administrativní soudržnosti a každodenního fungování vaši [Concept('concept_country','země')|l]. Náklady se zvyšují s populací ve vašich [Concept('concept_incorporated_state', 'začleněných státech')], s každou investicí do [Concept('concept_institution','institucí')|l] a také se používají ke spravování vašich [Concept('concept_commander','velitelů')]. @bur! získáte z provozování [Concept('concept_building','budov')] [SelectLocalization(GetPlayer.IsValid,'concept_bureaucracy_desc_added','Vládní správa')]." # todo: CONCEPT CASE
 concept_bureaucracy_desc_added: "[GetBuildingType('building_government_administration').GetName]"
 concept_authority: "Autorita"
 concept_authority_desc: "@aut! Autorita je [Concept('concept_capacity','kapacita')|l] používaná k provádění interních změn ve vaši [Concept('concept_country', 'zemi')], jako například vydávání [Concept('concept_decree', 'dekretů')] nebo správa [Concept('concept_interest_group', 'zájmových skupin')]. @aut! lze získat ze [Concept('concept_law', 'zákonů')]."
 concept_influence: "Vliv"
 concept_influence_desc: "@inf! Vliv je [Concept('concept_capacity','kapacita')|l] používaná na [Concept('concept_diplomatic_action','diplomatickou akci')|l], [Concept('concept_diplomatic_pact','diplomatické pakty')|l] a [Concept('concept_treaty','smlouvy')|l] vůči jiným [Concept('concept_country','zemím')]. @inf! získavate na základě své [Concept('concept_rank','hodnosti')]." # todo: CONCEPT CASE
 concept_institution: "Instituce"
 concept_institutions: "Instituce"
 concept_institution_possessive: "Instituce"
 concept_institution_desc: "$concept_institutions$ poskytují výhody pro [Concept('concept_incorporated_state', '$concept_incorporated_states|q$')|l] napříč vaší [Concept('concept_country','zemí')]. Údržba stojí [Concept('concept_bureaucracy','byrokracii')] úměrně k počtu [Concept('concept_pop','populace')|l] žijící ve vašich začleněných státech a úrovně investicí do [Concept('concept_institution','institucí')]. Vyšší úrovně zvyšují jak náklady, tak účinek. Úpravy úrovně investic trvají určitou dobu." # todo: CHANGED (predtym: $concept_institutions$ poskytují výhody [Concept('concept_incorporated_state','$concept_incorporated_states|q$')] napříč)
 concept_law: "Zákon"
 concept_laws: "Zákony"
 concept_law_desc: "$concept_laws$ stanovují základní pravidla, podle nichž váš [Concept('concept_country','země')] funguje a je spravován. Efekty $concept_law$ jsou určeny jak základními efekty daného $concept_law$, tak efekty jakýchkoli [Concept('concept_amendment','dodatků')] k němu připojených. Některé $concept_laws$ umožňují [Concept('concept_institution','instituce')], které poskytují další možnosti řízení. $concept_enactment_of_laws_potential$" # todo: CONCEPT CASE
 concept_amendment: "Dodatek"
 concept_amendments: "Dodatky"
 concept_amendment_desc: "$concept_amendment$ je doplněk k [Concept('concept_law','zákonu')], který mění jeho účinky, a který sponzoruje konkrétní [Concept('concept_interest_group','zájmová skupina')]. To, zda se zájem bude [Concept('concept_endorse_oppose','za nebo proti')] dodatku, určuje $concept_parent_law$ daného $concept_amendment$. $concept_amendment_repeal_desc$" # todo: CHANGED (predtym: $concept_amendment$ je doplněk k [concept_law], který mění jeho účinky a sponzoruje jej konkrétní [concept_interest_grou)
 concept_amendment_repeal: "Zrušení dodatku"
 concept_repeal: "Zrušení"
 concept_repealed: "Zrušen"
 concept_repealing: "Rušící"
 concept_amendment_repeal_desc: "[Concept('concept_amendment','Dodatek')] lze zrušit, pokud dodatek není v cooldownu a některá [Concept('concept_interest_group','zájmová skupina')|l] ve [Concept('concept_government','vládě')] [Concept('concept_endorse_oppose','odporuje')] mateřskému zákonu daného dodatku." # todo: CHANGED (predtym: [Concept('concept_amendment','$concept_amendment$')] lze $concept_repealed$, pokud není dodatek v době čekání a některá )
 concept_parent_law: "Mateřský zákon"
 concept_parent_law_desc: "$concept_parent_law$ [Concept('concept_amendment','dodatku')] určuje [Concept('concept_endorse_oppose','postoj')|l] [Concept('concept_ideology','ideologie')|l] vůči dodatku. Každá [Concept('concept_interest_group','zájmová skupina')|l] pak bude [Concept('concept_endorse_oppose','stavět')] k dodatku podle své ideologie." # todo: CHANGED (predtym: $concept_parent_law$ [Concept('concept_amendment','$concept_amendment$')] určuje [Concept('concept_endorse_oppose','$con)
 concept_enactment_setback: "Problém při schvalování"
 concept_enactment_setbacks: "Problémy při schvalování"
 concept_enactment_setback_short: "Problém"
 concept_enactment_setbacks_short: "Problémy"
 concept_enactment_setback_desc: "Během [Concept('concept_enactment_of_laws','uzákoňování')|l] nějakého [Concept('concept_law','zákona')|l] můžete narazit na  $concept_enactment_setbacks_short$. Může k tomu dojít v důsledku [Concept('concept_enactment_stall','obstrukce')] na milníku [Concept('concept_enactment_of_laws','uzákoňování')|l], jako následek [Concept('concept_enactment_debate','diskuze')], nebo pokud šance na [Concept('concept_enactment_success','úspěšné uzákonění zákona')|l] klesla pod #v 0#!. Pokud nasbíráte příliš mnoho problémů, schvalování zákona #r selže#!.\n\n@warning! Pokud schvalování #r selže#!, nebude možné pokusit se o prosazení tohoto zákona znovu po dobu #v [GetDefine('NPolitics','LAW_ENACTMENT_COOLDOWN_DAYS')|0] dní#!." # todo: CHANGED (predtym: Během [Concept('concept_enactment_of_laws','$concept_enactment_of_laws_enacting|q$')] nějakého [concept_law] můžete utrp)
 concept_enactment_phase: "Fáze schvalování"
 concept_enactment_phase_short: "Fáze"
 concept_enactment_phases_short: "Fází"
 concept_enactment_phases: "Fáze schvalování"
 concept_enactment_phase_desc: "Pro [Concept('concept_enactment_of_laws','schválení')] zákonu jej musíte úspěšně provést přes [GetDefine('NPolitics', 'LAW_ENACTMENT_MAX_PHASES')|v] fáze [AddLocalizationIf(GetPlayer.IsValid,'concept_enactment_phase_ingame_added')] dosažením [Concept('concept_enactment_success','Úspěchu')]. Během tohoto procesu existuje riziko [Concept('concept_enactment_setback','problémů')], které mohou způsobit, že prosazení zákona #r selže#!." # todo: CHANGED (predtym: Abyste [Concept('concept_enactment_of_laws','$concept_enactment_of_laws_enact|q$')] [concept_law], musíte jej úspěšně pr)
 concept_enactment_phase_ingame_added: "- [GetPlayer.GetCustom('enactment_phase_0')|v], [GetPlayer.GetCustom('enactment_phase_1')|v], a [GetPlayer.GetCustom('enactment_phase_2')|v] - "
 concept_money: "Peníze"
 concept_money_desc: "$concept_money$ vládnou světu. Používají se k platbě [Concept('concept_government_wage','vládních mezd')] a produkci [Concept('concept_bureaucracy','byrokracie')|l], k platbě za [Concept('concept_construction','stavební')] materiály, průmyslové [Concept('concept_subsidies','dotace')|l], [GetGoods('merchant_marine').GetName|l] pro vaše [Concept('concept_shipping_lane','námořní trasy')], a v neposlední řadě, za vaši armádu. $concept_money$ získávate ze [Concept('concept_taxes','zdanění')] vaší [Concept('concept_pop','populace')|l] a uplatňováním [Concept('concept_tariffs','cel')|l]. Nadbytečné peníze ve vaši [Concept('concept_treasury','pokladně')] se používají k uhrazení vašich [Concept('concept_loans','půjček')] nebo k vytváření zásob zlata ve vašich [Concept('concept_gold_reserves','zlatých rezervách')]. Nedostatek peněz zvyšuje vaše půjčky proti vašemu [Concept('concept_credit','úvěrovému limitu')], což závisí na tom, kolik peněz mají vaše [Concept('concept_building','budovy')|l] uložené jako [Concept('concept_cash_reserves','hotovostní rezervy')|l]." # todo: CHANGED (predtym: [concept_money] hýbou světem. Používají se k placení [Concept('concept_government_wage','$concept_government_wages|q$')])
 concept_workforce: "Pracovní síla"
 concept_workforce_desc: "$concept_workforce$ [Concept('concept_building','budovy')] se skládá z [Concept('concept_pop','populací')|l] různých [Concept('concept_profession','profesí')] v závislosti na aktuálně aktivní [Concept('concept_production_method','výrobní metody')]." # todo: CONCEPT CASE
 concept_gold_reserves: "Zlaté rezervy"
 concept_gold_reserves_desc: "Týdenní rozpočtový přebytek [Concept('concept_country','země')] se hromadí v její zlatých rezervách. Pokud se rozpočtová bilance stane negativní, jakékoliv [Concept('concept_money','peníze')|l] v zlatých rezervách budou vyčerpány jako první, než země začne brát [Concept('concept_loans','půjčky')|l]. Zlaté rezervy mohou narůst jen do určité části vašeho [Concept('concept_gdp','HDP')], než začne docházet k klesajícím výnosům. Hromadění zlata nakonec oslabí ekonomiku země." # todo: CHANGED (predtym: Týdenní rozpočtový přebytek [Concept('concept_country','$concept_country_possessive|q$')] se hromadí v jejích $concept_g)
 concept_cash_reserves: "Hotovostní rezervy"
 concept_cash_reserves_desc: "Aktiva [Concept('concept_building','budovy')|l] jsou uchovávána v její hotovostní rezervě. Pokud má budova pozitivní týdenní [Concept('concept_building_balance','bilanci')], část [Concept('concept_money','peněz')] je uložena do hotovostních rezerv, zatímco zbytek je vyplácen [Concept('concept_building_owners','vlastníkům budov')] ve formě [Concept('concept_dividends','dividend')].\n\n$concept_cash_reserves$ jsou považovány za vlastněné majiteli budov, a [Concept('concept_pop','populace')|l] se rozhněvá, pokud jejich hotovostní rezervy jsou ztraceny kvůli [Concept('concept_bankruptcy', 'bankrotu')|l]. Součet všech hotovostních rezerv ve vaši [Concept('concept_country','zemi')] určuje váš [Concept('concept_credit','kredit')|l]." # todo: CHANGED (predtym: Aktiva [concept_building] se uchovávají v jejích $concept_cash_reserves$. Pokud má $concept_building$ kladnou týdenní [c)
 concept_obsession: "Obsese"
 concept_obsessed: "Posedlý"
 concept_obsessions: "Obsese"
 concept_obsession_desc: "[Concept('concept_culture','Kultura')] může být posedlá konkrétním [Concept('concept_good','zbožím')]. [Concept('concept_pop','Populace')] této kultury bude utrácet výrazně více za zboží, nimž je posedlá, v porovnání s jiným zboží ve stejné kategorii [Concept('concept_pop_needs','potřeb')]." # todo: CHANGED (predtym: [concept_culture] může být $concept_obsessed$ konkrétním [Concept('concept_good','$concept_goods|q$')]. [Concept('concep)
 concept_taboo: "Tabu"
 concept_taboos: "Tabu"
 concept_taboo_desc: "Náboženství může mít tabu proti specifickému [Concept('concept_good','zboží')|l]. [Concept('concept_pop','Populace')] tohoto náboženství vynaloží výrazně méně na zboží, které považují za tabu, v porovnání s jiným zbožím v téže kategorii [Concept('concept_pop_needs','potřeb')]." # todo: CHANGED (predtym: [concept_religion] může mít $concept_taboo$ proti konkrétnímu [Concept('concept_good','$concept_goods|q$')]. [Concept('c)
 concept_goods_substitution: "Náhradné zboží"
 concept_goods_substitutes_short: "Náhražky"
 concept_goods_substitutable: "Nahraditelné"
 concept_goods_substitution_desc: "[Concept('concept_pop_needs','Potřebu obyvatel')] může uspokojit kterékoliv ze [Concept('concept_good','zboží')|l], které ji tvoří, a dostupnost jednotlivého zboží určuje, kolik jich bude spotřebováno.\n\nNapříklad [GetPopNeed('popneed_basic_food').GetName|l] jako potřebu splňuje [GetGoods('grain').GetName|l] a [GetGoods('meat').GetName|l]. [Concept('concept_pop','Populace')] typicky spotřebová více [GetGoods('grain').GetName|l] a méně [GetGoods('meat').GetName|l]. Pokud se však [GetGoods('meat').GetName|l] stane dostupnější než [GetGoods('grain').GetName|l], přeorientují se na konzumaci více [GetGoods('meat').GetName|l] a méně [GetGoods('grain').GetName|l]. V některých případech mohou populace i přestat konzumovat určité zboží, pokud neexistuje dostupnost pro tohle zboží.\n\nTaké [Concept('concept_culture','kulturní')] [Concept('concept_obsession','obsese')|l] a [Concept('concept_religion','náboženský')] [Concept('concept_taboo','tabu')|l] mohou výrazně ovlivnit spotřebu určitého zboží.\n\n$concept_goods$ s vyšší základní cenou přispějí více k naplnění potřeb populace než těch s nižší základní cenou. Například, jediná jednotka [GetGoods('groceries').GetName|l] je ekvivalentem několika jednotek [GetGoods('grain').GetName|l]." # todo: CHANGED (predtym: [Concept('concept_pop_needs','$concept_pop_need|q$')] lze uspokojit kterýmkoli [Concept('concept_good','$concept_goods|q)
 concept_market_price: "Tržní cena"
 concept_market_prices: "Tržní ceny"
 concept_market_price_share: "Podíl tržní ceny"
 concept_market_price_short: "Cena"
 concept_market_prices_short: "Ceny"
 concept_market_price_desc: "Cena [Concept('concept_good','zboží')|l] na [Concept('concept_market','trhu')]. Závisí na [Concept('concept_buy_orders','poptávce')] a [Concept('concept_sell_orders','nabídce')], a ovlivňuje [Concept('concept_local_price','místní cenu')] [Concept('concept_good','zboží')|l] ve všech participujících [Concept('concept_state','státech')] v závislosti na jejich [Concept('concept_market_access','přístupu na trh')].\n\nÚroveň, v jaké tržní cena ovlivňuje [Concept('concept_local_price','místní cenu')], se vypočítává vynásobením [Concept('concept_market_access','přístupu na trh')] s koeficientem #v $state_market_access_price_impact$#! [Concept('concept_state','státu')]." # todo: CHANGED (predtym: Cena [Concept('concept_good','zboží')|l] na [Concept('concept_market','trhu')]. Závisí na [Concept('concept_buy_orders',)
 concept_local_price: "Místní cena"
 concept_local_prices: "Místní ceny"
 concept_local_goods_prices: "Cena místního zboží"
 concept_local_price_desc: "Cena [Concept('concept_good','zboží')|l] v [Concept('concept_state','státě')]. Je určena místní [Concept('concept_good_production','výrobou')] a [Concept('concept_good_consumption','spotřebou')], regulovanou [Concept('concept_market_price','tržní cenou')] v závislosti na [Concept('concept_market_access','přístupu na trh')] pro daný [Concept('concept_state','stát')|l] a koeficientu #v dopadu cen kvůli přístupu na trh#!. Všechny transakce se uskutečňují za místní ceny, přičemž nákupy a prodeje vytvářejí [Concept('concept_buy_orders','nákupní')] a [Concept('concept_sell_orders','prodejní objednávky')|l] na [Concept('concept_market','trhu')]." # todo: CHANGED (predtym: Cena [Concept('concept_good','zboží')|l] v [Concept('concept_state','státě')]. Určuje ji místní [concept_good_consumptio)
 concept_world_market_price: "Cena na světovém trhu"
 concept_world_market_price_desc: "Průměrná cena, za kterou se [Concept('concept_good','zboží')|l] obchoduje na [Concept('concept_world_market','světovém trhu')]. Závisí to od poměru [Concept('concept_trade','exportů')] a importů daného zboží." # todo: CHANGED (predtym: Průměrná cena, za kterou se [Concept('concept_good','$concept_good$')] obchoduje na [concept_world_market]. Závisí na po)
 concept_import_price: "Dovozní cena"
 concept_import_price_desc: "Cena, za kterou se [Concept('concept_good','zboží')|l] importuje z [Concept('concept_world_market','světového trhu')] do konkrétního [Concept('concept_state','státu')]. Cenu ovlivňuje [Concept('concept_world_market_price','cena na světovém trhu')|l] a relativní [Concept('concept_trade_advantage','obchodní výhoda')|l] daného státu." # todo: CONCEPT CASE
 concept_export_price: "Vývozní cena"
 concept_export_price_desc: "Cena, za ktorú se [Concept('concept_good','zboží')]|l exportuje z konkrétního [Concept('concept_state','státu')] na [Concept('concept_world_market','světový trh')|l]. Cena je ovlivněná [Concept('concept_world_market_price', 'cenou na světovém trhu')] a relativní [Concept('concept_trade_advantage','obchodní výhodou')] daného státu." # todo: CONCEPT CASE
 concept_local_good: "Místní zboží"
 concept_local_goods: "Místní zboží"
 concept_local_good_desc: "$concept_local_goods$ jsou určité [Concept('concept_good','zboží')|l], které nejsou dostupná na širším [Concept('concept_market','trhu')] mimo [Concept('concept_state','státu')], ve kterém jsou produkovány. Jejich cena je plně určena místní [Concept('concept_good_production','výrobou')] a [Concept('concept_good_consumption','spotřebou')], přičemž [Concept('concept_market_price','tržní cena')|l] se vůbec nezohledňuje."
 concept_subsistence_building: "Samozásobitelská budova"
 concept_subsistence_buildings: "Samozásobitelské budovy"
 concept_subsistence_building_farming: "Samozásobitelská farma"
 concept_subsistence_building_desc: "Soubor [Concept('concept_building', 'budov')] provádějících nízkointenzivní, decentralizovanou výrobu potravin a základního [Concept('concept_good','zboží')|l] vhodných pro pouhé přežití. Jejich produkce je rozdělena mezi malé množství [Concept('concept_good','zboží')|l] na prodej na [Concept('concept_market','trhu')] a na [Concept('concept_subsistence_output','samozásobitelský výstup')|l], který zde pracující [SelectLocalization(GetPlayer.IsValid,'concept_subsistence_building_desc_added','Rolníci')] používají na udržení skrovného [Concept('concept_sol','životního standardu')]. Jsou výrazně méně efektivní než většina budov, ale budou fungovat na jakékoliv nenárokované [Concept('concept_arable_land','orní půdě')] a nevyžadují manuální [Concept('concept_construction','výstavbu')]." # todo: CHANGED (predtym: Soubor [Concept('concept_building','$concept_buildings|q$')] provádějících nízkointenzivní, decentralizovanou výrobu pot)
 concept_subsistence_building_desc_added: "[GetPopType('peasants').GetName]"
 concept_economy_of_scale: "Úspory z rozsahu"
 concept_economy_of_scale_desc: "Mnoho [Concept('concept_building','budov')] se stává efektivnějšími, čím větší jsou. Takové budovy získávají následující efekty za každou [Concept('concept_building_level','úroveň budovy')|l] nad první:\n[GetStaticModifier('economy_of_scale').GetDesc][AddLocalizationIf(GetPlayer.IsValid,'concept_economy_of_scale_desc_ingame_added')]" # todo: CHANGED (predtym: Mnoho [Concept('concept_building','$concept_buildings|q$')] se stává efektivnějšími, čím větší jsou. Takové [Concept('co)
 concept_economy_of_scale_desc_ingame_added: "\n\nVaše aktuální národní úroveň pro efekty Úspor z rozsahu je [GetPlayer.GetModifier.GetValueWithBreakdownFor('building_economy_of_scale_level_cap_add')]."
 concept_interest_group: "Zájmová skupina"
 concept_interest_groups: "Zájmové skupiny"
 concept_interest_group_possessive: "Zájmové skupiny"
 concept_interest_group_plural_possessive: "Zájmové skupiny"
 concept_interest_group_desc: "Politická frakce uvnitř vaší [Concept('concept_country','země')|l], která sdílí společný zájem. Jsou podporovány [Concept('concept_pop','populací')] v souvislosti s jejich [Concept('concept_interest_group_attraction','atraktivitou')], a [Concept('concept_clout','politický vliv')|l], které užívají, je založen přímo na [Concept('concept_political_strength','politické síle')] podporující populace. $concept_interest_groups$ mají řadu [Concept('concept_ideology','ideologií')], což způsobuje, že [Concept('concept_endorse_oppose','podporují')] různé [Concept('concept_law','zákony')|l].\n\nMají také tři [Concept('concept_interest_group_trait','rysy zájmové skupiny')|l], které se aktivují na různých úrovních [Concept('concept_approval','spokojenosti')]. [Concept('concept_leader','Vůdcova')] osobní ideologie se také projevuje na zájmové skupině." # todo: CHANGED (predtym: Politická frakce uvnitř vaší [concept_country], která sdílí společný zájem. Podporují ji [Concept('concept_pop','$concep)
 concept_interest_group_attraction: "Atraktivita zájmové skupiny"
 concept_interest_group_attraction_short: "Atraktivita"
 concept_interest_group_attractions: "Atraktivity zájmových skupin"
 concept_attracted: "Přitahován"
 concept_interest_group_attraction_desc: "Jak hodně je [Concept('concept_pop','populace')|l] nakloněna podporovat konkrétní [Concept('concept_interest_group','zájmovou skupinu')]. Ovlivněno vlastnostmi populace, jako [Concept('concept_profession','profese')|l], [Concept('concept_wealth','bohatství')|l] a [Concept('concept_education_access','přístup k vzdělání')|l], vysoká atraktivita znamená, že populace cítí, že je pravděpodobné, že právě tato zájmová skupina zastupuje jejich politické zájmy." # todo: CHANGED (predtym: Jak pravděpodobné je, že [Concept('concept_pop','$concept_pops|q$')] podpoří konkrétní [concept_interest_group]. Ovlivňu)
 concept_politician: "Politik"
 concept_politicians: "Politici"
 concept_politician_desc: "[Concept('concept_character_role','Role')] pro ty [Concept('concept_character','postavy')|l], jejichž vliv je spíš politický než vojenský. Mohou zastávat roli [Concept('concept_ruler','vládce')|l], [Concept('concept_heir','dědice')|l] nebo [Concept('concept_leader','vůdce')|l] [Concept('concept_interest_group','zájmové skupiny')] ."
 concept_leader: "Vůdce"
 concept_leaders: "Vůdci"
 concept_leader_possessive: "Vůdcova"
 concept_leader_desc: "[Concept('concept_character','Postava')], která vede [Concept('concept_interest_group','zájmovou skupinu')], má soubor [Concept('concept_character_trait','charakterových rysů')] které ji ovlivňují, a osobní [Concept('concept_ideology','ideologii')], která se přidává k ideologiím zájmové skupiny po dobu, po kterou je [Concept('concept_leader','vůdce')|l] u moci." # todo: CHANGED (predtym: [Concept('concept_character','Postava')], která vede [concept_interest_group], má soubor [Concept('concept_character_tra)
 concept_interest_group_trait: "Rys zájmové skupiny"
 concept_interest_group_traits: "Rysy zájmové skupiny"
 concept_interest_group_trait_short: "Rys"
 concept_interest_group_traits_short: "Rysy"
 concept_interest_group_trait_desc: "Všechny [Concept('concept_interest_group','zájmové skupiny')|l] mají tři rysy, které platí na různých úrovních [Concept('concept_approval','spokojenosti')] a mají značný dopad na celou [Concept('concept_country','zemi')].\nNegativní rys se aktivuje, pokud spokojenost klesne pod úroveň $ig_approval_unhappy$ (#v [GetDefine('NPolitics','APPROVAL_THRESHOLD_UNHAPPY')|0=+]#!)\nPozitivní rys se aktivuje, pokud spokojenost překročí úroveň $ig_approval_happy$ (#v [GetDefine('NPolitics','APPROVAL_THRESHOLD_HAPPY')|0=+]#!)\nDalší pozitivní rys se aktivuje, pokud spokojenost překročí úroveň $ig_approval_loyal$ (#v [GetDefine('NPolitics','APPROVAL_THRESHOLD_LOYAL')|0=+]#!).\nJakmile je aktivní, rys se neodstraní, dokud spokojenost nebude alespoň [GetDefine('NPolitics','IG_TRAIT_STICKINESS')|v] bodů od prahové hodnoty.\n\n$concept_interest_group_traits_short$ marginalizovaných zájmových skupin se nikdy neaktivují, zatímco rysy mocných zájmových skupin mají posílený účinek." # todo: CHANGED (predtym: Všechny [Concept('concept_interest_group','$concept_interest_groups|q$')] mají tři $concept_interest_group_traits_short$)
 concept_decay: "Odeznívaní"
 concept_decaying: "Odeznívající"
 concept_decay_desc: "Odeznívající efekt postupně ztrácí na síle, počínaje na své počáteční hodnotě a lineárně se snižující na #v 0#! počas stanovené doby odeznívaní." # todo: CHANGED (predtym: Odeznívající efekt postupně strácí na síle, počínaje na své počáteční hodnotě a lineárně se snižující na v 0 ! počas sta)
 concept_character_trait: "Charakterový rys"
 concept_character_traits: "Charakterové rysy"
 concept_character_trait_short: "Vlastnost"
 concept_character_traits_short: "Rysy"
 concept_character_trait_desc: "Osobnostní rysy, dovednostní rysy, nebo podmínky, které ovlivňují schopnost [Concept('concept_character','postavy')|l] vykonávat svou aktuální [Concept('concept_character_role','roli')|l]. Více odlišných rysů se může vyvinout, jak [Concept('concept_character','postava')|l] získává [Concept('concept_life_experience','životní zkušenosti')|l]." # todo: CHANGED (predtym: Osobnostní $concept_character_traits_short$, dovednostní $concept_character_traits_short$ nebo podmínky, které ovlivňují)
 concept_construction_queue: "Stavební fronta"
 concept_construction_queue_desc: "Jakákoliv [Concept('concept_building','budova')|l], která byla určena k rozšíření, ale v danou chvíli nevyužívá žádnou [Concept('concept_construction','výstavbu')], je zařazena do stavební fronty. Jakmile se uvolní výstavba, první budova ve stavební frontě začne tuto kapacitu využívat a přejde do stavu [Concept('concept_under_construction','ve výstavbě')|l]." # todo: CHANGED (predtym: Jakékoli [Concept('concept_building','$concept_buildings|q$')], které jsou určeny k rozšíření, ale právě nevyužívají žád)
 concept_government_construction: "Vládní výstavba"
 concept_government_constructions: "Vládní výstavby"
 concept_government_construction_desc: "$concept_government_construction$ je [Concept('concept_building','budova')|l], která je rozšiřována na přímý příkaz [Concept('concept_government','vlády')] [Concept('concept_country','země')].\n\nMůže čerpat prostředky přímo ze státní pokladny a může být reprioritizována nebo odstraněna z [Concept('concept_construction_queue','stavební fronty')].\n\nPostavené [Concept('concept_building_level','úrovně budov')] se stanou [Concept('concept_nationally_owned','vlastněny státem')]."
 concept_private_construction: "Soukromá výstavba"
 concept_private_constructions: "Soukromé stavby"
 concept_private_construction_desc: "$concept_private_construction$ je [Concept('concept_building','budova')|l], která je rozšiřována na příkaz soukromých subjektů.\n\nVždy je financována z [Concept('concept_investment_pool','investičního fondu')] a nelze ji prioritizovat nebo odstranit z [Concept('concept_construction_queue','stavební fronty')].\n\nVyprodukované [Concept('concept_building_level','úrovně budovy')|l] se stávají [Concept('concept_privately_owned','soukromě vlastněny')]."
 concept_under_construction: "Ve výstavbě"
 concept_under_construction_desc: "Když [Concept('concept_building','budova')|l] využívá [Concept('concept_construction','výstavbu')], považuje se za budovu ve výstavbě." # todo: CHANGED (predtym: Když [Concept('concept_building','budova')|l] využíva [Concept('concept_construction','výstavbu')], považuje se za budov)
 concept_urbanization: "Urbanizace"
 concept_urbanization_desc: "$concept_urbanization$ je vytvářena většinou [Concept('concept_building', 'budov')] postavených ve [Concept('concept_state','státě')], a to v různé míře. Jakmile se v daném [Concept('concept_state','státě')] nashromáždí dostatek urbanizace, budova [SelectLocalization(GetPlayer.IsValid,'concept_urbanization_desc_added','Urban Center')] bude automaticky rozšířena." # todo: CHANGED (predtym: $concept_urbanization$ vytváří v různé míře většina [Concept('concept_building','$concept_buildings|q$')] postavených ve)
