 concept_heritage_trait_desc: "$concept_heritage_trait_short$ [Concept('concept_discrimination_trait','diskriminační rysy')] představují původ nebo základy [Concept('concept_culture','kultura')] nebo [Concept('concept_religion','náboženství')]. Také patří do [Concept('concept_discrimination_trait_group','skupiny rysů')], širší rodiny podobných $concept_heritage_traits_short$." # todo: CONCEPT CASE
