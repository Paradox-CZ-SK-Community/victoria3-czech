 concept_split_states: "Rozdělené státy"
 concept_split_state_short: "Rozdělený"
 concept_split_state_desc: "[Concept('concept_state_region','Státní oblast')] rozdělen na několik menších [Concept('concept_state', 'států')] patřících různým [Concept('concept_country','zemím')]. [Concept('concept_resource_potential','Potenciály zdrojů')], [Concept('concept_building','budovy')|l] a [Concept('concept_pop','populace')|l] se při rozdělení redistribuuje mezi státy. Pokud jedna [Concept('concept_country','země')|l] ovládne více než jednu část rozděleného státu, budou tyto sloučeny do jednoho [Concept('concept_state','státu')]." # todo: CHANGED (predtym: [Concept('concept_state_region','Státní oblast')] rozdělená na několik menších [Concept('concept_state', '$concept_state)
 concept_unincorporated_state: "Nezačleněný stát"
 concept_unincorporated_state_short: "Nezačleněný"
 concept_unincorporated_states: "Nezačleněné státy"
 concept_unincorporated_state_icon: "@unincorporated!"
 UNINCORPORATED_ICON_WITH_CONCEPT: "[Concept('concept_unincorporated_state','@unincorporated!')]"
 concept_unincorporated_state_desc: "[Concept('concept_state','Stát')], který je sice součástí území [Concept('concept_country','země')|l], ale je považován za okrajovou državu nebo pohraniční oblast, mimo dosah [Concept('concept_institution','institucí')] a [Concept('concept_government','vlády')]. [Concept('concept_pop','Populace')], která žije v nezačleněných státech, je zbavena občanských práv – nepřispívá významně k [Concept('concept_political_strength','politické síle')] svých [Concept('concept_interest_group','zájmových skupin')] a nemůže [Concept('concept_votes','hlasovat')] ve [Concept('concept_election','volbách')]. Na druhou stranu je osvobozena od [Concept('concept_taxes','daní')].\n\nNezačleněné státy nevyžadují žádnou [Concept('concept_bureaucracy','byrokracii')] pro správu, protože se zde nevybírají [Concept('concept_taxes','daně')|l] a instituce zde neposkytují žádné výhody. Takové státy mohou být [Concept('concept_incorporated_state','začleněny')], čímž přejdou pod přímou správu ústřední vlády dané [Concept('concept_country','země')|l].[AddLocalizationIf(GetPlayer.IsValid,'concept_unincorporated_state_desc_added')]" # todo: CHANGED (predtym: [Concept('concept_state','Stát')], který je sice součástí území [Concept('concept_country','země')|l], ale je považován )
 concept_unincorporated_state_desc_added: "\n\n$concept_unincorporated_states$ podléhají následujícím účinkům:\n[GetStaticModifier('unincorporated_state').GetDesc]#!"
 concept_decentralized_nation: "Decentralizovaný národ"
 concept_decentralized_nations: "Decentralizované národy"
 concept_decentralized: "Decentralizovaný"
 concept_decentralized_nation_desc: "Decentralizovaný [Concept('concept_country','národ')|l] sdílí většinu vlastností zemí - [Concept('concept_pop','populaci')], [Concept('concept_ruler','vládce')|l], [Concept('concept_building','budovy')|l], [Concept('concept_law','zákony')|l] a tak dále - ale postrádá centralizovanou moc a/nebo vůli prosadit své hranice. To je činí náchylnými ke [Concept('concept_colony','kolonizaci')] ze strany zemí, které je neberou jako rovné partnery, s nimiž by mohly důstojně [Concept('concept_diplomatic_play','vyjednávat')] o zemských právech.\n\n$concept_decentralized_nations$ jsou řízeny AI a nejsou hratelné lidmi." # todo: CHANGED (predtym: Decentralizovaný [Concept('concept_country','$concept_country_nation|q$')] sdílí většinu vlastností [Concept('concept_co)
 concept_arable_land: "Orná půda"
 concept_arable_land_desc: "Množství půdy v [Concept('concept_state','státě')], které může být použito na pěstování plodin nebo chov dobytka. Na rozdíl od [Concept('concept_building','budov')] , které vyžadují k výstavbě určitý [Concept('concept_resource_potential','potenciály zdrojů')|l], $concept_arable_land$ je sdílena mezi [Concept('concept_building','budovy')|l], které jej vyžadují.\n\nMnožství orné půdy, které zůstává nevyužito jinými budovami, může být použito pro [Concept('concept_subsistence_building','samozásobitelskou budovu')|l], což umožní [Concept('concept_pop','populaci')] vydělat si i v případě, že nejsou zaměstnáni." # todo: CHANGED (predtym: Množství půdy v [Concept('concept_state','státě')], které může být použito na pěstování plodin nebo chov dobytka. Na roz)
 concept_state_region: "Státní oblast"
 concept_state_regions: "Státní oblasti"
 concept_state_region_possessive: "Státních oblastí"
 concept_state_region_desc: "Část světa odpovídající určitému pevnému souboru [Concept('concept_province', 'provincí')]. $concept_state_region$ je obvykle ekvivalentem [Concept('concept_state','státu')]. V některých případech se může region státu stát [Concept('concept_split_state','rozděleným státem')], kde dvě nebo více [Concept('concept_country','zemí')] ovládají [Concept('concept_state','stát')|l] ve stejném regionu státu." # todo: CHANGED (predtym: Část světa odpovídající určitému pevnému souboru [Concept('concept_province', '$concept_provinces|q$')]. [Concept('conce)
 concept_occupancy: "Obsazenost"
 concept_occupancy_desc: "Jak plně je [Concept('concept_building','budova')|l] využívána, což také určuje, kolik z její maximální [Concept('concept_good_production','výrobní')] kapacity je využito. Pokud má budova prostor najmout víc [Concept('concept_workforce','pracovníků')], pokusí se tak učinit. Pokud je její nábor omezen [Concept('concept_building_wage','mzdou')], bude zvyšovat mzdy tak dlouho, jak bude její [Concept('concept_building_balance','bilance')|l] zůstávat pozitivní."
 concept_votes: "Hlasy"
 concept_vote: "Hlas"
 concept_voting_rights: "Volební právo"
 concept_voting: "Hlasování"
 concept_votes_desc: "Vaše [Concept('concept_law','zákony')|l] určují, zda má daná [Concept('concept_pop','populace')|l] právo volit, a pokud ano, kolik [Concept('concept_political_strength','politické síly')] jejich hlasy přinesou. Během [Concept('concept_election','volebního')] období se hlasuje pro [Concept('concept_party','strany')|l]. $concept_pops$ obvykle hlasují pro strany, ke které náleží jejich [Concept('concept_interest_group','zájmová skupina')|l], ale mohou být získáni jinou stranou, která má větší [Concept('concept_momentum','momentum')|l]. Po datu [Concept('concept_election','voleb')] bude celkový počet hlasů, které každá strana obdržela, fixní až do dalších voleb, a zvýší [Concept('concept_clout','politický vliv')|l] jakékoliv zájmové skupiny, jejichž členy jsou ve straně." # todo: CHANGED (predtym: Vaše [Concept('concept_law', '$concept_laws|q$')] určují, zda má daná [concept_pop] právo volit, a pokud ano, kolik [con)
 concept_clout: "Politický vliv"
 concept_clout_desc: "Podíl [Concept('concept_interest_group','zájmové skupiny')|l] na celkové [Concept('concept_political_strength','politické síle')], kterou [Concept('concept_pop','populace')|l] v rámci své [Concept('concept_country','země')|l] generuje. $concept_clout$ je konečným ukazovatelem toho, jaký vliv má zájmová skupina, a ovlivňuje všechno od [Concept('concept_legitimacy','legitimity')] a [Concept('concept_enactment_of_laws','schvalování zákonů')|l], pokud je zájmová skupina [Concept('concept_in_government','ve vládě')|l], až po [Concept('concept_political_movement_support','podporu politických hnutí')] a [Concept('concept_activism','aktivismus hnutí')|l], pokud je [Concept('concept_in_opposition','V opozici')|l]. Také určuje, zda je zájmová skupina považovaná za [Concept('concept_powerful','silnou')], [Concept('concept_influential','vlivnou')] anebo je [Concept('concept_marginalized','marginalizována')|l]." # todo: CHANGED (predtym: Podíl [Concept('concept_interest_group','zájmové skupiny')|l] na celkové [concept_political_strength], kterou [Concept(')
 concept_powerful: "Silná"
 concept_powerful_desc: "$concept_influential_powerful_common$ [Concept('concept_interest_group_trait','rysy')] silné zájmové skupiny budou mít [GetDefine('NPolitics','POWERFUL_IG_TRAIT_BONUS')|%0=+] větší vliv než pokud by byli pouze vlivnou skupinou.\n\n$concept_interest_groups$ se považují za silné, když je jejich politický vliv větší než [GetDefine('NPolitics','POWERFUL_IG_THRESHOLD')|%0]." # todo: CHANGED (predtym: $concept_influential_powerful_common$ [Concept('concept_interest_group_trait','$concept_interest_group_traits|q$')] [con)
 concept_influential: "Vlivná"
 concept_influential_powerful_common: "Množství [Concept('concept_clout','politického vlivu')] [Concept('concept_interest_group','zájmové skupiny')] rozhoduje, zda je [Concept('concept_powerful','silná')], [Concept('concept_influential','vlivná')], nebo [Concept('concept_marginalized','marginalizována')]."
 concept_influential_desc: "$concept_influential_powerful_common$ [Concept('concept_interest_group_trait','Rysy')] [Concept('concept_influential','vlivné')|l] zájmové skupiny mají menší účinek, než kdyby byla [Concept('concept_powerful','mocná')|l].\n\n$concept_interest_groups$ jsou považovány za vlivné, dokud je jejich [Concept('concept_clout','vliv')|l] pod [GetDefine('NPolitics','POWERFUL_IG_THRESHOLD')|%0v], a za [Concept('concept_marginalized','marginalizované')|l], pokud je pod [GetDefine('NPolitics','MARGINAL_IG_THRESHOLD')|%0v] a nejsou ve [Concept('concept_government','vládě')|l]." # todo: CHANGED (predtym: $concept_influential_powerful_common$ [Concept('concept_interest_group_trait','$concept_interest_group_traits|q$')] [con)
 concept_marginalized: "Marginalizována"
 concept_marginalized_desc: "$concept_marginalized$ [Concept('concept_interest_group','zájmové skupiny')] mají příliš málo [Concept('concept_clout','politický vliv')], aby byly politicky významné, a nemohou být zařazeny do [Concept('concept_government','vlády')]. $concept_marginalized$ $concept_interest_group$, které mají podporu alespoň [GetDefine('NPolitics','MARGINAL_IG_JOIN_PARTY_POPULATION_THRESHOLD')], se budou moci připojit k [Concept('concept_party','straně')] a přestanou být $concept_marginalized$, jakmile tak učiní. Jejich [Concept('concept_interest_group_trait','rysy zájmové skupiny')] jsou deaktivovány po celou dobu, kdy zůstávají $concept_marginalized$.\n\n$concept_interest_groups$, které již jsou $concept_marginalized$, zůstanou $concept_marginalized$ tak dlouho, dokud jejich $concept_clout$ bude pod [GetDefine('NPolitics','MARGINAL_IG_THRESHOLD')|%0v]. $concept_interest_groups$, které nejsou $concept_marginalized$ a nejsou v $concept_party$, se stanou $concept_marginalized$, jakmile jejich $concept_clout$ klesne pod [GetDefine('NPolitics','MARGINAL_IG_CUTOFF')|%0v], pokud již nejsou [Concept('concept_in_government','ve vládě')], v takovém případě se nestanou $concept_marginalized$, dokud nejsou z [Concept('concept_in_government','ve vládě')] odstraněny." # todo: CHANGED (predtym: $concept_marginalized$ [Concept('concept_interest_group', '$concept_interest_groups|q$')] mají příliš málo [concept_clou)
 concept_politically_unaligned_aligned: "Politická angažovanost"
 concept_politically_unaligned: "Politicky neangažováni"
 concept_politically_involved: "Politicky angažováni"
 concept_politically_unaligned_aligned_desc: "Část [Concept('concept_pop','populace')|l], která nepodporuje [Concept('concept_interest_group','zájmovou skupinu')], se nazývá #b politicky neangažována#!. To je často způsobeno nízkou [Concept('concept_literacy','gramotností')] nebo [Concept('concept_sol','životním standardem')]. Části populace, které jsou politicky neangažované, se neúčastní politického procesu a jakákoliv [Concept('concept_political_strength','politická síla')|l], kterou mají, je nevyužita.\n\nOpakem je #b politicky angažováni#!. To znamená, že populace je součástí jedné ze [Concept('concept_interest_group','zájmových skupin')] vaši [Concept('concept_country','země')] a politická síla populace se přičítává k dané zájmové skupině." # todo: CHANGED (predtym: Část [Concept('concept_pop', '$concept_pops|q$')], která nepodporuje [concept_interest_group], se nazývá b politicky nea)
 concept_investment_level: "Úroveň investice"
 concept_investment_levels: "Úrovně investice"
 concept_investment_level_desc: "Aktuální úroveň [Concept('concept_institution','instituce')|l]. Každá úroveň stojí určité množství [Concept('concept_bureaucracy','byrokracie')|l] v závislosti na velikosti [Concept('concept_pop','populace')|l] ve vašich [Concept('concept_incorporated_state','začleněných státech')] a její účinky se zvyšují s úrovní instituce.[AddLocalizationIf(GetPlayer.IsValid,'concept_investment_level_ingame_added')]"
 concept_investment_level_ingame_added: "\n\nV současné době platíte @bur! #v [Multiply_CFixedPoint(GetPlayer.GetInstitutionInvestmentBureaucracyCost,'(CFixedPoint)-1')|0+]#! [Concept('concept_bureaucracy','byrokracie')|l] za celkově [GetPlayer.GetInstitutionInvestment|v0] úrovní investic, nebo-li @bur! #v [GetPlayer.GetInstitutionInvestmentBureaucracyFactor|+0]#! [Concept('concept_bureaucracy','byrokracie')|l] za každou úroveň."
 concept_production_lens: "Stavební čočka"
 concept_production_lens_desc: "Prozkoumejte [Concept('concept_state','státy')|l] a postavte [Concept('concept_good_production','výrobní')] [Concept('concept_building','budovy')|l]."
 concept_political_lens: "Politická čočka"
 concept_political_lens_desc: "Prozkoumejte [Concept('concept_interest_group','zájmové skupiny')|l] a [Concept('concept_incorporated_state','začlenené státy')|l], postavte [Concept('concept_government_building','vládní budovy')|l], vydávejte [Concept('concept_decree','dekrety')|l] a spravujte domácí záležitosti vaší [Concept('concept_country','země')|l]." # todo: CHANGED (predtym: Prozkoumejte [Concept('concept_interest_group','zájmové skupiny')|l] a [Concept('concept_incorporated_state','začleněné )
 concept_diplomatic_lens: "Diplomatická čočka"
 concept_diplomatic_lens_desc: "Sledujte [Concept('concept_attitude','postoj')|l] ostatních [Concept('concept_country','zemí')], kontrolujte své [Concept('concept_interest','zájmy')|l] a jejich [Concept('concept_strategic_region','strategické regiony')|l], uzavírejte [Concept('concept_diplomatic_pact','diplomatické pakty')|l], podnikejte [Concept('concept_diplomatic_action','akce')|l] a zahajujte [Concept('concept_diplomatic_play','diplomatické hry')|l]."
 concept_military_lens: "Vojenská čočka"
 concept_military_lens_desc: "Sledujte pokrok v probíhajících [Concept('concept_war','válkách')], stavte [Concept('concept_military_building','vojenské budovy')|l] a verbujte [Concept('concept_commander','velitele')]."
 concept_country: "Země"
 concept_countries: "Země"
 concept_country_nation: "Národ"
 concept_country_nation_state: "Národný stát"
 concept_country_polity: "Politický systém"
 concept_country_polities: "Politickými systémy"
 concept_country_possessive: "zemi"
 concept_countries_possessive: "zemí"
 concept_country_desc: "$concept_country$ se skládá z jednoho nebo více území zvaných [Concept('concept_province','provincie')|l] uspořádaných do [Concept('concept_state','států')], ve kterých žije [Concept('concept_pop','populace')|l], které je podřízené [Concept('concept_government','vládě')|l] a jejímu [Concept('concept_head_of_state','hlavě státu')|l]. Ve hře Victoria 3 ovládají země jak hráči, tak i umělá inteligence.\n\nKromě charakteru své populace, vlastněných států a míry jejich rozvoje je každá země dále určena svou [Concept('concept_country_tier','úrovní')], [Concept('concept_primary_cultures','primární kulturou')], [Concept('concept_state_religion','státním náboženstvím')] a tím, zda je [Concept('concept_recognized_power','uznanou')] nebo [Concept('concept_unrecognized_power','neuznanou')] mocností. $concept_countries$ mají také různé [Concept('concept_law','zákony')|l] a přístup k různým [Concept('concept_technology','technologiím')]." # todo: CHANGED (predtym: $concept_country$ se skládá z jednoho nebo více území zvaných [Concept('concept_province','$concept_province_land|q$')] )
 concept_decree: "Dekret"
 concept_decrees: "Dekrety"
 concept_decree_desc: "$concept_decrees$ jsou požadavky, které vznáší [Concept('concept_ruler','vládce')|l] [Concept('concept_country','země')], aby způsobily změny v [Concept('concept_state','státě')] pod jeho kontrolou. $concept_decrees$ stojí [Concept('concept_authority','autoritu')] tak dlouho, pokud jsou aktivní. Jakmile jsou vydány, dekret poskytne určité výhody pro stát, až dokud nebude odstraněn." # todo: CHANGED (predtym: $concept_decrees$ jsou požadavky, které vznáší [Concept('concept_ruler','vládce')|l] [Concept('concept_country','$concep)
 concept_pop_needs: "Potřeby populace"
 concept_pop_need: "Potřeba populace"
 concept_pop_needs_short: "Potřeby"
 concept_pop_need_short: "Potřeba"
 concept_pop_needs_desc: "[Concept('concept_pop','Populace')] utrácí svůj příjem za [Concept('concept_good','zboží')|l] k uspokojení svých potřeb. Čím vyšší je jejich [Concept('concept_wealth','bohatství')|l], tím více zboží si zakoupí. Populace získají rozmanitější a luxusnější potřeby, jak roste jejich bohatství. Určité potřeby můžou být často uspokojeny různým zboží prostřednictvím [Concept('concept_goods_substitution','náhražek')]. Pokud má populace po splnění svých potřeb peněz nazvyš, jejich bohatství se zvýší. Obráceně to platí i pro případ, že si populace nemůže dovolit uspokojit své potřeby, které neustále nakoupí, a jakýkoli nedostatek snižuje jejich bohatství." # todo: CHANGED (predtym: [Concept('concept_pop','$concept_pops|q$')] utrácejí svůj příjem za [Concept('concept_good','$concept_goods|q$')] k uspo)
 concept_combat_unit_group: "Skupina vojenských jednotek"
 concept_combat_unit_groups: "Skupiny vojenských jednotek"
 concept_combat_unit_group_short: "Skupina jednotek"
 concept_combat_unit_groups_short: "Skupiny jednotek" # todo: CHANGED (predtym: Skupiny jednotiek)
 concept_combat_unit_group_desc: "$concept_units$ jsou kategorizovány do [Concept('concept_default_unit','výchozích jednotek')] a [Concept('concept_special_unit','speciálních jednotek')], které mají různé přednosti a slabiny. #b [GetCombatUnitGroup('combat_unit_group_infantry').GetName]#! je lépe přizpůsobena pro obranu území, zatímco #b [GetCombatUnitGroup('combat_unit_group_cavalry').GetName]#! je lepší pro [Concept('concept_occupation','okupaci')]."
 concept_combat_unit_type: "Typ vojenské jednotky"
 concept_combat_unit_types: "Typy vojenských jednotek"
 concept_combat_unit_type_short: "Typ jednotky"
 concept_combat_unit_types_short: "Typy jednotek"
 concept_combat_unit_type_desc: "V rámci [Concept('concept_combat_unit_group','skupiny vojenských jednotek')|l] existují různé typy jednotek. Většinou se odemknou díky technologickému pokroku a jsou v boji lepší než typ, který nahrazují."
 concept_unit: "Vojenská jednotka"
 concept_units: "Vojenské jednotky"
 concept_unit_short: "Jednotka"
 concept_units_short: "Jednotky"
 concept_unit_possessive: "vojenské jednotky"
 concept_unit_desc: "$concept_units$ jsou [Concept('concept_battalion','prapory')] přiřazené k [Concept('concept_military_formation','formacím')] a provádějí vojenské operace pod vedením [Concept('concept_general','generála')]. $concept_battalions$ se dále dělí do samostatných skupin: [GetBattalionGroupsList]. Jednotky ve skupině #b Výchozí#! jsou neomezené, zatímco pokud máte více #b Speciálních#! jednotek než výchozích, může to způsobit postih k [Concept('concept_organization','organizaci')]." # todo: CONCEPT CASE
 concept_special_unit: "Speciální jednotka"
 concept_special_units: "Speciální jednotky"
 concept_special_unit_desc: "[Concept('concept_unit','Vojenské jednotky')], které nejsou #b [GetCombatUnitGroup('combat_unit_group_infantry').GetName]#! nebo #b [GetCombatUnitGroup('combat_unit_group_light_ship').GetName]#! - ty se považují za [Concept('concept_default_unit','výchozí jednotky')|l].\n\n$concept_special_units$ pro [Concept('concept_army','armády')|l] jsou:\n$TAB$#b [GetCombatUnitGroup('combat_unit_group_artillery').GetName]#!\n$TAB$#b [GetCombatUnitGroup('combat_unit_group_cavalry').GetName]#!\n\n$concept_special_units$ pro [Concept('concept_fleet','loďstva')|l] jsou:\n$TAB$#b [GetCombatUnitGroup('combat_unit_group_capital_ship').GetName]#!\n$TAB$#b [GetCombatUnitGroup('combat_unit_group_support_ship').GetName]#!" # todo: CHANGED (predtym: Jde o [Concept('concept_unit','$concept_units|q$')], které nejsou b [GetCombatUnitGroup('combat_unit_group_infantry').Ge)
 concept_default_unit: "Výchozí jednotka"
 concept_default_units: "Výchozí jednotky"
 concept_default_unit_desc: "[Concept('concept_unit','Vojenské jednotky')], které jsou buď #b [GetCombatUnitGroup('combat_unit_group_infantry').GetName]#! pro [Concept('concept_army','armády')|l] nebo #b [GetCombatUnitGroup('combat_unit_group_light_ship').GetName]#! pro [Concept('concept_fleet','loďstva')|l]." # todo: CHANGED (predtym: Jde o b [GetCombatUnitGroup('combat_unit_group_infantry').GetName] ! [Concept('concept_unit','$concept_units|q$')] v [Co)
 concept_kill_rate: "Poměr zabitých"
 concept_kill_rate_desc: "Jak efektivní je [Concept('concept_unit','vojenská jednotka')|l] při zajišťování, že [Concept('concept_casualties','ztráty')|l] jeho protivníka budou z boje vyřazeny natrvalo. Zvyšuje poměr [Concept('concept_casualties','ztrát')], které skončí zabity (místo [Concept('concept_wounded','zranění')|l]). $concept_kill_rate$ je vyvážen schopností [Concept('concept_recovery_rate','míry zotavení')|l]." # todo: CONCEPT CASE
 concept_recovery_rate: "Míra zotavení"
 concept_recovery_rate_desc: "Procento [Concept('concept_casualties','ztrát')] [Concept('concept_unit','vojenských jednotek')], kteří přežijí, v některých případech tím, že se stanou [Concept('concept_dependents','závislými osobami')]. Může být zvýšeno pomocí #b [Concept('concept_mobilization_option','možností mobilizace')]. $concept_recovery_rate$ vyvažuje [Concept('concept_kill_rate','poměr zabitých')|l] [Concept('concept_unit','vojenských jednotek')] nepřítele." # todo: CONCEPT CASE
 concept_casualties: "Ztráty"
 concept_casualties_desc: "[Concept('concept_manpower','Personál')], který padne v bitvě nebo skrze [Concept('concept_attrition','vyčerpání')|l], se považuje za ztráty. Část ztrát je zabita přímo, zatímco zbytek utrpí [Concept('concept_wounded','zranění')|l]. Tento poměr závisí na [Concept('concept_recovery_rate','míre obnovy')] [Concept('concept_unit','vojenské jednotky')] v porovnání s [Concept('concept_kill_rate','mírou zabití')] jejich nepřítele." # todo: CHANGED (predtym: [concept_manpower], který padne v bitvě nebo v důsledku [concept_attrition], se považuje za [concept_casualties]. Část [)
 concept_offense: "Útok"
 concept_offense_desc: "Bojová schopnost [Concept('concept_unit','vojenské jednotky')] v [Concept('concept_battle','bitvě')] při postupu na nepřátelské území."
 concept_defense: "Obrana"
 concept_defense_desc: "Bojová schopnost [Concept('concept_unit','vojenské jednotky')] v [Concept('concept_battle','bitvě')] při obraně proti nepřátelským vpádům."
 concept_blockade_strength: "Síla blokády"
 concept_blockade_strength_short: "Síla" # todo: NEW TRANSLATION
 concept_blockade_strength_desc: "Určuje, do jaké míry je [Concept('concept_fleet','loďstvo')] schopna úspěšně [Concept('concept_blockade','blokáda')] nepřátelské [Concept('concept_state','státy')]."
 concept_blockade_efficiency: "Účinnost blokády" # todo: NEW TRANSLATION
 concept_blockade_efficiency_desc: "$concept_blockade_efficiency$ je průměrná úroveň [Concept('concept_blockade','blokáda')], které [Concept('concept_fleet','loďstvo')] dosáhne ve všech nepřátelských přístavech v oblasti své [Concept('concept_naval_mission','námořní mise')]. Závisí na poměru [Concept('concept_blockade_strength','síly blokády')] vůči [Concept('concept_blockade_resistance','odolnosti proti blokádě')] každého cílového přístavu a je rovnoměrně rozdělena mezi všechny cílené přístavy." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 concept_blockade_resistance: "Odolnost proti blokádě" # todo: NEW TRANSLATION
 concept_blockade_resistance_short: "Odolnost" # todo: NEW TRANSLATION
 concept_blockade_resistance_desc: "$concept_blockade_resistance$ je množství [Concept('concept_blockade_strength','síly blokády')] potřebné k úplné [Concept('concept_blockade','blokádě')] [Concept('concept_state','státu')]. Závisí na faktorech, jako je produkce [Concept('concept_coastal_building','pobřežních budov')] a místní objem [Concept('concept_trade','obchodu')]." # todo: CHANGED (predtym: $concept_blockade_resistance$ je množství [Concept('concept_blockade_strength','síla blokády')] potřebné k úplnému [Conc)
 concept_blockade: "Blokáda"
 concept_blockade_level: "Úroveň blokády"
 concept_blockades: "Blokády"
 concept_blockading: "Blokáda" # todo: NEW TRANSLATION
 concept_blockaded: "Zablokovaný"
 concept_blockade_desc: "$concept_blockades$ se zakládají v [concept_sea_node] prostřednictvím [concept_admiral] vydávajícího [concept_order]. Poškozují [Concept('concept_supply_network','$concept_supply_networks|q$')] a omezují [concept_world_market_access] pro [Concept('concept_state','$concept_states|q$')], které obchodují přes [concept_world_market_hub] sousedící s [concept_sea_node]. $concept_blockade_level$ závisí na příslušné vlastnosti lodních [Concept('concept_unit','$concept_unit|q$')]. $ship_group_capital_ships$ jsou nejvhodnější pro $concept_blockades$." # todo: CHANGED (predtym: $concept_blockades$ se zakládají v [Concept('concept_sea_node','námořním uzlu')] prostřednictvím [Concept('concept_admir)
 concept_coastal_building: "Pobřežní budova" # todo: NEW TRANSLATION
 concept_coastal_buildings: "Pobřežní budovy" # todo: NEW TRANSLATION
 concept_coastal_building_desc: "Termín $concept_coastal_building$ označuje [Concept('concept_building','$concept_building$')|l] nacházející se v přístavní oblasti pobřežního [Concept('concept_state','státu')]. Během [Concept('concept_blockade','$concept_blockade$')|l] mají nevojenské $concept_coastal_buildings$ sníženou [Concept('concept_throughput','efektivitu')]. [GetNavalMissionType('naval_mission_type_port_bombardment').GetName] může zničit úrovně jakékoliv $concept_coastal_building$ s výjimkou budovy [GetBuildingType('building_naval_logistics_center').GetName].\n\nCelkem existuje #v [GetNumCoastalBuildingTypes]#! $concept_coastal_buildings$:#indent_newline:3 \n[GetCoastalBuildingTypesList]#!" # todo: CHANGED (predtym: Termín $concept_coastal_building$ označuje [Concept('concept_building','$concept_building$')|l] nacházející se v přístav)
 concept_naval_hostilities: "Námořní nepřátelství"
 concept_naval_hostilities_desc: "$concept_naval_hostilities$ je stav nepřátelství mezi dvěma [Concept('concept_country','zeměmi')] umožňující nepřátelské námořní akce bez formálního [Concept('concept_war','války')]. Flotily mohou vést [Concept('concept_battle','bitvy')] a uplatňovat [Concept('concept_blockade','blokády')] proti zemím, s nimiž mají $concept_naval_hostilities$." # todo: CONCEPT CASE
 concept_organization: "Organizace"
 concept_organization_organized: "Organizované"
 concept_organization_desc: "Nízká organizace u [Concept('concept_military_formation','formací')] se projevuje v nižší efektivitě během různých bojů. Organizace začíná nízkou hodnotou, když je [Concept('concept_military_formation','formace')|l] poprvé vytvořena, ale postupně narůstá, zatímco se [Concept('concept_military_formation','formace')|l] nevyužívá. Organizace je omezená, pokud máte příliš nízký [Concept('concept_command_limit','velitelský limit')|l] pro všechny vaše [Concept('concept_unit','vojenské jednotky')|l] nebo pokud má vaše [Concept('concept_military_formation','formace')|l] více [Concept('concept_special_unit','speciálních')] než [Concept('concept_default_unit','výchozích')] jednotek.\n\n$concept_organization$ může být také dočasně ovlivněna při přepínání [Concept('concept_mobilization_option','mobilizačních možností')] nebo při převodu [Concept('concept_unit','jednotek')] mezi různými [Concept('concept_mobilize_army','mobilizovanými')] armádami se různými soubory [Concept('concept_mobilization_option','mobilizačních možností')].\n\n#indent_newline:3 $concept_military_formation$ s nízkou organizací utrpí penalizace, jak nízká hodnota trvá, až po následující účinky:\n[GetStaticModifier('low_organization').GetDesc]#!" # todo: CHANGED (predtym: [concept_military_formation] s nízkou $concept_organization$ bude během [concept_battle] méně efektivní v mnoha ohledech)
 concept_unit_experience: "Zkušenosti jednotky"
 concept_experience: "Zkušenosti"
 concept_unit_experience_desc: "$concept_experience$ určuje [Concept('concept_veterancy_level','úroveň veteránství')] [Concept('concept_unit','vojenské jednotky')] a posádky v [Concept('concept_ship','lodích')]. Jakmile nasbírají dostatek $concept_experience$, jsou povýšeny na vyšší $concept_veterancy_level_short$.\n\nU $concept_units$ se $concept_experience$ získává postupně v čase, více když jsou mobilizované a během bitev.\n\nU $concept_ships$ způsobí nepřítomnost na [Concept('concept_naval_mission','námořní mise')], že její posádka časem ztrácí $concept_experience$." # todo: CONCEPT CASE
 concept_veterancy_level: "Úroveň veteránství"
 concept_veterancy_levels: "Úrovně veteránství"
 concept_veterancy_level_short: "Úroveň"
 concept_veterancy_levels_short: "Úrovně"
 concept_veterancy_level_desc: "[Concept('concept_unit','Vojenské jednotky')] a posádky v [Concept('concept_ship','lodích')] získávají $concept_veterancy_levels$ nasbíráním [Concept('concept_unit_experience','zkušeností jednotky')]. Vyšší $concept_veterancy_levels_short$ udělují rostoucí bonusy k útočným a obranným schopnostem příslušného $concept_unit$ nebo $concept_ship$." # todo: CONCEPT CASE
 concept_battalion: "Prapor"
 concept_battalions: "Prapory"
 concept_battalion_desc: "[Concept('concept_unit','Vojenská jednotka')] ve vojsku [Concept('concept_country','země')|l]. Vytvářejí a udržují je [SelectLocalization(GetPlayer.IsValid,'concept_battalion_desc_added','kasárny')|l] a velí jim [Concept('concept_general','generálové')|l]." # todo: CONCEPT CASE
 concept_battalion_desc_added: "[GetBuildingType('building_barrack').GetName]"
 concept_in_government: "Ve vládě"
 concept_in_government_desc: "[Concept('concept_interest_group','Zájmové skupiny')] zahrnuté ve [Concept('concept_government','vládě')] ovlivňují, které [Concept('concept_law','zákony')|l] mohou být [Concept('concept_enactment_of_laws','uzákoněn')|l] a určují [Concept('concept_legitimacy','legitimitu')]  [Concept('concept_country','země')|l]. Nikdy nepodpoří [Concept('concept_political_movement','politická hnutí')|l], pokud jejich měsíční [Concept('concept_approval','spokojenost')|l] neklesne natolik, že odejdou do [Concept('concept_in_opposition','opozice')|l]."
 concept_change_rate_scaling: "Škálování rychlosti změny"
 concept_change_rate_scaling_desc: "Jak se [Concept('concept_liberty_desire','touha po svobodě')] blíží k 0 nebo 100, její postup se zpomaluje díky $concept_change_rate_scaling$, což odráží přirozenou neochotu [Concept('concept_pop','populace')] odchýlit se od status quo a přijmout zvýšenou nebo sníženou [Concept('concept_autonomy','autonomii')]." # todo: CONCEPT CASE
 concept_in_opposition: "V opozici"
 concept_in_opposition_short: "Opozice"
 concept_in_opposition_desc: "[Concept('concept_interest_group','Zájmová skupina')] není součástí [Concept('concept_government','vlády')] a je považována za opozici. Jejich jediný způsob, jak dokážou ovlivnit [Concept('concept_enactment_of_laws','schvalování zákonů')|l], je prostřednictvím [Concept('concept_political_movement','politických hnutí')], ale jejich [Concept('concept_interest_group_trait','rysy zájmové skupiny')] se aplikují v plném rozsahu." # todo: CHANGED (predtym: [Concept('concept_interest_group','$concept_interest_groups|q$')] mimo [concept_government] jsou považovány za [concept_)
 concept_legitimacy: "Legitimita"
 concept_legitimate: "Legitimní"
 concept_legitimacy_desc: "$concept_legitimacy$ [Concept('concept_government','vlády')] měří, jak dobře složení [Concept('concept_interest_group','zájmové skupiny')] [Concept('concept_in_government','ve vládě')] odpovídá [Concept('concept_country','zemi')] [Concept('concept_law','zákony')]. Čím nižší $concept_legitimacy$, tím delší čas mezi pokusy [Concept('concept_enactment_of_laws','uzákonit')] o prosazení nových $concept_laws$. $legitimacy_coup_loc$ Změna [Concept('concept_taxes','daně')] (jejich zvýšení nebo snížení) také ovlivňuje $concept_legitimacy$."
 legitimacy_coup_loc: "$concept_government$ s vysokou legitimitou je více [Concept('concept_coup_resistance','odolná')] vůči [Concept('concept_coup','pučům')]." # todo: CHANGED (predtym: $concept_government$ s vysokou [concept_legitimacy] je více [Concept('concept_coup_resistance','$concept_coup_resistant|)
 concept_acceptance: "Přijetí"
 concept_accepted: "Akceptováno"
 concept_acceptance_desc: "Hodnota [Concept('concept_acceptance','přijetí')|l] [Concept('concept_pop','populace')|l] se pohybuje od [GetDefine('NPops', 'MIN_ACCEPTANCE_VALUE')|v] do [GetDefine('NPops', 'MAX_ACCEPTANCE_VALUE')|v] a určuje [Concept('concept_acceptance_status','status přijetí')|l] [Concept('concept_pop','populace')|l].\n\n$concept_acceptance$ závisí především od [Concept('concept_culture', 'kultury')] a [Concept('concept_religion', 'náboženství')] [Concept('concept_pop', 'populace')|l], ako i od příslušných zákonů v [Concept('concept_law_group', 'zákonných skupinách')] $CITIZENSHIP_GC_LINK$ a $CHURCH_AND_STATE_GC_LINK$ platných v [Concept('concept_country', 'zemi')], kde [Concept('concept_pop', 'populace')|l] žije.\n\nZměny v [Concept('concept_acceptance','přijetí')|l] nejsou vždy okamžité; [Concept('concept_pop', 'populace')|l] z určité [Concept('concept_cultural_community', 'kulturní komunity')] mohou mít odlišné [Concept('concept_acceptance', '$concept_acceptance$')|l] v důsledku nedávných změn [Concept('concept_law', 'zákonů')] nebo [Concept('concept_migration','imigrace')|l]." # todo: CHANGED (predtym: Hodnota [Concept('concept_acceptance','přijetí')|l] [Concept('concept_pop','$concept_pop_possessive|q$')] se pohybuje od)
 concept_acceptance_status: "Status přijetí"
 concept_acceptance_statuses: "Statusy přijetí"
 concept_acceptance_status_short: "Status"
 concept_accepted_status_short: "Přijatý"
 concept_acceptance_status_desc: "$concept_acceptance_status$ [Concept('concept_pop','Populace')|l] určuje, jak je přijímána nebo diskriminována v [Concept('concept_country', 'zemi')].\n\n$concept_acceptance_status_short$ pro [Concept('concept_pop', 'populaci')] se určuje podle hodnoty její [Concept('concept_acceptance','přijetí')|l].\n\nPřesné účinky pro určitý [Concept('concept_acceptance_status','status přijetí')|l] jsou určeny [Concept('concept_law', 'zákonama')] v [Concept('concept_country','zemi')].\n\nMožné [Concept('concept_acceptance_status','statusy přijetí')|l] jsou od nejnižšího po nejvyšší následovné:\n$EFFECT_LIST_BULLET$$VIOLENT_HOSTILITY_GC_LINK$\n$EFFECT_LIST_BULLET$$CULTURAL_ERASURE_GC_LINK$\n$EFFECT_LIST_BULLET$$OPEN_PREJUDICE_GC_LINK$\n$EFFECT_LIST_BULLET$$SECOND_RATE_CITIZEN_GC_LINK$\n$EFFECT_LIST_BULLET$$FULL_ACCEPTANCE_GC_LINK$" # todo: CHANGED (predtym: $concept_acceptance_status$ [Concept('concept_pop','$concept_pop_possessive|q$')] určuje, jak je přijímána nebo diskrimi)
 concept_national_awakening: "Národní obrození"
 concept_national_awakenings: "Národní probuzení" # todo: NEW TRANSLATION
 concept_national_awakening_desc: "[Concept('concept_culture','Kultura')], která dosáhne [GetDefine('NPops','CULTURAL_FERVOR_NATIONAL_AWAKENING_THRESHOLD')|0v] [Concept('concept_fervor','horlivost')], má šanci zahájit $concept_national_awakening$. $concept_cultures$ s aktivním $concept_national_awakening$ získají další $concept_fervor$, dokud je aktivní, a [Concept('concept_political_movement','politická hnutí')] s touto $concept_culture$ budou mít větší přitažlivost pro [Concept('concept_pop','populace')]." # todo: CHANGED (predtym: [Concept('concept_culture','Kultura')], která dosáhne [GetDefine('NPops','CULTURAL_FERVOR_NATIONAL_AWAKENING_THRESHOLD'))
 concept_ideological_incoherence: "Ideologická neslučitelnost"
 concept_ideological_incoherence_desc: "[Concept('concept_legitimacy','Legitimita')] [Concept('concept_government','země')] je snížena, pokud [Concept('concept_interest_group','zájmové skupiny')|l] [Concept('concept_in_government','ve vládě')|l] zastávají [Concept('concept_ideology','ideologie')|l], které se neshodují s aktuálními [Concept('concept_law','zákony')|l] v [Concept('concept_government','zemi')]." # todo: CHANGED (predtym: [Concept('concept_legitimacy','Legitimita')] [concept_government] je snížena, pokud [Concept('concept_interest_group','$)
 concept_market_capital: "Hlavní centrum trhu"
 concept_market_capitals: "Hlavní centra trhu"
 concept_market_capital_short: "Hlavní centrum"
 concept_market_capital_desc: "[Concept('concept_state','Stát')], který slouží jako uzel pro [Concept('concept_market','trh')|l], ke kterému musí všechna ostatní státy v trhu být připojena, jinak se stanou [Concept('concept_isolated_state','izolované')]. [Concept('concept_trade','Obchod')] se [Concept('concept_world_market','světovým trhem')] je často, ale ne vždy, spravován z hlavního centra trhu. $concept_market_capital$ je často stejný [Concept('concept_state','stát')|l] jako [Concept('concept_capital_state','hlavní město')|l] [Concept('concept_market_owner','majitele trhu')], ovšem je možné tyto dva také oddělit.[AddLocalizationIf(GetPlayer.IsValid,'concept_market_capital_desc_added')] " # todo: CHANGED (predtym: [Concept('concept_state','Stát')], který slouží jako uzel pro [concept_market], ke kterému musí být připojeny všechny os)
 concept_market_capital_desc_added: "\nNásledující účinky se uplatňují:\n[GetStaticModifier('market_capital_state').GetDesc]"
 concept_ownership_share: "Podíl na vlastnictví"
 concept_ownership_shares: "Podíly na vlastnictví"
 concept_ownership_share_desc: "Určuje, jak je rozdělen [Concept('concept_building_balance','zisk')|l] těch [Concept('concept_building_level','úrovní budov')], které jsou [Concept('concept_privately_owned','soukromě vlastněny')] jejich [Concept('concept_workforce','pracovníky')]. [Concept('concept_dividends','Dividendy')] jsou vypláceny každé [Concept('concept_pop','populaci')] jako [Concept('concept_pop_income','příjem')], v závislosti na velikosti jejich podílu v porovnání s ostatními členy pracovní síly. Populace se zároveň považuje za vlastníka odpovídajícího podílu aktuálních [Concept('concept_cash_reserves','hotovostních rezerv')] [Concept('concept_building','budovy')]. $ARISTOCRATS_GC_LINK$ a $CAPITALISTS_GC_LINK$ to mají jako hlavní zdroj příjmu, protože se považují za součást pracovních sil v budovách $MANOR_HOUSES_GC_LINK$ a $FINANCIAL_DISTRICTS_GC_LINK$." # todo: CHANGED (predtym: Určuje, jak je [Concept('concept_building_balance','$concept_building_balance_profit|q$')] těch [Concept('concept_buildi)
 concept_market_share: "Tržní podíl"
 concept_market_shares: "Tržní podíly"
 concept_market_share_desc: "$concept_market_share$ každé [Concept('concept_country','země')|l] na [Concept('concept_market','trhu')] určuje její [Concept('concept_gdp','HDP')], s bonusem, pokud jsou [Concept('concept_market_owner','majitelem trhu')]. Čím vyšší [Concept('concept_market_share','tržní podíl')|l], tím více [Concept('concept_consumption_tax','spotřební daně')|l] vybírají na [Concept('concept_market','trhu')]." # todo: CHANGED (predtym: $concept_market_share$ každé [Concept('concept_country','země')|l] na [Concept('concept_market','trhu')] určuje její [co)
 concept_default: "Platební neschopnost"
 concept_default_desc: "Jakmile se v [Concept('concept_treasury','pokladně')] nahromadí [Concept('concept_loans','půjčky')|l], které jsou dost velké, aby překročily celkový [Concept('concept_credit','kredit')|l] [Concept('concept_country','země')|l], je [Concept('concept_country','země')|l] považována za zemi v platební neschopnosti. To pozastaví veškerů probíhající [Concept('concept_construction','výstavbu')] a negativně ovlivní [Concept('concept_throughput','efektivitu')] [Concept('concept_building','budov')], což se v průběhu času stává stále závažnějším. Penalizace budou odstraněny hned, jak se týdenní zůstatek [Concept('concept_country','země')|l] opět stane kladným, nebo pokud je vyhlášen [Concept('concept_bankruptcy','bankrot')|l]." # todo: CHANGED (predtym: Jakmile se v [concept_treasury] nahromadí [concept_loans], které překročí celkový [concept_credit] [Concept('concept_cou)
 concept_decision: "Rozhodnutí"
 concept_decisions: "Rozhodnutí"
 concept_decision_desc: "Velké projekty, které může národ podniknout, se zobrazí jako #v $concept_decisions$#!, včetně expedic po celém světě a výstavby umělých kanálů.\n\n$concept_decisions$ lze nalézt pod [Concept('concept_journal_entry','záznamy v deníku')] v #v Deníku#!." # todo: CONCEPT CASE
 concept_bankruptcy: "Bankrot"
 concept_bankruptcy_desc: "Pokud je [Concept('concept_country','země')|l] v [Concept('concept_default', 'platební neschopnosti')] a není schopna splatit své [Concept('concept_loans','půjčky')|l], může se rozhodnout vyhlásit bankrot. To vymaže dluh, ale zničí všechny [Concept('concept_cash_reserves','hotovostní rezervy')|l], které si [Concept('concept_country','země')|l] půjčila, a velmi rozzuří jakoukoliv [Concept('concept_pop','populaci')], která [Concept('concept_privately_owned','soukromně vlastnila')] [Concept('concept_building','budovy')|l].[AddLocalizationIf(GetPlayer.IsValid,'concept_bankruptcy_desc_added')]" # todo: CHANGED (predtym: Pokud je [concept_country] v [concept_default] a není schopna splatit své [concept_loans], může se rozhodnout vyhlásit [)
 concept_bankruptcy_desc_added: "\n\nKromě toho se na vás uplatní následující efekty po #v [GetDefine('NEconomy','DECLARE_BANKRUPTCY_PENALTY_DURATION_YEARS')|0] let#!:\n[GetStaticModifier('declared_bankruptcy').GetDesc]"
 concept_market_owner: "Majitel trhu"
 concept_market_owners: "Majitelé trhu"
 concept_market_owner_possessive: "Majitel trhu"
 concept_market_owner_desc: "Majitel trhu [Concept('concept_country','země')|l], buď proto, že je jediným účastníkem, nebo je [Concept('concept_senior_partner','hlavní partner')|l] v [Concept('concept_customs_union','celní unii')]. Pouze majitel trhu může podepisovat [Concept('concept_trade_privilege','obchodní privilegia')|l] a uvalovat [Concept('concept_embargo','embarga')]." # todo: CHANGED (predtym: Majitel trhu [concept_country], buď proto, že je jediným účastníkem, nebo je [concept_senior_partner] v [concept_customs)
 concept_embargo: "Embargo"
 concept_embargoed: "Embargované"
 concept_embargoes: "Embarga"
 concept_embargoing: "Embargování"
 concept_embargo_desc: "[Concept('concept_ongoing_diplomatic_action','Probíhající diplomatická akce')], kterou jedna [Concept('concept_country','země')|l] uvalí na jinou,  a která snižuje [Concept('concept_trade_advantage','obchodní výhodu')] cílové země při vývozu [Concept('concept_good','zboží')|l] do země uvalující embargo prostřednictvím [Concept('concept_world_market','světového trhu')]. Země, které jsou ve [Concept('concept_war','válce')], na sebe automaticky uvalují embargo." # todo: CHANGED (predtym: [concept_ongoing_diplomatic_action] zřízená jednou [concept_country] proti jiné snižuje [concept_trade_advantage] cílové)
 concept_encourage_consumption: "Podpora spotřeby"
 concept_encouraging_consumption: "Podporovat spotřebu"
 concept_encourage_consumption_desc: "$concept_encouraging_consumption$ [Concept('concept_good','zboží')|l] zvýší tendenci [Concept('concept_pop','populace')|l] ho nakupovat jako součást jejich [Concept('concept_pop_needs','potřeb')|l], a bude preferováno před [Concept('concept_goods_substitution','nahrážkama')]. $concept_encouraging_consumption$ stojí [Concept('concept_authority','autoritu')]."
 concept_discourage_consumption: "Odrazování od spotřeby"
 concept_discouraging_consumption: "Odrazení od spotřeby"
 concept_discourage_consumption_desc: "$concept_discourage_consumption$ [Concept('concept_good','zboží')|l] sníží tendenci [Concept('concept_pop','populace')|l] ho nakupovat jako součást jejich [Concept('concept_pop_needs','potřeb')] a bude místo toho preferovat [Concept('concept_goods_substitution','náhražky')|l]. $concept_discouraging_consumption$ stojí [Concept('concept_authority','autoritu')]."
 concept_consumption_tax: "Spotřební daň"
 concept_consumption_taxes: "Spotřební daně"
 concept_consumption_tax_desc: "[Concept('concept_taxes','Daň')] vybíraná za specifické [Concept('concept_good','zboží')|l] zakoupené [Concept('concept_pop','populací')] k uspokojení jejich [Concept('concept_pop_needs','potřeb')]. Každé zboží podléhající spotřební dani stojí určitou částku [Concept('concept_authority','autority')]. Když se aplikuje na zboží, jeho [Concept('concept_market_price','tržní cena')|l] vzrůstá podle sazby spotřební daně při prodeji populace s tím, že všechny [Concept('concept_buy_orders','nákupní objednávky')|l] generované tímto způsobem vedou k vybrání poplatků do [Concept('concept_treasury','pokladny')]. Vzhledem k tomu, že poplatek je uplatněn na úrovni [Concept('concept_market','trhu')], daň je neúčinná ve [Concept('concept_state','státech')] s nízkým [Concept('concept_market_access','přístupem na trh')]." # todo: CHANGED (predtym: [Concept('concept_taxes','$concept_tax|q$')] vybíraná za určité [Concept('concept_good','$concept_goods|q$')] zakoupené )
 concept_loyalist: "Loajalista"
 concept_loyal: "Loajální"
 concept_loyalists: "Loajalisté"
 concept_loyalism: "Loajalismus"
 concept_loyalist_desc: "Loajalisté jsou [Concept('concept_individual','jednotlivci')|l] v rámci [Concept('concept_pop','populací')|l], kteří jsou spokojeni se stavem své [Concept('concept_country','země')|l] a jsou ochotni ji bránit proti odpůrcům – slovně i násilím, pokud je to nutné. [Concept('concept_approval','Spokojenost')] [Concept('concept_interest_group','zájmových skupin')], které podporují populace loajalistů, se zvyšuje\n\n$concept_loyalists$ vznikají, kdykoli se zvýší [Concept('concept_sol','životní standard')|l] populace, nebo v důsledku rozhodnutí během speciálních událostí.\n\nOpakem loajalisty je [Concept('concept_radical','radikál')|l]. Pokud by měl být v populaci vytvořen radikál, ale v ní už existují loajalisté, jeden z těchto loajalistů se místo toho stane [Concept('concept_neutral','neutrálním')]." # todo: CHANGED (predtym: $concept_loyalist$ [Concept('concept_individual','$concept_individuals|q$')] v rámci [concept_pop] jsou spokojeni se sta)
 concept_radical: "Radikál"
 concept_radicals: "Radikálové"
 concept_radicalism: "Radikalismus"
 concept_radicalize: "Radikalizovat"
 concept_radicalized: "Radikalizovaný"
 concept_radicalization: "Radikalizace"
 concept_radical_desc: "Radikální [Concept('concept_individual','jednotlivci')|l] v rámci [Concept('concept_pop','populací')|l] jsou zklamaní stavem své [Concept('concept_country','země')|l]. Přítomnost radikálů v [Concept('concept_state','státě')] přispívá k [Concept('concept_turmoil','nepokojům')] a radikalismus populace ovlivňuje [Concept('concept_activism','aktivismus hnutí')|l]. [Concept('concept_approval','Spokojenost')] [Concept('concept_interest_group','zájmových skupin')] které podporují populace radikálů, bude také ovlivněna.\n\n$concept_radicals$ vznikají, když [Concept('concept_sol','životní standard')|l] populace klesne pod jejich [Concept('concept_expected_sol','očekávaný minimální životní standard')|l], při poklesu [Concept('concept_sol','životního standardu')|l] populace a v důsledku rozhodnutí během speciálních událostí. $concept_pops$ trpící nízkým [Concept('concept_acceptance_status','statusem přijetí')] tyto negativní efekty ještě zhoršují. $concept_radicals$ se také tvoří mezi populacemi, které podporují politická hnutí s nesplněnými požadavky, a když jsou populace propuštěny z [Concept('concept_workforce','pracovní síly')] [Concept('concept_building','budovy')|l] (zejména pokud měly velký [Concept('concept_ownership_share','podíl na vlastnictví')|l]).\n\nOpakem radikálů je [Concept('concept_loyalist','loajalista')|l]. Pokud by měl být v populaci vytvořen loajalista, ale v ní už existují radikálové, jeden z těchto radikálů se místo toho stane [Concept('concept_neutral','neutrálním')]." # todo: CHANGED (predtym: $concept_radical$ [Concept('concept_individual','$concept_individuals|q$')] v rámci [concept_pop] jsou zklamaní stavem s)
 concept_neutral: "Neutrální"
 concept_neutrals: "Neutrální"
 concept_neutral_desc: "$concept_neutral$ [Concept('concept_individual','Jednotlivec')|l] uvnitř [Concept('concept_pop','populace')|l] nejsou ani [Concept('concept_radical','radikálové')] ani [Concept('concept_loyalist','loajální')|l] k jejich [Concept('concept_country','zemi')]. Nicméně, jsou jen jeden negativní nebo pozitivní krok od toho, aby se stali radikály nebo loajalisty.\n\nKdykoli bude vytvořen radikál v [Concept('concept_pop','populaci')], která již má loajalisty, místo toho se jeden loajalista stane neutrálním. Všichni jednotlivci v [Concept('concept_pop','populaci')] musí být buď neutrální nebo již radikály, aby se mohl vytvořit nový radikál. A naopak, když by byl vytvořen loajalista" # todo: CHANGED (predtym: $concept_neutral$ [Concept('concept_individual','$concept_individuals|q$')] uvnitř [concept_pop] nejsou ani [concept_rad)
 concept_rivalry: "Rivalita"
 concept_rivals: "Rivalové"
 concept_rival: "Rival"
 concept_rivalries: "Rivality"
 concept_rivaling: "Rivalizace"
 concept_rivalry_desc: "[Concept('concept_diplomatic_pact','Diplomatický pakt')|l] vyhlášen jednou [Concept('concept_country','zemí')] proti jiné s podobnou [Concept('concept_rank','hodností')], která generuje @inf! [Concept('concept_influence','vliv')|l] pro [Concept('concept_country','zemi')], jenž rivalitu vyhlásila. Aby se mohli stál země rivaly, musí mít překrývající se [Concept('concept_interest','zájmy')|l]. $concept_diplomatic_pact_short$ také omezí typ [Concept('concept_relations','vztahů')], které mezi těmito dvěma zeměmi mohou po dobu jejího trvání vzniknout." # todo: CHANGED (predtym: [Concept('concept_diplomatic_pact','Diplomatický pakt')|l] vyhlášený jednou [concept_country] proti jiné s podobnou [con)
 concept_colonial_growth: "Koloniální růst"
 concept_colonial_growth_desc: "Měření toho, jak rychle může [Concept('concept_country','země')|l] posunout hranici [Concept('concept_colony','$concept_colonial|q$')|l] vpřed. $concept_colonial_growth$ se generuje z [Concept('concept_institution','institucí')|l] [SelectLocalization(GetPlayer.IsValid,'concept_colonial_growth_ingame_added_2','Instituce Koloniální záležitosti')] v kombinaci s celkovou [Concept('concept_pop','populací')] v [Concept('concept_incorporated_state','začleněných státech')]. Celkové množství vygenerovaného koloniálního růstu se rozděluje mezi všechny kolonie, které [Concept('concept_country','země')|l] aktivně rozvíjí, až do maxima. [AddLocalizationIf(GetPlayer.IsValid,'concept_colonial_growth_ingame_added')]" # todo: CHANGED (predtym: Měření toho, jak rychle může [concept_country] posunout hranici [Concept('concept_colony','$concept_colonial|q$')] vpřed)
 concept_colonial_growth_ingame_added: "\n\n[GetPlayer.GetColonialGrowthDetails]"
 concept_colonial_growth_ingame_added_2: "[GetInstitutionType('institution_colonial_affairs').GetName]"
 concept_colony: "Kolonie"
 concept_colonies: "Kolonie"
 concept_colonize: "Kolonizovat"
 concept_colonial: "Koloniální"
 concept_colonized: "Kolonizováno"
 concept_colonizes: "Kolonizuje"
 concept_colonizing: "Kolonizace"
 concept_colonization: "Kolonizace"
 concept_colony_desc: "Osídlovací úsilí, započaté kolonizující [Concept('concept_country','zemí')] na území [Concept('concept_decentralized_nation','decentralizovaného národa')]. Potenciální kolonizátor musí mít [Concept('concept_institution','instituce')|l] [SelectLocalization(GetPlayer.IsValid,'concept_colony_desc_added','Institution Colonial Affairs')] a aktivní [Concept('concept_interest','zájem')|l] v [Concept('concept_strategic_region','strategickém regionu')]. Nejprve bude obsazena jedna [Concept('concept_province','provincie')|l]. Sousední provincie budou kolonizovány rychlostí závislou na [Concept('concept_colonial_growth','koloniálním růstu')] [Concept('concept_country','země')|l], což povede k vytváření [Concept('concept_tension','napětí')|l]."
 concept_colony_desc_added: "[GetInstitutionType('institution_colonial_affairs').GetName]"
 concept_escalation: "Eskalace"
 concept_escalate: "Eskalovat"
 concept_escalating: "eskalující"
 concept_escalates: "Eskalovat"
 concept_escalation_desc: "Jakmile byla zahájena [Concept('concept_diplomatic_play','diplomatická hra')|l], postupně se eskaluje skrze tři odlišné fáze: [Concept('concept_opening_moves','počáteční kroky')], [Concept('concept_diplomatic_maneuvers','diplomatické manévry')] a [Concept('concept_countdown_to_war','odpočet do války')]. Fáze omezují, jaké akce jsou účastníkům dostupné. Pokud se hra nevyřeší před tím, než eskalace dosáhne až na úroveň $concept_countdown_to_war$, vypukne [Concept('concept_war','válka')|l]."
 concept_revenue: "Příjmy"
 concept_revenue_desc: "Poté, co [Concept('concept_building','budova')|l] [Concept('concept_good_production','vyprodukuje')] [Concept('concept_good','zboží')|l], jsou prodávány za [Concept('concept_local_price','místní cenu')]. Množství [Concept('concept_money','peněz')] získané z prodeje tvoří příjmy budovy, tedy kladnou složku její [Concept('concept_building_balance','bilance')|l]." # todo: CHANGED (predtym: Poté, co [concept_building] [Concept('concept_good_production','$concept_good_produced|q$')] [Concept('concept_good','$c)
 concept_combat_width: "Šířka bojiště"
 concept_combat_width_desc: "$concept_combat_width$ pro určitý typ [Concept('concept_terrain','terénu')] určuje možnou početní výhodu silnější strany vůči slabší straně v [Concept('concept_battle','bitvě')]. Slabší strana může déle odolávat silnější, pokud je šířka bojiště relativně malá, a naopak." # todo: CHANGED (predtym: $concept_combat_width$ pro určitý typ [Concept('concept_terrain','terénu')] určuje možnou početní výhodu silnejší strany)
 concept_infamy: "Infamie" # todo: CHANGED (predtym: Infamia)
 concept_infamy_desc: "#italic Infamie označovala v římském právu bezectnost, újmu na občanské cti a vážnosti.#!\n\n$concept_infamy$ odráží míru, do jaké mezinárodní společenství, zejména vládnoucí [Concept('concept_great_power','velmoci')|l], vás považují za hrozbu, kterou je potřeba zastavit vzhledem k vašim minulým činem. Je získávána především způsobováním [Concept('concept_diplomatic_incident','diplomatických incidentů')] a uplatňováním [Concept('concept_war_goal','válečných cílů')] v [Concept('concept_peace_deal','mírových smlouvách')]. Vaše $concept_infamy$ ovlivňuje [Concept('concept_attitude','postoj')|l] zemí vůči vám a zvyšuje náklady na [Concept('concept_influence','vliv')|l] u [Concept('concept_diplomatic_pact','diplomatických paktů')]. Pokud dosáhne úrovně #b $infamy_pariah$#!, velmoci budou schopny zahájit proti vám [Concept('concept_diplomatic_play','diplomatickou hru')] [GetDiplomaticPlayType('dp_contain_threat').GetName]." # todo: CHANGED (predtym: $concept_infamy$ odráží míru, do jaké vás mezinárodní společenství, zejména vládnoucí [Concept('concept_great_power','$c)
 concept_diplomatic_incident: "Diplomatický incident"
 concept_diplomatic_incident_short: "Incident"
 concept_diplomatic_incidents: "Diplomatické incidenty"
 concept_diplomatic_incident_desc: "$concept_diplomatic_incident$ je obvykle způsoben [Concept('concept_country','zemí')], která zahájila [Concept('concept_diplomatic_play','diplomatickou hru')]. $concept_diplomatic_incidents$ generují [Concept('concept_infamy','infamii')] pro zemi, která je zahájila, a způsobí, že [Concept('concept_relations','vztahy')|l] klesnou se všemi zeměmi se [Concept('concept_interest','zájmem')] ve [Concept('concept_strategic_region','strategickém regionu')], zejména s cílem diplomatické hry. $concept_diplomatic_incidents$ mohou být také výsledkem jiných akcí, například rozhodnutí přijatých během zvláštních událostí."
 concept_tension: "Napětí"
 concept_tensions: "Napětí"
 concept_tension_desc: "Jak napjatý je vztah mezi [Concept('concept_colony','kolonizující')] [Concept('concept_country','zemi')] a blízkými [Concept('concept_decentralized_nation','decentralizovanými národy')]. $concept_tensions$ se všemi blízkými $concept_decentralized_nations$ roste vždy, když je převzata [Concept('concept_province','provincie')|l], a v průběhu času klesají, pokud není zabraná žádná nová půda.\n\nPokud úroveň napětí vzroste na úroveň #b $tension_volatile$#!, pokračující kolonizace může vyvolat [Concept('concept_native_uprising','domorodé povstání')|l]."
 concept_relations: "Vztahy"
 concept_relations_desc: "Vzájemné hodnocení diplomatického postoje mezi dvěma [Concept('concept_country', 'zeměmi')], měnící se od [GetDefine('NDiplomacy','MIN_RELATIONS')|+=] po [GetDefine('NDiplomacy','MAX_RELATIONS')|+=].\n\nObě strany mohou ovlivnit vztahy tím, že utratí [Concept('concept_influence','vliv')|l] za [Concept('concept_diplomatic_action','diplomatickou akci')|l] [GetDiplomaticActionType('increase_relations').GetName], [GetDiplomaticActionType('damage_relations').GetName], a [GetDiplomaticActionType('expel_diplomats').GetName] \n\nVztahy ovlivňují, které diplomatické akce a [Concept('concept_diplomatic_pact','pakty')] jsou dostupné pro dvě země, a také ovlivňuje pravděpodobnost, že přijmou diplomatické iniciativy nebo se postaví na vaši stranu v průběhu [Concept('concept_diplomatic_play','diplomatické hry')]." # todo: CHANGED (predtym: Vzájemné hodnocení diplomatického postoje mezi dvěma [Concept('concept_country', '$concept_countries|q$')], měnící se od)
 concept_ai_strategy: "Strategie"
 concept_ai_strategies: "Strategie"
 concept_ai_strategy_desc: "[Concept('concept_country','Země')] řízené AI mají soubor tří strategií v oblastech odpovídajících [Concept('concept_capacity','kapacitám')], které řídí jejich krátkodobé a dlouhodobé cíle, a jak postupují při rozhodování o ostatních zemích. Jaké strategie jsou vybrány, ovlivňuje celá řada faktorů, jako je velikost [Concept('concept_country','země')|l] a její [Concept('concept_rank','hodnost')|l], stejně jako současná [Concept('concept_government','vláda')|l]." # todo: CHANGED (predtym: AI řízené [Concept('concept_country','$concept_countries|q$')] mají soubor tří $concept_ai_strategies$ v oblastech odpov)
 concept_strategic_desire: "Strategická priorita"
 concept_strategic_desire_desc: "AI řízené [Concept('concept_country','země')|l] budou mít strategické priority vůči zemím, které považují za geopoliticky relevantní. Jejich strategická priorita představuje jejich celkové diplomatické ambice vůči dané zemi a je nejdůležitějším faktorem při určování jejich [Concept('concept_attitude','postoje')]." # todo: CHANGED (predtym: AI řízené [Concept('concept_country','$concept_countries|q$')] budou mít $concept_strategic_desire$ vůči [concept_countr)
 concept_attitude: "Postoj"
 concept_attitudes: "Postoje" # todo: NEW TRANSLATION
 concept_attitude_desc: "Ukazatel toho, jak k vám přistupuje jiná [Concept('concept_country','země')|l].\n\n$concept_attitude$ ovlivňuje, jaké typy akcí je země pravděpodobně ochotna vůči vám podniknout a jakou roli hrajete v jejích plánech.\n\n$concept_attitude$ se může změnit vždy, když dojde k [Concept('concept_diplomatic_catalyst','diplomatickému katalyzátoru')], a je založen na:\n$EFFECT_LIST_BULLET$[Concept('concept_relations','Vztazích')]\n$EFFECT_LIST_BULLET$[Concept('concept_infamy','Infamii')]\n$EFFECT_LIST_BULLET$[Concept('concept_strategic_desire','strategické prioritě')]\n$EFFECT_LIST_BULLET$Velikosti vaší armády\n$EFFECT_LIST_BULLET$S jakými $concept_countries$ máte uzavřené [Concept('concept_diplomatic_pact','diplomatické pakty')]" # todo: CHANGED (predtym: Ukazatel toho, jak k vám přistupuje jiná [concept_country].\n\n$concept_attitude$ ovlivňuje, jaké typy akcí je [concept_)
 concept_instant_diplomatic_action: "Okamžitá diplomatická akce"
 concept_instant_diplomatic_actions: "Okamžité diplomatické akce"
 concept_instant_diplomatic_action_desc: "Akce s okamžitým účinkem na zapojené [Concept('concept_country','země')|l]. Obvykle vyžadují určitou podmínku, která musí být splněna, aby byly vykonány, ale nestojí žádný [Concept('concept_influence','vliv')|l]." # todo: CHANGED (predtym: Akce s okamžitým účinkem na zapojené [Concept('concept_country','země')|l]. Obvykle vyžadují určitou podmínku, která mus)
 concept_ongoing_diplomatic_action: "Probíhající diplomatická akce"
 concept_ongoing_diplomatic_actions: "Probíhající diplomatické akce"
 concept_ongoing_diplomatic_action_desc: "Typ [Concept('concept_diplomatic_pact','diplomatického paktu')], který může být zahájen i ukončen podle libosti, bez potřeby schválení a nákladů pro cílovou [Concept('concept_country','zemi')]."
 concept_diplomatic_pact: "Diplomatický pakt"
 concept_diplomatic_pacts: "Diplomatické pakty"
 concept_diplomatic_pact_short: "Pakt"
 concept_diplomatic_pacts_short: "Pakty"
 concept_diplomatic_pact_desc: "Jednostranné nebo oboustranné porozumění mezi dvěma [Concept('concept_country', 'zeměmi')]. Mohou mít udržovací náklady za [Concept('concept_influence','vliv')|l] pro jednu nebo obě strany a mohou mít širokou škálu dopadů včetně vztahů se [Concept('concept_subject','závislou zemí')]. $concept_diplomatic_pacts_short$ se mohou z různých důvodů rozpadnout - například pokud se [Concept('concept_relations','vztahy')] příliš vychýlí na jednu či druhou stranu, pokud je jedna ze stran výslovně poruší, nebo pokud vyprší jejich časové omezení."
 concept_truce: "Příměří"
 concept_truces: "Příměří"
 concept_truce_desc: "$concept_truce$ je diplomatický stav, kdy je jedné [Concept('concept_country','zemi')] zakázáno činit [Concept('concept_diplomatic_demand','diplomatické požadavky')] nebo se připojit k ofenzivní [Concept('concept_diplomatic_play','diplomatické hře')] proti jiné zemi. $concept_truces$ mohou být jednostranné nebo vzájemné, a jsou vytvořeny různými způsoby, například když je podepsána [Concept('concept_peace_deal','mírová smlouva')|l] nebo je zrušena [Concept('concept_alliance','aliance')|l]."
 concept_war_reparations: "Váleční reparace"
 concept_war_reparations_desc: "Sekundárny [Concept('concept_war_goal','válečný cíl')|l], který může být připojen k [Concept('concept_diplomatic_play','diplomatické hře')] výběrem konkrétního [Concept('concept_article','článku')], jenž jej doprovází, a poté uplatněn v rámci [Concept('concept_peace_deal','mírové smlouvy')]. Pokud jsou válečné reparace prosazeny, vznikne nová [Concept('concept_treaty','smlouva')|l], která bude obsahovat všechny [Concept('concept_article','články')|l] jež druhá [Concept('concept_country','země')|l] označila jako součást válečných reparací, přičemž minimální závazné období této smlouvy bude trvat po dobu platnosti [Concept('concept_truce','příměří')|l]." # todo: CONCEPT CASE
 concept_colonization_rights: "Práva na kolonizaci"
 concept_colonization_rights_desc: "[Concept('concept_diplomatic_pact','Diplomatický pakt')], který vznikl, když bylo [Concept('concept_native_uprising','domorodé povstání')|l] [Concept('concept_decentralized_nation','decentralizovaného národa')] poraženo. Zvyšuje rychlost, jakou země s udělenými právami na kolonizaci kolonizuje jejich území, a má trvaní po dobu příměří." # todo: CHANGED (predtym: [Concept('concept_diplomatic_pact','Diplomatický pakt')], který vznikl, když bylo [Concept('concept_native_uprising','do)
 concept_foreign_investment: "Zahraniční investice"
 concept_foreign_investments: "Zahraniční investice"
 concept_foreign_investment_desc: "[Concept('concept_country','Země')], která staví a vlastní [Concept('concept_building_level','úrovně budov')|l] na území jiné země.\n\n$concept_foreign_investments$ mohou být prováděny [Concept('concept_overlord','vládcem')] na území jeho [Concept('concept_subject','závislých zemí')], nebo mezi dvěma suverénními zeměmi na základě podepsání [Concept('concept_treaty','smlouvy')] o [Concept('concept_foreign_investment_rights','právech na zahraniční investice')].\n\nJak [Concept('concept_government_construction','vládní')], tak [Concept('concept_private_construction','soukromá výstavba')|l] je umožněna prostřednictvím zahraničních investic.\n\nZatímco zahraniční vlastník financuje výstavbu a získává [Concept('concept_dividends','dividendy')|l], [Concept('concept_workforce','pracovní síla')|l] pochází z místního státu [Concept('concept_state','státu')] a [Concept('concept_taxes','daně')|l] jsou odváděny zemi, která tento stát ovládá. Jakékoli [Concept('concept_good','zboží')|l] použité v [Concept('concept_building','budově')] zůstává na místním [Concept('concept_market','trhu')]." # todo: CHANGED (predtym: [concept_country] stavící a vlastnící [Concept('concept_building_level','$concept_building_levels|q$')] na území jiné [c)
 concept_foreign_investment_rights: "Práva na zahraniční investice"
 concept_foreign_investment_rights_short: "Práva na investice"
 concept_foreign_investment_rights_desc: "Povoluje jedné [Concept('concept_country','zemi')] provádět [Concept('concept_foreign_investment','zahraniční investice')|l] v jiné po dobu trvání paktu." # todo: CHANGED (predtym: Povoluje jedné [concept_country] provádět [concept_foreign_investment] v jiné po dobu trvání [concept_treaty]. Kromě toh)
 concept_exiled_army: "Exilová armáda"
 concept_exiled_armies: "Exilové armády"
 concept_exiled_army_short: "Exilová"
 concept_exiled_army_exile: "Exil"
 concept_exiled_army_desc: "[Concept('concept_army','$concept_armies|q$')] se mohou stát $concept_exiled_army_short$ za těchto okolností:\n#indent_newline:3 • Pokud se zdržují v [concept_state], kde nemají [concept_military_access]#!\n#indent_newline:3 • Pokud jsou [Concept('concept_mobilize_army','$concept_mobilize_army_demobilized|q$')] na cizím území a nemají žádnou cestu zpět do svého domovského [concept_hq]#!\n#indent_newline:3 • Pokud zůstanou na moři bez přepravujícího [concept_fleet]#!\n\n[concept_exiled_army] ignoruje hranice, když se vrací na přátelské území nebo do přístavu, odkud jej lze dopravit domů, a až do svého příjezdu mu nelze zadat jiné [Concept('concept_order','$concept_orders|q$')]. Během stavu $concept_exiled_army_short$ trpí [concept_attrition] a cíl jeho [concept_organization] klesne na nulu." # todo: CHANGED (predtym: [Concept('concept_army','Armády')] se považují za exilové, pokud jejich [Concept('concept_front','fronta')|l] nemůže být)
 concept_military_access: "Vojenský přístup"
 concept_military_access_desc: "$concept_military_access$ umožňuje napadnou nepřítele přes území jiných neutrálních [Concept('concept_country','zemí')]. Zabezpečuje se vytvořením [Concept('concept_ongoing_diplomatic_action','probíhající diplomatické akce')] s neutrální zemí." # todo: CHANGED (predtym: $concept_military_access$ umožňuje napadnout nepřítele přes území jiných neutrálních [Concept('concept_country','$concep)
 concept_military_assistance: "Vojenská pomoc"
 concept_military_assistance_desc: "Jakákoli [Concept('concept_ongoing_diplomatic_action','probíhající diplomatická akce')|l] zřízená jednou [Concept('concept_country','zemí')], cílená na jinou, kde první země zlepšuje bojovou schopnost [Concept('concept_military_formation','formace')|l] té druhé." # todo: CHANGED (predtym: [concept_ongoing_diplomatic_action] zřízená jednou [concept_country] proti jiné, při níž první [concept_country] zlepšuj)
 concept_social_hierarchy: "Sociální hierarchie"
 concept_social_hierarchies: "Sociální hierarchie"
 concept_social_hierarchy_possessive: "Sociální hierarchie"
 concept_social_hierarchy_short: "Hierarchie"
 concept_social_hierarchy_desc: "$concept_social_hierarchy$ se skládá ze dvou nebo více [Concept('concept_social_class','sociálních tříd')]. Všechny [Concept('concept_pop','populace')|l] spadají do určité sociální hierarchie.\n\nKaždá [Concept('concept_pop','populace')|l], na kterou se nevztahuje specifická [Concept('concept_social_hierarchy','sociální hierarchie')|l] dané země, je automaticky zařazena do základní hierarchie podle [Concept('concept_profession','profese')|l] – konkrétně do [Concept('concept_lower_strata','nižší')], [Concept('concept_middle_strata','střední')], nebo [Concept('concept_upper_strata','vyšší třídy')], což odpovídá nižší vrstvě, střední vrstvě a vyšší vrstvě společnosti.\n\n$concept_social_classes$ v rámci specifických sociálních hierarchií jednotlivých zemí mohou být určovány faktory, jako je [Concept('concept_profession','profese')|l], [Concept('concept_culture','kultura')|l] a [Concept('concept_religion','náboženství')|l]." # todo: CHANGED (predtym: $concept_social_hierarchy$ se skládá ze dvou nebo více [Concept('concept_social_class','$concept_social_classes|q$')]. V)
 concept_social_class: "Sociální třída"
 concept_social_classes: "Sociální třídy"
 concept_social_class_short: "Třída"
 concept_social_class_possessive: "Sociální třídy"
 concept_social_class_desc: "Každá [Concept('concept_pop','populace')|l] patří do sociální třídy, a každá sociální třída patří do [Concept('concept_lower_strata','nižší')], [Concept('concept_middle_strata','střední')], nebo [Concept('concept_upper_strata','vyšší třídy')]. $concept_social_class$ [Concept('concept_pop','populace')|l] je určena [Concept('concept_social_hierarchy','sociální hierarchií')] v [Concept('concept_country','zemi')]." # todo: CHANGED (predtym: Každá [concept_pop] patří do [concept_social_class] a každá [concept_social_class] patří do [concept_lower_strata], [con)
 concept_open_market: "Otevření trhu"
 concept_open_market_short: "Otevřený"
 concept_open_market_desc: "A [Concept('concept_war_goal','válečný cíl')] který lze požadovat v [Concept('concept_diplomatic_play','diplomatické hře')] nebo jako součást [Concept('concept_peace_deal','mírové smlouvy')]. [Concept('concept_country','Země')], který je nucen $concept_open_market_short$ svůj [Concept('concept_market','trh')], okamžitě změní svou [SelectLocalization(GetPlayer.IsValid,'concept_open_market_desc_added','Trade Policy')] na [SelectLocalization(GetPlayer.IsValid,'concept_open_market_desc_added_2','Free Trade')] a nebude ji moci změnit po dobu #v [GetDefine('NDiplomacy','WAR_GOAL_OPEN_MARKET_MONTHS')|0] měsíců#!. [ConcatIfNeitherEmpty('\n\n', AddLocalizationIf(GetPlayer.IsValid,'concept_open_market_desc_added_3'))]" # todo: CONCEPT CASE
 concept_open_market_desc_added: "[GetLawGroup('lawgroup_trade_policy').GetName]"
 concept_open_market_desc_added_2: "[GetLawType('law_free_trade').GetName]"
 concept_open_market_desc_added_3: "#title Další efekty během těchto [GetDefine('NDiplomacy','WAR_GOAL_OPEN_MARKET_MONTHS')|0] měsíců#!:#!#indent_newline:3\n[GetStaticModifier('forced_market_opening').GetDesc]#!"
 concept_humiliation: "Ponížení"
 concept_humiliated: "Ponížený"
 concept_humiliate: "Ponížit"
 concept_humiliation_desc: "A [Concept('concept_war_goal','válečný cíl')] který lze požadovat v [Concept('concept_diplomatic_play','diplomatické hře')] nebo jako součást [Concept('concept_peace_deal','mírové smlouvy')]. $concept_humiliated$ [Concept('concept_country','země')] není schopna zahájit žádné $concept_diplomatic_plays$ vůči $concept_country$, které ji $concept_humiliated$, po dobu #v [GetDefine('NDiplomacy','WAR_GOAL_HUMILIATION_MONTHS')|0] měsíců#!.[ConcatIfNeitherEmpty('\n\n', AddLocalizationIf(GetPlayer.IsValid, 'concept_humiliation_desc_added'))]" # todo: CONCEPT CASE
 concept_humiliation_desc_added: "#title Další efekty během těchto #v [GetDefine('NDiplomacy','WAR_GOAL_HUMILIATION_MONTHS')|0] měsíců#!:#!#indent_newline:3 \n[GetStaticModifier('country_humiliated').GetDesc]#!"
 concept_customs_union: "Celní unie"
 concept_customs_union_desc: "Vynucená dohoda mezi [Concept('concept_senior_partner','hlavním partnerem')] a jedním nebo více [Concept('concept_junior_partner','mladšími partnery')] o sdílení společného [Concept('concept_market','trhu')], pod vedením hlavního partnera. Obvykle je tato dohoda prosazena prostřednictvím [Concept('concept_power_bloc','mocenskýho bloku')] a jeho [Concept('concept_power_bloc_principle','principů')]. Kromě toho všechny diplomatické dohody se [Concept('concept_subject','závislými zeměmi')] zároveň fungují jako celní unie." # todo: CHANGED (predtym: Vynucená dohoda mezi [concept_senior_partner] a jedním nebo více [Concept('concept_junior_partner','$concept_junior_part)
 concept_senior_partner: "Hlavní partner"
 concept_senior_partner_desc: "Hlavní partner v [Concept('concept_customs_union','celní unii')] získává kontrolu nad [Concept('concept_market','trhy')|l] svých [Concept('concept_junior_partner','mladších partnerů')]. Zatímco mladší partneri mohou pokračovat v [Concept('concept_trade','obchodování')] s jinými trhy, pouze hlavní partner může uvalovat [Concept('concept_embargo','embarga')|l] a ovládat úrovně [Concept('concept_tariffs','cel')]. Na oplátku hlavní partner sdílí menší část příjmu z cel trhu, zatímco [Concept('concept_building','průmysly')|l] obou [Concept('concept_country','zemí')] těží z členství ve silnějším a vyspělejším trhu." # todo: CHANGED (predtym: [concept_senior_partner] v [concept_customs_union] získává kontrolu nad [Concept('concept_market','$concept_markets|q$'))
 concept_junior_partner: "Mladší partner"
 concept_junior_partners: "Mladší partneři"
 concept_junior_partners_possessive: "mladších partnerů"
 concept_junior_partner_desc: "Mladší partner v [Concept('concept_customs_union','celní unii')] předává kontrolu nad svým [Concept('concept_market','trhem')] hlavnímu partnerovi. Zatímco mladší partner může i nadále [Concept('concept_trade','obchodovat')] s jinými trhy, nemůže vyhlásit [Concept('concept_embargo','embarga')|l] nebo kontrolovat úrovně [Concept('concept_tariffs','cel')]. Na oplátku sbírají minoritní část příjmu z tržních cel a jejich [Concept('concept_building','průmysly')|l] těží z účasti v mocnějším a zralém trhu." # todo: CHANGED (predtym: [concept_junior_partner] v [concept_customs_union] předává kontrolu nad svým [concept_market] [concept_senior_partner]. )
 concept_regime_change: "Změna režimu"
 concept_regime_change_desc: "Přinutí cíl změnit svou [Concept('concept_government', 'vládu')] na podobnou, jako má vynucovatel, a také ho přinutí okamžitě zavést až #v [GetDefine('NPolitics','NUM_REVOLUTIONARY_LAW_CHANGES')]#! [Concept('concept_law', 'zákonů')] preferovaných novým režimem."
 concept_alliance: "Aliance"
 concept_alliances: "Aliance"
 concept_alliance_desc: "[Concept('concept_article','Článek')] [Concept('concept_treaty','smlouvy')] mezi dvěma [Concept('concept_country','zeměmi')]. $concept_countries$, které jsou v alianci, mohou vždy stát na straně toho druhého v [Concept('concept_diplomatic_play','diplomatické hře')] bez ohledu na to, zda druhá strana udržuje [Concept('concept_interest','zájem')|l] v dotčeném [Concept('concept_strategic_region','strategickém regionu')]. Platí to bez ohledu na to, zda je druhá země iniciátorem nebo cílem diplomatické hry." # todo: CHANGED (predtym: [concept_treaty] [concept_article] mezi dvěma [Concept('concept_country','$concept_countries|q$')]. [concept_countries] )
 concept_defensive_pact: "Obranný pakt"
 concept_defensive_pacts: "Obranné pakty"
 concept_defensive_pact_desc: "[Concept('concept_article','Článek')] [Concept('concept_treaties','Smlouvy')|l], který představuje omezené [Concept('concept_alliance','spojenectví')] mezi dvěma [Concept('concept_country','zeměmi')]. Toto spojenectví vstupuje v platnost pouze tehdy, když se jedna z těchto dvou zemí stane [Concept('concept_target','cílem')] [Concept('concept_diplomatic_play','diplomatické hry')]." # todo: CHANGED (predtym: [concept_treaty] [concept_article], který představuje omezené [concept_alliance] mezi dvěma [Concept('concept_country',')
 concept_guarantee_independence: "Zaručit nezávislost"
 concept_guarantee_of_independence: "Záruka nezávislosti"
 concept_guarantee_independence_desc: "[Concept('concept_article','Článek')] [Concept('concept_treaty','smlouvy')] uzavřený jednou  [Concept('concept_country','zemí')], který se vztahuje na jinou zemi, přičemž tato druhá země může v případě, že se ocitne v roli obránce v [Concept('concept_diplomatic_play','diplomatické hře')], povolat tu první na pomoc."
 concept_ally: "Spojenec"
 concept_allies: "Spojenci"
 concept_allied: "Spřátelený"
 concept_ally_desc: "$concept_ally$ je [Concept('concept_country','země')|l], která má [Concept('concept_alliance','alianci')] nebo [Concept('concept_defensive_pact','obranný pakt')|l] s jiným státem a může být zavolaná na podporu v [Concept('concept_diplomatic_play','diplomatických hrách')]. Pro [Concept('concept_initiator','iniciátora')] jsou za [Concept('concept_ally','spojence')|l] v [Concept('concept_diplomatic_play','diplomatické hře')] považovány pouze [Concept('concept_country','země')|l] s plnohodnotnou [Concept('concept_alliance','alianci')]." # todo: CHANGED (predtym: $concept_ally$ je [concept_country], která má [concept_alliance] nebo [concept_defensive_pact] s jinou zemí a může být p)
 concept_supply: "Zásobování"
 concept_supplies: "Zásoby"
 concept_supply_desc: "$concept_supply$ [Concept('concept_military_formation','formace')] určuje, jak rychle [Concept('concept_unit','$concept_units|q$')|l] obnovují [Concept('concept_organization','organizaci')].\n\n#indent_newline:3 $concept_supply$ je obvykle #v 100%#!, ale může být nižší, pokud je [Concept('concept_army','armáda')]:\n- v zámoří a zásobována přes ohroženou [Concept('concept_shipping_lane','námořní trasu')]\n- Bude nulové, pokud je [Concept('concept_army','armáda')] zcela odříznuta od svého [Concept('concept_hq','HQ')]#!\n\n[Concept('concept_modifier','$concept_modifiers|q$')] se mohou v některých případech také uplatnit." # todo: CHANGED (predtym: $concept_supply$ [concept_military_formation] určuje, jak rychle [Concept('concept_unit','$concept_units|q$')] obnovují )
 concept_manpower: "Personál"
 concept_manpower_desc: "Množství [SelectLocalization(GetPlayer.IsValid,'concept_manpower_desc_added','Vojáci')] a [SelectLocalization(GetPlayer.IsValid,'concept_manpower_desc_added_2','Důstojníci')] ve [Concept('concept_unit','vojenské jednotce')]. Čím větší je personál, tím více [Concept('concept_casualties','ztrát')] bude jednotka schopna způsobit - a také utrpět."
 concept_manpower_desc_added: "[GetPopType('soldiers').GetName]"
 concept_manpower_desc_added_2: "[GetPopType('officers').GetName]"
 concept_morale: "Morálka"
 concept_morale_demoralized: "Demoralizováno"
 concept_morale_demoralized_desc: "$concept_morale_desc$"
 concept_morale_desc: "Morálka [Concept('concept_unit','jednotek')] měří, kolik ze zbývajícího [Concept('concept_manpower','personálu')] je připraveno do [Concept('concept_battle','bitvy')]. V každém kole boje část zbývajícího personálu se stane demoralizována po zbytek bitvy a není schopna podniknout útočné akce. Když všechny vojenské jednotky dosáhnou kritického prahu nízké morálky, [Concept('concept_commander','velitel')|l] ustoupí, což znamená vítězství druhé strany.\n\nPo bitvě získají vojenské jednotky svou morálku zpátky stabilním tempem, které závisí na [Concept('concept_supply','zásobování')|l] jejich [Concept('concept_military_formation','formace')|l]." # todo: CHANGED (predtym: [Concept('concept_unit','$concept_unit_possessive|q$')] [concept_morale] měří, kolik ze zbývajícího [concept_manpower] j)
 concept_morale_damage: "Poškození morálky"
 concept_morale_damage_desc: "$unit_morale_damage_mult_desc$"
 concept_rank: "Hodnost"
 concept_ranks: "Hodnosti"
 concept_rank_desc: "$concept_rank$ [Concept('concept_country','země')] se určuje měřením její [Concept('concept_prestige','prestiže')] v porovnání s ostatními zeměmi ve světě. Určuje, jaké mezinárodní aktivity můžete provádět, co od vás očekávají lidé i svět a kde stojíte v globálním žebříčku.[ConcatIfNeitherEmpty('\n', AddLocalizationIf( GetPlayer.IsValid, 'concept_rank_ingame_added' ))]" # todo: CHANGED (predtym: [Concept('concept_country','$concept_country_possessive|q$')] $concept_rank$ se určuje měřením její [concept_prestige] v)
 concept_rank_ingame_added: "#title Vaše současná hodnost [GetPlayer.GetRank] vám dává následující výhody:#!#indent_newline:3 \n[GetPlayer.GetRankModifier.GetDesc]#!"
 concept_migration: "Migrace"
 concept_migration_internal: "Vnitřní migrace"
 concept_weekly_migration: "Týdenní migrace"
 concept_migrating: "Migrace"
 concept_migrate: "Migrace"
 concept_immigration: "Imigrace"
 concept_immigrating: "Imigruje"
 concept_emigrate: "Emigrovat"
 concept_emigration: "Emigrace"
 concept_emigrating: "Emigrující"
 concept_migration_desc: "Pohyb [Concept('concept_pop','populace')|l] mezi [Concept('concept_state','státy')|l]. Obecně, migrace probíhá mezi [Concept('concept_state','státy')|l] ve stejném [Concept('concept_market','trhu')], ale může také probíhat mezi [Concept('concept_country','zeměmi')] v různých trzích v případě [Concept('concept_mass_migration','hromadné migrace')|l].\n\n$concept_migration$ probíhá ze států s nižší úrovní [Concept('concept_migration_pull','migrační přitažlivosti')|l] k vyšším, přičemž čím větší je rozdíl, tím více lidí se bude stěhovat. Rychlost migrace je také ovlivněna faktory jako dostupná [Concept('concept_infrastructure','infrastruktura')|l] v státě.\n\nMigrace může probíhat pouze tehdy, pokud je k dispozici populace, která je schopna a ochotna emigrovat. $concept_pops$ budou o emigraci uvažovat pouze tehdy, pokud jsou dostatečně [Concept('concept_job_satisfaction','nespokojený')|l]. Například pokud jejich [Concept('concept_sol','životní standard')|l] je nižší než průměr v jejich trhu nebo pokud jsou [Concept('concept_unemployed','nezaměstnané')|l].\n\n$concept_pops$, která přijde do státu bez jiné populace stejné [Concept('concept_culture','kultury')], vytvoří [Concept('concept_cultural_community','kulturní komunitu')] a dostane dočasný penalizační efekt na [Concept('concept_acceptance','přijetí')|p]." # todo: CHANGED (predtym: Pohyb [Concept('concept_pop','$concept_pops|q$')] mezi [Concept('concept_state','$concept_states|q$')]. Obecně [concept_)
 concept_mass_migration_pull: "Přitažlivost hromadné migrace"
 concept_mass_migration_pull_desc: "$concept_mass_migration_pull$ určité [Concept('concept_country','země')|l] indikuje, jak pravděpodobné je, že přijme [Concept('concept_migration_target','hromadnou migraci')] ve srovnání s dalšími [Concept('concept_country','zeměmi')]. Závisí převážně na průměrném hodnotě [Concept('concept_migration_pull','migrační přitažlivosti')] [Concept('concept_migration_target','vhodných')] [Concept('concept_state','států')] v [Concept('concept_country','zemi')].\n\nPokud má [Concept('concept_country','země')|l] méně než #b [GetDefine('NPops','MASS_MIGRATION_NUM_TARGET_STATES_FOR_NO_PENALTY')]#! vhodných států, bude dostávat stoupající penalizaci pro $concept_mass_migration_pull$ v závislosti na tom, kolik vhodných států má." # todo: CHANGED (predtym: $concept_mass_migration_pull$ určité [concept_country] indikuje, jak pravděpodobné je, že přijme [Concept('concept_migra)
 concept_mass_migration: "Hromadná migrace"
 concept_mass_migrations: "Hromadné migrace"
 concept_mass_migration_migrating: "Migrování"
 concept_mass_migration_desc: "$concept_mass_migration$ je hromadní přesun [Concept('concept_pop','populace')|l] specifické [Concept('concept_culture','kultury')] mezi dvěma [Concept('concept_country','zeměmi')]. [Concept('concept_migration_target','Cíl hromadné migrace')] se může objevit, pokud mezi dvěma [Concept('concept_market','trhy')] jestvuje [Concept('concept_trade','obchodní')] spojení a [Concept('concept_cultural_turmoil','kulturní nepokoje')|l] v původní zemi dosáhli minimálně [GetDefine('NPops','MASS_MIGRATION_ORIGIN_MIN_TURMOIL')|v%0]. Země má vyšší pravděpodobnost, že jeden z její států bude vybrán jako cíl migrace, pokud má vysokou hodnotu [Concept('concept_mass_migration_pull','přitažlivosti hromadné migrace')|l]." # todo: CHANGED (predtym: $concept_mass_migration$ je hromadný přesun [Concept('concept_pop', '$concept_pops|q$')] specifické [concept_culture] me)
 concept_migration_target: "Cíl migrace"
 concept_mass_migration_target: "Cíl hromadné migrace"
 concept_migration_targets: "Cíle migrace"
 concept_mass_migration_targets: "Cíle hromadné migrace"
 concept_mass_migration_eligible: "Vhodné"
 concept_migration_target_desc: "[Concept('concept_state','Stát')] vybraný jako vhodný cíl pro [Concept('concept_mass_migration','hromadní migraci')]. Okolní státy mohou také zaznamenat určitou míru imigrace z hromadné migrace.\n\nAby byl stát vhodný pro imigraci, musí být [Concept('concept_incorporated_state','začlenen')|l], mít nejméně #b [GetDefine('NPops','MASS_MIGRATION_TARGET_MIN_ARABLE_LAND')]#! [Concept('concept_arable_land','orní půdy')] a #b [GetDefine('NPops','MASS_MIGRATION_STATE_MIN_MARKET_ACCESS')|0%]#! [Concept('concept_market_access','přístup na trh')|l]. Kromě toho [Concept('concept_state','stát')|l] nesmí být již cílem jiné hromadné migrace, a [Concept('concept_law','zákony')|l] [Concept('concept_country','země')|l] pro skupiny [GetLawGroup('lawgroup_migration').GetName] a [GetLawGroup('lawgroup_citizenship').GetName] musí umožňovat [Concept('concept_migration','migraci')]." # todo: CHANGED (predtym: [concept_state] vybraný jako vhodný cíl pro [concept_mass_migration]. Okolní $concept_states$ mohou také zaznamenat urči)
 concept_base_price: "Základní cena"
 concept_base_price_desc: "Cena [Concept('concept_good','zboží')|l], když jeho [Concept('concept_sell_orders','nabídka')] přesně odpovídá její [Concept('concept_buy_orders','poptávce')]."
 concept_market_impact: "Tržní dopad"
 concept_market_impact_short: "Dopad"
 concept_market_impacts_short: "Dopady"
 concept_market_impact_desc: "Tržní dopad znamená, kolik vlivu má aktuální bilance [Concept('concept_good','zboží')|l] ([Concept('concept_buy_orders','nákupní objednávky')|l] - [Concept('concept_sell_orders','prodejní objednávky')|l]) na [Concept('concept_market','trh')|l]. Není určena pouze [Concept('concept_market_price','tržní cenou')] zboží (což může být buď levné nebo drahé), ale také zohledňuje objem tohoto zboží, který je na trhu v oběhu, ovlivňující [Concept('concept_pop','populace')|l] a průmysly." # todo: CHANGED (predtym: Tržní dopad znamená, jaký vliv má aktuální bilance [concept_good] ([concept_buy_orders] - [concept_sell_orders]) na [con)
 concept_capital_state: "Hlavní město"
 concept_capital_state_short: "Hlavní město"
 concept_capital_state_desc: "Sídlo centrální [Concept('concept_government','vláda')] [Concept('concept_country','zemi')]. Ovládání $concept_capital_state_short$ má za války velký význam a [Concept('concept_pop','populace')] žijící tam mají větší míru [Concept('concept_political_strength','politické síly')], jíž mohou ovlivňovat politiku.[ConcatIfNeitherEmpty('\n', AddLocalizationIf( GetPlayer.IsValid, 'concept_capital_state_desc_added' ))]" # todo: CONCEPT CASE
 concept_capital_state_desc_added: "[GetStaticModifier('market_capital_state').GetDesc]"
 concept_treaty_port: "Smluvní přístav"
 concept_treaty_ports: "Smluvní přístavy"
 concept_treaty_port_desc: "Přímořský [Concept('concept_split_state','rozdělený stát')|l], který je držen na základě [Concept('concept_treaty','smlouvy')] za účelem otevření [Concept('concept_trade','obchodu')] s jinou [Concept('concept_country','zemí')]. $concept_treaty_port$ je součástí [Concept('concept_market','trhu')] země, která postoupila provinci, a může volně [Concept('concept_trade','obchodovat')] se [Concept('concept_world_market','světovým trhem')].\n\n[Concept('concept_tariffs','Cla')], [Concept('concept_subventions','subvence')|l] ani [Concept('concept_embargo','embarga')|l] se na smlouvní přístavy nevztahují a jejich vlastník získává [Concept('concept_trade_advantage','obchodní výhodu')] při dovozu [Concept('concept_good','zboží')|l] vyváženého smluvním přístavem (a naopak). Pokud je smlouva, na jejímž základě byl smluvní přístav postoupen, porušena, přístav přestává být smluvním přístavem a stává se běžným [Concept('concept_state','státem')]." # todo: CHANGED (predtym: Přímořský [concept_split_state], který je držen na základě [concept_treaty] za účelem otevření [concept_trade] s jinou [)
 concept_treaty: "Smlouva"
 concept_treaties: "Smlouvy"
 concept_treaty_desc: "$concept_treaty$ je typ bilaterální dohody mezi dvěma [Concept('concept_country', 'zeměmi')] a skládá se z jednotlivých [Concept('concept_article','článků')], které definují práva, povinnosti a náklady @inf![Concept('concept_influence','vlivu')] každé země. $concept_treaties$ zůstávají v platnosti, dokud je některá ze stran neporuší nebo od nich neodstoupí po uplynutí počátečního [Concept('concept_binding_period','závazného období')].\n\n$concept_treaties$ mohou být také [Concept('concept_enforced_treaty','vnucené')] zemi jako důsledek [Concept('concept_war_reparations','válečných reparací')] nebo [Concept('concept_diplomatic_play','diplomatické hry')]." # todo: CHANGED (predtym: $concept_treaty$ je typ bilaterální dohody mezi dvěma [Concept('concept_country', '$concept_countries|q$')] a skládá se )
 concept_enforced_treaty: "Vynucená smlouva"
 concept_enforced_treaties: "Vynucené smlouvy"
 concept_enforced_treaty_short: "Vynucená"
 concept_enforced_treaty_forced_short: "Nucená"
 concept_enforced_treaty_enforce: "Vynutit smlouvu"
 concept_enforced_treaty_enforce_short: "Vynutit"
 concept_enforced_treaty_desc: "$concept_enforced_treaty$ je smlouva vynucená na [Concept('concept_country','zemi')] po kapitulaci ve [Concept('concept_war','válce')] nebo stažení z [Concept('concept_diplomatic_play','diplomatické hry')]. Některé [Concept('concept_diplomatic_demand','diplomatické požadavky')|l] se také mohou změnit ve vynucenou smlouvu.\n\nSkládá se z [Concept('concept_war_reparations','válečných reparací')] nebo diplomatických požadavků obsahujících jednotlivé [Concept('concept_article','články')|l] definující práva, povinnosti a náklady @inf![Concept('concept_influence','vlivu')] pro kapitulující zemi. $concept_enforced_treaties$ platí do doby, než smlouvu poruší nebo z ní odstoupí některá ze stran po uplynutí počátečního [Concept('concept_binding_period','závazného období')]." # todo: CHANGED (predtym: $concept_enforced_treaty$ je [concept_treaty] vnucená [concept_country] po kapitulaci ve [concept_war] nebo stažení z [c)
 concept_article: "Článek"
 concept_articles: "Články"
 concept_article_desc: "$concept_articles$ jsou součástí [Concept('concept_treaty','smlouvy')|l] a mohou mít různou podobu.\n\n$concept_article$ můžou uplatnit několik efektů na jednu nebo obě zúčastněné [Concept('concept_country','země')|l], často s náklady @inf![Concept('concept_influence','vlivu')|l] po dobu platnosti smlouvy. Alternativně můžou mít články jednorázové efekty nebo uložení povinnosti, které mohou negativně ovlivnit [Concept('concept_treaty','smlouvu')|l] v případě jejich [Concept('concept_contravention','porušení')|l].\n\nKaždý článek spadá do jedné ze dvou kategorií:#indent_newline:3 \n$EFFECT_LIST_BULLET$#bold Vzájemné#!: Vzájemné články uplatňují efekty a povinnosti stejně vůči obom zemím.\n$EFFECT_LIST_BULLET$#bold Směrové#!: Směrové články mají různé efekty a povinnosti vůči jedné nebo druhé zemi podle toho, zda je nabízející či přijímající stranou." # todo: CHANGED (predtym: $concept_articles$ jsou součástí [concept_treaty] a mohou mít různou podobu.\n\n[concept_article] může uplatnit několik )
 concept_contravention: "Porušení"
 concept_contraventions: "Porušení"
 concept_contravening: "Porušující"
 concept_contravene: "Porušit"
 concept_contravened: "Porušeno"
 concept_contravention_desc: "[Concept('concept_article','Článek')] v rámci [Concept('concept_treaty', 'smluv')], které obsahují podmínky [Concept('concept_non_fulfillment','neplnění')|l], mohou být porušeny. Aby byl článek považován za porušený, musí příslušná [Concept('concept_country','země')|l] nesplnit požadavky stanovené tímto článkem. To, zda země daný článek porušuje, se ověřuje týdně, měsíčně, ročně, nebo kombinací těchto intervalů – podle povahy daného článku.\n\nNapříklad u článku pro [GetArticleType('law_commitment').GetName], pokud uvedený [Concept('concept_law','zákon')|l] není [Concept('concept_enactment_of_laws','schválen')] nebo není aktivně [Concept('concept_enactment_of_laws_enacting','projednáván')] po dobu #v 3#! po sobě jdoucích týdnů, je článek považován za nesplněný, dokud se dotyčný zákon opět nezačne [Concept('concept_enactment_of_laws_enacting','projednávat')].\n\nPočet po sobě jdoucích porušení, které vedou ke stavu [Concept('concept_non_fulfillment','neplnění')|l], se může u jednotlivých článků lišit." # todo: CHANGED (predtym: [Concept('concept_article', '$concept_articles|q$')] v [Concept('concept_treaty', '$concept_treaties|q$')], které mají p)
 concept_binding_period: "Závazné období"
 concept_binding_period_binding: "Závazné"
 concept_binding_period_bound: "Vázané"
 concept_binding_period_desc: "[Concept('concept_treaty','Smlouva')] obvykle obsahuje $concept_binding_period$, během kterého odstoupení od dohody některou stranou přináší sankce. Po uplynutí tohoto období může strana odstoupit bez penalizace."
 concept_non_fulfillment: "Neplnění"
 concept_non_fulfilled: "Nesplněno"
 concept_non_fulfillment_desc: "Některé [Concept('concept_article','články')|l] mohou mít připojené povinnosti, které negativně ovlivní [Concept('concept_treaty','smlouvu')], pokud jsou porušeny po stanovený počet po sobě jdoucích případů.\n\nDůsledky neplnění mohou zahrnovat #bold náhrady škod#!, zmrazení nebo dokonce #bold ukončení#! smlouvy.\n\nPokud je smlouva #b zmrazená#!, porušující [Concept('concept_country','země')|l] nadále plní své povinnosti, ale nedostává nic na oplátku." # todo: CHANGED (predtym: Některé [Concept('concept_article','$concept_articles|q$')] mohou mít připojené povinnosti, které negativně ovlivní [con)
 concept_prestige: "Prestiž"
 concept_prestige_desc: "Vaše [Concept('concept_rank','hodnost')|l] se určuje porovnáním vaši prestiže se všemi ostatními [Concept('concept_country','zeměmi')] na světě. $concept_prestige$ pochází především z toho, jak impozantní vaše ekonomika je dle [Concept('concept_gdp','HDP')], kolik [Concept('concept_power_projection','projekce síly')|l] vaše vojská generují a jakou úroveň má vaše [Concept('concept_country_tier','postavení země')|l]. Může být také ovlivněna jinými faktory, jako jsou vaše budovy [SelectLocalization(GetPlayer.IsValid,'concept_prestige_desc_gamestate','Umělecká akademie')] a [Concept('concept_monument','monumenty')], a pokud jste světovým lídrem ve výrobě určitého [Concept('concept_good','zboží')|l]." # todo: CHANGED (predtym: Vaše [concept_rank] se určuje porovnáním vašeho [concept_prestige] se všemi ostatními [Concept('concept_country','$conce)
 concept_prestige_desc_gamestate: "[GetBuildingType('building_art_academy').GetName]"
 concept_power_projection: "Projekce síly"
 concept_power_projection_desc: "Širší ukazatel toho, jak impozantní jsou vojenské síly [Concept('concept_country','země')|l], rozdělený na [Concept('concept_army_power_projection','projekci síly armády')] a [Concept('concept_naval_power_projection','projekci síly námořnictva')]. Tvoří základ množství [Concept('concept_prestige','prestiže')], které [Concept('concept_country','země')|l] získává ze své armády a námořnictva." # todo: CHANGED (predtym: Celková schopnost vojenských sil [Concept('concept_country','země')|l], založená na průměru [Concept('concept_offense',')
 concept_army_power_projection: "Projekce síly armády"
 concept_army_power_projection_desc: "[Concept('concept_power_projection','Projekce síly')] [Concept('concept_country','země')|l] vycházející z průměru [Concept('concept_offense','útoku')] a [Concept('concept_defense','obrany')] její [Concept('concept_army','armády')], upraveného podle [Concept('concept_manpower','personálu')]. Přispívá k [Concept('concept_prestige','prestiži')] a zvyšuje [Concept('concept_involvement','angažovanost')] v [Concept('concept_strategic_region','strategickém regionu')], kde je armáda rozmístěna." # todo: CHANGED (predtym: [Concept('concept_power_projection','Projekce síly')] odvozená z armády [Concept('concept_country','zemi')].)
 concept_naval_power_projection: "Projekce námořní síly"
 concept_naval_power_projection_desc: "[Concept('concept_power_projection','Projekce síly')] námořnictva [Concept('concept_country','$concept_country_possessive|q$')]. Každá [concept_ship] promítá sílu určenou svým [concept_ship_type] a [Concept('concept_ship_modification','$concept_ship_modifications|q$')]. [concept_fleet] na misi $naval_mission_type_project_power$ [concept_naval_mission] vytváří svou [concept_naval_power_projection] v podobě [concept_involvement] v každém [Concept('concept_strategic_region','$concept_strategic_region_short|q$')], který pokrývá oblast její mise, a to v závislosti na [concept_presence] loďstva." # todo: CHANGED (predtym: [Concept('concept_power_projection','Projekce síly')] odvozená z námořnictva [Concept('concept_country','zemi')].)
 concept_dividends: "Dividendy"
 concept_dividends_desc: "Pokud mají [Concept('concept_privately_owned','soukromě vlastněné')] [Concept('concept_building','budovy')|l] pozitivní [Concept('concept_building_balance','bilanci')], část tohoto zisku je vyplácena vlastnickým skupinám [Concept('concept_pop','populací')|l] jako dividendy, které podléhají [Concept('concept_budget_dividends_taxes','zdanění dividend')].\n\nV závislosti na tom, jaký je aktuální $ECONOMIC_SYSTEM_GC_LINK$ dané [Concept('concept_country','země')|l] může být část dividend znovu investována do ekonomiky prostřednictvím [Concept('concept_reinvestment','reinvestic')], zatímco zbytek jde na [Concept('concept_pop_needs','potřeby populace')|l] a jejich [Concept('concept_wealth','bohatství')|l].\n\nPokud je budova plně nebo částečně ve [Concept('concept_nationally_owned','národním vlastnictví')], zisky mohou být vyplaceny jako [Concept('concept_government_dividends','vládní dividendy')|l]." # todo: CHANGED (predtym: Zatímco [concept_privately_owned] [Concept('concept_building','$concept_buildings|q$')] mají pozitivní [concept_building)
 concept_government_dividends: "Vládní dividendy"
 concept_government_dividends_desc: "Zatímco [Concept('concept_nationally_owned','národně vlastněné')] [Concept('concept_building','budovy')|l] mají kladnou [Concept('concept_building_balance','bilanci')], část těchto zisků je vyplácena přímo do státní [Concept('concept_treasury','pokladny')] jako vládní dividendy.\n\nVýše vyplacené částky závisí na poměru [Concept('concept_privately_owned','soukromých')] a  státních [Concept('concept_building_level','úrovní budov')].\n\nVe velkých ekonomikách s vysokým [Concept('concept_gdp','HDP')] vedou neefektivity k tomu, že část zisků je promarněna. Navíc [Concept('concept_loans','půjčky')|l] proti [Concept('concept_cash_reserves','hotovostním rezervám')], které drží národně vlastněné budovy, snižují množství vládních dividend, které [Concept('concept_building','budovy')|l] vyplácejí." # todo: CHANGED (predtym: Zatímco [concept_nationally_owned] [Concept('concept_building','$concept_buildings|q$')] mají kladnou [concept_building_)
 concept_credit: "Kredit"
 concept_credit_debt: "Dluh"
 concept_credit_limit: "Úvěrový limit"
 concept_credit_desc: "Národní kredit je množství [Concept('concept_money','peněz')], které si může [Concept('concept_treasury','státní pokladna')|l] půjčit ze své ekonomiky.  Tahle suma se rovná součtu všech [Concept('concept_cash_reserves','hotovostních rezerv')] se základní hodnotou stanovenou [Concept('concept_gdp','hrubým domácím produktem')]. Pokud [Concept('concept_principal','jistina')|l] překročí úvěrový limit, [Concept('concept_country','země')|l] se dostává do [Concept('concept_default','platební neschopnosti')]."
 concept_principal: "Jistina"
 concept_principal_desc: "Celková velikost [Concept('concept_loans','půjčky')|l], které [Concept('concept_treasury','státní pokladna')|l] nashromáždila, nezahrnující [Concept('concept_budget_interest','úroky')|l], které dluží. Pokud [Concept('concept_principal','jistina')|l] překročí váš [Concept('concept_credit','kredit')|l], dostanete se do [Concept('concept_default','platební neschopnosti')]." # todo: CHANGED (predtym: Celková velikost [Concept('concept_loans','půjčky')|l], které [Concept('concept_treasury','státní pokladna')|l] nashromá)
 concept_loans: "Půjčky"
 concept_loan: "Půjčka" # todo: NEW TRANSLATION
 concept_loans_desc: "Finanční prostředky, které [Concept('concept_treasury','státní pokladna')|l] dluží [Concept('concept_building_owners','vlastníkům budov')] v [Concept('concept_country','zemi')].\n\nKdykoli má státní pokladna záporný zůstatek, automaticky navyšuje své půjčky, pokud nemá dostatečné [Concept('concept_gold_reserves','zlaté rezervy')|l], kterými by schodek pokryla.\n\n[Concept('concept_budget_interest','Úrok')] se každý týden přičítají k [Concept('concept_principal','jistině')]. Pokud jistina někdy překročí [Concept('concept_credit','kredit')|l] dané země, země přechází do [Concept('concept_default','platební neschopnosti')]." # todo: CHANGED (predtym: Finanční prostředky, které [concept_treasury] dluží [Concept('concept_country','$concept_country_possessive|q$')] [conce)
 concept_war_support: "Válečná podpora"
 concept_war_support_desc: "Míra toho, jak silně populace [Concept('concept_country','$concept_country_possessive|q$')] podporuje svou současnou [concept_war], od #n 0%#! do #p 100%#!. V průběhu [concept_war] se mění vlivem [concept_casualties], nepřátelské [concept_occupation], nepřátelsky ovládaných [Concept('concept_war_goal','$concept_war_goals|q$')] a [concept_turmoil] doma. S poklesem $concept_war_support$ je [concept_country] ochotnější přijmout [concept_peace_deal] a dostatečně vyčerpaná země může kapitulovat, čímž lze proti ní uplatnit všechny $concept_war_goals$." # todo: CHANGED (predtym: Míra toho, jak moc je populace [Concept('concept_country','země')] ochotná zůstat ve [Concept('concept_war','válce')]. K)
 concept_war_pressure: "Válečný tlak" # todo: NEW TRANSLATION
 concept_war_pressure_short: "Tlak" # todo: NEW TRANSLATION
 concept_war_pressure_desc: "Měří, jak velkému tlaku vystavují nepřátelé [concept_country] tuto zemi během [concept_war]. $concept_war_pressure$ zvyšuje [concept_occupation], boje ve významných [Concept('concept_battle','$concept_battles|q$')] a [Concept('concept_blockade','$concept_blockades|q$')], až na #v 100%#!.\n\n$concept_war_pressure$ ovlivňuje míru, jakou se v důsledku domácích faktorů, jako jsou dluhy a politické nepokoje, v průběhu času snižuje [concept_war_support]." # todo: NEW TRANSLATION
 concept_occupation: "Okupace"
 concept_occupied: "Okupováno"
 concept_occupying: "Okupující"
 concept_occupy: "Okupovat"
 concept_occupies: "Okupuje"
 concept_occupation_desc: "Jakékoli [Concept('concept_province','$concept_provinces|q$')] vlastněné [concept_country], které jsou aktuálně součástí nepřátelského [concept_theater], se považují za [concept_occupied]. [concept_occupation] přispívá k [concept_war_support]. [concept_occupying] [concept_war_goal], který vůči nepříteli držíte, je obvykle nutné, než jej lze proti němu prosadit." # todo: CHANGED (predtym: Jakékoliv [Concept('concept_province','provincie')|l] vlastní [Concept('concept_country','země')|l], které jsou aktuálně)
 concept_theater: "Válčiště"
 concept_theaters: "Válčiště"
 concept_theater_desc: "Oblast sousedních [Concept('concept_province','provincí')] pod kontrolou jedné [Concept('concept_country','země')|l]. [Concept('concept_front','Fronty')] vznikají na hranici mezi dvěma válčišti, ovládají země nepřátelské vůči sobě během [Concept('concept_war','války')] nebo [Concept('concept_diplomatic_play','diplomatické hry')]." # todo: CHANGED (predtym: Oblast sousedních [Concept('concept_province','$concept_provinces|q$')] pod kontrolou jedné [concept_country]. [Concept()
 concept_literacy: "Gramotnost"
 concept_literate: "Gramotný"
 concept_literacy_desc: "Procento nebo absolutní počet jednotlivců v [Concept('concept_pop','populaci')], kteří umí číst a psát. Některé [Concept('concept_profession','profese')|l] vyžadují vyšší gramotnost než jiné, což omezuje [Concept('concept_pop_qualifications','kvalifikace')|l] pro populace v jiných [Concept('concept_profession','profesích')], pokud jejich [Concept('concept_literacy','gramotnost')|l] není dostatečně vysoká. Můžete investovat do instituce [SelectLocalization(GetPlayer.IsValid,'concept_literacy_desc_added','Vzdělání')] pro rozvoj vyšší gramotnosti ve vaší populaci v průběhu času.\n\n$concept_pops$ budou čelit stále se zvyšující penalizaci pro míru narození proporcionální jejich gramotnosti, až po následující:\n[GetStaticModifier('literacy_penalty').GetDesc]#!" # todo: CHANGED (predtym: Procento nebo absolutní počet jednotlivců v [concept_pop], kteří umí číst a psát. Některé [Concept('concept_profession',)
 concept_literacy_desc_added: "[GetInstitutionType('institution_schools').GetName]"
 concept_turmoil: "Nepokoje"
 concept_turmoil_desc: "Nepokojné [Concept('concept_state','státy')|l] a [Concept('concept_culture','kultury')|l] obsahují [Concept('concept_radical','radikály')] nespokojené se svou aktuální situací. Množství nepokoje odpovídá podílu [Concept('concept_workforce','pracovní síly')] daného státu nebo kultury, který tvoří radikálové.\n\nVysoké nepokoje můžou způsobit řadu negativních místních efektů v daném státě. [Concept('concept_cultural_turmoil','Kulturní nepokoje')] můžou ovlivnit celou [Concept('concept_country','zemi')] velmi rušivým a destabilizujícím způsobem." # todo: CHANGED (predtym: [Concept('concept_state', '$concept_states|q$')] a [Concept('concept_culture', '$concept_cultures|q$')] s [concept_turmo)
 concept_unemployed: "Nezaměstnaný"
 concept_unemployment: "Nezaměstnanost"
 concept_unemployed_desc: "Nezaměstnaná [Concept('concept_pop','populace')|l] nepracuje v žádné z [Concept('concept_building','budov')] ve svém [Concept('concept_state','státě')] a tudíž nepobírá [Concept('concept_building_wage','mzdu')]. S největší pravděpodobností přijme jakoukoli další dostupnou práci – a pokud žádná nepřijde, pravděpodobně [Concept('concept_migration','emigruje')].\n\nPopulace žijící ve státě čelí klesající porodnosti úměrně míře nezaměstnanosti v daném státě, a to až do následujícího maxima:\n[GetStaticModifier('unemployment_birth_penalty_state').GetDesc]#!" # todo: CHANGED (predtym: [concept_unemployed] [concept_pop] nepracuje v žádné z [Concept('concept_state','$concept_state_possessive|q$')] [Concep)
 concept_cultural_turmoil: "Kulturní nepokoje"
 concept_cultural_turmoil_desc: "The [Concept('concept_turmoil','nepokoje')] generované [Concept('concept_pop','populace')] určitého [Concept('concept_culture','kultury')], obvykle v důsledku jejich podílu na [Concept('concept_radical','radikálech')]. Pokud je jeho hodnota v [Concept('concept_country','zemi')] alespoň [GetDefine('NPops','MASS_MIGRATION_ORIGIN_MIN_TURMOIL')|v%0], může to spustit [Concept('concept_mass_migration','hromadná migrace')] tohoto $concept_culture$ do jiného $concept_country$. Při dostatečně vysokých hodnotách se však tyto $concept_pops$ mohou místo toho pokusit oddělit své [Concept('concept_homeland','domoviny')] v rámci [Concept('concept_secession','odtržení')]." # todo: CONCEPT CASE
 concept_commander_rank: "Hodnost velitele"
 concept_commander_rank_short: "Hodnost"
 concept_commander_ranks: "Hodnosti velitele"
 concept_commander_rank_desc: "[Concept('concept_commander','Velitelova')] hodnost určuje jeho [Concept('concept_command_limit','velitelský limit')|l], stejně jako kolik [Concept('concept_clout','politického vlivu')] předávají své [Concept('concept_interest_group','zájmové skupině')]. Odchod velitele do penze způsobí pokles [Concept('concept_approval','spokojenosti')] [Concept('concept_interest_group','zájmové skupiny')] v závislosti od velitelove hodnosti." # todo: CHANGED (predtym: [Concept('concept_commander','$concept_commander_possessive|q$')] [concept_commander_rank_short] určuje [concept_command)
 concept_commander: "Velitel"
 concept_commanders: "Velitelé"
 concept_commander_possessive: "Velitelova"
 concept_commander_desc: "[Concept('concept_character','Postava')], která velí [Concept('concept_military_formation','formaci')] [Concept('concept_country','země')]. $concept_commander$ může být buď [Concept('concept_general','generál')|l], nebo [Concept('concept_admiral','admirál')|l] podle typu formace, které velí. [Concept('concept_commander_rank','Hodnost velitele')] přispívá k [Concept('concept_command_limit','velitelskému limitu')] dané formace a zároveň ovlivňuje počet jednotek, které je schopen přivést s sebou do bitvy. $commander_coup_loc$" # todo: CHANGED (predtym: [concept_character] velící [concept_military_formation] [Concept('concept_country','$concept_country_possessive|q$')]. [)
 commander_coup_loc: "[Concept('concept_popularity','Oblíbení')] velitelé patřící do [Concept('concept_interest_group','zájmové skupiny')] s nízkou [Concept('concept_approval','spokojeností')] mohou zahájit [Concept('concept_coup','puč')|l]." # todo: CHANGED (predtym: [Concept('concept_popularity', '$concept_popular|q$')] [concept_commanders] patřící do [concept_interest_group] s nízkou)
 concept_general: "Generál"
 concept_generals: "Generálové"
 concept_general_possessive: "Generála"
 concept_general_plural_singular: "Generál(ové)"
 concept_general_desc: "Velitel [Concept('concept_army','armády')] se nazývá generál a vede [Concept('concept_battalion','prapory')|l] své armády do [Concept('concept_battle','boje')]. Každému generálovi můžete kdykoliv změnit [Concept('concept_order','rozkaz')|l] na panelu vojenské [Concept('concept_military_formation','formace')|l] nebo jednoduše kliknutím pravým tlačítkem na něj. Druhy rozkazů, které můžete generálovi zadat, závisí na jeho [Concept('concept_character_trait','charakterových rysech')], ale vždy jsou k dispozici základní rozkazy #b Postupovat#! a #b Bránit#!. Vojenské efekty plynoucí z generálových vlastností mohou ovlivnit buď celou jeho armádu, nebo se uplatní jen na prapory, které má přímo pod velením během [Concept('concept_battle','bitvy')]." # todo: CHANGED (predtym: [Concept('concept_army','$concept_army_possessive|q$')] [concept_commander] se nazývá [concept_general] a vede [Concept()
 concept_admiral: "Admirál"
 concept_admirals: "Admirálové"
 concept_admiral_possessive: "admirálova"
 concept_admiral_desc: "[Concept('concept_character','Postava')] námořního [Concept('concept_commander','velitele')], který velí [Concept('concept_ship','flotilám')] [Concept('concept_country','zemi')|l]. Účinky z [Concept('concept_admiral','admirálových')] [Concept('concept_character_trait','rysů')] se přenášejí na [Concept('concept_ship','lodě')|l] pod jeho velením." # todo: CHANGED (predtym: [concept_commander] [concept_character] námořnictva, který velí [Concept('concept_ship','$concept_ships|q$')] [Concept(')
 concept_admiral_defeated: "Poražen"
 concept_admiral_defeated_desc: "[concept_admiral] je [concept_admiral_defeated], když prohraje námořní [concept_battle]. [concept_fleet] je [concept_admiral_defeated], když jsou [concept_admiral_defeated] všichni její [Concept('concept_admiral','$concept_admirals|q$')]. $concept_admirals$ a $concept_fleets$ se opraví a znovu shromáždí, až když se vrátí do svého domovského [concept_hq] a jejich [Concept('concept_ship','$concept_ships|q$')] budou plně obsazené posádkou a opravené." # todo: CHANGED (predtym: [Concept('concept_admiral','Admirál')] je poražen po prohre v námořní [Concept('concept_battle','bitvě')]. [Concept('con)
 concept_military_formation: "Formace"
 concept_military_formations: "Formace"
 concept_military_formation_possessive: "Formací"
 concept_military_formation_desc: "Vojenská formace je [Concept('concept_army','armáda')|l] nebo [Concept('concept_fleet','loďstvo')|l], které se používá ve [Concept('concept_war','válkách')] k dosažení vojenských cílů. Může mít přidělené [Concept('concept_unit','vojenské jednotky')|l] a [Concept('concept_commander','velitele')] a může být přirazena k [Concept('concept_front','frontám')] k boji s nepřátelskými silami." # todo: CHANGED (predtym: [concept_military_formation] je [concept_army] nebo [concept_fleet], které se používá ve [Concept('concept_war','$concep)
 concept_political_strength: "Politická síla"
 concept_political_strength_desc: "Míra moci, kterou má [Concept('concept_pop','populace')|l], a následně [Concept('concept_interest_group','zájmová skupina')|l], kterou podporuje – nad politikou [Concept('concept_country','země')]. Tato moc vychází z [Concept('concept_wealth','bohatství')|l] podporující populace. $concept_pops$, která žije v [Concept('concept_unincorporated_state','nezačleněných státech')], má výrazně nižší politickou sílu, zatímco populace [Concept('concept_capital_state','hlavního města')] ji má vyšší.\n\n$concept_pops$ rozděluje svou politickou sílu mezi zájmové skupiny, které podporuje, v poměru k tomu, kolik jejich členů danou skupinu podporuje. Pokud je zájmová skupina součástí nějaké [Concept('concept_party','politické strany')], získává další politickou sílu i z [Concept('concept_votes','hlasů')], které tato strana obdržela v posledních [Concept('concept_election','volbách')]. [Concept('concept_clout','Politický vliv')] [Concept('concept_interest_group','zájmové skupiny')] pak odpovídá jejímu podílu na celkové politické síle v [Concept('concept_country','zemi')]." # todo: CHANGED (predtym: Míra moci, kterou má [concept_pop], a následně [Concept('concept_interest_group','$concept_interest_groups|q$')], kterou)
 concept_invasion: "Invaze"
 concept_invasions: "Invaze" # todo: NEW TRANSLATION
 concept_invade: "Napadnout"
 concept_invaded: "Napadený"
 concept_invading: "Napadající"
 concept_invasion_desc: "Útok [Concept('concept_army','armády')] na [Concept('concept_state','stát')|l] po souši nebo po moři, přičemž námořní útok je označován jako [Concept('concept_naval_invasion','námořní invaze')|l]."
 concept_naval_invasion: "Námořní invaze"
 concept_naval_invasions: "Námořní invaze"
 concept_naval_invaded: "napaden z moře"
 concept_naval_invasion_desc: "Námořní invaze na pobřežní [Concept('concept_state','stát')|l], koordinovaná mezi [Concept('concept_fleet','loďstvem')] a [Concept('concept_army','armádou')]. $concept_fleet$ udržuje vody u pobřeží pod kontrolou, aby zajistilo bezpečné vylodění armády, která následně vede sérii pozemních [Concept('concept_battle','bitev')] s cílem získat [Concept('concept_occupation','okupaci')] v cílovém státě.\n\nTen, kdo ovládá cílový stát, se může bránit námořní invazi umístěním vlastního [Concept('concept_fleet','loďství')] v dotčeném [Concept('concept_sea_node','námořním uzlu')] nebo rozmístěním [Concept('concept_mobilize_army','mobilizované')] armády v pozemním [Concept('concept_hq','velitelství')|l] zahrnujícím napadený stát." # todo: CHANGED (predtym: Námořní invaze na pobřežní [concept_state], koordinovaná mezi [concept_fleet] a [concept_army]. $concept_fleet$ udržuje )
 concept_working_adults: "Pracující dospělí"
 concept_working_adult: "Pracující dospělý"
 concept_working_adults_desc: "Část [Concept('concept_pop','populace')|l], která tvoří [Concept('concept_workforce', 'pracovní sílu')], pracující v [Concept('concept_building', 'budovách')] za [Concept('concept_building_wage', 'mzdu')]. Jsou hlavním zdrojem [Concept('concept_pop_income','příjmu')] a [Concept('concept_political_strength','politickou sílu')] pro danou populaci." # todo: CHANGED (predtym: Část [concept_pop], která tvoří [concept_workforce] pracující v [Concept('concept_building', '$concept_buildings|q$')] z)
 concept_dependents: "Závislé osoby"
 concept_dependent: "Závislá osoba"
 concept_dependents_desc: "Část [Concept('concept_pop','populace')|l], která se nepovažuje za součást [Concept('concept_workforce','pracovní síly')]. Představují rodiny [Concept('concept_working_adults','pracujících dospělých')] a obvykle tvoří většinu populace. $concept_dependents$ obvykle získávají [Concept('concept_dependent_income','dávky závislých osob')|l], který jsou obvykle nižší než [Concept('concept_building_wage','mzdy')|l] získávané [Concept('concept_working_adults','pracujícími dospělými')], ale mají také nižší [Concept('concept_pop_needs','potřeby')]. I když mohou podporovat [Concept('concept_interest_group','zájmové skupiny')|l], jejich [Concept('concept_political_strength','politická síla')|l] má obvykle menší váhu. [Concept('concept_votes','Volební právo')] získávají jen za velmi specifických podmínek daných [Concept('concept_law','zákony')].\n\nZavedení různých zákonů nebo udržování určitých [Concept('concept_institution','institucí')] může v průběhu přeměnit závislé osoby na pracující dospělé, zvýšit jejich [Concept('concept_political_strength','politickou sílu')], nebo doplnit jejich příjem." # todo: CHANGED (predtym: Část [Concept('concept_pop','populace')|l], která se nepovažuje za součást [Concept('concept_workforce','pracovní síly'))
 concept_disenfranchised: "Bez volebního práva"
 concept_disenfranchised_desc: "[Concept('concept_pop','Populace')] bez volebního práva nemá povoleno účastnit se politického života [Concept('concept_country','země')|l]. V důsledku toho nemohou podpořit žádné [Concept('concept_interest_group','zájmové skupiny')|l]. Nejčastější důvod, proč je [Concept('concept_pop','populace')|l] bez volebního práva je nízká míra [Concept('concept_acceptance','přijetí')|l]." # todo: CHANGED (predtym: [Concept('concept_pop','Populace')] $concept_disenfranchised$ nemá povoleno účastnit se politického života [Concept('con)
 concept_input_mult: "Vstupy zboží"
 concept_input_mult_desc: "Úprava množství [Concept('concept_good','zboží')|l], které je [Concept('concept_good_consumption','spotřebováno')|l] [Concept('concept_building','budovou')]."
 concept_throughput: "Efektivita"
 concept_throughput_desc: "Efektivita [Concept('concept_workforce','pracovní síly')] v [Concept('concept_building','budově')]. $concept_throughput$ zvyšuje jak [Concept('concept_good_consumption','vstup zboží')], tak [Concept('concept_good_production','výstup zboží')] nebo jiné efekty. Může se zvýšit v důsledku [Concept('concept_economy_of_scale','úspor z rozsahu')] a může být upravován nahoru nebo dolů vlivem [Concept('concept_modifier','modifikátorů')|l]." # todo: CONCEPT CASE
 concept_native_uprising: "Domorodé povstání"
 concept_native_uprisings: "Povstání domorodců" # todo: NEW TRANSLATION
 concept_native_uprising_desc: "Typ [Concept('concept_diplomatic_play','diplomatické hry')], který může nastat, pokud úroveň [Concept('concept_tension','napětí')|l] mezi kolonizátorem a [Concept('concept_decentralized_nation','decentralizovaným národem')] vzroste na úroveň #b $tension_volatile$#!. V této diplomatické hře se decentralizovaný národ mobilizuje a pokouší se převzít [Concept('concept_colony','kolonii')] od kolonizátora."
 concept_discrimination: "Diskriminace"
 concept_discriminated: "Diskriminováno"
 concept_discriminated_against: "Být diskriminován"
 concept_discrimination_desc: "[Concept('concept_pop','Populace')] může být diskriminována, pokud jejich [Concept('concept_culture','kultura')|l] a/nebo [Concept('concept_religion','náboženství')|l] mají nízkou hodnotu [Concept('concept_acceptance','přijetí')|l] ve své [Concept('concept_country','zemi')]. Obvykle je populace ve třech nejnižších statusech [Concept('concept_acceptance','přijetí')|l] považována za diskriminovanou. Diskriminovaná populace:\n- dostává nižší mzdu než ostatní\n- má nižší [Concept('concept_political_strength','politickou sílu')]\n- méně pravděpodobně získá [Concept('concept_pop_qualifications','kvalifikaci')] pro určité [Concept('concept_profession','profese')|l]\n- přirozeně se s časem [Concept('concept_radical','radikalizuje')]\n- a častěji [Concept('concept_migration','emigruje')].\n\nKromě toho některé [Concept('concept_law','zákony')|l] mohou míru národního přijetí kultur a náboženství omezit nebo rozšířit." # todo: CHANGED (predtym: [Concept('concept_pop', '$concept_pops|q$')] může být $concept_discriminated_against$, pokud jejich [Concept('concept_cu)
 concept_approval: "Spokojenost"
 concept_approval_disapproval: "Nesouhlas"
 concept_approval_indifferent: "Lhostejnost"
 concept_approval_desc: "[Concept('concept_interest_group','$concept_interest_group_possessive|q$')] $concept_approval$ závisí na dvou hlavních faktorech: kolik z jejich [Concept('concept_political_strength','politická síla')] pochází z [Concept('concept_radical','radikálů')] ve srovnání s [Concept('concept_loyalist','loajalisty')], a jak dobře současné [Concept('concept_law','zákony')] [Concept('concept_country','zemi')] odpovídají [Concept('concept_ideology','ideologie')] dané $concept_interest_group$. Kromě toho, pokud je nový $concept_law$ právě [Concept('concept_enactment_of_laws','uzákoněn')], bude $concept_approval$ ovlivněn větší dočasnou úpravou, která bude přetrvávat během [Concept('concept_decay','$concept_decaying|q$')|l] po dobu až #v [GetDefine('NPolitics','CHANGED_LAW_APPROVAL_MONTHS')|0] měsíců#! po jeho přijetí.\n\n$concept_approval$ určuje, které [Concept('concept_interest_group_trait','rysy zájmové skupiny')] si aktivují. [GetApprovalRatingFromValue(GetDefine('NPolitics','APPROVAL_THRESHOLD_ANGRY'))] $concept_interest_groups$ přispívají k [Concept('concept_activism','aktivismu hnutí')] [Concept('concept_political_movement','politickému hnutí')], zatímco $concept_interest_groups$, které dosahují alespoň [GetApprovalRatingFromValue(GetDefine('NPolitics','APPROVAL_THRESHOLD_HAPPY'))], se od začátku zdrží připojování k $concept_political_movements_short$. $ig_approval_coup_loc$" # todo: CHANGED (predtym: [Concept('concept_interest_group','$concept_interest_group_possessive|q$')] $concept_approval$ závisí na dvou hlavních f)
 ig_approval_coup_loc: "$concept_interest_group$ se Spokojeností na nebo pod hodnotou [GetApprovalRatingFromValue(GetDefine('NPolitics','APPROVAL_THRESHOLD_ANGRY'))] může rozpoutat [Concept('concept_coup','puč')|l] proti současné [Concept('concept_government','vládě')]."
 concept_insurrection: "Vzpoura"
 concept_insurrections: "Povstání"
 concept_insurrectionary: "Vzpouřenecké"
 concept_insurrection_desc: "$concept_insurrection$ je buď [Concept('concept_secession', 'separatistické')] nebo [Concept('concept_revolution','revoluční')|l] [Concept('concept_political_movement','politické hnutí')|l]. To znamená, že hnutí je na pokraji přerodu na [Concept('concept_civil_war','občanskou válku')|l]. Jakékoliv [Concept('concept_pop','populace')|l] nebo [Concept('concept_interest_group','zájmové skupiny')|l], které jsou součástí vzbouřeneckého hnutí, jsou také označovány jako #italic $concept_insurrectionary$#!." # todo: CHANGED (predtym: $concept_insurrection$ je buď [Concept('concept_secession', 'separatistické')] nebo [Concept('concept_revolution','revol)
 concept_revolt: "Povstání"
 concept_revolution: "Revoluce"
 concept_revolutions: "Revoluce"
 concept_revolutionary: "Revoluční"
 concept_revolution_desc: "Na rozdíl od [Concept('concept_secession','odtržení')|l], revoluce se pokusí anektovat celou [Concept('concept_country','zemi')] a přetvořit jej podle své [Concept('concept_core_movement_ideology','ideologie')]. $concept_revolution$ je důsledkem [Concept('concept_political_movement','politického hnutí')], které se stalo příliš [Concept('concept_radical','radikálním')] a získalo vysokou [Concept('concept_political_movement_support', 'podporu')] i míru [Concept('concept_activism','aktivismu')]. Pokud toto hnutí zahájí vzpouru, [Concept('concept_state','státy')|l], ve kterých má silnou podporu [Concept('concept_pop','populace')|l], se oddělí od zbytku země a zahájí [Concept('concept_diplomatic_play','diplomatickou hru')] s cílem připojit [Concept('concept_loyalist','věrné části země')] k sobě.\n\nMíru [Concept('concept_activism','aktivismu')] politického hnutí lze snížit snížením počtu [Concept('concept_radical','radikálů')] v podporujících skupinách populace a zvýšením [Concept('concept_approval','spokojenosti')] jejich [Concept('concept_interest_group','zájmové skupiny')|l]. Revoluci lze také oslabit a zpomalit pomocí [Concept('concept_institution','institucí')|l] [SelectLocalization(GetPlayer.IsValid,'concept_revolution_desc_added','Vnitřní záležitosti')]." # todo: CHANGED (predtym: Na rozdíl od [Concept('concept_secession','odtržení')|l], $concept_revolution$ se pokusí anektovat celou [concept_countr)
 concept_revolution_desc_added: "[GetInstitutionType('institution_home_affairs').GetName]"
 concept_secession: "Odtržení"
 concept_secessions: "Odtržení"
 concept_secessionist: "Separatista"
 concept_secessionists: "Separatisté"
 concept_seceding: "Odtržení"
 concept_secession_desc: "Na rozdíl od [Concept('concept_revolution','revolucí')|l], odtržení rozdělí [Concept('concept_country','zemi')] na dvě strany, přičemž separatisté bojují za osvobození a vytvoření nového národa. $concept_secession$ je výsledkem [Concept('concept_political_movement','politického hnutí')], které se stalo příliš [Concept('concept_radical','radikálním')] a získalo vysokou [Concept('concept_political_movement_support','podporu')] i míru [Concept('concept_activism','aktivismu')]. Pokud toto hnutí zahájí vzpouru, [Concept('concept_state','státy')|l], ve kterých má silnou podporu [Concept('concept_pop','populace')|l], se oddělí od zbytku země a zahájí [Concept('concept_diplomatic_play','diplomatickou hru')] za osvobození.\n\nMíru [Concept('concept_activism','aktivismu')] politického hnutí lze snížit snížením počtu [Concept('concept_radical','radikálů')] v podporujících skupinách populace a zvýšením [Concept('concept_approval','spokojenosti')] jejich [Concept('concept_interest_group','zájmové skupiny')|l]. Můžete také oslabit a zpomalit odtržení pomocí [Concept('concept_institution','institucí')|l] [SelectLocalization(GetPlayer.IsValid,'concept_revolution_desc_added','Vnitřní záležitosti')]." # todo: CHANGED (predtym: Na rozdíl od [Concept('concept_revolution','revolucí')|l], $concept_secession$ rozdělí [Concept('concept_country','zemi')
 concept_secession_desc_added: "[GetInstitutionType('institution_home_affairs').GetName]"
 concept_civil_war: "Občanská válka"
 concept_civil_wars: "Občanské války"
 concept_civil_war_desc: "[Concept('concept_war','Válka')], kde se [Concept('concept_country','země')|l] rozdělí na dvě protistrany. Může se jednat o [Concept('concept_revolution','revoluci')] nebo [Concept('concept_secession','secesi')], jakožto výsledek [Concept('concept_political_movement','politického hnutí')]." # todo: CONCEPT CASE
 concept_political_movement_support: "Podpora politického hnutí"
 concept_political_movement_support_short: "Podpora"
 concept_political_movement_supporting: "Podpora"
 concept_political_movement_support_desc: "$concept_political_movement_support_short$ [Concept('concept_political_movement','politického hnutí')] se zakládá na [Concept('concept_political_strength','politické síle')] jeho podporující [Concept('concept_pop','populace')|l] a také na [Concept('concept_popularity','popularitě')] a [Concept('concept_character_trait','charakterových rysů')] jakýchkoliv podporujících [Concept('concept_agitator','agitátorů')]. $concept_political_movement$ s alespoň [LabelingHelper.GetLabelForRadicalism(GetDefine('NPolitics', 'MOVEMENT_MIN_RADICALISM_FOR_LAW_ENACTMENT_IMPACT'))] (#v [GetDefine('NPolitics', 'MOVEMENT_MIN_RADICALISM_FOR_LAW_ENACTMENT_IMPACT')|%0]#!) [Concept('concept_activism','aktivismem')] zvyšují šanci na [Concept('concept_enactment_success','úspěšné uzákonění zákona')|l], pokud následuje [Concept('concept_law','zákon')|l], který si přejí, nebo zvyšují šanci na [Concept('concept_enactment_stall','obstrukci')], pokud mu odporují. Tato zvýšená šance je přímo založena na podpoře. Pokud politické hnutí směruje ke [Concept('concept_insurrection','vzpoure')], podpora politického hnutí určí, s kolika [Concept('concept_state','státy')] bude tato vzpoura začínat\n\n#title Prahové hodnoty podpory:#! #indent_newline:3 \n[GetSupportLabelsDesc]" # todo: CHANGED (predtym: $concept_political_movement_support_short$ [Concept('concept_political_movement','politického hnutí')] se zakládá na [Co)
 concept_political_movement: "Politické hnutí"
 concept_political_movement_short: "Hnutí"
 concept_political_movements_short: "Hnutí"
 concept_political_movements: "Politická hnutí"
 concept_political_movement_possessive: "politického hnutí"
 concept_political_movement_possessive_short: "hnutí"
 concept_political_movement_desc: "$concept_political_movement$ je poháněno [Concept('concept_political_movement_support','podporou')] [Concept('concept_pop','populace')|l] podle toho, jaký je jejich [Concept('concept_core_movement_ideology','ideový základ hnutí')|l]. Jejich podpora přichází v různých stupních [Concept('concept_activism','aktivismu')] v závislosti na tom, kolik populace je zapojených nebo naštvaných ohledně dané otázky. [Concept('concept_agitator','Agitátoři')] se také mohou připojit k podpoře hnutí, což zvyšuje aktivismus na základě jejich [Concept('concept_popularity','popularity')]. Pokud je dostatek populace podporující hnutí a aktivismus je dost vysoký, hnutí se může stát [Concept('concept_insurrection','vzpouřenecké')|l] v závislosti na [Concept('concept_law','zákonech')] v ideovém základu hnutí a typu hnutí. [Concept('concept_insurrection','Vzpouřenecké')] hnutí může následně přivést zemi až do [Concept('concept_civil_war','občanské války')|l].\n\n$concept_political_movements$ budou vyvíjet [Concept('concept_political_movement_pressure','politický tlak')|l] na [Concept('concept_interest_group','zájmové skupiny')|l] na základě procentuálního podílu [Concept('concept_political_strength','politické síly')] od podporujících skupin populace.\n\n$concept_political_movements_short$ ovlivňují zákony a zároveň jsou jimi ovlivňována. Pokud je [Concept('concept_activism','aktivismus hnutí')|l] alespoň [LabelingHelper.GetLabelForRadicalism(GetDefine('NPolitics', 'MOVEMENT_MIN_RADICALISM_FOR_LAW_ENACTMENT_IMPACT'))] (#v [GetDefine('NPolitics', 'MOVEMENT_MIN_RADICALISM_FOR_LAW_ENACTMENT_IMPACT')|%0]#!), hnutí zvýší šance na [Concept('concept_enactment_success','úspěšné uzákonění zákona')|l] anebo na [Concept('concept_enactment_stall','obstrukci')] pro [Concept('concept_endorse_oppose','podporováne')] i [Concept('concept_endorse_oppose','odmítané')] zákony v rámci [Concept('concept_core_movement_ideology','ideového základu hnutí')], podle míry [Concept('concept_political_movement_support','podpory')] hnutí. Podobně, pokud je aktivismus hnutí alespoň [LabelingHelper.GetLabelForRadicalism(GetDefine('NPolitics', 'MOVEMENT_MIN_RADICALISM_FOR_LAW_ENACTMENT_IMPACT'))] (#v [GetDefine('NPolitics', 'MOVEMENT_MIN_RADICALISM_FOR_LAW_ENACTMENT_IMPACT')|%0]#!) a zákon, ať už přijíman nebo odmítán v ideovém základu hnutí, se [Concept('concept_enactment_of_laws','schvaluje')], aktivismus #b nemůže#! klesnout pod úroveň [LabelingHelper.GetLabelForRadicalism(GetDefine('NPolitics', 'MOVEMENT_MIN_RADICALISM_FOR_LAW_ENACTMENT_IMPACT'))] (#v [GetDefine('NPolitics', 'MOVEMENT_MIN_RADICALISM_FOR_LAW_ENACTMENT_IMPACT')|%0]#!)." # todo: CHANGED (predtym: $concept_political_movement$ je poháněno [Concept('concept_political_movement_support','$concept_political_movement_supp)
 concept_activism: "Aktivismus hnutí"
 concept_activism_short: "Aktivismus"
 concept_activism_desc: "$concept_activism$ je procento [Concept('concept_political_movement_support','podpora')] [Concept('concept_pop','populace')], které jsou ochotné aktivně prosazovat agendu [Concept('concept_political_movement','politického hnutí')]. Určuje, kolik [Concept('concept_radical','radikálů')] je generováno $concept_political_movement_short$ každý týden a jak blízko je $concept_political_movement_short$ k tomu, aby se stal [Concept('concept_insurrection','vzpouřenecké')]. Pokud už je $concept_insurrectionary$, určuje maximální postup, kterého může $concept_revolution$ dosáhnout.\n\nNaštěstí dokážeme předpovědět, jak se bude $concept_political_movement_possessive$ $concept_activism_short$ měnit. Pokud je predikce @activism_red! $RADICALISM_PROTESTING$ (#v [GetDefine('NPolitics', 'RADICALISM_PROTESTING_THRESHOLD')|%0]#!) nebo vyšší, má $concept_political_movement_short$ vysoké riziko stát se $concept_insurrectionary$. Pokud je predikce @activism_red! $RADICALISM_MILITANT$ (#r 100%#!) a $concept_political_movement_support_short$ je dostatečný, hrozí [Concept('concept_civil_war','občanská válka')], protože postup [Concept('concept_revolution','revoluce')] nebo [Concept('concept_secession','odtržení')] může nyní dosáhnout #v 100%#!.\n\nPokud je $concept_activism_short$ alespoň [LabelingHelper.GetLabelForRadicalism(GetDefine('NPolitics', 'MOVEMENT_MIN_RADICALISM_FOR_LAW_ENACTMENT_IMPACT'))] (#v [GetDefine('NPolitics', 'MOVEMENT_MIN_RADICALISM_FOR_LAW_ENACTMENT_IMPACT')|%0]#!), $concept_political_movement_short$ zvýší šance na [Concept('concept_enactment_success','úspěšné uzákonění zákona')] a [Concept('concept_enactment_stall','obstrukci')] u [Concept('concept_endorse_oppose','podporováno')] a [Concept('concept_endorse_oppose','proti')] $concept_laws$ v rámci [Concept('concept_core_movement_ideology','ideového základu hnutí')] podle $concept_political_movement_support_short$.\n\nPokud je $concept_activism_short$ alespoň [LabelingHelper.GetLabelForRadicalism(GetDefine('NPolitics', 'MOVEMENT_MONTHLY_RADICALS_THRESHOLD'))] (#v [GetDefine('NPolitics', 'MOVEMENT_MONTHLY_RADICALS_THRESHOLD')|%0]#!), určitý počet $concept_political_movement_supporting$ $concept_pops$ se každý měsíc stane $concept_radicalized$, a některé $concept_political_movements_short$ začnou vytvářet [Concept('concept_obstinance','neústupnost')] v $concept_states$, kde jsou $concept_political_movement_supporting$ $concept_pops$.\n\n#title Prahové hodnoty $concept_activism_short$:#! #indent_newline:3 \n[GetActivismLabelsDesc]" # todo: CONCEPT CASE
 concept_political_movement_pressure: "Politický tlak"
 concept_political_movement_pressure_short: "Tlak"
 concept_political_movement_pressured_short: "Pod tlakem"
 concept_political_movement_pressure_desc: "[Concept('concept_political_movement','Politická hnutí')] budou vyvíjet politický tlak na zájmovou skupinu na základě procentuálního podílu [Concept('concept_political_strength','politické síly')], kterou má [Concept('concept_political_movement_support','podporující')] [Concept('concept_pop','populace')|l]. $concept_interest_group$ je považována za skupinu #b pod tlakem#!, pokud je politický tlak nad #v [GetDefine('NPolitics', 'IG_INFLUENCING_MOVEMENT_MIN_SUPPORTING_CLOUT')|%0]#!. Poté se [Concept('concept_ideology','ideologie')] [Concept('concept_character','postavy')] spojené s tímto politickým hnutím může stát dostupnou pro nové [Concept('concept_leader','vůdce')] této zájmové skupiny.\n\nVšechna populace patřící k zájmové skupině má různou politickou sílu, která se sčítá do celkové politické síly dané skupiny. Procento této celkové síly, kterou představuje populace obyvatelé podporující [Concept('concept_political_movement','politické hnutí')|l], určuje výsledný politický tlak hnutí. $concept_pops$ s vyšší politickou silou mají větší vliv na své zájmové skupiny prostřednictvím ideologií a přesvědčení, které vyznává jimi podporované politické hnutí" # todo: CHANGED (predtym: [Concept('concept_political_movement','$concept_political_movements|q$')] budou $concept_political_movement_pressure_sho)
 concept_core_movement_ideology: "Ideový základ hnutí"
 concept_core_movement_ideology_short: "Ideový základ"
 concept_core_movement_ideology_extra_short: "Ideologie"
 concept_core_movement_ideology_desc: "Tato [Concept('concept_ideology','ideologie')|l] představuje to, na čem záleží [Concept('concept_political_movement_support','podporující')] [Concept('concept_pop','populaci')] a [Concept('concept_agitator','agitátorům')] a co celkově prosazuje [Concept('concept_political_movement','politické hnutí')|l]. Přijetí [Concept('concept_law','zákonů')] [Concept('concept_endorse_oppose','podporovaných')] touhle ideologií vytvoří [Concept('concept_loyalist','loajalisty')] z podporující populace. Pokud jsou některé [Concept('concept_interest_group','zájmové skupiny')|l] [Concept('concept_political_movement_pressure','pod tlakem')], je zaručeno, že daná ideologie se stane jednou z ideologií, kterou může zastávat nový [Concept('concept_leader', 'vůdce')] těchto zájmových skupin." # todo: CHANGED (predtym: Tato [Concept('concept_ideology','ideologie')|l] představuje to, na čem záleží [Concept('concept_political_movement_supp)
 concept_peace_deal: "Mírová smlouva"
 concept_peace_deals: "Mírové smlouvy"
 concept_peace_deal_desc: "Když [Concept('concept_war_leader','válečný vůdce')|l] chce ukončit [Concept('concept_war','válku')], může nabídnout mírovou smlouvu. Smlouva musí být schválena všemi vyjednávajícími zeměmi, které zůstávají ve válce, aby nabyla účinnosti. Pro zvýšení šance, že mírová smlouva bude schválena, má vůdce povoleno zahrnout nebo vyloučit navržené [Concept('concept_war_goal','válečné cíle')|l] z obou stran." # todo: CHANGED (predtym: Když [Concept('concept_war_leader','válečný vůdce')|l] chce ukončit [Concept('concept_war','válku')], může nabídnout $co)
 concept_war: "Válka"
 concept_wars: "Války"
 concept_war_desc: "Aktivní ozbrojený konflikt mezi dvěma stranami zúčastněných [Concept('concept_country','zemí')] jako výsledek neúspěšného pokusu o mírové vyřešení [Concept('concept_diplomatic_play','diplomatické hry')]. Během války budou [Concept('concept_commander','velitelé')|l] na zemi a na moři následovat [Concept('concept_order','rozkazy')|l] na splnění určitých cílů, často vedoucích k [Concept('concept_battle','bitvám')] mezi oběma stranami." # todo: CHANGED (predtym: Aktivní ozbrojený konflikt mezi dvěma stranami zúčastněných [Concept('concept_country','$concept_countries|q$')] jako vý)
 concept_war_goal: "Válečný cíl"
 concept_war_goals: "Válečné cíle"
 concept_war_goal_desc: "$concept_war_goals$ jsou cíle, o které [Concept('concept_country','země')|l] bojuje ve [concept_war]. Jsou určeny během [concept_diplomatic_play] a jsou stanoveny poté, co $concept_war$ začala.\n\nPrvní $concept_war_goal$ nárokovaný jako součást $concept_diplomatic_play$ je považován za váš [Concept('concept_primary_demand','primární požadavek')|l], a některé $concept_diplomatic_plays$ vyžadují, aby byl součástí všech $concept_peace_deals$." # todo: CHANGED (predtym: $concept_war_goals$ jsou cíle, o které [Concept('concept_country','země')|l] bojuje ve [Concept('concept_war','válce')].)
 concept_controlled_war_goal: "Ovládaný válečný cíl"
 concept_controlled_war_goals: "Ovládané válečné cíle"
 concept_control_war_goal: "Ovládat válečný cíl"
 concept_control_war_goals: "Ovládání válečných cílů"
 concept_controlling_a_war_goal: "Ovládání válečného cíle"
 concept_controlling_war_goals: "Ovládání válečných cílů"
 concept_controlled_war_goal_short: "Ovládán"
 concept_controlling_war_goal_short: "Ovládá"
 concept_control_war_goal_short: "Ovládat"
 concept_controls_war_goal_short: "Ovládá"
 concept_controlled_war_goal_desc: "Pokud držitel [Concept('concept_war_goal','válečného cíle')] (nebo jeho [Concept('concept_ally','spojence')|l]) [Concept('concept_occupation','okupuje')] požadovaný [Concept('concept_state','stát')|l] či [Concept('concept_state','státy')|l], je považován za toho, kdo ovládá tento [Concept('concept_war_goal','válečný cíl')|l]. [Concept('concept_war_support','Válečná podpora')] může klesnout pod #v 0#! pouze pokud opačná strana ovládá všechny své válečné cíle." # todo: CHANGED (predtym: Pokud držitel [Concept('concept_war_goal','válečného cíle')] (nebo jeho [Concept('concept_ally','spojence')|l]) [Concept)
 concept_primary_demand: "Primární požadavek"
 concept_primary_demand_short: "Primární"
 concept_primary_demands: "Primární požadavky"
 concept_primary_demand_desc: "$concept_primary_demands$ jsou [Concept('concept_war_goal','válečné cíle')|l], které budou vynuceny na opačné straně [Concept('concept_diplomatic_play','diplomatické hry')], pokud se rozhodne ustoupit. První [Concept('concept_war_goal','válečný cíl')|l] přidaný na každé straně je vždy považován za primární, podobně jako jakékoliv [Concept('concept_war_goal','válečné cíle')|l] přidané proti vůdci opačné strany prostřednictvím [Concept('concept_sway','ovlivňování')|l]." # todo: CHANGED (predtym: $concept_primary_demands$ jsou [Concept('concept_war_goal','$concept_war_goals|q$')] vynucené na opačné straně [concept_)
 concept_secondary_demand: "Sekundární požadavek"
 concept_secondary_demand_short: "Sekundární"
 concept_secondary_demands: "Sekundární požadavky"
 concept_secondary_demand_desc: "$concept_secondary_demands$ jsou [Concept('concept_war_goal','válečné cíle')|l], které NEBUDOU vymáhány v [Concept('concept_diplomatic_play','diplomatické hře')], pokud se jedna strana rozhodne ustoupit, ale mohou být uplatněny v [Concept('concept_peace_deal','mírové smlouvě')] nebo prostřednictvím kapitulace, pokud se situace vyeskaluje do [Concept('concept_war','války')]. $concept_secondary_demand$, který cílí na vůdce protistrany, může být převeden na tzv. $concept_primary_demand$ tím, že se utratí [Concept('concept_diplomatic_maneuvers','diplomatické manévry')|l], ačkoli to může mít za následek [Concept('concept_diplomatic_incident','diplomatický incident')|l]." # todo: CONCEPT CASE
 concept_resource_potential: "Potenciál zdrojů"
 concept_resource_potentials: "Potenciály zdrojů"
 concept_resource_potentials_short: "Potenciály"
 concept_resource_potential_desc: "$concept_resource_potential$ uděluje schopnost postavit a rozšířit specifický typ [Concept('concept_building','budova')|l] ve státě, obvykle v oblasti těžby surovin, jako je rybolov, doly nebo plantáže. Maximální [Concept('concept_building_level','úroveň budovy')|l], na který můžete budovu rozšířit, je omezena buď pevně stanoveným limitem podle typu suroviny, nebo množstvím [Concept('concept_arable_land','orné půdy')] ve státě."
 concept_government: "Vláda"
 concept_governments: "Vlády"
 concept_government_possessive: "Vlády"
 concept_government_desc: "$concept_government$ [Concept('concept_country','země')|l] se skládá z jedné nebo několika [Concept('concept_interest_group','zájmových skupin')]. Pokud má země [Concept('concept_votes','volební právo')|l], mohou být tyto zájmové skupiny organizovány do [Concept('concept_party','stran')]. V závislosti na [Concept('concept_law','zákonech')] [Concept('concept_country','země')|l] povede tato směs zájmových skupin k vyšší nebo nižší [Concept('concept_legitimacy','legitimitě')] [Concept('concept_government','vlády')].\n\nJakýkoliv nový zákon, který chcete [Concept('concept_enactment_of_laws','schválit')], musí mít určitou podporu mezi zájmovými skupinami, které tvoří [Concept('concept_government','vládu')], pokud to není podporováno aktivním [Concept('concept_political_movement','politickým hnutím')]. Schopnost rychle a bezbolestně prosadit zákon skrze legislativu závisí na tom, jak jednotná je jeho vládní podpora." # todo: CHANGED (predtym: $concept_government$ [Concept('concept_country','$concept_country$')] se skládá z jedné nebo několika [Concept('concept_)
 concept_interest: "Zájem"
 concept_interests: "Zájmy"
 concept_interest_desc: "[Concept('concept_country','Země')], která udržuje zájem v [Concept('concept_strategic_region','strategickém regionu')], dává zbytku světa najevo, že by se mohla zapojit do [Concept('concept_diplomatic_play', 'diplomatických her')] probíhajících v dané oblasti. Dostatečně vysoká [Concept('concept_interest_tier','úroveň zájmu')] v strategickém regionu je podmínkou pro možnost zahájit nebo se připojit k diplomatické hře, a nelze [Concept('concept_colony', 'kolonizovat')] [Concept('concept_state_region','státní oblasti')], kde neudržujete dostatečně vysokou úroveň zájmu." # todo: CHANGED (predtym: [Concept('concept_country','Země')], která udržuje $concept_interest$ v [Concept('concept_strategic_region','$concept_st)
 concept_involvement: "Zapojení"
 concept_involved: "Zapojen"
 concept_involvement_desc: "Míra $concept_involvement$ [Concept('concept_country','zemi')] v [Concept('concept_strategic_region','strategickém regionu')] měří, jak silný je jejich [Concept('concept_interest','zájem')] v regionu.\n\n$HOW_TO_INCREASE_INVOLVEMENT$" # todo: CONCEPT CASE
 concept_local_country: "Místní země"
 concept_local_countries: "Místní země"
 concept_local_country_short: "Místní"
 concept_local_country_desc: "[Concept('concept_country','Země')] je $concept_local_country_short$ pro [Concept('concept_strategic_region','strategický region')], pokud splňuje některou z následujících podmínek:\n$TAB$• Má svůj [Concept('concept_capital_state','hlavní město')] v $concept_strategic_region_short$\n$TAB$• Má [GetDefine('NDiplomacy', 'REGION_LOCALITY_SHARE_THRESHOLD')|0v%] nebo více [Concept('concept_locality','místnost')] v $concept_strategic_region_short$\n$TAB$• Má [GetDefine('NDiplomacy', 'REGION_LOCALITY_COUNTRY_INCORPORATED_SHARE_THRESHOLD')|0v%] nebo více svých [Concept('concept_incorporated_state', '$concept_incorporated_states|q$')|l] v $concept_strategic_region_short$" # todo: CHANGED (predtym: [Concept('concept_country','Země')] je $concept_local_country_short$ pro [Concept('concept_strategic_region','strategick)
 concept_locality: "Místnost"
 concept_locality_desc: "Míra toho, jak místní je země v [Concept('concept_strategic_region','strategickém regionu')], kterou tvoří kombinace podílu vlastněných [Concept('concept_state','států')], [Concept('concept_pop','populací')] a [Concept('concept_gdp','hrubý domácí produkt')] v daném $concept_strategic_region_short$" # todo: CONCEPT CASE
 concept_interest_tier: "Úroveň zájmu"
 concept_interest_tiers: "Úrovně zájmu"
 concept_interest_tier_short: "Úroveň"
 concept_interest_tier_desc: "[Concept('concept_interest_tier','Úroveň zájmu')] označuje úroveň přítomnosti, kterou má [Concept('concept_country','země')] v [Concept('concept_strategic_region','strategickém regionu')], a může být povýšena zvýšením [Concept('concept_involvement','zapojení')] v daném $concept_strategic_region_short$.\nVyšší úrovně odemykají nové interakce a výhody." # todo: CONCEPT CASE
 concept_diplomatic_relevancy: "Diplomatická relevance" # todo: NEW TRANSLATION
 concept_diplomatically_relevant: "Diplomaticky relevantní" # todo: NEW TRANSLATION
 concept_diplomatically_irrelevant: "Diplomaticky nerelevantní" # todo: NEW TRANSLATION
 concept_diplomatic_relevancy_desc: "Mít $concept_diplomatic_relevancy$ je vyžadováno, aby se [Concept('concept_country','země')] mohl zapojit do určitých interakcí, jako je podepisování [Concept('concept_treaty','smlouvy')]. $concept_country$ je považován za $concept_diplomatically_relevant$ vůči jinému, pokud je splněna některá z následujících podmínek:\n$EFFECT_LIST_BULLET$Mají společnou přímou hranici\n$EFFECT_LIST_BULLET$Mezi nimi leží právě jeden [Concept('concept_sea_node','námořní uzel')]\n$EFFECT_LIST_BULLET$Jeden $concept_country$ sousedí s [Concept('concept_subject','závislou zemí')] druhého\n$EFFECT_LIST_BULLET$Jeden $concept_country_possessive$ $concept_subject$ sousedí s druhým $concept_country_possessive$ $concept_subject$\n$EFFECT_LIST_BULLET$Existující $concept_treaty$ mezi těmito dvěma $concept_countries$\n$EFFECT_LIST_BULLET$Obě $concept_countries$ jsou [Concept('concept_great_power','velmoci')]\n$EFFECT_LIST_BULLET$Jeden z $concept_countries$ vyhlásí [Concept('concept_rivalry','rivalitu')] vůči druhému\n$EFFECT_LIST_BULLET$Jeden z $concept_countries$ provádí [Concept('concept_piracy','pirátů')] cílenou proti druhému\n$EFFECT_LIST_BULLET$Obě $concept_countries$ mají překrývající se [Concept('concept_interest','zájmy')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 concept_strategic_adjacency: "Strategická sousednost" # todo: NEW TRANSLATION
 concept_strategically_adjacent: "Strategicky sousední" # todo: NEW TRANSLATION
 concept_strategic_adjacency_desc: "$concept_strategic_adjacency$ je kontrola přilehlosti mezi dvěma [Concept('concept_country','zeměmi')], která se používá k povolení určitých interakcí mezi nimi, pokud jsou splněny podmínky. Dvě $concept_countries$ se považují za $concept_strategically_adjacent$, pokud je splněna některá z těchto podmínek:\n$EFFECT_LIST_BULLET$Mají společnou přímou hranici\n$EFFECT_LIST_BULLET$Mezi nimi leží právě jeden [Concept('concept_sea_node','námořní uzel')]\n$EFFECT_LIST_BULLET$Jeden $concept_country$ sousedí s [Concept('concept_subject','závislou zemí')] druhého\n$EFFECT_LIST_BULLET$Jeden $concept_country_possessive$ $concept_subject$ sousedí s druhým $concept_country_possessive$ $concept_subject$\n$EFFECT_LIST_BULLET$Jeden $concept_country$ sousedí se třetí [Concept('concept_country','zemí')], která mu poskytuje [Concept('concept_military_access','vojenský přístup')|l] a sousedí s tou druhou\n$EFFECT_LIST_BULLET$Jeden $concept_country$ sousedí s neprosazeným [Concept('concept_war_goal','válečným cílem')]" # todo: CHANGED (predtym: $concept_strategic_adjacency$ je kontrola přilehlosti mezi dvěma [Concept('concept_country','zeměmi')], která se používá)
 concept_obligation: "Závazek"
 concept_obligations: "Závazky"
 concept_obligated: "Zavázaný"
 concept_obligation_desc: "Jedna [Concept('concept_country','země')|l] může být zavázaná vůči jiné v důsledku dohod uzavřených během [Concept('concept_diplomatic_play','diplomatických her')] nebo pokud jedna země převezme [Concept('concept_loans','půjčky')|l] té druhé. Být zavázán vůči zemi znamená, že nemůžete začít diplomatickou hru proti ní ani se k ni přidat na opačné straně, jako je ona. Druhá země může využít závazek, který má, k vynucení [Concept('concept_diplomatic_pact','diplomatického paktu')] nebo [Concept('concept_treaty','smlouvy')], případně ji zrušit, aby vás [Concept('concept_sway','přiměl')] k podpoře v diplomatické hře nebo zvýšil vzájemné [Concept('concept_relations','vztahy')|l]." # todo: CHANGED (predtym: Jedna [concept_country] může být $concept_obligated$ vůči jiné v důsledku dohod uzavřených během [Concept('concept_diplo)
 concept_gdp: "Hrubý domácí produkt"
 concept_gdp_short: "HDP"
 concept_gdp_desc: "Každá jednotka [Concept('concept_good_production','vyprodukovaného')|l] [Concept('concept_good','zboží')|l] ve vaší [Concept('concept_country','zemi')] přispívá k vašemu [Concept('concept_gdp','HDP')]. [Concept('concept_market_price','Tržní cena')] vaší národní produkce je snížena hodnotou zboží, které slouží jako vstup do procesu.\n\n$concept_gdp_short$ ovlivňuje [Concept('concept_prestige','prestiž')|l] a [Concept('concept_budget_minting','ražbu mincí')]." # todo: CHANGED (predtym: Každá jednotka [Concept('concept_good','zboží')|l] [Concept('concept_good_production', 'vyprodukovaného')|l] ve vaší [Co)
 concept_gdp_per_capita: "Hrubý domácí produkt na osobu"
 concept_gdp_per_capita_short: "HDP na osobu"
 concept_gdp_per_capita_desc: "[Concept('concept_gdp','Hrubý domácí produkt')] vaší země dělený její celkovou [Concept('concept_pop','populací')]."
 concept_gdp_ownership: "Vlastnictví HDP"
 concept_gdp_ownership_desc: "[Concept('concept_gdp','Hrubý domácí produkt')] [Concept('concept_country','země')] může být vlastněno jak domácími subjekty samotné země, tak i cizími vlastníky z jiných zemí. Pokud má jiná země [Concept('concept_foreign_investment_rights','práva na investice')|l], může jako cizí vlastník vlastnit [Concept('concept_building_level','úrovně budov')] v původní zemi. $concept_gdp_short$ generované z těchto budov se pak připočítává k cizímu  $concept_gdp_short$ země. Pouze $concept_gdp_short$ vlastněno domácími subjekty přispívá k domácí [Concept('concept_prestige','prestiži')] a [Concept('concept_budget_minting','ražbě mincí')]." # todo: CHANGED (predtym: [Concept('concept_gdp','Hrubý domácí produkt')] [Concept('concept_country','země')] může být vlastněno jak domácími subj)
 concept_education_access: "Přístup k vzdělání"
 concept_education_access_desc: "Stupeň, do jakého může [Concept('concept_pop','populace')|l] získat vzdělání pro své děti. Jak se nové generace rodí a jsou vychovávány, [Concept('concept_literacy','gramotnost')|l] [Concept('concept_pop','populace')|l] se posune směrem k úrovni přístupu k vzdělání."
 concept_isolated_state: "Izolovaný státní region"
 concept_isolated_states: "Izolované státy"
 concept_isolated_state_short: "Izolovaný"
 concept_isolated_state_desc: "[Concept('concept_state_region','Státní oblast')] je považován za izolovaný od jeho [Concept('concept_market','trhu')], pokud není po souši propojen se svým [Concept('concept_market_capital','hlavním centrem')] a zároveň není po souši propojen s budovou [SelectLocalization(GetPlayer.IsValid,'concept_isolated_state_desc_added','Přístav')], která by mohla navázat [Concept('concept_port_connection','přístavní spojení')|l] se svím [Concept('concept_market_capital','hlavním centrem')]. $concept_isolated_states$ nevytváří žádné [Concept('concept_buy_orders','nákupní objednávky')|l] ani [Concept('concept_sell_orders','prodejní objednávky')|l], a [Concept('concept_local_price','místní cena')|l] [Concept('concept_good','zboží')|l] v nich není ovlivněna [Concept('concept_market_price','tržní cenou')]." # todo: CHANGED (predtym: [Concept('concept_state_region','Státní oblast')] je považována za [Concept('concept_isolated_state','$concept_isolated_)
 concept_isolated_state_desc_added: "[GetBuildingType('building_port').GetName]"
 concept_shortage: "Nedostatek"
 concept_shortages: "Nedostatky"
 concept_input_goods_shortage: "Nedostatek vstupního zboží"
 concept_input_goods_shortages: "Nedostatek vstupních zboží"
 concept_shortage_desc: "Pokud je nabídka [Concept('concept_good','zboží')|l] menší než [GetDefine('NEconomy', 'GOODS_SHORTAGE_PENALTY_THRESHOLD')|v%0] z jeho poptávky, je dané zboží považováno za nedostatkové. Během nedostatku mohou být aplikovány různé penalizace v závislosti na tom, jak je zboží používáno.\n\n$concept_goods$ použité jako [Concept('concept_good_consumption','vstupní zboží')|l] pro [Concept('concept_building','budovy')|l] povede k rostoucí penalizaci podle závažnosti nedostatku.\n\nV případě [Concept('concept_pop_needs','potřeby')] [GetPopNeed('popneed_basic_food').GetName] bude mít nedostatek vliv na [Concept('concept_starvation','potravinovou bezpečnost')] v tomto [Concept('concept_state','státě')], což může vést k [Concept('concept_starvation','hladování')], a dokonce i k [Concept('concept_famine','hladomoru')]. $concept_shortages$ [GetPopNeed('popneed_basic_food').GetName] vychází z úrovně nedostatku u jednotlivých druhů zboží, které tuto potřebu pokrývají.\n\nNedostatky jsou obvykle způsobeny nedostatečnou dostupností zboží na příslušném [Concept('concept_market','trhu')], ale mohou být také důsledkem nízkého [Concept('concept_market_access','přístupu na trh')] v daném státě." # todo: CHANGED (predtym: Pokud je nabídka $concept_good$ menší než [GetDefine('NEconomy', 'GOODS_SHORTAGE_PENALTY_THRESHOLD')|v%0] z jeho poptávk)
 concept_market: "Trh"
 concept_markets: "Trhy"
 concept_market_possessive: "Trhu"
 concept_market_desc: "Všechny [Concept('concept_state','státy')|l] ve stejném trhu spolu obchodují se [Concept('concept_good','zbožím')], pokud nejsou [Concept('concept_isolated_state','izolovány')]. Jak dobře jsou tyto státy vzájemně propojeny, se měří jejich [Concept('concept_market_access','přístupem na trh')]. $concept_markets$ mohou také obchodovat mezi sebou přes [Concept('concept_world_market','světový trh')|l].\n\nKaždá [Concept('concept_country','země')|l] buď ovládá svůj vlastní trh, nebo se účastní jiného prostřednictvím [Concept('concept_customs_union','celní unie')|l] nebo jako [Concept('concept_subject','závislé země')|l]." # todo: CHANGED (predtym: Všechny [Concept('concept_state', '$concept_states|q$')] ve stejném $concept_market$ spolu obchodují se [Concept('concep)
 concept_world_market: "Světový trh"
 concept_world_market_desc: "Světový trh slouží jako místo pro autonomní [Concept('concept_trade','obchod')|l]. Cena [Concept('concept_good','zboží')|l] je určována množstvím dovozu a vývozu. [Concept('concept_state','Státy')] potřebují [Concept('concept_market_access','přístup na trh')], aby mohly obchodovat přes svoji budovu [GetBuildingType('building_trade_center').GetName]. Země bez přístupu k moři mohou získat práva tranzitu od jiných zemí, aby si zajistily přístup na světový trh." # todo: CHANGED (predtym: $concept_world_market$ slouží jako místo pro autonomní [concept_trade]. Cena [Concept('concept_good', '$concept_goods|q$)
 concept_market_access: "Přístup na trh"
 concept_market_access_desc: "Míra propojení [Concept('concept_state','státu')] s ostatními částmi svého trhu. Začíná na 100 % a úměrně se snižuje, když je [Concept('concept_infrastructure_usage','využití infrastruktury')|l] vyšší než dostupná [Concept('concept_infrastructure','infrastruktura')|l]. Ovlivňuje počet [Concept('concept_sell_orders','prodejních')] a [Concept('concept_buy_orders','nákupních objednávek')] vyplývajících z [Concept('concept_good_production','výroby')] a [Concept('concept_good_consumption','spotřeby')], a také vliv [Concept('concept_market_price','tržní ceny')] na [Concept('concept_local_price','místní cenu')] [Concept('concept_good','zboží')|l]." # todo: CHANGED (predtym: Míra propojení [Concept('concept_state','státu')] s ostatními částmi svého $concept_market$. Začíná na 100 % a úměrně se)
 concept_world_market_access: "Přístup na světový trh"
 concept_world_market_access_desc: "$concept_world_market_access$ existuje, pokud má [Concept('concept_state','stát')|l] propojení na [Concept('concept_world_market','světový trh')|l] přes $concept_world_market_hub$. Jeho hodnota je ovlivněna $concept_state_possessive$ [concept_market_access], případnou [concept_blockade] jeho $concept_world_market_hub$ a vzdáleností k jeho $concept_world_market_hub$, pokud musí obchodovat přes jiné centrum než nejbližší." # todo: CHANGED (predtym: $concept_world_market_access$ existuje, pokud má [Concept('concept_state','stát')|l] propojení na [Concept('concept_worl)
 concept_world_market_hub: "Centrum světového trhu"
 concept_world_market_hubs: "Centra světového trhu"
 concept_world_market_hub_short: "Centrum"
 concept_world_market_hubs_short: "Centra"
 concept_world_market_hub_desc: "$concept_world_market_hub$ je místo, odkud se řídí [Concept('concept_trade','obchod')|l] přes [Concept('concept_world_market','světový trh')|l]. Nachází se v pobřežním [Concept('concept_state','státě')|l] své [Concept('concept_market_area','oblasti trhu')|l] a jeho umístění se může měnit v závislosti na úrovni budovy [GetBuildingType('building_port').GetName] a [Concept('concept_gdp','HDP')] státu.\n\nOblast trhu s pobřežím u různých moří může mít několik [Concept('concept_world_market_hub','center světového trhu')|l]. Každý stát obvykle obchoduje přes nejbližší centrum světového trhu. Pokud [Concept('concept_blockade','blokáda')|l] nebo uzavření [Concept('concept_strait','průlivu')|l] výrazně sníží jeho [Concept('concept_world_market_access','přístup na světový trh')|l], může přesměrovat obchod přes jiné centrum světového trhu, ale utrpí snížení přístupu v závislosti na vzdálenosti." # todo: CHANGED (predtym: $concept_world_market_hub$ je místo, odkud se řídí [Concept('concept_trade','obchod')|l] přes [Concept('concept_world_ma)
 concept_infrastructure: "Infrastruktura"
 concept_infrastructure_desc: "$concept_infrastructure$ je poskytována [Concept('concept_building','budovami')] jako [SelectLocalization(GetPlayer.IsValid,'concept_infrastructure_desc_added','Železnice')] a [SelectLocalization(GetPlayer.IsValid,'concept_infrastructure_desc_added_2','Přístav')]. Ovlivňuje, jak dobře je [Concept('concept_state','stát')|l] propojen s jeho [Concept('concept_market','trhem')], a jak rychle se [Concept('concept_battalion','prapory')|l] [Concept('concept_mobilize_battalion','mobilizují')]."
 concept_infrastructure_desc_added: "[GetBuildingType('building_railway').GetName]"
 concept_infrastructure_desc_added_2: "[GetBuildingType('building_port').GetName]"
 concept_infrastructure_usage: "Využití infrastruktury"
 concept_infrastructure_usage_desc: "[Concept('concept_building','Budovy')] využívají určité množství [Concept('concept_infrastructure','infrastruktury')] v závislosti na tom, jak technologicky vyspělé nebo náročné jsou. Celkové využití infrastruktury v [Concept('concept_state','státě')] se porovnává s infrastrukturou, aby se určil [Concept('concept_market_access','přístup na trh')|l] pro daný [Concept('concept_state','stát')|l]. $concept_infrastructure_usage$ také zvyšuje náklady na [Concept('concept_port_connection','přístavní spojení')|l]." # todo: CHANGED (predtym: [Concept('concept_building','$concept_buildings|q$')] využívají určité množství [concept_infrastructure] v závislosti na)
 concept_good: "Zboží"
 concept_goods: "Zboží"
 concept_good_possessive: "zboží"
 concept_goods_input: "Vstupní zboží"
 concept_goods_output: "Výstupní zboží"
 concept_good_desc: "$concept_goods$ je [Concept('concept_good_production','vyprodukováno')] v [Concept('concept_building','budovách')] a [Concept('concept_good_consumption','spotřebováno')|l] budovama a [Concept('concept_pop','populací')]. $concept_goods$ mají jak [Concept('concept_local_price','místní cenu')], tak [Concept('concept_market_price','tržní cenu')]." # todo: CHANGED (predtym: $concept_goods$ je [Concept('concept_good_production','$concept_good_produced|q$')] v [Concept('concept_building','$conc)
 concept_prestige_good: "Prestižní zboží"
 concept_prestige_good_short: "Prestiž"
 concept_prestige_goods: "Prestižní zboží"
 concept_prestige_good_desc: "[Concept('concept_good','Zboží')], které je považováno za prestižní a vyšší kvality. $concept_prestige_goods$ vyrábějí některé [Concept('concept_company','společnosti')|l] s dostatečnou [Concept('concept_prosperity','prosperitou')]. Být hlavním producentem prestižního zboží přináší významnou [Concept('concept_prestige','prestiž')|l].\n\nNavíc prestižní zboží poskytuje tyto výhody:\n$EFFECT_LIST_BULLET$ Zvýšenou [Concept('concept_good_consumption','spotřebu')] u [Concept('concept_pop','populací')|l] ve srovnání s ostatním zbožím\n$EFFECT_LIST_BULLET$ Zvýšenou [Concept('concept_trade_advantage','obchodní výhodu')] pro [Concept('concept_trade','vývozy')|l]\n$EFFECT_LIST_BULLET$ Zvýšenou [Concept('concept_throughput','efektivitu')] pro [Concept('concept_building','průmysly')|l], které je využívají jako vstupní zboží\n$EFFECT_LIST_BULLET$ Zvýšený [Concept('concept_offense','útok')|l] a [Concept('concept_defense','obrana')|l] u [Concept('concept_unit', 'jednotek')], které je spotřebovávají jako zásoby" # todo: CHANGED (predtym: [Concept('concept_good','Zboží')], které je považováno za prestižní a vyšší kvality. $concept_prestige_goods$ vyrábějí n)
 concept_government_good: "Vládní zboží"
 concept_government_goods: "Vládní zboží"
 concept_government_good_desc: "[Concept('concept_good','Zboží')] [Concept('concept_good_consumption','spotřebováno')] [Concept('concept_government_building','vládními budovama')], využívajíc prostředky z [Concept('concept_treasury','pokladny')]."
 concept_military_good: "Vojenské zboží"
 concept_military_goods: "Vojenské zboží"
 concept_military_good_desc: "[Concept('concept_good','Zboží')] [Concept('concept_good_consumption','Spotřebováno')|l] [Concept('concept_military_building','vojenskými budovami')] za pomocí prostředků ze [Concept('concept_treasury','státní pokladny')]."
 concept_state: "Stát"
 concept_states: "Státy"
 concept_state_or_states: "Stát(y)"
 concept_state_possessive: "Státu"
 concept_state_desc: "Geografická oblast kontrolovaná [Concept('concept_country','zemí')]. Zde [Concept('concept_pop','populace')|l] žijí a pracují v jednotlivých [Concept('concept_building','budovách')] daného státu. Pokud nejde o [Concept('concept_split_state','rozdělený stát')|l], jeho území je to samé jako [Concept('concept_state_region','státní oblast')|l]. Není-li to [Concept('concept_isolated_state','izolovaný')|l] stát, bude obchodovat s jakýmkoliv [Concept('concept_good','zboží')|l], které je lokálně [Concept('concept_good_consumption','spotřebováno')|l] a [Concept('concept_good_production','vyprodukováno')|l], s ostatními státy na stejném [Concept('concept_market','trhu')], přičemž rozsah obchodování závisí na jeho [Concept('concept_market_access','přístupu na trh')]." # todo: CHANGED (predtym: Geografická oblast kontrolovaná [Concept('concept_country','zemí')]. Zde [Concept('concept_pop','populace')|l] žijí a pr)
 concept_home_state: "Domácí stát"
 concept_home_state_desc: "[Concept('concept_character','$concept_character_possessive|q$')] $concept_home_state$ je [Concept('concept_state','stát')], ze kterého pochází. Obvykle, ale ne vždy, je součástí [Concept('concept_country','země')], ve kterém $concept_character$ žije. [Concept('concept_magnate','Magnát')] $concept_magnate_holding_desc$." # todo: CHANGED (predtym: [Concept('concept_character','$concept_character_possessive|q$')] $concept_home_state$ je [concept_state], ze kterého po)
 concept_pop: "Populace"
 concept_pops: "Populace"
 concept_pop_possessive: "Populace"
 concept_pops_possessive: "populací"
 concept_population: "Populace"
 concept_pop_desc: "Světová populace je organizována do Populací, skupin jednotlivců, kteří pracují v téže [Concept('concept_building','budově')] v určité [Concept('concept_profession','profesi')], a sdílejí stejnou [Concept('concept_culture','kulturu')] a [Concept('concept_religion','náboženství')|l]. Používají [Concept('concept_pop_income','příjem')|l], který vydělávají, na nákup [Concept('concept_good','zboží')|l] pro uspokojení svých [Concept('concept_pop_needs','potřeb')], které zasa určuje jejich [Concept('concept_wealth','bohatství')|l] a [Concept('concept_sol','životní standard')|l]. Mohou podporovat [Concept('concept_interest_group','zájmové skupiny')|l] a [Concept('concept_political_movement','politická hnutí')|l], nebo být [Concept('concept_politically_unaligned_aligned','politicky neangažováni')|l]. $concept_pop$ pozůstáva z [Concept('concept_working_adults','pracujících dospělých')] a ze [Concept('concept_dependents','závislých osob')]. Část z nich je [Concept('concept_literacy','gramotná')], a mohou být buďto [Concept('concept_loyalist','loajální')], nebo [Concept('concept_radical','radikální')]." # todo: CHANGED (predtym: Světová populace je organizována do $concept_pops$, skupin jednotlivců, kteří pracují v téže [Concept('concept_building')
 concept_profession: "Profese"
 concept_profession_jobs: "Práce"
 concept_professions: "Profese"
 concept_profession_desc: "$concept_profession$ [Concept('concept_pop','Populace')|l] určuje, kterou roli vykonávají ve své [Concept('concept_building','budově')], jak velkou [Concept('concept_building_wage','mzdu')] obdrží, a zda vní dostanou [Concept('concept_ownership_share','podíly na vlastnictví')|l]. Ovlivňuje také, kterou [Concept('concept_interest_group','zájmovou skupinu')] pravděpodobně podpoří, jak pravděpodobné je, že zůstanou [Concept('concept_politically_unaligned_aligned','politicky neangažováni')|l], a zda jsou považováni za [Concept('concept_lower_strata','nižší')], [Concept('concept_middle_strata','střední')], nebo [Concept('concept_upper_strata','vyšší třídu')]. Aby změnily profesi, populace musí mít příslušnou [Concept('concept_pop_qualifications','kvalifikaci')]." # todo: CHANGED (predtym: [Concept('concept_pop','$concept_pop_possessive|q$')] $concept_profession$ určuje, kterou roli vykonávají ve své [concep)
 concept_production_method: "Výrobní metoda"
 concept_production_methods: "Výrobní metody"
 concept_production_method_desc: "$concept_production_methods$ určují, jak [Concept('concept_building','budovy')|l] fungují. Ovlivňují\n\n- [Concept('concept_good_consumption','vstupní zboží')], které musí budova zakoupit pro svou funkci\n- [Concept('concept_good_production','výstupní zboží')] které budova vyrábí a prodává\n- Rozdělení [Concept('concept_profession','profesí')] mezi svou [Concept('concept_workforce','pracovní sílu')]\n\n$concept_production_methods$ mohou mít také další účinky, jako je generování [Concept('concept_modifier','modifikátorů')]. $concept_production_methods$ jsou organizovány do skupin, v nichž může být v aktivním stavu pouze jedna. Můžete přepínat, která výrobní metoda je aktivní v každé skupině, pokud splňujete požadavky na [Concept('concept_technology','technologie')|l] a [Concept('concept_law','zákon')|l]." # todo: CHANGED (predtym: $concept_production_methods$ určují, jak [Concept('concept_building','$concept_buildings|q$')] fungují. Ovlivňují\n\n- [)
 concept_nation_formation: "Vytvoření národa"
 concept_nation_formations: "Národní formace"
 concept_nation_formation_short_past: "Vytvořeno"
 concept_nation_formation_short_present: "Vytvořit"
 concept_nation_formation_desc: "Pokud [Concept('concept_country','země')|l] splňuje určité požadavky, jako je vlastnění půdy ve specifických [Concept('concept_state_region','státních oblastech')] a/nebo má určité [Concept('concept_technology','technologie')|l] z kategorie $SOCIETY$, může být schopna vytvořit novou zemi s vyšším [Concept('concept_country_tier','postavením')]. Možné [Concept('concept_countries','země')|l] jsou uvedeny na kartě #b $NATION_FORMATION$#! v panelu #b $CULTURE$#!." # todo: CHANGED (predtym: Pokud [Concept('concept_country','země')|l] splňuje určité požadavky, jako je vlastnění půdy ve specifických [Concept('c)
 concept_culture: "Kultura"
 concept_cultures: "Kultury"
 concept_culture_possessive: "Kultury"
 concept_cultural: "Kulturní"
 concept_culture_desc: "Všechny [Concept('concept_pop','populace')|l] mají kulturu, která se může změnit pouze prostřednictvím [Concept('concept_assimilation','asimilace')|l]. Jejich kultura určuje, které [Concept('concept_state_region','státní oblasti')|l] považují za své [Concept('concept_homeland','domoviny')|l] a ovlivňuje jejich [Concept('concept_acceptance_status','status přijetí')|l] v [Concept('concept_country','zemi')]." # todo: CHANGED (predtym: Všechny [Concept('concept_pop', '$concept_pops|q$')] mají $concept_culture$, která se může změnit pouze prostřednictvím )
 concept_accepted_culture: "Akceptována kultura"
 concept_accepted_cultures: "Akceptované kultury"
 concept_accepted_culture_short: "Akceptovaná"
 concept_accepted_culture_desc: "$concept_accepted_cultures$ v [Concept('concept_country','zemi')] pozůstává z její [Concept('concept_primary_cultures','primární kultury')] plus jakékoliv jiné [Concept('concept_culture','kultury')|l] považované za akceptované [Concept('concept_culture','kultury')|l] vzhledem k aktuálnímu [Concept('concept_law', 'zákonu')] pro [SelectLocalization(GetPlayer.IsValid, 'concept_accepted_culture_desc_added','Občanství')]. Obvykle dva nejvyšší stupně v [Concept('concept_acceptance','přijetí')|l] jsou považována za [Concept('concept_accepted_culture', 'akceptovanou kulturu')]." # todo: CHANGED (predtym: $concept_accepted_cultures$ v [Concept('concept_country','$concept_country_possessive|q$')] pozůstává z její [concept_pr)
 concept_accepted_culture_desc_added: " [GetLawType('law_national_supremacy').GetGroup.GetName]"
 concept_primary_cultures: "Primární kultury"
 concept_primary_culture: "Primární kultura"
 concept_primary_cultures_desc: "[Concept('concept_culture','Kultura')] nebo kultury, s nimiž je [Concept('concept_country','národný stát')|l] převážně spojenej. Pokud země  [Concept('concept_nation_formation','vytvoří jinou')] zemi, její primární kultura se může změnit, jinak zůstane stejná.[ConcatIfNeitherEmpty('\n\n', AddLocalizationIf(GetPlayer.IsValid,'concept_primary_cultures_ingame_added'))]" # todo: CHANGED (predtym: [Concept('concept_culture','Kultura')] nebo $concept_cultures$, s nimiž je [Concept('concept_country','$concept_country_)
 concept_primary_cultures_ingame_added: "$concept_primary_cultures$ v [GetPlayer.GetAltAdjective('L')] jsou [GetPlayer.GetPrimaryCulturesDesc]."
