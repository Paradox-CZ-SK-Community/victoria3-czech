 concept_power_bloc_leverage_disadvantage: "Páková nevýhoda"
 concept_power_bloc_leverage_disadvantage_short: "Nevýhoda"
 concept_power_bloc_leverage_advantage_desc: "Množství [Concept('concept_power_bloc_leverage','pákové výhody')], které má [Concept('concept_power_bloc','mocenský blok')|l] nad [Concept('concept_country','zemí')] ve srovnání s ostatními bloky. Pokud je hodnota #positive_value +kladná#!, tento mocenský blok má pákovou výhodu, což znamená, že má nejvíce pákové výhody ze všech bloků; pokud je #negative_value -záporná#!, tento mocenský blok má pákovou nevýhodu, což znamená, že některé jiné bloky mají v současnosti větší páku než on, nebo [Concept('concept_power_bloc_unclaimed_leverage','nenárokovaná páka')|l] tyhle země je vyšší.\n\nAby [Concept('concept_power_bloc_leader','lídr mocenského bloku')|l] mohl pozvat [Concept('concept_country','zemí')] do svého bloku, páková výhoda musí být kladná a dosáhnout potřebného prahu." # todo: CHANGED (predtym: Množství [Concept('concept_power_bloc_leverage','pákové výhody')], které má [Concept('concept_power_bloc','mocenský blok)
 concept_power_bloc_leverage_share: "Podíl páky"
 concept_power_bloc_leverage_share_desc: "$concept_power_bloc_leverage_share$ [Concept('concept_power_bloc','mocenských bloků')|l] na [Concept('concept_country','země')|l] je celková [Concept('concept_power_bloc_leverage','páka')|l], kterou [Concept('concept_power_bloc','mocenský blok')|l] může mít v jakémkoliv okamžiku na tuhle [Concept('concept_country','zemi')]. $concept_countries$ mají konečné množství [Concept('concept_power_bloc_leverage','páky')], kterou mohou [Concept('concept_power_bloc','mocenské bloky')|l] na ně projektovat. Tahle páka je rozdělena mezi všechny mocenské bloky s jakoukoliv [Concept('concept_power_bloc_leverage','pákou')] nad touhle zemí a vyústí ve společný podíl páky mocenských bloků. Avšak určité množství [Concept('concept_power_bloc_leverage','páky')] může být [Concept('concept_power_bloc_unclaimed_leverage','nenárokováno')|l] na základě vlastního #b Odpor k vlivu#! země." # todo: CHANGED (predtym: [concept_power_bloc_leverage_share] [Concept('concept_power_bloc','$concept_power_bloc_possessive|q$')] na [concept_coun)
 concept_power_struggle: "Mocenský boj"
 concept_power_struggles: "Boje o moc" # todo: NEW TRANSLATION
 concept_power_struggling: "Bojující o moc"
 concept_power_struggle_desc: "$concept_power_struggle$ je pokus [Concept('concept_power_bloc_member','člena mocenského bloku')] převzít vedení od současného [Concept('concept_power_bloc_leader','lídra')]. Spustí se automaticky, pokud má [Concept('concept_power_bloc_member','běžný člen mocenského bloku')|l] #v [Subtract_CFixedPoint(GetDefine('NPowerBlocs','POWER_STRUGGLE_PRESTIGE_THRESHOLD_START'), '(CFixedPoint)1')|0%]#! více [Concept('concept_prestige','prestiže')] než [Concept('concept_power_bloc_leader','lídr mocenského bloku')|l]. Pokud si udrží alespoň #v [Subtract_CFixedPoint(GetDefine('NPowerBlocs','POWER_STRUGGLE_PRESTIGE_THRESHOLD_FAIL'), '(CFixedPoint)1')|0%]#! více prestiže po dobu #v [GetDefine('NPowerBlocs','POWER_STRUGGLE_DURATION_SUCCESS_MONTHS')|0] měsíců#!, stane se novým [Concept('concept_power_bloc_leader','vůdcem')]." # todo: CHANGED (predtym: $concept_power_struggle$ je pokus [Concept('concept_power_bloc_member','člena mocenského bloku')] převzít vedení od souč)
 concept_autonomy: "Autonomie"
 concept_autonomous: "Autonomní"
 concept_autonomy_desc: "Každá [Concept('concept_subject','závislá země')|l] má svou vlastní úroveň autonomie. Tato úroveň určuje, jaký typ interakce bude mít se svým [Concept('concept_overlord', 'vládcem')].\n\n$concept_subject$ s vysokou mírou autonomie bude nezávislejší z pohledu diplomacie. Bude mít také nižší tribut pro svého [Concept('concept_overlord','vládce')|l]. Existuje riziko, že [Concept('concept_country','země')|l] s příliš vysokou autonomii se pokusí vyhlásit [Concept('concept_diplomatic_play', 'diplomatickou hru')] o #v $war_goal_independence_type_name$#!.\n$concept_subjects$ s nízkou autonomii budou závislejší na svých vládcech a budou jim platit vyšší tribut. $concept_subjects$ s nejnižší úrovní autonomie mohou být integrováni do svého vládce skrze [Concept('concept_diplomatic_play', 'diplomatickou hru')] #v $dp_annex_subject$#!."
 concept_economic_dependence: "Ekonomická závislost"
 concept_economic_dependence_desc: "$concept_economic_dependence$ je míra ekonomické závislosti mezi dvěma [Concept('concept_country','zeměmi')]. Hlavní vliv má počet [Concept('concept_building','budov')] vlastněných druhou zemí. Může jít o přímé vlastnictví ze strany země nebo o investory z [Concept('concept_pop','populace')|l].\n\nSpolečný trh zohledňuje rozdíly v [Concept('concept_gdp','HDP')] a dopad produkovaných [Concept('concept_good','zboží')|l] a vlastněných budov na populaci každé [Concept('concept_country','země')].\n\nPokud dvě země nejsou na společném trhu, ekonomickou závislost ovlivňuje [Concept('concept_trade','obchod')|l]. Dopad závisí na objem obchodu mezi oběma zeměmi a vlivu na tržní rovnováhu zboží." # todo: CHANGED (predtym: $concept_economic_dependence$ je míra ekonomické závislosti mezi dvěma [concept_countries]. Hlavní vliv má počet [Concep)
 concept_electoral_confidence: "Důvěra ve volby"
 concept_electoral_confidence_desc: "$concept_electoral_confidence$ měří, do jaké míry voliči v [Concept('concept_country','zemi')] věří, že [Concept('concept_election','volby')|l] jsou svobodné a spravedlivé. Manipulace voleb ve prospěch konkrétní [Concept('concept_party','strany')|l] sníží důvěru ve volby, zatímco nezasahování do jejich průběhu ji zvýší. Nízká důvěra ve volby ovlivní [Concept('concept_legitimacy','legitimitu')|l] a množství [Concept('concept_political_strength','politické síly')|l] získané z [Concept('concept_votes','hlasů')|l], přičemž rozsah efektu závisí na přijatém [Concept('concept_law','zákoně')|l] pro [GetLawGroup('lawgroup_distribution_of_power').GetName] a jeho [Concept('concept_amendment','dodatcích')|l]." # todo: CHANGED (predtym: $concept_electoral_confidence$ měří, do jaké míry voliči v [Concept('concept_country','zemi')] věří, že [concept_electio)
 concept_princely_state: "Knížecí stát"
 concept_princely_states: "Knížecí státy"
 concept_princely_state_desc: "$concept_princely_state$ je stát pod vládou místního indického panovníka podřízeného evropské koloniální mocnosti. Mají velmi rozdílný význam v rámci indického imperiálního systému, ale všichni obecně podléhají podobnému diplomatickému uspořádání."
 concept_crown_land: "Korunní země"
 concept_crown_lands: "Korunní země"
 concept_crown_land_desc: "$concept_crown_land$ je správní oblast dynastického impéria s různou mírou regionální autonomie."
 concept_georegion: "Geografický region"
 concept_georegions: "Geografické regiony"
 concept_georegion_desc: "A $concept_georegion$ je oblast, která odpovídá souboru [Concept('concept_strategic_region','strategických regionů')] a [Concept('concept_state_region','státní oblasti')]. $concept_georegions$ jsou neměnné, ale mohou se překrývat a v některých případech mohou být zároveň součástí většího $concept_georegion$." # todo: CONCEPT CASE
 concept_privy_purse: "Knížecí apanáž"
 concept_privy_purse_desc: "Knížecí apanáž je osobní příjem [Concept('concept_ruler','monarchy')]. V kontextu [GetGeographicRegion('geographic_region_india').GetName] představuje důchod vyplácený bývalému vládci [Concept('concept_princely_state','knížecího státu')], který byl #b připojen#! jinou [Concept('concept_country','zemí')] za použití [Concept('concept_journal_entry','záznamu')] #v Indická federace#! .\n\nModifikátor $modifier_privy_purse_payments$ bude přidán po připojení jakéhokoliv knížecího státu pomocí tohoto záznamu a bude aktualizován po každém dalším připojení. #b $modifier_privy_purse_payments$#! zvýší #b státní výdaje#! odpovídající #v 0,01 %#! [Concept('concept_gdp','HDP')] násobku počtu #b knížecích států#! připojených tímto záznamem." # todo: CHANGED (predtym: Knížecí apanáž je osobní příjem [Concept('concept_ruler','monarchy')]. V kontextu [concept_georegion_india] představuje )
 concept_fervor: "Horlivost"
 concept_fervor_desc: "$concept_fervor$ je měřítkem národního ducha [Concept('concept_culture','kultury')]. [Concept('concept_pop','Populace')] z $concept_culture$ s vysokým $concept_fervor$ budou [Concept('concept_assimilation','asimilovat')] pomaleji, po dobytí vytvoří více [Concept('concept_radical','radikálové')], zvýší [Concept('concept_liberty_desire','touha po svobodě')] a budou mít větší pravděpodobnost připojit se k [Concept('concept_cultural_movement','kulturnímu hnutí')].\n\n#title Následující podmínky #b zvýší#! $concept_fervor$:#! #indent_newline:3 \n• Být [Concept('concept_primary_cultures','primární kultura')] nezávislého [Concept('concept_country','země')] s #tooltippable;tooltip:[GetPlayer.GetTooltipTag],fervor_effects_from_citizenship_laws_tt platným#! [SelectLocalization(GetPlayer.IsValid,'CITIZENSHIP_LINK','lawgroup_citizenship')] [Concept('concept_law','zákonem')]\n• Počet [Concept('concept_casualties','ztráty')] této [Concept('concept_culture','kultury')] ve [Concept('concept_war','válce')]\n• Vysoká průměrná [Concept('concept_literacy','gramotnost')]\n• Počet [GetPopType('academics').GetName] $concept_pops$ z této $concept_culture$\n• $concept_pops$ této kultury žijící v $concept_countries$ s [GetTechnology('nationalism').GetName] nebo [GetTechnology('pan-nationalism').GetName] [Concept('concept_technology','technologiemi')]\n• Být $concept_primary_culture$ $concept_country$ s platnou [GetInstitutionType('institution_schools').GetName] [Concept('concept_institution','institucí')]\n• Ostatní $concept_culture$ osvobozené jako nezávislé $concept_countries$\n• Zažívání [Concept('concept_national_awakening','národní obrození')]#!\n\n#title Následující podmínky #b sníží#! $concept_fervor$:#! #indent_newline:3 \n• Být $concept_primary_culture$ $concept_country$ s [GetLawType('law_multicultural').GetName] $concept_law$\n• Vysoká průměrná [Concept('concept_acceptance','přijetí')]#!" # todo: CONCEPT CASE
 fervor_effects_from_citizenship_laws_tt: "#title Platné [Concept('concept_law','zákony')] zahrnují:#!\n• $law_ethnostate$ (#v +20#!)\n• $law_national_supremacy$ (#v +15#!)\n• $law_racial_segregation$ (#v +10#!)\n• $law_cultural_exclusion$ (#v +5#!)"
 concept_cultural_movement: "Kulturní hnutí"
 concept_cultural_movements: "Kulturní hnutí"
 concept_cultural_movement_desc: "$concept_cultural_movements$ jsou [Concept('concept_political_movement','politická hnutí')], které usilují o lepší život pro lidi určité [Concept('concept_culture','kultury')]. Pokud je tato kultura [Concept('concept_primary_cultures','primární kultura')] [Concept('concept_country','země')], hnutí bude prosazovat nacionalistickou agendu. V opačném případě bude hnutí usilovat o [Concept('concept_law','zákony')], které poskytnou jejich lidem větší [Concept('concept_acceptance','přijetí')], nebo se dokonce pokusí o [Concept('concept_secession','odtržení')].\n\nPokud [Concept('concept_activism','aktivismus hnutí')] $concept_cultural_movement$ překročí @activism_red! $RADICALISM_PROTESTING$ (#v [GetDefine('NPolitics', 'RADICALISM_PROTESTING_THRESHOLD')|%0]#!), začne vytvářet [Concept('concept_obstinance','neústupnost')] v $concept_states$ s $concept_political_movement_supporting$ $concept_pops$." # todo: CONCEPT CASE
 concept_religious_movement: "Náboženské hnutí"
 concept_religious_movements: "Náboženská hnutí"
 concept_religious_movement_desc: "$concept_religious_movements$ jsou [Concept('concept_political_movement','politická hnutí')], které usilují o lepší život pro lidi určité [Concept('concept_religion','náboženství')]. Pokud je tato $religion$ [Concept('concept_state_religion','státní náboženství')] [Concept('concept_country','země')], hnutí bude prosazovat tradicionalistickou agendu. V opačném případě bude hnutí usilovat o [Concept('concept_law','zákony')], které poskytnou jejich lidem větší [Concept('concept_acceptance','přijetí')], nebo se dokonce pokusí o [Concept('concept_secession','odtržení')].\n\nPokud [Concept('concept_activism','aktivismus hnutí')] $concept_religious_movement$ překročí @activism_red! $RADICALISM_PROTESTING$ (#v [GetDefine('NPolitics', 'RADICALISM_PROTESTING_THRESHOLD')|%0]#!), začne vytvářet [Concept('concept_obstinance','neústupnost')] v $concept_states$ s $concept_political_movement_supporting$ $concept_pops$."
 concept_dynastic_loyalty: "Dynastická loajalita"
 concept_dynastic_loyalty_desc: "$concept_dynastic_loyalty$ představuje podporu srbského obyvatelstva pro udržení vládnoucí dynastie na trůnu oproti jejich rivalům. Vládnoucí dynastie musí získat dostatečnou podporu, aby zabránila opozici vznést nárok. Nepodaří-li se to, ztratí trůn a dojde ke stagnaci národního rozvoje.\n\nNásledující podmínky #bold zvýší#! $concept_dynastic_loyalty$:\n• Vysoká [Concept('concept_ruler','vládce')] [Concept('concept_popularity','popularita')]\n• Nízká [Concept('concept_popularity','popularita')] soupeřících uchazečů\n• Vysoká [Concept('concept_legitimacy','legitimita')] \n• Vysoká [Concept('concept_sol','životní standard')]\n• Podíl [Concept('concept_loyalist','loajalisté')]\n• Ne-[Concept('concept_marginalized','marginalizována')] [Concept('concept_interest_group','zájmové skupiny')] [Concept('concept_in_opposition','v opozici')] nad 4 [Concept('concept_approval','spokojenosti')] podle [Concept('concept_clout','politického vlivu')] \n• Má schválený [GetLawType('law_censorship').GetName] nebo [GetLawType('law_outlawed_dissent').GetName]\n• Není [Concept('concept_subject','závislá země')]\n• Každá [Concept('concept_major_power','regionální mocnost')] nebo [Concept('concept_great_power','velmoc')] podporující naši nezávislost\n• Události nebo jiné volby\n\nNásledující podmínky #bold sníží#! $concept_dynastic_loyalty$:\n• Nízká [Concept('concept_ruler','vládce')] [Concept('concept_popularity','popularita')]\n• Vysoká [Concept('concept_popularity','popularita')] soupeřících uchazečů\n• Nízká [Concept('concept_legitimacy','legitimita')]\n• Nízká [Concept('concept_sol','životní standard')]\n• Podíl [Concept('concept_radical','radikálové')]\n• Ne-[Concept('concept_marginalized','marginalizována')] [Concept('concept_interest_group','zájmové skupiny')] [Concept('concept_in_opposition','v opozici')] pod -4 [Concept('concept_approval','spokojenosti')] podle [Concept('concept_clout','politického vlivu')] \n• Negativní [Concept('concept_authority','autorita')]\n• Negativní [Concept('concept_bureaucracy','byrokracie')]\n• Pozitivní [Concept('concept_relations','vztahy')] s [Concept('concept_overlord','vládcem')]\n• Události nebo jiné volby" # todo: CONCEPT CASE
 concept_brz_national_hero: "Národní hrdina" # todo: MOVED KEY
 concept_brz_national_hero_desc: "#bold Národní hrdina#! je generál, který vyhrál bitvu proti státu, jenž není brazilský, a byl oslavován jako hrdina v události '#bold Nový národní hrdina#!'." # todo: MOVED KEY
 concept_lands_of_anarchy_control: "Kontrola nad Zeměmi anarchie"
 concept_lands_of_anarchy_control_short: "Kontrola"
 concept_lands_of_anarchy_control_desc: "$concept_lands_of_anarchy_control_short$ představuje autoritu Machzenu nad odlehlými kmeny Maroka.\n\nPro každý okolní [Concept('concept_state','stát')|l] mimo [Concept('concept_capital_state','hlavní město')|l] existuje ukazatel. Vyšší hodnota naznačuje, že kmenoví obyvatelé více respektují a mají strach před rozhodnutími [Concept('concept_government','vlády')], což umožňuje úředníkům účinně vykonávat své úkoly. Počáteční záporný [Concept('concept_modifier','modifikátor')|l] každého státu se měsíčně upravuje na základě jeho aktuální hodnoty. Vyšší $concept_lands_of_anarchy_control_short$ vede k méně účinným sankcím, a naopak.\n\nRozvojem státních center, vytvářením více pracovních příležitostí a posilováním vazeb mezi městským a venkovským životem budou kmeny postupně ovlivněny a jejich izolace se sníží. Nakonec jejich vliv na příslušníky kmenů vyprchá.\n\nNedostatečná údržba Kontroly může přinést naši zkázu a zanechat dlouhotrvající důsledky v těchto státech." # todo: CONCEPT CASE
 concept_austrian_constitutional_pressure: "Ústavní tlak"
 concept_austrian_constitutional_pressure_short: "Tlak"
 concept_austrian_constitutional_pressure_desc: "$concept_austrian_constitutional_pressure$ představuje sílu a vliv opozice vůči neoabsolutistickému režimu a je spojen s vnímanou autoritou režimu.\n\nPokud $concept_austrian_constitutional_pressure$ dosáhne #v 100#!, neoabsolutistická vláda padne a bude muset být udělena ústava. \n\n#title Následující podmínky #r #b zvýší#!#! $concept_austrian_constitutional_pressure_short$:#! #indent_newline:3 \n• Mít na vás vynucený [Concept('concept_war_goal','válečný cíl')]\n• Vyhlášení [Concept('concept_bankruptcy','bankrot')]\n• Přijetí [Concept('concept_loans','půjčky')]\n• [Concept('concept_state','Státy')] s [Concept('concept_radical','radikály')]\n• [Concept('concept_interest_group','Zájmové skupiny')] oponující [GetLawType('law_autocracy').GetName]\n• [Concept('concept_activism','Aktivismus hnutí')] #tooltippable;tooltip:[GetPlayer.GetTooltipTag],liberal_movements_list_tt Liberálních#!, #tooltippable;tooltip:[GetPlayer.GetTooltipTag],socialist_movements_list_tt Socialistických#! a $movement_cultural_minority_short$ [Concept('concept_political_movement','politická hnutí')]\n• Deficit [Concept('concept_bureaucracy','byrokracie')]\n• Události a další podmínky #!\n\n#title Následující podmínky #g #b sníží#!#! $concept_austrian_constitutional_pressure_short$:#! #indent_newline:3 \n• Pozitivní rozpočtová bilance\n• Vynucení [Concept('concept_war_goal','válečného cíle')] na [Concept('concept_great_power','velmoc')]\n• [Concept('concept_state','Státy')] s [Concept('concept_loyalist','loajalisty')]\n• [Concept('concept_interest_group','Zájmové skupiny')] podporující [GetLawType('law_autocracy').GetName]\n• [Concept('concept_political_movement_support','Podpora politických hnutí')] $movement_royalist_absolutist_short$, $movement_religious_majority_short$ a $movement_cultural_majority_short$ [Concept('concept_political_movement','politická hnutí')]\n• Přebytek [Concept('concept_bureaucracy','byrokracie')]\n• Události a další podmínky #!" # todo: CONCEPT CASE
 concept_coup: "Puč"
 concept_coups: "Puče"
 concept_coup_desc: "$concept_coup$ je pokus [Concept('concept_commander','velitel')] s nízkou úrovní [Concept('concept_loyalty','loajality')] svrhnout stávající [Concept('concept_government','vláda')]. Riziko $concept_coup$ roste, když je [Concept('concept_country','země')] vládnuta $concept_government$ s nízkou [Concept('concept_legitimacy','legitimitou')], nebo pokud neloajální $concept_commander$ má vysoký [Concept('concept_commander_rank', 'Rank')] a [Concept('concept_popularity','popularita')].\n\nJakmile $concept_coup$ začne, pokud jeho postup dosáhne #v 100%#!, vydá velitel provádějící $concept_coup$ [Concept('concept_pronunciamento','pronunciamento')]. Úspěšné $concept_pronunciamento$ povede k sesazení $concept_government$.\n\nPostup puče je určen [Concept('concept_coup_strength','síla puče')] velitele provádějícího $concept_coup$, vyhodnocenou proti [Concept('concept_coup_resistance','odolnosti proti puči')] sedící vlády." # todo: CHANGED # todo: CONCEPT CASE
 concept_coup_strength: "Síla puče"
 concept_coup_strength_short: "Síla"
 concept_coup_strength_desc: "$concept_coup_strength$ představuje schopnost [Concept('concept_commander','velitel')] úspěšně spáchat $concept_coup$ proti stávající [Concept('concept_government','vládě')]. $concept_coup$ bude #b postupovat#!, když bude [Concept('concept_commander','velitel')]ova [Concept('concept_interest_group','zájmová skupina')]'se [Concept('concept_approval','spokojeností')] #b negativní#! a $concept_coup_strength$ velitele provádějícího $concept_coup$ bude vyšší než [Concept('concept_coup_resistance','odolnost proti puči')] sedící vlády.\n\nFaktory přispívající k $concept_coup_strength$ zahrnují:\n• Vysokou [Concept('concept_popularity','popularitu')]\n• Vysoký [Concept('concept_commander_rank','hodnost velitele')]\n• [Concept('concept_clout','Politický vliv')] zainteresované skupiny $concept_commander$\n• Blízkost [Concept('concept_commander','velitel')]'s [Concept('concept_military_formation','formacemi')] k [Concept('concept_capital_state','hlavnímu městu')]" # todo: CHANGED # todo: CONCEPT CASE
 concept_coup_resistance: "Odolnost proti puči"
 concept_coup_resistance_short: "Odolnost"
 concept_coup_resist: "Odolat"
 concept_coup_resistant: "Odolný"
 concept_coup_resistance_desc: "$concept_coup_resistance$ představuje schopnost [Concept('concept_government','vlády')] ustát [Concept('concept_coup','puč')|l] [Concept('concept_commander','velitele')]. $concept_coup$ se #b stáhne#! pokud je $concept_coup_resistance$ současné vlády vyšší než [Concept('concept_coup_strength','síla puče')|l] velitele provádějícího puč.\n\nFaktory přispívající k Odolnosti proti puči zahrnují:\n• Vysoká [Concept('concept_legitimacy','legitimita')|l] [Concept('concept_government','vlády')]\n• Úroveň investic do [GetInstitutionType('institution_home_affairs').GetName] v rámci [Concept('concept_law','zákonů')] [GetLawType('law_secret_police').GetName] nebo [GetLawType('law_national_guard').GetName]" # todo: CHANGED (predtym: $concept_coup_resistance$ představuje schopnost [concept_government] ustát [concept_coup] [concept_commander]. [concept_)
 concept_pronunciamento: "Pronunciamento"
 concept_pronunciamento_desc: "A $concept_pronunciamento$ je závěrečná fáze $concept_coup$, ve které [Concept('concept_commander','velitel')] prohlašuje nesouhlas se stávající [Concept('concept_government','vládou')] a svolává své síly, aby jej podpořily. Když nastane $concept_pronunciamento$, porovná se [Concept('concept_coup_resistance','odolnost proti puči')] sedící $concept_government$ s [Concept('concept_coup_strength','silou puče')] $concept_commander$ provádějícího $concept_coup$.\n\nPokud je $concept_coup_strength$ $concept_commander$ menší než $concept_coup_resistance$ $concept_government$, nebo pokud je $concept_coup$ vyvolán interakcí postav (Character Interaction), bude mít $concept_government$ šanci bránit se proti $concept_coup$. Šance vlády úspěšně se ubránit je určena poměrem [Concept('concept_coup_resistance','odolnosti proti puči')] k výše uvedeným faktorům.\n\nÚspěšné $concept_pronunciamento$ způsobí svržení $concept_government$. Neúspěšné $concept_pronunciamento$ povede ke zvýšení [Concept('concept_radical','radikalismu')] a negativním následkům pro pučistu $concept_commander$." # todo: CHANGED (predtym: A $concept_pronunciamento$ je závěrečná fáze $concept_coup$, ve které [Concept('concept_commander','velitel')] prohlašuj)
 concept_negotiation: "Vyjednávání"
 concept_negotiations: "Vyjednávání"
 concept_negotiating: "Vyjednávání"
 concept_negotiated: "Vyjednáno"
 concept_negotiate: "Vyjednávat"
 concept_negotiation_desc: "$concept_negotiate$ s [Concept('concept_interest_group','zájmovou skupinou')] během [Concept('concept_enactment_of_laws','schvalování')] za účelem přesvědčit je ke změně postoje k právě schvalovanému [Concept('concept_law','zákonu')]. Vůli $concept_interest_group_possessive$ k vyjednávání určuje jejich [Concept('concept_amenability','ochota')]. Čím vyšší ochotu mají, tím přátelštější a ochotnější budou vyjednávat.\n\n@indifferent! [Concept('concept_endorse_oppose', 'Lhostejná')] zájmová skupina musí být @in_government! [Concept('concept_in_government','ve vládě')|l], aby s nimi bylo možné vyjednávat, zatímco @disapproves! [Concept('concept_endorse_oppose','oponující')|l] zájmové skupiny můžou vyjednávat, i když jsou [Concept('concept_in_opposition','V opozici')|l].\n\nPřesvědčit $concept_interest_group$, aby přešlo ze stavu @disapproves! $concept_opposing$ na @indifferent! $concept_indifferent$ může být stejně účinné jako přesvědčit je, aby přešli z @indifferent! [Concept('concept_endorse_oppose', 'Lhostejná')] na @approves! [Concept('concept_endorse_oppose','podporující')]." # todo: CHANGED (predtym: $concept_negotiate$ s [concept_interest_group] během [Concept('concept_enactment_of_laws', '$concept_enactment_of_laws_e)
 concept_guerilla_war: "Partyzánská válka" # todo: MOVED KEY
 concept_guerilla_war_desc: "$concept_guerilla_war$ je zvláštní druh [Concept('concept_war','válka')], který podléhá souboru pravidel odlišných od běžného válčení. Jejich podrobnosti se mohou lišit od jedné $concept_guerilla_war$ k druhé.\n\nBěhem $concept_guerilla_war$ platí následující obecná pravidla:\n#indent_newline:2 $EFFECT_LIST_BULLET$ [Concept('concept_battle','bitvy')] jsou mnohem menší a vznikají pomaleji#! \n#indent_newline:2 $EFFECT_LIST_BULLET$ Mohou nastat [GetBattleCondition('battle_condition_guerilla_skirmish').GetName], [GetBattleCondition('battle_condition_guerilla_ambush').GetName] a [GetBattleCondition('battle_condition_guerilla_disarray').GetName] jako [Concept('concept_battle_condition','podmínky bitvy')]#!\n#indent_newline:2 $EFFECT_LIST_BULLET$ Vítězství neudělují skóre [Concept('concept_occupation','okupace')]#!\n#indent_newline:2 $EFFECT_LIST_BULLET$ $concept_guerilla_war$ může eskalovat v běžnou $concept_war$, pokud jsou splněny podmínky specifické pro daný konflikt" # todo: MOVED KEY
 concept_amenability: "Ochota"
 concept_amenability_desc: "Jak ochotná je [Concept('concept_interest_group','zájmová skupina')|l] [Concept('concept_negotiation','vyjednávat')|l] během [Concept('concept_enactment_of_laws','přijímání zákonů')|l], vyšší hodnota znamená větší ochotu.\n\n#b 0 - [GetDefine('NPolitics', 'MIN_AMENABILITY_TENSE_NEGOTIATION')]#!:     Bude #r odmítnout#! $concept_negotiate$\n#b [GetDefine('NPolitics', 'MIN_AMENABILITY_TENSE_NEGOTIATION')] - [GetDefine('NPolitics', 'MIN_AMENABILITY_NORMAL_NEGOTIATION')]#!:   #v #r $negotiation_tier_3$#!#!\n#b [GetDefine('NPolitics', 'MIN_AMENABILITY_NORMAL_NEGOTIATION')] - [GetDefine('NPolitics', 'MIN_AMENABILITY_FRIENDLY_NEGOTIATION')]#!:   #v $negotiation_tier_2$#!\n#b [GetDefine('NPolitics', 'MIN_AMENABILITY_FRIENDLY_NEGOTIATION')] - 100#!: #v #g $negotiation_tier_1$#!#!"
 concept_obstinance: "Neústupnost"
 concept_obstinate: "Neústupný"
 concept_obstinance_desc: "$concept_obstinance$ představuje [Concept('concept_pop','populace')], kteří podporují [Concept('concept_cultural_movement','kulturní hnutí')] nebo [Concept('concept_religious_movement','náboženské hnutí')] v rámci [Concept('concept_state','státu')] a pasivně odmítají spolupracovat s [Concept('concept_country','zemí')] [Concept('concept_institution','institucemi')]. $concept_obstinance$ je způsobeno tím, že [Concept('concept_activism','aktivismus hnutí')] příslušného [Concept('concept_political_movement','politického hnutí')] překročí @activism_red! $RADICALISM_PROTESTING$ (#v [GetDefine('NPolitics', 'RADICALISM_PROTESTING_THRESHOLD')|%0]#!). Množství $concept_obstinance$ je rovno podílu [Concept('concept_workforce','pracovní síly')] v $concept_state$, kteří jsou členy $concept_obstinate$ $concept_political_movement$.\n\nPřítomnost $concept_obstinance$ ve státě způsobuje řadu negativních lokálních efektů na $concept_state$, jako je snížená [Concept('concept_assimilation','asimilace')], [Concept('concept_taxes','$state_tax_collection_mult$')|l], [Concept('concept_conscription_center','odvod')] a dopad $concept_institution$." # todo: CONCEPT CASE
 concept_bavarocratic_ire: "Bavorokratický hněv"
 concept_bavarocratic_ire_short: "Hněv"
 concept_bavarocratic_ire_desc: "$concept_bavarocratic_ire_short$ představuje odpor řeckého obyvatelstva vůči vládě bavorské kliky v Řecku. Vysoké $concept_bavarocratic_ire_short$ může vést k sesazení krále Otty a jeho bavorských příznivců.\n\nNásledující podmínky #bold zvýší#! $concept_bavarocratic_ire_short$:\n• [GetCulture('south_german').GetName] [Concept('concept_commander','velitelé')] nebo [Concept('concept_character','postavy')] [Concept('concept_in_government','ve vládě')]\n• #bold Není#! [GetReligion('orthodox').GetName] [Concept('concept_ruler','vládce')]\n• [Concept('concept_ruler','Vládce')] #bold Nemá#! [Concept('concept_heir','dědice')]\n• [Concept('concept_ruler','Vládce')] je neženatý / nevdaná\n• #bold Nemá#! [Concept('concept_votes','volební právo')]\n• Méně než #v 10#! [Concept('concept_battalion','prapory')]\n• [Concept('concept_radical','Radikálové')] v držených [GetCulture('greek').GetName] [Concept('concept_homeland','domovinách')] [Concept('concept_state','státech')]\n• Nedávno #r prohraná#! [Concept('concept_war','válka')]\n• Volby v událostech nebo rozhodnutí\n\nNásledující podmínky #bold sníží#! $concept_bavarocratic_ire_short$:\n• Držené [GetCulture('greek').GetName] [Concept('concept_homeland','domovina')] [Concept('concept_state','státy')]\n• [Concept('concept_loyalist','Loajalisté')] v držených [GetCulture('greek').GetName] [Concept('concept_homeland','domovinách')] [Concept('concept_state','státech')]\n• Nedávno #g vyhraná#! [Concept('concept_war','válka')]\n• Alespoň jedna [GetBuildingType('building_university').GetName] v [GetCulture('greek').GetName] [Concept('concept_homeland','domovině')] [Concept('concept_state','státě')]\n• Více než #v 20#! [Concept('concept_battalion','prapory')]\n• Volby v událostech nebo rozhodnutí" # todo: CONCEPT CASE
 concept_disqualified_culture: "Diskvalifikovaná kultura"
 concept_disqualified_culture_short: "Diskvalifikovaná"
 concept_disqualified_culture_present: "Diskvalifikovat"
 concept_disqualified_culture_verb: "Diskvalifikuje"
 concept_disqualified_culture_present_verb: "Diskvalifikování"
 concept_disqualified_culture_desc: "[Concept('concept_culture','Kultura')] je $concept_disqualified_culture_short$ pro účely organizování #b $dyn_c_usga$#!, pokud jsou jeho požadavky odmítnuty. Obvykle k tomu dochází v důsledku [Concept('concept_integrated_culture','integrace')] jiné $concept_culture$, se kterou kultura, která má být $concept_disqualified_culture_short$, sdílí [Concept('concept_homeland','domovina')] [Concept('concept_state','státy')]. S $concept_disqualified_culture_short$ $concept_cultures$ nelze dále vyjednávat ani je za žádných okolností $concept_integrated_culture_short$."
 concept_integrated_culture: "Integrovaná kultura"
 concept_integrated_culture_short: "Integrována"
 concept_integrated_culture_present: "Integrovat"
 concept_integrated_culture_present_verb: "Integrace"
 concept_integrated_culture_verb: "Integruje"
 concept_integrated_culture_process: "Integrace"
 concept_integrated_culture_desc: "$concept_integrated_culture$ je [Concept('concept_culture','kultura')|l], jejíž požadavky byly uspokojivě vyřešeny během procesu organizování #b $dyn_c_usga$#!. Když se kultura stane integrovanou, stává se [Concept('concept_primary_cultures','primární kulturou')] a přispívá k postupu #b $je_danubian_federation$#! [Concept('concept_journal_entry','záznam v deníku')|l]. Integrované kultury se mohou stát [Concept('concept_disqualified_culture','diskvalifikované')] pokud budou jejich požadavky po jejich integraci popřeny. Diskvalifikovaná kultura, která již byla integrována, povede k tvrdým sankcím." # todo: CHANGED (predtym: $concept_integrated_culture$ je [concept_culture], jejíž požadavky byly uspokojivě vyřešeny během procesu organizování b)
 concept_radicalized_interest_group: "Radikalizovaná zájmová skupina"
 concept_radicalized_interest_group_desc: "Když je [Concept('concept_approval','spokojenost')|l] u [Concept('concept_interest_group','zájmové skupiny')] pod [GetApprovalRatingFromValue(GetDefine('NPolitics','APPROVAL_THRESHOLD_ANGRY'))], říká se, že je zradikalizovaná. Zradikalizovaná zájmová skupina má tendenci stát se [Concept('concept_insurrection','vzbouřeneckou')] nebo provést [Concept('concept_coup','puč')|l] proti současné [Concept('concept_government','vládě')]." # todo: CHANGED (predtym: Když je [Concept('concept_approval','spokojenost')|l] u [concept_interest_group] pod [GetApprovalRatingFromValue(GetDefi)
 concept_strait_access: "Přístup přes průliv"
 concept_strait_accesses: "Přístupy přes průliv"
 concept_strait_access_short: "Přístup"
 concept_strait_access_desc: "$concept_strait_access$ určuje, které [Concept('concept_ship','lodě')] mohou proplout [Concept('concept_strait','průliv')]. Lze jej změnit [Concept('concept_strait_control','správce průlivu')] na obou stranách $concept_strait$ nastavením omezení. [Concept('concept_country','Země')] si mohou také zajistit $concept_treaty$, aby měli zaručený $concept_strait_access$, když by jim byl normálně zakázán průjezd.\n\n#title $concept_strait$ může být:#!#indent_newline:3 \n#b Otevřený#! - Všechny $concept_ships$ mohou proplout\n#b Žádné vojenské#! - Pouze lodě @merchant_marine! #tooltippable_name #tooltip:[GetGoods('merchant_marine').GetTooltipTag],DATA_GOODS_NAME_TOOLTIP,GoodsTooltip [GetGoods('merchant_marine').GetCustom('GDS_G')|l]#!#! a [Concept('concept_supply_ship','zásobovací lodě')] mohou proplout\n#b Uzavřený#! - Žádné $concept_ships$ nemohou proplout, což může omezit přístup na [Concept('concept_world_market','světový trh')]#!\n\nKteré [Concept('concept_country','země')] jsou tímto omezením postiženy, je určeno [Concept('concept_strait_allowed_countries','povolené země')]. V případě, že oba $concept_states$ nastavily odlišné $concept_strait_accesses$, má přednost nejpřísnější omezení $concept_strait_access_short$." # todo: CHANGED (predtym: $concept_strait_access$ určuje, které [concept_ships] mohou proplout [concept_strait]. Lze jej změnit [Concept('concept_)
 concept_strait_allowed_countries: "Povolené země"
 concept_strait_allowed_countries_short: "Země"
 concept_strait_allowed_countries_desc: "Určuje, které [Concept('concept_country','země')] jsou ovlivněny omezeními [Concept('concept_strait_access','přístupu přes průliv')], pokud je nastaveno na #b Žádné vojenské#! nebo #b Uzavřený#!\n\n#title $concept_strait_allowed_countries$ může být nastaveno na:#!#indent_newline:3 \n#b Žádní nepřátelé#!#indent_newline:3 \nOmezení $concept_strait_access_short$ se týká pouze $concept_ships$ nepřátel [Concept('concept_strait_control','správce průlivu')]#!\n\n#b Pouze spojenci#!#indent_newline:3 \nPouze $concept_ships$ spojenců $concept_strait_controller$ jsou vyjmuty z omezení#!\n\n#b Pouze $concept_strait_controller_short$#!#indent_newline:3 \nPouze $concept_ships$ od $concept_strait_controller$ a jeho [Concept('concept_subject','závislé země')] jsou vyjmuty z omezení#!#!" # todo: CONCEPT CASE
 concept_strait_control: "Kontrola průlivu"
 concept_strait_control_short: "Kontrola"
 concept_strait_controller: "Správce průlivu"
 concept_strait_controller_short: "Správce"
 concept_strait_control_desc: "$concept_strait_control$ je určena kontrolou nad dvěma [Concept('concept_state','států')] na každé straně [Concept('concept_strait','průlivu')]. V každém případě se každé [Concept('concept_country','země')] s kontrolou jednoho z $concept_states$ stává $concept_strait_controller$, který může změnit [Concept('concept_strait_access','přístup přes průliv')] přes $concept_strait$, s výjimkou #b $strait_gibraltar$#!, který vyžaduje kontrolu obou $concept_states$, aby bylo možné nastavit [Concept('concept_strait_access','přístup přes průliv')] na #b Uzavřený#!.\n\nV případě, že oba $concept_states$ nastavily odlišné $concept_strait_accesses$, má přednost nejpřísnější omezení $concept_strait_access_short$." # todo: CONCEPT CASE
 concept_japanese_emperor: "Císař"
 concept_japanese_emperor_desc: "Císař, neboli Tennō, je tradičním vládcem #b Japan#! a zároveň hlavou #b Šintó#! [Concept('concept_religion','náboženství')]. Během období Tokugawa zůstal císař izolován v císařském paláci v Kjótu, přičemž jeho záležitosti byly přísně regulovány šógunátem."
 concept_raiding: "Nájezdy"
 concept_raiding_short: "Nájezdy"
 concept_raiding_desc: "Nájezdy jsou příjem získávaný v průběhu času krádežemi, pleněním a drancováním sousedních zemí. S malým množstvím orné půdy musí $MON$ spoléhat na $concept_raiding$ a [Concept('concept_russian_aid','ruská pomoc')], aby přežila. \n\nNáš příjem z nájezdů závisí na naší [Concept('concept_raiding_frequency','nájezdnický zápal')] vynásobené [Concept('concept_power_projection','projekcí síly')] naší armády. #g @money!+[GetPlayer.MakeScope.ScriptValue('max_raiding_income')]#! je nejvyšší částka, kterou můžeme z nájezdů získat." # todo: CONCEPT CASE
 concept_raiding_frequency: "Nájezdnický zápal"
 concept_raiding_frequency_short: "Nájezdnický zápal"
 concept_raiding_frequency_desc: "$concept_raiding_frequency$ představuje, jak často mají kmeny povoleno podnikat [Concept('concept_raiding', 'nájezdy')].\n\nKromě zvýšení našeho příjmu z [Concept('concept_raiding','nájezdů')] bude mít každé #v 1 %#! $concept_raiding_frequency$ také následující účinky:\n[GetStaticModifier('modifier_montenegrin_disobedience').GetDesc]" # todo: CONCEPT CASE
 concept_russian_aid: "Ruská pomoc"
 concept_russian_aid_short: "Ruská pomoc"
 concept_russian_aid_desc: "$concept_russian_aid$ je podpora, kterou #v $RUS$#! posílá našim kmenům jako souvěrcům pravoslavné církve. \n\nZákladní částka, kterou dostáváme, závisí na našich [Concept('concept_relations','vztazích')] s #v $RUS$#!: \n\n• #v Neutrální vztahy#! (nebo horší): @money!200 \n• #v Srdečné vztahy#! : @money!400 \n• #v Přívětivé vztahy#! : @money!700 \n• #v Přátelské vztahy#! : @money!1000" # todo: CONCEPT CASE
 concept_government_premium: "Vládní prémie" # todo: NEW TRANSLATION
 concept_government_premium_desc: "Úhrada za poskytované služby." # todo: NEW TRANSLATION
 concept_tsarpoints: "Carská vůle" # todo: NEW TRANSLATION
 concept_tsarpoints_desc: "@tsarpoints! $concept_tsarpoints$ měří míru autokratické moci #b ruského#! [Concept('concept_ruler','$RULER_TITLE_TSAR|q$')] nebo [Concept('concept_ruler','$RULER_TITLE_TSARINA|q$')] a sleduje ji [concept_journal_entry] #b $je_tsarpoints_master$#!.\n\n$concept_tsarpoints$ se získávají plněním agend [concept_ruler] a jeho [concept_favorite] nebo prostřednictvím určitých [Concept('concept_journal_entry','$concept_journal_entries|q$')] a zvláštních událostí. Jsou potřebné k vydávání [Concept('concept_ukaz','$concept_ukase|q$')]" # todo: NEW TRANSLATION
 concept_ukaz: "Ukaz" # todo: NEW TRANSLATION
 concept_ukase: "Ukazy" # todo: NEW TRANSLATION
 concept_ukaz_desc: "$concept_ukase$ jsou carské dekrety s mocnými účinky, které vydává [Concept('concept_ruler','$RULER_TITLE_TSAR|q$')] nebo [Concept('concept_ruler','$RULER_TITLE_TSARINA|q$')] prostřednictvím [concept_journal_entry] #b $je_tsarpoints_master$#! a jejichž přijetí stojí @tsarpoints! [concept_tsarpoints].\n\nZavedení [Concept('concept_election','$concept_election_voting_franchise|q$')] sníží účinnost $concept_ukase$." # todo: NEW TRANSLATION
 concept_notable: "Významná osobnost" # todo: NEW TRANSLATION
 concept_notables: "Významné osobnosti" # todo: NEW TRANSLATION
 concept_notable_desc: "[concept_character], který je [Concept('concept_prominence','$concept_prominent|q$')] veřejnou osobností. Nemusí se přímo podílet na aktuálních záležitostech státu, ale časem může nabýt na významu." # todo: NEW TRANSLATION
 concept_state_and_revolution_consolidation: "Konsolidace státu" # todo: NEW TRANSLATION
 concept_state_and_revolution_consolidation_short: "Konsolidace" # todo: NEW TRANSLATION
 concept_state_and_revolution_consolidated: "Konsolidovaný" # todo: NEW TRANSLATION
 concept_state_and_revolution_consolidation_desc: "$concept_state_and_revolution_consolidation$ vyjadřuje snahu země se zřízením $law_council_republic$ upevnit své postavení státu v mezinárodním kapitalistickém systému. Ostatní [Concept('concept_country','$concept_countries|q$')] bez zřízení $law_council_republic$ budou vysoce $concept_state_and_revolution_consolidated$ zemi se zřízením $law_council_republic$ považovat za menší hrozbu a budou ochotnější s ní jednat diplomaticky i obchodovat ([concept_trade]).\n\nOchota země se zřízením $law_council_republic$ usilovat o $concept_state_and_revolution_consolidation_short$ závisí na tom, jak její domácí političtí aktéři vnímají její #b ekonomickou#! a #b politickou#! situaci. Země se zřízením $law_council_republic$ v nejistém postavení bude obvykle dávat přednost $concept_state_and_revolution_consolidation$ před [concept_state_and_revolution_confrontation].\n\n#title Následující podmínky #b zvyšují#! $concept_state_and_revolution_consolidation$:#! #indent_newline:3 \n• Vysoký [concept_turmoil]\n• Nízký [concept_clout] $ig_trade_unions$\n• $ig_trade_unions$ je [concept_in_opposition]\n• Nejsou [Concept('concept_enactment_of_laws','$concept_enactment_of_laws_enacted|q$')] přijaty žádné varianty [Concept('concept_law','$concept_laws|q$')] označené jako #tooltippable #tooltip:[GetPlayer.GetTooltipTag],state_and_revolution_revolutionary_laws_list_tt revoluční#!#!\n• Vysoký počet [Concept('concept_pop','$concept_population|q$')] z nižších vrstev, jejichž [concept_expected_sol] je nízká\n• [Concept('concept_state','$concept_states|q$')] postižené [concept_famine]\n• Podíl [Concept('concept_pop','$concept_population|q$')] pracujících jako [GetPopType('peasants').GetName]\n• Nízké umístění v žebříčku [concept_gdp_per_capita]" # todo: NEW TRANSLATION
 concept_state_and_revolution_confrontation: "Revoluční konfrontace" # todo: NEW TRANSLATION
 concept_state_and_revolution_confrontation_short: "Konfrontace" # todo: NEW TRANSLATION
 concept_state_and_revolution_confrontational: "Konfrontační" # todo: NEW TRANSLATION
 concept_state_and_revolution_confrontation_desc: "$concept_state_and_revolution_confrontation$ vyjadřuje ochotu země se zřízením $law_council_republic$ okamžitě usilovat o dosažení cílů revolučního #v $movement_socialist$#!. Ostatní [Concept('concept_country','$concept_countries|q$')] bez zřízení $law_council_republic$ budou vysoce $concept_state_and_revolution_confrontational$ zemi se zřízením $law_council_republic$ považovat za hrozbu a uvalí na ni postihy v diplomacii i [concept_trade].\n\nOchota země se zřízením $law_council_republic$ zůstat $concept_state_and_revolution_confrontational$ závisí na tom, jak její domácí političtí aktéři vnímají její #b ekonomickou#! a #b politickou#! situaci. Země se zřízením $law_council_republic$ v nejistém postavení bude obvykle dávat přednost [concept_state_and_revolution_consolidation] před $concept_state_and_revolution_confrontation$.\n\n#title Následující podmínky #b zvyšují#! $concept_state_and_revolution_confrontation$:#! #indent_newline:3 \n• Vysoká [Concept('concept_political_movement_support','$concept_political_movement_support_short|q$')] pro [Concept('concept_political_movement','$concept_political_movement_short|q$')] #v $movement_socialist_short$#!, #v $movement_communist_short$#! nebo #v $movement_anarchist_short$#!\n• Jsou aktivní [Concept('concept_law','$concept_laws|q$')] označené jako #tooltippable #tooltip:[GetPlayer.GetTooltipTag],state_and_revolution_revolutionary_laws_list_tt revoluční#!#!\n• Vysoká průměrná hodnota [concept_sol]\n• Vysoký [concept_clout] $ig_trade_unions$ podporující [GetLawType('law_council_republic').GetName]\n• Vysoký počet [Concept('concept_loyalist','$concept_loyalists|q$')] z nižších vrstev\n• Vítězství #b revoluce#! v [concept_journal_entry] #v $je_reform_or_revolution$#!\n• Sousední [Concept('concept_country','$concept_countries|q$')] procházející [concept_revolution] #v $movement_socialist_short$#!, #v $movement_communist_short$#! nebo #v $movement_anarchist_short$#!\n• #tooltippable #tooltip:[GetPlayer.GetTooltipTag],state_and_revolution_liberation_wargoals_list_tt Vývoz revoluce#!#! prostřednictvím [concept_war]\n• Podíl světového [Concept('concept_gdp','$concept_gdp_short|q$')], který drží [Concept('concept_country','$concept_countries|q$')] se zákonem [GetLawType('law_council_republic').GetName] a se všemi [Concept('concept_law','$concept_laws|q$')] označenými jako #tooltippable #tooltip:[GetPlayer.GetTooltipTag],state_and_revolution_revolutionary_laws_list_tt revoluční#!#!" # todo: NEW TRANSLATION
