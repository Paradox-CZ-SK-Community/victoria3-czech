 concept_in_siberian_exile: "Ve vyhnanství" # todo: NEW TRANSLATION
 concept_siberian_exile_desc: "[concept_character] lze $concept_siberian_exiled$ pomocí akce postavy #b Vyhostit na Sibiř#!. $concept_character$ se stane [concept_agitator] a bude vyhoštěn na Sibiř.\n\n#title Postavy vyhoštěné na Sibiř jsou viditelné a lze je pozvat pouze pro [Concept('concept_country','$concept_countries|q$')], které splňují následující podmínky:#! #indent_newline:3 \n• [GetCulture('russian').GetName] je jednou z [Concept('concept_primary_cultures','$concept_primary_culture|q$')]\n• Vlastní [concept_state] v oblasti [GetGeographicRegion('geographic_region_russian_siberia').GetName]\n• #b Nemají#! přijatou žádnou variantu zákona [GetLawType('law_protected_speech').GetName] v rámci [Concept('concept_enactment_of_laws','$concept_enactment_of_laws_enacted|q$')]\n• #b Nemají#! přijatou žádnou variantu zákona [GetLawType('law_guaranteed_liberties').GetName] v rámci [Concept('concept_enactment_of_laws','$concept_enactment_of_laws_enacted|q$')]#!\n\n$concept_siberian_exiled$ $concept_character$ se po odpykání trestu vrátí z $concept_siberian_exile$." # todo: NEW TRANSLATION
 concept_message_settings_feed: "Výpis"
