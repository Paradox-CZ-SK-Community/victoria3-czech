 concept_balkan_culture_desc: "#title [Concept('concept_secession','Separatista')] [Concept('concept_political_movement','politická hnutí')] vedené následujícími [Concept('concept_culture','kulturami')] ovlivňují [Concept('concept_ottoman_integrity','rumelijská soudržnost')]:#! #indent_newline:3 \n• [GetCulture('albanian').GetName]\n• [GetCulture('bosniak').GetName]\n• [GetCulture('bulgarian').GetName]\n• [GetCulture('croat').GetName]\n• [GetCulture('greek').GetName]\n• [GetCulture('romanian').GetName]\n• [GetCulture('serb').GetName]" # todo: CONCEPT CASE
