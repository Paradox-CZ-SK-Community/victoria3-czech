 concept_monopoly_desc: "Monopol na [Concept('concept_building','budovu')] dává jeho vlastníkovi výhradní práva na daný [Concept('concept_building','průmysl')|l]. Může to být [Concept('concept_company_monopoly','monopol společnosti')|l] nebo [Concept('concept_country_monopoly','státní monopol')|l]." # todo: CHANGED (predtym: $concept_monopoly$ na [Concept('concept_building','budovu')] dává jejímu vlastníkovi výhradní práva na daný [Concept('co)
