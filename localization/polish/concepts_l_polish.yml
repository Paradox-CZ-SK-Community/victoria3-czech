 concept_export: "Vývoz"
 concept_exported: "Vyvezeno"
 concept_trade_desc: "$concept_trade$ je proces dovážení a vyvážení [Concept('concept_good','zboží')|l]. Většina obchodů probíhá autonomně prostřednictvím budovy [GetBuildingType('building_trade_center').GetName] přes [Concept('concept_world_market','světový trh')|l], ale [Concept('concept_country','země')|l] mohou také uzavírat [Concept('concept_treaty','smlouvy')|l] pro přímý obchod se zbožím mezi sebou. $concept_trade$ může být efektivní způsob, jak země mohou zlepšit svou ekonomickou situaci.\n" # todo: CHANGED (predtym: $concept_trade$ je proces $concept_importing$ a $concept_exporting$ [Concept('concept_good','$concept_goods|q$')]. Větši)
 concept_trade_revenue: "Obchodní příjmy"
 concept_trade_revenue_desc: "[Concept('concept_trade','Obchod')] generuje výnosy pro budovu [SelectLocalization(GetPlayer.IsValid,'concept_trade_revenue_desc_added','Obchodní centrum')], které ho spravuje, v závislosti na rozdílu [Concept('concept_market_price','tržní ceny')] a objemu obchodu. [Concept('concept_tariffs','Cla')] snižují generované obchodní příjmy."
 concept_trade_revenue_desc_added: "[GetBuildingType('building_trade_center').GetName]"
 concept_trade_privilege: "Obchodní privilegium"
 concept_trade_privileges: "Obchodní privilegia"
 concept_trade_privilege_desc: "Typ [Concept('concept_article','článku')] ve [Concept('concept_treaty','smlouvě')], který jeden [Concept('concept_market_owner','majitel trhu')|l] uděluje jinému. Ovlivňuje každou [Concept('concept_country','zemi')] v příjemcově [Concept('concept_market','trhu')] a zvyšuje jejich [Concept('concept_trade_advantage','obchodní výhodu')] podle toho, kolik obchodu probíhá s dárcovým trhem."
 concept_trade_advantage: "Obchodní výhoda"
 concept_relative_trade_advantage: "Relativní výhoda"
 concept_trade_advantage_short: "Výhoda"
 concept_trade_advantage_desc: "$concept_trade_advantage$ je hodnota určující [Concept('concept_import_price','dovozní')] a [Concept('concept_export_price','vývozní cenu')] pro konkrétní budovu [GetBuildingType('building_trade_center').GetName], a tím přímo ovlivňuje množství obchodovaného [Concept('concept_good','zboží')|l]. Ovlivňují ji faktory jako úroveň budovy [GetBuildingType('building_trade_center').GetName], podíl [Concept('concept_market_area','oblasti trhu')|l] na globální produkci zboží, [Concept('concept_interest','zájmy')|l] v relevantních [Concept('concept_strategic_region','strategických regionech')] a [Concept('concept_trade_privilege','obchodní privilegia')|l]. $concept_trade_advantage$ se počítá pro každé zboží a směr zvlášť, takže například obchodní výhoda pro dovoz uhlí a vývoz textilu se liší." # todo: CHANGED (predtym: $concept_trade_advantage$ je hodnota určující [Concept('concept_import_price','dovozní')] a [Concept('concept_export_pri)
 concept_trade_potential: "Obchodní potenciál"
 concept_trade_potential_desc: "$concept_trade_potential$ je hrubý odhad potenciálu pro [Concept('concept_trade','dovoz')|l] nebo [Concept('concept_trade','vývoz')|l] [Concept('concept_good','zboží')|l] v konkrétním [Concept('concept_state','státě')]. Zohledňuje faktory jako [Concept('concept_local_price','místní cena')|l], [Concept('concept_world_market_price','cena na světovém trhu')|l], [Concept('concept_trade_advantage','obchodní výhoda')|l], rozdíl mezi [Concept('concept_good_production','výrobou')] a [Concept('concept_good_consumption','spotřebou')], stejně jako [Concept('concept_tariffs','cla')|l] a [Concept('concept_subventions','subvence')|l].\n\n@information! $concept_trade_potential$ by neměl být #b považován#! za přesnou předpověď objemu obchodu, ale je užitečný pro určení, se kterým zbožím pravděpodobně bude stát obchodovat více, pokud má volnou obchodní kapacitu." # todo: CHANGED (predtym: $concept_trade_potential$ je hrubý odhad potenciálu pro [Concept('concept_trade','$concept_import|q$')] nebo [Concept('c)
 concept_trade_capacity: "Obchodní kapacita"
 concept_trade_capacity_usage: "Využití obchodní kapacity"
 concept_trade_capacity_desc: "$concept_trade_capacity$ je generována úrovněmi budovy [GetBuildingType('building_trade_center').GetName] a používá se k provádění [Concept('concept_trade','obchodu')] se [Concept('concept_world_market','světovým trhem')]. Množství [Concept('concept_good','zboží')|l] obchodovaných na jednotku obchodní kapacity se liší podle zboží." # todo: CHANGED (predtym: $concept_trade_capacity$ je generována úrovněmi budovy [GetBuildingType('building_trade_center').GetName] a používá se k)
 concept_market_area: "Oblast trhu"
 concept_market_areas: "Oblasti trhu"
 concept_market_area_possessive: "Oblasti trhu"
 concept_market_area_desc: "$concept_market_areas$ jsou části [Concept('concept_market','trhu')] propojené po souši nebo průlivem. [Concept('concept_state','Stát')] vede [Concept('concept_trade','obchod')|l] se [Concept('concept_world_market','světovým trhem')|l] prostřednictvím [Concept('concept_world_market_hub','centra světového trhu')|l]. Každá [Concept('concept_market_area','oblast trhu')|l] má alespoň jedno centrum světového trhu; velké [Concept('concept_market','trhy')|l] a trhy sousedící s různými moři jich mohou mít až #v [GetDefine('NEconomy','WORLD_MARKET_MAX_HUBS_PER_MARKET_AREA')]#!." # todo: CHANGED (predtym: $concept_market_areas$ jsou části [Concept('concept_market','trhu')] propojené po souši nebo průlivem. [Concept('concept)
 concept_traded_quantity: "Obchodované množství"
 concept_traded_quantity_desc: "Množství [Concept('concept_good','zboží')|l], které je [Concept('concept_trade','importováno')|l] nebo exportováno za každou použitou [Concept('concept_trade_capacity','obchodní kapacitu')]." # todo: CHANGED (predtym: Množství [Concept('concept_good','zboží')|l], které je [Concept('concept_trade','$concept_imported|q$')] nebo $concept_e)
 concept_tariffs: "Cla"
 concept_tariff: "Clo"
 concept_tariff_rate: "Sazba cla"
 concept_tariffs_desc: "$concept_tariffs$ jsou poplatek, který může [Concept('concept_country','země')|l] vybírat od budovy [GetBuildingType('building_trade_center').GetName] za každé [Concept('concept_trade','vyvezené')] nebo dovezené [Concept('concept_good','zboží')|l]. Proto činí obchodování s konkrétním zbožím méně atraktivním, například aby kritické vojenské zboží neopustilo zemi. Maximální úroveň cel určují [Concept('concept_law','zákony')|l] země. Úroveň cel pro všechny členy [Concept('concept_market','trhu')] určuje [Concept('concept_market_owner','majitel trhu')|l]." # todo: CHANGED (predtym: $concept_tariffs$ jsou poplatky, které může [Concept('concept_country','země')|l] vybírat od budovy [GetBuildingType('bu)
 concept_subventions: "Subvence"
 concept_subvention: "Subvence"
 concept_subvention_rate: "Sazba subvence"
 concept_subventions_desc: "$concept_subventions$ jsou finanční částky, které může [Concept('concept_country','země')|l] vyplácet budově [GetBuildingType('building_trade_center').GetName] za každé [Concept('concept_trade', 'importované')] nebo exportované [Concept('concept_good','zboží')|l]. Proto činí obchodování s daným zbožím atraktivnějším, což se hodí například ke oslabení konkurence. Maximální úroveň subvencí určují [Concept('concept_law','zákony')|l] [Concept('concept_country','země')|l]. Úroveň subvencí pro všechny členy [Concept('concept_market','trhu')] určuje [Concept('concept_market_owner','majitel trhu')|l]." # todo: CHANGED (predtym: $concept_subventions$ jsou finanční částky, které může [Concept('concept_country','$concept_country_possessive|q$')] vyp)
 concept_building_owners: "Vlastníci budov"
 concept_building_owning: "Vlastnictví budovy"
 concept_building_owners_desc: "Velikost [Concept('concept_building','budovy')] se dělí na [Concept('concept_building_level','úrovně budovy')|l]. Tyto úrovně mohou být buď [Concept('concept_privately_owned','soukromě vlastněné')] [Concept('concept_pop','populací')], nebo v [Concept('concept_nationally_owned','národním vlastnictví')] [Concept('concept_country','země')|l]. [Concept('concept_building_balance','Zisk')] ze budovy se dělí mezi jeho vlastníky jako [Concept('concept_dividends','dividendy')|l]." # todo: CHANGED (predtym: Velikost [Concept('concept_building','$concept_building_possessive|q$')] se dělí na [Concept('concept_building_level','$)
 concept_nationally_owned: "Národní vlastnictví"
 concept_nationally_owns: "Národně vlastní"
 concept_nationally_own: "Národně vlastněno"
 concept_nationally_owning: "Národně vlastnící"
 concept_nationally_owned_desc: "[Concept('concept_building_level','Úroveň budovy')], kterou vlastní [Concept('concept_government','vláda')|l] určité [Concept('concept_country','země')|l].\n\nÚrovně budov v národním vlastnictví vyplácí [Concept('concept_government_dividends','vládní dividendy')|l] vlastnící [Concept('concept_country','zemi')]. Zatímco úrovně v národním vlastnictví poskytují [Concept('concept_money','peníze')|l] přímo [Concept('concept_government','vládě')], stojí [Concept('concept_bureaucracy','byrokracii')] a mají snížené výhody z [Concept('concept_economy_of_scale','úspor z rozsahu')].\n\n$concept_building_levels$ postavené [Concept('concept_government_construction','vládní výstavbou')] se stávají národně vlastněné, a všechny [Concept('concept_government_building','vládní budovy')|l] jsou plně národně vlastněné.\n\n$concept_building$ může být [Concept('concept_nationalize','znárodněna')] k přeměně její úrovní na národně vlastněné, nebo se může stát [Concept('concept_privately_owned','soukromě vlastněnou')] prostřednictvím [Concept('concept_privatize','privatizace')|l]." # todo: CHANGED (predtym: [Concept('concept_building_level','Úroveň budovy')], kterou vlastní [Concept('concept_government','vláda')|l] určité [Co)
 concept_privately_owned: "Soukromě vlastněno"
 concept_privately_own: "Soukromé vlastnictví"
 concept_privately_owns: "Soukromě vlastněno"
 concept_privately_owned_desc: "[Concept('concept_building_level','Úroveň budovy')], kterou vlastní [Concept('concept_pop','populace')|l]. Tato populace je buď [Concept('concept_workforce','pracovní síla')|l] samotné [Concept('concept_building', 'budovy')], nebo [Concept('concept_workforce','pracovní síla')|l] $MANOR_HOUSES_GC_LINK$ a $FINANCIAL_DISTRICTS_GC_LINK$ (převážně $ARISTOCRATS_GC_LINK$ a $CAPITALISTS_GC_LINK$).\n\nSoukromně vlastněné úrovně budovy vyplácejí vlastníkům [Concept('concept_dividends','dividendy')|l].\n\n$concept_building_levels$ postavené prostřednictvím [Concept('concept_private_construction', 'soukromé výstavby')] se stávají soukromě vlastněnými.\n\nBudova může být [Concept('concept_nationalize', 'znárodněná')] k převodu její úrovní na [Concept('concept_nationally_owned','národní vlastnictví')|l], nebo se stát [Concept('concept_privately_owned','soukromě vlastněnou')] přes [Concept('concept_privatize','privatizaci')]." # todo: CHANGED (predtym: [Concept('concept_building_level','Úroveň budovy')], kterou vlastní [Concept('concept_pop','$concept_pops|q$')]. Tato po)
 concept_nationalize: "Znárodnit"
 concept_nationalized: "Znárodněné"
 concept_nationalization: "Znárodnění"
 concept_nationalizing: "Znárodňování"
 concept_national: "Národní"
 concept_nationalize_desc: "[Concept('concept_building','Budova')], která není plně [Concept('concept_nationally_owned','vlastněna státem')], může být znárodněná vlastníkem [Concept('concept_state','státu')], ve kterém se budova nachází.\n\n$concept_nationalizing$ [Concept('concept_privately_owned','soukromě vlastněných')] úrovní může [Concept('concept_radical','radikalizovat')] [Concept('concept_pop','populaci')] vlastnící budovu, zejména pokud nenabídnete [Concept('concept_money','peněžní')] kompenzaci.\n\nTaké může být znárodněna zahraniční investice, pokud v zemi původu již není povoleno dělat zahraniční investice.\n\nDostupnost a náklady na znárodnění závisí na vašich zákonech pro $ECONOMIC_SYSTEM_GC_LINK$." # todo: CHANGED (predtym: [Concept('concept_building','Budova')], která není plně [Concept('concept_nationally_owned','vlastněna státem')], může b)
 concept_privatize: "Privatizovat"
 concept_privatized: "Privatizováno"
 concept_privatization: "Privatizace"
 concept_privatizations: "Privatizace"
 concept_privatizing: "Privatizace"
 concept_private: "Soukromý"
 concept_privatize_desc: "[Concept('concept_building','Budova')], která je v [Concept('concept_nationally_owned','národním vlastnictví')|l], může být nabízena k prodeji, což umožňuje [Concept('concept_pop','populaci')] si ji zakoupit a udělat ji [Concept('concept_privately_owned','soukromě vlastněnou')] skrze [Concept('concept_investment_pool','investiční fond')|l]. Zda je privatizace dostupná, určuje váš $ECONOMIC_SYSTEM_GC_LINK$." # todo: CHANGED (predtym: [Concept('concept_building','Budova')], která je v [Concept('concept_nationally_owned','národním vlastnictví')|l], může )
 concept_monopoly: "Monopol"
