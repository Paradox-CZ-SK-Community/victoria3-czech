 concept_tradition_traits_short: "Tradice"
 concept_tradition_trait_desc: "$concept_tradition_trait_short$ [Concept('concept_discrimination_trait','diskriminační rysy')] jsou rituály, myšlenky a zvyky, které mohou [Concept('concept_culture','kultury')] držet nebo si je časem osvojit a které mohou být rozpoznatelné i přes velmi odlišné [Concept('concept_heritage_trait','původy')] nebo [Concept('concept_language_trait','jazyk')]. Na rozdíl od [Concept('concept_heritage_trait','rysu původu')] a [Concept('concept_language_trait','jazykového rysu')] $concept_tradition_traits_short$ nepatří do žádné [Concept('concept_discrimination_trait_group','skupiny rysů')]." # todo: CONCEPT CASE
 concept_religion: "Náboženství"
 concept_religions: "Náboženství"
 concept_religious: "Náboženské"
 concept_religion_desc: "Všechny [Concept('concept_pop','populace')|l] mají náboženství, které se dá změnit pouze pomocí [Concept('concept_conversion','konverze')|l]. Jejich náboženství ovlivňuje také jejich [Concept('concept_acceptance_status','status přijetí')|l] v jejich [Concept('concept_country','zemi')]." # todo: CHANGED (predtym: Všechny [Concept('concept_pop', '$concept_pops|q$')] mají $concept_religion$, které se dá změnit pouze pomocí [concept_c)
 concept_accepted_religion: "Přijaté náboženství"
 concept_accepted_religions: "Přijaté náboženství"
 concept_accepted_religion_short: "Přijaté"
 concept_accepted_religion_desc: "$concept_accepted_religion_short$ náboženství [Concept('concept_country','země')] zahrnuje jejich [Concept('concept_state_religion','státní náboženství')] plus jakákoli další [Concept('concept_religion','náboženství')|l] považovaná za $concept_accepted_religion_short$ vzhledem k aktuálnímu [Concept('concept_law', 'zákonu')] pro [SelectLocalization(GetPlayer.IsValid,'concept_accepted_religion_desc_added','Církev a stát')]." # todo: CHANGED (predtym: $concept_accepted_religions$ [Concept('concept_country','$concept_country_possessive|q$')] zahrnují její [concept_state_)
 concept_accepted_religion_desc_added: "[GetLawType('law_state_religion').GetGroup.GetName]"
 concept_state_religion: "Státní náboženství"
 concept_state_religions: "Státní náboženství"
 concept_state_religion_desc: "[Concept('concept_religion','Náboženství')] nejvíce spojované se [Concept('concept_country','zemí')]. Obvykle jde o převládající [Concept('concept_religion','náboženství')|l], ke kterému se hlásí většina její [Concept('concept_pop','populace')|l], ale někdy může být určeno zákonem nebo jednoduše odrážet preferenci [Concept('concept_ruler','vládce')|l]. Obvykle se nemění.[AddLocalizationIf(GetPlayer.IsValid, 'concept_state_religion_ingame_added')]" # todo: CHANGED (predtym: [Concept('concept_religion','Náboženství')] nejvíce spojované se [Concept('concept_country','zemí')]. Obvykle jde o přev)
 concept_state_religion_ingame_added: "\n\n$concept_state_religion$ pro [GetPlayer.GetName] je [GetPlayer.GetStateReligion.GetName]."
 concept_investment_pool: "Investiční fond"
 concept_investment_pool_desc: "[Concept('concept_reinvestment','Reinvestice')] od [Concept('concept_pop','populací')|l], která [Concept('concept_privately_owned','soukromě vlastní')] [Concept('concept_building','budovy')|l] je ukládáno do investičního fondu, kde ho populace využívá pro [Concept('concept_private_construction','soukromou výstavbu')] a nákup [Concept('concept_building_level','úrovní budov')] označených pro [Concept('concept_privatize','privatizaci')].\n\nObvykle investiční fond využívají $ARISTOCRATS_GC_LINK$ a $CAPITALISTS_GC_LINK$ v budovách $MANOR_HOUSES_GC_LINK$ a $FINANCIAL_DISTRICTS_GC_LINK$, ale v závislosti od toho, jaký je váš $ECONOMIC_SYSTEM_GC_LINK$, ho může využívat i [Concept('concept_workforce','pracovní síla')|l] pro rozšíření své vlastní budovy.\n\n$ECONOMIC_SYSTEM_GC_LINK$ v [Concept('concept_country','zemi')|l] určuje, které budovy mohou být stavěny pomocí investičního fondu.\n\nJak [Concept('concept_construction','výstavba')|l] takových budov probíhá, potřebné prostředky k jejich vybudování se odečítají z investičního fondu a ukládají se do [Concept('concept_treasury','státní pokladny')] jako [Concept('concept_budget_investment_income','převod investičního fondu')|l]." # todo: CHANGED (predtym: [Concept('concept_reinvestment','Reinvestice')] od [Concept('concept_pop','$concept_pops|q$')], která [concept_privately)
 concept_reinvestment: "Reinvestice"
 concept_reinvestment_desc: "Část [Concept('concept_dividends','dividend')] shromažďována jistými [Concept('concept_profession','profesemi')] je investováná zpátky do ekonomiky, přidávajíc [Concept('concept_money','peníze')|l] do [Concept('concept_investment_pool','investičního fondu')]. Přidané množství závisí na faktorech jako aktuální $ECONOMIC_SYSTEM_GC_LINK$ [Concept('concept_country','země')], stejně jako její [Concept('concept_gdp','hrubý domácí produkt')|l], s neefektivitou ve velkých ekonomikách, která vede k tomu, že část investic je promarněna." # todo: CHANGED (predtym: Část [Concept('concept_dividends','dividend')] shromážďována jistými [Concept('concept_profession','profesemi')] je inve)
 concept_pop_income: "Příjem populace"
 concept_pop_income_short: "Příjem"
 concept_pop_income_expenses: "Výdaje populace"
 concept_pop_income_expenses_short: "Výdaje"
 concept_pop_income_desc: "Na konci každého týdne [Concept('concept_pop','populace')|l] dostane příjem na základě velikosti jejich [Concept('concept_workforce','populace')|l] a aktuální [Concept('concept_building_wage','mzdě')], plus množství jejich [Concept('concept_dependents','závislých osob')] a množství [Concept('concept_dependent_income','příjmu závislých osob')], které vyberou. Tento příjem je vynakládán na [Concept('concept_pop_needs','potřeby populace')|l], což ovlivňuje [Concept('concept_wealth','bohatství')|l] [Concept('concept_pop','populace')|l]." # todo: CHANGED (predtym: Na konci každého týdne [Concept('concept_pop','$concept_pops|q$')] dostává $concept_pop_income_short$ na základě velikos)
 concept_dependent_income: "Dávky závislých osob"
 concept_dependent_income_desc: "Na konci každého týdne získává [Concept('concept_pop','populace')|l] tzv. $concept_dependent_income$ na základě počtu svých [Concept('concept_dependents','závislých osob')] a výše příjmů, na které mají nárok. Většina závislých osob získává základní příjem z příležitostných prací v závislosti na [Concept('concept_profession','profesi')], který lze doplnit pomocí [Concept('concept_institution','institucí')|l] [SelectLocalization(GetPlayer.IsValid,'concept_dependent_income_desc_added','Sociální zabezpečení')]." # todo: CHANGED (predtym: Na konci každého týdne [Concept('concept_pop','$concept_pops|q$')] získává [concept_dependent_income] na základě počtu s)
 concept_dependent_income_desc_added: "[GetInstitutionType('institution_social_security').GetName]"
 concept_wealth: "Bohatství"
 concept_wealthy: "Bohatí"
 concept_wealth_desc: "Měřící hodnota materiálních aktiv [Concept('concept_pop','populace')|l]. K udržení určité úrovně bohatství musí populace uspokojit řadu [Concept('concept_pop_needs','potřeb')] každý týden. Pokud jejich [Concept('concept_pop_income','příjem')|l] nepokryje náklady na tyto potřeby, jejich bohatství se nakonec sníží. Pokud mají po zakoupení potřebného zboží zbylé [Concept('concept_money','peníze')|l], jejich bohatství se brzy zvýší.\n\n$concept_wealth$ je hlavním faktorem, který přispívá k [Concept('concept_sol','životnému standardu')] populace a v souladu s určitými [Concept('concept_law','zákony')|l] může ovlivnit i další aspekty jejich života, jako [Concept('concept_literacy','gramotnost')|l] a [Concept('concept_votes','volební právo')|l]." # todo: CHANGED (predtym: Měřící hodnota materiálních aktiv [Concept('concept_pop','$concept_pop_possessive|q$')]. K udržení určité úrovně $concep)
 concept_innovation: "Inovace"
 concept_innovation_desc: "@innovation!$concept_innovation$ je produkována v budově [SelectLocalization(GetPlayer.IsValid,'concept_innovation_desc_added','Univerzita')] a přispívá k aktivnímu pokroku výzkumu [Concept('concept_technology','technologií')]. Nepřirazené @innovation! inovace zvýší [Concept('concept_technology_spread','šíření technologií')|l], pokud z nějakého aktuálně máte prospěch." # todo: CHANGED (predtym: @innovation!$concept_innovation$ je produkována v $concept_buildings$ budovy [SelectLocalization(GetPlayer.IsValid,'conc)
 concept_innovation_desc_added: "[GetBuildingType('building_university').GetName]"
 concept_technology_spread: "Šíření technologií"
 concept_technology_spread_desc: "Jedna [Concept('concept_technology','technologie')|l], kterou jste ještě nezískali z každé kategorie (#b $PRODUCTION_NO_CONCEPT$#!, #b $MILITARY$#! a #b $SOCIETY$#!), se k vám vždy šíří od [Concept('concept_country','zemí')], které je již získaly. Pokrok, který získáte při šíření technologii, je každý týden náhodně generován kolem základní hodnoty v závislosti na [Concept('concept_literacy','gramotnosti')] vaši země. Pokud žádná země ještě nevynalezla určitou technologii, tak se k vám nemůže šířit, proto je je pravděpodobnější, že díky šíření technologií získáte technologii z dřívějších [Concept('concept_technology_era','ér')] než pozdějších." # todo: CHANGED (predtym: Jedna [concept_technology], kterou jste ještě nezískali z každé kategorie ($PRODUCTION_NO_CONCEPT$, $MILITARY$ a $SOCIET)
 concept_technology_era: "Technologická éra"
 concept_technology_era_short: "Éra"
 concept_technology_eras_short: "Éry"
 concept_technology_era_ahead_of_time_penalty_desc: "Pokud ještě nemáte všechny technologie z předchozích ér, požadované množství se bude dále zvyšovat."
 concept_technology_era_desc: "$concept_technology_eras_short$ pro [Concept('concept_technology','technologie')|l] jsou hrubou klasifikací, ve které době byla nějaká myšlenka poprvé objevena nebo vyvinuta.\n\nVynálezy #b $concept_technology_eras_short$ I#! byly dobře známé v mnoha částech světa před rokem 1836.\nVynálezy #b $concept_technology_eras_short$ II#! jsou spojovány s první průmyslovou revolucí (1836 do poloviny 19. století).\n#b $concept_technology_era_short$ III#! je obdobím evoluce, stabilizace a standardizace, které trvá až do konce 19. století.\n#b $concept_technology_era_short$ IV#! odpovídá druhé průmyslové revoluci kolem přelomu století.\nVynálezy #b $concept_technology_eras_short$ V#! jsou transformativní, moderní myšlenky.\n\n$concept_technologies$ vyžadují více [Concept('concept_innovation','inovace')|l] pro jejich objevení v pozdějších érach. $concept_technology_era_ahead_of_time_penalty_desc$"
 concept_technology: "Technologie"
 concept_technologies: "Technologie"
 concept_technology_desc: "$concept_technology$ pokrývá veškeré inovace v oblastech #b $PRODUCTION_NO_CONCEPT$#!, #b $MILITARY$#!, a #b $SOCIETY$#!. $concept_technologies$ mají celonárodní účinky, které mohou sahat od změny provozních parametrů v [Concept('concept_country','zemi')|l] prostřednictvím [Concept('concept_modifier','modifikátorů')] až po odemykání nových [Concept('concept_production_method','výrobních metod')], [Concept('concept_building','budov')], [Concept('concept_law','zákonů')], [Concept('concept_decree','dekretů')] a [Concept('concept_diplomatic_pact','diplomatických paktů')].\n\nPokrok směrem k novým technologiím je dosažen prostřednictvím [Concept('concept_innovation','inovace')|l], která je primárně produkována budovou [SelectLocalization(GetPlayer.IsValid,'concept_technology_desc_added','Univerzitou')]. Kromě pokroku z inovací se mohou technologie šířit ze zemí, které je již mají, k těm, které je nemají, prostřednictvím [Concept('concept_technology_spread','šíření technologií')|l].\n\nMnožství pokroku pro technologie potřebného k její nabytí závisí na její [Concept('concept_technology_era','ére')]. $concept_technology_era_ahead_of_time_penalty_desc$" # todo: CHANGED (predtym: $concept_technology$ pokrývá veškeré inovace v oblastech $PRODUCTION_NO_CONCEPT$, $MILITARY$ a $SOCIETY$. $concept_techn)
 concept_technology_desc_added: " [GetBuildingType('building_university').GetName]"
 concept_canal: "Kanál"
 concept_canals: "Kanály"
 concept_canal_desc: "[Concept('concept_canal','Kanál')] je [Concept('concept_building','budova')|l], které rovněž zahrnuje stavbu umělého spojení mezi dvěma námořními uzly přes pevninskou plochu. $concept_canals$ mohou být navrženy pouze na určitých místech a obvykle vyžadují dokončení různých průzkumů nebo jiných expedic. $concept_canals$ mohou dramaticky zkrátit vzdálenost, jakou [GetGoods('merchant_marine').GetName|l] potřebuje na cestu při zakládání [Concept('concept_shipping_lane','námořních tras')|l], čímž je obchod s dalekými zeměmi levnější." # todo: CONCEPT CASE
 concept_monument: "Monument"
 concept_monuments: "Monumenty"
 concept_monument_desc: "[Concept('concept_building','Budovy')] unikátní pro určitý [Concept('concept_state','stát')|l], které můžou vykonávat různé funkce, často poskytující [Concept('concept_prestige','prestiž')|l]."
 concept_productivity: "Produktivita"
 concept_productivity_long: "Roční produktivita / zaměstnanec"
 concept_productive: "Produktivní"
 concept_unproductive: "Neproduktivní"
 concept_productivity_desc: "$concept_productivity$ je relativní míra, kolik ekonomické hodnoty generuje [Concept('concept_building','budova')|l] na zaměstnance za rok. Vypočítává se tak, že se vezmou aktuální týdenní [Concept('concept_revenue','příjmy')|l] generované z [Concept('concept_good_production','výroby')], odečtou se náklady vzniklé z [Concept('concept_good_consumption','spotřeby')], vydělí se celkovou [Concept('concept_workforce','pracovní sílou')] a vynásobí se 52 (týdnů / rok).\n\n( Příjmy - Materiálové náklady ) / Celkový počet zaměstnanců\n\nRozdíl mezi produktivitou a [Concept('concept_average_wage','průměrní roční mzdou')] je týdenní [Concept('concept_building_balance','bilance')|l] budovy, známá také jako zisk.\n\n$COMPANIES$ mají také hodnocení produktivity, které se rovná průměrné produktivitě všech jim přidružených úrovní budovy."
 concept_law_group: "Skupina zákonů"
 concept_law_groups: "Skupiny zákonů"
 concept_law_group_desc: "$concept_law_group$ obsahuje několik [Concept('concept_law','zákonů')], které ovlivňují aspekty [Concept('concept_country','země')|l] různými způsoby. Každá skupina zákonů může mít v daném okamžiku pouze jeden aktivní zákon." # todo: CHANGED (predtym: $concept_law_group$ obsahuje několik [Concept('concept_law', '$concept_laws|q$')], které ovlivňují aspekty [concept_coun)
 concept_government_reform: "Reforma vlády"
 concept_government_reform_short: "Reforma"
 concept_government_reform_desc: "Během reformy vlády můžete volně měnit složení vaší [Concept('concept_government','vlády')] tím, že přidáte nebo odeberete [Concept('concept_interest_group','zájmové skupiny')|l] a/nebo [Concept('concept_party','strany')|l] z/do vlády. $concept_interest_groups$ odstavené od moci během takové reformy získají [Concept('concept_radical','radikály')], pokud se reforma neprovádí krátce po ukončených volbách." # todo: CHANGED (predtym: Během $concept_government_reform$ můžete volně měnit složení vaší [concept_government] tím, že přidáte nebo odeberete [C)
 concept_election: "Volby"
 concept_elections: "Volby"
 concept_election_possessive: "Volebný"
 concept_election_voting_franchise: "Volební právo"
 concept_elect: "Volit"
 concept_elected: "Zvolen"
 concept_election_desc: "[Concept('concept_country','Země')] s volebním právem pořádají volby každých #v [GetDefine('NPolitics','ELECTION_INTERVAL_YEARS')|0] let#!. Před volebním dnem začíná volební kampaň, která trvá #v [GetDefine('NPolitics','CAMPAIGN_PERIOD_MONTHS')|0] měsíců#!. Během ní politické [Concept('concept_party','strany')|l] soupeří o [Concept('concept_momentum','momentum')|l] a [Concept('concept_votes','hlasy')].\n\nV den voleb se sečtou konečné hlasy, což ovlivní [Concept('concept_political_strength','politickou sílu')] [Concept('concept_interest_group','zájmových skupin')] v jednotlivých stranách. V některých typech [Concept('concept_government_type','vlády')] může být na základě výsledků voleb zvolena nová [Concept('concept_head_of_state','hlava státu')|l]. Nakonec může být provedena jedna [Concept('concept_government_reform','reforma vlády')|l], při které mohou být zájmové skupiny odstraněny z [Concept('concept_government_type','vlády')] bez vzniku nových [Concept('concept_radical','radikálů')]." # todo: CHANGED (predtym: [Concept('concept_country','$concept_countries|q$')] s $concept_election_voting_franchise$ pořádají $concept_elections$ )
 concept_budget_minting: "Ražba mincí"
 concept_budget_minted: "Vyraženo"
 concept_budget_minting_desc: "Forma příjmu, kterou generují všechny [Concept('concept_country','země')|l] tiskem nebo odléváním nových [Concept('concept_money', 'peněz')]. Čím větší je [Concept('concept_gdp','hrubý domácí produkt')|l] [Concept('concept_country','zemi')|l], tím více peněz může být vyražené bez poškození ekonomiky." # todo: CHANGED (predtym: Forma příjmu, kterou generují všechny [Concept('concept_country', '$concept_countries|q$')] tiskem nebo odléváním nových)
 concept_budget_poll_taxes: "Daně z hlavy"
 concept_budget_poll_tax: "Daň z hlavy"
 concept_budget_poll_taxes_desc: "Plošní [Concept('concept_taxes','daň')|l] vybíraná od každého [Concept('concept_working_adults', 'pracujícího dospělého')], na kterého se vztahuje. Protože $concept_budget_poll_taxes$ se neodvíjí od příjmu populace, má tendenci mít největší dopad na [Concept('concept_lower_strata','nižší třídu')]." # todo: CHANGED (predtym: Plošná [Concept('concept_taxes','$concept_tax|q$')] vybíraná od každého [Concept('concept_working_adults', '$concept_wor)
 concept_budget_land_taxes: "Pozemkové daně"
 concept_budget_land_taxes_desc: "Druh [Concept('concept_budget_poll_taxes', 'daní na hlavu')] vybíraný od [SelectLocalization(GetPlayer.IsValid,'concept_budget_land_taxes_desc_added','rolníků')] a [SelectLocalization(GetPlayer.IsValid,'concept_budget_land_taxes_desc_farmers','farmárů')] zaměstnaných v zemědělských [Concept('concept_building','budovách')]. $concept_pops$, kteří platí pozemkové daně, neplatí [Concept('concept_budget_per_capita_taxes','populační daně')|l]." # todo: CHANGED (predtym: Druh [Concept('concept_budget_poll_taxes', '$concept_budget_poll_tax|q$')] vybíraný od [SelectLocalization(GetPlayer.IsV)
 concept_budget_land_taxes_desc_added: "[GetPopType('peasants').GetName]"
 concept_budget_land_taxes_desc_farmers: "[GetPopType('farmers').GetName]"
 concept_budget_heathen_taxes: "Pohanské daně"
 concept_budget_heathen_taxes_desc: "Typ [Concept('concept_budget_poll_taxes','daň z hlavy')] vybíraného od všech [Concept('concept_pop','populací')] s nízkým [Concept('concept_acceptance','přijetím')] ve jejich [Concept('concept_country','země')]." # todo: CHANGED (predtym: Typ [Concept('concept_budget_poll_taxes','daň z hlavy')] vybíraný od všech [Concept('concept_pop', '$concept_pops|q$')] )
 concept_budget_per_capita_taxes: "Populační daně"
 concept_budget_per_capita_taxes_desc: "Typ [Concept('concept_budget_poll_taxes','daně z hlavy')|l] vybíraný od celé [Concept('concept_pop','populace')|l] kromě [SelectLocalization(GetPlayer.IsValid,'concept_budget_per_capita_taxes_desc_added','rolníků')]."
 concept_budget_per_capita_taxes_desc_added: "[GetPopType('peasants').GetName]"
 concept_budget_income_taxes: "Daně z příjmu"
 concept_budget_income_taxes_desc: "[Concept('concept_taxes','Daň')] vybíraná ze [Concept('concept_building_wage','mzdy')] vyplacené [Concept('concept_workforce','pracovní síle')]."
 concept_budget_investment_income: "Převod investičního fondu"
 concept_budget_investment_income_desc: "Když jsou [Concept('concept_money','peníze')|l] z [Concept('concept_treasury','pokladny')] použity na [Concept('concept_construction','výstavbu')] [Concept('concept_building','budov')], které aktuální $ECONOMIC_SYSTEM_GC_LINK$ umožňuje financovat z [Concept('concept_investment_pool','investičního fondu')] [Concept('concept_country','země')], je [Concept('concept_treasury','státní pokladna')|l] kompenzována odpovídajícím převodem prostředků z investičního fondu." # todo: CHANGED (predtym: Když jsou [Concept('concept_money','peníze')|l] z [Concept('concept_treasury','pokladny')] použity na [Concept('concept_)
 concept_budget_consumption_taxes: "Spotřební daně"
 concept_budget_consumption_tax: "Spotřební daň"
 concept_budget_consumption_tax_rate: "sazbu spotřební daně"
 concept_budget_consumption_taxes_desc: "Typ [Concept('concept_taxes','daně')] vybraný za [Concept('concept_good_consumption','spotřebované')] [Concept('concept_good','zboží')|l]. $concept_goods$ podléhající spotřební dani zvýší svou [Concept('concept_market_price','tržní cenu')] o $concept_budget_consumption_tax_rate$, a kdykoli jej [Concept('concept_pop','populace')|l] zakoupí, tohle zvýšení bude vybráno do [Concept('concept_treasury','pokladny')]. [Concept('concept_building','Budovy')] jsou osvobozeny od placení spotřební daně." # todo: CHANGED (predtym: Typ [Concept('concept_taxes','$concept_tax|q$')] vybraný za [Concept('concept_good_consumption','$concept_good_consumpti)
 concept_budget_dividends_taxes: "Daně z dividend"
 concept_budget_dividends_taxes_desc: "[Concept('concept_taxes','Daň')] aplikovaná na [Concept('concept_dividends','dividendy')|l] vydělané [Concept('concept_pop','populací')], která je [Concept('concept_privately_owned','soukromým vlastníkem')] [Concept('concept_building','budovy')|l]."
 concept_taxes: "Daně"
 concept_tax: "Daň"
 concept_taxing: "Zdanění"
 concept_taxation: "Zdanění"
 concept_tax_rate: "Sazba daně"
 concept_tax_level: "Úroveň zdanění"
 concept_tax_revenue: "Příjmy z daní"
 concept_taxes_desc: "[Concept('concept_country','Země')] mohou využívat svou tržní ekonomiku různými způsoby. Nejčastěji vybírají daně z příjmů soukromého sektoru populace nebo účtují poplatky z prodeje, nákupu či obchodu se [Concept('concept_good','zbožím')]."
 concept_unrealized_taxes: "Nevybrané daně"
 concept_unrealized_taxes_desc: "Nevybrané daně jsou část [Concept('concept_taxes','daní')], kterou [Concept('concept_country','země')|l] nedokázala vybrat z různých důvodů, včetně, ale nejen, nedostatečné [Concept('concept_tax_capacity','daňové kapacity')] a [Concept('concept_tax_waste','daňového plýtvaní')]." # todo: CONCEPT CASE
 concept_budget_additional_income: "Dodatečný příjem"
 concept_budget_additional_income_desc: "Příjem, který se nevejde do jiné kategorie, často získávaný z výsledků speciálních událostí."
 concept_budget_additional_expenses: "Dodatečné výdaje"
 concept_budget_additional_expenses_desc: "Výdaje, které se nevejdou do jiné kategorie, často vzniklé v důsledku zvláštních událostí."
 concept_budget_diplomatic_pacts: "Diplomatické pakty"
 concept_budget_diplomatic_pacts_desc: "[Concept('concept_money','Peníze')] vybrané od nebo odeslané druhé [Concept('concept_country','zemi')] v rámci [Concept('concept_diplomatic_pact','diplomatického paktu')]."
 concept_budget_treaties: "Dohody"
 concept_budget_treaties_desc: "[Concept('concept_money','Peníze')] vybírané od nebo odváděné jiné [Concept('concept_country','zemi')] v rámci [Concept('concept_treaty','smlouvy')]."
 concept_budget_power_bloc: "Rozpočet mocenského bloku"
 concept_budget_power_bloc_desc: "[Concept('concept_money','Peníze')] shromážděné od [Concept('concept_power_bloc_member','člena mocenského bloku')|l] nebo odeslané k [Concept('concept_power_bloc_leader','lídrovi mocenského bloku')|l]"
 concept_piracy: "Piráti"
 concept_pirated: "Obradeno piráty"
 concept_piracy_desc: "[Concept('concept_money','Peníze')] získané z aktivní redistribuce [Concept('concept_good','zboží')] na vysokých mořích prostřednictvím pirátství nebo privátnícher [Concept('concept_naval_mission','námořní mise')]."
 concept_construction: "Výstavba"
 concept_constructions: "Výstavby"
 concept_construct: "Postavit"
 concept_constructed: "Postaveno"
 concept_construction_desc: "@construction! $concept_construction$ je produkována budovou [SelectLocalization(GetPlayer.IsValid,'concept_construction_desc_added','Stavební sektor')] a používá se k výstavbě [Concept('concept_building', 'budov')]."
 concept_construction_desc_added: "[GetBuildingType('building_construction_sector').GetName]"
 concept_budget_construction_goods: "Stavební zboží"
 concept_budget_construction_goods_desc: "[Concept('concept_good','Zboží')] [Concept('concept_good_consumption','Spotřebováno')|l] [Concept('concept_building','budovou')] [SelectLocalization(GetPlayer.IsValid,'concept_budget_construction_goods_desc_added','Stavební sektor')] za účelem [Concept('concept_construction','výstavby')] nových budov." # todo: CHANGED (predtym: [Concept('concept_good','$concept_goods|q$')] [Concept('concept_good_consumption','$concept_good_consumed|q$')] [SelectL)
 concept_budget_construction_goods_desc_added: "[GetBuildingType('building_construction_sector').GetName]"
 concept_budget_government_wages: "Vládní mzdy"
 concept_budget_government_wages_desc: "[Concept('concept_building_wage','Mzdy')] vyplácené [Concept('concept_pop','populaci')] pracující ve [Concept('concept_government_building','vládních budovách')]. Sazba závisí na [Concept('concept_normal_wage','normální mzdě')] v [Concept('concept_country','zemi')]. Můžete ji zvýšit anebo snížit v panelu $BUDGET_PANEL_TITLE$."
 concept_budget_wages: "Mzdy"
 concept_budget_wage: "Mzda"
 concept_budget_wages_desc: "[Concept('concept_pop','Populace')] zaměstnaná v [Concept('concept_country', 'zemi')] ve [Concept('concept_government_building','vládních budovách')] a [Concept('concept_military_building','vojenských budovách')] dostávají mzdu z [Concept('concept_treasury','pokladny')] každý týden, na základě odpovídající [Concept('concept_government_wage','vládní mzdě')] a [Concept('concept_military_wage','vojenské mzdě')]." # todo: CHANGED (predtym: [Concept('concept_pop','$concept_pops|q$')] zaměstnaná v [Concept('concept_country', '$concept_country_possessive|q$')] )
 concept_budget_goods_for_government_buildings: "$concept_goods$ pro vládní budovy"
 concept_budget_goods_for_government_buildings_desc: "[Concept('concept_good','Zboží')] [Concept('concept_good_consumption','spotřebováno')] vládou [Concept('concept_country','země')|l] pro [Concept('concept_government_building','vládní budovy')|l]." # todo: CONCEPT CASE
 concept_budget_government_slaves: "Vládní otroci"
 concept_budget_government_slaves_desc: "Udržovací náklady [Concept('concept_slavery','otroků')] pracujících přímo pro vládu [Concept('concept_country','země')|l]." # todo: CONCEPT CASE
 concept_budget_military_wages: "Vojenské mzdy"
 concept_budget_military_wages_desc: "[Concept('concept_building_wage','Mzdy')] vyplácené [Concept('concept_pop','populaci')] [Concept('concept_military_building','vojenských budov')]. Sazba závisí na [Concept('concept_normal_wage','standardní mzdě')|l] v [Concept('concept_country','zemi')] . Můžete ji zvýšit a snížit v panelu $BUDGET_PANEL_TITLE$." # todo: CONCEPT CASE
 concept_budget_goods_for_military_upkeep: "$concept_goods$ pro vojenské provozní náklady"
 concept_budget_goods_for_military_upkeep_desc: "[Concept('concept_good','Zboží')] [Concept('concept_good_consumption','spotřebováno')] spotřebované [Concept('concept_military_building','vojenské budovy')] a údržbou [Concept('concept_ship','lodí')]." # todo: CONCEPT CASE
 concept_slavery: "Otroctví"
 concept_slaves: "Otroci"
 concept_enslaved: "Otroci"
 concept_slavery_desc: "Praktika, při které je jedné osobě legálně dovoleno vlastnit jinou. [SelectLocalization(GetPlayer.IsValid,'concept_slavery_desc_added', 'Otroci')] budou nahrázet jiné [Concept('concept_pop','populace')|l] v různých typech [Concept('concept_building','budov')] na základě [Concept('concept_law','zákonů')] v [Concept('concept_country','zemi')]. Zákony také určují, jak se existující populace stávají zotročenými a jak jsou otroci vyrváni a přepraveni do dané země." # todo: CHANGED (predtym: Praktika, při které je jedné osobě legálně dovoleno vlastnit jinou. [SelectLocalization(GetPlayer.IsValid,'concept_slave)
 concept_slavery_desc_added: "[GetPopType('slaves').GetName]"
 concept_budget_military_slaves: "Vojenští otroci"
 concept_budget_military_slaves_desc: "Náklady na udržování [Concept('concept_slavery','otroků')] sloužících v armádě [Concept('concept_country','země')|l]." # todo: CONCEPT CASE
 concept_good_production: "Výroba"
 concept_good_produced: "Vyprodukováno"
 concept_good_produce: "Produkce"
 concept_good_produces: "Produkuje"
 concept_output_goods: "Výstupní zboží"
 concept_good_production_desc: "Množství [Concept('concept_good','zboží')|l] vyprodukovaného [Concept('concept_building','budovami')] k projedi za [Concept('concept_revenue','příjem')]."
 concept_good_consumption: "Spotřeba"
 concept_good_consumed: "Spotřebováno"
 concept_good_consumes: "Spotřebuje"
 concept_input_goods: "Vstupní zboží"
 concept_good_consumption_desc: "Množství [Concept('concept_good','zboží')|l], které spotřebovává [Concept('concept_building','budova')|l] nebo [Concept('concept_pop','populace')|l] v procesu udržení její [Concept('concept_throughput','efektivity')] resp. [Concept('concept_wealth','Bohatství')|l]."
 concept_subsidies: "Dotace"
 concept_subsidize: "Dotovat"
 concept_subsidized: "Dotováno"
 concept_subsidizing: "Dotování"
 concept_subsidies_desc: "[Concept('concept_building','Budova')], která je $concept_subsidized$, má od [Concept('concept_government','vlády')|l] [Concept('concept_country','země')|l] zaručeno financování, aby vždy mohla vyplácet alespoň [Concept('concept_subsidized_wage','dotovanou mzdu')|l]. Pokud budova není schopna platit zaměstnancům tuto mzdu (nebo vyšší), případně pokud její náklady na nákup [Concept('concept_good_consumption','$concept_input_goods|q$')] převyšují [Concept('concept_revenue','příjmy')|l] z prodeje [Concept('concept_good_production','$concept_output_goods|q$')], rozdíl pokryje [Concept('concept_treasury','státní pokladna')|l]. Budova tak může zaměstnat tolik lidí, kolik chce, aby maximalizovala [Concept('concept_throughput','výkonnost')|l], bez ohledu na to, zda je to finančně udržitelné." # todo: CHANGED (predtym: $concept_subsidized$ [concept_building] má zaručeno, že jej [concept_government] [Concept('concept_country','$concept_co)
 concept_budget_interest: "Úrok"
 concept_budget_interest_rate: "Úroková sazba"
 concept_budget_interest_rates: "Úrokové sazby"
 concept_budget_interest_desc: "$concept_budget_interest$, který platí [Concept('concept_country','země')|l] ze svých [Concept('concept_loans','půjček')]. Je vypočítáván vynásobením [Concept('concept_principal','jistiny')] roční [Concept('concept_budget_interest_rate','úrokovou sazbou')].\n\n$concept_budget_interest$ je vyplácen [Concept('concept_pop','populaci')] jejichž [Concept('concept_privately_owned','soukromé')] [Concept('concept_cash_reserves','hotovostní rezervy')|l] jsou základem pro půjčky. [Concept('concept_nationally_owned','Národně vlastněné')] budovy místo toho generují méně [Concept('concept_government_dividends','vládních dividendů')].\n\n$concept_budget_interest_rate$ závisí především na [Concept('concept_technology','technologii')]." # todo: CHANGED (predtym: $concept_budget_interest$, který platí [concept_country] ze svých [concept_loans]. Je vypočítáván vynásobením [concept_p)
 concept_country_tier: "Postavení země"
 concept_country_tier_short: "Postavení"
 concept_country_tier_possessive: "Postavení země"
 concept_country_tier_desc: "$concept_country_tier_short$ země je přirozený status a [Concept('concept_prestige','prestiž')|l], která jí náleží na základě její historie a významu. Vytvoření nové země je možné pouze tehdy, pokud má vyšší úroveň postavení než ta, kterou má aktuální země." # todo: CHANGED (predtym: $concept_country_tier_short$ [Concept('concept_country','$concept_country$')] je přirozený status a [concept_prestige], )
 concept_claim: "Nárok"
 concept_claims: "Nároky"
 concept_claimed: "Nárokovaný"
 concept_claim_desc: "Teritoriální nárok, který má [Concept('concept_country','země')|l] na [Concept('concept_state_region','státní oblast')|l], obvykle proto, že ji předtím vlastnila. Nárok umožňuje využití [Concept('concept_war_goal','válečného cíle')] #v $war_goal_return_state_type_name$#!, který nevytváří tolik [Concept('concept_infamy','infamie')] jako [Concept('concept_war_goal','válečný cíl')|l] #v $war_goal_conquer_state_type_name$#!.\n\nDobytí [Concept('concept_incorporated_state','začleněného státu')] přidělí předchozímu vlastníkovi nárok na $concept_state_region$." # todo: CHANGED (predtym: Teritoriální nárok, který má [Concept('concept_country','země')|l] na [Concept('concept_state_region','státní oblast')|l)
 concept_devastation: "Devastace"
 concept_pollution_impact: "Dopad znečištění"
 concept_pollution_impact_desc: "$concept_pollution_impact$ na [Concept('concept_state_region','státní oblast')|l] ukazuje, jak závažné jsou účinky celkového [Concept('concept_generated_pollution','vyprodukovaného zněčištění')] budov v této oblasti. Čím více [Concept('concept_arable_land','orní půdy')] má region, tím nižší je dopad [Concept('concept_generated_pollution','vyprodukovaného zněčištění')].\n\nVysoce znečištěný region státu bude také ovlivňovat sousední státy, i když v nižší intenzitě. Pokud sousední stát má již vyšší dopad zněčištění kvůli svým budovám nebo jiným sousedním státům, efekt bude mít pouze ten nejvyšší dopad zněčištění.\n\nÚčinky dopadu zněčištění mohou vzrůst až do:\n[GetStaticModifier('state_region_pollution_general').GetDesc]\n[GetStaticModifier('state_region_pollution_health').GetDesc]#!"
 concept_generated_pollution: "Vyprodukované znečištění"
 concept_generated_pollution_desc: "$concept_generated_pollution$ je celkové množství znečištění, které budovy ve [Concept('concept_state_region','státě')] vyprodukují. Jak velký [Concept('concept_pollution_impact','dopad znečištění')|l] má na stát je také závislé na množství [Concept('concept_arable_land','orní půdy')] v tomhle státě.\n\nStáty s velkým množstvím orní půdy způsobí menší zvýšení vyprodukovaného znečištění a dopadu znečištění než stát s málem orní půdy."
 concept_devastated: "Zdevastováno"
 concept_devastation_desc: "$concept_devastation$ je poškození způsobené [concept_state_region] v důsledku války nebo přírodních katastrof. Zvyšuje se v důsledku [Concept('concept_battle','$concept_battles|q$')] vedených v dané oblasti, přičemž více, čím více obětí si vyžádají. Postupem času klesá, jakmile se tam nějakou dobu neodehrála žádná $concept_battle$. Pod nepřátelskou [concept_occupation] klesá pomaleji.\n\n$concept_devastation$ má negativní dopad na [concept_infrastructure], [Concept('concept_pop_growth','$concept_pop_growth_mortality|q$')], [concept_throughput] a [concept_migration_pull]." # todo: CHANGED (predtym: $concept_devastation$ je poškození způsobené v [Concept('concept_state_region','státě')] v důsledku války nebo přírodníc)
 concept_command_limit: "Velitelský limit"
 concept_command_limit_desc: "$concept_command_limit$ určuje, kolik [Concept('concept_battalion','praporů')] nebo [Concept('concept_ship','lodí')] může být efektivně [Concept('concept_organization','organizováno')] ve [Concept('concept_military_formation','formaci')]. $concept_command_limit$ můžete zvýšit najímáním dalších [Concept('concept_commander','velitelů')] nebo jejich povyšováním na vyšší [Concept('concept_commander_rank','hodnost')].\n\n#indent_newline:3 Mít více [Concept('concept_unit','vojenských jednotek')] ve formaci než je její velitelský limit snižuje maximální organizaci, kterou [Concept('concept_military_formation','formace')|l] může dosáhnout, a navíc způsobuje následující účinky:\n[GetStaticModifier('low_command_limit').GetDesc]#!" # todo: CHANGED (predtym: $concept_command_limit$ určuje, kolik [Concept('concept_battalion', '$concept_battalions|q$')] nebo [Concept('concept_sh)
 concept_command: "Velení"
 concept_commanded: "Pod velením"
 concept_pop_qualifications: "Kvalifikace"
 concept_qualifying: "Kvalifikace"
 concept_qualified: "Kvalifikovaný"
 concept_qualify: "Kvalifikovat"
 concept_pop_qualifications_desc: "[Concept('concept_pop','Populace')] získávají kvalifikaci nezbytnou pro přechod na jinou [Concept('concept_profession','profesi')] v průběhu času. Pokud jejich aktuální atributy odpovídají atributům profese, nebo pokud v současnosti pracují v příbuzném oboru, získají kvalifikaci dříve. [Concept('concept_literacy','Gramotnost')], [Concept('concept_wealth','bohatství')|l] a [Concept('concept_acceptance_status','status přijetí')|l] jsou běžné rozhodovací faktory." # todo: CHANGED (predtym: [Concept('concept_pop','$concept_pops|q$')] postupem času získávají $concept_pop_qualifications$ nezbytnou pro přechod n)
 concept_hq: "HQ"
 concept_hqs: "Velitelství"
 concept_hq_possessive: "HQ"
 concept_hq_long: "Velitelství"
 concept_hq_desc: "HQ ($concept_hq_long$) je území vlastněné [Concept('concept_country','zemí')] v určitém [Concept('concept_strategic_region','strategickém regionu')]. Všechny [Concept('concept_military_formation','formace')|l] mají domovské $concept_hq$ a mohou být umístěny v jiných velitelstvích." # todo: CHANGED (predtym: $concept_hq$ ($concept_hq_long$) je území vlastněné [concept_country] v určitém [concept_strategic_region]. Všechny [Con)
 concept_tax_waste: "Daňové plýtvání"
 concept_tax_waste_desc: "Množství [Concept('concept_taxes','daně')], které jsou vybírány, ale ztraceny kvůli neefektivitě nebo korupci před tím, než se dostanou do státní pokladny. To je často způsobeno nedostatkem [Concept('concept_bureaucracy','byrokracie')]." # todo: CONCEPT CASE
 concept_tax_capacity: "Daňová kapacita"
 concept_tax_capacity_desc: "Každý bod daňové kapacity ve [Concept('concept_state','státě')] umožňuje efektivní zdanění [GetDefine('NPops','INDIVIDUALS_TAXED_PER_TAX_CAPACITY')|vK] [Concept('concept_pop','populace')|l]. Pokud populace [Concept('concept_state','státu')] přesáhne svou daňovou kapacitu, efektivita všech forem zdanění se sníží. Daňová kapacita může být zvýšena výzkumem určitých technologii z kategorie $SOCIETY$ nebo výstavbou [Concept('concept_building','budovy')] [SelectLocalization(GetPlayer.IsValid, 'concept_tax_capacity_desc_added','Vláda Administrativa')] ve státě." # todo: CHANGED (predtym: Každý bod daňové kapacity ve [Concept('concept_state','státě')] umožňuje efektivní zdanění [GetDefine('NPops','INDIVIDUA)
 concept_tax_capacity_desc_added: "[GetBuildingType('building_government_administration').GetName]"
 concept_assimilation: "Asimilace"
 concept_assimilating: "Asimilování"
 concept_assimilate: "Asimilovat"
 concept_assimilation_desc: "Cizí [Concept('concept_pop','populace')], jejichž [Concept('concept_culture','kultura')|l] má v [Concept('concept_country','zemi')], kde žije, dostatečně vysoké [Concept('concept_acceptance','přijetí')|l], a které nežijí v žádné ze svých [Concept('concept_homeland','domovin')], se mohou asimilovat do více přijetých kultur. Populace, které obsahují [Concept('concept_radical', 'radikály')], se budou asimilovat pomaleji, a asimilace je mnohem pomalejší v [Concept('concept_unincorporated_state','nezačleněných státech')]." # todo: CHANGED (predtym: Cizí [Concept('concept_pop','$concept_pops|q$')], jejichž [concept_culture] má v [concept_country], kde žijí, dostatečně)
 concept_conversion: "Konverze"
 concept_converting: "Konverze"
 concept_convert: "Konvertovat"
 concept_conversion_desc: "[Concept('concept_pop','Populace')], jejichž [Concept('concept_religion','náboženství')|l] má nízkou úroveň [Concept('concept_acceptance','přijetí')|l] v [Concept('concept_country','zemi')], ve které žijí, se mohou rozhodnou konvertovat na jinou s vyšší úrovní [Concept('concept_acceptance','přijetí')|l]. $concept_pops$ s [Concept('concept_radical', 'radikály')] se konvertují zpomaleným tempem a konverze je mnohem pomalejší v [Concept('concept_unincorporated_state','nezačleněných státech')]." # todo: CHANGED (predtym: [Concept('concept_pop','$concept_pops|q$')], jejichž [concept_religion] má nízkou [concept_acceptance] v [concept_countr)
 concept_life_experience: "Životní zkušenost"
 concept_life_experience_desc: "[Concept('concept_character','Postavy')] získávají časem a skrze speciální události tzv. životní zkušenosti. $concept_life_experience$ ovlivňuje možnost získání nových [Concept('concept_character_trait','charakterových rysů')]." # todo: CHANGED (predtym: [Concept('concept_character', '$concept_characters|q$')] získávají $concept_life_experience$ časem a skrze speciální udá)
 concept_supply_network: "Zásobovací síť"
 concept_supply_network_short: "Síť" # todo: NEW TRANSLATION
 concept_supply_networks: "Zásobovací sítě"
 concept_supply_networks_short: "Sítě" # todo: NEW TRANSLATION
 concept_supply_network_desc: "Každá námořní [Concept('concept_country','země')|l] potřebuje na [Concept('concept_market','trhu')] [GetGoods('merchant_marine').GetName|l], aby zajistila přepravní potřeby svých [Concept('concept_shipping_lane','námořních tras')]. Celková síla vaší zásobovací sítě je určena porovnáním nabídky [GetGoods('merchant_marine').GetCustom('GDS_G_TT')] s celkovou poptávkou napříč všemi vašimi námořními trasemi. Tato síla představuje základní [Concept('concept_shipping_lane_effectiveness','efektivita')|l] všech vašich námořních tras." # todo: CHANGED (predtym: Každá námořní [concept_country] potřebuje na [concept_market] [GetGoods('merchant_marine').GetName], aby zajistila přepr)
 concept_ship: "Loď"
 concept_ships: "Lodě"
 concept_military_ship: "Vojenská loď"
 concept_military_ships: "Vojenské lodě"
 concept_ship_possessive: "Lodní"
 concept_ship_desc: "$concept_ship$ se staví v loděnici pomocí [Concept('concept_ship_construction','stavby lodí')]. Jsou organizovány podle svého [Concept('concept_ship_type','typu lodi')] v [Concept('concept_ship_group','skupinách lodí')]. $concept_ships$ se používají k budování [Concept('concept_interest','zájmů')] po celém světě a k provádění různých [Concept('concept_naval_mission','námořních misí')] v $concept_fleet$." # todo: CONCEPT CASE
 concept_ship_group: "Skupina lodí"
 concept_ship_groups: "Skupiny lodí"
 concept_ship_group_desc: "Existují tři $concept_ship_groups$, které se skládají z [Concept('concept_ship_type','typu lodi')] plnících podobnou roli. Skupiny jsou: $ship_group_capital_ships$, $ship_group_cruisers$ a $ship_group_torpedo_craft$." # todo: CONCEPT CASE
 concept_ship_type: "Typ lodi"
 concept_ship_types: "Typy lodí"
 concept_ship_type_short: "Typ"
 concept_ship_types_short: "Typy"
 concept_ship_type_desc: "Každá [Concept('concept_ship','loď')] má $concept_ship_type$, který má určité atributy a funkce, jež ji činí vhodnější nebo méně vhodnou pro určité [Concept('concept_naval_mission','námořní mise')]."
 concept_ship_template: "Šablona lodi"
 concept_ship_templates: "Šablony lodí"
 concept_ship_template_short: "Šablona"
 concept_ship_templates_short: "Šablony"
 concept_ship_template_desc: "[Concept('concept_ship_template','Šablona lodi')] určuje strategické nastavení pro [Concept('concept_ship','lodě')] určitého [Concept('concept_ship_type','typ lodi')]. [Concept('concept_ship_modification','Úpravy lodí')] upravují a určují, jaké hodnoty $ship$ nakonec bude mít."
 concept_base_template: "Základní šablona"
 concept_base_templates: "Základní šablony"
 concept_base_template_desc: "Původní návrh [Concept('concept_ship_type','typ lodi')]. $concept_base_template$ se odemyká s $concept_ship_type$ a bude vždy dostupná."
 concept_sailor: "Námořník"
 concept_sailors: "Námořníci"
 concept_sailor_desc: "[GetPopType('soldiers').GetName] a [SelectLocalization(GetPlayer.IsValid,'concept_ship_crew_desc_added','Officers')], kteří tvoří [concept_ship_crew] [concept_ship].\n\nStavba nebo rozšíření [GetBuildingType('building_naval_administration').GetName] [Concept('concept_building', '$concept_buildings|q$')] zvyšuje dostupný počet $concept_sailors$. Nečinní $concept_sailors$ jsou stále placeni, takže přebytečná kapacita představuje [concept_government_expenses]." # todo: CHANGED (predtym: Typ [GetPopType('soldiers').GetName], kteří tvoří $concept_ship_crew$ [Concept('concept_ship','lodě')].)
 concept_ship_construction: "Stavba lodí"
 concept_ship_construction_short: "Stavba"
 concept_ship_construct: "Stavět"
 concept_ship_constructed: "Postavená" # todo: NEW TRANSLATION
 concept_ship_construction_desc: "@ship_construction! $concept_ship_construction$ se vyrábí v [GetBuildingType('building_shipyard').GetName] a slouží ke stavbě a opravám lodí."
 concept_ship_construction_capacity: "Kapacita stavby lodí"
 concept_ship_construction_capacity_short: "Kapacita stavby"
 concept_ship_construction_capacity_desc: "Maximální množství @ship_construction! [Concept('concept_ship_construction','stavba lodí')], které lze týdně aplikovat na jednu loď."
 concept_ship_construction_queue: "Fronta stavby lodí"
 concept_ship_construction_queue_short: "Fronta"
 concept_ship_construction_queue_desc: "Jakékoli [Concept('concept_ship','lodě')] nastavené ke stavbě, které momentálně nepoužívají žádné @ship_construction! [Concept('concept_ship_construction','stavba lodí')], jsou umístěny do $concept_ship_construction_queue_short$. Když se uvolní nějaké @ship_construction! $concept_ship_construction$, první $concept_ship$ ve $concept_ship_construction_queue_short$ začne používat toto @ship_construction! $concept_ship_construction_short$ a poté se přepne na stav [Concept('concept_ship_under_construction','loď ve stavbě')]."
 concept_ship_retrofit: "Modernizace lodi"
 concept_ship_retrofit_short: "Modernizace"
 concept_ship_retrofitted_short: "Zmodernizováno"
 concept_ship_retrofit_desc: "Aktualizuje [Concept('concept_ship_modification','úpravy lodí')] [Concept('concept_ship','loď')] tak, aby odpovídaly nejnovější verzi její [Concept('concept_ship_template','šablona lodi')]."
 concept_ship_complexity: "Složitost lodi"
 concept_ship_complexity_short: "Složitost"
 concept_ship_complexity_desc: "$concept_ship_complexity$ [Concept('concept_ship','lodě')] je určena počtem různých [Concept('concept_ship_modification','úprav lodí')], které má. Čím více $concept_ship_modifications$ $concept_ship$ má, tím vyšší je jeho $concept_ship_complexity$ a tím více @ship_construction! [Concept('concept_ship_construction','stavba lodí')] bude vyžadovat pro stavbu či opravu." # todo: CONCEPT CASE
 concept_ship_modification: "Úprava lodi"
 concept_ship_modification_short: "Úprava"
 concept_ship_modifications: "Úpravy lodí"
 concept_ship_utility_modifications_short: "Užitečné úpravy"
 concept_ship_modification_desc: "$concept_ship_modification$ je vylepšení, které lze aplikovat na [Concept('concept_ship','loď')] ke zvýšení jeho schopností. Přidání více $concept_ship_modifications$ však také zvyšuje [Concept('concept_ship_complexity','složitost lodi')] $concept_ship$, což následně vyžaduje více @ship_construction! [Concept('concept_ship_construction','stavba lodí')] k jeho stavbě nebo opravě."
 concept_ship_under_construction: "Loď ve stavbě"
 concept_ship_under_construction_short: "Ve stavbě"
 concept_ship_under_construction_desc: "Když [Concept('concept_ship','loď')] používá @ship_construction! [Concept('concept_ship_construction','stavba lodí')], je považována za $concept_ship_under_construction_short$."
 concept_flagship: "Vlajková loď"
 concept_flagship_desc: "$concept_flagship$ je vedoucí [Concept('concept_ship','loď')] námořnictva [Concept('concept_country','země')]. Současně může existovat pouze jedna $concept_flagship$. Vítězství v bitvách, které zahrnují $concept_flagship$, poskytne dodatečný [Concept('concept_prestige','prestiž')] zemi, která ji vlastní, zatímco prohra je poškodí."
 concept_ship_crew: "Posádka lodi"
 concept_ship_crew_short: "Posádka"
 concept_ship_crew_present: "Posádka" # todo: NEW TRANSLATION
 concept_ship_crew_verb: "Obsluhuje" # todo: NEW TRANSLATION
 concept_ship_crew_present_verb: "Obsluhující" # todo: NEW TRANSLATION
 concept_ship_crew_past: "Obsluhovala" # todo: NEW TRANSLATION
 concept_ship_crew_desc: "Počet [Concept('concept_sailor', '$concept_sailors|q$')] na [concept_ship]. Čím větší je $concept_ship_crew_short$, tím více [concept_casualties] může $concept_ship$ způsobit a snést.\n\n$concept_ship$, jehož posádka není $concept_ship_crew_past$:\n• Je blíže ke zničení způsobenému $concept_casualties$\n• Má vyšší riziko stažení z [Concept('concept_naval_battle', '$concept_naval_battle|q$')]\n\nPři $concept_ship_crew_short$ o velikosti #v [GetDefine('NMilitary','ACTIVE_SHIP_LIVING_CREW_PERCENTAGE')|%0]#! nebo méně se $concept_ship$ stává neaktivní. Pokud posádka klesne pod #v [GetDefine('NMilitary','MINIMUM_SHIP_CREW_PERCENTAGE_TO_DEPLOY')|%0]#!, její [Concept('concept_fleet', '$concept_fleet|q$')] nelze nasadit a $concept_fleet$ již na moři se vrátí domů, aby doplnilo $concept_ship_crew_short$. [concept_ship] bez $concept_ship_crew_short$ mimo přístav je zničena.\n\n[Concept('concept_supply_ship', '$concept_supply_ships|q$')] mají vždy vlastní posádku a nečerpají naše $concept_sailors$." # todo: CHANGED (predtym: Počet [Concept('concept_sailor','námořníci')] a [SelectLocalization(GetPlayer.IsValid,'concept_ship_crew_desc_added','Of)
 concept_ship_crew_desc_added: "[GetPopType('officers').GetName]"
 concept_ship_hit_points: "Životy lodi"
 concept_ship_hit_points_short: "Životy"
 concept_ship_hit_points_desc: "Celkové $concept_ship_hit_points_short$ [Concept('concept_ship','loď')] představují její odolnost a schopnost odolávat poškození v námořním boji."
 concept_fleet_hit_points: "Životy flotily"
 concept_fleet_hit_points_short: "Životy"
 concept_fleet_hit_points_desc: "Průměrné $concept_fleet_hit_points_short$ všech [Concept('concept_ship','lodě')] ve [Concept('concept_fleet','loďstvu')] představují průměrnou odolnost a schopnost odolat poškození." # todo: CHANGED (predtym: Průměrné $concept_fleet_hit_points_short$ všech [Concept('concept_ship', '$concept_ships|q$')] ve [concept_fleet] předst)
 concept_ship_armor: "Pancéřování lodi"
 concept_ship_armor_short: "Pancéř"
 concept_ship_armor_desc: "Snižuje jakékoli poškození, které by [Concept('concept_ship','loď')] obdržela od protivníka, o tuto hodnotu."
 concept_ship_upkeep: "Provoz lodi"
 concept_ship_upkeep_short: "Provoz"
 concept_ship_upkeep_desc: "Týdenní $concept_ship_upkeep$ představuje náklady na [Concept('concept_good','zboží')] nutné k udržení [Concept('concept_ship','lodi')]. $concept_ship_upkeep_short$ se mění pomocí [GetDefine('NMilitary','SHIP_UPKEEP_GOODS_DOCKED_MULT')|-1%], pokud je $concept_ship$ dokovaná u [Concept('concept_hq','HQ')]." # todo: CONCEPT CASE
 concept_ship_speed: "Rychlost lodi"
 concept_ship_speed_short: "Rychlost"
 concept_ship_speed_desc: "$ship_movement_speed_add_desc$"
 concept_attack_damage: "Útočné poškození"
 concept_attack_damage_short: "Poškození"
 concept_attack_damage_desc: "$ship_hull_damage_add_desc$"
 concept_hull_attack_damage: "Poškození trupu"
 concept_hull_attack_damage_short: "Poškození trupu"
 concept_hull_attack_damage_desc: "$ship_hull_damage_add_desc$"
 concept_crew_attack_damage: "Poškození posádkou"
 concept_crew_attack_damage_short: "Poškození posádky"
 concept_crew_attack_damage_desc: "$ship_crew_damage_add_desc$"
 concept_carrying_capacity: "Nákladová kapacita"
 concept_carrying_capacity_desc: "$ship_carrying_capacity_add_desc$"
 concept_marine_capacity: "Kapacita námořníků"
 concept_marine_capacity_desc: "$ship_marine_capacity_add_desc$"
 concept_supply_capacity: "Kapacita zásob"
 concept_supply_capacity_desc: "$ship_supply_capacity_add_desc$"
 concept_supply_efficiency: "Efektivita zásob"
 concept_supply_efficiency_desc: "Jak efektivně loď spotřebovává zásoby. Vyšší efektivita znamená nižší spotřebu zásob."
 concept_supply_priority: "Priorita zásob"
 concept_supply_priority_short: "Priorita"
 concept_supply_priority_desc: "$concept_supply_priority$ [Concept('concept_military_formation','formací')] určuje pořadí, v jakém obdrží [Concept('concept_supply_ship','zásobovací lodě')].\n\n$concept_supply_ships$ budou rozdělovány, dokud nebudou uspokojeny potřeby všech $concept_supply_priority_short$ nejvyšších [Concept('concept_fleet','loďstva')] a [Concept('concept_army','armády')], poté bude distribuce pokračovat směrem k nižším $concept_supply_priority_short$ $concept_fleets$ a $concept_armies$." # todo: CHANGED (predtym: $concept_supply_priority$ [Concept('concept_military_formation','formací')] určuje pořadí, v jakém obdrží [Concept('conc)
 concept_supply_ship: "Zásobovací loď"
 concept_supply_ships: "Zásobovací lodě"
 concept_supply_ship_construction: "Stavba zásobovacích lodí" # todo: NEW TRANSLATION
 concept_supply_ship_desc: "$concept_supply_ships$ slouží k dopravě zásob, přídělu a munice [Concept('concept_fleet','loďstva')] na moři a [Concept('concept_army','armády')] v zámoří.\n\nStaví se v $building_shipyard$ podobně jako běžné [Concept('concept_ship','lodě')] a jsou udržovány v poolu, pokud nejsou právě potřeba."
 concept_critical_hit_chance: "Šance na kritický zásah"
 concept_critical_hit_chance_desc: "$ship_critical_hit_chance_add_desc$"
 concept_critical_hit_multiplier: "Kritické poškození"
 concept_critical_hit_multiplier_desc: "$ship_critical_hit_multiplier_add_desc$"
 concept_vulnerability: "Zranitelnost"
 concept_vulnerability_desc: "Vyšší $concept_vulnerability$ $concept_ships$ jsou pravděpodobněji vybrány jako cíl nepřátelských $concept_ships$. Tento účinek lze potlačit pomocí [Concept('concept_screening','ochrany')|l].\n\n$concept_vulnerability_extra_damage_desc$" # todo: CHANGED (predtym: Vyšší $concept_vulnerability$ $concept_ships$ jsou pravděpodobněji vybrány jako cíl nepřátelských $concept_ships$, pokud)
 concept_vulnerability_extra_damage_desc: "$concept_ship$ utrpí dodatečné poškození až do výše vlastní hodnoty $concept_vulnerability$ v procentech, pokud je v bitvě celková hodnota $concept_screening$ nižší než $concept_vulnerability$. Výše poškození závisí na chybějící hodnotě $concept_screening$.\n\n$concept_ships$ mohou obecně plně využít $concept_vulnerability$ pouze proti ostatním $concept_ships$ s podobnou či nižší technologickou vyspělostí." # todo: NEW TRANSLATION
 concept_screening: "Ochrana"
 concept_screening_desc: "$concept_screening$ potlačuje [concept_vulnerability]. Čím více $concept_screening$ má [concept_fleet] v porovnání se svou celkovou $concept_vulnerability$, tím méně pravděpodobné je, že se cílem stanou jeho nejzranitelnější $concept_ships$.\n\n$concept_vulnerability_extra_damage_desc$" # todo: CHANGED (predtym: $concept_screening$ se používá k potlačení efektů [Concept('concept_vulnerability','zranitelnosti')]; vyšší hodnota $con)
 concept_readiness: "Připravenost"
 concept_readiness_desc: "$ship_readiness_gain_add_desc$"
 concept_accuracy: "Přesnost"
 concept_accuracy_desc: "$ship_accuracy_add_desc$"
 concept_detection: "Detekce"
 concept_detection_desc: "$ship_detection_add_desc$\n\n$concept_fleet_possessive$ $concept_detection$ a nepřátelská [Concept('concept_visibility','viditelnost')] se používají společně k určení šance na vznik [Concept('concept_naval_battle','námořní bitvy')|l] a kolik $concept_ships$ se do ní zapojí." # todo: CHANGED (predtym: $ship_detection_add_desc$\n\n$concept_fleet_possessive$ $concept_detection$ a nepřátelská [concept_visibility] $concept_)
 concept_visibility: "Viditelnost"
 concept_visibility_desc: "$ship_visibility_add_desc$\n\n$concept_fleet_possessive$ $concept_detection$ a nepřátelská [Concept('concept_visibility','viditelnost')] se používají společně k určení šance na vznik [Concept('concept_naval_battle','námořní bitvy')|l] a kolik $concept_ships$ se do ní zapojí." # todo: CHANGED (predtym: $ship_visibility_add_desc$\n\n$concept_fleet_possessive$ $concept_detection$ a nepřátelská [concept_visibility] $concept)
 concept_withdrawn_ships: "Stažené lodě"
 concept_withdrawn_ships_short: "Staženo"
 concept_withdrawn_ships_desc: "Kolik $concept_ships$ se $concept_withdrawn_ships_short$ z bitvy."
 concept_sunk_ships: "Potopené lodě"
 concept_sunk_ships_short: "Potopeno"
 concept_sunk_ships_desc: "Kolik $concept_sunk_ships$ utrpěla [Concept('concept_fleet','loďstvo')] v bitvě."
 concept_crew_casualties: "Oběti posádky"
 concept_crew_casualties_short: "Oběti"
 concept_crew_casualties_desc: "Kolik $concept_crew_casualties_short$ utrpěla [Concept('concept_fleet','loďstvo')] v bitvě."
 concept_shipping_lane: "Námořní trasa"
 concept_shipping_lanes: "Námořní trasy"
 concept_shipping_lane_desc: "$concept_shipping_lane$ je námořní spojení tvořené @merchant_marine! #tooltippable_name #tooltip:[GetGoods('merchant_marine').GetTooltipTag],DATA_GOODS_NAME_TOOLTIP,GoodsTooltip [GetGoods('merchant_marine').GetCustom('GDS_I')|l]#!#! mezi dvěma pobřežními [Concept('concept_state','státy')], které je zřízeno buď k přesunu [Concept('concept_good','zboží')] z místa na místo jako součást [Concept('concept_treaty','smlouvy')], nebo k [Concept('concept_supply','zásobování')|l] zámořských [Concept('concept_military_formation','formací')].\n\n$concept_shipping_lane$ může být buď [Concept('concept_supply_route','zásobovací trasa')|l], [Concept('concept_port_connection','přístavní spojení')|l] nebo [GetArticleType('goods_transfer').GetNameNoIcon] smlouvy a jeho fungování závisí na [Concept('concept_shipping_lane_effectiveness','efektivitě námořní trasy')], pokud jsou dostatečně pokryty jeho přepravní náklady." # todo: CHANGED (predtym: $concept_shipping_lane$ je námořní spojení tvořené [GetGoods('merchant_marine').GetName] mezi dvěma pobřežními [Concept()
 concept_tolls: "Mýtné"
 concept_toll: "Mýtné"
 concept_toll_rate: "Sazba mýtného" # todo: NEW TRANSLATION
 concept_tolls_desc: "$concept_tolls$ může vybírat [Concept('concept_country','země')], které [Concept('concept_strait_control','kontrola')] $concept_strait$. Přidávají náklad, který je podílem [Concept('concept_trade','obchodu')] procházejícího jimi. Tento náklad hradí postižené [GetBuildingType('building_trade_center').GetName] a snižuje jejich ziskovost, zatímco $concept_country$ ovládající $concept_strait$ získává dodatečný příjem. $concept_tolls$ může zvýšit každý ze správců $concept_strait$ samostatně a sčítají se." # todo: CHANGED (predtym: $concept_tolls$ může vybírat [Concept('concept_country','země')], které [Concept('concept_strait_control','kontrolují')])
 concept_strait: "Průliv"
 concept_straits: "Průlivy"
 concept_strait_desc: "Úzký vodní průchod spojující dva [Concept('concept_province','provincie')], po jedné straně na každé straně $concept_strait$. [Concept('concept_country','Země')] potřebuje kontrolu pouze nad jedním z $concept_provinces$, aby mohla spravovat, které lodě mají $concept_strait_access$ přes $concept_strait$.\n@information! $strait_gibraltar$ vyžaduje, aby $concept_country$ ovládala oba $concept_provinces$, aby mohla spravovat práva $concept_strait_access$."
 concept_port_connection: "Přístavní spojení"
 concept_port_connections: "Přístavní spojení"
 concept_port_connection_desc: "$concept_shipping_lane$, která připájí jeden nebo více [Concept('concept_state','států')], jinak nedosažitelných po souši, ke [Concept('concept_market_capital','hlavnímu centru trhu')], zajišťující [Concept('concept_market_access','přístup na trh')|l] pro odlehlé oblasti. $concept_port_connections$ vyžadují budovu [SelectLocalization(GetPlayer.IsValid,'concept_port_connection_desc_added','Přístav')] na obou koncích. Cena dovozu do přístavného spojení závisí na celkovém [Concept('concept_infrastructure_usage','využití infrastruktury')|l] [Concept('concept_state','států')], které spojuje." # todo: CHANGED (predtym: $concept_shipping_lane$, která připojuje jeden nebo více [Concept('concept_state','$concept_states|q$')], jinak nedosaži)
 concept_port_connection_desc_added: "[GetBuildingType('building_port').GetName]"
 concept_shipping_lane_effectiveness: "Efektivita námořní trasy"
 concept_shipping_lane_effectiveness_short: "Efektivita"
 concept_shipping_lane_effectiveness_desc: "$concept_shipping_lane_effectiveness_short$ [Concept('concept_shipping_lane','námořní trasa')] je určena silou [Concept('concept_supply_network','zásobovací sítě')] dané [Concept('concept_country','zemi')]. Když je $concept_shipping_lane_effectiveness_short$ nižší než #v 100 %#!, funkce $concept_shipping_lane$ se odpovídajícím způsobem sníží." # todo: CONCEPT CASE
 concept_supply_route: "Zásobovací trasa"
 concept_supply_routes: "Zásobovací trasy"
 concept_supply_route_possessive: "Zásobovací trasy"
 concept_supply_route_desc: "[Concept('concept_shipping_lane','Námořní trasa')], která zásobuje [Concept('concept_general','generála')] [Concept('concept_order','pověřeného')] postupem nebo obranou [Concept('concept_front','fronty')], jež je přístupná pouze po moři. Úroveň [Concept('concept_supply','zásobování')|l] generála odpovídá [Concept('concept_shipping_lane_effectiveness','efektivitě')] této [Concept('concept_supply_route','zásobovací námořní trasy')]." # todo: CHANGED (predtym: [concept_shipping_lane], která zásobuje [concept_general] [Concept('concept_order','$concept_ordered|q$')] postupem nebo)
 concept_character: "Postava"
 concept_characters: "Postavy"
 concept_character_possessive: "Postavy"
 concept_character_desc: "$concept_characters$ plní různé [Concept('concept_character_role','role')|l] ve vaší [Concept('concept_country','zemi')]. Jejich schopnost vykonávat tyto povinnosti závisí na jejich [Concept('concept_character_trait','charakterových rysech')]. Vždy podporují [Concept('concept_interest_group','zájmovou skupinu')] a mohou mít [Concept('concept_ideology','ideologii')], která ovlivňuje jejich aspirace a pohled na věc."
 concept_busy: "Zaneprázdněný"
 concept_busy_desc: "[Concept('concept_character','Postava')] může být považována za zaneprázdněnou, když má zadaný úkol, například při expedici. Když je [Concept('concept_character','postava')|l] zaneprázdněná, není k dispozici pro své běžné povinnosti. Například [Concept('concept_commander','velitel')|l] se nemůže účastnit v [Concept('concept_battle','bitvách')]." # todo: CHANGED (predtym: [Concept('concept_character','Postava')] může být považována za $concept_busy$, když má zadaný úkol, například při exped)
 concept_popularity: "Popularita"
 concept_popular: "Oblíbený"
 concept_popularity_desc: "$concept_popularity$ vyjadřuje ochotu [Concept('concept_pop','populace')] [Concept('concept_character','postavu')] následovat. \n\n$concept_popularity$ ovlivňuje [Concept('concept_prominence','prominenci')] a může mít různé účinky podle [Concept('concept_character_role','role')|l] dané postavy: #indent_newline:3 \n• [Concept('concept_agitator','Agitátoři')]: ovlivňuje šanci, že se [Concept('concept_pop', 'populace')] připojí k jejich [Concept('concept_political_movement','politickému hnutí')] \n• [Concept('concept_ruler','Vládcové')]: přidává nebo ubírá [Concept('concept_authority','autoritu')] \n• [Concept('concept_admiral','Admirálové')]/[Concept('concept_general','generálové')]: ovlivňuje šanci na úspěšné zahájení [Concept('concept_coup','puče')] \n• [Concept('concept_interest_group','Zájmová skupina')] [Concept('concept_leader', 'lídra')]: ovlivňuje [Concept('concept_interest_group_attraction','atraktivitu zájmové skupiny')] \n• [Concept('concept_party_leader','Vůdci strany')]: ovlivňuje [Concept('concept_momentum','momentum')|l] [Concept('concept_party','strany')] během [Concept('concept_election','volby')] \n• [Concept('concept_executive','Výkonný představitel')]: ovlivňuje [Concept('concept_prosperity','prosperitu')]" # todo: CHANGED (predtym: $concept_popularity$ [concept_character] vyjadřuje ochotu [Concept('concept_pop','$concept_pops|q$')] jej následovat. \n)
 concept_prominence: "Význam"
 concept_prominent: "Významný"
 concept_prominence_desc: "$concept_prominence$ [Concept('concept_character','postava')] měří jejich úroveň vlivu v politickém stroji [Concept('concept_country','země')] a ovlivňuje šanci, že bude $concept_character$ vybrán jako další vůdce jejich [Concept('concept_interest_group','zájmová skupina')]. $concept_characters$, jejichž $concept_prominence$ je alespoň [GetDefine('NCharacters','PROMINENCE_SIGNIFICANT_THRESHOLD')|v], také přispívají k [Concept('concept_political_strength','politické síle')] svého [Concept('concept_interest_group','zájmové skupiny')] a mohou být zvoleni jako jeho další [Concept('concept_leader','vůdce')]." # todo: CONCEPT CASE
 concept_loyalty: "Loajalita"
 concept_loyalty_desc: "$concept_loyalty$ [Concept('concept_character','postava')] měří, jak věrný je vládnoucímu [Concept('concept_government','vládě')], a je ovlivněna [Concept('concept_approval','spokojenost')] jejich [Concept('concept_interest_group','zájmová skupina')] stejně jako jejich osobní [Concept('concept_ideology','ideologie')]. Nevěrní [Concept('concept_commander','velitelé')] mohou zkusit spustit [Concept('concept_coup','puč')]." # todo: CONCEPT CASE
 concept_momentum: "Momentum"
 concept_momentum_desc: "Úspěch kampaně [Concept('concept_party','strany')|l] ve [Concept('concept_election','volbách')]. $concept_momentum$ zvyšuje počet [Concept('concept_votes','hlasů')], které strana získá v den voleb, a pak je zneplatněno. $concept_momentum$ může být ovlivněno náhodou, speciálními událostmi a [Concept('concept_popularity','popularitou')] svého [Concept('concept_party_leader','vůdce strany')|l]." # todo: CHANGED (predtym: Úspěch kampaně [Concept('concept_party','strany')|l] ve [Concept('concept_election','volbách')]. $concept_momentum$ zvyš)
 concept_government_expenses: "Vládní výdaje"
 concept_government_expenses_short: "Výdaje"
 concept_government_expenses_desc: "Celkové týdenní vládní výdaje, které [Concept('concept_government','vláda')|l] nashromáždí, jsou vyváženy vůči všem jejím týdenním příjmům, jako jsou [Concept('concept_taxes','daně')|l]. Výsledné saldo je následně přičteno k [Concept('concept_treasury','pokladně')] nebo z ní odečteno."
 concept_sovereignty: "Suverenita"
 concept_sovereignty_desc: "Právo [Concept('concept_country','země')|l] na samosprávu. Když jedna země poruší suverenitu jiné, otevřeně tím nerespektuje její právo na sebeurčení. Pokud napadená strana neodpoví okamžitou vojenskou reakcí a nebrání neporušitelnost svých hranic, podřizuje se útočníkovi a umožňuje mu vojenský přístup přes své území." # todo: CHANGED (predtym: Právo [Concept('concept_country','země')|l] na samosprávu. Když jedna [concept_country] poruší [concept_sovereignty] jin)
 concept_average_wage: "Průměrná roční mzda"
 concept_average_wage_desc: "Průměrná [Concept('concept_building_wage', 'mzda')] [Concept('concept_individual', 'jednotlivce')] v [Concept('concept_workforce', 'pracovní síle')], kterou by ročně vydělával prací v této [Concept('concept_building', 'budově')]."
 concept_subsidized_wage: "Dotovaná mzda"
 concept_subsidized_wage_desc: "Když [Concept('concept_subsidies','dotovaná')] [Concept('concept_building','budova')|l] nemůže zaplatit své [Concept('concept_workforce','pracovní síle')] alespoň [Concept('concept_normal_wage','standardní mzdu')], zbývající částka je kryta vládními dotacemi ze [Concept('concept_treasury','státní pokladny')]. Na oplátku [Concept('concept_building','budova')|l] nikdy nepropustí svou [Concept('concept_workforce','pracovní sílu')] a snaží se udržat maximální [Concept('concept_throughput','efektivitu')]." # todo: CHANGED (predtym: Když [Concept('concept_subsidies','dotovaná')] [Concept('concept_building','budova')|l] nemůže zaplatit své [Concept('co)
 concept_government_wage: "Vládní mzda"
 concept_government_wages: "Vládní mzdy"
 concept_government_wage_desc: "Všechny [Concept('concept_government_building','vládní budovy')] kromě [Concept('concept_military_building','vojenských budov')] platí svou [Concept('concept_workforce','pracovní sílu')] podle stejné standardizované vládní mzdy. Tato sazba je založena na [Concept('concept_normal_wage','nominální mzdě')] v [Concept('concept_country','zemi')] a lze ji upravovat v panelu rozpočtu." # todo: CHANGED (predtym: Všechny [Concept('concept_government_building','vládní budovy')] kromě [Concept('concept_military_building','vojenských )
 concept_military_wage: "Vojenská mzda"
 concept_military_wages: "Vojenské mzdy"
 concept_military_wage_desc: "Všechny [Concept('concept_military_building','vojenské budovy')|l] platí svou [Concept('concept_workforce','pracovní sílu')] podle stejné standardizované sazby vojenské mzdy. Tato sazba se zakládá na [Concept('concept_normal_wage','normální mzdě')] v [Concept('concept_country','zemi')], přičemž jakékoliv úpravy se nastavují na panelu rozpočtu." # todo: CHANGED (predtym: Všechny [Concept('concept_military_building','vojenské budovy')|l] platí svou [Concept('concept_workforce','pracovní síl)
 concept_normal_wage: "Standardní mzda"
 concept_normal_wage_desc: "Základní [Concept('concept_building_wage','mzda')|l] v [Concept('concept_country','zemi')], kterou zohledňuje mnoho [Concept('concept_building','budov')]. [Concept('concept_government_wage','Vládní mzdy')] a [Concept('concept_military_wage','vojenské mzdy')|l] vycházejí ze standardní mzdy. Ta je určena podle průměrných [Concept('concept_government_wage','mezd')] vyplácených [Concept('concept_building','průmysly')] napříč [Concept('concept_incorporated_state','začleněnými státy')]." # todo: CHANGED (predtym: Základní [Concept('concept_building_wage','mzda')|l] v [Concept('concept_country','zemi')], kterou zohledňuje mnoho [Con)
 concept_dead: "Mrtvý"
 concept_dead_desc: "[Concept('concept_casualties','Ztráty')], které skončily jako mrtvé v důsledku [Concept('concept_battle','bitvy')] nebo [Concept('concept_attrition','vyčerpání')|l]."
 concept_wounded: "Zranění"
 concept_wounded_desc: "[Concept('concept_casualties','Ztráty')], které jsou pouze zranění v [Concept('concept_battle','bitvě')] nebo kvůli [Concept('concept_attrition','vyčerpání')|l]. Někteří zranění se zotaví a vrátí se po nějakém čase do aktivní služby, zatímco jiní končí jako [Concept('concept_dependents','osoby závislé')] na jiné [Concept('concept_pop','populaci')] ve vaší [Concept('concept_country','zemi')]." # todo: CHANGED (predtym: [concept_casualties], které jsou pouze [concept_wounded] v [Concept('concept_battle','bitvě')] nebo kvůli [Concept('conc)
 concept_attrition: "Vyčerpání"
 concept_attrition_risk: "Riziko opotřebení"
 concept_attrition_desc: "[Concept('concept_casualties','Ztráty')] na [Concept('concept_manpower','personálu')] způsobené mimo [Concept('concept_battle','bitvu')] se nazývají Opotřebením. Běžně se to stává, když jsou [Concept('concept_battalion','prapory')|l] [Concept('concept_mobilize_battalion','mobilizovány')] a může to být výsledkem nemocí, nehod, nepřízně počasí nebo dokonce dezerce. $concept_attrition$ lze omezit pomocí [Concept('concept_mobilization_option','mobilizační možnosti')|l] $medic_support$." # todo: CHANGED (predtym: [Concept('concept_casualties','Ztráty')] na [Concept('concept_manpower','personálu')] způsobené mimo [Concept('concept_b)
 concept_ruler: "Vládce"
 concept_rulers: "Vládcové"
 concept_ruler_possessive: "Vládcem"
 concept_ruler_desc: "$concept_ruler$ je obvykle [Concept('concept_head_of_state','hlava státu')|l], která reprezentuje [Concept('concept_country','zemi')] v domácích a světových záležitostech. [Concept('concept_ruler','Vládce')] přímo ovlivňuje zemi. Když vládce zemře, nový převezme jeho místo - buď jako [Concept('concept_heir','dědic')|l], pokud nějaký existuje, nebo jiná postava v závislosti na [Concept('concept_government_type','typu vlády')]." # todo: CHANGED (predtym: $concept_ruler$ je obvykle [Concept('concept_head_of_state','hlava státu')|l], která reprezentuje [Concept('concept_coun)
 concept_heir: "Dědic"
 concept_heirs: "Dědicové" # todo: NEW TRANSLATION
 concept_heir_desc: "$concept_heir$ [Concept('concept_country','země')|l] je [Concept('concept_character','postava')|l]. Po smrti aktuálního [Concept('concept_ruler','vládce')] zaujme jeho místo."
 concept_executive: "Výkonný představitel"
 concept_executives: "Výkonný představitelé"
 concept_executives_desc: "$concept_executive_desc$"
 concept_executive_desc: "$concept_executives$ jsou [Concept('concept_character','postavy')|l], které vedou [Concept('concept_company','společnost')|l]. Stejně jako ostatní postavy mohou mít [Concept('concept_character_trait','charakterové rysy')|l], které ovlivňují jejich schopnosti. Poskytují [Concept('concept_clout','politický vliv')|l] své [Concept('concept_interest_group','zájmové skupině')] na základě úspěšnosti své [Concept('concept_company','společnosti')]. $concept_executives$ se mohou také stát [Concept('concept_leader','vůdcem')] zájmové skupiny." # todo: CHANGED (predtym: $concept_executives$ jsou [Concept('concept_character','postavy')|l], které vedou [Concept('concept_company','společnost)
 concept_magnate: "Magnát"
 concept_magnates: "Magnáti"
 concept_magnates_desc: "$concept_magnate_desc$"
 concept_magnate_desc: "$concept_magnates$ jsou bohatí [Concept('concept_character','postavy')], kteří vlastní četné statky nebo podniky a využívají své jmění k uplatňování politické moci. $concept_magnates$ $concept_magnate_holding_desc$."
 concept_favorite: "Oblíbenec" # todo: NEW TRANSLATION
 concept_favorite_desc: "$concept_favorite$ je [concept_character], který se těší zvláštní přízni [concept_ruler] a získává tak politický vliv na [concept_enactment_of_laws]." # todo: NEW TRANSLATION
 concept_magnate_holding_desc: "vlastní [Concept('concept_holding','držení')] ve svém [Concept('concept_home_state','domácím státě')] a získává [Concept('concept_prominence','význam')] na základě jeho [Concept('concept_revenue','příjmů')]" # todo: CONCEPT CASE
 concept_holding: "Držení"
 concept_holding_desc: "$concept_holding$ je [Concept('concept_building','budova')] (obvykle $MANOR_HOUSES_GC_LINK$ nebo $FINANCIAL_DISTRICTS_GC_LINK$) v [Concept('concept_home_state','domácím státě')] [Concept('concept_character','postavy')], ve kterém má $concept_character$ předpokládaný značný podíl. Typ $concept_building$, které $concept_character$ obdrží jako své $concept_holding$, závisí především na jejich [Concept('concept_interest_group','zájmová skupina')]." # todo: CONCEPT CASE
 concept_character_role: "Role"
 concept_character_roles: "Role"
 concept_character_role_desc: "$concept_character_roles$ určuje, v jakých oblastech má konkrétní [Concept('concept_character','postava')|l] vliv na vaši [Concept('concept_country','zemi')]. $concept_character$ může mít jednu nebo více rolí.\n\nSeznam rolí zahrnuje: \n  #indent_newline:3  • [Concept('concept_ruler','Vládce')] (obvykle též [Concept('concept_politician','politik')])\n• [Concept('concept_heir','Dědic')]\n• [Concept('concept_politician','Politik')]\n• [Concept('concept_executive','Výkonný představitel')]\n• [Concept('concept_agitator','Agitátor')]\n• [Concept('concept_general','Generál')]\n• [Concept('concept_admiral','Admirál')]" # todo: CONCEPT CASE
 concept_treasury: "Státní pokladna"
 concept_treasury_possessive: "Pokladny"
 concept_treasury_desc: "$concept_treasury$ sleduje majetek vaší [Concept('concept_country','země')|l]. Každý týden se bilance vašeho rozpočtu projeví tak, že státní pokladna bude čerpat další [Concept('concept_loans','půjčky')|l], aby pokryla nedostatek [Concept('concept_money','peněz')], nebo ukládat peníze do [Concept('concept_gold_reserves','zlatých rezerv')]." # todo: CHANGED (predtym: $concept_treasury$ sleduje majetek vaší [Concept('concept_country','země')|l]. Každý týden se bilance vašeho rozpočtu pr)
 concept_building_balance: "Bilance"
 concept_building_balance_profit: "Zisk"
 concept_building_balance_desc: "Bilance [Concept('concept_building','budovy')|l] je částka [Concept('concept_money','peněz')], která zůstává z její [Concept('concept_revenue','příjmů')] po zaplacení [Concept('concept_building_wage','mezd')] a nákupu potřebného [Concept('concept_good','vstupního zboží')].\n\nZůstatek $concept_building_balance$ je rozdělen mezi [Concept('concept_building_owners','vlastníky budov')|l] a [Concept('concept_cash_reserves','hotovostní rezervy')|l] budovy.\n\nZůstatek budovy může být zlepšen buď snížením nákladů na vstupní zboží, nebo zvýšením ceny za výstupní zboží. Toho lze dosáhnout zvýšením nebo snížením [Concept('concept_sell_orders','nabídky')] a [Concept('concept_buy_orders','poptávky')] na [Concept('concept_market','trhu')], kterému budova náleží." # todo: CHANGED (predtym: Bilance [Concept('concept_building','budovy')|l] je částka [Concept('concept_money','peněz')], která zůstává z její [Con)
 concept_building_wage: "Mzda"
 concept_building_wages: "Mzdy"
 concept_building_wage_desc: "$concept_building_wages$ vyplácené [Concept('concept_pop','populaci')] [Concept('concept_building','budovy')|l], v které pracují, závisí na několika faktorech, přičemž nejvýznamnějšími jsou [Concept('concept_profession','profese')|l] [Concept('concept_pop','populace')|l] a finanční situace [Concept('concept_building','budovy')|l]. Pokud [Concept('concept_building_balance','bilance')|l] [Concept('concept_building','budovy')|l] umožňuje zvyšování mezd, [Concept('concept_building','budova')|l] to udělá pouze tehdy, pokud to bude potřebné k přilákání více populace do své [Concept('concept_workforce','pracovní síly')]. Pokud je [Concept('concept_building_balance','bilance')|l] [Concept('concept_building','budovy')|l] negativní, zváží snížení mezd k obnovení ziskovosti.\n\nMůžete zajistit, že pracovní síle budou vyplaceny konkurenceschopné mzdy tím, že budete budovu [Concept('concept_subsidies','dotovat')]. To ji udrží nad vodou díky prostředkům z [Concept('concept_treasury','pokladny')], pokud to bude nezbytné." # todo: CHANGED (predtym: $concept_building_wages$ vyplácené [Concept('concept_pop','populaci')] [Concept('concept_building','budovy')|l], v které)
 concept_sell_orders: "Prodejní objednávky"
 concept_sell_order: "Prodejní objednávka"
 concept_sell_order_short: "Prodat"
 concept_sell_orders_supply: "Nabídka"
 concept_sell_orders_desc: "Počet objednávek na prodej [Concept('concept_good','zboží')|l] na centrálním [Concept('concept_market','trhu')] se používá v kombinaci s [Concept('concept_buy_orders','nákupními objednávkami')] k určení jeho [Concept('concept_market_price','tržní ceny')]. $concept_sell_orders$ jsou generovány výrobou zboží v každém ze [Concept('concept_state','států')] trhu. Čím vyšší je [Concept('concept_market_access','přístup na trh')|l] daného [Concept('concept_state','státu')], tím blíže bude počet generovaných prodejní objednávek k celkové výrobě." # todo: CHANGED (predtym: Počet objednávek na prodej [concept_good] na centrálním [concept_market] se používá v kombinaci s [concept_buy_orders] k)
 concept_buy_orders: "Nákupní objednávky"
 concept_buy_order: "Nákup"
 concept_buy_order_short: "Koupit"
 concept_buy_orders_demand: "Poptávka"
 concept_buy_orders_desc: "Počet objednávek na nákup [Concept('concept_good','zboží')|l] na centrálním [Concept('concept_market','trhu')] se používá v kombinaci s [Concept('concept_sell_orders','prodejními objednávkami')] k určení jeho [Concept('concept_market_price','tržní ceny')]. $concept_buy_orders$ jsou generovány spotřebou zboží na [Concept('concept_market','trhu')] v každém [Concept('concept_state','státě')]. Čím vyšší má [Concept('concept_state','stát')|l] [Concept('concept_market_access','přístup na trh')|l], tím blíže bude počet vygenerovaných nákupních objednávek k celkové spotřebě." # todo: CHANGED (predtym: Počet objednávek na nákup [concept_good] na centrálním [Concept('concept_market','trhu')] se používá v kombinaci s [conc)
 concept_head_of_state: "Hlava státu"
 concept_head_of_state_desc: "Jediný [Concept('concept_ruler','vládce')|l] nebo nejvyšší zástupce [Concept('concept_country','země')|l]. [Concept('concept_government_type','Typ vlády')] určuje, kdo slouží jako hlava státu a kdy je nahrazen.[AddLocalizationIf(GetPlayer.IsValid, 'concept_head_of_state_ingame_added')]" # todo: CHANGED (predtym: Jediný [Concept('concept_ruler','vládce')|l] nebo nejvyšší zástupce [Concept('concept_country','země')|l]. [Concept('con)
 concept_head_of_state_ingame_added: "\n\nZa [$GetPlayer.GetAdjectiveNoFlag$] [Concept('concept_head_of_state','hlavu státu')] je považován [GetPlayer.GetRuler.GetFullNameWithTitle|l]."
 concept_government_type: "Typ vlády"
 concept_government_types: "Typy vlády"
 concept_government_type_transfer_of_power: "Způsob předání moci"
 concept_government_type_desc: "Typ vlády [Concept('concept_country','země')] určují její [Concept('concept_law','zákony')|l] a také je určen způsobem předání moci – tedy kdo zastává funkci [Concept('concept_head_of_state','hlavy státu')].[AddLocalizationIf(GetPlayer.IsValid,'concept_government_type_ingame_added')]" # todo: CHANGED (predtym: [concept_government_type] [Concept('concept_country','země')] určují její [Concept('concept_law','zákony')|l] a také [co)
 concept_government_type_ingame_added: "\n\n$concept_government_type$ v [GetPlayer.GetAltAdjectiveNoFlag('L')] je #tooltippable #tooltip:[GetPlayer.GetGovernment.GetTooltipTag],GOVERNMENT_TYPE_TOOLTIP_DESC [GetPlayer.GetGovernment.GetName]#!#!, z následujících důvodů:\n[GetPlayer.GetGovernment.GetPossibleTriggerDesc(AccessPlayer)]"
 concept_transfer_of_power: "Přenos moci"
 concept_transfer_of_power_desc: "Přenos moci určuje, jak je [Concept('concept_ruler','vládcova')] moc předávána následujícímu vládci a kdy se tento přenos uskuteční." # todo: CHANGED (predtym: Přenos moci určuje, jak je [Concept('concept_ruler','vládcova')] moc předávána následujícímu [concept_ruler] a kdy se te)
 concept_recognized_power: "Uznaná mocnost"
 concept_recognized_powers: "Uznané mocnosti"
 concept_recognized_power_short: "Uznaná"
 concept_recognition: "Uznání"
 concept_recognized_power_desc: "$concept_recognized_power$ je považována za platný národní stát, schopný sebeurčení, a to na základě konsenzu [Concept('concept_great_power','velmocí')], čímž se odlišuje od [Concept('concept_unrecognized_power','neuznaných mocností')].\n\nNeuznaná mocnost se může stát uznanou mocností tím, že splní [Concept('concept_journal_entry','záznam v deníku')|l] #bold $je_earn_recognition$#!." # todo: CHANGED (predtym: $concept_recognized_power$ je považována za platný národní stát, schopný sebeurčení, a to na základě konsenzu [Concept(')
 concept_unification_supporter: "Podporovatel sjednocení"
 concept_unification_supporters: "Podporovatelé sjednocení"
 concept_unification_support: "Podpora"
 concept_unification_supporting: "Podporující"
 concept_unification_supporter_desc: "$concept_unification_supporter$ je [Concept('concept_country','země')|l], která favorizuje konkrétního [Concept('concept_unification_candidate','kandidáta')]. Pokud se sjednocení zdaří, stane se podporovatel sjednocení součástí unie."
 concept_unification_candidate: "Kandidát pro sjednocení"
 concept_unification_candidate_short: "Kandidát"
 concept_unification_candidates: "Kandidáti pro sjednocení"
 concept_unification_candidate_desc: "$concept_unification_candidate$ je [Concept('concept_country','země')|l], která se považuje za životaschopného kandidáta pro sjednocení. Podmínky pro to, kdo bude kvalifikován jako kandidát pro sjednocení, se liší v závislosti na tom, o který sjednocený národ se jedná."
 concept_unification: "Sjednocení země"
 concept_unification_short: "Sjednocení"
 concept_unify: "Sjednotit"
 concept_unified: "Sjednoceno"
 concept_major_unification: "Významné sjednocení"
 concept_minor_unification: "Lokální sjednocení"
 concept_unification_desc: "Akt sloučení a vytvoření nové [Concept('concept_country','země')|l] z několika zemí se nazývá sjednocení. $concept_country$ může být vytvořena ovládaním určeného počtu [Concept('concept_state','států')] v regionu nové země.\n\n#b $concept_major_unification$#! umožňuje [Concept('concept_countries','zemím')] stát se [Concept('concept_unification_candidate','kandidátem')], což jim dává přístup k [Concept('concept_diplomatic_play','diplomatické hře')] o sjednocení. Tato diplomatická hra nastaví [Concept('concept_war_goal','válečné cíle')|l] na anektování všech požadovaných států a zemí.\n\n#b $concept_minor_unification$#! naopak neumožňuje žádné [Concept('concept_unification_candidate','kandidáty')] a země ji může vytvořit pouze v případě, že ovládá určený počet požadovaných států." # todo: CHANGED (predtym: Akt sloučení a vytvoření nové [Concept('concept_country','země')|l] z několika [concept_countries] se nazývá sjednocení.)
 concept_order: "Rozkaz"
 concept_orders: "Rozkazy"
 concept_ordered: "Rozkázáno"
 concept_order_desc: "[Concept('concept_commander','Velitelům')] lze zadat $concept_orders$, které je přimějí usilovat o různé vojenské cíle v závislosti na jejich aktuální pozici. Všichni $concept_commanders$ mají několik základních $concept_orders$, ale jejich [Concept('concept_character_trait','charakterové rysy')] mohou tomu kterému $concept_commander$ přidat speciální $concept_orders$ k použití.\n\nZákladní příkazy [Concept('concept_general','generál')] jsou:\n[GetBasicGeneralOrdersBreakdown]" # todo: CONCEPT CASE
 concept_naval_mission: "Námořní mise"
 concept_naval_missions: "Námořní mise"
 concept_naval_mission_short: "Mise"
 concept_naval_missions_short: "Mise"
 concept_naval_mission_desc: "[Concept('concept_fleet','Loďstvo')] lze přiřadit k $concept_naval_missions$, aby určily, na co se mají soustředit. $concept_naval_mission_short$ probíhá v souboru propojených [Concept('concept_sea_node','námořních uzlů')] a má různé efekty v závislosti na typu $concept_naval_mission_short$." # todo: CONCEPT CASE
 concept_naval_mission_area_limit: "Limit oblasti námořní mise"
 concept_naval_mission_area_limit_desc: "Maximální počet [Concept('concept_sea_node','mořské regiony')] které lze přiřadit k $concept_naval_mission_short$. Tento limit je určen [Concept('concept_commander_rank','hodnost velitele')] přiřazeného [Concept('concept_admiral','admirála')]." # todo: CONCEPT CASE
 concept_party: "Strana"
 concept_parties: "Strany"
 concept_party_possessive: "Strany"
 concept_party_desc: "$concept_party$ je politická entita, která se účastní [Concept('concept_election','voleb')]. Skládají se z jedné nebo více [Concept('concept_interest_group','zájmových skupin')], jejichž [Concept('concept_ideology','ideologie')|l] jsou alespoň částečně kompatibilní. Tyto zájmové skupiny jsou posíleny [Concept('concept_votes','hlasy')], které strana získala proporcionálně k jejich [Concept('concept_clout','politickému vlivu')]. Individuální zájmové skupiny nemohou být zahrnuty do [Concept('concept_government','vlády')] bez ostatních členů strany." # todo: CHANGED (predtym: $concept_party$ je politická entita, která se účastní [Concept('concept_election','voleb')]. Skládají se z jedné nebo ví)
 concept_party_leader: "Vůdce strany"
 concept_party_leader_short: "Vůdce"
 concept_party_leader_desc: "[Concept('concept_leader','Vůdce')] zájmové skupiny v [Concept('concept_party','straně')] s největším [Concept('concept_clout','politickým vlivem')] se považuje za vůdce politické strany. Vůdce slouží jako [Concept('concept_party_whip','stranický bič')|l]."
 concept_party_leaders: "Vůdci strany"
 concept_party_leaders_short: "Lídři"
 concept_party_leaders_desc: "$concept_party_leader_desc$"
 concept_suppress: "Potlačení"
 concept_suppressed: "Potlačeno"
 concept_suppressing: "Potlačování"
 concept_suppression: "Potlačení"
 concept_suppress_desc: "Potlačované [Concept('concept_political_movement','politické hnutí')|l] je pro [Concept('concept_pop','populaci')] méně atraktivní. Vaše základní schopnost potlačení je určena vaším [Concept('concept_law','zákonem')] [SelectLocalization(GetPlayer.IsValid,'concept_suppress_desc_added','Svoboda projevu')]. $concept_suppressing$ [Concept('concept_interest_group','$concept_interest_groups$')|l] stojí [Concept('concept_authority','autoritu')]." # todo: CHANGED (predtym: [concept_suppressed] [Concept('concept_political_movement','politické hnutí')|l] je pro [Concept('concept_pop','populaci)
 concept_suppress_desc_added: "[GetLawGroup('lawgroup_free_speech').GetName]"
 concept_bolster: "Posílení"
 concept_bolstered: "Posíleno"
 concept_bolsters: "Posílení"
 concept_bolstering: "Posílení"
 concept_bolster_desc: "Posílené politické hnutí je atraktivnější pro podporu ze strany [Concept('concept_pop','populace')]. Vaše základní schopnost posílení je určena vaším [Concept('concept_law','zákonem')] [SelectLocalization(GetPlayer.IsValid,'concept_bolster_desc_added','Svoboda projevu')]. $concept_bolstering$ zájmové skupiny stojí [Concept('concept_authority','autoritu')]." # todo: CHANGED (predtym: [concept_bolstered] [concept_political_movement] je atraktivnější pro podporu ze strany [Concept('concept_pop','populace)
 concept_bolster_desc_added: "[GetLawGroup('lawgroup_free_speech').GetName]"
 concept_journal_entry: "Záznam v deníku"
 concept_journal: "Deník"
 concept_journal_entries: "Záznamy deníku"
 concept_journal_entry_desc: "$concept_journal_entries$ sledují probíhající události ve vaší zemi. Mohou představovat příležitosti nebo výzvy, připomínat vám sliby, které jste udělali, nebo varovat před potenciálními krizemi, které se mohou objevit.\n\n$concept_journal_entries$ se obvykle ukončí a jsou odstraněny z vašeho $concept_journal$, když jsou považovány za #bold Complete#!. Ne všechny $concept_journal_entries$ mohou být #bold Completed#! – některé mohou pouze #bold Fail#!, #bold Time Out#!, nebo budou odstraněny za určitých podmínek." # todo: CHANGED (predtym: $concept_journal_entries$ sledují probíhající události ve vaší zemi. Mohou představovat příležitosti nebo výzvy, připomí)
 concept_political_lobby: "Politické lobby"
 concept_political_lobby_short: "Lobby"
 concept_political_lobbies_short: "Lobby"
 concept_political_lobby_short_possessive: "lobbistické"
 concept_political_lobbies: "Politická lobby"
 concept_political_pro_lobby: "Pro-lobby"
 concept_political_pro_lobbies: "Pro-lobby"
 concept_political_anti_lobby: "Antilobby"
 concept_political_anti_lobbies: "Antilobby"
 concept_political_lobby_desc: "$concept_political_lobby$ je sdružení [Concept('concept_interest_group','zájmových skupin')], které jsou buď proti, nebo naopak, podporují určitou [Concept('concept_country','zemi')].\n\n$concept_interest_groups$ v lobby získávají [Concept('concept_approval','spokojenost')|l] na základě úrovně[Concept('concept_political_lobby_appeasement','vyhovění')|l] lobby.\n\nLobby usnadňují nebo komplikují provádění [Concept('concept_diplomatic_action','diplomatických akcí')] proti cílové zemi, tím, že ovlivňují náklady na [Concept('concept_influence','vliv')|l] a zda země bude souhlasit s návrhy. $concept_political_lobbies_short$ v [Concept('concept_subject','závislém území')], které cílí na svého [Concept('concept_overlord','vládce')|l], ovlivňují [Concept('concept_liberty_desire','touhu po svobodě')]. Tyto efekty se škálují podle [Concept('concept_clout','politického vlivu')] lobby.\n\n[AddLocalizationIf( HasDlcFeature('lobbies'),'concept_political_lobby_desc_DEMANDS_OPPORTUNITIES')] Lobby se mohou formálně vytvořit náhodně, když nastane [Concept('concept_diplomatic_catalyst','diplomatický katalyzátor')|l], nebo když jedna země [Concept('concept_fund_lobbies','financuje lobbisty')] v jiné." # todo: CHANGED (predtym: $concept_political_lobby$ je sdružení [Concept('concept_interest_group','zájmových skupin')], které jsou buď proti, nebo)
 concept_political_lobby_desc_DEMANDS_OPPORTUNITIES: "Čas od času, lobby vznášejí [Concept('concept_political_lobby_demand','požadavky')|l]. Pokud je lobby podpořena [Concept('concept_interest_group','zájmovými skupinami')] [Concept('concept_in_government','ve vládě')|l], lobby také představují [Concept('concept_political_lobby_opportunity','příležitosti')|l].\n\n" # todo: CHANGED (predtym: Čas od času $concept_political_lobbies_short$ vznášejí [Concept('concept_political_lobby_demand','požadavky')|l]. Pokud )
 concept_political_lobby_appeasement: "Vyhovění"
 concept_political_lobby_appease: "Vyhovět"
 concept_political_lobby_appeasing: "Vyhovování"
 concept_political_lobby_appeasement_desc: "Vyhovění [Concept('concept_political_lobby','politické lobby')|l] ovlivňuje [Concept('concept_approval','spokojenost')|l] lobbistů [Concept('concept_interest_group','zájmových skupin')].\n\n$concept_political_lobby_appeasement$ se mění na základě vašich [Concept('concept_diplomatic_action','diplomatických akcí')] proti zemi lobistů. $concept_political_pro_lobbies$ je vyhověno přátelskými akcemi, zatímco $concept_political_anti_lobbies$ je vyhověno nepřátelskými akcemi." # todo: CHANGED (predtym: [concept_political_lobby_appeasement] [concept_political_lobby] ovlivňuje [Concept('concept_approval','spokojenost')|l] )
 concept_political_lobby_opportunity: "Příležitost lobby"
 concept_political_lobby_opportunities_short: "Příležitosti"
 concept_political_lobby_opportunity_short: "Příležitost"
 concept_political_lobby_opportunity_desc: "Speciální [Concept('concept_journal_entry','záznam v deníku')|l] nabízený [Concept('concept_political_lobby','politickou lobby')] podporovanou [Concept('concept_interest_group','zájmovými skupinami')] [Concept('concept_in_government','ve vládě')|l].\n\nTyto poskytují zvláštní šanci dosáhnout něčeho, co by normálně bylo nemožné."
 concept_political_lobby_demand: "Požadavek lobbistů"
 concept_political_lobby_demands_short: "Požadavky"
 concept_political_lobby_demand_short: "Požadavek"
 concept_political_lobby_demand_desc: "[Concept('concept_journal_entry','Záznam v deníku')] předložený [Concept('concept_political_lobby','politickou lobby')].\n\nSplnění požadavku zvýší úroveň[Concept('concept_political_lobby_appeasement','vyhovění')|l] lobby."
 concept_diplomatic_catalyst: "Diplomatický katalyzátor"
 concept_diplomatic_catalyst_short: "Katalyzátor"
 concept_diplomatic_catalysts_short: "Katalyzátory"
 concept_diplomatic_catalysts: "Diplomatické katalyzátory"
 concept_diplomatic_catalyst_desc: "$concept_diplomatic_catalyst$ je v podstatě jakákoliv diplomatická událost, která může vytvořit [Concept('concept_political_lobby','politickou lobby')] nebo změnit postoj [Concept('concept_country','země')] vůči vám.\n\nKatalyzátory mohou být jakékoli změny na světovém jevišti, například:\n$EFFECT_LIST_BULLET$[Concept('concept_diplomatic_action','diplomatická akce')]\n$EFFECT_LIST_BULLET$Akce provedené v [Concept('concept_diplomatic_play','diplomatické hře')]\n$EFFECT_LIST_BULLET$Změna úrovně [Concept('concept_relations','vztahů')]" # todo: CHANGED (predtym: $concept_diplomatic_catalyst$ je v podstatě jakákoliv diplomatická událost, která může vytvořit [Concept('concept_politi)
 concept_end_of_discussion_factor: "Faktor zbytečné diskuse"
 concept_end_of_discussion_factor_desc: "$concept_end_of_discussion_factor$ znamená, že [Concept('concept_interest_group','zájmové skupiny')|l] ve [Concept('concept_government','vládě')] považují další diskusi o oprávněnosti aktuálně schvalovaného [Concept('concept_law','zákona')] za zbytečnou. Čím nižší je tento faktor, tím menší nátlak vyvíjí na možnost, že schválení může mít $concept_enactment_advance_short$ nebo nastane $concept_enactment_stall_short$."
 concept_enactment_of_laws: "Schvalování zákonů"
 concept_enactment_of_laws_enactment: "Uzákonění"
 concept_enactment_of_laws_enact: "Uzákonit"
 concept_enactment_of_laws_enacting: "Uzákoňování"
 concept_enactment_of_laws_enacted: "Uzákoněn"
 concept_enactment_of_laws_desc: "Proces prosazení nového [Concept('concept_law','zákona')] prostřednictvím několika [Concept('concept_enactment_phase','$concept_enactment_phases_short|q$')|l] schvalování v zákonodárném sboru dané [Concept('concept_country','země')]. V pravidelných intervalech se testuje šance na [Concept('concept_enactment_success','prosazení')] zákona. Délka těchto intervalů se může lišit podle konkrétního zákona a také závisí na [Concept('concept_legitimacy','legitimnosti')] [Concept('concept_government','vlády')|l]. Pokud zákon nepostoupí do další [Concept('concept_enactment_phase','fáze schvalování')|l], může nastat [Concept('concept_enactment_advance','pokrok')],  [Concept('concept_enactment_debate','diskuze')] nebo [Concept('concept_enactment_stall','obstrukce')] — což ovlivní jeho šanci na schválení v dalším testu nebo přinese jiné důsledky pro vaši zemi.\n\n$concept_enactment_of_laws_potential$" # todo: CHANGED (predtym: Proces prosazení nového [concept_law] prostřednictvím několika [Concept('concept_enactment_phase','$concept_enactment_ph)
 concept_enactment_of_laws_potential: "Aby mohl být zákon [Concept('concept_enactment_of_laws','schválen')], musí být [Concept('concept_endorse_oppose','podpořen')] alespoň jednou zájmovou skupinou [Concept('concept_in_government','ve vládě')|l], mít podporu aktuálního [Concept('concept_political_movement','politického hnutí')], nebo mít z jiného důvodu kladnou šanci [Concept('concept_enactment_success','na prosazení')]." # todo: CHANGED (predtym: Aby mohl být [concept_law] [Concept('concept_enactment_of_laws','schválen')], musí být [Concept('concept_endorse_oppose')
 concept_enactment_success: "Úspěšné uzákonění zákona"
 concept_enactment_success_short: "Úspěch"
 concept_enactment_successes: "Úspěchy"
 concept_enactment_success_desc: "$concept_enactment_success$ naznačuje procentuální šanci, že [Concept('concept_law','zákon')|l] postoupí do další [Concept('concept_enactment_phase','fáze schvalování')|l] při dalším milníku. Je rovno [Concept('concept_base_success_chance','základní šanci na úspěch')|l] plus jakýmkoliv účinkům nahromaděným během procesu schvalování. $concept_base_success_chance$ se zvyšuje podporou [Concept('concept_interest_group','zájmových skupin')] [Concept('concept_in_government','ve vládě')|l], [Concept('concept_political_movement','politických hnutí')], které mají [Concept('concept_activism','aktivismus hnutí')|l] na úrovni alespoň $RADICALISM_AGITATING$ #v 25%#!, nebo [Concept('concept_endorse_oppose','podporou')] od [Concept('concept_ruler','vládcove')] [Concept('concept_ideology','ideologie')|l]." # todo: CONCEPT CASE
 concept_enactment_advance: "Pokrok uzákonění"
 concept_enactment_advance_short: "Pokrok"
 concept_enactment_advance_desc: "$concept_enactment_advance$ naznačuje procentuální šanci, že proces přijetí [Concept('concept_law','zákona')] na následujícím milníku nějakým způsobem pokročí, i když nebude dokončen nebo postoupí do další [Concept('concept_enactment_phase','fáze schvalování')|l]. Je odvozen ze [Concept('concept_base_success_chance','základní šance na úspěch')|l]." # todo: CONCEPT CASE
 concept_enactment_debate: "Diskuze o zákoně"
 concept_enactment_debate_short: "Diskuze"
 concept_enactment_debate_short_debated: "Diskutováno"
 concept_enactment_debate_desc: "$concept_enactment_debate$ naznačuje procentuální šanci, že proces přijetí [Concept('concept_law','zákona')] na následujícím milníku narazí na nějakou komplikaci. Čím nižší jsou celkové šance na [Concept('concept_enactment_success','úspěch')], [Concept('concept_enactment_advance','pokrok uzákonění')] a [Concept('concept_enactment_stall','Obstrukci')], tím větší je šance na to, že nastane $concept_enactment_debate_short$." # todo: CONCEPT CASE
 concept_enactment_stall: "Obstrukce"
 concept_enactment_stall_short: "Obstrukce"
 concept_enactment_stall_desc: "$concept_enactment_stall$ naznačuje procentuální šanci, že proces přijetí [Concept('concept_law','zákona')] bude výrazně zbržděn na cestě k dalšímu milníku. Jeho základní šance je rovna celkovému [Concept('concept_clout','politickému vlivu')] opozičních [Concept('concept_interest_group','zájmových skupin')],  jejichž [Concept('concept_approval','spokojenost')|l] je na úrovni $ig_approval_unhappy$ nebo $ig_approval_angry$."
 concept_base_success_chance: "Základní šance na úspěch"
 concept_base_success_chance_desc: "$concept_base_success_chance$ je rovna celkovému [Concept('concept_clout', 'politickému vlivu')|l] od podporující [Concept('concept_interest_group','zájmové skupiny')|l] ve [Concept('concept_government','vládě')|l] plus/mínus [Concept('concept_political_movement_support','podpory')] získané od jakýchkoli relevantních [Concept('concept_political_movement','politických hnutí')]."
 concept_advance_factor: "Faktor pokroku"
 concept_advance_factor_desc: "$concept_advance_factor$ je statický faktor používaný k určení [Concept('concept_enactment_advance','pokroku přijetí')] tím, že škáluje s [Concept('concept_base_success_chance','základní šanci na Úspěch')]."
 concept_migration_pull: "Migrační přitažlivost"
 concept_migration_pull_short: "Přitažlivost"
 concept_migration_pull_desc: "$concept_migration_pull$ je schopnost [Concept('concept_state','státu')] přitáhnout migranty. Závisí převážně na průměrným [Concept('concept_sol','životném standardu')] mezi [Concept('concept_pop','populaci')] ve státě, ale může být modifikován dalšími faktory. Jakákoliv [Concept('concept_unemployed','nezaměstnanost')|l] ve státě sníží migrační přitažlivost. Hodnota je srovnávána s jinými státy, mezi kterými by mohlo dojít k migraci, aby bylo určeno, kterým směrem migranti pravděpodobně půjdou.\n\n$concept_migration_pull$ je také primární faktor používaný k určení [Concept('concept_mass_migration_pull','přitažlivosti hromadné migrace')|l] [Concept('concept_country','země')|l]." # todo: CHANGED (predtym: $concept_migration_pull$ je schopnost [concept_state] přitáhnout migranty. Závisí převážně na průměrném [Concept('concep)
 concept_cultural_community: "Kulturní komunita"
 concept_cultural_communities: "Kulturní komunity"
 concept_cultural_community_short: "Komunita"
 concept_cultural_community_desc: "$concept_cultural_community$ naznačuje, že v [Concept('concept_state','státě')] je přítomna určitá [Concept('concept_culture','kultura')|l], což umožňuje [Concept('concept_pop','populaci')] ve vašem [Concept('concept_market','trhu')] migrovat do tohoto státu.\n\nNově vytvořená komunita bude mít dočasně nižší [Concept('concept_acceptance','přijetí')|l], to ale během času zmizí. Nový [Concept('concept_law','zákon')|l], který změní [Concept('concept_acceptance','přijetí')|l], může také potřebovat čas na realizaci, a tak [Concept('concept_pop','populace')] z této komunity budou dočasně mít jiné [Concept('concept_acceptance','přijetí')|l] než je normální." # todo: CHANGED (predtym: $concept_cultural_community$ naznačuje, že v [concept_state] je přítomna určitá [Concept('concept_culture','kultura')|l])
 concept_lower_strata: "Nižší třída"
 concept_lower_strata_short: "Nižší"
 concept_lower_strata_desc: "$concept_lower_strata$ tvoří [Concept('concept_pop','populace')|l] v [Concept('concept_profession','profesích')], která zahrnují manuální nebo opakující se práci, jež vyžaduje málo nebo žádné [Concept('concept_pop_qualifications','kvalifikace')|l] a přináší nízké [Concept('concept_building_wage','mzdy')|l].\n\n$STRATA_CONCEPTS_DEPEND_ON_SOCIAL_HIERARCHY$"
 concept_middle_strata: "Střední třída"
 concept_middle_strata_short: "Střední"
 concept_middle_strata_desc: "$concept_middle_strata$ se skládá z [Concept('concept_pop','populací')|l] se specializovanými [Concept('concept_profession','profesemi')], pro které je obtížnější získat [Concept('concept_pop_qualifications','kvalifikace')|l]. To jim poskytuje více možností na trhu práce a tím i vyšší [Concept('concept_building_wage','mzdy')|l].\n\n$STRATA_CONCEPTS_DEPEND_ON_SOCIAL_HIERARCHY$" # todo: CONCEPT CASE
 concept_upper_strata: "Vyšší třída"
 concept_upper_strata_short: "Vyšší"
 concept_upper_strata_desc: "$concept_upper_strata$ se skládá z [Concept('concept_pop','populací')|l], která se [Concept('concept_pop_qualifications','kvalifikuje')] pro určité [Concept('concept_profession','profese')|l] - převážně na základě svého [Concept('concept_wealth','bohatství')|l]. Obvykle nejsou dostupné pro populaci s nízkou mírou společenského [Concept('concept_acceptance','přijetí')|l]. Mají často [Concept('concept_ownership_share','podíly na vlastnictví')|l] ve svých [Concept('concept_building','budovách')], pobírají [Concept('concept_dividends','dividendy')|l], [Concept('concept_budget_interest','úroky')] z rozpočtu a kromě toho také standardní [Concept('concept_building_wage','mzdy')|l] z budov\n\n$STRATA_CONCEPTS_DEPEND_ON_SOCIAL_HIERARCHY$" # todo: CHANGED (predtym: $concept_upper_strata$ se skládá z [concept_pops], která se [Concept('concept_pop_qualifications','$concept_qualify|q$'))
 concept_incoming_units: "Jednotky v procesu náboru"
 concept_incoming_units_short: "Nábor"
 concept_incoming_units_desc: "Každá jednotka v procesu náboru má buď úroveň [Concept('concept_military_building','vojenské budovy')] ve [Concept('concept_construction_queue','stavební frontě')], nebo má [Concept('concept_military_building','vojenskou budovu')], která se pokouší najímat [Concept('concept_pop','populaci')] za účelem vytvoření [Concept('concept_unit','vojenské jednotky')]."
 concept_neighbors: "Sousedé"
 concept_neighboring: "Sousední"
 concept_neighbors_desc: "Dvě [Concept('concept_country','země')|l] se považují za sousedy, pokud sdílí pozemní hranici nebo obě vlastní pobřežní [Concept('concept_state','státy')|l], které jsou spojeny s tím samým [Concept('concept_sea_node','námořním uzlem')]." # todo: CHANGED (predtym: Dvě [Concept('concept_country','země')|l] se považují za [concept_neighbors], pokud sdílí pozemní hranici nebo obě vlast)
 concept_welfare_payments: "Sociální dávky"
 concept_welfare_payments_desc: "$concept_welfare_payments$ jsou formou přímé dotace, kterou [Concept('concept_country','země')|l] poskytuje všem populacím v [Concept('concept_workforce','pracovní síle')], kteří dostávají mzdy nižší než definovaná část [Concept('concept_normal_wage','standardní mzdy')]." # todo: CONCEPT CASE
 concept_sea_node: "Námořní uzel"
 concept_sea_nodes: "Námořní uzly"
 concept_sea_node_desc: "Křižovatka nebo bod podél námořní [Concept('concept_shipping_lane','námořní trasy')] představující část oceánu. $concept_shipping_lanes$ vždy volí trasu s nejkratší cestovní vzdáleností mezi dvěma pobřežními [Concept('concept_state','státy')]. Za každou násobnou hodnotu očekávané cestovní vzdálenosti (#v [GetDefine('NEconomy','SEA_DISTANCE_EXPECTED_TRAVEL_DISTANCE')]#!) se do přepravních nákladů přičte #v [GetDefine('NEconomy','SHIPPING_LANE_MERCHANT_MARINE_COST_SCALING')|=-%0]#!." # todo: CONCEPT CASE
