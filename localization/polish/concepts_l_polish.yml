 concept_power_bloc_short: "Blok"
 concept_power_bloc_shorts: "Bloky"
 concept_power_bloc_desc: "Mocenské bloky sou nadnárodní asociace, které vede [Concept('concept_great_power','velmoc')|l], [Concept('concept_major_power','regionální mocnost')|l] nebo [Concept('concept_unrecognized_power','neuznávaná velmoc')|l], a které [Concept('concept_power_bloc_leader','vůdci mocenského bloku')|l] a [Concept('concept_power_bloc_member','členům mocenského bloku')] poskytují mocné efekty. Slouží [Concept('concept_power_bloc_leader','lídrům bloků')] při budování jejich sféry vlivu tím, že budují svou [Concept('concept_power_bloc_leverage_advantage','pákovou výhodu')] v [Concept('concept_country','zemích')] s cílem přimět je k připojení k [Concept('concept_power_bloc','mocenskýmu bloku')]."
 concept_power_bloc_rank: "Hodnost mocenského bloku"
 concept_power_bloc_rank_short: "Hodnost"
 concept_power_bloc_rank_desc: "Hodnost [Concept('concept_power_bloc','mocenských bloků')|l] se zakládá výhradně na celkové [Concept('concept_prestige','prestiži')] svých [Concept('concept_power_bloc_member','členů')] ve srovnání se všemi ostatními mocenskými bloky." # todo: CHANGED (predtym: Hodnost [Concept('concept_power_bloc','mocenských bloků')|l] se zakládá výhradně na celkové [Concept('concept_prestige',)
 concept_power_bloc_leader: "Lídr mocenského bloku"
 concept_power_bloc_leader_possessive: "Vůdcova mocenského bloku"
