 concept_cultural_trait: "Kulturní znak"
 concept_cultural_traits: "Kulturní vlastnosti"
 concept_religious_trait: "Náboženský rys"
 concept_religious_traits: "Náboženské rysy"
 concept_discrimination_trait_desc: "Aspekty [Concept('concept_culture','kultura')] nebo [Concept('concept_religion','náboženství')], které určují, jak [Concept('concept_acceptance_status','přijatý')] [Concept('concept_pop','populace')] této $concept_culture$ nebo $concept_religion$ jsou v závislosti na tom, jak jsou podobné [Concept('concept_primary_cultures','primární kultura')] a [Concept('concept_state_religion','státní náboženství')] $concept_country$ a jaký [GetLawType('law_national_supremacy').GetGroup.GetName] [Concept('concept_law','zákon')] $concept_country$ aktuálně má.\n\nPro $concept_culture$ jsou těmito aspekty [Concept('concept_heritage_trait','původ')], [Concept('concept_language_trait','jazyk')] a jakékoli [Concept('concept_tradition_trait','tradice')], které může mít. $concept_religion$ má pouze $concept_heritage_trait$.\n\n$concept_heritage_trait_short$ a $concept_language_traits$ také patří do širších [Concept('concept_discrimination_trait_group','skupiny diskriminačních vlastností')] podobných $concept_discrimination_traits_short$." # todo: CONCEPT CASE
 concept_discrimination_trait_group: "Skupina diskriminačních vlastností"
 concept_discrimination_trait_groups: "Skupiny diskriminačních vlastností"
 concept_discrimination_trait_group_short: "Skupina rysů"
