 concept_exile_desc: "[Concept('concept_character','Postava')] může být vyhnána pomocí akce postavy #b Poslat disidenta do exilu#!. $concept_character$ se stává [Concept('concept_agitator','agitátorem')] a je vyhoštěna z vaší země.\n\nVyhnána postava může být pozvána do jakéhokoli [Concept('concept_country','země')|l] pomocí akce postavy #b Pozvat exulanta#!, kde okamžitě odstartuje nebo se připojí k [Concept('concept_political_movement','politickému hnutí')] pro tuto zemi v souladu s jeji [Concept('concept_ideology','ideologii')]. Pokud jsou všechny jejich [Concept('concept_endorse_oppose', 'podporované')] [Concept('concept_law','zákony')|l] již aktivní, když přijdou, pozvaný agitátor zůstane nečinný.\n\nVyhnána postava může být pozvána pouze v případě, že jejich [Concept('concept_acceptance_status','status přijetí')|l] je ve vaší [Concept('concept_country','zemi')] jedním z následujících : $SECOND_RATE_CITIZEN_GC_LINK$ nebo $FULL_ACCEPTANCE_GC_LINK$." # todo: CHANGED (predtym: [Concept('concept_character','Postava')] může být $concept_exiled$ pomocí akce postavy b Poslat disidenta do exilu !. [c)
 concept_siberian_exile: "Vyhnanství na Sibiři" # todo: NEW TRANSLATION
