 concept_landing_progress: "Pokrok vylodění"
 concept_landing_progress_desc: "Úroveň pokroku vylodění představuje, kolik [Concept('concept_occupation','okupace')|l] získala útočíci [Concept('concept_country','země')|l] z napadeného [Concept('concept_state','státu')]. Pokud $concept_landing_progress$ dosáhne #v 100%#!, #b Námořní invaze#! je úspěšná a bude založena [Concept('concept_front','fronta')|l]." # todo: CONCEPT CASE
 concept_naval_invasion_support: "Podpora námořní invaze"
 concept_naval_invasion_support_desc: "$concept_naval_invasion_support$ je srovnání množství [Concept('concept_ship','lodí')] přidělených k námořní invazi s množstvím [Concept('concept_battalion','praporů')] zapojených do stejné invaze. Každý útočící prapor vyžaduje flotilu, aby se vyhnul jakýmkoli negativním postihům při vylodění." # todo: CHANGED (predtym: $concept_naval_invasion_support$ je srovnání množství [Concept('concept_ship','$concept_ships|q$')] přidělených k námořn)
 concept_capitulation_desire: "Touha po kapitulaci"
 concept_capitulation_desire_desc: "[Concept('concept_country','Země')] ovládaná AI se pokusí kapitulovat, pokud tato hodnota dosáhne 0 nebo více."
 concept_risk: "Riziko"
 concept_risk_desc: "Riziko konkrétního typu [Concept('concept_terrain','terénu')] ovlivňuje množství [Concept('concept_casualties','ztrát')] a [Concept('concept_wounded','zranění')|l], které by mohli být výsledkem [Concept('concept_battle','bitvy')]."
 concept_terrain_labels: "Popisky terénu"
 concept_terrain_labels_desc: "Popisek [Concept('concept_terrain','terénu')] je seskupení několika terénních typů. [Concept('concept_character_trait','$concept_character_traits|q$')] mohou mít [Concept('concept_modifier','modifikátory')|l], které ovlivňují všechny terénní typy s konkrétním popiskem terénu." # todo: CHANGED (predtym: Popisek [concept_terrain] je seskupení několika [concept_terrain] typů. [Concept('concept_character_trait','$concept_cha)
 concept_job_satisfaction: "Spokojenost s prací"
 concept_job_satisfaction_satisfied: "Spokojeno"
 concept_job_satisfaction_dissatisfied: "Nespokojený"
 concept_job_satisfaction_desc: "Populace mohou být spokojeni nebo nespokojeni se svými zaměstnáními na základě řady faktorů, jako je jejich [Concept('concept_sol','životní standard')|l] nebo [Concept('concept_building_wage','mzda')|l]. To určuje, zda si budou hledat hledají nové [Concept('concept_employment','zaměstnání')|l], nebo ne."
 concept_employment: "Zaměstnání"
 concept_employed: "Zaměstnaný"
 concept_employees: "Zaměstnanci"
 concept_employment_desc: "[Concept('concept_pop','Populace')] pracující v [Concept('concept_building','budově')] je považována za zaměstnanou. Zaměstnání poskytuje populaci [Concept('concept_building_wage','mzdu')] z budovy. Zaměstnaná populace může změnit zaměstnání, pokud se objeví práce s lepší mzdou, a pokud pro ni má potřebné [Concept('concept_pop_qualifications','kvalifikace')|l]." # todo: CONCEPT CASE
