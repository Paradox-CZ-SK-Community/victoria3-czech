 concept_ideology: "Ideologie"
 concept_ideologies: "Ideologie"
 concept_ideology_possessive: "Ideologie"
 concept_ideology_desc: "$concept_ideology$ [Concept('concept_interest_group','zájmové skupiny')|l] ovlivňuje, které [Concept('concept_law','zákony')|l] bude [Concept('concept_endorse_oppose','podporovat')] a které ne. Jejich postoj k zákonům, které jsou v současnosti v platnosti v [Concept('concept_government','zemi')], má malé, trvalé účinky na [Concept('concept_approval','spokojenost')|l] [Concept('concept_interest_group','zájmových skupin')|l]. Zatímco se země snaží [Concept('concept_enactment_of_laws','uzákonit')|l] nový zákon, větší, ale dočasný účinek se vztahuje na to, který zákon bude odstraněn a který se dostane do platnosti. Tento dočasný efekt nakonec [Concept('concept_decay','odezní')], zanechávajíc pouze trvalý, objektivní vliv na spokojenost." # todo: CHANGED (predtym: $concept_ideology$ [Concept('concept_interest_group','zájmové skupiny')|l] ovlivňuje, které [Concept('concept_law','záko)
 concept_presidency_stability: "Stabilita prezidentství"
 concept_presidency_stability_short: "Stabilita"
 concept_presidency_stability_desc: "$concept_presidency_stability$ je metrika pro měření úrovně nepokojů v jednom ze tří [Concept('concept_presidency','prezidentství')|l] koloniální Indie.\n\n#title Stabilita [Concept('concept_presidency','prezidentství')] spadá do jedné ze čtyř kategorií:#! #indent_newline:3 \n#r Kritická#!: #v [GetPlayer.MakeScope.ScriptValue('uneasy_raj_stability_critical_lower_bound')]#!-#v [GetPlayer.MakeScope.ScriptValue('uneasy_raj_stability_critical_upper_bound')]#!\n#b Nízká#!: #v [GetPlayer.MakeScope.ScriptValue('uneasy_raj_stability_low_lower_bound')]#!-#v [GetPlayer.MakeScope.ScriptValue('uneasy_raj_stability_low_upper_bound')]#!\n#b Střední#!: #v [GetPlayer.MakeScope.ScriptValue('uneasy_raj_stability_medium_lower_bound')]#!-#v [GetPlayer.MakeScope.ScriptValue('uneasy_raj_stability_medium_upper_bound')]#!\n#b Vysoká#!: #v [GetPlayer.MakeScope.ScriptValue('uneasy_raj_stability_high_lower_bound')]#!-#v [GetPlayer.MakeScope.ScriptValue('uneasy_raj_stability_high_upper_bound')]#!#!\n\n#title Následující podmínky v [Concept('concept_presidency','prezidentství')] #r snižují#! jeho stabilitu:#! #indent_newline:3 \n• [Concept('concept_turmoil','Nepokoje')] ve [Concept('concept_state', 'státech')] [Concept('concept_presidency','prezidentství')]\n• [Concept('concept_subject','Závislé země')] s #bold vysokou#! [Concept('concept_liberty_desire','touhou po svobodě')] v [Concept('concept_presidency','prezidentství')]#!\n\n#title Následující podmínky ve Východoindické společnosti #r snižují#! stabilitu:#! #indent_newline:3 \n• #bold Nízká#! [Concept('concept_approval','spokojenost')|l] [GetInterestGroupVariant('ig_landowners',GetPlayer).GetNameWithCountryVariant]\n• #bold Vysoké#! [Concept('concept_taxes','daně')|l] ve Východoindické společnosti\n• #bold Nízké#! [Concept('concept_military_wage','vojenské mzdy')|l] ve Východoindické společnosti\n• Vůdcové s rysem [GetIdeology('ideology_utilitarian_leader').GetName] ve [Concept('concept_government','vládě')|l]\n• #bold Nemít#! [Concept('concept_law','zákon')|l] [GetLawType('law_total_separation').GetName]\n• #bold Nemít#! [Concept('concept_law','zákon')|l] [GetLawType('law_professional_army').GetName]\n• $EVENTS_AND_OTHER_EFFECTS$ #!\n\n#title Následující podmínky #g zvyšují#! stabilitu [Concept('concept_presidency','prezidentství')]:#! #indent_newline:3 \n• [Concept('concept_loyalist','Loajalisté')] ve [Concept('concept_state','státech')] [Concept('concept_presidency','prezidentství')]\n• [Concept('concept_subject','Závislé země')] s #bold nízkou#! [Concept('concept_liberty_desire','touhou po svobodě')] v [Concept('concept_presidency','prezidentství')]#!\n\n#title Následující podmínky ve Východoindické společnosti #g zvyšují#! stabilitu:#! #indent_newline:3 \n• Domorodé #b indické#! [Concept('concept_interest_group','zájmové skupiny')|l] [Concept('concept_in_government','ve vládě')|l]\n• #bold Vysoká#! [Concept('concept_approval','spokojenost')|l] [GetInterestGroupVariant('ig_landowners',GetPlayer).GetNameWithCountryVariant]\n• #bold Nízké#! [Concept('concept_taxes','daně')|l] ve Východoindické společnosti\n• #bold Vysoké#! [Concept('concept_military_wage','vojenské mzdy')|l] ve Východoindické společnosti\n• $EVENTS_AND_OTHER_EFFECTS$#!" # todo: CHANGED (predtym: $concept_presidency_stability$ je metrika pro měření úrovně nepokojů v jednom ze tří [Concept('concept_presidency','prez)
 concept_presidency: "Prezidentství"
 concept_presidency_desc: "$concept_presidencies$ jsou nejvyšší správní jednotky koloniální Indie. Existují tři prezidentství ($concept_presidencies$), jejichž hranice vymezují [Concept('concept_georegion','$concept_georegions|q$')|l].\n\n#bold Bengálské prezidentství#!\n#title $concept_georegions$:#! [GetGeographicRegion('geographic_region_bengal_old').GetName], [GetGeographicRegion('geographic_region_central_india_old').GetName] a [GetGeographicRegion('geographic_region_punjab_old').GetName].\n\n#bold Bombajské prezidentství#!\n#title $concept_georegions$:#! [GetGeographicRegion('geographic_region_bombay_old').GetName].\n\n#bold Madráské prezidentství#!\n#title $concept_georegions$:#! [GetGeographicRegion('geographic_region_madras_old').GetName]." # todo: CHANGED (predtym: $concept_presidencies$ jsou nejvyšší správní jednotky koloniální Indie. Existují tři prezidentství ($concept_presidencie)
 concept_presidencies: "Prezidentství"
 concept_court_intrigue: "Dvorní intrika"
 concept_court_intrigue_short: "Intrika"
 concept_court_intrigue_desc: "$concept_court_intrigue$ představují postup různých spiknutí, jejichž cílem je svrhnout $RULER_TITLE_MAHARAJA$ ([Concept('concept_ruler','vládce')|l]). Úroveň [Concept('concept_court_intrigue','dvorních intrik')|l] se sleduje v [Concept('concept_journal_entry','záznamu v deníku')|l] #b $je_sikh_sovereignty$#!. Pokud $concept_court_intrigue_short$ dosáhnou #v 100%#!, $RULER_TITLE_MAHARAJA$ ($concept_ruler$) bude zavražděn, [Concept('concept_empire_stability','stabilita říše')|l] se #bold vynuluje#! na #v 0#!, [Concept('concept_court_intrigue','intriky')|l] klesnou a na trůn usedne nový kandidát.\n\n#title Následující podmínky #g #b snižují#!#! úroveň dvorních intrik:#! #indent_newline:3 \n• $RULER_TITLE_MAHARAJA$ ([Concept('concept_ruler','vládce')|l]) je #b $Ranjit$ $Singh$#!\n• [GetCharacterTrait('ruthless').GetName] [Concept('concept_leader','vůdce')|l] [Concept('concept_in_government','ve vládě')|l] se [Concept('concept_approval','spokojeností')|l] nad #v 5#!\n• [GetCharacterTrait('compliant').GetName] [Concept('concept_leader','vůdce')|l] [Concept('concept_in_government','ve vládě')|l]\n• [Concept('concept_interest_group','Zájmová skupina')] [Concept('concept_ruler','vládce')|l] je [Concept('concept_powerful','mocná')|l]\n• Vysoká [Concept('concept_legitimacy','legitimita')|l]\n• $EVENTS_AND_OTHER_EFFECTS$ #!\n\n#title Následující podmínky #r #b zvyšují#!#! úroveň dvorních intrik:#! #indent_newline:3 \n• [GetCharacterTrait('reckless').GetName] [Concept('concept_ruler','vládce')|l]\n• Nízká [Concept('concept_popularity','popularita')|l] [Concept('concept_ruler','vládce')|l]\n• [GetCharacterTrait('ruthless').GetName] [Concept('concept_leader','vůdce')|l] [Concept('concept_in_government','ve vládě')|l] nebo [Concept('concept_in_opposition','v opozici')|l] se [Concept('concept_approval','spokojeností')|l] pod #v 0#!\n• [GetCharacterTrait('ambitious').GetName] [Concept('concept_leader','vůdce')|l] [Concept('concept_in_government','ve vládě')|l] nebo [Concept('concept_in_opposition','v opozici')|l] se [Concept('concept_approval','spokojeností')|l] pod #v 0#!\n• [Concept('concept_interest_group','Zájmová skupina')] [Concept('concept_ruler','vládce')|l] je [Concept('concept_marginalized','marginalizovaná')|l]\n• Nízká [Concept('concept_legitimacy','legitimita')|l]\n• $EVENTS_AND_OTHER_EFFECTS$#!" # todo: CHANGED (predtym: [concept_court_intrigue] představují postup různých spiknutí, aby byl $RULER_TITLE_MAHARAJA$ ([Concept('concept_ruler',')
 concept_empire_stability: "Stabilita říše"
 concept_empire_stability_short: "Stabilita"
 concept_empire_stability_desc: "$concept_empire_stability$ reprezentuje, jakou sílu má $RULER_TITLE_MAHARAJA$ ([Concept('concept_ruler','vládce')|l]). [Concept('concept_empire_stability','Stabilitu')] sleduje [Concept('concept_journal_entry','záznam v deníku')|l] #b $je_sikh_sovereignty$#! .\n\nAby se stabilita zvýšila, musí být legitimita nad #v 50#!. Pokud intrika dosáhne #v 100%#!, $RULER_TITLE_MAHARAJA$ (vládce) bude zavražděn, [Concept('concept_empire_stability','stabilita říše')|l] se #bold zresetuje#! na #v 0#!, úroveň intrik klesne a na trůn usedne nový kandidát.\n\n#title Následující podmínky #g #b zvyšují#!#! stabilitu říše:#! #indent_newline:3 \n• [Concept('concept_interest_group','Zájmová skupina')] [GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetNameWithCountryVariant] je [Concept('concept_in_government','ve vládě')|l]\n• [Concept('concept_interest_group','Zájmová skupina')] [GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetNameWithCountryVariant] je [Concept('concept_powerful','silná')|l]\n• [GetReligion('sikh').GetName] je [Concept('concept_state_religion','státním náboženstvím')]\n• [Concept('concept_law','Zákon')] [GetLawType('law_freedom_of_conscience').GetName] je [Concept('concept_enactment_of_laws','schválen')]\n• Události a jiné podmínky #!\n\n#title Následující podmínky #r #b snižují#!#! stabilitu říše:#! #indent_newline:3 \n• [Concept('concept_interest_group','Zájmová skupina')] [GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetNameWithCountryVariant] není [Concept('concept_in_government','ve vládě')|l]\n• [Concept('concept_court_intrigue','Dvorní intrika')] dosáhne #v 100%#!\n• Události a jiné podmínky #!" # todo: CHANGED (predtym: $concept_empire_stability$ reprezentuje, jakou sílu má $RULER_TITLE_MAHARAJA$ ([Concept('concept_ruler','vládce')|l]). [)
 concept_ottoman_integrity: "Rumelijská soudržnost"
 concept_ottoman_integrity_short: "Soudržnost"
 concept_ottoman_integrity_desc: "$concept_ottoman_integrity$ představuje stabilitu $dyn_c_ottoman_empire_adj$ v [GetStrategicRegion('region_balkans').GetName] [Concept('concept_strategic_region','strategickém regionu')] ohroženou [Concept('concept_secession','$concept_secessionist|q$')|l] [Concept('concept_political_movement','$concept_political_movements|q$')|l]. [Concept('concept_ottoman_integrity','$concept_ottoman_integrity_short|q$')] se sleduje v #b $je_great_eastern_crisis$#! [Concept('concept_journal_entry','záznam v deníku')].\n\n[Concept('concept_activism','Aktivismus hnutí')] všech $concept_secessionist$ $concept_political_movements$ v $dyn_c_ottoman_empire$ musí být #b pod#! #v 75#!, aby se $concept_ottoman_integrity_short$ zvýšila.\n\n#title Následující podmínky #g #b zvýší#!#! $concept_ottoman_integrity$:#! #indent_newline:3 \n• [Concept('concept_legitimacy','Legitimita')] v $dyn_c_ottoman_empire$ je #v 50#! nebo #b vyšší#!\n• $dyn_c_ottoman_empire$ není #r #b ve válce#!#!\n• $dyn_c_ottoman_empire$ #r #b nemá#!#! žádné rostoucí [Concept('concept_secession','separatista')] [Concept('concept_political_movement','politická hnutí')]\n• $dyn_c_ottoman_empire$ nedávno potlačilo [Concept('concept_secession','odtržení')]#!" # todo: CHANGED (predtym: $concept_ottoman_integrity$ představuje stabilitu $dyn_c_ottoman_empire_adj$ v [GetStrategicRegion('region_balkans').Get)
