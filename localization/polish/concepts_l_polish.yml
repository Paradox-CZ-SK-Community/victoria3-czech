 concept_language_trait_groups_short: "Skupiny jazyků"
 concept_language_trait_desc: "$concept_language_trait_short$ [Concept('concept_discrimination_trait','diskriminační rysy')] představují $concept_language_traits_short$ úzce spojené s [Concept('concept_culture','kulturou')]. Také patří do [Concept('concept_discrimination_trait_group','skupiny rysů')], širší rodiny podobných $concept_language_traits_short$." # todo: CONCEPT CASE
 concept_tradition_trait: "Rys tradice"
 concept_tradition_traits: "Rysy tradice"
