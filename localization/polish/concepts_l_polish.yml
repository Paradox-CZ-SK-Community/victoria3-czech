 concept_country_monopolized_short: "Monopolizováno"
 concept_country_monopoly_desc: "Státní monopol poskytuje [Concept('concept_country','zemi')] [Concept('concept_country_monopoly','monopol')|l] na určitou [Concept('concept_building','budovu')|l] tím, že ji uděluje výhradní práva na tuto [Concept('concept_building', 'průmyslovou budovu')]." # todo: CHANGED (predtym: [Concept('concept_country_monopoly','Státní monopol')] poskytuje [Concept('concept_country','zemi')] [Concept('concept_m)
 concept_company_charter: "Privilej společnosti"
 concept_company_charters: "Charty společnosti"
 concept_company_charter_short: "Charta"
 concept_company_charters_short: "Charty"
 concept_company_charter_desc: "[Concept('concept_country','Země')] mohou svým [Concept('concept_company','společnostem')] udělit privilej #italic (počeštěná varianta původně latinského slova Privilegium značícího právní výsadu)#!, která poskytuje [Concept('concept_company','společnosti')] určitá práva. Tato práva se mohou pohybovat od založení [Concept('concept_monopoly','monopolu')] po práva stavět různý [Concept('concept_building','průmysl')|l] nebo zřizovat [Concept('concept_regional_company_hq','regionální ředitelství společnosti')|l] v jiné zemi. [Concept('concept_country','Země')] mají určité množství bezplatných privilejí, které mohou udělovat. [Concept('concept_technology','Technologie')] a [Concept('concept_law','zákony')|l] mohou toto omezení zvýšit. Další privileje nad limit mohou být [Concept('concept_company','společnostem')] uděleny za cenu v podobě [Concept('concept_authority','autority')]." # todo: CHANGED (predtym: [Concept('concept_country','$concept_countries|q$')] mohou svým [Concept('concept_company','$concept_companies|q$')] udě)
 concept_company_hq: "Ředitelství společnosti"
