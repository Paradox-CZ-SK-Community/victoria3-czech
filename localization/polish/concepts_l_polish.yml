 concept_agitator_possessive: "agitátorův"
 concept_agitator_desc: "[Concept('concept_character_role','Role')] pro [Concept('concept_character','postavy')|l], které podporují [Concept('concept_political_movement','politické hnutí')|l] a činí ho atraktivnějším pro [Concept('concept_individual','jednotlivce')] patřící k jejich [Concept('concept_interest_group','zájmový skupině')]. Agitátoři mohou být pozváni pomocí akce postavy #b Pozvat [Concept('concept_exile','exulanta')]#! nebo se náhodně objeví ve vaší zemi díky šanci na objevení, která závisí na [Concept('concept_literacy','gramotnosti')] [Concept('concept_country','země')|l].\n\nAgitátoři mohou být pozváni pouze v případě, že jejich [Concept('concept_acceptance_status','status přijetí')|l] je ve vaší [Concept('concept_country','zemi')|l] na následující úrovni: $SECOND_RATE_CITIZEN_GC_LINK$ nebo $FULL_ACCEPTANCE_GC_LINK$.\n\n[Concept('concept_political_movement','Politické hnutí')], které podporují, je určeno jejich [Concept('concept_ideology', 'ideologií')|l]. Jeho vliv na vlastní [Concept('concept_political_movement','politické hnutí')|l] určuje [Concept('concept_popularity','popularita')|l] agitátora a jeho [Concept('concept_character_trait','charakterové rysy')|l]."
 AGITATORS_TITLE: "[Concept('concept_agitator','Agitátoři')]"
 concept_exile: "Exulant"
