 concept_power_bloc_leaders_extra_short: "Vůdci"
 concept_power_bloc_leader_desc: "Silná [Concept('concept_great_power','velmoc')|l], [Concept('concept_major_power','regionální mocnost')|l], nebo [Concept('concept_unrecognized_power','neuznávaná velmoc')|l] vedoucí [Concept('concept_power_bloc','mocenský blok')|l]. Mají tendenci více těžit z [Concept('concept_power_bloc','mocenskýho bloku')] než běžní [Concept('concept_power_bloc_member','členové')]."
