 concept_presence: "Přítomnost"
 concept_presence_desc: "$concept_presence$ [Concept('concept_fleet','loďstva')] ovlivňuje, jak efektivně vykonávají [Concept('concept_admiral','admirálové')|l] své [Concept('concept_order','rozkazy')|l]. $concept_presence$ se buduje postupně, zatímco je [Concept('concept_fleet','loďstvo')|l] umístněno v [Concept('concept_sea_node','uzlu')]."
 concept_mission_efficiency: "Efektivita mise"
 concept_mission_efficiency_desc: "$concept_mission_efficiency$ určuje, jak efektivně [Concept('concept_fleet','loďstvo')] vykonává své [Concept('concept_naval_mission','námořní mise')]. Závisí na aktuálním [Concept('concept_presence','stavu přítomnosti')] flotily a u většiny misí také na počtu [Concept('concept_sea_node','regionů')] přiřazených do oblasti mise. Výjimkou je mise $naval_mission_type_project_power$, která uplatňuje svou plnou sílu v každém [Concept('concept_strategic_region','strategickém regionu')], který pokrývá, takže záleží pouze na [Concept('concept_presence','přítomnosti')]." # todo: CHANGED (predtym: $concept_mission_efficiency$ určuje, jak efektivně [Concept('concept_fleet','loďstvo')] vykonává své [Concept('concept_n)
 concept_party_whip: "Stranický bič"
 concept_party_whip_short: "Bič"
 concept_party_whip_desc: "$concept_party_whip$ drží ostatní členy své [Concept('concept_party','strany')] pod kontrolou ohledně jejich [Concept('concept_ideology','ideologií')]. Když je [Concept('concept_in_government','ve vládě')], stranický bič částečně přepisuje ideologické postoje [Concept('concept_law','zákona')] ostatních [Concept('concept_interest_group','zájmových skupin')] v straně pro účely výpočtu [Concept('concept_ideological_incoherence','ideologické neslučitelnosti')]. [Concept('concept_party_leader','Vůdce strany')] působí jako stranický bič." # todo: CHANGED (predtym: $concept_party_whip$ drží ostatní členy své [Concept('concept_party','strany')] pod kontrolou ohledně jejich [Concept('c)
 concept_economy_health: "Zdraví ekonomiky"
 concept_economy_health_healthy: "Zdravá ekonomika"
 concept_economy_health_healthy_short: "Zdravá"
 concept_economy_health_unhealthy: "Nezdravá ekonomika"
 concept_economy_health_unhealthy_short: "Nezdravá"
 concept_economy_health_desc: "Ekonomika [Concept('concept_country','země')] je považována za zdravou, pokud #italic platí jedno z následujícího#!:\n#indent_newline:3 • její pevné příjmy překračují její pevné náklady#!\n#indent_newline:3 • její [Concept('concept_principal','jistina')|l] je menší než polovina jejich celkového [Concept('concept_credit','kreditu')]" # todo: CHANGED (predtym: Ekonomika [Concept('concept_country','země')] je považována za $concept_economy_health_healthy_short$, pokud italic plat)
 concept_bankroll: "$bankroll$"
 concept_bankrolling: "Financování"
 concept_bankrolls: "Financování"
 concept_bankroll_desc: "Jedna [Concept('concept_country', 'země')] platí část svého příjmu jiné, na základě týdenní vybrané daně příjemce. Tato akce má každý měsíc šanci generovat [Concept('concept_obligation', 'závazek')] vůči financující [Concept('concept_country', 'zemi')], pokud nebyla dána jako součást [Concept('concept_sway', 'ovlivňující')] nabídky."
 concept_fund_lobbies: "Financovat lobbisty"
 concept_funding_lobbies: "Financování lobbistů"
 concept_fund_lobbies_desc: "Jedna [Concept('concept_country','země')|l] platí část svých příjmů dalším, velikost částky závisí na základě týdně vybraných daní příjemce. Tato akce má šanci každý týden vytvořit nebo posílit přátelské [Concept('concept_political_lobby','lobby')|l] v cílové zemi." # todo: CHANGED (predtym: Jedna [Concept('concept_country','země')|l] platí část svých příjmů [Concept('concept_pop','$concept_pops|q$')] jiné zem)
 concept_subject: "Závislá země"
 concept_subjects: "Závislé země"
 concept_subject_possessive: "Závislé zemi"
 concept_subject_desc: "[Concept('concept_country','Země')], jejiž [Concept('concept_autonomy','autonomie')|l] a právo na sebeurčení [Concept('concept_overlord','vládce')|l] do určité míry omezuje. Vztahy závislé země představují druh [Concept('concept_diplomatic_pact','diplomatického paktu')], do kterého může být jiná země buď pozvána, nebo k ní donucena skrze [Concept('concept_diplomatic_play','diplomatickou hru')]. Konkrétní důsledky určuje [Concept('concept_subject_type','typ závislé země')|l], ale obvykle zahrnují povinné zapojení do trhu vládce, odvádění části příjmů ze [Concept('concept_treasury','státní pokladny')], sníženou [Concept('concept_prestige','prestiže')|l], nemožnost zahájit vlastní [Concept('concept_diplomatic_play','diplomatickou hru')|l] a vybrat si, kterou stranu v nich podpořit, a převzetí vládce jako vlastní [Concept('concept_head_of_state','hlavu státu')].\n\n$concept_subjects$ se mohou osvobodit pomocí vlastní diplomatické hry nebo skrze zásah třetí strany. Některé typy závislých zemí mohou být také cílem hry jejich vládce s cílem snížit jejich [Concept('concept_autonomy','autonomii')], nebo je dokonce plně #b anektovat#!." # todo: CHANGED (predtym: Země, jejíž [Concept('concept_autonomy','autonomie')|l] a právo na sebeurčení [Concept('concept_overlord','vládce')|l] d)
 concept_subject_type: "Typ závislé země"
 concept_subject_types: "Typy závislých zemí"
 concept_subject_type_desc: "Existují celkem #v [GetDataModelSize(GetSubjectTypes)]#! různých typů závislých zemí:#indent_newline:3 \n[GetSubjectTypesList]#!\nPodívejte se na $SUBJECT_TYPES_VISUALIZATION$ na panelu #b Diplomacie#! pro podrobnější informace o účincích každého typu."
 concept_overlord: "Vládce"
 concept_overlords: "Vládci"
 concept_overlord_possessive: "Vládcova"
 concept_overlord_desc: "Dominantní [Concept('concept_country','země')|l] ve vztahu s [Concept('concept_subject','závislou zemí')], který poskytuje množství výhod z [Concept('concept_diplomatic_pact','diplomatických paktů')], zatímco ji to stojí [Concept('concept_influence','vliv')|l]."
 concept_liberty_desire: "Touha po svobodě"
 concept_liberty_desire_desc: "Poptávka po [Concept('concept_autonomy','autonomii')] v [Concept('concept_subject','závislých')] [Concept('concept_country','zemích')] je měřena pomocí Touhy po svobodě. $concept_subject$ bude loajální a stabilní při nízkých úrovních, zatímco vysoké úrovně Touhy po svobodě mohou vyvolat požadavky na větší samosprávu, snížené závazky, nebo dokonce ozbrojenou rebelii za nezávislost."
 concept_great_power: "Velmoc"
 concept_great_powers: "Velmoci"
 concept_great_power_desc: "Několik [Concept('concept_country','zemí')], které řídí svět prostřednictvím globálních impérií nebo absolutní lokální dominance, se považují za velmoc [Concept('concept_rank','hodnost')|l]. Jsou v neustálém sporu s ostatními velmocemi pro získání výhody, a vždy si dávají pozor na ambiciozní [Concept('concept_major_power','regionální mocnosti')] snažící se vyštverat nahoru na jejich úkor.[AddLocalizationIf(GetPlayer.IsValid,'concept_great_power_desc_added')]" # todo: CHANGED (predtym: Několik [Concept('concept_country','$concept_countries|q$')], které řídí svět prostřednictvím globálních impérií nebo ab)
 concept_great_power_desc_added: "\n\n$concept_great_powers$ získávají následující výhody:\n[GetRankModifier('great_power').GetDesc]"
 concept_major_power: "Regionální mocnost"
 concept_major_power_short: "Regionální"
 concept_major_powers: "Regionální mocnosti"
 concept_major_power_desc: "[Concept('concept_country','Země')] s [Concept('concept_rank', 'hodností')] $concept_major_powers$ se etablovaly jako významné skrze svou regionální přítomnost. Ačkoliv nejsou ještě dost silné, aby vytvořili opravdu globální impérium, mohou být hlavní regionální sílou, se kterou je třeba počítat, a nejmocnější z nich si mohou přát usilovat o status [Concept('concept_great_power','velmoci')].[AddLocalizationIf(GetPlayer.IsValid,'concept_major_power_desc_added')]"
 concept_major_power_desc_added: "\n\n$concept_major_powers$ získávají následující výhody:\n[GetRankModifier('major_power').GetDesc]"
 concept_minor_power: "Lokální mocnost"
 concept_minor_powers: "Lokální mocnosti"
 concept_minor_power_desc: "[Concept('concept_country','Země')] s [Concept('concept_rank','hodností')] $concept_minor_power$ jsou pouze figurky v imperialistických hrách [Concept('concept_major_power','regionálních mocností')] a [Concept('concept_great_power','velmocí')], kteří je často používají jako nárazníkové země, [Concept('concept_puppet','loutky')|l], nebo zajaté [Concept('concept_market','trhy')|l].[AddLocalizationIf(GetPlayer.IsValid,'concept_minor_power_desc_added')]" # todo: CHANGED (predtym: [Concept('concept_country','$concept_countries|q$')] s [Concept('concept_rank','hodností')] $concept_minor_power$ jsou p)
 concept_minor_power_desc_added: "\n\n$concept_minor_powers$ získává následující výhody:\n[GetRankModifier('minor_power').GetDesc]"
 concept_insignificant_power: "Bezvýznamná země"
 concept_insignificant_power_short: "Bezvýznamná"
 concept_insignificant_power_desc: "[Concept('concept_country','Země')] s tak nízkou [Concept('concept_prestige','prestiží')], že nesplňují ani základní kritéria pro to, aby byly považovány za [Concept('concept_minor_power','lokální mocnost')|l], jsou považovány za bezvýznamné země, což je také jejich [Concept('concept_rank','hodnost')|l]. Bojují za své právo na sebeurčení, a snaží se přitom nevypadat příliš nepohodlně pro blízké [Concept('concept_major_power','$concept_major_power_short|q$')|l] mocnosti a [Concept('concept_great_power','velmoci')|l].[AddLocalizationIf(GetPlayer.IsValid,'concept_insignificant_power_desc_added')]" # todo: CHANGED (predtym: [Concept('concept_country','$concept_countries|q$')] s tak nízkou [Concept('concept_prestige','prestiží')], že nesplňují)
 concept_insignificant_power_desc_added: "\n\nBezvýznamné země získávají následující výhody:\n[GetRankModifier('insignificant_power').GetDesc]"
 concept_unrecognized_power: "Neuznávaná země"
 concept_unrecognized_power_short: "Neuznaný"
 concept_unrecognized_powers: "Neuznané země"
 concept_unrecognized_regional_power: "Neuznávaná lokální mocnost"
 concept_unrecognized_major_power: "Neuznávaná velmoc"
 concept_unrecognized_power_desc: "$concept_unrecognized_powers$ jsou [Concept('concept_country','politickými systémy')|l], které vládnou ve [Concept('concept_great_power','velmocech')], považovány za méněcenné a necivilizované - a tedy dobré jenom jako potenciální cíl dobyvačných válek. V důsledku toho je jejich [Concept('concept_prestige','prestiž')|l] penalizována a mohou na ně být cíleny [Concept('concept_diplomatic_play','diplomatické hry')|l] ze strany silnějších. Také jsou omezeny na to, jaké [Concept('concept_rank','hodnosti')|l] mohou dosáhnout, bez ohledu na to, kolik [Concept('concept_prestige','prestiže')] získají.[AddLocalizationIf(GetPlayer.IsValid,'concept_unrecognized_power_desc_added')]"
 concept_unrecognized_power_desc_added: "\n\n$concept_unrecognized_power$, které chce tyto postihy odstranit, musí požádat o uznání dokončením [Concept('concept_journal_entry','záznamu v deníku')] $je_earn_recognition$."
 concept_protectorate: "Protektorát"
 concept_protectorates: "Protektoráty"
 concept_protectorate_desc: "$concept_protectorate$ ([Concept('concept_subject','závislá země')|l]) je autonomní [Concept('concept_subject_type','typ závislé země')|l], schopný zahájit vlastní [Concept('concept_diplomatic_play','diplomatickou hru')|l]." # todo: CONCEPT CASE
 concept_puppet: "Loutka"
 concept_puppets: "Loutky"
 concept_puppet_desc: "[Concept('concept_recognized_power','Uznané mocnosti')] můžou proměnit slabší [Concept('concept_country','země')|l] na loutku ([Concept('concept_subject','závislou zemi')|l]). Loutka je [Concept('concept_subject_type','typ závislé země')|l], který nemůže zahájit vlastní [Concept('concept_diplomatic_play','diplomatickou hru')|l], ale je nucen se připojit do [Concept('concept_war','válek')] jejich [Concept('concept_overlord','vládců')], a také musí každý týden platit #v 30%#! příjmu ze své [Concept('concept_treasury','pokladny')] jejich vládcům. Hodnost [Concept('concept_puppet','loutky')] nemůže vzrůst, aby odpovídal nebo překonal vládce, a jejich vládce může na ně cílit s [Concept('concept_diplomatic_play','diplomatickou hrou')] #b anexe#!." # todo: CHANGED (predtym: [Concept('concept_recognized_power','Uznané mocnosti')] můžou proměnit slabší [Concept('concept_country','zemi')|l] na l)
 concept_personal_union: "Personální unie"
 concept_personal_unions: "Personální unie"
 concept_personal_union_desc: "Dvě [Concept('concept_country','země')|l] se [Concept('concept_law','zákonem')] [SelectLocalization(GetPlayer.IsValid,'concept_personal_union_desc_added','monarchie')] se mohou spojit do $concept_personal_union$ ([Concept('concept_subject','závislá země')|l]), [Concept('concept_subject_type','typu závislého vztahu')], kde [Concept('concept_ruler','vládce')|l] [Concept('concept_overlord','silnější země')] je [Concept('concept_head_of_state','hlava státu')|l] v obou zemích. Závislá země nemůže zahájit vlastní [Concept('concept_diplomatic_play','diplomatickou hru')|l], přesto je nucena se připojit k válkám svého vládce. [Concept('concept_diplomatic_pact','Diplomatický pakt')] se zruší, pokud vládce zruší zákon $law_monarchy$." # todo: CHANGED (predtym: Dvě [Concept('concept_country','$concept_countries|q$')] se [Concept('concept_law','zákonem')] [SelectLocalization(GetPl)
 concept_personal_union_desc_added: "[GetLawType('law_monarchy').GetName]"
 concept_dominion: "Dominium"
 concept_dominions: "Dominia"
 concept_dominion_desc: "[Concept('concept_recognized_power','Uznané mocnosti')] můžou proměnit slabší [Concept('concept_country','země')|l] v jejich dominium ([Concept('concept_subject','závislá země')|l]). $concept_dominion$ je autonomnější [Concept('concept_subject_type','typ závislé země')|l], která může zahájit své vlastní [Concept('concept_diplomatic_play','diplomatickou hru')|l] a je nucena se připojit k [Concept('concept_overlord','vládcovým')] [Concept('concept_war','válkám')]. Musí také platit každý týden #v 25%#! ze svých příjmů [Concept('concept_treasury','pokladny')] do vládocove pokladnice." # todo: CHANGED (predtym: [Concept('concept_recognized_power','Uznané mocnosti')] můžou proměnit slabší [Concept('concept_country','zemi')|l] v je)
 concept_colony_subject: "Kolonie"
 concept_colony_subjects: "Kolonie"
 concept_colony_subject_desc: "[Concept('concept_recognized_power','Uznané mocnosti')] můžou proměnit slabší [Concept('concept_country','zemi')] ve svoji kolonii ([Concept('concept_subject','závislou zemi')|l]). $concept_colony$ je [Concept('concept_subject_type','typ závislé země')|l], který nemůže začít vlastní [Concept('concept_diplomatic_play','diplomatickou hru')|l], ale je nucen se přidat k [Concept('concept_war','válkám')] jejich [Concept('concept_overlord','vládce')], a také musí každý týden platit #v 30%#! ze svých příjmů [Concept('concept_treasury','pokladny')] svému vládci. [Concept('concept_rank','Hodnost')] [Concept('concept_colony','Kolonie')|l] se nemůže zvýšit tak, aby odpovídala nebo překročila [Concept('concept_overlord','vládcovu')], a můžu se stát ze strany jejich vládce cílem diplomatické hry #b Anexe#!." # todo: CHANGED (predtym: [Concept('concept_recognized_power','Uznané mocnosti')] můžou proměnit slabší [Concept('concept_country','zemi')] ve svo)
 concept_chartered_company: "Akciová společnost"
 concept_chartered_companies: "Akciové společnosti"
 concept_chartered_company_desc: "Za zvláštních okolností mohou [Concept('concept_recognized_power','uznané mocnosti')|l] založit akciovou společnost ([Concept('concept_subject','závislá země')|l]). $concept_chartered_company$ je vysoce autonomní [Concept('concept_subject_type','typ závislé země')|l], schopná začít vlastní [Concept('concept_diplomatic_play','diplomatickou hru')|l] a je povinna se připojit do [Concept('concept_war','válek')] svýho [Concept('concept_overlord','vládce')]. Existují také zvláštní omezení, pokud jde o snižování [Concept('concept_autonomy','autonomie')|l], a jejich základní nárůst [Concept('concept_liberty_desire','touhy po svobodě')] je značně snížen. Každý týden také musí platit #v 40%#! ze svých příjmů svému vládci." # todo: CHANGED (predtym: Za zvláštních okolností mohou [Concept('concept_recognized_power','uznané mocnosti')|l] založit $concept_chartered_compa)
 concept_tributary: "Tributář"
 concept_tributaries: "Tributáři"
 concept_tributary_desc: "[Concept('concept_unrecognized_power','Neuznané země')] můžou přeměnit slabší [Concept('concept_country','země')|l] na jejich tributář ([Concept('concept_subject','závislá země')|l]). $concept_tributary$ je autonomnější [Concept('concept_subject_type','typ závislé země')|l], která může zahájit vlastní [Concept('concept_diplomatic_play','diplomatickou hru')|l] a není nucena se přidat k [Concept('concept_overlord','vládcovým')] [Concept('concept_war','válkám')]. Musí platit svému vládci každý týden #v 20%#! příjmu své [Concept('concept_treasury','státní pokladny')]." # todo: CHANGED (predtym: [Concept('concept_unrecognized_power','Neuznané země')] můžou přeměnit slabší [Concept('concept_country','zemi')|l] na j)
 concept_vassal: "Vazal"
 concept_vassals: "Vazalové"
 concept_vassalize: "Vazalizace"
 concept_vassal_desc: "[Concept('concept_unrecognized_power','Neuznané země')] můžou proměnit slabší [Concept('concept_country','zemi')] ve svého vazala ([Concept('concept_subject','závislou zemi')|l]). $concept_vassal$ je [Concept('concept_subject_type','typ závislé země')|l], která nemůže zahájit své vlastní [Concept('concept_diplomatic_play','diplomatickou hru')|l], ale je nucena se přidat k [Concept('concept_overlord','vládcovým')] [Concept('concept_war','válkám')], a také musí platit svému vládci každý týden #v 30%#! příjmu své [Concept('concept_treasury','státní pokladny')]." # todo: CHANGED (predtym: [Concept('concept_unrecognized_power','Neuznané země')] můžou proměnit slabší [Concept('concept_country','zemi')] ve své)
 concept_crown_land_subject: "Korunní území"
 concept_crown_land_subjects: "Korunní území"
 concept_crown_land_subject_desc: "$concept_crown_land_subject$ je [Concept('concept_subject_type','typ závislé země')], který nemůže zahájit vlastní [Concept('concept_diplomatic_play','diplomatickou hru')], ale je nucen připojit se k [Concept('concept_overlord','vládcově')] [Concept('concept_war','válce')] a musí každý týden platit #v 40%#! příjmů ze své [Concept('concept_treasury','státní pokladny')] svému $concept_overlord$. [Concept('concept_rank','Hodnost')] $concept_crown_land_subject$ se nemůže zvýšit tak, aby se vyrovnal nebo překročil hodnost svého $concept_overlord$, a jeho $concept_overlord$ na něj může cílit #b Anexi#! $concept_diplomatic_play$." # todo: CONCEPT CASE
 concept_observer_mode: "Mód pozorovatele"
 concept_observer: "Pozorovatel"
 concept_observe: "Pozorovat"
 concept_observing: "Pozorování"
 concept_observer_mode_desc: "Hráč v režimu $concept_observing$ má plný přístup k uživatelskému rozhraní a přehled o tom, co se v hře děje, ale nemůže provádět žádné změny v herním procesu."
 concept_trade: "Obchod"
 concept_trading: "Obchodování"
 concept_importing: "Dovoz"
 concept_imports: "Dovozy"
