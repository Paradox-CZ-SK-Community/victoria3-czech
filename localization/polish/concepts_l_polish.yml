 FULL_ACCEPTANCE_GC_LINK: "[SelectLocalization(GetPlayer.IsValid,'FULL_ACCEPTANCE_LINK','plné přijetí')]"
 FULL_ACCEPTANCE_LINK: "[GetAcceptanceStatus('full_acceptance').GetName]"
 concept_presence: "Přítomnost"
 concept_presence_desc: "Přítomnost [Concept('concept_fleet','Loďstvo')] ovlivňuje, jak efektivně vykonávají [Concept('concept_admiral','admirálové')|l] své [Concept('concept_order','rozkaz')|l]. Přítomnost se buduje postupně, zatímco je [Concept('concept_fleet','loďstvo')|l] umístněno v [Concept('concept_sea_node','námořním uzlu')]." # todo: CONCEPT CASE
 concept_mission_efficiency: "Efektivita mise"
 concept_mission_efficiency_desc: "Efektivita mise určuje, jak efektivně [Concept('concept_fleet','loďstvo')] vykonává své [Concept('concept_naval_mission','námořní mise')]. Závisí na počtu [Concept('concept_sea_node','regiony')] přiřazených do oblasti mise a na aktuálním [Concept('concept_presence','přítomnosti')] flotily." # todo: CONCEPT CASE
 concept_party_whip: "Stranický bič"
 concept_party_whip_short: "Bič"
 concept_party_whip_desc: "Stranický bič drží ostatní členy své [Concept('concept_party','strany')] pod kontrolou ohledně jejich [Concept('concept_ideology','ideologií')]. Když je [Concept('concept_in_government','ve vládě')], stranický bič částečně přepisuje ideologické postoje [Concept('concept_law','zákona')] ostatních [Concept('concept_interest_group','zájmové skupiny')] v straně pro účely výpočtu [Concept('concept_ideological_incoherence','ideologické neslučitelnosti')]. [Concept('concept_party_leader','Vůdce strany')] působí jako stranický bič." # todo: CONCEPT CASE
 concept_economy_health: "Zdraví ekonomiky"
 concept_economy_health_healthy: "Zdravá ekonomika"
 concept_economy_health_healthy_short: "Zdravá"
 concept_economy_health_unhealthy: "Nezdravá ekonomika"
 concept_economy_health_unhealthy_short: "Nezdravá"
 concept_economy_health_desc: "Ekonomika [Concept('concept_country','země')] je považována za zdravou, pokud #italic platí jedno z následujícího#!:\n#indent_newline:3 • její pevné příjmy překračují její pevné náklady#!\n#indent_newline:3 • její [Concept('concept_principal','jistina')|l] je menší než polovina jejich celkového [Concept('concept_credit','kreditu')]" # todo: CONCEPT CASE
 concept_bankroll: "$bankroll$"
 concept_bankrolling: "Financování"
 concept_bankrolls: "Financování"
 concept_bankroll_desc: "Jedna [Concept('concept_country', 'země')] platí část svého příjmu jiné, na základě týdenní vybrané daně příjemce. Tato akce má každý měsíc šanci generovat [Concept('concept_obligation', 'závazek')] vůči financující [Concept('concept_country', 'zemi')], pokud nebyla dána jako součást [Concept('concept_sway', 'ovlivňující')] nabídky."
 concept_fund_lobbies: "Financovat lobbisty"
 concept_funding_lobbies: "Financování lobbistů"
 concept_fund_lobbies_desc: "Jedna [Concept('concept_country','země')|l] platí část svých příjmů dalším, velikost částky závisí na základě týdně vybraných daní příjemce. Tato akce má šanci každý týden vytvořit nebo posílit přátelské [Concept('concept_political_lobby','lobby')|l] v cílové zemi." # todo: CONCEPT CASE
 concept_subject: "Závislá země"
 concept_subjects: "Závislé země"
 concept_subject_possessive: "Závislé zemi"
 concept_subject_desc: "[Concept('concept_country','Země')], jejiž [Concept('concept_autonomy','autonomie')|l] a právo na sebeurčení [Concept('concept_overlord','vládce')|l] do určité míry omezuje. Vztahy závislé země představují druh [Concept('concept_diplomatic_pact','diplomatického paktu')], do kterého může být jiná země buď pozvána, nebo k ní donucena skrze [Concept('concept_diplomatic_play','diplomatickou hru')]. Konkrétní důsledky určuje [Concept('concept_subject_type','typ závislé země')|l], ale obvykle zahrnují povinné zapojení do trhu vládce, odvádění části příjmů ze [Concept('concept_treasury','státní pokladny')], snížené [Concept('concept_prestige','prestiže')|l], nemožnost zahájit vlastní [Concept('concept_diplomatic_play','diplomatickou hru')|l] a vybrat si, kterou stranu v nich podpořit, a převzetí vládce jako vlastní [Concept('concept_head_of_state','hlavu státu')].\n\nZávislé země se mohou osvobodit pomocí vlastní diplomatické hry nebo skrze zásah třetí strany. Některé typy závislých zemí mohou být také cílem hry jejich vládce s cílem snížit jejich [Concept('concept_autonomy','autonomii')], nebo je dokonca plně #b anektovat#!." # todo: CONCEPT CASE
 concept_subject_type: "Typ závislé země"
 concept_subject_types: "Typy závislých zemí"
 concept_subject_type_desc: "Existují celkem #v [GetDataModelSize(GetSubjectTypes)]#! různých typů závislých zemí:#indent_newline:3 \n[GetSubjectTypesList]#!\nPodívejte se na $SUBJECT_TYPES_VISUALIZATION$ na panelu #b Diplomacie#! pro podrobnější informace o účincích každého typu."
 concept_overlord: "Vládce"
 concept_overlords: "Vládci"
 concept_overlord_possessive: "Vládcova"
 concept_overlord_desc: "Dominantní [Concept('concept_country','země')|l] ve vztahu s [Concept('concept_subject','závislou zemí')], který poskytuje množství výhod z [Concept('concept_diplomatic_pact','diplomatického paktu')], zatímco ji to stojí [Concept('concept_influence','vliv')|l]." # todo: CONCEPT CASE
 concept_liberty_desire: "Touha po svobodě"
 concept_liberty_desire_desc: "Poptávka po [Concept('concept_autonomy','autonomii')] v [Concept('concept_subject','závislé zemi')] [Concept('concept_country','zemích')] je měřena pomocí Touhy po svobodě. Závislá země bude loajální a stabilní při nízkých úrovních, zatímco vysoké úrovně Touhy po svobodě mohou vyvolat požadavky na větší samosprávu, snížené závazky, nebo dokonce ozbrojenou rebelii za nezávislost." # todo: CONCEPT CASE
 concept_great_power: "Velmoc"
 concept_great_powers: "Velmoci"
 concept_great_power_desc: "Několik [Concept('concept_country','zemí')], které řídí svět prostřednictvím globálních impérií nebo absolutní lokální dominance, se považují za velmoc [Concept('concept_rank','hodnost')|l]. Jsou v neustálém sporu s ostatními velmocemi pro získání výhody, a vždy si dávají pozor na ambiciozní [Concept('concept_major_power','regionální mocnost')] snažící se vyštverat nahoru na jejich úkor.[AddLocalizationIf(GetPlayer.IsValid,'concept_great_power_desc_added')]" # todo: CONCEPT CASE
 concept_great_power_desc_added: "\n\nVelmoci získávají následující výhody:\n[GetRankModifier('great_power').GetDesc]" # todo: CONCEPT CASE
 concept_major_power: "Regionální mocnost"
 concept_major_power_short: "Regionální"
 concept_major_powers: "Regionální mocnosti"
 concept_major_power_desc: "[Concept('concept_country','Země')] s [Concept('concept_rank', 'hodností')] regionálními mocnostmi se etablovaly jako významné skrze svou regionální přítomnost. Ačkoliv nejsou ještě dost silné, aby vytvořili opravdu globální impérium, mohou být hlavní regionální sílou, se kterou je třeba počítat, a nejmocnější z nich si mohou přát usilovat o status [Concept('concept_great_power','velmoci')].[AddLocalizationIf(GetPlayer.IsValid,'concept_major_power_desc_added')]" # todo: CONCEPT CASE
 concept_major_power_desc_added: "\n\nRegionální mocnosti získávají následující výhody:\n[GetRankModifier('major_power').GetDesc]" # todo: CONCEPT CASE
 concept_minor_power: "Lokální mocnost"
 concept_minor_powers: "Lokální mocnosti"
 concept_minor_power_desc: "[Concept('concept_country','Země')] s [Concept('concept_rank','hodností')] lokální mocností jsou pouze figurky v imperialistických hrách [Concept('concept_major_power','regionálních mocností')] a [Concept('concept_great_power','velmocí')], kteří je často používají jako nárazníkové země, [Concept('concept_puppet','loutky')|l], nebo zajaté [Concept('concept_market','trhy')|l].[AddLocalizationIf(GetPlayer.IsValid,'concept_minor_power_desc_added')]" # todo: CONCEPT CASE
 concept_minor_power_desc_added: "\n\nLokální mocnosti získává následující výhody:\n[GetRankModifier('minor_power').GetDesc]" # todo: CONCEPT CASE
 concept_insignificant_power: "Bezvýznamná země"
 concept_insignificant_power_short: "Bezvýznamná"
 concept_insignificant_power_desc: "[Concept('concept_country','Země')] s tak nízkou [Concept('concept_prestige','přestiží')], že nesplňují ani základní kritéria pro to, aby byly považovány za [Concept('concept_minor_power','lokální mocnost')|l], jsou považovány za bezvýznamné země, což je také jejich [Concept('concept_rank','hodnost')|l]. Bojují za své právo na sebeurčení, a snaží se přitom nevypadat příliš nepohodlně pro blízké [Concept('concept_major_power','regionální mocnost')|l] mocnosti a [Concept('concept_great_power','velmoci')|l].[AddLocalizationIf(GetPlayer.IsValid,'concept_insignificant_power_desc_added')]" # todo: CONCEPT CASE
 concept_insignificant_power_desc_added: "\n\nBezvýznamné země získávají následující výhody:\n[GetRankModifier('insignificant_power').GetDesc]"
 concept_unrecognized_power: "Neuznávaná země"
 concept_unrecognized_power_short: "Neuznaný"
 concept_unrecognized_powers: "Neuznané země"
 concept_unrecognized_regional_power: "Neuznávaná lokální mocnost"
 concept_unrecognized_major_power: "Neuznávaná velmoc"
 concept_unrecognized_power_desc: "Neuznané země jsou [Concept('concept_country','politickými systémy')|l], které vládnou ve [Concept('concept_great_power','velmoci')], považovány za méněcenné a necivilizované - a tedy dobré jenom jako potenciální cíl dobyvačných válek. V důsledku toho je jejich [Concept('concept_prestige','prestiž')|l] penalizována a mohou na ně být cíleny [Concept('concept_diplomatic_play','diplomatické hry')|l] ze strany silnějších. Také jsou omezeny na to, jaké [Concept('concept_rank','hodnosti')|l] mohou dosáhnout, bez ohledu na to, kolik [Concept('concept_prestige','prestiž')] získají.[AddLocalizationIf(GetPlayer.IsValid,'concept_unrecognized_power_desc_added')]" # todo: CONCEPT CASE
 concept_unrecognized_power_desc_added: "\n\nNeuznávaná země, které chce tyto postihy odstranit, musí požádat o uznání dokončením [Concept('concept_journal_entry','záznam v deníku')] $je_earn_recognition$." # todo: CONCEPT CASE
 concept_protectorate: "Protektorát"
 concept_protectorates: "Protektoráty"
 concept_protectorate_desc: "Protektorát ([Concept('concept_subject','závislá země')|l]) je autonomní [Concept('concept_subject_type','typ závislé země')|l], schopný zahájit vlastní [Concept('concept_diplomatic_play','diplomatickou hru')|l]." # todo: CONCEPT CASE
 concept_puppet: "Loutka"
 concept_puppets: "Loutky"
 concept_puppet_desc: "[Concept('concept_recognized_power','Uznaná mocnost')] můžou proměnit slabší [Concept('concept_country','země')|l] na loutku ([Concept('concept_subject','závislou zemi')|l]). Loutka je [Concept('concept_subject_type','typ závislé země')|l], který nemůže zahájit vlastní [Concept('concept_diplomatic_play','diplomatickou hru')|l], ale je nucen se připojit do [Concept('concept_war','válek')] jejich [Concept('concept_overlord','vládců')], a také musí každý týden platit #v 30%#! příjmu ze své [Concept('concept_treasury','státní pokladny')] jejich vládcům. Hodnost [Concept('concept_puppet','loutky')] nemůže vzrůst, aby odpovídal nebo překonal vládce, a jejich vládce může na ně cílit s [Concept('concept_diplomatic_play','diplomatickou hrou')] #b anexe#!." # todo: CONCEPT CASE
 concept_personal_union: "Personální unie"
 concept_personal_unions: "Personální unie"
 concept_personal_union_desc: "Dvě [Concept('concept_country','země')|l] se [Concept('concept_law','zákonem')] [SelectLocalization(GetPlayer.IsValid,'concept_personal_union_desc_added','monarchie')] se mohou spojit do personální unie ([Concept('concept_subject','závislá země')|l]), [Concept('concept_subject_type','typu závislého vztahu')], kde [Concept('concept_ruler','vládce')|l] [Concept('concept_overlord','silnejší země')] je [Concept('concept_head_of_state','hlava státu')|l] v obou zemích. Závislá země nemůže zahájit vlastní [Concept('concept_diplomatic_play','diplomatickou hru')|l], přesto je nucena se připojit k válkám svého vládce. [Concept('concept_diplomatic_pact','Diplomatický pakt')] se zruší, pokud vládce zruší zákon $law_monarchy$." # todo: CONCEPT CASE
 concept_personal_union_desc_added: "[GetLawType('law_monarchy').GetName]"
 concept_dominion: "Dominium"
 concept_dominions: "Dominia"
 concept_dominion_desc: "[Concept('concept_recognized_power','Uznaná mocnost')] můžou proměnit slabší [Concept('concept_country','země')|l] v jejich dominium ([Concept('concept_subject','závislá země')|l]). Dominium je autonomnější [Concept('concept_subject_type','typ závislé země')|l], která může zahájit své vlastní [Concept('concept_diplomatic_play','diplomatickou hru')|l] a je nucena se připojit k [Concept('concept_overlord','vládcovým')] [Concept('concept_war','válce')]. Musí také platit každý týden #v 25%#! ze svých příjmů [Concept('concept_treasury','státní pokladny')] do vládocove pokladnice." # todo: CONCEPT CASE
 concept_colony_subject: "Kolonie"
 concept_colony_subjects: "Kolonie"
 concept_colony_subject_desc: "[Concept('concept_recognized_power','Uznaná mocnost')] můžou proměnit slabší [Concept('concept_country','zemi')] ve svoji kolonii ([Concept('concept_subject','závislou zemi')|l]). Kolonie je [Concept('concept_subject_type','typ závislé země')|l], který nemůže začít vlastní [Concept('concept_diplomatic_play','diplomatickou hru')|l], ale je nucen se přidat k [Concept('concept_war','válce')] jejich [Concept('concept_overlord','vládce')], a také musí každý týden platit #v 30%#! ze svých příjmů [Concept('concept_treasury','státní pokladny')] svému vládci. [Concept('concept_rank','Hodnost')] [Concept('concept_colony','Kolonie')|l] se nemůže zvýšit tak, aby odpovídala nebo překročila [Concept('concept_overlord','vládcovu')], a můžu se stát ze strany jejich vládce cílem diplomatické hry #b Anexe#!." # todo: CONCEPT CASE
 concept_chartered_company: "Akciová společnost"
 concept_chartered_companies: "Akciové společnosti"
 concept_chartered_company_desc: "Za zvláštních okolností mohou [Concept('concept_recognized_power','uznané mocnosti')|l] založit akciovou společnost ([Concept('concept_subject','závislá země')|l]). Akciová společnost je vysoce autonomní [Concept('concept_subject_type','typ závislé země')|l], schopná začít vlastní [Concept('concept_diplomatic_play','diplomatickou hru')|l] a je povinna se připojit do [Concept('concept_war','válek')] svýho [Concept('concept_overlord','vládce')]. Existují také zvláštní omezení, pokud jde o snižování [Concept('concept_autonomy','autonomii')|l], a jejich základní nárúst [Concept('concept_liberty_desire','touhy po svobodě')] je značně snížen. Každý týden také musí platit #v 40%#! ze svých příjmů svému vládci." # todo: CONCEPT CASE
 concept_tributary: "Tributář"
 concept_tributaries: "Tributáři"
 concept_tributary_desc: "[Concept('concept_unrecognized_power','Neuznané země')] můžou přeměnit slabší [Concept('concept_country','země')|l] na jejich tributář ([Concept('concept_subject','závislá země')|l]). Tributář je autonomnější [Concept('concept_subject_type','typ závislé země')|l], která může zahájit vlastní [Concept('concept_diplomatic_play','diplomatickou hru')|l] a není nucena se přidat k [Concept('concept_overlord','vládcovým')] [Concept('concept_war','válce')]. Musí platit svému vládci každý týden #v 20%#! příjmu své [Concept('concept_treasury','státní pokladnu')]." # todo: CONCEPT CASE
 concept_vassal: "Vazal"
 concept_vassals: "Vazalové"
 concept_vassalize: "Vazalizace"
 concept_vassal_desc: "[Concept('concept_unrecognized_power','Neuznané země')] můžou proměnit slabší [Concept('concept_country','zemi')] ve svého vazala ([Concept('concept_subject','závislou zemi')|l]). Vazal je [Concept('concept_subject_type','typ závislé země')|l], která nemůže zahájit své vlastní [Concept('concept_diplomatic_play','diplomatickou hru')|l], ale je nucena se přidat k [Concept('concept_overlord','vládcovým')] [Concept('concept_war','válce')], a také musí platit svému vládci každý týden #v 30%#! příjmu své [Concept('concept_treasury','státní pokladnu')]." # todo: CONCEPT CASE
 concept_crown_land_subject: "Korunní území"
 concept_crown_land_subjects: "Korunní území"
 concept_crown_land_subject_desc: "Korunní území je [Concept('concept_subject_type','typ závislé země')], který nemůže zahájit vlastní [Concept('concept_diplomatic_play','diplomatickou hru')], ale je nucen připojit se k [Concept('concept_overlord','vládcově')] [Concept('concept_war','válce')] a musí každý týden platit #v 40%#! příjmů ze své [Concept('concept_treasury','státní pokladny')] svému vládce. [Concept('concept_rank','Hodnost')] Korunní území se nemůže zvýšit tak, aby se vyrovnal nebo překročil hodnost svého vládce, a jeho vládce na něj může cílit #b Anexi#! diplomatickou hru." # todo: CONCEPT CASE
 concept_observer_mode: "Mód pozorovatele"
 concept_observer: "Pozorovatel"
 concept_observe: "Pozorovat"
 concept_observing: "Pozorování"
 concept_observer_mode_desc: "Hráč v režimu pozorování má plný přístup k uživatelskému rozhraní a přehled o tom, co se v hře děje, ale nemůže provádět žádné změny v herním procesu." # todo: CONCEPT CASE
 concept_trade: "Obchod"
 concept_trading: "Obchodování"
 concept_importing: "Dovoz"
 concept_imports: "Dovozy"
 concept_import: "Dovoz"
 concept_imported: "Importováno"
 concept_exporting: "Vývoz"
 concept_exports: "Vývozy"
 concept_export: "Vývoz"
 concept_exported: "Vyvezeno"
 concept_trade_desc: "Obchod je proces dovážení a vyvážení [Concept('concept_good','zboží')|l]. Většina obchodů probíhá autonomně prostřednictvím budovy [GetBuildingType('building_trade_center').GetName] přes [Concept('concept_world_market','světový trh')|l], ale [Concept('concept_country','země')|l] mohou také uzavírat [Concept('concept_treaty','smlouvy')|l] pro přímý obchod se zbožím mezi sebou. Obchod může být efektivní způsob, jak země mohou zlepšit svou ekonomickou situaci.\n" # todo: CONCEPT CASE
 concept_trade_revenue: "Obchodní příjmy"
 concept_trade_revenue_desc: "[Concept('concept_trade','Obchod')] generuje výnosy pro budovu [SelectLocalization(GetPlayer.IsValid,'concept_trade_revenue_desc_added','Obchodní centrum')], které ho spravuje, v závislosti na rozdílu [Concept('concept_market_price','tržní ceny')] a objemu obchodu. [Concept('concept_tariffs','Cla')] snižují generované obchodní příjmy." # todo: CONCEPT CASE
 concept_trade_revenue_desc_added: "[GetBuildingType('building_trade_center').GetName]"
 concept_trade_privilege: "Obchodní privilegium"
 concept_trade_privileges: "Obchodní privilegia"
 concept_trade_privilege_desc: "Typ [Concept('concept_article','článku')] ve [Concept('concept_treaty','smlouvě')], který jeden [Concept('concept_market_owner','majitel trhu')|l] uděluje jinému. Ovlivňuje každou [Concept('concept_country','zemi')] v příjemcově [Concept('concept_market','trhu')] a zvyšuje jejich [Concept('concept_trade_advantage','obchodní výhodu')] podle toho, kolik obchodu probíhá s dárcovým trhem." # todo: CONCEPT CASE
 concept_trade_advantage: "Obchodní výhoda"
 concept_relative_trade_advantage: "Relativní výhoda"
 concept_trade_advantage_short: "Výhoda"
 concept_trade_advantage_desc: "Obchodní výhoda je hodnota určující [Concept('concept_import_price','dovozní')] a [Concept('concept_export_price','vývozní cenu')] pro konkrétní budovu [GetBuildingType('building_trade_center').GetName], a tím přímo ovlivňuje množství obchodovaného [Concept('concept_good','zboží')|l]. Ovlivňují ji faktory jako úroveň budovy [GetBuildingType('building_trade_center').GetName], podíl [Concept('concept_market_area','oblasti trhu')|l] na globální produkci zboží, [Concept('concept_interest','zájem')|l] v relevantních [Concept('concept_strategic_region','strategického regionu')] a [Concept('concept_trade_privilege','obchodní privilegia')|l]. Obchodní výhoda se počítá pro každé zboží a směr zvlášť, takže například obchodní výhoda pro dovoz uhlí a vývoz textilu se liší." # todo: CONCEPT CASE
 concept_trade_potential: "Obchodní potenciál"
 concept_trade_potential_desc: "Obchodní potenciál je hrubý odhad potenciálu pro [Concept('concept_trade','dovoz')|l] nebo [Concept('concept_trade','vývoz')|l] [Concept('concept_good','zboží')|l] v konkrétním [Concept('concept_state','státě')]. Zohledňuje faktory jako [Concept('concept_local_price','místní cena')|l], [Concept('concept_world_market_price','cena na světovém trhu')|l], [Concept('concept_trade_advantage','obchodní výhoda')|l], rozdíl mezi [Concept('concept_good_production','výrobou')] a [Concept('concept_good_consumption','spotřebou')], stejně jako [Concept('concept_tariffs','cla')|l] a [Concept('concept_subventions','subvence')|l].\n\n@information! Obchodní potenciál by neměl být #b považován#! za přesnou předpověď objemu obchodu, ale je užitečný pro určení, se kterým zbožím pravděpodobně bude stát obchodovat více, pokud má volnou obchodní kapacitu." # todo: CONCEPT CASE
 concept_trade_capacity: "Obchodní kapacita"
 concept_trade_capacity_usage: "Využití obchodní kapacity"
 concept_trade_capacity_desc: "Obchodní kapacita je generována úrovněmi budovy [GetBuildingType('building_trade_center').GetName] a používá se k provádění [Concept('concept_trade','obchodu')] se [Concept('concept_world_market','světovým trhem')]. Množství [Concept('concept_good','zbožím')|l] obchodovaných na jednotku obchodní kapacity se liší podle zboží." # todo: CONCEPT CASE
 concept_market_area: "Oblast trhu"
 concept_market_areas: "Oblasti trhu"
 concept_market_area_possessive: "Oblasti trhu"
 concept_market_area_desc: "Oblasti trhu jsou části [Concept('concept_market','trhu')] propojené po souši nebo průlivem. Na každou oblast trhu připadá jedno [Concept('concept_world_market_hub','centrum světového trhu')|l], přes který se provádí [Concept('concept_trade','obchodem')|l] se [Concept('concept_world_market','světovým trhem')]." # todo: CONCEPT CASE
 concept_traded_quantity: "Obchodované množství"
 concept_traded_quantity_desc: "Množství [Concept('concept_good','zboží')|l], které je [Concept('concept_trade','importováno')|l] nebo exportováno za každou použitou [Concept('concept_trade_capacity','obchodní kapacitu')]." # todo: CONCEPT CASE
 concept_tariffs: "Cla"
 concept_tariff: "Clo"
 concept_tariff_rate: "Sazba cla"
 concept_tariffs_desc: "Cla jsou poplatek, který může [Concept('concept_country','země')|l] vybírat od budovy [GetBuildingType('building_trade_center').GetName] za každé [Concept('concept_trade','vyvezené')] nebo dovezené [Concept('concept_good','zboží')|l]. Proto činí obchodování s konkrétním zbožím méně atraktivním, například aby kritické vojenské zboží neopustilo zemi. Maximální úroveň cel určují [Concept('concept_law','zákony')|l] země. Úroveň cel pro všechny členy [Concept('concept_market','trh')] určuje [Concept('concept_market_owner','majitel trhu')|l]." # todo: CONCEPT CASE
 concept_subventions: "Subvence"
 concept_subvention: "Subvence"
 concept_subvention_rate: "Sazba subvence"
 concept_subventions_desc: "Subvence jsou finanční částky, které může [Concept('concept_country','země')|l] vyplácet budově [GetBuildingType('building_trade_center').GetName] za každé [Concept('concept_trade', 'importované')] nebo exportované [Concept('concept_good','zboží')|l]. Proto činí obchodování s daným zbožím atraktivnějším, což se hodí například ke oslabení konkurence. Maximální úroveň subvencí určují [Concept('concept_law','zákony')|l] [Concept('concept_country','země')|l]. Úroveň subvencí pro všechny členy [Concept('concept_market','trh')] určuje [Concept('concept_market_owner','majitel trhu')|l]." # todo: CONCEPT CASE
 concept_building_owners: "Vlastníci budov"
 concept_building_owning: "Vlastnictví budovy"
 concept_building_owners_desc: "Velikost [Concept('concept_building','budovy')] se dělí na [Concept('concept_building_level','úroveň budovy')|l]. Tyto úrovně mohou být buď [Concept('concept_privately_owned','soukromě vlastněné')] [Concept('concept_pop','populací')], nebo v [Concept('concept_nationally_owned','národním vlastnictví')] [Concept('concept_country','zemích')|l]. [Concept('concept_building_balance','Zisk')] ze budovy se dělí mezi jeho vlastníky jako [Concept('concept_dividends','dividendy')|l]." # todo: CONCEPT CASE
 concept_nationally_owned: "Národní vlastnictví"
 concept_nationally_owns: "Národně vlastní"
 concept_nationally_own: "Národně vlastněno"
 concept_nationally_owning: "Národně vlastnící"
 concept_nationally_owned_desc: "[Concept('concept_building_level','Úroveň budovy')], kterou vlastní [Concept('concept_government','vládu')|l] určité [Concept('concept_country','země')|l].\n\nÚrovně budov v národním vlastnictví vyplácí [Concept('concept_government_dividends','vládních dividendách')|l] vlastnící [Concept('concept_country','zemi')]. Zatímco úrovně v národním vlastnictví poskytují [Concept('concept_money','penězích')|l] přímo [Concept('concept_government','vládě')], stojí [Concept('concept_bureaucracy','byrokracii')] a mají snížené výhody z [Concept('concept_economy_of_scale','úspor z rozsahu')].\n\nÚrovně budovy postavené [Concept('concept_government_construction','vládní výstavbu')] se stávají národně vlastněné, a všechny [Concept('concept_government_building','vládní budovu')|l] jsou plně národně vlastněné.\n\nBudova může být [Concept('concept_nationalize','znárodněna')] k přeměně její úrovní na národně vlastněné, nebo se může stát [Concept('concept_privately_owned','soukromě vlastněnou')] prostřednictvím [Concept('concept_privatize','privatizace')|l]." # todo: CONCEPT CASE
 concept_privately_owned: "Soukromě vlastněno"
 concept_privately_own: "Soukromé vlastnictví"
 concept_privately_owns: "Soukromě vlastněno"
 concept_privately_owned_desc: "[Concept('concept_building_level','Úroveň budovy')], kterou vlastní [Concept('concept_pop','populaci')|l]. Tato populace je buď [Concept('concept_workforce','pracovní síla')|l] samotné [Concept('concept_building', 'budovy')], nebo [Concept('concept_workforce','pracovní síla')|l] $MANOR_HOUSES_GC_LINK$ a $FINANCIAL_DISTRICTS_GC_LINK$ (převážně $ARISTOCRATS_GC_LINK$ a $CAPITALISTS_GC_LINK$).\n\nSoukromně vlastnené úrovně budovy vyplácejí vlastníkům [Concept('concept_dividends','dividendám')|l].\n\nÚrovně budovy postavené prostřednictvím [Concept('concept_private_construction', 'soukromé výstavby')] se stávají soukromě vlastněnými.\n\nBudova může být [Concept('concept_nationalize', 'znárodněná')] k převodu její úrovní na [Concept('concept_nationally_owned','národní vlastnictví')|l], nebo se stát [Concept('concept_privately_owned','soukromě vlastněnou')] přes [Concept('concept_privatize','privatizaci')]." # todo: CONCEPT CASE
 concept_nationalize: "Znárodnit"
 concept_nationalized: "Znárodněné"
 concept_nationalization: "Znárodnění"
 concept_nationalizing: "Znárodňování"
 concept_national: "Národní"
 concept_nationalize_desc: "[Concept('concept_building','Budova')], která není plně [Concept('concept_nationally_owned','vlastněna státem')], může být znárodněná vlastníkem [Concept('concept_state','státem')], ve kterém se budova nachází.\n\nZnárodňování [Concept('concept_privately_owned','soukromě vlastněných')] úrovní může [Concept('concept_radical','radikalizovat')] [Concept('concept_pop','populaci')] vlastnící budovu, zejména pokud nenabídnete [Concept('concept_money','peněžní')] kompenzaci.\n\nTaké může být znárodněna zahraniční investice, pokud v zemi původu již není povoleno dělat zahraniční investice.\n\nDostupnost a náklady na znárodnění závisí na vašich zákonech pro $ECONOMIC_SYSTEM_GC_LINK$." # todo: CONCEPT CASE
 concept_privatize: "Privatizovat"
 concept_privatized: "Privatizováno"
 concept_privatization: "Privatizace"
 concept_privatizations: "Privatizace"
 concept_privatizing: "Privatizace"
 concept_private: "Soukromý"
 concept_privatize_desc: "[Concept('concept_building','Budova')], která je v [Concept('concept_nationally_owned','národním vlastnictví')|l], může být nabízena k prodeji, což umožňuje [Concept('concept_pop','populaci')] si ji zakoupit a udělat ji [Concept('concept_privately_owned','soukromě vlastněnou')] skrze [Concept('concept_investment_pool','investiční fond')|l]. Zda je privatizace dostupná, určuje váš $ECONOMIC_SYSTEM_GC_LINK$." # todo: CONCEPT CASE
 concept_monopoly: "Monopol"
 concept_monopolies: "Monopoly"
 concept_monopolize: "Monopolizovat"
 concept_monopolized: "Monopolizovaný"
 concept_monopoly_desc: "Monopol na [Concept('concept_building','budovu')] dává jeho vlastníkovi výhradní práva na daný [Concept('concept_building','průmysl')|l]. Může to být [Concept('concept_company_monopoly','monopol společnosti')|l] nebo [Concept('concept_country_monopoly','státní monopol')|l]." # todo: CONCEPT CASE
 concept_company_monopoly: "Monopol společnosti"
 concept_company_monopolies: "Monopoly společností"
 concept_company_monopolize: "Monopolizace společnosti"
 concept_company_monopolized: "Monopolizována společnost"
 concept_company_monopoly_short: "Monopol"
 concept_company_monopolies_short: "Monopoly"
 concept_company_monopolize_short: "Monopolizace"
 concept_company_monopolized_short: "Monopolizováno"
 concept_company_monopoly_desc: "Monopol společnosti dává [Concept('concept_company','společnost')|l] monopol na [Concept('concept_building', 'budovu')] s výhradními právy na tento [Concept('concept_building','průmysl')|l]." # todo: CONCEPT CASE
 concept_country_monopoly: "Státní monopol"
 concept_country_monopolies: "Státní monopoly"
 concept_country_monopolize: "Monopolizovat státem"
 concept_country_monopolized: "Státem monopolizováno"
 concept_country_monopoly_short: "Monopol"
 concept_country_monopolies_short: "Monopoly"
 concept_country_monopolize_short: "Monopolizovat"
 concept_country_monopolized_short: "Monopolizováno"
 concept_country_monopoly_desc: "Státní monopol poskytuje [Concept('concept_country','zemi')] [Concept('concept_country_monopoly','monopol')|l] na určitou [Concept('concept_building','budovu')|l] tím, že ji uděluje výhradní práva na tuto [Concept('concept_building', 'průmyslovou budovu')]." # todo: CONCEPT CASE
 concept_company_charter: "Privilej společnosti"
 concept_company_charters: "Charty společnosti"
 concept_company_charter_short: "Charta"
 concept_company_charters_short: "Charty"
 concept_company_charter_desc: "[Concept('concept_country','Země')] mohou svým [Concept('concept_company','společností')] udělit privilej #italic (počeštěná varianta původně latinského slova Privilegium značícího právní výsadu)#!, která poskytuje [Concept('concept_company','společnosti')] určitá práva. Tato práva se mohou pohybovat od založení [Concept('concept_monopoly','monopolu')] po práva stavět různý [Concept('concept_building','průmysl')|l] nebo zřizovat [Concept('concept_regional_company_hq','regionální ředitelství společnosti')|l] v jiné zemi. [Concept('concept_country','Země')] mají určité množství bezplatných privilejí, které mohou udělovat. [Concept('concept_technology','Technologie')] a [Concept('concept_law','zákony')|l] mohou toto omezení zvýšit. Další privileje nad limit mohou být [Concept('concept_company','společnostem')] uděleny za cenu v podobě [Concept('concept_authority','autoritě')]." # todo: CONCEPT CASE
 concept_company_hq: "Ředitelství společnosti"
 concept_company_hqs: "Ředitelství společností"
 concept_company_hq_short: "Ředitelství"
 concept_company_hqs_short: "Ředitelství"
 concept_company_hq_desc: "[Concept('concept_company_hqs','Ředitelství společností')] jsou [Concept('concept_building','budovy')|l], které představují správu aktiv [Concept('concept_company','společností')|l]. Vlastní [Concept('concept_building_level','úroveň budovy')|l], ze kterých získávají [Concept('concept_dividends','dividend')|l]." # todo: CONCEPT CASE
 concept_regional_company_hq: "Regionální ředitelství společnosti"
 concept_regional_company_hqs: "Regionální ředitelství společností"
 concept_regional_company_hq_short: "Regionální ředitelství"
 concept_regional_company_hqs_short: "Regionální ředitelství"
 concept_regional_company_hq_desc: "[Concept('concept_company','Společnost')] může zřídit regionální ředitelství společnosti na území cizí [Concept('concept_country','zemi')|l], pokud jí byla její vlastní zemí udělena investiční [Concept('concept_company_charter','listina')]. Kromě toho musí mít přístup do cizí země prostřednictvím [Concept('concept_foreign_investment_rights','práv na zahraničních investice')] a již zavedenou přítomnost v podobě menšího počtu [Concept('concept_building_level','úrovní budov')]. Regionální ředitelství společnosti se chová převážně jako [Concept('concept_company_hq','ředitelství společnosti')|l], avšak využívá [Concept('concept_investment_pool','investiční fond')|l] cizí země k výstavbě dalších úrovní budov a část svých [Concept('concept_dividends','dividend')] přímo reinvestuje do investičního fondu své vlastní země." # todo: CONCEPT CASE
 concept_company_category: "Kategorie společnosti" # todo: NEW TRANSLATION
 concept_company_categories: "Kategorie společností" # todo: NEW TRANSLATION
 concept_company_category_short: "Kategorie" # todo: NEW TRANSLATION
 concept_company_categories_short: "Kategorie" # todo: NEW TRANSLATION
 concept_company_category_desc: "A $concept_company_category$ popisuje, které druhy [Concept('concept_pop','populace')] se podílejí na vlastnictví [Concept('concept_company','společnost')]. Určuje, které [Concept('concept_production_method','výrobní metody')] jsou dostupné v [Concept('concept_company_hq','ředitelství společnosti')], a tím formuje, které [Concept('concept_profession','profese')] jsou tam zaměstnány. Také určuje, kdo obdrží podíl z [Concept('concept_dividends','dividend')] a zda $concept_company$ platí [Concept('concept_government_dividends','vládní dividendy')] nebo ne.\n\n#title Tyto $concept_company_categories_short$ jsou:#!#indent_newline:3 \n#b $company_category_capitalist_owned$#!#indent_newline:3 \n$company_category_capitalist_owned_desc$#!\n\n#b $company_category_aristocrat_owned$#!#indent_newline:3 \n$company_category_aristocrat_owned_desc$#!\n\n#b $company_category_shopkeeper_owned$#!#indent_newline:3 \n$company_category_shopkeeper_owned_desc$#!\n\n#b $company_category_bureaucrat_owned$#!#indent_newline:3 \n$company_category_bureaucrat_owned_desc$#!\n\n#b $company_category_academic_owned$#!#indent_newline:3 \n$company_category_academic_owned_desc$#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 concept_concept: "Koncept"
 concept_concepts: "Koncepty"
 concept_concept_desc: "Jedná se o herní koncept, který lze tzv. tooltipovat s jiným [Concept('concept_concept', 'konceptem')] uvnitř."
 concept_sol: "Životní standard"
 concept_sol_desc: "Životní standard měří životní podmínky [Concept('concept_pop','populace')|l], přičemž základním ukazatelem je její [Concept('concept_wealth','bohatství')|l]. Životní úroveň ovlivňuje [Concept('concept_pop_growth','míru porodnosti a úmrtnosti')] a při každé změně může způsobit, že se populace stanou buď více [Concept('concept_radical','radikálními')], nebo naopak [Concept('concept_loyalist','loajálními')]. Průměrný životní standard v daném [Concept('concept_state','státě')] ovlivňuje jeho [Concept('concept_migration_pull','migrační přitažlivosti')|l]." # todo: CONCEPT CASE
 concept_expected_sol: "Očekávaný minimální životní standard"
 concept_expected_sol_short: "Životní minimum"
 concept_expected_sol_desc: "Očekávaný minimální životní standard je nejnižší [Concept('concept_sol','životní standard')|l], který je [Concept('concept_pop','populace')|l] ochotna tolerovat. Toto číslo se odvíjí od toho, zda populace je součástí [Concept('concept_lower_strata','nižší třídou')], [Concept('concept_middle_strata','střední třídou')] nebo [Concept('concept_upper_strata', 'vyšší třídy')] a je upraveno podle [Concept('concept_literacy', 'gramotnosti')] a může být pozměněno určitými [Concept('concept_technology', 'technologiemi')]. Pokud má populace nižší životní standard než životní minimum, bude se postupně více [Concept('concept_radical', 'radikalizovat')]. Populace s životním standardem nad životním minimem se stále stanou více radikálními, pokaždé když se jejich životní standard sníží." # todo: CONCEPT CASE
 concept_famine: "Hladomor"
 concept_famines: "Hladomory"
 concept_famine_desc: "Hladomor je výsledkem velké části [Concept('concept_pop','populací')|l] ve [Concept('concept_state','státě')], která trpí [Concept('concept_starvation','hladu')]. Je primárně politickou klasifikací, která má přitáhnout pozornost k tragedii těch, kdo potřebují pomoc ve vaší společnosti.\n\nHladomor je vyhlášen ve [Concept('concept_state','státě')], pokud jsou splněny všechny tyto podmínky:\n$EFFECT_LIST_BULLET$alespoň #b #r [GetDefine('NPops', 'FAMINE_POPULATION_SHARE_IN_STARVATION')|0%]#!#! z populace hladuje\n$EFFECT_LIST_BULLET$alespoň #b #r [GetDefine('NPops', 'FAMINE_POPULATION_SHARE_IN_SEVERE_STARVATION')|%0]#!#! trpí těžkým hladomorem.\n$EFFECT_LIST_BULLET$stát #b nepatří #! [Concept('concept_decentralized_nation','decentralizovanému národu')]" # todo: CONCEPT CASE
 concept_food_security: "Potravinová bezpečnost"
 concept_food_security_desc: "Potravinová bezpečnost měří, jak snadné nebo obtížné je pro [Concept('concept_pop','populace')] získat veškeré potraviny potřebné k přežití. Pokud potravinová bezpečnost populace klesne příliš nízko, začne trpět [Concept('concept_starvation','hladem')]. Čím nižší potravinová bezpečnost, tím tvrdší budou účinky hladu.\n\nExistují dva hlavní faktory, které ovlivňují potravinovou bezpečnost. Prvním z nich je, zda je [GetPopNeed('popneed_basic_food').GetName|l] dostupné [Concept('concept_shortage','v dostatečném množství')] pro [Concept('concept_pop_needs','potřeby populace')|l]. Druhý faktor se zakládá na tom, kolik [Concept('concept_money','peníze')] populace utrácí za [GetPopNeed('popneed_basic_food').GetNameNoFormatting|l] ve srovnání s jeho očekávanými náklady na základě ceny." # todo: CONCEPT CASE
 concept_starvation: "Hlad"
 concept_starving: "Hladovějící"
 concept_mild_starvation: "Mírné hladovění"
 concept_mild_starvation_short: "Mírné"
 concept_severe_starvation: "Těžký hladomor"
 concept_severe_starvation_short: "Těžký"
 concept_starvation_desc: "[Concept('concept_pop','Populace')] se považuje za hladovějící, pokud je jejich [Concept('concept_food_security','potravinová bezpečnost')|l] příliš nízká. To může být způsobeno tím, že [Concept('concept_pop','populace')|l] má příliš nízké [Concept('concept_wealth','bohatství')|l], nebo jednoduše proto, že [GetPopNeed('popneed_basic_food').GetName|l] je pro populaci nedostatkovým zbožím.\n\n#b Mírné hladovění#! začíná na #b #v [GetDefine('NPops', 'FOOD_SECURITY_STARVATION_THRESHOLD')|0%]#!#! potravinové bezpečnosti a má snížené účinky.\n[GetStaticModifier('starvation_penalty').GetDesc]\n\n#r Těžký hladomor#! dochází při #b #v [GetDefine('NPops', 'FOOD_SECURITY_SEVERE_STARVATION_THRESHOLD')|0%]#!#! potravinové bezpečnosti a má přísnější účinky. Pokud se to ponechá bez povšimnutí, povede to k úmrtí populace.\n[GetStaticModifier('severe_starvation_penalty').GetDesc]\n\nNavíc populace, kteří trpí hladem, se také časem [Concept('concept_radical','radikalizují')]. Kolik lidí se radikalizuje (a jakým tempem) závisí na tom, jak nízká je jejich [Concept('concept_food_security','potravinová bezpečnost')|l]." # todo: CONCEPT CASE
 concept_harvest_condition: "Podmínky sklizně"
 concept_harvest_conditions: "Podmínky sklizně"
 concept_harvest_condition_desc: "Podmínky sklizně jsou událostí, která primárně ovlivňuje venkovský sektor [Concept('concept_country','země')|l] s proměnlivou [Concept('concept_harvest_condition_intensity','intenzitou podmínek sklízně')], trváním a rozsahem. Obecně se jedná o přírodní jev a může mít buď #g pozitivní#! nebo #r negativní#! účinky na [Concept('concept_state','stát')|l], které ovlivňuje. [Concept('concept_harvest_conditions','Podmínky sklizně')] mají většinu dopadů na [Concept('concept_throughput','efektivitu')] zemědělských [Concept('concept_building','budovy')], ale také mohou mít dopad na vaši [Concept('concept_pop','populaci')] a [Concept('concept_states','státy')|l] jiným způsobem, například snížením dostupné [Concept('concept_infrastructure','infrastruktury')].\n\n[Concept('concept_harvest_conditions','Podmínky sklizně')] často ovlivní [Concept('concept_states','státy')|l], které se nachází v okolí jejich #b epicentra#!. V takových případech se [Concept('concept_harvest_condition_intensity','intenzitou podmínek sklízně')] obvykle zmenší, jak se vzdálenost od #b epicentra#! zvyšuje.\n\n#title Potenciální [Concept('concept_harvest_conditions','podmínky sklizně')]:#!#indent_newline:3 \n[GetHarvestConditionTypesList]#!" # todo: CONCEPT CASE
 concept_harvest_condition_intensity: "Intenzita podmínek sklízně"
 concept_harvest_condition_intensity_short: "Intenzita"
 concept_harvest_condition_intensity_desc: "Intenzita [Concept('concept_harvest_condition','Podmínky sklizně')] násobí její efekty na [Concept('concept_state','stát')|l]. Čím blíže se stát nachází k epicentru, tím vyšší bude pravděpodobně [Concept('concept_harvest_condition_intensity_short','intenzita')|l]." # todo: CONCEPT CASE
 concept_pop_growth: "Populační růst"
 concept_pop_growth_birthrate_and_mortality: "Míra porodnosti a úmrtnosti"
 concept_pop_growth_birthrate: "Míra porodnosti"
 concept_pop_growth_mortality: "Úmrtnost"
 concept_pop_growth_desc: "Čistý počet [Concept('concept_individual','jednotlivců')], který [Concept('concept_pop','populace')|l] získává nebo ztrácí v průběhu času, je řízen její mírou porodnosti a úmrtnosti. Obe metriky jsou řízeny [Concept('concept_sol','životním standardem')] a modifikovány faktory jako nemoc, nebezpečné pracovní podmínky, prospěšné [Concept('concept_institution','instituce')|l] a dostupný životní prostor.\n\n@information! Externí změny ve velikosti populace kvůli např. [Concept('concept_migration','Migrace')] nebo [Concept('concept_war','válečným')] [Concept('concept_casualties','ztrátám')] nejsou považovány za růst populace." # todo: CONCEPT CASE
 concept_individual: "Jednotlivec"
 concept_individuals: "Jednotlivci"
 concept_individual_desc: "Jedinec je jediná osoba uvnitř [Concept('concept_pop','populace')|l], která může být buď [Concept('concept_working_adults','pracující dospělý')|l] nebo [Concept('concept_dependents','závislá osoba')|l]. Všechny [Concept('concept_pop','populace')|l] se skládají z jednotlivců se stejnou [Concept('concept_culture','kulturou')], [Concept('concept_religion','náboženstvím')], [Concept('concept_profession','profesí')] a [Concept('concept_building','pracovištěm')]." # todo: CONCEPT CASE
 concept_jobseeker: "Uchazeč"
 concept_jobseekers: "Uchazeči"
 concept_jobseeking: "Hledání práce"
 concept_jobseeker_desc: "Uchazeč je [Concept('concept_working_adults','pracující dospělý')|l] se záporní negativním [Concept('concept_job_satisfaction','spokojeností s prací')], který nepracuje ve [Concept('concept_government_building','vládní budově')] nebo v [Concept('concept_building','budově')], která je [Concept('concept_subsidies','dotována')]." # todo: CONCEPT CASE
 concept_building: "Budova"
 concept_buildings: "Budovy"
 concept_building_industry: "Průmysl"
 concept_building_industries: "Průmysly"
 concept_building_possessive: "Budovy"
 concept_buildings_possessive: "Budov"
 concept_building_workplace: "Pracoviště"
 concept_building_desc: "Budovy řídí ekonomiku vaší [Concept('concept_country','zemi')|l] prostřednictvím [Concept('concept_good_production','výroby')] (a [Concept('concept_good_consumption','spotřeby')]) [Concept('concept_good','zboží')|l]. Mohou také produkovat řadu dalších užitečných věcí, jako je [Concept('concept_bureaucracy','byrokracie')|l], [Concept('concept_infrastructure','infrastruktura')|l] a [GetGoods('merchant_marine').GetName|l].\n\nK vykonávání jejich funkcí vyžadují [Concept('concept_workforce','pracovní sílu')|l] složenou z [Concept('concept_pop','populací')|l] různých [Concept('concept_profession','profesí')], kteří za svoji práci dostávají [Concept('concept_building_wage','mzdu')].\n\nJakou funkci plní konkrétní budova určují její aktivní [Concept('concept_production_method','výrobní metody')|l], a velikost její dopadu na produkci určuje její [Concept('concept_building_level','úroveň')|l].[AddLocalizationIf(GetPlayer.IsValid,'concept_building_desc_added')]" # todo: CONCEPT CASE
 concept_building_desc_added: "\n\nMůžete [Concept('concept_construction','postavit')|l] nové nebo rozšířit stávající budovy v každém vašem [Concept('concept_state','státě')] pomocí budovy [GetBuildingType('building_construction_sector').GetName]." # todo: CONCEPT CASE
 concept_building_group: "Skupina budov"
 concept_building_groups: "Skupiny budov"
 concept_building_group_desc: "Skupina budov je skupina [Concept('concept_building','budov')], obvykle používaná k popisu podobných budov, které jsou potřeba k splnění určitých podmínek, například pro [Concept('concept_journal_entry','záznam v deníku')].\n\n#title Běžné skupiny budov jsou:#!#indent_newline:3 \n• [GetBuildingGroup('bg_agriculture').GetName]\n• [GetBuildingGroup('bg_plantations').GetName]\n• [GetBuildingGroup('bg_staple_crops').GetName]#!" # todo: CONCEPT CASE
 concept_company: "Společnost"
 concept_companies: "Společnosti"
 concept_company_possessive: "Společnost"
 concept_company_desc: "Společnosti jsou spojeny s jedním nebo několika typy [Concept('concept_building','budov')] v [Concept('concept_country','zemích')]. Po jejich založení v této zemi zvyšují [Concept('concept_throughput','efektivitu')] a @construction![Nbsp] [Concept('concept_construction','efektivitu výstavby')] svých přidružených budov. Míra, do jaké společnost poskytuje výhody, závisí na relativním hodnocení [Concept('concept_prestige','prestiž')] dané země v porovnání se zeměmi v #v Top [GetDefine('NDiplomacy','TOP_PRESTIGE_RANK_BONUS_THRESHOLD')]#!, které dostávají ještě silnější bonusy.\n\nSpolečnosti disponují skórem [Concept('concept_prosperity','prosperitou')], které se zvyšuje z vysoké [Concept('concept_productivity','produktivity')] a může poskytnout dodatečné bonusy pro svou zemi." # todo: CONCEPT CASE
 concept_prosperity: "Prosperita"
 concept_prosperous: "Prosperujúci"
 concept_prosperity_desc: "Společnosti mají skóre prosperity, které závisí na jejich [Concept('concept_productivity','produktivitě')]. Když má společnost prosperitu alespoň [GetDefine('NEconomy','COMPANY_PROSPERITY_BONUS_ACTIVATION_THRESHOLD')|v0], bude se považovat za prosperující a aktivuje se bonusový [Concept('concept_modifier','modifikátor')|l] pro její [Concept('concept_country','země')].\nPokud prosperita prosperující společnosti klesne pod [GetDefine('NEconomy','COMPANY_PROSPERITY_BONUS_DEACTIVATION_THRESHOLD')|v0], přestane být považována za prosperující a její bonusový [Concept('concept_modifier','modifikátor')|l] bude deaktivován." # todo: CONCEPT CASE
 concept_building_level: "Úroveň budovy"
 concept_building_level_short: "Úroveň"
 concept_building_levels: "Úrovně budovy"
 concept_building_levels_short: "Úrovně"
 concept_building_levels_parenthetical_plural: "Úroveň budovy"
 concept_building_levels_parenthetical_plural_short: "Úroveň"
 concept_building_level_desc: "Úroveň [Concept('concept_building','Budova')|l] škáluje aktuální [Concept('concept_good_consumption', 'spotřebu')], [Concept('concept_good_production', 'výrobu')] a požadavky na [Concept('concept_workforce', 'pracovní sílu')], a může mít vliv na [Concept('concept_economy_of_scale','úspory z rozsahu')|l].\n\nRozšíření úrovně budovy obvykle vyžaduje [Concept('concept_construction', 'výstavbu')], ačkoliv některé úrovně budovy se automaticky přizpůsobují na základě dalších faktorů, jako jsou [Concept('concept_infrastructure','infrastruktura')|l], míra [Concept('concept_conscription_center','odvodů')|l], nebo nevyužitá [Concept('concept_arable_land','orná půda')|l].\n\nKaždá úroveň je buď [Concept('concept_privately_owned','soukromě vlastněná')] nebo je v [Concept('concept_nationally_owned','národním vlastnictví')].\n\nMaximální úroveň, na kterou může být [Concept('concept_building','budova')|l] rozšířena, může záviset na [Concept('concept_resource_potential','potenciál zdrojů')] nebo [Concept('concept_arable_land','ornou půdu')] ve [Concept('concept_state','státě')]." # todo: CONCEPT CASE
 concept_diplomatic_play: "Diplomatická hra"
 concept_diplomatic_play_short: "Hra"
 concept_diplomatic_plays: "Diplomatické hry"
 concept_diplomatic_plays_short: "Hry"
 concept_diplomatic_play_negotiated: "Jednaný"
 concept_diplomatic_play_desc: "Diplomatická hra je období nepřátelských diplomatických jednání mezi dvěma nebo více [Concept('concept_country','zemí')], které nastává poté, co jedna země vznesla vůči jiné požadavek na ústupek. Pro zahájení diplomatické hry musíte mít dostatečně vysokou [Concept('concept_interest_tier','úroveň zájmu')|l] v příslušném [Concept('concept_strategic_region','strategickém regionu')], což vás zároveň opravňuje účastnit se diplomatických her jako třetí strana v daném strategickém regionu.\n\nDiplomatická hra bude [Concept('concept_escalation', 'eskalován')] během tří fází: [Concept('concept_opening_moves','počátečních kroků')], [Concept('concept_diplomatic_maneuvers','diplomatických manévrů')|l] a [Concept('concept_countdown_to_war','odpočtu do války')|l]. Tyto fáze stanovují podmínky případné [Concept('concept_peace_deal','mírové smlouvy')], pokud diplomatické hry eskalují do [Concept('concept_war','války')|l]. Válka lze odvrátit, pokud buď [Concept('concept_initiator','iniciátor')|l], nebo [Concept('concept_target','cíl')|l] hra ustoupí a přizná druhé straně její [Concept('concept_primary_demand','primární požadavky')]." # todo: CONCEPT CASE
 concept_sympathy: "Sympatie"
 concept_sympathy_desc: "Všechny AI řízené [Concept('concept_country','země')|l] zapojené do [Concept('concept_diplomatic_play','diplomatické hry')] začínají s úrovní sympatii pro každou stranu, což ovlivňuje, jak pravděpodobné je, že je podpoří v konfliktu. AI [Concept('concept_country','země')|l] mají tendenci mít vyšší sympatie pro [Concept('concept_target','cíl')|l], pro země, se kterými mají [Concept('concept_diplomatic_pact','diplomatickým paktem')|l], a pro ty, kteří se staví proti [Concept('concept_country','zemím')] s vysokou [Concept('concept_infamy','infamii')]. Sympatie můžou také vzrůst v průběhu [Concept('concept_diplomatic_play','diplomatické hry')], protože strana, která získá mocné zastánce nebo hromadí [Concept('concept_infamy','infamii')] přidávaním [Concept('concept_war_goal','válečným cílem')] často generuje sympatie pro opačnou stranu." # todo: CONCEPT CASE
 concept_neutrality: "Neutralita"
 concept_neutrality_desc: "Všechny AI řízené [Concept('concept_country','země')|l] zapojené do [Concept('concept_diplomatic_play','diplomatické hry')] mají úroveň [Concept('concept_neutrality','neutrality')] založenou na jejich vnitřních podmínkách a obecné úrovni zájmu o účastníky hry. Čím vyšší je jejich [Concept('concept_neutrality','neutralita')|l], tím obtížnější bude přesvědčit tihle [Concept('concept_country','země')|l], aby se zapojili do hry." # todo: CONCEPT CASE
 concept_confidence: "Sebevědomí"
 concept_confidence_desc: "Umělou inteligencí ovládaná [Concept('concept_country','země')|l], která je jedním z hlavních účastníků v [Concept('concept_diplomatic_play','diplomatické hře')], má úroveň [Concept('concept_confidence','sebevědomí')|l], jež se odvíjí od její vnitřní situace a od toho, jak pravděpodobné se jí jeví vítězství v případné válce. Pravděpodobnost, že se AI [Concept('concept_country','země')|l] rozhodne ustoupit, přímo závisí na jejím [Concept('concept_confidence','sebevědomí')|l] — i když ani nízká úroveň [Concept('concept_confidence','sebevědomí')|l] nezaručuje ústup, zejména pokud by znamenal její anexi." # todo: CONCEPT CASE
 concept_maneuver: "Manéver"
 concept_maneuvers: "Manévry"
 concept_maneuver_desc: "Manévry mohou být utraceny za akce v [Concept('concept_diplomatic_play','diplomatické hře')], včetně požadování dalších [Concept('concept_war_goal','válečních cílů')] nebo [Concept('concept_sway','ovlivňování')|l] jiných [Concept('concept_country','zemí')] na svou stranu. Množství manévrů, které máte, je omezeno vaší [Concept('concept_rank','hodnost')]." # todo: CONCEPT CASE
 concept_opening_moves: "Počáteční kroky"
 concept_opening_moves_desc: "Fáze počátečních kroků je první fází [Concept('concept_diplomatic_play','diplomatickou hrou')]. V této fázi si [Concept('concept_target','cíli')|l] nastaví svůj primární [Concept('concept_war_goal','válečný cíl')|l], a obě strany - jak  [Concept('concept_initiator','iniciátor')|l], tak i cíl, si mohou nárokovat další [Concept('concept_war_goal','válečné cíle')|l] pomocí [Concept('concept_maneuver','manévrů')]." # todo: CONCEPT CASE
 concept_diplomatic_maneuvers: "Diplomatické manévry"
 concept_diplomatic_maneuvers_desc: "Diplomatické manévry jsou druhou fází [Concept('concept_diplomatic_play','diplomatickou hrou')]. V této fázi se [Concept('concept_initiator','iniciátorem')|l] a [Concept('concept_target','cílem')|l] mohou pokusit [Concept('concept_sway','ovlivnit')] ostatní [Concept('concept_country','země')|l], aby se přiklonili na jejich stranu, nebo si nárokovat další [Concept('concept_war_goal','válečné cíle')|l] pro sebe, za cenu [Concept('concept_maneuver', 'manévrů')]." # todo: CONCEPT CASE
 concept_countdown_to_war: "Odpočet do války"
 concept_countdown_to_war_desc: "Fáze $concept_countdown_to_war$ je třetí a poslední fází [Concept('concept_diplomatic_play','diplomatickou hrou')]. [Concept('concept_war','Válka')] se jeví jako nevyhnutelná, obě strany horečně dělají přípravy nebo zvažují jakékoli poslední možnosti ustoupit.\n\n@information! Typické přípravy na válku zahrnují: [Concept('concept_mobilize_army','mobilizace')|l] [Concept('concept_army','armád')], udělování svým [Concept('concept_general','generálem')] [Concept('concept_order','rozkazem')] na postup nebo obranu [Concept('concept_front','frontu')|l], povolávání [Concept('concept_conscript_battalion', 'odvedenců')] a povyšování vašich generálů pro zvýšení jejich [Concept('concept_command_limit', 'velitelského limitu')] tam, kde je to nutné." # todo: CONCEPT CASE
 concept_war_leader: "Válečný vůdce"
 concept_war_leaders: "Váleční vůdci"
 concept_war_leader_desc: "Jedna [Concept('concept_country','země')|l] na každé straně [Concept('concept_war','válce')] je považována za válečného vůdce tyhle strany, obvykle (ale ne vždy) to bývá [Concept('concept_initiator','iniciátor')|l] [Concept('concept_diplomatic_play','diplomatické hry')] a jeho [Concept('concept_target','cíle')|l]. Jen oni mohou navrhnout [Concept('concept_peace_deal','mírové smlouvy')|l], přičemž každá smlouva musí být ratifikována všemi vyjednávajícími členy války, aby byla přijata." # todo: CONCEPT CASE
 concept_initiator: "Iniciátor"
 concept_initiator_desc: "[Concept('concept_country','Země')], která začala [Concept('concept_diplomatic_play','diplomatickou hru')]." # todo: CONCEPT CASE
 concept_target: "Cíl"
 concept_target_desc: "Cílová [Concept('concept_country','země')|l] v [Concept('concept_diplomatic_play','diplomatické hre')]." # todo: CONCEPT CASE
 concept_homeland: "Domovina"
 concept_homelands: "Domoviny"
 concept_homeland_desc: "Domoviny pro jednotlivé [Concept('concept_culture','kulturu')|l] se skládají z těch [Concept('concept_state_region','státní oblasti')], které [Concept('concept_pop','populace')|l] této kultury považují za své historické nebo přirozené území. Populace mají větší tendenci [Concept('concept_migration','migrovat')] do svých domovin než do jiných [Concept('concept_state','států')], a populace, které se tam nacházejí, nikdy nezváží [Concept('concept_assimilation','asimilování')|l].\n\nZahájení [Concept('concept_diplomatic_play','diplomatické hry')] k dobytí státu považovaného za domovinu jedné z vašich [Concept('concept_primary_cultures','primárních kultur')] je považováno za relativně legitimní a bude generovat podstatně méně [Concept('concept_infamy','infamie')] než obvykle." # todo: CONCEPT CASE
 concept_mobilization_option: "Mobilizační možnost"
 concept_mobilization_option_short: "Možnost"
 concept_mobilization_options: "Mobilizační možnosti"
 concept_mobilization_option_desc: "[Concept('concept_army','Armáda')] může být v čase míru upravená libovolnou kombinací mobilizačných možností. Každá možnost přináší určitý náklad ve formě [Concept('concept_good','zboží')|l] a ovlivňuje všechny [Concept('concept_battalion','prapory')|l] v armádě po jejím [Concept('concept_mobilize_army','zmobilizování')]." # todo: CONCEPT CASE
 concept_mobilize_army: "Mobilizace armády"
 concept_mobilize_army_mobilize: "Mobilizovat"
 concept_mobilize_army_mobilizing: "Mobilizace"
 concept_mobilize_army_mobilized: "Mobilizováno"
 concept_mobilize_army_mobilization: "Mobilizace"
 concept_mobilize_army_demobilize: "Demobilizovat"
 concept_mobilize_army_demobilized: "Demobilizovaný"
 concept_mobilize_army_demobilization: "Demobilizace"
 concept_mobilize_army_desc: "Mobilizace [Concept('concept_army','Armáda')|l] okamžitě zahájí proces mobilizace pro všechny vybrané [Concept('concept_battalion','prapory')|l]. Mobilizovaná [Concept('concept_army','armádu')|l] se automaticky demobilizuje, jakmile [Concept('concept_country','země')|l] přestane být ve [Concept('concept_war','válce')]. Předčasná demobilizace během aktivní války je možná, ale vyžaduje čas a značné náklady." # todo: CONCEPT CASE
 concept_mobilize_battalion: "Mobilizovat prapor"
 concept_mobilize_battalion_demobilized: "Demobilizovaný"
 concept_mobilize_battalion_mobilize: "Mobilizovat"
 concept_mobilize_battalion_mobilizing: "Mobilizace"
 concept_mobilize_battalion_mobilized: "Mobilizováno"
 concept_mobilize_battalions_mobilized: "Mobilizované prapory"
 concept_mobilize_battalion_mobilization: "Mobilizace"
 concept_mobilize_battalion_mobilized_manpower: "Mobilizovaný personál"
 concept_mobilize_battalion_desc: "[Concept('concept_battalion','Prapor')] v [Concept('concept_mobilize_army','mobilizované')] [Concept('concept_army','armádě')] okamžitě začínají s mobilizací rychlostí založené na [Concept('concept_infrastructure','infrastrukturu')] jejich [Concept('concept_state','státu')], přičemž lepší [Concept('concept_infrastructure','infrastruktura')|l] znamená, že lze mobilizovat více praporů najednou. Mobilizované a mobilizovány prapory spotřebovávají více [Concept('concept_military_good','vojenského zboží')] na základě vybraných [Concept('concept_mobilization_option','mobilizačných možností')] [Concept('concept_army','armád')|l], ale jsou plně připravené následovat jakéhokoliv [Concept('concept_general','generála')] do [Concept('concept_battle','bitvy')]." # todo: CONCEPT CASE
 concept_fully_mobilized_battalions: "Plně mobilizované prapory"
 concept_fully_mobilized_battalions_desc: "Plně mobilizované [Concept('concept_battalion','prapory')|l] [Concept('concept_country','země')] zahrnují všechny [Concept('concept_mobilize_army', 'mobilizované')] prapory v [Concept('concept_army','armádach')], které již prošly [Concept('concept_mobilize_battalion','mobilizací')] a jsou plně připraveny následovat jakéhokoli z armádních [Concept('concept_general','generálů')] do [Concept('concept_battle','bitvy')]." # todo: CONCEPT CASE
 concept_available_battalions: "Dostupné prapory"
 concept_available_battalions_desc: "Dostupné [Concept('concept_battalion','prapory')|l] [Concept('concept_country','země')] zahrnují všechny prapory aktuálně povolány do služby [SelectLocalization(GetPlayer.IsValid,'concept_available_battalions_desc_added','kasárnami')] a/nebo [Concept('concept_conscription_center','náborovými centrami')]." # todo: CONCEPT CASE
 concept_available_battalions_desc_added: "[GetBuildingType('building_barrack').GetName]"
 concept_potential_battalions: "Potenciální prapor"
 concept_potential_regulars: "Potenciální pravidelní vojáci"
 concept_potential_conscripts: "Potenciální odvedenci"
 concept_potential_battalions_desc: "Maximální potenciální počet [Concept('concept_battalion','praporů')] [Concept('concept_country','země')|l] je součtem jeho potenciálních pravidelných praporů a potenciálních [Concept('concept_conscript_battalion','praporů odvedenců')].\n\n#b Potenciální pravidelní prapory#!: počet praporů, které aktuálně postavené budovy [SelectLocalization(GetPlayer.IsValid,'concept_potential_battalions_desc_added','kasárny')] [Concept('concept_country','země')|l] podporují\n\n#b Potenciální prapory#!: počet praporů, které by dodali budovy [SelectLocalization(GetPlayer.IsValid,'concept_potential_battalions_desc_additional','zápis konzervace')] v [Concept('concept_country','zemích')], pokud by byl [Concept('concept_conscription_center','odvod')|l] aktivován ve všech [Concept('concept_state','státu')]" # todo: CONCEPT CASE
 concept_potential_battalions_desc_added: "[GetBuildingType('building_barrack').GetName]"
 concept_potential_battalions_desc_additional: "[GetBuildingType('building_conscription_center').GetName]"
 concept_conscription_center: "Odvodové středisko"
 concept_conscription_centers: "Odvodová střediska"
 concept_conscription_center_conscription: "Odvod"
 concept_conscripted: "Odvedený"
 concept_conscription: "Odvod"
 concept_conscription_center_desc: "Když je [Concept('concept_state','stát')|l] během [Concept('concept_diplomatic_play','diplomatické hry')] nebo [Concept('concept_war','války')] mobilizován, objeví se v něm [SelectLocalization(GetPlayer.IsValid,'concept_conscription_center_desc_added','centrum pro povinnou službu')] s [Concept('concept_building_level','úrovní budovy')] odpovídající [#v míre odvodů#!] a velikosti [Concept('concept_pop','populace')|l] ve státě. Tato [Concept('concept_military_building','vojenská budova')|l] rekrutuje civilní [Concept('concept_workforce','pracovní sílu')] do [Concept('concept_conscript_battalion','odvedeného praporu')], které budou automaticky přiřazeny k [Concept('concept_general','generálovi')] ve svých [Concept('concept_hq','velitelstvích')], jakmile budou vytvořeny.\n\nPo válce se všechna odvodovými středisky deaktivují a odvedené prapory se rozpustí. Populace, ktera se vrátí do civilní služby, nemá zaručeno, že se vrátí k předchozí [Concept('concept_profession','profesi')], ale musí si hledat nové možnosti zaměstnání." # todo: CONCEPT CASE
 concept_conscription_center_desc_added: "[GetBuildingType('building_conscription_center').GetName]"
 concept_conscription_limit: "Limit odvedenců"
 concept_conscription_limit_short: "Limit"
 concept_conscription_limit_desc: "Maximální počet [Concept('concept_conscript_battalion', 'odvedených praporů')], které [Concept('concept_state','stát')|l] může rekrutovat. Limit odvedenců se vypočítává z [Concept('concept_workforce','pracovní síly')] určitého státu vynásobeného jeho mírou odvodů. Nemůže přesáhnout maximální limit odvodů stanovený vaším [Concept('concept_law','zákonem')] [GetLawGroup('lawgroup_army_model').GetName]." # todo: CONCEPT CASE
 concept_strategic_objective: "Strategický cíl"
 concept_strategic_objectives: "Strategické cíle"
 concept_strategic_objective_short: "Cíl"
 concept_strategic_objective_desc: "Strategický cíl může být přiřazen k armádě. Pokud je některý [Concept('concept_state','stát')|l] – nepřátelský nebo přátelský – přiřazen jako strategický cíl armády, všichni její postupující [Concept('concept_general','generálové')|l] se budou snažit posouvat [Concept('concept_front','frontu')] směrem k tomuto státu. Pokud je daný stát pod přátelskou kontrolou, armáda se zaměří na rozšíření obranného perimetru kolem něj. Při obraně se generálové zaměří na obranu státu a okolních oblastí a budou upřednostňovat obranné [Concept('concept_battle','bitvy')|l], které se nacházejí nejblíže ke strategickému cíli.\n\nJedna armáda může mít pouze jeden strategický cíl, ale více armád může sdílet ten samý strategický cíl v podobě konkrétního státu." # todo: CONCEPT CASE
 concept_conscript_battalion: "Odvedený prapor"
 concept_conscript_battalions: "Odvedené prapory"
 concept_conscript_battalion_short: "Odvedenec"
 concept_conscript_battalions_short: "Odvedenci"
 concept_conscript_battalion_drafting: "Povolávání"
 concept_conscript_battalion_desc: "Odvedené prapory jsou dočasné [Concept('concept_battalion','prapory')|l] rekrutované a udržované z civilní [Concept('concept_pop','populace')|l] [Concept('concept_conscription_center','odvodového střediska')] a aktivované během [Concept('concept_diplomatic_play','diplomatické hry')|l] nebo [Concept('concept_war','války')].\n\n@information! Pozor, odvedené prapory se nepočítají do [Concept('concept_command_limit','velitelského limitu')] [Concept('concept_army','armády')], dokud nejsou skutečně povolány a nasazeny." # todo: CONCEPT CASE
 concept_front: "Fronta"
 concept_fronts: "Fronty"
 concept_front_desc: "Sbírka [Concept('concept_province','provincí')] na hranici [Concept('concept_theater','válčiště')|l] mezi dvěma [Concept('concept_country','zemím')] ve [Concept('concept_war','válce')|l] mezi sebou. [Concept('concept_general','Generál')] mohou vydat [Concept('concept_order','rozkaz')|l] k postupu nebo obraně fronty, což může vést k [Concept('concept_battle','bitvě')], které mění velikost válčiště a místo fronty." # todo: CONCEPT CASE
 concept_advancement_progress: "Pokrok v postupu"
 concept_advancement_progress_desc: "[Concept('concept_order','Rozkaz')] [Concept('concept_general','Generál')] k postupu na [Concept('concept_front','frontu')] akumulují denně [Concept('concept_advancement_progress','pokrok v postupu')|l] v závislosti na jejich [Concept('concept_advancement_speed','rychlosti postupu')].\nJakmile dosáhne [Concept('concept_advancement_progress','pokrok v postupu')|l] na [Concept('concept_front','frontu')] [GetDefine('NMilitary','BATTLE_PLAN_ADVANCE_PROGRESS_TO_LAUNCH')|v0], začne se [Concept('concept_battle','bitvou')|l]. Když na [Concept('concept_front','frontu')] probíhá [Concept('concept_battle','bitvu')|l], [Concept('concept_advancement_progress','pokrok v postupu')|l] pro danou [Concept('concept_front','frontu')] bude pozastaven." # todo: CONCEPT CASE
 concept_advancement_speed: "Rychlost postupu"
 concept_advancement_speed_desc: "Jak rychle může [Concept('concept_general','generál')|l] postupovat na své [Concept('concept_front','frontu')] akumulováním [Concept('concept_advancement_progress','pokrok v postupu')].\nGenerál bez [Concept('concept_mobilize_battalion','mobilizovaných')] [Concept('concept_battalion','praporu')] má efektivní [Concept('concept_advancement_speed','rychlosti postupu')|l] rovnou nule." # todo: CONCEPT CASE
 concept_province: "Provincie"
 concept_provinces: "Provincie"
 concept_province_possessive: "Provincie"
 concept_province_land: "Území provincie"
 concept_province_desc: "Dílčí oblasti [Concept('concept_state','$států$')], z nichž každý má vlastní [Concept('concept_terrain','terénu')|l]. Provincie jsou převáděny mezi státy během [Concept('concept_colony','kolonizace')|l] a mohou být dočasně převáděny mezi [Concept('concept_theater','válčištěm')] během [Concept('concept_war','války')] v důsledku výsledků [Concept('concept_battle','bitvy')]." # todo: CONCEPT CASE
 concept_battle_condition: "Bojové podmínky"
 concept_battle_conditions: "Podmínky bitvy"
 concept_battle_condition_short: "Podmínka"
 concept_battle_condition_desc: "Během [Concept('concept_battle','bitvy')|l] bude každá strana ovlivněna [Concept('concept_battle_condition','bojovými podmínkami')|l], které ovlivňují výsledek. Jaká podmínka nastane závisí na mnoha faktorech, které často zahrnují [Concept('concept_character_trait','charakterové rysy')|l] [Concept('concept_commander','velitelů')] odpovědných za tuto stranu." # todo: CONCEPT CASE
 concept_naval_battle_condition: "Podmínka námořního boje"
 concept_naval_battle_conditions: "Podmínky námořního boje"
 concept_naval_battle_condition_short: "Podmínka"
 concept_naval_battle_condition_desc: "[Concept('concept_naval_battle','Námořní bitva')] jsou ovlivněny $concept_naval_battle_condition$, které působí na všechny zúčastněné v bitvě. Která $concept_naval_battle_condition_short$ platí, závisí na několika faktorech, často včetně případných [Concept('concept_harvest_condition','podmínek sklizně')] ovlivňujících lokaci námořní bitvu." # todo: CONCEPT CASE
 concept_army: "Armáda"
 concept_armies: "Armády"
 concept_army_possessive: "armádní"
 concept_army_long: "Armádní formace"
 concept_army_desc: "Armáda je část vašich pozemních sil, skládající se z #bold pěchoty#!, #bold dělostřelectva#! a #bold jízdy#!. [Concept('concept_army','Armáda')] mohou být dány rozkazy jako #bold $advance$#! nebo #bold $defend$#!." # todo: CONCEPT CASE
 concept_fleet: "Loďstvo"
 concept_fleets: "Loďstva"
 concept_fleet_possessive: "loďství"
 concept_fleet_long: "Tvorba loďstva"
 concept_fleet_desc: "A $concept_fleet$ je součást vašich námořních sil složená z lodí. Loďstvo může být vyslána na mise jako [GetNavalMissionType('naval_mission_type_intercept').GetName], [GetNavalMissionType('naval_mission_type_blockade').GetName] a [GetNavalMissionType('naval_mission_type_port_bombardment').GetName]. Flotily obvykle trvá dlouho vybudovat a mnohé typy lodí časem zastarají, protože je nelze vždy vylepšit. Pečlivě zvažte, než příliš investujete do velkých flotil." # todo: CONCEPT CASE
 concept_battle: "Bitva"
 concept_battles: "Bitvy"
 concept_battle_desc: "Když se dva [Concept('concept_commander','velitelé')|l] potkají a dostanou se do konfliktu během [Concept('concept_war','války')], oni a jejich [Concept('concept_unit','vojenské jednotky')|l] se střetnou v pokusu způsobit si [Concept('concept_casualties','ztrátám')|l] a poškodit si navzájem [Concept('concept_morale','morálku')]. Strana, které dojde její [Concept('concept_manpower','personál')|l] nebo se bude [Concept('concept_morale_demoralized','demoralizována')] jako první, se stáhne a nechá zvítězit druhou stranu.\n\nNa zemi se bitvy konají v [Concept('concept_province','provincích')] sousedících s [Concept('concept_front','frontou')|l], když se jeden [Concept('concept_general','generál')|l] pokouší zabrat nebo znovuobsadit [Concept('concept_province_land','půdu')|l]. Vítěz buď dobude více provincí, nebo zabrání nepříteli v tom, aby tak učinil.\n\nNa moři se bitvy konají v mořských uzlech, když jeden [Concept('concept_admiral','admirál')|l] zachytí druhého v důsledku konflitních [Concept('concept_order','rozkazů')]. Vítěz zanechává svého protivníka poškozeného a nutí ho vrátit se do přístavu na opravy, čímž mu brání v provádění jeho rozkazu na nějakou dobu." # todo: CONCEPT CASE
 concept_naval_battle: "Námořní bitva"
 concept_naval_battles: "Námořní bitvy"
 concept_naval_battle_desc: "Když se dva [Concept('concept_commander','velitelé')] setkají a střetnou během [Concept('concept_war','války')], oni a jejich [Concept('concept_ship','lodě')] se střetnou ve snaze způsobit [Concept('concept_casualties','ztráty')] a potopit protivníkovy $concept_ships$. Strana, jejíž $concept_ships$ byly všechny zničeny nebo ustoupily, se stáhne a ponechá druhé straně vítězství.\n\nNámořní bitvy probíhají v Sea Node, když jeden [Concept('concept_admiral','admirál')] zachytí druhého kvůli konfliktu v [Concept('concept_order','rozkaze')]. Vítěz zanechá protivníka poškozeného a donutí jej vrátit se do přístavu na opravu, čímž mu dočasně znemožní vykonat jeho rozkazu." # todo: CONCEPT CASE
 concept_timed_modifier: "Dočasný modifikátor"
 concept_timed_modifiers: "Dočasné modifikátory"
 concept_timed: "Dočasně"
 concept_timed_modifier_desc: "[Concept('concept_modifier','Modifikátor')] s datem expirace, po kterém zmizí. Dočasné modifikátory mohou udržovat svůj plný účinek až do jeho data expirace, nebo postupně odeznívat až do dosažení cílového data." # todo: CONCEPT CASE
 concept_modifier: "Modifikátor"
 concept_modifiers: "Modifikátory"
 concept_modifier_desc: "Jakákoli úprava hodnoty od její normy se považuje za modifikátor. Tyto mohou být trvalé nebo [Concept('concept_timed_modifier','dočasně')], a jejich původ lze vždy vysledovat zpět k něčemu jako [Concept('concept_law','zákon')], [Concept('concept_technology','technologie')], [Concept('concept_institution','instituce')], [Concept('concept_building','budova')], [Concept('concept_character_trait','charakterový rys')] nebo dokonce k volbě provedené během speciální události. Hodnoty upravené modifikátory mají všechny nápovědy, které vysvětlují úplný seznam zdrojů a jejich hodnot." # todo: CONCEPT CASE
 concept_terrain: "Terén"
 concept_terrain_desc: "Terén v [Concept('concept_province','provincii')] určuje její [Concept('concept_combat_width','šířku bojiště')] a jak nestálé a nepředvídatelné budou [Concept('concept_battle','bitvy')|l] v této provincii. [Concept('concept_general','Generál')] mohou být také více nebo méně zkušení v boji v různých typech terénu.\n\nTerén dané provincie se může změnit v důsledku výstavby [Concept('concept_building','budov')] ve [Concept('concept_state','státě')]." # todo: CONCEPT CASE
 concept_strategic_region: "Strategický region"
 concept_strategic_region_short: "Region"
 concept_strategic_regions: "Strategické regiony"
 concept_strategic_regions_short: "Regiony"
 concept_strategic_region_desc: "Kolekce [Concept('concept_state_region','regionů států')] považovaných za oblast strategické důležitosti. [Concept('concept_country','Země')|l] mají [Concept('concept_interest','zájem')|l] ve všech regionech, kde vlastní [Concept('concept_province','území provincie')|l], a mohou projektovat další [Concept('concept_interest','zájmy')|l] v jiných strategických regionech, pokud je jejich [Concept('concept_rank','hodnost')|l] dostatečně vysoká." # todo: CONCEPT CASE
 concept_strategic_region_stance: "AI postoj v strategickém regionu"
 concept_strategic_region_stance_short: "Postoj"
 concept_strategic_region_stances_short: "Postoje"
 concept_strategic_region_stance_desc: "Postoj je indikátorem zahraničněpolitických názorů [Concept('concept_country','zemí')] v konkrétním [Concept('concept_strategic_region','strategickém regionu')].\n\nTo může ovlivnit, jak se zeměmi zachová k [Concept('concept_diplomatic_play','diplomatické hře')] nebo zda chce takovou akci zahájit samo, stejně jako [Concept('concept_attitude','postoj')], které vůči zemím v tom regionu rozvine." # todo: CONCEPT CASE
 concept_sway: "Ovlivnění"
 concept_swaying: "Ovlivňování"
 concept_swayed: "Ovlivněno"
 concept_sway_desc: "[Concept('concept_initiator','Iniciátor')] nebo [Concept('concept_target','cíl')|l] v [Concept('concept_diplomatic_play','diplomatické hře')] se může pokusit ovlivnit jakoukoliv jinou [Concept('concept_country','zemi')] s dostatečně vysokou [Concept('concept_interest_tier','úroveň zájmu')] ve [Concept('concept_strategic_region','strategickém regionu')] na svou stranu tím, že nabídne [Concept('concept_war_goal','válečný cíl')|l] nebo jiný příslib, jako je [Concept('concept_obligation','závazek')|l]. Pokus o ovlivnění země stojí [Concept('concept_maneuver','manévry')|l], a šance, že země řízená AI přijme nabídku závisí na vašich [Concept('concept_relations','vztahů')] a jejich [Concept('concept_attitude','postoji')] vůči vám, stejně jako vůči vašemu protivníkovi." # todo: CONCEPT CASE
 concept_offer_support: "Nabídnout podporu"
 concept_offer_of_support: "Nabídka podpory"
 concept_offer_support_desc: "Účastník [Concept('concept_diplomatic_play','diplomatické hry')] může nabídnou podporu [Concept('concept_initiator','iniciátor')] nebo [Concept('concept_target','cíli')]. Funguje to stejně jako [Concept('concept_sway','ovlivnění')|l], s tím rozdílem, že potenciální podporovatel stanoví podmínky, za co je ochoten podpořit, ale nevyžaduje žádný [Concept('concept_maneuver','manévry')|l] pro obě strany." # todo: CONCEPT CASE
 concept_diplomatic_demand: "Diplomatický požadavek"
 concept_diplomatic_demands: "Diplomatické požadavky"
 concept_diplomatic_demand_short: "Požadavek"
 concept_diplomatic_demands_short: "Požadavky"
 concept_diplomatic_demand_desc: "Diplomatický požadavek je jediný [Concept('concept_war_goal','válečný cíl')|l], který jedna [Concept('concept_country','země')|l] požaduje od jiné. Pokud je [Concept('concept_diplomatic_demand','diplomatický požadavek')|l] odmítnut, začne [Concept('concept_diplomatic_play','diplomatická hra')|l] s požadovaným [Concept('concept_war_goal','válečným cílem')] jako [Concept('concept_primary_demand','primárním požadavkem')] ze strany [Concept('concept_initiator','iniciátora')]." # todo: CONCEPT CASE
 concept_diplomatic_action: "Diplomatická akce"
 concept_diplomatic_actions: "Diplomatické akce"
 concept_diplomatic_actions_short: "Akce"
 concept_diplomatic_action_desc: "Široký termín pro interakce mezi dvěma [Concept('concept_country','zemím')] zahrnující [Concept('concept_instant_diplomatic_action','okamžité diplomatické akce')|l], [Concept('concept_ongoing_diplomatic_action','probíhající diplomatické akce')|l] a [Concept('concept_diplomatic_pact','diplomatické pakty')|l]. Liší se od [Concept('concept_diplomatic_play','diplomatické hry')] tím, že třetí strana nemá právo vyjádřit se k její výsledku a není zde riziko, že akce sama o sobě může vyústit ve [Concept('concept_war','válce')]." # todo: CONCEPT CASE
 concept_subject_action: "Akce závislé země"
 concept_subject_actions: "Akce závislé země"
 concept_subject_action_desc: "Typ [Concept('concept_diplomatic_action','diplomatické akce')|l], kterou mohou [Concept('concept_subject','závislé země')|l] mohou vykonat proti svému [Concept('concept_overlord','vládci')]." # todo: CONCEPT CASE
 concept_overlord_action: "Akce vládce"
 concept_overlord_actions: "Akce vládce"
 concept_overlord_action_desc: "Typ [Concept('concept_diplomatic_action','diplomatické akce')], který můžou [Concept('concept_overlord','vládci')|l] vydat vůči svým [Concept('concept_subject','závislé zemi')]." # todo: CONCEPT CASE
 concept_bloc_member_action: "Akce člena bloku"
 concept_bloc_member_actions: "Akce člena bloku"
 concept_bloc_member_action_desc: "Typ [Concept('concept_diplomatic_action','diplomatické akce')|l], který mohou [Concept('concept_power_bloc_member','členové bloku')|l] vykonávat proti jiným [Concept('concept_power_bloc_member','členovi mocenskému bloku')], včetně [Concept('concept_power_bloc_leader','vůdce bloku')|l]." # todo: CONCEPT CASE
 concept_bloc_leader_action: "Akce vůdce bloku"
 concept_bloc_leader_actions: "Akce vůdce bloku"
 concept_bloc_leader_action_desc: "Typ [Concept('concept_diplomatic_action','diplomatické akce')|l], kterou můžou vykonávat [Concept('concept_power_bloc_leader','vůdcové bloku')|l] vůči [Concept('concept_power_bloc_member','členovi mocenskému bloku')]." # todo: CONCEPT CASE
 concept_government_building: "Vládní budova"
 concept_government_buildings: "Vládní budovy"
 concept_government_building_desc: "[Concept('concept_building','Budova')] vlastněná a řízená [Concept('concept_government','vládou')] pomocí prostředků z [Concept('concept_treasury','státní pokladny')].\n\nVládní budovy nemají [Concept('concept_good_production','výrobu')] [Concept('concept_good','zboží')|l] a tudíž žádné [Concept('concept_revenue','příjmy')|l], ale produkují množství dalších zdrojů důležitých pro provoz [Concept('concept_country','země')|l] jako [Concept('concept_bureaucracy','byrokracie')|l], [Concept('concept_infrastructure','infrastruktura')|l], [GetGoods('merchant_marine').GetName|l], a [Concept('concept_unit','vojenské jednotky')|l].\n\nPracovní síla nevojenských vládních budov je placena podle [Concept('concept_government_wage','vládní mzdy')], zatímco u [Concept('concept_military_building','vojenské budovy')] je placena podle [Concept('concept_military_wage','vojenské mzdy')].\n\nVládní budovy jsou vždy plně [Concept('concept_nationally_owned','vlastněny státem')]" # todo: CONCEPT CASE
 concept_military_building: "Vojenská budova"
 concept_military_buildings: "Vojenské budovy"
 concept_military_building_army_and_navy: "Armáda a námořnictvo"
 concept_military_building_desc: "[Concept('concept_government_building','Vládní budova')] používané k výcviku, udržování a zásobování [Concept('concept_battalion','praporů')] a [Concept('concept_ship','lodí')] pro armádu a námořnictví [Concept('concept_country','země')]. [Concept('concept_workforce','Pracovní síla')] vojenských budov je placena podle [Concept('concept_military_wage','vojenské mzdy')]." # todo: CONCEPT CASE
 concept_incorporated_state: "Začleněný stát"
 concept_incorporated_states: "Začlenené státy"
 concept_incorporate_state: "Začlenit stát"
 concept_incorporated_state_possessive: "Začleněného státu"
 concept_incorporate: "Začlenit"
 concept_incorporated: "Začlenen"
 concept_incorporating: "Začleňování"
 concept_incorporation: "Začleňování"
 concept_incorporated_state_desc: "[Concept('concept_state','Stát')], které jsou plně integrovány do [Concept('concept_country','zemí')|l]. [Concept('concept_pop','Populace')] v začleněných státech platí daně, získává přístup k výhodám z [Concept('concept_institution', 'institucí')] a plně se účastní politického života země. [Concept('concept_unincorporated_state','Nezačleněný stát')] mohou být začleněny prostřednictvím někdy zdlouhavého procesu." # todo: CONCEPT CASE
 concept_capacity: "Kapacita"
 concept_capacities: "Kapacity"
 concept_capacity_desc: "Měření schopností vaši [Concept('concept_country','země')|l] v jedné ze tří oblastí: [Concept('concept_bureaucracy','byrokracie')], [Concept('concept_authority','autority')] a [Concept('concept_influence','vlivu')].\n\nKapacity nejsou uchovávány a používány, ale neustále generovány z různých zdrojů a neustále spotřebovávány různými projekty, které převádzkujete. Zbývající zůstatek v každé oblasti je zobrazen v horním panelu.\n\nPřebytek [Concept('concept_capacity','kapacity')|l] poskytne vaši zemi drobný bonus, zatímco nedostatek [Concept('concept_capacity','kapacity')|l] způsobí velké penalizace." # todo: CONCEPT CASE
 concept_bureaucracy: "Byrokracie"
 concept_bureaucracy_desc: "@bur! Byrokracie je [Concept('concept_capacity','kapacita')|l] používaná k udržení administrativní soudržnosti a každodenního fungování vaši [Concept('concept_country','země')|l]. Náklady se zvyšují s populací ve vašich [Concept('concept_incorporated_state','začleněného státu')], s každou investicí do [Concept('concept_institution','institucí')|l] a také se používají ke spravování vašich [Concept('concept_commander','velitele')]. @bur! získáte z provozování [Concept('concept_building','budovy')] [SelectLocalization(GetPlayer.IsValid,'concept_bureaucracy_desc_added','Vládní správa')]." # todo: CONCEPT CASE
 concept_bureaucracy_desc_added: "[GetBuildingType('building_government_administration').GetName]"
 concept_authority: "Autorita"
 concept_authority_desc: "@aut! Autorita je [Concept('concept_capacity','kapacita')|l] používaná k provádění interních změn ve vaši [Concept('concept_country', 'zemi')], jako například vydávání [Concept('concept_decree', 'dekretů')] nebo správa [Concept('concept_interest_group', 'zájmových skupin')]. @aut! lze získat ze [Concept('concept_law','zákona')]." # todo: CONCEPT CASE
 concept_influence: "Vliv"
 concept_influence_desc: "@inf! Vliv je [Concept('concept_capacity','kapacita')|l] používaná na [Concept('concept_diplomatic_action','diplomatickou akci')|l], [Concept('concept_diplomatic_pact','diplomatický pakt')|l] a [Concept('concept_treaty','smlouvu')|l] vůči jiným [Concept('concept_country','zemím')]. @inf! získavate na základě své [Concept('concept_rank','hodnosti')]." # todo: CONCEPT CASE
 concept_institution: "Instituce"
 concept_institutions: "Instituce"
 concept_institution_possessive: "Instituce"
 concept_institution_desc: "Instituce poskytují výhody pro [Concept('concept_incorporated_state', '$concept_incorporated_states$')|l] napříč vaší [Concept('concept_country','zemi')]. Údržba stojí [Concept('concept_bureaucracy','byrokracii')] úměrně k počtu [Concept('concept_pop','populace')|l] žijící ve vašich začleněných státech a úrovně investicí do [Concept('concept_institution','institucí')]. Vyšší úrovně zvyšují jak náklady, tak účinek. Úpravy úrovně investic trvají určitou dobu." # todo: CONCEPT CASE
 concept_law: "Zákon"
 concept_laws: "Zákony"
 concept_law_desc: "Zákony stanovují základní pravidla, podle nichž váš [Concept('concept_country','země')] funguje a je spravován. Efekty $concept_law$ jsou určeny jak základními efekty daného zákona, tak efekty jakýchkoli [Concept('concept_amendment','dodatku')] k němu připojených. Některé $concept_laws$ umožňují [Concept('concept_institution','instituce')], které poskytují další možnosti řízení. Aby mohl být zákon [Concept('concept_enactment_of_laws','schválen')], musí být [Concept('concept_endorse_oppose','podpořen')] alespoň jednou zájmovou skupinou [Concept('concept_in_government','ve vládě')|l], mít podporu aktuálního [Concept('concept_political_movement','politického hnutí')], nebo mít z jiného důvodu kladnou šanci [Concept('concept_enactment_success','na prosazení')]." # todo: CONCEPT CASE
 concept_amendment: "Dodatek"
 concept_amendments: "Dodatky"
 concept_amendment_desc: "Dodatek je doplněk k [Concept('concept_law','zákonu')], který mění jeho účinky, a který sponzoruje konkrétní [Concept('concept_interest_group','zájmová skupina')]. To, zda se zájem bude [Concept('concept_endorse_oppose','za nebo proti')] dodatku, určuje $concept_parent_law$ daného dodatku. $concept_amendment_repeal_desc$" # todo: CONCEPT CASE
 concept_amendment_repeal: "Zrušení dodatku"
 concept_repeal: "Zrušení"
 concept_repealed: "Zrušen"
 concept_repealing: "Rušící"
 concept_amendment_repeal_desc: "[Concept('concept_amendment','Dodatek')] lze zrušit, pokud dodatek není v cooldownu a některá [Concept('concept_interest_group','zájmová skupina')|l] ve [Concept('concept_government','$vládě$')] [Concept('concept_endorse_oppose','odporuje')] mateřskému zákonu daného dodatku." # todo: CONCEPT CASE
 concept_parent_law: "Mateřský zákon"
 concept_parent_law_desc: "Mateřský zákon [Concept('concept_amendment','Dodatek')] určuje [Concept('concept_endorse_oppose','postoj')|l] [Concept('concept_ideology','ideologie')|l] vůči dodatku. Každá [Concept('concept_interest_group','zájmová skupina')|l] pak bude [Concept('concept_endorse_oppose','stavět')] k dodatku podle své ideologie." # todo: CONCEPT CASE
 concept_enactment_setback: "Problém při schvalování"
 concept_enactment_setbacks: "Problémy při schvalování"
 concept_enactment_setback_short: "Problém"
 concept_enactment_setbacks_short: "Problémy"
 concept_enactment_setback_desc: "Během [Concept('concept_enactment_of_laws','uzákoňování')|l] nějakého [Concept('concept_law','zákona')|l] můžete narazit na  problémy. Může k tomu dojít v důsledku [Concept('concept_enactment_stall','obstrukci')] na milníku [Concept('concept_enactment_of_laws','uzákoňování')|l], jako následek [Concept('concept_enactment_debate','diskuze')], nebo pokud šance na [Concept('concept_enactment_success','úspěšné uzákonění zákona')|l] klesla pod #v 0#!. Pokud nasbíráte příliš mnoho problémů, schvalování zákona #r selže#!.\n\n@warning! Pokud schvalování #r selže#!, nebude možné pokusit se o prosazení tohoto zákona znovu po dobu #v [GetDefine('NPolitics','LAW_ENACTMENT_COOLDOWN_DAYS')|0] dní#!." # todo: CONCEPT CASE
 concept_enactment_phase: "Fáze schvalování"
 concept_enactment_phase_short: "Fáze"
 concept_enactment_phases_short: "Fází"
 concept_enactment_phases: "Fáze schvalování"
 concept_enactment_phase_desc: "Pro [Concept('concept_enactment_of_laws','schválení')] zákonu jej musíte úspěšně provést přes [GetDefine('NPolitics', 'LAW_ENACTMENT_MAX_PHASES')|v] fáze [AddLocalizationIf(GetPlayer.IsValid,'concept_enactment_phase_ingame_added')] dosažením [Concept('concept_enactment_success','Úspěchu')]. Během tohoto procesu existuje riziko [Concept('concept_enactment_setback','problémů')], které mohou způsobit, že prosazení zákona #r selže#!."
 concept_enactment_phase_ingame_added: "- [GetPlayer.GetCustom('enactment_phase_0')|v], [GetPlayer.GetCustom('enactment_phase_1')|v], a [GetPlayer.GetCustom('enactment_phase_2')|v] - "
 concept_money: "Peníze"
 concept_money_desc: "Peníze vládnou světu. Používají se k platbě [Concept('concept_government_wage','vládní mzdě')] a produkci [Concept('concept_bureaucracy','byrokracii')|l], k platbě za [Concept('concept_construction','stavební')] materiály, průmyslové [Concept('concept_subsidies','dotace')|l], [GetGoods('merchant_marine').GetName|l] pro vaše [Concept('concept_shipping_lane','námořní trasy')], a v neposlední řadě, za vaši armádu. Peníze získávate ze [Concept('concept_taxes','zdanění')] vaší [Concept('concept_pop','populace')|l] a uplatňováním [Concept('concept_tariffs','cel')|l]. Nadbytečné peníze ve vaši [Concept('concept_treasury','státní pokladnu')] se používají k uhrazení vašich [Concept('concept_loans','půjček')] nebo k vytváření zásob zlata ve vašich [Concept('concept_gold_reserves','zlatých rezerv')]. Nedostatek peněz zvyšuje vaše půjčky proti vašemu [Concept('concept_credit','ůvěrovému limitu')], což závisí na tom, kolik peněz mají vaše [Concept('concept_building','budovy')|l] uložené jako [Concept('concept_cash_reserves','hotovostní rezervy')|l]." # todo: CONCEPT CASE
 concept_workforce: "Pracovní síla"
 concept_workforce_desc: "Pracovní síla [Concept('concept_building','Budova')] se skládá z [Concept('concept_pop','populací')|l] různých [Concept('concept_profession','profesí')] v závislosti na aktuálně aktivní [Concept('concept_production_method','výrobní metody')]." # todo: CONCEPT CASE
 concept_gold_reserves: "Zlaté rezervy"
 concept_gold_reserves_desc: "Týdenní rozpočtový přebytek [Concept('concept_country','země')] se hromadí v její zlatých rezervách. Pokud se rozpočtová bilance stane negativní, jakékoliv [Concept('concept_money','peníze')|l] v zlatých rezervách budou vyčerpány jako první, než země začne brát [Concept('concept_loans','půjčky')|l]. Zlaté rezervy mohou narůst jen do určité části vašeho [Concept('concept_gdp','HDP')], než začne docházet k klesajícím výnosům. Hromadění zlata nakonec oslabí ekonomiku země." # todo: CONCEPT CASE
 concept_cash_reserves: "Hotovostní rezervy"
 concept_cash_reserves_desc: "Aktiva [Concept('concept_building','budovy')|l] jsou uchovávána v její hotovostní rezervě. Pokud má budova pozitivní týdenní [Concept('concept_building_balance','bilanci')], část [Concept('concept_money','peněz')] je uložena do hotovostních rezerv, zatímco zbytek je vyplácen [Concept('concept_building_owners','vlastníkům budov')] ve formě [Concept('concept_dividends','dividendám')].\n\nHotovostní rezervy jsou považovány za vlastněné majiteli budov, a [Concept('concept_pop','populace')|l] se rozhněvá, pokud jejich hotovostní rezervy jsou ztraceny kvůli [Concept('concept_bankruptcy', 'bankrotu')|l]. Součet všech hotovostních rezerv ve vaši [Concept('concept_country','zemi')] určuje váš [Concept('concept_credit','kredit')|l]." # todo: CONCEPT CASE
 concept_obsession: "Obsese"
 concept_obsessed: "Posedlý"
 concept_obsessions: "Obsese"
 concept_obsession_desc: "[Concept('concept_culture','Kultura')] může být posedlá konkrétním [Concept('concept_good','zbožím')]. [Concept('concept_pop','Populace')] této kultury bude utrácet výrazně více za zboží, nimž je posedlá, v porovnání s jiným zboží ve stejné kategorii [Concept('concept_pop_needs','potřeby populace')]." # todo: CONCEPT CASE
 concept_taboo: "Tabu"
 concept_taboos: "Tabu"
 concept_taboo_desc: "Náboženství může mít tabu proti specifickému [Concept('concept_good','zboží')|l]. [Concept('concept_pop','Populace')] tohoto náboženství vynaloží výrazně méně na zboží, které považují za tabu, v porovnání s jiným zbožím v téže kategorii [Concept('concept_pop_needs','potřeby populace')]." # todo: CONCEPT CASE
 concept_goods_substitution: "Náhradné zboží"
 concept_goods_substitutes_short: "Náhražky"
 concept_goods_substitutable: "Nahraditelné"
 concept_goods_substitution_desc: "[Concept('concept_pop_needs','Potřebu obyvatel')] může uspokojit kterékoliv ze [Concept('concept_good','zboží')|l], které ji tvoří, a dostupnost jednotlivého zboží určuje, kolik jich bude spotřebováno.\n\nNapříklad [GetPopNeed('popneed_basic_food').GetName|l] jako potřebu splňuje [GetGoods('grain').GetName|l] a [GetGoods('meat').GetName|l]. [Concept('concept_pop','Populace')] typicky spotřebová více [GetGoods('grain').GetName|l] a méně [GetGoods('meat').GetName|l]. Pokud se však [GetGoods('meat').GetName|l] stane dostupnější než [GetGoods('grain').GetName|l], přeorientují se na konzumaci více [GetGoods('meat').GetName|l] a méně [GetGoods('grain').GetName|l]. V některých případech mohou populace i přestat konzumovat určité zboží, pokud neexistuje dostupnost pro tohle zboží.\n\nTaké [Concept('concept_culture','kulturní')] [Concept('concept_obsession','obsese')|l] a [Concept('concept_religion','náboženský')] [Concept('concept_taboo','tabu')|l] mohou výrazně ovlivnit spotřebu určitého zboží.\n\nZboží s vyšší základní cenou přispějí více k naplnění potřeb populace než těch s nižší základní cenou. Například, jediná jednotka [GetGoods('groceries').GetName|l] je ekvivalentem několika jednotek [GetGoods('grain').GetName|l]." # todo: CONCEPT CASE
 concept_market_price: "Tržní cena"
 concept_market_prices: "Tržní ceny"
 concept_market_price_share: "Podíl tržní ceny"
 concept_market_price_short: "Cena"
 concept_market_prices_short: "Ceny"
 concept_market_price_desc: "Cena [Concept('concept_good','zboží')|l] na [Concept('concept_market','trh')]. Závisí na [Concept('concept_buy_orders','poptávce')] a [Concept('concept_sell_orders','nabídce')], a ovlivňuje [Concept('concept_local_price','místní cenu')] [Concept('concept_good','zboží')|l] ve všech participujících [Concept('concept_state','států')] v závislosti na jejich [Concept('concept_market_access','přístupu na trh')].\n\nÚroveň, v jaké tržní cena ovlivňuje [Concept('concept_local_price','místní cenu')], se vypočítává vynásobením [Concept('concept_market_access','přístupem na trh')] s koeficientem #v $state_market_access_price_impact$#! [Concept('concept_state','státu')]." # todo: CONCEPT CASE
 concept_local_price: "Místní cena"
 concept_local_prices: "Místní ceny"
 concept_local_goods_prices: "Cena místního zboží"
 concept_local_price_desc: "Cena [Concept('concept_good','zboží')|l] v [Concept('concept_state','státě')]. Je určena místní [Concept('concept_good_production','výrobou')] a [Concept('concept_good_consumption','spotřebou')], regulovanou [Concept('concept_market_price','tržní cenu')] v závislosti na [Concept('concept_market_access','přístup na trh')] pro daný [Concept('concept_state','stát')|l] a koeficientu #v dopadu cen kvůli přístupu na trh#!. Všechny transakce se uskutečňují za místní ceny, přičemž nákupy a prodeje vytvářejí [Concept('concept_buy_orders','nákupní')] a [Concept('concept_sell_orders','prodejní objednávky')|l] na [Concept('concept_market','trh')]." # todo: CONCEPT CASE
 concept_world_market_price: "Cena na světovém trhu"
 concept_world_market_price_desc: "Průměrná cena, za kterou se [Concept('concept_good','zbožím')|l] obchoduje na [Concept('concept_world_market','světový trh')]. Závisí to od poměru [Concept('concept_trade','exportů')] a importů daného zboží." # todo: CONCEPT CASE
 concept_import_price: "Dovozní cena"
 concept_import_price_desc: "Cena, za kterou se [Concept('concept_good','zbožím')|l] importuje z [Concept('concept_world_market','světového trhu')] do konkrétního [Concept('concept_state','státu')]. Cenu ovlivňuje [Concept('concept_world_market_price','cena na světovém trhu')|l] a relativní [Concept('concept_trade_advantage','obchodní výhoda')|l] daného státu." # todo: CONCEPT CASE
 concept_export_price: "Vývozní cena"
 concept_export_price_desc: "Cena, za ktorú se [Concept('concept_good','zbožím')]|l exportuje z konkrétního [Concept('concept_state','státu')] na [Concept('concept_world_market','světový trh')|l]. Cena je ovlivněná [Concept('concept_world_market_price', 'cenou na světovém trhu')] a relativní [Concept('concept_trade_advantage','obchodní výhodou')] daného státu." # todo: CONCEPT CASE
 concept_local_good: "Místní zboží"
 concept_local_goods: "Místní zboží"
 concept_local_good_desc: "Místní zboží jsou určité [Concept('concept_good','zboží')|l], které nejsou dostupná na širším [Concept('concept_market','trhu')] mimo [Concept('concept_state','státu')], ve kterém jsou produkovány. Jejich cena je plně určena místní [Concept('concept_good_production','výrobou')] a [Concept('concept_good_consumption','spotřebou')], přičemž [Concept('concept_market_price','tržní cena')|l] se vůbec nezohledňuje." # todo: CONCEPT CASE
 concept_subsistence_building: "Samozásobitelská budova"
 concept_subsistence_buildings: "Samozásobitelské budovy"
 concept_subsistence_building_farming: "Samozásobitelská farma"
 concept_subsistence_building_desc: "Soubor [Concept('concept_building', 'budov')] provádějících nízkointenzivní, decentralizovanou výrobu potravin a základního [Concept('concept_good','zboží')|l] vhodných pro pouhé přežití. Jejich produkce je rozdělena mezi malé množství [Concept('concept_good','zbožím')|l] na prodej na [Concept('concept_market','trh')] a na [Concept('concept_subsistence_output','samozásobitelský výstup')|l], který zde pracující [SelectLocalization(GetPlayer.IsValid,'concept_subsistence_building_desc_added','Rolníci')] používají na udržení skrovného [Concept('concept_sol','životní standard')]. Jsou výrazně méně efektivní než většina budov, ale budou fungovat na jakékoliv nenárokované [Concept('concept_arable_land','orní půdě')] a nevyžadují manuální [Concept('concept_construction','výstavbu')]." # todo: CONCEPT CASE
 concept_subsistence_building_desc_added: "[GetPopType('peasants').GetName]"
 concept_economy_of_scale: "Úspory z rozsahu"
 concept_economy_of_scale_desc: "Mnoho [Concept('concept_building','budovy')] se stává efektivnějšími, čím větší jsou. Takové budovy získávají následující efekty za každou [Concept('concept_building_level','úroveň budovy')|l] nad první:\n[GetStaticModifier('economy_of_scale').GetDesc][AddLocalizationIf(GetPlayer.IsValid,'concept_economy_of_scale_desc_ingame_added')]" # todo: CONCEPT CASE
 concept_economy_of_scale_desc_ingame_added: "\n\nVaše aktuální národní úroveň pro efekty Úspor z rozsahu je [GetPlayer.GetModifier.GetValueWithBreakdownFor('building_economy_of_scale_level_cap_add')]."
 concept_interest_group: "Zájmová skupina"
 concept_interest_groups: "Zájmové skupiny"
 concept_interest_group_possessive: "Zájmové skupiny"
 concept_interest_group_plural_possessive: "Zájmové skupiny"
 concept_interest_group_desc: "Politická frakce uvnitř vaší [Concept('concept_country','zemi')|l], která sdílí společný zájem. Jsou podporovány [Concept('concept_pop','populací')] v souvislosti s jejich [Concept('concept_interest_group_attraction','atraktivitou')], a [Concept('concept_clout','politický vliv')|l], které užívají, je založen přímo na [Concept('concept_political_strength','politickou sílu')] podporující populace. Zájmové skupiny mají řadu [Concept('concept_ideology','ideologii')], což způsobuje, že [Concept('concept_endorse_oppose','podporují')] různé [Concept('concept_law','zákony')|l].\n\nMají také tři [Concept('concept_interest_group_trait','rysy zájmové skupiny')|l], které se aktivují na různých úrovních [Concept('concept_approval','spokojenosti')]. [Concept('concept_leader','Vůdcova')] osobní ideologie se také projevuje na zájmové skupině." # todo: CONCEPT CASE
 concept_interest_group_attraction: "Atraktivita zájmové skupiny"
 concept_interest_group_attraction_short: "Atraktivita"
 concept_interest_group_attractions: "Atraktivity zájmových skupin"
 concept_attracted: "Přitahován"
 concept_interest_group_attraction_desc: "Jak hodně je [Concept('concept_pop','populace')|l] nakloněna podporovat konkrétní [Concept('concept_interest_group','zájmovou skupinu')]. Ovlivněno vlastnostmi populace, jako [Concept('concept_profession','profese')|l], [Concept('concept_wealth','bohatství')|l] a [Concept('concept_education_access','přístup k vzdělání')|l], vysoká atraktivita znamená, že populace cítí, že je pravděpodobné, že práve tato zájmová skupina zastupuje jejich politické zájmy." # todo: CONCEPT CASE
 concept_politician: "Politik"
 concept_politicians: "Politici"
 concept_politician_desc: "[Concept('concept_character_role','Role')] pro ty [Concept('concept_character','postavy')|l], jejichž vliv je spíš politický než vojenský. Mohou zastávat roli [Concept('concept_ruler','vládce')|l], [Concept('concept_heir','dědice')|l] nebo [Concept('concept_leader','vůdce')|l] [Concept('concept_interest_group','zájmové skupiny')] ." # todo: CONCEPT CASE
 concept_leader: "Vůdce"
 concept_leaders: "Vůdci"
 concept_leader_possessive: "Vůdcova"
 concept_leader_desc: "[Concept('concept_character','Postava')], která vede [Concept('concept_interest_group','zájmovou skupinu')], má soubor [Concept('concept_character_trait','charakterových rysů')] které ji ovlivňují, a osobní [Concept('concept_ideology','ideologii')], která se přidává k ideologiím zájmové skupiny po dobu, po kterou je [Concept('concept_leader','vůdce')|l] u moci." # todo: CONCEPT CASE
 concept_interest_group_trait: "Rys zájmové skupiny"
 concept_interest_group_traits: "Rysy zájmové skupiny"
 concept_interest_group_trait_short: "Rys"
 concept_interest_group_traits_short: "Rysy"
 concept_interest_group_trait_desc: "Všechny [Concept('concept_interest_group','zájmovou skupinu')|l] mají tři rysy, které platí na různých úrovních [Concept('concept_approval','spokojenosti')] a mají značný dopad na celou [Concept('concept_country','zemi')].\nNegativní rys se aktivuje, pokud spokojenost klesne pod úroveň $ig_approval_unhappy$ (#v [GetDefine('NPolitics','APPROVAL_THRESHOLD_UNHAPPY')|0=+]#!)\nPozitivní rys se aktivuje, pokud spokojenost překročí úroveň $ig_approval_happy$ (#v [GetDefine('NPolitics','APPROVAL_THRESHOLD_HAPPY')|0=+]#!)\nDalší pozitivní rys se aktivuje, pokud spokojenost překročí úroveň $ig_approval_loyal$ (#v [GetDefine('NPolitics','APPROVAL_THRESHOLD_LOYAL')|0=+]#!).\nJakmile je aktivní, rys se neodstraní, dokud spokojenost nebude alespoň [GetDefine('NPolitics','IG_TRAIT_STICKINESS')|v] bodů od prahové hodnoty.\n\nRysy marginalizovaných zájmových skupin se nikdy neaktivují, zatímco rysy mocných zájmových skupin mají posílený účinek." # todo: CONCEPT CASE
 concept_decay: "Odeznívaní"
 concept_decaying: "Odeznívající"
 concept_decay_desc: "Odeznívající efekt postupně strácí na síle, počínaje na své počáteční hodnotě a lineárně se snižující na #v 0#! počas stanovené doby odeznívaní."
 concept_character_trait: "Charakterový rys"
 concept_character_traits: "Charakterové rysy"
 concept_character_trait_short: "Vlastnost"
 concept_character_traits_short: "Rysy"
 concept_character_trait_desc: "Osobnostní rysy, dovednostní rysy, nebo podmínky, které ovlivňují schopnost [Concept('concept_character','postavy')|l] vykonávat svou aktuální [Concept('concept_character_role','roli')|l]. Více odlišných rysů se může vyvinout, jak [Concept('concept_character','postava')|l] získává [Concept('concept_life_experience','životní zkušenosti')|l]." # todo: CONCEPT CASE
 concept_construction_queue: "Stavební fronta"
 concept_construction_queue_desc: "Jakákoliv [Concept('concept_building','budova')|l], která byla určena k rozšíření, ale v danou chvíli nevyužívá žádnou [Concept('concept_construction','výstavbu')], je zařazena do stavební fronty. Jakmile se uvolní výstavba, první budova ve stavební frontě začne tuto kapacitu využívat a přejde do stavu [Concept('concept_under_construction','ve výstavbě')|l]." # todo: CONCEPT CASE
 concept_government_construction: "Vládní výstavba"
 concept_government_constructions: "Vládní výstavby"
 concept_government_construction_desc: "Vládní výstavba je [Concept('concept_building','budova')|l], která je rozšiřována na přímý příkaz [Concept('concept_government','vlády')] [Concept('concept_country','země')].\n\nMůže čerpat prostředky přímo ze státní pokladny a může být reprioritizována nebo odstraněna z [Concept('concept_construction_queue','stavební fronty')].\n\nPostavené [Concept('concept_building_level','úrovně budovy')] se stanou [Concept('concept_nationally_owned','vlastněny státem')]." # todo: CONCEPT CASE
 concept_private_construction: "Soukromá výstavba"
 concept_private_constructions: "Soukromé stavby"
 concept_private_construction_desc: "Soukromá výstavba je [Concept('concept_building','budova')|l], která je rozšiřována na příkaz soukromých subjektů.\n\nVždy je financována z [Concept('concept_investment_pool','investičního fondu')] a nelze ji prioritizovat nebo odstranit z [Concept('concept_construction_queue','stavební fronty')].\n\nVyprodukované [Concept('concept_building_level','úrovně budovy')|l] se stávají [Concept('concept_privately_owned','soukromě vlastněno')]." # todo: CONCEPT CASE
 concept_under_construction: "Ve výstavbě"
 concept_under_construction_desc: "Když [Concept('concept_building','budova')|l] využíva [Concept('concept_construction','výstavbu')], považuje se za budovu ve výstavbě." # todo: CONCEPT CASE
 concept_urbanization: "Urbanizace"
 concept_urbanization_desc: "Urbanizace je vytvářena většinou [Concept('concept_building', 'budov')] postavených ve [Concept('concept_state','státě')], a to v různé míře. Jakmile se v daném [Concept('concept_state','státě')] nashromáždí dostatek urbanizace, budova [SelectLocalization(GetPlayer.IsValid,'concept_urbanization_desc_added','Urban Center')] bude automaticky rozšířena." # todo: CONCEPT CASE
 concept_urbanization_desc_added: "[GetBuildingType('building_urban_center').GetName]"
 concept_endorse_oppose: "Podpora a odpor k zákonům"
 concept_endorse: "Podpořit"
 concept_endorses: "Podporuje"
 concept_endorsed: "Podporováno"
 concept_endorsing: "Podpora"
 concept_endorsement: "Podpora"
 concept_opposition: "Opozice"
 concept_oppose: "Odpor"
 concept_opposes: "Odporuje"
 concept_opposed: "Proti"
 concept_opposing: "Oponující"
 concept_indifferent: "Lhostejný"
 concept_endorses_and_opposes: "Podporuje a odporuje"
 concept_endorse_or_oppose: "Podpora nebo odpor"
 concept_stance: "Postoj"
 concept_endorse_oppose_desc: "Podpora nebo odpor [Concept('concept_interest_group','zájmové skupiny')|l] vůči [Concept('concept_law','zákonu')] je určena jejich [Concept('concept_ideology','ideologii')]. Aby mohl být zákon [Concept('concept_enactment_of_laws','schválen')], musí být [Concept('concept_endorse_oppose','podpořen')] alespoň jednou zájmovou skupinou [Concept('concept_in_government','ve vládě')|l], mít podporu aktuálního [Concept('concept_political_movement','politického hnutí')], nebo mít z jiného důvodu kladnou šanci [Concept('concept_enactment_success','na prosazení')]." # todo: CONCEPT CASE
 concept_ideology: "Ideologie"
 concept_ideologies: "Ideologie"
 concept_ideology_possessive: "Ideologie"
 concept_ideology_desc: "Ideologie [Concept('concept_interest_group','Zájmová skupina')|l] ovlivňuje, které [Concept('concept_law','zákony')|l] bude [Concept('concept_endorse_oppose','podporovat')] a které ne. Jejich postoj k zákonům, které jsou v současnosti v platnosti v [Concept('concept_government','zemi')], má malé, trvalé účinky na [Concept('concept_approval','spokojenost')|l] [Concept('concept_interest_group','zájmovou skupinu')|l]. Zatímco se země snaží [Concept('concept_enactment_of_laws','uzákonit')|l] nový zákon, větší, ale dočasný účinek se vztahuje na to, který zákon bude odstraněn a který se dostane do platnosti. Tento dočasný efekt nakonec [Concept('concept_decay','odezní')], zanechávajíc pouze trvalý, objektivní vliv na spokojenost." # todo: CONCEPT CASE
 concept_presidency_stability: "Stabilita prezidentství"
 concept_presidency_stability_short: "Stabilita"
 concept_presidency_stability_desc: "Stabilita prezidentství je metrika pro měření úrovně nepokojů v jednom ze tří [Concept('concept_presidency','prezidentství')|l] koloniální Indie.\n\n#title Stabilita prezidentství spadá do jedné ze čtyř kategorií:#! #indent_newline:3 \n#r Kritická#!: #v [GetPlayer.MakeScope.ScriptValue('uneasy_raj_stability_critical_lower_bound')]#!-#v [GetPlayer.MakeScope.ScriptValue('uneasy_raj_stability_critical_upper_bound')]#!\n#b Nízká#!: #v [GetPlayer.MakeScope.ScriptValue('uneasy_raj_stability_low_lower_bound')]#!-#v [GetPlayer.MakeScope.ScriptValue('uneasy_raj_stability_low_upper_bound')]#!\n#b Střední#!: #v [GetPlayer.MakeScope.ScriptValue('uneasy_raj_stability_medium_lower_bound')]#!-#v [GetPlayer.MakeScope.ScriptValue('uneasy_raj_stability_medium_upper_bound')]#!\n#b Vysoká#!: #v [GetPlayer.MakeScope.ScriptValue('uneasy_raj_stability_high_lower_bound')]#!-#v [GetPlayer.MakeScope.ScriptValue('uneasy_raj_stability_high_upper_bound')]#!#!\n\n#title Následující podmínky v prezidentství #r snižují#! jeho stabilitu:#! #indent_newline:3 \n• [Concept('concept_turmoil','nepokoje')] ve [Concept('concept_state','státě')] prezidentství\n• [Concept('concept_subject','závislé zemi')] s #bold vysokou#! [Concept('concept_liberty_desire','touhou po svobodě')] v prezidentství#!\n\n#title Následující podmínky ve Východoindické společnosti #r snižují#! stabilitu:#! #indent_newline:3 \n• #bold Nízká#! [Concept('concept_approval','spokojenost')|l] [GetInterestGroupVariant('ig_landowners',GetPlayer).GetNameWithCountryVariant]\n• #bold Vysoké#! [Concept('concept_taxes','daně')|l] ve Východoindické společnosti\n• #bold Nízké#! [Concept('concept_military_wage','vojenské mzdy')|l] ve Východoindické společnosti\n• Vůdcové s rysem [GetIdeology('ideology_utilitarian_leader').GetName] ve [Concept('concept_government','vládě')|l]\n• #bold Nemít#! [Concept('concept_law','zákon')|l] [GetLawType('law_total_separation').GetName]\n• #bold Nemít#! [Concept('concept_law','zákon')|l] [GetLawType('law_professional_army').GetName]\n• Události a další efekty #!\n\n#title Následující podmínky #g zvyšují#! stabilitu prezidentství:#! #indent_newline:3 \n• [Concept('concept_loyalist','loajalisté')] ve [Concept('concept_state','státě')] prezidentství\n• [Concept('concept_subject','závislé zemi')] s #bold nízkou#! [Concept('concept_liberty_desire','touhou po svobodě')] v prezidentství#!\n\n#title Následující podmínky ve Východoindické společnosti #g zvyšují#! stabilitu:#! #indent_newline:3 \n• Domorodé #b indické#! [Concept('concept_interest_group','zájmové skupiny')|l] [Concept('concept_in_government','ve vládě')|l]\n• #bold Vysoká#! [Concept('concept_approval','spokojenost')|l] [GetInterestGroupVariant('ig_landowners',GetPlayer).GetNameWithCountryVariant]\n• #bold Nízké#! [Concept('concept_taxes','daně')|l] ve Východoindické společnosti\n• #bold Vysoké#! [Concept('concept_military_wage','vojenské mzdy')|l] ve Východoindické společnosti\n• Události a další efekty#!" # todo: CONCEPT CASE
 concept_presidency: "Prezidentství"
 concept_presidency_desc: "Prezidentství jsou nejvyšší úrovní administrativních jednotek koloniální Indie. Existují tři prezidentství, jejichž hranice jsou vymezeny [Concept('concept_strategic_region','strategickými regiony')].\n\n#bold Bengálské prezidentství#!\n#title Regiony:#! [GetStrategicRegion('region_bengal').GetName], [GetStrategicRegion('region_central_india').GetName], a [GetStrategicRegion('region_punjab').GetName].\n\n#bold Bombajské prezidentství#!\n#title Regiony:#! [GetStrategicRegion('region_bombay').GetName].\n\n#bold Madrasské prezidentství#!\n#title Regiony:#! [GetStrategicRegion('region_madras').GetName]." # todo: CONCEPT CASE
 concept_presidencies: "Prezidentství"
 concept_court_intrigue: "Dvorní intrika"
 concept_court_intrigue_short: "Intrika"
 concept_court_intrigue_desc: "Dvorní intrika představují postup různých spiknutí, aby byl $RULER_TITLE_MAHARAJA$ ([Concept('concept_ruler','vládce')|l]) svržen. Intrika je sledována v [Concept('concept_journal_entry','záznamu v deníku')|l] #b $je_sikh_sovereignty$#!. Pokud intrika dosáhne #v 100%#!, $RULER_TITLE_MAHARAJA$ (vládce) bude zavražděn, [Concept('concept_empire_stability','stabilita říše')|l] se #bold zresetuje#! na #v 0#!, úroveň intrik klesne a na trůn usedne nový kandidát.\n\n#title Následující podmínky #g #b snižují#!#! úroveň dvorních intrik:#! #indent_newline:3 \n• $RULER_TITLE_MAHARAJA$ ([Concept('concept_ruler','vládce')|l]) je #b $Ranjit$ $Singh$#!\n• [Concept('concept_in_government','ve vládě')] je [GetCharacterTrait('ruthless').GetName|l] [Concept('concept_leader','vůdce')] se [Concept('concept_approval', 'spokojeností')] nad #v 5#!\n• [Concept('concept_in_government','ve vládě')] je [GetCharacterTrait('compliant').GetName|l] [Concept('concept_leader', 'vůdce')] \n• [Concept('concept_ruler', 'Vládcova')] [Concept('concept_interest_group','zájmová skupina')|l] je [Concept('concept_powerful','silná')|l]\n• Vysoká [Concept('concept_legitimacy','legitimita')|l]\n• Události a jiné efekty #!\n\n#title Následující podmínky #r #b zvyšují#!#! úroveň dvorních intrik:#! #indent_newline:3 \n• [GetCharacterTrait('reckless').GetName] [Concept('concept_ruler','vládce')|l]\n• Nízká [Concept('concept_popularity','popularita')|l] [Concept('concept_ruler','vládce')|l] \n• [GetCharacterTrait('ruthless').GetName] [Concept('concept_leader', 'vůdce')] [Concept('concept_in_government','ve vládě')|l] nebo [Concept('concept_in_opposition','V opozici')|l] se  [Concept('concept_approval', 'spokojeností')] pod #v 0#!\n• [GetCharacterTrait('ambitious').GetName] [Concept('concept_leader','vůdcem')] [Concept('concept_in_government','ve vládě')|l] nebo [Concept('concept_in_opposition','V opozici')|l] se [Concept('concept_approval','spokojeností')] pod #v 0#!\n• [Concept('concept_ruler','Vládcova')] [Concept('concept_interest_group','zájmovou skupinou')|l] je [Concept('concept_marginalized','marginalizována')|l]\n• Nízká [Concept('concept_legitimacy','legitimita')|l]\n• Události a jiné efekty#!" # todo: CONCEPT CASE
 concept_empire_stability: "Stabilita říše"
 concept_empire_stability_short: "Stabilita"
 concept_empire_stability_desc: "Stabilita říše reprezentuje, jakou sílu má $RULER_TITLE_MAHARAJA$ ([Concept('concept_ruler','vládce')|l]). [Concept('concept_empire_stability','Stabilita říše')] sleduje [Concept('concept_journal_entry','záznam v deníku')|l] #b $je_sikh_sovereignty$#! .\n\nAby se stabilita zvýšila, musí být legitimita nad #v 50#!. Pokud intrika dosáhne #v 100%#!, $RULER_TITLE_MAHARAJA$ (vládce) bude zavražděn, [Concept('concept_empire_stability','stabilita říše')|l] se #bold zresetuje#! na #v 0#!, úroveň intrik klesne a na trůn usedne nový kandidát.\n\n#title Následující podmínky #g #b zvyšují#!#! stabilitu říše:#! #indent_newline:3 \n• [Concept('concept_interest_group','zájmová skupina')] [GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetNameWithCountryVariant] je [Concept('concept_in_government','ve vládě')|l]\n• [Concept('concept_interest_group','zájmová skupina')] [GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetNameWithCountryVariant] je [Concept('concept_powerful','silná')|l]\n• [GetReligion('sikh').GetName] je [Concept('concept_state_religion','státním náboženstvím')]\n• [Concept('concept_law','zákon')] [GetLawType('law_freedom_of_conscience').GetName] je [Concept('concept_enactment_of_laws','schválen')]\n• Události a jiné podmínky #!\n\n#title Následující podmínky #r #b snižují#!#! stabilitu říše:#! #indent_newline:3 \n• [Concept('concept_interest_group','zájmová skupina')] [GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetNameWithCountryVariant] není [Concept('concept_in_government','ve vládě')|l]\n• [Concept('concept_court_intrigue','dvorní intrika')] dosáhne #v 100%#!\n• Události a jiné podmínky #!" # todo: CONCEPT CASE
 concept_ottoman_integrity: "Rumelijská soudržnost"
 concept_ottoman_integrity_short: "Soudržnost"
 concept_ottoman_integrity_desc: "Rumelijská soudržnost představuje stabilitu $dyn_c_ottoman_empire_adj$ v [GetStrategicRegion('region_balkans').GetName] [Concept('concept_strategic_region','strategickém regionu')] ohroženou [Concept('concept_secession','separatistovi')] [Concept('concept_political_movement','politickém hnutí')]. [Concept('concept_ottoman_integrity','Rumelijská soudržnost')] se sleduje v #b $je_great_eastern_crisis$#! [Concept('concept_journal_entry','záznam v deníku')].\n\n[Concept('concept_activism','Aktivismus hnutí')] všech separatisty politická hnutí v $dyn_c_ottoman_empire$ musí být #b pod#! #v 75#!, aby se soudržností zvýšila.\n\n#title Následující podmínky #g #b zvýší#!#! $concept_ottoman_integrity$:#! #indent_newline:3 \n• [Concept('concept_legitimacy','legitimita')] v $dyn_c_ottoman_empire$ je #v 50#! nebo #b vyšší#!\n• $dyn_c_ottoman_empire$ není #r #b ve válce#!#!\n• $dyn_c_ottoman_empire$ #r #b nemá#!#! žádné rostoucí [Concept('concept_secession','separatista')] [Concept('concept_political_movement','politická hnutí')]\n• $dyn_c_ottoman_empire$ nedávno potlačilo [Concept('concept_secession','odtržení')]#!" # todo: CONCEPT CASE
 concept_balkan_culture: "Balkánská kultura"
 concept_balkan_cultures: "Balkánské kultury"
 concept_balkan_culture_short: "Balkánský"
 concept_balkan_culture_desc: "#title [Concept('concept_secession','Separatista')] [Concept('concept_political_movement','Politické hnutí')] vedené následujícími [Concept('concept_culture','kulturou')] ovlivňují [Concept('concept_ottoman_integrity','rumelijská soudržnost')]:#! #indent_newline:3 \n• [GetCulture('albanian').GetName]\n• [GetCulture('bosniak').GetName]\n• [GetCulture('bulgarian').GetName]\n• [GetCulture('croat').GetName]\n• [GetCulture('greek').GetName]\n• [GetCulture('romanian').GetName]\n• [GetCulture('serb').GetName]" # todo: CONCEPT CASE
 concept_subsistence_output: "Samozásobitelský výstup"
 concept_subsistence_output_desc: "Forma příjmu v naturáliích, kterou [SelectLocalization(GetPlayer.IsValid,'concept_subsistence_output_desc_added','Sedláci')] generují z [Concept('concept_subsistence_building','samozásobitelských farem')], což představuje práci, kterou vykonávají při produkci [Concept('concept_good','zboží')|l] k pokrytí svých [Concept('concept_pop_needs','potřebám populace')]. Na rozdíl od [Concept('concept_building_wage','mzdy')], soběstačný výstup není vyplácen ze [Concept('concept_revenue','příjmů')] [Concept('concept_building','budovy')] a nepodléhá [Concept('concept_budget_income_taxes','daní z příjmu')]." # todo: CONCEPT CASE
 concept_subsistence_output_desc_added: "[GetPopType('peasants').GetName]"
 concept_split_state: "Rozdělený stát"
 concept_split_states: "Rozdělené státy"
 concept_split_state_short: "Rozdělený"
 concept_split_state_desc: "[Concept('concept_state_region','Státní oblast')] rozdělen na několik menších [Concept('concept_state', 'států')] patřících různým [Concept('concept_country','zemím')]. [Concept('concept_resource_potential','Potenciál zdrojů')], [Concept('concept_building','budovám')|l] a [Concept('concept_pop','populace')|l] se při rozdělení redistribuuje mezi státy. Pokud jedna [Concept('concept_country','země')|l] ovládne více než jednu část rozděleného státu, budou tyto sloučeny do jednoho [Concept('concept_state','státu')]." # todo: CONCEPT CASE
 concept_unincorporated_state: "Nezačleněný stát"
 concept_unincorporated_state_short: "Nezačleněný"
 concept_unincorporated_states: "Nezačleněné státy"
 concept_unincorporated_state_icon: "@unincorporated!"
 UNINCORPORATED_ICON_WITH_CONCEPT: "[Concept('concept_unincorporated_state','@unincorporated!')]" # todo: CONCEPT CASE
 concept_unincorporated_state_desc: "[Concept('concept_state','Stát')], který je sice součástí území [Concept('concept_country','země')|l], ale je považován za okrajovou državu nebo pohraniční oblast, mimo dosah [Concept('concept_institution','institucí')] a [Concept('concept_government','vlády')]. [Concept('concept_pop','Populace')], která žije v nezačleněných státech, je zbavena občanských práv – nepřispívá významně k [Concept('concept_political_strength','politické síle')] svých [Concept('concept_interest_group','zájmové skupině')] a nemůže [Concept('concept_votes','hlasovat')] ve [Concept('concept_election','volbách')]. Na druhou stranu je osvobozena od [Concept('concept_taxes','daní')].\n\nNezačleněné státy nevyžadují žádnou [Concept('concept_bureaucracy','byrokracii')] pro správu, protože se zde nevyberají [Concept('concept_taxes','daně')|l] a instituce zde neposkytují žádné výhody. Takové státy mohou být [Concept('concept_incorporated_state','začleněny')], čímž přejdou pod přímou správu ústřední vlády dané [Concept('concept_country','země')|l].[AddLocalizationIf(GetPlayer.IsValid,'concept_unincorporated_state_desc_added')]" # todo: CONCEPT CASE
 concept_unincorporated_state_desc_added: "\n\nNezačleněné státy podléhají následujícím účinkům:\n[GetStaticModifier('unincorporated_state').GetDesc]#!" # todo: CONCEPT CASE
 concept_decentralized_nation: "Decentralizovaný národ"
 concept_decentralized_nations: "Decentralizované národy"
 concept_decentralized: "Decentralizovaný"
 concept_decentralized_nation_desc: "Decentralizovaný [Concept('concept_country','národ')|l] sdílí většinu vlastností zemí - [Concept('concept_pop','populací')], [Concept('concept_ruler','vládce')|l], [Concept('concept_building','budovy')|l], [Concept('concept_law','zákona')|l] a tak dále - ale postrádá centralizovanou moc a/nebo vůli prosadit své hranice. To je činí náchylnými ke [Concept('concept_colony','kolonizaci')] ze strany zemí, které je neberou jako rovné partnery, s nimiž by mohly důstojně [Concept('concept_diplomatic_play','vyjednávat')] o zemských právech.\n\nDecentralizované národy jsou řízeny AI a nejsou hratelné lidmi." # todo: CONCEPT CASE
 concept_arable_land: "Orná půda"
 concept_arable_land_desc: "Množství půdy v [Concept('concept_state','státě')], které může být použito na pěstování plodin nebo chov dobytka. Na rozdíl od [Concept('concept_building','budovy')] , které vyžadují k výstavbě určitý [Concept('concept_resource_potential','potenciály zdrojů')|l], $concept_arable_land$ je sdílena mezi [Concept('concept_building','budovou')|l], které jej vyžadují.\n\nMnožství orné půdy, které zůstává nevyužito jinými budovami, může být použito pro [Concept('concept_subsistence_building','samozásobitelskou budovu')|l], což umožní [Concept('concept_pop','populaci')] vydělat si i v případě, že nejsou zaměstnáni." # todo: CONCEPT CASE
 concept_state_region: "Státní oblast"
 concept_state_regions: "Státní oblasti"
 concept_state_region_possessive: "Státních oblastí"
 concept_state_region_desc: "Část světa odpovídající určitému pevnému souboru [Concept('concept_province', 'provincí')]. Státní oblast je obvykle ekvivalentem [Concept('concept_state','státem')]. V některých případech se může region státu stát [Concept('concept_split_state','rozděleným státem')], kde dvě nebo více [Concept('concept_country','zemí')] ovládají [Concept('concept_state','stát')|l] ve stejném regionu státu." # todo: CONCEPT CASE
 concept_occupancy: "Obsazenost"
 concept_occupancy_desc: "Jak plně je [Concept('concept_building','budova')|l] využívána, což také určuje, kolik z její maximální [Concept('concept_good_production','výrobní')] kapacity je využito. Pokud má budova prostor najmout víc [Concept('concept_workforce','pracovníků')], pokusí se tak učinit. Pokud je její nábor omezen [Concept('concept_building_wage','mzdou')], bude zvyšovat mzdy tak dlouho, jak bude její [Concept('concept_building_balance','bilance')|l] zůstávat pozitivní." # todo: CONCEPT CASE
 concept_votes: "Hlasy"
 concept_vote: "Hlas"
 concept_voting_rights: "Volební právo"
 concept_voting: "Hlasování"
 concept_votes_desc: "Vaše [Concept('concept_law','zákony')|l] určují, zda má daná [Concept('concept_pop','populace')|l] právo volit, a pokud ano, kolik [Concept('concept_political_strength','politickou sílu')] jejich hlasy přinesou. Během [Concept('concept_election','volebního')] období se hlasuje pro [Concept('concept_party','stranu')|l]. Populace obvykle hlasují pro strany, ke které náleží jejich [Concept('concept_interest_group','zájmová skupina')|l], ale mohou být získáni jinou stranou, která má větší [Concept('concept_momentum','momenta')|l]. Po datu [Concept('concept_election','volbám')] bude celkový počet hlasů, které každá strana obdržela, fixní až do dalších voleb, a zvýší [Concept('concept_clout','politický vliv')|l] jakékoliv zájmové skupiny, jejichž členy jsou ve straně." # todo: CONCEPT CASE
 concept_clout: "Politický vliv"
 concept_clout_desc: "Podíl [Concept('concept_interest_group','zájmové skupiny')|l] na celkové [Concept('concept_political_strength','politickou sílu')], kterou [Concept('concept_pop','populaci')|l] v rámci své [Concept('concept_country','zemí')|l] generuje. Politický vliv je konečným ukazovatelem toho, jaký vliv má zájmová skupina, a ovlivňuje všechno od [Concept('concept_legitimacy','legitimity')] a [Concept('concept_enactment_of_laws','schvalování zákonů')|l], pokud je zájmová skupina [Concept('concept_in_government','ve vládě')|l], až po [Concept('concept_political_movement_support','podpoře politickém hnutí')] a [Concept('concept_activism','aktivismu hnutí')|l], pokud je [Concept('concept_in_opposition','V opozici')|l]. Také určuje, zda je zájmová skupina považovaná za [Concept('concept_powerful','silnou')], [Concept('concept_influential','vlivnou')] anebo je [Concept('concept_marginalized','marginalizována')|l]." # todo: CONCEPT CASE
 concept_powerful: "Silná"
 concept_powerful_desc: "Množství [Concept('concept_clout','politického vlivu')] [Concept('concept_interest_group','zájmové skupiny')] rozhoduje, zda je [Concept('concept_powerful','silná')], [Concept('concept_influential','vlivná')], nebo [Concept('concept_marginalized','marginalizována')]. [Concept('concept_interest_group_trait','Rys zájmové skupiny')] silné zájmové skupiny budou mít [GetDefine('NPolitics','POWERFUL_IG_TRAIT_BONUS')|%0=+] větší vliv než pokud by byli pouze vlivnou skupinou.\n\nZájmové skupiny se považují za silné, když je jejich politický vliv větší než [GetDefine('NPolitics','POWERFUL_IG_THRESHOLD')|%0]." # todo: CONCEPT CASE
 concept_influential: "Vlivná"
 concept_influential_powerful_common: "Množství [Concept('concept_clout','politického vlivu')] [Concept('concept_interest_group','zájmové skupiny')] rozhoduje, zda je [Concept('concept_powerful','silná')], [Concept('concept_influential','vlivná')], nebo [Concept('concept_marginalized','marginalizována')]." # todo: CONCEPT CASE
 concept_influential_desc: "Množství [Concept('concept_clout','politického vlivu')] [Concept('concept_interest_group','zájmové skupiny')] rozhoduje, zda je [Concept('concept_powerful','silná')], [Concept('concept_influential','vlivná')], nebo [Concept('concept_marginalized','marginalizována')]. [Concept('concept_interest_group_trait','Rys zájmové skupiny')], pokud je $concept_influential$, budou mít menší účinek, než kdyby byla $concept_powerful$.\n\nZájmové skupiny jsou považovány za Vlivné, pokud je jejich politický vliv pod [GetDefine('NPolitics','POWERFUL_IG_THRESHOLD')|%0v]." # todo: CONCEPT CASE
 concept_marginalized: "Marginalizována"
 concept_marginalized_desc: "Marginalizována [Concept('concept_interest_group','Zájmová skupina')] mají příliš málo [Concept('concept_clout','politický vliv')], aby byly politicky významné, a nemohou být zařazeny do [Concept('concept_government','vlády')]. Marginalizována $concept_interest_group$, které mají podporu alespoň [GetDefine('NPolitics','MARGINAL_IG_JOIN_PARTY_POPULATION_THRESHOLD')], se budou moci připojit k [Concept('concept_party','straně')] a přestanou být $concept_marginalized$, jakmile tak učiní. Jejich [Concept('concept_interest_group_trait','rysy zájmové skupiny')] jsou deaktivovány po celou dobu, kdy zůstávají $concept_marginalized$.\n\nZájmové skupiny, které již jsou $concept_marginalized$, zůstanou $concept_marginalized$ tak dlouho, dokud jejich $concept_clout$ bude pod [GetDefine('NPolitics','MARGINAL_IG_THRESHOLD')|%0v]. Zájmové skupiny, které nejsou $concept_marginalized$ a nejsou v straně, se stanou marginalizována, jakmile jejich $concept_clout$ klesne pod [GetDefine('NPolitics','MARGINAL_IG_CUTOFF')|%0v], pokud již nejsou [Concept('concept_in_government','ve vládě')], v takovém případě se nestanou marginalizována, dokud nejsou z [Concept('concept_in_government','ve vládě')] odstraněny." # todo: CONCEPT CASE
 concept_politically_unaligned_aligned: "Politická angažovanost"
 concept_politically_unaligned: "Politicky neangažováni"
 concept_politically_involved: "Politicky angažováni"
 concept_politically_unaligned_aligned_desc: "Část [Concept('concept_pop','populací')|l], která nepodporuje [Concept('concept_interest_group','zájmovou skupinu')], se nazývá #b politicky neangažována#!. To je často způsobeno nízkou [Concept('concept_literacy','gramotnost')] nebo [Concept('concept_sol','životním standardem')]. Části populace, které jsou politicky neangažované, se neúčastní politického procesu a jakákoliv [Concept('concept_political_strength','politická síla')|l], kterou mají, je nevyužita.\n\nOpakem je #b politicky angažováni#!. To znamená, že populace je součástí jedné ze [Concept('concept_interest_group','zájmové skupiny')] vaši [Concept('concept_country','zemi')] a politická síla populace se přičítává k dané zájmové skupině." # todo: CONCEPT CASE
 concept_investment_level: "Úroveň investice"
 concept_investment_levels: "Úrovně investice"
 concept_investment_level_desc: "Aktuální úroveň [Concept('concept_institution','instituce')|l]. Každá úroveň stojí určité množství [Concept('concept_bureaucracy','byrokracie')|l] v závislosti na velikosti [Concept('concept_pop','populace')|l] ve vašich [Concept('concept_incorporated_state','začleněného státu')] a její účinky se zvyšují s úrovní instituce.[AddLocalizationIf(GetPlayer.IsValid,'concept_investment_level_ingame_added')]" # todo: CONCEPT CASE
 concept_investment_level_ingame_added: "\n\nV současné době platíte @bur! #v [Multiply_CFixedPoint(GetPlayer.GetInstitutionInvestmentBureaucracyCost,'(CFixedPoint)-1')|0+]#! [Concept('concept_bureaucracy','byrokracie')|l] za celkově [GetPlayer.GetInstitutionInvestment|v0] úrovní investic, nebo-li @bur! #v [GetPlayer.GetInstitutionInvestmentBureaucracyFactor|+0]#! [Concept('concept_bureaucracy','byrokracie')|l] za každou úroveň." # todo: CONCEPT CASE
 concept_production_lens: "Stavební čočka"
 concept_production_lens_desc: "Prozkoumejte [Concept('concept_state','státy')|l] a postavte [Concept('concept_good_production','výrobní')] [Concept('concept_building','budovy')|l]." # todo: CONCEPT CASE
 concept_political_lens: "Politická čočka"
 concept_political_lens_desc: "Prozkoumejte [Concept('concept_interest_group','zájmové skupiny')|l] a [Concept('concept_incorporated_state','začlenené státy')|l], postavte [Concept('concept_government_building','vládní budovy')|l], vydávejte [Concept('concept_decree','dekrety')|l] a spravujte domácí záležitosti vaší [Concept('concept_country','zemi')|l]." # todo: CONCEPT CASE
 concept_diplomatic_lens: "Diplomatická čočka"
 concept_diplomatic_lens_desc: "Sledujte [Concept('concept_attitude','postoj')|l] ostatních [Concept('concept_country','zemí')], kontrolujte své [Concept('concept_interest','zájem')|l] a jejich [Concept('concept_strategic_region','strategické regiony')|l], uzavírejte [Concept('concept_diplomatic_pact','diplomatické pakty')|l], podnikejte [Concept('concept_diplomatic_action','akce')|l] a zahajujte [Concept('concept_diplomatic_play','diplomatické hry')|l]." # todo: CONCEPT CASE
 concept_military_lens: "Vojenská čočka"
 concept_military_lens_desc: "Sledujte pokrok v probíhajících [Concept('concept_war','válkách')], stavte [Concept('concept_military_building','vojenské budovy')|l] a verbujte [Concept('concept_commander','velitele')]." # todo: CONCEPT CASE
 concept_country: "Země"
 concept_countries: "Země"
 concept_country_nation: "Národ"
 concept_country_nation_state: "Národný stát"
 concept_country_polity: "Politický systém"
 concept_country_polities: "Politickými systémy"
 concept_country_possessive: "zemi"
 concept_countries_possessive: "zemí"
 concept_country_desc: "Země se skládá z jednoho nebo více území zvaných [Concept('concept_province','provincií')|l] uspořádaných do [Concept('concept_state','státu')], ve kterých žije [Concept('concept_pop','populace')|l], které je podřízené [Concept('concept_government','vládě')|l] a jejímu [Concept('concept_head_of_state','hlavě státu')|l]. Ve hře Victoria 3 ovládají země jak hráči, tak i umělá inteligence.\n\nKromě charakteru své populace, vlastněných států a míry jejich rozvoje je každá země dále určena svou [Concept('concept_country_tier','úrovní')], [Concept('concept_primary_cultures','primární kultury')], [Concept('concept_state_religion','státní náboženství')] a tím, zda je [Concept('concept_recognized_power','uznanou')] nebo [Concept('concept_unrecognized_power','neuznanou')] mocností. Země mají také různé [Concept('concept_law','zákony')|l] a přístup k různým [Concept('concept_technology','technologiím')]." # todo: CONCEPT CASE
 concept_decree: "Dekret"
 concept_decrees: "Dekrety"
 concept_decree_desc: "Dekrety jsou požadavky, které vznáší [Concept('concept_ruler','vládce')|l] [Concept('concept_country','země')], aby způsobily změny v [Concept('concept_state','státě')] pod jeho kontrolou. Dekrety stojí [Concept('concept_authority','autoritu')] tak dlouho, pokud jsou aktivní. Jakmile jsou vydány, dekret poskytne určité výhody pro stát, až dokud nebude odstraněn." # todo: CONCEPT CASE
 concept_pop_needs: "Potřeby populace"
 concept_pop_need: "Potřeba populace"
 concept_pop_needs_short: "Potřeby"
 concept_pop_need_short: "Potřeba"
 concept_pop_needs_desc: "[Concept('concept_pop','Populace')] utrácí svůj příjem za [Concept('concept_good','zboží')|l] k uspokojení svých potřeb. Čím vyšší je jejich [Concept('concept_wealth','bohatství')|l], tím více zboží si zakoupí. Populace získají rozmanitější a luxusnější potřeby, jak roste jejich bohatství. Určité potřeby můžou být často uspokojeny různým zboží prostřednictvím [Concept('concept_goods_substitution','náhružek')]. Pokud má populace po splnění svých potřeb peněz nazvyš, jejich bohatství se zvýší. Obráceně to platí i pro případ, že si populace nemůže dovolit uspokojit své potřeby, které neustále nakoupí, a jakýkoli nedostatek snižuje jejich bohatství." # todo: CONCEPT CASE
 concept_combat_unit_group: "Skupina vojenských jednotek"
 concept_combat_unit_groups: "Skupiny vojenských jednotek"
 concept_combat_unit_group_short: "Skupina jednotek"
 concept_combat_unit_groups_short: "Skupiny jednotiek"
 concept_combat_unit_group_desc: "Vojenské jednotky jsou kategorizovány do [Concept('concept_default_unit','výchozí jednotky')] a [Concept('concept_special_unit','speciální jednotky')], které mají různé přednosti a slabiny. #b [GetCombatUnitGroup('combat_unit_group_infantry').GetName]#! je lépe přizpůsobena pro obranu území, zatímco #b [GetCombatUnitGroup('combat_unit_group_cavalry').GetName]#! je lepší pro [Concept('concept_occupation','okupaci')]." # todo: CONCEPT CASE
 concept_combat_unit_type: "Typ vojenské jednotky"
 concept_combat_unit_types: "Typy vojenských jednotek"
 concept_combat_unit_type_short: "Typ jednotky"
 concept_combat_unit_types_short: "Typy jednotek"
 concept_combat_unit_type_desc: "V rámci [Concept('concept_combat_unit_group','skupiny vojenských jednotek')|l] existují různé typy jednotek. Většinou se odemknou díky technologickému pokroku a jsou v boji lepší než typ, který nahrazují." # todo: CONCEPT CASE
 concept_unit: "Vojenská jednotka"
 concept_units: "Vojenské jednotky"
 concept_unit_short: "Jednotka"
 concept_units_short: "Jednotky"
 concept_unit_possessive: "vojenské jednotky"
 concept_unit_desc: "Vojenské jednotky jsou [Concept('concept_battalion','prapory')] přiřazené k [Concept('concept_military_formation','formacím')] a provádějí vojenské operace pod vedením [Concept('concept_general','generálem')]. Prapory se dále dělí do samostatných skupin: [GetBattalionGroupsList]. Jednotky ve skupině #b Výchozí#! jsou neomezené, zatímco pokud máte více #b Speciálních#! jednotek než výchozích, může to způsobit postih k [Concept('concept_organization','organizacím')]." # todo: CONCEPT CASE
 concept_special_unit: "Speciální jednotka"
 concept_special_units: "Speciální jednotky"
 concept_special_unit_desc: "[Concept('concept_unit','Vojenská jednotka')], které nejsou #b [GetCombatUnitGroup('combat_unit_group_infantry').GetName]#! nebo #b [GetCombatUnitGroup('combat_unit_group_light_ship').GetName]#! - ty se považují za [Concept('concept_default_unit','výchozí jednotku')|l].\n\nSpeciální jednotky pro [Concept('concept_army','armádu')|l] jsou:\n$TAB$#b [GetCombatUnitGroup('combat_unit_group_artillery').GetName]#!\n$TAB$#b [GetCombatUnitGroup('combat_unit_group_cavalry').GetName]#!\n\nSpeciální jednotky pro [Concept('concept_fleet','loďstvo')|l] jsou:\n$TAB$#b [GetCombatUnitGroup('combat_unit_group_capital_ship').GetName]#!\n$TAB$#b [GetCombatUnitGroup('combat_unit_group_support_ship').GetName]#!" # todo: CONCEPT CASE
 concept_default_unit: "Výchozí jednotka"
 concept_default_units: "Výchozí jednotky"
 concept_default_unit_desc: "[Concept('concept_unit','Vojenská jednotka')], které jsou buď #b [GetCombatUnitGroup('combat_unit_group_infantry').GetName]#! pro [Concept('concept_army','armádu')|l] nebo #b [GetCombatUnitGroup('combat_unit_group_light_ship').GetName]#! pro [Concept('concept_fleet','loďstvo')|l]." # todo: CONCEPT CASE
 concept_kill_rate: "Poměr zabitých"
 concept_kill_rate_desc: "Jak efektivní je [Concept('concept_unit','vojenská jednotka')|l] při zajišťování, že [Concept('concept_casualties','ztráty')|l] jeho protivníka budou z boje vyřazeny natrvalo. Zvyšuje poměr [Concept('concept_casualties','ztrát')], které skončí zabity (místo [Concept('concept_wounded','zranění')|l]). Poměr zabitých je vyvážen schopností [Concept('concept_recovery_rate','měrou zotavení')|l]." # todo: CONCEPT CASE
 concept_recovery_rate: "Míra zotavení"
 concept_recovery_rate_desc: "Procento [Concept('concept_casualties','ztrát')] [Concept('concept_unit','vojenských jednotek')], kteří přežijí, v některých případech tím, že se stanou [Concept('concept_dependents','závislými osobami')]. Může být zvýšeno pomocí #b [Concept('concept_mobilization_option','možností mobilizace')]. Míra zotavení vyvažuje [Concept('concept_kill_rate','poměr zabitých')|l] [Concept('concept_unit','vojenských jednotek')] nepřítele." # todo: CONCEPT CASE
 concept_casualties: "Ztráty"
 concept_casualties_desc: "[Concept('concept_manpower','Personál')], který padne v bitvě nebo skrze [Concept('concept_attrition','vyčerpání')|l], se považuje za ztráty. Část ztrát je zabita přímo, zatímco zbytek utrpí [Concept('concept_wounded','zranění')|l]. Tento poměr závisí na [Concept('concept_recovery_rate','míre obnovy')] [Concept('concept_unit','vojenskou jednotku')] v porovnání s [Concept('concept_kill_rate','mírou zabití')] jejich nepřítele." # todo: CONCEPT CASE
 concept_offense: "Útok"
 concept_offense_desc: "Bojová schopnost [Concept('concept_unit','vojenské jednotky')] v [Concept('concept_battle','bitvě')] při postupu na nepřátelské území." # todo: CONCEPT CASE
 concept_defense: "Obrana"
 concept_defense_desc: "Bojová schopnost [Concept('concept_unit','vojenské jednotky')] v [Concept('concept_battle','bitvě')] při obraně proti nepřátelským vpádům." # todo: CONCEPT CASE
 concept_blockade_strength: "Síla blokády"
 concept_blockade_strength_short: "Síla" # todo: NEW TRANSLATION
 concept_blockade_strength_desc: "Určuje, do jaké míry je [Concept('concept_fleet','loďstvo')] schopna úspěšně [Concept('concept_blockade','blokáda')] nepřátelské [Concept('concept_state','státy')]." # todo: CONCEPT CASE
 concept_blockade_efficiency: "Účinnost blokády" # todo: NEW TRANSLATION
 concept_blockade_efficiency_desc: "Účinnost blokády je průměrná úroveň [Concept('concept_blockade','blokáda')], které [Concept('concept_fleet','loďstvo')] dosáhne ve všech nepřátelských přístavech v oblasti své [Concept('concept_naval_mission','námořní mise')]. Závisí na poměru [Concept('concept_blockade_strength','síle blokády')] vůči [Concept('concept_blockade_resistance','odolnosti proti blokádě')] každého cílového přístavu a je rovnoměrně rozdělena mezi všechny cílené přístavy." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 concept_blockade_resistance: "Odolnost proti blokádě" # todo: NEW TRANSLATION
 concept_blockade_resistance_short: "Odolnost" # todo: NEW TRANSLATION
 concept_blockade_resistance_desc: "Odolnost proti blokádě je množství [Concept('concept_blockade_strength','síla blokády')] potřebné k úplnému [Concept('concept_blockade','blokádě')] [Concept('concept_state','státu')]. Závisí na faktorech jako výstup pobřežních [Concept('concept_building','budov')] a objemy místního [Concept('concept_trade','obchodu')]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 concept_blockade: "Blokáda"
 concept_blockade_level: "Úroveň blokády"
 concept_blockades: "Blokády"
 concept_blockaded: "Zablokovaný"
 concept_blockade_desc: "Blokády se zakladají v [Concept('concept_sea_node','námořním uzlu')] prostřednictvím [Concept('concept_admiral','admirála')] vydávajícího [Concept('concept_order','rozkazu')|l]. Poškozují [Concept('concept_supply_network','zásobovací sítě')|l] a omezují přístup na [Concept('concept_world_market','světový trh')|l] v přístavech přilehlých k námořním uzlům. Úroveň blokády závisí od příslušné kategorie lodí - pro udržení blokády sú nejvhodnejší především [GetCombatUnitGroup('combat_unit_group_capital_ship').GetName]." # todo: CONCEPT CASE
 concept_naval_hostilities: "Námořní nepřátelství"
 concept_naval_hostilities_desc: "Námořní nepřátelství je stav nepřátelství mezi dvěma [Concept('concept_country','zemím')] umožňující nepřátelské námořní akce bez formálního [Concept('concept_war','války')]. Flotily mohou vést [Concept('concept_battle','bitvy')] a uplatňovat [Concept('concept_blockade','blokády')] proti zemím, s nimiž mají $concept_naval_hostilities$." # todo: CONCEPT CASE
 concept_organization: "Organizace"
 concept_organization_organized: "Organizované"
 concept_organization_desc: "Nízká organizace u [Concept('concept_military_formation','formací')] se projevuje v nižší efektivitě během různých bojů. Organizace začíná nízkou hodnotou, když je [Concept('concept_military_formation','formace')|l] poprvé vytvořena, ale postupně narůstá, zatímco se [Concept('concept_military_formation','formacemi')|l] nevyužívá. Organizace je omezená, pokud máte příliš nízký [Concept('concept_command_limit','velitelský limit')|l] pro všechny vaše [Concept('concept_unit','vojenské jednotky')|l] nebo pokud má vaše [Concept('concept_military_formation','formace')|l] více [Concept('concept_special_unit','speciálních')] než [Concept('concept_default_unit','výchozích')] jednotek.\n\nOrganizace může být také dočasně ovlivněna při přepínání [Concept('concept_mobilization_option','mobilizační možnosti')] nebo při převodu [Concept('concept_unit','vojenské jednotce')] mezi různými [Concept('concept_mobilize_army','mobilizovanými')] armádami se různými soubory [Concept('concept_mobilization_option','mobilizačních možností')].\n\n#indent_newline:3 $concept_military_formation$ s nízkou organizací utrpí penalizace, jak nízká hodnota trvá, až po následující účinky:\n[GetStaticModifier('low_organization').GetDesc]#!" # todo: CONCEPT CASE
 concept_unit_experience: "Zkušenosti jednotky"
 concept_experience: "Zkušenosti"
 concept_unit_experience_desc: "Zkušenosti určuje [Concept('concept_veterancy_level','úroveň veteránství')] [Concept('concept_unit','vojenské jednotky')] a posádky v [Concept('concept_ship','lodi')]. Jakmile nasbírají dostatek $concept_experience$, jsou povýšeny na vyšší úroveň.\n\nU vojenských jednotek se zkušenostmi získává postupně v čase, více když jsou mobilizované a během bitev.\n\nU lodí způsobí nepřítomnost na [Concept('concept_naval_mission','námořní mise')], že její posádka časem ztrácí $concept_experience$." # todo: CONCEPT CASE
 concept_veterancy_level: "Úroveň veteránství"
 concept_veterancy_levels: "Úrovně veteránství"
 concept_veterancy_level_short: "Úroveň"
 concept_veterancy_levels_short: "Úrovně"
 concept_veterancy_level_desc: "[Concept('concept_unit','Vojenská jednotka')] a posádky v [Concept('concept_ship','lodi')] získávají úrovni veteránství nasbíráním [Concept('concept_unit_experience','zkušenostmi jednotky')]. Vyšší $concept_veterancy_levels_short$ udělují rostoucí bonusy k útočným a obranným schopnostem příslušného vojenské jednotky nebo $concept_ship$." # todo: CONCEPT CASE
 concept_battalion: "Prapor"
 concept_battalions: "Prapory"
 concept_battalion_desc: "[Concept('concept_unit','Vojenská jednotka')] ve vojsku [Concept('concept_country','zemím')|l]. Vytvářejí a udržují je [SelectLocalization(GetPlayer.IsValid,'concept_battalion_desc_added','kasárny')|l] a velí jim [Concept('concept_general','generálovi')|l]." # todo: CONCEPT CASE
 concept_battalion_desc_added: "[GetBuildingType('building_barrack').GetName]"
 concept_in_government: "Ve vládě"
 concept_in_government_desc: "[Concept('concept_interest_group','Zájmová skupina')] zahrnuté ve [Concept('concept_government','vládě')] ovlivňují, které [Concept('concept_law','zákoně')|l] mohou být [Concept('concept_enactment_of_laws','uzákoněn')|l] a určují [Concept('concept_legitimacy','legitimitu')]  [Concept('concept_country','země')|l]. Nikdy nepodpoří [Concept('concept_political_movement','politická hnutí')|l], pokud jejich měsíční [Concept('concept_approval','spokojenost')|l] neklesne natolik, že odejdou do [Concept('concept_in_opposition','V opozici')|l]." # todo: CONCEPT CASE
 concept_change_rate_scaling: "Škálování rychlosti změny"
 concept_change_rate_scaling_desc: "Jak se [Concept('concept_liberty_desire','touhou po svobodě')] blíží k 0 nebo 100, její postup se zpomaluje díky škálování rychlosti změny, což odráží přirozenou neochotu [Concept('concept_pop','populace')] odchýlit se od status quo a přijmout zvýšenou nebo sníženou [Concept('concept_autonomy','autonomii')]." # todo: CONCEPT CASE
 concept_in_opposition: "V opozici"
 concept_in_opposition_short: "Opozice"
 concept_in_opposition_desc: "[Concept('concept_interest_group','Zájmová skupina')] není součástí [Concept('concept_government','vládou')] a je považována za opozici. Jejich jediný způsob, jak dokážou ovlivnit [Concept('concept_enactment_of_laws','schvalování zákonů')|l], je prostřednictvím [Concept('concept_political_movement','politického hnutí')], ale jejich [Concept('concept_interest_group_trait','rysy zájmové skupiny')] se aplikují v plném rozsahu." # todo: CONCEPT CASE
 concept_legitimacy: "Legitimita"
 concept_legitimate: "Legitimní"
 concept_legitimacy_desc: "Legitimita [Concept('concept_government','Vláda')] měří, jak dobře složení [Concept('concept_interest_group','zájmové skupiny')] [Concept('concept_in_government','ve vládě')] odpovídá [Concept('concept_country','zemi')] [Concept('concept_law','zákony')]. Čím nižší $concept_legitimacy$, tím delší čas mezi pokusy [Concept('concept_enactment_of_laws','uzákonit')] o prosazení nových zákony. $legitimacy_coup_loc$ Změna [Concept('concept_taxes','daně')] (jejich zvýšení nebo snížení) také ovlivňuje $concept_legitimacy$." # todo: CONCEPT CASE
 legitimacy_coup_loc: "Vláda s vysokou legitimmitou je více [Concept('concept_coup_resistance','odolná')] vůči [Concept('concept_coup','puči')]." # todo: CONCEPT CASE
 concept_acceptance: "Přijetí"
 concept_accepted: "Akceptováno"
 concept_acceptance_desc: "Hodnota [Concept('concept_acceptance','přijetí')|l] [Concept('concept_pop','populace')|l] se pohybuje od [GetDefine('NPops', 'MIN_ACCEPTANCE_VALUE')|v] do [GetDefine('NPops', 'MAX_ACCEPTANCE_VALUE')|v] a určuje [Concept('concept_acceptance_status','status přijetí')|l] [Concept('concept_pop','populace')|l].\n\nPřijetí závisí především od [Concept('concept_culture', 'kultury')] a [Concept('concept_religion', 'náboženství')] [Concept('concept_pop','populací')|l], ako i od příslušních zákonů v [Concept('concept_law_group', 'zákonných skupinách')] $CITIZENSHIP_GC_LINK$ a $CHURCH_AND_STATE_GC_LINK$ platných v [Concept('concept_country','zemích')], kde [Concept('concept_pop', 'populace')|l] žije.\n\nZměny v [Concept('concept_acceptance','přijetí')|l')] nejsou vždy okamžité; [Concept('concept_pop', 'populace')|l] z určité [Concept('concept_cultural_community', 'kulturní komunity')] mohou mít odlišné [Concept('concept_acceptance','přijetí')|l] v dôsledku nedávnych změn [Concept('concept_law','zákona')] nebo [Concept('concept_migration','imigrace')|l]." # todo: CONCEPT CASE
 concept_acceptance_status: "Status přijetí"
 concept_acceptance_statuses: "Statusy přijetí"
 concept_acceptance_status_short: "Status"
 concept_accepted_status_short: "Přijatý"
 concept_acceptance_status_desc: "Status přijetí [Concept('concept_pop','Populace')|l] určuje, jak je přijímána nebo diskriminována v [Concept('concept_country','zemích')].\n\nStatus pro [Concept('concept_pop','populace')] se určuje podle hodnoty její [Concept('concept_acceptance','přijetí')|l].\n\nPřesné účinky pro určitý [Concept('concept_acceptance_status','status přijetí')|l] jsou určeny [Concept('concept_law', 'zákonama')] v [Concept('concept_country','zemích')].\n\nMožné [Concept('concept_acceptance_status','statusu přijetí')|l] jsou od nejnižšího po nejvyšší následovné:\n$EFFECT_LIST_BULLET$$VIOLENT_HOSTILITY_GC_LINK$\n$EFFECT_LIST_BULLET$$CULTURAL_ERASURE_GC_LINK$\n$EFFECT_LIST_BULLET$$OPEN_PREJUDICE_GC_LINK$\n$EFFECT_LIST_BULLET$$SECOND_RATE_CITIZEN_GC_LINK$\n$EFFECT_LIST_BULLET$$FULL_ACCEPTANCE_GC_LINK$" # todo: CONCEPT CASE
 concept_national_awakening: "Národní obrození"
 concept_national_awakening_desc: "[Concept('concept_culture','Kultura')], která dosáhne [GetDefine('NPops','CULTURAL_FERVOR_NATIONAL_AWAKENING_THRESHOLD')|0v] [Concept('concept_fervor','horlivost')], má šanci zahájit $concept_national_awakening$. Kultury s aktivním národním obrozením získají další $concept_fervor$, dokud je aktivní, a [Concept('concept_political_movement','politická hnutí')] s touto kulturou budou mít větší přitažlivost pro [Concept('concept_pop','populace')]." # todo: CONCEPT CASE
 concept_ideological_incoherence: "Ideologická neslučitelnost"
 concept_ideological_incoherence_desc: "[Concept('concept_legitimacy','Legitimita')] [Concept('concept_government','země')] je snížena, pokud [Concept('concept_interest_group','zájmové skupiny')|l] [Concept('concept_in_government','ve vládě')|l] zastávají [Concept('concept_ideology','ideologie')|l], které se neshodují s aktuálními [Concept('concept_law','zákony')|l] v [Concept('concept_government','zemi')]." # todo: CONCEPT CASE
 concept_market_capital: "Hlavní centrum trhu"
 concept_market_capitals: "Hlavní centra trhu"
 concept_market_capital_short: "Hlavní centrum"
 concept_market_capital_desc: "[Concept('concept_state','Stát')], který slouží jako uzel pro [Concept('concept_market','trh')|l], ke kterému musí všechna ostatní státy v trhu být připojena, jinak se stanou [Concept('concept_isolated_state','izolovaným státním regionem')]. [Concept('concept_trade','Obchod')] se [Concept('concept_world_market','světovým trhem')] je často, ale ne vždy, spravován z hlavního centra trhu. Hlavní centrum trhu je často stejný [Concept('concept_state','stát')|l] jako [Concept('concept_capital_state','hlavní město')|l] [Concept('concept_market_owner','majitele trhu')], ovšem je možné tyto dva také oddělit.[AddLocalizationIf(GetPlayer.IsValid,'concept_market_capital_desc_added')] " # todo: CONCEPT CASE
 concept_market_capital_desc_added: "\nNásledující účinky se uplatňují:\n[GetStaticModifier('market_capital_state').GetDesc]"
 concept_ownership_share: "Podíl na vlastnictví"
 concept_ownership_shares: "Podíly na vlastnictví"
 concept_ownership_share_desc: "Určuje, jak je rozdělen [Concept('concept_building_balance','zisk')|l] těch [Concept('concept_building_level','úrovně budovy')], které jsou [Concept('concept_privately_owned','soukromě vlastněny')] jejich [Concept('concept_workforce','pracovníky')]. [Concept('concept_dividends','Dividendy')] jsou vypláceny každé [Concept('concept_pop','populaci')] jako [Concept('concept_pop_income','příjem')], v závislosti na velikosti jejich podílu v porovnání s ostatními členy pracovní síly. Populace se zároveň považuje za vlastníka odpovídajícího podílu aktuálních [Concept('concept_cash_reserves','hotovostních rezerv')] [Concept('concept_building','budov')]. $ARISTOCRATS_GC_LINK$ a $CAPITALISTS_GC_LINK$ to mají jako hlavní zdroj příjmu, protože se považují za součást pracovních sil v budovách $MANOR_HOUSES_GC_LINK$ a $FINANCIAL_DISTRICTS_GC_LINK$." # todo: CONCEPT CASE
 concept_market_share: "Tržní podíl"
 concept_market_shares: "Tržní podíly"
 concept_market_share_desc: "Tržní podíl každé [Concept('concept_country','země')|l] na [Concept('concept_market','trh')] určuje její [Concept('concept_gdp','HDP')], s bonusem, pokud jsou [Concept('concept_market_owner','majitelem trhu')]. Čím vyšší [Concept('concept_market_share','tržní podíl')|l], tím více [Concept('concept_consumption_tax','spotřební daně')|l] vybírají na [Concept('concept_market','trh')]." # todo: CONCEPT CASE
 concept_default: "Platební neschopnost"
 concept_default_desc: "Jakmile se v [Concept('concept_treasury','státní pokladně')] nahromadí [Concept('concept_loans','půjčkách')|l], které jsou dost velké, aby překročily celkový [Concept('concept_credit','kredit')|l] [Concept('concept_country','země')|l], je [Concept('concept_country','země')|l] považována za zemi v platební neschopnosti. To pozastaví veškerů probíhající [Concept('concept_construction','výstavbu')] a negativně ovlivní [Concept('concept_throughput','efektivitu')] [Concept('concept_building','budov')], což se v průběhu času stává stále závažnějším. Penalizace budou odstraněny hned, jak se týdenní zůstatek [Concept('concept_country','země')|l] opět stane kladným, nebo pokud je vyhlášen [Concept('concept_bankruptcy','bankrot')|l]." # todo: CONCEPT CASE
 concept_decision: "Rozhodnutí"
 concept_decisions: "Rozhodnutí"
 concept_decision_desc: "Velké projekty, které může národ podniknout, se zobrazí jako #v $concept_decisions$#!, včetně expedic po celém světě a výstavby umělých kanálů.\n\nRozhodnutí lze nalézt pod [Concept('concept_journal_entry','záznamem v deníku')] v #v Deníku#!." # todo: CONCEPT CASE
 concept_bankruptcy: "Bankrot"
 concept_bankruptcy_desc: "Pokud je [Concept('concept_country','země')|l] v [Concept('concept_default', 'platební neschopnosti')] a není schopna splatit své [Concept('concept_loans','půjčky')|l], může se rozhodnout vyhlásit bankrot. To vymaže dluh, ale zničí všechny [Concept('concept_cash_reserves','hotovostní rezervy')|l], které si [Concept('concept_country','zemím')|l] půjčila, a velmi rozzuří jakúkoliv [Concept('concept_pop','populaci')], která [Concept('concept_privately_owned','soukromně vlastnila')] [Concept('concept_building','budovy')|l].[AddLocalizationIf(GetPlayer.IsValid,'concept_bankruptcy_desc_added')]" # todo: CONCEPT CASE
 concept_bankruptcy_desc_added: "\n\nKromě toho se na vás uplatní následující efekty po #v [GetDefine('NEconomy','DECLARE_BANKRUPTCY_PENALTY_DURATION_YEARS')|0] let#!:\n[GetStaticModifier('declared_bankruptcy').GetDesc]"
 concept_market_owner: "Majitel trhu"
 concept_market_owners: "Majitelé trhu"
 concept_market_owner_possessive: "Majitel trhu"
 concept_market_owner_desc: "Majitel trhu [Concept('concept_country','zemím')|l], buď proto, že je jediným účastníkem, nebo je [Concept('concept_senior_partner','hlavní partner')|l] v [Concept('concept_customs_union','celní unii')]. Pouze majitel trhu může podeposovat [Concept('concept_trade_privilege','obchodní privilegia')|l] a uvalovat [Concept('concept_embargo','embarga')]." # todo: CONCEPT CASE
 concept_embargo: "Embargo"
 concept_embargoed: "Embargované"
 concept_embargoes: "Embarga"
 concept_embargoing: "Embargování"
 concept_embargo_desc: "[Concept('concept_ongoing_diplomatic_action','Probíhající diplomatická akce')], kterou jedna [Concept('concept_country','země')|l] uvalí na jinou,  a která snižuje [Concept('concept_trade_advantage','obchodní výhodu')] cílové země při vývozu [Concept('concept_good','zboží')|l] do země uvalující embargo prostřednictvím [Concept('concept_world_market','světového trhu')]. Země, které jsou ve [Concept('concept_war','válce')], na sebe automaticky uvalují embargo." # todo: CONCEPT CASE
 concept_encourage_consumption: "Podpora spotřeby"
 concept_encouraging_consumption: "Podporovat spotřebu"
 concept_encourage_consumption_desc: "Podporovat spotřebu [Concept('concept_good','zboží')|l] zvýší tendenci [Concept('concept_pop','populace')|l] ho nakupovat jako součást jejich [Concept('concept_pop_needs','potřeb')|l], a bude preferováno před [Concept('concept_goods_substitution','nahrážkama')]. Podporovat spotřebu stojí [Concept('concept_authority','autoritu')]." # todo: CONCEPT CASE
 concept_discourage_consumption: "Odrazování od spotřeby"
 concept_discouraging_consumption: "Odrazení od spotřeby"
 concept_discourage_consumption_desc: "Odrazování od spotřeby [Concept('concept_good','zboží')|l] sníží tendenci [Concept('concept_pop','populace')|l] ho nakupovat jako součást jejich [Concept('concept_pop_needs','potřeb')] a bude místo toho preferovat [Concept('concept_goods_substitution','náhražky')|l]. Odrazení od spotřeby stojí [Concept('concept_authority','autoritu')]." # todo: CONCEPT CASE
 concept_consumption_tax: "Spotřební daň"
 concept_consumption_taxes: "Spotřební daně"
 concept_consumption_tax_desc: "[Concept('concept_taxes','Daně')] vybíraná za specifické [Concept('concept_good','zboží')|l] zakoupené [Concept('concept_pop','populace')] k uspokojení jejich [Concept('concept_pop_needs','potřeb')]. Každé zboží podléhající spotřební dani stojí určitou částku [Concept('concept_authority','autoritu')]. Když se aplikuje na zboží, jeho [Concept('concept_market_price','tržní cenu')|l] vzrůstá podle sazby spotřební daně při prodeji populace s tím, že všechny [Concept('concept_buy_orders','nákupní objednávky')|l] generované tímto způsobem vedou k vybrání poplatků do [Concept('concept_treasury','státní pokladny')]. Vzhledem k tomu, že poplatek je uplatněn na úrovni [Concept('concept_market','trhu')], daň je neúčinná ve [Concept('concept_state','státě')] s nízkým [Concept('concept_market_access','přístupem na trh')]." # todo: CONCEPT CASE
 concept_loyalist: "Loajalista"
 concept_loyal: "Loajální"
 concept_loyalists: "Loajalisté"
 concept_loyalism: "Loajalismus"
 concept_loyalist_desc: "Loajalisté jsou [Concept('concept_individual','jednotlivci')|l] v rámci [Concept('concept_pop','populací')|l], kteří jsou spokojeni se stavem své [Concept('concept_country','zemí')|l] a jsou ochotni ji bránit proti odpůrcům – slovně i násilím, pokud je to nutné. [Concept('concept_approval','Spokojenost')] [Concept('concept_interest_group','Zájmová skupina')], které podporují populace loajalistů, se zvyšuje\n\nLoajalisté vznikají, kdykoli se zvýší [Concept('concept_sol','životním standardem')|l] populace, nebo v důsledku rozhodnutí během speciálních událostí.\n\nOpakem loajalisty je [Concept('concept_radical','radikálu')|l]. Pokud by měl být v populaci vytvořen radikál, ale v ní už existují loajalisté, jeden z těchto loajalistů se místo toho stane [Concept('concept_neutral','neutrálního')]." # todo: CONCEPT CASE
 concept_radical: "Radikál"
 concept_radicals: "Radikálové"
 concept_radicalism: "Radikalismus"
 concept_radicalize: "Radikalizovat"
 concept_radicalized: "Radikalizovaný"
 concept_radicalization: "Radikalizace"
 concept_radical_desc: "Radikální [Concept('concept_individual','jednotlivci')|l] v rámci [Concept('concept_pop','populací')|l] jsou zklamaní stavem své [Concept('concept_country','zemí')|l]. Přítomnost radikálů v [Concept('concept_state','státě')] přispívá k [Concept('concept_turmoil','nepokojům')] a radikalismus populace ovlivňuje [Concept('concept_activism','aktivismu hnutí')|l]. [Concept('concept_approval','Spokojenost')] [Concept('concept_interest_group','Zájmová skupina')] které podporují populace radikálů, bude také ovlivněna.\n\nRadikálové vznikají, když [Concept('concept_sol','životního standardu')|l] populace klesne pod jejich [Concept('concept_expected_sol','očekávaného minimálního životního standardu')|l], při poklesu [Concept('concept_sol','životního standardu')|l] populace a v důsledku rozhodnutí během speciálních událostí. Populace trpící nízkým [Concept('concept_acceptance_status','statusu přijetí')] tyto negativní efekty ještě zhoršují. Radikálové se také tvoří mezi populacemi, které podporují politická hnutí s nesplněnými požadavky, a když jsou populace propuštěny z [Concept('concept_workforce','pracovní síly')] [Concept('concept_building','budovy')|l] (zejména pokud měly velký [Concept('concept_ownership_share','podílu na vlastnictví')|l]).\n\nOpakem radikálů je [Concept('concept_loyalist','loajalisty')|l]. Pokud by měl být v populaci vytvořen loajalista, ale v ní už existují radikálové, jeden z těchto radikálů se místo toho stane [Concept('concept_neutral','neutrálního')]." # todo: CONCEPT CASE
 concept_neutral: "Neutrální"
 concept_neutrals: "Neutrální"
 concept_neutral_desc: "Neutrální [Concept('concept_individual','Jednotlivec')|l] uvnitř [Concept('concept_pop','populace')|l] nejsou ani [Concept('concept_radical','radikálové')] ani [Concept('concept_loyalist','loajální')|l] k jejich [Concept('concept_country','zemi')]. Nicméně, jsou jen jeden negativní nebo pozitivní krok od toho, aby se stali radikály nebo loajalisty.\n\nKdykoli bude vytvořen radikál v [Concept('concept_pop','populacích')], která již má loajalisty, místo toho se jeden loajalista stane neutrálním. Všichni jednotlivci v [Concept('concept_pop','populacích')] musí být buď neutrální nebo již radikály, aby se mohl vytvořit nový radikál. A naopak, když by byl vytvořen loajalista" # todo: CONCEPT CASE
 concept_rivalry: "Rivalita"
 concept_rivals: "Rivalové"
 concept_rival: "Rival"
 concept_rivalries: "Rivality"
 concept_rivaling: "Rivalizace"
 concept_rivalry_desc: "[Concept('concept_diplomatic_pact','Diplomatický pakt')|l] vyhlášen jednou [Concept('concept_country','zemí')] proti jiné s podobnou [Concept('concept_rank','hodností')], která generuje @inf! [Concept('concept_influence','vliv')|l] pro [Concept('concept_country','země')], jenž rivalitu vyhlásila. Aby se mohli stál země rivaly, musí mít překrývající se [Concept('concept_interest','zájmem')|l]. Pakt také omezí typ [Concept('concept_relations','vztahů')], které mezi těmito dvěma zeměmi mohou po dobu jejího trvání vzniknout." # todo: CONCEPT CASE
 concept_colonial_growth: "Koloniální růst"
 concept_colonial_growth_desc: "Měření toho, jak rychle může [Concept('concept_country','země')|l] posunout hranici [Concept('concept_colony','koloniálního')|l] vpřed. Koloniální růst se generuje z [Concept('concept_institution','institucí')|l] [SelectLocalization(GetPlayer.IsValid,'concept_colonial_growth_ingame_added_2','Instituce Koloniální záležitosti')] v kombinaci s celkovou [Concept('concept_pop','populací')] v [Concept('concept_incorporated_state','začleněném státě')]. Celkové množství vygenerovaného koloniálního růstu se rozděluje mezi všechny kolonie, které [Concept('concept_country','země')|l] aktivně rozvíjí, až do maxima. [AddLocalizationIf(GetPlayer.IsValid,'concept_colonial_growth_ingame_added')]" # todo: CONCEPT CASE
 concept_colonial_growth_ingame_added: "\n\n[GetPlayer.GetColonialGrowthDetails]"
 concept_colonial_growth_ingame_added_2: "[GetInstitutionType('institution_colonial_affairs').GetName]"
 concept_colony: "Kolonie"
 concept_colonies: "Kolonie"
 concept_colonize: "Kolonizovat"
 concept_colonial: "Koloniální"
 concept_colonized: "Kolonizováno"
 concept_colonizes: "Kolonizuje"
 concept_colonizing: "Kolonizace"
 concept_colonization: "Kolonizace"
 concept_colony_desc: "Osídlovací úsilí, započaté kolonizující [Concept('concept_country','zemí')] na území [Concept('concept_decentralized_nation','decentralizovaný národ')]. Potenciální kolonizátor musí mít [Concept('concept_institution','instituce')|l] [SelectLocalization(GetPlayer.IsValid,'concept_colony_desc_added','Institution Colonial Affairs')] a aktivní [Concept('concept_interest','zájem')|l] v [Concept('concept_strategic_region','strategickém regionu')]. Nejprve bude obsazena jedna [Concept('concept_province','provincie')|l]. Sousední provincie budou kolonizovány rychlostí závislou na [Concept('concept_colonial_growth','koloniální růst')] [Concept('concept_country','země')|l], což povede k vytváření [Concept('concept_tension','napětí')|l]." # todo: CONCEPT CASE
 concept_colony_desc_added: "[GetInstitutionType('institution_colonial_affairs').GetName]"
 concept_escalation: "Eskalace"
 concept_escalate: "Eskalovat"
 concept_escalating: "eskalující"
 concept_escalates: "Eskalovat"
 concept_escalation_desc: "Jakmile byla zahájena [Concept('concept_diplomatic_play','diplomatická hra')|l], postupně se eskaluje skrze tři odlišné fáze: [Concept('concept_opening_moves','počáteční kroky')], [Concept('concept_diplomatic_maneuvers','diplomatické manévry')] a [Concept('concept_countdown_to_war','odpočet do války')]. Fáze omezují, jaké akce jsou účastníkům dostupné. Pokud se hra nevyřeší před tím, než eskalace dosáhne až na úroveň $concept_countdown_to_war$, vypukne [Concept('concept_war','válka')|l]." # todo: CONCEPT CASE
 concept_revenue: "Příjmy"
 concept_revenue_desc: "Poté, co [Concept('concept_building','budovu')|l] [Concept('concept_good_production','vyprodukuje')] [Concept('concept_good','zboží')|l], jsou prodávány za [Concept('concept_local_price','místní cenu')]. Množství [Concept('concept_money','peníze')] získané z prodeje tvoří příjmy budovy, tedy kladnou složku její [Concept('concept_building_balance','bilance')|l]." # todo: CONCEPT CASE
 concept_combat_width: "Šířka bojiště"
 concept_combat_width_desc: "Šířka bojiště pro určitý typ [Concept('concept_terrain','terénu')] určuje možnou početní výhodu silnejší strany vůči slabší straně v [Concept('concept_battle','bitvě')]. Slabší strana může déle odolávat silnější, pokud je šířka bojiště relativně malá, a naopak." # todo: CONCEPT CASE
 concept_infamy: "Infamia"
 concept_infamy_desc: "#italic Infamia označovala v římském právu bezectnost, újmu na občanské cti a vážnosti.#!\n\nInfamia odráží míru, do jaké mezinárodní společenství, zejména vládnoucí [Concept('concept_great_power','velmoci')|l], vás považují za hrozbu, kterou je potřeba zastavit vzhledem k vašim minulým činem. Je získávána především způsobováním [Concept('concept_diplomatic_incident','diplomatickým incidentem')] a uplatňováním [Concept('concept_war_goal','válečným cílem')] v [Concept('concept_peace_deal','mírové smlouvě')]. Vaše $concept_infamy$ ovlivňuje [Concept('concept_attitude','postoj')|l] zemí vůči vám a zvyšuje náklady na [Concept('concept_influence','vliv')|l] u [Concept('concept_diplomatic_pact','diplomatického paktu')]. Pokud dosáhne úrovně #b $infamy_pariah$#!, velmoci budou schopny zahájit proti vám [Concept('concept_diplomatic_play','diplomatické hře')] [GetDiplomaticPlayType('dp_contain_threat').GetName]." # todo: CONCEPT CASE
 concept_diplomatic_incident: "Diplomatický incident"
 concept_diplomatic_incident_short: "Incident"
 concept_diplomatic_incidents: "Diplomatické incidenty"
 concept_diplomatic_incident_desc: "Diplomatický incident je obvykle způsoben [Concept('concept_country','zemí')], která zahájila [Concept('concept_diplomatic_play','diplomatickou hru')]. Diplomatické incidenty generují [Concept('concept_infamy','infamii')] pro zemi, která je zahájila, a způsobí, že [Concept('concept_relations','vztahy')|l] klesnou se všemi zeměmi se [Concept('concept_interest','zájmem')] ve [Concept('concept_strategic_region','strategickém regionu')], zejména s cílem diplomatické hry. Diplomatické incidenty mohou být také výsledkem jiných akcí, například rozhodnutí přijatých během zvláštních událostí." # todo: CONCEPT CASE
 concept_tension: "Napětí"
 concept_tensions: "Napětí"
 concept_tension_desc: "Jak napjatý je vztah mezi [Concept('concept_colony','kolonizující')] [Concept('concept_country','zeměmi')] a blízkými [Concept('concept_decentralized_nation','decentralizovaným národem')]. Napětí se všemi blízkými decentralizovanými národy roste vždy, když je převzata [Concept('concept_province','provincie')|l], a v průběhu času klesají, pokud není zabraná žádná nová půda.\n\nPokud úroveň napětí vzroste na úroveň #b $tension_volatile$#!, pokračující kolonizace může vyvolat [Concept('concept_native_uprising','domorodé povstání')|l]." # todo: CONCEPT CASE
 concept_relations: "Vztahy"
 concept_relations_desc: "Vzájemné hodnocení diplomatického postoje mezi dvěma [Concept('concept_country','zemím')], měnící se od [GetDefine('NDiplomacy','MIN_RELATIONS')|+=] po [GetDefine('NDiplomacy','MAX_RELATIONS')|+=].\n\nObě strany mohou ovlivnit vztahy tím, že utratí [Concept('concept_influence','vliv')|l] za [Concept('concept_diplomatic_action','diplomatickou akci')|l] [GetDiplomaticActionType('increase_relations').GetName], [GetDiplomaticActionType('damage_relations').GetName], a [GetDiplomaticActionType('expel_diplomats').GetName] \n\nVztahy ovlivňují, které diplomatické akce a [Concept('concept_diplomatic_pact','pakty')] jsou dostupné pro dvě země, a také ovlivňuje pravděpodobnost, že přijmou diplomatické iniciativy nebo se postaví na vaši stranu v průběhu [Concept('concept_diplomatic_play','diplomatické hry')]." # todo: CONCEPT CASE
 concept_ai_strategy: "Strategie"
 concept_ai_strategies: "Strategie"
 concept_ai_strategy_desc: "[Concept('concept_country','Země')] řízené AI mají soubor tří strategií v oblastech odpovídajících [Concept('concept_capacity','kapacit')], které řídí jejich krátkodobé a dlouhodobé cíle, a jak postupují při rozhodování o ostatních zemích. Jaké strategie jsou vybrány, ovlivňuje celá řada faktorů, jako je velikost [Concept('concept_country','země')|l] a její [Concept('concept_rank','hodnost')|l], stejně jako současná [Concept('concept_government','vláda')|l]." # todo: CONCEPT CASE
 concept_strategic_desire: "Strategická priorita"
 concept_strategic_desire_desc: "AI řízené [Concept('concept_country','země')|l] budou mít strategické priority vůči zemím, které považují za geopoliticky relevantní. Jejich strategická priorita představuje jejich celkové diplomatické ambice vůči dané zemi a je nejdůležitějším faktorem při určování jejich [Concept('concept_attitude','postoje')]." # todo: CONCEPT CASE
 concept_attitude: "Postoj"
 concept_attitude_desc: "Ukazatel toho, jak k vám přistupuje jiná [Concept('concept_country','země')|l].\n\nPostoj ovlivňuje, jaké typy akcí je země pravděpodobně ochotna vůči vám podniknout a jakou roli hrajete v jejích plánech.\n\nPostoj se může změnit vždy, když dojde k [Concept('concept_diplomatic_catalyst','diplomatickému katalyzátoru')], a je založen na:\n$EFFECT_LIST_BULLET$[Concept('concept_relations','Vztahy')]\n$EFFECT_LIST_BULLET$[Concept('concept_infamy','Infamia')]\n$EFFECT_LIST_BULLET$[Concept('concept_strategic_desire','Strategická priorita')]\n$EFFECT_LIST_BULLET$Velikosti vaší armády\n$EFFECT_LIST_BULLET$S jakými zeměmi máte uzavřené [Concept('concept_diplomatic_pact','diplomatického paktu')]" # todo: CONCEPT CASE
 concept_instant_diplomatic_action: "Okamžitá diplomatická akce"
 concept_instant_diplomatic_actions: "Okamžité diplomatické akce"
 concept_instant_diplomatic_action_desc: "Akce s okamžitým účinkem na zapojené [Concept('concept_country','země')|l]. Obvykle vyžadují určitou podmínku, která musí být splněna, aby byly vykonány, ale nestojí žádny [Concept('concept_influence','vliv')|l]." # todo: CONCEPT CASE
 concept_ongoing_diplomatic_action: "Probíhající diplomatická akce"
 concept_ongoing_diplomatic_actions: "Probíhající diplomatické akce"
 concept_ongoing_diplomatic_action_desc: "Typ [Concept('concept_diplomatic_pact','diplomatického paktu')], který může být zahájen i ukončen podle libosti, bez potřeby schválení a nákladů pro cílovou [Concept('concept_country','zemi')]."
 concept_diplomatic_pact: "Diplomatický pakt"
 concept_diplomatic_pacts: "Diplomatické pakty"
 concept_diplomatic_pact_short: "Pakt"
 concept_diplomatic_pacts_short: "Pakty"
 concept_diplomatic_pact_desc: "Jednostranné nebo oboustranné porozumění mezi dvěma [Concept('concept_country','zemím')]. Mohou mít udržovací náklady za [Concept('concept_influence','vliv')|l] pro jednu nebo obě strany a mohou mít širokou škálu dopadů včetně vztahů se [Concept('concept_subject','závislou zemí')]. Pakty se mohou z různých důvodů rozpadnout - například pokud se [Concept('concept_relations','vztahy')] příliš vychýlí na jednu či druhou stranu, pokud je jedna ze stran výslovně poruší, nebo pokud vyprší jejich časové omezení." # todo: CONCEPT CASE
 concept_truce: "Příměří"
 concept_truces: "Příměří"
 concept_truce_desc: "Příměří je diplomatický stav, kdy je jedné [Concept('concept_country','zemím')] zakázáno činit [Concept('concept_diplomatic_demand','diplomatické požadavky')] nebo se připojit k ofenzivní [Concept('concept_diplomatic_play','diplomatické hře')] proti jiné zemi. Příměří mohou být jednostranné nebo vzájemné, a jsou vytvořeny různými způsoby, například když je podepsána [Concept('concept_peace_deal','mírová smlouva')|l] nebo je zrušena [Concept('concept_alliance','aliance')|l]." # todo: CONCEPT CASE
 concept_war_reparations: "Váleční reparace"
 concept_war_reparations_desc: "Sekundárny [Concept('concept_war_goal','válečný cíl')|l], který může být připojen k [Concept('concept_diplomatic_play','diplomatické hře')] výběrem konkrétního [Concept('concept_article','článku')], jenž jej doprovází, a poté uplatněn v rámci [Concept('concept_peace_deal','mírové smlouvy')]. Pokud jsou válečné reparace prosazeny, vznikne nové [Concept('concept_treaty','smlouvy')|l], která bude obsahovat všechny [Concept('concept_article','články')|l] jež druhá [Concept('concept_country','zemí')|l] označila jako součást válečných reparací, přičemž minimální závazné období této smlouvy bude trvat po dobu platnosti [Concept('concept_truce','příměří')|l]." # todo: CONCEPT CASE
 concept_colonization_rights: "Práva na kolonizaci"
 concept_colonization_rights_desc: "[Concept('concept_diplomatic_pact','Diplomatický pakt')], který vznikl, když bylo [Concept('concept_native_uprising','domorodé povstání')|l] [Concept('concept_decentralized_nation','decentralizovaného národa')] poraženo. Zvyšuje rychlost, jakou země s udělenými právami na kolonizaci kolonizuje jejich území, a má trvaní po dobu priměří." # todo: CONCEPT CASE
 concept_foreign_investment: "Zahraniční investice"
 concept_foreign_investments: "Zahraniční investice"
 concept_foreign_investment_desc: "[Concept('concept_country','Země')], která staví a vlastní [Concept('concept_building_level','úroveň budovy')|l] na území jiné země.\n\nZahraniční investice mohou být prováděny [Concept('concept_overlord','vládcem')] na území jeho [Concept('concept_subject','závislou zemi')], nebo mezi dvěma suverénními zeměmi na základě podepsání [Concept('concept_treaty','smlouvy')] o [Concept('concept_foreign_investment_rights','práva na zahraniční investice')].\n\nJak [Concept('concept_government_construction','vládní')], tak [Concept('concept_private_construction','soukromá výstavba')|l] je umožněna prostřednictvím zahraničních investic.\n\nZatímco zahraniční vlastník financuje výstavbu a získává [Concept('concept_dividends','dividendy')|l], [Concept('concept_workforce','pracovní síla')|l] pochází z místního státu [Concept('concept_state','státu')] a [Concept('concept_taxes','daně')|l] jsou odváděny zemi, která tento stát ovládá. Jakékoli [Concept('concept_good','zboží')|l] použité v [Concept('concept_building','budově')] zůstává na místním [Concept('concept_market','trhu')]." # todo: CONCEPT CASE
 concept_foreign_investment_rights: "Práva na zahraniční investice"
 concept_foreign_investment_rights_short: "Práva na investice"
 concept_foreign_investment_rights_desc: "Povoluje jedné [Concept('concept_country','zemím')] provádět [Concept('concept_foreign_investment','zahraniční investice')|l] v jiné po dobu trvání paktu." # todo: CONCEPT CASE
 concept_exiled_army: "Exilová armáda"
 concept_exiled_armies: "Exilové armády"
 concept_exiled_army_short: "Exilová"
 concept_exiled_army_exile: "Exil"
 concept_exiled_army_desc: "[Concept('concept_army','Armáda')] se považují za exilové, pokud jejich [Concept('concept_front','fronta')|l] nemůže být dosažena a nenajdou žádnou platnou alternativu. Tohle může nastat například při úplném obklíčení. Exilová armáda se přesunou k nejbližšímu [Concept('concept_hq_long','velitelství')|l], pokud ji nebude možné poslat na jinou frontu anebo obdržet jiné [Concept('concept_order','rozkazy')|l]. Mezitím armáda trpí [Concept('concept_attrition','opotřebením')]." # todo: CONCEPT CASE
 concept_military_access: "Vojenský přístup"
 concept_military_access_desc: "Vojenský přístup umožňuje napadnou nepřítele přez území jiných neutrálnich [Concept('concept_country','zemí')]. Zabezpečuje se vytvořením [Concept('concept_ongoing_diplomatic_action','probíhající diplomatickou akcí')] s neutrální zemí." # todo: CONCEPT CASE
 concept_military_assistance: "Vojenská pomoc"
 concept_military_assistance_desc: "Jakákoli [Concept('concept_ongoing_diplomatic_action','probíhající diplomatická akce')|l] zřízená jednou [Concept('concept_country','zemí')], cílená na jinou, kde první země zlepšuje bojovou schopnost [Concept('concept_military_formation','formace')|l] té druhé." # todo: CONCEPT CASE
 concept_social_hierarchy: "Sociální hierarchie"
 concept_social_hierarchies: "Sociální hierarchie"
 concept_social_hierarchy_possessive: "Sociální hierarchie"
 concept_social_hierarchy_short: "Hierarchie"
 concept_social_hierarchy_desc: "Sociální hierarchie se skládá ze dvou nebo více [Concept('concept_social_class','sociálních tříd')]. Všechny [Concept('concept_pop','populace')|l] spadají do určité sociální hierarchie.\n\nKaždá [Concept('concept_pop','populace')|l], na kterou se nevztahuje specifická [Concept('concept_social_hierarchy','sociální hierarchie')|l] dané země, je automaticky zařazena do základní hierarchie podle [Concept('concept_profession','profese')|l] – konkrétně do [Concept('concept_lower_strata','nižší třídy')], [Concept('concept_middle_strata','střední třídy')], nebo [Concept('concept_upper_strata','vyšší třídy')], což odpovídá nižší vrstvě, střední vrstvě a vyšší vrstvě společnosti.\n\nSociální třídy v rámci specifických sociálních hierarchií jednotlivých zemí mohou být určovány faktory, jako je [Concept('concept_profession','profese')|l], [Concept('concept_culture','kultury')|l] a [Concept('concept_religion','náboženství')|l]." # todo: CONCEPT CASE
 concept_social_class: "Sociální třída"
 concept_social_classes: "Sociální třídy"
 concept_social_class_short: "Třída"
 concept_social_class_possessive: "Sociální třídy"
 concept_social_class_desc: "Každá [Concept('concept_pop','populace')|l] patří do sociální třídy, a každá sociální třída patří do [Concept('concept_lower_strata','nižší třídy')], [Concept('concept_middle_strata','střední třídy')], nebo [Concept('concept_upper_strata','vyšší třídy')]. Sociální třída [Concept('concept_pop','populace')|l] je určena [Concept('concept_social_hierarchy','sociální hierarchií')] v [Concept('concept_country','zemích')]." # todo: CONCEPT CASE
 concept_open_market: "Otevření trhu"
 concept_open_market_short: "Otevřený"
 concept_open_market_desc: "A [Concept('concept_war_goal','válečný cíl')] který lze požadovat v [Concept('concept_diplomatic_play','diplomatické hře')] nebo jako součást [Concept('concept_peace_deal','mírovou smlouvu')]. [Concept('concept_country','Země')], který je nucen $concept_open_market_short$ svůj [Concept('concept_market','trh')], okamžitě změní svou [SelectLocalization(GetPlayer.IsValid,'concept_open_market_desc_added','Trade Policy')] na [SelectLocalization(GetPlayer.IsValid,'concept_open_market_desc_added_2','Free Trade')] a nebude ji moci změnit po dobu #v [GetDefine('NDiplomacy','WAR_GOAL_OPEN_MARKET_MONTHS')|0] měsíců#!. [ConcatIfNeitherEmpty('\n\n', AddLocalizationIf(GetPlayer.IsValid,'concept_open_market_desc_added_3'))]" # todo: CONCEPT CASE
 concept_open_market_desc_added: "[GetLawGroup('lawgroup_trade_policy').GetName]"
 concept_open_market_desc_added_2: "[GetLawType('law_free_trade').GetName]"
 concept_open_market_desc_added_3: "#title Další efekty během těchto [GetDefine('NDiplomacy','WAR_GOAL_OPEN_MARKET_MONTHS')|0] měsíců#!:#!#indent_newline:3\n[GetStaticModifier('forced_market_opening').GetDesc]#!"
 concept_humiliation: "Ponížení"
 concept_humiliated: "Ponížený"
 concept_humiliate: "Ponížit"
 concept_humiliation_desc: "A [Concept('concept_war_goal','válečný cíl')] který lze požadovat v [Concept('concept_diplomatic_play','diplomatické hře')] nebo jako součást [Concept('concept_peace_deal','mírovou smlouvu')]. Ponížený [Concept('concept_country','země')] není schopna zahájit žádné $concept_diplomatic_plays$ vůči zemím, které ji poníženého, po dobu #v [GetDefine('NDiplomacy','WAR_GOAL_HUMILIATION_MONTHS')|0] měsíců#!.[ConcatIfNeitherEmpty('\n\n', AddLocalizationIf(GetPlayer.IsValid, 'concept_humiliation_desc_added'))]" # todo: CONCEPT CASE
 concept_humiliation_desc_added: "#title Další efekty během těchto #v [GetDefine('NDiplomacy','WAR_GOAL_HUMILIATION_MONTHS')|0] měsíců#!:#!#indent_newline:3 \n[GetStaticModifier('country_humiliated').GetDesc]#!"
 concept_customs_union: "Celní unie"
 concept_customs_union_desc: "Vynucená dohoda mezi [Concept('concept_senior_partner','hlavním partnerem')] a jedním nebo více [Concept('concept_junior_partner','mladšími partnery')] o sdílení společného [Concept('concept_market','trh')], pod vedením hlavního partnera. Obvykle je tato dohoda prosazena prostřednictvím [Concept('concept_power_bloc','mocenského bloku')] a jeho [Concept('concept_power_bloc_principle','principů')]. Kromě toho všechny diplomatické dohody se [Concept('concept_subject','závislou zemí')] zároveň fungují jako celní unie." # todo: CONCEPT CASE
 concept_senior_partner: "Hlavní partner"
 concept_senior_partner_desc: "Hlavní partner v [Concept('concept_customs_union','celní unii')] získává kontrolu nad [Concept('concept_market','trhem')|l] svých [Concept('concept_junior_partner','mladším partnerem')]. Zatímco mladší partneri mohou pokračovat v [Concept('concept_trade','obchodování')] s jinými trhy, pouze hlavní partner může uvalovat [Concept('concept_embargo','embarga')|l] a ovládat úrovně [Concept('concept_tariffs','cel')]. Na oplátku hlavní partner sdílí menší část příjmu z cel trhu, zatímco [Concept('concept_building','průmysly')|l] obou [Concept('concept_country','zemí')] těží z členství ve silnějším a vyspělejším trhu." # todo: CONCEPT CASE
 concept_junior_partner: "Mladší partner"
 concept_junior_partners: "Mladší partneři"
 concept_junior_partners_possessive: "mladších partnerů"
 concept_junior_partner_desc: "Mladší partner v [Concept('concept_customs_union','celní unii')] předává kontrolu nad svým [Concept('concept_market','trhem')] hlavnímu partnerovi. Zatímco mladší partner může i nadále [Concept('concept_trade','obchodovat')] s jinými trhy, nemůže vyhlásit [Concept('concept_embargo','embarga')|l] nebo kontrolovat úrovně [Concept('concept_tariffs','cel')]. Na oplátku sbírají minoritní část příjmu z tržních cel a jejich [Concept('concept_building','průmysly')|l] těží z účasti v mocnějším a zralém trhu." # todo: CONCEPT CASE
 concept_regime_change: "Změna režimu"
 concept_regime_change_desc: "Přinutí cíl změnit svou [Concept('concept_government', 'vládu')] na podobnou, jako má vynucovatel, a také ho přinutí okamžitě zavést až #v [GetDefine('NPolitics','NUM_REVOLUTIONARY_LAW_CHANGES')]#! [Concept('concept_law', 'zákonů')] preferovaných novým režimem."
 concept_alliance: "Aliance"
 concept_alliances: "Aliance"
 concept_alliance_desc: "[Concept('concept_article','Článek')] [Concept('concept_treaty','Smlouva')] mezi dvěma [Concept('concept_country','zemím')]. Země, které jsou v alianci, mohou vždy stát na straně toho druhého v [Concept('concept_diplomatic_play','diplomatické hře')] bez ohledu na to, zda druhá strana udržuje [Concept('concept_interest','zájem')|l] v dotčeném [Concept('concept_strategic_region','strategickém regionu')]. Platí to bez ohledu na to, zda je druhá země iniciátorem nebo cílem diplomatické hry." # todo: CONCEPT CASE
 concept_defensive_pact: "Obranný pakt"
 concept_defensive_pacts: "Obranné pakty"
 concept_defensive_pact_desc: "[Concept('concept_article','Článek')] [Concept('concept_treaties','Smlouvy')|l], který představuje omezené [Concept('concept_alliance','spojenectví')] mezi dvěma [Concept('concept_country','zemím')]. Toto spojenectví vstupuje v platnost pouze tehdy, když se jedna z těchto dvou zemí stane [Concept('concept_target','cílem')] [Concept('concept_diplomatic_play','diplomatické hry')]." # todo: CONCEPT CASE
 concept_guarantee_independence: "Zaručit nezávislost"
 concept_guarantee_of_independence: "Záruka nezávislosti"
 concept_guarantee_independence_desc: "[Concept('concept_article','Článek')] [Concept('concept_treaty','Smlouva')] uzavřený jednou  [Concept('concept_country','zemí')], který se vztahuje na jinou zemi, přičemž tato druhá země může v případě, že se ocitne v roli obránce v [Concept('concept_diplomatic_play','diplomatické hře')], povolat tu první na pomoc." # todo: CONCEPT CASE
 concept_ally: "Spojenec"
 concept_allies: "Spojenci"
 concept_allied: "Spřátelený"
 concept_ally_desc: "Spojenec je [Concept('concept_country','země')|l], která má [Concept('concept_alliance','alianci')] nebo [Concept('concept_defensive_pact','obranný pakt')|l] s jiným státem a může být zavolaná na podporu v [Concept('concept_diplomatic_play','diplomatické hře')]. Pro [Concept('concept_initiator','iniciátor')] jsou za [Concept('concept_ally','$spojence')|l] v [Concept('concept_diplomatic_play','diplomatické hře')] považovány pouze [Concept('concept_country','země')|l] s plnohodnotnou [Concept('concept_alliance','aliancí')]." # todo: CONCEPT CASE
 concept_supply: "Zásobování"
 concept_supplies: "Zásoby"
 concept_supply_desc: "Zásobování [Concept('concept_military_formation','formace')|l] určuje, jak rychle [Concept('concept_unit','vojenské jednotky')|l] získavají zpátky svou [Concept('concept_organization','organizaci')|l].\n\n#indent_newline:3 $concept_supply$ je zvyčajne #v 100%#!, ale může být nižší, pokud je armáda:\n- V zámoří a zásobovaná ohroženou [Concept('concept_shipping_lane','námořní trasu')]\n- Obsahuje vojenské jednotky, kterých [Concept('concept_building','budovy')|l] čelí [Concept('concept_shortage','nedostatku vstupního zboží')]\n- Je nulová, pokud je armáda úplně odrezaná od svýho velitelství#!\n\nV některých případech mohou platit i [Concept('concept_modifier','modifikátory')|l]." # todo: CONCEPT CASE
 concept_manpower: "Personál"
 concept_manpower_desc: "Množství [SelectLocalization(GetPlayer.IsValid,'concept_manpower_desc_added','Vojáci')] a [SelectLocalization(GetPlayer.IsValid,'concept_manpower_desc_added_2','Důstojníci')] ve [Concept('concept_unit','vojenské jednotce')]. Čím větší je personál, tím více [Concept('concept_casualties','ztrát')] bude jednotka schopna způsobit - a také utrpět."
 concept_manpower_desc_added: "[GetPopType('soldiers').GetName]"
 concept_manpower_desc_added_2: "[GetPopType('officers').GetName]"
 concept_morale: "Morálka"
 concept_morale_demoralized: "Demoralizováno"
 concept_morale_demoralized_desc: "$concept_morale_desc$"
 concept_morale_desc: "Morálka [Concept('concept_unit','jednotek')] měří, kolik ze zbývajícího [Concept('concept_manpower','personálu')] je připraveno do [Concept('concept_battle','bitvy')]. V každém kole boje část zbývajícího personálu se stane demoralizována po zbytek bitvy a není schopna podniknout útočné akce. Když všechny vojenské jednotky dosáhnou kritického prahu nízké morálky, [Concept('concept_commander','velitel')|l] ustoupí, což znamená vítězství druhé strany.\n\nPo bitvě získají vojenské jednotky svou morálku zpátky stabilním tempem, které závisí na [Concept('concept_supply','zásobování')|l] jejich [Concept('concept_military_formation','formace')|l]." # todo: CONCEPT CASE
 concept_morale_damage: "Poškození morálky"
 concept_morale_damage_desc: "$unit_morale_damage_mult_desc$"
 concept_rank: "Hodnost"
 concept_ranks: "Hodnosti"
 concept_rank_desc: "Hodnost [Concept('concept_country','Země')] se určuje měřením její [Concept('concept_prestige','prestiže')] v porovnání s ostatními zeměmi ve světě. Určuje, jaké mezinárodní aktivity můžete provádět, co od vás očekávají lidé i svět a kde stojíte v globálním žebříčku.[ConcatIfNeitherEmpty('\n', AddLocalizationIf( GetPlayer.IsValid, 'concept_rank_ingame_added' ))]" # todo: CONCEPT CASE
 concept_rank_ingame_added: "#title Vaše současná hodnost [GetPlayer.GetRank] vám dává následující výhody:#!#indent_newline:3 \n[GetPlayer.GetRankModifier.GetDesc]#!"
 concept_migration: "Migrace"
 concept_migration_internal: "Vnitřní migrace"
 concept_weekly_migration: "Týdenní migrace"
 concept_migrating: "Migrace"
 concept_migrate: "Migrace"
 concept_immigration: "Imigrace"
 concept_immigrating: "Imigruje"
 concept_emigrate: "Emigrovat"
 concept_emigration: "Emigrace"
 concept_emigrating: "Emigrující"
 concept_migration_desc: "Pohyb [Concept('concept_pop','populace')|l] mezi [Concept('concept_state','státem')|l]. Obecně, migrace probíhá mezi [Concept('concept_state','státem')|l] ve stejném [Concept('concept_market','trhu')], ale může také probíhat mezi [Concept('concept_country','zeměmi')] v různých trzích v případě [Concept('concept_mass_migration','hromadné migraci')|l].\n\nMigrace probíhá ze států s nižší úrovní [Concept('concept_migration_pull','migrační přitažlivostí')|l] k vyšším, přičemž čím větší je rozdíl, tím více lidí se bude stěhovat. Rychlost migrace je také ovlivněna faktory jako dostupná [Concept('concept_infrastructure','infrastruktura')|l] v státě.\n\nMigrace může probíhat pouze tehdy, pokud je k dispozici populace, která je schopna a ochotna emigrovat. Populace budou o emigraci uvažovat pouze tehdy, pokud jsou dostatečně [Concept('concept_job_satisfaction','nespokojený')|l]. Například pokud jejich [Concept('concept_sol','životní standard')|l] je nižší než průměr v jejich trhu nebo pokud jsou [Concept('concept_unemployed','nezaměstnané')|l].\n\nPopulace, která přijde do státu bez jiné populace stejné [Concept('concept_culture','kultury')], vytvoří [Concept('concept_cultural_community','kulturní komunitu')] a dostane dočasný penalizační efekt na [Concept('concept_acceptance','přijetí')|p]." # todo: CONCEPT CASE
 concept_mass_migration_pull: "Přitažlivost hromadné migrace"
 concept_mass_migration_pull_desc: "Přitažlivost hromadné migrace určité [Concept('concept_country','země')|l] indikuje, jak pravděpodobné je, že přijme [Concept('concept_migration_target','hromadnou migraci')] ve srovnání s dalšími [Concept('concept_country','zeměmi')]. Závisí převážně na průměrném hodnotě [Concept('concept_migration_pull','migrační přitažlivosti')] [Concept('concept_migration_target','vhodných')] [Concept('concept_state','státu')] v [Concept('concept_country','zemích')].\n\nPokud má [Concept('concept_country','země')|l] méně než #b [GetDefine('NPops','MASS_MIGRATION_NUM_TARGET_STATES_FOR_NO_PENALTY')]#! vhodných států, bude dostávat stoupající penalizaci pro přitažlivost hromadnou migrace v závislosti na tom, kolik vhodných států má." # todo: CONCEPT CASE
 concept_mass_migration: "Hromadná migrace"
 concept_mass_migrations: "Hromadné migrace"
 concept_mass_migration_migrating: "Migrování"
 concept_mass_migration_desc: "Hromadná migrace je hromadní přesun [Concept('concept_pop','populace')|l] specifické [Concept('concept_culture','kultury')] mezi dvěma [Concept('concept_country','zemím')]. [Concept('concept_migration_target','Cíl hromadné migrace')] se může objevit, pokud medzi dvěma [Concept('concept_market','trhu')] jestvuje [Concept('concept_trade','obchodní')] spojení a [Concept('concept_cultural_turmoil','kulturní nepokoje')|l] v původní zemi dosáhli minimálně [GetDefine('NPops','MASS_MIGRATION_ORIGIN_MIN_TURMOIL')|v%0]. Země má vyšší pravděpodobnost, že jeden z její států bude vybrán jako cíl migrace, pokud má vysokú hodnotu [Concept('concept_mass_migration_pull','přitažlivost hromadnou migrace')|l]." # todo: CONCEPT CASE
 concept_migration_target: "Cíl migrace"
 concept_mass_migration_target: "Cíl hromadné migrace"
 concept_migration_targets: "Cíle migrace"
 concept_mass_migration_targets: "Cíle hromadné migrace"
 concept_mass_migration_eligible: "Vhodné"
 concept_migration_target_desc: "[Concept('concept_state','Stát')] vybraný jako vhodný cíl pro [Concept('concept_mass_migration','hromadnou migraci')]. Okolní státy mohou také zaznamenat určitou míru imigrace z hromadné migrace.\n\nAby byl stát vhodný pro imigraci, musí být [Concept('concept_incorporated_state','začlenen')|l], mít nejméně #b [GetDefine('NPops','MASS_MIGRATION_TARGET_MIN_ARABLE_LAND')]#! [Concept('concept_arable_land','orní půdy')] a #b [GetDefine('NPops','MASS_MIGRATION_STATE_MIN_MARKET_ACCESS')|0%]#! [Concept('concept_market_access','přístup na trh')|l]. Kromě toho [Concept('concept_state','státu')|l] nesmí být již cílem jiné hromadné migrace, a [Concept('concept_law','zákony')|l] [Concept('concept_country','země')|l] pro skupiny [GetLawGroup('lawgroup_migration').GetName] a [GetLawGroup('lawgroup_citizenship').GetName] musí umožňovat [Concept('concept_migration','migraci')]." # todo: CONCEPT CASE
 concept_base_price: "Základní cena"
 concept_base_price_desc: "Cena [Concept('concept_good','zboží')|l], když jeho [Concept('concept_sell_orders','nabídka')] přesně odpovídá její [Concept('concept_buy_orders','poptávce')]." # todo: CONCEPT CASE
 concept_market_impact: "Tržní dopad"
 concept_market_impact_short: "Dopad"
 concept_market_impacts_short: "Dopady"
 concept_market_impact_desc: "Tržní dopad znamená, kolik vlivu má aktuální bilance [Concept('concept_good','zboží')|l] ([Concept('concept_buy_orders','nákupní objednávky')|l] - [Concept('concept_sell_orders','prodejní objednávky')|l]) na [Concept('concept_market','trh')|l]. Není určena pouze [Concept('concept_market_price','tržní cenou')] zboží (což může být buď levné nebo drahé), ale také zohledňuje objem tohoto zboží, který je na trhu v oběhu, ovlivňující [Concept('concept_pop','populace')|l] a průmysly." # todo: CONCEPT CASE
 concept_capital_state: "Hlavní město"
 concept_capital_state_short: "Hlavní město"
 concept_capital_state_desc: "Sídlo centrální [Concept('concept_government','vláda')] [Concept('concept_country','zemi')]. Ovládání $concept_capital_state_short$ má za války velký význam a [Concept('concept_pop','populace')] žijící tam mají větší míru [Concept('concept_political_strength','politickou sílu')], jíž mohou ovlivňovat politiku.[ConcatIfNeitherEmpty('\n', AddLocalizationIf( GetPlayer.IsValid, 'concept_capital_state_desc_added' ))]" # todo: CONCEPT CASE
 concept_capital_state_desc_added: "[GetStaticModifier('market_capital_state').GetDesc]"
 concept_treaty_port: "Smluvní přístav"
 concept_treaty_ports: "Smluvní přístavy"
 concept_treaty_port_desc: "Přímořský [Concept('concept_split_state','rozdělený stát')|l], který je držen na základě [Concept('concept_treaty','smlouvě')] za účelem otevření [Concept('concept_trade','obchodu')] s jinou [Concept('concept_country','zemí')]. Smluvní přístav je součástí [Concept('concept_market','trhem')] země, která postoupila provinci, a může volně [Concept('concept_trade','obchodovat')] se [Concept('concept_world_market','světovým trhem')].\n\n[Concept('concept_tariffs','Cla')], [Concept('concept_subventions','subvencí')|l] ani [Concept('concept_embargo','embargem')|l] se na smlouvní přístavy nevztahují a jejich vlastník získává [Concept('concept_trade_advantage','obchodní výhodu')] při dovozu [Concept('concept_good','zboží')|l] vyváženého smluvním přístavem (a naopak). Pokud je smlouva, na jejímž základě byl smluvní přístav postoupen, porušena, přístav přestává být smluvním přístavem a stává se běžným [Concept('concept_state','státem')]." # todo: CONCEPT CASE
 concept_treaty: "Smlouva"
 concept_treaties: "Smlouvy"
 concept_treaty_desc: "Smlouva je typ bilaterální dohody mezi dvěma [Concept('concept_country','zemím')] a skládá se z jednotlivých [Concept('concept_article','článků')], které definují práva, povinnosti a náklady @inf![Concept('concept_influence','vlivu')] každé země. Smlouvy zůstávají v platnosti, dokud je některá ze stran neporuší nebo od nich neodstoupí po uplynutí počátečního [Concept('concept_binding_period','závazního období')].\n\nSmlouvy mohou být také [Concept('concept_enforced_treaty','vnucené')] zemi jako důsledek [Concept('concept_war_reparations','válečných reparací')] nebo [Concept('concept_diplomatic_play','diplomatické hry')]." # todo: CONCEPT CASE
 concept_enforced_treaty: "Vynucená smlouva"
 concept_enforced_treaties: "Vynucené smlouvy"
 concept_enforced_treaty_short: "Vynucená"
 concept_enforced_treaty_forced_short: "Nucená"
 concept_enforced_treaty_enforce: "Vynutit smlouvu"
 concept_enforced_treaty_enforce_short: "Vynutit"
 concept_enforced_treaty_desc: "Vynucená smlouva je smlouva vynucená na [Concept('concept_country','země')] po kapitulaci ve [Concept('concept_war','válce')] nebo stažení z [Concept('concept_diplomatic_play','diplomatické hry')]. Některé [Concept('concept_diplomatic_demand','diplomatického požadavku')|l] se také mohou změnit ve vynucenou smlouvu.\n\nSkládá se z [Concept('concept_war_reparations','válečných reparace')] nebo diplomatických požadavků obsahujících jednotlivé [Concept('concept_article','články')|l] definující práva, povinnosti a náklady @inf![Concept('concept_influence','vlivu')] pro kapitulující zemi. Vynucené smlouvy platí do doby, než smlouvu poruší nebo z ní odstoupí některá ze stran po uplynutí počátečního [Concept('concept_binding_period','závazního období')]." # todo: CONCEPT CASE
 concept_article: "Článek"
 concept_articles: "Články"
 concept_article_desc: "Články jsou součástí [Concept('concept_treaty','smlouvou')|l] a mohou mít různou podobu.\n\nČlánek můžou uplatnit několik efektů na jednu nebo obě zúčastněné [Concept('concept_country','země')|l], často s náklady @inf![Concept('concept_influence','vlivu')|l] po dobu platnosti smlouvy. Alternativně můžou mít články jednorázové efekty nebo uložení povinnosti, které mohou negativně ovlivnit [Concept('concept_treaty','smlouvu')|l] v případě jejich [Concept('concept_contravention','porušení')|l].\n\nKaždý článek spadá do jedné ze dvou kategorií:#indent_newline:3 \n$EFFECT_LIST_BULLET$#bold Vzájemné#!: Vzájemné články uplatňují efekty a povinnosti stejně vůči obom zemím.\n$EFFECT_LIST_BULLET$#bold Směrové#!: Směrové články mají různé efekty a povinnosti vůči jedné nebo druhé zemi podle toho, zda je nabízející či přijímající stranou." # todo: CONCEPT CASE
 concept_contravention: "Porušení"
 concept_contraventions: "Porušení"
 concept_contravening: "Porušující"
 concept_contravene: "Porušit"
 concept_contravened: "Porušeno"
 concept_contravention_desc: "[Concept('concept_article','Článek')] v rámci [Concept('concept_treaty','smlouvy')], které obsahují podmínky [Concept('concept_non_fulfillment','neplněných')|l], mohou být porušeny. Aby byl článek považován za porušený, musí příslušná [Concept('concept_country','země')|l] nesplnit požadavky stanovené tímto článkem. To, zda země daný článek porušuje, se ověřuje týdně, měsíčně, ročně, nebo kombinací těchto intervalů – podle povahy daného článku.\n\nNapříklad u článku pro [GetArticleType('law_commitment').GetName], pokud uvedený [Concept('concept_law','zákona')|l] není [Concept('concept_enactment_of_laws','schválen')] nebo není aktivně [Concept('concept_enactment_of_laws_enacting','projednáván')] po dobu #v 3#! po sobě jdoucích týdnů, je článek považován za nesplněný, dokud se dotyčný zákon opět nezačne [Concept('concept_enactment_of_laws_enacting','projednávat')].\n\nPočet po sobě jdoucích porušení, které vedou ke stavu [Concept('concept_non_fulfillment','neplněných')|l], se může u jednotlivých článků lišit." # todo: CONCEPT CASE
 concept_binding_period: "Závazné období"
 concept_binding_period_binding: "Závazné"
 concept_binding_period_bound: "Vázané"
 concept_binding_period_desc: "[Concept('concept_treaty','Smlouva')] obvykle obsahuje $concept_binding_period$, během kterého odstoupení od dohody některou stranou přináší sankce. Po uplynutí tohoto období může strana odstoupit bez penalizace." # todo: CONCEPT CASE
 concept_non_fulfillment: "Neplnění"
 concept_non_fulfilled: "Nesplněno"
 concept_non_fulfillment_desc: "Některé [Concept('concept_article','články')|l] mohou mít připojené povinnosti, které negativně ovlivní [Concept('concept_treaty','smlouvu')], pokud jsou porušeny po stanovený počet po sobě jdoucích případů.\n\nDůsledky neplnění mohou zahrnovat #bold náhrady škod#!, zmrazení nebo dokonce #bold ukončení#! smlouvy.\n\nPokud je smlouva #b zmrazená#!, porušující [Concept('concept_country','země')|l] nadále plní své povinnosti, ale nedostává nic na oplátku." # todo: CONCEPT CASE
 concept_prestige: "Prestiž"
 concept_prestige_desc: "Vaše [Concept('concept_rank','hodnost')|l] se určuje porovnáním vaši prestiže se všemi ostatními [Concept('concept_country','zeměmi')] na světě. Prestiž pochází především z toho, jak impozantní vaše ekonomika je dle [Concept('concept_gdp','HDP')], kolik [Concept('concept_power_projection','projekci síly')|l] vaše vojská generují a jakou úroveň má vaše [Concept('concept_country_tier','postavení země')|l]. Může být také ovlivněna jinými faktory, jako jsou vaše budovy [SelectLocalization(GetPlayer.IsValid,'concept_prestige_desc_gamestate','Umělecká akademie')] a [Concept('concept_monument','monumenty')], a pokud jste světovým lídrem ve výrobě určitého [Concept('concept_good','zboží')|l]." # todo: CONCEPT CASE
 concept_prestige_desc_gamestate: "[GetBuildingType('building_art_academy').GetName]"
 concept_power_projection: "Projekce síly"
 concept_power_projection_desc: "Celková schopnost vojenských sil [Concept('concept_country','země')|l], založená na průměru [Concept('concept_offense','útoku')] a [Concept('concept_defense','obrany')] všech jejich [Concept('concept_unit','vojenských jednotek')]. Utváří základ pro množství [Concept('concept_prestige','prestiž')], které [Concept('concept_country','země')|l] získává ze své armády a námořnictva, a také ovlivňuje, jak moc silný se jeví ostatním zemím při rozhodování o zahájení nebo zvolení strany v [Concept('concept_diplomatic_play','diplomatické hře')]." # todo: CONCEPT CASE
 concept_army_power_projection: "Projekce síly armády"
 concept_army_power_projection_desc: "[Concept('concept_power_projection','Projekce síly')] odvozená z armády [Concept('concept_country','zemi')]." # todo: CONCEPT CASE
 concept_naval_power_projection: "Projekce námořní síly"
 concept_naval_power_projection_desc: "[Concept('concept_power_projection','Projekce síly')] odvozená z námořnictva [Concept('concept_country','zemi')]." # todo: CONCEPT CASE
 concept_dividends: "Dividendy"
 concept_dividends_desc: "Pokud mají [Concept('concept_privately_owned','soukromě vlastnené')] [Concept('concept_building','budovy')|l] pozitivní [Concept('concept_building_balance','bilance')], část tohoto zisku je vyplácena vlastnickým skupinám [Concept('concept_pop','populacím')|l] jako dividendy, které podléhají [Concept('concept_budget_dividends_taxes','zdanění dividend')].\n\nV závislosti na tom, jaký je aktuální $ECONOMIC_SYSTEM_GC_LINK$ dané [Concept('concept_country','země')|l] může být část dividend znovu investována do ekonomiky prostřednictvím [Concept('concept_reinvestment','reinvestic')], zatímco zbytek jde na [Concept('concept_pop_needs','potřeby populace')|l] a jejich [Concept('concept_wealth','bohatství')|l].\n\nPokud je budova plně nebo částečně ve [Concept('concept_nationally_owned','národním vlastnictví')], zisky mohou být vyplaceny jako [Concept('concept_government_dividends','vládní dividendy')|l]." # todo: CONCEPT CASE
 concept_government_dividends: "Vládní dividendy"
 concept_government_dividends_desc: "Zatímco [Concept('concept_nationally_owned','národně vlastněné')] [Concept('concept_building','budovy')|l] mají kladnou [Concept('concept_building_balance','bilance')], část těchto zisků je vyplácena přímo do státní [Concept('concept_treasury','státní pokladny')] jako vládní dividendy.\n\nVýše vyplacené částky závisí na poměru [Concept('concept_privately_owned','soukromých')] a  státních [Concept('concept_building_level','úrovně budovy')].\n\nVe velkých ekonomikách s vysokým [Concept('concept_gdp','HDP')] vedou neefektivity k tomu, že část zisků je promarněna. Navíc [Concept('concept_loans','půjčky')|l] proti [Concept('concept_cash_reserves','hotovostním rezervám')], které drží národně vlastněné budovy, snižují množství vládních dividend, které [Concept('concept_building','budovy')|l] vyplácejí." # todo: CONCEPT CASE
 concept_credit: "Kredit"
 concept_credit_debt: "Dluh"
 concept_credit_limit: "Úvěrový limit"
 concept_credit_desc: "Národní kredit je množství [Concept('concept_money','peněz')], které si může [Concept('concept_treasury','státní pokladna')|l] půjčit ze své ekonomiky.  Tahle suma se rovná součtu všech [Concept('concept_cash_reserves','hotovostních rezerv')] se základní hodnotou stanovenou [Concept('concept_gdp','hrubým domácím produktem')]. Pokud [Concept('concept_principal','jistina')|l] překročí úvěrový limit, [Concept('concept_country','země')|l] se dostává do [Concept('concept_default','platební neschopnosti')]." # todo: CONCEPT CASE
 concept_principal: "Jistina"
 concept_principal_desc: "Celková velikost [Concept('concept_loans','půjčky')|l], které [Concept('concept_treasury','státní pokladna')|l] nashromáždila, nezahrňující [Concept('concept_budget_interest','úroky')|l], které dluží. Pokud [Concept('concept_principal','jistina')|l] překročí váš [Concept('concept_credit','kredit')|l], dostanete se do [Concept('concept_default','platební neschopnosti')]." # todo: CONCEPT CASE
 concept_loans: "Půjčky"
 concept_loans_desc: "Finanční prostředky, které [Concept('concept_treasury','státní pokladna')|l] dluží [Concept('concept_building_owners','vlastníkům budov')] v [Concept('concept_country','zemích')].\n\nKdykoli má státní pokladna záporný zůstatek, automaticky navýšuje své půjčky, pokud nemá dostatečné [Concept('concept_gold_reserves','zlaté rezervy')|l], kterými by schodek pokryla.\n\n[Concept('concept_budget_interest','Úrok')] se každý týden přičítají k [Concept('concept_principal','jistině')]. Pokud jistina někdy překročí [Concept('concept_credit','kredit')|l] dané země, země přechází do [Concept('concept_default','platební neschopnosti')]." # todo: CONCEPT CASE
 concept_war_support: "Válečná podpora"
 concept_war_support_desc: "Míra toho, jak moc je populace [Concept('concept_country','země')] ochotná zůstat ve [Concept('concept_war','válce')]. Kladné hodnoty znamenají touhu zůstat ve válce, zatímco záporné hodnoty vyjadřují obecný odpor k ní. Jakmile válečná podpora dosáhne hodnoty [GetDefine('NWar','AUTO_CAPITULATE_WAR_SUPPORT')|v0], země okamžitě kapituluje a všechny [Concept('concept_war_goal','válečný cíl')|l] mohou být proti nim uplatněny. Válečná podpora může klesnout pod #v 0#! pouze tehdy, pokud opačná strana [Concept('concept_controlled_war_goal','ovládá')|l] všechny své válečné cíle." # todo: CONCEPT CASE
 concept_occupation: "Okupace"
 concept_occupied: "Okupováno"
 concept_occupying: "Okupující"
 concept_occupy: "Okupovat"
 concept_occupies: "Okupuje"
 concept_occupation_desc: "Jakékoliv [Concept('concept_province','provincie')|l] vlastní [Concept('concept_country','země')|l], které jsou aktuálně součástí nepřátelského [Concept('concept_theater','válčiště')|l], se považují za okupovány. Okupace přispívá k [Concept('concept_war_exhaustion','válečnému vyčerpání')]. Okupace [Concept('concept_war_goal','válečného cíle')], který nárokujete proti nepříteli, je obvykle požadována k tomu, aby dostala jejich [Concept('concept_war_support','válečnou podporu')] do záporných čísel." # todo: CONCEPT CASE
 concept_war_exhaustion: "Válečná únava"
 concept_war_exhaustion_exhausted: "Vyčerpaný"
 concept_war_exhaustion_desc: "[Concept('concept_pop','Populace')] obvykle trpí, zatímco je jejich [Concept('concept_country','země')|l] ve [Concept('concept_war','válce')]. Následující faktory přispívají k válečné únavě:\n\n* kolik [Concept('concept_province','provincí')] bylo [Concept('concept_occupation','okupováno')|l]\n* kolik [Concept('concept_war_goal','válečný cíl')] ovládá nepřítel\n* jaké jsou utrpěné [Concept('concept_casualties','ztráty')|l]\n* jak moc [Concept('concept_country','země')|l] sužují [Concept('concept_turmoil','nepokoje')|l]\n\nVálečná únava snižuje každý týden [Concept('concept_war_support','válečnou podporu')] a  přibližuje zemi k souhlasu s [Concept('concept_peace_deal','mírovou smlouvou')]." # todo: CONCEPT CASE
 concept_theater: "Válčiště"
 concept_theaters: "Válčiště"
 concept_theater_desc: "Oblast sousedních [Concept('concept_province','provincí')] pod kontrolou jedné [Concept('concept_country','zeměmi')|l]. [Concept('concept_front','Fronta')] vznikají na hranici mezi dvěma válčišti, ovládají země nepřátelské vůči sobě během [Concept('concept_war','války')] nebo [Concept('concept_diplomatic_play','diplomatické hry')]." # todo: CONCEPT CASE
 concept_literacy: "Gramotnost"
 concept_literate: "Gramotný"
 concept_literacy_desc: "Procento nebo absolutní počet jednotlivců v [Concept('concept_pop','populacích')], kteří umí číst a psát. Některé [Concept('concept_profession','profese')|l] vyžadují vyšší gramotnost než jiné, což omezuje [Concept('concept_pop_qualifications','kvalifikace')|l] pro populace v jiných [Concept('concept_profession','profesích')], pokud jejich [Concept('concept_literacy','gramotnost')|l] není dostatečně vysoká. Můžete investovat do instituce [SelectLocalization(GetPlayer.IsValid,'concept_literacy_desc_added','Vzdělání')] pro rozvoj vyšší gramotnosti ve vaší populaci v průběhu času.\n\nPopulace budou čelit stále se zvyšující penalizaci pro míru narození proporcionální jejich gramotnosti, až po následující:\n[GetStaticModifier('literacy_penalty').GetDesc]#!" # todo: CONCEPT CASE
 concept_literacy_desc_added: "[GetInstitutionType('institution_schools').GetName]"
 concept_turmoil: "Nepokoje"
 concept_turmoil_desc: "Nepokojné [Concept('concept_state','státy')|l] a [Concept('concept_culture','kultury')|l] obsahují [Concept('concept_radical','radikály')] nespokojené se svou aktuální situací. Množství nepokoje odpovídá podílu [Concept('concept_workforce','pracovní síly')] daného státu nebo kultury, který tvoří radikálové.\n\nVysoké nepokoje můžou způsobit řadu negativních místních efektů v daném státě. [Concept('concept_cultural_turmoil','Kulturní nepokoje')] můžou ovlivnit celou [Concept('concept_country','zemi')] velmi rušivým a destabilizujícím způsobem." # todo: CONCEPT CASE
 concept_unemployed: "Nezaměstnaný"
 concept_unemployment: "Nezaměstnanost"
 concept_unemployed_desc: "Nezaměstnaná [Concept('concept_pop','populace')|l] nepracuje v žádné z [Concept('concept_building','budovy')] ve svém [Concept('concept_state','státě')] a tudíž nepobírá [Concept('concept_building_wage','mzdu')]. S největší pravděpodobností přijme jakoukoli další dostupnou práci – a pokud žádná nepřijde, pravděpodobně [Concept('concept_migration','emigruje')].\n\nPopulace žijící ve státě čelí klesající porodnosti úměrně míře nezaměstnanosti v daném státě, a to až do následujícího maxima:\n[GetStaticModifier('unemployment_birth_penalty_state').GetDesc]#!" # todo: CONCEPT CASE
 concept_cultural_turmoil: "Kulturní nepokoje"
 concept_cultural_turmoil_desc: "The [Concept('concept_turmoil','nepokoje')] generované [Concept('concept_pop','populace')] určitého [Concept('concept_culture','kultury')], obvykle v důsledku jejich podílu na [Concept('concept_radical','radikál')]. Pokud je jeho hodnota v [Concept('concept_country','zemích')] alespoň [GetDefine('NPops','MASS_MIGRATION_ORIGIN_MIN_TURMOIL')|v%0], může to spustit [Concept('concept_mass_migration','hromadná migrace')] tohoto kultury do jiného zemí. Při dostatečně vysokých hodnotách se však tyto $concept_pops$ mohou místo toho pokusit oddělit své [Concept('concept_homeland','domoviny')] v rámci [Concept('concept_secession','odtržení')]." # todo: CONCEPT CASE
 concept_commander_rank: "Hodnost velitele"
 concept_commander_rank_short: "Hodnost"
 concept_commander_ranks: "Hodnosti velitele"
 concept_commander_rank_desc: "[Concept('concept_commander','Velitelova')] hodnost určuje jeho [Concept('concept_command_limit','velitelského limitu')|l], stejně jako kolik [Concept('concept_clout','politický vliv')] předávají své [Concept('concept_interest_group','zájmovou skupinu')]. Odchod velitele do penze způsobí pokles [Concept('concept_approval','spokojenosti')] [Concept('concept_interest_group','zájmové skupiny')] v závislosti od velitelove hodnosti." # todo: CONCEPT CASE
 concept_commander: "Velitel"
 concept_commanders: "Velitelé"
 concept_commander_possessive: "Velitelova"
 concept_commander_desc: "[Concept('concept_character','Postava')], která velí [Concept('concept_military_formation','formaci')] [Concept('concept_country','země')]. Velitel může být buď [Concept('concept_general','generál')|l], nebo [Concept('concept_admiral','admirál')|l] podle typu formace, které velí. [Concept('concept_commander_rank','Hodnost velitele')] přispívá k [Concept('concept_command_limit','velitelskému limitu')] dané formace a zároveň ovlivňuje počet jednotek, které je schopen přivést s sebou do bitvy. $commander_coup_loc$" # todo: CONCEPT CASE
 commander_coup_loc: "[Concept('concept_popularity','Oblíbení')] velitelé patřící do [Concept('concept_interest_group','zájmové skupiny')] s nízkou [Concept('concept_approval','spokojeností')] mohou zahájit [Concept('concept_coup','puči')|l]." # todo: CONCEPT CASE
 concept_general: "Generál"
 concept_generals: "Generálové"
 concept_general_possessive: "Generála"
 concept_general_plural_singular: "Generál(ové)"
 concept_general_desc: "Velitel [Concept('concept_army','armády')] se nazývá generál a vede [Concept('concept_battalion','prapory')|l] své armády do [Concept('concept_battle','boje')]. Každému generálovi můžete kdykoliv změnit [Concept('concept_order','rozkaz')|l] na panelu vojenské [Concept('concept_military_formation','formace')|l] nebo jednoduše kliknutím pravým tlačítkem na něj. Druhy rozkazů, které můžete generálovi zadat, závisí na jeho [Concept('concept_character_trait','charakterový rys')], ale vždy jsou k dispozici základní rozkazy #b Postupovat#! a #b Bránit#!. Vojenské efekty plynoucí z generálových vlastností mohou ovlivnit buď celou jeho armádu, nebo se uplatní jen na prapory, které má přímo pod velením během [Concept('concept_battle','bitvy')]." # todo: CONCEPT CASE
 concept_admiral: "Admirál"
 concept_admirals: "Admirálové"
 concept_admiral_possessive: "admirálova"
 concept_admiral_desc: "[Concept('concept_character','Postava')] námořního [Concept('concept_commander','velitele')], který velí [Concept('concept_ship','flotilám')] [Concept('concept_country','zemi')|l]. Účinky z [Concept('concept_admiral','admirálových')] [Concept('concept_character_trait','charakterového rysu')] se přenášejí na [Concept('concept_ship','loď')|l] pod jeho velením." # todo: CONCEPT CASE
 concept_admiral_defeated: "Poražen"
 concept_admiral_defeated_desc: "[Concept('concept_admiral','Admirál')] je poražen po prohre v námořní [Concept('concept_battle','bitvě')]. [Concept('concept_fleet','Loďstvo')] je poražena, až všichni [Concept('concept_admiral','admirálové')|l] jsou poraženi. [Concept('concept_fleets','Loďstva')] se opraví a [Concept('concept_admiral','admirálem')|l] se znovu shromáždí pouze poté, co se vrátí do své domovské [Concept('concept_hq','základny')] a jejich [Concept('concept_ship','lodě')|l] získali alespoň [GetDefine('NMilitary','MANPOWER_RATIO_REQUIRED_TO_CLEAR_DEFEATED_ADMIRALS')|v0%] z jejich celkového [Concept('concept_manpower','personálu')]." # todo: CONCEPT CASE
 concept_military_formation: "Formace"
 concept_military_formations: "Formace"
 concept_military_formation_possessive: "Formací"
 concept_military_formation_desc: "Vojenská formace je [Concept('concept_army','armáda')|l] nebo [Concept('concept_fleet','loďstvo')|l], které se používá ve [Concept('concept_war','válce')] k dosažení vojenských cílů. Může mít přidělené [Concept('concept_unit','vojenské jednotky')|l] a [Concept('concept_commander','velitele')] a může být přirazena k [Concept('concept_front','frontě')] k boji s nepřátelskými silami." # todo: CONCEPT CASE
 concept_political_strength: "Politická síla"
 concept_political_strength_desc: "Míra moci, kterou má [Concept('concept_pop','populace')|l], a následně [Concept('concept_interest_group','zájmová skupina')|l], kterou podporuje – nad politikou [Concept('concept_country','zeměmi')]. Tato moc vychází z [Concept('concept_wealth','bohatství')|l] podporující populace. Populace, která žije v [Concept('concept_unincorporated_state','nezačleněném státě')], má výrazně nižší politickou sílu, zatímco populace [Concept('concept_capital_state','hlavního města')] ji má vyšší.\n\nPopulace rozděluje svou politickou sílu mezi zájmové skupiny, které podporuje, v poměru k tomu, kolik jejich členů danou skupinu podporuje. Pokud je zájmová skupina součástí nějaké [Concept('concept_party','politické strany')], získává další politickou sílu i z [Concept('concept_votes','hlasů')], které tato strana obdržela v posledních [Concept('concept_election','voleb')]. [Concept('concept_clout','Politický vliv')] [Concept('concept_interest_group','Zájmová skupina')] pak odpovídá jejímu podílu na celkové politické síle v [Concept('concept_country','zemích')]." # todo: CONCEPT CASE
 concept_invasion: "Invaze"
 concept_invade: "Napadnout"
 concept_invaded: "Napadený"
 concept_invading: "Napadající"
 concept_invasion_desc: "Útok [Concept('concept_army','armády')] na [Concept('concept_state','stát')|l] po souši nebo po moři, přičemž námořní útok je označován jako [Concept('concept_naval_invasion','námořní invaze')|l]." # todo: CONCEPT CASE
 concept_naval_invasion: "Námořní invaze"
 concept_naval_invasions: "Námořní invaze"
 concept_naval_invaded: "napaden z moře"
 concept_naval_invasion_desc: "Námořní invaze na pobřežní [Concept('concept_state','stát')|l], koordinovaná mezi [Concept('concept_fleet','loďstvem')] a [Concept('concept_army','armádou')]. Loďstvo udržuje vody u pobřeží pod kontrolou, aby zajistilo bezpečné vylodění armády, která následně vede sérii pozemních [Concept('concept_battle','bitev')] s cílem získat [Concept('concept_occupation','okupaci')] v cílovém státě.\n\nTen, kdo ovládá cílový stát, se může bránit námořní invazi umístěním vlastného [Concept('concept_fleet','loďství')] v dotčeném [Concept('concept_sea_node','námořním uzlu')] nebo rozmístěním [Concept('concept_mobilize_army','mobilizované')] armády v pozemním [Concept('concept_hq','velitelství')|l] zahrnujícím napadený stát." # todo: CONCEPT CASE
 concept_working_adults: "Pracující dospělí"
 concept_working_adult: "Pracující dospělý"
 concept_working_adults_desc: "Část [Concept('concept_pop','populací')|l], která tvoří [Concept('concept_workforce', 'pracovní sílu')], pracující v [Concept('concept_building','budově')] za [Concept('concept_building_wage', 'mzdu')]. Jsou hlavním zdrojem [Concept('concept_pop_income','příjmem populace')] a [Concept('concept_political_strength','politickou sílu')] pro danou populaci." # todo: CONCEPT CASE
 concept_dependents: "Závislé osoby"
 concept_dependent: "Závislá osoba"
 concept_dependents_desc: "Část [Concept('concept_pop','populací')|l], která se nepovažuje za součást [Concept('concept_workforce','pracovní sílu')]. Představují rodiny [Concept('concept_working_adults','pracujících dospělých')] a obvykle tvoří většinu populace. Závislé osoby obvykle získávají [Concept('concept_dependent_income','dávky závislých osob')|l], který jsou obvykle nižší než [Concept('concept_building_wage','mzdy')|l] získávané [Concept('concept_working_adults','pracujícími dospělými')], ale mají také nižší [Concept('concept_pop_needs','potřeby')]. I když mohou podporovat [Concept('concept_interest_group','zájmové skupiny')|l], jejich [Concept('concept_political_strength','politická síla')|l] má obvykle menší váhu. [Concept('concept_votes','Volební právo')] získávají jen za velmi specifických podmínek daných [Concept('concept_law','zákonů')].\n\nZavedení různých zákonů nebo udržování určitých [Concept('concept_institution','institucí')] může v průběhu přeměnit závislé osoby na pracující dospělé, zvýšit jejich [Concept('concept_political_strength','politickou sílu')], nebo doplnit jejich příjem." # todo: CONCEPT CASE
 concept_disenfranchised: "Bez volebního práva"
 concept_disenfranchised_desc: "[Concept('concept_pop','Populace')] bez volebního práva nemá povoleno účastnit se politického života [Concept('concept_country','zemí')|l]. V důsledku toho nemohou podpořit žádné [Concept('concept_interest_group','zájmové skupiny')|l]. Nejčastější důvod, proč je [Concept('concept_pop','populace')|l] bez volebního práva je nízká míra [Concept('concept_acceptance','přijetí')|l]." # todo: CONCEPT CASE
 concept_input_mult: "Vstupy zboží"
 concept_input_mult_desc: "Úprava množství [Concept('concept_good','zboží')|l], které je [Concept('concept_good_consumption','spotřebováno')|l] [Concept('concept_building','budovou')]." # todo: CONCEPT CASE
 concept_throughput: "Efektivita"
 concept_throughput_desc: "Efektivita [Concept('concept_workforce','pracovní síly')] v [Concept('concept_building','budově')]. Efektivita zvyšuje jak [Concept('concept_good_consumption','vstup zboží')], tak [Concept('concept_good_production','výstup zboží')] nebo jiné efekty. Může se zvýšit v důsledku [Concept('concept_economy_of_scale','úsporám z rozsahu')] a může být upravován nahoru nebo dolů vlivem [Concept('concept_modifier','modifikátorem')|l]." # todo: CONCEPT CASE
 concept_native_uprising: "Domorodé povstání"
 concept_native_uprising_desc: "Typ [Concept('concept_diplomatic_play','diplomatické hry')], který může nastat, pokud úroveň [Concept('concept_tension','napětí')|l] mezi kolonizátorem a [Concept('concept_decentralized_nation','decentralizovaným národem')] vzroste na úroveň #b $tension_volatile$#!. V této diplomatické hře se decentralizovaný národ mobilizuje a pokouší se převzít [Concept('concept_colony','kolonii')] od kolonizátora." # todo: CONCEPT CASE
 concept_discrimination: "Diskriminace"
 concept_discriminated: "Diskriminováno"
 concept_discriminated_against: "Být diskriminován"
 concept_discrimination_desc: "[Concept('concept_pop','Populace')] může být diskiminována, pokud jejich [Concept('concept_culture','kultura')|l] a/nebo [Concept('concept_religion','náboženství')|l] mají nízkou hodnotu [Concept('concept_acceptance','přijetí')|l] ve své [Concept('concept_country','zemi')]. Obvykle je populace ve třech nejnižších statusech [Concept('concept_acceptance','přijetí')|l] považována za diskriminovanou. Diskriminovaná populace:\n- dostává nižší mzdu než ostatní\n- má nižší [Concept('concept_political_strength','politické síly')]\n- méně pravděpodobně získá [Concept('concept_pop_qualifications','kvalifikaci')] pro určité [Concept('concept_profession','profese')|l]\n- přirozeně se s časem [Concept('concept_radical','radikalizuje')]\n- a častěji [Concept('concept_migration','emigruje')].\n\nKromě toho některé [Concept('concept_law','zákony')|l] mohou míru národního přijetí kultur a náboženství omezit nebo rozšířit." # todo: CONCEPT CASE
 concept_approval: "Spokojenost"
 concept_approval_disapproval: "Nesouhlas"
 concept_approval_indifferent: "Lhostejnost"
 concept_approval_desc: "[Concept('concept_interest_group','Zájmová skupina')] Spokojenost závisí na dvou hlavních faktorech: kolik z jejich [Concept('concept_political_strength','politická síla')] pochází z [Concept('concept_radical','radikálu')] ve srovnání s [Concept('concept_loyalist','loajalistou')], a jak dobře současné [Concept('concept_law','zákony')] [Concept('concept_country','zemi')] odpovídají [Concept('concept_ideology','ideologie')] dané $concept_interest_group$. Kromě toho, pokud je nový $concept_law$ právě [Concept('concept_enactment_of_laws','uzákoněn')], bude $concept_approval$ ovlivněn větší dočasnou úpravou, která bude přetrvávat během [Concept('concept_decay','odeznívajícího')] po dobu až #v [GetDefine('NPolitics','CHANGED_LAW_APPROVAL_MONTHS')|0] měsíců#! po jeho přijetí.\n\nSpokojenost určuje, které [Concept('concept_interest_group_trait','rysy zájmové skupiny')] si aktivují. [GetApprovalRatingFromValue(GetDefine('NPolitics','APPROVAL_THRESHOLD_ANGRY'))] Zájmové skupiny přispívají k [Concept('concept_activism','aktivismu hnutí')] [Concept('concept_political_movement','politickému hnutí')], zatímco $concept_interest_groups$, které dosahují alespoň [GetApprovalRatingFromValue(GetDefine('NPolitics','APPROVAL_THRESHOLD_HAPPY'))], se od začátku zdrží připojování k hnutí. $ig_approval_coup_loc$" # todo: CONCEPT CASE
 ig_approval_coup_loc: "Zájmová skupina se Spokojeností na nebo pod hodnotou [GetApprovalRatingFromValue(GetDefine('NPolitics','APPROVAL_THRESHOLD_ANGRY'))] může rozpoutat [Concept('concept_coup','puč')|l] proti současné [Concept('concept_government','vládě')]." # todo: CONCEPT CASE
 concept_insurrection: "Vzpoura"
 concept_insurrections: "Povstání"
 concept_insurrectionary: "Vzpouřenecké"
 concept_insurrection_desc: "Vzpoura je buď [Concept('concept_secession', 'separatistické')] nebo [Concept('concept_revolution','revoluční')|l] [Concept('concept_political_movement','politické hnutí')|l]. To znamená, že hnutí je na pokraji přerodu na [Concept('concept_civil_war','občanskou válku')|l]. Jakékoliv [Concept('concept_pop','populace')|l] nebo [Concept('concept_interest_group','zájmové skupiny')|l], které jsou součástí vzbouřeneckého hnutí, jsou také označovány jako #italic $concept_insurrectionary$#!." # todo: CONCEPT CASE
 concept_revolt: "Povstání"
 concept_revolution: "Revoluce"
 concept_revolutions: "Revoluce"
 concept_revolutionary: "Revoluční"
 concept_revolution_desc: "Na rozdíl od [Concept('concept_secession','odtržení')|l], revoluce se pokusí anektovat celou [Concept('concept_country','zemi')] a přetvořit jej podle své [Concept('concept_core_movement_ideology','ideologie')]. Revoluce je důsledkem [Concept('concept_political_movement','politickým hnutím')], které se stalo příliš [Concept('concept_radical','radikálním')] a získalo vysokou [Concept('concept_political_movement_support','podporu politické hnutí')] i míru [Concept('concept_activism','aktivismus hnutí')]. Pokud toto hnutí zahájí vzpouru, [Concept('concept_state','stát')|l], ve kterých má silnou podporu [Concept('concept_pop','populace')|l], se oddělí od zbytku země a zahájí [Concept('concept_diplomatic_play','diplomatickou hru')] s cílem připojit [Concept('concept_loyalist','věrné části země')] k sobě.\n\nMíru [Concept('concept_activism','aktivismus hnutí')] politického hnutí lze snížit snížením počtu [Concept('concept_radical','radikálů')] v podporujících skupinách populace a zvýšením [Concept('concept_approval','spokojeností')] jejich [Concept('concept_interest_group','zájmové skupiny')|l]. Revoluci lze také oslabit a zpomalit pomocí [Concept('concept_institution','institucí')|l] [SelectLocalization(GetPlayer.IsValid,'concept_revolution_desc_added','Vnitřní záležitosti')]." # todo: CONCEPT CASE
 concept_revolution_desc_added: "[GetInstitutionType('institution_home_affairs').GetName]"
 concept_secession: "Odtržení"
 concept_secessions: "Odtržení"
 concept_secessionist: "Separatista"
 concept_secessionists: "Separatisté"
 concept_seceding: "Odtržení"
 concept_secession_desc: "Na rozdíl od [Concept('concept_revolution','revolucí')|l], odtržení rozdělí [Concept('concept_country','zemí')] na dvě strany, přičemž separatisté bojují za osvobození a vytvoření nového národa. Odtržení je výsledkem [Concept('concept_political_movement','politickým hnutím')], které se stalo příliš [Concept('concept_radical','radikálním')] a získalo vysokou [Concept('concept_political_movement_support','podporu politické hnutí')] i míru [Concept('concept_activism','aktivismus hnutí')]. Pokud toto hnutí zahájí vzpouru, [Concept('concept_state','stát')|l], ve kterých má silnou podporu [Concept('concept_pop','populace')|l], se oddělí od zbytku země a zahájí [Concept('concept_diplomatic_play','diplomatickou hru')] za osvobození.\n\nMíru [Concept('concept_activism','aktivismus hnutí')] politického hnutí lze snížit snížením počtu [Concept('concept_radical','radikálů')] v podporujících skupinách populace a zvýšením [Concept('concept_approval','spokojeností')] jejich [Concept('concept_interest_group','zájmové skupiny')|l]. Můžete také oslabit a zpomalit odtržení pomocí [Concept('concept_institution','institucí')|l] [SelectLocalization(GetPlayer.IsValid,'concept_revolution_desc_added','Vnitřní záležitosti')]." # todo: CONCEPT CASE
 concept_secession_desc_added: "[GetInstitutionType('institution_home_affairs').GetName]"
 concept_civil_war: "Občanská válka"
 concept_civil_wars: "Občanské války"
 concept_civil_war_desc: "[Concept('concept_war','Válka')], kde se [Concept('concept_country','zeměmi')|l] rozdělí na dvě protistrany. Může se jednat o [Concept('concept_revolution','revoluce')] nebo [Concept('concept_secession','secesi')], jakožto výsledek [Concept('concept_political_movement','politického hnutí')]." # todo: CONCEPT CASE
 concept_political_movement_support: "Podpora politického hnutí"
 concept_political_movement_support_short: "Podpora"
 concept_political_movement_supporting: "Podpora"
 concept_political_movement_support_desc: "Podpora [Concept('concept_political_movement','Politické hnutí')] se zakládá na [Concept('concept_political_strength','politickou sílu')] jeho podporující [Concept('concept_pop','populaci')|l] a také na [Concept('concept_popularity','popularitu')] a [Concept('concept_character_trait','charakterový rys')] jakýchkoliv podporujících [Concept('concept_agitator','agitátorů')]. Politické hnutí s alespoň [LabelingHelper.GetLabelForRadicalism(GetDefine('NPolitics', 'MOVEMENT_MIN_RADICALISM_FOR_LAW_ENACTMENT_IMPACT'))] (#v [GetDefine('NPolitics', 'MOVEMENT_MIN_RADICALISM_FOR_LAW_ENACTMENT_IMPACT')|%0]#!) [Concept('concept_activism','aktivismem')] zvyšují šanci na [Concept('concept_enactment_success','úspěšné uzákonění zákona')|l], pokud následuje [Concept('concept_law','zákon')|l], který si přejí, nebo zvyšují šanci na [Concept('concept_enactment_stall','obstrukci')], pokud mu odporují. Tato zvýšená šance je přímo založena na podpoře. Pokud politické hnutí směruje ke [Concept('concept_insurrection','vzpoure')], podpora politického hnutí určí, s kolika [Concept('concept_state','státu')] bude tato vzpoura začínat\n\n#title Prahové hodnoty podpory:#! #indent_newline:3 \n[GetSupportLabelsDesc]" # todo: CONCEPT CASE
 concept_political_movement: "Politické hnutí"
 concept_political_movement_short: "Hnutí"
 concept_political_movements_short: "Hnutí"
 concept_political_movements: "Politická hnutí"
 concept_political_movement_possessive: "politického hnutí"
 concept_political_movement_possessive_short: "hnutí"
 concept_political_movement_desc: "Politické hnutí je poháněno [Concept('concept_political_movement_support','podporou')] [Concept('concept_pop','populace')|l] podle toho, jaký je jejich [Concept('concept_core_movement_ideology','ideový základ hnutí')|l]. Jejich podpora přichází v různých stupních [Concept('concept_activism','aktivismu hnutí')] v závislosti na tom, kolik populace je zapojených nebo naštvaných ohledně dané otázky. [Concept('concept_agitator','Agitátor')] se také mohou připojit k podpoře hnutí, což zvyšuje aktivismus na základě jejich [Concept('concept_popularity','popularity')]. Pokud je dostatek populace podporující hnutí a aktivismus je dost vysoký, hnutí se může stát [Concept('concept_insurrection','vzpouřenecké')|l] v závislosti na [Concept('concept_law','zákon')] v ideovém základu hnutí a typu hnutí. [Concept('concept_insurrection','Vzpouřenecké')] hnutí může následně přivést zemi až do [Concept('concept_civil_war','občanské války')|l].\n\nPolitická hnutí budou vyvíjet [Concept('concept_political_movement_pressure','politický tlak')|l] na [Concept('concept_interest_group','zájmovou skupinu')|l] na základě procentuálního podílu [Concept('concept_political_strength','politické síly')] od podporujících skupin populace.\n\nHnutí ovlivňují zákony a zároveň jsou jimi ovlivňována. Pokud je [Concept('concept_activism','aktivismus hnutí')|l] alespoň [LabelingHelper.GetLabelForRadicalism(GetDefine('NPolitics', 'MOVEMENT_MIN_RADICALISM_FOR_LAW_ENACTMENT_IMPACT'))] (#v [GetDefine('NPolitics', 'MOVEMENT_MIN_RADICALISM_FOR_LAW_ENACTMENT_IMPACT')|%0]#!), hnutí zvýší šance na [Concept('concept_enactment_success','úspěšné uzákonění zákona')|l] anebo na [Concept('concept_enactment_stall','obstrukci')] pro [Concept('concept_endorse_oppose','podporováne')] i [Concept('concept_endorse_oppose','odmítané')] zákony v rámci [Concept('concept_core_movement_ideology','ideového základu hnutí')], podle míry [Concept('concept_political_movement_support','podpory politického hnutí')] hnutí. Podobně, pokud je aktivismus hnutí alespoň [LabelingHelper.GetLabelForRadicalism(GetDefine('NPolitics', 'MOVEMENT_MIN_RADICALISM_FOR_LAW_ENACTMENT_IMPACT'))] (#v [GetDefine('NPolitics', 'MOVEMENT_MIN_RADICALISM_FOR_LAW_ENACTMENT_IMPACT')|%0]#!) a zákon, ať už přijíman nebo odmítán v ideovém základu hnutí, se [Concept('concept_enactment_of_laws','schvaluje')], aktivismus #b nemůže#! klesnout pod úroveň [LabelingHelper.GetLabelForRadicalism(GetDefine('NPolitics', 'MOVEMENT_MIN_RADICALISM_FOR_LAW_ENACTMENT_IMPACT'))] (#v [GetDefine('NPolitics', 'MOVEMENT_MIN_RADICALISM_FOR_LAW_ENACTMENT_IMPACT')|%0]#!)." # todo: CONCEPT CASE
 concept_activism: "Aktivismus hnutí"
 concept_activism_short: "Aktivismus"
 concept_activism_desc: "Aktivismus hnutí je procento [Concept('concept_political_movement_support','podpora')] [Concept('concept_pop','populace')], které jsou ochotné aktivně prosazovat agendu [Concept('concept_political_movement','politické hnutí')]. Určuje, kolik [Concept('concept_radical','radikál')] je generováno $concept_political_movement_short$ každý týden a jak blízko je $concept_political_movement_short$ k tomu, aby se stal [Concept('concept_insurrection','vzpouřenecké')]. Pokud už je $concept_insurrectionary$, určuje maximální postup, kterého může $concept_revolution$ dosáhnout.\n\nNaštěstí dokážeme předpovědět, jak se bude $concept_political_movement_possessive$ $concept_activism_short$ měnit. Pokud je predikce @activism_red! $RADICALISM_PROTESTING$ (#v [GetDefine('NPolitics', 'RADICALISM_PROTESTING_THRESHOLD')|%0]#!) nebo vyšší, má $concept_political_movement_short$ vysoké riziko stát se $concept_insurrectionary$. Pokud je predikce @activism_red! $RADICALISM_MILITANT$ (#r 100%#!) a $concept_political_movement_support_short$ je dostatečný, hrozí [Concept('concept_civil_war','občanská válka')], protože postup [Concept('concept_revolution','revoluce')] nebo [Concept('concept_secession','odtržení')] může nyní dosáhnout #v 100%#!.\n\nPokud je $concept_activism_short$ alespoň [LabelingHelper.GetLabelForRadicalism(GetDefine('NPolitics', 'MOVEMENT_MIN_RADICALISM_FOR_LAW_ENACTMENT_IMPACT'))] (#v [GetDefine('NPolitics', 'MOVEMENT_MIN_RADICALISM_FOR_LAW_ENACTMENT_IMPACT')|%0]#!), $concept_political_movement_short$ zvýší šance na [Concept('concept_enactment_success','úspěšné uzákonění zákona')] a [Concept('concept_enactment_stall','obstrukci')] u [Concept('concept_endorse_oppose','podporováno')] a [Concept('concept_endorse_oppose','proti')] zákonů v rámci [Concept('concept_core_movement_ideology','ideového základu hnutí')] podle podpory.\n\nPokud je aktivismu alespoň [LabelingHelper.GetLabelForRadicalism(GetDefine('NPolitics', 'MOVEMENT_MONTHLY_RADICALS_THRESHOLD'))] (#v [GetDefine('NPolitics', 'MOVEMENT_MONTHLY_RADICALS_THRESHOLD')|%0]#!), určitý počet podpory populací se každý měsíc stane radikalizovaného, a některé hnutí začnou vytvářet [Concept('concept_obstinance','neústupnosti')] v státech, kde jsou podpory populací.\n\n#title Prahové hodnoty aktivismu:#! #indent_newline:3 \n[GetActivismLabelsDesc]" # todo: CONCEPT CASE
 concept_political_movement_pressure: "Politický tlak"
 concept_political_movement_pressure_short: "Tlak"
 concept_political_movement_pressured_short: "Pod tlakem"
 concept_political_movement_pressure_desc: "[Concept('concept_political_movement','Politické hnutí')] budou vyvíjet politický tlak na zájmovou skupinu na základě procentuálního podílu [Concept('concept_political_strength','politické síly')], kterou má [Concept('concept_political_movement_support','podporující')] [Concept('concept_pop','populací')|l]. Zájmová skupina je považována za skupinu #b pod tlakem#!, pokud je politický tlak nad #v [GetDefine('NPolitics', 'IG_INFLUENCING_MOVEMENT_MIN_SUPPORTING_CLOUT')|%0]#!. Poté se [Concept('concept_ideology','ideologií')] [Concept('concept_character','postavou')] spojené s tímto politickým hnutím může stát dostupnou pro nové [Concept('concept_leader','vůdce')] této zájmové skupiny.\n\nVšechna populace patřící k zájmové skupině má různou politickou sílu, která se sčítá do celkové politické síly dané skupiny. Procento této celkové síly, kterou představuje populace obyvatelé podporující [Concept('concept_political_movement','politickému hnutí')|l], určuje výsledný politický tlak hnutí. Populace s vyšší politickou silou mají větší vliv na své zájmové skupiny prostřednictvím ideologií a přesvědčení, které vyznává jimi podporované politické hnutí" # todo: CONCEPT CASE
 concept_core_movement_ideology: "Ideový základ hnutí"
 concept_core_movement_ideology_short: "Ideový základ"
 concept_core_movement_ideology_extra_short: "Ideologie"
 concept_core_movement_ideology_desc: "Tato [Concept('concept_ideology','ideologie')|l] představuje to, na čem záleží [Concept('concept_political_movement_support','podporující')] [Concept('concept_pop','populaci')] a [Concept('concept_agitator','agitátorům')] a co celkově prosazuje [Concept('concept_political_movement','politické hnutí')|l]. Přijetí [Concept('concept_law','zákonů')] [Concept('concept_endorse_oppose','podporovaných')] touhle ideologií vytvoří [Concept('concept_loyalist','loajalisty')] z podporující populace. Pokud jsou některé [Concept('concept_interest_group','zájmové skupiny')|l] [Concept('concept_political_movement_pressure','pod tlakem')], je zaručeno, že daná ideologie se stane jednou z ideologií, kterou může zastávat nový ('concept_leader', 'vůdce')] těchto zájmových skupin." # todo: CONCEPT CASE
 concept_peace_deal: "Mírová smlouva"
 concept_peace_deals: "Mírové smlouvy"
 concept_peace_deal_desc: "Když [Concept('concept_war_leader','válečný vůdce')|l] chce ukončit [Concept('concept_war','válku')], může nabídnout mírovou smlouvu. Smlouva musí být schválena všemi vyjednávajícími zeměmi, které zůstávají ve válce, aby nabyla účinnosti. Pro zvýšení šance, že mírová smlouva bude schválena, má vůdce povoleno zahrnout nebo vyloučit navržené [Concept('concept_war_goal','válečné cíle')|l] z obou stran." # todo: CONCEPT CASE
 concept_war: "Válka"
 concept_wars: "Války"
 concept_war_desc: "Aktivní ozbrojený konflikt mezi dvěma stranami zúčasněných [Concept('concept_country','zemí')] jako výsledek neúspěšného pokusu o mírové vyřešení [Concept('concept_diplomatic_play','diplomatickou hru')]. Během války budou [Concept('concept_commander','velitelé')|l] na zemi a na moři následovat [Concept('concept_order','rozkazy')|l] na splnění určitých cílů, často vedoucích k [Concept('concept_battle','bitvě')] mezi oběma stranami." # todo: CONCEPT CASE
 concept_war_goal: "Válečný cíl"
 concept_war_goals: "Válečné cíle"
 concept_war_goal_desc: "Válečné cíle jsou cíle, o které [Concept('concept_country','zemi')|l] bojuje ve [Concept('concept_war','válce')]. Jsou určeny během [Concept('concept_diplomatic_play','diplomatické hry')] a jsou stanoveny poté, co válka začala. Každý válečný cíl nárokovaný ve [Concept('concept_peace_deal','mírové smlouvě')] snižuje šanci, že protivník ji přijme, a zvyšuje míru, o kterou musí být jejich [Concept('concept_war_support','válečná podpora')|l] [Concept('concept_war_exhaustion','vyčerpána')] předtím, než bude souhlasit.\n\nPrvní váleční cíl nárokovaný jako součást diplomatické hry je považován za váš [Concept('concept_primary_demand','primární požadavek')|l], a některé diplomatické hry vyžadují, aby byl součástí všech mírových smlouv." # todo: CONCEPT CASE
 concept_controlled_war_goal: "Ovládaný válečný cíl"
 concept_controlled_war_goals: "Ovládané válečné cíle"
 concept_control_war_goal: "Ovládat válečný cíl"
 concept_control_war_goals: "Ovládání válečných cílů"
 concept_controlling_a_war_goal: "Ovládání válečného cíle"
 concept_controlling_war_goals: "Ovládání válečných cílů"
 concept_controlled_war_goal_short: "Ovládán"
 concept_controlling_war_goal_short: "Ovládá"
 concept_control_war_goal_short: "Ovládat"
 concept_controls_war_goal_short: "Ovládá"
 concept_controlled_war_goal_desc: "Pokud držitel [Concept('concept_war_goal','válečného cíle')] (nebo jeho [Concept('concept_ally','spojence')|l]) [Concept('concept_occupation','okupuje')] požadovaný [Concept('concept_state','stát')|l] či [Concept('concept_state','státy')|l], je považován za toho, kdo ovládá tento [Concept('concept_war_goal','válečný cíl')|l]. [Concept('concept_war_support','Válečná podpora')] může klesnout pod #v 0#! pouze pokud opačná strana ovládá všechny své válečné cíle." # todo: CONCEPT CASE
 concept_primary_demand: "Primární požadavek"
 concept_primary_demand_short: "Primární"
 concept_primary_demands: "Primární požadavky"
 concept_primary_demand_desc: "Primární požadavky jsou [Concept('concept_war_goal','válečné cíle')|l], které budou vynuceny na opačné straně [Concept('concept_diplomatic_play','diplomatické hře')], pokud se rozhodne ustoupit. První [Concept('concept_war_goal','válečný cíl')|l] přidaný na každé straně je vždy považován za primární, podobně jako jakékoliv [Concept('concept_war_goal','válečné cíle')|l] přidané proti vůdci opačné strany prostřednictvím [Concept('concept_sway','ovlivňování')|l]." # todo: CONCEPT CASE
 concept_secondary_demand: "Sekundární požadavek"
 concept_secondary_demand_short: "Sekundární"
 concept_secondary_demands: "Sekundární požadavky"
 concept_secondary_demand_desc: "Sekundární požadavky jsou [Concept('concept_war_goal','válečné cíle')|l], které NEBUDOU vymáhány v [Concept('concept_diplomatic_play','diplomatické hře')], pokud se jedna strana rozhodne ustoupit, ale mohou být uplatněny v [Concept('concept_peace_deal','mírové smlouvě')] nebo prostřednictvím kapitulace, pokud se situace vyeskaluje do [Concept('concept_war','války')]. Sekundární požadavek, který cílí na vůdce protistrany, může být převeden na tzv. Primární požadavek tím, že se utratí [Concept('concept_diplomatic_maneuvers','diplomatickými manévry')|l], ačkoli to může mít za následek [Concept('concept_diplomatic_incident','diplomatický incident')|l]." # todo: CONCEPT CASE
 concept_resource_potential: "Potenciál zdrojů"
 concept_resource_potentials: "Potenciály zdrojů"
 concept_resource_potentials_short: "Potenciály"
 concept_resource_potential_desc: "Potenciál zdrojů uděluje schopnost postavit a rozšířit specifický typ [Concept('concept_building','budova')|l] ve státě, obvykle v oblasti těžby surovin, jako je rybolov, doly nebo plantáže. Maximální [Concept('concept_building_level','úroveň budovy')|l], na který můžete budovu rozšířit, je omezena buď pevně stanoveným limitem podle typu suroviny, nebo množstvím [Concept('concept_arable_land','ornou půdou')] ve státě." # todo: CONCEPT CASE
 concept_government: "Vláda"
 concept_governments: "Vlády"
 concept_government_possessive: "Vlády"
 concept_government_desc: "Vláda [Concept('concept_country','země')|l] se skládá z jedné nebo několika [Concept('concept_interest_group','zájmovou skupinou')]. Pokud má země [Concept('concept_votes','volební právo')|l], mohou být tyto zájmové skupiny organizovány do [Concept('concept_party','strany')]. V závislosti na [Concept('concept_law','zákon')] [Concept('concept_country','země')|l] povede tato směs zájmových skupin k vyšší nebo nižší [Concept('concept_legitimacy','legitimitě')] [Concept('concept_government','vládě')].\n\nJakýkoliv nový zákon, který chcete [Concept('concept_enactment_of_laws','schválit')], musí mít určitou podporu mezi zájmovými skupinami, které tvoří [Concept('concept_government','vládu')], pokud to není podporováno aktivním [Concept('concept_political_movement','politickým hnutím')]. Schopnost rychle a bezbolestně prosadit zákon skrze legislativu závisí na tom, jak jednotná je jeho vládní podpora." # todo: CONCEPT CASE
 concept_interest: "Zájem"
 concept_interests: "Zájmy"
 concept_interest_desc: "[Concept('concept_country','Země')], která udržuje zájem v [Concept('concept_strategic_region','strategickém regionu')], dává zbytku světa najevo, že by se mohla zapojit do [Concept('concept_diplomatic_play','diplomatické hry')] probíhajících v dané oblasti. Dostatečně vysoká [Concept('concept_interest_tier','úroveň zájmu')] v strategickém regionu je podmínkou pro možnost zahájit nebo se připojit k diplomatické hře, a nelze [Concept('concept_colony', 'kolonizovat')] [Concept('concept_state_region','státní oblasti')], kde neudržujete dostatečně vysokou úroveň zájmu." # todo: CONCEPT CASE
 concept_involvement: "Zapojení"
 concept_involved: "Zapojen"
 concept_involvement_desc: "Míra $concept_involvement$ [Concept('concept_country','zemi')] v [Concept('concept_strategic_region','strategickém regionu')] měří, jak silný je jejich [Concept('concept_interest','zájem')] v regionu.\n\n$HOW_TO_INCREASE_INVOLVEMENT$" # todo: CONCEPT CASE
 concept_local_country: "Místní země"
 concept_local_countries: "Místní země"
 concept_local_country_short: "Místní"
 concept_local_country_desc: "[Concept('concept_country','Země')] je $concept_local_country_short$ pro [Concept('concept_strategic_region','strategický region')], pokud splňuje některou z následujících podmínek:\n$TAB$• Má svůj [Concept('concept_capital_state','hlavní město')] v regionu\n$TAB$• Má [GetDefine('NDiplomacy', 'REGION_LOCALITY_SHARE_THRESHOLD')|0v%] nebo více [Concept('concept_locality','místnost')] v regionu\n$TAB$• Má [GetDefine('NDiplomacy', 'REGION_LOCALITY_COUNTRY_INCORPORATED_SHARE_THRESHOLD')|0v%] nebo více svých [Concept('concept_incorporated_state', '$concept_incorporated_states$')] v regionu" # todo: CONCEPT CASE
 concept_locality: "Místnost"
 concept_locality_desc: "Míra toho, jak místní je země v [Concept('concept_strategic_region','strategickém regionu')], kterou tvoří kombinace podílu vlastněných [Concept('concept_state','států')], [Concept('concept_pop','populací')] a [Concept('concept_gdp','hrubý domácí produkt')] v daném regionu" # todo: CONCEPT CASE
 concept_interest_tier: "Úroveň zájmu"
 concept_interest_tiers: "Úrovně zájmu"
 concept_interest_tier_short: "Úroveň"
 concept_interest_tier_desc: "[Concept('concept_interest_tier','Úroveň zájmu')] označuje úroveň přítomnosti, kterou má [Concept('concept_country','země')] v [Concept('concept_strategic_region','strategickém regionu')], a může být povýšena zvýšením [Concept('concept_involvement','zapojením')] v daném regionu.\nVyšší úrovně odemykají nové interakce a výhody." # todo: CONCEPT CASE
 concept_diplomatic_relevancy: "Diplomatická relevance" # todo: NEW TRANSLATION
 concept_diplomatically_relevant: "Diplomaticky relevantní" # todo: NEW TRANSLATION
 concept_diplomatically_irrelevant: "Diplomaticky nerelevantní" # todo: NEW TRANSLATION
 concept_diplomatic_relevancy_desc: "Mít $concept_diplomatic_relevancy$ je vyžadováno, aby se [Concept('concept_country','zeměmi')] mohl zapojit do určitých interakcí, jako je podepisování [Concept('concept_treaty','smlouvy')]. Země je považován za diplomaticky relevantní vůči jinému, pokud je splněna některá z následujících podmínek:\n$EFFECT_LIST_BULLET$Mají společnou přímou hranici\n$EFFECT_LIST_BULLET$Mezi nimi leží právě jeden [Concept('concept_sea_node','námořní uzel')]\n$EFFECT_LIST_BULLET$Jeden $concept_country$ sousedí s [Concept('concept_subject','závislou zemí')] druhého\n$EFFECT_LIST_BULLET$Jeden $concept_country_possessive$ závislou zemi sousedí s druhým zemí závislou zemí\n$EFFECT_LIST_BULLET$Existující $concept_treaty$ mezi těmito dvěma zemím\n$EFFECT_LIST_BULLET$Obě $concept_countries$ jsou [Concept('concept_great_power','velmoci')]\n$EFFECT_LIST_BULLET$Jeden z zemí vyhlásí [Concept('concept_rivalry','rivality')] vůči druhému\n$EFFECT_LIST_BULLET$Jeden z zemí provádí [Concept('concept_piracy','pirátů')] cílenou proti druhému\n$EFFECT_LIST_BULLET$Obě $concept_countries$ mají překrývající se [Concept('concept_interest','zájmem')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 concept_strategic_adjacency: "Strategická sousednost" # todo: NEW TRANSLATION
 concept_strategically_adjacent: "Strategicky sousední" # todo: NEW TRANSLATION
 concept_strategic_adjacency_desc: "Strategická sousednost je kontrola přilehlosti mezi dvěma [Concept('concept_country','zemím')], která se používá k povolení určitých interakcí mezi nimi, pokud jsou splněny podmínky. Dvě $concept_countries$ se považují za strategicky sousední, pokud je splněna některá z těchto podmínek:\n$EFFECT_LIST_BULLET$Mají společnou přímou hranici\n$EFFECT_LIST_BULLET$Mezi nimi leží právě jeden [Concept('concept_sea_node','námořní uzel')]\n$EFFECT_LIST_BULLET$Jeden $concept_country$ sousedí s [Concept('concept_subject','závislou zemí')] druhého\n$EFFECT_LIST_BULLET$Jeden $concept_country_possessive$ závislou zemi sousedí s druhým zemí závislou zemí\n$EFFECT_LIST_BULLET$Jeden $concept_country$ sousedí s neprosazeným [Concept('concept_war_goal','válečným cílem')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 concept_obligation: "Závazek"
 concept_obligations: "Závazky"
 concept_obligated: "Zavázaný"
 concept_obligation_desc: "Jedna [Concept('concept_country','země')|l] může být zavázaná vůči jiné v důsledku dohod uzavřených během [Concept('concept_diplomatic_play','diplomatické hry')] nebo pokud jedna země převezme [Concept('concept_loans','půjčky')|l] té druhé. Být zavázán vůči zemi znamená, že nemůžete začít diplomatickou hru proti ní ani se k ni přidat na opačné straně, jako je ona. Druhá země může využít závazek, který má, k vynucení [Concept('concept_diplomatic_pact','diplomatickému paktu')] nebo [Concept('concept_treaty','smlouvě')], případně ji zrušit, aby vás [Concept('concept_sway','přiměl')] k podpoře v diplomatické hře nebo zvýšil vzájemné [Concept('concept_relations','vztahy')|l]." # todo: CONCEPT CASE
 concept_gdp: "Hrubý domácí produkt"
 concept_gdp_short: "HDP"
 concept_gdp_desc: "Každá jednotka [Concept('concept_good_production','vyprodukovaného')|l] [Concept('concept_good','zboží')|l] ve vaší [Concept('concept_country','zemi')] přispívá k vašemu [Concept('concept_gdp','HDP')]. [Concept('concept_market_price','Tržní cena')] vaší národní produkce je snížena hodnotou zboží, které slouží jako vstup do procesu.\n\nHDP ovlivňuje [Concept('concept_prestige','prestiž')|l] a [Concept('concept_budget_minting','ražbu mincí')]." # todo: CONCEPT CASE
 concept_gdp_per_capita: "Hrubý domácí produkt na osobu"
 concept_gdp_per_capita_short: "HDP na osobu"
 concept_gdp_per_capita_desc: "[Concept('concept_gdp','Hrubý domácí produkt')] vaší země dělený její celkovou [Concept('concept_pop','populaci')]." # todo: CONCEPT CASE
 concept_gdp_ownership: "Vlastnictví HDP"
 concept_gdp_ownership_desc: "[Concept('concept_gdp','Hrubý domácí produkt')] [Concept('concept_country','Země')] může být vlastněno jak domácími subjekty samotné země, tak i cizími vlastníky z jiných zemí. Pokud má jiná země [Concept('concept_foreign_investment_rights','práva na investice')|l], může jako cizí vlastník vlastnit [Concept('concept_building_level','úrovně budov')] v původní zemi. HDP generované z těchto budov se pak připočítává k cizímu  HDP země. Pouze $concept_gdp_short$ vlastněno domácími subjekty přispívá k domácí [Concept('concept_prestige','prestiži')] a [Concept('concept_budget_minting','ražbě mincí')]." # todo: CONCEPT CASE
 concept_education_access: "Přístup k vzdělání"
 concept_education_access_desc: "Stupeň, do jakého může [Concept('concept_pop','populace')|l] získat vzdělání pro své děti. Jak se nové generace rodí a jsou vychovávány, [Concept('concept_literacy','gramotnost')|l] [Concept('concept_pop','populace')|l] se posune směrem k úrovni přístupu k vzdělání." # todo: CONCEPT CASE
 concept_isolated_state: "Izolovaný státní region"
 concept_isolated_states: "Izolované státy"
 concept_isolated_state_short: "Izolovaný"
 concept_isolated_state_desc: "[Concept('concept_state_region','Státní oblast')] je považován za izolovaný od jeho [Concept('concept_market','trhu')], pokud není po souši propojen se svým [Concept('concept_market_capital','hlavním centrem trhu')] a zároveň není po souši propojen s budovou [SelectLocalization(GetPlayer.IsValid,'concept_isolated_state_desc_added','Přístav')], která by mohla navázat [Concept('concept_port_connection','přístavní spojení')|l] se svím [Concept('concept_market_capital','hlavním centrem trhu')]. Izolované státy nevytváří žádné [Concept('concept_buy_orders','nákupní objednávky')|l] ani [Concept('concept_sell_orders','prodejní objednávky')|l], a [Concept('concept_local_price','místní cena')|l] [Concept('concept_good','zboží')|l] v nich není ovlivněna [Concept('concept_market_price','tržní cenou')]." # todo: CONCEPT CASE
 concept_isolated_state_desc_added: "[GetBuildingType('building_port').GetName]"
 concept_shortage: "Nedostatek"
 concept_shortages: "Nedostatky"
 concept_input_goods_shortage: "Nedostatek vstupního zboží"
 concept_input_goods_shortages: "Nedostatek vstupních zboží"
 concept_shortage_desc: "Pokud je nabídka [Concept('concept_good','zboží')|l] menší než [GetDefine('NEconomy', 'GOODS_SHORTAGE_PENALTY_THRESHOLD')|v%0] z jeho poptávky, je dané zboží považováno za nedostatkové. Během nedostatku mohou být aplikovány různé penalizace v závislosti na tom, jak je zboží používáno.\n\nZboží použité jako [Concept('concept_good_consumption','vstupní zboží')|l] pro [Concept('concept_building','budovu')|l] povede k rostoucí penalizaci podle závažnosti nedostatku.\n\nV případě [Concept('concept_pop_needs','potřebách populace')] [GetPopNeed('popneed_basic_food').GetName] bude mít nedostatek vliv na [Concept('concept_starvation','potravinovou bezpečnost')] v tomto [Concept('concept_state','státě')], což může vést k [Concept('concept_starvation','hladování')], a dokonce i k [Concept('concept_famine','hladomoru')]. Nedostatky [GetPopNeed('popneed_basic_food').GetName] vychází z úrovně nedostatku u jednotlivých druhů zboží, které tuto potřebu pokrývají.\n\nNedostatky jsou obvykle způsobeny nedostatečnou dostupností zboží na příslušném [Concept('concept_market','trhu')], ale mohou být také důsledkem nízkého [Concept('concept_market_access','přístupu na trh')] v daném státě." # todo: CONCEPT CASE
 concept_market: "Trh"
 concept_markets: "Trhy"
 concept_market_possessive: "Trhu"
 concept_market_desc: "Všechny [Concept('concept_state','státy')|l] ve stejném trhu spolu obchodují se [Concept('concept_good','zbožím')], pokud nejsou [Concept('concept_isolated_state','izolovány')]. Jak dobře jsou tyto státy vzájemně propojeny, se měří jejich [Concept('concept_market_access','přístupem na trh')]. Trhy mohou také obchodovat mezi sebou přes [Concept('concept_world_market','světový trh')|l].\n\nKaždá [Concept('concept_country','země')|l] buď ovládá svůj vlastní trh, nebo se účastní jiného prostřednictvím [Concept('concept_customs_union','celní unie')|l] nebo jako [Concept('concept_subject','závislé země')|l]." # todo: CONCEPT CASE
 concept_world_market: "Světový trh"
 concept_world_market_desc: "Světový trh slouží jako místo pro autonomní [Concept('concept_trade','obchod')|l]. Cena [Concept('concept_good','zboží')|l] je určována množstvím dovozu a vývozu. [Concept('concept_state','Stát')] potřebují [Concept('concept_market_access','přístup na trh')], aby mohly obchodovat přes svoji budovu [GetBuildingType('building_trade_center').GetName]. Země bez přístupu k moři mohou získat práva tranzitu od jiných zemí, aby si zajistily přístup na světový trh." # todo: CONCEPT CASE
 concept_market_access: "Přístup na trh"
 concept_market_access_desc: "Míra propojení [Concept('concept_state','státu')] s ostatními částmi svého trhu. Začíná na 100 % a úměrně se snižuje, když je [Concept('concept_infrastructure_usage','využití infrastruktury')|l] vyšší než dostupná [Concept('concept_infrastructure','infrastruktura')|l]. Ovlivňuje počet [Concept('concept_sell_orders','prodejních')] a [Concept('concept_buy_orders','nákupních objednávek')] vyplývajících z [Concept('concept_good_production','výroby')] a [Concept('concept_good_consumption','spotřeby')], a také vliv [Concept('concept_market_price','tržní ceny')] na [Concept('concept_local_price','místní cenu')] [Concept('concept_good','zboží')|l]." # todo: CONCEPT CASE
 concept_world_market_access: "Přístup na světový trh"
 concept_world_market_access_desc: "Přístup na světový trh existuje, pokud má [Concept('concept_state','stát')|l] propojení na [Concept('concept_world_market','světový trh')|l] přes [Concept('concept_world_market_hub','centrum světový trhu')|l]. Je ovlivněn státním [Concept('concept_market_access', 'přístupem na trh')]." # todo: CONCEPT CASE
 concept_world_market_hub: "Centrum světového trhu"
 concept_world_market_hubs: "Centra světového trhu"
 concept_world_market_hub_short: "Centrum"
 concept_world_market_hubs_short: "Centra"
 concept_world_market_hub_desc: "Centrum světového trhu je místo, odkud se řídí [Concept('concept_trade','obchodem')|l] přes [Concept('concept_world_market','světový trh')|l]. Vzniká, pokud má [Concept('concept_market_area','oblast trhu')|l] alespoň jednu budovu [GetBuildingType('building_port').GetName]. Umístění centra světového trhu se může měnit v závislosti na úrovni budovy [GetBuildingType('building_port').GetName] a [Concept('concept_gdp','HDP')] [Concept('concept_state','země')]." # todo: CONCEPT CASE
 concept_infrastructure: "Infrastruktura"
 concept_infrastructure_desc: "Infrastruktura je poskytována [Concept('concept_building','budovami')] jako [SelectLocalization(GetPlayer.IsValid,'concept_infrastructure_desc_added','Železnice')] a [SelectLocalization(GetPlayer.IsValid,'concept_infrastructure_desc_added_2','Přístav')]. Ovlivňuje, jak dobře je [Concept('concept_state','stát')|l] propojen s jeho [Concept('concept_market','trhem')], a jak rychle se [Concept('concept_battalion','praporem')|l] [Concept('concept_mobilize_battalion','mobilizovat praporem')]." # todo: CONCEPT CASE
 concept_infrastructure_desc_added: "[GetBuildingType('building_railway').GetName]"
 concept_infrastructure_desc_added_2: "[GetBuildingType('building_port').GetName]"
 concept_infrastructure_usage: "Využití infrastruktury"
 concept_infrastructure_usage_desc: "[Concept('concept_building','Budova')] využívají určité množství [Concept('concept_infrastructure','infrastruktury')] v závislosti na tom, jak technologicky vyspělé nebo náročné jsou. Celkové využití infrastruktury v [Concept('concept_state','státě')] se porovnává s infrastrukturou, aby se určil [Concept('concept_market_access','přístup na trh')|l] pro daný [Concept('concept_state','stát')|l]. Využití infrastruktury také zvyšuje náklady na [Concept('concept_port_connection','přístavní spojení')|l]." # todo: CONCEPT CASE
 concept_good: "Zboží"
 concept_goods: "Zboží"
 concept_good_possessive: "zboží"
 concept_goods_input: "Vstupní zboží"
 concept_goods_output: "Výstupní zboží"
 concept_good_desc: "Zboží je [Concept('concept_good_production','vyprodukováno')] v [Concept('concept_building','budově')] a [Concept('concept_good_consumption','spotřebováno')|l] budovama a [Concept('concept_pop','populací')]. Zboží mají jak [Concept('concept_local_price','místní cenu')], tak [Concept('concept_market_price','tržní cenu')]." # todo: CONCEPT CASE
 concept_prestige_good: "Prestižní zboží"
 concept_prestige_good_short: "Prestiž"
 concept_prestige_goods: "Prestižní zboží"
 concept_prestige_good_desc: "[Concept('concept_good','Zboží')], které je považováno za prestižní a vyšší kvality. Prestižní zboží vyrábějí některé [Concept('concept_company','společnosti')|l] s dostatečnou [Concept('concept_prosperity','prosperitou')]. Být hlavním producentem prestižního zboží přináší významnou [Concept('concept_prestige','prestiž')|l].\n\nNavíc prestižní zboží poskytuje tyto výhody:\n$EFFECT_LIST_BULLET$ Zvýšenou [Concept('concept_good_consumption','spotřebu')] u [Concept('concept_pop','populací')|l] ve srovnání s ostatním zbožím\n$EFFECT_LIST_BULLET$ Zvýšenou [Concept('concept_trade_advantage','obchodní výhodou')] pro [Concept('concept_trade','vývozy')|l]\n$EFFECT_LIST_BULLET$ Zvýšenou [Concept('concept_throughput','efektivitu')] pro [Concept('concept_building','průmysly')|l], které je využívají jako vstupní zboží\n$EFFECT_LIST_BULLET$ Zvýšený [Concept('concept_offense','útok')|l] a [Concept('concept_defense','obrana')|l] u [Concept('concept_unit','vojenské jednotky')], které je spotřebovávají jako zásoby" # todo: CONCEPT CASE
 concept_government_good: "Vládní zboží"
 concept_government_goods: "Vládní zboží"
 concept_government_good_desc: "[Concept('concept_good','Zboží')] [Concept('concept_good_consumption','spotřebováno')] [Concept('concept_government_building','Vládní budova')], využívajíc prostředky z [Concept('concept_treasury','státní pokladny')]." # todo: CONCEPT CASE
 concept_military_good: "Vojenské zboží"
 concept_military_goods: "Vojenské zboží"
 concept_military_good_desc: "[Concept('concept_good','Zboží')] [Concept('concept_good_consumption','Spotřebováno')|l] [Concept('concept_military_building','Vojenská budova')] za pomocí prostředků ze [Concept('concept_treasury','státní pokladny')]." # todo: CONCEPT CASE
 concept_state: "Stát"
 concept_states: "Státy"
 concept_state_or_states: "Stát(y)"
 concept_state_possessive: "Státu"
 concept_state_desc: "Geografická oblast kontrolovaná [Concept('concept_country','zemí')]. Zde [Concept('concept_pop','populace')|l] žijí a pracují v jednotlivých [Concept('concept_building','budovách')] daného státu. Pokud nejde o [Concept('concept_split_state','rozdělený stát')|l], jeho území je to samé jako [Concept('concept_state_region','státní oblast')|l]. Není-li to [Concept('concept_isolated_state','izolovaný')|l] stát, bude obchodovat s jakýmkoliv [Concept('concept_good','zboží')|l], které je lokálně [Concept('concept_good_consumption','spotřebováno')|l] a [Concept('concept_good_production','vyprodukováno')|l], s ostatními státy na stejném [Concept('concept_market','trhu')], přičemž rozsah obchodování závisí na jeho [Concept('concept_market_access','přístup na trh')]." # todo: CONCEPT CASE
 concept_home_state: "Domácí stát"
 concept_home_state_desc: "[Concept('concept_character','Postava')] Domácí stát je [Concept('concept_state','stát')], ze kterého pochází. Obvykle, ale ne vždy, je součástí [Concept('concept_country','zeměmi')], ve kterém postavě žije. [Concept('concept_magnate','Magnát')] $concept_magnate_holding_desc$." # todo: CONCEPT CASE
 concept_pop: "Populace"
 concept_pops: "Populace"
 concept_pop_possessive: "Populace"
 concept_pops_possessive: "populací"
 concept_population: "Populace"
 concept_pop_desc: "Světová populace je organizována do Populací, skupin jednotlivců, kteří pracují v téže [Concept('concept_building','budově')] v určité [Concept('concept_profession','profesích')], a sdílejí stejnou [Concept('concept_culture','kulturu')] a [Concept('concept_religion','náboženství')|l]. Používají [Concept('concept_pop_income','příjem')|l], který vydělávají, na nákup [Concept('concept_good','zboží')|l] pro uspokojení svých [Concept('concept_pop_needs','potřeby populace')], které zasa určuje jejich [Concept('concept_wealth','bohatství')|l] a [Concept('concept_sol','životní standard')|l]. Mohou podporovat [Concept('concept_interest_group','zájmové skupiny')|l] a [Concept('concept_political_movement','politická hnutí')|l], nebo být [Concept('concept_politically_unaligned_aligned','politicky neangažováni')|l]. Populace pozůstáva z [Concept('concept_working_adults','pracujících dospělých')] a ze [Concept('concept_dependents','závislých osob')]. Část z nich je [Concept('concept_literacy','gramotná')], a mohou být buďto [Concept('concept_loyalist','loajální')], nebo [Concept('concept_radical','radikální')]." # todo: CONCEPT CASE
 concept_profession: "Profese"
 concept_profession_jobs: "Práce"
 concept_professions: "Profese"
 concept_profession_desc: "Profese [Concept('concept_pop','Populace')|l] určuje, kterou roli vykonávají ve své [Concept('concept_building','budově')], jak velkou [Concept('concept_building_wage','mzdu')] obdrží, a zda vní dostanou [Concept('concept_ownership_share','podíly na vlastnictví')|l]. Ovlivňuje také, kterou [Concept('concept_interest_group','zájmovou skupinu')] pravděpodobně podpoří, jak pravděpodobné je, že zůstanou [Concept('concept_politically_unaligned_aligned','politicky neangažováni')|l], a zda jsou považováni za [Concept('concept_lower_strata','nižší třídu')], [Concept('concept_middle_strata','střední třídu')], nebo [Concept('concept_upper_strata','vyšší třídu')]. Aby změnily profesi, populace musí mít příslušnou [Concept('concept_pop_qualifications','kvalifikaci')]." # todo: CONCEPT CASE
 concept_production_method: "Výrobní metoda"
 concept_production_methods: "Výrobní metody"
 concept_production_method_desc: "Výrobní metody určují, jak [Concept('concept_building','budovy')|l] fungují. Ovlivňují\n\n- [Concept('concept_good_consumption','vstupní zboží')], které musí budova zakoupit pro svou funkci\n- [Concept('concept_good_production','výstupní zboží')] které budova vyrábí a prodává\n- Rozdělení [Concept('concept_profession','profesí')] mezi svou [Concept('concept_workforce','pracovní silou')]\n\nVýrobní metody mohou mít také další účinky, jako je generování [Concept('concept_modifier','modifikátorů')]. Výrobní metody jsou organizovány do skupin, v nichž může být v aktivním stavu pouze jedna. Můžete přepínat, která výrobní metoda je aktivní v každé skupině, pokud splňujete požadavky na [Concept('concept_technology','technologie')|l] a [Concept('concept_law','zákon')|l]." # todo: CONCEPT CASE
 concept_nation_formation: "Vytvoření národa"
 concept_nation_formations: "Národní formace"
 concept_nation_formation_short_past: "Vytvořeno"
 concept_nation_formation_short_present: "Vytvořit"
 concept_nation_formation_desc: "Pokud [Concept('concept_country','země')|l] splňuje určité požadavky, jako je vlastnění půdy ve specifických [Concept('concept_state_region','státní oblasti')] a/nebo má určité [Concept('concept_technology','technologií')|l] z kategorie $SOCIETY$, může být schopna vytvořit novou zemi s vyšším [Concept('concept_country_tier','postavením země')]. Možné [Concept('concept_countries','zeměmi')|l] jsou uvedeny na kartě #b $NATION_FORMATION$#! v panelu #b $CULTURE$#!." # todo: CONCEPT CASE
 concept_culture: "Kultura"
 concept_cultures: "Kultury"
 concept_culture_possessive: "Kultury"
 concept_cultural: "Kulturní"
 concept_culture_desc: "Všechny [Concept('concept_pop','populace')|l] mají kulturu, která se může změnit pouze prostřednictvím [Concept('concept_assimilation','asimilace')|l]. Jejich kultura určuje, které [Concept('concept_state_region','státní oblasti')|l] považují za své [Concept('concept_homeland','domovinu')|l] a ovlivňuje jejich [Concept('concept_acceptance_status','status přijetí')|l] v [Concept('concept_country','zemích')]." # todo: CONCEPT CASE
 concept_accepted_culture: "Akceptována kultura"
 concept_accepted_cultures: "Akceptované kultury"
 concept_accepted_culture_short: "Akceptovaná"
 concept_accepted_culture_desc: "Akceptované kultury v [Concept('concept_country','zemích')] pozůstává z její [Concept('concept_primary_cultures','přimární kultury')] plus jakékoliv jiné [Concept('concept_culture','kultury')|l] považované za akceptované [Concept('concept_culture','kulturu')|l] vzhledem k aktuálnímu [Concept('concept_law', 'zákonu')] pro [SelectLocalization(GetPlayer.IsValid, 'concept_accepted_culture_desc_added','Občanství')]. Obvykle dva nejvyšší stupně v [Concept('concept_acceptance','přijetí')|l] jsou považována za [Concept('concept_accepted_culture', 'akceptovanou kulturu')]." # todo: CONCEPT CASE
 concept_accepted_culture_desc_added: " [GetLawType('law_national_supremacy').GetGroup.GetName]"
 concept_primary_cultures: "Primární kultury"
 concept_primary_culture: "Primární kultura"
 concept_primary_cultures_desc: "[Concept('concept_culture','Kultura')] nebo kultury, s nimiž je [Concept('concept_country','národný stát')|l] převážně spojenej. Pokud země  [Concept('concept_nation_formation','vytvoří jinou')] zemi, její primární kultura se může změnit, jinak zůstane stejná.[ConcatIfNeitherEmpty('\n\n', AddLocalizationIf(GetPlayer.IsValid,'concept_primary_cultures_ingame_added'))]" # todo: CONCEPT CASE
 concept_primary_cultures_ingame_added: "Primární kultury v [GetPlayer.GetAltAdjective('L')] jsou [GetPlayer.GetPrimaryCulturesDesc]." # todo: CONCEPT CASE
 concept_discrimination_trait: "Diskriminační rys"
 concept_discrimination_traits: "Diskriminační rysy"
 concept_discrimination_trait_short: "Rys"
 concept_discrimination_traits_short: "Rysy"
 concept_cultural_trait: "Kulturní znak"
 concept_cultural_traits: "Kulturní vlastnosti"
 concept_religious_trait: "Náboženský rys"
 concept_religious_traits: "Náboženské rysy"
 concept_discrimination_trait_desc: "Aspekty [Concept('concept_culture','kultura')] nebo [Concept('concept_religion','náboženství')], které určují, jak [Concept('concept_acceptance_status','přijatý')] [Concept('concept_pop','populace')] této kultuře nebo $concept_religion$ jsou v závislosti na tom, jak jsou podobné [Concept('concept_primary_cultures','primární kultura')] a [Concept('concept_state_religion','státní náboženství')] $concept_country$ a jaký [GetLawType('law_national_supremacy').GetGroup.GetName] [Concept('concept_law','zákon')] $concept_country$ aktuálně má.\n\nPro kulturu jsou těmito aspekty [Concept('concept_heritage_trait','původ')], [Concept('concept_language_trait','jazyk')] a jakékoli [Concept('concept_tradition_trait','tradice')], které může mít. Náboženství má pouze $concept_heritage_trait$.\n\nPůvod a $concept_language_traits$ také patří do širších [Concept('concept_discrimination_trait_group','skupiny diskriminačních vlastností')] podobných rysů." # todo: CONCEPT CASE
 concept_discrimination_trait_group: "Skupina diskriminačních vlastností"
 concept_discrimination_trait_groups: "Skupiny diskriminačních vlastností"
 concept_discrimination_trait_group_short: "Skupina rysů"
 concept_discrimination_trait_groups_short: "Skupiny rysů"
 concept_discrimination_trait_group_short_short: "Skupina"
 concept_discrimination_trait_groups_short_short: "Skupiny"
 concept_discrimination_trait_group_desc: "Skupina diskriminačních vlastností je širší soubor [Concept('concept_discrimination_trait','diskriminační rysy')], které nějakým způsobem sdílejí společný původ, díky čemuž jsou rozpoznatelnější a více přijímané [Concept('concept_pop','populace')] stejného skupiny rysů." # todo: CONCEPT CASE
 concept_heritage_trait: "Rys původu"
 concept_heritage_traits: "Rysy původu"
 concept_heritage_trait_short: "Původ"
 concept_heritage_traits_short: "Původy"
 concept_heritage_trait_group: "Skupina rysů původu"
 concept_heritage_trait_groups: "Skupiny rysů původu"
 concept_heritage_trait_group_short: "Skupina původu"
 concept_heritage_trait_groups_short: "Skupiny původu"
 concept_heritage_trait_desc: "Původ [Concept('concept_discrimination_trait','diskriminační rys')] představují původ nebo základy [Concept('concept_culture','kultura')] nebo [Concept('concept_religion','náboženství')]. Také patří do [Concept('concept_discrimination_trait_group','skupiny rysů')], širší rodiny podobných původů." # todo: CONCEPT CASE
 concept_language_trait: "Jazykový rys"
 concept_language_traits: "Jazykové rysy"
 concept_language_trait_short: "Jazyk"
 concept_language_traits_short: "Jazyky"
 concept_language_trait_group: "Skupina jazykových rysů"
 concept_language_trait_groups: "Skupiny jazykových rysů"
 concept_language_trait_group_short: "Skupina jazyků"
 concept_language_trait_groups_short: "Skupiny jazyků"
 concept_language_trait_desc: "Jazyk [Concept('concept_discrimination_trait','Diskriminační rys')] představují $concept_language_traits_short$ úzce spojené s [Concept('concept_culture','kulturou')]. Také patří do [Concept('concept_discrimination_trait_group','skupiny rysů')], širší rodiny podobných jazyků." # todo: CONCEPT CASE
 concept_tradition_trait: "Rys tradice"
 concept_tradition_traits: "Rysy tradice"
 concept_tradition_trait_short: "Tradice"
 concept_tradition_traits_short: "Tradice"
 concept_tradition_trait_desc: "Tradice [Concept('concept_discrimination_trait','Diskriminační rys')] jsou rituály, myšlenky a zvyky, které mohou [Concept('concept_culture','kultury')] držet nebo si je časem osvojit a které mohou být rozpoznatelné i přes velmi odlišné [Concept('concept_heritage_trait','původy')] nebo [Concept('concept_language_trait','jazyk')]. Na rozdíl od [Concept('concept_heritage_trait','rysu původu')] a [Concept('concept_language_trait','jazykového rysu')] tradic nepatří do žádné [Concept('concept_discrimination_trait_group','skupiny rysů')]." # todo: CONCEPT CASE
 concept_religion: "Náboženství"
 concept_religions: "Náboženství"
 concept_religious: "Náboženské"
 concept_religion_desc: "Všechny [Concept('concept_pop','populace')|l] mají naboženství, které se dá změnit pouze pomocí [Concept('concept_conversion','konverze')|l]. Jejich náboženství ovlivňuje také jejich [Concept('concept_acceptance_status','status přijetí')|l] v jejich [Concept('concept_country','zemi')]." # todo: CONCEPT CASE
 concept_accepted_religion: "Přijaté náboženství"
 concept_accepted_religions: "Přijaté náboženství"
 concept_accepted_religion_short: "Přijaté"
 concept_accepted_religion_desc: "Přijaté náboženství [Concept('concept_country','země')] zahrnuje jejich [Concept('concept_state_religion','státní náboženství')] plus jakákoli další [Concept('concept_religion','náboženství')|l] považovaná za přijatým vzhledem k aktuálnímu [Concept('concept_law', 'zákonu')] pro [SelectLocalization(GetPlayer.IsValid,'concept_accepted_religion_desc_added','Církev a stát')]." # todo: CONCEPT CASE
 concept_accepted_religion_desc_added: "[GetLawType('law_state_religion').GetGroup.GetName]"
 concept_state_religion: "Státní náboženství"
 concept_state_religions: "Státní náboženství"
 concept_state_religion_desc: "[Concept('concept_religion','Náboženství')] nejvíce spojované se [Concept('concept_country','zeměmi')]. Obvykle jde o převládající [Concept('concept_religion','náboženství')|l], ke kterému se hlásí většina její [Concept('concept_pop','populace')|l], ale někdy může být určeno zákonem nebo jednoduše odrážet preferenci [Concept('concept_ruler','vládce')|l]. Obvykle se nemění.[AddLocalizationIf(GetPlayer.IsValid, 'concept_state_religion_ingame_added')]" # todo: CONCEPT CASE
 concept_state_religion_ingame_added: "\n\nStátní náboženství pro [GetPlayer.GetName] je [GetPlayer.GetStateReligion.GetName]." # todo: CONCEPT CASE
 concept_investment_pool: "Investiční fond"
 concept_investment_pool_desc: "[Concept('concept_reinvestment','Reinvestice')] od [Concept('concept_pop','populací')|l], která [Concept('concept_privately_owned','soukromě vlastní')] [Concept('concept_building','budovy')|l] je ukládáno do investičního fondu, kde ho populace využívá pro [Concept('concept_private_construction','soukromou výstavbu')] a nákup [Concept('concept_building_level','úrovní budov')] označených pro [Concept('concept_privatize','privatizaci')].\n\nObvykle investiční fond využívají $ARISTOCRATS_GC_LINK$ a $CAPITALISTS_GC_LINK$ v budovách $MANOR_HOUSES_GC_LINK$ a $FINANCIAL_DISTRICTS_GC_LINK$, ale v závislosti od toho, jaký je váš $ECONOMIC_SYSTEM_GC_LINK$, ho může využívat i [Concept('concept_workforce','pracovní síla')|l] pro rozšíření své vlastní budovy.\n\n$ECONOMIC_SYSTEM_GC_LINK$ v [Concept('concept_country','zemích')|l] určuje, které budovy mohou být stavěny pomocí investičního fondu.\n\nJak [Concept('concept_construction','výstavba')|l] takových budov probíhá, potřebné prostředky k jejich vybudování se odečítají z investičního fondu a ukládají se do [Concept('concept_treasury','státní pokladny')] jako [Concept('concept_budget_investment_income','převod investičního fondu')|l]." # todo: CONCEPT CASE
 concept_reinvestment: "Reinvestice"
 concept_reinvestment_desc: "Část [Concept('concept_dividends','dividend')] shromážďována jistými [Concept('concept_profession','profesemi')] je investováná zpátky do ekonomiky, přidávajíc [Concept('concept_money','peníze')|l] do [Concept('concept_investment_pool','investičního fondu')]. Přidané množství závisí na faktorech jako aktuální $ECONOMIC_SYSTEM_GC_LINK$ [Concept('concept_country','země')], stejně jako její [Concept('concept_gdp','hrubý domácí produkt')|l], s neefektivitou ve velkých ekonomikách, která vede k tomu, že část investic je promarněna." # todo: CONCEPT CASE
 concept_pop_income: "Příjem populace"
 concept_pop_income_short: "Příjem"
 concept_pop_income_expenses: "Výdaje populace"
 concept_pop_income_expenses_short: "Výdaje"
 concept_pop_income_desc: "Na konci každého týdne [Concept('concept_pop','populací')|l] dostane příjem na základě velikosti jejich [Concept('concept_workforce','populace')|l] a aktuální [Concept('concept_building_wage','mzdě')], plus množství jejich [Concept('concept_dependents','závislých osob')] a množství [Concept('concept_dependent_income','příjmu závislých osob')], které vyberou. Tento příjem je vynakládán na [Concept('concept_pop_needs','potřeby populace')|l], což ovlivňuje [Concept('concept_wealth','bohatství')|l] [Concept('concept_pop','populace')|l]." # todo: CONCEPT CASE
 concept_dependent_income: "Dávky závislých osob"
 concept_dependent_income_desc: "Na konci každého týdne získává [Concept('concept_pop','populace')|l] tzv. Dávky závislých osob na základě počtu svých [Concept('concept_dependents','závislých osob')] a výše příjmů, na které mají nárok. Většina závislých osob získává základní příjem z příležitostných prací v závislosti na [Concept('concept_profession','profesi')], který lze doplnit pomocí [Concept('concept_institution','institucí')|l] [SelectLocalization(GetPlayer.IsValid,'concept_dependent_income_desc_added','Sociální zabezpečení')]." # todo: CONCEPT CASE
 concept_dependent_income_desc_added: "[GetInstitutionType('institution_social_security').GetName]"
 concept_wealth: "Bohatství"
 concept_wealthy: "Bohatí"
 concept_wealth_desc: "Měřící hodnota materiálních aktiv [Concept('concept_pop','populace')|l]. K udržení určité úrovně bohatství musí populace uspokojit řadu [Concept('concept_pop_needs','potřeby populace')] každý týden. Pokud jejich [Concept('concept_pop_income','příjem')|l] nepokryje náklady na tyto potřeby, jejich bohatství se nakonec sníží. Pokud mají po zakoupení potřebného zboží zbylé [Concept('concept_money','peníze')|l], jejich bohatství se brzy zvýší.\n\nBohatství je hlavním faktorem, který přispívá k [Concept('concept_sol','životnému standardu')] populace a v souladu s určitými [Concept('concept_law','zákony')|l] může ovlivnit i další aspekty jejich života, jako [Concept('concept_literacy','gramotnost')|l] a [Concept('concept_votes','volební právo')|l]." # todo: CONCEPT CASE
 concept_innovation: "Inovace"
 concept_innovation_desc: "@innovation!Inovace je produkována v budově [SelectLocalization(GetPlayer.IsValid,'concept_innovation_desc_added','Univerzita')] a přispívá k aktivnímu pokroku výzkumu [Concept('concept_technology','technologiím')]. Nepřirazené @innovation! inovace zvýší [Concept('concept_technology_spread','šíření technologií')|l], pokud z nějakého aktuálně máte prospěch." # todo: CONCEPT CASE
 concept_innovation_desc_added: "[GetBuildingType('building_university').GetName]"
 concept_technology_spread: "Šíření technologií"
 concept_technology_spread_desc: "Jedna [Concept('concept_technology','technologie')|l], kterou jste ještě nezískali z každé kategorie (#b $PRODUCTION_NO_CONCEPT$#!, #b $MILITARY$#! a #b $SOCIETY$#!), se k vám vždy šíří od [Concept('concept_country','zemí')], které je již získaly. Pokrok, který získáte při šíření technologii, je každý týden náhodně generován kolem základní hodnoty v závislosti na [Concept('concept_literacy','gramotnost')] vaši země. Pokud žádná země ještě nevynalezla určitou technologii, tak se k vám nemůže šířit, proto je je pravděpodobnější, že díky šíření technologií získáte technologii z dřívějších [Concept('concept_technology_era','technologické éry')] než pozdějších." # todo: CONCEPT CASE
 concept_technology_era: "Technologická éra"
 concept_technology_era_short: "Éra"
 concept_technology_eras_short: "Éry"
 concept_technology_era_ahead_of_time_penalty_desc: "Pokud ještě nemáte všechny technologie z předchozích ér, požadované množství se bude dále zvyšovat."
 concept_technology_era_desc: "Éry pro [Concept('concept_technology','technologie')|l] jsou hrubou klasifikací, ve které době byla nějaká myšlenka poprvé objevena nebo vyvinuta.\n\nVynálezy #b $concept_technology_eras_short$ I#! byly dobře známé v mnoha částech světa před rokem 1836.\nVynálezy #b $concept_technology_eras_short$ II#! jsou spojovány s první průmyslovou revolucí (1836 do poloviny 19. století).\n#b Éra III#! je obdobím evoluce, stabilizace a standardizace, které trvá až do konce 19. století.\n#b Éra IV#! odpovídá druhé průmyslové revoluci kolem přelomu století.\nVynálezy #b $concept_technology_eras_short$ V#! jsou transformativní, moderní myšlenky.\n\nTechnologie vyžadují více [Concept('concept_innovation','inovace')|l] pro jejich objevení v pozdějších érach. $concept_technology_era_ahead_of_time_penalty_desc$" # todo: CONCEPT CASE
 concept_technology: "Technologie"
 concept_technologies: "Technologie"
 concept_technology_desc: "Technologie pokrývá veškeré inovace v oblastech #b $PRODUCTION_NO_CONCEPT$#!, #b $MILITARY$#!, a #b $SOCIETY$#!. Technologie mají celonárodní účinky, které mohou sahat od změny provozních parametrů v [Concept('concept_country','zemích')|l] prostřednictvím [Concept('concept_modifier','modifikátoru')] až po odemykání nových [Concept('concept_production_method','výrobní metodě')], [Concept('concept_building','budovách')], [Concept('concept_law','zákonech')], [Concept('concept_decree','dekretách')] a [Concept('concept_diplomatic_pact','diplomatickém paktu')].\n\nPokrok směrem k novým technologiím je dosažen prostřednictvím [Concept('concept_innovation','inovace')|l], která je primárně produkována budovou [SelectLocalization(GetPlayer.IsValid,'concept_technology_desc_added','Univerzitou')]. Kromě pokroku z inovací se mohou technologie šířit ze zemí, které je již mají, k těm, které je nemají, prostřednictvím [Concept('concept_technology_spread','šíření technologií')|l].\n\nMnožství pokroku pro technologie potřebného k její nabytí závisí na její [Concept('concept_technology_era','ére')]. $concept_technology_era_ahead_of_time_penalty_desc$" # todo: CONCEPT CASE
 concept_technology_desc_added: " [GetBuildingType('building_university').GetName]"
 concept_canal: "Kanál"
 concept_canals: "Kanály"
 concept_canal_desc: "[Concept('concept_canal','Kanál')] je [Concept('concept_building','budova')|l], které rovněž zahrnuje stavbu umělého spojení mezi dvěma námořními uzly přes pevninskou plochu. Kanály mohou být navrženy pouze na určitých místech a obvykle vyžadují dokončení různých průzkumů nebo jiných expedic. Kanály mohou dramaticky zkrátit vzdálenost, jakou [GetGoods('merchant_marine').GetName|l] potřebuje na cestu při zakládání [Concept('concept_shipping_lane','námořní trase')|l], čímž je obchod s dalekými zeměmi levnější." # todo: CONCEPT CASE
 concept_monument: "Monument"
 concept_monuments: "Monumenty"
 concept_monument_desc: "[Concept('concept_building','Budova')] unikátní pro určitý [Concept('concept_state','stát')|l], které můžou vykonávat různé funkce, často poskytující [Concept('concept_prestige','prestiž')|l]." # todo: CONCEPT CASE
 concept_productivity: "Produktivita"
 concept_productivity_long: "Roční produktivita / zaměstnanec"
 concept_productive: "Produktivní"
 concept_unproductive: "Neproduktivní"
 concept_productivity_desc: "Produktivita je relativní míra, kolik ekonomické hodnoty generuje [Concept('concept_building','budova')|l] na zaměstnance za rok. Vypočítává se tak, že se vezmou aktuální týdenní [Concept('concept_revenue','příjmy')|l] generované z [Concept('concept_good_production','výroby')], odečtou se náklady vzniklé z [Concept('concept_good_consumption','spotřeby')], vydělí se celkovou [Concept('concept_workforce','pracovní silou')] a vynásobí se 52 (týdnů / rok).\n\n( Příjmy - Materiálové náklady ) / Celkový počet zaměstnanců\n\nRozdíl mezi produktivitou a [Concept('concept_average_wage','průměrnou roční mzdou')] je týdenní [Concept('concept_building_balance','bilance')|l] budovy, známá také jako zisk.\n\n$COMPANIES$ mají také hodnocení produktivity, které se rovná průměrné produktivitě všech jim přidružených úrovní budovy." # todo: CONCEPT CASE
 concept_law_group: "Skupina zákonů"
 concept_law_groups: "Skupiny zákonů"
 concept_law_group_desc: "Skupina zákonů obsahuje několik [Concept('concept_law','zákona')], které ovlivňují aspekty [Concept('concept_country','země')|l] různými způsoby. Každá skupina zákonů může mít v daném okamžiku pouze jeden aktivní zákon." # todo: CONCEPT CASE
 concept_government_reform: "Reforma vlády"
 concept_government_reform_short: "Reforma"
 concept_government_reform_desc: "Během reformy vlády můžete volně měnit složení vaší [Concept('concept_government','vládu')] tím, že přidáte nebo odeberete [Concept('concept_interest_group','zájmové skupiny')|l] a/nebo [Concept('concept_party','strany')|l] z/do vlády. Zájmové skupiny odstavené od moci během takové reformy získají [Concept('concept_radical','radikály')], pokud se reforma neprovádí krátce po ukončených volbách." # todo: CONCEPT CASE
 concept_election: "Volby"
 concept_elections: "Volby"
 concept_election_possessive: "Volebný"
 concept_election_voting_franchise: "Volební právo"
 concept_elect: "Volit"
 concept_elected: "Zvolen"
 concept_election_desc: "[Concept('concept_country','Země')] s volebním právem pořádají volby každých #v [GetDefine('NPolitics','ELECTION_INTERVAL_YEARS')|0] let#!. Před volebním dnem začíná volební kampaň, která trvá #v [GetDefine('NPolitics','CAMPAIGN_PERIOD_MONTHS')|0] měsíců#!. Během ní politické [Concept('concept_party','stran')|l] soupeří o [Concept('concept_momentum','momentum')|l] a [Concept('concept_votes','hlasy')].\n\nV den voleb se sečtou konečné hlasy, což ovlivní [Concept('concept_political_strength','politickou sílu')] [Concept('concept_interest_group','zájmových skupin')] v jednotlivých stranách. V některých typech [Concept('concept_government_type','typu vlády')] může být na základě výsledků voleb zvolena nová [Concept('concept_head_of_state','hlava státu')|l]. Nakonec může být provedena jedna [Concept('concept_government_reform','reforma vlády')|l], při které mohou být zájmové skupiny odstraněny z [Concept('concept_government_type','typu vlády')] bez vzniku nových [Concept('concept_radical','radikálů')]." # todo: CONCEPT CASE
 concept_budget_minting: "Ražba mincí"
 concept_budget_minted: "Vyraženo"
 concept_budget_minting_desc: "Forma příjmu, kterou generují všechny [Concept('concept_country','země')|l] tiskem nebo odléváním nových [Concept('concept_money','penízů')]. Čím větší je [Concept('concept_gdp','hrubý domácí produkt')|l] [Concept('concept_country','zemi')|l], tím více peněz může být vyražené bez poškození ekonomiky." # todo: CONCEPT CASE
 concept_budget_poll_taxes: "Daně z hlavy"
 concept_budget_poll_tax: "Daň z hlavy"
 concept_budget_poll_taxes_desc: "Plošní [Concept('concept_taxes','daň')|l] vybíraná od každého [Concept('concept_working_adults','pracujících dospělých')], na kterého se vztahuje. Protože $concept_budget_poll_taxes$ se neodvíjí od příjmu populace, má tendenci mít největší dopad na [Concept('concept_lower_strata','nižší třídu')]." # todo: CONCEPT CASE
 concept_budget_land_taxes: "Pozemkové daně"
 concept_budget_land_taxes_desc: "Druh [Concept('concept_budget_poll_taxes', 'daní na hlavu')] vybíraný od [SelectLocalization(GetPlayer.IsValid,'concept_budget_land_taxes_desc_added','rolníků')] a [SelectLocalization(GetPlayer.IsValid,'concept_budget_land_taxes_desc_farmers','farmárů')] zaměstnaných v zemědělských [Concept('concept_building','budovách')]. Populace, kteří platí pozemkové daně, neplatí [Concept('concept_budget_per_capita_taxes','populační daně')|l]." # todo: CONCEPT CASE
 concept_budget_land_taxes_desc_added: "[GetPopType('peasants').GetName]"
 concept_budget_land_taxes_desc_farmers: "[GetPopType('farmers').GetName]"
 concept_budget_heathen_taxes: "Pohanské daně"
 concept_budget_heathen_taxes_desc: "Typ [Concept('concept_budget_poll_taxes','daň z hlavy')] vybíraného od všech [Concept('concept_pop','populací')] s nízkým [Concept('concept_acceptance','přijetím')] ve jejich [Concept('concept_country','země')]." # todo: CONCEPT CASE
 concept_budget_per_capita_taxes: "Populační daně"
 concept_budget_per_capita_taxes_desc: "Typ [Concept('concept_budget_poll_taxes','daně z hlavy')|l] vybíraný od celé [Concept('concept_pop','populace')|l] kromě [SelectLocalization(GetPlayer.IsValid,'concept_budget_per_capita_taxes_desc_added','rolníků')]." # todo: CONCEPT CASE
 concept_budget_per_capita_taxes_desc_added: "[GetPopType('peasants').GetName]"
 concept_budget_income_taxes: "Daně z příjmu"
 concept_budget_income_taxes_desc: "[Concept('concept_taxes','Daně')] vybíraná ze [Concept('concept_building_wage','mzdy')] vyplacené [Concept('concept_workforce','pracovní síly')]." # todo: CONCEPT CASE
 concept_budget_investment_income: "Převod investičního fondu"
 concept_budget_investment_income_desc: "Když jsou [Concept('concept_money','peníze')|l] z [Concept('concept_treasury','státní pokladny')] použity na [Concept('concept_construction','výstavbu')] [Concept('concept_building','budovu')], které aktuální $ECONOMIC_SYSTEM_GC_LINK$ umožňuje financovat z [Concept('concept_investment_pool','investičního fondu')] [Concept('concept_country','zemí')|], je [Concept('concept_treasury','státní pokladna')|l] kompenzována odpovídajícím převodem prostředků z investičního fondu." # todo: CONCEPT CASE
 concept_budget_consumption_taxes: "Spotřební daně"
 concept_budget_consumption_tax: "Spotřební daň"
 concept_budget_consumption_tax_rate: "sazbu spotřební daně"
 concept_budget_consumption_taxes_desc: "Typ [Concept('concept_taxes','daně')] vybraný za [Concept('concept_good_consumption','spotřebované')] [Concept('concept_good','zboží')|l]. Zboží podléhající spotřební dani zvýší svou [Concept('concept_market_price','tržní cenu')] o sazbu spotřební daně, a kdykoli jej [Concept('concept_pop','populace')|l] zakoupí, tohle zvýšení bude vybráno do [Concept('concept_treasury','státní pokladny')]. [Concept('concept_building','Budova')] jsou osvobozeny od placení spotřební daně." # todo: CONCEPT CASE
 concept_budget_dividends_taxes: "Daně z dividend"
 concept_budget_dividends_taxes_desc: "[Concept('concept_taxes','Daně')] aplikovaná na [Concept('concept_dividends','dividendy')|l] vydělané [Concept('concept_pop','populace')], která je [Concept('concept_privately_owned','soukromým vlastníkem')] [Concept('concept_building','budovy')|l]." # todo: CONCEPT CASE
 concept_taxes: "Daně"
 concept_tax: "Daň"
 concept_taxing: "Zdanění"
 concept_taxation: "Zdanění"
 concept_tax_rate: "Sazba daně"
 concept_tax_level: "Úroveň zdanění"
 concept_tax_revenue: "Příjmy z daní"
 concept_taxes_desc: "[Concept('concept_country','Země')] mohou využívat svou tržní ekonomiku různými způsoby. Nejčastěji vybírají daně z příjmů soukromého sektoru populace nebo účtují poplatky z prodeje, nákupu či obchodu se [Concept('concept_good','zbožím')]." # todo: CONCEPT CASE
 concept_unrealized_taxes: "Nevybrané daně"
 concept_unrealized_taxes_desc: "Nevybrané daně jsou část [Concept('concept_taxes','daní')], kterou [Concept('concept_country','zemi')|l] nedokázala vybrat z různých důvodů, včetně, ale nejen, nedostatečné [Concept('concept_tax_capacity','daňové kapacity')] a [Concept('concept_tax_waste','daňového plýtvaní')]." # todo: CONCEPT CASE
 concept_budget_additional_income: "Dodatečný příjem"
 concept_budget_additional_income_desc: "Příjem, který se nevejde do jiné kategorie, často získávaný z výsledků speciálních událostí."
 concept_budget_additional_expenses: "Dodatečné výdaje"
 concept_budget_additional_expenses_desc: "Výdaje, které se nevejdou do jiné kategorie, často vzniklé v důsledku zvláštních událostí."
 concept_budget_diplomatic_pacts: "Diplomatické pakty"
 concept_budget_diplomatic_pacts_desc: "[Concept('concept_money','Peníze')] vybrané od nebo odeslané druhé [Concept('concept_country','zemí')] v rámci [Concept('concept_diplomatic_pact','diplomatického paktu')]." # todo: CONCEPT CASE
 concept_budget_treaties: "Dohody"
 concept_budget_treaties_desc: "[Concept('concept_money','Peníze')] vybírané od nebo odváděné jiné [Concept('concept_country','zemí')] v rámci [Concept('concept_treaty','smlouvy')]." # todo: CONCEPT CASE
 concept_budget_power_bloc: "Rozpočet mocenského bloku"
 concept_budget_power_bloc_desc: "[Concept('concept_money','Peníze')] shromážděné od [Concept('concept_power_bloc_member','člena mocenského bloku')|l] nebo odeslané k [Concept('concept_power_bloc_leader','lídrovi mocenskému bloku')|l]" # todo: CONCEPT CASE
 concept_piracy: "Piráti"
 concept_pirated: "Obradeno piráty"
 concept_piracy_desc: "[Concept('concept_money','Peníze')] získané z aktivní redistribuce [Concept('concept_good','zboží')] na vysokých mořích prostřednictvím pirátství nebo privátnícher [Concept('concept_naval_mission','námořní mise')]." # todo: CONCEPT CASE
 concept_construction: "Výstavba"
 concept_constructions: "Výstavby"
 concept_construct: "Postavit"
 concept_constructed: "Postaveno"
 concept_construction_desc: "@construction! Výstavba je produkována budovou [SelectLocalization(GetPlayer.IsValid,'concept_construction_desc_added','Stavební sektor')] a používá se k výstavbě [Concept('concept_building','budově')]." # todo: CONCEPT CASE
 concept_construction_desc_added: "[GetBuildingType('building_construction_sector').GetName]"
 concept_budget_construction_goods: "Stavební zboží"
 concept_budget_construction_goods_desc: "[Concept('concept_good','Zboží')] [Concept('concept_good_consumption','Spotřebováno')|l] [Concept('concept_building','Budova')] [SelectLocalization(GetPlayer.IsValid,'concept_budget_construction_goods_desc_added','Stavební sektor')] za účelem [Concept('concept_construction','výstavbou')] nových budov." # todo: CONCEPT CASE
 concept_budget_construction_goods_desc_added: "[GetBuildingType('building_construction_sector').GetName]"
 concept_budget_government_wages: "Vládní mzdy"
 concept_budget_government_wages_desc: "[Concept('concept_building_wage','Mzda')] vyplácené [Concept('concept_pop','populaci')] pracující ve [Concept('concept_government_building','vládní budově')]. Sazba závisí na [Concept('concept_normal_wage','normální mzdě')] v [Concept('concept_country','zemích')]. Můžete ji zvýšit anebo snížit v panelu $BUDGET_PANEL_TITLE$." # todo: CONCEPT CASE
 concept_budget_wages: "Mzdy"
 concept_budget_wage: "Mzda"
 concept_budget_wages_desc: "[Concept('concept_pop','Populace')] zaměstnaná v [Concept('concept_country','zemích')] ve [Concept('concept_government_building','vládní budově')] a [Concept('concept_military_building','vojenské budově')] dostávají mzdu z [Concept('concept_treasury','státní pokladny')] každý týden, na základě odpovídající [Concept('concept_government_wage','vládní mzdě')] a [Concept('concept_military_wage','vojenské mzdě')]." # todo: CONCEPT CASE
 concept_budget_goods_for_government_buildings: "Zboží pro vládní budovy" # todo: CONCEPT CASE
 concept_budget_goods_for_government_buildings_desc: "[Concept('concept_good','Zboží')] [Concept('concept_good_consumption','spotřebováno')] vládou [Concept('concept_country','zeměmi')|l] pro [Concept('concept_government_building','vládní budovu')|l]." # todo: CONCEPT CASE
 concept_budget_government_slaves: "Vládní otroci"
 concept_budget_government_slaves_desc: "Udržovací náklady [Concept('concept_slavery','otroků')] pracujících přímo pro vládu [Concept('concept_country','země')|l]." # todo: CONCEPT CASE
 concept_budget_military_wages: "Vojenské mzdy"
 concept_budget_military_wages_desc: "[Concept('concept_building_wage','Mzda')] vyplácené [Concept('concept_pop','populaci')] [Concept('concept_military_building','vojenských budov')]. Sazba závisí na [Concept('concept_normal_wage','standardní mzdu')|l] v [Concept('concept_country','zemích')] . Můžete ji zvýšit a snížit v panelu $BUDGET_PANEL_TITLE$." # todo: CONCEPT CASE
 concept_budget_goods_for_military_upkeep: "Zboží pro vojenské provozní náklady" # todo: CONCEPT CASE
 concept_budget_goods_for_military_upkeep_desc: "[Concept('concept_good','Zboží')] [Concept('concept_good_consumption','Spotřebováno')] spotřebované [Concept('concept_military_building','vojenské budovy')] a údržbou [Concept('concept_ship','lodí')]." # todo: CONCEPT CASE
 concept_slavery: "Otroctví"
 concept_slaves: "Otroci"
 concept_enslaved: "Otroci"
 concept_slavery_desc: "Praktika, při které je jedné osobě legálně dovoleno vlastnit jinou. [SelectLocalization(GetPlayer.IsValid,'concept_slavery_desc_added', 'Otroci')] budou nahrázet jiné [Concept('concept_pop','populace')|l] v různých typech [Concept('concept_building','budově')] na základě [Concept('concept_law','zákoně')] v [Concept('concept_country','zemích')]. Zákony také určují, jak se existující populace stávají zotročenými a jak jsou otroci vyrváni a přepraveni do dané země." # todo: CONCEPT CASE
 concept_slavery_desc_added: "[GetPopType('slaves').GetName]"
 concept_budget_military_slaves: "Vojenští otroci"
 concept_budget_military_slaves_desc: "Náklady na udržování [Concept('concept_slavery','otroků')] sloužících v armádě [Concept('concept_country','zemím')|l]." # todo: CONCEPT CASE
 concept_good_production: "Výroba"
 concept_good_produced: "Vyprodukováno"
 concept_good_produce: "Produkce"
 concept_good_produces: "Produkuje"
 concept_output_goods: "Výstupní zboží"
 concept_good_production_desc: "Množství [Concept('concept_good','zboží')|l] vyprodukovaného [Concept('concept_building','budovy')] k projedi za [Concept('concept_revenue','příjmy')]." # todo: CONCEPT CASE
 concept_good_consumption: "Spotřeba"
 concept_good_consumed: "Spotřebováno"
 concept_good_consumes: "Spotřebuje"
 concept_input_goods: "Vstupní zboží"
 concept_good_consumption_desc: "Množství [Concept('concept_good','zboží')|l], které spotřebovává [Concept('concept_building','budova')|l] nebo [Concept('concept_pop','populace')|l] v procesu udržení její [Concept('concept_throughput','efektivity')] resp. [Concept('concept_wealth','Bohatství')|l]." # todo: CONCEPT CASE
 concept_subsidies: "Dotace"
 concept_subsidize: "Dotovat"
 concept_subsidized: "Dotováno"
 concept_subsidizing: "Dotování"
 concept_subsidies_desc: "Dotovaná [Concept('concept_building','budova')|l] má zaručeno, že ji vláda [Concept('concept_country','země')|l] bude finančně podporovat tak, aby vždy mohla vyplácet alespoň minimální [Concept('concept_subsidized_wage','dotovanou mzdu')]. Pokud budova není schopna platit zaměstnancům tuto mzdu (nebo vyšší), případně pokud její náklady na nákup [Concept('concept_good_consumption','vstupního zboží')] převyšují [Concept('concept_revenue','příjmy')|l] z prodeje [Concept('concept_good_production','výstupního zboží')], rozdíl pokryje [Concept('concept_treasury','státní pokladna')|l]. To zajišťuje, že budova může zaměstnat tolik lidí, kolik potřebuje, aby se maximalizovala [Concept('concept_throughput','efektivita')|l], bez ohledu na to, zda je její provoz finančně udržitelný" # todo: CONCEPT CASE
 concept_budget_interest: "Úrok"
 concept_budget_interest_rate: "Úroková sazba"
 concept_budget_interest_rates: "Úrokové sazby"
 concept_budget_interest_desc: "Úrok, který platí [Concept('concept_country','země')|l] ze svých [Concept('concept_loans','půjček')]. Je vypočítáván vynásobením [Concept('concept_principal','jistinou')] roční [Concept('concept_budget_interest_rate','úrokovou sazbou')].\n\nÚrok je vyplácen [Concept('concept_pop','populaci')] jejichž [Concept('concept_privately_owned','soukromé')] [Concept('concept_cash_reserves','hotovostní rezervy')|l] jsou základem pro půjčky. [Concept('concept_nationally_owned','Národně vlastněné')] budovy místo toho generují méně [Concept('concept_government_dividends','vládních dividendů')].\n\nÚroková sazba závisí především na [Concept('concept_technology','technologie')]." # todo: CONCEPT CASE
 concept_country_tier: "Postavení země"
 concept_country_tier_short: "Postavení"
 concept_country_tier_possessive: "Postavení země"
 concept_country_tier_desc: "Postavení země je přirozený status a [Concept('concept_prestige','prestiž')|l], která jí náleží na základě její historie a významu. Vytvoření nové země je možné pouze tehdy, pokud má vyšší úroveň postavení než ta, kterou má aktuální země." # todo: CONCEPT CASE
 concept_claim: "Nárok"
 concept_claims: "Nároky"
 concept_claimed: "Nárokovaný"
 concept_claim_desc: "Teritoriální nárok, který má [Concept('concept_country','země')|l] na [Concept('concept_state_region','státní oblast')|l], obvykle proto, že ji předtím vlastnila. Nárok umožňuje využití [Concept('concept_war_goal','válečního cíle')] #v $war_goal_return_state_type_name$#!, který nevytváří tolik [Concept('concept_infamy','infamie')] jako [Concept('concept_war_goal','válečný cíl')|l] #v $war_goal_conquer_state_type_name$#!.\n\nDobytí [Concept('concept_incorporated_state','začleněného státu')] přidělí předchozímu vlastníkovi nárok na státní oblast." # todo: CONCEPT CASE
 concept_devastation: "Devastace"
 concept_pollution_impact: "Dopad znečištění"
 concept_pollution_impact_desc: "Dopad znečištění na [Concept('concept_state_region','státní oblast')|l] ukazuje, jak závažné jsou účinky celkového [Concept('concept_generated_pollution','vyprodukovaného zněčištění')] budov v této oblasti. Čím více [Concept('concept_arable_land','orní půdy')] má region, tím nižší je dopad [Concept('concept_generated_pollution','vyprodukovaného zněčištění')].\n\nVysoce znečištěný region státu bude také ovlivňovat sousední státy, i když v nižší intenzitě. Pokud sousední stát má již vyšší dopad zněčištění kvůli svým budovám nebo jiným sousedním státům, efekt bude mít pouze ten nejvyšší dopad zněčištění.\n\nÚčinky dopadu zněčištění mohou vzrůst až do:\n[GetStaticModifier('state_region_pollution_general').GetDesc]\n[GetStaticModifier('state_region_pollution_health').GetDesc]#!" # todo: CONCEPT CASE
 concept_generated_pollution: "Vyprodukované znečištění"
 concept_generated_pollution_desc: "Vyprodukované znečištění je celkové množství znečištění, které budovy ve [Concept('concept_state_region','státě')] vyprodukují. Jak velký [Concept('concept_pollution_impact','dopad znečištění')|l] má na stát je také závislé na množství [Concept('concept_arable_land','ornou půdu')] v tomhle státě.\n\nStáty s velkým množstvím orní půdy způsobí menší zvýšení vyprodukovaného znečištění a dopadu znečištění než stát s málem orní půdy." # todo: CONCEPT CASE
 concept_devastated: "Zdevastováno"
 concept_devastation_desc: "Devastace je poškození způsobené v [Concept('concept_state_region','státě')] v důsledku války nebo přírodních katastrof. Stoupá při [Concept('concept_battle','bitvě')] a při nepřátelské [Concept('concept_occupation','okupaci')]. Snížuje se v průběhu času, pokud žádná část státu není ve válce.\n\nDevastace má negativní dopad na [Concept('concept_infrastructure','infrastrukturu')], [Concept('concept_pop_growth','úmrtnost')|l], [Concept('concept_throughput','efektivitu budov')] a [Concept('concept_migration_pull','migrační přitažlivost')|l]." # todo: CONCEPT CASE
 concept_command_limit: "Velitelský limit"
 concept_command_limit_desc: "Velitelský limit určuje, kolik [Concept('concept_battalion','prapor')] nebo [Concept('concept_ship','lodí')] může být efektivně [Concept('concept_organization','organizováno')] ve [Concept('concept_military_formation','formacích')]. Velitelský limit můžete zvýšit najímáním dalších [Concept('concept_commander','velitelů')] nebo jejich povyšováním na vyšší [Concept('concept_commander_rank','hodnost velitele')].\n\n#indent_newline:3 Mít více [Concept('concept_unit','vojenských jednotek')] ve formaci než je její velitelský limit snižuje maximální organizaci, kterou [Concept('concept_military_formation','formaci')|l] může dosáhnout, a navíc způsobuje následující účinky:\n[GetStaticModifier('low_command_limit').GetDesc]#!" # todo: CONCEPT CASE
 concept_command: "Velení"
 concept_commanded: "Pod velením"
 concept_pop_qualifications: "Kvalifikace"
 concept_qualifying: "Kvalifikace"
 concept_qualified: "Kvalifikovaný"
 concept_qualify: "Kvalifikovat"
 concept_pop_qualifications_desc: "[Concept('concept_pop','Populace')] získavají kvalifikaci nezbytnou pro přechod na jinou [Concept('concept_profession','profesi')] v průběhu času. Pokud jejich aktuální atributy odpovídají atributům profese, nebo pokud v současnosti pracují v příbuzném oboru, získají kvalifikaci dříve. [Concept('concept_literacy','Gramotnost')], [Concept('concept_wealth','bohatství')|l] a [Concept('concept_acceptance_status','status přijetí')|l] jsou běžné rozhodovací faktory." # todo: CONCEPT CASE
 concept_hq: "HQ"
 concept_hqs: "Velitelství"
 concept_hq_possessive: "HQ"
 concept_hq_long: "Velitelství"
 concept_hq_desc: "HQ ($concept_hq_long$) je území vlastněné [Concept('concept_country','zemí')] v určitém [Concept('concept_strategic_region','strategickém regionu')]. Všechny [Concept('concept_military_formation','formacích')|l] mají domovské HQ a mohou být umístěny v jiných velitelstvích." # todo: CONCEPT CASE
 concept_tax_waste: "Daňové plýtvání"
 concept_tax_waste_desc: "Množství [Concept('concept_taxes','daně')], které jsou vybírány, ale ztraceny kvůli neefektivitě nebo korupci před tím, než se dostanou do státní pokladny. To je často způsobeno nedostatkem [Concept('concept_bureaucracy','byrokracií')]." # todo: CONCEPT CASE
 concept_tax_capacity: "Daňová kapacita"
 concept_tax_capacity_desc: "Každý bod daňové kapacity ve [Concept('concept_state','státě')] umožňuje efektivní zdanění [GetDefine('NPops','INDIVIDUALS_TAXED_PER_TAX_CAPACITY')|vK] [Concept('concept_pop','populace')|l]. Pokud populace [Concept('concept_state','státu')] přesáhne svou daňovou kapacitu, efektivita všech forem zdanění se sníží. Daňová kapacita může být zvýšena výzkumem určitých technologii z kategorie $SOCIETY$ nebo výstavbou [Concept('concept_building','budovou')] [SelectLocalization(GetPlayer.IsValid, 'concept_tax_capacity_desc_added','Vláda Administrativa')] ve státě." # todo: CONCEPT CASE
 concept_tax_capacity_desc_added: "[GetBuildingType('building_government_administration').GetName]"
 concept_assimilation: "Asimilace"
 concept_assimilating: "Asimilování"
 concept_assimilate: "Asimilovat"
 concept_assimilation_desc: "Cizí [Concept('concept_pop','populace')], jejichž [Concept('concept_culture','kultura')|l] má v [Concept('concept_country','zemích')], kde žije, dostatečně vysoké [Concept('concept_acceptance','přijetí')|l], a které nežijí v žádné ze svých [Concept('concept_homeland','domoviny')], se mohou asimilovat do více přijetých kultur. Populace, které obsahují [Concept('concept_radical', 'radikály')], se budou asimilovat pomaleji, a asimiace je mnohem pomalejší v [Concept('concept_unincorporated_state','nezačleněném státě')]." # todo: CONCEPT CASE
 concept_conversion: "Konverze"
 concept_converting: "Konverze"
 concept_convert: "Konvertovat"
 concept_conversion_desc: "[Concept('concept_pop','Populace')], jejichž [Concept('concept_religion','náboženství')|l] má nízkou úroveň [Concept('concept_acceptance','přijetí')|l] v [Concept('concept_country','zemích')], ve které žijí, se mohou rozhodnou konvertovat na jinou s vyšší úrovní [Concept('concept_acceptance','přijetím')|l]. Populace s [Concept('concept_radical','radikálem')] se konvertují zpomaleným tempem a konverze je mnohem pomalejší v [Concept('concept_unincorporated_state','nezačleněném státě')]." # todo: CONCEPT CASE
 concept_life_experience: "Životní zkušenost"
 concept_life_experience_desc: "[Concept('concept_character','Postava')] získávají časem a skrze speciální události tzv. životní zkušenosti. Životní zkušenost ovlivňuje možnost získání nových [Concept('concept_character_trait','charakterového rysu')]." # todo: CONCEPT CASE
 concept_supply_network: "Zásobovací síť"
 concept_supply_network_short: "Síť" # todo: NEW TRANSLATION
 concept_supply_networks: "Zásobovací sítě"
 concept_supply_networks_short: "Sítě" # todo: NEW TRANSLATION
 concept_supply_network_desc: "Každá námořní [Concept('concept_country','země')|l] potřebuje na [Concept('concept_market','trh')] [GetGoods('merchant_marine').GetName|l], aby zajistila přepravní potřeby svých [Concept('concept_shipping_lane','námořní trasy')]. Celková síla vaší zásobovací sítě je určena porovnáním nabídky [GetGoods('merchant_marine').GetName] s celkovou poptávkou napříč všemi vašimi námořními trasemi. Tato síla představuje základní [Concept('concept_shipping_lane_effectiveness','efektivita')|l] všech vašich námořních tras." # todo: CONCEPT CASE
 concept_ship: "Loď"
 concept_ships: "Lodě"
 concept_military_ship: "Vojenská loď"
 concept_military_ships: "Vojenské lodě"
 concept_ship_possessive: "Lodní"
 concept_ship_desc: "Loď se staví v loděnici pomocí [Concept('concept_ship_construction','stavby lodí')]. Jsou organizovány podle svého [Concept('concept_ship_type','typu lodi')] v [Concept('concept_ship_group','skupině lodí')]. Lodě se používají k budování [Concept('concept_interest','zájmu')] po celém světě a k provádění různých [Concept('concept_naval_mission','námořním misím')] v loďstvu." # todo: CONCEPT CASE
 concept_ship_group: "Skupina lodí"
 concept_ship_groups: "Skupiny lodí"
 concept_ship_group_desc: "Existují tři $concept_ship_groups$, které se skládají z [Concept('concept_ship_type','typu lodi')] plnících podobnou roli. Skupiny jsou: $ship_group_capital_ships$, $ship_group_cruisers$ a $ship_group_torpedo_craft$." # todo: CONCEPT CASE
 concept_ship_type: "Typ lodi"
 concept_ship_types: "Typy lodí"
 concept_ship_type_short: "Typ"
 concept_ship_types_short: "Typy"
 concept_ship_type_desc: "Každá [Concept('concept_ship','loď')] má $concept_ship_type$, který má určité atributy a funkce, jež ji činí vhodnější nebo méně vhodnou pro určité [Concept('concept_naval_mission','námořní mise')]." # todo: CONCEPT CASE
 concept_ship_template: "Šablona lodi"
 concept_ship_templates: "Šablony lodí"
 concept_ship_template_short: "Šablona"
 concept_ship_templates_short: "Šablony"
 concept_ship_template_desc: "[Concept('concept_ship_template','Šablona lodi')] určuje strategické nastavení pro [Concept('concept_ship','loď')] určitého [Concept('concept_ship_type','typ lodi')]. [Concept('concept_ship_modification','Úprava lodi')] upravují a určují, jaké hodnoty $ship$ nakonec bude mít." # todo: CONCEPT CASE
 concept_base_template: "Základní šablona"
 concept_base_templates: "Základní šablony"
 concept_base_template_desc: "Původní návrh [Concept('concept_ship_type','typ lodi')]. Základní šablona se odemyká s typem lodi a bude vždy dostupná." # todo: CONCEPT CASE
 concept_sailor: "Námořník"
 concept_sailors: "Námořníci"
 concept_sailor_desc: "Typ [GetPopType('soldiers').GetName], kteří tvoří $concept_ship_crew$ [Concept('concept_ship','lodě')]." # todo: CONCEPT CASE
 concept_ship_construction: "Stavba lodí"
 concept_ship_construction_short: "Stavba"
 concept_ship_construct: "Stavět"
 concept_ship_construction_desc: "@ship_construction! Stavba lodí se vyrábí v [GetBuildingType('building_shipyard').GetName] a slouží ke stavbě a opravám lodí." # todo: CONCEPT CASE
 concept_ship_construction_capacity: "Kapacita stavby lodí"
 concept_ship_construction_capacity_short: "Kapacita stavby"
 concept_ship_construction_capacity_desc: "Maximální množství @ship_construction! [Concept('concept_ship_construction','stavba lodí')], které lze týdně aplikovat na jednu loď." # todo: CONCEPT CASE
 concept_ship_construction_queue: "Fronta stavby lodí"
 concept_ship_construction_queue_short: "Fronta"
 concept_ship_construction_queue_desc: "Jakékoli [Concept('concept_ship','lodě')] nastavené ke stavbě, které momentálně nepoužívají žádné @ship_construction! [Concept('concept_ship_construction','stavba lodí')], jsou umístěny do fronty. Když se uvolní nějaké @ship_construction! stavbou lodí, první $concept_ship$ ve frontě začne používat toto @ship_construction! $concept_ship_construction_short$ a poté se přepne na stav [Concept('concept_ship_under_construction','loď ve stavbě')]." # todo: CONCEPT CASE
 concept_ship_retrofit: "Modernizace lodi"
 concept_ship_retrofit_short: "Modernizace"
 concept_ship_retrofitted_short: "Zmodernizováno"
 concept_ship_retrofit_desc: "Aktualizuje [Concept('concept_ship_modification','úpravy lodí')] [Concept('concept_ship','loď')] tak, aby odpovídaly nejnovější verzi její [Concept('concept_ship_template','šablona lodi')]." # todo: CONCEPT CASE
 concept_ship_complexity: "Složitost lodi"
 concept_ship_complexity_short: "Složitost"
 concept_ship_complexity_desc: "Složitost lodi [Concept('concept_ship','lodě')] je určena počtem různých [Concept('concept_ship_modification','úpravy lodi')], které má. Čím více $concept_ship_modifications$ lodí má, tím vyšší je jeho složitosti lodi a tím více @ship_construction! [Concept('concept_ship_construction','stavba lodí')] bude vyžadovat pro stavbu či opravu." # todo: CONCEPT CASE
 concept_ship_modification: "Úprava lodi"
 concept_ship_modification_short: "Úprava"
 concept_ship_modifications: "Úpravy lodí"
 concept_ship_utility_modifications_short: "Užitečné úpravy"
 concept_ship_modification_desc: "Úprava lodi je vylepšení, které lze aplikovat na [Concept('concept_ship','loď')] ke zvýšení jeho schopností. Přidání více $concept_ship_modifications$ však také zvyšuje [Concept('concept_ship_complexity','složitost lodi')] $concept_ship$, což následně vyžaduje více @ship_construction! [Concept('concept_ship_construction','stavba lodí')] k jeho stavbě nebo opravě." # todo: CONCEPT CASE
 concept_ship_under_construction: "Loď ve stavbě"
 concept_ship_under_construction_short: "Ve stavbě"
 concept_ship_under_construction_desc: "Když [Concept('concept_ship','loď')] používá @ship_construction! [Concept('concept_ship_construction','stavba lodí')], je považována za ve stavbu." # todo: CONCEPT CASE
 concept_flagship: "Vlajková loď"
 concept_flagship_desc: "Vlajková loď je vedoucí [Concept('concept_ship','loď')] námořnictva [Concept('concept_country','země')]. Současně může existovat pouze jedna $concept_flagship$. Vítězství v bitvách, které zahrnují $concept_flagship$, poskytne dodatečný [Concept('concept_prestige','prestiž')] zemi, která ji vlastní, zatímco prohra je poškodí." # todo: CONCEPT CASE
 concept_ship_crew: "Posádka lodi"
 concept_ship_crew_short: "Posádka"
 concept_ship_crew_desc: "Počet [Concept('concept_sailor','námořníci')] a [SelectLocalization(GetPlayer.IsValid,'concept_ship_crew_desc_added','Officers')] na [Concept('concept_ship','loď')]. Čím větší je $concept_ship_crew_short$, tím více [Concept('concept_casualties','ztráty')] může $concept_ship$ způsobit a snést." # todo: CONCEPT CASE
 concept_ship_crew_desc_added: "[GetPopType('officers').GetName]"
 concept_ship_hit_points: "Životy lodi"
 concept_ship_hit_points_short: "Životy"
 concept_ship_hit_points_desc: "Celkové $concept_ship_hit_points_short$ [Concept('concept_ship','loď')] představují její odolnost a schopnost odolávat poškození v námořním boji." # todo: CONCEPT CASE
 concept_fleet_hit_points: "Životy flotily"
 concept_fleet_hit_points_short: "Životy"
 concept_fleet_hit_points_desc: "Průměrné $concept_fleet_hit_points_short$ všech [Concept('concept_ship','lodě')] ve [Concept('concept_fleet','loďstvu')] představují průměrnou odolnost a schopnost odolat poškození." # todo: CONCEPT CASE
 concept_ship_armor: "Pancéřování lodi"
 concept_ship_armor_short: "Pancéř"
 concept_ship_armor_desc: "Snižuje jakékoli poškození, které by [Concept('concept_ship','loď')] obdržela od protivníka, o tuto hodnotu." # todo: CONCEPT CASE
 concept_ship_upkeep: "Provoz lodi"
 concept_ship_upkeep_short: "Provoz"
 concept_ship_upkeep_desc: "Týdenní $concept_ship_upkeep$ představuje náklady na [Concept('concept_good','zboží')] nutné k udržení [Concept('concept_ship','lodi')]. Provoz se mění pomocí [GetDefine('NMilitary','SHIP_UPKEEP_GOODS_DOCKED_MULT')|-1%], pokud je $concept_ship$ dokovaná u [Concept('concept_hq','HQ')]." # todo: CONCEPT CASE
 concept_ship_speed: "Rychlost lodi"
 concept_ship_speed_short: "Rychlost"
 concept_ship_speed_desc: "$ship_movement_speed_add_desc$"
 concept_attack_damage: "Útočné poškození"
 concept_attack_damage_short: "Poškození"
 concept_attack_damage_desc: "$ship_hull_damage_add_desc$"
 concept_hull_attack_damage: "Poškození trupu"
 concept_hull_attack_damage_short: "Poškození trupu"
 concept_hull_attack_damage_desc: "$ship_hull_damage_add_desc$"
 concept_crew_attack_damage: "Poškození posádkou"
 concept_crew_attack_damage_short: "Poškození posádky"
 concept_crew_attack_damage_desc: "$ship_crew_damage_add_desc$"
 concept_carrying_capacity: "Nákladová kapacita"
 concept_carrying_capacity_desc: "$ship_carrying_capacity_add_desc$"
 concept_marine_capacity: "Kapacita námořníků"
 concept_marine_capacity_desc: "$ship_marine_capacity_add_desc$"
 concept_supply_capacity: "Kapacita zásob"
 concept_supply_capacity_desc: "$ship_supply_capacity_add_desc$"
 concept_supply_efficiency: "Efektivita zásob"
 concept_supply_efficiency_desc: "Jak efektivně loď spotřebovává zásoby. Vyšší efektivita znamená nižší spotřebu zásob."
 concept_supply_priority: "Priorita zásob"
 concept_supply_priority_short: "Priorita"
 concept_supply_priority_desc: "Priorita zásob [Concept('concept_military_formation','formací')] určuje pořadí, v jakém obdrží [Concept('concept_supply_ship','zásobovací lodi')].\n\nZásobovací lodě budou rozdělovány, dokud nebudou uspokojeny potřeby všech priority nejvyšších [Concept('concept_fleet','loďstva')] a [Concept('concept_army','armády')], poté bude distribuce pokračovat směrem k nižším prioritám loďstvům a $concept_armies$." # todo: CONCEPT CASE
 concept_supply_ship: "Zásobovací loď"
 concept_supply_ships: "Zásobovací lodě"
 concept_supply_ship_construction: "Stavba zásobovacích lodí" # todo: NEW TRANSLATION
 concept_supply_ship_desc: "Zásobovací lodě slouží k dopravě zásob, přídělu a munice [Concept('concept_fleet','loďstva')] na moři a [Concept('concept_army','armády')] v zámoří.\n\nStaví se v $building_shipyard$ podobně jako běžné [Concept('concept_ship','lodě')] a jsou udržovány v poolu, pokud nejsou právě potřeba." # todo: CONCEPT CASE
 concept_critical_hit_chance: "Šance na kritický zásah"
 concept_critical_hit_chance_desc: "$ship_critical_hit_chance_add_desc$"
 concept_critical_hit_multiplier: "Kritické poškození"
 concept_critical_hit_multiplier_desc: "$ship_critical_hit_multiplier_add_desc$"
 concept_vulnerability: "Zranitelnost"
 concept_vulnerability_desc: "Vyšší $concept_vulnerability$ $concept_ships$ jsou pravděpodobněji vybrány jako cíl nepřátelských lodí, pokud [Concept('concept_fleet','loďstvo')] nemá dostatečné [Concept('concept_screening','ochrana')] na ochranu všech svých lodí." # todo: CONCEPT CASE
 concept_screening: "Ochrana"
 concept_screening_desc: "Ochrana se používá k potlačení efektů [Concept('concept_vulnerability','zranitelnosti')]; vyšší hodnota $concept_screening$ zajišťuje, že $concept_ships$ s vyšší zranitelností jsou méně pravděpodobné být vybrány jako cíl." # todo: CONCEPT CASE
 concept_readiness: "Připravenost"
 concept_readiness_desc: "$ship_readiness_gain_add_desc$"
 concept_accuracy: "Přesnost"
 concept_accuracy_desc: "$ship_accuracy_add_desc$"
 concept_detection: "Detekce"
 concept_detection_desc: "$ship_detection_add_desc$\n\nloďství $concept_detection$ a nepřátelská [Concept('concept_visibility','viditelnost')] se používají společně k určení šance na vznik [Concept('concept_naval_battle','námořní bitva')] a kolik lodě se do ní zapojí." # todo: CONCEPT CASE
 concept_visibility: "Viditelnost"
 concept_visibility_desc: "$ship_visibility_add_desc$\n\nloďství $concept_detection$ a nepřátelská [Concept('concept_visibility','viditelnost')] se používají společně k určení šance na vznik [Concept('concept_naval_battle','námořní bitva')] a kolik lodě se do ní zapojí." # todo: CONCEPT CASE
 concept_withdrawn_ships: "Stažené lodě"
 concept_withdrawn_ships_short: "Staženo"
 concept_withdrawn_ships_desc: "Kolik lodě se staženo z bitvy." # todo: CONCEPT CASE
 concept_sunk_ships: "Potopené lodě"
 concept_sunk_ships_short: "Potopeno"
 concept_sunk_ships_desc: "Kolik potopené lodě utrpěla [Concept('concept_fleet','loďstvo')] v bitvě." # todo: CONCEPT CASE
 concept_crew_casualties: "Oběti posádky"
 concept_crew_casualties_short: "Oběti"
 concept_crew_casualties_desc: "Kolik oběti utrpěla [Concept('concept_fleet','loďstvo')] v bitvě." # todo: CONCEPT CASE
 concept_shipping_lane: "Námořní trasa"
 concept_shipping_lanes: "Námořní trasy"
 concept_shipping_lane_desc: "Námořní trasa je námořní spojení tvořené @merchant_marine! #tooltippable_name #tooltip:[GetGoods('merchant_marine').GetTooltipTag],DATA_GOODS_NAME_TOOLTIP,GoodsTooltip [GetGoods('merchant_marine').GetCustom('GDS_I')|l]#!#! mezi dvěma pobřežními [Concept('concept_state','státy')], které je zřízeno buď k přesunu [Concept('concept_good','zboží')] z místa na místo jako součást [Concept('concept_treaty','smlouvu')], nebo k [Concept('concept_supply','zásobování')|l] zámořských [Concept('concept_military_formation','formacím')].\n\nNámořní trasa může být buď [Concept('concept_supply_route','zásobovací trasa')|l], [Concept('concept_port_connection','přístavní spojení')|l] nebo [GetArticleType('goods_transfer').GetNameNoIcon] smlouvy a jeho fungování závisí na [Concept('concept_shipping_lane_effectiveness','efektivite námořní trasy')], pokud jsou dostatečně pokryty jeho přepravní náklady." # todo: CONCEPT CASE
 concept_tolls: "Mýtné"
 concept_toll: "Mýtné"
 concept_toll_rate: "Sazba mýtného" # todo: NEW TRANSLATION
 concept_tolls_desc: "Mýtné může vybírat [Concept('concept_country','země')], které [Concept('concept_strait_control','kontrola')] $concept_strait$. Přidávají náklad, který je podílem [Concept('concept_trade','obchodem')] procházejícího jimi. Tento náklad hradí postižené [GetBuildingType('building_trade_center').GetName] a snižuje jejich ziskovost, zatímco $concept_country$ ovládající $concept_strait$ získává dodatečný příjem. Mýtné může zvýšit každý ze správců průlivu samostatně a sčítají se." # todo: CONCEPT CASE
 concept_strait: "Průliv"
 concept_straits: "Průlivy"
 concept_strait_desc: "Úzký vodní průchod spojující dva [Concept('concept_province','provincie')], po jedné straně na každé straně průlivu. [Concept('concept_country','Země')] potřebuje kontrolu pouze nad jedním z provincie, aby mohla spravovat, které lodě mají $concept_strait_access$ přes průliv.\n@information! $strait_gibraltar$ vyžaduje, aby $concept_country$ ovládala oba $concept_provinces$, aby mohla spravovat práva $concept_strait_access$." # todo: CONCEPT CASE
 concept_port_connection: "Přístavní spojení"
 concept_port_connections: "Přístavní spojení"
 concept_port_connection_desc: "Námořní trasa, která připájí jeden nebo více [Concept('concept_state','států')], jinak nedosažitelných po souši, ke [Concept('concept_market_capital','hlavnímu centru trhu')], zajišťující [Concept('concept_market_access','přístupu na trh')|l] pro odlehlé oblasti. Přístavní spojení vyžadují budovu [SelectLocalization(GetPlayer.IsValid,'concept_port_connection_desc_added','Přístav')] na obou koncích. Cena dovozu do přístavného spojení závisí na celkovém [Concept('concept_infrastructure_usage','využití infrastruktury')|l] [Concept('concept_state','státě')], které spojuje." # todo: CONCEPT CASE
 concept_port_connection_desc_added: "[GetBuildingType('building_port').GetName]"
 concept_shipping_lane_effectiveness: "Efektivita námořní trasy"
 concept_shipping_lane_effectiveness_short: "Efektivita"
 concept_shipping_lane_effectiveness_desc: "Efektivita [Concept('concept_shipping_lane','námořní trasa')] je určena silou [Concept('concept_supply_network','zásobovací sítí')] dané [Concept('concept_country','zemi')]. Když je $concept_shipping_lane_effectiveness_short$ nižší než #v 100 %#!, funkce $concept_shipping_lane$ se odpovídajícím způsobem sníží." # todo: CONCEPT CASE
 concept_supply_route: "Zásobovací trasa"
 concept_supply_routes: "Zásobovací trasy"
 concept_supply_route_possessive: "Zásobovací trasy"
 concept_supply_route_desc: "[Concept('concept_shipping_lane','Námořní trasa')], která zásobuje [Concept('concept_general','generála')] [Concept('concept_order','pověřeného')] postupem nebo obranou [Concept('concept_front','frontou')], jež je přístupná pouze po moři. Úroveň [Concept('concept_supply','zásobování')|l] generála odpovídá [Concept('concept_shipping_lane_effectiveness','efektivitě')] této [Concept('concept_supply_route','zásobovací námořní trasy')]." # todo: CONCEPT CASE
 concept_character: "Postava"
 concept_characters: "Postavy"
 concept_character_possessive: "Postavy"
 concept_character_desc: "Postavy plní různé [Concept('concept_character_role','role')|l] ve vaší [Concept('concept_country','zemi')]. Jejich schopnost vykonávat tyto povinnosti závisí na jejich [Concept('concept_character_trait','charakterových rysech')]. Vždy podporují [Concept('concept_interest_group','zájmovou skupinu')] a mohou mít [Concept('concept_ideology','ideologii')], která ovlivňuje jejich aspirace a pohled na věc." # todo: CONCEPT CASE
 concept_busy: "Zaneprázdněný"
 concept_busy_desc: "[Concept('concept_character','Postava')] může být považována za zaněprázdněnou, když má zadaný úkol, například při expedici. Když je [Concept('concept_character','postava')|l] zaněprázdněná, není k dispozici pro své běžné povinnosti. Například [Concept('concept_commander','velitel')|l] se nemůže účastnit v [Concept('concept_battle','bitvě')]." # todo: CONCEPT CASE
 concept_popularity: "Popularita"
 concept_popular: "Oblíbený"
 concept_popularity_desc: "Popularita vyjadřuje ochotu [Concept('concept_pop','populace')] [Concept('concept_character','postavu')] následovat. \n\nPopularita ovlivňuje [Concept('concept_prominence','prominenci')] a může mít různé účinky podle [Concept('concept_character_role','role')|l] dané postavy: #indent_newline:3 \n• [Concept('concept_agitator','agitátoři')]: ovlivňuje šanci, že se [Concept('concept_pop','populacemi')] připojí k jejich [Concept('concept_political_movement','politickému hnutí')] \n• [Concept('concept_ruler','vládcové')]: přidává nebo ubírá [Concept('concept_authority','autoritu')] \n• [Concept('concept_admiral','admirálové')]/[Concept('concept_general','generálové')]: ovlivňuje šanci na úspěšné zahájení [Concept('concept_coup','puč')] \n• [Concept('concept_interest_group','zájmovou skupinu')] [Concept('concept_leader', 'lídra')]: ovlivňuje [Concept('concept_interest_group_attraction','atraktivitu zájmové skupiny')] \n• [Concept('concept_party_leader','vůdci strany')]: ovlivňuje [Concept('concept_momentum','momentum')|l] [Concept('concept_party','strany')] během [Concept('concept_election','voleb')] \n• [Concept('concept_executive','výkonného představitele')]: ovlivňuje [Concept('concept_prosperity','prosperitu')]" # todo: CONCEPT CASE
 concept_prominence: "Význam"
 concept_prominent: "Významný"
 concept_prominence_desc: "Význam [Concept('concept_character','postava')] měří jejich úroveň vlivu v politickém stroji [Concept('concept_country','zeměmi')] a ovlivňuje šanci, že bude $concept_character$ vybrán jako další vůdce jejich [Concept('concept_interest_group','zájmová skupina')]. Postavy, jejichž $concept_prominence$ je alespoň [GetDefine('NCharacters','PROMINENCE_SIGNIFICANT_THRESHOLD')|v], také přispívají k [Concept('concept_political_strength','politické síle')] svého [Concept('concept_interest_group','zájmové skupině')] a mohou být zvoleni jako jeho další [Concept('concept_leader','vůdce')]." # todo: CONCEPT CASE
 concept_loyalty: "Loajalita"
 concept_loyalty_desc: "Loajalita [Concept('concept_character','postava')] měří, jak věrný je vládnoucímu [Concept('concept_government','vládě')], a je ovlivněna [Concept('concept_approval','spokojenost')] jejich [Concept('concept_interest_group','zájmová skupina')] stejně jako jejich osobní [Concept('concept_ideology','ideologie')]. Nevěrní [Concept('concept_commander','velitelé')] mohou zkusit spustit [Concept('concept_coup','puč')]." # todo: CONCEPT CASE
 concept_momentum: "Momentum"
 concept_momentum_desc: "Úspěch kampaně [Concept('concept_party','strany')|l] ve [Concept('concept_election','volbách')]. Momentum zvyšuje počet [Concept('concept_votes','hlasů')], které strana získá v den voleb, a pak je zneplatněno. Momentum může být ovlivněno náhodou, speciálními událostmi a [Concept('concept_popularity','popularitou')] svého [Concept('concept_party_leader','vůdce strany')|l]." # todo: CONCEPT CASE
 concept_government_expenses: "Vládní výdaje"
 concept_government_expenses_short: "Výdaje"
 concept_government_expenses_desc: "Celkové týdenní vládní výdaje, které [Concept('concept_government','vláda')|l] nashromáždí, jsou vyváženy vůči všem jejím týdenním příjmům, jako jsou [Concept('concept_taxes','daně')|l]. Výsledné saldo je následně přičteno k [Concept('concept_treasury','státní pokladně')] nebo z ní odečteno." # todo: CONCEPT CASE
 concept_sovereignty: "Suverenita"
 concept_sovereignty_desc: "Právo [Concept('concept_country','země')|l] na samosprávu. Když jedna země poruší suverenitu jiné, otevřeně tím nerespektuje její právo na sebeurčení. Pokud napadená strana neodpoví okamžitou vojenskou reakcí a nebrání neporušitelnost svých hranic, podřizuje se útočníkovi a umožňuje mu vojenský přístup přes své území." # todo: CONCEPT CASE
 concept_average_wage: "Průměrná roční mzda"
 concept_average_wage_desc: "Průměrná [Concept('concept_building_wage', 'mzda')] [Concept('concept_individual', 'jednotlivce')] v [Concept('concept_workforce', 'pracovní síle')], kterou by ročně vydělával prací v této [Concept('concept_building', 'budově')]."
 concept_subsidized_wage: "Dotovaná mzda"
 concept_subsidized_wage_desc: "Když [Concept('concept_subsidies','dotovaná')] [Concept('concept_building','budova')|l] nemůže zaplatit své [Concept('concept_workforce','pracovní sílu')] alespoň [Concept('concept_normal_wage','standardní mzdu')], zbývající částka je kryta vládními dotacemi ze [Concept('concept_treasury','státní pokladny')]. Na oplátku [Concept('concept_building','budovu')|l] nikdy nepropustí svou [Concept('concept_workforce','pracovní sílu')] a snaží se udržat maximální [Concept('concept_throughput','efektivitu')]." # todo: CONCEPT CASE
 concept_government_wage: "Vládní mzda"
 concept_government_wages: "Vládní mzdy"
 concept_government_wage_desc: "Všechny [Concept('concept_government_building','vládní budovu')] kromě [Concept('concept_military_building','vojenské budovy')] platí svou [Concept('concept_workforce','pracovní síly')] podle stejné standardizované vládní mzdy. Tato sazba je založena na [Concept('concept_normal_wage','nominální mzdě')] v [Concept('concept_country','zemích')] a lze ji upravovat v panelu rozpočtu." # todo: CONCEPT CASE
 concept_military_wage: "Vojenská mzda"
 concept_military_wages: "Vojenské mzdy"
 concept_military_wage_desc: "Všechny [Concept('concept_military_building','vojenskou budovu')|l] platí svou [Concept('concept_workforce','pracovní sílu')] podle stejné standardizované sazby vojenské mzdy. Tato sazba se zakládá na [Concept('concept_normal_wage','normální mzdě')] v [Concept('concept_country','zemích')], přičemž jakékoliv úpravy se nastavují na panelu rozpočtu." # todo: CONCEPT CASE
 concept_normal_wage: "Standardní mzda"
 concept_normal_wage_desc: "Základní [Concept('concept_building_wage','mzda')|l] v [Concept('concept_country','zemích')], kterou zohledňuje mnoho [Concept('concept_building','budovy')]. [Concept('concept_government_wage','Vládní mzda')] a [Concept('concept_military_wage','vojenské mzdy')|l] vycházejí ze standardní mzdy. Ta je určena podle průměrných [Concept('concept_government_wage','vládní mzdy')] vyplácených [Concept('concept_building','průmyslů')] napříč [Concept('concept_incorporated_state','začleněnými státy')]." # todo: CONCEPT CASE
 concept_dead: "Mrtvý"
 concept_dead_desc: "[Concept('concept_casualties','Ztráty')], které skončily jako mrtvé v důsledku [Concept('concept_battle','bitvě')] nebo [Concept('concept_attrition','vyčerpání')|l]." # todo: CONCEPT CASE
 concept_wounded: "Zranění"
 concept_wounded_desc: "[Concept('concept_casualties','Ztráty')], které jsou pouze zranění v [Concept('concept_battle','bitvě')] nebo kvůli [Concept('concept_attrition','vyčerpání')|l]. Někteří zranění se zotaví a vrátí se po nějakém čase do aktivní služby, zatímco jiní končí jako [Concept('concept_dependents','osoby závislé')] na jiné [Concept('concept_pop','populace')] ve vaší [Concept('concept_country','zemi')]." # todo: CONCEPT CASE
 concept_attrition: "Vyčerpání"
 concept_attrition_risk: "Riziko opotřebení"
 concept_attrition_desc: "[Concept('concept_casualties','Ztráty')] na [Concept('concept_manpower','personál')] způsobené mimo [Concept('concept_battle','bitvy')] se nazývají Opotřebením. Běžně se to stává, když jsou [Concept('concept_battalion','prapory')|l] [Concept('concept_mobilize_battalion','mobilizovány')] a může to být výsledkem nemocí, nehod, nepřízně počasí nebo dokonce dezerce. Vyčerpání lze omezit pomocí [Concept('concept_mobilization_option','mobilizační možnosti')|l] $medic_support$." # todo: CONCEPT CASE
 concept_ruler: "Vládce"
 concept_rulers: "Vládcové"
 concept_ruler_possessive: "Vládcem"
 concept_ruler_desc: "Vládce je obvykle [Concept('concept_head_of_state','hlava státu')|l], která reprezentuje [Concept('concept_country','zemi')] v domácích a světových záležitostech. [Concept('concept_ruler','Vládce')] přímo ovlivňuje zemi. Když vládce zemře, nový převezme jeho místo - buď jako [Concept('concept_heir','dědic')|l], pokud nějaký existuje, nebo jiná postava v závislosti na [Concept('concept_government_type','typ vlády')]." # todo: CONCEPT CASE
 concept_heir: "Dědic"
 concept_heir_desc: "Dědic [Concept('concept_country','země')|l] je [Concept('concept_character','postava')|l]. Po smrti aktuálního [Concept('concept_ruler','vládce')] zaujme jeho místo." # todo: CONCEPT CASE
 concept_executive: "Výkonný představitel"
 concept_executives: "Výkonný představitelé"
 concept_executives_desc: "$concept_executive_desc$"
 concept_executive_desc: "Výkonný představitelé jsou [Concept('concept_character','postavy')|l], které vedou [Concept('concept_company','společnost')|l]. Stejně jako ostatní postavy mohou mít [Concept('concept_character_trait','charakterové rysy')|l], které ovlivňují jejich schopnosti. Poskytují [Concept('concept_clout','politický vliv')|l] své [Concept('concept_interest_group','zájmovou skupinu')] na základě úspěšnosti své [Concept('concept_company','společnosti')]. Výkonný představitelé se mohou také stát [Concept('concept_leader','vůdcem')] zájmové skupiny." # todo: CONCEPT CASE
 concept_magnate: "Magnát"
 concept_magnates: "Magnáti"
 concept_magnates_desc: "$concept_magnate_desc$"
 concept_magnate_desc: "Magnáti jsou bohatí [Concept('concept_character','postavy')], kteří vlastní četné statky nebo podniky a využívají své jmění k uplatňování politické moci. Magnáti $concept_magnate_holding_desc$." # todo: CONCEPT CASE
 concept_magnate_holding_desc: "vlastní [Concept('concept_holding','držení')] ve svém [Concept('concept_home_state','domácím státě')] a získává [Concept('concept_prominence','významu')] na základě jeho [Concept('concept_revenue','příjmů')]" # todo: CONCEPT CASE
 concept_holding: "Držení"
 concept_holding_desc: "Držení je [Concept('concept_building','budova')] (obvykle $MANOR_HOUSES_GC_LINK$ nebo $FINANCIAL_DISTRICTS_GC_LINK$) v [Concept('concept_home_state','domácím státě')] [Concept('concept_character','postavě')], ve kterém má postavě předpokládaný značný podíl. Typ $concept_building$, které $concept_character$ obdrží jako své držení, závisí především na jejich [Concept('concept_interest_group','zájmová skupina')]." # todo: CONCEPT CASE
 concept_character_role: "Role"
 concept_character_roles: "Role"
 concept_character_role_desc: "Role určuje, v jakých oblastech má konkrétní [Concept('concept_character','postavy')|l] vliv na vaši [Concept('concept_country','zemi')]. Postava může mít jednu nebo více rolí.\n\nSeznam rolí zahrnuje: \n  #indent_newline:3  • [Concept('concept_ruler','vládce')] (obvykle též [Concept('concept_politician','politik')])\n• [Concept('concept_heir','dědic')]\n• [Concept('concept_politician','politik')]\n• [Concept('concept_executive','výkonný představitel')]\n• [Concept('concept_agitator','agitátor')]\n• [Concept('concept_general','generál')]\n• [Concept('concept_admiral','admirál')]" # todo: CONCEPT CASE
 concept_treasury: "Státní pokladna"
 concept_treasury_possessive: "Pokladny"
 concept_treasury_desc: "Státní pokladna sleduje majetek vaší [Concept('concept_country','zemi')|l]. Každý týden se bilance vašeho rozpočtu projeví tak, že státní pokladna bude čerpat další [Concept('concept_loans','půjčky')|l], aby pokryla nedostatek [Concept('concept_money','peněz')], nebo ukládat peníze do [Concept('concept_gold_reserves','zlatých rezerv')]." # todo: CONCEPT CASE
 concept_building_balance: "Bilance"
 concept_building_balance_profit: "Zisk"
 concept_building_balance_desc: "Bilance [Concept('concept_building','budovy')|l] je částka [Concept('concept_money','peněz')], která zůstává z její [Concept('concept_revenue','příjmů')] po zaplacení [Concept('concept_building_wage','mzdě')] a nákupu potřebného [Concept('concept_good','vstupního zboží')].\n\nZůstatek $concept_building_balance$ je rozdělen mezi [Concept('concept_building_owners','vlastníky budov')|l] a [Concept('concept_cash_reserves','hotovostními rezervami')|l] budovy.\n\nZůstatek budovy může být zlepšen buď snížením nákladů na vstupní zboží, nebo zvýšením ceny za výstupní zboží. Toho lze dosáhnout zvýšením nebo snížením [Concept('concept_sell_orders','nabídky')] a [Concept('concept_buy_orders','poptávky')] na [Concept('concept_market','trh')], kterému budova náleží." # todo: CONCEPT CASE
 concept_building_wage: "Mzda"
 concept_building_wages: "Mzdy"
 concept_building_wage_desc: "Mzdy vyplácené [Concept('concept_pop','populaci')] [Concept('concept_building','budovy')|l], v které pracují, závisí na několika faktorech, přičemž nejvýznamnějšími jsou [Concept('concept_profession','profese')|l] [Concept('concept_pop','populace')|l] a finanční situace [Concept('concept_building','budovy')|l]. Pokud [Concept('concept_building_balance','bilance')|l] [Concept('concept_building','budovy')|l] umožňuje zvyšování mezd, [Concept('concept_building','budovy')|l] to udělá pouze tehdy, pokud to bude potřebné k přilákání více populace do své [Concept('concept_workforce','pracovní síly')]. Pokud je [Concept('concept_building_balance','bilance')|l] [Concept('concept_building','budovy')|l] negativní, zváží snížení mezd k obnovení ziskovosti.\n\nMůžete zajistit, že pracovní síle budou vyplaceny konkurenceschopné mzdy tím, že budete budovu [Concept('concept_subsidies','dotovat')]. To ji udrží nad vodou díky prostředkům z [Concept('concept_treasury','státní pokladny')], pokud to bude nezbytné." # todo: CONCEPT CASE
 concept_sell_orders: "Prodejní objednávky"
 concept_sell_order: "Prodejní objednávka"
 concept_sell_order_short: "Prodat"
 concept_sell_orders_supply: "Nabídka"
 concept_sell_orders_desc: "Počet objednávek na prodej [Concept('concept_good','zboží')|l] na centrálním [Concept('concept_market','trhu')] se používá v kombinaci s [Concept('concept_buy_orders','nákupními objednávkami')] k určení jeho [Concept('concept_market_price','tržní ceně')]. Prodejní objednávky jsou generovány výrobou zboží v každém ze [Concept('concept_state','státu')] trhu. Čím vyšší je [Concept('concept_market_access','přístup na trh')|l] daného [Concept('concept_state','státu')], tím blíže bude počet generovaných prodejní objednávek k celkové výrobě." # todo: CONCEPT CASE
 concept_buy_orders: "Nákupní objednávky"
 concept_buy_order: "Nákup"
 concept_buy_order_short: "Koupit"
 concept_buy_orders_demand: "Poptávka"
 concept_buy_orders_desc: "Počet objednávek na nákup [Concept('concept_good','zboží')|l] na centrálním [Concept('concept_market','trhu')] se používá v kombinaci s [Concept('concept_sell_orders','prodejními objednávkami')] k určení jeho [Concept('concept_market_price','tržní ceně')]. Nákupní objednávky jsou generovány spotřebou zboží na [Concept('concept_market','trh')] v každém [Concept('concept_state','státě')]. Čím vyšší má [Concept('concept_state','stát')|l] [Concept('concept_market_access','přístupu na trh')|l], tím blíže bude počet vygenerovaných nákupních objednávek k celkové spotřebě." # todo: CONCEPT CASE
 concept_head_of_state: "Hlava státu"
 concept_head_of_state_desc: "Jediný [Concept('concept_ruler','vládce')|l] nebo nejvyšší zástupce [Concept('concept_country','země')|l]. [Concept('concept_government_type','Typ vlády')] určuje, kdo slouží jako hlava státu a kdy je nahrazen.[AddLocalizationIf(GetPlayer.IsValid, 'concept_head_of_state_ingame_added')]" # todo: CONCEPT CASE
 concept_head_of_state_ingame_added: "\n\nZa [$GetPlayer.GetAdjectiveNoFlag$] [Concept('concept_head_of_state','hlavu státu')] je považován [GetPlayer.GetRuler.GetFullNameWithTitle|l]."
 concept_government_type: "Typ vlády"
 concept_government_types: "Typy vlády"
 concept_government_type_transfer_of_power: "Způsob předání moci"
 concept_government_type_desc: "Typ vlády [Concept('concept_country','země')] určují její [Concept('concept_law','zákony')|l] a také je určen způsobem předání moci – tedy kdo zastává funkci [Concept('concept_head_of_state','hlavu státu')].[AddLocalizationIf(GetPlayer.IsValid,'concept_government_type_ingame_added')]" # todo: CONCEPT CASE
 concept_government_type_ingame_added: "\n\nTyp vlády v [GetPlayer.GetAltAdjectiveNoFlag('L')] je #tooltippable #tooltip:[GetPlayer.GetGovernment.GetTooltipTag],GOVERNMENT_TYPE_TOOLTIP_DESC [GetPlayer.GetGovernment.GetName]#!#!, z následujících důvodů:\n[GetPlayer.GetGovernment.GetPossibleTriggerDesc(AccessPlayer)]" # todo: CONCEPT CASE
 concept_transfer_of_power: "Přenos moci"
 concept_transfer_of_power_desc: "Přenos moci určuje, jak je [Concept('concept_ruler','vládcova')] moc předávána následujícímu vládci a kdy se tento přenos uskuteční."
 concept_recognized_power: "Uznaná mocnost"
 concept_recognized_powers: "Uznané mocnosti"
 concept_recognized_power_short: "Uznaná"
 concept_recognition: "Uznání"
 concept_recognized_power_desc: "Uznaná mocnost je považována za platný národní stát, schopný sebeurčení, a to na základě konsenzu [Concept('concept_great_power','velmoci')], čímž se odlišuje od [Concept('concept_unrecognized_power','neuznaných mocností')].\n\nNeuznaná mocnost se může stát uznanou mocností tím, že splní [Concept('concept_journal_entry','záznam v deníku')|l] #bold $je_earn_recognition$#!." # todo: CONCEPT CASE
 concept_unification_supporter: "Podporovatel sjednocení"
 concept_unification_supporters: "Podporovatelé sjednocení"
 concept_unification_support: "Podpora"
 concept_unification_supporting: "Podporující"
 concept_unification_supporter_desc: "Podporovatel sjednocení je [Concept('concept_country','země')|l], která favorizuje konkrétního [Concept('concept_unification_candidate','kandidáta pro sjednocení')]. Pokud se sjednocení zdaří, stane se podporovatel sjednocení součástí unie." # todo: CONCEPT CASE
 concept_unification_candidate: "Kandidát pro sjednocení"
 concept_unification_candidate_short: "Kandidát"
 concept_unification_candidates: "Kandidáti pro sjednocení"
 concept_unification_candidate_desc: "Kandidát pro sjednocení je [Concept('concept_country','země')|l], která se považuje za životaschopného kandidáta pro sjednocení. Podmínky pro to, kdo bude kvalifikován jako kandidát pro sjednocení, se liší v závislosti na tom, o který sjednocený národ se jedná." # todo: CONCEPT CASE
 concept_unification: "Sjednocení země"
 concept_unification_short: "Sjednocení"
 concept_unify: "Sjednotit"
 concept_unified: "Sjednoceno"
 concept_major_unification: "Významné sjednocení"
 concept_minor_unification: "Lokální sjednocení"
 concept_unification_desc: "Akt sloučení a vytvoření novou [Concept('concept_country','zemi')|l] z několika zemí se nazývá sjednocení. Země může být vytvořena ovládaním určeného počtu [Concept('concept_state','států')] v regionu nové země.\n\n#b Významné sjednocení#! umožňuje [Concept('concept_countries','zemím')] stát se [Concept('concept_unification_candidate','kandidátem pro sjednocení')], což jim dává přístup k [Concept('concept_diplomatic_play','diplomatické hře')] o sjednocení. Tato diplomatická hra nastaví [Concept('concept_war_goal','válečné cíle')|l] na anektování všech požadovaných států a zemí.\n\n#b Lokální sjednocení#! naopak neumožňuje žádné [Concept('concept_unification_candidate','kandidáty')] a země ji může vytvořit pouze v případě, že ovládá určený počet požadovaných států." # todo: CONCEPT CASE
 concept_order: "Rozkaz"
 concept_orders: "Rozkazy"
 concept_ordered: "Rozkázáno"
 concept_order_desc: "[Concept('concept_commander','Velitel')] lze zadat $concept_orders$, které je přimějí usilovat o různé vojenské cíle v závislosti na jejich aktuální pozici. Všichni $concept_commanders$ mají několik základních rozkazů, ale jejich [Concept('concept_character_trait','charakterové rysy')] mohou tomu kterému veliteli přidat speciální $concept_orders$ k použití.\n\nZákladní příkazy [Concept('concept_general','generál')] jsou:\n[GetBasicGeneralOrdersBreakdown]" # todo: CONCEPT CASE
 concept_naval_mission: "Námořní mise"
 concept_naval_missions: "Námořní mise"
 concept_naval_mission_short: "Mise"
 concept_naval_missions_short: "Mise"
 concept_naval_mission_desc: "[Concept('concept_fleet','Loďstvo')] lze přiřadit k námořním misím, aby určily, na co se mají soustředit. Mise probíhá v souboru propojených [Concept('concept_sea_node','námořního uzlu')] a má různé efekty v závislosti na typu misí." # todo: CONCEPT CASE
 concept_naval_mission_area_limit: "Limit oblasti námořní mise"
 concept_naval_mission_area_limit_desc: "Maximální počet [Concept('concept_sea_node','mořské regiony')] které lze přiřadit k misím. Tento limit je určen [Concept('concept_commander_rank','hodnost velitele')] přiřazeného [Concept('concept_admiral','admirála')]." # todo: CONCEPT CASE
 concept_party: "Strana"
 concept_parties: "Strany"
 concept_party_possessive: "Strany"
 concept_party_desc: "Strana je politická entita, která se účastní [Concept('concept_election','voleb')]. Skládají se z jedné nebo více [Concept('concept_interest_group','zájmové skupiny')], jejichž [Concept('concept_ideology','ideologie')|l] jsou alespoň částečně kompatibilní. Tyto zájmové skupiny jsou posíleny [Concept('concept_votes','hlasů')], které strana získala proporcionálně k jejich [Concept('concept_clout','politického vlivu')]. Individuální zájmové skupiny nemohou být zahrnuty do [Concept('concept_government','vlády')] bez ostatních členů strany." # todo: CONCEPT CASE
 concept_party_leader: "Vůdce strany"
 concept_party_leader_short: "Vůdce"
 concept_party_leader_desc: "[Concept('concept_leader','Vůdce')] zájmové skupiny v [Concept('concept_party','straně')] s největším [Concept('concept_clout','politickým vlivem')] se považuje za vůdce politické strany. Vůdce slouží jako [Concept('concept_party_whip','stranický bič')|l]." # todo: CONCEPT CASE
 concept_party_leaders: "Vůdci strany"
 concept_party_leaders_short: "Lídři"
 concept_party_leaders_desc: "$concept_party_leader_desc$"
 concept_suppress: "Potlačení"
 concept_suppressed: "Potlačeno"
 concept_suppressing: "Potlačování"
 concept_suppression: "Potlačení"
 concept_suppress_desc: "Potlačované [Concept('concept_political_movement','politické hnutí')|l] je pro [Concept('concept_pop','populace')] méně atraktivní. Vaše základní schopnost potlačení je určena vaším [Concept('concept_law','zákonem')] [SelectLocalization(GetPlayer.IsValid,'concept_suppress_desc_added','Svoboda projevu')]. Potlačování [Concept('concept_interest_group','Zájmová skupina')|l] stojí [Concept('concept_authority','autoritu')]." # todo: CONCEPT CASE
 concept_suppress_desc_added: "[GetLawGroup('lawgroup_free_speech').GetName]"
 concept_bolster: "Posílení"
 concept_bolstered: "Posíleno"
 concept_bolsters: "Posílení"
 concept_bolstering: "Posílení"
 concept_bolster_desc: "Posílené politické hnutí je atraktivnější pro podporu ze strany [Concept('concept_pop','populace')]. Vaše základní schopnost posílení je určena vaším [Concept('concept_law','zákonem')] [SelectLocalization(GetPlayer.IsValid,'concept_bolster_desc_added','Svoboda projevu')]. Posílení zájmové skupiny stojí [Concept('concept_authority','autoritu')]." # todo: CONCEPT CASE
 concept_bolster_desc_added: "[GetLawGroup('lawgroup_free_speech').GetName]"
 concept_journal_entry: "Záznam v deníku"
 concept_journal: "Deník"
 concept_journal_entries: "Záznamy deníku"
 concept_journal_entry_desc: "Záznamy deníku sledují probíhající události ve vaší zemi. Mohou představovat příležitosti nebo výzvy, připomínat vám sliby, které jste udělali, nebo varovat před potenciálními krizemi, které se mohou objevit.\n\nZáznamy deníku se obvykle vyřeší a jsou odstraněny z vašeho deníku poté, co jsou považovány za #bold Dokončeny#!. Ne všechny záznamy v deníku mohou být #bold Dokončeny#! - některé mohou pouze #bold Selhat#!, #bold Vypršet#!, nebo budou odstraněny za určitých podmínek." # todo: CONCEPT CASE
 concept_political_lobby: "Politické lobby"
 concept_political_lobby_short: "Lobby"
 concept_political_lobbies_short: "Lobby"
 concept_political_lobby_short_possessive: "lobbistické"
 concept_political_lobbies: "Politická lobby"
 concept_political_pro_lobby: "Pro-lobby"
 concept_political_pro_lobbies: "Pro-lobby"
 concept_political_anti_lobby: "Antilobby"
 concept_political_anti_lobbies: "Antilobby"
 concept_political_lobby_desc: "Politické lobby je sdružení [Concept('concept_interest_group','zájmových skupin')], které jsou buď proti, nebo naopak, podporují určitou [Concept('concept_country','zemí')].\n\nZájmové skupiny v lobby získávají [Concept('concept_approval','spokojenost')|l] na základě úrovně[Concept('concept_political_lobby_appeasement','vyhovění')|l] lobby.\n\nLobby usnadňují nebo komplikují provádění [Concept('concept_diplomatic_action','diplomatických akcí')] proti cílové zemi, tím, že ovlivňují náklady na [Concept('concept_influence','vliv')|l] a zda země bude souhlasit s návrhy. Lobby v [Concept('concept_subject','závislém území')], které cílí na svého [Concept('concept_overlord','vládce')|l], ovlivňují [Concept('concept_liberty_desire','touhu po svobodě')]. Tyto efekty se škálují podle [Concept('concept_clout','politického vlivu')] lobby.\n\n[AddLocalizationIf( HasDlcFeature('lobbies'),'concept_political_lobby_desc_DEMANDS_OPPORTUNITIES')] Lobby se mohou formálně vytvořit náhodně, když nastane [Concept('concept_diplomatic_catalyst','diplomatický katalyzátor')|l], nebo když jedna země [Concept('concept_fund_lobbies','financuje lobbisty')] v jiné." # todo: CONCEPT CASE
 concept_political_lobby_desc_DEMANDS_OPPORTUNITIES: "Čas od času, lobby vznášejí [Concept('concept_political_lobby_demand','požadavky')|l]. Pokud je lobby podpořena [Concept('concept_interest_group','zájmovými skupinami')] [Concept('concept_in_government','ve vládě')|l], lobby také představují [Concept('concept_political_lobby_opportunity','příležitosti')|l].\n\n" # todo: CONCEPT CASE
 concept_political_lobby_appeasement: "Vyhovění"
 concept_political_lobby_appease: "Vyhovět"
 concept_political_lobby_appeasing: "Vyhovování"
 concept_political_lobby_appeasement_desc: "Vyhovění [Concept('concept_political_lobby','politické lobby')|l] ovlivňuje [Concept('concept_approval','spokojenost')|l] lobbistů [Concept('concept_interest_group','zájmové skupiny')].\n\nVyhovění se mění na základě vašich [Concept('concept_diplomatic_action','diplomatické akce')] proti zemi lobistů. Pro-lobby je vyhověno přátelskými akcemi, zatímco $concept_political_anti_lobbies$ je vyhověno nepřátelskými akcemi." # todo: CONCEPT CASE
 concept_political_lobby_opportunity: "Příležitost lobby"
 concept_political_lobby_opportunities_short: "Příležitosti"
 concept_political_lobby_opportunity_short: "Příležitost"
 concept_political_lobby_opportunity_desc: "Speciální [Concept('concept_journal_entry','záznam v deníku')|l] nabízený [Concept('concept_political_lobby','politickou lobby')] podporovanou [Concept('concept_interest_group','zájmovou skupinu')] [Concept('concept_in_government','ve vládě')|l].\n\nTyto poskytují zvláštní šanci dosáhnout něčeho, co by normálně bylo nemožné." # todo: CONCEPT CASE
 concept_political_lobby_demand: "Požadavek lobbistů"
 concept_political_lobby_demands_short: "Požadavky"
 concept_political_lobby_demand_short: "Požadavek"
 concept_political_lobby_demand_desc: "[Concept('concept_journal_entry','Záznam v deníku')] předložený [Concept('concept_political_lobby','politickou lobby')].\n\nSplnění požadavku zvýší úroveň[Concept('concept_political_lobby_appeasement','vyhovění')|l] lobby." # todo: CONCEPT CASE
 concept_diplomatic_catalyst: "Diplomatický katalyzátor"
 concept_diplomatic_catalyst_short: "Katalyzátor"
 concept_diplomatic_catalysts_short: "Katalyzátory"
 concept_diplomatic_catalysts: "Diplomatické katalyzátory"
 concept_diplomatic_catalyst_desc: "Diplomatický katalyzátor je v podstatě jakákoliv diplomatická událost, která může vytvořit [Concept('concept_political_lobby','politickou lobby')] nebo změnit postoj [Concept('concept_country','země')] vůči vám.\n\nKatalyzátory mohou být jakékoli změny na světovém jevišti, například:\n$EFFECT_LIST_BULLET$[Concept('concept_diplomatic_action','Diplomatická akce')]\n$EFFECT_LIST_BULLET$Akce provedené v [Concept('concept_diplomatic_play','diplomatické hře')]\n$EFFECT_LIST_BULLET$Změna úrovně [Concept('concept_relations','vztahů')]" # todo: CONCEPT CASE
 concept_end_of_discussion_factor: "Faktor zbytečné diskuse"
 concept_end_of_discussion_factor_desc: "Faktor zbytečné diskuse znamená, že [Concept('concept_interest_group','zájmové skupiny')|l] ve [Concept('concept_government','vládě')] považují další diskusi o oprávněnosti aktuálně schvalovaného [Concept('concept_law','zákona')] za zbytečnou. Čím nižší je tento faktor, tím menší nátlak vyvíjí na možnost, že schválení může mít $concept_enactment_advance_short$ nebo nastane $concept_enactment_stall_short$." # todo: CONCEPT CASE
 concept_enactment_of_laws: "Schvalování zákonů"
 concept_enactment_of_laws_enactment: "Uzákonění"
 concept_enactment_of_laws_enact: "Uzákonit"
 concept_enactment_of_laws_enacting: "Uzákoňování"
 concept_enactment_of_laws_enacted: "Uzákoněn"
 concept_enactment_of_laws_desc: "Proces prosazení nový [Concept('concept_law','zákona')] prostřednictvím několika [Concept('concept_enactment_phase','fází schvalování')|l] schvalování v zákonodárném sboru dané [Concept('concept_country','země')]. V pravidelných intervalech se testuje šance na [Concept('concept_enactment_success','prosazení')] zákona. Délka těchto intervalů se může lišit podle konkrétního zákona a také závisí na [Concept('concept_legitimacy','legitimnosti')] [Concept('concept_government','vládu')|l]. Pokud zákon nepostoupí do další [Concept('concept_enactment_phase','fáze schvalování')|l], může nastat [Concept('concept_enactment_advance','pokrok')],  [Concept('concept_enactment_debate','diskuze')] nebo [Concept('concept_enactment_stall','obstrukce')] — což ovlivní jeho šanci na schválení v dalším testu nebo přinese jiné důsledky pro vaši zemi.\n\nAby mohl být zákon [Concept('concept_enactment_of_laws','schválen')], musí být [Concept('concept_endorse_oppose','podpořen')] alespoň jednou zájmovou skupinou [Concept('concept_in_government','ve vládě')|l], mít podporu aktuálního [Concept('concept_political_movement','politického hnutí')], nebo mít z jiného důvodu kladnou šanci [Concept('concept_enactment_success','na prosazení')]." # todo: CONCEPT CASE
 concept_enactment_of_laws_potential: "Aby mohl být zákon [Concept('concept_enactment_of_laws','schválen')], musí být [Concept('concept_endorse_oppose','podpořen')] alespoň jednou zájmovou skupinou [Concept('concept_in_government','ve vládě')|l], mít podporu aktuálního [Concept('concept_political_movement','politického hnutí')], nebo mít z jiného důvodu kladnou šanci [Concept('concept_enactment_success','na prosazení')]." # todo: CONCEPT CASE
 concept_enactment_success: "Úspěšné uzákonění zákona"
 concept_enactment_success_short: "Úspěch"
 concept_enactment_successes: "Úspěchy"
 concept_enactment_success_desc: "Úspěšné uzákonění zákona naznačuje procentuální šanci, že [Concept('concept_law','zákon')|l] postoupí do další [Concept('concept_enactment_phase','fáze schvalování')|l] při dalším milníku. Je rovno [Concept('concept_base_success_chance','základní šanci na úspěch')|l] plus jakýmkoliv účinkům nahromaděným během procesu schvalování. Základní šance na úspěch se zvyšuje podporou [Concept('concept_interest_group','zájmovou skupinou')] [Concept('concept_in_government','ve vládě')|l], [Concept('concept_political_movement','politickým hnutím')], které mají [Concept('concept_activism','aktivismus hnutí')|l] na úrovni alespoň $RADICALISM_AGITATING$ #v 25%#!, nebo [Concept('concept_endorse_oppose','podporou')] od [Concept('concept_ruler','vládcove')] [Concept('concept_ideology','ideologie')|l]." # todo: CONCEPT CASE
 concept_enactment_advance: "Pokrok uzákonění"
 concept_enactment_advance_short: "Pokrok"
 concept_enactment_advance_desc: "Pokrok uzákonění naznačuje procentuální šanci, že proces přijetí [Concept('concept_law','zákona')] na následujícím milníku nějakým způsobem pokročí, i když nebude dokončen nebo postoupí do další [Concept('concept_enactment_phase','fáze schvalování')|l]. Je odvozen ze [Concept('concept_base_success_chance','základní šance na úspěch')|l]." # todo: CONCEPT CASE
 concept_enactment_debate: "Diskuze o zákoně"
 concept_enactment_debate_short: "Diskuze"
 concept_enactment_debate_short_debated: "Diskutováno"
 concept_enactment_debate_desc: "Diskuze o zákoně naznačuje procentuální šanci, že proces přijetí [Concept('concept_law','zákona')] na následujícím milníku narazí na nějakou komplikaci. Čím nižší jsou celkové šance na [Concept('concept_enactment_success','úspěch')], [Concept('concept_enactment_advance','pokrok uzákonění')] a [Concept('concept_enactment_stall','obstrukci')], tím větší je šance na to, že nastane $concept_enactment_debate_short$." # todo: CONCEPT CASE
 concept_enactment_stall: "Obstrukce"
 concept_enactment_stall_short: "Obstrukce"
 concept_enactment_stall_desc: "Obstrukce naznačuje procentuální šanci, že proces přijetí [Concept('concept_law','zákona')] bude výrazně zbržděn na cestě k dalšímu milníku. Jeho základní šance je rovna celkovému [Concept('concept_clout','politickému vlivu')] opozičních [Concept('concept_interest_group','zájmové skupiny')],  jejichž [Concept('concept_approval','spokojenost')|l] je na úrovni $ig_approval_unhappy$ nebo $ig_approval_angry$." # todo: CONCEPT CASE
 concept_base_success_chance: "Základní šance na úspěch"
 concept_base_success_chance_desc: "Základní šance na úspěch je rovna celkovému [Concept('concept_clout', 'politickému vlivu')|l] od podporující [Concept('concept_interest_group','zájmové skupiny')|l] ve [Concept('concept_government','vládě')|l] plus/mínus [Concept('concept_political_movement_support','podpory')] získané od jakýchkoli relevantních [Concept('concept_political_movement','politického hnutí')]." # todo: CONCEPT CASE
 concept_advance_factor: "Faktor pokroku"
 concept_advance_factor_desc: "Faktor pokroku je statický faktor používaný k určení [Concept('concept_enactment_advance','pokroku přijetí')] tím, že škáluje s [Concept('concept_base_success_chance','základní šancí na úspěch')]." # todo: CONCEPT CASE
 concept_migration_pull: "Migrační přitažlivost"
 concept_migration_pull_short: "Přitažlivost"
 concept_migration_pull_desc: "Migrační přitažlivost je schopnost [Concept('concept_state','státu')] přitáhnout migranty. Závisí převážně na průměrným [Concept('concept_sol','životném standardu')] mezi [Concept('concept_pop','populacemi')] ve státě, ale může být modifikován dalšími faktory. Jakákoliv [Concept('concept_unemployed','nezaměstnanost')|l] ve státě sníží migrační přitažlivost. Hodnota je srovnávána s jinými státy, mezi kterými by mohlo dojít k migraci, aby bylo určeno, kterým směrem migranti pravděpodobně půjdou.\n\nMigrační přitažlivost je také primární faktor používaný k určení [Concept('concept_mass_migration_pull','přitažlivosti hromadné migrace')|l] [Concept('concept_country','zemím')|l]." # todo: CONCEPT CASE
 concept_cultural_community: "Kulturní komunita"
 concept_cultural_communities: "Kulturní komunity"
 concept_cultural_community_short: "Komunita"
 concept_cultural_community_desc: "Kulturní komunita naznačuje, že v [Concept('concept_state','státě')] je přítomna určitá [Concept('concept_culture','kultura')|l], což umožňuje [Concept('concept_pop','populaci')] ve vašem [Concept('concept_market','trhu')] migrovat do tohoto státu.\n\nNově vytvořená komunita bude mít dočasně nižší [Concept('concept_acceptance','přijetí')|l], to ale během času zmizí. Nový [Concept('concept_law','zákon')|l], který změní [Concept('concept_acceptance','přijetí')|l], může také potřebovat čas na realizaci, a tak [Concept('concept_pop','populace')] z této komunity budou dočasně mít jiné [Concept('concept_acceptance','přijetí')|l] než je normální." # todo: CONCEPT CASE
 concept_lower_strata: "Nižší třída"
 concept_lower_strata_short: "Nižší"
 concept_lower_strata_desc: "Nižší třída tvoří [Concept('concept_pop','populace')|l] v [Concept('concept_profession','profesi')], která zahrnují manuální nebo opakující se práci, jež vyžaduje málo nebo žádné [Concept('concept_pop_qualifications','kvalifikace')|l] a přináší nízké [Concept('concept_building_wage','mzdy')|l].\n\n$STRATA_CONCEPTS_DEPEND_ON_SOCIAL_HIERARCHY$" # todo: CONCEPT CASE
 concept_middle_strata: "Střední třída"
 concept_middle_strata_short: "Střední"
 concept_middle_strata_desc: "Střední třída se skládá z [Concept('concept_pop','populací')|l] se specializovanými [Concept('concept_profession','profesemi')], pro které je obtížnější získat [Concept('concept_pop_qualifications','kvalifikace')|l]. To jim poskytuje více možností na trhu práce a tím i vyšší [Concept('concept_building_wage','mzdy')|l].\n\n$STRATA_CONCEPTS_DEPEND_ON_SOCIAL_HIERARCHY$" # todo: CONCEPT CASE
 concept_upper_strata: "Vyšší třída"
 concept_upper_strata_short: "Vyšší"
 concept_upper_strata_desc: "Vyšší třída se skládá z [Concept('concept_pop','populací')|l], která se [Concept('concept_pop_qualifications','kvalifikuje')] pro určité [Concept('concept_profession','profese')|l] - převážně na základě svého [Concept('concept_wealth','bohatství')|l]. Obvykle nejsou dostupné pro populaci s nízkou mírou společenského [Concept('concept_acceptance','přijetím')|l]. Mají často [Concept('concept_ownership_share','podíly na vlastnictví')|l] ve svých [Concept('concept_building','budově')], pobírají [Concept('concept_dividends','dividendách')|l], [Concept('concept_budget_interest','úroku')] z rozpočtu a kromě toho také standardní [Concept('concept_building_wage','mzdy')|l] z budov\n\n$STRATA_CONCEPTS_DEPEND_ON_SOCIAL_HIERARCHY$" # todo: CONCEPT CASE
 concept_incoming_units: "Jednotky v procesu náboru"
 concept_incoming_units_short: "Nábor"
 concept_incoming_units_desc: "Každá jednotka v procesu náboru má buď úroveň [Concept('concept_military_building','vojenské budovy')] ve [Concept('concept_construction_queue','stavební frontě')], nebo má [Concept('concept_military_building','vojenské budově')], která se pokouší najímat [Concept('concept_pop','populaci')] za účelem vytvoření [Concept('concept_unit','vojenské jednotky')]." # todo: CONCEPT CASE
 concept_neighbors: "Sousedé"
 concept_neighboring: "Sousední"
 concept_neighbors_desc: "Dvě [Concept('concept_country','země')|l] se považují za sousedy, pokud sdílí pozemní hranici nebo obě vlastní pobřežní [Concept('concept_state','státy')|l], které jsou spojeny s tím samým [Concept('concept_sea_node','námořním uzlem')]." # todo: CONCEPT CASE
 concept_welfare_payments: "Sociální dávky"
 concept_welfare_payments_desc: "Sociální dávky jsou formou přímé dotace, kterou [Concept('concept_country','zemi')|l] poskytuje všem populacím v [Concept('concept_workforce','pracovní síle')], kteří dostávají mzdy nižší než definovaná část [Concept('concept_normal_wage','standardní mzdy')]." # todo: CONCEPT CASE
 concept_sea_node: "Námořní uzel"
 concept_sea_nodes: "Námořní uzly"
 concept_sea_node_desc: "Křižovatka nebo bod podél námořní [Concept('concept_shipping_lane','námořní trasy')] představující část oceánu. Námořní trasy vždy volí trasu s nejkratší cestovní vzdáleností mezi dvěma pobřežními [Concept('concept_state','státy')]. Za každou násobnou hodnotu očekávané cestovní vzdálenosti (#v [GetDefine('NEconomy','SEA_DISTANCE_EXPECTED_TRAVEL_DISTANCE')]#!) se do přepravních nákladů přičte #v [GetDefine('NEconomy','SHIPPING_LANE_MERCHANT_MARINE_COST_SCALING')|=-%0]#!." # todo: CONCEPT CASE
 concept_sea_region: "Mořský region"
 concept_sea_regions: "Mořské regiony"
 concept_sea_region_short: "Region"
 concept_sea_regions_short: "Regiony"
 concept_agitator: "Agitátor"
 concept_agitators: "Agitátoři"
 concept_agitate: "Agitovat"
 concept_agitator_possessive: "agitátorův"
 concept_agitator_desc: "[Concept('concept_character_role','Role')] pro [Concept('concept_character','postavu')|l], které podporují [Concept('concept_political_movement','politické hnutí')|l] a činí ho atraktivnějším pro [Concept('concept_individual','jednotlivce')] patřící k jejich [Concept('concept_interest_group','zájmové skupině')]. Agitátoři mohou být pozváni pomocí akce postavy #b Pozvat [Concept('concept_exile','exulantovi')]#! nebo se náhodně objeví ve vaší zemi díky šanci na objevení, která závisí na [Concept('concept_literacy','gramotnost')] [Concept('concept_country','země')|l].\n\nAgitátoři mohou být pozváni pouze v případě, že jejich [Concept('concept_acceptance_status','statusu přijetí')|l] je ve vaší [Concept('concept_country','zemi')|l] na následující úrovni: $SECOND_RATE_CITIZEN_GC_LINK$ nebo $FULL_ACCEPTANCE_GC_LINK$.\n\n[Concept('concept_political_movement','Politické hnutí')], které podporují, je určeno jejich [Concept('concept_ideology','ideologii')|l]. Jeho vliv na vlastní [Concept('concept_political_movement','politické hnutí')|l] určuje [Concept('concept_popularity','popularitě')|l] agitátora a jeho [Concept('concept_character_trait','charakterovému rysu')|l]." # todo: CONCEPT CASE
 AGITATORS_TITLE: "[Concept('concept_agitator','Agitátor')]" # todo: CONCEPT CASE
 concept_exile: "Exulant"
 concept_exiles: "Exulanti"
 concept_exiled: "Vyhnán"
 concept_in_exile: "Ve vyhnanství"
 concept_exile_desc: "[Concept('concept_character','Postava')] může být vyhnána pomocí akce postavy #b Poslat disidenta do exilu#!. Postava se stává [Concept('concept_agitator','agitátorem')] a je vyhoštěna z vaší země.\n\nVyhnána postava může být pozvána do jakéhokoli [Concept('concept_country','zemí')|l] pomocí akce postavy #b Pozvat exulanta#!, kde okamžitě odstartuje nebo se připojí k [Concept('concept_political_movement','politickému hnutí')] pro tuto zemi v souladu s jeji [Concept('concept_ideology','ideologii')]. Pokud jsou všechny jejich [Concept('concept_endorse_oppose', 'podporované')] [Concept('concept_law','zákony')|l] již aktivní, když přijdou, pozvaný agitátor zůstane nečinný.\n\nVyhnána postava může být pozvána pouze v případě, že jejich [Concept('concept_acceptance_status','status přijetí')|l] je ve vaší [Concept('concept_country','zemi')] jedním z následujících : $SECOND_RATE_CITIZEN_GC_LINK$ nebo $FULL_ACCEPTANCE_GC_LINK$." # todo: CONCEPT CASE
 concept_message_settings_feed: "Výpis"
 concept_message_settings_feed_desc: "Oznámení, která se zobrazují chronologicky v okně v pravém dolním rohu obrazovky."
 concept_message_settings_toast: "Upozornění"
 concept_message_settings_toasts: "Upozornění"
 concept_message_settings_toast_desc: "Notifikace, které se zobrazují jedna po druhé ve středu obrazovky."
 concept_message_settings_popup: "Okno"
 concept_message_settings_popup_desc: "Přizpůsobená oznámení, která se zobrazují uprostřed obrazovky a musí být manuálně zavřena. Tato volba je k dispozici pouze v případě, že typ oznámení má přizpůsobené vyskakovací okno."
 concept_message_settings_none: "Žádné"
 concept_message_settings_none_desc: "Oznámení, která se nikde neobjeví v uživatelském rozhraní."
 concept_alert_settings_alert: "Upozornění"
 concept_alert_settings_alerts: "Upozornění"
 concept_alert_settings_alert_desc: "Upozornění, která se objevují jako vlastní prvek s ikonou napravo od [Concept('concept_capacity','kapacity')] a #b Aktuální situace#! v horní části obrazovky." # todo: CONCEPT CASE
 concept_alert_settings_important_action: "Důležitá akce"
 concept_alert_settings_important_actions: "Důležité akce"
 concept_alert_settings_important_action_desc: "Upozornění, která se zobrazují v seznamu při kliknutí na tlačítko #b Aktuální situace#!."
 concept_alert_settings_angry_important_action: "Důležité (červené) varování"
 concept_alert_settings_angry_important_actions: "Důležité (červené) varování"
 concept_alert_settings_angry_important_action_desc: "Červené poplachy, které se zobrazují v seznamu, když kliknete na tlačítko #b Aktuální situace#!."
 concept_alert_settings_none: "Žádný"
 concept_alert_settings_none_desc: "Upozornění/důležité akce, které se nikde ve uživatelském rozhraní nezobrazují."
 concept_training_rate: "Míra výcviku"
 concept_training_rate_desc: "Míra výcviku udává, kolik [Concept('concept_manpower','personál')] lze vycvičit týdně ve [Concept('concept_military_building','vojenské budově')]." # todo: CONCEPT CASE
 concept_landing_progress: "Pokrok vylodění"
 concept_landing_progress_desc: "Úroveň pokroku vylodění představuje, kolik [Concept('concept_occupation','okupaci')|l] získala útočíci [Concept('concept_country','země')|l] z napadeného [Concept('concept_state','státu')]. Pokud $concept_landing_progress$ dosáhne #v 100%#!, #b Námořní invaze#! je úspěšná a bude založena [Concept('concept_front','fronta')|l]." # todo: CONCEPT CASE
 concept_naval_invasion_support: "Podpora námořní invaze"
 concept_naval_invasion_support_desc: "Podpora námořní invaze je srovnání množství [Concept('concept_ship','lodí')] přidělených k námořní invazi s množstvím [Concept('concept_battalion','praporem')] zapojených do stejné invaze. Každý útočící prapor vyžaduje flotilu, aby se vyhnul jakýmkoli negativním postihům při vylodění." # todo: CONCEPT CASE
 concept_capitulation_desire: "Touha po kapitulaci"
 concept_capitulation_desire_desc: "[Concept('concept_country','Země')] ovládaná AI se pokusí kapitulovat, pokud tato hodnota dosáhne 0 nebo více." # todo: CONCEPT CASE
 concept_risk: "Riziko"
 concept_risk_desc: "Riziko konkrétního typu [Concept('concept_terrain','terénu')] ovlivňuje množství [Concept('concept_casualties','ztrát')] a [Concept('concept_wounded','zranění')|l], které by mohli být výsledkem [Concept('concept_battle','bitvou')]." # todo: CONCEPT CASE
 concept_terrain_labels: "Popisky terénu"
 concept_terrain_labels_desc: "Popisek [Concept('concept_terrain','terénu')] je seskupení několika terénních typů. [Concept('concept_character_trait','Charakterový rys')] mohou mít [Concept('concept_modifier','modifikátory')|l], které ovlivňují všechny terénní typy s konkrétním popiskem terénu." # todo: CONCEPT CASE
 concept_job_satisfaction: "Spokojenost s prací"
 concept_job_satisfaction_satisfied: "Spokojeno"
 concept_job_satisfaction_dissatisfied: "Nespokojený"
 concept_job_satisfaction_desc: "Populace mohou být spokojeni nebo nespokojeni se svými zaměstnáními na základě řady faktorů, jako je jejich [Concept('concept_sol','životní standard')|l] nebo [Concept('concept_building_wage','mzda')|l]. To určuje, zda si budou hledat hledají nové [Concept('concept_employment','zaměstnání')|l], nebo ne." # todo: CONCEPT CASE
 concept_employment: "Zaměstnání"
 concept_employed: "Zaměstnaný"
 concept_employees: "Zaměstnanci"
 concept_employment_desc: "[Concept('concept_pop','Populace')] pracující v [Concept('concept_building','budově')] je považována za zaměstnanou. Zaměstnání poskytuje populaci [Concept('concept_building_wage','mzdu')] z budovy. Zaměstnaná populace může změnit zaměstnání, pokud se objeví práce s lepší mzdou, a pokud pro ni má potřebné [Concept('concept_pop_qualifications','kvalifikací')|l]." # todo: CONCEPT CASE
 concept_power_bloc: "Mocenský blok"
 concept_power_blocs: "Mocenské bloky"
 concept_power_bloc_possessive: "Mocenských bloků"
 concept_power_blocs_possessive: "mocenských bloků"
 concept_power_bloc_short: "Blok"
 concept_power_bloc_shorts: "Bloky"
 concept_power_bloc_desc: "Mocenské bloky sou nadnárodní asociace, které vede [Concept('concept_great_power','velmoc')|l], [Concept('concept_major_power','regionální mocnost')|l] nebo [Concept('concept_unrecognized_power','neuznávaná velmoc')|l], a které [Concept('concept_power_bloc_leader','vůdci mocenského bloku')|l] a [Concept('concept_power_bloc_member','členům mocenského bloku')] poskytují mocné efekty. Slouží [Concept('concept_power_bloc_leader','lídrům bloků')] při budování jejich sféry vlivu tím, že budují svou [Concept('concept_power_bloc_leverage_advantage','pákovou výhodu')] v [Concept('concept_country','zemích')] s cílem přimět je k připojení k [Concept('concept_power_bloc','mocenskému bloku')]." # todo: CONCEPT CASE
 concept_power_bloc_rank: "Hodnost mocenského bloku"
 concept_power_bloc_rank_short: "Hodnost"
 concept_power_bloc_rank_desc: "Hodnost [Concept('concept_power_bloc','mocenských bloků')|l] se zakládá výhradně na celkové [Concept('concept_prestige','prestiže')] svých [Concept('concept_power_bloc_member','člena mocenský bloku')] ve srovnání se všemi ostatními mocenskými bloky." # todo: CONCEPT CASE
 concept_power_bloc_leader: "Lídr mocenského bloku"
 concept_power_bloc_leader_possessive: "Vůdcova mocenského bloku"
 concept_power_bloc_leaders: "Vůdci mocenského bloku"
 concept_power_bloc_leader_short: "Vůdce bloku"
 concept_power_bloc_leader_possessive_short: "Vůdcova"
 concept_power_bloc_leaders_short: "Vůdcové bloku"
 concept_power_bloc_leader_extra_short: "Vůdce"
 concept_power_bloc_leader_possessive_extra_short: "Vůdcova"
 concept_power_bloc_leaders_extra_short: "Vůdci"
 concept_power_bloc_leader_desc: "Silná [Concept('concept_great_power','velmoc')|l], [Concept('concept_major_power','regionální mocnost')|l], nebo [Concept('concept_unrecognized_power','neuznávaná velmoc')|l] vedoucí [Concept('concept_power_bloc','mocenský blok')|l]. Mají tendenci více těžit z [Concept('concept_power_bloc','mocenského bloku')] než běžní [Concept('concept_power_bloc_member','členové')]." # todo: CONCEPT CASE
 concept_power_bloc_member: "Člen mocenského bloku"
 concept_power_bloc_members: "Členové mocenského bloku"
 concept_power_bloc_member_short: "Člen bloku"
 concept_power_bloc_members_short: "Členové bloku"
 concept_power_bloc_member_extra_short: "Člen"
 concept_power_bloc_members_extra_short: "Členové"
 concept_power_bloc_member_non_leader: "Běžný člen mocenského bloku"
 concept_power_bloc_members_non_leader: "Členové mocenského bloku"
 concept_power_bloc_member_short_non_leader: "Běžný člen bloku"
 concept_power_bloc_members_short_non_leader: "Běžní členové"
 concept_power_bloc_member_extra_short_non_leader: "Běžný člen"
 concept_power_bloc_members_extra_short_non_leader: "Běžní členové"
 concept_power_bloc_member_desc: "[Concept('concept_power_bloc','Mocenský blok')], což zahrňuje i [Concept('concept_power_bloc_leader','vůdce bloku')|l] #b s výjimkou#! situace, kdy se počítá [Concept('concept_power_bloc_mandate_progress','pokrokem mandátu')|l]. Běžní členové obvykle těží z [Concept('concept_power_bloc','mocenského bloku')] méně než jejich [Concept('concept_power_bloc_leader','lídři')]." # todo: CONCEPT CASE
 concept_power_bloc_identity: "Identita mocenského bloku"
 concept_power_bloc_identity_short: "Centrální identita"
 concept_power_bloc_identity_extra_short: "Identita"
 concept_power_bloc_identity_desc: "Identita mocenského bloku definuje základní hodnoty, na kterých je postaven [Concept('concept_power_bloc','mocenský blok')|l]. Určuje [Concept('concept_power_bloc_cohesion','soudržnost')|l] bloku a poskytuje speciální pravomoci [Concept('concept_power_bloc_leader','vůdce mocenský bloku')|l]. Mohou odemknout určité [Concept('concept_power_bloc_principle_group','skupinu principů')|l] principů." # todo: CONCEPT CASE
 concept_power_bloc_principle: "Princíp"
 concept_power_bloc_principles: "Principy"
 concept_power_bloc_principle_desc: "Principy patří do [Concept('concept_power_bloc_principle_group','skupiny principů')] a poskytují různé účinky na [Concept('concept_power_bloc','mocenský blok')|l] a jejich [Concept('concept_power_bloc_member','členy')]. Schválení principů stojí [Concept('concept_power_bloc_mandate','mandáty')|l] a také mohou být vylepšeny." # todo: CONCEPT CASE
 concept_power_bloc_primary_principle_group: "Primární principiální skupina"
 concept_power_bloc_primary_principle_groups: "Primární principiální skupiny"
 concept_power_bloc_primary_principle_group_short: "Primární skupina"
 concept_power_bloc_primary_principle_groups_short: "Primární skupiny"
 concept_power_bloc_primary_principle_group_extra_short: "Primární"
 concept_power_bloc_primary_principle_group_desc: "Primární principiální skupina závisí na  zvoleném [Concept('concept_power_bloc_identity','identitě mocenském bloku')] [Concept('concept_power_bloc','mocenském bloku')|l]. Mocenský blok musí vždy mít alespoň jeden [Concept('concept_power_bloc_principle','princíp')|l] z primární skupiny, aby měl stabilnou [Concept('concept_power_bloc_cohesion','soudržnosti')|l]. [Concept('concept_power_bloc_mandate','Mandátování')] vyššího stupně principů z primární skupiny (stupeň II a III) dále posiluje soudržnost." # todo: CONCEPT CASE
 concept_power_bloc_principle_group: "Skupina principů"
 concept_power_bloc_principle_groups: "Skupiny principů"
 concept_power_bloc_principle_group_desc: "Skupiny tří úrovní [Concept('concept_power_bloc_principle','principů')] podporujících stejnou oblast."
 concept_power_bloc_mandate: "Mandát"
 concept_power_bloc_mandates: "Mandáty"
 concept_power_bloc_mandated: "Mandátován"
 concept_power_bloc_mandating: "Mandátování"
 concept_power_bloc_mandate_desc: "Mandáty se používají k vylepšení, přehození nebo přijetí nových [Concept('concept_power_bloc_principle','principů')]. [Concept('concept_power_bloc','Mocenský blok')] získávají [Concept('concept_power_bloc_mandate_progress','pokrok mandátu')|l] tím, že mají silné [Concept('concept_power_bloc_member','člena mocenského bloku')] a vysokou hodnotu [Concept('concept_power_bloc_cohesion','soudržnost')]. Do zásoby mohou být uloženy až 3 mandáty." # todo: CONCEPT CASE
 concept_power_bloc_mandate_progress: "Pokrok mandátu"
 concept_power_bloc_mandate_progress_desc: "Pokrok směrem k dalšímu [Concept('concept_power_bloc_mandate','mandátu')]. [Concept('concept_power_bloc','Mocenský blok')] získávají pokrok tím, že mají silné [Concept('concept_power_bloc_member','člena mocenského bloku')] a vysokou hodnotu [Concept('concept_power_bloc_cohesion','soudržnost')]" # todo: CONCEPT CASE
 concept_power_bloc_cohesion: "Soudržnost"
 concept_power_bloc_cohesion_desc: "Soudržnost je ukazatel, jak dobře funguje [Concept('concept_power_bloc','mocenský blok')|l]. Je většinou ovlivněn [Concept('concept_power_bloc_identity','identitou centrálního pilíře')], což určuje, jak velký je jeho vliv na soudržnost. Čím větší je [Concept('concept_power_bloc','mocenský blok')|l], tím nižší bude jeho soudržnost." # todo: CONCEPT CASE
 concept_power_bloc_leverage: "Páka"
 concept_power_bloc_leverage_desc: "[Concept('concept_power_bloc','Mocenský blok')] si postupem času budují páku v [Concept('concept_country','zemích')], porovnáváním svého vlivu v zemi s vlivem ostatních mocenských bloků. Podíl páky lze získat různými interakcemi, například aktivním [Concept('concept_diplomatic_pact','diplomatickým paktem')] nebo [Concept('concept_treaty','smlouvou')], a aktuální páka se každý týden přibližuje tomuto podílu. Jakmile se nasbírá dostatečná [Concept('concept_power_bloc_leverage_advantage','pákovou výhodou')|l] nad zemí, může být pozvána do mocenského bloku." # todo: CONCEPT CASE
 concept_power_bloc_unclaimed_leverage: "Nenárokovaná páka"
 concept_power_bloc_unclaimed_leverage_short: "Nenárokovano"
 concept_power_bloc_unclaimed_leverage_desc: "Nenárokovaná páka [Concept('concept_country','země')|l] je [Concept('concept_power_bloc_leverage','páka')|l], kterou si u této země nenárokoval žádný [Concept('concept_power_bloc','mocenský blok')|l]. Je založena na #b Odporu vůči vlivu#! země, který je určen na základě řady faktorů jako jsou jejich [Concept('concept_law','zákony')|l] a [Concept('concept_pop','populace')|l] - čím více lidí, tím více lidí je nutno přesvědčit." # todo: CONCEPT CASE
 concept_power_bloc_leverage_advantage: "Páková výhoda"
 concept_power_bloc_leverage_advantage_short: "Výhoda"
 concept_power_bloc_leverage_disadvantage: "Páková nevýhoda"
 concept_power_bloc_leverage_disadvantage_short: "Nevýhoda"
 concept_power_bloc_leverage_advantage_desc: "Množství [Concept('concept_power_bloc_leverage','pákové výhody')], které má [Concept('concept_power_bloc','mocenský blok')|l] nad [Concept('concept_country','zeměmi')] ve srovnání s ostatními bloky. Pokud je hodnota #positive_value +kladná#!, tento mocenský blok má pákovú výhodu, což znamená, že má nejvíce pákové výhody ze všech bloků; pokud je #negative_value -záporná#!, tento mocenský blok má pákovú nevýhodu, což znamená, že některé jiné bloky mají v současnosti větší páku než on, nebo [Concept('concept_power_bloc_unclaimed_leverage','nenárokovaná páka')|l] tyhle země je vyšší.\n\nAby [Concept('concept_power_bloc_leader','lídr mocenského bloku')|l] mohl pozvat [Concept('concept_country','zemí')] do svého bloku, páková výhoda musí být kladná a dosáhnout potřebného prahu." # todo: CONCEPT CASE
 concept_power_bloc_leverage_share: "Podíl páky"
 concept_power_bloc_leverage_share_desc: "Podíl páky [Concept('concept_power_bloc','Mocenský blok')|l] na [Concept('concept_country','země')|l] je celková [Concept('concept_power_bloc_leverage','páka')|l], kterou [Concept('concept_power_bloc','mocenský blok')|l] může mít v jakémkoliv okamžiku na tuhle [Concept('concept_country','zemi')]. Země mají konečné množství [Concept('concept_power_bloc_leverage','páky')], kterou mohou [Concept('concept_power_bloc','mocenské bloky')|l] na ně projektovat. Tahle páka je rozdělena mezi všechny mocenské bloky s jakoukoliv [Concept('concept_power_bloc_leverage','páku')] nad touhle zemí a vyústí ve společný podíl páky mocenských bloků. Avšak určité množství [Concept('concept_power_bloc_leverage','páky')] může být [Concept('concept_power_bloc_unclaimed_leverage','nenárokovano')|l] na základě vlastního #b Odpor k vlivu#! země." # todo: CONCEPT CASE
 concept_power_struggle: "Mocenský boj"
 concept_power_struggling: "Bojující o moc"
 concept_power_struggle_desc: "Mocenský boj je pokus [Concept('concept_power_bloc_member','člena mocenského bloku')] převzít vedení od současného [Concept('concept_power_bloc_leader','lídra mocenského bloku')]. Spustí se automaticky, pokud má [Concept('concept_power_bloc_member','běžný člen mocenského bloku')|l] #v [Subtract_CFixedPoint(GetDefine('NPowerBlocs','POWER_STRUGGLE_PRESTIGE_THRESHOLD_START'), '(CFixedPoint)1')|0%]#! více [Concept('concept_prestige','prestiže')] než [Concept('concept_power_bloc_leader','lídr mocenského bloku')|l]. Pokud si udrží alespoň #v [Subtract_CFixedPoint(GetDefine('NPowerBlocs','POWER_STRUGGLE_PRESTIGE_THRESHOLD_FAIL'), '(CFixedPoint)1')|0%]#! více prestiže po dobu #v [GetDefine('NPowerBlocs','POWER_STRUGGLE_DURATION_SUCCESS_MONTHS')|0] měsíců#!, stane se novými [Concept('concept_power_bloc_leader','vůdcem')]." # todo: CONCEPT CASE
 concept_autonomy: "Autonomie"
 concept_autonomous: "Autonomní"
 concept_autonomy_desc: "Každá [Concept('concept_subject','závislá země')|l] má svou vlastní úroveň autonomie. Tato úroveň určuje, jaký typ interakce bude mít se svým [Concept('concept_overlord', 'vládcem')].\n\nZávislá země s vysokou mírou autonomie bude nezávislejší z pohledu diplomacie. Bude mít také nižší tribut pro svého [Concept('concept_overlord','vládce')|l]. Existuje riziko, že [Concept('concept_country','země')|l] s příliš vysokou autonomii se pokusí vyhlásit [Concept('concept_diplomatic_play', 'diplomatickou hru')] o #v $war_goal_independence_type_name$#!.\nZávislé země s nízkou autonomii budou závislejší na svých vládcech a budou jim platit vyšší tribut. Závislé země s nejnižší úrovní autonomie mohou být integrováni do svého vládce skrze [Concept('concept_diplomatic_play', 'diplomatickou hru')] #v $dp_annex_subject$#!." # todo: CONCEPT CASE
 concept_economic_dependence: "Ekonomická závislost"
 concept_economic_dependence_desc: "Ekonomická závislost je míra ekonomické závislosti mezi dvěma [Concept('concept_country','zemím')]. Hlavní vliv má počet [Concept('concept_building','budov')] vlastněných druhou zemí. Může jít o přímé vlastnictví ze strany země nebo o investory z [Concept('concept_pop','populací')|l].\n\nSpolečný trh zohledňuje rozdíly v [Concept('concept_gdp','HDP')] a dopad produkovaných [Concept('concept_good','zboží')|l] a vlastněných budov na populaci každé [Concept('concept_country','země')].\n\nPokud dvě země nejsou na společném trhu, ekonomickú závislost ovlivňuje [Concept('concept_trade','obchod')|l]. Dopad závisí na objem obchodu mezi oběma zeměmi a vlivu na tržní rovnováhu zboží." # todo: CONCEPT CASE
 concept_electoral_confidence: "Důvěra ve volby"
 concept_electoral_confidence_desc: "Důvěra ve volby měří, do jaké míry voliči v [Concept('concept_country','zemích')] věří, že volby budou svobodné a spravedlivé. Zkreslování voleb zmanipulováním ve prospěch konkrétní [Concept('concept_party','strany')] sníží důvěru ve volby, zatímco nezasahování do průběhu voleb ji zvýší. Nízká důvěra ve volby ovlivní [Concept('concept_legitimacy','legitimitu')] a množství [Concept('concept_political_strength','politické síly')] získané z hlasů, přičemž rozsah efektu se liší podle vašich přijatých [Concept('concept_law','zákonů')] a [Concept('concept_amendment','dodatků')]." # todo: CONCEPT CASE
 concept_princely_state: "Knížecí stát"
 concept_princely_states: "Knížecí státy"
 concept_princely_state_desc: "Knížecí stát je stát pod vládou místního indického panovníka podřízeného evropské koloniální mocnosti. Mají velmi rozdílný význam v rámci indického imperiálního systému, ale všichni obecně podléhají podobnému diplomatickému uspořádání." # todo: CONCEPT CASE
 concept_crown_land: "Korunní země"
 concept_crown_lands: "Korunní země"
 concept_crown_land_desc: "Korunní země je správní oblast dynastického impéria s různou mírou regionální autonomie." # todo: CONCEPT CASE
 concept_georegion: "Geografický region"
 concept_georegions: "Geografické regiony"
 concept_georegion_desc: "A $concept_georegion$ je oblast, která odpovídá souboru [Concept('concept_strategic_region','strategického regionu')] a [Concept('concept_state_region','státní oblasti')]. Geografické regiony jsou neměnné, ale mohou se překrývat a v některých případech mohou být zároveň součástí většího geografického regionu." # todo: CONCEPT CASE
 concept_privy_purse: "Knížecí apanáž"
 concept_privy_purse_desc: "Knížecí apanáž je osobní příjem [Concept('concept_ruler','monarchy')]. V kontextu [concept_georegion_india] představuje důchod vyplácený bývalému vládci [Concept('concept_princely_state','knížecího státu')], který byl #b připojen#! jinou [Concept('concept_country','zemi')] za použití [Concept('concept_journal_entry','záznam v deníku')] #v Indická federace#! .\n\nModifikátor $modifier_privy_purse_payments$ bude přidán po připojení jakéhokoliv knížecího státu pomocí tohoto záznamu a bude aktualizován po každém dalším připojení. #b $modifier_privy_purse_payments$#! zvýší #b státní výdaje#! odpovídající #v 0,01 %#! [Concept('concept_gdp','HDP')] násobku počtu #b knížecích států#! připojených tímto záznamem." # todo: CONCEPT CASE
 concept_fervor: "Horlivost"
 concept_fervor_desc: "Horlivost je měřítkem národního ducha [Concept('concept_culture','kulturu')]. [Concept('concept_pop','Populace')] z kultury s vysokým horlivostí budou [Concept('concept_assimilation','asimilovat')] pomaleji, po dobytí vytvoří více [Concept('concept_radical','radikálové')], zvýší [Concept('concept_liberty_desire','touha po svobodě')] a budou mít větší pravděpodobnost připojit se k [Concept('concept_cultural_movement','kulturnímu hnutí')].\n\n#title Následující podmínky #b zvýší#! $concept_fervor$:#! #indent_newline:3 \n• Být [Concept('concept_primary_cultures','primární kultura')] nezávislého [Concept('concept_country','zemí')] s #tooltippable;tooltip:[GetPlayer.GetTooltipTag],fervor_effects_from_citizenship_laws_tt platným#! [SelectLocalization(GetPlayer.IsValid,'CITIZENSHIP_LINK','lawgroup_citizenship')] [Concept('concept_law','zákonem')]\n• Počet [Concept('concept_casualties','ztráty')] této [Concept('concept_culture','kultuře')] ve [Concept('concept_war','válce')]\n• Vysoká průměrná [Concept('concept_literacy','gramotnosti')]\n• Počet [GetPopType('academics').GetName] $concept_pops$ z této kultury\n• $concept_pops$ této kultury žijící v zemích s [GetTechnology('nationalism').GetName] nebo [GetTechnology('pan-nationalism').GetName] [Concept('concept_technology','technologiemi')]\n• Být $concept_primary_culture$ $concept_country$ s platnou [GetInstitutionType('institution_schools').GetName] [Concept('concept_institution','institucí')]\n• Ostatní kulturou osvobozené jako nezávislé $concept_countries$\n• Zažívání [Concept('concept_national_awakening','národní obrození')]#!\n\n#title Následující podmínky #b sníží#! $concept_fervor$:#! #indent_newline:3 \n• Být $concept_primary_culture$ $concept_country$ s [GetLawType('law_multicultural').GetName] zákonem\n• Vysoká průměrná [Concept('concept_acceptance','přijetí')]#!" # todo: CONCEPT CASE
 fervor_effects_from_citizenship_laws_tt: "#title Platné [Concept('concept_law','zákony')] zahrnují:#!\n• $law_ethnostate$ (#v +20#!)\n• $law_national_supremacy$ (#v +15#!)\n• $law_racial_segregation$ (#v +10#!)\n• $law_cultural_exclusion$ (#v +5#!)"
 concept_cultural_movement: "Kulturní hnutí"
 concept_cultural_movements: "Kulturní hnutí"
 concept_cultural_movement_desc: "Kulturní hnutí jsou [Concept('concept_political_movement','politická hnutí')], které usilují o lepší život pro lidi určité [Concept('concept_culture','kulturu')]. Pokud je tato kultura [Concept('concept_primary_cultures','primární kultura')] [Concept('concept_country','země')], hnutí bude prosazovat nacionalistickou agendu. V opačném případě bude hnutí usilovat o [Concept('concept_law','zákon')], které poskytnou jejich lidem větší [Concept('concept_acceptance','přijetí')], nebo se dokonce pokusí o [Concept('concept_secession','odtržení')].\n\nPokud [Concept('concept_activism','aktivismus hnutí')] $concept_cultural_movement$ překročí @activism_red! $RADICALISM_PROTESTING$ (#v [GetDefine('NPolitics', 'RADICALISM_PROTESTING_THRESHOLD')|%0]#!), začne vytvářet [Concept('concept_obstinance','neústupnost')] v státech s podporou populacemi." # todo: CONCEPT CASE
 concept_religious_movement: "Náboženské hnutí"
 concept_religious_movements: "Náboženská hnutí"
 concept_religious_movement_desc: "Náboženská hnutí jsou [Concept('concept_political_movement','politická hnutí')], které usilují o lepší život pro lidi určité [Concept('concept_religion','náboženství')]. Pokud je tato $religion$ [Concept('concept_state_religion','státní náboženství')] [Concept('concept_country','země')], hnutí bude prosazovat tradicionalistickou agendu. V opačném případě bude hnutí usilovat o [Concept('concept_law','zákon')], které poskytnou jejich lidem větší [Concept('concept_acceptance','přijetí')], nebo se dokonce pokusí o [Concept('concept_secession','odtržení')].\n\nPokud [Concept('concept_activism','aktivismus hnutí')] $concept_religious_movement$ překročí @activism_red! $RADICALISM_PROTESTING$ (#v [GetDefine('NPolitics', 'RADICALISM_PROTESTING_THRESHOLD')|%0]#!), začne vytvářet [Concept('concept_obstinance','neústupnost')] v státech s podporou populacemi." # todo: CONCEPT CASE
 concept_dynastic_loyalty: "Dynastická loajalita"
 concept_dynastic_loyalty_desc: "Dynastická loajalita představuje podporu srbského obyvatelstva pro udržení vládnoucí dynastie na trůnu oproti jejich rivalům. Vládnoucí dynastie musí získat dostatečnou podporu, aby zabránila opozici vznést nárok. Nepodaří-li se to, ztratí trůn a dojde ke stagnaci národního rozvoje.\n\nNásledující podmínky #bold zvýší#! $concept_dynastic_loyalty$:\n• Vysoká [Concept('concept_ruler','vládce')] [Concept('concept_popularity','popularita')]\n• Nízká [Concept('concept_popularity','popularita')] soupeřících uchazečů\n• Vysoká [Concept('concept_legitimacy','legitimita')] \n• Vysoká [Concept('concept_sol','životní standard')]\n• Podíl [Concept('concept_loyalist','loajalisté')]\n• Ne-[Concept('concept_marginalized','marginalizována')] [Concept('concept_interest_group','zájmové skupiny')] [Concept('concept_in_opposition','V opozici')] nad 4 [Concept('concept_approval','spokojeností')] podle [Concept('concept_clout','politického vlivu')] \n• Má schválený [GetLawType('law_censorship').GetName] nebo [GetLawType('law_outlawed_dissent').GetName]\n• Není [Concept('concept_subject','závislá země')]\n• Každá [Concept('concept_major_power','regionální mocnost')] nebo [Concept('concept_great_power','velmoc')] podporující naši nezávislost\n• Události nebo jiné volby\n\nNásledující podmínky #bold sníží#! $concept_dynastic_loyalty$:\n• Nízká [Concept('concept_ruler','vládce')] [Concept('concept_popularity','popularita')]\n• Vysoká [Concept('concept_popularity','popularita')] soupeřících uchazečů\n• Nízká [Concept('concept_legitimacy','legitimita')]\n• Nízká [Concept('concept_sol','životní standard')]\n• Podíl [Concept('concept_radical','radikálové')]\n• Ne-[Concept('concept_marginalized','marginalizována')] [Concept('concept_interest_group','zájmové skupiny')] [Concept('concept_in_opposition','V opozici')] pod -4 [Concept('concept_approval','spokojeností')] podle [Concept('concept_clout','politického vlivu')] \n• Negativní [Concept('concept_authority','autorita')]\n• Negativní [Concept('concept_bureaucracy','byrokracie')]\n• Pozitivní [Concept('concept_relations','vztahy')] s [Concept('concept_overlord','vládcem')]\n• Události nebo jiné volby" # todo: CONCEPT CASE
 concept_brz_national_hero: "Národní hrdina" # todo: MOVED KEY
 concept_brz_national_hero_desc: "#bold Národní hrdina#! je generál, který vyhrál bitvu proti státu, jenž není brazilský, a byl oslavován jako hrdina v události '#bold Nový národní hrdina#!'." # todo: MOVED KEY
 concept_house_of_obrenovic: "Rod Obrenović"
 concept_house_of_obrenovic_short: "Obrenović"
 concept_house_of_obrenovic_desc: "Rod Obrenović je jeden ze dvou soupeřících $SER_ADJ$ královských rodů. Pochází z rodu #b Miloš Obrenović#!, vůdce Druhého srbského povstání a zakladatele autonomního Srbského knížectví. Stoupenci $concept_house_of_obrenovic_short$ obvykle podporují zlepšení [Concept('concept_relations','vztahy')] s #b Rakouskem#!." # todo: CONCEPT CASE
 concept_house_of_karadjordjevic: "Rod Karađorđević"
 concept_house_of_karadjordjevic_short: "Karađorđević"
 concept_house_of_karadjordjevic_desc: "Rod Karađorđević je jeden ze dvou soupeřících $SER_ADJ$ královských rodů. Pochází z rodu #b Karađorđe#!, vůdce nešťastného Prvního srbského povstání proti Osmanské říši. Stoupenci $concept_house_of_karadjordjevic_short$ obvykle podporují zlepšení [Concept('concept_relations','vztahy')] s #b Ruskem#!." # todo: CONCEPT CASE
 concept_lands_of_anarchy_control: "Kontrola nad Zeměmi anarchie"
 concept_lands_of_anarchy_control_short: "Kontrola"
 concept_lands_of_anarchy_control_desc: "Kontrola představuje autoritu Machzenu nad odlehlými kmeny Maroka.\n\nPro každý okolní [Concept('concept_state','stát')|l] mimo [Concept('concept_capital_state','hlavního města')|l] existuje ukazatel. Vyšší hodnota naznačuje, že kmenoví obyvatelé více respektují a mají strach před rozhodnutími [Concept('concept_government','vládou')], což umožňuje úředníkům účinně vykonávat své úkoly. Počáteční záporný [Concept('concept_modifier','modifikátor')|l] každého státu se měsíčně upravuje na základě jeho aktuální hodnoty. Vyšší $concept_lands_of_anarchy_control_short$ vede k méně účinným sankcím, a naopak.\n\nRozvojem státních center, vytvářením více pracovních příležitostí a posilováním vazeb mezi městským a venkovským životem budou kmeny postupně ovlivněny a jejich izolace se sníží. Nakonec jejich vliv na příslušníky kmenů vyprchá.\n\nNedostatečná údržba Kontroly může přinést naši zkázu a zanechat dlouhotrvající důsledky v těchto státech." # todo: CONCEPT CASE
 concept_austrian_constitutional_pressure: "Ústavní tlak"
 concept_austrian_constitutional_pressure_short: "Tlak"
 concept_austrian_constitutional_pressure_desc: "Ústavní tlak představuje sílu a vliv opozice vůči neoabsolutistickému režimu a je spojen s vnímanou autoritou režimu.\n\nPokud $concept_austrian_constitutional_pressure$ dosáhne #v 100#!, neoabsolutistická vláda padne a bude muset být udělena ústava. \n\n#title Následující podmínky #r #b zvýší#!#! $concept_austrian_constitutional_pressure_short$:#! #indent_newline:3 \n• Mít na vás vynucený [Concept('concept_war_goal','válečný cíl')]\n• Vyhlášení [Concept('concept_bankruptcy','bankrot')]\n• Přijetí [Concept('concept_loans','půjčky')]\n• [Concept('concept_state','státy')] s [Concept('concept_radical','radikálem')]\n• [Concept('concept_interest_group','zájmovou skupinou')] oponující [GetLawType('law_autocracy').GetName]\n• [Concept('concept_activism','aktivismem hnutí')] #tooltippable;tooltip:[GetPlayer.GetTooltipTag],liberal_movements_list_tt Liberálních#!, #tooltippable;tooltip:[GetPlayer.GetTooltipTag],socialist_movements_list_tt Socialistických#! a $movement_cultural_minority_short$ [Concept('concept_political_movement','politická hnutí')]\n• Deficit [Concept('concept_bureaucracy','byrokracie')]\n• Události a další podmínky #!\n\n#title Následující podmínky #g #b sníží#!#! $concept_austrian_constitutional_pressure_short$:#! #indent_newline:3 \n• Pozitivní rozpočtová bilance\n• Vynucení [Concept('concept_war_goal','válečný cíl')] na [Concept('concept_great_power','velmoc')]\n• [Concept('concept_state','stát')] s [Concept('concept_loyalist','loajalistou')]\n• [Concept('concept_interest_group','zájmovou skupinou')] podporující [GetLawType('law_autocracy').GetName]\n• [Concept('concept_political_movement_support','podporou politickým hnutí')] $movement_royalist_absolutist_short$, $movement_religious_majority_short$ a $movement_cultural_majority_short$ [Concept('concept_political_movement','politická hnutí')]\n• Přebytek [Concept('concept_bureaucracy','byrokracie')]\n• Události a další podmínky #!" # todo: CONCEPT CASE
 concept_coup: "Puč"
 concept_coups: "Puče"
 concept_coup_desc: "Puč je pokus [Concept('concept_commander','velitel')] s nízkou úrovní [Concept('concept_loyalty','loajalitou')] svrhout stávající [Concept('concept_government','vláda')]. Riziko $concept_coup$ roste, když je [Concept('concept_country','země')] vládnuta $concept_government$ s nízkou [Concept('concept_legitimacy','legitimitou')], nebo pokud neloajální $concept_commander$ má vysoký [Concept('concept_commander_rank', 'Rank')] a [Concept('concept_popularity','popularita')].\n\nJakmile $concept_coup$ začne, pokud jeho postup dosáhne #v 100%#!, vydá velitel provádějící $concept_coup$ [Concept('concept_pronunciamento','pronunciamento')]. Úspěšné $concept_pronunciamento$ povede k sesazení vládě.\n\nPostup puče je určen [Concept('concept_coup_strength','síla puče')] velitele provádějícího puče, vyhodnocenou proti [Concept('concept_coup_resistance','odolnosti proti puči')] sedící vlády." # todo: CHANGED # todo: CONCEPT CASE
 concept_coup_strength: "Síla puče"
 concept_coup_strength_short: "Síla"
 concept_coup_strength_desc: "Síla puče představuje schopnost [Concept('concept_commander','velitel')] úspěšně spáchat $concept_coup$ proti stávající [Concept('concept_government','vládě')]. Puč bude #b postupovat#!, když bude [Concept('concept_commander','velitel')]ova [Concept('concept_interest_group','zájmová skupina')]'s [Concept('concept_approval','spokojeností')] #b negativní#! a silou puče velitele provádějícího puče bude vyšší než [Concept('concept_coup_resistance','odolnost proti puči')] sedící vlády.\n\nFaktory přispívající k síle puče zahrnují:\n• Vysokou [Concept('concept_popularity','popularitu')]\n• Vysoký [Concept('concept_commander_rank','hodnost velitele')]\n• [Concept('concept_clout','politický vliv')] zainteresované skupiny $concept_commander$\n• Blízkost [Concept('concept_commander','velitel')]'s [Concept('concept_military_formation','formacemi')] k [Concept('concept_capital_state','hlavnímu městu')]" # todo: CHANGED # todo: CONCEPT CASE
 concept_coup_resistance: "Odolnost proti puči"
 concept_coup_resistance_short: "Odolnost"
 concept_coup_resist: "Odolat"
 concept_coup_resistant: "Odolný"
 concept_coup_resistance_desc: "Odolnost proti puči představuje schopnost [Concept('concept_government','vlády')] ustát [Concept('concept_coup','puč')|l] [Concept('concept_commander','velitele')]. Puč se #b stáhne#! pokud je $concept_coup_resistance$ současné vlády vyšší než [Concept('concept_coup_strength','síla puče')|l] velitele provádějícího puč.\n\nFaktory přispívající k Odolnosti proti puči zahrnují:\n• Vysoká [Concept('concept_legitimacy','legitimita')|l] [Concept('concept_government','vlády')]\n• Úroveň investic do [GetInstitutionType('institution_home_affairs').GetName] v rámci [Concept('concept_law','zákona')] [GetLawType('law_secret_police').GetName] nebo [GetLawType('law_national_guard').GetName]" # todo: CONCEPT CASE
 concept_pronunciamento: "Pronunciamento"
 concept_pronunciamento_desc: "A $concept_pronunciamento$ je závěrečná fáze $concept_coup$, ve které [Concept('concept_commander','veliteli')] prohlašuje nesouhlas se stávající [Concept('concept_government','vládou')] a svolává své síly, aby jej podpořily. Když nastane $concept_pronunciamento$, porovná se [Concept('concept_coup_resistance','odolností proti puči')] sedící vládou s [Concept('concept_coup_strength','silou puče')] velitelem provádějícího puče.\n\nPokud je $concept_coup_strength$ $concept_commander$ menší než $concept_coup_resistance$ vládou, nebo pokud je $concept_coup$ vyvolán interakcí postav (Character Interaction), bude mít $concept_government$ šanci bránit se proti puči. Šance vlády úspěšně se ubránit je určena poměrem [Concept('concept_coup_resistance','odolností proti puči')] k výše uvedeným faktorům.\n\nÚspěšné $concept_pronunciamento$ způsobí svržení $concept_government$. Neúspěšné $concept_pronunciamento$ povede ke zvýšení [Concept('concept_radical','radikalismu')] a negativním následkům pro pučistu velitele." # todo: CHANGED # todo: CONCEPT CASE
 concept_negotiation: "Vyjednávání"
 concept_negotiations: "Vyjednávání"
 concept_negotiating: "Vyjednávání"
 concept_negotiated: "Vyjednáno"
 concept_negotiate: "Vyjednávat"
 concept_negotiation_desc: "Vyjednávat s [Concept('concept_interest_group','zájmovou skupinou')] během [Concept('concept_enactment_of_laws','schvalování zákonů')] za účelem přesvědčit je ke změně postoje k právě schvalovanému [Concept('concept_law','zákonu')]. Vůli zájmové skupiny k vyjednávání určuje jejich [Concept('concept_amenability','ochota')]. Čím vyšší ochotu mají, tím přátelštější a ochotnější budou vyjednávat.\n\n@indifferent! [Concept('concept_endorse_oppose', 'Lhostejná')] zájmová skupina musí být @in_government! [Concept('concept_in_government','ve vládě')|l], aby s nimi bylo možné vyjednávat, zatímco @disapproves! [Concept('concept_endorse_oppose','oponující')|l] zájmové skupiny můžou vyjednávat, i když jsou [Concept('concept_in_opposition','V opozici')|l].\n\nPřesvědčit $concept_interest_group$, aby přešlo ze stavu @disapproves! oponujícího na @indifferent! lhostejný může být stejně účinné jako přesvědčit je, aby přešli z @indifferent! [Concept('concept_endorse_oppose', 'Lhostejná')] na @approves! [Concept('concept_endorse_oppose','podporující')]." # todo: CONCEPT CASE
 concept_guerilla_war: "Partyzánská válka" # todo: MOVED KEY
 concept_guerilla_war_desc: "Partyzánská válka je zvláštní druh [Concept('concept_war','válka')], který podléhá souboru pravidel odlišných od běžného válčení. Jejich podrobnosti se mohou lišit od jedné partyzánské války k druhé.\n\nBěhem partyzánské války platí následující obecná pravidla:\n#indent_newline:2 $EFFECT_LIST_BULLET$ [Concept('concept_battle','bitvy')] jsou mnohem menší a vznikají pomaleji#! \n#indent_newline:2 $EFFECT_LIST_BULLET$ Mohou nastat [GetBattleCondition('battle_condition_guerilla_skirmish').GetName], [GetBattleCondition('battle_condition_guerilla_ambush').GetName] a [GetBattleCondition('battle_condition_guerilla_disarray').GetName] jako [Concept('concept_battle_condition','podmínky bitvy')]#!\n#indent_newline:2 $EFFECT_LIST_BULLET$ Vítězství neudělují skóre [Concept('concept_occupation','okupace')]#!\n#indent_newline:2 $EFFECT_LIST_BULLET$ $concept_guerilla_war$ může eskalovat v běžnou válce, pokud jsou splněny podmínky specifické pro daný konflikt" # todo: MOVED KEY # todo: CONCEPT CASE
 concept_amenability: "Ochota"
 concept_amenability_desc: "Jak ochotná je [Concept('concept_interest_group','zájmová skupina')|l] [Concept('concept_negotiation','vyjednávat')|l] během [Concept('concept_enactment_of_laws','přijímání zákonů')|l], vyšší hodnota znamená větší ochotu.\n\n#b 0 - [GetDefine('NPolitics', 'MIN_AMENABILITY_TENSE_NEGOTIATION')]#!:     Bude #r odmítnout#! $concept_negotiate$\n#b [GetDefine('NPolitics', 'MIN_AMENABILITY_TENSE_NEGOTIATION')] - [GetDefine('NPolitics', 'MIN_AMENABILITY_NORMAL_NEGOTIATION')]#!:   #v #r $negotiation_tier_3$#!#!\n#b [GetDefine('NPolitics', 'MIN_AMENABILITY_NORMAL_NEGOTIATION')] - [GetDefine('NPolitics', 'MIN_AMENABILITY_FRIENDLY_NEGOTIATION')]#!:   #v $negotiation_tier_2$#!\n#b [GetDefine('NPolitics', 'MIN_AMENABILITY_FRIENDLY_NEGOTIATION')] - 100#!: #v #g $negotiation_tier_1$#!#!" # todo: CONCEPT CASE
 concept_obstinance: "Neústupnost"
 concept_obstinate: "Neústupný"
 concept_obstinance_desc: "Neústupnost představuje [Concept('concept_pop','populace')], kteří podporují [Concept('concept_cultural_movement','kulturní hnutí')] nebo [Concept('concept_religious_movement','náboženské hnutí')] v rámci [Concept('concept_state','státu')] a pasivně odmítají spolupracovat s [Concept('concept_country','zeměmi')] [Concept('concept_institution','institucemi')]. Neústupnost je způsobeno tím, že [Concept('concept_activism','aktivismu hnutí')] příslušného [Concept('concept_political_movement','politického hnutí')] překročí @activism_red! $RADICALISM_PROTESTING$ (#v [GetDefine('NPolitics', 'RADICALISM_PROTESTING_THRESHOLD')|%0]#!). Množství neústupnosti je rovno podílu [Concept('concept_workforce','pracovní síly')] v státě, kteří jsou členy neústupná politického hnutí.\n\nPřítomnost neústupnosti ve státě způsobuje řadu negativních lokálních efektů na stát, jako je snížená [Concept('concept_assimilation','asimilace')], [Concept('concept_taxes','$state_tax_collection_mult$')], [Concept('concept_conscription_center','odvod')] a dopad institucí." # todo: CONCEPT CASE
 concept_bavarocratic_ire: "Bavorokratický hněv"
 concept_bavarocratic_ire_short: "Hněv"
 concept_bavarocratic_ire_desc: "Hněv představuje odpor řeckého obyvatelstva vůči vládě bavorské kliky v Řecku. Vysoké $concept_bavarocratic_ire_short$ může vést k sesazení krále Otty a jeho bavorských příznivců.\n\nNásledující podmínky #bold zvýší#! $concept_bavarocratic_ire_short$:\n• [GetCulture('south_german').GetName] [Concept('concept_commander','velitelé')] nebo [Concept('concept_character','postavy')] v [Concept('concept_in_government','ve vládě')]\n• #bold Není#! [GetReligion('orthodox').GetName] [Concept('concept_ruler','vládci')]\n• [Concept('concept_ruler','vládci')] #bold Nemá#! [Concept('concept_heir','dědici')]\n• [Concept('concept_ruler','vládci')] je neženatý / nevdaná\n• #bold Nemá#! [Concept('concept_votes','volební právo')]\n• Méně než #v 10#! [Concept('concept_battalion','prapory')]\n• [Concept('concept_radical','radikálové')] v držených [GetCulture('greek').GetName] [Concept('concept_homeland','domovinách')] [Concept('concept_state','státech')]\n• Nedávno #r prohraná#! [Concept('concept_war','válka')]\n• Volby v událostech nebo rozhodnutí\n\nNásledující podmínky #bold sníží#! $concept_bavarocratic_ire_short$:\n• Držené [GetCulture('greek').GetName] [Concept('concept_homeland','domovina')] [Concept('concept_state','státy')]\n• [Concept('concept_loyalist','loajalisté')] v držených [GetCulture('greek').GetName] [Concept('concept_homeland','domovinách')] [Concept('concept_state','státech')]\n• Nedávno #g vyhraná#! [Concept('concept_war','válka')]\n• Alespoň jedna [GetBuildingType('building_university').GetName] v [GetCulture('greek').GetName] [Concept('concept_homeland','domovině')] [Concept('concept_state','státě')]\n• Více než #v 20#! [Concept('concept_battalion','prapory')]\n• Volby v událostech nebo rozhodnutí" # todo: CONCEPT CASE
 concept_disqualified_culture: "Diskvalifikovaná kultura"
 concept_disqualified_culture_short: "Diskvalifikovaná"
 concept_disqualified_culture_present: "Diskvalifikovat"
 concept_disqualified_culture_verb: "Diskvalifikuje"
 concept_disqualified_culture_present_verb: "Diskvalifikování"
 concept_disqualified_culture_desc: "[Concept('concept_culture','Kultura')] je $concept_disqualified_culture_short$ pro účely organizování #b $dyn_c_usga$#!, pokud jsou jeho požadavky odmítnuty. Obvykle k tomu dochází v důsledku [Concept('concept_integrated_culture','integraci')] jiné $concept_culture$, se kterou kultura, která má být $concept_disqualified_culture_short$, sdílí [Concept('concept_homeland','domovina')] [Concept('concept_state','státy')]. S diskvalifikovanou kulturou nelze dále vyjednávat ani je za žádných okolností integrována." # todo: CONCEPT CASE
 concept_integrated_culture: "Integrovaná kultura"
 concept_integrated_culture_short: "Integrována"
 concept_integrated_culture_present: "Integrovat"
 concept_integrated_culture_present_verb: "Integrace"
 concept_integrated_culture_verb: "Integruje"
 concept_integrated_culture_process: "Integrace"
 concept_integrated_culture_desc: "Integrovaná kultura je [Concept('concept_culture','kultura')|l], jejíž požadavky byly uspokojivě vyřešeny během procesu organizování #b $dyn_c_usga$#!. Když se kultura stane integrovanou, stává se [Concept('concept_primary_cultures','primárními kulturami')] a přispívá k postupu #b $je_danubian_federation$#! [Concept('concept_journal_entry','záznam v deníku')|l]. Integrované kultury se mohou stát [Concept('concept_disqualified_culture','diskvalifikované')] pokud budou jejich požadavky po jejich integraci popřeny. Diskvalifikovaná kultura, která již byla integrována, povede k tvrdým sankcím." # todo: CONCEPT CASE
 concept_radicalized_interest_group: "Radikalizovaná zájmová skupina"
 concept_radicalized_interest_group_desc: "Když je [Concept('concept_approval','spokojenost')|l] u [Concept('concept_interest_group','zájmové skupiny')] pod [GetApprovalRatingFromValue(GetDefine('NPolitics','APPROVAL_THRESHOLD_ANGRY'))], říká se, že je zradikalizovaná. Zradikalizovaná zájmová skupina má tendenci stát se [Concept('concept_insurrection','vzpouřeneckou')] nebo provést [Concept('concept_coup','puč')|l] proti současné [Concept('concept_government','vládě')]." # todo: CONCEPT CASE
 concept_strait_access: "Přístup přes průliv"
 concept_strait_accesses: "Přístupy přes průliv"
 concept_strait_access_short: "Přístup"
 concept_strait_access_desc: "Přístup přes průliv určuje, které [Concept('concept_ship','lodě')] mohou proplout [Concept('concept_strait','průliv')]. Lze jej změnit [Concept('concept_strait_control','správce průlivu')] na obou stranách průlivu nastavením omezení. [Concept('concept_country','Země')] si mohou také zajistit $concept_treaty$, aby měli zaručený $concept_strait_access$, když by jim byl normálně zakázán průjezd.\n\n#title Průliv může být:#!#indent_newline:3 \n#b Otevřený#! - Všechny lodě mohou proplout\n#b Žádné vojenské#! - Pouze lodě @merchant_marine! #tooltippable_name #tooltip:[GetGoods('merchant_marine').GetTooltipTag],DATA_GOODS_NAME_TOOLTIP,GoodsTooltip [GetGoods('merchant_marine').GetCustom('GDS_G')|l]#!#! a [Concept('concept_supply_ship','zásobovací lodě')] mohou proplout\n#b Uzavřený#! - Žádné $concept_ships$ nemohou proplout, což může omezit přístup na [Concept('concept_world_market','světový trh')]#!\n\nKteré [Concept('concept_country','země')] jsou tímto omezením postiženy, je určeno [Concept('concept_strait_allowed_countries','povolené země')]. V případě, že oba $concept_states$ nastavily odlišné $concept_strait_accesses$, má přednost nejpřísnější omezení $concept_strait_access_short$." # todo: CONCEPT CASE
 concept_strait_allowed_countries: "Povolené země"
 concept_strait_allowed_countries_short: "Země"
 concept_strait_allowed_countries_desc: "Určuje, které [Concept('concept_country','země')] jsou ovlivněny omezeními [Concept('concept_strait_access','přístupem přes průliv')], pokud je nastaveno na #b Žádné vojenské#! nebo #b Uzavřený#!\n\n#title Povolené země může být nastaveno na:#!#indent_newline:3 \n#b Žádní nepřátelé#!#indent_newline:3 \nOmezení přístup se týká pouze $concept_ships$ nepřátel [Concept('concept_strait_control','správce průlivu')]#!\n\n#b Pouze spojenci#!#indent_newline:3 \nPouze $concept_ships$ spojenců správce průlivu jsou vyjmuty z omezení#!\n\n#b Pouze $concept_strait_controller_short$#!#indent_newline:3 \nPouze $concept_ships$ od správce průlivu a jeho [Concept('concept_subject','závislé země')] jsou vyjmuty z omezení#!#!" # todo: CONCEPT CASE
 concept_strait_control: "Kontrola průlivu"
 concept_strait_control_short: "Kontrola"
 concept_strait_controller: "Správce průlivu"
 concept_strait_controller_short: "Správce"
 concept_strait_control_desc: "Kontrola průlivu je určena kontrolou nad dvěma [Concept('concept_state','státu')] na každé straně [Concept('concept_strait','průlivu')]. V každém případě se každé [Concept('concept_country','zemí')] s kontrolou jednoho z států stává $concept_strait_controller$, který může změnit [Concept('concept_strait_access','přístup přes průliv')] přes průliv, s výjimkou #b $strait_gibraltar$#!, který vyžaduje kontrolu obou států, aby bylo možné nastavit [Concept('concept_strait_access','přístup přes průliv')] na #b Uzavřený#!.\n\nV případě, že oba $concept_states$ nastavily odlišné $concept_strait_accesses$, má přednost nejpřísnější omezení $concept_strait_access_short$." # todo: CONCEPT CASE
 concept_japanese_emperor: "Císař"
 concept_japanese_emperor_desc: "Císař, neboli Tennō, je tradičním vládcem #b Japan#! a zároveň hlavou #b Šintó#! [Concept('concept_religion','náboženství')]. Během období Tokugawa zůstal císař izolován v císařském paláci v Kjótu, přičemž jeho záležitosti byly přísně regulovány šógunátem." # todo: CONCEPT CASE
 concept_zaibatsu: "Zaibacu"
 concept_zaibatsu_desc: " #b #italic Zaibacu#!#! je rodinný a vertikálně integrovaný průmyslový a finanční konglomerát.\n\nTypické $concept_zaibatsu$ je organizováno kolem holdingové společnosti a banky, které vlastní akcie v několika, typicky průmyslových, dceřiných společnostech. Zaibacu vznikla z rodinných obchodních konglomerátů pozdního období Edo, které využívaly svého předchozího bohatství a vazeb na stát k konsolidaci kontroly nad velkou částí japonské průmyslové základny.\n\n[Concept('concept_company','Společnost')], které jsou považovány za Zaibacu, zahrnují #v $company_mitsui$#!, #v $company_mitsubishi$#!, #v $company_yasuda$#! a #v $company_sumitomo$#!." # todo: CONCEPT CASE
 concept_raiding: "Nájezdy"
 concept_raiding_short: "Nájezdy"
 concept_raiding_desc: "Nájezdy jsou příjem získávaný v průběhu času krádežemi, pleněním a drancováním sousedních zemí. S malým množstvím orné půdy musí $MON$ spoléhat na nájezdy a [Concept('concept_russian_aid','ruská pomoc')], aby přežila. \n\nNáš příjem z nájezdů závisí na naší [Concept('concept_raiding_frequency','nájezdnický zápal')] vynásobené [Concept('concept_power_projection','projekci síly')] naší armády. #g @money!+[GetPlayer.MakeScope.ScriptValue('max_raiding_income')]#! je nejvyšší částka, kterou můžeme z nájezdů získat." # todo: CONCEPT CASE
 concept_raiding_frequency: "Nájezdnický zápal"
 concept_raiding_frequency_short: "Nájezdnický zápal"
 concept_raiding_frequency_desc: "Nájezdnický zápal představuje, jak často mají kmeny povoleno podnikat [Concept('concept_raiding', 'nájezdy')].\n\nKromě zvýšení našeho příjmu z [Concept('concept_raiding','nájezdů')] bude mít každé #v 1 %#! $concept_raiding_frequency$ také následující účinky:\n[GetStaticModifier('modifier_montenegrin_disobedience').GetDesc]" # todo: CONCEPT CASE
 concept_russian_aid: "Ruská pomoc"
 concept_russian_aid_short: "Ruská pomoc"
 concept_russian_aid_desc: "Ruská pomoc je podpora, kterou #v $RUS$#! posílá našim kmenům jako souvěrcům pravoslavné církve. \n\nZákladní částka, kterou dostáváme, závisí na našich [Concept('concept_relations','vztahů')] s #v $RUS$#!: \n\n• #v Neutrální vztahy#! (nebo horší): @money!200 \n• #v Srdečné vztahy#! : @money!400 \n• #v Přívětivé vztahy#! : @money!700 \n• #v Přátelské vztahy#! : @money!1000" # todo: CONCEPT CASE
 concept_government_premium: "Vládní prémie" # todo: NEW TRANSLATION
 concept_government_premium_desc: "Úhrada za poskytované služby." # todo: NEW TRANSLATION
