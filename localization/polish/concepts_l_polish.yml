 concept_discrimination_trait_groups_short_short: "Skupiny"
 concept_discrimination_trait_group_desc: "$concept_discrimination_trait_group$ je širší soubor [Concept('concept_discrimination_trait','diskriminační rysy')], které nějakým způsobem sdílejí společný původ, díky čemuž jsou rozpoznatelnější a více přijímané [Concept('concept_pop','populace')] stejného $concept_discrimination_trait_group_short$."
 concept_heritage_trait: "Rys původu"
 concept_heritage_traits: "Rysy původu"
 concept_heritage_trait_short: "Původ"
 concept_heritage_traits_short: "Původy"
