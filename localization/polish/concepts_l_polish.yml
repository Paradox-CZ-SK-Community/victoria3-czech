 concept_power_bloc_member_desc: "[Concept('concept_power_bloc','Mocenský blok')], což zahrnuje i [Concept('concept_power_bloc_leader','vůdce bloku')|l] #b s výjimkou#! situace, kdy se počítá [Concept('concept_power_bloc_mandate_progress','pokrok mandátu')|l]. Běžní členové obvykle těží z [Concept('concept_power_bloc','mocenských bloků')] méně než jejich [Concept('concept_power_bloc_leader','lídři')]." # todo: CHANGED (predtym: [concept_power_bloc_member], což zahrnuje i [Concept('concept_power_bloc_leader','$concept_power_bloc_leader_short|q$')])
 concept_power_bloc_identity: "Identita mocenského bloku"
 concept_power_bloc_identity_short: "Centrální identita"
 concept_power_bloc_identity_extra_short: "Identita"
 concept_power_bloc_identity_desc: "$concept_power_bloc_identity$ definuje základní hodnoty, na kterých je postaven [Concept('concept_power_bloc','mocenský blok')|l]. Určuje [Concept('concept_power_bloc_cohesion','soudržnost')|l] bloku a poskytuje speciální pravomoci [Concept('concept_power_bloc_leader','vůdci mocenského bloku')|l]. Mohou odemknout určité [Concept('concept_power_bloc_principle_group','$concept_power_bloc_principle_groups|q$')|l] principů." # todo: CHANGED (predtym: $concept_power_bloc_identity$ definuje základní hodnoty, na kterých je postaven [concept_power_bloc]. Určuje [concept_po)
 concept_power_bloc_principle: "Princíp"
 concept_power_bloc_principles: "Principy"
 concept_power_bloc_principle_desc: "$concept_power_bloc_principles$ patří do [Concept('concept_power_bloc_principle_group','skupin principů')] a poskytují různé účinky na [Concept('concept_power_bloc','mocenské bloky')|l] a jejich [Concept('concept_power_bloc_member','členy')]. Schválení principů stojí [Concept('concept_power_bloc_mandate','mandáty')|l] a také mohou být vylepšeny."
 concept_power_bloc_primary_principle_group: "Primární principiální skupina"
 concept_power_bloc_primary_principle_groups: "Primární principiální skupiny"
 concept_power_bloc_primary_principle_group_short: "Primární skupina"
 concept_power_bloc_primary_principle_groups_short: "Primární skupiny"
 concept_power_bloc_primary_principle_group_extra_short: "Primární"
 concept_power_bloc_primary_principle_group_desc: "$concept_power_bloc_primary_principle_group$ závisí na  zvoleném [Concept('concept_power_bloc_identity','identitě')] [Concept('concept_power_bloc','mocenského bloku')|l]. $concept_power_bloc$ musí vždy mít alespoň jeden [Concept('concept_power_bloc_principle','princíp')|l] z primární skupiny, aby měl stabilnou [Concept('concept_power_bloc_cohesion','soudržnost')|l]. [Concept('concept_power_bloc_mandate','Mandátování')] vyššího stupně principů z primární skupiny (stupeň II a III) dále posiluje soudržnost." # todo: CHANGED (predtym: $concept_power_bloc_primary_principle_group$ závisí na zvolené [Concept('concept_power_bloc_identity','identitě')] [Conc)
 concept_power_bloc_principle_group: "Skupina principů"
 concept_power_bloc_principle_groups: "Skupiny principů"
 concept_power_bloc_principle_group_desc: "Skupiny tří úrovní [Concept('concept_power_bloc_principle','principů')] podporujících stejnou oblast."
 concept_power_bloc_mandate: "Mandát"
 concept_power_bloc_mandates: "Mandáty"
 concept_power_bloc_mandated: "Mandátován"
 concept_power_bloc_mandating: "Mandátování"
 concept_power_bloc_mandate_desc: "$concept_power_bloc_mandates$ se používají k vylepšení, přehození nebo přijetí nových [Concept('concept_power_bloc_principle','principů')]. [Concept('concept_power_bloc','Mocenské bloky')] získávají [Concept('concept_power_bloc_mandate_progress','pokrok mandátu')|l] tím, že mají silné [Concept('concept_power_bloc_member','členy')] a vysokou hodnotu [Concept('concept_power_bloc_cohesion','soudržnosti')]. Do zásoby mohou být uloženy až 3 mandáty." # todo: CHANGED (predtym: [concept_power_bloc_mandates] se používají k vylepšení, přehození nebo přijetí nových [Concept('concept_power_bloc_princ)
 concept_power_bloc_mandate_progress: "Pokrok mandátu"
 concept_power_bloc_mandate_progress_desc: "Pokrok směrem k dalšímu [Concept('concept_power_bloc_mandate','mandátu')]. [Concept('concept_power_bloc','Mocenské bloky')] získávají pokrok tím, že mají silné [Concept('concept_power_bloc_member','členy')] a vysokou hodnotu [Concept('concept_power_bloc_cohesion','soudržnosti')]"
 concept_power_bloc_cohesion: "Soudržnost"
 concept_power_bloc_cohesion_desc: "$concept_power_bloc_cohesion$ je ukazatel, jak dobře funguje [Concept('concept_power_bloc','mocenský blok')|l]. Je většinou ovlivněn [Concept('concept_power_bloc_identity','identitou centrálního pilíře')], což určuje, jak velký je jeho vliv na soudržnost. Čím větší je [Concept('concept_power_bloc','mocenský blok')|l], tím nižší bude jeho soudržnost."
 concept_power_bloc_leverage: "Páka"
 concept_power_bloc_leveraged: "Vlivný" # todo: NEW TRANSLATION
 concept_power_bloc_leverage_desc: "[Concept('concept_power_bloc','Mocenské bloky')] si postupem času budují páku v [Concept('concept_country','zemích')], porovnáváním svého vlivu v zemi s vlivem ostatních mocenských bloků. Podíl páky lze získat různými interakcemi, například aktivním [Concept('concept_diplomatic_pact','diplomatickým paktem')] nebo [Concept('concept_treaty','smlouvou')], a aktuální páka se každý týden přibližuje tomuto podílu. Jakmile se nasbírá dostatečná [Concept('concept_power_bloc_leverage_advantage','páková výhoda')|l] nad zemí, může být pozvána do mocenského bloku." # todo: CHANGED (predtym: [Concept('concept_power_bloc','$concept_power_blocs|q$')] si postupem času budují [concept_power_bloc_leverage] v [conce)
 concept_power_bloc_unclaimed_leverage: "Nenárokovaná páka"
 concept_power_bloc_unclaimed_leverage_short: "Nenárokovano"
 concept_power_bloc_unclaimed_leverage_desc: "$concept_power_bloc_unclaimed_leverage$ [Concept('concept_country','země')|l] je [Concept('concept_power_bloc_leverage','páka')|l], kterou si u této země nenárokoval žádný [Concept('concept_power_bloc','mocenský blok')|l]. Je založena na #b Odporu vůči vlivu#! země, který je určen na základě řady faktorů jako jsou jejich [Concept('concept_law','zákony')|l] a [Concept('concept_pop','populace')|l] - čím více lidí, tím více lidí je nutno přesvědčit." # todo: CHANGED (predtym: [concept_power_bloc_unclaimed_leverage] [Concept('concept_country','$concept_country_possessive|q$')] je [concept_power_)
