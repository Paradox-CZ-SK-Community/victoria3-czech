 concept_subsistence_output_desc: "Forma příjmu v naturáliích, kterou [SelectLocalization(GetPlayer.IsValid,'concept_subsistence_output_desc_added','Sedláci')] generují z [Concept('concept_subsistence_building','samozásobitelských farem')], což představuje práci, kterou vykonávají při produkci [Concept('concept_good','zboží')|l] k pokrytí svých [Concept('concept_pop_needs','potřeb')]. Na rozdíl od [Concept('concept_building_wage','mezd')], soběstačný výstup není vyplácen ze [Concept('concept_revenue','příjmů')] [Concept('concept_building','budovy')] a nepodléhá [Concept('concept_budget_income_taxes','dani z příjmu')]." # todo: CHANGED (predtym: Forma příjmu v naturáliích, kterou [SelectLocalization(GetPlayer.IsValid,'concept_subsistence_output_desc_added','Sedlác)
