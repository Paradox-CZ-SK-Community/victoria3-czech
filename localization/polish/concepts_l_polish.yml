 concept_regional_company_hq_desc: "[Concept('concept_company','Společnost')] může zřídit regionální ředitelství společnosti na území cizí [Concept('concept_country','země')|l], pokud jí byla její vlastní zemí udělena investiční [Concept('concept_company_charter','listina')]. Kromě toho musí mít přístup do cizí země prostřednictvím [Concept('concept_foreign_investment_rights','práv na zahraniční investice')] a již zavedenou přítomnost v podobě menšího počtu [Concept('concept_building_level','úrovní budov')]. $concept_regional_company_hq$ se chová převážně jako [Concept('concept_company_hq','ředitelství společnosti')|l], avšak využívá [Concept('concept_investment_pool','investiční fond')|l] cizí země k výstavbě dalších úrovní budov a část svých [Concept('concept_dividends','dividend')] přímo reinvestuje do investičního fondu své vlastní země." # todo: CHANGED (predtym: [Concept('concept_company','Společnost')] může zřídit $concept_regional_company_hq$ na území cizí [Concept('concept_coun)
