 je_elevator: "Zlepšení naší situace"
 je_elevator_reason: "S nedávným zavedením výtahů roste tlak na jejich instalaci do co největšího počtu budov. Otázkou však zůstává, zda si to můžeme dovolit. Měli bychom zvýšit produkci zboží potřebného pro jejich výstavbu a využití."
 elevator_services_production_modifier: "Zvýšené služby"
 elevator_goods_production_modifier: "Zvýšená produkce zboží"
 je_mutual_funds: "Veřejné obchodování"
 je_mutual_funds_reason: "Nově vyvinuté podílové fondy umožní snadnější získávání kapitálu pro podniky. Měli bychom usilovat o to, aby co nejvíce našich finančních center využívalo tyto nové metody k vytváření bohatství pro naše kapitalisty."
