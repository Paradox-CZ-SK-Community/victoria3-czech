 hawaii_events.1.t: "Smrt krále"
 hawaii_events.1.d: "Po smrti krále se místní podnikatelé a zahraniční vyslanci snaží zvýšit svůj vliv na Havaji."
 hawaii_events.1.f: "„Naši nezávislost jsme si udrželi už nějakou dobu, ale oči velkých mocností nás hladově sledují a čekají na vhodný okamžik k útoku. Obávám se, že ten čas se rychle blíží.“"
 hawaii_events.1.a: "Musíme podniknout kroky k zachování naší nezávislosti."
 hawaii_events.2.t: "Posílení naší pozice"
 hawaii_events.2.d: "Poté, co jsme prokázali svou sílu a uklidnili místní podnikatele, se nyní můžeme zaměřit na posílení našeho postavení na mezinárodní scéně."
 hawaii_events.2.f: "„Ukázali jsme odhodlání těm, kteří by nejraději převzali kontrolu nad Havají. I když jsme nyní silnější, stále nejsme z nejhoršího venku.“"
 hawaii_events.2.a: "To nejhorší máme za sebou."
 hawaii_events.2.b: "Vyhostit neloajální."
 hawaii_events.3.t: "Zahraniční převrat"
 hawaii_events.3.d: "Skupiny protestujících a místní milice vedené koalicí podnikatelů a [SCOPE.sCountry('hawaiian_coup').GetAltAdjective('yych')] vyslanců úspěšně převzaly vládu a nyní žádají o připojení země."
 hawaii_events.3.f: "„Naše nezávislost a svoboda jsou nyní ohroženy. Ležíme bezmocně u nohou [SCOPE.sCountry('hawaiian_coup').GetAltAdjectiveNoFormatting('G')] a musíme přijmout novou realitu. Naše země je držena jako rukojmí!“"
 hawaii_events.3.a: "Jak k tomu vůbec došlo?"
 hawaii_events.4.t: "Území Havaj"
 hawaii_events.4.d: "Místní podnikatelé s pomocí našeho vyslance na Havaji provedli převrat proti místní vládě a žádají, abychom ostrovy začlenili dříve, než situace využijí jiné mocnosti."
 hawaii_events.4.f: "„Havaj je klíčem k Tichému oceánu. Nyní, když máme kontrolu nad její budoucností, máme kontrolu i nad oceánem. Budeme moci snáze řídit obchod v celém regionu.“"
 hawaii_events.4.a: "Obsadit ostrovy, ale ponechat jim autonomii."
 hawaii_events.4.b: "Pokud to neuděláme my, udělá to někdo jiný."
 hawaii_events.4.c: "Nebudeme se na tomto převratu podílet."
 hawaii_events.5.t: "Vyhoštění podnikatelé"
 hawaii_events.5.d: "Havajská vláda vyhostila naše občany z ostrovů a zabavila jejich majetek. Musíme na to náležitě reagovat."
 hawaii_events.5.f: "„Jak se opovažují vyhostit naše občany a převzít kontrolu nad soukromým podnikáním? Takové zabavení majetku je nejen bezprecedentní, ale i nepřijatelné. Toto ponížení nebudeme tolerovat.“"
 hawaii_events.5.a: "Je to jejich vlastní vina."
 hawaii_events.5.b: "To je nepřijatelné!"
 je_hawaii: "Zahraniční zájmy"
 je_hawaii_reason: "Poloha Havaje v Tichém oceánu z ní činí mimořádně cenný bod pro transpacifický obchod. Musíme zajistit spokojenost místních podnikatelů a odradit velmoci od pokusů využít naše ostrovy."
 national_defence_modifier: "Národní obrana"
 interest_in_hawaii: "Investice na Havaji"
 interest_in_hawaii_desc: "Po smrti havajského panovníka vzniklo mocenské vakuum, které nám dává příležitost zvýšit náš vliv na ostrovech."
 death_of_kamehameha: "Smrt krále"
 hawaii_interest_tt: "Vyhlášení zájmu o Havaj může vést k získání kontroly nad ostrovy."
 influence_hawaii_tt: "Přijali jsme rozhodnutí aktivně ovlivňovat Havaj."
 je_hawaiian_interest_tt: "Zahájili jsme převrat proti havajské vládě. Nyní jde jen o čas."
 deporting_disloyal_igs: "Vyhoštění podnikatelé"
 influence_over_hawaii: "Vliv na Havaji"
 je_hawaiian_interest: "Ovlivňování Havaje"
 je_hawaiian_interest_reason: "Nedávný vývoj na Havaji otevřel možnost získat kontrolu nad ostrovy a posílit náš vliv v regionu. Pokud havajská vláda nedokáže situaci zvládnout, můžeme zasáhnout a ostrovy získat pro sebe."
 invalid_influence_hawaii_tt: "Došlo k převratu na Havaji NEBO havajská vláda situaci ustála."
 hawaii_coup_happened_tt: "[SCOPE.sCountry('hawaii_scope').GetAltAdjective('aa')] vláda byla svržena převratem"
 hawaii_government_secured_tt: "[SCOPE.sCountry('hawaii_scope').GetAltAdjective('aa')] vláda si upevnila svou pozici"
 conscription_laws.1.t: "Doplňování řad"
 conscription_laws.1.d: "Členové [SCOPE.gsInterestGroup('rural_folk_conscription').GetCustom('IG_G_TT')] oslovili vládu ohledně zavedení zákona [SCOPE.sLaw('current_law_scope').GetName]. Domnívají se, že ještě potřebujeme více času, než budeme připraveni tento zákon prosadit." # todo: NAME CASE
 conscription_laws.1.f: ""Byli byste ochotni dát cenu svobodě, kterou všichni máme? Ne! Ale cenu dáváte plodinám, které tihle dělníci pěstují. Naše svoboda a národní bezpečnost nejsou k diskusi a nelze je ocenit. Musíme zajistit přežití našeho národa a každý muž musí být připraven udělat, co je nutné k dosažení tohoto cíle." # todo: CHANGED
 conscription_laws.1.a: "Pokračujme v prosazení zákona."
 conscription_laws.1.b: "Dejme tomu více času."
 conscription_laws.2.t: "Profesionální vojáci"
 conscription_laws.2.d: "Mnozí z našich profesionálních vojáků vyjádřili obavy, že míchání odvedenců s pravidelnou pěchotou během války výrazně sníží kvalitu a schopnosti našich jednotek."
 conscription_laws.2.f: "„Očekáváte, že půjdu bojovat a riskovat život za tuto zemi, a zároveň mám bojovat po boku nějakého farmáře nebo dělníka, který nikdy nedržel pušku? Jak mají naše jednotky fungovat jako celek, když jen část z nich ví, co dělá?“"
 conscription_laws.2.a: "Potřebujeme každého vojáka."
 conscription_laws.2.b: "Měli bychom to ještě promyslet."
 conscription_laws.3.t: "Nepřipraveni na odvod"
 conscription_laws.3.d: "[SCOPE.sCharacter('anti_conscription_advocate').GetFullName], vůdce [SCOPE.gsInterestGroup('anti_conscription_ig').GetCustom('IG_G_TT')], pronesl vášnivý projev o rizicích příliš rychlého zavedení zákona [SCOPE.sLaw('current_law_scope').GetName]." # todo: NAME CASE
 conscription_laws.3.f: "„Nemůžeme ignorovat, že na to nejsme připraveni. K čemu to bude, když se nám země zhroutí pod rukama? Pokud vyhlásíme mobilizaci nepřipraveni, nejenže budeme muset platit nové vojáky, ale zároveň přijdeme o pracovníky v továrnách i na polích. To znamená nižší produkci, nižší zisky a nakonec i nižší daňové příjmy. Jak ty nové vojáky zaplatíme?“"
 conscription_laws.3.a: "Vláda to zvládne."
 conscription_laws.3.b: "Držme kurz."
 conscription_starting: "Podpora odvodu"
 keep_marching_on: "Bez zpomalení"
 conscription_debate: "Podpora odvodu"
 no_slowing_down: "Dodatečné vládní výdaje"
 conscription_stalled: "Odvod zpomalen"
 more_soldiers: "Čerstvé jednotky"
 listen_to_the_troops: "Naslouchat profesionálům"
 decree_events.100.t: "Průmyslový rozmach"
 decree_events.100.d: "Naše [SCOPE.sBuilding('manufacturing_building_production').GetName] v [SCOPE.sState('decree_manufacturing_industry').GetName] hlásí menší přebytek průmyslového zboží. Měli bychom zvážit jeho reinvestování zpět do státu."
 decree_events.100.f: "„Co víc ještě potřebujete jako důkaz? Průmysl je cesta vpřed. Právě zažíváme druhou vlnu průmyslové revoluce. Továrny v každém městě, dílny v každé obci. Brzy zindustrializujeme celý národ!“"
 decree_events.100.a: "Dále posilme náš průmysl."
 decree_events.100.b: "Měli bychom reinvestovat do pracovníků."
 decree_events.101.t: "Komu patří zásluhy"
 decree_events.101.d: "Nedávné investice do výroby ve [SCOPE.sState('decree_manufacturing_politics').GetName] v naší [SCOPE.sBuilding('manufacturing_building_production_politics').GetName] vyvolaly otázku, kdo by měl získat zásluhy za nárůst produkce."
 decree_events.101.f: "„Kde bychom byli bez našich peněz, továren a zboží? Ať celý národ ví, kolik práce a úsilí stálo za tímto velkým úspěchem.“"
 decree_events.101.a: "Zásluhy patří [SCOPE.gsInterestGroup('industrialists_ig_focus').GetCustom('IG_D_TT')]." # todo: NAME CASE
 decree_events.101.b: "Je to vítězství pracujících."
 decree_events.101.c: "Připisujme zásluhy někomu jinému."
 decree_events.102.t: "Zemědělský rozmach"
 decree_events.102.d: "Podpora zemědělského rozvoje v [SCOPE.sState('decree_agricultural_industry').GetName] vedla k menšímu nárůstu produkce v naší [SCOPE.sBuilding('agricultural_building_production').GetName]. Měli bychom toho využít, než to přijde vniveč."
 decree_events.102.f: "„Naši lidé budou jíst jako králové! Hlad bude pro naše občany minulostí. Využijme toho ve svůj prospěch a pomozme nejen sobě, ale i ostatním — samozřejmě za cenu. Ať vědí, že jsme cesta vpřed.“"
 decree_events.102.a: "Dále posilme naše farmy."
 decree_events.102.b: "Pracující si to zaslouží více."
 decree_events.103.t: "Komu náleží zásluhy"
 decree_events.103.d: "Nedávné investice v [SCOPE.sState('decree_agricultural_politics').GetName] do naší [SCOPE.sBuilding('agricultural_building_production_politics').GetName] vyvolaly otázku, kdo by měl získat zásluhy za tento nárůst investic. Názory jsou však rozdělené."
 decree_events.103.f: "„Otázka, komu náleží zásluhy, trápí mnohé. Majitelům půdy a organizátorům sklizně? Nebo obyčejným lidem, kteří pracují na polích dnem i nocí a jejichž pot a krev zavlažují půdu?“"
 decree_events.103.a: "[SCOPE.gsInterestGroup('landowners_ig_focus').GetName] si zaslouží uznání."
 decree_events.103.b: "Zásluhy patří farmářům."
 decree_events.103.c: "Najděme někoho jiného."
 decree_events.104.t: "Surovinový rozmach"
 decree_events.104.d: "Průmysl surovin v [SCOPE.sState('decree_resource_industry').GetName] hlásí menší nárůst produkce v naší [SCOPE.sBuilding('resource_building_production').GetName], což vedlo k vytvoření zásob, které lze znovu investovat do tohoto státu."
 decree_events.104.f: "„Samozřejmě bychom měli tento nárůst investovat zpět do průmyslu. Bez něj bychom nic takového neměli.“ „Zbláznil ses? Bez pracovníků bys neměl kdo by ty podniky provozoval. Odměnit bychom měli je, ne tebe.“"
 decree_events.104.a: "Dále posilme průmysl surovin."
 decree_events.104.b: "Odměňme pracovníky v [SCOPE.sState('decree_resource_industry').GetName]."
 decree_events.105.t: "Na uznání úspěchu"
 decree_events.105.d: "Po nedávných investicích v [SCOPE.sState('decree_resource_politics').GetName] vykazuje průmysl surovin v [SCOPE.sBuilding('resource_building_production_politics').GetName] pozitivní bilanci. Zájmové skupiny se rychle snaží přivlastnit si zásluhy."
 decree_events.105.f: "„Často mluvíme o pokroku dosaženém tvrdou prací, která nás dovedla až sem. Méně se však mluví o těch, kteří nám to umožnili — bez jejich přispění bychom takových úspěchů nedosáhli.“"
 decree_events.105.a: "[SCOPE.gsInterestGroup('industrialists_ig_focus').GetName] si zaslouží veškeré uznání."
 decree_events.105.b: "[SCOPE.gsInterestGroup('landowners_ig_focus').GetName] by měli získat zásluhy."
 decree_events.105.c: "Uznání patří pracujícím."
 decree_events.106.t: "Nevraživost v plucích"
 decree_events.106.d: "Upřednostňování našich pluků v [SCOPE.sState('decree_enlistment_origin').GetName] vedlo k nespokojenosti pluků v sousedním státě [SCOPE.sState('decree_enlistment').GetName]. Požadují rovné zacházení."
 decree_events.106.f: "„Tihle vojáci jsou jen banda ufňukaných stěžovatelů, kteří chtějí víc peněz za málo práce. Jejich úkolem je bojovat a naším rozhodovat proti komu. Vojákům nelze svěřit taková rozhodnutí.“"
 decree_events.106.a: "To je to, co chce [SCOPE.gsInterestGroup('armed_forces_ig_focus').GetName]."
 decree_events.106.b: "Měli bychom více investovat do organizace těchto jednotek."
 decree_events.107.t: "Výcvik se vyplácí"
 decree_events.107.d: "Dodatečný výcvik se vyplatil. Jednotky v [SCOPE.sState('decree_elite_research').GetName] si osvojily nové taktiky, které nám mohou pomoci v budoucí válce."
 decree_events.107.f: "„Naši vojáci jsou nejlepší na světě. Obránci našeho národa vždy čelili výzvám a obstáli. Toto je jen další důkaz.“"
 decree_events.107.a: "Nechat si to pro sebe."
 decree_events.107.b: "Podporovat další válečné manévry."
 decree_events.107.c: "Podporovat výcvik poddůstojníků."
 decree_events.107.e: "Rozvíjet taktiku útočné pěchoty."
 decree_events.108.t: "Násilí eskaluje"
 decree_events.108.d: "Pokojný pochod v [SCOPE.sState('decree_violent_supp').GetName] se náhle změnil v násilný střet mezi demonstranty a policií."
 decree_events.108.f: "„Potlačte je silou, použijte jakékoli prostředky. Tihle buřiči musí znát své místo. Nechápou snad, že policie je tu pro jejich bezpečnost? Nesmíme před radikály působit slabě.“"
 decree_events.108.a: "Nechat policii ustoupit."
 decree_events.108.b: "Dát policii volnou ruku."
 decree_events.109.t: "Násilné potlačení zvyšuje diskriminaci"
 decree_events.109.d: "Radikálové v [SCOPE.sState('decree_increased_violence').GetName] získávají podporu od diskriminovaných obyvatel kultury [SCOPE.sCulture('violent_suppression_discriminated').GetName]."
 decree_events.109.f: "„Pokud chtějí protestovat, nechme je. Zásah by situaci jen zhoršil. Alespoň budou všichni pohromadě a později se s nimi vypořádáme snáz.“"
 decree_events.109.a: "My rozhodujeme, kde se smí protestovat."
 decree_events.109.b: "Nechme je protestovat, kde chtějí."
