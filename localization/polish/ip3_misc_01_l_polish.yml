 austria_events.40.t: "Zachránit říši" # todo: NEW TRANSLATION
 austria_events.40.d: "Rozšíření volebního práva v [ROOT.GetCountry.GetName] vyvolalo ostrou reakci mezi tradičně konzervativními [SCOPE.gsInterestGroup('armed_forces_ig').GetName]. Mnoho [GetPopType('officers').GetName] začalo vnímat [SCOPE.GetRootScope.GetCountry.GetCustom('country_legislature_name')] jako hrozbu stabilitě Říše." # todo: NEW TRANSLATION
 austria_events.40.f: "\"Političtí činitelé usilují o přeměnu Říše v frašku,\" začal plukovník. \"Každé rozšíření hlasovacího práva činí [SCOPE.GetRootScope.GetCountry.GetCustom('country_legislature_name')] čím dál méně ovladatelným. Tráví svůj čas rozdmycháváním zmatku a odkladů, a každý odklad přináší další poskvrnu na Koruně.\"\n\nViděl souhlasné přikyvování kolem stolu. Každý z mužů pociťoval škrty rozpočtu provedené ve jménu získání podpory nějakého provinčního sněmu. Pokračoval.\n\n\"Naše Říše vstupuje do soumraku a stojíme uprostřed této zkázy. Pokud to bude #italic dovoleno#! pokračovat, obávám se, že nás to všechny pohltí.\"" # todo: NEW TRANSLATION
 austria_events.40.a: "Jejich slova hrozí diktaturou." # todo: NEW TRANSLATION
 austria_events.40.b: "Můžeme skutečně říci, že se mýlí?" # todo: NEW TRANSLATION
 modifier_military_absolutist_bonus: "Říše nad ústavou" # todo: NEW TRANSLATION
 is_integrated_tt: "[THIS.GetCulture.GetName] je [Concept('concept_integrated_culture','$concept_integrated_culture_short$')|l]" # todo: NEW TRANSLATION
 is_disqualified_tt: "[THIS.GetCulture.GetName] je [Concept('concept_disqualified_culture','$concept_disqualified_culture_short$')|l]" # todo: NEW TRANSLATION
 je_danubian_federation_observer: "Federální projekt" # todo: NEW TRANSLATION
 je_danubian_federation_observer_reason: "Vláda [SCOPE.sCountry('austria_scope').GetName] schválila návrh reorganizace území [SCOPE.sCountry('austria_scope').GetAdjectiveNoFormatting] Říše na federaci samosprávných států vymezených etnickými liniemi. Tento návrh by zrušil složitou síť korunních zemí a personálních unií tvořící dosavadní Říši a nahradil je federální strukturou konečně odpovědnou Vídni.\n\nPokud [SCOPE.sCountry('austria_scope').GetNameNoFlag] dokončí #v $je_danubian_federation$#! [concept_journal_entry], tradiční práva a privilegia [ROOT.GetCountry.GetName] budou zrušena a naše země budou přímo integrovány do [SCOPE.sCountry('austria_scope').GetCustom('future_kuk_name')|v]." # todo: NEW TRANSLATION
 has_been_integrated_into_federation_tt: "[SCOPE.sCountry('austria_scope').GetName] #b dokončila#! #v $je_danubian_federation$#! a vytvořila #v $dyn_c_usga$#!, následovně: #indent_newline:3 " # todo: NEW TRANSLATION
 has_been_integrated_into_federation_republic_tt: "[SCOPE.sCountry('austria_scope').GetName] #b dokončila#! #v $je_danubian_federation$#! a vytvořila #v $KUK$#!, následovně: #indent_newline:3 " # todo: NEW TRANSLATION
 austria_has_failed_je_danubian_federation_tt: "[SCOPE.sCountry('austria_scope').GetName] #b selhala#! #v $je_danubian_federation$#!, následovně: #indent_newline:3 " # todo: NEW TRANSLATION
 has_been_integrated_by_austria_tt: "Byly uspokojivě [Concept('concept_integrated_culture','$concept_integrated_culture_short$')|l] do Federace" # todo: NEW TRANSLATION
 austria_federation.13.t: "Federální říše" # todo: NEW TRANSLATION
 austria_federation.13.d: "Vláda [SCOPE.sCountry('austria_scope').GetName] oficiálně podpořila návrh reorganizace Říše na federální stát. Pokud bude úspěšně prosazen, znamenalo by to konec současné autonomie [ROOT.GetCountry.GetNameNoFlag] a možnou ztrátu našich historických území." # todo: NEW TRANSLATION
 austria_federation.13.f: "\"Z tohoto hlediska tedy nejde o 'pád', ale o reorganizaci, o znovuzrození [SCOPE.sCountry('austria_scope').GetNameNoFormatting]. Kéž by ti, kdo skutečně pečují o tuto říši, si i ve svém temném toužení byli plně vědomi správné cesty vpřed. Za prvé, není pravda, že pouze nezávislé národní státy mají právo existovat. $SWI$, často a právem citovaný příklad, je typ smíšeného národního útvaru, a nikdo by mu rozumně neodepřel právo existovat. Ve skutečnosti je v naší říši historický proces pouze ve snaze najít moderní formu národně-státních vztahů, která odpovídá jejím nově probuzeným potřebám.\"\n\n— Aurel Popovici, #italic The United States of Greater Austria#!" # todo: NEW TRANSLATION
 austria_federation.13.a: "Pro [ROOT.GetCountry.GetNameNoFlag] je místo ve Federaci." # todo: NEW TRANSLATION
 austria_federation.13.b: "Pokud musíme bránit naši suverenitu, ať tak bude." # todo: NEW TRANSLATION
 austria_federation.14.t: "Z tonoucí lodi" # todo: NEW TRANSLATION
 austria_federation.14.d: "Naše nezávislost na [SCOPE.sCountry('austria_or_danubia_scope').GetName] navždy zamezila riziku vměšování z [SCOPE.sCountry('austria_or_danubia_scope').GetCapital.GetCityHubName]. Ať už vláda [SCOPE.sCountry('austria_or_danubia_scope').GetAdjectiveNoFlag] bude svůj projekt pokračovat nebo ne, nebudeme jeho součástí." # todo: NEW TRANSLATION
 austria_federation.14.f: "[ROOT.GetCountry.GetCapital.GetCityHubName] se začalo měnit. Bylo to mnohem víc než nové vlajky a konfety v kanálech – [SCOPE.sCharacter('name_a_scope').GetFirstNameNoFormatting] to viděl v nabídce kaváren, v rozvěšených letácích, v rozhovorech, které slyšel na ulicích. Při své denní procházce narazil na skupinu dělníků, kteří natírali budovu ministerstva, přikrývajíce starou schönbrunnskou žlutou novým nátěrem zrezivělé červené.\n\n\"Tohle bylo habsburské město\", jakoby říkalo, a tak se o to postarali. Zajímal se, jestli přijdou i pro modré dveře." # todo: NEW TRANSLATION
 austria_federation.14.a: "Ať žije nezávislé [ROOT.GetCountry.GetName]!" # todo: NEW TRANSLATION
 austria_federation.14.b: "Můžeme nabídnout odpuštění z dálky." # todo: NEW TRANSLATION
 austria_federation.15.t: "Vláda [SCOPE.sCountry('relevant_subject').GetAdjective] slibuje spolupráci" # todo: NEW TRANSLATION
 austria_federation.15.d: "Vláda [SCOPE.sCountry('relevant_subject').GetName] přislíbila plnou spolupráci s naším plánem federalizovat Říši. Mnoho našich [SCOPE.sCulture('primary_culture_scope').GetName] obyvatel stojí za jejich rozhodnutím." # todo: NEW TRANSLATION
 austria_federation.15.f: "\"Ministr se usmíval, slyšeli jste?\" šeptal [SCOPE.sCharacter('name_a_scope').GetFirstNameNoFormatting], jeho hlas sotva přes zvuk klapání lžičky o porcelán. Jeden z jeho kolegů překvapeně zvedl obočí.\n\n\"Téměř tomu nevěřím,\" řekl. \"Kde jsi to slyšel?\"\n\n\"Viděl jsem to sám. Byl v hale, s nějakým plukovníkem nebo tak.\"\n\n\"Ten by byl z [SCOPE.sCulture('primary_culture_scope').GetCustom('getPluralDemonym')], tipuji,\" řekl muž na konci stolu. \"Kočár přijel z [SCOPE.sCountry('relevant_subject').GetCapital.GetCityHubName] včera v noci a neřekli, kdo byl na palubě. Něco vzrušujícího se děje.\"" # todo: NEW TRANSLATION
 austria_federation.15.a: "Duch přátelství kvete na Dunaji." # todo: NEW TRANSLATION
 austria_federation.15.b: "Jejich vstup není nutný." # todo: NEW TRANSLATION
 inform_vienna_tt: "[ROOT.GetCountry.GetTopOverlord.GetName] bude mít příležitost [Concept('concept_integrated_culture','$concept_integrated_culture_present$')|l] všechny naše příslušné [concept_primary_cultures]" # todo: NEW TRANSLATION
 austria_federation.16.t: "Vláda [SCOPE.sCountry('relevant_subject').GetAdjective] odmítá integraci" # todo: NEW TRANSLATION
 austria_federation.16.d: "Vláda [SCOPE.sCountry('relevant_subject').GetName] přislíbila odpor našemu plánu federalizace Říše. Mnoho našich [SCOPE.sCulture('primary_culture_scope').GetName] obyvatel pravděpodobně stojí za jejich rozhodnutím." # todo: NEW TRANSLATION
 austria_federation.16.f: "Dopis byl plný obvyklých frází. Národní suverenita, přesah moci [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle], starobylá práva a privilegia [SCOPE.sCountry('relevant_subject').GetAdjectiveNoFormatting] zemí. Nebyl to první takový dopis, a pravděpodobně nebude ani poslední, avšak byl zdaleka nejnepříjemnější. Torpédo do boku vládního velkého plánu. Úředník ho vložil do truhlíku k odeslání.\n\nJeho pohled se zastavil na kolegovi, který popíjel kávu na druhé straně místnosti. \"Máme další plán?\"\n\n\"Nemohu říct.\"\n\n\"Protože nevíš, nebo protože je to vojenské tajemství?\"\n\n\"Nemohu říct.\"" # todo: NEW TRANSLATION
 austria_federation.16.a: "Budeme se muset obejít bez nich." # todo: NEW TRANSLATION
