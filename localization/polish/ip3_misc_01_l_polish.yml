 je_eastern_question_russia: "Krize a příležitost" # todo: NEW TRANSLATION
 je_eastern_question_russia_reason: "Krize, která sužuje #v $dyn_c_ottoman_empire$#!, nám poskytla příležitost upevnit další vliv v [GetStrategicRegion('region_balkans').GetName]. Založením [GetCulture('bulgarian').GetName] státu můžeme oslabit sféru $dyn_c_ottoman_empire_adj$ a zároveň si získat důvěryhodnost jako ochránce [GetReligion('orthodox').GetName] lidí po celé Evropě." # todo: NEW TRANSLATION
 bulgaria_is_not_free_tt: "#v $BUL$#! neexistuje" # todo: NEW TRANSLATION
 bulgaria_is_not_at_war_with_tur_tt: "#v $BUL$#! není ve válce s #v $dyn_c_ottoman_empire$#!" # todo: NEW TRANSLATION
 ottomans_not_owns_dobruja_tt: "The #v $dyn_c_ottoman_empire$#! nevlastní žádný stát v [GetStateRegion('STATE_DOBRUDJA').GetName]" # todo: NEW TRANSLATION
 bulgaria_is_independent_tt: "#v $BUL$#! byla prohlášena za nezávislý [concept_country]" # todo: NEW TRANSLATION
 je_eastern_question_austria: "Bosenská otázka" # todo: NEW TRANSLATION
 je_eastern_question_austria_reason: "Naše lobbistické skupiny žádají, abychom obsadili [GetStateRegion('STATE_BOSNIA').GetName], které je momentálně územím [SCOPE.sCountry('bosnia_owner_scope').GetName]. Pokud by se tak stalo, jejich návrh by pomohl zadržet postup vlivu [SelectLocalization(SCOPE.sCountry('relevant_country').IsValid, SCOPE.sCountry('relevant_country').GetAdjectiveNoFlag, 'dyn_c_rsfsr_adj')] v [GetStrategicRegion('region_balkans').GetName].\n\nPokud na jejich žádost úspěšně zareagujeme, získáme přízeň [Concept('concept_political_lobby','$concept_political_lobby_short$')|l], avšak pokud selžeme v daném čase, velmi je zklameme." # todo: NEW TRANSLATION
 eastern_question_austria.1.t: "Posun hranice" # todo: NEW TRANSLATION
 eastern_question_austria.1.d: "Snahy [SCOPE.sCountry('relevant_country').GetName] rozšířit vliv v balkánském regionu znepokojily [SCOPE.sPoliticalLobby('relevant_lobby').GetName]. Navrhli preventivní akci proti [SCOPE.sCountry('bosnia_owner_scope').GetName], aby zabránili [SCOPE.sCountry('relevant_country').GetNameNoFormatting] získat vliv nad [GetStateRegion('STATE_BOSNIA').GetName]." # todo: NEW TRANSLATION
 eastern_question_austria.1.f: "\"Dovolte mi učinit návrh,\" začal [SCOPE.sCharacter('lobby_politician_scope').GetLastNameNoFormatting].\n\n[SCOPE.sCharacter('lobby_politician_scope').GetSheHe|U] přistihl generála v restauraci v [ROOT.GetCountry.GetCapital.GetCityHubName], slíbil uhradit účet výměnou za půl hodiny jeho času. Generál položil sklenku z nejdražšího vína na stůl a přikývl.\n\n\"Týká se to [SCOPE.sCulture('relevant_country_culture').GetCustom('getPluralDemonym')], a jejich současného úsilí. Předpokládám, že sledujete noviny a víte o nepříznivé situaci Slovanů a o agresivní rétorice [SCOPE.sCountry('relevant_country').GetRuler.GetPrimaryRoleTitle] v této věci...\"" # todo: NEW TRANSLATION
 eastern_question_austria.1.a: "Převezmeme břemeno civilizace [GetStateRegion('STATE_BOSNIA').GetNameNoFormatting]." # todo: NEW TRANSLATION
 eastern_question_austria.1.b: "Tento návrh zavání válkou." # todo: NEW TRANSLATION
 eastern_question_austria.2.t: "Okupační vláda" # todo: NEW TRANSLATION
 eastern_question_austria.2.d: "S jistotou držení [GetStateRegion('STATE_BOSNIA').GetName] nyní můžeme rozhodnout o budoucnosti regionu. Okupace, která nominálně zachová [SCOPE.sCountry('bosnia_owner_scope').GetAdjective] autoritu, pravděpodobně získá mezinárodní souhlas, ale omezí naše praktické zisky." # todo: NEW TRANSLATION
 eastern_question_austria.2.d_2: "S jistotou držení [GetStateRegion('STATE_BOSNIA').GetName] nyní můžeme rozhodnout o budoucnosti regionu. Okupace, která nominálně zachová suverenitu regionu, pravděpodobně získá mezinárodní souhlas, ale omezí naše praktické zisky." # todo: NEW TRANSLATION
 eastern_question_austria.2.f: "\"Doporučil bych následující,\" řekl ministr. \"Pro naše počáteční hodnocení [SCOPE.sCharacter('name_a_scope').GetLastNameNoFormatting] v [SCOPE.sState('bosnia_state_scope').GetCityHubName], [SCOPE.sCharacter('name_b_scope').GetLastNameNoFormatting] v [SCOPE.sState('bosnia_state_scope').GetFarmHubName] a [SCOPE.sCharacter('name_c_scope').GetLastNameNoFormatting] v [SCOPE.sState('bosnia_state_scope').GetForestryHubName]. Pošleme administrativní týmy na základě zvláštních nedostatků každého regionu.\"\n\n[SCOPE.sCharacter('name_b_scope').GetLastNameNoFormatting|U], sedící v první řadě, zvedl ruku. \"Stále jsme nedostali armádní zprávy. Co můžeme očekávat?\"\n\n\"Ohněv obyvatelstva a úředníky fixované na daňové výběry. Propusťte, kolik budete potřebovat. Turci nikdy nezískali pověst dobré správy.\"" # todo: NEW TRANSLATION
 eastern_question_austria.2.a: "Okupovat území a reorganizovat jeho správu." # todo: NEW TRANSLATION
 eastern_question_austria.2.b: "Anexovat [GetStateRegion('STATE_BOSNIA').GetName] jako integrální součást naší Říše." # todo: NEW TRANSLATION
 eastern_question_austria.2.c: "Připojit [GetStateRegion('STATE_BOSNIA').GetName] k naší říši pod záštitou společného ministerstva financí." # todo: NEW TRANSLATION
 eastern_question_austria.2.e: "Anexovat [GetStateRegion('STATE_BOSNIA').GetName] jako součást [SCOPE.sCountry('croatia_scope').GetName]." # todo: NEW TRANSLATION
 bosnian_protectorate_tt: "Území [GetStateRegion('STATE_BOSNIA').GetName] bude organizováno jako [GetCulture('bosniak').GetName] [concept_protectorate]" # todo: NEW TRANSLATION
 bosnian_puppet_tt: "Území [GetStateRegion('STATE_BOSNIA').GetName] bude organizováno jako [GetCulture('bosniak').GetName] [concept_puppet]" # todo: NEW TRANSLATION
 eastern_question_russia.1.t: "Ochránce jižních Slovanů" # todo: NEW TRANSLATION
 eastern_question_russia.1.t2: "Obrození [SelectLocalization(SCOPE.sCountry('bulgaria_scope').IsValid, SCOPE.sCountry('bulgaria_scope').GetAdjective, 'BUL_ADJ')]" # todo: NEW TRANSLATION
 eastern_question_russia.1.d: "Náš podíl na nezávislosti [SCOPE.sCountry('bulgaria_scope').GetName] nám zajistil důvěryhodnost jako ochránce jižních slovanských národů. Nyní máme bohatou příležitost upevnit náš vliv na Balkáně." # todo: NEW TRANSLATION
 eastern_question_russia.1.d2: "Nezávislost [SCOPE.sCountry('bulgaria_scope').GetName] odhalila trhliny v osmanské sféře. Získali jsme příznivou příležitost rozšířit náš vliv na Balkáně." # todo: NEW TRANSLATION
 eastern_question_russia.1.f: "Zvuky dechového orchestru hrály, když se nově vytvořené [SCOPE.sCountry('bulgaria_scope').GetAdjectiveNoFormatting] regimentu vydaly na pochod. Jak zajímavé to bylo, pomyslel si [SCOPE.sCharacter('name_a_scope').GetLastNameNoFormatting], že nové [SCOPE.sCountry('bulgaria_scope').GetAdjectiveNoFormatting] uniformy vypadaly téměř identicky jako jeho vlastní. Zeleno-modré látky s červeným lemováním. Roztomilé, jako dítě napodobující otce.\n\n[SCOPE.sCharacter('name_a_scope').GetHerHis|U] mise však vyžadovala víc než roztomilost. Jednoho dne možná budou tito vojáci pochodovat v zájmu jeho vlastní země. [ROOT.GetCountry.GetNameNoFormatting] bude potřebovat ujištění od [SCOPE.sCountry('bulgaria_scope').GetRuler.GetPrimaryRoleTitle]. Byla potřeba vojenské spolupráce, uplatnění osmanských spisů. Na každý hod radosti připadl den byznysu." # todo: NEW TRANSLATION
 eastern_question_russia.1.a: "Popřejeme [SCOPE.sCountry('bulgaria_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('bulgaria_scope').GetRuler.GetLastName] naše gratulace a pošleme velvyslanectví." # todo: NEW TRANSLATION
 eastern_question_russia.1.b: "Je tu více příležitostí jinde." # todo: NEW TRANSLATION
 eastern_question_russia.1.c: "Popřejeme [SCOPE.sCountry('bulgaria_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('bulgaria_scope').GetRuler.GetLastName] naše gratulace a pošleme velvyslanectví." # todo: NEW TRANSLATION
 eastern_question_russia.1.e: "Možná by prospělo delší setrvání." # todo: NEW TRANSLATION
