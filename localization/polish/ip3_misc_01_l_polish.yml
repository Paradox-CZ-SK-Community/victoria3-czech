 slave_revolt.4.t: "Na domácí půdě" # todo: NEW TRANSLATION
 slave_revolt.4.d: "Skupina uprchlých [GetPopType('slaves').GetName] z naší kolonie [SCOPE.sState('fleeing_slaves_state').GetName] úspěšně dosáhla pevniny [ROOT.GetCountry.GetAdjectiveNoFlag] poté, co se ukryli na obchodní lodi. Podle zákona jsou všichni zotročení lidé, kteří se dotknou [ROOT.GetCountry.GetAdjectiveNoFormatting] půdy, prohlášeni svobodnými." # todo: NEW TRANSLATION
 slave_revolt.4.f: "[SCOPE.sCharacter('name_a_scope').GetFirstNameNoFormatting] seděl na okraji mola, houpal nohama nad hladinou vody. Západ slunce zbarvil vodu do červena. Vhodné, s ohledem na dnešní zprávy. [SCOPE.sCharacter('name_a_scope').GetSheHe|U] to viděl v novinách, na nástěnkách, na rtech kolemjdoucích.\n\nOzval se hlas za [SCOPE.sCharacter('name_a_scope').GetHerHim]. [SCOPE.sCharacter('name_a_scope').GetSheHe|U] ho poznal—[SCOPE.sCharacter('name_b_scope').GetFirstNameNoFormatting], další úředník u soudu.\n\n\"O čem přemýšlíš?\"\n\n\"V [SCOPE.sState('port_state').GetPortHubName] se lidé děsí myšlenky na lidi v řetězech. Ale nemyslí na ty za tím horizontem. Jednoho dne nás [SCOPE.GetRootScope.GetCountry.GetCustom('GetDivinity')] potrestá.\"" # todo: NEW TRANSLATION
 slave_revolt.4.a: "Mají nárok na všechna práva svobodných lidí." # todo: NEW TRANSLATION
 slave_revolt.4.b: "Svobodní či ne, musí se vrátit do [SCOPE.sState('fleeing_slaves_state').GetName]." # todo: NEW TRANSLATION
