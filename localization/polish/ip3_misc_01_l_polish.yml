 modifier_corporatist_consolidation: "Korporativní konsolidace" # todo: NEW TRANSLATION
 modifier_corporatists_countered: "Protikorporatismus" # todo: NEW TRANSLATION
 modifier_austria_corporate_state: "Pravý stát" # todo: NEW TRANSLATION
 modifier_austria_corporate_state_vigilance: "Freiwilliges Schutzkorps" # todo: NEW TRANSLATION
