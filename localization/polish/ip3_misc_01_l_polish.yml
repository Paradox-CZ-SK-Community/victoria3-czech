 metternich_memory_text_tt: "[SCOPE.sCharacter('metternich_scope').GetFullName] bude pamatován jako [SCOPE.GetRootScope.GetCountry.GetCustom('metternich_performance_text')]" # todo: NEW TRANSLATION
 metternich_memory_level_0: "muž, který svou nešikovností zasel semena nevyhnutelného pádu [ROOT.GetCountry.GetNameNoFormatting]." # todo: NEW TRANSLATION
 metternich_memory_level_1: "zdiskreditovaný zdroj reakce, jehož vize se ukázala být korozivní pro všechno, čeho se dotkla." # todo: NEW TRANSLATION
 metternich_memory_level_2: "vybledlý státník, který lpěl na moci déle než měl." # todo: NEW TRANSLATION
 metternich_memory_level_3: "pošramocený kolos minulé éry, jehož skutečné zásluhy byly zastíněny pozdějšími omyly." # todo: NEW TRANSLATION
 metternich_memory_level_4: "vizionář staré společnosti, nositel ideálu stejně svůdného jako odsouzeného." # todo: NEW TRANSLATION
 metternich_memory_level_5: "odvážný obránce reakce, nenáviděný i romantizovaný v jednom." # todo: NEW TRANSLATION
 metternich_memory_level_6: "hodný protivník pokroku, ikona urozené aristokracie, která možná přetrvá." # todo: NEW TRANSLATION
 metternich_memory_level_7: "velký skeptik modernity a přitom jeden z jejích nevyřčených architektů." # todo: NEW TRANSLATION
 metternich_memory_level_8: "strateg a vizionář, jehož díků si [ROOT.GetCountry.GetNameNoFormatting] zaslouží." # todo: NEW TRANSLATION
 metternich_memory_level_9: "ideál státní správy, se kterým se každý touží srovnávat." # todo: NEW TRANSLATION
 metternich_memory_level_10: "postava srovnatelná s Napoleonem, přivlastňovaná všemi politickými proudy." # todo: NEW TRANSLATION
