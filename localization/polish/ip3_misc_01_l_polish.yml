 metternich_resignation_and_flee_tt: "[SCOPE.sCharacter('metternich_scope').GetFullName] podá [SCOPE.sCharacter('metternich_scope').GetHerHis] rezignaci" # todo: NEW TRANSLATION
 metternich.1.t: "Konec jedné éry" # todo: NEW TRANSLATION
 metternich.1.d: "S nástupem [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] na trůn oznámil dlouho sloužící kancléř [SCOPE.sCharacter('metternich_scope').GetFullName] svůj odchod do důchodu. Kapitola dějin definovaná [SCOPE.sCharacter('metternich_scope').GetHerHis] státnictvím skončila." # todo: NEW TRANSLATION
 metternich.1.f: ""Ale především, myšlenka, kterou tajně opěvují, je, že stará Evropa začíná končit. Moje odhodlání je zmizet spolu s ní, budu plnit svou povinnost; ani to není jen moje motto—je to i motto císaře. Nová Evropa zatím nezačala svou existenci, a mezi koncem a začátkem bude chaos.\" \n\n— Klemens von Metternich" # todo: NEW TRANSLATION
 metternich.1.a: "Velký dirigent opouští jeviště." # todo: NEW TRANSLATION
 metternich.2.t: "Hanebný konec" # todo: NEW TRANSLATION
 metternich.2.d_revolution: "S [ROOT.GetCountry.GetNameNoFlag] zmítaným revolučním zmatkem a vládou, která už nezajistí [SCOPE.sCharacter('metternich_scope').GetHerHis] bezpečnost, byl [SCOPE.sCharacter('metternich_scope').GetFullName] donucen rezignovat na svůj úřad. [SCOPE.sCharacter('metternich_scope').GetSheHe|U] prchl z [ROOT.GetCountry.GetCapital.GetCityHubName] do exile." # todo: NEW TRANSLATION
 metternich.2.d_gov_change: "Vyloučení [SCOPE.gsInterestGroup('aristocracy_ig').GetName] z vlády přinutilo [SCOPE.sCharacter('metternich_scope').GetFullName] k rezignaci na [SCOPE.sCharacter('metternich_scope').GetHerHis] post. Po zbavení velké části [SCOPE.sCharacter('metternich_scope').GetHerHis] dřívějšího vlivu se [SCOPE.sCharacter('metternich_scope').GetSheHe] uchýlil do ústraní na [SCOPE.sCharacter('metternich_scope').GetHerHis] panství." # todo: NEW TRANSLATION
 metternich.2.f: "\"Už nejsem nikdo. Nemám už co dělat, nemám už co řešit.\"\n\n— Klemens von Metternich" # todo: NEW TRANSLATION
 metternich.2.a: "[SCOPE.sCharacter('metternich_scope').GetSheHe|U] nás už nebude určovat." # todo: NEW TRANSLATION
 metternich.3.t: "Menší puč" # todo: NEW TRANSLATION
 metternich.3.d: "Kancléř [SCOPE.sCharacter('metternich_scope').GetFullName] navrhl balík reforem struktury Geheime Staatskonferenz; zlepšujících fungování tohoto orgánu a zároveň ustanovujících [SCOPE.sCharacter('metternich_scope').GetHerselfHimself] jeho nepochybným vůdcem. [SCOPE.sCharacter('kolowrat_scope').GetFullName] se sblížil s královskou rodinou, aby návrh zablokoval." # todo: NEW TRANSLATION
 metternich.3.f: ""Málo mužů by z nových pravomocí profitovalo méně než Metternich," začal posel, "a prosím arcivévodu, aby mi prominul, že to tak říkám. Pokud by byl k dispozici do konce měsíce..."\n\nArcivévoda mu naznačil, aby přestal, podrážděný výraz na tváři. Boty měl napůl obuté a přál si jim věnovat plnou pozornost. "Konec měsíce? Kde je teď Kolowrat?"\n\n"Čechy, pane. Posílá zprávy o chřipce."" # todo: NEW TRANSLATION
 metternich.3.a: "Kolowratovo vměšování ohrožuje stabilitu Říše." # todo: NEW TRANSLATION
 metternich.3.b: "Kancléř by se měl omezit na zahraniční záležitosti." # todo: NEW TRANSLATION
