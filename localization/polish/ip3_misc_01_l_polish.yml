 je_metternich: "Věk Metternicha" # todo: NEW TRANSLATION
 je_metternich_reason: "Následky #b napoleonských válek#! ustanovily [ROOT.GetCountry.GetName] jako přední konzervativní mocnost v Evropě. Hlavní architekt poválečného pořádku, [SCOPE.sCharacter('metternich_scope').GetFullName], slouží od bouřlivého roku 1821 jako kancléř [ROOT.GetCountry.GetNameNoFormatting]. Jeho agenda volá po udržení [ROOT.GetCountry.GetAdjectiveNoFormatting] [GetLawType('law_autocracy').GetName], zachování konzervativního míru v Evropě a podpoře umění a věd.\n\n#b Metternichova agenda:#!\nRealizace několika položek na programu kancléře [SCOPE.sCharacter('metternich_scope').GetLastName] zlepší efekty tohoto Deníku. Tyto úspěchy budou bodovány a tento deník se považuje za úspěšně #b dokončený#!, pokud budou splněny.\n• [SCOPE.GetRootScope.GetCountry.GetCustom('metternich_ita_checkbox')] Zabráněno #b $ITA_ADJ$#! [Concept('concept_unification', '$concept_unification_short$')|l]\n• [SCOPE.GetRootScope.GetCountry.GetCustom('metternich_ger_checkbox')] #b $GER$#! nebylo [Concept('concept_unification', 'unified')] žádnou jinou [concept_country]\n• [SCOPE.GetRootScope.GetCountry.GetCustom('metternich_art_checkbox')] [ROOT.GetCountry.GetNameNoFlag] je předním producentem [GetGoods('fine_art').GetName]\n• [SCOPE.GetRootScope.GetCountry.GetCustom('metternich_krakow_checkbox')] [ROOT.GetCountry.GetNameNoFlag] vlastní celé [concept_state_region] [GetStateRegion('STATE_WEST_GALICIA').GetName]\n• [SCOPE.GetRootScope.GetCountry.GetCustom('metternich_tech_checkbox')] [ROOT.GetCountry.GetNameNoFlag] výzkumně dosáhl [GetPlayer.MakeScope.ScriptValue('metternich_tech_target')|v0] [Concept('concept_technology', '$concept_technologies$')|l] (aktuálně [GetPlayer.MakeScope.ScriptValue('techs_researched_script')|v0])[SCOPE.GetRootScope.GetCountry.GetCustom('metternich_system_entry')][SCOPE.GetRootScope.GetCountry.GetCustom('metternich_system_cohesion_entry')]\n• [SCOPE.GetRootScope.GetCountry.GetCustom('metternich_movement_checkbox')] Všechny #tooltippable;tooltip:[GetPlayer.GetTooltipTag],liberal_movements_list_tt Liberální#! nebo #tooltippable;tooltip:[GetPlayer.GetTooltipTag],socialist_movements_list_tt Socialistické#! [Concept('concept_political_movement','$concept_political_movements$')|l] mají #b marginální#! podporu\n• [SCOPE.GetRootScope.GetCountry.GetCustom('metternich_laws_checkbox')] [ROOT.GetCountry.GetNameNoFlag] má [GetLawType('law_autocracy').GetName], [GetLawType('law_censorship').GetName] a [GetLawType('law_secret_police').GetName]\n• [SCOPE.GetRootScope.GetCountry.GetCustom('metternich_institution_checkbox')] #b $institution_home_affairs$#! a #b $institution_police$#! [Concept('concept_institution', '$concept_institutions$')|l] jsou na úrovni #v 2#! nebo vyšší" # todo: NEW TRANSLATION
