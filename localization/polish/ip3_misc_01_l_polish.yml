 je_danubian_federation_slovak_button: "Řešit obavy [GetCulture('slovak').GetName]" # todo: NEW TRANSLATION
 je_danubian_federation_slovak_button_desc: "Země obývané [GetCulture('slovak').GetName] byly dlouho spravovány pod #b $HUN_ADJ$#! korunou a byly vystaveny intenzivní maďarizační politice, která zpomalila růst jejich národní identity. Kromě toho měli čeští a slovenští nacionalisté historicky blízké vazby, s některými prosazujícími česko-slovenskou entitu. Abychom úspěšně integrovali [GetCulture('slovak').GetCustom('getPluralDemonym')], je nezbytné vyčlenit region z #b Maďarska#! a nalézt řešení otázky česko-slovenského svazku." # todo: NEW TRANSLATION
 je_danubian_federation_polish_button: "Řešit obavy [GetCulture('polish').GetName]" # todo: NEW TRANSLATION
 je_danubian_federation_polish_button_desc: "Region #b Haliče#! obývají dva národy, [GetCulture('polish').GetCustom('getPluralDemonym')] a [GetCulture('ukrainian').GetCustom('getPluralDemonym')]. Tato oblast, dlouho považovaná za agrární periférii, byla místem ostrých sporů mezi oběma národy. Zatímco západ #b Haliče#! má většinu polskou, východ je ukrajinský a zde tradičně vládla polská elita. Abychom úspěšně integrovali polské země, musíme se rozhodnout, zda Halič rozdělit – a jak zajistit polské enklávy na východě." # todo: NEW TRANSLATION
 je_danubian_federation_hungarian_button: "Řešit obavy [GetCulture('hungarian').GetName]" # todo: NEW TRANSLATION
 je_danubian_federation_hungarian_button_desc: "Lid [GetCulture('hungarian').GetName] dlouho těšil vysoký status v říši, s celým historickým #b $HUN$#! organizovaným jako jedna rozsáhlá korunní země. Tradiční maďarské země zahrnují mnoho slovanských, germánských a rumunských národů, kteří byli vystaveni maďarizační politice národnostně naladěné maďarské správy. Abychom úspěšně integrovali #b Maďarsko#!, musíme rozhodnout, jak se rozdělí jeho historická území mezi různé národy – nebo zda zůstane nedotčeno, na úkor jeho menšin." # todo: NEW TRANSLATION
 je_danubian_federation_slovene_button: "Řešit obavy [GetCulture('slovene').GetName]" # todo: NEW TRANSLATION
 je_danubian_federation_slovene_button_desc: "Země obývané [GetCulture('slovene').GetName] leží blízko ekonomického jádra [ROOT.GetCountry.GetNameNoFlag], v korunních zemích #b Littoral#!, #b Carniola#! a #b Styria#!. Někteří slovinští nacionalisté byli dlouho spojeni s širším hnutím za jihoslovanské sjednocení, volající po autonomii zahrnující území [GetCulture('slovene').GetCustom('getPluralDemonym')], [GetCulture('croat').GetCustom('getPluralDemonym')] a [GetCulture('serb').GetCustom('getPluralDemonym')]. Abychom region úspěšně integrovali, musíme vytyčit slovinský stát z tří existujících korunních zemí a odpovědět na otázku možného sjednocení jihoslovanských států." # todo: NEW TRANSLATION
 je_danubian_federation_croat_button: "Řešit obavy [GetCulture('croat').GetName]" # todo: NEW TRANSLATION
 je_danubian_federation_croat_button_desc: "Chorvatská území byla dlouho rozdělena – nejprve na tři korunní země #b $STATE_CROATIA$#!, #b $STATE_SLAVONIA$#! a #b $STATE_DALMATIA$#!, a poté rozdělena mezi #b $AUS_ADJ$#! a #b $HUN_ADJ$#! části. [SCOPE.GetRootScope.GetCountry.GetCustom('triune_kingdom_exists_or_not')] Navíc chorvatské národnostní hnutí bylo dlouho spojeno s „ilyrismem“, tendencí usilující o sjednocení [GetCulture('slovene').GetCustom('getPluralDemonym')], [GetCulture('croat').GetCustom('getPluralDemonym')] a [GetCulture('serb').GetCustom('getPluralDemonym')] pod jedním státem. Abychom chorvatská území integrovali do federace, musíme [SCOPE.GetRootScope.GetCountry.GetCustom('triune_kingdom_exists_or_not_goal')]" # todo: NEW TRANSLATION
 TRIUNE_KINGDOM_NOT_EXISTS: "Zřízení „Triunového království“ všech tří tradičních [GetCulture('croat').GetNameNoFormatting] zemí bylo dlouhodobým cílem chorvatských nacionalistů." # todo: NEW TRANSLATION
 TRIUNE_KINGDOM_EXISTS: "Nedávné zřízení „Triunového království“ všech tří tradičních [GetCulture('croat').GetNameNoFormatting] zemí uklidnilo chorvatské nacionalisty, kteří nyní chtějí vidět rozšíření svého státu." # todo: NEW TRANSLATION
 TRIUNE_KINGDOM_NOT_EXISTS_GOAL: "vymyslet řešení pro realizaci „Triunového království“ a dojít ke závěru o otázce jihoslovanské jednoty." # todo: NEW TRANSLATION
 TRIUNE_KINGDOM_EXISTS_GOAL: "zavázat se zachovat „Triunové království“ a dojít ke konečnému rozhodnutí ohledně jihoslovanské jednoty." # todo: NEW TRANSLATION
 je_danubian_federation_romanian_button: "Řešit obavy [GetCulture('romanian').GetName]" # todo: NEW TRANSLATION
 je_danubian_federation_romanian_button_desc: "Rumunská území jsou jedny z nejsložitějších v říši, zahrnují nesmírně rozmanitou oblast #b Banatu#!, četné [GetCulture('south_german').GetName] enklávy a velkou [GetCulture('hungarian').GetName] enklávu #b Szekler Land#!. Existují ostré spory o rozdělení území mezi [GetCulture('romanian').GetName] a [GetCulture('hungarian').GetName] nacionalisty, stejně jako o mnohé jiné menšiny v regionu. [SCOPE.GetRootScope.GetCountry.GetCustom('danubian_principalities_exists_or_not')] Abychom region integrovali, musíme vyřešit otázku hranic budoucího rumunského státu a určit status #b Banatu#! a německých a maďarských enkláv." # todo: NEW TRANSLATION
 ROMANIA_EXISTS: "Kromě těchto sporů existuje i snaha o sjednocení s ostatními rumunskými státy." # todo: NEW TRANSLATION
 ROMANIA_NOT_EXISTS: "" # todo: NEW TRANSLATION
 je_danubian_federation_north_italian_button: "Řešit obavy [GetCulture('north_italian').GetName]" # todo: NEW TRANSLATION
