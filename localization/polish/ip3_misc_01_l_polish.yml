 je_red_summer: "Rudé [SCOPE.GetRootScope.GetCountry.GetCustom('country_red_season_name')]" # todo: NEW TRANSLATION
 je_red_summer_reason: "Revoluční vzedmutí #b $je_springtime_of_the_peoples$#! přineslo v [ROOT.GetCountry.GetName] novou liberální vládu. Získat moc však není totéž jako ji udržet. Liberální vládu ohrožují jak #b konzervativní síly#!, které si přejí zrušit nový parlamentní řád, tak #b radikálové#!, kteří hrozí druhou, mnohem hlubší revolucí.\n\n#b Kontrrevoluce#!\nDokud liberální vláda neztvrdí svou moc, bude ohrožena mstivými pozůstatky starého pořádku. Pokud #b postup kontrarevoluce#! dosáhne #v 100#!, revoluční vláda bude #b sesazena z moci#! a bude obnoveno konzervativní uspořádání." # todo: NEW TRANSLATION
 if_failed_through_counter_revolution_tt: "Pokud #b postup kontrrevoluce#! dosáhne #v 100#!:" # todo: NEW TRANSLATION
 if_failed_through_civil_war_tt: "Pokud vypukne [concept_civil_war]:" # todo: NEW TRANSLATION
 liberals_in_government_tt: "#tooltippable;tooltip:[GetPlayer.GetTooltipTag],red_summer_liberal_ideologies_list_tt Revoluční#! [Concept('concept_politician', '$concept_politicians$')|l] jsou v současnosti [concept_in_government]" # todo: NEW TRANSLATION
 liberals_out_of_government_tt: "@warning! Kontrrevoluce může #r rychle postupovat#!. #tooltippable;tooltip:[GetPlayer.GetTooltipTag],red_summer_liberal_ideologies_list_tt Revoluční#! [Concept('concept_politician', '$concept_politicians$')|l] #bold nejsou#! [concept_in_government]." # todo: NEW TRANSLATION
 peoples_springtime.9.t: "Revoluce [SCOPE.sCountry('relevant_country').GetAdjectiveNoFormatting]" # todo: NEW TRANSLATION
 peoples_springtime.9.d: "Inspirováni revoluční vlnou po Evropě se shromáždili revolucionáři v [SCOPE.sState('relevant_state').GetCityHubName], aby předložili požadavky [SCOPE.sCharacter('ruler_scope').GetPrimaryRoleTitle]. Volají po [GetLawType('law_universal_suffrage').GetName], demokratické ústavě a zřízení [GetLawType('law_national_guard').GetName]." # todo: NEW TRANSLATION
 peoples_springtime.9.f: "Dav se valil směrem k rezidenci [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle], zadržen pouze tenkou zdí kamenných tváří vojáků. Nadávky a pouliční haraburdí létaly směrem k řadě bajonetů a kanonů, což bičovalo ocasy koní. V obchodních čtvrtích prodejci, kteří se rozhodli k pochodu nepřipojit, přibíjeli okna svých krámků. Dále za improvizovanými liniemi dělníci vyrvali lampy, aby s nimi prorazili městské brány. Zničené potrubí vrhalo pochodům zlověstné světlo." # todo: NEW TRANSLATION
 peoples_springtime.9.a: "Nemůžeme riskovat občanskou válku." # todo: NEW TRANSLATION
 peoples_springtime.9.b: "Kompromis ohledně volebního práva – ale prosadit to." # todo: NEW TRANSLATION
 peoples_springtime.9.c: "Okamžitě poslat armádu." # todo: NEW TRANSLATION
 had_springtime_revolution_tt: "[ROOT.GetCountry.GetNameNoFlag] byl donucen přijmout demokratickou ústavu" # todo: NEW TRANSLATION
 had_springtime_revolution_tt_no_scope: "Tento [concept_country] byl donucen přijmout demokratickou ústavu" # todo: NEW TRANSLATION
 has_liberal_or_radical_in_government_tt: "Má některá #tooltippable;tooltip:[GetPlayer.GetTooltipTag],liberal_ideologies_list_tt Liberální#!, #tooltippable;tooltip:[GetPlayer.GetTooltipTag],progressive_ideologies_list_tt Progresivní#! nebo #tooltippable;tooltip:[GetPlayer.GetTooltipTag],socialist_ideologies_list_tt Socialistická#! [concept_interest_group] [concept_in_government]" # todo: NEW TRANSLATION
 has_census_voting_or_universal_suffrage_tt: "Zavedla nějakou variantu [GetLawType('law_census_voting').GetName] nebo [GetLawType('law_universal_suffrage').GetName]" # todo: NEW TRANSLATION
 peoples_springtime.10.t: "Rudé [SCOPE.GetRootScope.GetCountry.GetCustom('country_red_season_name_dynamic')]" # todo: NEW TRANSLATION
 peoples_springtime.10.d: "Revoluční vlna v Evropě přinesla v [ROOT.GetCountry.GetName] liberální vládu. Tento křehký liberální řád je ohrožen jak konzervativními silami, které chtějí zvrátit jejich zisky, tak radikály, kteří hrozí novou revolucí." # todo: NEW TRANSLATION
 peoples_springtime.10.f: ""V hlavním městě jsem našel sto tisíc ozbrojených dělníků seřazených do regimentů, bez práce, umírajících hlady, nicméně plných marných teorií a vizionářských nadějí. Viděl jsem společnost rozdělenou na dva: ty, kteří nic nevlastní, sjednocené v společné chamtivosti; ty, kteří něco vlastní, sjednocené ve společném strachu. Nebylo mezi nimi žádné pouto, žádná soucit – všude se zdálo, že nevyhnutelný a bezprostřední zápas je na dosah.\" \n\n— Alexis de Tocqueville, #italic Vzpomínky Alexise de Tocquevilla#!" # todo: NEW TRANSLATION
 peoples_springtime.10.a: "Ať žije ústava!" # todo: NEW TRANSLATION
 peoples_springtime.10.b: "Toto karikování musí skončit." # todo: NEW TRANSLATION
 red_summer_counter_revolution_bonus_tt: "#b Kontrrevoluce#! bude #b postupovat#! o #variable 1#! každý měsíc, čímž se zvyšuje šance na #b konzervativní#! vítězství" # todo: NEW TRANSLATION
