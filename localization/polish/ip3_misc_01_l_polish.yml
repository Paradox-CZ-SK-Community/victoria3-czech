 je_technocracy: "Nový stroj" # todo: NEW TRANSLATION
 je_technocracy_reason: "Zavedení [GetLawType('law_technocracy').GetName] v [ROOT.GetCountry.GetName] znamenalo obrovský krok k realizaci kompetentní, uspořádané a bohaté společnosti. Přítomnost [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] a [SCOPE.GetRootScope.GetCountry.GetCustom('country_legislature_name')] však nestačí k tomu, aby vymazala chyby a neefektivitu starého řádu. Je třeba ještě mnoho práce k dokončení transformace společnosti a masy zůstávají skeptické.\n\nAbychom zpevnili nový režim, musíme dokončit náš program a dokázat, že $law_technocracy$ přinese éru míru a hojnosti, kterou slibuje." # todo: NEW TRANSLATION
 je_technocracy_progress_bar: "Nový stroj" # todo: NEW TRANSLATION
 je_technocracy_progress_bar_desc: "Pokrok: #v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|%]#! ([JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1]/[GetPlayer.MakeScope.ScriptValue('technocracy_upper_bound')])" # todo: NEW TRANSLATION
 je_technocracy_complete_tt: "Ukazatel #variable $je_technocracy_progress_bar$#! dosáhl #variable 100%#!" # todo: NEW TRANSLATION
 technocracy.4.t: "Zlepšení pod vědou" # todo: NEW TRANSLATION
 technocracy.4.d: "[ROOT.GetCountry.GetName] zažila období vnitřní stability a trvalého zlepšení pod vládou [GetIdeology('ideology_technocratic').GetName]. Dříve skeptické segmenty společnosti široce přijaly [GetLawType('law_technocracy').GetName] jako ideální formu vlády." # todo: NEW TRANSLATION
 technocracy.4.f: ""V technokracii vidíme, jak věda nahrazuje ekonomiku nedostatku ekonomikou hojnosti.\nV technokracii vidíme, jak funkční kompetence vytlačuje groteskní a plýtvavou nekompetentnost, fakta vytlačují hádání, pořádek vytlačuje chaos, průmyslové plánování vytlačuje průmyslový chaos.\nTechnokracie je pokus vědy vybudovat civilizaci hodnou inteligence člověka.\" \n\n— Howard Scott, "Technocracy: Science vs. Chaos"" # todo: NEW TRANSLATION
 technocracy.4.a: "Nový svět nebyl nikdy blíž." # todo: NEW TRANSLATION
 technocracy.4.b: "Naše metody musí zasáhnout všechny aspekty společnosti." # todo: NEW TRANSLATION
