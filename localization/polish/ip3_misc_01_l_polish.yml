 shelved_too_soon_ago_tt: "Nedávno jsme tento návrh #b neodložili#" # todo: NEW TRANSLATION
 je_danubian_federation: "Federální řešení" # todo: NEW TRANSLATION
 je_danubian_federation_reason: "Napětí mezi nesčetnými národnostmi v [ROOT.GetCountry.GetName] dlouho ohrožovalo integritu říše. Obhájci práv různých národností volali po různých formách federalizace, a v posledních letech se dostali do kontaktu s členy [SCOPE.gsInterestGroup('armed_forces_ig').GetName], kteří usilují o radikální reformu ve jménu udržení dynastie. Navrhovaný #b $dyn_c_usga$#!, nejnovější z těchto návrhů, by zrušil staré korunní země a nahradil je výběrem samosprávných států vytyčených podle etnických linií.\n\nTento návrh čelí odporu ze strany politiků [GetCulture('hungarian').GetName], kteří se staví proti jeho navrhovanému dělení historického Maďarska, stejně jako ze strany [GetCulture('south_german').GetName] obyvatel, kteří by se pravděpodobně stali menšinami v nestátních německých útvarech." # todo: NEW TRANSLATION
 austria_federation.1.t: "Návrh [SelectLocalization(SCOPE.sCharacter('relevant_character').IsValid, SCOPE.sCharacter('relevant_character').GetLastName, 'Federal')]" # todo: NEW TRANSLATION
 austria_federation.1.d: "[SCOPE.sCharacter('relevant_character').GetFullName], [SCOPE.sCharacter('relevant_character').GetCulture.GetName] obhájce práv národností, předložil návrh na reorganizaci říše do federálního, mnohonárodního státu. [SCOPE.sCharacter('relevant_character').GetHerHis|U] návrh se stal populárním mezi stejně smýšlejícími spolupracovníky [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]." # todo: NEW TRANSLATION
 austria_federation.1.d_mil: "[SCOPE.sCharacter('relevant_character').GetFullName], vlivná postava v [SCOPE.sCharacter('relevant_character').GetInterestGroup.GetName], předložil návrh obnovit autoritu [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] federalizací říše. [SCOPE.sCharacter('relevant_character').GetHerHis|U] návrh se stal populárním mezi stejně smýšlejícími členy dvora." # todo: NEW TRANSLATION
 austria_federation.1.f: ""Z tohoto úhlu pohledu to tedy není otázka ‚zániku‘, ale reorganizace, znovuzrození [ROOT.GetCountry.GetNameNoFormatting]. Kéž by všichni, kdo o tuto říši upřímně pečují, i ve své temné touze plně pochopili správnou cestu vpřed. Zaprvé, není pravda, že právo na existenci mají pouze nezávislé národní státy. $SWI$, často a oprávněně citovaný příklad, je typ smíšeného-národního útvaru, a nikdo by mu rozumně nechtěl odepřít právo na existenci. Ve skutečnosti v naší říši historický proces jen bojuje o moderní formu vztahů mezi národními státy, která odpovídá jeho nově probuzeným potřebám.\" \n\n— Aurel Popovici, #italic The United States of Greater Austria#!" # todo: NEW TRANSLATION
 austria_federation.1.a: "To je reforma, kterou [ROOT.GetCountry.GetNameNoFormatting] potřebuje." # todo: NEW TRANSLATION
 austria_federation.1.b: "Nyní to nezvládneme." # todo: NEW TRANSLATION
 modifier_endorse_popovici_proposal: "Podpořený návrh" # todo: NEW TRANSLATION
 modifier_shelve_popovici_proposal: "Odložený návrh" # todo: NEW TRANSLATION
 austria_federation.2.t: "Jiná cesta" # todo: NEW TRANSLATION
 austria_federation.2.d: "Vyhlášení [ROOT.GetCountry.GetName] vytvořilo a-nacionální unii jako pevnou alternativu k převládajícímu modelu národního státu. Kde jiní mohou čerpat legitimitu ze společné krve, my budeme svou sílu čerpat z dynastie a rozmanitosti našich národů." # todo: NEW TRANSLATION
 austria_federation.2.f: ""Radost, jsi zářící jiskra boží,\nDcéře Elyzia,\nS ohnivým nadšením, bohyně,\nBlížíme se k tvému chrámu!\nTvoje mágie znovu spojuje ty,\nKteré tvrdý zvyk rozdělil;\nVšichni lidé se stanou bratry\nPod tvým ochranným křídlem.\" \n\n— Friedrich Schiller, "Óda na radost"" # todo: NEW TRANSLATION
 austria_federation.2.a: "Říše spojuje všechny své národy." # todo: NEW TRANSLATION
 austria_federation.2.b: "Tři nadšené pokřiky císaři lidu!" # todo: NEW TRANSLATION
 austria_federation.3.t: "Česká otázka" # todo: NEW TRANSLATION
 austria_federation.3.desc: "Po staletí obydlené země bývalé České koruny obývají jak [SCOPE.sCulture('czech_culture').GetName], tak [GetCulture('south_german').GetName] populace. Pokud má být v rámci federace vytvořen [GetCulture('czech').GetNameNoFormatting] stát, je třeba vyřešit otázku českých a moravských Němců." # todo: NEW TRANSLATION
 austria_federation.3.f: ""Proč mapa vypadá takto? Je to zvláštní tvar, že?"\n\n"Češi je sem pozvali, před sto lety. Tehdy nebylo důležité, jestli je kdo Němec nebo Čech, všichni byli pod Bohem a králem rovni. Když se mě ptáte, měli by za to oba obviňovat protestanty."" # todo: NEW TRANSLATION
 austria_federation.3.a: "Česko-moravští Němci musí mít své státy." # todo: NEW TRANSLATION
 austria_federation.3.b: "Čechy budou sjednoceny s Němci jako rovnoprávnými občany." # todo: NEW TRANSLATION
 austria_federation.3.c: "Pokud mohou Němci získat autonomii, mohou Slovákové mít Slovensko." # todo: NEW TRANSLATION
 austria_federation.3.d: "Česko-Slovensko bude sjednoceno bez výhrad." # todo: NEW TRANSLATION
 austria_federation.4.t: "Osud Slovenska" # todo: NEW TRANSLATION
 austria_federation.4.desc: "Země obývané [SCOPE.sCulture('slovak_culture').GetName] lidem byly dlouho spjaty s Maďarskem. Uvažovat o oddělení [SelectLocalization(SCOPE.sState('slovakia_state').IsValid, SCOPE.sState('slovakia_state').GetName, 'STATE_SLOVAKIA')] od Maďarska jistě rozhněvá maďarské nacionalisty, ale může to dodat důvěryhodnost našemu projektu u ostatních západoslovanských národů." # todo: NEW TRANSLATION
 austria_federation.4.f: ""Bylo to maďarské hlavní město. Měli byste na tuto věc opravdu šlápnout opatrně."\n\n"A požádali si Slováci, aby to bylo maďarské hlavní město? Proč by kvůli Maďarsku měli být ochuzeni? Měli bychom vzít v úvahu názory těch, kdo tam žijí, a jen jejich. Už mě to realpolitik už sžírá."" # todo: NEW TRANSLATION
 austria_federation.4.a: "Zorganizovat [SCOPE.sCulture('slovak_culture').GetName] stát." # todo: NEW TRANSLATION
 austria_federation.4.b: "Podmínit [SCOPE.sCulture('slovak_culture').GetName] stát autonomií pro zipsernské Němce." # todo: NEW TRANSLATION
 austria_federation.4.c: "Slovensko ponechat součástí Maďarska." # todo: NEW TRANSLATION
 austria_federation.4.d: "Podporovat sdílený stát pro Čechy a Slováky." # todo: NEW TRANSLATION
 austria_federation.5.t: "Budoucnost Haliče" # todo: NEW TRANSLATION
 austria_federation.5.desc: "Region Halič představuje kořist [ROOT.GetCountry.GetNameNoFlag] z rozdělení Polska. Zatímco území tradičně ovládají [SCOPE.sCulture('polish_culture').GetName] aristokraté, ve východní části má převahu [GetCulture('ukrainian').GetName]. Abychom získali podporu [SCOPE.sCulture('polish_culture').GetNameNoFormatting], musíme sjednat příznivé rozdělení." # todo: NEW TRANSLATION
 austria_federation.5.f: ""Co myslíte? Kde čáru položíme?"\n\n"Rusíni mají menší očekávání než Poláci. Čisté oddělení východu od západu je uspokojí, ale rozhněvá Poláky, kteří samozřejmě očekávají více. Dejte Lvov Polákům a Rusíni nám mohou odpustit výměnou za jinou ústupku. Vaše úloha nebude jednoduchá, ale může být proveditelná."" # todo: NEW TRANSLATION
 austria_federation.5.a: "Omezit [GetCulture('polish').GetName] stát na Západní Halič." # todo: NEW TRANSLATION
 austria_federation.5.b: "Rozdělit Halič, s Lvovem pod polskou autoritou." # todo: NEW TRANSLATION
 austria_federation.5.c: "Udržet celou Halič jako polský stát." # todo: NEW TRANSLATION
 austria_federation.6.t: "Rozdělení Maďarska" # todo: NEW TRANSLATION
 austria_federation.6.desc: "Tradiční hranice Maďarska zahrnují mnoho rozsáhlých ne-[SCOPE.sCulture('hungarian_culture').GetName] regionů. Musíme se rozhodnout, zda uspokojíme [SCOPE.sCulture('hungarian_culture').GetName] lidi, nebo Maďarsko rozdělíme a riskujeme odpor [SCOPE.sCulture('hungarian_culture').GetNameNoFormatting]." # todo: NEW TRANSLATION
 austria_federation.6.desc_dual: "Národ [SCOPE.sCulture('hungarian_culture').GetName] byl dlouho rovnocennou polovinou naší říše, vládnoucí prakticky neomezeně nad rozmanitým územím. Musíme se rozhodnout, zda upokojit [SCOPE.sCountry('hungary_scope').GetNameNoFlag], nebo udělit jeho národnostem vlastní státy a provokovat [SCOPE.sCulture('hungarian_culture').GetNameNoFormatting] reakci." # todo: NEW TRANSLATION
 austria_federation.6.f: ""Mám často obavy, že tento plán je neproveditelný. Nebudou se Maďaři bouřit?"\n\n"Čínský generál, zpožděný deštěm, se zeptal svého adjutanta, jaký je trest za zpoždění. ‚Smrt,‘ odpověděl. A pak se zeptal na trest za povstání – ten samý, samozřejmě. A tak padla dynastie. Naše situace s Maďary je úplně stejná. Pokud se bouří kvůli nejmenší ústupku, proč bychom neměli zatlačit tím největším?\"" # todo: NEW TRANSLATION
 austria_federation.6.a: "Zachovat historické Maďarsko v rámci federace." # todo: NEW TRANSLATION
 austria_federation.6.b: "[GetCulture('hungarian').GetCustom('getPluralDemonym')] musí odevzdat jen Slovensko." # todo: NEW TRANSLATION
 austria_federation.6.c: "Oddělit Chorvatsko a Sedmihradsko od Maďarska." # todo: NEW TRANSLATION
 austria_federation.6.d: "Snížit Maďarsko na území s maďarskou většinou." # todo: NEW TRANSLATION
 austria_federation.7.t: "Slovinská území" # todo: NEW TRANSLATION
 austria_federation.7.desc: "Lid [SCOPE.sCulture('slovene_culture').GetName], soustředěný převážně v oblasti [SCOPE.sState('slovenia_scope').GetName], je jedním z jihoslovanských národů v naší říši. Musíme zvážit, zda [SCOPE.sCulture('slovene_culture').GetName] stát bude jedním z mnoha jihoslovanských států, nebo jestli bude spojen s jinými podobnými národy." # todo: NEW TRANSLATION
 austria_federation.7.desc_istria: "Požadavky [SCOPE.sCulture('slovene_culture').GetName] na [SelectLocalization(SCOPE.sState('istria_scope').IsValid, SCOPE.sState('istria_scope').GetName, 'STATE_ISTRIA')] na jihu říše jsou v rozporu s požadavky [GetCulture('croat').GetName] a [GetCulture('north_italian').GetName]. Navíc existuje otázka, zda [SCOPE.sCulture('slovene_culture').GetName] stát bude jedním z mnoha jihoslovanských států nebo spojen s jinými." # todo: NEW TRANSLATION
 austria_federation.7.f: ""Když se podíváte na pobřeží, uvidíte, že jih je z větší části chorvatský a sever je italský. Slovinská část je někde uprostřed. Je to trochu klubko, ale myslím, že to do oběda rozpléteme. Sistiana je dost dobrý přístav, není?"" # todo: NEW TRANSLATION
 austria_federation.7.a: "Slovinský stát bude sahat k moři." # todo: NEW TRANSLATION
 austria_federation.7.b1: "Podporovat chorvatské a italské nároky na [SelectLocalization(SCOPE.sState('istria_scope').IsValid, SCOPE.sState('istria_scope').GetName, 'STATE_ISTRIA')]." # todo: NEW TRANSLATION
 austria_federation.7.b2: "Vytvořit slovinský stát v [SCOPE.sState('slovenia_scope').GetName]." # todo: NEW TRANSLATION
 austria_federation.7.c: "V říši už je dost slovanských států." # todo: NEW TRANSLATION
 austria_federation.7.d: "Udělme slovinsko-chorvatskou unii bez německých a italských území." # todo: NEW TRANSLATION
 austria_federation.7.e: "Podpořit stát pro všechny jihoslovanské národy v rámci federace." # todo: NEW TRANSLATION
 austria_federation.8.t: "Triunová království" # todo: NEW TRANSLATION
 austria_federation.8.desc: "Korunní země obývané [SCOPE.sCulture('croat_culture').GetName] byly rozděleny mezi [ROOT.GetCountry.GetNameNoFlag] a [GetCulture('hungarian').GetName] od doby, kdy jsme získali bývalá benátská území. Pokud chceme uspokojit [SCOPE.sCulture('croat_culture').GetCustom('getPluralDemonym')], musíme sjednotit všechny [SCOPE.sCulture('croat_culture').GetNameNoFormatting] pod [SCOPE.sCulture('croat_culture').GetNameNoFormatting] stát." # todo: NEW TRANSLATION
 austria_federation.8.desc_triune: "Zřízení [SelectLocalization(SCOPE.sCountry('croatia_scope').IsValid, SCOPE.sCountry('croatia_scope').GetName, 'CRO')] uspokojilo dlouhodobé přání [SCOPE.sCulture('croat_culture').GetName] národů po sjednocení. Nyní musíme zvážit, zda bude [SCOPE.sCulture('croat_culture').GetName] stát jedním z mnoha jihoslovanských států nebo spojen s jinými." # todo: NEW TRANSLATION
 austria_federation.8.f: "Otázka jihoslovanské problematiky byla natolik komplikovaná, že způsobila vředy. Maďarsko bylo dlouho trnem v oku [ROOT.GetCountry.GetCapital.GetCityHubName] a nechali jsme se váhat navrhnout další silnou správu. Ale vyhlídka loajální a mocné Illyrie... možná. Třeba, pokud by všechno šlo přesně podle plánu." # todo: NEW TRANSLATION
 austria_federation.8.a: "Omezit chorvatský stát na historická [GetCulture('croat').GetName] území." # todo: NEW TRANSLATION
 austria_federation.8.b: "Zachovat existující Triunové království ve federaci." # todo: NEW TRANSLATION
 austria_federation.8.c: "Sjednotit chorvatská území pod Triunovým královstvím." # todo: NEW TRANSLATION
 austria_federation.8.d: "Uspořádat unii mezi slovinskými a chorvatskými zeměmi." # todo: NEW TRANSLATION
 austria_federation.8.e: "Podpořit stát pro všechny jihoslovanské národy v rámci federace." # todo: NEW TRANSLATION
 austria_federation.9.t: "Za lesem" # todo: NEW TRANSLATION
 austria_federation.9.desc: "Korunní země obývané [SCOPE.sCulture('romanian_culture').GetName] jsou jedny z nejrozmanitějších v říši. Zřízení jakéhokoli [SCOPE.sCulture('romanian_culture').GetNameNoFormatting] území určitě rozčílí [GetCulture('hungarian').GetName] nacionalisty, a v regionu jsou roztroušeny menšiny [GetCulture('south_german').GetName], které žádají autonomii." # todo: NEW TRANSLATION
 austria_federation.9.f: ""Budeme potřebovat tu nejméně tři autonomie, možná více. Kde se tu vzalo tolik Němců?"\n\n"Usadili jsme je sem—docela nedávno, po poslední válce s Turky. Teď se nám to vrací jako stín."" # todo: NEW TRANSLATION
 austria_federation.9.a: "Dát rumunskému státu Banát a celé Sedmihradsko." # todo: NEW TRANSLATION
 austria_federation.9.b: "Dát rumunskému státu vše kromě Szeklerlandu." # todo: NEW TRANSLATION
 austria_federation.9.c: "Sedmihradsko je rumunské, Banát německý." # todo: NEW TRANSLATION
 austria_federation.9.d: "Zmenšit rumunský stát na jih Sedmihradska." # todo: NEW TRANSLATION
 austria_federation.9.e: "Celé Sedmihradsko je neodvolatelně maďarské." # todo: NEW TRANSLATION
 austria_federation.10.t: "Západní okraj" # todo: NEW TRANSLATION
 austria_federation.10.desc: "Nacionalistické proudy v Itálii nám už ukrojily mnoho italských území. Pokud má být podpora zbývajících [SCOPE.sCulture('north_italian_culture').GetName] získána, je nutné vyřešit sporná italská, [GetCulture('slovene').GetName] a [GetCulture('south_german').GetName] území." # todo: NEW TRANSLATION
 austria_federation.10.desc_lomven: "Lid [SCOPE.sCulture('north_italian_culture').GetName] je jedním z nejvlivnějších národů v říši díky obyvatelstvu a ekonomické síle italských korunních zemí. Pokud má být jejich podpora federace zajištěna, musí být potlačeno sjednocenecké hnutí a vyřešeny otázky menšin [GetCulture('south_german').GetName] a [GetCulture('slovene').GetName] způsobem uspokojivým pro [GetCulture('north_italian').GetNameNoFormatting] nacionalisty." # todo: NEW TRANSLATION
 austria_federation.10.f: ""Dostal jsem dopis od námořnictva. Žádá mě, abych byl štědrý k Italům, kvůli náboru."\n\n"To mě nepřekvapuje. To je opravdu italská instituce."\n\n"Dostal jsem taky dopis z Palerma. Ten mě žádá... no, to tu nebudu opakovat."\n\n"Musím říct, že to je ještě víc italské."" # todo: NEW TRANSLATION
 austria_federation.10.a: "Trento i Terst budou italské." # todo: NEW TRANSLATION
 austria_federation.10.b: "Trento bude italské, ale Terst slovanský." # todo: NEW TRANSLATION
 austria_federation.10.c: "Terst stačí sám o sobě." # todo: NEW TRANSLATION
 austria_federation.10.d: "Lombardie-Venetie je dostatečná reprezentace." # todo: NEW TRANSLATION
 austria_federation.10.e: "Tak malé populace si nezaslouží vlastní státy." # todo: NEW TRANSLATION
 austria_federation.11.t: "Příhraničí" # todo: NEW TRANSLATION
 austria_federation.11.desc: "Populace [SCOPE.sCulture('ukrainian_culture').GetName] v [SelectLocalization(SCOPE.sState('east_galicia_state').IsValid, SCOPE.sState('east_galicia_state').GetName, 'STATE_EAST_GALICIA')] byla od dob Commonwealthu vládnuta polskými elitami. Většinou polské město [SelectLocalization(SCOPE.sState('east_galicia_state').IsValid, SCOPE.sState('east_galicia_state').GetCityHubName, 'HUB_NAME_STATE_EAST_GALICIA_city_polish')] požádalo o autonomii pod polským státem. Přijmout by uklidnilo Poláky, ale odepřelo by Ukrajincům důležitý ekonomický motor." # todo: NEW TRANSLATION
 austria_federation.11.f: ""Halič? Tam je zvláštní dynamika. Šlechtici nenávidí [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle], ale sedláci milují [ROOT.GetCountry.GetRuler.GetHerHim]. Když se šlechtici—většinou Poláci—pokusili povstat, sedláci jim vtrhli do sídel a pověsili je. Museli jsme poslat armádu chránit potenciální rebelii. Kdybyste se mě ptal, řekl bych, že tenkrát si Rusíni vybojevali svůj stát."" # todo: NEW TRANSLATION
 austria_federation.11.a: "Dát ukrajinskému státu celé Východní Halič." # todo: NEW TRANSLATION
 austria_federation.11.b: "Vytvořit ukrajinský stát ve Východní Haliči, s Lvovem pod polskou správou." # todo: NEW TRANSLATION
 austria_federation.11.c: "Nabídnout Ukrajincům Bukovinu výměnou za polský Lvov." # todo: NEW TRANSLATION
 austria_federation.11.d: "Celá Halič je polské území." # todo: NEW TRANSLATION
 austria_federation.12.t: "Srbové z [SelectLocalization(SCOPE.sState('vojvodina_state').IsValid, SCOPE.sState('vojvodina_state').GetName, 'STATE_DELVIDEK_serbian')]" # todo: NEW TRANSLATION
 austria_federation.12.desc: "Stát [SCOPE.sState('vojvodina_state').GetName] dlouho sloužil jako centrum [SCOPE.sCulture('serb_culture').GetName] kultury. [SCOPE.sCulture('serb_culture').GetNameNoFormatting] populace v regionu požádala o vznik [SCOPE.sCulture('serb_culture').GetNameNoFormatting] státu s hlavním městem v [SCOPE.sState('vojvodina_state').GetCityHubName]. Návrh čelí odporu místních [GetCulture('hungarian').GetName] a [GetCulture('south_german').GetName] komunit." # todo: NEW TRANSLATION
 austria_federation.12.f: ""Až ten návrh zveřejníte, pamatujte, že jen Maďaři to nazývají Újvidék. Všichni ostatní to říkají Novi Sad. Neusatz, pro nás."\n\nSurveyor škrtnul to jméno. "Docela nepořádek, že?"\n\n"Více než si umíte představit. To město jednou nazývali srbskými Athénami—když se rozhodneme pro ně, může to znovu být."" # todo: NEW TRANSLATION
 austria_federation.12.a: "Oddělit [SCOPE.sState('vojvodina_state').GetNameNoFormatting] od Maďarska jako srbský stát." # todo: NEW TRANSLATION
 austria_federation.12.b: "[SCOPE.sState('vojvodina_state').GetNameNoFormatting] musí zůstat součástí Maďarska." # todo: NEW TRANSLATION
 austria_federation.12.c: "Podpořit stát pro všechny jihoslovanské národy v rámci federace." # todo: NEW TRANSLATION
 croats_are_fine_tt: "Protože bylo zřízeno #b Triune Kingdom#!: #indent_newline:3 \n• [GetCulture('croat').GetName] nebude #b odhlašován#! z budoucího procesu [Concept('concept_integrated_culture','$concept_integrated_culture_process$')|l]#!" # todo: NEW TRANSLATION
 because_hungarian_anger_is_low_tt: "Protože #b maďarská#! [concept_liberty_desire] nebo [Concept('concept_radical', '$concept_radicalism$')|l] je nízká: #indent_newline:3 \n• [GetCulture('hungarian').GetName] nebude #b odhlašován#! z budoucího procesu [Concept('concept_integrated_culture','$concept_integrated_culture_process$')|l]" # todo: NEW TRANSLATION
 because_hungarian_anger_is_high_tt: "Protože #b maďarská#! [concept_liberty_desire] nebo [Concept('concept_radical', '$concept_radicalism$')|l] je vysoká: #indent_newline:3 \n• [GetCulture('hungarian').GetName] bude #b odhlašován#! z budoucího procesu [Concept('concept_integrated_culture','$concept_integrated_culture_process$')|l]\n• [GetPlayer.MakeScope.ScriptValue('small_radicals')|-=1%] [GetCulture('hungarian').GetName] [Concept('concept_pop', '$concept_pops$')|l] v [ROOT.GetCountry.GetNameNoFlag] a jeho ne-[GetCulture('hungarian').GetName] [concept_personal_union] a [concept_crown_land] [Concept('concept_subject', '$concept_subjects$')|l] se stanou více [concept_radical]#!#!" # todo: NEW TRANSLATION
 because_lombardy_venetia_tt: "Protože [ROOT.GetCountry.GetName] si ponechalo #b Lombardy#! nebo #b Venetii#!: #indent_newline:3 \n• [GetCulture('north_italian').GetName] bude úspěšně [Concept('concept_integrated_culture','$concept_integrated_culture_short$')|l], stane se [Concept('concept_primary_cultures','$concept_primary_culture$')|l] [ROOT.GetCountry.GetNameNoFlag]#!" # todo: NEW TRANSLATION
 promised_slovakia_to_hungary_tt: "Protože #b Slovensko#! už bylo přislíbeno #b Maďarsku#!, účinky této volby se #r zhorší#!" # todo: NEW TRANSLATION
 promised_bukovina_to_romania_tt: "Protože #b Bukovina#! už byla přislíbena #b Sedmihradsku#!: #indent_newline:3 \n• [GetCulture('romanian').GetName] bude [Concept('concept_disqualified_culture','$concept_disqualified_culture_short$')|l] z budoucího procesu [Concept('concept_integrated_culture','$concept_integrated_culture_process$')|l]\n• [GetPlayer.MakeScope.ScriptValue('large_radicals')|-=1%] [GetCulture('romanian').GetName] [Concept('concept_pop', '$concept_pops$')|l] se stanou více [concept_radical]#!" # todo: NEW TRANSLATION
 danubian_tradition_traits_tt: "Všechny #bold evropské#! [Concept('concept_culture', '$concept_cultures$')|l] s [Concept('concept_homeland','$concept_homelands$')|l] v našich [Concept('concept_state', '$concept_states$')|l] v [GetGeographicRegion('region_danubia').GetName], [GetGeographicRegion('region_balkans').GetName], [GetGeographicRegion('region_poland').GetName] nebo [GetGeographicRegion('region_south_germany').GetName] [Concept('concept_georegion','$concept_georegions$')|l] přijmou #b Danubijské#! [concept_tradition_trait]" # todo: NEW TRANSLATION
 danubian_federation_button_cooldown_tt: "Nebyl #b integrován žádný [concept_culture]#! za posledních #v 180 dní#!" # todo: NEW TRANSLATION
 not_already_used_this_interaction_tt: "Tuto interakci jste #b dosud nepoužili#" # todo: NEW TRANSLATION
 capital_is_in_danubian_states_tt: "[concept_capital_state] se nachází v [GetGeographicRegion('region_danubia').GetName], [GetGeographicRegion('region_balkans').GetName], [GetGeographicRegion('region_poland').GetName] nebo [GetGeographicRegion('region_south_germany').GetName] [concept_georegion]" # todo: NEW TRANSLATION
 modifier_greater_austria: "Unie na Dunaji" # todo: NEW TRANSLATION
 modifier_greater_austria_character: "Císař všech národů" # todo: NEW TRANSLATION
 je_danubian_federation_czech_button: "Řešit obavy [GetCulture('czech').GetName]" # todo: NEW TRANSLATION
 je_danubian_federation_czech_button_desc: "Rozdělení staré #b České koruny#! na korunní země #b Čechy#!, #b Morava#! a #b Slezsko#! bylo dlouho zdrojem nespokojenosti českých nacionalistů. Navíc přítomnost velké menšiny [GetCulture('south_german').GetName] na českých zemích je stálým zdrojem etnického napětí. Abychom úspěšně integrovali region do federace, musíme vymyslet řešení, které znovu sjednotí Čechy, aniž by marginalizovalo [GetCulture('south_german').GetNameNoFormatting] menšinu." # todo: NEW TRANSLATION
 je_danubian_federation_czech_button_integrate_tt: "Následující [Concept('concept_culture', '$concept_cultures$')|l] může být [Concept('concept_integrated_culture','$concept_integrated_culture_short$')|l] prostřednictvím této události:\n• [GetCulture('czech').GetName]\n• [GetCulture('slovak').GetName]" # todo: NEW TRANSLATION
