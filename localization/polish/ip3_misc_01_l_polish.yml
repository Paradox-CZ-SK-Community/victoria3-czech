 subjecthood_events.1.t: "Z mnoha do jednoho" # todo: NEW TRANSLATION
 subjecthood_events.1.d_1: "Přijetí nacionalismu [SCOPE.sCulture('relevant_primary_culture').GetName] státem [ROOT.GetCountry.GetAdjectiveNoFlag] vyvolalo obavy z nucené asimilace mezi komunitami [SCOPE.sCulture('relevant_minority_culture').GetName]. Tyto komunity přislíbily odpor vůči jakémukoli pokusu prosadit [SCOPE.sLaw('current_law_scope').GetName]." # todo: NEW TRANSLATION
 subjecthood_events.1.d_2: "Přijetí nacionalismu [SCOPE.sCulture('relevant_primary_culture').GetName] a [SCOPE.sCulture('relevant_primary_culture_2').GetName] státem [ROOT.GetCountry.GetAdjectiveNoFlag] vyvolalo obavy z nucené asimilace mezi komunitami [SCOPE.sCulture('relevant_minority_culture').GetName]. Tyto komunity přislíbily odpor vůči jakémukoli pokusu prosadit [SCOPE.sLaw('current_law_scope').GetName]." # todo: NEW TRANSLATION
 subjecthood_events.1.d_3: "Přijetí nacionalismu státem [ROOT.GetCountry.GetAdjectiveNoFlag] vyvolalo obavy z nucené asimilace mezi komunitami [SCOPE.sCulture('relevant_minority_culture').GetName]. Tyto komunity přislíbily odpor vůči jakémukoli pokusu prosadit [SCOPE.sLaw('current_law_scope').GetName]." # todo: NEW TRANSLATION
 subjecthood_events.1.f: "Lidé z vesnice byli po dlouhou dobu věrnými poddanými [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]. Samozřejmě, objevily se potíže – daňové úniky, jednotlivé vzpoury, typické reptání nespokojených rolníků – ale nakonec zůstali loajální. A pak přišly zprávy z [ROOT.GetCountry.GetCapital.GetCityHubName] a s nimi veliký pocit neklidu. Vláda nyní bude vydávat svá nařízení v jazyce [SCOPE.sCulture('relevant_primary_culture').GetNameNoFormatting], jazyce, kterému málo kdo z nich rozuměl a ještě méně z nich umělo číst. Jazyk [SCOPE.sCulture('relevant_minority_culture').GetNameNoFormatting] už nebude stačit. \"Učte se\", zdálo se říkat. \"Mluvte naším jazykem, nebo mlčte úplně.\"" # todo: NEW TRANSLATION
 subjecthood_events.1.a: "Proč musí trvat na odporu vůči pokroku?" # todo: NEW TRANSLATION
 subjecthood_events.1.b: "Můžeš být zároveň [SCOPE.sCulture('relevant_minority_culture').GetName] i [ROOT.GetCountry.GetAdjectiveNoFlag]." # todo: NEW TRANSLATION
 subjecthood_events.2.t: "Ideální občanstvo" # todo: NEW TRANSLATION
 subjecthood_events.2.d_1: "V salónech [SCOPE.sState('relevant_state').GetCityHubName] se rozvinuly diskuse o povaze státního občanství. Vize primátu [SCOPE.sCulture('relevant_primary_culture').GetName] v rámci [SCOPE.sLaw('current_law_scope').GetName] se dostala do konfliktu s univerzalističtějšími ideály." # todo: NEW TRANSLATION
 subjecthood_events.2.d_2: "V salónech [SCOPE.sState('relevant_state').GetCityHubName] se rozvinuly diskuse o povaze státního občanství. Vize primátu [SCOPE.sCulture('relevant_primary_culture').GetName] a [SCOPE.sCulture('relevant_primary_culture_2').GetName] v rámci [SCOPE.sLaw('current_law_scope').GetName] se dostala do konfliktu s univerzalističtějšími ideály." # todo: NEW TRANSLATION
 subjecthood_events.2.d_3: "V salónech [SCOPE.sState('relevant_state').GetCityHubName] se rozvinuly diskuse o povaze státního občanství. Vize primátu oficiálních národností státu v rámci [SCOPE.sLaw('current_law_scope').GetName] se dostala do konfliktu s univerzalističtějšími ideály." # todo: NEW TRANSLATION
 subjecthood_events.2.f: "\"Major [SCOPE.sCharacter('name_a_scope').GetLastNameNoFormatting] opět spřádá spiknutí.\"\n\n[SCOPE.sCharacter('name_b_scope').GetFirstNameNoFormatting] otočil hlavu, aby sledoval palec svého přítele. Tam, skutečně, stál Major, oblečený do stejné uniformy jako vždy. Nakláněl se, aby něco prodiskutoval se svým společníkem, více pro zdání než z nějaké skutečné touhy po tajnosti.\n\n\"Tak se zdá. 'Čest a věrnost', to vždycky říká. Minulý týden jsme mluvili o tom, co tvoří dobrého občana, a řekl to samé.\"\n\n\"A co jsi řekl ty?\"" # todo: NEW TRANSLATION
 subjecthood_events.2.a: "\"Aby byl člověk dobrým občanem, musí být dobrým [SCOPE.sCulture('relevant_primary_culture').GetCustom('getSingularDemonym')].\"" # todo: NEW TRANSLATION
 subjecthood_events.2.b: "\"Samozřejmě měl pravdu. Ale především věrnost.\"" # todo: NEW TRANSLATION
 subjecthood_events.2.c: "\"Být [ROOT.GetCountry.GetAdjectiveNoFormatting] je národnost sama o sobě.\"" # todo: NEW TRANSLATION
 subjecthood_events.3.t: "[SCOPE.sCharacter('ruler_scope').GetPrimaryRoleTitle] [SCOPE.sCulture('relevant_primary_culture').GetCustom('getPluralDemonym')]" # todo: NEW TRANSLATION
 subjecthood_events.3.d: "Povzbuzeni snahami vlády prosadit [SCOPE.sLaw('current_law_scope').GetName] nabídli nacionalisté [SCOPE.sCulture('relevant_primary_culture').GetName] slavnostně [SCOPE.sCharacter('ruler_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('ruler_scope').GetFullName] titul „[SCOPE.sCharacter('ruler_scope').GetPrimaryRoleTitle] of the [SCOPE.sCulture('relevant_primary_culture').GetCustom('getPluralDemonym')]“. Přijetím titulu by se legitimizoval nárok, že [SCOPE.sCharacter('ruler_scope').GetHerHis] moc nakonec pramení z národa." # todo: NEW TRANSLATION
 subjecthood_events.3.f: "\"Když Napoleon vzal korunu, přísahal vládnout v „jediném zájmu, štěstí a slávě $french$ lidu“. To mu udělilo jeho moc a umožnilo mu zvítězit nad všemi jeho nepřáteli. Pokud by [SCOPE.sCharacter('ruler_scope').GetPrimaryRoleTitle] chtěl, mohl by udělat totéž, s ohledem na [SCOPE.sCulture('relevant_primary_culture').GetNameNoFormatting] lid.\"\n\n[SCOPE.sCharacter('ruler_scope').GetPrimaryRoleTitle] pohlédl na žadatele s přemýšlivým výrazem na [SCOPE.sCharacter('ruler_scope').GetHerHis] tváři.\n\n\"A co se stalo s Napoleonem?\"\n\n\"Stal se nesmrtelným, má [SCOPE.sCharacter('ruler_scope').GetCustom('getLadyLordSpouse')|l].\"" # todo: NEW TRANSLATION
 subjecthood_events.3.a: "Ať žije, [SCOPE.sCharacter('ruler_scope').GetPrimaryRoleTitle] [SCOPE.sCulture('relevant_primary_culture').GetCustom('getPluralDemonym')]!" # todo: NEW TRANSLATION
 subjecthood_events.3.b: "Moc vychází z [SCOPE.GetRootScope.GetCountry.GetCustom('GetDivinity')], ne z národa." # todo: NEW TRANSLATION
 subjecthood_events.4.t: "Z poddaných k občanům" # todo: NEW TRANSLATION
 subjecthood_events.4.d_1: "Postupná transformace [ROOT.GetCountry.GetName] na národní stát vytvořila potřebu nového občanského kurikula ve školách. Nový učební plán povýší dějiny [SCOPE.sCulture('relevant_primary_culture').GetName] nad dějinami jiných národů." # todo: NEW TRANSLATION
 subjecthood_events.4.d_2: "Postupná transformace [ROOT.GetCountry.GetName] na národní stát vytvořila potřebu nového občanského kurikula ve školách. Nový učební plán povýší dějiny [SCOPE.sCulture('relevant_primary_culture').GetName] a [SCOPE.sCulture('relevant_primary_culture_2').GetName] nad dějinami jiných národů." # todo: NEW TRANSLATION
 subjecthood_events.4.d_3: "Postupná transformace [ROOT.GetCountry.GetName] na národní stát vytvořila potřebu nového občanského kurikula ve školách. Nový učební plán povýší dějiny oficiálních národností státu nad dějinami jiných národů." # todo: NEW TRANSLATION
 subjecthood_events.4.f: "\"A co myslíte tím, že být ' [SCOPE.sCulture('relevant_primary_culture').GetCustom('getSingularDemonym') ]' ?\" zeptal se učitel.\n\nJedno z žáků vstalo, aby odpovědělo. \"Být [SCOPE.sCulture('relevant_primary_culture').GetCustom('getSingularDemonym')] znamená být hrdý, znamená to být čestný a bránit náš lid. Znamená to sloužit [SCOPE.GetRootScope.GetCountry.GetCustom('GetDivinity')] a [SCOPE.sCulture('relevant_primary_culture').GetNameNoFormatting] národu, a respektovat našeho [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] a jeho ministry.\"\n\nŽák stál ztuhle, dokud portrétní malíř v rohu třídy nahlédl ze svého plátna.\n\n\"Dobře, [SCOPE.sCharacter('name_a_scope').GetFirstNameNoFormatting]. Můžeš si sednout.\"" # todo: NEW TRANSLATION
 subjecthood_events.4.a: "Poskytněte veškeré prostředky potřebné pro tyto změny." # todo: NEW TRANSLATION
 subjecthood_events.4.b: "Pomalý proces by ulevil zátěži naší pokladny." # todo: NEW TRANSLATION
 subjecthood_events.4.c: "Dějiny [SCOPE.sState('claim_state').GetName] mohou být jejich první lekcí." # todo: NEW TRANSLATION
 neighbouring_state_claimable_tt: "Každý nezabraný sousední [concept_state] je [concept_homeland] pro jakoukoli [ROOT.GetCountry.GetAdjectiveNoFlag] [Concept('concept_primary_cultures','$concept_primary_culture$')|l]" # todo: NEW TRANSLATION
 subjecthood_events.5.t: "Vzpomínky na gilotinu" # todo: NEW TRANSLATION
 subjecthood_events.5.d: "Vládní občanská reforma probudila přízrak revolučních excesů mezi [GetPopType('aristocrats').GetName] a [GetPopType('clergymen').GetName]. Bojí se, že jim budou odebrány tradiční tituly ve prospěch rovného občanství." # todo: NEW TRANSLATION
 subjecthood_events.5.f: "\"To je naprosto proti přirozenosti. Řekl bych hříšné – hříšné, a je to #italic cizí#!. Moji předkové vládli této zemi tisíc let, a ti vměšovači v [ROOT.GetCountry.GetCapital.GetCityHubName] chtějí převrátit celý řád věcí. Chtějí, abych byl nazýván '#italic Občan#! [SCOPE.sCharacter('name_a_scope').GetLastNameNoFormatting]'? To je konec všeho.\"\n\nŘidič přikývl, oči pevně upřené na cestu před nimi. Možná je další výmol pohltí oba.\n\n\"Řekl bych,\" pokračoval pán, \"že [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] byl zcela sveden těmi zatracenými novými ministry. To je důsledek jmenování měšťanů!\"" # todo: NEW TRANSLATION
 subjecthood_events.5.a: "Příliš obvyklé, že omdlévají nad přízraky." # todo: NEW TRANSLATION
 subjecthood_events.5.b: "Jsou první mezi [SCOPE.sCulture('relevant_primary_culture').GetName] národem." # todo: NEW TRANSLATION
 subjecthood_events.5.c: "Ano, to všechno zmizí." # todo: NEW TRANSLATION
