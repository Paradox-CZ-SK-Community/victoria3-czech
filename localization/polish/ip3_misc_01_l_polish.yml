 hungry_forties_triggered_tt: "Alespoň #v 10#! států v [GetGeographicRegion('geographic_region_europe').GetName] má $disease_outbreak$ [concept_harvest_condition]" # todo: NEW TRANSLATION
 je_the_hungry_forties: "Hladové [SCOPE.GetRootScope.GetCountry.GetCustom('getDecadeName')|U]" # todo: NEW TRANSLATION
 je_the_hungry_forties_reason: "Vlna plísní na plodinách zasáhla [GetGeographicRegion('geographic_region_europe').GetName], způsobila špatné sklizně a nedostatek potravin. Plíseň je obzvlášť ničivá pro brambory, které rychle hnijí a stávají se nezdravou kaší.\n\n#b Evropský bramborový mor#!:\nDokud je tento Deník aktivní, se míra výskytu $disease_outbreak$ [concept_harvest_condition] v evropských státech výrazně zvýší." # todo: NEW TRANSLATION
 hungry_forties.1.t: "Hladové [SCOPE.GetRootScope.GetCountry.GetCustom('getDecadeName')|U]" # todo: NEW TRANSLATION
 hungry_forties.1.d: "Vypuknutí plísně na plodinách v [SCOPE.sState('relevant_state').GetName] se začalo šířit napříč Evropou. S hrozbou selhání sklizně se obavy z hladu rychle šíří." # todo: NEW TRANSLATION
 hungry_forties.1.f: "Doktor prohmatl bramboru svým nástrojem a odsunul se, aby na ni mohl kouknout kolega. Tupý hrot nástroje se zabořil centimetr do zbarvené skvrny její dužiny.\n\n„Je to plíseň, obávám se. Kdybychom prohlédli další hlízu z pole, výsledek by byl stejný. Doporučil bych mimořádná opatření.“" # todo: NEW TRANSLATION
 hungry_forties.1.a: "Bída!" # todo: NEW TRANSLATION
 hungry_forties.1.b: "Zřídit fondy na nákup zahraničního obilí." # todo: NEW TRANSLATION
 hungry_forties.2.t: "Snazší časy" # todo: NEW TRANSLATION
 hungry_forties.2.d: "Vlna plísní, která zdecimovala evropské plodiny během „hladové dekády“, ustoupila. Ačkoli postižená pole možná už nikdy nebudou pěstovat daný typ brambor, ostatní plodiny by se měly plně zotavit." # todo: NEW TRANSLATION
 hungry_forties.2.f: ""Slyšel jste? Prodávají nový druh bramborového semene. Prý není napadený plísní.\" \n\nMuž opřený o plot zvedl obočí. „Jen tak tak. Já je měl, děti mé sousedky ne. Moc pozdě, opravdu. Musel jsem děti krmit seno, aby přežily zimu.\"\n\n„Měl jste štěstí. Rodina za rohem všechno ztratila. Opravdu příliš pozdě.“" # todo: NEW TRANSLATION
 hungry_forties.2.a: "Díky Bohu." # todo: NEW TRANSLATION
 hungry_forties.2.b: "Můžeme si být jistí, že je to za námi?" # todo: NEW TRANSLATION
