 je_danubian_federation_ukrainian_button_desc: "Region #b Haliče#!, zabraný [ROOT.GetCountry.GetNameNoFlag] z #b Polsko-Litevské Unie#!, je rozdělen mezi převážně [GetCulture('ukrainian').GetName] východ a [GetCulture('polish').GetName] západ. Celá oblast je dlouho spravována polskou elitou a polské enklávy existují ve velkých městech #b $STATE_EAST_GALICIA$#!. Pokud mají být ukrajinské oblasti hladce integrovány do federace, musí být #b Halič#! spravedlivě rozdělena a musí být dohodnuto řešení polských enkláv." # todo: NEW TRANSLATION
 je_danubian_federation_serb_button: "Řešit obavy [GetCulture('serb').GetName]" # todo: NEW TRANSLATION
 je_danubian_federation_serb_button_desc: "Srbská populace říše, soustředěná kolem oblasti #b Vojvodiny#!, je dlouho spravována #b Maďarskem#!. Vojvodina má velmi rozmanité obyvatelstvo a Maďaři ji považují za klíčové maďarské území. Srbská populace je obecně nakloněna federalizaci pod srbským nebo panslovanským státem – ale jakékoli kroky k tomu jistě vyvolají neklid mezi ostatními ne-srbskými obyvateli regionu." # todo: NEW TRANSLATION
