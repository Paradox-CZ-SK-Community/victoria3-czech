 labour_associations_events.1.t: "Bez odborů" # todo: NEW TRANSLATION
 labour_associations_events.1.d: "Vystrašeni posilováním dělnických spolků v důsledku [SCOPE.sLaw('current_law_scope').GetName] zveřejnili [SCOPE.gsInterestGroup('industrialists_ig').GetName] řadu zpráv o nebezpečích odborově organizované pracovní síly." # todo: NEW TRANSLATION
 labour_associations_events.1.f: "#bold Je život v odborech pro mě?#!\n\n• Příspěvky strhávány z vašich mezd\n• Žádné záruky ohledně mzdy, sociálních výhod nebo pracovních pravidel\n• Žádná šance na individuální vyjednávání\n\n#italic VAŠE FIRMA poskytuje vaši práci a platí vaše mzdy – ODBORY to nikdy nedělaly a dělat nebudou!#!" # todo: NEW TRANSLATION
 labour_associations_events.1.a: "Musí mít strach." # todo: NEW TRANSLATION
 labour_associations_events.1.b: "Každý má právo hájit své zájmy." # todo: NEW TRANSLATION
 labour_associations_events.2.t: "Preemptivní zásahy" # todo: NEW TRANSLATION
 labour_associations_events.2.d: "Zpráva o vládním úsilí zakotvit [SCOPE.sLaw('current_law_scope').GetName] se rychle rozšířila mezi dělnickými komunitami. [SCOPE.gsInterestGroup('industrialists_ig').GetName] začali poukazovat na odpovídající nárůst nelegální odborové činnosti." # todo: NEW TRANSLATION
 labour_associations_events.2.f: "Jakmile vláda oznámila svůj záměr, začaly se objevovat plakáty. Marné snahy nočních hlídačů chytit pachatele nepřinesly výsledek, a firma byla nucena přistoupit k nápravě. Každou noc byly zdi polepeny – a ráno firma vysypala kontejnery s nočními příspěvky.\n\nUž týden poté ohlásili popeláři svůj nový odbor." # todo: NEW TRANSLATION
 labour_associations_events.2.a: "Nařídíme soudům, aby tyto stížnosti ignorovaly." # todo: NEW TRANSLATION
 labour_associations_events.2.b: "Stávající zákony zůstanou v platnosti." # todo: NEW TRANSLATION
 labour_associations_events.3.t: "Komise pro odbory" # todo: NEW TRANSLATION
 labour_associations_events.3.d: "Po peticích od dělnických skupin sestavil [SCOPE.GetRootScope.GetCountry.GetCustom('country_legislature_name')] komisi pro [SCOPE.sLaw('current_law_scope').GetName]. Komise předala vládě dvě zprávy – většinovou zprávu napsanou [SCOPE.gsInterestGroup('opposed_ig').GetName] a menšinovou zprávu sympatičtější k [SCOPE.gsInterestGroup('unions_ig').GetName]." # todo: NEW TRANSLATION
 labour_associations_events.3.f: ""Ve skutečnosti byl zákon tak, jak stál, jednostranný a nespravedlivý. Zatímco téměř každé sdružení dělníků ve prospěch svých cílů bylo považováno za spiknutí omezující obchod a tedy trestně postižitelné, přesně podobné akty spáchané panem unikaly pozornosti zákona, protože nejsou považovány za trest spiknutí. Avšak ve skutečnosti zaměstnavatel zaměstnávající několik tisíc dělníků byl sám o sobě kombinací."" # todo: NEW TRANSLATION
 labour_associations_events.3.a: "Schválit menšinovou zprávu." # todo: NEW TRANSLATION
 labour_associations_events.3.b: "Většinová zpráva je přesvědčivější." # todo: NEW TRANSLATION
 labour_associations_events.4.t: "Umírající průmysl" # todo: NEW TRANSLATION
 labour_associations_events.4.d: "Vláda útoky na [GetLawType('law_guild_system').GetName] vyvolaly nepokoje mezi těmi, kdo cítí, že je ohrožena jejich obživa. V [SCOPE.sState('relevant_state').GetName] rozjívení řemeslníci a kvalifikovaní dělníci poničili stroje a zastrašovali dodavatele." # todo: NEW TRANSLATION
 labour_associations_events.4.f: "Proklet budiž bůh, jemuž jsme zoufale prosebně\nV dobách hladových marně volali;\nMarně jsme doufali a marně čekali,\nOn jediný posmíval se našemu smutnému osudu,—\nPleteme, pleteme!" # todo: NEW TRANSLATION
 labour_associations_events.4.a: "Když nemohou svobodně konkurovat, najdou práci jinde." # todo: NEW TRANSLATION
 labour_associations_events.4.b: "Poslat armádu, aby ochránila majetek." # todo: NEW TRANSLATION
 labour_associations_events.5.t: "Poslední zoufalý pokus" # todo: NEW TRANSLATION
 labour_associations_events.5.d: "Snahy vlády prosadit [SCOPE.sLaw('current_law_scope').GetName] narazily na téměř všeobecný odpor ze strany [SCOPE.gsInterestGroup('trade_unions_ig').GetName]. Vedení odborů vyhlásilo všeobecnou stávku, aby přimělo vládu ustoupit." # todo: NEW TRANSLATION
 labour_associations_events.5.f: "Odbory vyrazily v plné síle. Každý sloup veřejného osvětlení v okruhu míle od [SCOPE.GetRootScope.GetCountry.GetCustom('country_legislature_name')] byl ověšen červenými stužkami a pohyb pěších byl zoufalým podnikem. Několik zákonodárců raději spalo ve svých kancelářích, než by čelili lidským přílivům. Jiní, radikálové v opozici, se k protestu přidali. Cestu zpět měli ucpanou pásmem policistů, které obkličovalo celé budovy.\n\nObě strany to nyní vnímaly jako stav obležení. Protestující vybudovali působivý logistický systém k distribuci chleba a vody mezi sebou, zatímco zákonodárci sáhli do jídelny a vinného sklípku [SCOPE.GetRootScope.GetCountry.GetCustom('country_legislature_name')].\n\n„Jak dlouho?“ zeptal se mladší člen. Jeho kolega už neměl sílu odpovědět." # todo: NEW TRANSLATION
 labour_associations_events.5.a: "Jejich reakce ospravedlňuje zákon." # todo: NEW TRANSLATION
 labour_associations_events.5.b: "Nabídnout vyjednávání." # todo: NEW TRANSLATION
 labour_associations_events.5.c: "Přerušit jejich komunikační kanály." # todo: NEW TRANSLATION
 labour_associations_events.6.t: "Nesnesitelné sváry" # todo: NEW TRANSLATION
 labour_associations_events.6.d: "Kniha popisující hrozné podmínky, jimž jsou průmysloví dělníci běžně vystavováni, se stala přes noc hitem. Úspěch knihy zvýšil veřejný zájem o [SCOPE.sLaw('current_law_scope').GetName] a zároveň ztrapnil [SCOPE.gsInterestGroup('industrialists_ig').GetName]." # todo: NEW TRANSLATION
 labour_associations_events.6.f: ""Tak společenský řád činí rodinný život téměř nemožným pro dělníka. V nemajícném, špinavém domě, sotva dostačujícím jako nocleh, špatně zařízeném, často neochráněném proti dešti ani chladu, s páchnoucí atmosférou naplněnou místnosti přetíženými lidmi, není možné žádné domácí pohodlí. Manžel pracuje celý den, možná i manželka a starší děti, všichni na jiných místech; setkávají se jen večer a ráno, stále pod pokušením pít; jaký rodinný život je možný za takových podmínek?\"" # todo: NEW TRANSLATION
 labour_associations_events.6.a: "Dělníci by se měli umět sami zastat." # todo: NEW TRANSLATION
 labour_associations_events.6.b: "Nesmíme dále rozčilovat vlastníky." # todo: NEW TRANSLATION
 labour_associations_events.7.t: "Doslov zákona" # todo: NEW TRANSLATION
 labour_associations_events.7.d: "Povzbuzeni obratem vlády proti organizované práci začali [SCOPE.gsInterestGroup('relevant_bourgeois_ig').GetName] předběžně tlačit na odbory ve svých dílnách. [SCOPE.gsInterestGroup('unions_ig').GetName] požadují odezvu, dokud staré zákony stále platí." # todo: NEW TRANSLATION
 labour_associations_events.7.f: "Bylo to absurdní. Úředník to věděl, jeho nadřízení to věděli a i zástupce odborů stojící před ním to asi věděl. Petice na poslední chvíli spoléhající na zákon, který zmizí z knih dřív, než se vůbec dostane k soudci.\n\nA přesto byla dokonalá. Chyběla jí zjevná vada, která by mu dovolila ji okamžitě odmítnout. Jeho jedinou možností bylo nechat ji zaplnit něčí jiný inbox. Rty se mu stáhly do bezradného úsměvu.\n\n„Děkuji vám, pane. Ministerstvo vás kontaktuje poštou.\"" # todo: NEW TRANSLATION
 labour_associations_events.7.a: "Už nemají žádné právní postavení." # todo: NEW TRANSLATION
 labour_associations_events.7.b: "Musíme dodržet stávající legislativu." # todo: NEW TRANSLATION
 labour_associations_events.8.t: "Volný pracovní trh" # todo: NEW TRANSLATION
 labour_associations_events.8.d: "Jak vláda podniká kroky k rozbití [GetLawType('law_guild_system').GetName], odvážní [GetPopType('laborers').GetName] a [GetPopType('machinists').GetName] začali pronikat do oborů, ze kterých byli dříve vyloučeni." # todo: NEW TRANSLATION
 labour_associations_events.8.f: ""Odcházím. Chtěl jsem to říct dříve. Našel jsem práci v [SCOPE.sState('relevant_state').GetCityHubName], ve fabrikě. Nabídli mi půjčku na dopravu, postel..."\n\nZamyslel se a jeden po druhém se podíval na tváře svých přátel.\n\n"Děkuju. Za všechno. Napíšu, nebo někoho poprosím. Bylo to... bylo to úžasné. Uvidíme se znovu, jednou. Slibuji."" # todo: NEW TRANSLATION
 labour_associations_events.8.a: "Naše úsilí se vyplácí." # todo: NEW TRANSLATION
 labour_associations_events.8.b: "Velké vítězství svobody." # todo: NEW TRANSLATION
 labour_associations_events.9.t: "Skryté motivy" # todo: NEW TRANSLATION
 labour_associations_events.9.d: "Cítíce šanci poškodit své ekonomické rivaly ve městech, přední členové [SCOPE.gsInterestGroup('landowners_ig').GetName] vyšli s podporou přijetí [SCOPE.sLaw('current_law_scope').GetName]." # todo: NEW TRANSLATION
 labour_associations_events.9.f: ""Odbory jsou agenty nepořádku – ale co je důležité, své největší nepřátelství si vyhrazují pro naše bezprostřední konkurenty. Budou požadovat ústupky od svých nadřízených, které zásadně zasáhnou do bohatství magnátů z [SCOPE.sState('relevant_state').GetCityHubName]. Aby tyto ztráty kompenzovali, budou nuceni zvyšovat ceny, což naše vlastní produkty postaví do velmi výhodné pozice."\n\n"Co pak s naším obyvatelstvem? Měli bychom se bát odborů rolníků?"\n\n"Mohou dýchat čistý vzduch a cítit slunce na krku. Mnozí mají své vlastní pozemky. Co by pro ně znamenal odbor?"" # todo: NEW TRANSLATION
 labour_associations_events.9.a: "Zcela funkční uspořádání." # todo: NEW TRANSLATION
 labour_associations_events.9.b: "Musíme si dávat pozor na takové nabídky." # todo: NEW TRANSLATION
