 austria_germany.1.t: "Sedmdesátimilionový Říš" # todo: NEW TRANSLATION
 austria_germany.1.d: "Začlenění celé bývalé #b Rakouské říše#! do [ROOT.GetCountry.GetName] vzbudilo velký znepokojení mezi severoněmeckými nacionalisty. Mnozí požadují, aby tato území byla udělena nezávislost, aby Němci neztratili svou většinu." # todo: NEW TRANSLATION
 austria_germany.1.d1: "Začlenění celé bývalé #b Rakouské říše#! do [ROOT.GetCountry.GetName] vzbudilo velké obavy i mezi ne-německým obyvatelstvem. Mnozí se obávají diskriminace nebo nucené asimilace pod německým nacionalistickým státem." # todo: NEW TRANSLATION
 austria_germany.1.f: ""Musíte pochopit," řekl pruský delegát, "že lidé se bojí. Bojí se, že těch zhruba čtyřicet milionů bývalé Rakušanů rozředí charakter našeho národa, a bojí se, že jejich začlenění učiní z Německa nic jiného než Velkou Rakousko."\n\nRakušan zavrtěl hlavou. "Jsou to dobří katoličtí poddaní, poslušní dokud je někdo nevzbudí. Ujišťuji vás, že tyto obavy jsou zcela neopodstatněné."\n\n"To je ten problém, ne? Toto není katolická říše."" # todo: NEW TRANSLATION
 austria_germany.1.a: "Uvolnit ne-německé regiony jako závislé státy." # todo: NEW TRANSLATION
 austria_germany.1.b: "Uděl me ne-německé regiony nezávislými." # todo: NEW TRANSLATION
 austria_germany.1.c: "Pokračovat v plánu Sedmdesátimilionového Říše." # todo: NEW TRANSLATION
