 peoples_springtime.71.t: "Mír, svoboda a soulad" # todo: NEW TRANSLATION
 peoples_springtime.71.d: "Liberální vláda v [ROOT.GetCountry.GetName] úspěšně překonala dvojí hrozbu obnoveného absolutismu a sociální revoluce. Období revolučního zmatku skončilo pokojně." # todo: NEW TRANSLATION
 peoples_springtime.71.f: ""Není nic plodnějšího v zázrakech než umění být svobodný; avšak není nic těžšího než učňovství ve svobodě.\" \n\n— Alexis de Tocqueville, #italic Vzpomínky na Alexis de Tocquevilla#!" # todo: NEW TRANSLATION
 peoples_springtime.71.a: "Věk svobody se rodí v [ROOT.GetCountry.GetNameNoFormatting]." # todo: NEW TRANSLATION
 peoples_springtime.71.b: "Lid [SCOPE.sCulture('primary_culture_scope').GetName] si vysloužil svobodu." # todo: NEW TRANSLATION
 modifier_age_of_liberty: "Věk svobody" # todo: NEW TRANSLATION
 modifier_red_summer: "Revoluční zmatek" # todo: NEW TRANSLATION
 king_in_parliament_tt: "Přidá #b Král-v-Parlamentu#! do deníku této [concept_country]" # todo: NEW TRANSLATION
 je_king_in_parliament: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]-v-Parlamentu" # todo: NEW TRANSLATION
 je_king_in_parliament_reason: "Konec absolutistické vlády v [ROOT.GetCountry.GetName] nevyřešil otázku rovnováhy moci mezi [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] a [SCOPE.GetRootScope.GetCountry.GetCustom('country_legislature_name')]. Aby se nový parlamentní řád upevnil, musí stát prokázat, že vůle lidu je nad vůlí [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]." # todo: NEW TRANSLATION
 je_king_in_parliament_goal: "Následující musí platit po celkem #v 10#! letech:" # todo: NEW TRANSLATION
 je_king_in_parliament_complete_tt: "[GetIdeology('ideology_absolutist_movement').GetName] [Concept('concept_political_movement','$concept_political_movements$')|l] budou nahrazeny [GetIdeology('ideology_royalist_movement').GetName] $concept_political_movements_short$" # todo: NEW TRANSLATION
 autocracy.4.t: "Odpovědná vláda" # todo: NEW TRANSLATION
 autocracy.4.d: "Stabilita parlamentního řádu [ROOT.GetCountry.GetAdjectiveNoFlag] vedla k tomu, že royalisté opustili naděje na obnovu absolutismu. Konstituční monarchie se stala novým status quo." # todo: NEW TRANSLATION
 autocracy.4.f: ""Parlament je ta nejvyšší a absolutní moc, která dává život a pohyb vládě. Řídí a uvede v činnost všechny její různé procedury, jako rodič našeho míru, obránce naší víry a základ našich majetků; a tak jako je Ústava této velké pružiny v síle a kráse, tak i všechny akty a výkony z ní odvozené budou nést vhodný poměr a podobu.\"" # todo: NEW TRANSLATION
 autocracy.4.a: "Na zdraví [SCOPE.GetRootScope.GetCountry.GetCustom('country_legislature_name')]!" # todo: NEW TRANSLATION
 autocracy.4.b: "[SCOPE.GetRootScope.GetCountry.GetCustom('GetDivinity')] ochraňuj [SCOPE.sCharacter('ruler_scope').GetPrimaryRoleTitle]!" # todo: NEW TRANSLATION
 modifier_constitutional_monarch: "Milovaný symbol" # todo: NEW TRANSLATION
 modifier_constitutional_monarch_movement_support: "Milovaný panovník" # todo: NEW TRANSLATION
 modifier_constitutional_order: "Ústavní pořádek" # todo: NEW TRANSLATION
 je_balkan_national_awakenings: "Národní probuzení" # todo: NEW TRANSLATION
 je_balkan_national_awakenings_reason: "Zatímco [ROOT.GetCountry.GetName] učinila první kroky ke státotvornosti, zůstává zemí sedláků. Velká část naší populace stále vnímá svět očima vesnice a rodu spíše než bratrství národa. Musíme podporovat kulturní [concept_fervor] mezi našimi lidmi a vybudovat jednotný národ z [SCOPE.sCulture('primary_culture_scope').GetName] obyvatel.\n\n[concept_fervor] kultury [SCOPE.sCulture('primary_culture_scope').GetName] je ovlivňován těmito podmínkami:\n• Průměrnou [concept_literacy] [SCOPE.sCulture('primary_culture_scope').GetName] [Concept('concept_pop', '$concept_pops$')|l]\n• Počtem [SCOPE.sCulture('primary_culture_scope').GetName] [GetPopType('academics').GetName]\n• [SCOPE.sCulture('primary_culture_scope').GetName] zeměmi, které zkoumají #b $nationalism$#! a #b $pan-nationalism$#!\n• Průměrnou [concept_acceptance] [SCOPE.sCulture('primary_culture_scope').GetName] populace\n• Nezávislými nebo dříve nezávislými [SCOPE.sCulture('primary_culture_scope').GetName] státy" # todo: NEW TRANSLATION
 claims_on_all_homelands_tt: "[ROOT.GetCountry.GetName] získává [Concept('concept_claim', '$concept_claims$')|l] na všech [SCOPE.sCulture('primary_culture_scope').GetName] [Concept('concept_homeland','$concept_homelands$')|l]" # todo: NEW TRANSLATION
 has_formed_yugoslavia_tt: "Byl vytvořen #v $YUG$#!" # todo: NEW TRANSLATION
 national_awakening.1.t: "Obrození [SCOPE.sCulture('primary_culture_scope').GetNameNoFormatting]" # todo: NEW TRANSLATION
 national_awakening.1.d: "Úsilí [ROOT.GetCountry.GetAdjective] státu o podporu národního zápalu vedlo ke kulturnímu rozkvětu. I v nejodlehlejších vesnicích [SCOPE.sState('rural_state').GetName] nyní naši občané chápou své místo jako součásti národa [SCOPE.sCulture('primary_culture_scope').GetName]." # todo: NEW TRANSLATION
 national_awakening.1.f: "Sčítací úředník sledoval, jak se dveře chatrče otevřely. Byla to nejodlehlejší vesnice, kterou dosud navštívil, místo dvou koní a jediné klikaté cesty. Muž stál ve dveřích a pevně pozdravil na znamení jeho knoflíků.\n\n„Jak se jmenujete?“\n\n„[SCOPE.sCharacter('relevant_character').GetFullNameNoFormatting],“ odpověděl muž ve dveřích.\n\n„A odkud jste?“\n\n„Jsem [SCOPE.sCulture('primary_culture_scope').GetNameNoFormatting], pane, jako můj otec a jeho otec před ním.“" # todo: NEW TRANSLATION
 national_awakening.1.a: "Ať žije národ [SCOPE.sCulture('primary_culture_scope').GetNameNoFormatting]!" # todo: NEW TRANSLATION
 national_awakening.1.b: "Velký národ si zaslouží velkou armádu." # todo: NEW TRANSLATION
 modifier_fervour_military_bonus: "Nacionalistické nadšení" # todo: NEW TRANSLATION
 modifier_fervour_military_bonus_ig: "Probuzené nacionalistické nadšení" # todo: NEW TRANSLATION
 2TAB: "    " # todo: NEW TRANSLATION
 national_awakening.2.t: "Venkovské školství" # todo: NEW TRANSLATION
 national_awakening.2.d: "[GetPopType('academics').GetName] placení státem založili vesnické školy napříč [SCOPE.sState('relevant_state').GetName]. Tyto školy mají za cíl zvýšit gramotnost a podporovat [SCOPE.sCulture('relevant_culture').GetName] národní identitu mezi sedláky." # todo: NEW TRANSLATION
 national_awakening.2.f: ""Náš národ měl smůlu,“ začala učitelka. „Dosud nebyl úplně sjednocen. V těchto krajích jsou naši lidé závislí na cizincích.“\n\nUkázala na mapu na stěně, na několik oblastí vyznačených černě.\n\n„V těchto provinciích vládne cizinec a je velmi těžké pro naše bratry…“" # todo: NEW TRANSLATION
 national_awakening.2.a: "Vynikající iniciativa." # todo: NEW TRANSLATION
 national_awakening.2.b: "Nabídnout jim další financování." # todo: NEW TRANSLATION
 national_awakening.3.t: "Národní epos" # todo: NEW TRANSLATION
 national_awakening.3.d: "Nedávno vydaná sbírka tradičních [SCOPE.sCulture('relevant_culture').GetName] básní a písní uchvátila stále gramotnější obyvatele [ROOT.GetCountry.GetName]. Dobrý výtisk [SCOPE.GetRootScope.GetCountry.GetCustom('country_national_epic_name')] nyní lze nalézt na každé poličce v [ROOT.GetCountry.GetCapital.GetCityHubName]." # todo: NEW TRANSLATION
 national_awakening.3.f: "Tiskařské zařízení nikdy nebylo tak rušné. Dělníci přinášeli palety teplého papíru ke stanicím, kde se lepil a vázal do kůže. Vzadu obrovské lisy tiskly stránku za stránkou, každá zdobená elegantními uzlíky a obrázky květin. Tato padesátka se vázala pro [ROOT.GetCountry.GetCapital.GetCityHubName], ta pro [ROOT.GetCountry.GetCapital.GetFarmHubName]. Dopisy od soukromých osob i knihkupců se kupily na přepážce, čekající na zápis do knihy.\n\nZepředu se ozvalo volání – muž právě odcházel v uniformě. „Příkaz od ministerstva – chtějí dvě stě do pátku!“" # todo: NEW TRANSLATION
 national_awakening.3.a: "Dílo, které spojuje národ." # todo: NEW TRANSLATION
 national_awakening.3.b: "Na zdraví našim osobnostem!" # todo: NEW TRANSLATION
 national_awakening.4.t: "Ve vlastním jazyce" # todo: NEW TRANSLATION
 national_awakening.4.d: "Slavný učenec [SCOPE.sCharacter('intelligentsia_leader').GetFullName] přeložil Nový zákon do jazyka [SCOPE.sCulture('relevant_culture').GetName]. Rostoucí korpus děl v jazyce [SCOPE.sCulture('relevant_culture').GetNameNoFormatting] zvýšil prestiž tohoto jazyka mezi kněžími a intelektuály." # todo: NEW TRANSLATION
 national_awakening.4.f: ""Objednal jsem si výtisk #italic Principia#! v [SCOPE.sCulture('relevant_culture').GetNameNoFormatting] a jeden z mých kolegů požádal o celou Bibli ve stejném jazyce. Pokud budeme mít jednu kvalitní práci přeloženou ročně a každý překlad provede student, který dál učí další, budeme mít do konce století směšný korpus. Ještě více, pokud nakladatelé rozpoznají poptávku.\" \n\n"Ambiciózní podnik, opravdu. Myslíte, že byste mohl změnit katedru?"\n\n"Snil jsem o budoucnosti, kdy náš jazyk bude žádaný – kdy Švéd si bude žádat eseje od [SCOPE.sCulture('relevant_culture').GetNameNoFormatting] nakladatele. A sním taky, že jeden z mých studentů bude autorem těchto esejí."" # todo: NEW TRANSLATION
 national_awakening.4.a: "Brzy bude celá Evropa publikovat v [SCOPE.sCulture('relevant_culture').GetNameNoFormatting]!" # todo: NEW TRANSLATION
 national_awakening.4.b: "Musíme také usilovat o tvorbu původních děl." # todo: NEW TRANSLATION
 national_awakening.5.t: "Národní romantismus" # todo: NEW TRANSLATION
 national_awakening.5.d: "Inspirováni vzrůstajícím přílivem [SCOPE.sCulture('relevant_culture').GetName] nacionalismu vytvořila [SCOPE.sState('arts_academy_state').GetCityHubName] [SCOPE.sBuilding('arts_academy_building').GetName] monumentální romantistický obraz znázorňující zakladatelský mýtus našeho národa." # todo: NEW TRANSLATION
 national_awakening.5.f: "Personifikace národa [SCOPE.sCulture('relevant_culture').GetNameNoFormatting] stála v popředí, oděna v rouších a nesoucí [ROOT.GetCountry.GetAdjectiveNoFormatting] vlajku. Z kotníku jí trčel rozbitý řetěz vedoucí do stínu hanebné minulosti. V pozadí se rozprostíralo nádherné panorama, které by bylo možné nalézt jen v [ROOT.GetCountry.GetNameNoFormatting], osvícené vycházejícím sluncem v národních barvách.\n\nNeslo poselství, kterému každý rozuměl, ale málokdo by ho dokázal napodobit. Z tmavé minulosti vychází zářivé nové jaro. Z útlaku svoboda." # todo: NEW TRANSLATION
 national_awakening.5.a: "Dílo překonávající pařížská mistrovská díla." # todo: NEW TRANSLATION
 national_awakening.5.b: "Ať se to stane novým symbolem našeho národa." # todo: NEW TRANSLATION
 national_awakening.6.t: "Folklór" # todo: NEW TRANSLATION
 national_awakening.6.d: "Hledání sdílené národní identity obrátilo pozornost [SCOPE.gsInterestGroup('intelligentsia_ig').GetName] k venkovu. Studium tradic [SCOPE.gsInterestGroup('rural_folk_ig').GetName] je považováno za pohled do prapůvodní [SCOPE.sCulture('relevant_culture').GetNameNoFormatting] kultury, nedotčené cizí nadvládou." # todo: NEW TRANSLATION
 national_awakening.6.f: ""Říkají, že Alexandr Veliký byl první [SCOPE.sCulture('relevant_culture').GetNameNoFormatting]. Když se jeho impérium rozpadlo, jeho generálové založili první [SCOPE.sCulture('relevant_culture').GetNameNoFormatting] království.\" \n\n"Je to tak?"\n\n"Říkají to, nebo je to pravda?"\n\n"To druhé."\n\n"Rozdíl není, že? Když to dost lidí řekne, uděláme z toho pravdu."" # todo: NEW TRANSLATION
 national_awakening.6.a: "Tak rostou semena národa." # todo: NEW TRANSLATION
 national_awakening.6.b: "Máme se co učit od venkova." # todo: NEW TRANSLATION
 national_awakening.7.t: "Jeden národ, jeden lid" # todo: NEW TRANSLATION
 national_awakening.7.d: "Snaha státu definovat národ společnou [SCOPE.sCulture('primary_culture').GetName] identitou vzbudila obavy mezi [SCOPE.sCulture('minority_culture').GetName] populací. Mnozí se obávají, že budou nuceni se asimilovat do dominantní kultury." # todo: NEW TRANSLATION
 national_awakening.7.f: ""Pokud se chce promocí, musí se naučit [SCOPE.sCulture('primary_culture').GetNameNoFormatting] jazyk a složit zkoušku v [SCOPE.sCulture('primary_culture').GetNameNoFormatting]. V tuto chvíli nemůžeme dělat výjimky.\" \n\nŽena odpověděla v [SCOPE.sCulture('minority_culture').GetNameNoFormatting]. Její syn s omluvným výrazem v obličeji přetlumočil její slova úředníkovi ve vlastním jazyce.\n\n"A co učení [SCOPE.sCulture('minority_culture').GetNameNoFormatting]? Je nás tu mnoho a to mluvíme doma. Bez hodin v [SCOPE.sCulture('minority_culture').GetNameNoFormatting] na to zapomene a ztratí spojení s rodinou."\n\n"Má rada pro vás, paní, je naučit se [SCOPE.sCulture('primary_culture').GetNameNoFormatting]. Jste přece [ROOT.GetCountry.GetAdjectiveNoFormatting] občanka, že ano?\"" # todo: NEW TRANSLATION
 national_awakening.7.a: "Oni se skutečně musí stát [SCOPE.sCulture('primary_culture').GetCustom('getPluralDemonym')]." # todo: NEW TRANSLATION
 national_awakening.7.b: "Nemají se čeho bát." # todo: NEW TRANSLATION
