 je_standestaat: "Ständestaat" # todo: NEW TRANSLATION
 je_standestaat_reason: "Vzestup masové politiky v [ROOT.GetCountry.GetName] podnítil vznik protihnutí mezi tradičními třídami. [SelectLocalization(SCOPE.sPoliticalMovement('corporatist_movement_scope').IsValid, SCOPE.sPoliticalMovement('corporatist_movement_scope').GetName, 'movement_corporatist')] usiluje o zrušení [SCOPE.GetRootScope.GetCountry.GetCustom('country_legislature_name')] a systému více stran ve prospěch [SCOPE.GetRootScope.GetCountry.GetCustom('social_monarchy_or_corporate_state')], neboli \"Ständestaat\".\n\nZatímco je tento [concept_journal_entry] aktivní, bude zvýšena rychlost, jakou se objevují postavy s ideologií [GetIdeology('ideology_corporatist_leader').GetName]." # todo: NEW TRANSLATION
