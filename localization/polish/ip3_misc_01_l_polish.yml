 galicia_formation.1.t: "První krok" # todo: NEW TRANSLATION
 galicia_formation.1.d: "Naším znovusjednocením [SCOPE.sState('west_galicia_state').GetName] a [SCOPE.sState('east_galicia_state').GetName] jsme se posunuli daleko od bývalého stavu pouhého svobodného města. Avšak tlačí se otázka – bude [ROOT.GetCountry.GetNameNoFlag] základem sjednocení [GetCulture('polish').GetName], nebo přijme svůj mnohonárodnostní charakter?" # todo: NEW TRANSLATION
 galicia_formation.1.f: "Kiril si pomyslel, že pokud by se člověk soustředil na ohňostroje v [SCOPE.sState('west_galicia_state').GetCityHubName], mohl by téměř zapomenout na problém na Východě. Jediný stát, který kdy nesl jméno \"Galicia\", byl staré habsburské království – útočiště pro polské velkostatkáře a německé byrokraty. Polští nacionalisté jistě nahradí ty druhé, ale lze jim věřit, že přinesou rovnost jeho lidu? Kiril při svém příjezdu důkladně obešel město a málo co ho ujistilo. Ve svém zápalu obnovit Commonwealth byli příliš ochotni zapomenout na jeho nedostatky." # todo: NEW TRANSLATION
 galicia_formation.1.a: "[ROOT.GetCountry.GetNameNoFlag] je [GetCulture('polish').GetName] a vždy jím bude." # todo: NEW TRANSLATION
 galicia_formation.1.b: "[GetCulture('polish').GetCustom('getPluralDemonym')] a [GetCulture('ukrainian').GetCustom('getPluralDemonym')] naleznou jednotu pod naší vládou." # todo: NEW TRANSLATION
 galicia_formation.1.c: "Můžeme být mnohem víc." # todo: NEW TRANSLATION
