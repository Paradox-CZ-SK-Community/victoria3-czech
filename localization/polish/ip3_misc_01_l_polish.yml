 austrian_fascism.1.t: "Noví konzervativci" # todo: NEW TRANSLATION
 austrian_fascism.1.d: "Inspirováni nespokojeností se [ROOT.GetCountry.GetAdjective] parlamentní demokracií se tradiční třídy začaly orientovat k [SCOPE.sPoliticalMovement('corporatist_movement_scope').GetName]. Jejich program vyvolává sociální učení [GetReligion('catholic').GetName] a pacifikaci dělnického hnutí v rámci [SCOPE.GetRootScope.GetCountry.GetCustom('social_monarchy_or_corporate_state')]." # todo: NEW TRANSLATION
 austrian_fascism.1.f: "\"Spojuje nás také druhá věc, sdílený praktický cíl: chtít to nejlepší, dovést lidskou společnost do příjemného stavu.\n\nTen, kdo stojí napravo a vidí v činech levicových socialistů nic než zkázu, stejně jako ten nalevo vidí v činech pravicových pouze temnou pohromu—všichni si mohou a musí dát přesvědčení, že touha po tomtéž ušlechtilém cíli je vede.\"\n\n— Othmar Spann, #italic The True State#!" # todo: NEW TRANSLATION
 austrian_fascism.1.a: "Tohle je budoucnost konzervatismu." # todo: NEW TRANSLATION
 austrian_fascism.1.b: "Nyní čelíme nejčernější reakci." # todo: NEW TRANSLATION
 corporate_state_tt: "[GetLawType('law_corporate_state').GetName]" # todo: NEW TRANSLATION
 social_monarchy_tt: "[GetLawType('law_social_monarchy').GetName]" # todo: NEW TRANSLATION
 austrian_fascism.2.t: "Probuzené Rakousko" # todo: NEW TRANSLATION
 austrian_fascism.2.d: "Snahy [SCOPE.sCharacter('ruler_scope').GetFullName] a [SCOPE.sParty('fascist_party_scope').GetName] úspěšně přeměnily [ROOT.GetCountry.GetName] v [SCOPE.GetRootScope.GetCountry.GetCustom('social_monarchy_or_corporate_state')]. Dělnické hnutí bylo umlčeno nebo kooptováno a konečně se ustálil pocit sociálního míru." # todo: NEW TRANSLATION
 austrian_fascism.2.f: "\"Nejvyšší touha dělnické třídy je právo pracovat pro Boha a Vlast. To je přesně to, čeho se komunisté nejvíc bojí.\"\n\nNáborář Fronty s uhlazenými vlasy přecházel sem a tam, zatímco mluvil. [SCOPE.sCharacter('name_a_scope').GetFirstNameNoFormatting] stál na pozoru, jeho spolužáci po jeho boku. Čtyřicet osm párů očí sledovalo každý jeho pohyb.\n\n\"Jejich zbraní je sabotáž a rozdělení, a tam, kde se objeví, to rozsévají. To je to, co budete potírat. Vstoupili jste do této síně jako studenti, nejlepší ve své třídě. Odejdete z ní jako Sturmtruppen.\"" # todo: NEW TRANSLATION
 austrian_fascism.2.a: "Österreich!" # todo: NEW TRANSLATION
 austrian_fascism.2.b: "Vůle Fronty se stane zákonem." # todo: NEW TRANSLATION
 austrian_fascism.3.t: "Pouhý sen" # todo: NEW TRANSLATION
 austrian_fascism.3.d: "[SelectLocalization(SCOPE.sPoliticalMovement('corporatist_movement_scope').IsValid, SCOPE.sPoliticalMovement('corporatist_movement_scope').GetName, 'movement_corporatist')] se nepodařilo uchopit kontrolu nad [ROOT.GetCountry.GetName]. Ačkoliv přízrak radikálního nacionalismu zůstane, vize $gov_corporate_state_austrofascist$ se rozplynula v historii." # todo: NEW TRANSLATION
 austrian_fascism.3.f: "[ROOT.GetCountry.GetCapital.GetCityHubName] se zdálo dýchat volněji. Tvrdooké mládežníky v uniformách na rohovích ulicích nahradily opět plakáty odborů. Z terasy kavárny pozoroval [SCOPE.sCharacter('name_a_scope').GetFirstNameNoFormatting] skupinu dělníků procházejících kolem. Uprostřed zahlédl tvář, kterou poznal.\n\n\"Pan [SCOPE.sCharacter('name_b_scope').GetLastNameNoFormatting]?\" hádal muž sedící naproti němu. \"Myslím, že jsem ho viděl na letáku.\"\n\n\"Kterém letáku?\"\n\n\"O nikom důležitém, myslím. Už si nepamatuji, kdy jsem je naposledy viděl kolem.\"" # todo: NEW TRANSLATION
 austrian_fascism.3.a: "[ROOT.GetCountry.GetNameNoFormatting] je zachráněn!" # todo: NEW TRANSLATION
 austrian_fascism.3.b: "Kam se odtud vydáme?" # todo: NEW TRANSLATION
 je_standestaat_eliminate_parliament: "Zrušit parlament" # todo: NEW TRANSLATION
 je_standestaat_eliminate_parliament_desc: "[SelectLocalization(SCOPE.sPoliticalMovement('corporatist_movement_scope').IsValid, SCOPE.sPoliticalMovement('corporatist_movement_scope').GetName, 'movement_corporatist')] získalo jak sympatického prezidenta, tak významný podíl míst v [SCOPE.GetRootScope.GetCountry.GetCustom('country_legislature_name')]. Nyní může orchestrálně zrušit [SCOPE.GetRootScope.GetCountry.GetCustom('country_legislature_name')] a ustanovit sebe jako jediného legálního politického aktéra v [ROOT.GetCountry.GetNameNoFormatting]." # todo: NEW TRANSLATION
