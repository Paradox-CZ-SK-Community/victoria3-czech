 has_repressed_corporatists_for_some_years_tt: "Podpora [concept_political_movement] pro [SCOPE.sPoliticalMovement('corporatist_movement_scope').GetName] byla pod #v 5%#! po #b 24#! po sobě jdoucích měsíců (aktuálně #v [ROOT.GetCountry.MakeScope.Var('corporatists_suppression_var').GetValue]#!):" # todo: NEW TRANSLATION
