 austria_trialism.1.t: "[SCOPE.sCountry('austria_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('austria_scope').GetRuler.GetFirstName] vydává trialistický manifest" # todo: NEW TRANSLATION
 austria_trialism.1.d: "V [SCOPE.sCountry('austria_scope').GetCapital.GetCityHubName] [SCOPE.sCountry('austria_scope').GetRuler.GetPrimaryRoleTitle] vydal manifest podporující zřízení [GetCulture('croat').GetName] království. Zřízení tohoto království by vyžadovalo kompromisy integrity korunních zemí [ROOT.GetCountry.GetAdjectiveNoFlag] a snížilo by naši relativní váhu v říši." # todo: NEW TRANSLATION
 austria_trialism.1.f: "Posel bouchnul na dveře předsedy sněmu, přestal teprve když se objevil sekretář. V jedné ruce držel svazek papírů a druhou se opíral o rám dveří, aby udržel rovnováhu. Mezi lapáním po dechu stačil pronést první věty.\n\n„Právě mám novinu. [SCOPE.sCountry('austria_scope').GetRuler.GetCustom('getEmpressEmperor')]-“\n\n„Máte na mysli [SCOPE.sCountry('austria_scope').GetRuler.GetCustom('getQueenKing')]?“\n\n„Och, ano. [SCOPE.sCountry('austria_scope').GetRuler.GetCustom('getQueenKing')] chce nás rozpárovat.“" # todo: NEW TRANSLATION
 austria_trialism.1.a: "Veto tomuto urážlivému návrhu vůči [ROOT.GetCountry.GetNameNoFlag]." # todo: NEW TRANSLATION
 austria_trialism.1.b: "Nechme se pomstít. Podepsat manifest." # todo: NEW TRANSLATION
 possible_dp_with_austria_scope_tt: "#r#b Může to vést k diplomatickému sporu proti [SCOPE.sCountry('austria_scope').GetName]#!#!" # todo: NEW TRANSLATION
 austria_trialism.2.t: "[SCOPE.sCountry('hungary_scope').GetName] vetuje trialistický manifest" # todo: NEW TRANSLATION
 austria_trialism.2.d: "Vl áda [SCOPE.sCountry('hungary_scope').GetName] vetovala manifest [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle], který sliboval rovnoprávné království pro [GetCulture('croat').GetName] lid. [SCOPE.sCountry('hungary_scope').GetNameNoFormatting] odmítnutí vyvolalo nespokojenost mezi jihoslovanským obyvatelstvem obou částí říše." # todo: NEW TRANSLATION
 austria_trialism.2.f: "Sál [SCOPE.GetRootScope.GetCountry.GetCustom('country_legislature_name')] se probral k tichému povzdechu. Neměli důvod být optimističtí – a přesto se to zdálo být tak blízko. Na okamžik si dali naději, jen aby byli tvrdě napravení.\n\nBylo tu řešení, samozřejmě, které si v tu chvíli nikdo netroufal vyslovit. Teprve večer, kdy myšlenky přejdou od rozčarování k pomstě, se taková slova mohla pronést. [SCOPE.sCountry('hungary_scope').GetNameNoFormatting] má veto, ale [ROOT.GetCountry.GetNameNoFormatting] má těžké dělostřelectvo. Odváží se znovu doufat?" # todo: NEW TRANSLATION
 austria_trialism.2.a: "Udělali jsme vše, co je rozumně možné." # todo: NEW TRANSLATION
 austria_trialism.2.b: "Zmobilizovat armádu a prosadit jeho podmínky." # todo: NEW TRANSLATION
 austria_trialism.3.t: "Triunové království" # todo: NEW TRANSLATION
 austria_trialism.3.d_peace: "S ratifikací manifestu [SCOPE.sCountry('hungary_scope').GetName] bylo z [SCOPE.sCountry('croatia_scope').GetName] utvořeno rovnoprávné království pro [GetCulture('croat').GetName] území. Dvojmonarchie se stala Trojmonarchií." # todo: NEW TRANSLATION
 austria_trialism.3.d_war: "S přinucením [SCOPE.sCountry('hungary_scope').GetName] vojenskou silou bylo z [SCOPE.sCountry('croatia_scope').GetName] utvořeno rovnoprávné království pro [GetCulture('croat').GetName] území. Dvojmonarchie se stala Trojmonarchií." # todo: NEW TRANSLATION
 austria_trialism.3.f: ""Když se noviny dozvěděly o manifestu," začal úředník, "byly v [SCOPE.sCountry('croatia_scope').GetCapital.GetCityHubName] dvě průvody. První oslavoval konec Dvojmonarchie, a druhý vítal Triunii. Myslím, že to bylo jasné poselství."\n\n"Řekl jste, že byl první průvod. Nebylo vám někdy do strachu, že to přeroste v něco horšího?"\n\n"Myslel jsem na to, přiznávám. Takové věci jsou depressivně běžné. Ale mohli jsme ukázat prstem na Maďary. Místo toho jsme se stali jejich hrdiny."" # todo: NEW TRANSLATION
 austria_trialism.3.a: "Omezit [SCOPE.sCountry('croatia_scope').GetNameNoFlag] na historická [GetCulture('croat').GetName] území." # todo: NEW TRANSLATION
 austria_trialism.3.b: "Dát mu do správy část [GetCulture('slovene').GetName] zemí." # todo: NEW TRANSLATION
 austria_trialism.3.c: "[SCOPE.sCountry('croatia_scope').GetNameNoFlag] bude královstvím pro všechny jihoslovanské národy." # todo: NEW TRANSLATION
 aus_hun_civil_war_warning_tt: "#r Pokud ani jedna strana nepoleví, vypukne otevřená válka mezi polovinami říše.#!" # todo: NEW TRANSLATION
