 eastern_crisis.1.t: "Vyvíjející se krize" # todo: NEW TRANSLATION
 eastern_crisis.1.d: "Budoucnost [SCOPE.sCountry('ottoman_scope').GetName] je na křižovatce. Stoupající počet [Concept('concept_secession','$concept_secessionist$')] [Concept('concept_political_movement','$concept_political_movements$')] ohrožuje stabilitu naší země." # todo: NEW TRANSLATION
 eastern_crisis.1.d2: "Budoucnost [SCOPE.sCountry('ottoman_scope').GetName] je na křižovatce. Stoupající počet [Concept('concept_secession','$concept_secessionist$')] [Concept('concept_political_movement','$concept_political_movements$')] ohrožuje stabilitu jejich národa." # todo: NEW TRANSLATION
 eastern_crisis.1.f: "Nejmladší vezír İsmail se třásl, když mluvil, s hlavou skloněnou: \"Nelze již popřít, že v naší kdysi velké říši vzkvétají nepokoje. Stoupenci $concept_secessionist$ jsou údajně k nalezení v každé kavárně v [SCOPE.sState('relevant_state_scope').GetCityHubName].\"\n\nOstatní vezíři přikývli, nevyvedeni z klidu. Nejstarší promluvil. \"Musíme pokračovat v našem programu, i kdyby [SCOPE.sCharacter('ruler_scope').GetPrimaryRoleTitle] nesdílel náš názor. Životy našich rodin jsou v sázce.\"" # todo: NEW TRANSLATION
 eastern_crisis.1.a: "Důkladně sledovat vývoj situace." # todo: NEW TRANSLATION
