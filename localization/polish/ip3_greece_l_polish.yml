 greece.3.t: "Londýnská smlouva" # todo: NEW TRANSLATION
 greece.3.d: "Díky pečlivým jednáním [SCOPE.sCountry('ionian_overlord').GetName] postoupil [SCOPE.sCountry('ionian_country').GetName] [ROOT.GetCountry.GetName]." # todo: NEW TRANSLATION
 greece.3.f: ""Abychom podpořili dobrou vůli mezi našimi národy a posílili ducha [ROOT.GetCountry.GetAdjectiveNoFormatting] lidu, [SCOPE.sCountry('ionian_overlord').GetRuler.GetPrimaryRoleTitle] velkoryse postoupil Jónské ostrovy. Náš přátelský protektorát, pod kterým ostrovy těžily z naší opravdové a spravedlivé pomoci, považujeme za ukončený a doufáme, že lid těchto ostrovů vzkvétá pod laskavou ochranou našich důvěryhodných přátel."" # todo: NEW TRANSLATION
 greece.3.a: "Velmi přijatelné řešení." # todo: NEW TRANSLATION
 greece.4.t: "[ROOT.GetCountry.GetNameNoFormatting] opět povstává" # todo: NEW TRANSLATION
 greece.4.d1: "Naše ambiciózní irredentistická agenda byla ohromným úspěchem. Nastává úsvit nové éry v [ROOT.GetCountry.GetNameNoFormatting]." # todo: NEW TRANSLATION
 greece.4.d2: "Naše irredentistická agenda byla úspěšná. Lidé [ROOT.GetCountry.GetNameNoFormatting] slaví." # todo: NEW TRANSLATION
 greece.4.f: " [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetNameNoFormatting] pronáší projev, který bude rezonovat v srdcích všech [ROOT.GetCountry.GetAdjectiveNoFormatting] lidí po generace:\n\n\"Národ, který svým pádem osvětlil mnoho jiných národů, dnes znovu vstává, a ne jako dříve, kdy byl rozdělen do mnoha malých států, ale jako jednotný stát se svou vládou, náboženstvím a politickou existencí navěky zaručenou ústavou.\"" # todo: NEW TRANSLATION
 greece.4.a: "[ROOT.GetCountry.GetNameNoFormatting] bude i nadále vzkvétat." # todo: NEW TRANSLATION
 greece.4.b: "[ROOT.GetCountry.GetNameNoFormatting] získal zasloužený respekt." # todo: NEW TRANSLATION
