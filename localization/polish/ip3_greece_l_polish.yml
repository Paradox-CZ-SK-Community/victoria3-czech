 je_kaiserforum_reason: "V srdci [SCOPE.sState('relevant_state').GetCityHubName] se nachází Ringstrasse—velkorysá třída obkružující centrum města. Panel [ROOT.GetCountry.GetAdjectiveNoFormatting] porotců přezkoumal nespočet návrhů, které promění tento kout [SCOPE.sState('relevant_state').GetCityHubName] v císařské fórum, nová sídla vlády a vzorová kulturní zařízení. Nyní, když jsou staré městské hradby zbourány, tato iniciativa uvádí [ROOT.GetCountry.GetNameNoFormatting] do nové éry městské kultury.\n\n$building_kaiserforum_3$ bude třeba budovat ve fázích a může být postaven v panelu státu pro [SCOPE.sState('relevant_state').GetName]." # todo: NEW TRANSLATION
