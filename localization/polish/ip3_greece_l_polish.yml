 transfer_ionian_islands_decision_desc: "Jónské ostrovy několikrát změnily majitele během napoleonských válek a po získání nezávislosti nebyly integrovány do řeckého státu. Pokud získáme souhlas jak Jónského lidu, tak vlády jejich ochránců, můžeme vyjednat pokojný přechod moci." # todo: NEW TRANSLATION
