 greece.1.t: "Řecký stát" # todo: NEW TRANSLATION
 greece.1.d: "Vzrůstající nacionalismus vyvolal mezi našimi občany irredentistické přání začlenit veškeré země lidu [SCOPE.sCulture('greek_culture_scope').GetName] pod jediný řecký stát." # todo: NEW TRANSLATION
 greece.1.f: ""Odhodili jsme staletí osmanské nadvlády a uvedli jsme řecký stát v existenci. Přesto to nestačí. Mnozí z našich krajanů stále žijí pod útlakem cizí moci a touží po zemi, kterou by mohli nazvat svou. Tento sen lze uskutečnit pouze anexí všech řeckých zemí, čehož dosáhneme s nebo bez souhlasu jejich okupantů."" # todo: NEW TRANSLATION
 greece.1.a: "Náš nárok na tuto zemi je nevyvratitelný." # todo: NEW TRANSLATION
 greece.1.b: "Expanze nyní není prioritou." # todo: NEW TRANSLATION
 embrace_megali_idea_tt: "#r #b Vybráním této možnosti se změní požadavky na dokončení $je_greek_nationalism$ [concept_journal_entry] na následující:#!#! #indent_newline:3 \n• [ROOT.GetCountry.GetName] bude muset vlastnit #b všechny#! [Concept('concept_state','$concept_states$')] v [GetGeographicRegion('geographic_region_megali_greece').GetName] (Momentálně #v [ROOT.GetCountry.MakeScope.Var('greek_homeland_states_owned_var').GetValue|V0]#! splňuje tuto podmínku)\n• [ROOT.GetCountry.GetNameNoFlag] je v míru\n• [ROOT.GetCountry.GetNameNoFlag] #b není#! subjekt jiné země\n• [concept_rank] [ROOT.GetCountry.GetNameNoFlag] je větší nebo roven [concept_minor_power]\n• [ROOT.GetCountry.GetAdjectiveNoFlag] [concept_gold_reserves] jsou větší než #v @money![GetPlayer.MakeScope.ScriptValue('greek_nationalism_gold_min')|2]#!\n• [concept_legitimacy] musí být #v [GetPlayer.MakeScope.ScriptValue('greek_nationalism_legitimacy_min')]#! nebo vyšší" # todo: NEW TRANSLATION
 not_embrace_megali_idea_tt: "#r #b Požadavky na dokončení $je_greek_nationalism$ [concept_journal_entry] zůstanou nezměněny:#!#! #indent_newline:3 \n• [ROOT.GetCountry.GetName] bude muset vlastnit alespoň #b #v [GetPlayer.MakeScope.ScriptValue('greek_homeland_states_owned_to_complete_min')]#!#! [Concept('concept_state','$concept_states$')] v [GetGeographicRegion('geographic_region_megali_greece').GetName] (Momentálně #v [ROOT.GetCountry.MakeScope.Var('greek_homeland_states_owned_var').GetValue|V0]#! splňuje tuto podmínku)\n• [ROOT.GetCountry.GetNameNoFlag] je v míru\n• [ROOT.GetCountry.GetNameNoFlag] #b není#! subjekt jiné země\n• [concept_rank] [ROOT.GetCountry.GetNameNoFlag] je větší nebo roven [concept_minor_power]\n• [ROOT.GetCountry.GetAdjectiveNoFlag] [concept_gold_reserves] jsou větší než #v @money![GetPlayer.MakeScope.ScriptValue('greek_nationalism_gold_min')|2]#!\n• [ROOT.GetCountry.GetNameNoFlag] nemá #b žádné#! [Concept('concept_insurrection', '$concept_insurrectionary$')] [Concept('concept_political_movement', '$concept_political_movements$')]" # todo: NEW TRANSLATION
 greece.2.t: "Titul Východního Říma" # todo: NEW TRANSLATION
 greece.2.d: "Expandování řeckého státu vedlo některé z nejvřelejších nacionalistů k navržení ještě ambicióznějšího projektu: obnovy Byzantské říše prostřednictvím dobytí [SCOPE.sState('thrace_scope').GetStateRegion.GetName] a [SCOPE.sState('aydin_scope').GetStateRegion.GetName]." # todo: NEW TRANSLATION
 greece.2.f: ""To, co by se včera zdálo absurdní utopií, je nyní v dosahu. Purpurový fénix znovu povstane!"" # todo: NEW TRANSLATION
 greece.2.a: "Byzanc bude obnovena." # todo: NEW TRANSLATION
 greece.2.b: "Tento plán je příliš ambiciózní." # todo: NEW TRANSLATION
 embrace_ambitious_agenda_tt: "#r #b Vybráním této možnosti se změní požadavky na dokončení $je_greek_nationalism$ [concept_journal_entry] na následující:#!#! #indent_newline:3 \n• [ROOT.GetCountry.GetName] bude muset vytvořit $BYZ$ v [concept_nation_formation]\n• [ROOT.GetCountry.GetName] musí mít aktivní [GetLawType('law_monarchy').GetName]\n• [ROOT.GetCountry.GetName] musí vlastnit #v všechny#! #tooltippable #tooltip:[GetPlayer.GetTooltipTag],byzantium_state_regions_tt $BYZ$ státní regiony#!#! (Momentálně #v [ROOT.GetCountry.MakeScope.Var('byzantium_states_owned_var').GetValue|V0]#! splňuje tuto podmínku)\n• [concept_legitimacy] musí být #v [GetPlayer.MakeScope.ScriptValue('greek_nationalism_legitimacy_min')]#! nebo vyšší\n• [ROOT.GetCountry.GetNameNoFlag] je v míru\n• [ROOT.GetCountry.GetNameNoFlag] #b není#! subjekt jiné země\n• [concept_rank] [ROOT.GetCountry.GetNameNoFlag] je větší nebo roven [concept_minor_power]\n• [ROOT.GetCountry.GetAdjectiveNoFlag] [concept_gold_reserves] jsou větší než #v @money![GetPlayer.MakeScope.ScriptValue('greek_nationalism_gold_min')|2]#!" # todo: NEW TRANSLATION
