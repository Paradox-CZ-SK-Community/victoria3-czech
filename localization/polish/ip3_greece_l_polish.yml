 greece.6.d: "[SCOPE.sCountry('greek_country').GetAdjectiveNoFormatting] zástupci přišli vyjednávat podmínky postoupení [SCOPE.sCountry('ionian_country').GetName] [SCOPE.sCountry('greek_country').GetName]." # todo: NEW TRANSLATION
 greece.6.f: "Zástupci [SCOPE.sCountry('greek_country').GetAdjectiveNoFormatting] předkládají svůj návrh na zasedání kabinetu [ROOT.GetCountry.GetAdjectiveNoFormatting]:\n\n\"Abychom podpořili dobrou vůli mezi našimi národy a posílili ducha [SCOPE.sCountry('greek_country').GetAdjectiveNoFormatting] lidu, náš [SCOPE.sCountry('greek_country').GetRuler.GetPrimaryRoleTitle] žádá, aby [SCOPE.sCountry('ionian_country').GetNameNoFormatting] byl propuštěn z přátelského protektorátu, pod kterým ostrovy těžily z vaší opravdové a spravedlivé pomoci.\"" # todo: NEW TRANSLATION
