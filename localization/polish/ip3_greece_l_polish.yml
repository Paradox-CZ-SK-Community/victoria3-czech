 greece.5.f: "Atmosféra v místnosti je napjatá. Politikové a rádci se přou o to, zda je únosné pokračovat v ambiciózní agendě [ROOT.GetCountry.GetNameNoFormatting]. Každý požaduje, aby byla zodpovědná strana pohnána k odpovědnosti za špatné hospodaření s [ROOT.GetCountry.GetAdjectiveNoFormatting] zdroji použitými v tomto irredentistickém pokusu, který se nezdařil." # todo: NEW TRANSLATION
