 je_greek_nationalism_reason: "#italic "Řek není pouze ten, kdo obývá království, ale také ten, kdo žije v Janině, nebo Soluni, nebo Serres, nebo Edirne, nebo Konstantinopoli, nebo Trebizondě, nebo na Krétě, nebo na Samu, nebo v jakékoliv jiné zemi řecké historie či rasy..."\n—Ioannis Kolettis#!\n\nPřes vznik nezávislého řeckého státu většina Řeků stále žije pod cizí nadvládou. Musíme vyvinout soustředěné úsilí, diplomatickými i vojenskými prostředky, abychom začlenili celé [GetGeographicRegion('geographic_region_megali_greece').GetName] do naší správy.[SCOPE.GetRootScope.GetCountry.GetCustom('byzantium_reason_text')]" # todo: NEW TRANSLATION
 greek_state_possible_tt: "Vlastnit alespoň #v [GetPlayer.MakeScope.ScriptValue('greek_homeland_states_owned_to_activate_min')]#! [Concept('concept_state','$concept_states$')] v [GetGeographicRegion('geographic_region_megali_greece').GetName] (Momentálně #v [ROOT.GetCountry.MakeScope.Var('greek_homeland_states_owned_var').GetValue|V0]#! splňuje tuto podmínku)" # todo: NEW TRANSLATION
