 kaiserforum.4.t: "Schönbrunn žlutá" # todo: NEW TRANSLATION
 kaiserforum.4.d: "V této závěrečné fázi rozvoje zbývá poslední otázka: Bude se v této expanzi metropole [SCOPE.sState('relevant_state').GetCityHubName] používat charakteristická císařská žlutá barva [ROOT.GetCountry.GetNameNoFormatting]?" # todo: NEW TRANSLATION
 kaiserforum.4.f: "Zlatavě okrové měkké tóny Schönbrunn žluté malují majestátní vizi.\n\n\"Toto trvalé rozpoznatelné zbarvení jistě zanechá silný dojem,\" vykřikl jeden malíř při posuzování barvy.\n\nJiný umělec skepticky pohlíží a oponuje: \"Ale chceme lpět na takových ozvěnách minulosti?\"" # todo: NEW TRANSLATION
 kaiserforum.4.a: "To může zůstat za námi v městské minulosti." # todo: NEW TRANSLATION
 kaiserforum.4.b: "Musíme fórum natřít zlatavě okrovou!" # todo: NEW TRANSLATION
 kaiserforum_second_stage_tt: "Postaven druhý stupeň $building_kaiserforum_2$" # todo: NEW TRANSLATION
 kaiserforum.5.t: "Budovy nádhery" # todo: NEW TRANSLATION
 kaiserforum.5.d: "Po mnoha letech vývoje je vize fóra plně realizována. Nádhera transformujícího designu je ohromující. Stavba v centru města [SCOPE.sState('relevant_state').GetCityHubName] je nyní dokončena." # todo: NEW TRANSLATION
 kaiserforum.5.f: ""Umění nemůže být moderní. Umění je primárně věčné.\" \n\n—Egon Schiele" # todo: NEW TRANSLATION
 kaiserforum.5.a: "Přínosy našeho počinu budou dlouhotrvající." # todo: NEW TRANSLATION
 kaiserforum.5.b: "Náš architektonický výkon bude dobře hodnocen." # todo: NEW TRANSLATION
 kaiserforum_loc_efforts: "Ringstrasse znovuobjevena" # todo: NEW TRANSLATION
