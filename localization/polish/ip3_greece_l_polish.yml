 yugoslavia.1.f: " [SCOPE.sCharacter('ruler_scope').GetPrimaryRoleTitle] stojí před lidmi [SCOPE.sCountry('yugoslavia_seeker_scope').GetNameNoFormatting] a pronáší vášnivý projev.\n\n\"Je nevyhnutelné, že usilujeme o vznik a rozvoj $YUG$, které sjednotí všechny jihoslovanské národy. [SCOPE.sCountry('yugoslavia_seeker_scope').GetNameNoFormatting] určitě může vést tento úsilí.\"" # todo: NEW TRANSLATION
