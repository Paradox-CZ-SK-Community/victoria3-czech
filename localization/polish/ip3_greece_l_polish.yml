 je_yugoslavia: "Založení $YUG$" # todo: NEW TRANSLATION
 je_yugoslavia_reason: "Vyhlídky [ROOT.GetCountry.GetNameNoFormatting] na založení jednotného jugoslávského státu jsou slibné. Lidé [SCOPE.sCulture('croatian_scope').GetName], [SCOPE.sCulture('serbian_scope').GetName], [SCOPE.sCulture('slovene_scope').GetName] a [SCOPE.sCulture('bosniak_scope').GetName] vyjádřili podporu tomuto novému [Concept('concept_unification', '$concept_major_unification$')] cíli.\n\nÚspěšné [concept_nation_formation] $YUG$ by mělo obrovský přínos, strategicky posílilo naši pozici na mezinárodní scéně a učinilo z naší země maják pro všechny jihozápadní slovanské národy žijící pod cizí nadvládou." # todo: NEW TRANSLATION
