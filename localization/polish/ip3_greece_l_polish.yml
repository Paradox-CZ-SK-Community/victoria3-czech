 je_kaiserforum_kaisergelb_button_desc: "S dokončenými stavbami můžeme přezkoumat závěrečné plány pro centrum města a aplikovat příjemný nátěr Schönbrunner žluté na oficiální budovy." # todo: NEW TRANSLATION
 kaiserforum.1.t: "Rozšíření centra města" # todo: NEW TRANSLATION
 kaiserforum.1.d: "Předložen byl návrh na rozšíření centra města. Projekt by vyžadoval několik fází výstavby, ale proměnil by [SCOPE.sState('relevant_state').GetCityHubName]." # todo: NEW TRANSLATION
 kaiserforum.1.f: ""Je mou vůlí, aby byla expanze vnitřního města ve Vídni provedena co nejdříve, s ohledem na vhodné propojení s předměstími. Při tom by se mělo uvažovat o regulaci a zvelebení mého sídla a císařského hlavního města. K tomu schvaluji odstranění obklopujících hradeb vnitřního města i suchých příkopů kolem nich.\" \n\n— Franz Joseph I" # todo: NEW TRANSLATION
 kaiserforum.1.a: "Začněte práce okamžitě!" # todo: NEW TRANSLATION
 kaiserforum.1.b: "Takové podnikání je nevhodné." # todo: NEW TRANSLATION
