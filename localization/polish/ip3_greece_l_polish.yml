 je_eastern_crisis_tracker: "Velká východní krize" # todo: NEW TRANSLATION
 je_eastern_crisis_tracker_reason: "V [GetStrategicRegion('region_balkans').GetName] se rýsuje krize a [SCOPE.sCountry('ottoman_scope').GetNameNoFormatting] se snaží udržet kontrolu nad svým územím, protože [Concept('concept_secession','$concept_secessionists$')] ohrožují jejich vládu. Jak se situace zhoršuje, snaží se stabilizovat narůstající nepokoje dříve, než se rozšíří po regionu. Zatímco $je_great_eastern_crisis$ probíhá, všechny kulturní a náboženské [Concept('concept_political_movement','$concept_political_movements$')] v [SCOPE.sCountry('ottoman_scope').GetNameNoFormatting] budou přitahovat ještě více #tooltippable #tooltip:[GetPlayer.GetTooltipTag],eastern_crisis_movement_attraction_tt podpory#!#!." # todo: NEW TRANSLATION
