 austria_events.33.d: "[SCOPE.sCountry('austria_scope').GetName] bude hostit Velkou výstavu v [SCOPE.sState('relevant_state_scope').GetCityHubName]. Poradcové doporučují účast [SCOPE.sCountry('japan_scope').GetName] na tomto velkém kulturním a hospodářském výměnném setkání za účelem navázání diplomatických vztahů mezi našimi zeměmi." # todo: NEW TRANSLATION
 austria_events.33.f: "Mluvčí výboru pro kulturní záležitosti s velkým nadšením hovoří o výhodách účasti [SCOPE.sCountry('japan_scope').GetNameNoFormatting] na Velké výstavě.\n\n\"Tyto Velké výstavy byly proslavené přínosy pro prestiž a růst jiných zemí. Toto by mohla být první z mnoha výstav, jichž se naše vláda oficiálně účastní. Určitě to prospěje celému [SCOPE.sCountry('japan_scope').GetNameNoFormatting]. Zamyslete se nad pokrokem naší země.\"" # todo: NEW TRANSLATION
