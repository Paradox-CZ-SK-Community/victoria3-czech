 je_great_eastern_crisis: "Velká východní krize" # todo: NEW TRANSLATION
 je_great_eastern_crisis_reason: "V [GetStrategicRegion('region_balkans').GetName] se rýsuje krize, přičemž [Concept('concept_secession','$concept_secessionists$')] ohrožují vládu [SCOPE.sCountry('ottoman_scope').GetName] nad regionem. Jak se situace zhoršuje, [SCOPE.sCountry('ottoman_scope').GetAdjectiveNoFormatting] usilují stabilizovat nepokoje dříve, než pohlcují celý region. Mezitím oportunističtí poddaní a cizí mocnosti sledují nyní zranitelné balkánské území.\n\n#b Vlny rozporu:#!\nZatímco $je_great_eastern_crisis$ probíhá, všechny kulturní a náboženské [Concept('concept_political_movement','$concept_political_movements$')] v [SCOPE.sCountry('ottoman_scope').GetNameNoFormatting] budou přitahovat ještě více #tooltippable #tooltip:[GetPlayer.GetTooltipTag],eastern_crisis_movement_attraction_tt podpory#!#!." # todo: NEW TRANSLATION
