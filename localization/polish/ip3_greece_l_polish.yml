 austria_events.34.d: "Účast [SCOPE.sCountry('japan_scope').GetName] na naší Velké výstavě jistě přispěje k úspěchu naší akce. Stavba [SCOPE.sCountry('japan_scope').GetAdjective] Pavilonu je nyní v plném proudu." # todo: NEW TRANSLATION
 austria_events.34.f: "Kupole hlavního pavilonu Velké výstavy se leskne složitými, ručně zdobenými dekoracemi. Na místě se buduje svatyně a [SCOPE.sCountry('japan_scope').GetAdjectiveNoFormatting] zahrada. Dřevěná torii brána, svatyně a zakřivený most jsou také součástí pavilonu.\n\nRozdávají se vzorky něčeho nazývaného #italic sójová omáčka#! spolu s poutavým [SCOPE.sCountry('japan_scope').GetAdjectiveNoFormatting] uměním a kvalitními produkty přivezenými zástupci [SCOPE.sCountry('japan_scope').GetNameNoFormatting] pro zařazení do výstavy." # todo: NEW TRANSLATION
