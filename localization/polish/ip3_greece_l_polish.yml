 positive_crisis_influence: "Diplomatická příležitost" # todo: NEW TRANSLATION
 eastern_crisis_subjects_modifier_tt: "Každý [SCOPE.sCountry('ottoman_scope').GetName] [concept_subject] obdrží #tooltippable;tooltip:[GetPlayer.GetTooltipTag],eastern_crisis_balkan_nations_tt $eastern_crisis_balkan_nations$#! \n[GetStaticModifier('eastern_crisis_balkan_nations').GetDesc]" # todo: NEW TRANSLATION
 eastern_crisis_balkan_nations_tt: "[GetStaticModifier('eastern_crisis_balkan_nations').GetName|v]\n[GetStaticModifier('eastern_crisis_balkan_nations').GetDesc]" # todo: NEW TRANSLATION
 eastern_crisis_subjects_modifier__ten_years_tt: "Každý [SCOPE.sCountry('ottoman_scope').GetName] [concept_subject] obdrží #tooltippable;tooltip:[GetPlayer.GetTooltipTag],eastern_crisis_balkan_nations_tt $eastern_crisis_balkan_nations$#! ([Concept('concept_decay','$concept_decaying$')]) po dobu #v 10 let#! \n[GetStaticModifier('eastern_crisis_balkan_nations').GetDesc]" # todo: NEW TRANSLATION
 eastern_crisis.2.t: "Krize pod kontrolou" # todo: NEW TRANSLATION
 eastern_crisis.2.d: "Díky silné [concept_ottoman_integrity] [SCOPE.sCountry('ottoman_scope').GetName] zvládl narůstající krizi v [GetStrategicRegion('region_balkans').GetName]." # todo: NEW TRANSLATION
 eastern_crisis.2.f: "Vezíři se shromáždili v kavárně. Nejmladší poznamenal: \"To je přesně ten druh místa, kde bychom nalezli separatisty. Je moudré slavit v lví doupě?\"\n\n\"İsmaili, příliš se obáváš,\" promluvil nejstarší. \"Lvi tam stále jsou, to jistě, ale krize pominula. Nyní, vidíš, víme, kde nastražit pasti.\"\n\n\"Nicméně,\" zamumlal İsmail. \"Možná existovaly okolnosti, v nichž bylo loajální povstat...\"" # todo: NEW TRANSLATION
 eastern_crisis.2.a: "S vládou [SCOPE.sCountry('ottoman_scope').GetAdjectiveNoFormatting] se nemá piplat." # todo: NEW TRANSLATION
 eastern_crisis_controlled: "Kontrolovaná východní krize" # todo: NEW TRANSLATION
 eastern_crisis.3.t: "Nezvládnutá krize" # todo: NEW TRANSLATION
 eastern_crisis.3.d: "Kdysi velký [SCOPE.sCountry('ottoman_scope').GetName] nebyl schopen zvládnout narůstající nepokoje v [GetStrategicRegion('region_balkans').GetName]. Nepokoje se mohou dál zvětšovat." # todo: NEW TRANSLATION
 eastern_crisis.3.f: "İsmail se stále třásl, když vedl ostatní vezíry skrz kouř z vodních dýmek do zadní místnosti kavárny. \n\n\"Čím jsi tak vyděšen, mladíku?\" nejstarší se zasmál. \"Vím, že naše říše se zdá v těžkých časech, ale přetrvala po staletí a vydrží…\" Vezír se odmlčel, když se z kouřových koutů vynořily široké postavy. \n\nİsmail zavřel dveře na západku. \"Jsou tací, kteří nesouhlasí, pašo, a naléhali, abychom se s tebou setkali.\"" # todo: NEW TRANSLATION
 eastern_crisis.3.a: "Toto selhání ohrožuje budoucnost vlády [SCOPE.sCountry('ottoman_scope').GetAdjectiveNoFormatting]." # todo: NEW TRANSLATION
 eastern_crisis_not_controlled: "Nezvládnutá východní krize" # todo: NEW TRANSLATION
