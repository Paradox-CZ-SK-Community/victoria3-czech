 kaiserforum.2.t: "Kulturní vliv" # todo: NEW TRANSLATION
 kaiserforum.2.d: "První fáze výstavby je dokončena a nyní stojí muzeum umění a přírodních dějin nedaleko Ringstrasse. Pokrok kultury a vzdělanosti v [SCOPE.sState('relevant_state').GetName] bude nepopiratelný." # todo: NEW TRANSLATION
 kaiserforum.2.f: ""Co se týče města Vídně, nachází se v přechodovém stavu v důsledku odstranění jiných opevnění a vzniku bulvárů na jejich místě, nehorších než ty, které v Paříži zřídil baron Haussmann během existence Napoleonské dynastie. Pravdou je, že Vídeň lze přirovnat k druhé Paříži v miniatuře, s Dunajem namísto Seiny. A pokud Rakouské císařství zůstane nedotčeno, což je velmi pravděpodobné, může se za dvacet let pyšnit jedním z nejlépe plánovaných a nejlépe vybudovaných měst v Evropě.\" — By an Australian Colonist" # todo: NEW TRANSLATION
 kaiserforum.2.a: "To bude součástí odkazu [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]." # todo: NEW TRANSLATION
 modifier_kunsthistorisches: "Kunsthistorisches Museum Wien" # todo: NEW TRANSLATION
 modifier_naturhistorisches: "Naturhistorisches Museum Wien" # todo: NEW TRANSLATION
 kaiserforum.3.t: "Měnící se panorama" # todo: NEW TRANSLATION
 kaiserforum.3.d: "Stavba podél Ringstrasse výrazně zlepšila dopravu zboží a osob v [SCOPE.sState('relevant_state').GetCityHubName]. Význam projektu není nedůležitý. Mnozí netrpělivě očekávají další fázi rozvoje." # todo: NEW TRANSLATION
 kaiserforum.3.f: "Nyní, když je centrum města propojeno s předměstími na západě, proudí doprava stálým tempem srdcem [SCOPE.sState('relevant_state').GetCityHubName]. Nový povrch mírně utlumil rušný hluk z intenzivního provozu.\n\nV obnovených zdech komplexu vyjadřuje [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] spokojenost architektovi: \"Vývoj $building_kaiserforum_2$ jde velmi dobře. Řekni mi, co je ještě třeba doplnit?\"" # todo: NEW TRANSLATION
 kaiserforum.3.a: "Pokrok na $building_kaiserforum_2$ je poctou píli [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] a [SCOPE.gsInterestGroup('relevant_ig').GetName]." # todo: NEW TRANSLATION
 je_kaiserforum_kaisergelb_button_tt: "Zkontrolovat návrh #b $je_kaiserforum_kaisergelb_button$#! pro další fázi vývoje v #b $je_kaiserforum$#! [concept_journal_entry]" # todo: NEW TRANSLATION
