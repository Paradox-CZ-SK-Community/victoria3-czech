 reform_or_revolution.1.d: "Rostoucí politické zastoupení [SCOPE.gsInterestGroup('trade_unions_ig').GetName] dalo vzniknout vzkvétajícímu mezinárodnímu [SelectLocalization(SCOPE.sPoliticalMovement('socialist_movement_scope').IsValid, SCOPE.sPoliticalMovement('socialist_movement_scope').GetName, 'movement_socialist')]. V průmyslově vyspělém světě vznikly početné dělnické organizace, které prosazují zájmy pracujících." # todo: NEW TRANSLATION
 reform_or_revolution.1.f: "Vlajka lidu je nejhlubší rudá,\nčasto zahalovala naše mučedníky,\na než jejich údy ztuhly chladem,\njejich srdcí krev zbarvila každý záhyb.\nPak pozvedněme vysoko šarlatový prapor.\nV jeho stínu budeme žít i umírat,\nať zbabělci couvají a zrádci se šklebí,\nmy rudou vlajku zde dál poneseme.„\n\n—Jim Connell, #italic Rudý prapor#!" # todo: NEW TRANSLATION
 reform_or_revolution.1.a: "Ať žije sociální revoluce!" # todo: NEW TRANSLATION
 reform_or_revolution.1.b: "Svoboda, rovnost a práva pracujících!" # todo: NEW TRANSLATION
 reform_or_revolution.1.c: "S nepřáteli pořádku nemáme o čem mluvit." # todo: NEW TRANSLATION
 reform_or_revolution.2.t: "Cíl je vším" # todo: NEW TRANSLATION
 reform_or_revolution.2.d: "Revoluční činnost, která se šíří světem, vyhrotila napětí uvnitř mezinárodního [SelectLocalization(SCOPE.sPoliticalMovement('socialist_movement_scope').IsValid, SCOPE.sPoliticalMovement('socialist_movement_scope').GetName, 'movement_socialist')]. Když se jejich dosavadní strany přihlásily k revoluci, umírnění a reformisté uprchli do organizací usilujících o obranu národní jednoty." # todo: NEW TRANSLATION
 reform_or_revolution.2.f: "Odsouzení muži pochodovali přes pódium a každý z nich přednesl svou obhajobu proti většině. Z hlediště se jako dělostřelecká palba snesly výkřiky „Zrádce!“ a „Válečný štváči!“. Ohlušující rozhořčení publika překrylo jakékoli výmluvy, které si s sebou přinesli.\n\n„Myslíte si, že podepisujete můj rozsudek smrti, ale mýlíte se!“ vykřikl poslední z odsouzených. Byl z nich nejvýše postavený a měl hlas, kterým by překřičel tucet mužů. Teď se jeho hlas chvílemi ztrácel, když se snažil probojovat davem. „Dnes mě nenávidíte, protože mě stále milujete! Dal jsem vám dvanáct let svého života! Ale ještě jste mě neviděli naposledy. Socialismus zapouští kořeny v srdci. Nemyslete si, že mi odebráním členské legitimace vezmete mou víru. Jsem socialista a vždy jím budu!“" # todo: NEW TRANSLATION
 reform_or_revolution.2.a: "Duch vzpoury se zvedá všude. Ať žije Internacionála!" # todo: NEW TRANSLATION
 reform_or_revolution.2.b: "Násilí šílenců ohrožuje vše, co jsme vybudovali." # todo: NEW TRANSLATION
 reform_or_revolution.2.c: "Další rozkol mezi socialisty?" # todo: NEW TRANSLATION
 reform_or_revolution.3.t: "Krize sociální demokracie" # todo: NEW TRANSLATION
 reform_or_revolution.3.d: "Napětí mezi reformisty a revolucionáři v mezinárodním [SelectLocalization(SCOPE.sPoliticalMovement('socialist_movement_scope').IsValid, SCOPE.sPoliticalMovement('socialist_movement_scope').GetName, 'movement_socialist')] dospělo k vrcholu. Rozhořčeni stále těsnějším sepětím svých stran s národními vládami se od tradičních socialistických stran odštěpila vlna protiparlamentních a revolučních frakcí." # todo: NEW TRANSLATION
 reform_or_revolution.3.d_1: "Napětí mezi reformisty a revolucionáři v mezinárodním [SelectLocalization(SCOPE.sPoliticalMovement('socialist_movement_scope').IsValid, SCOPE.sPoliticalMovement('socialist_movement_scope').GetName, 'movement_socialist')] dospělo k vrcholu. Rozhořčeni tím, že jejich strany zůstaly za války loajální vůči národním vládám, vytvořili revoluční socialisté konkurenční organizace, které měly vystupovat proti válce." # todo: NEW TRANSLATION
 reform_or_revolution.3.f: "„Revoluční epocha vytvoří z nevyčerpatelných zdrojů proletářského socialismu nové formy organizace, nové formy odpovídající velikosti nových úkolů. K této práci se pustíme okamžitě, uprostřed šíleného rachotu kulometů, hroutících se katedrál a vlasteneckého vytí kapitalistických šakalů. Uprostřed této pekelné hudby smrti si zachováme jasnou mysl a nezatemněný zrak. Považujeme se za jedinou tvůrčí sílu budoucnosti. Už je nás mnoho, víc, než by se mohlo zdát. Zítra nás bude víc než dnes. A pozítří povstanou pod naším praporem miliony, miliony lidí, kteří i nyní, šedesát sedm let po Komunistickém manifestu, nemají co ztratit kromě svých okovů.“\n\n—Leon Trockij, #italic Válka a internacionála#!" # todo: NEW TRANSLATION
 reform_or_revolution.3.a: "Výdobytky, kterých jsme dosáhli, jsou příliš cenné, než abychom o ně přišli." # todo: NEW TRANSLATION
 reform_or_revolution.3.b: "Dělník nemá vlast! Pryč s národním příměřím!" # todo: NEW TRANSLATION
 reform_or_revolution.3.c: "Další rozkol mezi socialisty?" # todo: NEW TRANSLATION
