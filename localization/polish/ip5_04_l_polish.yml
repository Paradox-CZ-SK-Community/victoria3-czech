 communism_debug.1000.d: "„Jisté je, že pokud je toto $marxism$, pak já sám nejsem $marxist$.“\n\n—$marx_full$" # todo: NEW TRANSLATION
 communism_debug.1000.f: "„Jménem [SCOPE.sStateRegion('first_proletarian_revolution_state_region').GetCityHubName] v [GetVariableFromGlobalVariableMap( 'first_proletarian_revolution', SCOPE.sStateRegion('first_proletarian_revolution_state_region').MakeScope ).GetValue] zdravíme socialistické dělníky světa.“" # todo: NEW TRANSLATION
