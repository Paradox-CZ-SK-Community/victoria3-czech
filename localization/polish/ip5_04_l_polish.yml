 communism_debug.1000.b: "Moralisto! Idealisto! Pozitivisto! Saint-Simonisto! Proudhonizovaný stirnerovče!" # todo: NEW TRANSLATION
 russia_misc_events.1.t: "Konverze v Pobaltí" # todo: NEW TRANSLATION
 russia_misc_events.1.d: "Pohnuti touhou vzdorovat svým luteránským statkářům a získat přízeň říše začali [GetCulture('estonian').GetName] a [GetCulture('latvian').GetName] [GetPopType('peasants').GetName] v [SCOPE.sCountry('baltic_governorates_scope').GetName] hromadně konvertovat k víře [GetReligion('orthodox').GetName]. Církevní instituce v pobaltském regionu jen stěží zvládají příliv konvertitů." # todo: NEW TRANSLATION
 russia_misc_events.1.f: "„Kde jste tyto tvrzení slyšel?“\n\nJānis nikdy předtím neseděl na tak nepohodlné židli. Měla snad víc rohů, než odpovídalo jejímu tvaru, a každý z nich se zabodával do nejbližšího zranitelného místa. Snažil se vzpomenout. V krčmě? Nějaké řeči při sbírání dříví? Spíš to první, pomyslel si, ale nechtěl nic říkat, dokud si nemohl být jistý, že je to pravda. Kdyby četník pojal podezření, že lže, mohl by ho zbičovat — a vypadal jako Němec, takže „mohl“ znamenalo spíš „určitě by“. \n\n„Ptám se,“ zopakoval četník. „Kde jste ty tvrzení slyšel?“\n\n„Bylo to…“ zamumlal Jānis, „…něco, co mi někdo řekl, když jsem… když jsme pili. Že car bude rozdávat půdu a snižovat daně… lidem, kteří vyznávají jeho víru. Nechtěl jsem udělat nic špatného.“" # todo: NEW TRANSLATION
 russia_misc_events.1.a: "Je naší povinností šířit pravou víru." # todo: NEW TRANSLATION
 russia_misc_events.1.b: "Nesmíme si znepřátelit pobaltskou šlechtu." # todo: NEW TRANSLATION
