 je_five_year_plan_heavy_industry_button_desc: "Těžký průmysl vyrábí výrobní prostředky. Soustruhy vyrobené v rámci tohoto plánu postaví továrny pro plán následující, a ty pak vybudují arzenály pro další." # todo: NEW TRANSLATION
 je_five_year_plan_light_industry_button_name: "Rozvíjet lehký průmysl" # todo: NEW TRANSLATION
 je_five_year_plan_light_industry_button_desc: "Lehký průmysl vyrábí spotřební zboží. Stejně jako reprodukce kapitálu vyžaduje práci, reprodukce pracovní síly vyžaduje výrobky lehkého průmyslu — chléb, oděvy a domácí potřeby." # todo: NEW TRANSLATION
 je_five_year_plan_transportation_button_name: "Rozvíjet dopravu" # todo: NEW TRANSLATION
 je_five_year_plan_transportation_button_desc: "Rychlý oběh zboží je pro rozvoj ekonomiky nezbytný. S každým kilometrem položené trati osvobodíme tucet dělníků od tyranie silničního povozu." # todo: NEW TRANSLATION
 je_five_year_plan_agriculture_button_name: "Rozvíjet zemědělství" # todo: NEW TRANSLATION
 je_five_year_plan_agriculture_button_desc: "Přežívání předkapitalistických forem na venkově je známkou zaostalosti [ROOT.GetCountry.GetAdjectiveNoFlag] ekonomiky. Zemědělství musíme zorganizovat tak, aby naplňovalo požadavky plánu, a zbytky rolnictva proměnit v proletariát." # todo: NEW TRANSLATION
 je_five_year_plan_electrification_button_name: "Prosazovat elektrifikaci" # todo: NEW TRANSLATION
 je_five_year_plan_electrification_button_desc: "Komunismus je moc [ROOT.GetCountry.GetCapital.GetCustom('getCouncilSoviet')|l] plus elektrifikace celé země. Má-li stát dosáhnout hospodářského úspěchu, jeho průmysl musí být nejen dostatečně rozsáhlý, ale také postavený na základech nejmodernější technologie." # todo: NEW TRANSLATION
