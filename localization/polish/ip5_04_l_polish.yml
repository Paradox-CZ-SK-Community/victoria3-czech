 modifier_fyp_censorship_campaign: "Cenzurní kampaň" # todo: NEW TRANSLATION
 modifier_fyp_forced_labor: "Nucená práce" # todo: NEW TRANSLATION
 communism.12.t: "Sabotáž a rozvrat" # todo: NEW TRANSLATION
 communism.12.d: "Kontrolní komisariát odhalil rozsáhlou kampaň státních plánovačů, kteří falšovali údaje o plnění #v $je_five_year_plan$#!. [SCOPE.gsInterestGroup('proletariat_ig').GetName] požadují, aby viníci stanuli před revoluční spravedlností jako rozvraceči." # todo: NEW TRANSLATION
 communism.12.f: "[SCOPE.sCharacter('name_a_scope').GetFirstNameNoFormatting] seděl u [SCOPE.sCharacter('name_a_scope').GetHerHis] kuchyňského stolu a nepřítomně zíral na zeď nad sporákem. Před ním ležel otevřený výtisk [GetPlayer.GetCustom('newspaper_type')], otevřený na druhé straně, s tučným písmem křičícím obviněními z podvodu a spiknutí. Jeho horní levý roh zatěžovala zpola prázdná sklenice vodky.\n\nNa podlaze vedle něj ležel revolver vydaný stranou. Kapka krve dopadla na jeho válec a stekla po jemně opracovaném kovu. Kaluž pod ním se rozrostla natolik, že potřísnila bílý okraj koberce.\n\nNěkdo zaklepal na dveře." # todo: NEW TRANSLATION
 communism.12.a: "Obvinění jsou následující: spiknutí, rozvracení, průmyslová sabotáž..." # todo: NEW TRANSLATION
 communism.12.b: "Čistku si nemůžeme dovolit. Založte ty dokumenty a pořádně hluboko." # todo: NEW TRANSLATION
 form_white_movement_tt: "Antisocialistická [Concept('concept_political_movement','$concept_political_movements|q$')] s ideologií #tooltippable;tooltip:[GetPlayer.GetTooltipTag],socialist_movements_list_tt Socialist#! se přidají k hnutí #v $movement_anti_communist_name$#!" # todo: NEW TRANSLATION
 je_extraordinary_commission: "Mimořádná opatření" # todo: NEW TRANSLATION
 je_extraordinary_commission_reason: "„#italic Proletariát potřebuje státní moc, centralizovanou organizaci síly, organizaci násilí, aby rozdrtil odpor vykořisťovatelů i vedl obrovské masy obyvatelstva k organizaci socialistické ekonomiky.#!“\n\n—Vladimir Lenin, #italic Stát a revoluce#!\n\nUstavení [ROOT.GetCountry.GetCapital.GetCustom('getCouncilSoviet')|l] moci v [ROOT.GetCountry.GetName] neznamenalo konec buržoazie jako třídy. Nepřátelé revoluce spřádají uvnitř i vně země plány na zničení [ROOT.GetCountry.GetCapital.GetCustom('getCouncilSoviet')|l] moci a návrat [SCOPE.gsInterestGroup('proletariat_ig').GetName] do poníženého nevolnictví.\n\nAby byla revoluce ubráněna před všemi, kdo by ji chtěli zničit, získala Všesvazová [ROOT.GetCountry.GetAdjectiveNoFormatting] [GetLawType('law_extraordinary_commission').GetName] rozsáhlé pravomoci, díky nimž může podezřelé kontrarevolucionáře a sabotéry podrobit revoluční spravedlnosti. Dokud nebude rozdrcen poslední odpor buržoazie, bude vládnout teror." # todo: NEW TRANSLATION
 vanguard_custom_tooltip: "Každá mocná zájmová skupina je vedena vůdcem s ideologií [GetIdeology('ideology_vanguardist').GetName], [GetIdeology('ideology_communist').GetName] nebo [GetIdeology('ideology_anarchist').GetName]." # todo: MOVED KEY
 vanguard_instruction_status: "Inteligence, venkovský lid, odbory a ozbrojené síly přijmou avantgardismus, pokud budou marginalizovány." # todo: MOVED KEY
 has_suppressed_white_movement_for_some_years_tt: "[concept_political_movement_support] hnutí [SelectLocalization(SCOPE.sPoliticalMovement('white_movement_scope').IsValid, SCOPE.sPoliticalMovement('white_movement_scope').GetName, 'movement_anti_communist')] zůstávala po dobu #b 24#! po sobě jdoucích měsíců pod #v 5 %#! (aktuálně #v [ROOT.GetCountry.MakeScope.Var('anti_communist_suppression_var').GetValue|v0]#!)" # todo: NEW TRANSLATION
 no_reactionary_conservative_liberal_agitators_tt: "Nemá žádné [Concept('concept_agitator', '$concept_agitators|q$')] s ideologií #tooltippable;tooltip:[GetPlayer.GetTooltipTag],reactionary_ideologies_list_tt Reakcionář#!, #tooltippable;tooltip:[GetPlayer.GetTooltipTag],conservative_ideologies_list_tt Konzervativec#! ani #tooltippable;tooltip:[GetPlayer.GetTooltipTag],liberal_ideologies_list_tt Liberál#!" # todo: NEW TRANSLATION
 leader_of_nomenklatura_tt: "[THIS.GetCharacter.GetFullName] se stane [concept_leader] #b $ig_nomenklatura$#!" # todo: NEW TRANSLATION
 nomenklatura_tt: "[SCOPE.gsInterestGroup('nomenklatura_scope').GetName] bude reorganizována na #b nomenklaturu#! s [Concept('concept_ideology', '$concept_ideologies|q$')]: [GetIdeology('ideology_materialist').GetName], [GetIdeology('ideology_managerial').GetName] a [GetIdeology('ideology_defensist').GetName]" # todo: NEW TRANSLATION
 nomenklatura_dissolved_tt: "#b $ig_nomenklatura$#! bude reorganizována na $ig_intelligentsia$ s [Concept('concept_ideology', '$concept_ideologies|q$')]: [GetIdeology('ideology_liberal').GetName], [GetIdeology('ideology_anti_clerical').GetName] a [GetIdeology('ideology_republican').GetName]" # todo: NEW TRANSLATION
 nomenklatura.1.t: "Aparát" # todo: NEW TRANSLATION
 nomenklatura.1.d: "Rostoucí politický vliv [GetPopType('bureaucrats').GetName] a jmenovaných odborníků v posledních letech dal vzniknout vrstvě označované jako #b $ig_nomenklatura$#!. Ve jménu nutnosti zachovat pořádek a disciplínu na obranu revoluce prosazují další profesionalizaci a rozšiřování státního aparátu." # todo: NEW TRANSLATION
 nomenklatura.1.f: "Netrvalo dlouho po jejich odchodu z kanceláře, než se [SCOPE.sCharacter('name_a_scope').GetFirstNameNoFormatting] poprvé ozval. „Viděl jsi tu nejnovější třídu učňů? Nemají na rukou jediný mozol, mají je hladké jako dětskou prdelku.“\n\n[SCOPE.sCharacter('name_b_scope').GetFirstNameNoFormatting] přikývl a sevřel rty. „Viděl. Přísahal bych, že jsem jednu z těch tváří kdysi dávno zahlédl na druhé straně barikády.“\n\n„Začínají výš než my. Polovina kanceláře jsou teď placení jmenovaní. Žádný revoluční duch.“ [SCOPE.sCharacter('name_a_scope').GetFirstNameNoFormatting] se rozhlédl, aby našel něco, čím by svůj argument podpořil. Na fasádě vedlejší budovy byla neopravená díra po kulce a on na ni kývl. „Co budeme dělat, jestli začnou pronikat i do strany?“" # todo: NEW TRANSLATION
 nomenklatura.1.a: "Nedostatky našeho státu jsou čím dál zjevnější." # todo: NEW TRANSLATION
 nomenklatura.1.b: "Musíme vynaložit veškeré úsilí na obranu našich výdobytků." # todo: NEW TRANSLATION
 nomenklatura.2.t: "Ocelový muž" # todo: NEW TRANSLATION
 nomenklatura.2.d: "Komisař [SCOPE.sCharacter('stalin_scope').GetFullName], dlouholetý bolševický aktivista a člen neformálního vedení [SCOPE.sParty('stalin_party_scope').GetName], se vyznamenal v oblasti národnostní politiky. [ROOT.GetCountry.GetRuler.GetFullName] zvažuje jeho povýšení." # todo: NEW TRANSLATION
 nomenklatura.2.f: "„Víme, kam vede rozdělování dělníků podle národností. Rozpad jednotné dělnické strany, rozdělení odborů podle národností, vyostření národnostních sporů, národnostně motivované stávkokazectví, naprostá demoralizace v řadách sociální demokracie — to vše jsou důsledky organizačního federalismu. Dějiny sociální demokracie v Rakousku a činnost Bundu v Rusku to výmluvně dokazují.\n\nJediným lékem na to je organizace založená na internacionalismu.\n\nSpojit na místní úrovni dělníky všech národností Ruska do jednotných, celistvých kolektivních organizací a tyto organizace sjednotit v jediné straně — to je naším úkolem.„\n\n—Iosif Stalin, #italic Marxismus a národnostní otázka#!" # todo: NEW TRANSLATION
 nomenklatura.2.a: "Jeho smysl pro detail si zaslouží vyšší postavení ve straně." # todo: NEW TRANSLATION
 nomenklatura.2.b: "Oceňme jeho práci komisaře pro národnostní otázky." # todo: NEW TRANSLATION
 nomenklatura.2.c: "Na další postup je příliš hrubý." # todo: NEW TRANSLATION
 modifier_general_secretary: "Generální tajemník" # todo: NEW TRANSLATION
 modifier_commissar_for_nationalities: "Komisař pro národnostní otázky" # todo: NEW TRANSLATION
 modifier_marxism_and_the_national_question: "$marxism$ a národnostní otázka" # todo: NEW TRANSLATION
 nomenklatura.3.t: "Okamžité odvolání" # todo: NEW TRANSLATION
 nomenklatura.3.d: "Voliči [SCOPE.sCharacter('relevant_character_scope').GetHerHis] jsou rozhořčeni tím, jak [SCOPE.sCharacter('relevant_character_scope').GetFullName] údajně nedokázal hájit jejich zájmy, a odhlasovali [SCOPE.sCharacter('relevant_character_scope').GetHerHim] odvolání z [SCOPE.sCharacter('relevant_character_scope').GetHerHis] úředních funkcí. [SCOPE.sCharacter('relevant_character_scope').GetLastName] proti odvolání protestoval a tvrdil, že naruší zásadní státní projekty." # todo: NEW TRANSLATION
 nomenklatura.3.f: "„Vy tomu nerozumíte,“ řekl [SCOPE.sCharacter('relevant_character_scope').GetLastNameNoFormatting] už poněkolikáté. „Mám práci. Klidně mě znovu nezvolte. Nahraďte mě, kým chcete. Ale ne #italic teď#!. Potřebuji čas, abych…“\n\nVolič, který mu zprávu předával — muž středního věku s brýlemi a řídnoucími vlasy — krátce zavrtěl hlavou. „Času jste měl dost, nemyslíte? A varování taky. Víte, že jsem vás volil, ale [ROOT.GetCountry.GetCapital.GetCityHubName] vám nepřálo.“\n\n[SCOPE.sCharacter('relevant_character_scope').GetLastNameNoFormatting|U] zrudly tváře. [SCOPE.sCharacter('relevant_character_scope').GetSheHe|U] by mohl bojovat usilovněji, [SCOPE.sCharacter('relevant_character_scope').GetSheHe] pomyslel si. [SCOPE.sCharacter('relevant_character_scope').GetSheHe|U] by se mohl vzpírat, křičet, zarývat [SCOPE.sCharacter('relevant_character_scope').GetHerHis] nehty do země a odvolávat se ke [SCOPE.sCharacter('relevant_character_scope').GetHerHis] straně. [SCOPE.sCharacter('relevant_character_scope').GetSheHe|U] by se mohl přestěhovat a kandidovat v jiném obvodu. Chtěl [SCOPE.sCharacter('relevant_character_scope').GetSheHe] to? Byla by to potupa, ale znamenalo by to, že by [SCOPE.sCharacter('relevant_character_scope').GetSheHe] mohl zůstat ve funkci o něco déle. Stálo by to za to?„" # todo: NEW TRANSLATION
 nomenklatura.3.a: "Dělníci mají právo na okamžité odvolání." # todo: NEW TRANSLATION
 nomenklatura.3.b: "[SCOPE.sCharacter('relevant_character_scope').GetLastName] je příliš cenný na to, abychom o něj přišli. Udělme [SCOPE.sCharacter('relevant_character_scope').GetHerHim] zvláštní funkci." # todo: NEW TRANSLATION
 remove_as_ig_leader_tt: "[SCOPE.sCharacter('relevant_character_scope').GetFullName] bude odvolán z pozice [concept_leader] skupiny [SCOPE.sCharacter('relevant_character_scope').GetInterestGroup.GetName]" # todo: NEW TRANSLATION
 nomenklatura.4.t: "Odvolání z velení" # todo: NEW TRANSLATION
 nomenklatura.4.d: "Neoblíbené rozkazy, které vydal [SCOPE.sCharacter('relevant_character_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('relevant_character_scope').GetFullName], způsobily, že [SCOPE.sCharacter('relevant_character_scope').GetHerHim] ztratil důvěru [SCOPE.sCharacter('relevant_character_scope').GetHerHis] jednotky, a [SCOPE.sCharacter('relevant_character_scope').GetHerHis] vojáci odhlasovali [SCOPE.sCharacter('relevant_character_scope').GetHerHim] odvolat z [SCOPE.sCharacter('relevant_character_scope').GetHerHis] velení. Velení [SCOPE.gsInterestGroup('red_army_ig').GetName] protestovalo a tvrdí, že schopnosti [SCOPE.sCharacter('relevant_character_scope').GetHerHis] zvoleného nástupce nelze zaručit." # todo: NEW TRANSLATION
 nomenklatura.4.f: "„Dokud moc spočívala v rukou třídy, která je naším nepřítelem, a velitelský sbor se jevil jako nástroj v rukou této moci, bylo naší povinností usilovat prostřednictvím volebního principu o prolomení třídního odporu velitelského sboru. Dnes však politická moc spočívá v rukou téže dělnické třídy, z jejíchž řad se rekrutuje armáda. Za nynějšího uspořádání armády — říkám vám to naprosto otevřeně — se volební princip jeví politicky zbytečný a z technického hlediska nepraktický.“\n\n—Leon Trockij, „Práce, disciplína a pořádek“" # todo: NEW TRANSLATION
 nomenklatura.4.a: "Mají právo volit si vlastní důstojníky." # todo: NEW TRANSLATION
 nomenklatura.4.b: "Partyzánská fraška. Ať zasáhne vrchní velení." # todo: NEW TRANSLATION
 nomenklatura.5.t: "Iniciativa dělníků" # todo: NEW TRANSLATION
 nomenklatura.5.d: "Podnícena revolučním zápalem a nově nabytou mocí začala řada [GetLawType('law_factory_councils').GetName] uplatňovat [SCOPE.sLaw('trade_union_law_scope').GetName] na územích, která ovládají. Jejich iniciativa upoutala pozornost [SCOPE.GetRootScope.GetCountry.GetCustom('country_legislature_name')]." # todo: NEW TRANSLATION
 nomenklatura.5.f: "[SCOPE.sCharacter('proletariat_leader').GetLastNameNoFormatting|U] pročítal zprávy z [SCOPE.sState('relevant_urban_state').GetCityHubName]. Bylo pozdě a [SCOPE.sCharacter('proletariat_leader').GetSheHe] už jednou vyměnil olej v [SCOPE.sCharacter('proletariat_leader').GetHerHis] lampě. Práce [SCOPE.sState('relevant_urban_state').GetCityHubName] [SCOPE.sState('relevant_urban_state').GetCustom('getCouncilSoviet')] měla všechny typické znaky spontánní místní iniciativy — byla horlivá, vycházela z konkrétních zájmů obyvatel města a odpovídala místním podmínkám.\n\nByl to začátek — snad dobrý, snad pravý opak. Takové iniciativy se až příliš snadno mohly ukázat jako maloměstské nebo maloburžoazní. Nechtěl zklamat nadšené radní, kteří mu přinesli dokumenty, zároveň si však až příliš dobře uvědomoval, že zájmy některých dělníků se nemusí vždy shodovat se zájmy dělnické třídy.\n\nDiktatura proletariátu, pomyslel si, ne diktatura [SCOPE.sState('relevant_urban_state').GetCityHubName] [SCOPE.sState('relevant_urban_state').GetCustom('getCouncilSoviet')]. Pokud bude odmítnutí nutné, alespoň bude mít heslo, které otiskne v [GetPlayer.GetCustom('newspaper_type')]." # todo: NEW TRANSLATION
 nomenklatura.5.a: "Oceňme jejich iniciativu a rozšiřme tuto politiku na celou zemi." # todo: NEW TRANSLATION
 nomenklatura.5.b: "Několik rad nemluví za celou třídu." # todo: NEW TRANSLATION
 modifier_recall_overridden: "Odvolání obejito" # todo: NEW TRANSLATION
 modifier_recall_overridden_military: "Odvolání přehlasováno" # todo: NEW TRANSLATION
 modifier_spontaneous_enactment: "Spontánní iniciativa" # todo: NEW TRANSLATION
 modifier_bureaucratic_veto: "Iniciativa potlačena" # todo: NEW TRANSLATION
 nomenklatura.6.t: "Záškodníci a sabotéři" # todo: NEW TRANSLATION
 nomenklatura.6.d: "Techničtí specialisté ve státě [SCOPE.sState('relevant_industrial_state').GetName] si stěžují na nespravedlivé zacházení ze strany [SCOPE.gsInterestGroup('proletariat_ig').GetName]. Tvrdí, že čelí nepodloženým obviněním ze sabotáže a nespolupráci ze strany [GetPopType('laborers').GetName] a [GetPopType('machinists').GetName], které byli pověřeni řídit." # todo: NEW TRANSLATION
 nomenklatura.6.f: "Vzduch ve slévárně se tetelil horkem. I s otevřenými světlíky se pod střechou hromadil dusivý opar. Na podlaze tři party protlačovaly rozžhavenou ocel válcovacím strojem. Blížil se konec směny a vedro i námaha způsobovaly, že jim oblečení dřelo o kůži jako smirkový papír.\n\nNad nimi, na lávce, muž v elegantním kabátě sledoval každé jejich hnutí stopkami. Na jeho příkaz už se při práci nesměli svlékat do půl těla — prý to snižuje počet úrazů a předchází popáleninám při přílišné blízkosti. Možná měl pravdu. Časem by na to ale přišli sami a bylo by na nich, zda to přijmou. Takto je pokyny, které na ně doléhaly z lávky, pálily víc než roztavený kov." # todo: NEW TRANSLATION
 nomenklatura.6.a: "Za jejich vlády trpěl proletariát mnohem více." # todo: NEW TRANSLATION
 nomenklatura.6.b: "Oni znají nejlepší postupy, dělníci se jim musí podřídit." # todo: NEW TRANSLATION
 modifier_defended_the_specialists: "Zastali se technických specialistů" # todo: NEW TRANSLATION
 modifier_wrecking_accusations: "Pronásledovaní techničtí specialisté" # todo: NEW TRANSLATION
