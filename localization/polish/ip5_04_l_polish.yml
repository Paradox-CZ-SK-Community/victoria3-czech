 new_revolutionary_general_tt: "[THIS.GetMilitaryFormation.GetName] zvolí nového #tooltippable;tooltip:[GetPlayer.GetTooltipTag],socialist_ideologies_list_tt Socialistu#! za [concept_general] s [Concept('concept_character_trait','$concept_character_trait_short|q$')] [GetCharacterTrait('charismatic').GetName]" # todo: NEW TRANSLATION
 new_revolutionary_admiral_tt: "[THIS.GetMilitaryFormation.GetName] zvolí nového #tooltippable;tooltip:[GetPlayer.GetTooltipTag],socialist_ideologies_list_tt Socialistu#! za [concept_admiral] s [Concept('concept_character_trait','$concept_character_trait_short|q$')] [GetCharacterTrait('charismatic').GetName]" # todo: NEW TRANSLATION
 intelligentsia.1.t: "Žádné polovičaté kroky" # todo: NEW TRANSLATION
 intelligentsia.1.d: "Antagonizování [SCOPE.gsInterestGroup('intelligentsia_scope').GetName] ze strany [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] způsobilo, že se stále více dostávají pod vliv [SCOPE.sPoliticalMovement('republican_movement_scope').GetName]. [GetIdeology('ideology_republican').GetName] nálady zastínily jejich dřívější požadavky na konstituční [GetLawType('law_monarchy').GetName]." # todo: NEW TRANSLATION
 intelligentsia.1.f: "Před zdí se shromáždili četníci a prohlíželi si plakáty, které ji pokrývaly. Některé byly neškodné, nebo alespoň skoro — reklamy či pozvánky do klubů. Jiné byly pravým opakem. Výzvy k činům, karikatury, urážky koruny a vlasti.\n\nJeden z četníků ležel opodál a ošetřovatelka mu obvazovala krvácející ránu v dlani. Dorazil jako první a při pokusu strhnout plakát narazil na skrytou žiletku. Plakát vlál ve větru, potřísněný krví a vzdorovitý, zatímco na ně z něj křičela černá hranatá písmena: #b [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] musí zemřít#!." # todo: NEW TRANSLATION
 intelligentsia.1.a: "Přijde [ROOT.GetCountry.GetName] teror?" # todo: NEW TRANSLATION
 intelligentsia.1.b: "Ať se třese každá korunovaná hlava." # todo: NEW TRANSLATION
