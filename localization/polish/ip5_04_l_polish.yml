 je_five_year_plan_reduce_objectives_button_name: "Snížit hospodářské cíle" # todo: NEW TRANSLATION
 je_five_year_plan_reduce_objectives_button_desc: "Cíle stanovené v rámci #v $je_five_year_plan$#! byly zřejmě poněkud příliš ambiciózní. Když nyní upravíme naše hospodářské cíle, můžeme plán zachránit alespoň v omezené podobě." # todo: NEW TRANSLATION
 je_five_year_plan_reduce_objectives_button_tt_2: "Všechny cíle #v $je_five_year_plan$#! se zmírní o #v 10 %#!" # todo: NEW TRANSLATION
 je_five_year_plan_reduce_objectives_button_tt_3: "#bold Odměny#! za splnění #v $je_five_year_plan$#! budou #r poloviční#!" # todo: NEW TRANSLATION
 je_five_year_plan_cheat_button_name: "Zfalšovat statistiky" # todo: NEW TRANSLATION
 je_five_year_plan_cheat_button_desc: "Nesplnění cílů stanovených v rámci #v $je_five_year_plan$#! by mělo katastrofální dopad na kariéru mnoha místních funkcionářů. Abychom odvrátili nákladný neúspěch a všechny politické důsledky, které by s sebou přinesl, můžeme některé údaje „upravit“ příznivějším směrem. Musíme jen zajistit, aby naši bdělí soudruzi z Kontrolního komisariátu o těchto úpravách nevěděli." # todo: NEW TRANSLATION
 je_five_year_plan_cheat_button_success_tt: "Oficiální statistiky budou hlásit #g značný pokrok#! v plnění #v $je_five_year_plan$#!" # todo: NEW TRANSLATION
 je_five_year_plan_cheat_button_caught_tt: "Váš pokus o #bold manipulaci#! #r odhalil#! Kontrolní komisariát" # todo: NEW TRANSLATION
 je_five_year_plan_cheat_button_conditions_tt: "Šance na úspěšnou #b manipulaci#! se bude #b snižovat#! úměrně s nejvyšším přebytkem [concept_bureaucracy], kterého tato [concept_country] během #v $je_five_year_plan$#! dosáhla" # todo: NEW TRANSLATION
 je_five_year_plan_forced_labor_button_name: "Využít nucenou práci" # todo: NEW TRANSLATION
 je_five_year_plan_forced_labor_button_desc: "Modernizace [ROOT.GetCountry.GetName] si vyžádá mimořádné úsilí a stejně mimořádné oběti. Prodloužení směn, zabavení materiálu rolnickému obyvatelstvu a zapojení vězeňské práce do #v $je_five_year_plan$#! zvýší produktivitu a naše šance na úspěch." # todo: NEW TRANSLATION
