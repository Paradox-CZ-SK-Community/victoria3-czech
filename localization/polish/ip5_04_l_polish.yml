 je_five_year_plan_reason: "„#italic Za vyspělými zeměmi zaostáváme o padesát až sto let. Musíme tento náskok dohnat za deset let. Buď to dokážeme, nebo zahyneme.#!“\n\n—Iosif Stalin\n\nZaostalost [ROOT.GetCountry.GetAdjective] ekonomiky vzbuzuje obavy, že [ROOT.GetCountry.GetNameNoFormatting] kapitalistické mocnosti hospodářsky předčí a udusí. Abychom dohnali a nakonec předstihli své soupeře, předložil [SCOPE.GetRootScope.GetCountry.GetCustom('country_legislature_name')] plán na urychlenou industrializaci země. Jeho bezprostředním cílem je proměnit zbytky rolnictva v proletariát a vybudovat materiální základ budoucí socialistické společnosti.\n\n@information! Po dokončení přípravy #v $je_five_year_plan$#! musí být včas splněny #b všechny#! vybrané požadavky, aby byl plán úspěšně dokončen" # todo: NEW TRANSLATION
