 society_siberian_exile_reason_custom: "patří k zakázané tajné společnosti" # todo: NEW TRANSLATION
 books_siberian_exile_reason_custom: "má u sebe zakázané knihy" # todo: NEW TRANSLATION
 communication_siberian_exile_reason_custom: "tajně komunikoval s politickými vězni" # todo: NEW TRANSLATION
 siberia.2.t: "V trestanecké kolonii" # todo: NEW TRANSLATION
 siberia.2.d: "Během vyhnanství se [SCOPE.sCharacter('siberian_exile_scope').GetFullName] setkal s politickými názory dalších vyhnanců. To může zásadně změnit základ [SCOPE.sCharacter('siberian_exile_scope').GetHerHis] vlastní ideologie." # todo: NEW TRANSLATION
 siberia.2.f: "„Ať už je vyhnanství na základě správního rozhodnutí upraveno a omezeno jakkoli, bude v mysli vyhnance vždy vyvolávat představu nekontrolované úřední zvůle, a to samo o sobě stačí k tomu, aby zabránilo jakékoli nápravě.“\n— generálmajor Nikolaj Baranov, #italic Právnický věstník, 1883#!" # todo: NEW TRANSLATION
 siberia.2.a: "Výměna názorů je možná jedním z mála luxusů, které si vyhnanec může ještě dovolit." # todo: NEW TRANSLATION
 siberia.2.b: "Vášnivé debaty mezi vyhnanci mohou [SCOPE.sCharacter('other_siberian_exile_scope').GetFullName] ovlivnit nečekaným způsobem." # todo: NEW TRANSLATION
 je_social_revolution: "Sociální revoluce" # todo: NEW TRANSLATION
 je_social_revolution_reason: "Revoluce uvolnila všechny dlouho potlačované síly společnosti, svrhla její nejhlouběji zakořeněné instituce a odhalila, že kdysi nezpochybnitelné ideje jsou křehké jako sklo. Dříve opovrhovaná [SCOPE.gsInterestGroup('proletariat_ig').GetName] se chopila nejvyšší moci, ti, kdo dříve neměli hlas, nyní velí armádám a ministerstvům a bezohlední radikálové jednoho roku se zdají být konzervativci roku následujícího.\n\nZatímco kolem nás zuří tyto síly, máme příležitost vybudovat v [ROOT.GetCountry.GetName] novou společnost: společnost inspirovanou nikoli zchátralými tradicemi minulosti, nýbrž očekáváním skutečně svobodného lidstva." # todo: NEW TRANSLATION
 je_social_revolution_low_consolidation_tt: "Obě hodnoty [Concept('concept_state_and_revolution_consolidation', '$concept_state_and_revolution_consolidation_short|q$')] v [concept_journal_entry] #v $je_state_and_revolution$#! byly po dobu celkem #v 120#! měsíců nižší než #v 50%#! (nyní [ROOT.GetCountry.MakeScope.Var('communist_welfare_low_consolidation_months_var').GetValue|v0])" # todo: NEW TRANSLATION
 je_social_revolution_concluded_consolidation_tt: "[concept_journal_entry] #v $je_state_and_revolution$#! skončil vítězstvím [Concept('concept_state_and_revolution_consolidation', '$concept_state_and_revolution_consolidation_short|q$')]" # todo: NEW TRANSLATION
 je_state_and_revolution: "Stát a revoluce" # todo: NEW TRANSLATION
 je_state_and_revolution_reason: "#b Ukazatel politické [Concept('concept_state_and_revolution_consolidation', '$concept_state_and_revolution_consolidation_short|q$')]#! se bude postupem času posouvat k #tooltippable;tooltip:[GetPlayer.GetTooltipTag],state_and_revolution_political_confrontation_pivot_factors_tt [SCOPE.ScriptValue('state_and_revolution_political_confrontation_display')|%0r]#!/#tooltippable;tooltip:[GetPlayer.GetTooltipTag],state_and_revolution_political_consolidation_pivot_factors_tt [SCOPE.ScriptValue('state_and_revolution_political_consolidation_display')|%0u]#!.\n#b Ukazatel ekonomické [Concept('concept_state_and_revolution_consolidation', '$concept_state_and_revolution_consolidation_short|q$')]#! se bude postupem času posouvat k #tooltippable;tooltip:[GetPlayer.GetTooltipTag],state_and_revolution_economic_confrontation_pivot_factors_tt [SCOPE.ScriptValue('state_and_revolution_economic_confrontation_display')|%0r]#!/#tooltippable;tooltip:[GetPlayer.GetTooltipTag],state_and_revolution_economic_consolidation_pivot_factors_tt [SCOPE.ScriptValue('state_and_revolution_economic_consolidation_display')|%0o]#!.\n\nPo vynaložení nesmírného úsilí a překonání mnoha útrap nastolila dělnická třída [ROOT.GetCountry.GetAdjective] [GetLawType('law_council_republic').GetName]. Nad krajinou, která kdysi trpěla pod vládou králů a kapitalistů, nyní vlají revoluční prapory a rudý [ROOT.GetCountry.GetCapital.GetCityHubName] může být symbolem pro dělníky na celém světě.\n\nZavedení $law_council_republic$ je však jen krokem na cestě ke světovému komunismu. Dokud musí revoluce v [ROOT.GetCountry.GetNameNoFlag] čelit světu ovládanému svými nepřáteli, budou na ni působit dva protichůdné tlaky — pokračující [Concept('concept_state_and_revolution_confrontation', '$concept_state_and_revolution_confrontation_short|q$')] světového kapitalismu a [Concept('concept_state_and_revolution_consolidation', '$concept_state_and_revolution_consolidation_short|q$')] jejích úspěchů tváří v tvář drtivé opozici.\n\n@information! S rostoucí [Concept('concept_state_and_revolution_consolidation', '$concept_state_and_revolution_consolidation_short|q$')] budou [Concept('concept_country','$concept_countries|q$')] bez [GetLawType('law_council_republic').GetName] vstřícnější k diplomacii a obchodu s [ROOT.GetCountry.GetAdjectiveNoFormatting]." # todo: NEW TRANSLATION
