 factory_councils.2.t_2: "Občanská válka v oblasti [SCOPE.sState('commune_state').GetStateRegion.GetNameNoFormatting]" # todo: NEW TRANSLATION
 factory_councils.2.d: "Dělnická revoluce v [SCOPE.sState('commune_state').GetCityHubName] vzbudila velký zájem revolučních socialistů po celém světě. [SCOPE.sCharacter('paris_commune_author').GetFullName] sepsal o revoluci dílo a oslavoval ji jako první politický režim dělnické třídy na světě." # todo: NEW TRANSLATION
 factory_councils.2.f: "„Dělnická třída od Komuny neočekávala žádné zázraky. Nemá připravené utopie, které by mohla zavést #italic dekretem lidu#!. Ví, že aby dosáhla vlastního osvobození a spolu s ním i vyšší formy, k níž dnešní společnost nezadržitelně směřuje vlastními ekonomickými silami, bude muset projít dlouhými boji a řadou historických procesů, které promění okolnosti i lidi. Nemá žádné ideály, jež by měla uskutečnit; jejím úkolem je osvobodit prvky nové společnosti, jimiž je sama stará, hroutící se buržoazní společnost těhotná. Dělnická třída si může být plně vědoma svého historického poslání a s hrdinským odhodláním jednat v souladu s ním dovolit pousmát se nad hrubými invektivami pánů sloužících pánům s perem a kalamářem i nad poučovatelským patronátem dobromyslných buržoazních doktrinářů, kteří chrlí své nevědomé fráze a sektářské vrtochy tónem věštecké vědecké neomylnosti.“\n\n—Karl Marx, #italic Občanská válka ve Francii#!" # todo: NEW TRANSLATION
 factory_councils.2.a: "Nová společnost o sobě dává vědět." # todo: NEW TRANSLATION
 factory_councils.2.b: "Nevědomý režim vrahů a žhářů." # todo: NEW TRANSLATION
