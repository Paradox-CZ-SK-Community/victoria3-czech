 ideological_unification.1.t: "Jedna revoluce" # todo: NEW TRANSLATION
 ideological_unification.1.d: "Revoluce zvítězila jak v naší zemi, tak v našem větším sousedovi [SCOPE.sCountry('mother_country_scope').GetName]. Po smetení starého řádu se nabízí příležitost zrušit hranice, které naše republiky oddělují." # todo: NEW TRANSLATION
 ideological_unification.1.f: "Revoluce vyhnala vojáky z pohraničního stanoviště a skupina podnikavých dělníků se pustila do rozebírání dlouhých úseků plotu kolem něj. Podobný příběh se opakoval podél celé bývalé hranice — obyvatelé měst překračovali někdejší linii, aby se setkali s přáteli, rolníci přenášeli zboží přes bývalé mýtné závory. Z někdejší pohraniční stráže zůstaly jen roztroušené skupiny milicionářů, kteří pátrali po pronikajících kontrarevolucionářích. Staré protokoly a povinnosti byly zrušeny a strážní se opírali o zdi a povídali si s těmi, kdo přicházeli a odcházeli bez obtěžování.\n\nObnovit to, co Revoluce strhla, by vyžadovalo úsilí, do něhož se nikomu nechtělo, a vůli, kterou nikdo neměl. Když skutečná překážka zmizela, formální hranice působila každým dnem absurdněji." # todo: NEW TRANSLATION
 ideological_unification.1.a: "Pošleme našim soudruhům žádost o sjednocení." # todo: NEW TRANSLATION
 ideological_unification.1.b: "Na prvním místě je naše autonomie." # todo: NEW TRANSLATION
 ideological_unification.11.t: "[SCOPE.sCountry('smaller_country_scope').GetName] nabízí sjednocení" # todo: NEW TRANSLATION
 ideological_unification.11.d: "Po vítězství revoluce v [SCOPE.sCountry('smaller_country_scope').GetName] požádal [SCOPE.sCountry('smaller_country_scope').GetCustom('country_legislature_name')] o sjednocení našich republik." # todo: NEW TRANSLATION
 ideological_unification.11.f: "Delegaci z [SCOPE.sCountry('smaller_country_scope').GetNameNoFormatting] přivítaly po vystoupení z vlaku červené konfety. Obyvatelé [ROOT.GetCountry.GetCapital.GetCityHubName] se na tuto událost vypravili v hojném počtu s rudými prapory a vlastnoručně vyrobenými nápisy, které vítaly jejich nové soudruhy.\n\nNad nimi visel přes celou stanici transparent, natažený noční směnou železničářů, na němž zářila zlatá písmena:\n\n„AŤ ŽIJE SVĚTOVÁ SOCIALISTICKÁ REPUBLIKA“" # todo: NEW TRANSLATION
 ideological_unification.11.a: "Vítejte, soudruzi!" # todo: NEW TRANSLATION
 ideological_unification.11.b: "Zřiďme [SCOPE.sCountry('smaller_country_scope').GetNameNoFlag] jako autonomní republiku." # todo: NEW TRANSLATION
 ideological_unification.11.c: "Nechceme s nimi mít nic společného." # todo: NEW TRANSLATION
 german_unification.6.t: "Konfederace s [SCOPE.sCountry('mother_country_scope').GetName]" # todo: NEW TRANSLATION
 german_unification.6.d: "Vítězství [SelectLocalization(SCOPE.sPoliticalMovement('german_national_movement_scope').IsValid, SCOPE.sPoliticalMovement('german_national_movement_scope').GetName, 'movement_german_national')] otevřelo cestu ke sjednocení Německa. [SCOPE.GetRootScope.GetCountry.GetCustom('country_legislature_name')|U] předložil návrh, aby požádal [SCOPE.sCountry('mother_country_scope').GetName] o konfederaci pod vedením [SCOPE.sCountry('mother_country_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('mother_country_scope').GetRuler.GetFullName]." # todo: NEW TRANSLATION
 german_unification.6.f: "„Vstupem do této konfederace s [SCOPE.sCountry('mother_country_scope').GetNameNoFormatting] se možná vzdáme [ROOT.GetCountry.GetAdjectiveNoFormatting] svrchovanosti, ale zároveň pomůžeme zajistit svrchovanost německou. Duch doby nelze popřít; německý lid touží po jednotě a zdá se, že [SCOPE.sCountry('mother_country_scope').GetAdjectiveNoFormatting] vláda je připravena ji uskutečnit. Bránit sjednocení německého lidu by byla naprostá pošetilost.“" # todo: NEW TRANSLATION
 german_unification.6.a: "Za Německo!" # todo: NEW TRANSLATION
 german_unification.6.b: "Naše svrchovanost je nedotknutelná." # todo: NEW TRANSLATION
 german_unification.7.t: "Němečtí nacionalisté obsadili [SCOPE.sCountry('smaller_country_scope').GetCapital.GetCityHubName]" # todo: NEW TRANSLATION
 german_unification.7.d: "Nacionalističtí povstalci, inspirováni výzvami k vytvoření jednotného německého národa, obsadili [SCOPE.sCountry('smaller_country_scope').GetName]. Přísahali, že sjednotí Německo pod vedením [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName]." # todo: NEW TRANSLATION
 german_unification.7.f: "„Jednotu, právo a svobodu\npro německou vlast!\nO to usilujme společně,\nbratrsky srdcem i rukou!“\n\n—August Heinrich Hoffmann, #italic Deutschlandlied#!" # todo: NEW TRANSLATION
 german_unification.7.a: "Vítáme naše bratry a sestry." # todo: NEW TRANSLATION
 german_unification.7.b: "Bude nejlepší, když naše sousedy nevyděsíme." # todo: NEW TRANSLATION
 factory_councils.1.t: "[SCOPE.sState('council_state_scope').GetCityHubName] [SCOPE.sState('council_state_scope').GetCustom('getCouncilSoviet')]" # todo: NEW TRANSLATION
 factory_councils.1.d: "Jak se revoluce šíří po [ROOT.GetCountry.GetName], [SCOPE.gsInterestGroup('trade_unions_ig').GetName] zorganizovali [GetLawType('law_factory_councils').GetName], aby koordinovali svůj boj proti vládě. Nejvlivnějším z těchto orgánů je [SCOPE.sState('council_state_scope').GetCityHubName] [SCOPE.sState('council_state_scope').GetCustom('getCouncilSoviet')], který začali dělníci po celé zemi považovat za autoritu." # todo: NEW TRANSLATION
 factory_councils.1.f: "První schůze se zúčastnilo několik desítek lidí, kteří se shromáždili kolem padesáti zástupců odborového svazu sdružujícího stejný počet tiskáren. V následujících týdnech počet delegátů vzrostl na stovky. Byli mezi nimi kovodělníci a tiskaři, obchodní příručí a lékárníci, kancelářští úředníci i dělníci z textilních továren. Budova, v níž se scházeli — univerzitní přednáškový sál — začala vysílat nervové signály generální stávky: kurýry, žadatele, reportéry a delegáty politických stran.\n\nKdyž policie zděšená pokračujícími stávkami vyslala oddíl, aby je rozehnal, postavili dobrovolné hlídky — nejprve osamělého neozbrojeného muže, potom tři s puškami. Oděni v bekovkách a pracovních oblecích shlíželi z parapetů ověšených rudými prapory na muže s odznaky a v naleštěných botách, kteří se nyní zdáli nesmírně malí." # todo: NEW TRANSLATION
 factory_councils.1.a: "Veškerou moc [SCOPE.sState('council_state_scope').GetCustom('getCouncilSovietPlural')|l]!" # todo: NEW TRANSLATION
 factory_councils.1.b: "Získejme čas — naznačme ochotu zavést reformy." # todo: NEW TRANSLATION
 factory_councils.1.c: "Nesmíme ztratit kontrolu nad zemí. Okamžitě zasáhněte!" # todo: NEW TRANSLATION
