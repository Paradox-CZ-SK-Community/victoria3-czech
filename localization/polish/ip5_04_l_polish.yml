 je_reform_or_revolution_reason: "Rostoucí politické zastoupení [GetInterestGroupVariant('ig_trade_unions',GetPlayer).GetName] dalo vzniknout vzkvétajícímu mezinárodnímu #b $movement_socialist$#!. V průmyslově vyspělém světě se objevily početné #b socialistické strany#!, které prosazují radikální přeměnu společnosti — veřejné vlastnictví výrobních prostředků, demokratické svobody a konec vykořisťování i společenské nerovnosti.\n\nAčkoli hnutí získalo na mezinárodním poli obrovský význam, v jeho jádru přetrvává hluboký rozkol. Jak dělnická třída vítězí v boji za demokracii, #bold revoluční#! dědictví hnutí zpochybňuje možnost parlamentní #bold reformy#!. Bude #b socialismus#! znamenat postupné zlepšování stávajícího stavu, nebo jeho revoluční svržení?\n\n@warning! Vypuknutí [concept_war] mezi více než  [GetPlayer.MakeScope.ScriptValue('reform_or_revolution_war_threshold')|0%v] zúčastněných [Concept('concept_country','$concept_countries|q$')] způsobí, že tento [concept_journal_entry] bude #b rychle postupovat#! k převládajícímu výsledku." # todo: NEW TRANSLATION
