 ip5_historical_agitators.1.t: "Vlastnictví je krádež" # todo: NEW TRANSLATION
 ip5_historical_agitators.1.d: "[SCOPE.sCharacter('historic_agitator_scope').GetFullName], samozvaný [GetIdeology('ideology_anarchist').GetName] a mutualista, publikoval řadu polemik proti zisku, úroku a vládnutí. [SCOPE.sCharacter('historic_agitator_scope').GetSheHe|U] prosazuje vytvoření systému svobodných družstev, který by se postavil kapitalistické ekonomice." # todo: NEW TRANSLATION
 ip5_historical_agitators.1.f: "„Nechcete ani katolicismus, ani monarchii, ani šlechtu, ale musíte mít Boha, náboženství, diktaturu, cenzuru, hierarchii, rozdíly a hodnosti. Já naproti tomu popírám vašeho Boha, vaši autoritu, vaši svrchovanost, váš soudní stát i všechny vaše zastupitelské mystifikace.“\n\n—Pierre-Joseph Proudhon, #italic Filosofie bídy#!" # todo: NEW TRANSLATION
 ip5_historical_agitators.1.a: "Prohlašuji za svého nepřítele každého, kdo mi chce vládnout." # todo: NEW TRANSLATION
 ip5_historical_agitators.1.b: "Chce být syntézou — je však sloučeným omylem." # todo: NEW TRANSLATION
 marx_events.2.t: "Hrob [GetGlobalVariable('big_communism_builder').GetCharacter.GetFullNameNoFormatting]" # todo: NEW TRANSLATION
 marx_events.2.d: "[GetGlobalVariable('big_communism_builder').GetCharacter.GetFullName], [GetGlobalVariable('big_communism_builder').GetCharacter.GetIdeology.GetName] revolucionář a kodifikátor vědeckého socialismu, zemřel. [GetGlobalVariable('big_communism_builder').GetCharacter.GetHerHis|U] přátelé a stoupenci z $movement_socialist$ uspořádali pohřeb v [SCOPE.sState('grave_scope').GetCityHubName]." # todo: NEW TRANSLATION
 marx_events.2.d_1: "[GetGlobalVariable('big_communism_builder').GetCharacter.GetFullName], [GetGlobalVariable('big_communism_builder').GetCharacter.GetIdeology.GetName] revolucionář a kodifikátor vědeckého socialismu, zemřel. [GetGlobalVariable('big_communism_builder').GetCharacter.GetHerHis|U] přátelé a stoupenci z $movement_socialist$ uspořádali pohřeb v rodném [SCOPE.sState('grave_scope').GetForestryHubName] [GetGlobalVariable('big_communism_builder').GetCharacter.GetHerHis]." # todo: NEW TRANSLATION
 marx_events.2.f: "„...a proto byl [GetGlobalVariable('big_communism_builder').GetCharacter.GetLastNameNoFormatting] nejvíce nenáviděným a nejvíce pomlouvaným [GetGlobalVariable('big_communism_builder').GetCharacter.GetWomanMan] [GetGlobalVariable('big_communism_builder').GetCharacter.GetHerHis] doby. Vlády, absolutistické i republikánské, [GetGlobalVariable('big_communism_builder').GetCharacter.GetHerHim] vyháněly ze svých území. Buržoové, konzervativní i ultrademokratičtí, se předháněli v tom, kdo na [GetGlobalVariable('big_communism_builder').GetCharacter.GetHerHim] nakydá víc špíny. To vše [GetGlobalVariable('big_communism_builder').GetCharacter.GetSheHe] smetl stranou jako pavučinu, nevšímal si toho a odpovídal jen tehdy, když [GetGlobalVariable('big_communism_builder').GetCharacter.GetHerHim] k tomu donutila krajní nutnost. A [GetGlobalVariable('big_communism_builder').GetCharacter.GetSheHe] zemřel milován, ctěn a oplakáván miliony revolučních spolupracovníků — od sibiřských dolů po Kalifornii, ve všech částech Evropy a Ameriky — a troufám si říci, že ač [GetGlobalVariable('big_communism_builder').GetCharacter.GetSheHe] měl mnoho odpůrců, [GetGlobalVariable('big_communism_builder').GetCharacter.GetSheHe] neměl snad ani jediného osobního nepřítele.“" # todo: NEW TRANSLATION
 marx_events.2.a: "Zesnulý, živý příteli, budeme tě následovat až k poslednímu cíli." # todo: NEW TRANSLATION
 marx_events.2.b: "Jméno, které bude znít dějinami." # todo: NEW TRANSLATION
 marx_events.2.c: "Kdyby se to stalo před několika desetiletími..." # todo: NEW TRANSLATION
 marx_events.3.t: "Od konkrétního k abstraktnímu a zpět" # todo: NEW TRANSLATION
 marx_events.3.d: "[SCOPE.sCharacter('marx_scope').GetFullName] se pustil do projektu, jehož cílem je sepsat komplexní kritiku moderní politické ekonomie. [SCOPE.sCharacter('marx_scope').GetHerHis|U] metoda začne volným, konkrétním pojetím politické ekonomie jako celku, přejde k podrobnému zkoumání jejích abstraktních složek a poté ji znovu sestaví jako celek." # todo: NEW TRANSLATION
 marx_events.3.f: "„Jsem tak daleko, že budu mít celé to #italic ekonomické svinstvo#! hotové za pět týdnů. Až to dodělám, sepíšu doma ekonomii a vrhnu se v Muzeu na jinou vědu. Začíná mě to nudit. V jádru tato věda od dob A. Smitha a D. Ricarda nepokročila, ať už se ve zkoumání jednotlivých témat, která bývají často nesmírně složitá, událo cokoli.“\n\n—Karl Marx Friedrichu Engelsovi, 1851" # todo: NEW TRANSLATION
 marx_events.3.a: "Čeká ho monumentální dílo." # todo: NEW TRANSLATION
 marx_events.3.b: "Podpořte ho v jeho projektu." # todo: NEW TRANSLATION
 marx_events.3.c: "Jeho ostatní povinnosti musí mít přednost." # todo: NEW TRANSLATION
 marx_events.4.t: "Kapitál" # todo: NEW TRANSLATION
 marx_events.4.d: "[SCOPE.sCharacter('capital_publisher_scope').GetFullName] vydal první díl [SCOPE.sCharacter('capital_publisher_scope').GetHerHis] díla #italic Kapitál#!, podrobné kritiky moderní politické ekonomie. Dílo se rychle stalo ústředním bodem teoretického korpusu [SelectLocalization(SCOPE.sPoliticalMovement('socialist_movement_scope').IsValid, SCOPE.sPoliticalMovement('socialist_movement_scope').GetName, 'movement_socialist')]." # todo: NEW TRANSLATION
 marx_events.4.d_1: "[SCOPE.sCharacter('capital_publisher_scope').GetFullName], přítel a spolupracovník zesnulého [SCOPE.sCharacter('capital_author_scope').GetFullNameNoFormatting], posmrtně vydal první díl [SCOPE.sCharacter('capital_author_scope').GetLastNameNoFormatting]ova #italic Kapitálu#!. Dílo se rychle stalo ústředním bodem teoretického korpusu [SelectLocalization(SCOPE.sPoliticalMovement('socialist_movement_scope').IsValid, SCOPE.sPoliticalMovement('socialist_movement_scope').GetName, 'movement_socialist')]." # todo: NEW TRANSLATION
 marx_events.4.f: "[SCOPE.sCharacter('name_a_scope').GetFirstNameNoFormatting] přejel [SCOPE.sCharacter('name_a_scope').GetHerHis] pohledem po knihovně [SCOPE.sCharacter('name_a_scope').GetHerHis] hostitele a zkoumal jednotlivé tituly i autory. Nechyběly obvyklé knihy — Rousseau, Feuerbach, Heinrich Heine, Smith, Strauss a Schiller. Na samém konci stál tlustý svazek v hnědé kůži, z jehož neposkvrněného hřbetu uprostřed zářilo známé jméno.\n\n„Četl jste $marx_last$?“ zeptal se a konečně se obrátil k muži na druhé straně stolu.\n\n„Samozřejmě,“ odpověděl [SCOPE.sCharacter('name_b_scope').GetFirstNameNoFormatting] s klidným výrazem. „A vy? Naprosto mě přesvědčila teze o tendenci mezd klesat na holé existenční minimum... kdybych chtěl, mohl bych o tom napsat esej.“" # todo: NEW TRANSLATION
 marx_events.4.a: "Nová zbraň v rukou dělníků." # todo: NEW TRANSLATION
 marx_events.4.b: "Co #italic je#! zboží?" # todo: NEW TRANSLATION
 marx_events.4.c: "V [ROOT.GetCountry.GetNameNoFormatting] to nemá žádné uplatnění." # todo: NEW TRANSLATION
