 siberian_exile_pool: "Sibiř" # todo: NEW TRANSLATION
 siberia.1.t: "Vyhnanství správním řízením" # todo: NEW TRANSLATION
 siberia.1.d: "Policie zjistila, že [SCOPE.sCharacter('siberian_exile_scope').GetFullName] [SCOPE.sCharacter('siberian_exile_scope').GetCustom('custom_siberian_exile_reason_loc')]. [SCOPE.sCharacter('siberian_exile_scope').GetSheHe|U] nyní čelí politickému vyhnanství na Sibiři. Bude-li [SCOPE.sCharacter('siberian_exile_scope').GetSheHe] uznán vinným, bude mu dovoleno vrátit se po uplynutí [SCOPE.sCharacter('siberian_exile_scope').GetHerHis] trestu." # todo: NEW TRANSLATION
 siberia.1.f: "„Většina z nich jsou vyhnanci na základě správního rozhodnutí — tedy osoby, které vláda z různých důvodů považovala za vhodné odsunout z jejich domovů a podrobit policejnímu dohledu v části říše, kde nemohou škodit. Skuteční spiklenci a revolucionáři — muži a ženy, kteří se skutečně podíleli na trestné činnosti — jsou posíláni do odlehlejších částí Sibiře a na nucené práce.“\n— George Kennan, #italic Sibiř a systém vyhnanství, sv. 1, 1891#!" # todo: NEW TRANSLATION
 siberia.1.a: "Pětiletý trest, aby byl [SCOPE.sCharacter('siberian_exile_scope').GetHerHim] pod přísným dohledem." # todo: NEW TRANSLATION
 siberia.1.b: "Desetiletý trest, abychom zničili veškerý vliv, který [SCOPE.sCharacter('siberian_exile_scope').GetSheHe] má v hlavním městě." # todo: NEW TRANSLATION
 siberia.1.c: "Dvacet let. [SCOPE.sCharacter('siberian_exile_scope').GetSheHe|U] nám dělal potíže příliš dlouho." # todo: NEW TRANSLATION
 siberia.1.e: "To by vyvolalo příliš velký skandál. Zprostit [SCOPE.sCharacter('siberian_exile_scope').GetHerHim] obvinění." # todo: NEW TRANSLATION
 to_siberia_5_tt: "[SCOPE.sCharacter('siberian_exile_scope').GetFullName] bude odsouzen k [concept_siberian_exile] na #v 5 let#!" # todo: NEW TRANSLATION
 to_siberia_10_tt: "[SCOPE.sCharacter('siberian_exile_scope').GetFullName] bude odsouzen k [concept_siberian_exile] na #v 10 let#!" # todo: NEW TRANSLATION
