 je_forest_of_bayonets_reason: "Od konce napoleonských válek vládne napříč [GetGeographicRegion('geographic_region_europe').GetName] reakční řád zakotvený v $glossary_congress_of_vienna$. Navzdory otřesům, které přinesly [glossary_revolutions_of_1830], zajistilo začlenění #b Belgie#! a francouzské #b Červencové monarchie#! do kongresového řádu jeho další existenci. V obavách z dalšího $glossary_1792$ vytvořily absolutistické i konzervativní konstituční režimy falangu, která má potlačit sebemenší náznak revoluční činnosti.\n\nAni přes toto úsilí však sen o svobodě, rovnosti a bratrství nezemřel. Síly [Concept('concept_revolution', '$concept_revolutionary|q$')] jsou stále odhodlány svrhnout kongresový řád a odpor chudé a zbavené práv dělnické třídy představuje hrozbu sociálního výbuchu v každém evropském hlavním městě. Stačí dostatečná jiskra a celá Evropa může vzplanout.\n\n@warning! Pokud [Concept('concept_revolution', '$concept_revolutionary|q$')] činnost dosáhne kritického bodu, křehký kongresový řád vybuchne v #b revoluční jaro#!" # todo: NEW TRANSLATION
