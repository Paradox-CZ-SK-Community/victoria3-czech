l_polish:
 je_mughal_hindustan: "Vězeň Rudé pevnosti" # todo: NEW TRANSLATION
 je_mughal_hindustan_reason: "Panovníci [SCOPE.sCountry('mughal_scope').GetName] kdysi vládli od Kábulu po karnátské pobřeží, ale ta zlatá doba už dávno pominula. Moc [SCOPE.sCountry('bic_scope').GetName] stále roste, každý rok si přisvojuje nové pravomoci a připravuje náš dvůr o stále větší část autority, prestiže a tradic, které dříve měl. Nyní velcí potomci Timura sotva vládnou mimo hradby Rudé pevnosti v Dillí!\n\n#N #bold Musíme jednat, abychom zachránili [SCOPE.sCountry('mughal_scope').GetNameNoFormatting], než se propadne v zapomnění.#!#!" # todo: NEW TRANSLATION
 mughal.1.t: "Vyslech stížností" # todo: NEW TRANSLATION
 mughal.1.d: "V roce 1835 britští agenti trvali na tom, aby [SCOPE.sCharacter('akbar_ii').GetPrimaryRoleTitle] [SCOPE.sCharacter('akbar_ii').GetFirstName] uznal [SCOPE.sCharacter('bahadur_ii').GetPrimaryRoleTitle] [SCOPE.sCharacter('bahadur_ii').GetFirstName] jako [SCOPE.sCharacter('akbar_ii').GetHerHis|l] dědice, navzdory přání [SCOPE.sCharacter('akbar_ii').GetPrimaryRoleTitle] jmenovat Mirzu #tooltippable_name #bold Salim#!#!, [SCOPE.sCharacter('akbar_ii').GetHerHis|l] nemocného osmého syna, jako následníka. Některé kruhy na dvoře naléhaly na [SCOPE.sCharacter('akbar_ii').GetFirstNameNoFormatting], aby rozhodnutí naposledy zpochybnil." # todo: NEW TRANSLATION
 mughal.1.f: "\"Podívej na sebe!\" zahřměl dvořan, rozčileně. \"Podívej se na toto místo! Stovky let moci a slávy spočívají zde! Timurova krev koluje ve tvých žilách! A přesto tady sedíš, pokorný, a necháváš nějakého agenta v Kalkatě určovat tvé vlastní následnictví! Copak nejsi císař? #bold Velcí muži musí činit velké věci!#!!\"" # todo: NEW TRANSLATION
 mughal.1.a: "Rozhodnutí [SCOPE.sCountry('probably_east_india_company_scope').GetName] je konečné." # todo: NEW TRANSLATION
 mughal.1.b: "[SCOPE.sCountry('probably_britain_scope').GetAdjectiveNoFormatting] názor k čertu, #bold Mirza Salim#! #italic bude#! následníkem." # todo: NEW TRANSLATION
 mirza_salim_succeeds: "#tooltippable_name Salim Gurkani#! nahrazuje [SCOPE.sCharacter('bahadur_ii').GetFullName] jako [SCOPE.sCharacter('bahadur_ii').GetPrimaryRoleTitle]. Je #P mladší#! a více #P ambiciózní#! než Bahadur, ale je #N nemocný#!." # todo: NEW TRANSLATION
 mirza_salim_will_probably_die: "Stres z tohoto odmítnutí zhorší nemocného #bold Mirza Salim#! a pravděpodobně ho zabije." # todo: NEW TRANSLATION
 notification_mirza_salim_has_died_name: "Mirza Salim zemřel." # todo: NEW TRANSLATION
 notification_mirza_salim_has_died_desc: "#bold Mirza Salim#!, smutný a sklíčený, zemřel na vřed." # todo: NEW TRANSLATION
 notification_mirza_salim_has_died_tooltip: "#header $mirza_salim_has_died_name$#!\n$TOOLTIP_DELIMITER$\n$mirza_salim_has_died_desc$" # todo: NEW TRANSLATION
 assertive_mughals: "Rozhodní Mughálové" # todo: NEW TRANSLATION
 belated_british_interference: "Pozdní britské vměšování" # todo: NEW TRANSLATION
 notification_mughals_pick_own_successor_name: "[SCOPE.sCountry('hindustan').GetName] ignoruje náš diktát!" # todo: NEW TRANSLATION
 notification_mughals_pick_own_successor_desc: "[SCOPE.sCharacter('akbar_ii').GetPrimaryRoleTitle] [SCOPE.sCharacter('akbar_ii').GetFirstName] z [SCOPE.sCountry('hindustan').GetName] odmítl naše předchozí rozhodnutí a jmenoval [SCOPE.sCharacter('crown_prince_mirza_salim').GetFullName] svým dědicem." # todo: NEW TRANSLATION
 notification_mughals_pick_own_successor_tooltip: "#header $mughals_pick_own_successor_name$#!\n$TOOLTIP_DELIMITER$\n$mughals_pick_own_successor_desc$" # todo: NEW TRANSLATION
 mughal.4.t: "Výzva vetřelcům" # todo: NEW TRANSLATION
 mughal.4.d: "Zdržení při schvalování [SCOPE.sLaw('current_law_scope').GetName] způsobilo u dvora obrovské rozčarování. Je možné požádat o zásah [SCOPE.sCountry('probably_east_india_company_scope').GetName] o pomoc, ale to by v podstatě znamenalo postoupit více zákonodárných pravomocí [SCOPE.sCountry('probably_east_india_company_scope').GetNameNoFormatting]." # todo: NEW TRANSLATION
 mughal.4.f: "Agent [SCOPE.sCharacter('probably_bic_governor_general').GetPrimaryRoleTitle] prostě stál #italic přímo tam#!, nic neříkal, a přitom řekl všechno, co bylo třeba. [SCOPE.sCharacter('hindustan_ruler').GetPrimaryRoleTitle] [SCOPE.sCharacter('hindustan_ruler').GetFirstNameNoFormatting] ho nervózně pozoroval, zatímco držel kontroverzní dekret v [SCOPE.sCharacter('hindustan_ruler').GetHerHis|l] rukou. Bylo by tak jednoduché požádat jej o jedinou žádost! Nestálo by to [SCOPE.sCharacter('hindustan_ruler').GetHerHim|l] nic — ale [SCOPE.sCharacter('hindustan_ruler').GetSheHe|l] věděl(a), že by to impérium stálo vše." # todo: NEW TRANSLATION
 mughal.4.a: "Požádejte [SCOPE.sCountry('probably_east_india_company_scope').GetName] o rozhodnutí" # todo: NEW TRANSLATION
 mughal.4.b: "Tento zákon je pro [SCOPE.sCountry('hindustan').GetNameNoFormatting] a bude vytvořen výhradně [SCOPE.sCountry('hindustan').GetNameNoFormatting]!" # todo: NEW TRANSLATION
 governor_general_rules_in_favor_of_law: "Přízeň generálního guvernéra" # todo: NEW TRANSLATION
 government_reliant_on_bic: "Cena závislosti" # todo: NEW TRANSLATION
 mired_in_court_intrigue: "Uvízl ve dvorských intrikách" # todo: NEW TRANSLATION
 mug_independent_lawmakers: "Nezávislí zákonodárci" # todo: NEW TRANSLATION
 mughal.5.t: "Usilování o stipendium" # todo: NEW TRANSLATION
 mughal.5.d: "Teoreticky [SCOPE.sCountry('hindustan').GetName] stále kontroluje řadu výnosných území, z nichž by bylo možno vybírat daně, ale v praxi sotva má vliv mimo hranice Dillí. Jediný způsob, jak zvýšit příjmy, je — k trapnosti dvora — požádat o vyšší stipendium z pokladny [SCOPE.sCountry('probably_east_india_company_scope').GetName]. Pro [SCOPE.sCountry('probably_east_india_company_scope').GetCapital.GetCityHubName] to může být drobnost, ale pro [SCOPE.sCountry('hindustan').GetCapital.GetCityHubName] to je vážná částka." # todo: NEW TRANSLATION
 mughal.5.f: "\"Daně!\" zasmál se [SCOPE.sCharacter('hindustan_ruler').GetPrimaryRoleTitle] [SCOPE.sCharacter('hindustan_ruler').GetFirstNameNoFormatting], \"Daně!\" [SCOPE.sCharacter('hindustan_ruler').GetSheHe|U] se houpl na [SCOPE.sCharacter('hindustan_ruler').GetHerHis] trůnu, ještě se na okamžik chichotajíc.\n\n[SCOPE.sCharacter('hindustan_ruler').GetSheHe|U] zamával na mramorové stěny kolem [SCOPE.sCharacter('hindustan_ruler').GetHerHim|l]. \"Co máme danit? Kameny?\" [SCOPE.sCharacter('hindustan_ruler').GetSheHe|U] potřásl hlavou. \"Ne, tady věci zůstávají prachem, ne zlatem. Musíme hledat jinde.\" [SCOPE.sCharacter('hindustan').GetSheHe|U] pokynul písaři. Bylo čas opět ponížit [SCOPE.sCharacter('hindustan_ruler').GetHerselfHimself|l] před [SCOPE.sCountry('probably_east_india_company_scope').GetNameNoFormatting]." # todo: NEW TRANSLATION
 mughal.5.a: "Stipendium je nezbytné k udržení stability našich financí." # todo: NEW TRANSLATION
 mughal.5.b: "Je lepší být bez peněz, než dlužit [SCOPE.sCountry('probably_east_india_company_scope').GetNameNoFormatting]." # todo: NEW TRANSLATION
 reliant_on_temporary_stipend: "Dvůr závisí na cizích penězích" # todo: NEW TRANSLATION
 proudly_poor: "Hrdě chudý dvůr" # todo: NEW TRANSLATION
 mughal.6.t: "[SCOPE.sCountry('probably_britain_scope').GetAdjectiveNoFormatting] Indická společnost" # todo: NEW TRANSLATION
 mughal.6.d: "Reformátoři z [SCOPE.sCountry('probably_britain_scope').GetName] projevili zájem o naše záležitosti, o to, jak s námi [SCOPE.sCountry('probably_east_india_company_scope').GetName] zachází, a o blaho Indie obecně. Navázání kontaktu s nimi by nám mohlo přinést podporu v [SCOPE.sCountry('probably_britain_scope').GetNameNoFormatting], ale pokud budou aktivní zde, mohou mezi našimi intelektuály vzbudit některé radikální myšlenky." # todo: NEW TRANSLATION
 mughal.6.f: "Ten [SCOPE.sCountry('probably_britain_scope').GetAdjectiveNoFormatting] muž se nervózně krčil, necítil se pohodlně pod mramorovými klenbami audienční síně. „Procestoval jsem Indii od kraje ke kraji,“ začal, „a našel jsem takovou míru nespravedlnosti, samotnou bezohlednost vlády [SCOPE.sCountry('probably_britain_scope').GetNameNoFormatting]“—úsměv [SCOPE.sCharacter('hindustan_ruler').GetFirstNameNoFormatting] se vytratil—„že vyžaduje největší spolupráci a podporu každého ochotného člena [SCOPE.sCountry('probably_britain_scope').GetAdjectiveNoFormatting] společnosti, aby pomohl věci reformy a emancipace v Indii.“\n\n[SCOPE.sCharacter('hindustan_ruler').GetPrimaryRoleTitle] [SCOPE.sCharacter('hindustan_ruler').GetFirstNameNoFormatting] zkoumal postavu přede [SCOPE.sCharacter('hindustan_ruler').GetHerHim]. Mohl by být mocným spojencem, ale je možné, že jen rozdmýchá vášně v [SCOPE.sCountry('hindustan').GetCapital.GetCityHubName] svým reformním žvaněním a zhorší situaci pro vládu. Stojí tento [SCOPE.sCountry('probably_britain_scope').GetAdjectiveNoFormatting] muž za to riziko?" # todo: NEW TRANSLATION
 mughal.6.a: "Podporujme kontakty s [SCOPE.sCountry('probably_britain_scope').GetAdjective] reformátory." # todo: NEW TRANSLATION
 mughal.6.b: "Hnutí [SCOPE.sIdeology('potentially_swayed_mug_ideology').GetName] by způsobilo více problémů, než by vyřešilo." # todo: NEW TRANSLATION
 mughal.6.c: "Využijte vazby [SCOPE.sPoliticalLobby('pro_probably_britain_lobby_scope').GetName] k upoutání pozornosti na naši věc v [SCOPE.sCountry('probably_britain_scope').GetNameNoFormatting]." # todo: NEW TRANSLATION
 british_india_society_support: "Podpora od Indické společnosti" # todo: NEW TRANSLATION
 ideology_surge_in_popularity: "Nárůst popularity ideologie" # todo: NEW TRANSLATION
 ig_mug_slavers_pleased: "Otrokaři potěšeni" # todo: NEW TRANSLATION
 britains_baleful_eye: "Nežádoucí pozornost mateřské země" # todo: NEW TRANSLATION
 mughal_6_slavers_offended: "[SCOPE.sCountry('probably_britain_scope').GetAdjectiveNoFormatting] reformátoři rozhněvali podporovatele otroctví v [SCOPE.sCountry('hindustan').GetCapital.GetCityHubName]." # todo: NEW TRANSLATION
 mughal_6_moderate_swayed_to_ideology: "[SCOPE.sCharacter('potentially_swayed_mug_politician').GetFullName] přechází k hnutí [SCOPE.sIdeology('potentially_swayed_mug_ideology').GetName]." # todo: NEW TRANSLATION
 mughal_6_overlord_pleased_at_discretion: "[SCOPE.sCountry('probably_east_india_company_scope').GetNameNoFormatting] je rádo, že jste se rozhodli nevyvolávat rozruch." # todo: NEW TRANSLATION
 notification_britain_hindustan_intervention_name: "[SCOPE.sCountry('probably_britain_scope').GetName] podporuje [SCOPE.sCountry('hindustan').GetAdjective] reformátory" # todo: NEW TRANSLATION
 notification_britain_hindustan_intervention_desc: "Reformátoři, podporovaní [SCOPE.sCountry('hindustan').GetName], donutili [SCOPE.sCountry('probably_britain_scope').GetName] dočasně zpřísnit kontrolu nad námi a přinutili nás uvolnit sevření nad našimi poddanými. Jaké drzosti!" # todo: NEW TRANSLATION
 notification_britain_hindustan_intervention_tooltip: "#header $notification_britain_hindustan_intervention_name$#!\n$TOOLTIP_DELIMITER$\n$notification_britain_hindustan_intervention_desc$" # todo: NEW TRANSLATION
 mughal.7.t: "Páví trůn utekl" # todo: NEW TRANSLATION
 mughal.7.d: "Díky politickému vyjednávání, intrikám a zásahům shora si [SCOPE.sCountry('mughal_scope').GetName] vybojovala svobodu od [SCOPE.sCountry('bic_scope').GetName]. [SCOPE.sCountry('mughal_scope').GetCapital.GetCityHubName] je plná oslav, oslavuje se vláda [SCOPE.sCharacter('hindustan_ruler').GetPrimaryRoleTitle] [SCOPE.sCharacter('hindustan_ruler').GetFirstName]." # todo: NEW TRANSLATION
 mughal.7.f: "\"Pane, podívejte! Dobrota a víra, věrnost a láska, všechny se vrátily do této požehnané země!\" vykřikl nadějný básník.\n\nStarý muž v publiku se slabě usmál, zatímco mladík pobíhal se svou skladbou. Bylo dobře, že [SCOPE.sCountry('mughal_scope').GetNameNoFormatting] byla svobodná, ale věděl, že království stále není v bezpečí. Otcové a synové byli proti sobě, bratři se bili mezi sebou a jednota byla v celé Indii podkopána.\n\nPřesto si pomyslel, posouvaje se na polštářích, že i přes tento zlověstný nádech den posledního soudu nepřišel a poslední trubka nezazněla. Kdo ví, kdo drží opratě konečné katastrofy? Lepší je slavit nynější radosti, než se trápit tím vším." # todo: NEW TRANSLATION
 mughal.7.a: "Celá Indie bude vítána v novém [SCOPE.sCountry('mughal_scope').GetNameNoFormatting]." # todo: NEW TRANSLATION
 mughal.7.b: "Král králů, nejsilnější z panovníků, budeme si tě pamatovat!" # todo: NEW TRANSLATION
 mughal.7.c: "Plamen ambicí, dlouho doutnavý, nyní vzplál naplno!" # todo: NEW TRANSLATION
 mughal.7.dd: "Nyní je čas napravit vše, co [SCOPE.sCountry('bic_scope').GetNameNoFormatting] nechal zahnívat." # todo: NEW TRANSLATION
 mughal_7_annex_up_to_3_immediate_neighbors: "Až #bold #green 3#!#! sousedních zemí se společným #bold dědictvím#! a #green #bold přátelskými#! vztahy nebo lepší budou anektovány [SCOPE.sCountry('mughal_scope').GetNameNoFormatting]." # todo: NEW TRANSLATION
 mughal_7_annex_up_to_2_immediate_neighbors: "Až #bold #green 2#!#! sousedních zemí se společným #bold dědictvím#! a #green #bold přátelskými#! vztahy nebo lepší budou anektovány [SCOPE.sCountry('mughal_scope').GetNameNoFormatting]." # todo: NEW TRANSLATION
 liberator_of_hindustan: "Osvoboditel Hindustánu" # todo: NEW TRANSLATION
 scion_of_the_liberator: "Potomek osvoboditele" # todo: NEW TRANSLATION
 mug_unshackled_governance: "Neomezená vláda" # todo: NEW TRANSLATION
 je_india_non_cooperation_movement: "Hnutí nekooperace" # todo: NEW TRANSLATION
 je_india_non_cooperation_movement_reason: "Národní hnutí v [SCOPE.sCountry('india_scope').GetName] nabírá na síle a jeho vůdci přišli s novou kampaní s jasným cílem: ekonomická a politická nekooperace, odmítání spolupráce s [SCOPE.sCountry('probably_britain_scope').GetAdjective] úřady. Doufají, že ukážou sílu svého hnutí tak, že ochromí [SCOPE.sCountry('probably_britain_scope').GetAdjectiveNoFormatting] obchod s [SCOPE.sGoods('british_trade_route_goods').GetName] s [SCOPE.sCountry('india_scope').GetNameNoFormatting]." # todo: NEW TRANSLATION
 national_swadeshi_movement: "Národní hnutí Swadeshi" # todo: NEW TRANSLATION
 india_non_cooperation_violence_escalates_tt: "Pokud radikalismus [SCOPE.sPoliticalMovement('indian_independence_movement').GetName] dosáhne #warning 75#! nebo vyšší, Hnutí nekooperace se může zvrtnout v násilí a skončit." # todo: NEW TRANSLATION
 india_non_cooperation.1.t: "Hnutí nekooperace" # todo: NEW TRANSLATION
 india_non_cooperation.1.d: "Obchod [SCOPE.sCountry('probably_britain_scope').GetAdjective] s [SCOPE.sGoods('british_trade_route_goods').GetName] je cílem ambicí [SCOPE.sPoliticalMovement('indian_independence_movement').GetName]: [SCOPE.sCountry('india_scope').GetName] nebude nadále otrokem [SCOPE.sCountry('probably_britain_scope').GetNameNoFormatting] a jeho obchodního impéria!" # todo: NEW TRANSLATION
 india_non_cooperation.1.f: "Shromáždění bylo natěsnané až k prasknutí, tak stísněné, že bylo zázrakem, že řečník mohl stát vzpřímeně. Přesto jeho hlas prorazil zatuchlým vzduchem jako nůž:\n\n\"Díky soběstačnosti můžeme získat naši autonomii a naši nezávislost. Naše cíle jsou jednoduché: chceme to, co nám patří, a chceme bojkotovat to, co naší zemi nepatří.\"" # todo: NEW TRANSLATION
 india_non_cooperation.1.a: "Toto hnutí musí být pečlivě sledováno." # todo: NEW TRANSLATION
 india_bar_advance_10_tt: "Ukazatel #v $je_india_nationalism_britain$#! #b postupu#! se posune o #v 10#!" # todo: NEW TRANSLATION
 india_non_cooperation.1.b: "Možná nějaký pobyt ve vězení přiměje [SCOPE.sCharacter('indian_independence_movement_agitator').GetFullName] přehodnotit toto hnutí." # todo: NEW TRANSLATION
 india_non_cooperation.2.t: "Nekooperace v [SCOPE.sCountry('india_scope').GetName]" # todo: NEW TRANSLATION
 india_non_cooperation.2.d: "Nacionalističtí agitátoři v [SCOPE.sCountry('india_scope').GetName] přísahají, že budou bojkotovat naše zboží. Naše pokladny neutrpí, pokud uspějí, ale naše postavení u [SCOPE.sCountry('india_scope').GetAdjectiveNoFormatting] jistě poklesne." # todo: NEW TRANSLATION
 india_non_cooperation.2.f: "Dým se vznášel pod krovy, zatímco šedý muž v brýlích monotónně přednesl zprávu. Slova '[SCOPE.sCountry('india_scope').GetNameNoFormatting]' a 'agitace' byla slyšet, ale v jeho mumlání se téměř nic jiného nedalo pochopit. Má to ale vůbec význam? Impérium se drží dobře." # todo: NEW TRANSLATION
 india_non_cooperation.2.a: "Určitě se tím někdo zabývá." # todo: NEW TRANSLATION
 india_non_cooperation.3.t: "Hartal!" # todo: NEW TRANSLATION
 india_non_cooperation.3.d: "Pohnuti agitací [SCOPE.sPoliticalMovement('indian_independence_movement').GetName] se dělníci v [SCOPE.sState('hartal_state').GetName] postavili, položili nástroje a opustili pracoviště. Celý region je ve stávce!" # todo: NEW TRANSLATION
 india_non_cooperation.3.f: "Úředník vběhl do úřadu bývalého soudce, zadýchán a lapající po dechu. \"P-pane!\" koktal, \"přestali pracovat, pane!\"\n\nStarý soudce se zamračil. \"Kdo přestal pracovat?\"\n\n\"Všichni, pane, všichni v [SCOPE.sState('hartal_state').GetNameNoFormatting]!\"\n\n\"Pane Bože! Je to #italic dovoleno#!?\"" # todo: NEW TRANSLATION
 india_non_cooperation.3.a: "Tato stávka je urážkou dobré správy!" # todo: NEW TRANSLATION
 india_non_cooperation.3.b: "Možná je čas, abychom vyjednávali s [SCOPE.sPoliticalMovement('indian_independence_movement').GetName]." # todo: NEW TRANSLATION
 hartal_action: "Hartalové stávky" # todo: NEW TRANSLATION
 hartal_negotiating_with_leaders: "Vyjednávání o hartalu" # todo: NEW TRANSLATION
 india_non_cooperation.4.t: "Swadeshi protesty" # todo: NEW TRANSLATION
 india_non_cooperation.4.d: "Vůdci [SCOPE.sPoliticalMovement('indian_independence_movement').GetName] v [SCOPE.sState('swadeshi_state').GetName] povzbuzují lidi, aby vyráběli vlastní zboží a spotřebovávali jen místně vyrobené produkty. Clo a daně prudce klesají!" # todo: NEW TRANSLATION
 india_non_cooperation.4.f: "\"Můj nacionalismus je tak široký jako má soběstačnost!\" udeřil řečník. \"Chci, aby duch [SCOPE.sCountry('india_scope').GetNameNoFormatting] povstal, aby z toho mohla těžit celá země.\"" # todo: NEW TRANSLATION
 india_non_cooperation.4.a: "Tento akt v [SCOPE.sState('swadeshi_state').GetName] je nedůležitý." # todo: NEW TRANSLATION
 india_non_cooperation.4.b: "Okamžitě zastavte ty agitátory v [SCOPE.sState('swadeshi_state').GetName]!" # todo: NEW TRANSLATION
 swadeshi_agitation: "Swadeshi agitace" # todo: NEW TRANSLATION
 successful_swadeshi_action: "Úspěšná Swadeshi akce" # todo: NEW TRANSLATION
 suppressed_swadeshi_action: "Potlačená Swadeshi akce" # todo: NEW TRANSLATION
 india_non_cooperation.5.t: "Hořící Chowki" # todo: NEW TRANSLATION
 india_non_cooperation.5.d: "Stoupající radikalismus vyvolal střet mezi stoupenci Swadeshi hnutí [SCOPE.sPoliticalMovement('indian_independence_movement').GetName] a místní policií v [SCOPE.sState('chauri_chaura_state').GetName]. Protestující byli postříleni a v odvetě dav vypálil místní policejní stanici. Zástupci [SCOPE.sPoliticalMovement('indian_independence_movement').GetName] vypadají zjevně otřesení zprávami o násilí." # todo: NEW TRANSLATION
 india_non_cooperation.5.f: "Noviny se chvěly v třesoucích se rukou muže. Podíval se na muže kolem sebe. \"Tohle jsme nechtěli.\" Po tváři mu sklouzl slzavý proužek. \"Tohle není to, co jsem chtěl, aby to hnutí bylo. Musíme kampaň zastavit.\"" # todo: NEW TRANSLATION
 india_non_cooperation.5.a: "Nenásilná nekooperace není životaschopná." # todo: NEW TRANSLATION
 india_non_cooperation.5.b: "Možná je čas, aby měkké duše ustoupily." # todo: NEW TRANSLATION
 indian_nationalist_leader_retires_tt: "[SCOPE.sCharacter('nonviolent_movement_leader').GetFullName] odejde z hnutí i z veškeré politické činnosti." # todo: NEW TRANSLATION
 failure_of_non_cooperation: "Neúspěch nekooperace" # todo: NEW TRANSLATION
 india_non_cooperation.6.t: "Nedostatečná soběstačnost" # todo: NEW TRANSLATION
 india_non_cooperation.6.d: "Úsilí [SCOPE.sPoliticalMovement('indian_independence_movement').GetName] přerušit sevření [SCOPE.sCountry('probably_britain_scope').GetName] nad obchodem [SCOPE.sCountry('india_scope').GetAdjectiveNoFormatting] vyhaslo, bez zřetelných úspěchů." # todo: NEW TRANSLATION
 india_non_cooperation.6.f: "Shromáždění se zdálo být napůl prázdné i přes svou malou velikost, a přesto se každý člověk v místnosti cítil stísněně, uvězněně. \"Možná jsme požadovali příliš,\" zamyslel se sklesle jeden z nich. \"Možná jsme považovali naše utiskovatele za slabší, než ve skutečnosti byli. Možná národ opravdu není—\"\n\n\"Ticho, příteli,\" tiše poprosil muž vedle něj. \"Už teď dost trpíme.\"" # todo: NEW TRANSLATION
 india_non_cooperation.6.a: "Je nedostatek vítězství skutečně porážkou?" # todo: NEW TRANSLATION
 india_non_cooperation.7.t: "Vítězství Satyagrahy" # todo: NEW TRANSLATION
 india_non_cooperation.7.d: "[SCOPE.sPoliticalMovement('indian_independence_movement').GetName] dnes oznámilo veliké vítězství, chválí [SCOPE.sCountry('india_scope').GetName] za jeho triumf nad [SCOPE.sCountry('probably_britain_scope').GetAdjective] obchodem a učinilo monumentální krok vpřed jako národ a hnutí." # todo: NEW TRANSLATION
 india_non_cooperation.7.f: "Sklady v přístavu nyní stály prázdné, ale poprvé to byla dobrá věc. [SCOPE.sCountry('probably_britain_scope').GetNameNoFormatting] narazila na sílu [SCOPE.sCountry('india_scope').GetAdjectiveNoFormatting] národa a #italic prohrála#!, s veškerou svou ekonomickou mocí a finančními sítěmi, které nedokázaly porazit jednoduchou sílu sjednoceného lidu. S vítězstvím nekooperace a soběstačnosti, co bude dál pro [SCOPE.sPoliticalMovement('indian_independence_movement').GetNameNoFormatting]?" # todo: NEW TRANSLATION
 india_non_cooperation.7.a: "To je velký den pro národní hnutí!" # todo: NEW TRANSLATION
