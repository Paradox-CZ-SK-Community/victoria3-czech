 je_refining_goods_reason: "Po zvýšení produkce surového $concept_goods$ bychom se nyní měli zaměřit na zpracování těchto $concept_goods$, abychom zvýšili zisky napříč naší zemí. Proč nakupovat od jiných, když to můžeme vyrobit sami?" # todo: NEW TRANSLATION
