 je_objective_encourage_liberal_ideas: "Podpořit liberální myšlení" # todo: NEW TRANSLATION
 je_objective_encourage_liberal_ideas_reason: "První kroky k vytvoření jakékoli podoby egalitární společnosti by měly být získání správných lidí do vlády. Když budou mít moc provádět změny, můžeme učinit první kroky k rovnější společnosti." # todo: NEW TRANSLATION
 je_pass_laws: "Schválení zákonů" # todo: NEW TRANSLATION
 je_pass_laws_reason: "Nyní, když máme silnější liberální prvky ve vládě, měli bychom využít jejich vliv k prosazení více egalitárních zákonů.\n\nPOZNÁMKA: Pokud některý z těchto zákonů po dokončení tohoto zápisu zákonů zrušíte, tento zápis bude skryt, dokud nebude zákon znovu přijat." # todo: NEW TRANSLATION
 je_public_services: "Veřejné služby" # todo: NEW TRANSLATION
 je_public_services_reason: "S přijatými zákony bychom měli rozšířit naše [Concept('concept_institution','$concept_institutions$')|l], aby se staly dostupnější a přístupnější obyvatelstvu.$egalitarian_objective_note_loc$" # todo: NEW TRANSLATION
 je_liberate_the_slaves: "Osvobodit otroky" # todo: NEW TRANSLATION
 je_liberate_the_slaves_reason: "Jak se můžeme nazývat egalitární společností, když stále aktivně využíváme otroctví v naší zemi? Je nezbytné, aby prvním krokem bylo zastavení této zastaralé a nemorální praxe." # todo: NEW TRANSLATION
 je_women_and_children: "Ženy a děti" # todo: NEW TRANSLATION
 je_women_and_children_reason: "Učinili jsme mnoho kroků k nastolení egalitární společnosti, ale musíme zajistit, aby tato práva byla dostupná všem. Měli bychom usilovat o ukončení nespravedlivých praktik vůči ženám a dětem.$egalitarian_objective_note_loc$" # todo: NEW TRANSLATION
 je_egalitarian_society: "Egalitární společnost" # todo: NEW TRANSLATION
 je_egalitarian_society_reason: "Nyní, když máme všechny zákony a instituce na místě, měli bychom zajistit, že máme rovnou společnost, která poskytuje stejné příležitosti všem našim občanům. Naše země by měla být jasným příkladem, který povede svět na cestu egalitarismu.$egalitarian_objective_note_loc$" # todo: NEW TRANSLATION
 liberalizing_the_government_complete: "Liberální myšlení" # todo: NEW TRANSLATION
 liberalizing_the_government_complete_desc: "Nyní, když jste dokončili svůj první zápis do deníku, jste na dobré cestě ke splnění zbývajících částí tohoto cíle a vytvoření vaší egalitární společnosti." # todo: NEW TRANSLATION
 egalitarian_society_welcome: "Egalitární společnost" # todo: NEW TRANSLATION
 egalitarian_society_welcome_desc: "Vítejte v cíli Hráče Egalitární společnost. V tomto cíli vám budou zadány série [Concept('concept_journal_entry', '$concept_journal_entries$')|l], které vás nasměrují k vytvoření egalitární společnosti." # todo: NEW TRANSLATION
 liberalizing_the_government_complete_1: "Liberální myšlení" # todo: NEW TRANSLATION
 liberalizing_the_government_complete_1_desc: "Výborně! Právě jste dokončili svůj první cíl a jste na dobré cestě k vytvoření egalitární společnosti." # todo: NEW TRANSLATION
 egalitarian_society_complete: "Egalitární společnost dokončena" # todo: NEW TRANSLATION
 egalitarian_society_complete_desc: "Výborně! Dokončili jste cíl Egalitární společnost. Pokračujte ve hraní nebo vyzkoušejte jiný cíl." # todo: NEW TRANSLATION
 je_liberate_the_slaves_invalid_tooltip: "Pokud [JournalEntry.GetTarget.GetCountry.GetName] již neexistuje." # todo: NEW TRANSLATION
 egalitarian_objective_note_loc: "\n\nPOZNÁMKA: Pokud dojde k zrušení některého ze zákonů přijatých v předchozích zápisech do deníku, tento zápis bude skryt a nebudete moci dále postupovat v tomto cíli, dokud nebude zákon znovu přijat." # todo: NEW TRANSLATION
 je_colonization_laws: "Koloniální mocnost" # todo: NEW TRANSLATION
 je_colonization_laws_reason: "První kroky k ustavení naší hegemonie by měly směřovat k rozšíření hranic zámořím. Měli bychom upravit naše zákony tak, aby nám umožňovaly kolonizovat a podpořit naše cíle." # todo: NEW TRANSLATION
 je_african_colonies: "Africké kolonie" # todo: NEW TRANSLATION
 je_african_colonies_reason: "Nyní, když naše zákony umožňují zakládat kolonie, měli bychom se jako první krok k rozšíření naší hegemonie zaměřit na získávání území na africkém kontinentě." # todo: NEW TRANSLATION
 je_expand_navy_and_army: "Posílení ozbrojených sil" # todo: NEW TRANSLATION
 je_expand_navy_and_army_reason: "S našimi prvními koloniemi bychom se měli připravit na nejhorší. Naše armáda nemusí být nejsilnější na světě, ale měla by odradit ostatní od pokusu o [concept_diplomatic_play] proti nám." # todo: NEW TRANSLATION
 je_form_alliance: "Uzavírat aliance" # todo: NEW TRANSLATION
 je_form_alliance_reason: "Udržení silné armády je důležité, ale není to jediný způsob, jak zajistit naši bezpečnost. Měli bychom vytvořit aliance s dalšími mocnostmi po celém světě, které nám mohou pomoci, pokud se některý stát pokusí nás připravit o to, co je naše." # todo: NEW TRANSLATION
 je_take_subject: "Udržet podřízené" # todo: NEW TRANSLATION
 je_take_subject_reason: "Když je naše moc upevněna, měli bychom rozšířit sféru vlivu nad jinými státy. Podrobení několika zemí významně zvýší náš vliv na mezinárodní scéně." # todo: NEW TRANSLATION
 je_increase_technology: "Upevnit naši technologickou převahu" # todo: NEW TRANSLATION
 je_increase_technology_reason: "Počty jsou důležité, ale neměli bychom spoléhat jen na obrovské množství vojáků, pokud to není nutné. Měli bychom našim vojákům zajistit správné nástroje pro jejich úkoly." # todo: NEW TRANSLATION
 je_greatest_power: "Největší mocnost" # todo: NEW TRANSLATION
 je_greatest_power_reason: "Můžeme být uznáni jako Velmoc, ale měli bychom světu ukázat, že jsme Největší mocnost, že žádný národ nás nemůže vyrovnat." # todo: NEW TRANSLATION
 je_greater_power: "Velmoc" # todo: NEW TRANSLATION
 je_greater_power_reason: "Byli jsme regionální mocností, ale nyní bychom měli upevnit naše postavení ve světě a připojit se k ostatním velmocím jako ukázku naší síly." # todo: NEW TRANSLATION
 je_great_power: "Hlavní mocnost" # todo: NEW TRANSLATION
 je_great_power_reason: "Nikdy jsme nebyli nejsilnější, ale to se teď změní! Ukážeme světu, že nejsme pouhým malým výběžkem s bezvýznamným hlasem." # todo: NEW TRANSLATION
 je_unrecognized_power: "Uznaná mocnost" # todo: NEW TRANSLATION
 je_unrecognized_power_reason: "Odsuzováni takzvanými "civilizovanými" mocnostmi, skrze práci a boj jim prokážeme svou hodnotu a zajistíme si respektované místo mezi společenstvím národů. " # todo: NEW TRANSLATION
 je_the_hegemon: "Hegemon" # todo: NEW TRANSLATION
 je_the_hegemon_reason: "Ukázali jsme světu, čeho jsme schopni. Dosáhli jsme velkých pokroků. Nyní bychom však měli zajistit, že máme i dostatečnou populaci, která podpoří naše globální postavení." # todo: NEW TRANSLATION
 colonization_law_passed_complete_1: "Koloniální mocnost" # todo: NEW TRANSLATION
 colonization_law_passed_complete_1_desc: "Výborně! Právě jste dokončili svůj první cíl a jste na dobré cestě k vybudování vlastní hegemonie." # todo: NEW TRANSLATION
 hegemon_welcome: "Hegemonie" # todo: NEW TRANSLATION
 hegemon_welcome_desc: "Vítejte v cíli Hráče Hegemonie. V tomto cíli vám budou zadány série [Concept('concept_journal_entry', '$concept_journal_entries$')|l], které vás povedou k vytvoření vlastní hegemonie." # todo: NEW TRANSLATION
