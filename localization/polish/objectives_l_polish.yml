 je_objective_expand_goods_production_invalid_tooltip: "[JournalEntry.GetTarget.GetBuilding.GetName] v [JournalEntry.GetTarget.GetBuilding.GetState.GetName] již nepatří [GetPlayer.GetName]" # todo: NEW TRANSLATION
 je_specialized_inputs: "Zlepšování výroby" # todo: NEW TRANSLATION
 je_specialized_inputs_reason: "S naším průmyslovým zbožím v plném proudu bychom měli tyto výrobky znovu investovat do našich ostatních továren. Uvolníme tak dělníky, aby mohli pracovat jinde.\n\nPOZNÁMKA: Dokončení tohoto zápisu do deníku zneplatní zápis Exportování našich zisků." # todo: NEW TRANSLATION
 je_utilizing_our_strength: "Využití naší síly" # todo: NEW TRANSLATION
 je_utilizing_our_strength_reason: "Rozhodli jsme se používat naše průmyslové výrobky pro domácí potřebu. Bylo by nejlepší udržet jejich cenu co nejnižší, aby se nezvyšily náklady ostatních budov, které jsou na těchto výrobcích závislé." # todo: NEW TRANSLATION
 je_exporting_profits: "Vývoz zisků" # todo: NEW TRANSLATION
 je_exporting_profits_reason: "Nyní, když máme velké zásoby zboží, můžeme začít tyto produkty vyvážet a zvýšit tak jejich ziskovost.\n\nPOZNÁMKA: Dokončení tohoto zápisu do deníku zneplatní zápis Zlepšování výroby." # todo: NEW TRANSLATION
 je_raise_exports_value: "Zvyšování hodnoty exportu" # todo: NEW TRANSLATION
 je_raise_exports_value_reason: "S naším zaměřením na export cenného zboží je nejlepším postupem zvýšit hodnotu těchto výrobků, aby se maximalizovaly zisky budov, které je vyrábějí." # todo: NEW TRANSLATION
 je_lower_production_costs: "Snižování cen spotřebních vstupů" # todo: NEW TRANSLATION
 je_lower_production_costs_reason: "S rostoucím průmyslem musíme zajistit stálý přísun vstupních surovin do továren a také dbát na to, aby tyto vstupní suroviny nebyly příliš drahé a neovlivňovaly negativně výrobu hodnotnějších produktů." # todo: NEW TRANSLATION
 tt_lower_production_costs_sub_obj: "Mějte [GetGoods('iron').GetCustom('GDS_A_TT')], [GetGoods('coal').GetCustom('GDS_A_TT')] a [GetGoods('steel').GetCustom('GDS_A_TT')] v [AccessPlayer.AccessFirstMarket.GetName] o 20 % levněji než jejich [concept_base_price]" # todo: NEW TRANSLATION # todo: NAME CASE
