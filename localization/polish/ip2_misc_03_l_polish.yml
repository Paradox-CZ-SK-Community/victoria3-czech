 je_avert_sepoy_mutiny: "Nestabilní Rádž" # todo: NEW TRANSLATION
 je_avert_sepoy_mutiny_reason: "Opozice vůči vládě Společnosti na indickém subkontinentu roste, dokonce i v řadách našich vlastních místních vojáků. Vzpoura možná ještě může být odvrácena." # todo: NEW TRANSLATION
 je_avert_sepoy_mutiny_tt_1: "Dokončete #BOLD $je_consolidate_colonial_rule$#! Zápis deníku" # todo: NEW TRANSLATION
 je_sepoy_mutiny: "Sepoyské povstání" # todo: NEW TRANSLATION
 je_sepoy_mutiny_reason: "Proti Společnosti propukla vzpoura a povstání. Pokud chceme zachovat naši autoritu, musí být zcela potlačena." # todo: NEW TRANSLATION
 je_uneasy_raj_tt_1: "Reformovali jsme naši koloniální správu" # todo: NEW TRANSLATION
