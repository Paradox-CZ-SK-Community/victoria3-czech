 india_events.18.t: "Správa Beraru" # todo: NEW TRANSLATION
 india_events.18.d: "Tvrdíce vysokou úroveň banditismu a nepokojů v Beraru, [SCOPE.sCountry('bic_scope').GetName] požádalo, aby spravovalo [SCOPE.sState('berar_scope').GetName] naším jménem výměnou za vysokou roční platbu." # todo: NEW TRANSLATION
 india_events.18.f: "\"Jaká je odměna za hlavu toho banditního vůdce?\" zeptal se britský důstojník.\n\n\"Pět tisíc rupií, pane.\"\n\n\"Pět tisíc! Určitě ten Gabbar nestojí tolik?\"\n\n\"Ve všech těch vesnicích,\" odpověděl úředník a nakreslil velký kruh na mapě před nimi, \"když dítě v noci pláče, jeho matky mu říkají: ‚Spi, nebo přijde Gabbar.‘\n\n\"Jestli je on a jeho spolupachatelé taková hrůza, bylo by nejlepší nechat nás se tím zabývat,\" usmál se důstojník. \"Koneckonců, jsme experti na vyčištění terénu od teroristů na našem vlastním dvorku.\"" # todo: NEW TRANSLATION
 india_events.18.a: "Dobrá tedy. Nechte [SCOPE.sCountry('bic_scope').GetCapital.GetCityHubName] spravovat Berar." # todo: NEW TRANSLATION
 india_events.18.b: "Berar patří [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] a nikomu jinému." # todo: NEW TRANSLATION
