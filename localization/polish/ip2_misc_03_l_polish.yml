 muslim_nationalist_support_above_5_tt: "Identifikující [concept_pop] [Concept('concept_political_movement_support', '$concept_political_movement_support_short$')] #v $movement_muslim_nationalist$#! je větší nebo rovno #b 5%#!" # todo: NEW TRANSLATION
 je_communal_divides_federal_solution: "Zřídit Konfederaci Indie" # todo: NEW TRANSLATION
 je_communal_divides_federal_solution_desc: "Konflikt mezi hinduisty a muslimy dosáhl příliš hlubokých kořenů na polovičatá řešení. Zřízením dvou explicitně muslimských autonomních států v Bengálsku a na Západě vytvoříme oblasti, kde se muslimové nemusí bát pronásledování, při minimálním riziku pro naši územní celistvost." # todo: NEW TRANSLATION
 make_delhi_capital: "Založit Nové Dillí" # todo: NEW TRANSLATION
 make_delhi_capital_desc: "I když nám současné hlavní město dobře sloužilo, nedávné národní agitace odhalily jeho zranitelnost vůči antisociálním hnutím. Měli bychom založit nové vládní okrsky v Dillí a přesunout tam aparát vlády." # todo: NEW TRANSLATION
 delhi_made_capital_modifier: "Vládní úřady zabezpečeny" # todo: NEW TRANSLATION
 new_delhi_modifier: "Viceroy's House" # todo: NEW TRANSLATION
 new_delhi_cost_modifier: "Stavba Nového Dillí" # todo: NEW TRANSLATION
 communal_divides_events.1.t: "Teorie jediné země" # todo: NEW TRANSLATION
 communal_divides_events.1.d: "Z [ROOT.GetCountry.GetCapital.GetCityHubName] promluvil [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetLastName] a formálně odmítl takzvanou Teorii dvou národů a přislíbil místo toho věčné bratrství mezi všemi Indy, bez ohledu na vyznání či přesvědčení." # todo: NEW TRANSLATION
 communal_divides_events.1.f: "Dvě ženy seděly na prahách svých domů, jedna v modrém sárí a druhá v pestrém burce. Obě krájely zeleninu na večeři zatímco jejich synové hráli gilli-danda na ulici před nimi.\n\n\"Vydrží to?\" zeptala se Hasrat a podívala se na Jayu.\n\nNež jí stihla odpovědět, jejich synové se začali prát. Nezúčastněné matky zakřičely a chlapci se zarazili. \"Omluvte se!\" pokárala je Jaya. Oba se omluvili, držíce si uši. Spokojeny ženy pokračovaly v rozhovoru a chlapci se vrátili ke hře.\n\n\"Vydrží to?\" zopakovala Jaya. Podívala se na své syny a řekla: \"Doufám.\"" # todo: NEW TRANSLATION
 communal_divides_events.1.a: "Ať žije Velká Indie, sjednocená v rozmanitosti!" # todo: NEW TRANSLATION
 communal_divides_events.1.b: "S rovnými právy přicházejí i stejné povinnosti." # todo: NEW TRANSLATION
 united_in_diversity_modifier: "Sjednoceni v rozmanitosti" # todo: NEW TRANSLATION
 communal_divides_events.1_tt: "#bold $movement_muslim_nationalist$#! a #bold $movement_hindu_nationalist$#! obdrží výrazné penalizace k přitažlivosti." # todo: NEW TRANSLATION
 marching_as_one_modifier: "Kráčíme jako jeden" # todo: NEW TRANSLATION
 communal_divides_events.2.t: "Velké rozdělení" # todo: NEW TRANSLATION
 communal_divides_events.2.d: "S rozdělením Indie podél etno-náboženských linií — ne příliš šťastnou realitou — se příznivci Teorie dvou národů zdají být téměř naplněni, protože veřejné vztahy mezi hinduisty a muslimy se zhoršily do bodu rozsáhlého násilí." # todo: NEW TRANSLATION
 communal_divides_events.2.f: "Dva staří politici kráčeli po staré delhijské cestě při západu slunce. \"Musíš být šťasten,\" řekl jeden druhému.\n\n\"Nedělej, že jsi to nechtěl. Teď můžeš vládnout bez toho, aby mi někdo házel klacky pod nohy.\"\n\n\"Ach, příteli, kdybys myslel, že jsi byl mým jediným problémem, jsi na omylu.\" Muž se ohlédl na silnici, kde žebrala bezdomovkyně a prodavač ovoce prodával, co mohl. \"Ne, bojím se, že jsme si spíš rozdělili problémy než je zmenšili.\"" # todo: NEW TRANSLATION
 communal_divides_events.2.a: "Tento čtyřsetletý experiment dospěl ke svému konci. Je čas přijmout, že nemohou stát jednotně." # todo: NEW TRANSLATION
 communal_divides_events.2.b: "Možná se oddělením zahojí a časem se znovu spojí." # todo: NEW TRANSLATION
 modifier_intercommunal_violence: "Rozsáhlé meziskupinové násilí" # todo: NEW TRANSLATION
 modifier_intercommunal_violence_2: "$modifier_intercommunal_violence$" # todo: NEW TRANSLATION
 communal_divides_events.3.t: "Nebezpečná myšlenka" # todo: NEW TRANSLATION
 communal_divides_events.3.d: "Na protestním shromáždění v [SCOPE.sState('relevant_state').GetName] řečník [SCOPE.sPoliticalMovement('india_congress_scope').GetName] vyzval posluchače, aby bojkotovali britský způsob života a vrátili se ke svým hinduistickým kořenům, pokud chtějí vybudovat volnou hindu národ. To vyvolalo obavy z útlaku členů [SCOPE.sPoliticalMovement('muslim_league_scope').GetName] a vedlo k dalšímu zhoršení animosity mezi oběma skupinami." # todo: NEW TRANSLATION
 communal_divides_events.3.f: "Muhammad Khan nemohl uvěřit drzosti řečníka. Ten si dovolil říct: \"Jsem rád, že je tu pan Khan, reprezentující muslimskou větev naší strany.\" Byl tu dřív než on! Bojoval proti Britům u soudu! A vyhrál! A nyní je pouze zástupcem muslimské větve?\n\nA pak se odvážil navrhnout hindu národ. Co si myslí, že udělají všichni muslimové a sikhové, když to uslyší? Převezmou se?" # todo: NEW TRANSLATION
 communal_divides_events.3.a: "Obě skupiny se musí naučit své místo." # todo: NEW TRANSLATION
 communal_divides_events.3.b: "Lépe, když svou zuřivost obrátí proti sobě než proti nám." # todo: NEW TRANSLATION
 communal_divides_events.3.c: "Dokončme rozdělení a rozdělme i zemi." # todo: NEW TRANSLATION
 sectarian_infighting_modifier: "Sektařské boje" # todo: NEW TRANSLATION
 inc_congress_influx: "Příliv muslimských členů Kongresu" # todo: NEW TRANSLATION
 exploiting_sectarian_divisions: "Využívání sektářských rozporů" # todo: NEW TRANSLATION
 communal_divides_events.4.t: "Oko za oko" # todo: NEW TRANSLATION
 communal_divides_events.4.d: "[SCOPE.sPoliticalMovement('hindu_mahasabha_scope').GetName] vedl hlučnou náboženskou procesí v [SCOPE.sState('relevant_state').GetName], zastavující se před mešitou. Muslimská mládež odpověděla vlastní procesí. Věci eskalovaly a došlo k výbuchu násilí." # todo: NEW TRANSLATION
 communal_divides_events.4.f: "Nevěděla, kdo hodil první kámen nebo kdo vytáhl první dýku. Věděla jen to, že její syn je mrtvý. Držela jeho tělo v náručí, oči suché a schopné plakat. Její manžel přistoupil, aby syna vzal pryč, ale odmítla. Ne, už mu ho jednou vzali, neodmítne ho znovu. Když chce lásku, ať si ji hledá mezi davem, ke kterému se přidal." # todo: NEW TRANSLATION
 communal_divides_events.4.a: "Mahasabha podněcuje nebezpečnou netoleranci." # todo: NEW TRANSLATION
 communal_divides_events.4.b: "Muslimská mládež měla vše nahlásit úřadům." # todo: NEW TRANSLATION
 communal_divides_events.4.c: "Možná by bylo lepší požádat tolerantní vůdce, aby převzali vedení." # todo: NEW TRANSLATION
 influx_of_recruits: "Posílení ukázkou síly" # todo: NEW TRANSLATION
 safety_in_numbers: "Příliv členů po nepokojích" # todo: NEW TRANSLATION
 mob_violence_modifier: "Široké davové násilí" # todo: NEW TRANSLATION
 communal_divides_events.5.t: "Naše cesta nebo žádná cesta" # todo: NEW TRANSLATION
 communal_divides_events.5.d: "V [SCOPE.sState('relevant_state').GetName] byla v hustě obydlené oblasti postavena nová mešita, navzdory mnoha hinduistům, kteří vyjádřili námítky. Aby si znovu potvrdili svou nadřazenost a víru, vedl [SCOPE.sPoliticalMovement('hindu_mahasabha_scope').GetName] procesí mešitou, což rychle vyvolalo násilí." # todo: NEW TRANSLATION
 communal_divides_events.5.f: "#bold Lokální konflikt dosahuje nových výšin!#!\nVčera třetí den komunalního násilí v [SCOPE.sState('relevant_state').GetCityHubName], když hindové a muslimové bojovali o přítomnost mešity v oblasti, kterou hindové považují za svou. Anonymní britský agent řekl: \"Neměli bychom být překvapeni. Byla to naše tvrdá práce, která držela místní na uzdě. Není překvapivé, že teď, když se s námi potýkají, chovají se jako rozmazlení sourozenci. Prostě nevědí lépe.\"" # todo: NEW TRANSLATION
 communal_divides_events.5.a: "Správu oblasti by měli převzít britští úředníci." # todo: NEW TRANSLATION
 communal_divides_events.5.b: "Správu by měl převzít výbor složený ze stejně zastoupených hinduistů a muslimů." # todo: NEW TRANSLATION
 communal_divides_events.5.c: "Pokud správní orgány povolily výstavbu mešity, hindové by to měli respektovat." # todo: NEW TRANSLATION
 governmental_overreach_modifier: "Vládní zasahování do náboženských záležitostí" # todo: NEW TRANSLATION
 outraged_over_favouritism: "Rozhořčení kvůli protežování" # todo: NEW TRANSLATION
 outraged_over_power_sharing: "Nespokojivé sdílení moci" # todo: NEW TRANSLATION
 communal_divides_events.6.t: "Bez hlasu, bez práv" # todo: NEW TRANSLATION
 communal_divides_events.6.d: "Ačkoliv populace [SCOPE.sState('relevant_state').GetCityHubName] v [SCOPE.sState('relevant_state').GetName] má hinduistickou většinu, většina správců jsou muslimové. To vyvolalo protesty hinduistů, kteří cítí, že jsou jejich potřeby ignorovány." # todo: NEW TRANSLATION
 communal_divides_events.6.f: "\"Nepochybujeme, že většina muslimů to myslí dobře,\" řekl starý bráhmanský kněz davu. \"Ale při Bakri Eid někteří lidé obětovali kozu nedaleko mého chrámu a pak ji snědli, když procházeli před našimi prahy! Pokusil jsem se obrátit na úřady, ale jen se mi vysmáli.\" \n\nNež kněz mohl pokračovat, jiný muž promluvil: \"Pokud je to pravda, kde ti muži jsou? Kdo řekne, že nelžete jen proto, abyste poškodil jméno muslimů?\" \n\nA než vůdci cokoliv rozhodli, tisíc hlasů začalo křičet a nastalo zmatek." # todo: NEW TRANSLATION
 communal_divides_events.6.a: "Vytvořte při náboru do státní správy proporcionální zastoupení." # todo: NEW TRANSLATION
 communal_divides_events.6.b: "Segregujte oblasti jako výhradně muslimské nebo hinduistické." # todo: NEW TRANSLATION
 communal_divides_events.6.c: "Možná když budou Hindové vládnout, budou se v hinduistických oblastech cítit bezpečněji." # todo: NEW TRANSLATION
 losing_grip_over_urban_administrations: "Ztráta kontroly nad městskou správou" # todo: NEW TRANSLATION
 unsatisfactory_compromises_over_city_administrations: "Nespokojivé kompromisy v městské správě" # todo: NEW TRANSLATION
 upended_urban_administrations: "Naruby obrácená tradiční městská správa" # todo: NEW TRANSLATION
