 je_indian_famines_button_relief_kitchens: "Zřídit nouzové kuchyně" # todo: NEW TRANSLATION
 je_indian_famines_button_relief_kitchens_desc: "I když nákladné, logickou a možná nejúčinnější metodou boje proti hladomoru je jednoduše nakrmit hladovějící.\n\nTakové výdaje nás však pravděpodobně nezískají pro blaho u pánů pokladny a efektivita jakýchkoli záchranných opatření bude omezena státní kapacitou a místní infrastrukturou.\n\n#bold Železnice#!\nPřítomnost [GetBuildingType('building_railway').GetName] v [concept_famine] postižených [Concept('concept_state','$concept_states$')] zdvojnásobí účinky tohoto opatření." # todo: NEW TRANSLATION
 je_indian_famines_button_relief_kitchens_tt: "Nepoužito #bold $je_indian_famines_button_relief_kitchens$#! rozhodnutí v posledním #bold roce#!" # todo: NEW TRANSLATION
