 relief_kitchens_modifier: "Nouzové kuchyně" # todo: NEW TRANSLATION
 modifier_prisoner_murder_covered_up: "Zatajení vraždy vězně" # todo: NEW TRANSLATION
 indian_famines.1.t: "Nic nezbývá" # todo: NEW TRANSLATION
 indian_famines.1.d: "[SCOPE.sState('indian_famine_state_scope').GetName] je v zoufalém stavu a letos nemá dost obilí, aby se uživil, natož zaplatil daně. Samozřejmě má nějaké zásoby z předchozích let, které momentálně používá k nakrmení hladových." # todo: NEW TRANSLATION
 indian_famines.1.f: "Výběrčí daní podezíravě pozoroval farmáře. Všichni k němu přišli jako skupina, ruce sepjaté jako při žebrání. Obvykle by jejich prosby o úlevu z daní odmítl. Každý rok byl těžký, když farmáři mluvili.\n\nTentokrát však na cestě viděl mrtvé krávy a bezplodná pole. I kdyby měli nějaké zásoby, patrně jim nevydrží celý rok. A od koho pak vybere svou daň?" # todo: NEW TRANSLATION
 indian_famines.1.a: "Smlouva je smlouva. [SCOPE.sState('indian_famine_state_scope').GetName] musí zaplatit daně v plné výši." # todo: NEW TRANSLATION
 indian_famines.1.b: "Stát může během hladomoru platit snížené daně." # todo: NEW TRANSLATION
 indian_famines.1.c: "Snad si zapamatují tento čin laskavosti. Odpusťme daně a poskytněme potravinovou pomoc." # todo: NEW TRANSLATION
 not_recently_had_war: "[SCOPE.GetRootScope.GetCountry.GetName] byl alespoň #variable 5#! let v míru." # todo: NEW TRANSLATION
 reduced_taxation_due_to_famine: "Snížené zdanění" # todo: NEW TRANSLATION
 no_taxation_due_to_famine: "Daňové osvobození a pomoc při hladomoru" # todo: NEW TRANSLATION
 famine_relief_aid_costs: "Místní programy pomoci při hladomoru" # todo: NEW TRANSLATION
 indian_famines.2.t: "Penězi se najíst nedá" # todo: NEW TRANSLATION
 indian_famines.2.d: "Tváří v tvář hladomoru v [SCOPE.sState('indian_famine_state_scope').GetName] předložil [SCOPE.sCharacter('hunger_strike_agitator_scope').GetFullName] petici žádající, aby [SCOPE.GetRootScope.GetCountry.GetName] umožnil farmářům pěstovat potravinové plodiny místo plodin na vývoz." # todo: NEW TRANSLATION
 indian_famines.2.f: "Stařec-farmář se díval na [SCOPE.sCharacter('hunger_strike_agitator_scope').GetLastNameNoFormatting] s úctou, která důstojníka znepokojovala. Zapálení následovníci jsou nebezpeční a těžko krotitelní. Bylo dobře, že teď jen podávali petici, ale co se stane, až místo trávy začnou šlehat srpy do masa?" # todo: NEW TRANSLATION
 indian_famines.2.a: "Rozumná žádost. Umožněme vybraným farmářům změnit plodiny." # todo: NEW TRANSLATION
 indian_famines.2.b: "Na světě může pěstovat pšenici každý. Pro nás sem přišli kvůli indigu a bavlně." # todo: NEW TRANSLATION
 temporary_switch_to_food_crops: "Povolení pěstování potravinových plodin" # todo: NEW TRANSLATION
 bowed_to_food_crop_demands: "Umožněny snížení pěstování plodin na vývoz" # todo: NEW TRANSLATION
 indian_famines.2.tt: "Následující bude platit pro každý #bold indický#! [concept_state], který trpí [concept_famine]:" # todo: NEW TRANSLATION
 following_applied_to_every_owned_state: "Následující bude platit pro každý vlastněný [concept_state]:" # todo: NEW TRANSLATION
 indian_famines.3.t: "Půst proti hladu" # todo: NEW TRANSLATION
 indian_famines.3.d: "[SCOPE.sCharacter('hunger_strike_agitator_scope').GetFullName] zahájil hladovku až do smrti, aby přesvědčil [SCOPE.GetRootScope.GetCountry.GetName] umožnit nahrazení plodin na vývoz potravinářskými plodinami." # todo: NEW TRANSLATION
 indian_famines.3.f: "Když guvernér-generál procházel svou pracovnou, jeho tajemník se nemohl ubránit úsměvu. Generál velel armádě tisíců, a přesto jeho největší hrozba byl lačnící muž. Když ten zemře, budou následky strašné. Když přežije, bude je znovu a znovu zastrašovat. Jen život králů a královen měl takovou váhu. Jak jim mohl jednoduchý muž nabýt takové moci?" # todo: NEW TRANSLATION
 indian_famines.3.a: "Možná by farmáři mohli také držet hladovku." # todo: NEW TRANSLATION
 indian_famines.3.b: "Najděme kompromis." # todo: NEW TRANSLATION
 bowed_to_hunger_strike: "Podvolili se hladovce" # todo: NEW TRANSLATION
 food_crop_system_modifier: "Snížení plodin na vývoz" # todo: NEW TRANSLATION
 indian_famines.4.t: "Nápor lidí" # todo: NEW TRANSLATION
 indian_famines.4.d: "Hladomor v [SCOPE.sState('indian_famine_state_scope').GetName] nechal mnoho lidí bez prostředků. Aby se uživili, zoufalí farmáři z [SCOPE.sState('indian_famine_state_scope').GetFarmHubName] došli až do [SCOPE.sState('indian_famine_state_scope').GetCityHubName]. Čekají u městských bran." # todo: NEW TRANSLATION
 indian_famines.4.f: "Dítě zívalo, unavené, hladové a ovzduší ve městě vonělo špatně. Ale otec mu řekl, že sem musí přijít, pokud chtějí, aby jeho sestra přežila do dvou let. Tak tu jsou po celém týdnu na cestě.\n\nA jednak tu neviděl žádné jídlo. Žádná pole k obdělávání. Jen velké cihlové domy, které vypadaly chladně, plné ještě chladnějších lidí. Jak to má pomoct Mámě a Didi?" # todo: NEW TRANSLATION
 indian_famines.4.a: "Město není místo pro farmáře." # todo: NEW TRANSLATION
 indian_famines.4.b: "Továrny a sklady by je mohly zaměstnat výměnou za snížené daně." # todo: NEW TRANSLATION
 kept_farmers_out_of_city_modifier: "Zatrženo: zoufalí farmáři mimo města" # todo: NEW TRANSLATION
 tax_breaks_for_warehouses: "Daňové úlevy pro sklady" # todo: NEW TRANSLATION
 allowed_farmers_into_cities: "Příliv zoufalých farmářů" # todo: NEW TRANSLATION
 je_communal_divides: "Meziskupinové rozpory" # todo: NEW TRANSLATION
 je_communal_divides_reason: ""#italic Je možné, že dvě národy — Mahomedáni a Hindové — mohou sedět na téže trůně a zůstat si rovnoprávné?\"#!\n\nDějiny #bold hindu-muslimských#! vztahů v Indii jsou bohaté a složité, s epizodami spolupráce i soužití propletenými s obdobími nesnášenlivosti a krutosti. Přesto po staletí tyto dvě komunity táhly za jeden provaz pod feudálními pány.\n\nS nástupem nových #bold národních identit#! a rostoucím šířením #bold etno-náboženského nacionalismu#! je však jasné, že staré pořádky musejí ustoupit novému. Málo kdo se shodne, jak by tyto nové cesty měly vypadat.\n\nNárod ve vnitřním sporu nemůže doufat v dlouhověkost. Jedním či druhým způsobem musí být dosaženo jednoty.\n\n#bold Teorie dvou národů#!\nZakládající se na víře, že ani muslimové ani hinduisté nemohou vládnout, aniž by utlačovali druhé, získává tzv. teorie dvou národů v posledních letech na přízni. Dokud bude aktivní #bold $je_communal_divides$#! [concept_journal_entry], bude přitažlivost #tooltippable #tooltip:religious_nationalist_groups_tt #bold nábožensky nacionalistických#!#!#! [Concept('concept_political_movement','$concept_political_movements$')] skupin zvýšena." # todo: NEW TRANSLATION
 je_communal_divides_goal_tt: "Provinční oblasti s muslimskou většinou v Indii získají autonomii v rámci konfederálního systému." # todo: NEW TRANSLATION
 create_indusstan_bangla_tt: "#tooltippable #tooltip:indusstan_tt #bold Indusstan#!#!#! a #tooltippable #tooltip:bengal_tt #bold Bengal#!#!#! budou zřízeny jako autonomní [Concept('concept_subject','$concept_subjects$')] v rámci [SCOPE.GetRootScope.GetCountry.GetName]" # todo: NEW TRANSLATION
 break_confederation_promise_tt: "#bold Konec konfederace#!\nPokud bychom zlomením slibu násilně reintegrovali #bold $dyn_c_indusstan_federation$#! nebo #bold $dyn_c_bengal_federation$#!, můžeme očekávat #bold masivní nepokoje#! ze strany našich muslimských [Concept('concept_pop','$concept_pops$')]." # todo: NEW TRANSLATION
 indusstan_tt: "Indusstan bude sestávat z [Concept('concept_state','$concept_states$')] $STATE_PUNJAB$, $STATE_SINDH$, $STATE_KASHMIR$, $STATE_PASHTUNISTAN$, $STATE_BALUCHISTAN$ a $STATE_QUETTA$." # todo: NEW TRANSLATION
 bengal_tt: "Bengal bude sestávat z [concept_state] $STATE_EAST_BENGAL$." # todo: NEW TRANSLATION
 confederacy_of_india: "Budeme vědět jako #bold $dyn_c_confederacy_of_india$#!" # todo: NEW TRANSLATION
 modifier_hightened_intercommunal_tension: "Zvýšené meziskupinové napětí" # todo: NEW TRANSLATION
 religious_nationalist_groups_tt: "#bold $movement_muslim_nationalist$#! a #bold $movement_hindu_nationalist$#! obdrží výrazné bonusy k přitažlivosti, dokud bude aktivní #bold $je_communal_divides$#! [concept_journal_entry]." # todo: NEW TRANSLATION
 granted_home_rule_tt: "Byla nám udělena #bold Domácí vláda#!" # todo: NEW TRANSLATION
 je_communal_divides_fail_tt: "[SCOPE.GetRootScope.GetCountry.GetName] nebo jeho [Concept('concept_subject','$concept_subjects$')] nemají žádný [Concept('concept_state','$concept_states$')] v [Concept('concept_state_region','$concept_state_regions$')] [SCOPE.sStateRegion('east_bengal_scope').GetName], [SCOPE.sStateRegion('punjab_scope').GetName], [SCOPE.sStateRegion('sindh_scope').GetName] a [SCOPE.sStateRegion('kashmir_scope').GetName]." # todo: NEW TRANSLATION
 hindu_nationalist_movement_below_25_tt: "[concept_activism] #v $movement_hindu_nationalist$#! je menší než #b 25%#!" # todo: NEW TRANSLATION
 muslim_nationalist_movement_below_25_tt: "[concept_activism] #v $movement_muslim_nationalist$#! je menší než #b 25%#!" # todo: NEW TRANSLATION
 hindu_nationalist_movement_above_50_tt: "[concept_activism] #v $movement_hindu_nationalist$#! je větší nebo rovno #b 50%#!" # todo: NEW TRANSLATION
 muslim_nationalist_movement_above_50_tt: "[concept_activism] #v $movement_muslim_nationalist$#! je větší nebo rovno #b 50%#!" # todo: NEW TRANSLATION
 hindu_nationalist_support_below_5_tt: "Identifikující [concept_pop] [Concept('concept_political_movement_support', '$concept_political_movement_support_short$')] #v $movement_hindu_nationalist$#! je menší než #b 5%#!" # todo: NEW TRANSLATION
 muslim_nationalist_support_below_5_tt: "Identifikující [concept_pop] [Concept('concept_political_movement_support', '$concept_political_movement_support_short$')] #v $movement_muslim_nationalist$#! je menší než #b 5%#!" # todo: NEW TRANSLATION
