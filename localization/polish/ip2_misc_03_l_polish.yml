 every_state_suffers_following_modifier: "Každý [concept_state], který trpí [concept_famine], obdrží následující modifikátor:\n(zlepšený přítomností [GetBuildingType('building_railway').GetName]):" # todo: NEW TRANSLATION
 je_indian_famines_button_work_camps: "Zřídit pracovní tábory" # todo: NEW TRANSLATION
 je_indian_famines_button_work_camps_desc: "Nevytvoříme třídu závislých na státním dole. Zřiďme pracovní tábory, kde si nejchudší mohou vydělat mzdu, aby si sami koupili jídlo.\n\n#bold Železnice#!\nPřítomnost [GetBuildingType('building_railway').GetName] v [concept_famine] postižených [Concept('concept_state','$concept_states$')] zdvojnásobí účinky tohoto opatření." # todo: NEW TRANSLATION
 work_camps_costs_modifier: "Organizace pracovních táborů" # todo: NEW TRANSLATION
 je_indian_famines_button_work_camps_tt: "Nepoužito #bold $je_indian_famines_button_work_camps$#! rozhodnutí v posledním #bold roce#!" # todo: NEW TRANSLATION
 work_camps_effect_modifier: "Základní pracovní tábory" # todo: NEW TRANSLATION
 improved_work_camps_effect_modifier: "Vylepšené pracovní tábory" # todo: NEW TRANSLATION
 je_indian_famines_button_epidemic_control: "Očkování a karanténní tábory" # todo: NEW TRANSLATION
 je_indian_famines_button_epidemic_control_desc: "I když hlad a podvýživa zůstávají hlavní příčinou, většina destitutu umírá kvůli nemocem jako mor a cholera.\n\nZavedením masových očkování a přísné karantény můžeme zmírnit některé nejhorší nárůsty mortality.\n\n#bold Železnice#!\nPřítomnost [GetBuildingType('building_railway').GetName] v [concept_famine] postižených [Concept('concept_state','$concept_states$')] zdvojnásobí účinky tohoto opatření." # todo: NEW TRANSLATION
