 sepoy_mutiny_events.1.t: "Ve jménu Pešvy" # todo: NEW TRANSLATION
 sepoy_mutiny_events.1.d: "Rodina Bhatů, vládnoucí jako dědiční předsedové vlády Maráthského impéria, byla po Chhatrapatím druhá co do prestiže a moci. Nyní přichází [SCOPE.sCharacter('nana_saheb_scope').GetFirstName], adoptivní syn posledního Pešvy, s mečem v ruce a slibem vyhnat Brity a obnovit Impérium." # todo: NEW TRANSLATION
 sepoy_mutiny_events.1.f: "Voják si odkašlal, ale nic to nevyhnulo knedlíku v krku. Jeho předkové byli trnem v oku Aurangzebovi. Mocná síla, kterou Chhatrapati vedl k osvobození před mughalskou tyranií.\n\nZdálo se však, že to vše bylo marné, neboť nyní se připravovali bojovat proti dalšímu zuřivému nepříteli. Učiní své předky hrdými, nebo jeho činy zaostanou? Myšlenka mu vyprchala z hlavy, když jeho kapitán zařval: 'VPŘED, POCHOD.'" # todo: NEW TRANSLATION
 sepoy_mutiny_events.1.a: "Veď nás k vítězství, Pešvo." # todo: NEW TRANSLATION
 sepoy_mutiny_events.1.b: "Na bitevním poli může sloužit [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle], nic víc." # todo: NEW TRANSLATION
 sepoy_mutiny_events.1.c: "Pošli ho pryč, věk Bhatových Pešvů je u konce." # todo: NEW TRANSLATION
 sepoy_mutiny_events.1.e: "Baji Rao stále žije — nabídněte post poslednímu právoplatnému Pešvovi." # todo: NEW TRANSLATION
 sepoy_mutiny_peshwa_power: "Legitimní Pešva" # todo: NEW TRANSLATION
 sepoy_mutiny_reinstated_peshwa: "Obnovení Bhatovi Pešvové" # todo: NEW TRANSLATION
 sepoy_mutiny_turned_away_peshwa: "Odmítnutý Nana Saheb" # todo: NEW TRANSLATION
 sepoy_mutiny_bhat_family_generals: "Bhatští velitelé" # todo: NEW TRANSLATION
 sepoy_mutiny_events.2.t: "Závěrečný úder" # todo: NEW TRANSLATION
 sepoy_mutiny_events.2.d: "Katastrofické vítězství indických vzbouřenců vyvolalo bouřlivé diskuse v kancelářích správy Společnosti. [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetLastName] musí nyní rozhodnout, zda Indii úplně opustit, nebo soustředit ubývající zdroje na udržení opěrného bodu na kontinentu." # todo: NEW TRANSLATION
 sepoy_mutiny_events.2.f: "Guvernér-generál přešel délku své pracovny sem a tam, stěny sotva zadržovaly jeho hněv. Jeho adjutant stál úplně nehybně. Nechtěl dopadnout jako obsah generálovy čajové tácky, rozprášený po mapě Indie.\n\nIndie, zlatá husa, kterou měli přivázanou za křídla, hlavu i ocásek, se na ně zhroutila a všechny jejich možnosti smrděly. Kdyby to bylo na něm, vzal by Kalkatu, jejich první oporu, a odešel zbytek. Na druhou stranu, Bombaj je stál mnoho a Madras má stále co nabídnout. Těžké rozhodnutí — BUM!\nAdjutant sebou trhl; generál vystřelil z pistole do zdi. Možná je čas podívat se, jestli pro generála nejsou další zprávy." # todo: NEW TRANSLATION
 sepoy_mutiny_events.2.a: "Indie je ztracena. Ať si Whitehall přetahuje naše zbývající aktiva." # todo: NEW TRANSLATION
 sepoy_mutiny_events.2.b: "Fort William nesmí padnout. Přesměrujte všechny síly do Kalkaty." # todo: NEW TRANSLATION
 sepoy_mutiny_events.2.c: "Vláda Společnosti bude pokračovat na jihu. Stáhněte se do Madrasu." # todo: NEW TRANSLATION
 sepoy_mutiny_events.2.e: "Bombaj drží! Nasměrujte všechny zbývající síly na Západ." # todo: NEW TRANSLATION
 india_retreat_to_bengal_tt: "Všechny [concept_subject] země mimo [GetGeographicRegion('geographic_region_bengal_old').GetName] [concept_georegion] se stanou nezávislými a jakékoliv [Concept('concept_state', '$concept_states$')] tam vlastněné budou mezi nimi rozděleny." # todo: NEW TRANSLATION
 india_retreat_to_bombay_tt: "Všechny [concept_subject] země mimo [GetGeographicRegion('geographic_region_bombay_old').GetName] [concept_georegion] se stanou nezávislými a jakékoliv [Concept('concept_state', '$concept_states$')] tam vlastněné budou mezi nimi rozděleny." # todo: NEW TRANSLATION
 india_retreat_to_madras_tt: "Všechny [concept_subject] země mimo [GetGeographicRegion('geographic_region_madras_old').GetName] [concept_georegion] se stanou nezávislými a jakékoliv [Concept('concept_state', '$concept_states$')] tam vlastněné budou mezi nimi rozděleny." # todo: NEW TRANSLATION
 sepoy_mutiny_events.3.t: "Vzpoura!" # todo: NEW TRANSLATION
 sepoy_mutiny_events.3.d: "Hranice trpělivosti byla překročena. V celé Indii sepoyové snesli své prapory a chopili se zbraní proti Společnosti. V doprovodu nespokojených místních všech vrstev uchvátili moc ve městech po celém kontinentu." # todo: NEW TRANSLATION
 sepoy_mutiny_events.3.f: "Když sepoy z Puny střílel na svého kapitána, muslimský hoch mu podal další náboje. Sikhský sepoy, vykrvácený ze svých ran, vše pozoroval. Co by řekli jejich předkové, kdyby je viděli bojovat spolu místo proti sobě? A když mu život vyprchal, napadla ho naléhavější myšlenka; co o jejich činech budou říkat jejich vnuci? Waheguru, budou pyšní? Zahanbení? A bude se to vůbec pamatovat?" # todo: NEW TRANSLATION
 sepoy_mutiny_events.3.a: "Mobilizujte všechny loajální jednotky. Zničte tyto povstalce." # todo: NEW TRANSLATION
 sepoy_mutiny_events.3.b: "[SCOPE.sCountry('mughals_scope').GetRuler.GetFirstName] Zindibad! Ať žije právoplatný císař!" # todo: NEW TRANSLATION
 sepoy_mutiny_events.3.c: "Har Har Mahadev! Vzbuzme prapor Chhatrapatiho!" # todo: NEW TRANSLATION
 sepoy_mutiny_events.3.e: "Vande Mataram! Vyžeňme Lal Patan z našich břehů!" # todo: NEW TRANSLATION
 sepoy_mutiny_events.3.g: "Khalsa Ji Di Sarkar! Sikhské impérium povstane znovu!" # todo: NEW TRANSLATION
 sepoy_mutiny_events.3.h: "Vpřed, očistíme Dekán od firangi more!" # todo: NEW TRANSLATION
 sepoy_mutiny_events.3.tt_1: "Indičtí rebelové vyhlásí [concept_war] proti [ROOT.GetCountry.GetName]" # todo: NEW TRANSLATION
 sepoy_mutiny_events.3.tt_2: "Následující bude platit pro všechny [Concept('concept_presidency', '$concept_presidencies$')], na základě jejich [Concept('concept_presidency_stability','$concept_presidency_stability_short$')]:\n• Indičtí rebelové převezmou kontrolu nad příslušnými [Concept('concept_state', '$concept_states$')]\n• Ve všech dotčených [Concept('concept_state', '$concept_states$')] budou přidány radikály a negativní [Concept('concept_modifier','$concept_modifiers$')]\n• Náhodná ne-kapitolní #building_barrack# bude zničena" # todo: NEW TRANSLATION
 sepoy_mutiny_events.4.t: "Indie v plamenech" # todo: NEW TRANSLATION
 sepoy_mutiny_events.4.d: "Sepoyové v službách [SCOPE.sCountry('eic_scope').GetName] se vzbouřili proti svým bývalým pánům a uvedli Britskou Indii do chaosu. Jestřábí členové [ROOT.GetCountry.GetAdjective] dvora hlasitě prosazují, abychom se přidali k rebelům, abychom společně vyhnali Brity z Indie." # todo: NEW TRANSLATION
 sepoy_mutiny_events.4.f: "Málo kdo rozumí břemeni koruny. I když každý v jeho dvoře argumentuje, princ ví, že očekávají jeho rozhodnutí. Mohou volat po válce nebo usilovat o mír, ale dělají to svobodně, protože vědí, že pokud to selže, mohou to vždy svalit na něj. A na koho by on mohl svalit vinu? Kdo ho uklidní, když leží vzhůru a slyší výkřiky vojáků, kteří zemřeli za jeho slib svobody?" # todo: NEW TRANSLATION
 sepoy_mutiny_events.4.a: "Společně vyženeme firangi do moře." # todo: NEW TRANSLATION
 sepoy_mutiny_events.4.b: "Složme věrnost císaři v Dillí." # todo: NEW TRANSLATION
 sepoy_mutiny_events.4.c: "Maráthové opět povstanou, vyvěste praporec Chhatrapatiho." # todo: NEW TRANSLATION
 sepoy_mutiny_events.4.e: "To je chyba. Potvrďme naši loajalitu Společnosti." # todo: NEW TRANSLATION
 sepoy_mutiny_events.6.t: "Záležitost chuti" # todo: NEW TRANSLATION
 sepoy_mutiny_events.6.d: "Od přijetí nového standardního mušketu Enfield si vojáci ve všech prezidentských armádách stěžují, že práškové náboje chutnají hrozně." # todo: NEW TRANSLATION
 sepoy_mutiny_events.6.f: "Jako podplukovník 13. pluku bengálské domorodé pěchoty jsem čelil dilema. Jako velitel pluku jsem očekával, že moji muži budou plnit rozkazy. Ale když jsem kousl do nové nábojnice, sotva jsem potlačil zvracení. Bude spravedlivé je trestat, když sám nemohu úkol zvládnout?" # todo: NEW TRANSLATION
 sepoy_mutiny_events.6.a: "Život vojáka je už tak dost těžký, zkoumejme zlepšení munice." # todo: NEW TRANSLATION
 sepoy_mutiny_events.6.b: "Když tohle nemohou vydržet, jak unesou zkoušky války?" # todo: NEW TRANSLATION
 sepoy_mutiny_cartridge_grease_exploration: "Experimenty s mazivem nábojnic" # todo: NEW TRANSLATION
 sepoy_mutiny_events.7.t: "Vkusné řešení" # todo: NEW TRANSLATION
 sepoy_mutiny_events.7.d: "Jako alternativu k mazivu používanému na nábojnice byl navržen včelí vosk. Troops jsou s touto změnou spokojeni. Někteří se ale ptají, co se vlastně změnilo." # todo: NEW TRANSLATION
 sepoy_mutiny_events.7.f: "Vojsko sedělo v kantýně té noci spokojené, že Společnost jim opatřila lepší nábojnice.\n\n\"Takže jestli ty nové nábojnice používají včelí vosk,\" zeptal se sepoy a žvýkal roti, \"co používaly ty staré?\"\n\n\"Co na tom záleží,\" odpověděl mladý sepoy, „dokud nevoní jako tvoje matka, zakousnu je.“" # todo: NEW TRANSLATION
 sepoy_mutiny_events.7.a: "Vysvětlete mužstvu, že včelí vosk nahradil továrně vyrobené mazivo." # todo: NEW TRANSLATION
 sepoy_mutiny_events.8.t: "První známky problémů" # todo: NEW TRANSLATION
 sepoy_mutiny_events.8.d: "V Bengálské prezidenské armádě se šíří zvěsti, že mazivo na nábojnicích je živočišného původu." # todo: NEW TRANSLATION
 sepoy_mutiny_events.8.f: "Mladý subedar celý večer nespal. Znovu zvracel, panika mu svírala břicho: 'Co když jsou ty zvěsti pravdivé? Opravdu jsem kousl do hovězího loje?'\nPodíval se na chrám naproti, 'Bude mě tam ještě vítat? Co moje manželka? Syn? Nebo není důvod k obavám, kapitán jim řekl, že je to jen chemie. Kapitán by jim nelhal!'" # todo: NEW TRANSLATION
 sepoy_mutiny_events.8.a: "Ujištěte vojáky, že nejde o živočišné tuky." # todo: NEW TRANSLATION
 sepoy_mutiny_events.8.b: "Navrhněte vojákům, aby kvůli chuti otvírali nábojnice rukama." # todo: NEW TRANSLATION
 sepoy_mutiny_timer_decrease_5_months: "Posuň časovač pro $je_uneasy_raj$ [concept_journal_entry] o #variable 5#! měsíců dopředu." # todo: NEW TRANSLATION
 sepoy_mutiny_alternative_cartridge_handling: "Alternativní manipulace s nábojnicemi" # todo: NEW TRANSLATION
 sepoy_mutiny_alternative_cartridge_debacle: "Podléhá požadavkům sepoyů" # todo: NEW TRANSLATION
 sepoy_mutiny_events.9.t: "Nepřekonatelný nepořádek" # todo: NEW TRANSLATION
 sepoy_mutiny_events.9.d: "Zvěsti zakořenily a někteří vojáci věří, že nábojnice byly, nebo jsou, pokusem o nucenou konverzi. Odmítají střílet během výcviku." # todo: NEW TRANSLATION
 sepoy_mutiny_events.9.f: "Kapitán měl obavy; byl si jistý, že ho při odchodu z kostela sledovali někteří vojáci ve volném čase. Táhlo se napětí nad táborem; domorodé regimenty se chovaly divně — porušovaly hodiny, držely se ve velkých skupinách, nosily pušky i ve volnu a někteří údajně odmítli plnit rozkazy.\n\nSpočítal ostatní britské důstojníky v táboře, bylo jich dost — vydrží, kdyby se domorodci vzbouřili? Nervózně se zasmál. Ne, kdyby k tomu došlo, byli by mrtví dřív, než stačí k pře-nabití." # todo: NEW TRANSLATION
 sepoy_mutiny_events.9.a: "Trestat vojáky těžkou prací." # todo: NEW TRANSLATION
 sepoy_mutiny_events.9.b: "Odstřihnout je ze služby, ale zbytek nechat pokračovat." # todo: NEW TRANSLATION
 sepoy_mutiny_breakdown_of_morale: "Úpadky kázně" # todo: NEW TRANSLATION
 sepoy_mutiny_loss_of_authority: "Zběsilé regimenty" # todo: NEW TRANSLATION
 sepoy_mutiny_events.10.t: "První domino padá" # todo: NEW TRANSLATION
 sepoy_mutiny_events.10.d: "Když se dozvěděli, že vojáci byli odsouzeni k těžké práci, sepoyové z jiných pluků přerušili řady a pokusili se osvobodit své spolubojovníky." # todo: NEW TRANSLATION
 sepoy_mutiny_events.10.f: "Garnizon Cawnpore.\nGenerálu [SCOPE.sCharacter('sepoy_general_scope').GetLastNameNoFormatting]\n\nNaléhavé.\n\nOkolo 50 sepoyů se zabarikádovalo v muničním skladišti a střílí na každého důstojníka, který se přiblíží. Problém začal o půlnoci, když se opili a napadli svého nadřízeného důstojníka. Ostatní regimenty byly odzbrojeny a požádány, aby zůstaly v kasárnách. Loajální z nich doporučují, že vzbouřenci hodlají osvobodit vojáky odsouzené k těžké práci.\n\nProsím, poraďte!" # todo: NEW TRANSLATION
 sepoy_mutiny_events.10.a: "Potrestat všechny účastníky." # todo: NEW TRANSLATION
 sepoy_mutiny_events.10.b: "Potrestat celé jednotky." # todo: NEW TRANSLATION
