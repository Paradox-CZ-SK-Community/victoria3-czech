 je_uneasy_raj_reason: "V třech [Concept('concept_presidency', '$concept_presidencies$')] [SCOPE.sCountry('raj_scope').GetName] roste neklid.\n\nZnepokojeni tvrdými [Concept('concept_taxes','$concept_taxation$')] režimy, rostoucím neuctěním místních zvyků a územní expanzí na úkor knížecích států, indický odpor vůči vládě Společnosti v posledních letech narůstal.\n\nJeště horší je, že nespokojenost je patrná i v pýchách domorodých sepoy regimentů, kteří nelibě nesou jakoukoliv výzvu ke svému tradičnímu postavení a privilegiím.\n\n#bold Sepoyské povstání#!\nPokud bude [Concept('concept_presidency_stability','$concept_presidency_stability_short$')] jakéhokoli $concept_presidency$ #bold medium#! ([GetPlayer.MakeScope.ScriptValue('uneasy_raj_stability_medium_upper_bound')]) nebo méně po #variable 100#! měsíců, propukne v Indii #tooltippable #tooltip:je_uneasy_raj_tt_4 #bold otevřené povstání#!#!#!. Aktuálně to platí již #variable [SCOPE.sCountry('raj_scope').MakeScope.Var('sepoy_mutiny_timer_var').GetValue]#! měsíců." # todo: NEW TRANSLATION
