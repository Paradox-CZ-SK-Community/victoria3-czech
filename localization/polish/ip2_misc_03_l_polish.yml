 je_indian_famines: "[ROOT.GetCountry.GetCustom('get_indian_famine_name')]" # todo: NEW TRANSLATION
 je_indian_famines_reason: "#italic \"Smrt a hlad na všech stranách, a nikdy známka deště\nKosti těch, kdo umřeli hladem, nezaprášené na rovině.\"#!\n\nVelké a hrozné neštěstí zasáhlo Indii. V důsledku série špatných sklizní a zhoršené obecné chudoby a špatného vládního řízení se situace zhoršila natolik, že v [ROOT.GetCountry.GetName] byl oficiálně vyhlášen hladomor.\n\nDokud #bold [ROOT.GetCountry.GetCustom('get_indian_famine_name')]#! přetrvává, můžeme očekávat #tooltippable #tooltip:je_indian_famines_tt #bold vyšší míry agitace#!#!#! ze strany sil nepřátelských naší vládě.\n\n#bold Hladomor v Indii#!\nVzhledem k silné závislosti na příznivých monzunových deštích pro zavlažování je velká část Indie zvláště zranitelná vůči suchům a dalším nepříznivým [Concept('concept_harvest_condition', '$concept_harvest_conditions$')]. Abychom to zmírnili, vnitřní kancelář doporučila, abychom #tooltippable #tooltip:je_indian_famines_tt_2 #bold zavlažovali vnitrozemské suché oblasti#!#!#!." # todo: NEW TRANSLATION
 je_indian_famines_tt: "Hladomor bude mít následující efekty, pokud se na ně vztahují, po dobu své existence:\n• #bold $je_uneasy_raj$#! [concept_journal_entry] bude negativně ovlivněn\n• #bold $je_india_home_rule$#! [concept_journal_entry] bude negativně ovlivněn" # todo: NEW TRANSLATION
 je_indian_famines_completion_tt: "[ROOT.GetCountry.GetName] už nebude trpět #tooltippable #tooltip:je_indian_famines_tt #bold vyššími mírami agitace#!#!#!" # todo: NEW TRANSLATION
