 je_uneasy_raj_tt_4: "Závažnost povstání bude určena [Concept('concept_presidency_stability','$concept_presidency_stability_short$')] každé z těchto tří [Concept('concept_presidency', '$concept_presidencies$')], pohybující se od menších nepokojů a defekcí až po úplný kolaps britské moci.\n\nKdyž povstání propukne, [Concept('concept_princely_state','$concept_princely_states$')] s #bold high#! [concept_liberty_desire] se přidají k rebelům, ty se #bold medium#! zůstanou neutrální a ty s #bold low#! budou aktivně bojovat na naší straně." # todo: NEW TRANSLATION
