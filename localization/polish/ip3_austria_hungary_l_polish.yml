 je_grunderzeit: "Gründerzeit" # todo: NEW TRANSLATION
 je_grunderzeit_reason: "Nástup #bold investičního šílenství#! zachvátil #bold německé#! země — kapitál proudí do železnic, továren a bank s horečnou intenzitou, poháněn bezbřehým optimismem, spekulativním apetitem a příslibem #bold nové průmyslové éry#!. Spekulanti s nadšením vsazují jmění na stále fantastičtější cíle. Jak dlouho může tato atmosféra euforie trvat?\n\nNěmecký [Concept('concept_gdp', '$concept_gdp_short$')], poslední čtvrtletní výsledek: @gdp!#variable [GetGlobalVariable('grunderzeit_combined_gdp_global_var_baseline').GetValue|K]#!\nNěmecký [Concept('concept_gdp', '$concept_gdp_short$')], aktuálně: @gdp![JournalEntry.GetCustom('get_grunderzeit_gdp')]\nNěmecký [Concept('concept_gdp', '$concept_gdp_short$')], čtvrtletní cíl: @gdp!#variable [GetGlobalVariable('grunderzeit_combined_gdp_global_var_goal').GetValue|K]#!\n\n#bold Tempo zakladatelských let#!\n#bold $je_grunderzeit$#! [concept_journal_entry] je organizován v #bold finančních čtvrtletích#!. Každé #v 3#! měsíce musí kombinovaný [Concept('concept_gdp', '$concept_gdp_short$')] všech #bold německých#! [Concept('concept_country', '$concept_countries$')|l] v #bold Evropě#! růst alespoň o #v 2#! procenta. Pokud se to nezdaří, #n dojde k úbytku#! na #bold ukazateli postupu#! o #v 1#!, pokud se podaří, #g vzroste#! o #v 1#! místo toho. Pokud ukazatel dosáhne #v 0#!, dojde k #n finančnímu krachu#!." # todo: NEW TRANSLATION
 je_grunderzeit_fail_tt: "Ukazatel #bold postupu#! dosáhl #v 0#!" # todo: NEW TRANSLATION
 grunderzeit_possible_tt: "#v 75%#! nebo více všech #bold německých#! [Concept('concept_country', '$concept_countries$')|l] v #bold Evropě#! vyvinulo [GetTechnology('mutual_funds').GetName] a má alespoň jednu úroveň [GetBuildingType('building_railway').GetName] (aktuálně [GetGlobalVariable('grunderzeit_countries_percent').GetValue|v%0])" # todo: NEW TRANSLATION
