 bavarocracy_fail_explanation_tt: "Konec bavarokracie nám umožní dosadit #b $DEN_ADJ$#! prince na trůn, přijatelný pro [Concept('concept_great_power', '$concept_great_powers$')|l], nebo založit #b Druhou helénskou republiku#!\n\n#b $FRA$#!, #b $GBR$#! nebo #b $RUS$#!, pokud nám dluží [concept_obligation], způsobí, že ignorují usnesení #b Londýnské konference z roku 1832#! a dovolí nám volit jednoho z jejich princů jako krále Hellenů.\n\nPotenciální zahraniční král přijde s následující [Concept('concept_ideology', '$concept_ideologies$')|l]:\n• $DEN_ADJ$: [GetIdeology('ideology_reformer').GetName]\n• $GBR_ADJ$: [GetIdeology('ideology_market_liberal').GetName]\n• $RUS_ADJ$: [GetIdeology('ideology_royalist').GetName]\n• $FRA_ADJ$ Orleanista: [GetIdeology('ideology_market_liberal').GetName]\n• $FRA_ADJ$ Legitimista: [GetIdeology('ideology_traditionalist').GetName]\n• $FRA_ADJ$ Bonapartist: [GetIdeology('ideology_jingoist_leader').GetName]" # todo: NEW TRANSLATION
 spooky_halloween_events.4.t: "Promethejské vize" # todo: NEW TRANSLATION
 spooky_halloween_events.4.d: "Mladý žižkovský student z Ženevy jménem [SCOPE.sCharacter('frankenstein_scope').GetFullName] přišel na vládu s peticí o skromný stipendií a pracovní místo. Na oplátku sebevědomě tvrdí, že prolomí samu hranici mezi životem a smrtí." # todo: NEW TRANSLATION
 spooky_halloween_events.4.f: "\"Jestli lze oživit neživou hmotu, mohl by někdo snad obnovit život tam, kde smrt zasáhla. Kolik z vás ztratilo někoho blízkého kvůli nemoci nebo kruté ruce člověka? Co kdyby to šlo vrátit? Nebo co kdyby vzniklo něco nového, co by nás uctívalo jako stvořitele a pána?\"" # todo: NEW TRANSLATION
 spooky_halloween_events.4.a: "Nejzajímavější. Informujte ho, že má naši podporu." # todo: NEW TRANSLATION
 spooky_halloween_events.4.b: "Pohrdat tímto nečistým šarlatánem a poslat ho do ústavu." # todo: NEW TRANSLATION
 spooky_halloween_events.4.tt_1: "[SCOPE.sCharacter('frankenstein_scope').GetFullName] je zavřen a už o něm neuslyšíme." # todo: NEW TRANSLATION
 spooky_halloween_events.4.tt_2: "[SCOPE.sCharacter('frankenstein_scope').GetFullName] uteče, dříve než za ním dorazí stráže." # todo: NEW TRANSLATION
 spooky_halloween_events.4.tt_3: "Plody panovy [SCOPE.sCharacter('frankenstein_scope').GetLastName] výzkumu se nám časem odhalí." # todo: NEW TRANSLATION
 modifier_ungodly_experiments: "Nevhodné experimenty" # todo: NEW TRANSLATION
 modifier_experiment_expenses: "Financování nekonvenčního výzkumu" # todo: NEW TRANSLATION
 spooky_halloween_events.5.t: "Bůh a stroj" # todo: NEW TRANSLATION
 spooky_halloween_events.5.d: "Výzkum [SCOPE.sCharacter('frankenstein_scope').GetFullName] přinesl ovoce. S viditelným znepokojením načrtl své metody shromážděným důstojníkům a tvrdí, že je připraven rozšířit provoz. Jako důkaz předvádí své první dílo." # todo: NEW TRANSLATION
 spooky_halloween_events.5.f: "Masivní tvor se vešel dovnitř, jeho pohyby trhané a křečovité, jako by se učil používat končetiny poprvé, přesto s vodnatýma, zvědavýma očima, téměř jako oči dítěte.\n\n\"Ve jménu Boha! Co to #italic je#! tohle?\"\n\n\"To, pánové, je budoucnost. #italic homo novus#! v tom nejdoslovnějším smyslu.\"" # todo: NEW TRANSLATION
 spooky_halloween_events.5.a: "Jsem si jistý, že pro takové stvoření najdeme využití... kvality." # todo: NEW TRANSLATION
 spooky_halloween_events.5.b: "Dobře, ale tomu bídákovi dejte společníka." # todo: NEW TRANSLATION
 spooky_halloween_events.5.c: "To šlo příliš daleko. Všechno okamžitě zastavit!" # todo: NEW TRANSLATION
 spooky_halloween_events.5.tt_1: "Umožňuje založení #b $company_ingolstadt_electrical_company$#! jako [concept_company]" # todo: NEW TRANSLATION
 modifier_frankenstein_1: "Nadlidské schopnosti" # todo: NEW TRANSLATION
 modifier_frankenstein_2: "Znepokojivý obr" # todo: NEW TRANSLATION
 modifier_frankenstein_3: "Zrychlený intelektuální růst" # todo: NEW TRANSLATION
 adam_1_alive_tt: "[SCOPE.sCharacter('adam_1_scope').GetFullName] je #b naživu#!! Je #italic #b naživu#!#!!" # todo: NEW TRANSLATION
 adam_2_alive_tt: "[SCOPE.sCharacter('adam_2_scope').GetFullName] je #b naživu#!! Je to #italic #b naživo#!#!!" # todo: NEW TRANSLATION
 spooky_halloween_events.6.t: "Ecce Monstrum" # todo: NEW TRANSLATION
 spooky_halloween_events.6.d: "Vyplašeni rostoucí přítomností [GetCulture('promethean').GetName] v [SCOPE.sState('relevant_state_scope').GetName] se rozběhl zuřivý dav ulicemi [SCOPE.sState('relevant_state_scope').GetCityHubName]. [SCOPE.sCompany('frankenstein_company_scope').GetName] odmítla situaci komentovat." # todo: NEW TRANSLATION
 spooky_halloween_events.6.f: "Dav obklíčil stvoření u staré fontány, kruh pochodní a vidlí vytvořil hrozivou zeď a uhranuté vysoké bledé postavy sevřel uprostřed.\n\n\"Zabijte ho! Srazte toho monstra!\"\n\n\"Monster? Jak se opovažujete nazvat mě monstrem, vy, kteří pronásledujete mé druhy bez důvodu a bez slitování? Jakou škodu jsme vám kdy způsobili nevyprovokovaně? Zvednete ruku proti mně a já vás zasáhnu, ale to mě nedělá více ničitelem než člověka, který se brání před krutým útokem.\"" # todo: NEW TRANSLATION
 spooky_halloween_events.6.a: "Dav je dav." # todo: NEW TRANSLATION
 spooky_halloween_events.6.b: "[SCOPE.sCharacter('frankenstein_executive_scope').GetFullName] a [SCOPE.sCharacter('frankenstein_executive_scope').GetHerHis] společnost musí nést odpovědnost." # todo: NEW TRANSLATION
