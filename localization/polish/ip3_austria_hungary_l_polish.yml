 notification_hungarian_king_elected_from_our_country_desc: "V nedávném hlasování zvolil [SCOPE.sCountry('hungary_scope').GetAdjective] sněm [ROOT.GetCountry.GetAdjective] prince jako [SCOPE.sCountry('hungary_scope').GetPrimaryRoleTitle], který nyní bude vládnout zemi jako [SCOPE.sCountry('hungary_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('hungary_scope').GetRuler.GetFullName]" # todo: NEW TRANSLATION
