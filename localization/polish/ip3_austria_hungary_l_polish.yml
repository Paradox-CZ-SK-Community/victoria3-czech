 je_bavarocracy_convert_button_desc: "I když je [ROOT.GetCountry.GetName] pevně [GetReligion('orthodox').GetName] zemí, [SCOPE.sCharacter('king_otto_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('king_otto_scope').GetFirstName] pevně lpí na své rodné [GetReligion('catholic').GetName] víře, což budí značné rozhořčení mezi jeho novými poddanými.\n\nPokud má Othonova vláda přetrvat mezi Řeky, možná bude třeba některých osobních obětí?" # todo: NEW TRANSLATION
