 austrian_neo_absolutism_abolish_crown_land_autonomy_button_desc: "Tradičně autonomní #italic Landtage#! představují jednu z největších překážek našich snah vynutit přímou vládu z [ROOT.GetCountry.GetCapital.GetCityHubName]. Musíme je zbavit zákonodárných pravomocí a redukovat je na nic víc než administrativní orgány pod přímým císařským dohledem." # todo: NEW TRANSLATION
 modifier_bureaucratisation_of_the_landtage: "Byrokratizace Landtagů" # todo: NEW TRANSLATION
 austrian_neo_absolutism_abolish_feudal_obligations_button: "Zrušit feudální povinnosti" # todo: NEW TRANSLATION
 austrian_neo_absolutism_abolish_feudal_obligations_button_desc: "Patent o nevolnictví z roku 1781 osvobodil rakouské sedláky od vázanosti na půdu, přesto zůstávají povinni vykonávat #italic robot#! (robota), platit feudální dávky a podléhat panskému soudnictví.\n\nZrušení těchto archaických povinností by sice získalo přízeň reformátorů, ale mohlo by také vyvolat hněv pozemkové šlechty, která by z návrhu ztratila bohatství i vliv." # todo: NEW TRANSLATION
 modifier_empowered_smallholders: "Zmocnění Großbauerů" # todo: NEW TRANSLATION
 modifier_bureaucratisation_of_nobles: "Zvýšená byrokratizace šlechty" # todo: NEW TRANSLATION
 austrian_neo_absolutism_papal_concordat_button: "Přijmout papežský konkordát" # todo: NEW TRANSLATION
 austrian_neo_absolutism_papal_concordat_button_desc: "Svými bezhlavými reformami josefinisté a liberálové podkopali samotné základy naší velké říše: naši neochvějnou víru a loajalitu k Stolci sv. Petra.\n\nMusíme napravit škody, které způsobili, a dosáhnout dohody s Církví, která zajistí její přítomnost na všech úrovních společnosti — od učeben až po svátost manželství." # todo: NEW TRANSLATION
