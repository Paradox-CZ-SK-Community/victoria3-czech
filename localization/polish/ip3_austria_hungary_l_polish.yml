 grunderzeit.1.t: "Gründerkrach" # todo: NEW TRANSLATION
 grunderzeit.1.d: "Léta optimismu a ekonomického růstu se náhle zastavila, s krvavě červenými čísly hlášenými na německých burzách, když banky a spekulativní společnosti padaly jako domino." # todo: NEW TRANSLATION
 grunderzeit.1.f: "#bold Bankovní run v [ROOT.GetCountry.GetCapital.GetCityHubName]#!\nOznámení likvidace řady prominentních firem spustilo lavinu, která smetla nejen malé investory, ale i známé finančníky. Po celý den kurýři šíleli mezi davy a obchodníci pálili bezcenné akciové certifikáty." # todo: NEW TRANSLATION
 grunderzeit.1.a: "Za to může spekulace a nekontrolovaný ekonomický liberalismus." # todo: NEW TRANSLATION
 grunderzeit.1.b: "To je dílo dravých agentů mezi námi." # todo: NEW TRANSLATION
 modifier_grunderkrach_blame_minorities: "Finanční konspirační teorie" # todo: NEW TRANSLATION
 modifier_grunderkrach_blame_free_trade: "Volný obchod zdiskreditován" # todo: NEW TRANSLATION
 modifier_grunderkrach_blame_minorities_ig_boost: "Šíření antisemitické literatury" # todo: NEW TRANSLATION
 modifier_grunderkrach: "Krize Gründerzeit" # todo: NEW TRANSLATION
