 bavarocracy_events.2.d: "Unaveni bavorskou klikou vypuklo v [ROOT.GetCountry.GetCapital.GetCityHubName] lidové povstání a svrhla [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName], naposledy spatřeného nastupovat na cizí koráb směřující na sever. S odchodem starého [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] byla lidem nabídnuta volba nového panovníka." # todo: NEW TRANSLATION
 bavarocracy_events.2.f: "\"Žádné tištěné hlasovací lístky? To je snad vtip?\"\n\n\"Ne, pane. Jméno člověka, kterého chcete na trůně, jednoduše napište a odevzdejte mi ho do hodiny.\"" # todo: NEW TRANSLATION
