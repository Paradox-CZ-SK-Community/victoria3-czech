 grunderzeit.2.t: "Třicet let pokroku" # todo: NEW TRANSLATION
 grunderzeit.2.d: "Po desetiletích ekonomické prosperity se intenzita a aktivita, které je definovaly, poněkud zmírnily. Tyto roky vstoupí do [ROOT.GetCountry.GetAdjective] historie jako jedny z nejvznešenějších." # todo: NEW TRANSLATION
 grunderzeit.2.f: "\"A oni tomu říkali bublina, pah! Bublina!? Pouze #italic hlupák#! by investoval dědictví své manželky do něčeho takového, a řeknu vám jednu věc, #italic liebchen#!, já nejsem hlupák.\"" # todo: NEW TRANSLATION
 grunderzeit.2.a: "Na zdraví nepřemožitelného podnikatelského ducha!" # todo: NEW TRANSLATION
 grunderzeit.2.b: "Kéž jsou tato desetiletí jen začátkem mnoha dalších." # todo: NEW TRANSLATION
 modifier_grunderyears_success: "Duch slavného třicetiletí" # todo: NEW TRANSLATION
 modifier_grunderyears_success_2: "Lesk slavného třicetiletí" # todo: NEW TRANSLATION
