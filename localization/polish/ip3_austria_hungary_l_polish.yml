 je_matter_of_hungary_on_fail_lose_control: "Veškerá zbývající území v Uhrách pod kontrolou [ROOT.GetCountry.GetName] nebo jejích [Concept('concept_subject','$concept_subjects$')|l] #bold odtrhnou se#!. Nacionalističtí povstalci vstoupí do vzpoury v našich negermánských zemích." # todo: NEW TRANSLATION
 hungarian_above_80_acceptance_for_a_while_tt: "Průměrné [concept_acceptance] [GetCulture('hungarian').GetName] [Concept('concept_pop', '$concept_pops$')|l] v [ROOT.GetCountry.GetNameNoFlag] byl větší nebo roven #v 80#! po dobu #b 60 měsíců#! (aktuálně [ROOT.GetCountry.MakeScope.Var('hungarian_acceptance_var').GetValue|v0])" # todo: NEW TRANSLATION
 hungarian_movements_pacified_tt: "Žádný [GetCulture('hungarian').GetName] #v $movement_cultural_minority$#! nemá [Concept('concept_activism','$concept_activism_short$')|l] $RADICALISM_AGITATING$ (#v 25%#!) nebo více" # todo: NEW TRANSLATION
 je_austrian_neo_absolutism: "Autokracie v éře svobody" # todo: NEW TRANSLATION
 je_austrian_neo_absolutism_reason: "#italic \"Pilíře bachiánského systému spočívají na jeho čtyřech armádách: stálé armádě vojáků, sedící armádě úředníků, klečící armádě kněží a plazivé armádě udavačů.\" #!\n\nHrozba revoluce zdola vynutila, aby [ROOT.GetCountry.GetCapital.GetCityHubName] provedla vlastní revoluci shora. Vytvořením centralizovaného, racionálního a efektivního státního aparátu — obsazeného loajálními a schopnými byrokraty — bude země modernizována, aby čelila výzvám této doby.\n\n[concept_austrian_constitutional_pressure]:\nPokud opozice proti rakouskému neoabsolutistickému projektu zesílí příliš, bude [ROOT.GetCountry.GetCapital.GetCityHubName] nuceno ustoupit požadavkům na reformu a udělit ústavu omezující pravomoci státu." # todo: NEW TRANSLATION
