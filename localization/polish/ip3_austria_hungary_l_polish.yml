 bavarocracy_events.1.t: "Civilizující král Hellenů" # todo: NEW TRANSLATION
 bavarocracy_events.1.d: "Úspěšně navedl zemi skrze její bouřlivé rané roky, a [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] se nyní etabloval jako schopný státník v čele stabilní vlády." # todo: NEW TRANSLATION
 bavarocracy_events.1.f: "Popíjí svůj kávu, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstNameNoFormatting] pročítá ranní korespondenci. Hlásí pohraniční banditismus, korupční skandály a frakční spory — jak to bývá. Mezi nudnými zprávami však vyčnívaly náznaky změny. Efekty nedávných policejních reforem, založení institucí intelektu a nervky moderní byrokracie. Mnoho práce ještě zůstává, ale rok od roku se práce [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] stává o něco příjemnější." # todo: NEW TRANSLATION
