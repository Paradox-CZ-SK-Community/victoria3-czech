 je_bavarocracy: "Bavarokracie" # todo: NEW TRANSLATION
 je_bavarocracy_reason: "Od svého vzniku v roce 1832 je vzpínající se [ROOT.GetCountry.GetAdjective] království — první skutečně nezávislý řecký stát od dob Konstantina XI. — pod nadvládou [SCOPE.sCharacter('king_otto_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('king_otto_scope').GetFirstName] a jeho bavorských regentů.\n\nPokud se chce mladý král ukázat jako hoden vlády nad Helleny, bude muset podniknout odvážné kroky k zmírnění [Concept('concept_bavarocratic_ire', '$concept_bavarocratic_ire_short$')|l] svých nových poddaných." # todo: NEW TRANSLATION
