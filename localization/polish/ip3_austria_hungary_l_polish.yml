 modifier_autumn_campaign: "Vpřed, honvédi!" # todo: NEW TRANSLATION
 hungary_events.8.t: "Transylvánské povstání" # todo: NEW TRANSLATION
 hungary_events.8.d: "Hluboce nespokojeni se sjednocením Transylvánie a [SCOPE.sCountry('hungary_country_scope').GetName], tisíce [GetCulture('romanian').GetName] notabilů a prostých lidu se shromáždily v Blaji a vyhlásily úmysl vzít zbraně proti [SCOPE.sCountry('hungary_country_scope').GetCapital.GetCityHubName]." # todo: NEW TRANSLATION
 hungary_events.8.f: "Mihai vyndal ze svého kabátu malé polní kukátko a upravil čočku. Ze svého stanoviště na Kopci vinic viděl velké množství mužů shromážděných v okolí města. Tisíce, alespoň, a podle krojů pocházející ze všech koutů Transylvánie a dál.\n\nZvuk praskající větve přerušil jeho pozorování. Kroky? Když se ohlédl, žádní z těch #-italic moți#! rváčů, kteří mu ten den dělali problémy, nebyli v dohledu. Ti parchanti by nedokázali přepadnout ani chromou prasnici, pomyslel si, když palice dopadla a rozdělila mu lebku." # todo: NEW TRANSLATION
 hungary_events.8.a: "Prokletí těch zrádců. Poslat armádu." # todo: NEW TRANSLATION
 hungary_events.8.b: "Libertate sau Moarte!" # todo: NEW TRANSLATION
 hungary_events.8.c: "Potvrdit Transylvánii jako autonomní korunovou zemi." # todo: NEW TRANSLATION
 hungary_events.8.e: "Naše ruka nebude donucena bandou povstalců." # todo: NEW TRANSLATION
 modifier_auraria_gemina_legion: "Legie Auraria Gemina" # todo: NEW TRANSLATION
 transylvanian_massacres_tt: "Jak #bold řád padá#!, zprávy o #n masakrech#! spáchaných putujícími bandami rolníků a vojáků se šíří napříč #bold Transylvánií#!" # todo: NEW TRANSLATION
 hungary_events.9.t: "Maďarské jaro" # todo: NEW TRANSLATION
 hungary_events.9.d: "V šokujícím kroku prosazoval progresivisty ovládaný sněm [SCOPE.sCountry('hungary_country_scope').GetName] řadu zákonů, jejichž radikální povaha ohrožuje naši nadvládu nad národem." # todo: NEW TRANSLATION
 hungary_events.9.f: "Detaily zpráv z [SCOPE.sCountry('hungary_country_scope').GetCapital.GetCityHubName] se lišily stejně tak jako reakce těch, kdo je přijímali. Velký skok kupředu k liberální budoucnosti, nebo klopýtnutí do chaosu a anarchie? Akt zrady, nebo inspirace pro zbytek Říše? Vznešené prohlášení, nebo zbabělý úder do zad?\n\nSám nevěděl, ale bál se, že reakce Hofburgu nebude přívětivá." # todo: NEW TRANSLATION
 hungary_events.9.a: "Máme důležitější záležitosti." # todo: NEW TRANSLATION
 hungary_events.9.b: "Prohlásit zákony nelegální a požadovat jejich okamžité zrušení." # todo: NEW TRANSLATION
 hungary_events.11.t: "Záležitost Uherska" # todo: NEW TRANSLATION
 hungary_events.11.d: "S nastupem [ROOT.GetCountry.GetRuler.GetFullName] jako [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetHerHis] předchůdcova vnímaná laxnost vůči [SCOPE.sCountry('hungary_country_scope').GetName] byla zpochybněna. Mnozí nyní naléhají na nového [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle], aby zrušil nedávné zákony přijaté uherským sněmem." # todo: NEW TRANSLATION
 hungary_events.11.f: "Je souhlas dáný pod nátlakem skutečným souhlasem?\nJe panovník vázán pošetilými sliby svého předchůdce?\nJe vázán zákony přijatými bez řádné císařské autority?\n\nV očích [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstNameNoFormatting] to nebyly vůbec skutečné záhady. Jediná otázka byla: jak daleko je ochoten zajít, aby svou vizi uskutečnil?" # todo: NEW TRANSLATION
 hungary_events.11.a: "Zrušit zákony a formálně zrušit uherský sněm." # todo: NEW TRANSLATION
 hungary_events.11.b: "Nechme loď plout v klidu." # todo: NEW TRANSLATION
 hungary_events.12.t: "Země zemí" # todo: NEW TRANSLATION
 hungary_events.12.d: "Revoluce [ROOT.GetCountry.GetAdjective] byla ohromným úspěchem, přičemž dopad jejích ekonomických a politických reforem je cítit po celé zemi." # todo: NEW TRANSLATION
 hungary_events.12.f: "Zde vlála krevně zašpiněná vlajka Svobody\nnad maďarskou hlavou;\na zde v dlouhých bojích padli\nnaši nejstatečnější a nejušlechtilejší, mrtví.\n\nNavzdory dlouhému neštěstí\na staletým bojům,\nnaše síla, ač oslabená, není vyčerpána;\nnaše země stále žije.\n\n— #italic Szózat#!, Mihály Vörösmarty" # todo: NEW TRANSLATION
 hungary_events.12.a: "Ať žije maďarská svoboda!" # todo: NEW TRANSLATION
 hungary_events.12.b: "Ať žije vlast!" # todo: NEW TRANSLATION
 increased_chance_of_liberal_leaders_tt: "Všechny [Concept('concept_interest_group', '$concept_interest_groups$')|l] budou mít vyšší šanci vytvořit liberální a radikální [Concept('concept_leader', '$concept_leaders$')|l]." # todo: NEW TRANSLATION
 modifier_efficient_magyarization: "Komplexní maďarizace" # todo: NEW TRANSLATION
 modifier_hungarian_radicalism: "Vlast svobody" # todo: NEW TRANSLATION
 modifier_a_liberal_century: "Revoluce ospravedlněna" # todo: NEW TRANSLATION
 hungary_events.13.t: "Koruna sv. Štěpána" # todo: NEW TRANSLATION
 hungary_events.13.d: "S upevněním [ROOT.GetCountry.GetAdjective] nezávislosti a koncem mandátu prozatímní vlády pod [ROOT.GetCountry.GetRuler.GetFullName] nastal čas, aby sněm definitivně vyřešil postavení monarchie." # todo: NEW TRANSLATION
 hungary_events.13.f: "Co se stane s prázdným Trůnem sv. Štěpána? Debata zuřila odpoledne a rada se sotva přiblížila rozhodnutí. Pragmatičtí monarchisté, horliví republikáni a všichni možné Francouzi-, Anglo- a Rusofilové se několik dní přetahovali v novinových článcích, ostrých výměnách a v nejméně jednom případě i osobně.\n\nJak se pragmatické smýšlení začalo propojovat přes dřívější linie, hranice se rozostřily a vznikly nové aliance. A ke konci závěrečného projednávání bylo učiněno rozhodnutí." # todo: NEW TRANSLATION
 hungary_events.13.a: "Habsburkové už ne. Uhry budou [GetLawType('law_presidential_republic').GetName]." # todo: NEW TRANSLATION
 hungary_events.13.b: "Magyarský šlechtic usedne na trůn." # todo: NEW TRANSLATION
 hungary_events.13.c: "Pozvat [SCOPE.sCountry('russia_scope').GetAdjective] [SCOPE.sCountry('russia_scope').GetRuler.GetLastNameNoFormatting] do [ROOT.GetCountry.GetCapital.GetCityHubName]." # todo: NEW TRANSLATION
 hungary_events.13.e: "Dobrý vztah s [SCOPE.sCountry('britain_scope').GetName] je priorita." # todo: NEW TRANSLATION
 hungary_events.13.g: "Na trůn nastoupí [SCOPE.sCountry('france_scope').GetAdjective] princ." # todo: NEW TRANSLATION
