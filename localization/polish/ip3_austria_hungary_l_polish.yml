 matter_of_hungary_dual_monarchy_button: "Zřídit Dvojmonarchii" # todo: NEW TRANSLATION
 matter_of_hungary_dual_monarchy_button_desc: "#bold $HUN$#! dlouho žádalo o rovnoprávný status se zbytkem [ROOT.GetCountry.GetAdjective] říše, a jen udělením tohoto můžeme doufat, že uspokojíme magyarské požadavky na svobodu.\n\nVe spolupráci s notabili $HUN_ADJ$ byl vypracován plán, který udělí #bold $HUN$#! plnou vnitřní autonomii a odpovědné ministerstvo. Výměnou Uhry uznají, že Říše zůstává jednotným státem pro účely války a zahraniční politiky." # todo: NEW TRANSLATION
 matter_of_hungary_integrate_crown_lands_button: "Integrovat korunové země" # todo: NEW TRANSLATION
 matter_of_hungary_integrate_crown_lands_button_desc: "Úroveň autonomie, kterou si užívají [ROOT.GetCountry.GetAdjective] [Concept('concept_crown_land','$concept_crown_lands$')|l] jako #b $HUN$#!, byla trnem v oku centrální vládě po generace. Spravovány do značné míry vlastními institucemi děděnými z dob habsburské složené monarchie, odolávaly reformním snahám, které nyní charakterizují takzvané #italic Erblande#!.\n\nPro blaho naší velké říše musí být tyto [Concept('concept_crown_land','$concept_crown_lands$')|l] plně integrovány do rakouské správy." # todo: NEW TRANSLATION
 matter_of_hungary_integrate_crown_lands_tt: "Všechny [concept_crown_land] [Concept('concept_subject','$concept_subjects$')|l] mají méně než #v 25#! [concept_liberty_desire]" # todo: NEW TRANSLATION
