 modifier_grunderyears_success_2_half_dummy: "$modifier_grunderyears_success_2$" # todo: NEW TRANSLATION
 grunderzeit.3.t: "Věk podnikatelů" # todo: NEW TRANSLATION
 grunderzeit.3.d: "Poháněn inovacemi ve finanční legislativě a rozšířením železnic, německé země bzučí aktivitou, s novými společnostmi a podniky vyrůstajícími jako houby po dešti." # todo: NEW TRANSLATION
 grunderzeit.3.f: "Předseda znovu práskl bičíkem a hnals vyčerpaný tým koní kupředu. Dnes udělali slušný pokrok — většina písku byla odvezena. Ale slušné není dost. A i dokonalé je sotva dostatečné.\n\nBič prásknul znovu.\n\nPředseda cítí záchvěv viny za chudá stvoření, ale rychle myšlenku odhodí. Milosrdenství tento závod do nové továrny nepřemění. Rozhodnost ano." # todo: NEW TRANSLATION
 grunderzeit.3.a: "Kupovat! Investovat! Rozšiřovat!" # todo: NEW TRANSLATION
 grunderzeit.3.b: "Nenechme se unést." # todo: NEW TRANSLATION
