l_polish:
 je_matter_of_hungary: "Záležitost Uherska" # todo: NEW TRANSLATION
 je_matter_of_hungary_reason: "Od doby, co Habsburkové před staletími získali trůn svatého Štěpána, se jejich nezávisle smýšlející uherské poddané ukazují jako obtížné k vládnutí.\n\nKonfrontována s rostoucími válečnickými požadavky na autonomii [GetCulture('hungarian').GetName], správa v [ROOT.GetCountry.GetCapital.GetCityHubName] musí rozhodnout, zda vyhoví požadavkům uherských nacionalistů, nebo je utlumí — silou, pokud bude třeba.\n\n#bold Maďarská revoluce#!\nAktivace #Bold $je_springtime_of_the_peoples$#! [concept_journal_entry] pravděpodobně posílí radikální frakce v #b $HUN_ADJ$ sněmu#!, což může vést ke konfliktu s vládou v [ROOT.GetCountry.GetCapital.GetCityHubName]." # todo: NEW TRANSLATION
 modifier_young_hungary_movement: "Hnutí Mladé Uhry" # todo: NEW TRANSLATION
 matter_of_hungary_hungarian_homelands_tt: "[SCOPE.sCulture('hungarian_scope').GetName] [Concept('concept_homeland','$concept_homelands$')|l] [GetStateRegion('STATE_CENTRAL_HUNGARY').GetName] a [GetStateRegion('STATE_TRANSDANUBIA').GetName] jsou ve vlastnictví [ROOT.GetCountry.GetName] nebo jejích [Concept('concept_subject','$concept_subjects$')|l]" # todo: NEW TRANSLATION
