 austria_events.1.t: "Pravidlo pera a bajonetu" # todo: NEW TRANSLATION
 austria_events.1.d: "S dokončením poslední neoabsolutistické reformy stojí [ROOT.GetCountry.GetName] připravena vstoupit do nového zlatého věku. Její národy, opouštějící frakční nacionalismus, se shromažďují pod praporem osvícené a rozvážné správy." # todo: NEW TRANSLATION
 austria_events.1.f: "\"Blaho jednotlivce je založeno na blahobytu celku: ale blaho celku také spočívá na blahu jednotlivců.\"\n\n— Joseph von Sonnenfels" # todo: NEW TRANSLATION
 austria_events.1.a: "Buď pozdraven! Buď pozdraven [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]! Ať dlouho žije [ROOT.GetCountry.GetRuler.GetHerHis] osvícená vláda!" # todo: NEW TRANSLATION
 austria_events.1.b: "[ROOT.GetCountry.GetNameNoFlag] přetrvává díky moudrosti a povinnosti jejích oddaných byrokratů." # todo: NEW TRANSLATION
 modifier_everymans_emperor: "Císař všech poddaných" # todo: NEW TRANSLATION
 modifier_everymans_ruler: "Vládce všech poddaných" # todo: NEW TRANSLATION
 modifier_volksbeamter: "Volksbeamte" # todo: NEW TRANSLATION
 modifier_viribus_unitis: "Viribus Unitis" # todo: NEW TRANSLATION
 austria_events.2.t: "Žádná ústava, žádné peníze" # todo: NEW TRANSLATION
 austria_events.2.d: "Trpělivost [ROOT.GetCountry.GetAdjective] establishmentu došla. Frustrováni domnělým špatným vedením neoabsolutistické frakce požadují okamžité udělení ústavy." # todo: NEW TRANSLATION
 austria_events.2.f: "Ostro cvakající boty ozývaly síň Hofburgu, kde ministři a byrokraté jednali s narůstající naléhavostí. Dveře se rychle otevíraly a zavíraly, tlumené diskuse přerůstaly v bouřlivé hádky. Nejednota v okruhu vnější administrativy byla dlouho běžná. Ale vnitřní? To už překročilo normu. Mimo normu, a nebezpečné." # todo: NEW TRANSLATION
 austria_events.2.a: "Ustupte jejich požadavkům. Stabilita Říše je na prvním místě." # todo: NEW TRANSLATION
 austria_events.2.b: "Požadují? Hrozíme jim obviněním ze zrady." # todo: NEW TRANSLATION
 modifier_unrest_in_the_ministry_of_finance: "Nepokoje v ministerstvu financí" # todo: NEW TRANSLATION
 modifier_disapproving_of_unqualified_autocracy: "Opozice vůči neomezené autokracii" # todo: NEW TRANSLATION
 modifier_autocracy_discredited: "Neoabsolutismus zdiskreditován" # todo: NEW TRANSLATION
 austria_events.3.t: "Krize na Dunaji" # todo: NEW TRANSLATION
 austria_events.3.d: "Nezávislost [SCOPE.sCountry('hungary_scope').GetNameNoFlag] rozpoutala vlnu etnických nepokojů po celé naší zemi. Inspirováni událostmi v [SCOPE.sCountry('hungary_scope').GetCapital.GetCityHubName] povstali nacionalisté po celém [ROOT.GetCountry.GetName] proti [ROOT.GetCountry.GetCapital.GetCityHubName]." # todo: NEW TRANSLATION
 austria_events.3.f: "Ze čtyř posádek pod jeho velením zachovala čest a zůstala plně loajální jen jedna. Zbylé se buď rozprchly jako zbabělci, nebo, hůř, zradily.\n\nVzpourčíci. Psi. Sřezal by je všechny, kdyby měl příležitost.\n\n\"Herr Feldmarschall! Vaše rozkazy?\"\n\nSlova ho vytrhla z myšlenek. Prudce vydechl. „Tato povstání nejsou žádnou novinkou. Říše přežila větší hrozby. Zřiďte perimetr a přiveďte kurýra, budu mít rozkazy z [ROOT.GetCountry.GetCapital.GetCityHubName] bez prodlení.\"" # todo: NEW TRANSLATION
 austria_events.3.a: "Periferie je ztracena, ustupte do Erblande." # todo: NEW TRANSLATION
 austria_events.3.b: "Stáhnout se z Uhr, ale ani o palec dál." # todo: NEW TRANSLATION
 austria_danube_croat_revolt: "Naši [SCOPE.sCulture('croat_scope').GetName] poddaní povstali a vyhnali naše administrátory ze svých zemí." # todo: NEW TRANSLATION
 austria_danube_serb_revolt: "Naši [SCOPE.sCulture('serb_scope').GetName] poddaní povstali a vyhnali naše administrátory ze svých zemí." # todo: NEW TRANSLATION
 austria_danube_polish_revolt: "Naši [SCOPE.sCulture('polish_scope').GetName] poddaní povstali a vyhnali naše administrátory ze svých zemí." # todo: NEW TRANSLATION
 austria_danube_italian_revolt: "Naši [SCOPE.sCulture('north_italian_scope').GetName] poddaní povstali a vyhnali naše administrátory ze svých zemí." # todo: NEW TRANSLATION
 modifier_broken_eagle: "Zlomený orel" # todo: NEW TRANSLATION
 modifier_overstretched_administration: "Přetížená administrativa" # todo: NEW TRANSLATION
 austria_events.4.t: "Ausgleich" # todo: NEW TRANSLATION
 austria_events.4.d: "Byla dosažena dohoda. Podle ní bude [ROOT.GetCountry.GetName] přestrukturováno do Dualní monarchie [ROOT.GetCountry.GetNameNoFlag]-[SCOPE.sCountry('hungary_scope').GetNameNoFlag], rozdělené na zem Transleithanii spravovanou z [SCOPE.sCountry('hungary_scope').GetCapital.GetCityHubName] a Cisleithanii spravovanou z [ROOT.GetCountry.GetCapital.GetCityHubName]." # todo: NEW TRANSLATION
 austria_events.4.f: "Stojíc mezi svými vrstevníky sledoval hrabě, jak [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstNameNoFormatting], v plné výstroji, vjíždí k umělému korunovačnímu kopci, jehož půda byla přivezena z každého koutu jeho rodné uherské země. Přišel z povinnosti, ne z oddanosti, přesto když [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] dosáhl vrcholu, ucítil tíhu okamžiku, kterou neočekával.\n\nKdyž [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] pozvedl svůj meč a jedním seknutím prošel každým světovým směrem a nahlas přísahal chránit království a všechny jeho poddané, něco v něm zašimralo. Nebyla to loajalita, pomyslel si. Možná respekt." # todo: NEW TRANSLATION
 austria_events.4.a: "Zřídit Transleithanii." # todo: NEW TRANSLATION
 austria_events.4.b: "Zřídit Transleithanii v plné unii s Triunální království." # todo: NEW TRANSLATION
 austria_events.4.c: "Nechat Triunální království pod přímou [ROOT.GetCountry.GetAdjective] kontrolou." # todo: NEW TRANSLATION
 transleithania_historical_tt: "#bold Transleithania#! je definována jako stát-unie Království Uher a Triunálního království [SCOPE.sStateRegion('croatia_state_scope').GetName], [SCOPE.sStateRegion('slavonia_state_scope').GetName] a [SCOPE.sStateRegion('dalmatia_state_scope').GetName], přičemž [SCOPE.sStateRegion('dalmatia_state_scope').GetName] zůstává pod přímou [ROOT.GetCountry.GetAdjective] kontrolou." # todo: NEW TRANSLATION
 transleithania_full_triune_tt: "#bold Transleithania#! je definována jako stát-unie Království Uher a Triunálního království [SCOPE.sStateRegion('croatia_state_scope').GetName], [SCOPE.sStateRegion('slavonia_state_scope').GetName] a [SCOPE.sStateRegion('dalmatia_state_scope').GetName] v plném rozsahu." # todo: NEW TRANSLATION
 transleithania_only_hungary_tt: "#bold Transleithania#! je definována pouze jako země Království Uher." # todo: NEW TRANSLATION
 modifier_partial_hungarian_triune_union: "Částečná uhersko-triunální unie" # todo: NEW TRANSLATION
 modifier_hungarian_triune_union: "Uhersko-triunální unie" # todo: NEW TRANSLATION
 modifier_croatian_debacle: "Uhersko-chorvatské vazby přerušeny" # todo: NEW TRANSLATION
 austria_events.5.t: "Relikvie vyprchané éry" # todo: NEW TRANSLATION
 austria_events.5.d: "S opuštěním neoabsolutistického projektu vládou se jeho dřívější podporovatelé ocitli zdiskreditovaní v očích národa." # todo: NEW TRANSLATION
 austria_events.5.f: "Ministr s obvyklou praxí připojil svůj podpis k dokumentu. Naposledy? Myšlenka přetrvávala. Vzdechl. Krize byly příliš četné, zkaženost příliš zakořeněná. Kdyby jim dali ještě dekádu, možná dvě, jejich dílo by se ukázalo v plné kráse.\n\nKdyž dokument předával svému tajemníkovi, prsty se mu zachvěly, sevření zpevnilo. Na okamžik se jeho ruka vzpírala, nechtěla papír pustit.\n\nPak ho pustil." # todo: NEW TRANSLATION
 austria_events.5.a: "Jejich myšlenky možná byly špatné, ale jejich metody měly kladné stránky." # todo: NEW TRANSLATION
 austria_events.5.b: "Nechat je na posicích v bezpečnostních službách." # todo: NEW TRANSLATION
 austria_events.5.c: "Veřejně se od nich distancovat." # todo: NEW TRANSLATION
 modifier_austrian_state_police_remnant_1: "Dědictví pravidla perem" # todo: NEW TRANSLATION
 modifier_austrian_state_police_remnant_2: "Dědictví pravidla bajonetem" # todo: NEW TRANSLATION
 modifier_opening_up_the_political_sphere: "Otevírání politické sféry" # todo: NEW TRANSLATION
 je_austrian_neo_absolutism_status: "Prostřednictvím centralizace, reforem a efektivní byrokracie bude zajištěna budoucnost říše" # todo: NEW TRANSLATION
 je_austrian_neo_absolutism_status_1: "Ústavní tlak je #bold zanedbatelný#!" # todo: NEW TRANSLATION
 je_austrian_neo_absolutism_status_2: "Ústavní tlak je #bold rostoucí#!" # todo: NEW TRANSLATION
 je_austrian_neo_absolutism_status_3: "Ústavní tlak je #bold vysoký#!" # todo: NEW TRANSLATION
 je_austrian_neo_absolutism_status_4: "Ústavní tlak je #bold kritický#!" # todo: NEW TRANSLATION
 decision_found_budapest: "Zákon o sjednocení Budapešti" # todo: NEW TRANSLATION
 decision_found_budapest_desc: "Sjednocením historického uherského hlavního města Buda s rychle se rozvíjejícím Pestem vytvoříme jedno prosperující velkoměsto přes obě břehy Dunaje." # todo: NEW TRANSLATION
 decision_found_budapest_tt: "Města #bold Buda#!, #bold Pest#! a #bold Óbuda#! budou sloučena a vytvoří nové město #bold Budapešť#!" # todo: NEW TRANSLATION
 decision_move_capital_to_buda: "Prohlásit Budu hlavním městem" # todo: NEW TRANSLATION
 decision_move_capital_to_buda_desc: "Zatímco Uhry měly mnoho hlavních měst, žádné se nevyrovná Budě v prestiži a slávě. Musíme tam přemístit uherský sněm." # todo: NEW TRANSLATION
 modifier_buda_made_capital: "Růst Pestu" # todo: NEW TRANSLATION
 decision_demand_hungary_revoke_laws: "Jednostranně zrušit uherské reformy" # todo: NEW TRANSLATION
 decision_demand_hungary_revoke_laws_desc: "Z nějakého důvodu naše vláda tehdy podlehla požadavkům vzdorovitého uherského sněmu. Musíme tu chybu napravit." # todo: NEW TRANSLATION
 decision_demand_hungary_revoke_laws_tt: "Umožnili jsme uherskému sněmu schválit revoluční legislativu" # todo: NEW TRANSLATION
 je_hungarian_revolution: "Maďarská revoluce" # todo: NEW TRANSLATION
 je_hungarian_revolution_reason: "#italic \"Svoboda je princip; jejím společenstvím je její bezpečí; výlučnost je jejím zánikem\"#! — Lajos Kossuth\n\nKdyž se [ROOT.GetCountry.GetNameNoFlag] blížilo ke novému století, zjistilo, že je stále více ovládáno kluby liberálních, reformně smýšlejících politiků.\n\nAčkoli se neshodují na přesné povaze budoucího vztahu Uher k #bold Habsburské monarchii#!, spojuje je touha po politických a ekonomických reformách, s cílem proměnit relativní zapadlost Uher v moderní a dynamický národní stát s autonomií nad uherskými [Concept('concept_homeland','$concept_homelands$')|l].\n\n#bold Občané nátlakem#!\nPokud se [ROOT.GetCountry.GetNameNoFlag] ocitne v opozici vůči #bold $AUS$#! v [concept_diplomatic_play], utlačované menšiny mohou využít situace a pokusit se #tooltippable #tooltip:hungarian_revolt_ethnic_unrest_tt #bold svléknout#! maďarské jho.#!#! " # todo: NEW TRANSLATION
 owns_all_hungarian_homelands_tt: "Vlastní #b všechny#! #tooltippable #tooltip:[GetPlayer.GetTooltipTag],hungarian_homeland_states_tt [SCOPE.sCulture('hungarian_culture_scope').GetName] Homelandy#!#!" # todo: NEW TRANSLATION
 hungarian_homeland_states_tt: "#title Následující [Concept('concept_state_region','$concept_state_regions$')|l] jsou [GetCulture('hungarian').GetName] [Concept('concept_homeland','$concept_homelands$')|l]:#! #indent_newline:3 \n• $STATE_BANAT$\n• $STATE_SLOVAKIA$\n• $STATE_RUTHENIA$\n• $STATE_BEKES$\n• $STATE_TRANSDANUBIA$\n• $STATE_CENTRAL_HUNGARY$\n• $STATE_DELVIDEK$\n• $STATE_NORTHERN_TRANSYLVANIA$\n• $STATE_SOUTHERN_TRANSYLVANIA$#!" # todo: NEW TRANSLATION
 hungarian_revolt_ethnic_unrest_tt: "[GetCulture('serb').GetName], [GetCulture('slovak').GetName] a [GetCulture('romanian').GetName] poddaní se mohou #n vzbouřit#! pokud budou splněny následující podmínky:\n\n• Průměrné [concept_acceptance] [GetCulture('serb').GetName], [GetCulture('slovak').GetName] nebo [GetCulture('romanian').GetName] je pod #v 60#!\n• Jedna z následujících: #indent_newline:3 \n• [concept_cultural_turmoil] v [GetCulture('serb').GetName], [GetCulture('slovak').GetName] nebo [GetCulture('romanian').GetName] [Concept('concept_homeland','$concept_homelands$')|l] překročí #n 15%#!\n• [concept_political_movement] způsobuje [concept_obstinance] v [GetCulture('serb').GetName], [GetCulture('slovak').GetName] nebo [GetCulture('romanian').GetName] [Concept('concept_homeland','$concept_homelands$')|l]#!" # todo: NEW TRANSLATION
 has_founded_budapest_tt: "Rozhodli jsme se #bold založit Budapešť#!" # todo: NEW TRANSLATION
 modifier_hungary_timeout: "Země, kterou historie mine" # todo: NEW TRANSLATION
 hungarian_revolution_annex_transylvania_button: "Prohlásit unii s Transylvánií" # todo: NEW TRANSLATION
 hungarian_revolution_annex_transylvania_button_desc: "Ačkoli [SCOPE.sCountry('transylvania_scope').GetName] byla uznána jako země [ROOT.GetCountry.GetAdjective] koruny, byla spravována odděleně od vlastní Uher od porážky #bold Rákócziho povstání#! v roce 1711.\n\nTransylvánský sněm je však nadále ovládán pro-unijními delegáty z [SCOPE.sCulture('hungarian_culture_scope').GetName] a [SCOPE.sCulture('szekely_culture_scope').GetName], a s trochou podpory by se pravděpodobně znovu připojil k říši. [SCOPE.sCountry('austria_scope').GetName] však s takovým krokem pravděpodobně nebude souhlasit a budou nás označovat za zrádce." # todo: NEW TRANSLATION
 if_trs_accepts_tt: "Pokud [SCOPE.sCountry('transylvania_scope').GetName] přijme náš návrh na Unii [SCOPE.sCountry('transylvania_scope').GetNameNoFormatting] s [ROOT.GetCountry.GetName], bude [SCOPE.sCountry('transylvania_scope').GetNameNoFormatting] #b anektována#!" # todo: NEW TRANSLATION
 hungarian_revolution_twelve_points_button: "Vyhlásit Dvanáct bodů" # todo: NEW TRANSLATION
 hungarian_revolution_twelve_points_button_desc: "Dlouho rozděleni mezi radikály a opatrnějšími reformátory se [ROOT.GetCountry.GetAdjective] progresivní nyní sjednotili kolem společné platformy Dvanácti bodů, řady dalekosáhlých zákonů, které mají navždy zajistit svobodu země." # todo: NEW TRANSLATION
 hungarian_revolution_twelve_points_tt: "Takový radikální akt pravděpodobně způsobí #bold velké rozštěpení#! v našich vztazích s [SCOPE.sCountry('austria_scope').GetName], #n což může vést k válce#!" # todo: NEW TRANSLATION
 hungarian_revolution_austrian_ruler: "Následující podmínky sníží šanci, že [SCOPE.sCountry('austria_scope').GetName] bude naše kroky proti nám hájit:#indent_newline:3 \n• [SCOPE.sCountry('austria_scope').GetAdjective] [concept_ruler] má [GetCharacterTrait('compliant').GetName] [concept_character_trait]\n• [SCOPE.sCountry('austria_scope').GetName] je angažovaným účastníkem jakéhokoli [concept_diplomatic_play]#!" # todo: NEW TRANSLATION
 modifier_the_spirit_of_48: "Společné progresivní fronty" # todo: NEW TRANSLATION
 possible_effects_hungary_events.9_tt: "#header Následující jsou všechny #b možné#! efekty událostí ze $hungary_events.9.t$:#!" # todo: NEW TRANSLATION
 possible_hun_lawgroup_distribution_of_power_change_tt: "[ROOT.GetCountry.GetName] umožní zákon [GetLawType('law_census_voting').GetName] v [GetLawGroup('lawgroup_distribution_of_power').GetName]" # todo: NEW TRANSLATION
 possible_hun_lawgroup_free_speech_change_tt: "[ROOT.GetCountry.GetName] umožní zákon [GetLawType('law_protected_speech').GetName] v [GetLawGroup('lawgroup_free_speech').GetName]" # todo: NEW TRANSLATION
 possible_hun_lawgroup_land_reform_change_tt: "[ROOT.GetCountry.GetName] umožní zákon [GetLawType('law_tenant_farmers').GetName] v [GetLawGroup('lawgroup_land_reform').GetName]" # todo: NEW TRANSLATION
 possible_hun_lawgroup_church_and_state_change_tt: "[ROOT.GetCountry.GetName] umožní zákon [GetLawType('law_freedom_of_conscience').GetName] v [GetLawGroup('lawgroup_church_and_state').GetName]" # todo: NEW TRANSLATION
 possible_hun_lawgroup_internal_security_change_tt: "[ROOT.GetCountry.GetName] umožní zákon [GetLawType('law_national_guard').GetName] v [GetLawGroup('lawgroup_internal_security').GetName]" # todo: NEW TRANSLATION
 possible_hun_lawgroup_taxation_change_tt: "[ROOT.GetCountry.GetName] umožní zákon [GetLawType('law_per_capita_based_taxation').GetName] v [GetLawGroup('lawgroup_taxation').GetName]" # todo: NEW TRANSLATION
 possible_hun_lawgroup_economic_system_change_tt: "[ROOT.GetCountry.GetName] umožní zákon [GetLawType('law_interventionism').GetName] v [GetLawGroup('lawgroup_economic_system').GetName]" # todo: NEW TRANSLATION
 hungarian_revolution_establish_honved_button: "Zřídit armádu Honvéd" # todo: NEW TRANSLATION
 hungarian_revolution_establish_honved_button_desc: "Dlouho byl odepřený přístup k vojenské pravomoci nad vlastními narychlo branci; [ROOT.GetCountry.GetName] nyní musí mít armádu, která odpovídá [ROOT.GetCountry.GetCapital.GetCityHubName], nikoli #italic Hofkriegsrat#! ve Vídni.\n\nTradiční uherské pluky jsou však příliš omezené na to, aby tuto roli samy zvládly. Musíme zahájit rozsáhlou reorganizaci a nábor, abychom znovu vzbudili strach v srdcích našich nepřátel." # todo: NEW TRANSLATION
 possible_effects_hungary_events.7_tt: "#header Následující jsou všechny #b možné#! efekty událostí z $hungary_events.7.t$:#!" # todo: NEW TRANSLATION
 dp_hungarian_revolution: "Maďarská revoluce" # todo: NEW TRANSLATION
 hungary_events.1.t: "Perla Dunaje" # todo: NEW TRANSLATION
 hungary_events.1.d: "S formálním spojením Budy, Pestu a Óbudy do jedné se nová metropole Budapešť těší nebývalému rozmachu v dějinách [ROOT.GetCountry.GetName], s tokem kapitálu a know-how do města." # todo: NEW TRANSLATION
 hungary_events.1.f: "\"Hlavní město bude mocné jen tehdy, má‑li vládnoucí moc; bude v životě prosperující, jestliže je vedeno jednou duší, jednou vůlí v jeho snahách; bude šťastné, jestliže se jednotlivé zájmy rozpustí v zájmu společném.\"\n— Bertalan Szemere" # todo: NEW TRANSLATION
 hungary_events.1.a: "Panonie je náš chlebodárce a Budapešť jeho bijící srdce." # todo: NEW TRANSLATION
 hungary_events.1.b: "Borúra derű, kéž Budapešť ukáže cestu našemu národu." # todo: NEW TRANSLATION
 modifier_budapest_steam_mills: "Rozmach parních mlýnů v Budapešti" # todo: NEW TRANSLATION
 modifier_budapest_paris_of_the_east: "Paříž Východu" # todo: NEW TRANSLATION
 modifier_budapest_chain_bridge: "Széchenyiho řetězový most" # todo: NEW TRANSLATION
 modifier_budapest_grain_barons: "Podporovaní obilní baroni" # todo: NEW TRANSLATION
 modifier_budapest_academy: "Sponzorovaná Akademie věd" # todo: NEW TRANSLATION
 hungary_events.2.t: "Srbské povstání" # todo: NEW TRANSLATION
 hungary_events.2.d: "Po shromáždění v Sremski Karlovci vyhlásili zástupci [GetCulture('serb').GetName] národa v [SCOPE.sCountry('hungary_country_scope').GetName] povstání s úmyslem vyhlásit srbskou říši severně od řeky Sávy." # todo: NEW TRANSLATION
 hungary_events.2.f: "\"Rozptýleni ve sto směrech—na sto stran; každý by nad námi mohl vládnout, zatímco my sami si nemůžeme vládnout, jako bychom nikdy neřídili svůj osud!\"\n— Nikanor Grujić" # todo: NEW TRANSLATION
 hungary_events.2.a: "Zmobilizovat armádu a porazit tyto vídeňské páníčky." # todo: NEW TRANSLATION
 hungary_events.2.b: "Za ctněný kříž a Zlatou svobodu!" # todo: NEW TRANSLATION
 hungary_events.2.c: "Uznat [SCOPE.sCountry('banat_country_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('banat_country_scope').GetRuler.GetLastName] jako našeho místního guvernéra." # todo: NEW TRANSLATION
 hungary_events.2.e: "Srbům nelze důvěřovat. Potlačit je také." # todo: NEW TRANSLATION
 modifier_serbian_volunteers: "Srbští dobrovolníci" # todo: NEW TRANSLATION
 hungary_events.3.t: "Slovenské povstání" # todo: NEW TRANSLATION
 hungary_events.3.d: "Z jejich shromáždění v Myjavě vyhlásila Národní rada [GetCulture('slovak').GetName] úmysl oddělit se od [SCOPE.sCountry('hungary_country_scope').GetName] a vyzývá k obecné slovenské vzpouře." # todo: NEW TRANSLATION
 hungary_events.3.f: "\"Byli jsme dlouho hračkou ďábelské politiky, která nás záměrně dělila a neustále podněcovala konflikty mezi námi, aby nás zničila vlastní vinou... Vyrostli jsme, uznali jsme svá práva a chceme je statečně bránit.\"\n— Ľudovít Štúr" # todo: NEW TRANSLATION
 hungary_events.3.a: "Naše armáda těmto zrádcům udělí rychlou lekci." # todo: NEW TRANSLATION
 hungary_events.3.b: "Sláva! Všem Slovákům!" # todo: NEW TRANSLATION
 hungary_events.3.c: "Slibovat Slovákům autonomii za věrnost." # todo: NEW TRANSLATION
 hungary_events.3.e: "Převrat musí být udušen." # todo: NEW TRANSLATION
 modifier_slovak_volunteers: "Slovenští dobrovolníci" # todo: NEW TRANSLATION
 hungary_events.4.t: "Uhry volají po unii" # todo: NEW TRANSLATION
 hungary_events.4.d: "Důrazným krokem prohlásil [SCOPE.sCountry('hungary_country_scope').GetAdjective] sněm Unii [ROOT.GetCountry.GetName] s Uhrami. K tomu je však potřeba schválení sněmu v [ROOT.GetCountry.GetCapital.GetCityHubName], což způsobilo, že prounijní delegáti ze [GetCulture('hungarian').GetName] a [GetCulture('szekely').GetName] spěchají zajistit potřebné hlasy." # todo: NEW TRANSLATION
 hungary_events.4.f: "Kdyby Bůh chtěl, aby dnes pracoval, neposlal by mu takový rámus, pomyslel si Ioan. Když znovu vzhlédl od účetní knihy, vzal dýmku, potáhl a zadíval se z okna.\n\nPřed palácem Reduty se dav ještě zvětšil. Většinou to byli místní Szekléři a Maďaři, některé z nich Ioan poznal; jejich výkřiky 'Unie nebo smrt!' se linuly ulicemi.\n\nŠpatný byznys, pomyslel si. Špatné pro byznys také. Jeho prudký syn i dva učedníci už odjeli na nějaké 'národní shromáždění' do Blaje. Ne, pomyslel si Ioan, tohle neskončí dobře." # todo: NEW TRANSLATION
 hungary_events.4.a: "Igen. Sněm hlasuje pro sjednocení." # todo: NEW TRANSLATION
 hungary_events.4.b: "Nem. Návrh je v těsném hlasování odmítnut." # todo: NEW TRANSLATION
 hungary_events.5.t: "Transylvánie ratifikovala unii s Uhrami" # todo: NEW TRANSLATION
 hungary_events.5.d: "Po hlasování v regionálním maďarsky ovládaném sněmu se Transylvánie rozhodla připojit k [SCOPE.sCountry('hungary_country_scope').GetName] v unii." # todo: NEW TRANSLATION
 hungary_events.5.f: "'Unie nebo smrt' vyhlásili týden předtím. Sebevražda hlasováním, pomyslel si; měli raději křičet 'Unie #italic a#! Smrt'. Bylo to spravedlivé? Možná. Bylo to legální? Sporně. Bylo to rozumné? Rozhodně ne.\n\nS vědomím své smůly teď na jeho malý kousek světa dopadne hněv jak z [SCOPE.sCountry('hungary_country_scope').GetCapital.GetCityHubName], tak z Vídně, a nic s tím nenadělá." # todo: NEW TRANSLATION
 hungary_events.5.a: "Transylvánie je neodmyslitelnou součástí uherské koruny." # todo: NEW TRANSLATION
 hungary_events.5.b: "Ponechat načas místní výsady." # todo: NEW TRANSLATION
 hungary_events.5.c: "Dobrá tedy. Přijmout rozhodnutí sněmu." # todo: NEW TRANSLATION
 hungary_events.5.e: "Chovají se nad rámec! Požadovat okamžité stažení Transylvánie." # todo: NEW TRANSLATION
 modifier_allowed_transylvanian_autonomy: "Povolená transylvánská autonomie" # todo: NEW TRANSLATION
 modifier_not_allowed_transylvanian_autonomy: "Zakázaná transylvánská autonomie" # todo: NEW TRANSLATION
 transylvanian_diet_abolished: "Tímto aktem #bold Transylvánský sněm#! efektivně #bold zrušuje#! sám sebe" # todo: NEW TRANSLATION
 transylvanian_diet_retained: "Tímto aktem je samostatný #bold Transylvánský sněm#! #bold zachován#! prozatím" # todo: NEW TRANSLATION
 hungary_likely_lead_to_war_tt: "Takový požadavek vyvolá pobouření v [SCOPE.sCountry('hungary_country_scope').GetName], a jeho vystavení pravděpodobně povede k #n válce#!" # todo: NEW TRANSLATION
 modifier_transylvanian_bands: "Oddané gardy Grenzer" # todo: NEW TRANSLATION
 hungarian_revolution: "Maďarská revoluce" # todo: NEW TRANSLATION
 je_hungarian_revolution_backed_down_fail: "Byli jsme donuceni #bold $AUS$#! ustoupit od našich reforem" # todo: NEW TRANSLATION
 modifier_revolutionary_fervor: "Revoluční zápal" # todo: NEW TRANSLATION
 hungary_events.6.t: "Vídeňská ultimáta" # todo: NEW TRANSLATION
 hungary_events.6.d: "Hrozící vojenskou akcí vláda v [SCOPE.sCountry('austria_country_scope').GetCapital.GetCityHubName] jednostranně a nezákonně zrušila naše nedávné reformy a nyní požaduje, abychom se vrátili k pořadí." # todo: NEW TRANSLATION
 hungary_events.6.f: "Poté, co přečetl poselství z [SCOPE.sCountry('austria_country_scope').GetCapital.GetCityHubName] nahlas, rakušský poslanec zacvakal patami a uklonil se shromážděným uherským důstojníkům.\n\nPožadavky byly jasné: na vyjednávání už není čas. Buď uherský sněm zruší reformy, nebo to udělá rakouská armáda za ně." # todo: NEW TRANSLATION
 hungary_events.6.a: "To je poslední kapka. Maďaři, k zbraním!" # todo: NEW TRANSLATION
 hungary_events.6.b: "Nemáme jinou možnost než přijmout." # todo: NEW TRANSLATION
 austrian_ultimatium_tt: "Přijetí jejich ultimáta zruší všechny naše reformy a #bold $je_hungarian_revolution$#! [concept_journal_entry] #n selže#!" # todo: NEW TRANSLATION
 modifier_humiliated_by_austria: "Ponížení Rakouskem" # todo: NEW TRANSLATION
 hungary_events.7.t: "Vstanete, Maďaři" # todo: NEW TRANSLATION
 hungary_events.7.d: "Bugle zní po [ROOT.GetCountry.GetAdjective] říši, tisíce dobrovolníků se hrnou do nově vzniklých náborových kanceláří. Jak se plní rejstříky pluků, nově povýšení generálové se hádají o tom, jak je nejlépe využít." # todo: NEW TRANSLATION
 hungary_events.7.f: "Kde leží naše hroby,\nnaši vnuci budou poklekat,\nA s požehnáním modlitby,\nvysloví naše svatá jména.\nBože Maďarů,\nPřísaháme,\nPřísaháme, že už nebudeme otroky!\n\n— Sándor Petőfi, #italic Nemzeti dal#!" # todo: NEW TRANSLATION
 hungary_events.7.a: "Bojujeme za vlast, za ni prolijeme krev." # todo: NEW TRANSLATION
 hungary_events.7.b: "Kdo se odváží, vyhraje. Musíme vzít boj k nepříteli." # todo: NEW TRANSLATION
 every_state_with_enlistment_decree_get_modifier: "Každý [ROOT.GetCountry.GetAdjective] [concept_state] s aktivním [GetDecreeType('decree_enlistment_efforts').GetName] [concept_decree] #b dostane#! #tooltippable;tooltip:[GetPlayer.GetTooltipTag],modifier_mustering_the_honved_tt $modifier_mustering_the_honved$#! na #v [GetPlayer.MakeScope.ScriptValue('display_normal_modifier_time')]#! let" # todo: NEW TRANSLATION
