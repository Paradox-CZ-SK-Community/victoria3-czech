 spanish_new_world_events.5.t: "Uznání" # todo: NEW TRANSLATION
 spanish_new_world_events.5.d: "S právním statusem [ROOT.GetCountry.GetName] už nezpochybněným se zvýší i její postavení na mezinárodní scéně." # todo: NEW TRANSLATION
 spanish_new_world_events.5.f: "Ačkoliv byla skutečná nezávislost vybojována u bodu bajonetu statečnými bojovníky osvobozeneckých válek, byla to práce lidí píšících, jako on, která zajistila právní suverenitu [ROOT.GetCountry.GetAdjectiveNoFormatting].\n\nJe to snad stejně oslavné jako hrdinská obrana či vznešený útok? Možná ne.\n\nNáměstí a plenéry [ROOT.GetCountry.GetCapital.GetCityHubName] mu patrně nikdy neponesou jeho jméno, přesto měl velkou útěchu v tom, že v dějinách [ROOT.GetCountry.GetNameNoFormatting] #italic on#! zanechal stopu." # todo: NEW TRANSLATION
 spanish_new_world_events.5.a: "Tento den vstoupí do [ROOT.GetCountry.GetAdjective] dějin." # todo: NEW TRANSLATION
 je_spanish_new_world_dummy: "Vzpomínky na Indie" # todo: NEW TRANSLATION
 je_spanish_new_world_dummy_reason: "N/A" # todo: NEW TRANSLATION
 je_spanish_new_world_dummy_status_desc: "Osud Nového světa zatím není rozhodnut." # todo: NEW TRANSLATION
 je_spanish_new_world_dummy_tt: "Budeme se muset rozhodnout mezi normalizací a zlepšením vzájemných vztahů s našimi bývalými americkými koloniemi, nebo potrestáním těchto národů jako rebelů, kterými jsou." # todo: NEW TRANSLATION
 je_reconquista: "Reconquista" # todo: NEW TRANSLATION
 je_reconquista_reason: "V našem okamžiku největší potřeby, kdy armády zatraceného maršála plály cestu naší zemí, nevěrní a radikálové nejnižšího ražení využili příležitosti a odvrhli lásku a ochranu své #italic madre patria#!.\n\nTito zbloudění blázni se musí naučit znát následky svých činů. Neboť [ROOT.GetCountry.GetName] je věčná a její nadvláda nad Novým světem bude obnovena." # todo: NEW TRANSLATION
 reestablish_new_spain_goal_tt: "Znovu jsme obnovili #b Nové Španělsko#!" # todo: NEW TRANSLATION
 reestablish_new_grenada_goal_tt: "Znovu jsme obnovili #b Novou Granadu#!" # todo: NEW TRANSLATION
 reestablish_peru_goal_tt: "Znovu jsme obnovili #b Peru#!" # todo: NEW TRANSLATION
 reestablish_la_plata_goal_tt: "Znovu jsme obnovili #b River Plate#!" # todo: NEW TRANSLATION
 je_reconquista_goal_tt: "Pokud dokončíte tento [concept_journal_entry] před #v 1. ledna 1880#!, tento [concept_modifier] bude #g trvalý#!" # todo: NEW TRANSLATION
 new_world_colonies_cooldown: "Neznovustanovil americkou kolonii za poslední #bold rok#!" # todo: NEW TRANSLATION
 button_reestablish_new_spain: "Znovuobnovit Nové Španělsko" # todo: NEW TRANSLATION
 button_reestablish_new_spain_desc: "První a možná nejdůležitější španělské viceroyalty, Nové Španělsko bylo založeno v roce 1535 na troskách staré Aztécké říše. Zahrnovalo všechna španělská území a nároky v Severní Americe a také mělo jurisdikci nad Karibikem a španělskými územími v Asii." # todo: NEW TRANSLATION
 button_reestablish_new_grenada: "Znovuobnovit Novou Granadu" # todo: NEW TRANSLATION
 button_reestablish_new_grenada_desc: "Vzniklá v roce 1717 z nepohodlí spravovat obrovské španělské země v karibské pánvi a severních Andách z Limy, viceroyalty Nová Granada zažila krátkou a problematickou historii. Postrádala bohatství Nového Španělska nebo Peru a její příjmy pocházely převážně z zemědělství a obchodu." # todo: NEW TRANSLATION
 button_reestablish_peru: "Znovuobnovit Peru" # todo: NEW TRANSLATION
 button_reestablish_peru_desc: "Druhé nejstarší z španělských viceroyalt, Peru kdysi zahrnovalo všechna španělská území v Jižní Americe a bylo svědkem všeho od pádu Inků až po revoluce počátku 19. století. Tradičně známé pro své bohatství na nerosty, v 19. století je jeho ekonomika převážně ovlivněna zemědělstvím." # todo: NEW TRANSLATION
 reestablish_peru_tt: "temp" # todo: NEW TRANSLATION
 button_reestablish_la_plata: "Znovuobnovit River Plate" # todo: NEW TRANSLATION
 button_reestablish_la_plata_desc: "Založená v roce 1776, Viceroyalty River Plate byla poslední svého druhu před zhroucením španělské autority v Novém světě. Rozprostírala se od bohatých zemědělských oblastí ústí Río de la Plata až po proslulé stříbrné doly Potosí a soustřeďovala některé z největších bohatství Nového světa." # todo: NEW TRANSLATION
 button_reestablish_caribbean: "Reorganizovat Karibik" # todo: NEW TRANSLATION
 button_reestablish_caribbean_desc: "Španělský Karibik byl místem, kde Španělsko první přistálo před čtyřmi stoletími, a právě zde španělská vláda přetrvala i po pádu pevniny.\n\nS obnovenou kontrolou nad pevninou musíme rozhodnout o osudu našich karibských správ." # todo: NEW TRANSLATION
 button_proclaim_independence: "Ignorovat Španělsko" # todo: NEW TRANSLATION
 button_proclaim_independence_desc: "Měsíc neposlouchá štěkání psů. Pokud světu ukážeme, že síla Nového světa převyšuje tu Stará, soudy naší staré, zanedbávající matky pro nás nebudou mít význam." # todo: NEW TRANSLATION
 modifier_a_show_of_strength: "Ukázka síly" # todo: NEW TRANSLATION
 je_hispanoamerica: "Hispanoamerica" # todo: NEW TRANSLATION
 je_hispanoamerica_reason: "Neztrácíme lidi ani prostředky v marném pokusu obnovit to, co kdysi bylo. Místo toho budou hlásány slova srdečnosti a vzájemného prospěchu v našich vztazích s bývalými koloniemi. Naše diplomacie bude vypracovávat [Concept('concept_treaty','$concept_treaties$')|l] Smlouvy o obchodu a přátelství s našimi bývalými poddanými, vysílajíc světu mocný signál naší velkorysosti.\n\n#b Formální uznání#!\nZatímco bývalé kolonie [ROOT.GetCountry.GetNameNoFormatting] v Americe dosáhly #italic de facto#! nezávislosti po #b Španělsko-amerických válkách za nezávislost#! na počátku 19. století, nedošlo k #italic de jure#! uznání této nové situace.\n\nDokud [ROOT.GetCountry.GetNameNoFormatting] formálně neuzná nezávislost svých bývalých kolonií pomocí #b článku Smlouvy o uznání nezávislosti#! bilateralní diplomatické vztahy zůstanou #b výrazně omezeny#!." # todo: NEW TRANSLATION
 modifier_hispanoamerica_reward: "Zvláštní vztah" # todo: NEW TRANSLATION
 je_hispanoamerica_improve_relations: "[ROOT.GetCountry.GetAdjective] [concept_relations] se #b všemi bývalými [ROOT.GetCountry.GetAdjectiveNoFormatting] koloniemi#! se zlepší o #g 30#!" # todo: NEW TRANSLATION
 je_hispanoamerica_improve_leverage: "Pokud jsme vůdcem [concept_power_bloc], [ROOT.GetCountry.GetName] získá #positive_value 100#! [concept_power_bloc_leverage] ve #b všech bývalých [ROOT.GetCountry.GetAdjectiveNoFormatting] koloniích#!" # todo: NEW TRANSLATION
 modifier_not_recognized_by_spain: "Nezávislost neuznána Španělskem" # todo: NEW TRANSLATION
 je_spanish_american_independence: "Stará metropole" # todo: NEW TRANSLATION
 je_spanish_american_independence_reason: "Ačkoliv [ROOT.GetCountry.GetName] vypadá a jedná jako plně suverénní stát, naše postavení ve světě zůstane nejisté, dokud naši bývalí páni neudělí uznání. Měli bychom usilovat o dobré vztahy s Madridem, nebo se tak předvést světu, že nikdo nebude zpochybňovat naši legitimitu.\n\n#b Formální uznání#!\nZatímco bývalé kolonie Španělska v Americe dosáhly #italic de facto#! nezávislosti po #b Španělsko-amerických válkách za nezávislost#!, nedošlo k #italic de jure#! uznání této nové situace.\n\nDokud Španělsko formálně neuzná nezávislost svých bývalých kolonií pomocí #b článku Smlouvy o uznání nezávislosti#!, bilaterální diplomatické vztahy zůstanou #b výrazně omezeny#!." # todo: NEW TRANSLATION
 modifier_renewed_diplomatic_efforts: "Obnovené diplomatické snahy" # todo: NEW TRANSLATION
 je_spanish_american_reconquista_tt: "Pokud by Španělsko sledovalo myšlenku #b Americké Reconquisty#!, znemožnilo by se #b ve světových očích#! a my bychom ztratili tento [concept_modifier]" # todo: NEW TRANSLATION
 je_spanish_american_optional_tt: "Pokud naše [concept_relations] s [SCOPE.sCountry('spain_scope').GetName] budou rovny nebo vyšší než #v 80#!, začne #b [SCOPE.sCountry('spain_scope').GetAdjectiveNoFormatting]![concept_mass_migration] do naší země" # todo: NEW TRANSLATION
 je_spanish_american_optional_tt_2: "Vzhledem k tomu, že naše [concept_relations] s [SCOPE.sCountry('spain_scope').GetName] jsou rovny nebo vyšší než #v 80#!, začne [SCOPE.sCountry('spain_scope').GetAdjectiveNoFormatting] [concept_mass_migration] do naší země" # todo: NEW TRANSLATION
 je_vernacular_policy: "Postavení nářečí" # todo: NEW TRANSLATION
 je_vernacular_policy_reason: "Po staletí byly [SCOPE.sCulture('official_culture_scope').GetName] [Concept('concept_homeland','$concept_homelands$')|l] domovem mnoha [ROOT.GetCountry.GetCustom('getRegionalLanguagesType')]. Někteří je považují za samostatné kultury a jazyky, jiní za pouhé znetvořené varianty pravého [SCOPE.sCulture('official_culture_scope').GetName], a jejich rozšíření vyvolalo v [ROOT.GetCountry.GetCapital.GetCityHubName] tvrdé diskuse o otázce 'vernacular'.\n\nNěkteří tvrdí, že národ nemůže být skutečně jednotný, dokud regionalismus nebude vytlačen, jiní oponují, že [ROOT.GetCountry.GetName] nikdy nebyl a nikdy nebude ničím jiným než směsicí regionálních řečí a identit, z nichž žádná není vrozeně nadřazena jiné." # todo: NEW TRANSLATION
 je_vernacular_policy_accept_catalan_button: "Uznat [GetCulture('catalan').GetName]" # todo: NEW TRANSLATION
