 spanish_events.1.t: "La Renaixensa" # todo: NEW TRANSLATION
 spanish_events.1.d: "Snažíce se napravit staletí diglosie, intelektuálové [GetCulture('catalan').GetName] začali pracovat na oživení katalánštiny jako literárního a kulturního jazyka." # todo: NEW TRANSLATION
 spanish_events.1.f: "\"Katalánsko může stále usilovat o nezávislost – ne politickou, protože má proti jiným národům s obrovskými armádami a námořnictvem příliš malou váhu, ale literární, mimo dosah politické rovnováhy.\"\n\n— Joaquín Rubió y Ors, 'Lo Gayter del Llobregat'" # todo: NEW TRANSLATION
 spanish_events.1.a: "Velmi zajímavé..." # todo: NEW TRANSLATION
 spanish_events.1.b: "Podvratnost musí být potlačena." # todo: NEW TRANSLATION
 spanish_events.1.c: "Co je Španělsko než svazek národů, spojených korunou." # todo: NEW TRANSLATION
 modifier_empowered_catalan_fueros: "Posílené katalánské svobody" # todo: NEW TRANSLATION
 modifier_catalan_literary_revival: "Katalánské literární oživení" # todo: NEW TRANSLATION
 spanish_events.2.t: "O Rexurdimento" # todo: NEW TRANSLATION
 spanish_events.2.d: "Snažíce se napravit staletí diglosie, intelektuálové [GetCulture('galician').GetName] začali pracovat na oživení galicijštiny jako literárního a kulturního jazyka." # todo: NEW TRANSLATION
 spanish_events.2.f: "\"Chudá Galicie, nikdy se\nneříkej Španělkou,\nprotože tě Španělsko zapomíná,\nbyla jsi tak krásná.\nJako bys se narodila ve studu,\nona v své bláhovosti se ostýchá tě přihlásit,\na matka, která pohrdá svým dítětem,\nje srdce bezcitné.\"\"\n\n— Rosalía de Castro, #italic The Galician Bagpipe#!" # todo: NEW TRANSLATION
 spanish_events.2.a: "Velmi zajímavé..." # todo: NEW TRANSLATION
 spanish_events.2.b: "Podvratnost musí být potlačena." # todo: NEW TRANSLATION
 spanish_events.2.c: "Co je Španělsko než svazek národů, spojených korunou." # todo: NEW TRANSLATION
 modifier_empowered_galician_fueros: "Posílené galicijské městské privilegia" # todo: NEW TRANSLATION
 modifier_galician_literary_revival: "Galicijské literární oživení" # todo: NEW TRANSLATION
 spanish_events.3.t: "El Surdimientu" # todo: NEW TRANSLATION
 spanish_events.3.d: "Snažíce se napravit staletí diglosie, intelektuálové [GetCulture('asturleonese').GetName] začali pracovat na oživení asturleonského jako literárního a kulturního jazyka." # todo: NEW TRANSLATION
 spanish_events.3.f: "\"Ó prameni Fascura!\nmé čelo je už bílé,\na přesto, když na tebe myslím,\nneví, co se děje,\nzdali spím nebo bdím,\nzdali je to pravda nebo sen.\nSnění! Ach, kdyby štěstí,\nalespoň sněné,\nmohlo trvat bez konce,\nprosím, ať se nikdy neprobudím!\"\n\n— Xuan María Acebal, #italic La Fonte de Fascura#!" # todo: NEW TRANSLATION
 spanish_events.3.a: "Velmi zajímavé..." # todo: NEW TRANSLATION
 spanish_events.3.b: "Podvratnost musí být potlačena." # todo: NEW TRANSLATION
 spanish_events.3.c: "Co je Španělsko než svazek národů, spojených korunou." # todo: NEW TRANSLATION
 modifier_empowered_asturleonese_fueros: "Posílené asturské městské privilegia" # todo: NEW TRANSLATION
 modifier_asturleonese_literary_revival: "Asturleonské literární oživení" # todo: NEW TRANSLATION
 dominican_events.1.t: "Přísaha" # todo: NEW TRANSLATION
 dominican_events.1.d: "Sejdu se na tajném místě skupina revolucionářů zvaná La Trinitaria oznámila své úmysly osvobodit [SCOPE.sState('santo_domingo_state_scope').GetName] od [ROOT.GetCountry.GetAdjective] špatné správy." # todo: NEW TRANSLATION
 dominican_events.1.f: "\"Jsme přesvědčeni, že mezi Dominikánci a Haiti nelze žádné sloučení. Jsme a budeme dva odlišné národy. Náš osud je být nezávislými, naprosto nezávislými.\n\nNaše společnost se bude jmenovat La Trinitaria, protože bude složena ze skupin po třech a umístíme ji pod ochranu Nejsvětější Trojice.\n\nNaše heslo: Bůh, Vlast a Svoboda.\" \n\n— Juan Pablo Duarte, #italic Úryvek z prvního setkání Trinitarios#!" # todo: NEW TRANSLATION
 dominican_events.1.a: "Chci tyto zrádce dopadnout a pověsit. Hned!" # todo: NEW TRANSLATION
 dominican_events.1.b: "Zvyšte financování našich východních oddělení." # todo: NEW TRANSLATION
 modifier_birth_of_the_liberation_army: "Dominikánská osvobozenecká armáda" # todo: NEW TRANSLATION
 modifier_funding_the_haitian_national_guard: "Financování východních posádek" # todo: NEW TRANSLATION
 modifier_expanding_the_eastern_departments: "Rozšíření oddělení Cibao a Ozama" # todo: NEW TRANSLATION
 dominican_events.2.t: "Rebelové obsazují Puerta del Conde" # todo: NEW TRANSLATION
 dominican_events.2.d: "Skupina revolucionářů chytila [ROOT.GetCountry.GetAdjective] posádku naprosto nepřipravenou, vtrhli do hlavní pevnosti Santo Dominga a vyvěsili [SCOPE.sCountry('dominican_scope').GetAdjective] vlajku nad jejími břehy, signalizující začátek otevřeného nepřátelství proti [ROOT.GetCountry.GetCapital.GetCityHubName]." # todo: NEW TRANSLATION
 dominican_events.2.f: "Ve stínu velké pevnosti Santo Domingo čekali konspirátoři. Bylo jich mnohem méně než těch, kdo před několika dni přísahali věrnost, a teď byli mnohem tišší. Najednou se rozběhl posel, zadýchaný: \"Myslím, že jsme byli odhaleni,\" říká, \"hlídka mě pronásledovala a musel jsem udělat dlouhou obcházku, abych se sem dostal.\"\n\nPanika je ochromila, ale když se skupina chystala se rozpadnout, pevné \"Ne!\" od Mella je přerušilo. \"Není čas se vracet: budeme svobodní nebo zemřeme.\" Zvedl svou mušketu do vzduchu a vyřkl hlasitý výkřik: \"Ať žije Dominikánská republika!\" a stiskl spoušť." # todo: NEW TRANSLATION
 dominican_events.2.a: "Jsme slepí? Nasadit armádu!" # todo: NEW TRANSLATION
 dominican_events.2.b: "Za Boha, zemi a svobodu!" # todo: NEW TRANSLATION
 modifier_dominican_mutinies: "Dominikánské vojenské vzpoury" # todo: NEW TRANSLATION
 modifier_rural_peon_levies: "Venkovské peonové oddíly" # todo: NEW TRANSLATION
 modifier_defection_of_dominican_regiments: "Dezercí dominikánských pluků" # todo: NEW TRANSLATION
 dominican_events.3.t: "Jednota, ne Trojice" # todo: NEW TRANSLATION
 dominican_events.3.d: "Naše integrační snahy přinesly ovoce a kdysi mocní 'Trinitaristé' v [SCOPE.sState('santo_domingo_state_scope').GetName] ztratili většinu své podpory. Ostrov je konečně opět jednotný." # todo: NEW TRANSLATION
 dominican_events.3.f: "Dominovat lidu je jedna věc, pomyslel si stárnoucí generál. Získat jejich srdce je věc druhá.\n\nTo první uměl dobře. Strach z jeho salv udržel mnohé nadějné povstalce doma. Musel však přiznat, že druhé mu vždy unikal – fakt, který mu [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetLastNameNoFormatting] rád připomínal.\n\nKdyž jeho prapor odcházel z kasáren naposled, nepřestalo ho tížit hořkost. Civilisté možná přičtou si slávu míru, ale oni dluží svou operační volnost jeho metodám." # todo: NEW TRANSLATION
 dominican_events.3.a: "Podat olivovou ratolest těm, kdo ji uchopí." # todo: NEW TRANSLATION
 dominican_events.3.b: "Musíme zajistit, že se nic takového už nikdy neobjeví." # todo: NEW TRANSLATION
 modifier_breaking_dominicans: "Bičem a mrkví" # todo: NEW TRANSLATION
 dominican_events.4.t: "Svoboda a bezpečí" # todo: NEW TRANSLATION
 dominican_events.4.d: "[ROOT.GetCountry.GetName] je konečně osvobozena od haitského útlaku, přesto hrozby číhají na každém kroku. Může být moudré požádat o ochranu velmoci." # todo: NEW TRANSLATION
 dominican_events.4.f: "\"Navrhuje pán z La Vega, že prodáme naši tvrdě vybojovanou svobodu tak lehce? Stála krev našich mučedníků opravdu méně než láhev levného vína?\"\n\n\"Lépe pána, kterého známe a zvolíme, než toho, který se vnucuje násilím. Ctím oběti našich mučedníků stejně jako vy, pane. Jen chci zajistit, aby naše děti neměly dělat ty samé oběti.\"" # todo: NEW TRANSLATION
 dominican_events.4.a: "Naše nezávislost je absolutní, nelze ji kompromitovat." # todo: NEW TRANSLATION
 dominican_events.4.b: "Znovu se staneme Kapitánskou generálií [SCOPE.sCountry('spain_scope').GetName]." # todo: NEW TRANSLATION
 dominican_events.4.c: "Síla [SCOPE.sCountry('france_scope').GetName] nás ochrání." # todo: NEW TRANSLATION
 dominican_events.4.e: "[SCOPE.sCountry('usa_scope').GetName] nás ochrání." # todo: NEW TRANSLATION
 modifier_vanguards_of_independence: "Předvoj nezávislosti" # todo: NEW TRANSLATION
 modifier_paranoid_landowners: "Podezřívaví pozemkoví vlastníci" # todo: NEW TRANSLATION
 dominican_events.5.t: "Santo Domingo žádá ochranu" # todo: NEW TRANSLATION
 dominican_events.5.d_1: "Z obavy o svou bezpečnost [SCOPE.sCountry('dominican_scope').GetName] požádala opět stát se Kapitánskou generálií [ROOT.GetCountry.GetName]." # todo: NEW TRANSLATION
 dominican_events.5.d_2: "Z obavy o svou bezpečnost [SCOPE.sCountry('dominican_scope').GetName] požádala o zřízení [ROOT.GetCountry.GetAdjective] protektorátu nad zemí a nabídla poloostrov Samana ke stémuletému pronájmu." # todo: NEW TRANSLATION
 dominican_events.5.f: "\"Jsem jen skromný nástroj dominikánského lidu, pane. Každá duše na tomto ostrově touží po blahodárné náruči [ROOT.GetCountry.GetCapital.GetCityHubName]. Zbývá tu jen malá otázka mého postavení v nové správě.\"" # todo: NEW TRANSLATION
 dominican_events.5.a: "Přijmout návrh [SCOPE.sCountry('dominican_scope').GetAdjective]." # todo: NEW TRANSLATION
 dominican_events.5.b: "Odmítnout. To by jen znamenalo potíže." # todo: NEW TRANSLATION
 samana_lease_tt: "Poloostrov #bold Samana#! bude pronajat jako [concept_treaty_port] na #v 100#! let výměnou za roční platbu @money!#v 2000#!" # todo: NEW TRANSLATION
