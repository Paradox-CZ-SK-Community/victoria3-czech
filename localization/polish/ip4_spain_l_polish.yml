 spanish_new_world_events.1.tt_4_event_insight: "[ROOT.GetCountry.GetAdjective] [concept_relations] s #b $GBR$#!, #b $USA$#! a #b všemi bývalými [ROOT.GetCountry.GetAdjectiveNoFormatting] koloniemi#! se zhorší o #r 30#!" # todo: NEW TRANSLATION
 spanish_new_world_events.2.t: "Naše americká říše" # todo: NEW TRANSLATION
 spanish_new_world_events.2.d: "Nemožné se stalo skutečností: nadvláda [ROOT.GetCountry.GetName] v Novém světě byla obnovena. K této významné události byly v hlavních městech obnovených Audiencias připraveny velké triumfy." # todo: NEW TRANSLATION
 spanish_new_world_events.2.f: "Když zazněla trubka a [ROOT.GetCountry.GetAdjectiveNoFormatting] vlajka byla toho rána vztyčena nad Castillo de San Felipe de Barajas, srdce mladého vojína se naplnilo hrdostí. I v ospalé asturské vesnici jeho mládí vzpomínka na obranu Cartageny hrála velkou roli. Nyní [ROOT.GetCountry.GetAdjectiveNoFormatting] prapor opět hrdě vlál ze svých hradeb.\n\nS tichým slibem sobě i Nejvyššímu přísahal, že dokud bude v jeho těle dech, ten prapor nikdy nespadne." # todo: NEW TRANSLATION
 spanish_new_world_events.2.a: "Naše říše se opět táhne od pobřeží k pobřeží." # todo: NEW TRANSLATION
 spanish_new_world_events.2.b: "Všichni poznají sílu [ROOT.GetCountry.GetAdjective] legií." # todo: NEW TRANSLATION
 modifier_our_american_empire_reward_military: "Víra v říši" # todo: NEW TRANSLATION
 modifier_our_american_empire_reward_regular: "Španělské jezero" # todo: NEW TRANSLATION
 spanish_new_world_events.3.t: "O pánéch a služebnících" # todo: NEW TRANSLATION
 spanish_new_world_events.3.d: "Podpisem poslední smlouvy byly diplomatické vztahy [ROOT.GetCountry.GetAdjective] s jejich bývalými poddanými jasně definovány, kde převládly hlasy srdečnosti a vzájemného prospěchu nad hlasy odplaty." # todo: NEW TRANSLATION
 spanish_new_world_events.3.f: "Když se poslední delegát rozloučil, mysl velvyslance se zamyslela nad praktickými věcmi. Před sto lety by takové setkání bylo mezi pánem a služebníkem; nyní se setkali jako rovní. Zůstal u této myšlenky, nejistý, zda to vzbuzuje hrdost či smutek. Jak by to posoudili jeho pradědečkové a jak jeho vnuci? A především – jak by to hodnotil Nejvyšší? Nebyly snad španělské domény dříve držené jako božím právem?\n\nNicméně, prozatím se soustředil jen na jednu jednoduchou myšlenku:" # todo: NEW TRANSLATION
 spanish_new_world_events.3.a: "Matka a její děti, konečně usmířeny." # todo: NEW TRANSLATION
 spanish_new_world_events.4.t: "Starý řád" # todo: NEW TRANSLATION
 spanish_new_world_events.4.d: "S obnovením [SCOPE.sCountry('relevant_country_scope').GetName] se [ROOT.GetCountry.GetName] ocitá o krok blíže k obnovení své dávné nadvlády. Nyní musíme rozhodnout územní rozsah našeho [SCOPE.sCountry('relevant_country_scope').GetAdjectiveNoFormatting] subjektu." # todo: NEW TRANSLATION
 spanish_new_world_events.4.d_caribbean: "S [SCOPE.sCountry('new_spain_scope').GetName] opět pod [ROOT.GetCountry.GetAdjective] kontrolou někteří koloniální úředníci argumentovali ve prospěch konsolidace našich karibských kolonií." # todo: NEW TRANSLATION
 spanish_new_world_events.4.f: "Kolem něj poslové pobíhali komnatou, každý nesl papíry, které rozhodnou osud tisíců. Podepsal je všechny bez přestávky, každý dekret nesl váhu říše. Po léta byly prohledávány staré koloniální záznamy, konány rady a vyslyšeny hlasy ze všech koutů španělské domény.\n\nA nyní konečně přinesla práce své ovoce: [SCOPE.sCountry('relevant_country_scope').GetNameNoFormatting] se vrátil do náruče." # todo: NEW TRANSLATION
 spanish_new_world_events.4.f_caribbean: "\"Promiňte, kolik to bylo pesos ročně, prosím?\"\n\n\"Přesně to jsem si myslel, pane. Tento systém paralelní správy jen vysává naše pokladny a posiluje vzbouřence.\"" # todo: NEW TRANSLATION
 spanish_new_world_events.4.a_1: "Přidělte jim severoamerickou pevninu." # todo: NEW TRANSLATION
 spanish_new_world_events.4.a_2: "Budou vládnout nad celým [GetStrategicRegion('region_gran_colombia').GetName]." # todo: NEW TRANSLATION
 spanish_new_world_events.4.a_3: "Budou vládnout nad celým [GetStrategicRegion('region_andes').GetName]." # todo: NEW TRANSLATION
 spanish_new_world_events.4.a_4: "Budou vládnout nad celým [GetStrategicRegion('region_la_plata').GetName]." # todo: NEW TRANSLATION
 spanish_new_world_events.4.a_5: "[SCOPE.sCountry('relevant_country_scope').GetName] bude vládnout nad celým [GetStrategicRegion('region_caribbean').GetName]." # todo: NEW TRANSLATION
 spanish_new_world_events.4.b_1: "Před-napoleonské hranice musí být plně obnoveny." # todo: NEW TRANSLATION
 spanish_new_world_events.4.b_2: "Oblast [GetStrategicRegion('region_caribbean').GetName] by měla být spravována z [SCOPE.sCountry('new_spain_scope').GetName]." # todo: NEW TRANSLATION
 spanish_new_world_events.4.c: "Nechat současnou správu v platnosti." # todo: NEW TRANSLATION
