l_polish:
 je_spa_economic_regeneration_master_completion_tt_1: "Dokončili jsme #v 6#! #bold $je_group_spa_economic_regeneration$#! reforem" # todo: NEW TRANSLATION
 je_spa_economic_regeneration_master_completion_tt_2: "Dokončili jsme #v 3#! #bold $je_group_spa_economic_regeneration$#! reforem" # todo: NEW TRANSLATION
 je_spa_economic_regeneration_reduce_economic_objectives_button: "Snížit ekonomické cíle" # todo: NEW TRANSLATION
 je_spa_economic_regeneration_reduce_economic_objectives_button_desc: "Cíle uvedené v počáteční zprávě se jeví jako mírně příliš ambiciózní. Předefinováním našich ekonomických záměrů nyní se můžeme vyhnout nejhorším následkům nesplnění našich slibů." # todo: NEW TRANSLATION
 je_spa_economic_regeneration_reduce_economic_objectives_button_tt_1: "Dokončili jsme #v 3#! nebo méně #bold $je_group_spa_economic_regeneration$#! reforem" # todo: NEW TRANSLATION
 je_spa_economic_regeneration_reduce_economic_objectives_button_tt_2: "Budeme muset dokončit pouze #v 3#! #bold $je_group_spa_economic_regeneration$#! reformy" # todo: NEW TRANSLATION
 je_spa_economic_regeneration_reduce_economic_objectives_button_tt_3: "#bold účinky#! a #bold trvání#! odměn #bold $je_spa_economic_regeneration_master$#! hlavního [concept_journal_entry] budou #r zmenšeny na polovinu#!" # todo: NEW TRANSLATION
 modifier_reduced_economic_objectives: "Snížené ekonomické cíle" # todo: NEW TRANSLATION
 je_spa_economic_regeneration_cheat_button: "Použít kreativní účetnictví" # todo: NEW TRANSLATION
 je_spa_economic_regeneration_cheat_button_desc: "Nároky zaopatřených písařů #italic Hacienda#! jsou v lepším případě ambiciózní a v horším případě bludné. Nepatrnou manipulací v našich účetních knihách můžeme prosadit politiku ekonomických reforem více odpovídající skutečným schopnostem [ROOT.GetCountry.GetName].\n\nMusíme jen zajistit, aby žádný kompromitující materiál nedopadl do rukou tisku." # todo: NEW TRANSLATION
 je_spa_economic_regeneration_cheat_button_caught_tt: "Váš pokus o #bold manipulaci#! byl #r odhalen#! veřejností." # todo: NEW TRANSLATION
 je_spa_economic_regeneration_cheat_button_success_tt: "Podmínky dokončení a #bold odměny#! tohoto [concept_journal_entry] jsou #g sníženy#!" # todo: NEW TRANSLATION
 je_spa_economic_regeneration_cheat_button_conditions_tt: "Základní šance na úspěch je určena vaším [GetLawGroup('lawgroup_free_speech').GetName] [concept_law]:\n• #v 90%#! za to, že máte [GetLawType('law_outlawed_dissent').GetName] [concept_law]\n• #v 70%#! za to, že máte [GetLawType('law_censorship').GetName] [concept_law]\n• #v 40%#! za to, že máte [GetLawType('law_right_of_assembly').GetName] [concept_law]\n• #v 20%#! za to, že máte [GetLawType('law_protected_speech').GetName] [concept_law]\nTuto šanci dále zvyšuje:\n• #g +10%#! #bold za každou úroveň#! [GetInstitutionType('institution_home_affairs').GetName], kterou vlastníte" # todo: NEW TRANSLATION
 modifier_bureaucratic_interference: "Byrokratické machinace" # todo: NEW TRANSLATION
 je_spa_economic_regeneration_master_status_loc_blank: "" # todo: NEW TRANSLATION
 je_spa_economic_regeneration_master_status_loc: "Dokončili jsme #variable [ROOT.GetCountry.MakeScope.Var('spa_economic_regeneration_var').GetValue]#!/#variable [ROOT.GetCountry.MakeScope.Var('spa_economic_regeneration_goal_var').GetValue]#! reforem" # todo: NEW TRANSLATION
 je_group_spa_economic_regeneration: "Ekonomická regenerace" # todo: NEW TRANSLATION
 modifier_failed_economic_regeneration: "Neúspěšná ekonomická regenerace" # todo: NEW TRANSLATION
 je_spa_economic_regeneration_master_timeout_tt_1: "Pokud dokončíme #bold více než polovinu#! ze #variable [ROOT.GetCountry.MakeScope.Var('spa_economic_regeneration_goal_var').GetValue]#! plánovaných #bold $je_group_spa_economic_regeneration$#! reforem, tento trest bude #g zmírněn#!" # todo: NEW TRANSLATION
 je_spa_economic_regeneration_master_timeout_tt_2: "Vzhledem k tomu, že jsme dokončili #bold více než polovinu#! ze #variable [ROOT.GetCountry.MakeScope.Var('spa_economic_regeneration_goal_var').GetValue]#! plánovaných #bold $je_group_spa_economic_regeneration$#! reforem, tento trest byl #g zmírněn#!" # todo: NEW TRANSLATION
 je_spa_economic_regeneration_master: "Ekonomická regenerace" # todo: NEW TRANSLATION
 je_spa_economic_regeneration_master_reason: "Už dávno jsou pryč časy, kdy byla [ROOT.GetCountry.GetName] synonymem bohatství. Staletí špatného řízení a neštěstí proměnila [ROOT.GetCountry.GetAdjectiveNoFormatting] ekonomiku ve stín své bývalé velikosti – neschopnou naplnit i ty nejzákladnější požadavky moderní doby.\n\nAle stejně jako Ježíš vzkřísil Lazara z hrobu, tak i dobří muži z Hacienda pozvednou [ROOT.GetCountry.GetAdjectiveNoFormatting] ekonomiku z jejího dlouhého spánku. Osud [ROOT.GetCountry.GetNameNoFormatting] není v rozpadlých říších minulosti, nýbrž v síle zítřka." # todo: NEW TRANSLATION
 modifier_economic_regeneration_reward_greater: "Zázrak Mesety" # todo: NEW TRANSLATION
 modifier_economic_regeneration_reward_lesser: "Komplexní ekonomická regenerace" # todo: NEW TRANSLATION
 je_spa_economic_regeneration_land_reform: "Regenerace: Pozemková reforma" # todo: NEW TRANSLATION
 je_spa_economic_regeneration_land_reform_reason: "Otázka pozemkové reformy je již dlouho na rtech [ROOT.GetCountry.GetAdjective] politiků; někteří usilují o prolomení moci velkých pozemkových elit na jihu, zatímco jiní se snaží tuto moc ještě upevnit.\n\nNastal čas, aby se vláda rozhodla a šla za svým kursu s neochvějným odhodláním." # todo: NEW TRANSLATION
 je_spa_economic_regeneration_land_reform_tt_1: "Pokud se rozhodneme postavit #b na stranu#! [SCOPE.gsInterestGroup('landowners_scope').GetName]:" # todo: NEW TRANSLATION
 je_spa_economic_regeneration_land_reform_tt_2: "Pokud se rozhodneme postavit #b proti#! [SCOPE.gsInterestGroup('landowners_scope').GetName]:" # todo: NEW TRANSLATION
 modifier_entrepreneurial_latifundistas: "Podnikaví Latifundistas" # todo: NEW TRANSLATION
 modifier_marginalized_latifundistas: "Marginalizovaní Latifundistas" # todo: NEW TRANSLATION
 je_spa_economic_regeneration_modernise_agriculture: "Regenerace: Zemědělství" # todo: NEW TRANSLATION
 je_spa_economic_regeneration_modernise_agriculture_reason: "Projít méně rozvinutými oblastmi Mesety Centrální je jako vstoupit do minulosti. Pluhy a nástroje tamních rolníků se příliš neliší od těch jejich předků; jejich výnosy jsou omezené praktikami, které jinde už byly dávno opuštěny.\n\nBez reforem nemůže tato půda doufat, že udrží prosperitu [ROOT.GetCountry.GetName]." # todo: NEW TRANSLATION
 je_spa_economic_regeneration_modernise_agriculture_tt_1: "Následující platí již #b 24#! po sobě jdoucích měsíců (aktuálně #v [ROOT.GetCountry.MakeScope.Var('je_spa_economic_regeneration_modernise_agriculture_timer_var').GetValue]#!):" # todo: NEW TRANSLATION
 je_spa_economic_regeneration_modernise_agriculture_tt_2: "Následující platí již #b 12#! po sobě jdoucích měsíců (aktuálně #v [ROOT.GetCountry.MakeScope.Var('je_spa_economic_regeneration_modernise_agriculture_timer_var').GetValue]#!):" # todo: NEW TRANSLATION
 modifier_population_boom: "Demografický boom" # todo: NEW TRANSLATION
 modifier_falling_birthrates: "Klesající porodnost" # todo: NEW TRANSLATION
 je_spa_economic_regeneration_mining: "Regenerace: Těžba" # todo: NEW TRANSLATION
 je_spa_economic_regeneration_mining_reason: "Iberský poloostrov skrývá velká, nevyužitá ložiska surovin, připravená k vytěžení.\n\nZatímco sektor je dnes stále nedostatečně rozvinutý, naši hlavní geologové trvají na tom, že země skrývá tolik bohatství, že může národ vynést do nové zlaté éry těžby—převyšující dokonce i dny římské Hispánie." # todo: NEW TRANSLATION
 je_spa_economic_regeneration_mining_upgrade_state_trait_tt_1: "Budeme schopni #g zdvojnásobit#! účinky jednoho z #tooltippable;TOOLTIP:je_spa_economic_regeneration_mining_upgrade_iberian_state_traits_tt #bold těžebně souvisejících státních rysů#!#! v [GetGeographicRegion('region_iberia').GetName]" # todo: NEW TRANSLATION
 je_spa_economic_regeneration_mining_upgrade_state_trait_tt_2: "Budeme schopni udělit #g pozitivní#! #b dočasný efekt#! k doplnění jednoho z #tooltippable;TOOLTIP:je_spa_economic_regeneration_mining_upgrade_iberian_state_traits_tt #bold těžebně souvisejících státních rysů#!#! v [GetGeographicRegion('region_iberia').GetName]" # todo: NEW TRANSLATION
 je_spa_economic_regeneration_mining_upgrade_iberian_state_traits_tt: "\n• $STATE_BASQUE_COUNTRY$: #bold $state_trait_somorrostro_valley$#!\n• $STATE_ASTURIAS$: #bold $state_trait_cuencas_mineras$#!\n• $STATE_LOWER_ANDALUSIA$: #bold $state_trait_riotinto_basin$#!\n• $STATE_MURCIA$: #bold $state_trait_sierra_minera_de_cartagena$#!" # todo: NEW TRANSLATION
 modifier_spa_mineral_boom: "Dobytí podzemí" # todo: NEW TRANSLATION
 modifier_local_mining_boom: "Těžební boom" # todo: NEW TRANSLATION
 modifier_mineral_investment_dearth: "Nedostatek investic do surovin" # todo: NEW TRANSLATION
 je_spa_economic_regeneration_light_industry: "Regenerace: Průmysl" # todo: NEW TRANSLATION
 je_spa_economic_regeneration_light_industry_reason: "Nikde není předmodernost [ROOT.GetCountry.GetName] cítit tolik jako v jejím výrobním sektoru. Stále převážně řemeslná, [ROOT.GetCountry.GetAdjectiveNoFormatting] manufaktura se obtížně prosazuje proti levnému zahraničnímu zboží, s výjimkou několika lokalit jako Barcelona.\n\nVytvořením silného průmyslového sektoru v klíčových místech v celé zemi můžeme zvrátit tok zahraniční hospodářské dominance." # todo: NEW TRANSLATION
 modifier_industrial_investment_dearth: "Nespokojený výrobní sektor" # todo: NEW TRANSLATION
 modifier_manufactoring_boom: "Výrobní boom" # todo: NEW TRANSLATION
 every_state_following_requirements_tt: "Každý [concept_state], který splní požadavky, obdrží následující modifikátor:" # todo: NEW TRANSLATION
 modifier_facilitated_manufacturing_boom: "Mistři továrny" # todo: NEW TRANSLATION
 je_spa_economic_regeneration_railways: "Regenerace: Železnice" # todo: NEW TRANSLATION
 je_spa_economic_regeneration_railways_reason: "Z mnoha velkých vynálezů této doby jen málo měří surový potenciál parního lokomotivu. [ROOT.GetCountry.GetAdjective] vnitrozemí zůstalo dlouho relativně izolované od zbytku země, obklopené horským terénem, špatnými silničními sítěmi a řekami, které jsou plně splavné jen částečně.\n\nKde selhal vůz a člun, tam zvítězí parní lokomotiva a každý kousek [ROOT.GetCountry.GetAdjectiveNoFormatting] půdy bude stejně spojen s širším trhem jako dnes přístav v Bilbau." # todo: NEW TRANSLATION
 modifier_arteries_of_the_nation: "Hlavní tepny národa" # todo: NEW TRANSLATION
 modifier_railway_magnates: "Magnáti železnic" # todo: NEW TRANSLATION
 modifier_entrenchment_of_local_power: "Izolovaná mocenská centra" # todo: NEW TRANSLATION
 je_spa_economic_regeneration_ultramar: "Regenerace: Koloniální" # todo: NEW TRANSLATION
 je_spa_economic_regeneration_ultramar_reason: "Během tzv. Zlatého století proudilo mnoho bohatství [ROOT.GetCountry.GetName] z jejích kolonií. Zatímco dynamika kolonialismu se od té doby změnila, některé pravdy platí i dnes:\n\nUltramar skrývá velké bohatství a byli bychom hloupí, kdybychom ho nevyužili." # todo: NEW TRANSLATION
 every_colonial_subject_following_requirements_tt: "Každý #b koloniální#! [concept_subject], který splní požadavky, obdrží následující modifikátor:" # todo: NEW TRANSLATION
 modifier_integrated_colony: "Finančně integrovaná kolonie" # todo: NEW TRANSLATION
 modifier_neglected_colony: "Zanedbané ministerstvo zámoří" # todo: NEW TRANSLATION
 spa_economic_regeneration_events.1.t: "O obecném stavu státní pokladny" # todo: NEW TRANSLATION
 spa_economic_regeneration_events.1.d: "Ministr financí nastínil ambiciózní reformní plán zaměřený na opětovné zařazení země mezi přední světové ekonomiky a zdůraznil nedostatečný stav [ROOT.GetCountry.GetAdjective] ekonomiky." # todo: NEW TRANSLATION
 spa_economic_regeneration_events.1.f: "#bold Ekonomická zpráva o obecném stavu státní pokladny nejuctívanějšímu [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] z [ROOT.GetCountry.GetNameNoFormatting]#!\nNesmí být žádným překvapením pro vážené pány z [ROOT.GetCountry.GetCapital.GetCityHubName], že vlny průmyslových a obchodních inovací, které tak proměnily naše bratří za Pyrenejemi, dosud nedopadly ve větším rozsahu na břehy našich vlastních domén. Hacienda je toho názoru, že pokud nebudou okamžitě přijata opatření k nápravě tohoto rostoucího nerovnovážného stavu, náš národ se nebude ubírat směrem k civilizaci a prosperitě, ale spíše k barbarství a bídě. Následující zpráva bude ..." # todo: NEW TRANSLATION
 spa_economic_regeneration_events.1.a: "Náročné, možná. Ale nutné." # todo: NEW TRANSLATION
 spa_economic_regeneration_events.1.b: "V tuto chvíli nejsme v pozici tímto směrem postupovat." # todo: NEW TRANSLATION
 spa_economic_regeneration_events.1.tt_1: "Program #bold Ekonomické regenerace#! vyžaduje řadu reforem, které mají být provedeny během #v 20#! let." # todo: NEW TRANSLATION
 spa_economic_regeneration_events.1.tt_2: "Nesplnění cílů programu včas #r zhorší#! politickou stabilitu [ROOT.GetCountry.GetAdjective]" # todo: NEW TRANSLATION
 spa_economic_regeneration_events.1.tt_3: "#bold $je_spa_economic_regeneration_master$#! [concept_journal_entry] bude prozatím #r deaktivován#!, ale bude #g znovu dostupný#! po #v 5#! letech." # todo: NEW TRANSLATION
 modifier_economic_regeneration_postponed: "Ekonomická regenerace odložena" # todo: NEW TRANSLATION
 spa_economic_regeneration_events.2.t: "Odhalena vládní manipulace" # todo: NEW TRANSLATION
 spa_economic_regeneration_events.2.d: "Neohrožení reportéři pracující pro [SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName] [SCOPE.GetRootScope.GetCountry.GetCustom('generic_newspaper_type')] odhalili naše pokusy o manipulaci a publikovali tvrdou zprávu obviňující vládu z neschopnosti a klamání." # todo: NEW TRANSLATION
 spa_economic_regeneration_events.2.f: "Káva dnes chutnala lépe. Vždy chutnala lépe, když měl dobrou náladu. A dnes měl dobrou náladu. Nic, alespoň nic, co by stálo za zveřejnění, mu nedělalo větší radost než vidět současnou vládu klopýtat ze skandálu do skandálu. \"Pořádní hlupáci,\" zamumlal a znovu si usrkl kávy." # todo: NEW TRANSLATION
 spa_economic_regeneration_events.2.a: "Ať jsou zatraceni. Potvrďme náš závazek k původním cílům." # todo: NEW TRANSLATION
 spa_economic_regeneration_events.2.b: "Uspořádejte masivní tiskovou kampaň k diskreditaci jejich tvrzení." # todo: NEW TRANSLATION
 spa_economic_regeneration_events.2.tt_1: "Původní cíle zůstanou nezměněny a tuto manipulaci již nebudeme moci zkusit znovu." # todo: NEW TRANSLATION
 modifier_regeneration_target_manipulations_revealed: "Odhalena manipulace s regenerací" # todo: NEW TRANSLATION
 modifier_divisive_press_campaign: "Rozdělující tisková kampaň" # todo: NEW TRANSLATION
 modifier_press_campaign_expenses: "Financování vládě nakloněných novin" # todo: NEW TRANSLATION
 spa_economic_regeneration_events.3.t: "Než se skřivan probudí" # todo: NEW TRANSLATION
 spa_economic_regeneration_events.3.d: "Rozsáhlé [ROOT.GetCountry.GetAdjective] investice do těžby přinesly ovoce a doly země jsou čileji vyhlášené než kdy dříve. Jedna mimořádně úspěšná společnost nyní oslovila vládu s návrhem na zlepšení těžební infrastruktury v jednom z našich hlavních těžařských distriktů." # todo: NEW TRANSLATION
 spa_economic_regeneration_events.3.f: "Dva ostré klepnutí na dveře přerušily horníkovu snídani. Ponechal ji příliš dlouho a foremanův chlapec obcházel vesnici. #italic Ten zatracený podliz#!. Políbil ženu na rozloučenou, hodil si přes rameno pytel a vykročil do chladného úsvitu. Ponurý průvod se vinul z dělnického městečka k jámě, ticho přerušovalo jen tupé klepání kovu o kov. Čekalo ho dvanáct hodin dřiny a tmy." # todo: NEW TRANSLATION
 spa_economic_regeneration_events.3.a: "Nasměrujte je na bohaté žíly [GetGoods('iron').GetName] v [SCOPE.sState('basque_country_scope').GetStateRegion.GetName]." # todo: NEW TRANSLATION
 spa_economic_regeneration_events.3.b: "Doly [GetGoods('sulfur').GetName] v [SCOPE.sState('lower_andalusia_scope').GetStateRegion.GetName] by mohly být rozšířeny." # todo: NEW TRANSLATION
 spa_economic_regeneration_events.3.c: "Starší doly na [GetGoods('lead').GetName] v [SCOPE.sState('murcia_scope').GetStateRegion.GetName] potřebují modernizaci." # todo: NEW TRANSLATION
 spa_economic_regeneration_events.3.e: "Co jiného než [GetGoods('coal').GetName], černé zlato [SCOPE.sState('asturias_scope').GetStateRegion.GetName]." # todo: NEW TRANSLATION
 spa_economic_regeneration_events.4.t: "Hacienda požaduje akci" # todo: NEW TRANSLATION
 spa_economic_regeneration_events.4.d: "S odkazem na ekonomický reformní program navržený před několika lety nyní ministr financí požaduje, abychom okamžitě zahájili jeho provádění, tvrdíce, že pokud vláda nebude jednat, [ROOT.GetCountry.GetName] skončí v prachu dějin." # todo: NEW TRANSLATION
 spa_economic_regeneration_events.4.f: "$spa_economic_regeneration_events.1.f$" # todo: NEW TRANSLATION
 spa_economic_regeneration_events.4.a: "Dobře, udělejte potřebná oznámení." # todo: NEW TRANSLATION
 spa_economic_regeneration_events.4.b: "Stále nejsme v pozici tomu čelit." # todo: NEW TRANSLATION
 spa_economic_regeneration_events.4.tt: "Jelikož jsme již jednou #bold odložili#! reformy, #r tresty#! za jejich opětovné odložení budou #r zdvojnásobeny#!." # todo: NEW TRANSLATION
 spa_economic_regeneration_events.5.t: "Plus Ultra" # todo: NEW TRANSLATION
 spa_economic_regeneration_events.5.d: "Po úspěšném provedení programu Regenerace vláda sklízí chválu i od svých nejzuřivějších odpůrců." # todo: NEW TRANSLATION
 spa_economic_regeneration_events.5.f: "S klidnou rukou ministr otevřel velký účetní knihu a znovu přelétl očima čísla v ní. Do jaké míry jim lze věřit, si nebyl zcela jist, ale to mělo menší váhu proti veřejnému nadšení, které jistě vyvolají. Ne, pomyslel si, to zúčtování lze nechat na dětech zítřka. Dnes patří jemu." # todo: NEW TRANSLATION
 spa_economic_regeneration_events.5.a: "[ROOT.GetCountry.GetName] hrdě kráčí do budoucnosti." # todo: NEW TRANSLATION
 modifier_great_reformer: "Velký reformátor" # todo: NEW TRANSLATION
 modifier_capable_reformer: "Schopný reformátor" # todo: NEW TRANSLATION
 spa_economic_regeneration_events.6.t: "Úpadek" # todo: NEW TRANSLATION
 spa_economic_regeneration_events.6.d: "Neschopnost vlády prosadit reformy Regenerace vyvolala veřejné pobouření. Rozzuřené davy se shromažďují před Haciendou a tisk prohlašuje selhání za národní ostudu." # todo: NEW TRANSLATION
 spa_economic_regeneration_events.6.f: "Kolik ponížení musí tato země ještě snést? Nebyla snad události minulého století dostačující? Ministr odhrnul závěs a pohlédl do ulice, kde dav vytvořil figurínu v jeho podobě—hrubá postava visící na špatně uvázaném provazu. Její tvář nesla zkreslenou parodii stejného kníru, který ho každé ráno vítal, kývala sem a tam v rytmu šílených davu dole.\n\nOtočil se na svého komorníka. \"Pošli pro kočár, prosím. A pošli také vzkaz mému holiči, že ho dnes odpoledne musím vidět.\"" # todo: NEW TRANSLATION
 spa_economic_regeneration_events.6.a: "Karty byly proti nám." # todo: NEW TRANSLATION
 spanish_new_world_events.1.t: "Španělské hlavní území" # todo: NEW TRANSLATION
 spanish_new_world_events.1.d: "Po obnovení pořádku doma musí [ROOT.GetCountry.GetName] rozhodnout o svém postoji vůči bývalým povstaleckým koloniím v Americe, jejichž nezávislost není uznána v [ROOT.GetCountry.GetCapital.GetCityHubName]." # todo: NEW TRANSLATION
 spanish_new_world_events.1.f: "\"Pánové, je nezbytné, abychom následovali Anglii. Když si uvědomila, že Třináct kolonií jsou navždy ztraceny, navázala s nimi silné obchodní a kulturní vazby. Dodnes to zůstává jedním z jejích největších zdrojů síly.\n\nProč bychom takovou příležitost zahodili kvůli špatně pochopené slávě nebo pomstě? Zvláště když naše současná situace je, jaká je?\"" # todo: NEW TRANSLATION
 spanish_new_world_events.1.a: "Staré impérium je pryč. Je čas čelit realitě naší situace." # todo: NEW TRANSLATION
 spanish_new_world_events.1.b: "Zbabělci. Zavolejte válečného ministra, velezrada nebude odměněna." # todo: NEW TRANSLATION
 spanish_new_world_events.1.tt_1: "To nás nasměruje na cestu #g normalizace#! s našimi bývalými koloniemi." # todo: NEW TRANSLATION
 spanish_new_world_events.1.tt_2: "To nás uvede na #b obtížnou#! cestu #r dobytí#! zaměřenou na naše bývalé kolonie." # todo: NEW TRANSLATION
 spanish_new_world_events.1.tt_3: "[SCOPE.sCountry('britain_scope').GetName] a [SCOPE.sCountry('usa_scope').GetName] budou pravděpodobně #b zasahovat proti nám#! v [Concept('concept_diplomatic_play','$concept_diplomatic_plays$')|l] zaměřených na naše bývalé kolonie, pokud s nimi neudržíme velmi dobré vztahy." # todo: NEW TRANSLATION
 spanish_new_world_events.1.tt_4: "[ROOT.GetCountry.GetAdjective] [concept_relations] s [SCOPE.sCountry('britain_scope').GetName], [SCOPE.sCountry('usa_scope').GetName] a #b všemi bývalými [ROOT.GetCountry.GetAdjectiveNoFormatting] koloniemi#! se zhorší o #r 30#!" # todo: NEW TRANSLATION
 spanish_new_world_events.1.tt_5: "Ve světových očích se #b znemožníme#! a všechny jihoamerické země ztratí #b $modifier_not_recognized_by_spain$#! [concept_modifier]" # todo: NEW TRANSLATION
