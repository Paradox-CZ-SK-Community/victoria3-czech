 je_la_trinitaria_reason: "Sjednocení západní a východní části Hispanioly; [SCOPE.sState('haiti_state_scope').GetName] a [SCOPE.sState('santo_domingo_state_scope').GetName], nebylo šťastné. Založené silou ruky v roce 1822 mělo zpočátku omezenou podporu u vybraných elit a afro-dominikánců. Avšak politiky [ROOT.GetCountry.GetName] – těžké daně, pozemkové redistribuce a masové konfiskace spolu s protikatolickými praktikami a obecnou špatnou správou – brzy obrátily většinu populace proti vládě z [ROOT.GetCountry.GetCapital.GetCityHubName].\n\nPokud nebudou podniknuty rozhodné kroky, toto nespokojení se brzy pravděpodobně promění v ozbrojené povstání." # todo: NEW TRANSLATION
