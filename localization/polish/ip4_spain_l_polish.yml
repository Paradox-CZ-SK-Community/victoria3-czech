 vernacular_events.1.t: "O postavení regionálních jazyků" # todo: NEW TRANSLATION
 vernacular_events.1.d: "V zastání univerzalizace jazyka [SCOPE.sCulture('official_culture_scope').GetName] prominentní politikové a intelektuálové prosazují tvrdá asimilační opatření namířená proti mluvčím regionálních jazyků [ROOT.GetCountry.GetName]." # todo: NEW TRANSLATION
 vernacular_events.1.f: "Ačkoliv by bylo skutečně osvěžující, kdyby existoval jediný globální jazyk, to není politicky proveditelné, ale jediný jazyk uvnitř státu by byl realistickým projektem.\n\n— Henri Grégoire, #italic Zpráva o nutnosti a prostředcích k zničení patois a universalizaci používání francouzského jazyka#!" # todo: NEW TRANSLATION
 vernacular_events.1.a: "Mluv [SCOPE.sCulture('official_culture_scope').GetName], buď čistý." # todo: NEW TRANSLATION
 vernacular_events.1.b: "Ne. Usilujme o udělení spoluzákonného statusu [ROOT.GetCountry.GetCustom('getRegionalLanguagesType')]." # todo: NEW TRANSLATION
 vernacular_events.1.c: "Pokračovat v dosavadní politice, není třeba rozhýbávat loď." # todo: NEW TRANSLATION
 vernacular_events.1.a_tt: "Budeme se snažit #r asimilovat#! mluvčí [ROOT.GetCountry.GetCustom('getRegionalLanguagesType')] a učinit z nich řádné [SCOPE.sCulture('official_culture_scope').GetCustom('getPluralDemonym')]. To nám poskytne #b silné bonusy#! k #b centralizaci#! a #b homogenizaci#! našeho státu" # todo: NEW TRANSLATION
 vernacular_events.1.b_tt: "Budeme se snažit #g integrovat#! mluvčí [ROOT.GetCountry.GetCustom('getRegionalLanguagesType')], což nám přinese další [concept_primary_cultures]. To bude vyžadovat #b vysoké kulturní#! [concept_acceptance] a splnění různých #b regionálních agend#!" # todo: NEW TRANSLATION
 vernacular_events.1.c_tt: "#b $je_vernacular_policy$#! [concept_journal_entry] bude #r navždy zrušen#!" # todo: NEW TRANSLATION
 vernacular_events.2.t: "V [ROOT.GetCountry.GetNameNoFormatting] se mluví [SCOPE.sCulture('official_culture_scope').GetNameNoFormatting]" # todo: NEW TRANSLATION
 vernacular_events.2.d: "Asimilační snahy přinesly ovoce a kdysi rozšířená [ROOT.GetCountry.GetCustom('getRegionalLanguagesType')] jsou nyní vyslovovány jen venkovskými poustevníky a tvrdohlavými starými bábičkami." # todo: NEW TRANSLATION
 vernacular_events.2.f: "\"Můj dědeček mi kdysi vyprávěl o této vesnici, projížděl ji stejně jako já teď: aby zapsal každého muže, ženu, dítě i zvíře známé Všemohoucímu a státu. 'Dřív', říkal. 'zvířata a děti byly snáze pochopitelná než jejich staří.' Ha! Kolik se může změnit za jednu či dvě generace, pane. Jak moc...\n\n\"...\"\n\n\"Co?\"\n\n\"Compre#italic hensible#!, pane.\"" # todo: NEW TRANSLATION
 vernacular_events.2.a: "Jeden národ." # todo: NEW TRANSLATION
 vernacular_events.2.b: "Jeden jazyk." # todo: NEW TRANSLATION
 modifier_assimilation_reward: "Asimilační školní politiky" # todo: NEW TRANSLATION
 vernacular_events.2.b_tt: "Následující modifikátor bude aplikován na všechny [SCOPE.sCulture('official_culture_scope').GetName] [concept_homeland] [Concept('concept_state','$concept_states$')|l]:" # todo: NEW TRANSLATION
 modifier_academie_francaise: "Rozšířená Académie Française" # todo: NEW TRANSLATION
 modifier_increased_centralization: "Centralizace byrokracie" # todo: NEW TRANSLATION
 modifier_royal_spanish_academy: "Rozšířená Real Academia Española" # todo: NEW TRANSLATION
 modifier_spanish_academy: "Rozšířená Academia Española" # todo: NEW TRANSLATION
 vernacular_events.3.t: "Říše mnoha jazyků" # todo: NEW TRANSLATION
 vernacular_events.3.d: "Se statutem regionálních jazyků [ROOT.GetCountry.GetName] nyní uznaným a právně chráněným se dlouho nevyrovnaný vztah země k regionálním identitám konečně vyřešil." # todo: NEW TRANSLATION
 vernacular_events.3.f: "Zpracovávání místních petic nikdy nebylo snadné, ale po zavedení nových předpisů to bylo noční můrou. Každý vesničan s haléřem posílal své podněty; kakofonie slov a výrazů, která žádný pán z [ROOT.GetCountry.GetCapital.GetCityHubName] nikdy nevysloví!\n\n\"Ne,\" pomyslel si a zavrtěl hlavou. V dobrých starých dobách by se tito lidé nikdy neodvážili zapojit do státního aparátu." # todo: NEW TRANSLATION
 vernacular_events.3.a: "V rozmanitosti jednota." # todo: NEW TRANSLATION
 vernacular_events.3.b: "V jednotě síla." # todo: NEW TRANSLATION
 modifier_cultural_dynamism: "Kulturní dynamika" # todo: NEW TRANSLATION
 modifier_strength_through_diversity: "Decentralizované velení regimentů" # todo: NEW TRANSLATION
 modifier_empowered_regional_administrations: "Posílené regionální správy" # todo: NEW TRANSLATION
 subject_interactions.1.t: "Jmenování guvernéra" # todo: NEW TRANSLATION
 subject_interactions.1.d: "Existuje několik typů kandidátů, které můžeme zvážit pro hlavu správy v [SCOPE.sCountry('target_country').GetName]. Jaký typ vůdce hledáme?" # todo: NEW TRANSLATION
 subject_interactions.1.f: "\"Správa věcí veřejných je velmi jemná záležitost. Každý stát má své vlastní tlaky, své lobby a své obavy. Naší prací je zajistit, aby všechny tyto otázky byly efektivně odstraněny z desky, aby se nikdy znovu nepostavily na odpor našim záměrům.\"" # todo: NEW TRANSLATION
 subject_interactions.1.a: "Pan [SCOPE.sCharacter('colonial_governor_plantation_scope').GetLastName], [GetCharacterTrait('special_character_colonial_plantation').GetName], převezme vedení." # todo: NEW TRANSLATION
 subject_interactions.1.b: "Zvolme [GetCharacterTrait('special_character_colonial_local').GetName]: pana [SCOPE.sCharacter('colonial_governor_local_scope').GetLastName]." # todo: NEW TRANSLATION
 subject_interactions.1.c: "Udělíme úřad panu [SCOPE.sCharacter('colonial_governor_extraction_scope').GetLastName], [GetCharacterTrait('special_character_colonial_extraction').GetName]." # todo: NEW TRANSLATION
 subject_interactions.1.e: "Pan [SCOPE.sCharacter('colonial_governor_business_scope').GetLastName], [GetCharacterTrait('special_character_colonial_business').GetName], je nejlepší volba." # todo: NEW TRANSLATION
 subject_interactions.1.g: "[GetCharacterTrait('special_character_colonial_military').GetName] [SCOPE.sCharacter('colonial_governor_military_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('colonial_governor_military_scope').GetLastName] zajistí stabilitu." # todo: NEW TRANSLATION
 subject_interactions.2.t: "Změna režimů" # todo: NEW TRANSLATION
 subject_interactions.2.d: "Máme právo napravit problémy ve vládě [SCOPE.sCountry('target_country').GetName]. Otázkou zůstává, jakého typu změny jsou potřeba." # todo: NEW TRANSLATION
 subject_interactions.2.f: "Postavy se shlukly kolem stolu a vyměňovaly spisy. Bylo to úžasné—tady byly, přehazovaly slova a kolektivním přikývnutím a pohybem pera měnily samotné jádro národa." # todo: NEW TRANSLATION
 subject_interactions.2.a: "Změníme vládnoucí strany v [SCOPE.sCountry('target_country').GetName]." # todo: NEW TRANSLATION
 subject_interactions.2.b: "Zavést jednopartijní vládu." # todo: NEW TRANSLATION
 subject_interactions.2.c: "Zdemokratizovat [SCOPE.sCountry('target_country').GetName]." # todo: NEW TRANSLATION
 subject_interactions.2.dd: "Musíme reformovat trhy [SCOPE.sCountry('target_country').GetName]." # todo: NEW TRANSLATION
 subject_interactions.2.e: "[SCOPE.sCountry('target_country').GetName] se stane předvojem revoluce!" # todo: NEW TRANSLATION
 subject_interactions.3.t: "Žádost o guvernéra" # todo: NEW TRANSLATION
 subject_interactions.3.d: "Politická elita v [ROOT.GetCountry.GetCapital.GetCityHubName] považuje jednání [SCOPE.sCharacter('relevant_character').GetPrimaryRoleTitle] [SCOPE.sCharacter('relevant_character').GetLastName] za neadekvátní a požádala, aby [SCOPE.sCountry('relevant_country').GetName] jmenovala nového guvernéra více sladěného s jejím programem." # todo: NEW TRANSLATION
 subject_interactions.3.f: "\"Správa věcí veřejných je velmi jemná záležitost. Každý stát má své vlastní tlaky, své lobby a své obavy. Naší prací je zajistit, aby všechny tyto otázky byly efektivně odstraněny z desky, aby se nikdy znovu nepostavily na odpor našim záměrům.\"" # todo: NEW TRANSLATION
