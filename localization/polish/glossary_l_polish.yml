l_polish:
 GLOSSARY_OPEN_WEB_LINK: "Zjistit více" # todo: NEW TRANSLATION
 GLOSSARY_OPEN_WEB_LINK_TOOLTIP: "Tím se ve vašem webovém prohlížeči otevře následující odkaz\n\n[GlossaryType.GetWebLink|v]" # todo: NEW TRANSLATION
 glossary_house_of_obrenovic: "Rod Obrenovićů" # todo: NEW TRANSLATION
 glossary_house_of_obrenovic_short: "Obrenovićové" # todo: NEW TRANSLATION
 glossary_house_of_obrenovic_desc: "#b;italic Rod Obrenovićů#! je jedním ze dvou soupeřících $SER_ADJ$ královských rodů. Jeho členové jsou potomky #b Miloše Obrenoviće#!, vůdce druhého srbského povstání a zakladatele autonomního #b Srbského knížectví#!. Stoupenci $glossary_house_of_obrenovic_short$ obvykle upřednostňují navázání užších $concept_relations$ s #b Rakouskem#!." # todo: NEW TRANSLATION
 glossary_house_of_karadjordjevic: "Rod Karađorđevićů" # todo: NEW TRANSLATION
 glossary_house_of_karadjordjevic_short: "Karađorđevićové" # todo: NEW TRANSLATION
 glossary_house_of_karadjordjevic_desc: "#b;italic Rod Karađorđevićů#! je jedním ze dvou soupeřících $SER_ADJ$ královských rodů. Jeho členové jsou potomky #b Karađorđe#!, vůdce nešťastného prvního srbského povstání proti #b Osmanské říši#!. Stoupenci $glossary_house_of_karadjordjevic_short$ obvykle upřednostňují navázání užších $concept_relations$ s #b Ruskem#! a prosazování všeslovanských ambicí." # todo: NEW TRANSLATION
 glossary_ri: "#b #italic Ri#!#! je tradiční měrná jednotka odvozená z čínského #italic li#!.\n\nDefinovaná délka ri se v čase měnila, ale v pozdním období Edo zhruba odpovídala 36 #italic čó#!, tedy 3,9 km." # todo: MOVED KEY
 glossary_ri_desc: "#b;italic Ri#! je tradiční měrná jednotka odvozená od čínského #italic li#!.\n\nDefinovaná délka ri se v průběhu času měnila, ale v pozdním období Edo odpovídala přibližně 36 jednotkám #italic chō#!, tedy 3,9 km." # todo: NEW TRANSLATION
 glossary_uchikowashi: "#b #italic Učikowaši#!#! označuje ničení majetku osob veřejností vnímaných jako nemorální aktéři, například lichvářů, hromaditelů rýže a lichvářských obchodníků.\n\nAčkoli tyto činy často doprovázelo rabování, v mnoha případech se ho pachatelé učikowaši záměrně zdrželi, aby zdůraznili oprávněnost svého jednání." # todo: MOVED KEY
 glossary_uchikowashi_desc: "#b;italic Uchikowashi#! označuje ničení majetku osob, které veřejnost považovala za nemorální, například lichvářů, skupovačů rýže a překupníků, kteří uměle navyšovali ceny.\n\nAčkoli tyto činy často doprovázelo rabování, v mnoha případech se jejich pachatelé uchikowashi rabování záměrně vyhýbali, aby zdůraznili oprávněnost svého jednání." # todo: NEW TRANSLATION
 glossary_zaibatsu: "#b #italic Zaibacu#!#! je rodinný a vertikálně integrovaný průmyslový a finanční konglomerát.\n\nTypické zaibacu je organizováno kolem holdingové společnosti a banky, které vlastní podíly v několika, obvykle průmyslových, dceřiných společnostech. Zaibacu vzešly z rodinných obchodních konglomerátů pozdního období Edo, které využily své již existující bohatství a vazby na stát ke konsolidaci kontroly nad velkou částí japonské průmyslové základny." # todo: MOVED KEY
 glossary_zaibatsu_desc: "#b;italic Zaibatsu#! je rodinný průmyslový a finanční konglomerát vertikálně propojených společností.\n\nTypické zaibatsu je organizováno kolem holdingové společnosti a banky, které vlastní podíly v několika dceřiných společnostech, obvykle průmyslových. Zaibatsu vznikla z rodinných obchodních konglomerátů pozdního období Edo, které využily své dosavadní bohatství a vazby na stát k upevnění kontroly nad značnou částí průmyslové základny #b Japonska#!.\n\nMezi $concept_companies$ považované za zaibatsu patří #v $company_mitsui$#!, #v $company_mitsubishi$#!, #v $company_yasuda$#! a #v $company_sumitomo$#!." # todo: NEW TRANSLATION
 glossary_gongen: "Gongen" # todo: NEW TRANSLATION
 glossary_gongen_desc: "#b;italic Gongen#! je Buddha projevující se jako kami, který spojuje původní božstvo s nositelem buddhistického osvícení." # todo: NEW TRANSLATION
 glossary_boddhisattva: "Bódhisattva" # todo: NEW TRANSLATION
 glossary_boddhisattva_desc: "#b;italic Bódhisattva#! je v buddhismu osvícená bytost a učitel, který pomáhá ostatním dosáhnout nirvány." # todo: NEW TRANSLATION
 glossary_decembrists: "Děkabristické povstání" # todo: NEW TRANSLATION
 glossary_decembrists_desc: "#b;italic Děkabristické povstání#! byl pokus o státní převrat, který uskutečnila liberální revoluční #b Severní společnost děkabristů#! po smrti #b cara Alexandra I.#! v roce #b 1825#!.\n\nRevolucionáři usilovali o zavedení ústavního pořádku v #b Rusku#! a přivedli tři tisíce vojáků na #b Senátní náměstí#! v #b Petrohradu#!, ale loajalistická vojska je rychle potlačila.\n\nDěkabristické povstání představovalo první výzvu vládě #b cara Mikuláše I.#!" # todo: NEW TRANSLATION
 glossary_zemstvo: "Zemstvo" # todo: NEW TRANSLATION
 glossary_zemstvo_desc: "Zemské shromáždění #b;italic zemstvo#! je institucí místní samosprávy na úrovni #b gubernie#! nebo #b újezdu#!. Hlavním orgánem zemstva je shromáždění volené kuriemi vlastníků půdy, majetných městských voličů a zástupců rolnických obcí. Toto shromáždění odpovídá za správu hospodářské činnosti v rámci své působnosti a má právo ukládat obyvatelstvu poplatky a daně, aby mohlo plnit své úkoly." # todo: NEW TRANSLATION
 glossary_annexation_of_finland: "Připojení $FIN$ v roce 1809" # todo: NEW TRANSLATION
 glossary_annexation_of_finland_desc: "Finská válka se odehrála v letech 1808 až 1809 mezi #b Švédským královstvím#! a #b Ruským impériem#!. Po uzavření mírových jednání a podpisu Fredrikshamnské smlouvy vzniklo #b Finské velkoknížectví#! jako autonomní součást #b Ruského impéria#!." # todo: NEW TRANSLATION
 glossary_establishment_of_congress_poland: "Založení $dyn_c_congress_poland$ v roce 1815" # todo: NEW TRANSLATION
 glossary_congress_poland_possessive: "" # todo: NEW TRANSLATION
 glossary_establishment_of_congress_poland_desc: "#b $dyn_c_congress_poland$#!, postoupené #b Ruskému impériu#! po porážce #b Francie#! v #b napoleonských válkách#!, bylo založeno v roce 1815 na Vídeňském kongresu." # todo: NEW TRANSLATION
 glossary_annexation_baltic_governorates: "Připojení $dyn_c_baltic_governorate$" # todo: NEW TRANSLATION
 glossary_annexation_baltic_governorates_desc: "Švédské Estonsko a Švédské Livonsko postoupilo #b Švédsko#! na základě Nystadské smlouvy po velké severní válce, která probíhala v letech 1700 až 1721. Později, v roce 1795, #b Ruské impérium#! anektovalo #b Kuronské a zemgalské vévodství#! při třetím dělení Polska." # todo: NEW TRANSLATION
 glossary_peredvizhniki_artists: "Peredvižnici" # todo: NEW TRANSLATION
 glossary_peredvizhniki_artists_desc: "#b;italic Peredvižnici#!, známí také jako Tuláci či Poutníci, byli skupinou ruských realistických umělců, kteří kvůli akademickým omezením opustili Císařskou akademii umění. Na protest založili umělecké družstvo. Spolek putovních uměleckých výstav působil v letech 1871 až 1923 a cestoval po zemi s desítkami výstav." # todo: NEW TRANSLATION
 glossary_tomas_de_zumalacarregui: "Tomás de Zumalacárregui" # todo: NEW TRANSLATION
 glossary_tomas_de_zumalacarregui_desc: "#tooltip_header Tomas Zumalakarregi Imatz#!\n$TOOLTIP_DELIMITER$\nNarodil se #v 29. prosince 1788#! v Ormaiztegi, Gipuzkoa\nZemřel #v 24. června 1835#! v Zegamě, Gipuzkoa\n\nTomás de Zumalacárregui e Imaz, jehož vojáci přezdívali „strýček Tomás“, byl baskickým vojenským důstojníkem. Jakožto generální kapitán karlistických sil v Navaře a Baskicku odpovídal za organizaci armády a za významná počáteční vítězství karlistů.\nJeho náhlá smrt na následky střelného zranění v boji na začátku léta 1835 znamenala značnou překážku pro ambice dona Carlose." # todo: NEW TRANSLATION
 glossary_revolutions_of_1830: "Revoluce roku 1830" # todo: NEW TRANSLATION
 glossary_revolutions_of_1830_desc: "#b;italic Revoluce roku 1830#! byla série liberálních a romantických nacionalistických revolucí napříč Evropou. Začala v červenci 1830 v #b Francii#! a trvala do poloviny roku 1831. Revolucionáři usilovali o svržení obnovené #b bourbonské monarchie#! ve Francii a o vytvoření nezávislých národních států v #b Belgii#!, #b Itálii#! a #b Polsku#!. Revoluce vedly ke vzniku francouzské #b červencové monarchie#! a nezávislé #b Belgie#! pod vládou krále Leopolda I.\n\nPolská revoluce roku 1830, známá jako #b listopadové povstání#!, vedla k šíření revoluční činnosti v západních guberniích #b Ruského impéria#! a po vojenské porážce povstání k odvolání velké části autonomie [Glossary('glossary_establishment_of_congress_poland','$glossary_congress_poland_possessive|q$')]." # todo: NEW TRANSLATION
 glossary_sejm: "Sejm" # todo: NEW TRANSLATION
 glossary_sejm_short: "Sejm" # todo: NEW TRANSLATION
 glossary_sejm_desc: "Dvokomorový parlament Polska, který zastupuje šlechtu v rámci systému [GetLawType('law_landed_voting').GetName]." # todo: NEW TRANSLATION
 glossary_november_uprising: "Listopadové povstání" # todo: NEW TRANSLATION
 glossary_november_uprising_short: "Listopadové povstání" # todo: NEW TRANSLATION
 glossary_november_uprising_desc: "Rozsáhlé povstání proti ruské nadvládě vedené armádou Kongresového Polska, které bylo po potlačení povstání zrušeno. Povstání získalo širokou podporu mnoha bývalých občanů Polsko-litevské unie." # todo: NEW TRANSLATION
 glossary_third_partition: "Třetí dělení Polska" # todo: NEW TRANSLATION
 glossary_third_partition_short: "Třetí dělení Polska" # todo: NEW TRANSLATION
 glossary_third_partition_desc: "Polsko-litevská unie byla roku 1795 rozdělena mezi $concept_great_powers$: Rusko, Prusko a Rakousko." # todo: NEW TRANSLATION
 glossary_congress_of_vienna: "Vídeňský kongres" # todo: NEW TRANSLATION
 glossary_french_revolution: "Francouzská revoluce" # todo: NEW TRANSLATION
 glossary_1792: "#b 1792#!" # todo: NEW TRANSLATION
 glossary_french_revolutionary_wars: "Francouzské revoluční války" # todo: NEW TRANSLATION
