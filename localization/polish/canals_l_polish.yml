l_polish:
 canal_suez: "Suezský průplav"
 canal_panama: "Panamský průplav"
 canal_kiel: "Kielský průplav"
 canal_events.1.t: "Žádat o pozemky v Sinaji" # todo: NEW TRANSLATION
 canal_events.1.d: "Po dokončení průzkumu istmusu bychom nyní měli jednat o možnosti získání pozemků v Sinaji pro výstavbu kanálu." # todo: NEW TRANSLATION
 canal_events.1.f: ""Zamyslete se, pokud se nám podaří prokopat kanál přes Suez, už nebudeme muset obplouvat celý Mys dobré naděje, abychom se dostali ke koloniím a zemím na Dálném východě."" # todo: NEW TRANSLATION
 canal_events.1.a: "Nabídnout vybudovat kanál." # todo: NEW TRANSLATION
 canal_events.2.t: "Spojení moří" # todo: NEW TRANSLATION
 canal_events.2.d: "Velvyslanci z [SCOPE.sCountry('suez_scope').GetName] nás oslovili ohledně možnosti získat pozemky v Sinaji za účelem zahájení výstavby kanálu." # todo: NEW TRANSLATION
 canal_events.2.f: ""Propojení Rudého moře se Středozemním by bylo nesmírně prospěšné nejen pro nás, ale i pro zbytek světa. Zamyslete se — už by nikdo nemusil obplouvat celou Afriku, aby se dostal na východ, a my bychom byli v centru veškerého obchodu."" # todo: NEW TRANSLATION
 canal_events.2.a: "Žádné náklady, veškerý přínos." # todo: NEW TRANSLATION
 canal_events.2.b: "Nevzdáme ani kousek našeho území." # todo: NEW TRANSLATION
 canal_events.3.t: "[SCOPE.sCountry('suez_owner_scope').GetName] přijímá naši dohodu" # todo: NEW TRANSLATION
 canal_events.3.d: "Vláda [SCOPE.sCountry('suez_owner_scope').GetName] přijala naši žádost o získání pozemků v Sinaji, aby mohla být zahájena výstavba kanálu." # todo: NEW TRANSLATION
 canal_events.3.f: ""Konečně po roce průzkumů, plánování a jednání máme nyní příležitost zahájit výstavbu. Brzy budeme moci obchodovat s Východními Indií, aniž bychom museli posílat lodě kolem Mysu dobré naděje."" # todo: NEW TRANSLATION
 canal_events.3.a: "Čas začít stavět." # todo: NEW TRANSLATION
 canal_events.4.t: "[SCOPE.sCountry('suez_owner_scope').GetName] odmítá naši dohodu" # todo: NEW TRANSLATION
 canal_events.4.d: "Vláda [SCOPE.sCountry('suez_owner_scope').GetName] odmítla naši žádost o získání pozemků v Sinaji." # todo: NEW TRANSLATION
 canal_events.4.f: ""Jak mohou takovou nabídku odmítnout? Prakticky jsme jim nabídli, že to pro ně postavíme, a to poté, co jsme věnovali čas průzkumu oblasti. Jak mohou být tak slepí k potenciálu tohoto projektu?"\n\n"Víte, co se říká — když diplomacie selže, sáhne se po holi."" # todo: NEW TRANSLATION
 canal_events.4.a: "Diplomacie nás tentokrát zklamala." # todo: NEW TRANSLATION
 canal_events.5.t: "Žádost o pozemek v Panamě" # todo: NEW TRANSLATION
 canal_events.5.d: "Po dokončení průzkumu istmusu bychom měli nyní jednat o možnosti získat pozemek v blízkosti Panama City za účelem výstavby kanálu." # todo: NEW TRANSLATION
 canal_events.5.f: ""Vytvoření zkratky mezi Atlantským a Tichým oceánem bude historickou událostí. Už nebudeme muset obplouvat kontinenty, abychom se dostali na druhou stranu Ameriky — budeme moci projít přímo k libovolnému oceánu."" # todo: NEW TRANSLATION
 canal_events.5.a: "Nabídnout vybudovat kanál." # todo: NEW TRANSLATION
 canal_events.6.t: "Propojení oceánů" # todo: NEW TRANSLATION
 canal_events.6.d: "Velvyslanci z [SCOPE.sCountry('panama_scope').GetName] nás oslovili ohledně možnosti, že by získali pozemek v blízkosti Panama City za účelem výstavby kanálu." # todo: NEW TRANSLATION
 canal_events.6.f: ""Měli bychom jim to alespoň dovolit vyzkoušet. Už vynaložili úsilí na průzkum oblasti. Kdo zaručí, že nás po odmítnutí nebudou také napadat?"\n\n"Sama otázka, zda bychom cizincům někdy ustoupili z naší půdy, by neměla být této vládě vůbec kladena. Pokud chtějí naše území, budou si jej muset vzít silou."" # todo: NEW TRANSLATION
 canal_events.6.a: "Žádné náklady, veškerý přínos." # todo: NEW TRANSLATION
 canal_events.6.b: "Nevzdáme ani kousek našeho území." # todo: NEW TRANSLATION
 canal_events.7.t: "[SCOPE.sCountry('panama_owner_scope').GetName] přijímá naši dohodu" # todo: NEW TRANSLATION
 canal_events.7.d: "Vláda [SCOPE.sCountry('panama_owner_scope').GetName] přijala naši žádost o získání pozemku v blízkosti Panama City. Nyní můžeme zahájit výstavbu kanálu." # todo: NEW TRANSLATION
 canal_events.7.f: ""Konečně po více než roce průzkumů, plánování a jednání máme nyní příležitost zahájit výstavbu kanálu. Brzy budeme moci plout mezi Atlantským a Tichým oceánem přímo skrz kontinent, nikoli kolem něj."" # todo: NEW TRANSLATION
 canal_events.7.a: "Čas začít stavět." # todo: NEW TRANSLATION
 canal_events.8.t: "[SCOPE.sCountry('panama_owner_scope').GetName] odmítá naši dohodu" # todo: NEW TRANSLATION
 canal_events.8.d: "Vláda [SCOPE.sCountry('panama_owner_scope').GetName] odmítla naši žádost o získání pozemku pro výstavbu kanálu, který by mohl spojit Atlantský a Tichý oceán." # todo: NEW TRANSLATION
 canal_events.8.f: ""Jak mohou takovou nabídku odmítnout? Prakticky jsme jim nabídli, že celý kanál postavíme, a to poté, co jsme věnovali čas průzkumu oblasti. Jak mohou být tak slepí k potenciálu tohoto projektu?"\n\n"Víte, co se říká — když diplomacie selže, sáhne se po holi."" # todo: NEW TRANSLATION
 canal_events.8.a: "Diplomacie nás tentokrát zklamala." # todo: NEW TRANSLATION
