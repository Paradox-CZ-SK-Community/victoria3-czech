 sikh_empire.6.t: "Závažné zranění" # todo: NEW TRANSLATION
 sikh_empire.6.d: "[SCOPE.sCharacter('relevant_ruler').GetPrimaryRoleTitle] [SCOPE.sCharacter('relevant_ruler').GetFullName] byl zasažen padajícím zdivem při návratu z pohřbu svého otce. Wazír trvá na tom, že [SCOPE.sCharacter('relevant_ruler').GetPrimaryRoleTitle] je vážně zraněn a není možné nic dělat." # todo: NEW TRANSLATION
 sikh_empire.6.f: "Lidé se shromáždili na ulicích. Stejné myšlenky běžely hlavami všech. Ranjitova smrt byla chmurná, ale byl starý. Kharakova smrt byla znepokojující, ale Waheguru tomu tak snad určil. Ale pokud by [SCOPE.sCharacter('relevant_ruler').GetFirstNameNoFormatting] zemřel den po svém otci, bylo by čas na zoufalství. Jak by je měl dítě ochránit? Spadnou nejdříve do rukou Afghánů nebo Company?" # todo: NEW TRANSLATION
 sikh_empire.6.a: "Poslouchejte wazíra." # todo: NEW TRANSLATION
 sikh_empire.6.b: "Uděláme vše pro záchranu mahárádži." # todo: NEW TRANSLATION
 nau_nihal_dies_tt: "[SCOPE.sCharacter('relevant_ruler').GetFullNameNoFormatting] zemře na následky zranění." # todo: NEW TRANSLATION
 nau_nihal_lives_tt: "[SCOPE.sCharacter('relevant_ruler').GetFullNameNoFormatting] přežije, sotva." # todo: NEW TRANSLATION
 notification_neighbor_encroaching_pan_message_name: "Strach z agrese [SCOPE.sCountry('relevant_country').GetName]" # todo: NEW TRANSLATION
 notification_neighbor_encroaching_pan_message_desc: "Incident, který smrtelně zranil našeho vládcem, učinil naši zemi zranitelnou. Existuje strach, že [SCOPE.sCountry('relevant_country').GetName] zahájí kampaň proti nám." # todo: NEW TRANSLATION
 notification_neighbor_encroaching_pan_message_tooltip: "#header $notification_neighbor_encroaching_pan_message_name$#!\n$TOOLTIP_DELIMITER$\n$notification_neighbor_encroaching_pan_message_desc$" # todo: NEW TRANSLATION
 nau_nihal_survives: "Přežil pád sloupu" # todo: NEW TRANSLATION
 sikh_empire.7.t: "Konec dynastie" # todo: NEW TRANSLATION
 sikh_empire.7.t2: "Kolaps lvího odkazu" # todo: NEW TRANSLATION
 sikh_empire.7.d: "Naše impérium už není nezávislé. To, co Sher-e-Punjab založil, je pryč." # todo: NEW TRANSLATION
 sikh_empire.7.d2: "Smrt se stala stínem nad sídly našeho dvora. Nyní, s nedávnou smrtí našeho [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle], co Sher-e-Punjab založil, může být skutečně pryč." # todo: NEW TRANSLATION
 sikh_empire.7.f: "\"Nazývali Ranjita Singha Sher-e-Punjab, Lvem Paňdžábu,\" řekl britský generál s úšklebkem, \"myslím, že to byla jejich první chyba.\"\n\nPo prstech přetáhl listy anexních dokumentů, na jejichž vrchu byl britský státní znak. \"Měli vědět, že lvi nesdílejí území.\"" # todo: NEW TRANSLATION
 sikh_empire.7.f2: "\"Nazývali Ranjita Singha Sher-e-Punjab, Lvem Paňdžábu,\" řekl generál s úšklebkem, \"nevěděli?\"\n\nPřetáhl prstem po seznamu všech sikhských princů a generálů, kteří zemřeli v boji mezi sebou. \"Vzestup přichází před pádem.\"" # todo: NEW TRANSLATION
 sikh_empire.7.a: "Bohužel, odkaz lva už není." # todo: NEW TRANSLATION
 sikh_empire.8.t: "Odkaz lva" # todo: NEW TRANSLATION
 sikh_empire.8.d: "Naše země přežila roky turbulence a není de jure připojena k jiné zemi. Odkaz Sher-e-Punjab bude žít dál." # todo: NEW TRANSLATION
 sikh_empire.8.f: "\"Zajímalo by mě, co by Maharaj Ranjit Singh řekl, kdyby nás nyní viděl,\" zeptal se mladý voják v Khalsaji. \"Byl by hrdý na naši vytrvalost? Nebo by byl zklamaný našimi činy?\"\n\n\"Náš lid má domov a budoucnost, doufejme pokojnou,\" odpověděl kapitán. \"Myslím, že Lev by byl hrdý, že jeho práce zajistila domov pro jeho děti.\"" # todo: NEW TRANSLATION
 sikh_empire.8.a: "Před námi jsou dny slávy." # todo: NEW TRANSLATION
 sikh_sovereignty_success: "Impérium obstálo" # todo: NEW TRANSLATION
 lions_legacy: "Odkaz lva" # todo: NEW TRANSLATION
 sikh_empire.9.t: "Poslední mahárádža" # todo: NEW TRANSLATION
 sikh_empire.9.d: "Mladý [SCOPE.sCharacter('duleep_character').GetFullName], který byl sesazen po pádu Sikhského impéria, se znovu objevil." # todo: NEW TRANSLATION
 sikh_empire.9.f: "Dvůr byl v rozruchu z příchodu prince bez půdy, ačkoli mu do očí neříkali tuto přezdívku. Mladík byl pohledný a zdvořilý a měl sympatie dvora. Vyrůstal bez rodičů, byl princem, který neměl co vládnout. Přesto to zdá se mu nijak nevadilo. Někteří se však ptali, zda chápe skutečný rozsah toho, co ztratil." # todo: NEW TRANSLATION
 sikh_empire.9.a: "Možná najde svůj účel." # todo: NEW TRANSLATION
 sikh_empire.9.b: "Bude jistě vítán s otevřenou náručí." # todo: NEW TRANSLATION
 duleep_goes_to_gbr_tt: "Odjíždí žít do $GBR$" # todo: NEW TRANSLATION
 sikh_empire.10.t: "Odfouknut" # todo: NEW TRANSLATION
 sikh_empire.10.d1: "[SCOPE.sCharacter('relevant_ruler').GetFullName] byl zavražděn při prohlídce zbraně [SCOPE.sCharacter('assassin_scope').GetFullName]. Když [SCOPE.sCharacter('relevant_ruler').GetPrimaryRoleTitle] hleděl do hlavně [SCOPE.sCharacter('assassin_scope').GetHerHis] brokovnice, [SCOPE.sCharacter('assassin_scope').GetFirstName] stiskl spoušť." # todo: NEW TRANSLATION
 sikh_empire.10.d2: "[SCOPE.sCharacter('relevant_ruler').GetFullName] byl zavražděn dvořanem při předvádění dovezené brokovnice. Když [SCOPE.sCharacter('relevant_ruler').GetPrimaryRoleTitle] nahlédl do hlavně brokovnice, dvořan stiskl spoušť." # todo: NEW TRANSLATION
 sikh_empire.10.f: "\"Waheguru, Waheguru, Waheguru\", opakovalo se, to byla jediná věc, kterou bylo slyšet na palácových nádvořích. Zvuk truchlení těch, kteří byli loajální k nyní beztvárnému [SCOPE.sCharacter('relevant_ruler').GetFullNameNoFormatting]. Ostatní byli ticho. Ti, kdo mu muže nenáviděli, se obávali následků. Ti, kteří byli loajální k Duleepovi, se báli o jeho bezpečí. A zbytek byl unavený, unavený z nekonečné smrti, která je jako by je pronásledovala." # todo: NEW TRANSLATION
 sikh_empire.10.a: "\"Jaké zrádectví!\"" # todo: NEW TRANSLATION
 sher_singh_death_tt: "[SCOPE.sCharacter('relevant_ruler').GetFullName] zemře" # todo: NEW TRANSLATION
 sikh_empire.11.t: "Předčasný konec" # todo: NEW TRANSLATION
 sikh_empire.11.d: "Brutální dvorské intriky pohlcující [ROOT.GetCountry.GetName] si vyžádaly dalšího oběti. Krátce vládnoucí [SCOPE.sCharacter('relevant_ruler').GetPrimaryRoleTitle] [SCOPE.sCharacter('relevant_ruler').GetFullName] byl nalezen mrtvý ve svých komnatách, [SCOPE.GetRootScope.GetCountry.GetCustom('sikh_ruler_death_reason')]" # todo: NEW TRANSLATION
 sikh_empire.11.f: "\"Co tím myslíte, že tu nikdo nechce pracovat?\" vykřikl palácový kuchař. Jeho služebnice, matka dvou dětí, se mu odvážně podívala do očí. \"Myslí si, že je to místo prokleté,\" odpověděla, \"a no, nemůžete jim to mít za zlé. Žádné množství zlata nemůže odstranit zápach smrti, který visí nad těmito kameny.\"\n\nKuchař vydechl, \"Ne, ne může. Co navrhujete? Nechat nového krále hladovět?\"\n\n\"Všichni mohou jíst v langaru, král i sedlák,\" odpověděla žena. \"Když jídlo nedorazí k králi, možná král přijde k jídlu.\"" # todo: NEW TRANSLATION
 sikh_empire.11.a: "Předčasný konec." # todo: NEW TRANSLATION
