 victoria_terminus_populated_tt: "Obsazenost pracovní síly $building_victoria_terminus$ [concept_occupancy] je větší nebo rovna #variable 50%#!" # todo: NEW TRANSLATION
 rejected_victoria_terminus_project_tt: "[ROOT.GetCountry.GetNameNoFormatting] odmítl návrh na výstavbu $building_victoria_terminus$." # todo: NEW TRANSLATION
 does_not_have_state_bombay_tt: "[ROOT.GetCountry.GetNameNoFormatting] nemá $STATE_BOMBAY$." # todo: NEW TRANSLATION
 owns_bombay_province_tt: "Vlastní město $HUB_NAME_STATE_BOMBAY_city$" # todo: NEW TRANSLATION
 victoria_terminus.1.t: "Terminál jako žádný jiný" # todo: NEW TRANSLATION
 victoria_terminus.1.d: "([SCOPE.gsInterestGroup('relevant_terminus_ig').GetName]) předložili návrh na vybudování velkého terminusu v [SCOPE.sState('relevant_bombay_state').GetName]. Skupina shromáždila značnou sumu peněz k použití při stavbě." # todo: NEW TRANSLATION
 victoria_terminus.1.f: "Dým z dýmek zaplňuje malou kancelář, zatímco skupina úředníků posuzuje návrhy na novou železniční stanici.\n\n\"Bude to dosti nákladné. Je přestavba stanice skutečně nejlepší využití našich zdrojů?\"\n\n\"Můj drahý, je to éra lokomotiv. Naše výdělky jsou úměrné rychlosti přepravy. A současná rychlost je srovnatelná s koňským povozem.\"" # todo: NEW TRANSLATION
 victoria_terminus.1.a: "Začněte okamžitě se stavbou." # todo: NEW TRANSLATION
 victoria_terminus.1.b: "Toto financování by mělo být přesměrováno tam, kde je potřeba." # todo: NEW TRANSLATION
 victoria_terminus_construct_tt: "$building_victoria_terminus$ lze postavit pomocí [concept_political_lens] v $STATE_BOMBAY$." # todo: NEW TRANSLATION
 dismissed_victoria_terminus_je_tt: "#bold $je_victoria_terminus$#! [concept_journal_entry] bude odmítnut" # todo: NEW TRANSLATION
 victoria_terminus_accepted: "Schválená výstavba terminusu" # todo: NEW TRANSLATION
 victoria_terminus_rejected: "Odmítnutá výstavba terminusu" # todo: NEW TRANSLATION
 victoria_terminus.2.t: "Architektonické dílo" # todo: NEW TRANSLATION
 victoria_terminus.2.d: "Dokončený $building_victoria_terminus$ je fúzí architektonických vlivů a znamená novou kapitolu pro [SCOPE.sState('relevant_bombay_state').GetName] i celou Indii." # todo: NEW TRANSLATION
 victoria_terminus.2.f: "Dva Britové v oblecích stojí před nově postaveným terminusem, zatímco coolie nese jejich zavazadla.\n\n\"Kdyby to nebyla měsíční plavba lodí, myslel bych, že jsme zpět v Londýně.\"\n\n\"A v tom spočívá genialita jeho návrhu. Naši krajané ho vnímají jako rozšíření britské kultury. Místní ho vidí jako úctyhodné pokračování jejich mughalského dědictví. Všichni jsou spokojeni a nikdo se neurazí a obchod, především, kvete.\"" # todo: NEW TRANSLATION
 victoria_terminus.2.a: "Tento terminus dobře poslouží celé Indii." # todo: NEW TRANSLATION
 victoria_terminus.2.b: "Svět bude žasnout nad naším dílem." # todo: NEW TRANSLATION
 victoria_terminus_reward_loc: "Nové městské uzly" # todo: NEW TRANSLATION
 victoria_terminus_reward_int: "Symbolický růst" # todo: NEW TRANSLATION
 je_sikh_sovereignty: "Sikhská suverenita" # todo: NEW TRANSLATION
 je_sikh_sovereignty_reason: "Jsou to rané dny našeho nově nastoleného rodu. Naše vzrůstající království zažilo od doby, kdy #bold Sher-e-Punjab#! dobyl bývalé mughalské císařské hlavní město, velký úspěch.\n\nJe v této chvíli kritické, abychom chránili naše území před vnější agresí a ctěli zásady naší víry [GetReligion('sikh').GetName]. Ať je odkaz této dynastie dlouhotrvající!\n\n#b [concept_empire_stability] a [concept_court_intrigue]#!\n[ROOT.GetCountry.GetNameNoFormatting] čelí více než jen vnějším hrozbám. Síly uvnitř našeho dvora mohou spiknout proti našemu [concept_ruler] ve prospěch svého preferovaného kandidáta. Pokud náš #b $sikh_empire_intrigue_bar$#! dosáhne #v 100%#!, náš [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] ($concept_ruler$) bude zavražděn, #b $sikh_empire_progress_bar$#! bude #bold resetován#! na #v 0#!, $concept_court_intrigue_short$ se sníží a bude nastolen nový kandidát." # todo: NEW TRANSLATION
