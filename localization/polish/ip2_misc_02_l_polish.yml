 notification_struggle_for_sovereignty_message_desc: "[SCOPE.sCountry('princely_state_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('princely_state_scope').GetNameNoFormatting] oznámil své úmysly usilovat o nezávislost na [SCOPE.sCountry('overlord_scope').GetNameNoFormatting]." # todo: NEW TRANSLATION
 notification_struggle_for_sovereignty_message_tooltip: "#header $notification_struggle_for_sovereignty_reaction_message_name$#!\n$TOOLTIP_DELIMITER$\n$notification_struggle_for_sovereignty_message_desc$" # todo: NEW TRANSLATION
 princely_states.1.t: "Rozdílný osud" # todo: NEW TRANSLATION
 princely_states.1.d: "Touha po nezávislosti je cítit v každém koutě [ROOT.GetCountry.GetName]. [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullNameNoFormatting] musí v této chvíli rozhodnout, jak jednat." # todo: NEW TRANSLATION
 princely_states.1.f: "Touha osvobodit se od nadvlády [SCOPE.sCountry('overlord_scope').GetNameNoFormatting] roste. Je to v myslích [ROOT.GetCountry.GetAdjectiveNoFormatting] ze všech vrstev. Tato neklidnost mezi lidmi klade otázku, jak by si [ROOT.GetCountry.GetNameNoFormatting] mohlo vzít osud do vlastních rukou.\n\nCestovatel projíždějící [ROOT.GetCountry.GetCapital.GetCityHubName] nemůže uniknout šepotům o tom, jak lidé už nechtějí žít pod palcem [SCOPE.sCountry('overlord_scope').GetNameNoFormatting]." # todo: NEW TRANSLATION
 princely_states.1.a: "[ROOT.GetCountry.GetNameNoFormatting] bude jednou svobodný." # todo: NEW TRANSLATION
 princely_states.1.b: "Někdo se musí postavit proti [SCOPE.sCountry('overlord_scope').GetNameNoFormatting]." # todo: NEW TRANSLATION
 liberty_desire_boost: "Vzpoura knížectví" # todo: NEW TRANSLATION
 improve_relations_every_princely_state: "Vztahy [ROOT.GetCountry.GetNameNoFormatting] se všemi [concept_princely_state] se zvýší o #g [SCOPE.ScriptValue('basic_princely_state_relations_change')]#!" # todo: NEW TRANSLATION
 princely_states.2.t: "Už ne knížectví" # todo: NEW TRANSLATION
 princely_states.2.d: "Po těžkém boji za nezávislost není [ROOT.GetCountry.GetNameNoFormatting] už pouhý knížecí stát. Lidé slaví a [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] se dívá po rozšíření moci [ROOT.GetCountry.GetNameNoFormatting]." # todo: NEW TRANSLATION
 princely_states.2.f: "Mubarak Ho!\n\nDne [TimeKeeper.GetCurrentDate.GetString] oslavil [ROOT.GetCountry.GetRuler.GetFullNameNoFormatting] své nově nabyté pravomoci bujnou přehlídkou zakončenou salva děla. Ve vzduchu panovala obecná radost, když se rozdělovalo jídlo mezi lid. Slíbilo to novou éru blahobytu. Pouze čas ukáže, zda [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] dodrží svá slova!" # todo: NEW TRANSLATION
 princely_states.2.a: "Máme jasnou budoucnost pod vedením [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]." # todo: NEW TRANSLATION
 princely_states.2.b: "Úspěchy [ROOT.GetCountry.GetNameNoFormatting] budou velkolepé!" # todo: NEW TRANSLATION
 increase_autonomy_prestige_success: "Důvěryhodný vůdce" # todo: NEW TRANSLATION
 increase_autonomy_auth_success: "Skutečná autorita" # todo: NEW TRANSLATION
 annex_neighbor_princely_state: "Sousední knížecí stát se sdíleným #bold dědictvím#! a #green #bold srdečnými#!#! vztahy nebo lepší bude anektován [ROOT.GetCountry.GetName]." # todo: NEW TRANSLATION
 princely_states.3.t: "Nedostatek zavazadlových zvířat" # todo: NEW TRANSLATION
 princely_states.3.d: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] plánuje poslat některé z našich nejlepších velbloudů na pomoc [SCOPE.sCountry('top_overlord_scope').GetAdjective], kteří mají nedostatek zavazadlových zvířat." # todo: NEW TRANSLATION
 princely_states.3.f: "Dvůr debatoval hodiny o záležitosti. [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] tiše naslouchal, přikyvoval a dával najevo závažný výraz. Ale pro [ROOT.GetCountry.GetRuler.GetHerHim] byla volba iluzí pro ty, kdo popírají, kdo je skutečně u moci. Pomoci Britům nebo ne nebylo volbou mezi loajalitou k bývalým spojencům a penězi; byla to volba mezi bojem a prosperitou." # todo: NEW TRANSLATION
 princely_states.3.a: "Pokud nás zaplatí, ať si to vezmou." # todo: NEW TRANSLATION
 princely_states.3.b: "Jejich boj není náš boj." # todo: NEW TRANSLATION
 prince_negative_popularity: "Nepřesvědčivé vedení" # todo: NEW TRANSLATION
 princely_states_camel_stipend: "Půjčené velbloudy" # todo: NEW TRANSLATION
 prince_positive_popularity: "Chvályhodné vedení" # todo: NEW TRANSLATION
 princely_states_ld_action: "Nepodpořil vrchnost" # todo: NEW TRANSLATION
 notification_pack_animal_loan_message_name: "Půjčené velbloudy" # todo: NEW TRANSLATION
 notification_pack_animal_loan_message_desc: "Vztahy mezi [ROOT.GetCountry.GetName] a [SCOPE.sCountry('top_overlord_scope').GetName] se zlepšily poté, co [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] poslal velbloudy na pomoc [SCOPE.sCountry('top_overlord_scope').GetAdjective]." # todo: NEW TRANSLATION
 notification_pack_animal_loan_message_tooltip: "#header $notification_pack_animal_loan_message_name$#!\n$TOOLTIP_DELIMITER$\n$notification_pack_animal_loan_message_desc$" # todo: NEW TRANSLATION
 princely_states.4.t: "Nejvyšší řád Hvězdy Indie" # todo: NEW TRANSLATION
 princely_states.4.d: "[SCOPE.sCountry('top_overlord_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('top_overlord_scope').GetRuler.GetFullNameNoFormatting] poctí [SCOPE.sCharacter('award_winner_scope').GetFullName] jmenováním za Rytíře velkého komandéra Řádu Indické říše." # todo: NEW TRANSLATION
 princely_states.4.f: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] procházel síňmi své rodové rezidence. Malby [ROOT.GetCountry.GetRuler.GetHerHis] předků se mu vznášely všude kolem. Co by jim řekli, kdyby byli na jeho místě? Tito zuřiví muži a ženy, kteří neuznávali žádnou autoritu kromě božské? Poradili by [ROOT.GetCountry.GetRuler.GetHerHim], aby se uklonil? Nebo by mu připomněli, že někdo musí začít. Někdo musí vystoupit a říct ne." # todo: NEW TRANSLATION
 princely_states.4.a: "Světlo nebes nechť nám svítí." # todo: NEW TRANSLATION
 princely_states.4.b: "Taková pocta nic neznamená." # todo: NEW TRANSLATION
 rejected_overlord_gesture: "Odmítnutá odměna" # todo: NEW TRANSLATION
 princely_states.5.t: "[SCOPE.sCountry('bic_scope').GetName] anektuje knížecí stát" # todo: NEW TRANSLATION
 princely_states.5.d: "Pomocí doktríny lapse [SCOPE.sCountry('bic_scope').GetName] převzal další knížecí stát." # todo: NEW TRANSLATION
 princely_states.5.f: "Když rostl, učitelé [ROOT.GetCountry.GetRuler.GetHerHis] povzbuzovali, aby hrál šachy. S odstupem se ukázalo, že hra dobře vystihuje aspekt vládcovství. Vládce se nesměl pohybovat více než o krok. A přesto, když [ROOT.GetCountry.GetRuler.GetSheHe] padl, nikdo jiný už nehrálo roli. Dnes, když další z našich sousedů padl před [SCOPE.sCountry('bic_scope').GetNameNoFormatting], [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] se cítil jako král na šachovnici, obklopen nepřáteli a neschopný mnoho udělat. Přesto měl ještě jeden tah. [ROOT.GetCountry.GetRuler.GetSheHe|U] jen musel zajistit, že to bude ten správný." # todo: NEW TRANSLATION
 princely_states.5.a: "Politika je ohavná!" # todo: NEW TRANSLATION
 princely_states.5.b: "Možná v tom je moudrost." # todo: NEW TRANSLATION
