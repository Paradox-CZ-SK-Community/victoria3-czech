 caste_conflict.2.t: "Konečně rovnost" # todo: NEW TRANSLATION
 caste_conflict.2.d: "Úspěch agendy Dravidského hnutí vedl k přijetí nového zákona a zlepšení kvality života nebráhmínů." # todo: NEW TRANSLATION
 caste_conflict.2.f: "Boj byl daleko od konce, věděl Praveen Pallar. Přesto se nemohl ubránit úsměvu, když usedl do jednoduché úřední místnosti, větrák nad ním jemně chladil pot na jeho zádech.\n\nNaproti němu seděl pan Iyer a vlevo pan Agastya. Oba vysokokastoví bráhmíni. A on držel stejnou pozici a plat jako oni. Ani jeden se mu nevzhlédl do očí. Ano, práce stále před námi, ale dnes to stačilo. Poděkoval svým spojencům, kteří s ním pochodovali a protestovali, a otevřel svou první složku." # todo: NEW TRANSLATION
 caste_conflict.2.a: "[SCOPE.gsInterestGroup('rural_folk_ig_scope').GetName] prokázal svou způsobilost." # todo: NEW TRANSLATION
 caste_conflict.2.b: "Budoucnost nebráhmínů je světlá." # todo: NEW TRANSLATION
