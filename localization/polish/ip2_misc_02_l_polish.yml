 SIKH_MILITANCY: "Sikhské militantství" # todo: NEW TRANSLATION
 wedding_prestige: "Královská svatba" # todo: NEW TRANSLATION
 notification_sikh_wedding_diplomacy_message_name: "Královská diplomacie" # todo: NEW TRANSLATION
 notification_sikh_wedding_diplomacy_message_desc: "Vztahy mezi [SCOPE.sCountry('pan_scope').GetName] a [SCOPE.sCountry('bic_scope').GetName] se zlepšily po účasti na královské svatbě v [SCOPE.sCountry('pan_scope').GetCapital.GetCityHubName]." # todo: NEW TRANSLATION
 notification_sikh_wedding_diplomacy_message_tooltip: "#header $sikh_wedding_diplomacy_message_name$#!\n$TOOLTIP_DELIMITER$\n$sikh_wedding_diplomacy_message_desc$" # todo: NEW TRANSLATION
 sikh_empire.2.t: "Útoky [SCOPE.sCountry('relevant_country').GetName]" # todo: NEW TRANSLATION
 sikh_empire.2.d: "Zatímco naši generálové navštěvovali královskou svatbu, jednotky z [SCOPE.sCountry('relevant_country').GetName] se pokusily obsadit území v [SCOPE.sState('relevant_state').GetName]." # todo: NEW TRANSLATION
 sikh_empire.2.f: "Byl jsem v Lahore, když dorazila zpráva mahárádžovi o útoku emíra na jeho pevnosti. Dokázal bych určit hodinu, kdy slavnosti náhle skončily. Na chvíli celé město ztichlo.\n\nA pak jsem zaslechl hlasné, povzbuzující válečné zvolání, které už desítky let děsilo nepřátele Sikhů, \"Jo bole so Nihaal\"; ti, kdo ho vysloví, jsou požehnáni. A každý voják Khalsaji odpověděl známou formulí, \"Sat Sri Akal\", Bůh je konečnou pravdou." # todo: NEW TRANSLATION
 sikh_empire.2.a: "Pobídnout další vojáky, aby se připojili k našim silám." # todo: NEW TRANSLATION
 sikh_empire.2.b: "Nechat Khalsaji naplánovat náš další krok." # todo: NEW TRANSLATION
 sikh_conscription: "Síla v počtech" # todo: NEW TRANSLATION
 show_of_strength: "Projevení síly" # todo: NEW TRANSLATION
 notification_pan_encroaching_neighbor_message_name: "Zajištění hranice" # todo: NEW TRANSLATION
 notification_pan_encroaching_neighbor_message_desc: "[SCOPE.sCountry('relevant_country').GetName] se pokusila obsadit území v [SCOPE.sState('relevant_state').GetName]. Musíme reagovat." # todo: NEW TRANSLATION
 notification_pan_encroaching_neighbor_message_tooltip: "#header $notification_pan_encroaching_neighbor_message_name$#!\n$TOOLTIP_DELIMITER$\n$notification_pan_encroaching_neighbor_message_desc$" # todo: NEW TRANSLATION
 sikh_empire.3.t: "Smrt Sher-e-Punjabu" # todo: NEW TRANSLATION
 sikh_empire.3.d: "Mahárádža náhle zemřel ve spánku. Národ oplakává naši ztrátu." # todo: NEW TRANSLATION
 sikh_empire.3.f: "Na dvorech [SCOPE.sCountry('relevant_country').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('relevant_country').GetRuler.GetFullNameNoFormatting] byla zpráva o smrti [SCOPE.sCharacter('relevant_ruler').GetFullNameNoFormatting] oslavována. \"Lev je mrtev,\" křičeli ministři, \"Paňdžáb bude náš.\"\n\nAle mnozí si všimli, že [SCOPE.sCountry('relevant_country').GetRuler.GetPrimaryRoleTitle] se nezapojil. \"Lev Paňdžábu zanechal silné lvy, ale udrží se proti Company?\", slyšela jedna z [SCOPE.sCountry('relevant_country').GetRuler.GetHerHis] žen, jak [SCOPE.sCountry('relevant_country').GetRuler.GetHerHim] uvažuje, \"Nebo nám brzy budou Britové klepat na dveře?\"" # todo: NEW TRANSLATION
 sikh_empire.3.a: "Ať žije odkaz mahárádži." # todo: NEW TRANSLATION
 ranjit_singh_death_tt: "[SCOPE.sCharacter('relevant_ruler').GetFullName] zemře." # todo: NEW TRANSLATION
 notification_eic_encroaching_pan_message_name: "[SCOPE.sCountry('pan_scope').GetAdjective] postavení na hranicích" # todo: NEW TRANSLATION
 notification_eic_encroaching_pan_message_desc: "Jednotky [SCOPE.sCountry('pan_scope').GetAdjective] armády zaujaly po smrti Ranjita Singha nepřátelské postoje vůči nám." # todo: NEW TRANSLATION
 notification_eic_encroaching_pan_message_tooltip: "#header $notification_eic_encroaching_pan_message_name$#!\n$TOOLTIP_DELIMITER$\n$notification_eic_encroaching_pan_message_desc$" # todo: NEW TRANSLATION
 sikh_empire.4.t: "Hrozba vzpoury" # todo: NEW TRANSLATION
 sikh_empire.4.d: "[SCOPE.sCharacter('relevant_general').GetFullName] otevřeně vyjadřuje své znepokojení nad vládou [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName]." # todo: NEW TRANSLATION
 sikh_empire.4.f: "Hodiny muži debatovali o zprávách z hranic Sikhů v kancelářích Britské východoindické společnosti v Dillí. Předseda výboru začal být unaven, ale pak ho napadla myšlenka.\n\n\"Nebo možná... nic neuděláme,\" navrhl.\n\n\"Nic?\" zeptal se mladík.\n\n\"Jak jsme se nedávno naučili, málo okamžiků je pro impérium riskantnějších než přechody moci. Platí to i pro Sikhy. Hlava jejich pýchy je mrtvá, mláďata musí dokázat svou hodnotu a hyeny už jim okusují paty. Proč bychom měli hrát naši kartu? Nechme je, ať se navzájem vyčerpají.\"" # todo: NEW TRANSLATION
 sikh_empire.4.a: "Potlačit kritiku [SCOPE.sCharacter('relevant_general').GetHerHis]." # todo: NEW TRANSLATION
 sikh_empire.4.b: "Nechte [SCOPE.sCharacter('relevant_general').GetHerHim] vyjádřit své znechucení." # todo: NEW TRANSLATION
 sikh_empire.5.t: "Předčasný konec" # todo: NEW TRANSLATION
 sikh_empire.5.d: "Tajemná, oslabující nemoc učinila [SCOPE.sCharacter('relevant_ruler').GetFullName] neschopným udržet si trůn. Mezi vládnoucí elitou kolují intenzivní spekulace o okolnostech." # todo: NEW TRANSLATION
 sikh_empire.5.f: "Mladý palácový sluha se vrátil domů a našel celou svou rodinu pohromadě. Všichni měli na něj otázky.\n\n\"Otrávil [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [SCOPE.sCharacter('relevant_ruler').GetHerselfHimself] v pití?\" zeptala se jeho posuzující matka.\n\n\"Muselo to být atentát,\" prohlásil jeho horlivý otec.\n\nAle muž se nestaral o tyto otázky ani o dotazy svých sourozenců, strýců nebo tet. Chtěl jen spát a už nikdy se neprobudit. Teprve pak by přestal ptát se sám sebe - #italic co bylo v nápoji, který mu wazír dal dodat? #!\"" # todo: NEW TRANSLATION
 sikh_empire.5.a: "Lid bude tuto ztrátu oplakávat." # todo: NEW TRANSLATION
 kharak_singh_death_tt: "[SCOPE.sCharacter('relevant_ruler').GetFullName] je donucen abdikovat." # todo: NEW TRANSLATION
 notification_pan_encroaching_eic_message_name: "Strach z agrese [SCOPE.sCountry('bic_scope').GetName]" # todo: NEW TRANSLATION
 notification_pan_encroaching_eic_message_desc: "S ostudnou abdikací $Kharak$ $Singh$ vzrostl strach z možných nepřátelství s [SCOPE.sCountry('bic_scope').GetName]." # todo: NEW TRANSLATION
