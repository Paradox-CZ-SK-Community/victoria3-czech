l_polish:
 je_imperialism_of_promise: "Imperialismus slibu" # todo: NEW TRANSLATION
 je_imperialism_of_promise_reason: "Máme povinnost podporovat společné dobro za každou cenu. Základní svobody a rovné příležitosti hrají v tvorbě politiky ústřední roli. [GetIdeology('ideology_utilitarian_millian').GetName] přístup ke koloniální správě slibuje silnou sílu pokroku jak v [ROOT.GetCountry.GetName], tak po celém světě." # todo: NEW TRANSLATION
 je_imperialism_of_promise_status: "Uplatňujte [GetIdeology('ideology_utilitarian_millian').GetName] přístup ke koloniální správě v [JournalEntry.GetCountry.GetName]." # todo: NEW TRANSLATION
 utilitarian_character_trigger: "Každý [concept_agitator] nebo [concept_leader] má [GetIdeology('ideology_utilitarian_leader').GetName] [concept_ideology]." # todo: NEW TRANSLATION
 has_any_secessionists_fail_tt: "Jakékoli odštěpené země se odtrhly od [ROOT.GetCountry.GetName]." # todo: NEW TRANSLATION
 bic_collapse_var_tt: "[ROOT.GetCountry.GetName] už není [concept_subject]" # todo: NEW TRANSLATION
 secession_war_in_progress_tt: "[Concept('concept_political_movement','$movement_cultural_minority$')] je [Concept('concept_secession','Seceding')]" # todo: NEW TRANSLATION
 bureaucrats_no_shortage_trigger: "[ROOT.GetCountry.GetAdjectiveNoFlag] [concept_bureaucracy] je větší nebo rovno #v 0#! a země se #bold nechystá#! vstoupit do deficitu [concept_bureaucracy]" # todo: NEW TRANSLATION
 utilitarian.1.t: "Dobrá správa pro všechny" # todo: NEW TRANSLATION
 utilitarian.1.d: "Principy ideologie [GetIdeology('ideology_utilitarian_millian').GetName] nyní hrají ústřední roli v politice [ROOT.GetCountry.GetAdjective]. Administrativa byla reformována, aby fungovala jako dobře seřízený stroj." # todo: NEW TRANSLATION
 utilitarian.1.f: "[SCOPE.sCharacter('relevant_character').GetFullNameNoFormatting]ův závazek k utilitarismu se po tomto úspěchu v řízení rozvoje [ROOT.GetCountry.GetNameNoFormatting] prohloubil. Zatímco někteří stále zpochybňují hodnotu [SCOPE.sCharacter('relevant_character').GetLastNameNoFormatting]ova přístupu ke koloniální správě, [SCOPE.gsInterestGroup('relevant_ig').GetNameNoFormatting] vystoupili na podporu utilitárního přístupu.\n\nZatímco lidé v Indii pokračují ve svých životech, čas ukáže, zda budou plody práce správy tak trvalé a dalekosáhlé, jak si všichni přejí. Tento úspěch je majákem pro budoucí reformy." # todo: NEW TRANSLATION
 utilitarian.1.f2: "Závazek administrativy k utilitarismu se po tomto úspěchu v řízení rozvoje [ROOT.GetCountry.GetNameNoFormatting] prohloubil. Zatímco někteří stále zpochybňují hodnotu tohoto přístupu ke koloniální správě, odhodlaní zastánci vystoupili, aby prosazovali utilitární přístup.\n\nZatímco lidé v Indii pokračují ve svých životech, čas ukáže, zda budou plody práce správy tak trvalé a dalekosáhlé, jak si všichni přejí. Tento úspěch je majákem pro budoucí reformy." # todo: NEW TRANSLATION
 utilitarian.1.a: "Budoucnost vypadá šťastně a světlé." # todo: NEW TRANSLATION
 utilitarian_bonus: "Utilitární vliv" # todo: NEW TRANSLATION
 util_colonial_admin_success: "Utilitární úspěch" # todo: NEW TRANSLATION
 utilitarian.2.t: "Falešné sliby" # todo: NEW TRANSLATION
 utilitarian.2.d: "Chaos pohlcující [ROOT.GetCountry.GetName] slouží jako důkaz selhání projektu [GetIdeology('ideology_utilitarian_millian').GetName]. Jeho zastánci byli obviněni, že nevratně destabilizovali administrativu." # todo: NEW TRANSLATION
 utilitarian.2.f: "Příslib utilitárního přístupu ke koloniální správě se nevyplnil. Selhání zanechalo nejoddanější zastánce projektu zklamané a vysloužili si posměšné poznámky zaměřené proti nim.\n\n\"Vždy jsem věděl, že projekt selže. Celý přístup byl od začátku zásadně chybný. Pro takovou absurdní agendu tu není místo.\"" # todo: NEW TRANSLATION
 utilitarian.2.a: "Zde nemají užitek." # todo: NEW TRANSLATION
 utilitarian_malus: "Zlomené sliby" # todo: NEW TRANSLATION
 util_colonial_admin_fail: "Oslabený vliv" # todo: NEW TRANSLATION
 utilitarian.3.t: "Projekt bez pokroku" # todo: NEW TRANSLATION
 utilitarian.3.d: "Zatímco utilitární přístup ke koloniální správě byl slibný, zde v [ROOT.GetCountry.GetName] neuchytil." # todo: NEW TRANSLATION
 utilitarian.3.f: "[SCOPE.sCharacter('relevant_character').GetFullNameNoFormatting]ův závazek k utilitarismu polevil, jak projekt ztrácel hybnost. [SCOPE.gsInterestGroup('relevant_ig').GetNameNoFormatting] už nepovažují utilitární agendu za prioritu.\n\nNa chvíli [SCOPE.sCharacter('relevant_character').GetLastNameNoFormatting] tiše přemýšlí o lekcích celého úsilí. \"Možná musíme být praktičtější v tom, jak naše principy ovlivňují politiku,\" zamýšlí se." # todo: NEW TRANSLATION
 utilitarian.3.f2: "Závazek administrativy k utilitarismu polevil, jak projekt přišel o své nejoddanější podporovatele.\n\nNa chvíli se jeden muž zadumá nad ponaučeními z celého úsilí. \"Možná musíme být praktičtější v tom, jak naše principy ovlivňují politiku,\" zamýšlí se." # todo: NEW TRANSLATION
 utilitarian.3.a: "Náš lid bude i tak prosperovat." # todo: NEW TRANSLATION
 utilitarian_partial_malus: "Nesplněné sliby" # todo: NEW TRANSLATION
 util_colonial_admin_partial_success: "Slabý úspěch" # todo: NEW TRANSLATION
 utilitarian.4.t: "Nevhodný vliv" # todo: NEW TRANSLATION
 utilitarian.4.d: "[SCOPE.gsInterestGroup('relevant_ig').GetName] tvrdí, že veřejné mínění a tisk v [SCOPE.sCountry('relevant_overlord').GetName] negativně ovlivňují [ROOT.GetCountry.GetAdjective] politiku." # todo: NEW TRANSLATION
 utilitarian.4.f: "\"Samozřejmě, The Times má názor. Jsem si jist, že i pekař Jan a švadlena Jana mají svůj názor. [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] by je měl všechny vyslechnout. Kdo se stará o to, jak málo informované jsou jejich představy o Indii? Třeba každou politiku lze rozhodovat všeobecným hlasováním.\"\n\n\"Kdy se naučí, že k vládnutí nad Indií musíte být v Indii?\"" # todo: NEW TRANSLATION
 utilitarian.4.a: "Ovládněte narativ v tisku." # todo: NEW TRANSLATION
 utilitarian.4.b: "Názory [SCOPE.sCountry('relevant_overlord').GetAdjective] veřejnosti jsou neškodné." # todo: NEW TRANSLATION
 stop_meddlesome_affairs: "Veřejné mínění ovládnuto" # todo: NEW TRANSLATION
 meddlesome_affairs: "Problémové veřejné mínění" # todo: NEW TRANSLATION
 utilitarian.5.t: "Imperiální závazky" # todo: NEW TRANSLATION
 utilitarian.5.d: "Postoje a činy [SCOPE.sCulture('not_discriminated_culture').GetName] administrátorů v [SCOPE.sState('relevant_state').GetName] vůči lidu [SCOPE.sCulture('discriminated_culture').GetName] ohrožují naši misi [GetIdeology('ideology_utilitarian_leader').GetName]." # todo: NEW TRANSLATION
 utilitarian.5.f: "[SCOPE.sCharacter('relevant_character').GetFullNameNoFormatting] potvrzuje nedávné zprávy o násilí vůči [SCOPE.sCulture('discriminated_culture').GetNameNoFormatting] lidem v [SCOPE.sState('relevant_state').GetNameNoFormatting]:\n\n\"Neomezované chování [SCOPE.sCulture('not_discriminated_culture').GetNameNoFormatting] administrátorů, kteří přijeli do [ROOT.GetCountry.GetNameNoFormatting] hledat své zisky, podrývá úsilí naší mise [GetIdeology('ideology_utilitarian_leader').GetNameNoFormatting]. Lidé [SCOPE.sCulture('discriminated_culture').GetNameNoFormatting] potřebují ochranu před bezprávím, které na ně páchají ti, kteří honí svá bohatství.\"" # todo: NEW TRANSLATION
 utilitarian.5.a: "Tito administrátoři musí projevovat zdrženlivost." # todo: NEW TRANSLATION
 utilitarian.5.b: "Proč do toho zasahovat nyní?" # todo: NEW TRANSLATION
 unrestrained_fortune_seekers: "Neomezení honiči zisku" # todo: NEW TRANSLATION
 restrained_fortune_seekers: "Zdrženliví honiči zisku" # todo: NEW TRANSLATION
 utilitarian.6.t: "Posilování vazeb" # todo: NEW TRANSLATION
 utilitarian.6.d: "[SCOPE.sPoliticalLobby('relevant_lobby').GetName] aktivně zvyšuje své úsilí upevnit vazby, které má [ROOT.GetCountry.GetName] s [SCOPE.sCountry('relevant_lobby_country').GetName]." # todo: NEW TRANSLATION
 utilitarian.6.f: "Portrét [SCOPE.sCountry('relevant_lobby_country').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('relevant_lobby_country').GetRuler.GetFullNameNoFormatting] visí nad dvěma váženými postavami, které se do noci hádají.\n\n\"Všichni jsme loajálními poddanými Impéria, [SCOPE.sCharacter('relevant_character').GetFullNameNoFormatting]. Žádná politika to nezmění. Ale zatímco pracujeme pro dobro všech poddaných, vy chcete pomoci jen svým vlastním vyhlídkám.\"\n\n\"Když mi [SCOPE.sCountry('relevant_lobby_country').GetRuler.GetPrimaryRoleTitle] důvěřuje, budu moci prosit o jeho pomoc.\"\n\n\"Když ti budou lidé věřit, nikdy ti pomoc nechybí.\"" # todo: NEW TRANSLATION
 utilitarian.6.a: "Teď potřebujeme více autonomie." # todo: NEW TRANSLATION
 utilitarian.6.b: "Dohlédněte, aby snahy [SCOPE.sPoliticalLobby('relevant_lobby').GetName] nebyly rušeny." # todo: NEW TRANSLATION
 utilitarian.7.t: "Zpožděná rozhodnutí" # todo: NEW TRANSLATION
 utilitarian.7.d: "Dopisy z [SCOPE.sCountry('relevant_overlord').GetCapital.GetCityHubName] dorazily s novými pokyny pro správu určenými pro [ROOT.GetCountry.GetAdjective] úředníky a činitele." # todo: NEW TRANSLATION
 utilitarian.7.f: "Denní činnosti tohoto [SCOPE.sCulture('not_discriminated_culture').GetNameNoFormatting] úředníka mají často v jeho koutku [SCOPE.sState('relevant_state').GetNameNoFormatting] málo dohledu. Jeho činy dlouho nebyly kontrolovány. Dopisy z [SCOPE.sCountry('relevant_overlord').GetCapital.GetCityHubName] vymezují nová pravidla ohledně hlášení nesrovnalostí v papírování.\n\n\"Jaké obtěžování. Moji úředníci pilně pracují. Chyba tady a tam přece může být přehlédnuta.\"" # todo: NEW TRANSLATION
 utilitarian.7.a: "Musíme plnit rozkazy." # todo: NEW TRANSLATION
 utilitarian.7.b: "Nechte místní úředníky rozhodovat podle svého." # todo: NEW TRANSLATION
 bic_by_the_book: "Podle pravidel" # todo: NEW TRANSLATION
 utilitarian.8.t: "Rovné příležitosti" # todo: NEW TRANSLATION
 utilitarian.8.d: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] obdržel formální depeši od [SCOPE.sCountry('relevant_overlord').GetName] doporučující rozšíření vzdělání v [ROOT.GetCountry.GetName]." # todo: NEW TRANSLATION
 utilitarian.8.f: "Telegraf dorazil pozdě v noci. Po jeho přečtení si [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] přál, aby ho ponechal na ráno.\n\n\"Takže nás vyzývají, abychom vzdělávali masy? To vyvolá otřesy. Buď bude mít můj nástupce spoustu písařů, kteří budou vykonávat jeho vůli, nebo bude mít dobře informovanou a promluvící opozici. Musíme být opatrní při tom, jak to provedeme.\"" # todo: NEW TRANSLATION
 utilitarian.8.a: "[SCOPE.gsInterestGroup('relevant_ig').GetNameNoFormatting] může pomoci prosadit tyto změny." # todo: NEW TRANSLATION
 utilitarian.8.b: "Reagovat na depeši je nevýhodné." # todo: NEW TRANSLATION
 util_law_enactment_progress: "Prosazování změn" # todo: NEW TRANSLATION
 clerk_state_radicals_increase_tt: "[Concept('concept_pop', '$concept_pops$')] ve státech s více než 10% politickou silou [SCOPE.gsInterestGroup('relevant_ig').GetName] se stanou více [concept_radical]" # todo: NEW TRANSLATION
 no_edu_change_stance_gain_pol_str: "Trvající preference" # todo: NEW TRANSLATION
 utilitarian.9.t: "Nesmírně náročná vize" # todo: NEW TRANSLATION
 utilitarian.9.d: "Koloniální administrátoři vyznávající filozofii [GetIdeology('ideology_utilitarian_leader').GetName] vypracovali ambiciózní plány na zásadní racionalizaci [ROOT.GetCountry.GetAdjective] společnosti. Jejich kritici to nazývají nemožnou, nesmírně náročnou vizí." # todo: NEW TRANSLATION
 utilitarian.9.f: "\"Toto je velkolepé podnikání, jedna z nejdůležitějších věcí. Bude vyžadovat společné úsilí každého loajálního poddaného, když budeme formovat tento národ k obrazu pořádku. Lidé, a ti, kterým naslouchají, musí uposlechnout naše rady.\"\n\n\"Ale komu se obrátit nejdříve? Obrátí se lidé ke svým vůdcům pro naši věc? Nebo bychom měli žádat o přízeň u nich a doufat, že ukážou svým následovníkům hodnotu naší cesty? Vždyť vše, co děláme, děláme pro dobro všech.\"" # todo: NEW TRANSLATION
 utilitarian.9.a: "Musíme přesvědčit veřejnost." # todo: NEW TRANSLATION
 utilitarian.9.b: "Přesvědčit více úředníků, aby se přidali k naší věci." # todo: NEW TRANSLATION
 persuasive_util_pamphlet_attract: "Přesvědčit veřejnost" # todo: NEW TRANSLATION
 persuasive_util_pamphlet_pol_str: "Síla v politice" # todo: NEW TRANSLATION
 utilitarian.10.t: "Studium indické společnosti" # todo: NEW TRANSLATION
 utilitarian.10.d: "Byl navržen organizovaný sčítání lidu, aby vytvořil komplexní přehled populace v [ROOT.GetCountry.GetName]." # todo: NEW TRANSLATION
 utilitarian.10.f: "\"Studium Indie musí být profese samou o sobě, jako právo nebo medicína.\"\n\n\"K vládnutí je třeba znát ovládané. Je zázrak, že jsme se dostali tak daleko bez dokončeného sčítání. Ale jít dál by bylo nerozumné. Horší by to bylo jako bloudit v labyrintu plném pastí s povázkou přes oči. Ne, musíme znát jazyk, kastu, náboženství a pohlaví každého!\"" # todo: NEW TRANSLATION
 utilitarian.10.a: "Pokračovat ve sčítání." # todo: NEW TRANSLATION
 utilitarian.10.b: "K čemu by to sloužilo?" # todo: NEW TRANSLATION
