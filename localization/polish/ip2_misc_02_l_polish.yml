 ig_granthis: "Granthi" # todo: NEW TRANSLATION
 ig_granthis_desc: "Granthi jsou náboženští úředníci v sikhismu, monoteistické víře, která považuje světské záležitosti za rozptýlení od jednoty Boha." # todo: NEW TRANSLATION
 ig_trait_rehat: "Rehat" # todo: NEW TRANSLATION
 ig_trait_rehat_desc: "Od dob prvních Panj Pyare naše víra povolává největší válečníky k službě naší spravedlivé věci. V těchto těžkých časech jsou vojáci opět vedení vírou, aby sloužili pod našimi prapory." # todo: NEW TRANSLATION
 ig_khalsaji: "Khalsaji" # todo: NEW TRANSLATION
 ig_khalsaji_desc: "Významná bojová síla Sikhského impéria, Khalsaji spojují sikhské khalsa tradice s modernizovanými franco-britskými principy." # todo: NEW TRANSLATION
 ig_trait_khalsa: "Khalsa" # todo: NEW TRANSLATION
 ig_trait_khalsa_desc: "Máme povinnost cvičit zbraně a chránit nevinné. Jako válečníci musíme bojovat statečně bez ohledu na šance a žít věrně tradicím Rehat." # todo: NEW TRANSLATION
 ig_jats: "Jats" # todo: NEW TRANSLATION
 ig_jats_desc: "Jats jsou tradiční rolníci a sedláci v regionu Paňdžáb s kořeny v pastevectví. Jejich zájmy jsou převážně agrární povahy." # todo: NEW TRANSLATION
 ig_trait_khalsa_panth: "Khalsa Panth" # todo: NEW TRANSLATION
 ig_trait_khalsa_panth_desc: "Pravdivý život a tvrdá práce. Žijeme způsobem svatých, vyhýbáme se extrémům a kráčíme střední cestou. Zboží, které vyrábíme, se dostává k těm, kdo ho potřebují." # todo: NEW TRANSLATION
 princely_state_decision: "Usilovat o suverenitu" # todo: NEW TRANSLATION
 princely_state_decision_desc: "Příliš dlouho nás Britové podceňovali a podrývali naši autoritu. Zahajte kampaň za zajištění nezávislosti" # todo: NEW TRANSLATION
 je_princely_states: "Boj o suverenitu" # todo: NEW TRANSLATION
 je_princely_states_reason: "Náš velký [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullNameNoFormatting] může vládnout nad [ROOT.GetCountry.GetNameNoFormatting], ale stále jsme podřízeni rozmarům a pochybením [SCOPE.sCountry('top_overlord_scope').GetNameNoFormatting]. Moc [SCOPE.sCountry('overlord_scope').GetNameNoFormatting] roste den za dnem, ale stále můžeme formovat svůj osud.\n\nPříliv je ve prospěch zvýšení autonomie [ROOT.GetCountry.GetNameNoFormatting] a hledání cesty k nezávislosti, aby [SCOPE.sCountry('top_overlord_scope').GetAdjectiveNoFormatting] nepřevzal úplnou kontrolu." # todo: NEW TRANSLATION
 je_princely_states_status: "Získejte nezávislost pro [JournalEntry.GetCountry.GetNameNoFormatting]." # todo: NEW TRANSLATION
 has_been_annexed_tt: "[ROOT.GetCountry.GetNameNoFormatting] byl anektován." # todo: NEW TRANSLATION
 modifier_increase_autonomy: "Aktivní snaha o nezávislost" # todo: NEW TRANSLATION
