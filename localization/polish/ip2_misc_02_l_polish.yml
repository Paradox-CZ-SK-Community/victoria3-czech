 caste_conflict.4.t: "Manifest nebráhmínů" # todo: NEW TRANSLATION
 caste_conflict.4.d: "Manifest nebráhmínů koluje v [ROOT.GetCountry.GetCapital.GetCityHubName] a vyvolává napětí mezi [SCOPE.gsInterestGroup('rural_folk_ig_scope').GetName] a [SCOPE.gsInterestGroup('intelligentsia_ig_scope').GetName]." # todo: NEW TRANSLATION
 caste_conflict.4.f: "Dva stranické vůdce seděli proti sobě a jejich pomocníci poslouchali, jak se už druhou hodinu duely bojují rozumy.\n\n\"Prosím, musíte přimět Justice Party, aby viděla rozum,\" naléhal [SCOPE.sCharacter('intelligentsia_leader_scope').GetFullNameNoFormatting]. \"Musíme bojovat spolu, nebo prohrajeme!\"\n\n\"Požádáte nás, abychom stáli po britské lathi po vašem boku, ale řekněte mi, až přijde zítra, budete také stát po našem boku při vládnutí? Britové mi neudělali větší křivdu než vy. Mnoho jejich skutků bylo vedeno vašima rukama.\"" # todo: NEW TRANSLATION
 caste_conflict.4.a: "Ten manifest je vlastizrádný!" # todo: NEW TRANSLATION
 caste_conflict.4.b: "Možná manifest obsahuje platné body." # todo: NEW TRANSLATION
 argument_to_be_made: "Argument, který má být učiněn" # todo: NEW TRANSLATION
 caste_conflict.5.t: "Nedotknutelní a vyvrženci" # todo: NEW TRANSLATION
 caste_conflict.5.d: "Aby si prosadili svá práva, komunita dalitů pila z veřejné nádrže na vodu, ke které jim byl přístup odepřen. Tento nenásilný protest vedl [SCOPE.sCharacter('character_scope').GetFullName] a vyvolal protest bráhmínských kněží." # todo: NEW TRANSLATION
 caste_conflict.5.f: "Mladá dalitská dívka Meena sledovala průvod z dálky, skrytá za velkým stromem. Přišla sem včera s matkou a pily z nádrže. Zdálo se to jako velká událost, ačkoli ona jen vynechala práci toho dne. Ale to, co nyní viděla, ji zděsilo; ti kněží lijí kravský moč a hnůj do vody. Pila Meena kravský moč? Tak či onak, už z této znečištěné nádrže pít nebude." # todo: NEW TRANSLATION
 caste_conflict.5.a: "Chování kněží je nepřijatelné." # todo: NEW TRANSLATION
 caste_conflict.5.b: "Nechme je navzájem se rozptylovat." # todo: NEW TRANSLATION
