 india_railway.1.t: "Loupež na vlaku v [SCOPE.sState('relevant_state').GetNameNoFormatting]" # todo: NEW TRANSLATION
 india_railway.1.d: "Mezinárodní tisk informuje o loupeži na vlaku v [SCOPE.sState('relevant_state').GetNameNoFormatting], vedené agitátory [SCOPE.sCulture('discriminated_culture').GetNameNoFormatting]." # todo: NEW TRANSLATION
 india_railway.1.f: "\"Kdyby byli dacoiti, zemřelo by mnohem více lidí. Tito mladí muži nám kradli NAŠE peníze zpět PRO NÁS. Udělali chyby, ale jejich úmysly jsou ušlechtilé.\"\n\n\"Když jsou tak ušlechtilí, co dělali máváním zbraněmi na své spoluobčany? Nyní je mrtvý nevinný muž. Nikdy nezapomenu zvuk, jak jeho žena plakala.\"" # todo: NEW TRANSLATION
 india_railway.1.a: "Popřít, že naši stráže [SCOPE.sCulture('not_discriminated_culture').GetNameNoFormatting] byli přemoženi." # todo: NEW TRANSLATION
 india_railway.1.b: "Zatajování našich ztrát nemá smysl." # todo: NEW TRANSLATION
 do_control_the_press: "Ovládání tisku" # todo: NEW TRANSLATION
 not_control_the_press: "Špatný tisk" # todo: NEW TRANSLATION
 india_railway.2.t: "Krádež Koruně" # todo: NEW TRANSLATION
 india_railway.2.d: "Rozpravy začaly u soudu s obviněnými revolucionáři, kteří jsou obviněni z loupeže a vraždy." # todo: NEW TRANSLATION
 india_railway.2.f: "Řev davu shromážděného před soudní síní hřeje srdce obžalovaných. Ten samý řev však znemožňuje slyšet žalobce. Neúnavně pokračuje.\n\n\"Únosy, držení nelegálních střelných zbraní a vražda. To jsou hrozné činy, vaše ctihodnosti. Ale tito nestydatí muži je spáchali a zároveň se dopustili ještě ohavnějšího zločinu. Pokusili se okrást samotnou korunu, která se o ně stará. Dav venku je nazve hrdiny, zákon je označí za zrádce.\"" # todo: NEW TRANSLATION
 india_railway.2.a: "Udělat příklad - vyslýchat je." # todo: NEW TRANSLATION
 india_railway.2.b: "Dodržet řádný proces a nařídit jej." # todo: NEW TRANSLATION
 railway_trial_authority: "Autoritativní opatření" # todo: NEW TRANSLATION
 railway_trial_legit: "Řádný proces" # todo: NEW TRANSLATION
 india_railway.3.t: "Regionální hladomor" # todo: NEW TRANSLATION
 india_railway.3.d: "Masivní vývoz obilí a plodin ponechal obyvatele [SCOPE.sState('relevant_state').GetNameNoFormatting] zranitelné během regionálního hladomoru." # todo: NEW TRANSLATION
 india_railway.3.f: "#italic Milá Elizabeth,\n\nDoprovázel jsem nedávno sběry Koruny po Indii, když jsem spatřil hrozný pohled. Muž, hubený jako tyčka, stál na stráži před svou hladovějící ženou a dvěma dětmi. Když jsem se ptal spolubojovníků, co hlídá, vysvětlili mi, že vesnice se uchýlila ke kanibalismu. #!" # todo: NEW TRANSLATION
 india_railway.3.a: "Použít železnici k dopravě potravin z přebytkových oblastí." # todo: NEW TRANSLATION
 india_railway.3.b: "Taková opatření si nemůžeme dovolit." # todo: NEW TRANSLATION
 state_grain_expensive_tt: "#variable Grain#! je dražší o více než #variable 70%#! než [concept_base_price]" # todo: NEW TRANSLATION
 railway_famine: "Úmrtí v regionálním hladomoru" # todo: NEW TRANSLATION
 railway_hunger_relief: "Odeslána pomoc proti hladu" # todo: NEW TRANSLATION
 railway_hunger_no_relief: "Pomoc proti hladu zadržena" # todo: NEW TRANSLATION
 railway_ig_disapproval: "Odmítnuté zájmy" # todo: NEW TRANSLATION
 railway_ig_approval: "Zájmová skupina se zájmem o vlastní prospěch" # todo: NEW TRANSLATION
 india_railway.4.t: "Plně vybavené první třídy" # todo: NEW TRANSLATION
 india_railway.4.d: "Zatímco mnoho lidí vítá železniční cestování, napětí mezi komunitami je vysoké, protože segregace přetrvává." # todo: NEW TRANSLATION
 india_railway.4.f: "Dva chlapci vystrkují hlavy z dveří vlaku, ostrý vítr je chladí v horkém úmorném dni.\n\n\"Slyšel jsem, že v první třídě mají stropní ventilátory, postele a jejich sedačky jsou čalouněné, takže můžete sedět celé hodiny!\"\n\n\"No, slyšel jsem, že mají své vlastní záchody.\"\n\n\"Tak to jste špatně slyšeli, pánové a paní si záchody nevyžadují.\"\n\n\"Je to proto, že náš vůz taky žádný nemá?\"" # todo: NEW TRANSLATION
 india_railway.4.a: "Sociální otázky nejsou naléhavé." # todo: NEW TRANSLATION
 india_railway.4.b: "Více čajových stánků sníží napětí." # todo: NEW TRANSLATION
 rising_intracommunal_tension: "Rostoucí napětí" # todo: NEW TRANSLATION
 india_railway.5.t: "Železnice pro prosperitu" # todo: NEW TRANSLATION
 india_railway.5.d: "Velký železniční projekt byl konečně dokončen. Nová železnice otevírá lidem nové příležitosti cestovat, pracovat a spojovat se napříč zemí." # todo: NEW TRANSLATION
 india_railway.5.f: "S dokončením této stanice je budoucnost Rádžu zajištěna. Naše síť vlaků bude páteří našeho obchodu, naší armády, naší vlády. Pára a uhlí budou proudit žilami impéria.\n\nA tato krásná stanice, pojmenovaná po našem velkém [SCOPE.sCountry('relevant_overlord').GetRuler.GetPrimaryRoleTitle], bude jejím bušícím srdcem." # todo: NEW TRANSLATION
 india_railway.5.f2: "S dokončením této stanice je budoucnost Rádžu zajištěna. Naše síť vlaků bude páteří našeho obchodu, naší armády, naší vlády. Pára a uhlí budou proudit žilami impéria.\n\nA tato krásná stanice, pojmenovaná po našem velkém [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle], bude jejím bušícím srdcem." # todo: NEW TRANSLATION
 india_railway.5.a: "Nádhera." # todo: NEW TRANSLATION
 india_railway_reward: "Skvělé spojení" # todo: NEW TRANSLATION
 je_victoria_terminus: "Victoria Terminus" # todo: NEW TRANSLATION
 je_victoria_terminus_reason: "Příznivci [SCOPE.gsInterestGroup('relevant_terminus_ig').GetName] vybrali prostředky na #tooltippable #tooltip:victoria_terminus_construct_tt #bold vybudování velkého terminusu#! #!#!in $STATE_BOMBAY$. Tento elegantní terminus s přidanými železničními nástupišti a administrativními kancelářemi slibuje zlepšit veřejné mínění o Indii." # todo: NEW TRANSLATION
 je_victoria_terminus_status: "Postavte $building_victoria_terminus$ v [Concept('concept_state_region','$concept_state_region$')] $STATE_BOMBAY$." # todo: NEW TRANSLATION
 victoria_terminus_possible_tt: "[ROOT.GetCountry.GetNameNoFormatting] má $building_railway$ v [Concept('concept_state_region','$concept_state_region$')] $STATE_BOMBAY$." # todo: NEW TRANSLATION
