 sikh_empire.1.t: "Víc než svatba" # todo: NEW TRANSLATION
 sikh_empire.1.d: "V skvělém diplomacickém a politickém výkonu pozval [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] elitu země a zahraniční zástupce na bohatou svatbu prince." # todo: NEW TRANSLATION
 sikh_empire.1.f: "Dvorský kronikář v službách mahárádžy zaznamenává slavnosti do nejmenších detailů:\n\n#italic \"Byly vystaveny ohňostroje všech druhů. Pohyblivý trůn a 'Shalabagh' byly ozdobeny a vyzdobeny různými druhy květin ... neslo je asi 100 mužů. #!\"" # todo: NEW TRANSLATION
 sikh_empire.1.a: "Přivítat zahraniční delegáty." # todo: NEW TRANSLATION
 sikh_empire.1.b: "Zajistit naši roli na globálním královském jevišti." # todo: NEW TRANSLATION
 intrigue_reduced_by_10_tt: "[concept_court_intrigue] se sníží o #v 10#!" # todo: NEW TRANSLATION
 intrigue_reduced_by_20_tt: "[concept_court_intrigue] se sníží o #v 20#!" # todo: NEW TRANSLATION
