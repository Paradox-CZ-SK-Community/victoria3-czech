 je_dravidian_movement_reason: "Lid obyčejný v [ROOT.GetCountry.GetName] zareagoval na nepřiměřené zastoupení a politickou moc bráhmínů. Po řadě protibrahmínských konferencí vzniklo Dravidské hnutí a nastavilo novou agendu proti bráhmínské dominanci. Usilují odstranit kastovní rozlišení ze zákona a státní správy." # todo: NEW TRANSLATION
 dravidian_movement_fail_tt: "Přijatý zákon o domácí vládě Indie" # todo: NEW TRANSLATION
 caste_conflict.1.t: "Nerovné příležitosti" # todo: NEW TRANSLATION
 caste_conflict.1.d: "Napětí mezi kastami se zvýšilo poté, co nedávné sčítání odhalilo nepřiměřené zastoupení bráhmínů ve vládních funkcích a zdůraznilo omezené kvalifikace pro nebráhmíny." # todo: NEW TRANSLATION
 caste_conflict.1.f: "Praveenův životopis, jeho dva magisterské tituly z ekonomie a práva, se mu sroloval v rukou, když rozzuřeně odcházel po dalším odmítnutí.\n\nVěděl, že by neměl být tak rozzlobený ani překvapený. Věděl, že když se přestěhoval do [ROOT.GetCountry.GetCapital.GetCityHubName], bude daleko od podpory své pokrokové univerzity, a přesto ho šokovala zřejmá segregace. Přes své kvalifikace se obtížně uživil, zatímco jiní stejně vzdělaní popíjeli chai ve sídlech. Nejvíce ho rozčilovalo, jak ho stráže od sebe odháněly. Jako by byly v očích pánů lepší než on." # todo: NEW TRANSLATION
 caste_conflict.1.a: "[SCOPE.gsInterestGroup('rural_folk_ig_scope').GetName] bude prosazovat změnu." # todo: NEW TRANSLATION
 caste_conflict.1.b: "[SCOPE.sCountry('top_overlord_scope').GetName] má své důvody, proč to podporovat." # todo: NEW TRANSLATION
