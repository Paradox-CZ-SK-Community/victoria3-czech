 je_earn_recognition_tt: "Podepíšeme #bold [SCOPE.GetRootScope.GetCountry.GetCustom('treaty_names_custom_loc')]#! s relevantní [concept_great_power], což nám zajistí uznání v očích světa." # todo: NEW TRANSLATION
 earn_recognition_events.1.t: "Dohoda [SCOPE.GetRootScope.GetCountry.GetAdjectiveNoFormatting]-[SCOPE.sCountry('treaty_partner_country_scope').GetAdjectiveNoFormatting] [SCOPE.GetRootScope.GetCountry.GetCustom('treaty_names_custom_loc')]" # todo: NEW TRANSLATION
 earn_recognition_events.1.d: "Podepsáno dnes odpoledne v [SCOPE.sCountry('treaty_partner_country_scope').GetCapital.GetCityHubName], tato průlomová smlouva oficiálně ruší jakékoli předchozí nerovné smlouvy mezi [SCOPE.sCountry('treaty_partner_country_scope').GetName] a [SCOPE.GetRootScope.GetCountry.GetName] ve prospěch nové, mezi rovnocennými stranami vyjednané dohody." # todo: NEW TRANSLATION
 earn_recognition_events.1.f: "\"[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetNameNoFormatting] a [SCOPE.sCountry('treaty_partner_country_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('treaty_partner_country_scope').GetNameNoFormatting], oba toužící udržet vztahy dobrého porozumění, rozšířit a zvýšit styk mezi svými státy, přesvědčeni, že tento cíl nejlépe dosáhnou revizí smluv dříve existujících mezi oběma zeměmi, rozhodli se dokončit takovou revizi založenou na principech spravedlnosti a vzájemného prospěchu.\"" # todo: NEW TRANSLATION
 earn_recognition_events.1.a: "Nový úsvit pro [SCOPE.GetRootScope.GetCountry.GetNameNoFlag]. Ratifikujte smlouvu." # todo: NEW TRANSLATION
 lobby_events.21.t: "Nepřítel mého nepřítele" # todo: NEW TRANSLATION
 lobby_events.21.d: "Na základě vnímaného společného nepřátelství vůči [SCOPE.sCountry('lobby_target_scope').GetName] se pro-[SCOPE.sCountry('relevant_country_scope').GetAdjective] sdružení stala běžnou součástí v patrioticky nakloněných [SCOPE.gsInterestGroup('relevant_ig_scope').GetCustom('IG_L_TT')]." # todo: NEW TRANSLATION # todo: NAME CASE
 lobby_events.21.f: "Shromáždění pánů pozorně přikyvovalo řečníkovi. Dokud [SCOPE.sCountry('lobby_target_scope').GetNameNoFormatting] zůstane hrozbou, žádné aktivum využitelné proti ní nebude nevítané.\nPro každý [SCOPE.sCountry('relevant_country_scope').GetAdjectiveNoFormatting] úspěch uskutečněný na úkor [SCOPE.sCountry('lobby_target_scope').GetCapital.GetCityHubName] je to o jeden krok méně, který by museli podniknout sami." # todo: NEW TRANSLATION
 lobby_events.21.a: "Povzbuďte je, záležitost [SCOPE.sCountry('relevant_country_scope').GetNameNoFormatting] je naše!" # todo: NEW TRANSLATION
 lobby_events.21.b: "[SCOPE.gsInterestGroup('relevant_ig_scope').GetName] mají právo na své názory." # todo: NEW TRANSLATION
 lobby_events.21.c: "Naše vztahy s [SCOPE.sCountry('lobby_target_scope').GetName] musí mít přednost." # todo: NEW TRANSLATION
 enemy_of_enemy_ig_modifier: "Potlačení lobbistů" # todo: NEW TRANSLATION
 lobby_events.22.t: "Maják pokroku" # todo: NEW TRANSLATION
 lobby_events.22.d: "S velkým obdivem hledí členové [SCOPE.gsInterestGroup('relevant_ig_scope').GetCustom('IG_G_TT')] na [SCOPE.sCountry('relevant_country_scope').GetAdjective] systém [SCOPE.sLaw('relevant_law_scope').GetName] a stávají se častými členy pro-[SCOPE.sCountry('relevant_country_scope').GetAdjectiveNoFormatting] společností." # todo: NEW TRANSLATION # todo: NAME CASE
 lobby_events.22.f: "\"Když mluvím '[SCOPE.sCountry('relevant_country_scope').GetNameNoFormatting]', prvé věci, které přijdou mnohým našim krajanům na mysl, budou věci týkající se zahraniční politiky, nikoli domácí. Nicméně je to právě k prvnímu, nikoli k druhému, kam musíme hledět pro základy skutečného a silného poutu mezi našimi národy.\"" # todo: NEW TRANSLATION
 lobby_events.22.a: "Na systému [SCOPE.sCountry('relevant_country_scope').GetAdjectiveNoFormatting] je něco dobrého." # todo: NEW TRANSLATION
 lobby_events.22.b: "Vláda davu nemá místo v [SCOPE.GetRootScope.GetCountry.GetNameNoFormatting]." # todo: NEW TRANSLATION
 lobby_events.23.t: "Absolutistický ideál" # todo: NEW TRANSLATION
 lobby_events.23.d: "Ve [SCOPE.gsInterestGroup('relevant_ig_scope').GetCustom('IG_L_TT')] je [SCOPE.sCountry('relevant_country_scope').GetName] stále více oslavována jako příklad absolutistické vlády uplatněné správně, s téměř kultem obdivu kolem [SCOPE.sCountry('relevant_country_scope').GetRuler.GetCustom('ageist_adjective')] [SCOPE.sCountry('relevant_country_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('relevant_country_scope').GetRuler.GetFullName]." # todo: NEW TRANSLATION # todo: NAME CASE
 lobby_events.23.f: "Ačkoliv jen málokterý z členů klubu by si přál, aby [SCOPE.sCountry('relevant_country_scope').GetAdjectiveNoFormatting] [SCOPE.sCountry('relevant_country_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('relevant_country_scope').GetRuler.GetHerselfHimself] vládl z [ROOT.GetCountry.GetCapital.GetCityHubName] za současných okolností, našli v [SCOPE.sCountry('relevant_country_scope').GetRuler.GetHerHim] zdroj inspirace — model toho, čím by [ROOT.GetCountry.GetNameNoFormatting] mohlo být, kdyby osud byl jiný." # todo: NEW TRANSLATION
 lobby_events.23.a: "Budeme tyto události bedlivě sledovat." # todo: NEW TRANSLATION
 lobby_events.23.b: "[SCOPE.gsInterestGroup('relevant_ig_scope').GetName] nemají co se učit od tohoto [SCOPE.sCountry('relevant_country_scope').GetRuler.GetCulture.GetNameNoFormatting] barbara." # todo: NEW TRANSLATION
 racist_rhetorics_modifier: "Rasistická rétorika" # todo: NEW TRANSLATION
 lobby_events.24.t: "Model [SCOPE.sCountry('relevant_country_scope').GetAdjectiveNoFormatting]" # todo: NEW TRANSLATION
 lobby_events.24.d: "Hluboce ohromeni současným stavem [SCOPE.sCountry('relevant_country_scope').GetAdjective] [SCOPE.sCountry('relevant_country_scope').GetCustom('army_or_navy_custom_loc')], klíčové postavy v [ROOT.GetCountry.GetAdjective] [SCOPE.gsInterestGroup('relevant_ig_scope').GetCustom('IG_L_TT')] se přiklonily k [SCOPE.sPoliticalLobby('relevant_lobby_scope').GetName]." # todo: NEW TRANSLATION # todo: NAME CASE
 lobby_events.24.f: "V četných důstojnických klubech [ROOT.GetCountry.GetCapital.GetCityHubName] byl [SCOPE.sCountry('relevant_country_scope').GetAdjectiveNoFormatting] [SCOPE.sCountry('relevant_country_scope').GetCustom('army_or_navy_custom_loc')] dlouho uznáván a děšen ve stejné míře. Inspiroval vůdčí plány a válečné hry; jako protivník by byl nezanedbatelný. Ale jako spojenec?" # todo: NEW TRANSLATION
 lobby_events.24.a: "Mnoho se můžeme naučit od [SCOPE.sCountry('relevant_country_scope').GetAdjective] [SCOPE.sCountry('relevant_country_scope').GetCustom('army_or_navy_custom_loc')]." # todo: NEW TRANSLATION
 lobby_events.24.b: "Lojalita [SCOPE.gsInterestGroup('relevant_ig_scope').GetCustom('IG_G_TT')] by měla patřit pouze [ROOT.GetCountry.GetNameNoFlag]." # todo: NEW TRANSLATION # todo: NAME CASE
 officer_corps_unrest_modifier: "Nepokoje důstojnického sboru" # todo: NEW TRANSLATION
 affiliation_ban_enforced_modifier: "Zákaz příslušnosti prosazen" # todo: NEW TRANSLATION
 x_army_custom_loc: "armáda" # todo: NEW TRANSLATION
 x_navy_custom_loc: "námořnictvo" # todo: NEW TRANSLATION
 lobby_events.25.t: "Soudruh [SCOPE.sCountry('relevant_country_scope').GetRuler.GetLastNameNoFormatting]" # todo: NEW TRANSLATION
 lobby_events.25.d: "Ohromen implementací [SCOPE.sLaw('relevant_law_scope').GetName] v [SCOPE.sCountry('relevant_country_scope').GetAdjective], [SCOPE.gsInterestGroup('relevant_ig_scope').GetName] se silnými pro-[SCOPE.sCountry('relevant_country_scope').GetAdjective] sympatiemi se pevně zakotvily v této skupině." # todo: NEW TRANSLATION
 lobby_events.25.f: "\"Dělníci, soudruzi. V [SCOPE.sCountry('relevant_country_scope').GetCapital.GetCityHubName] byla zapálena pochodeň, jasná pro všechny, kdo hledají světlo socialismu, kdekoliv se nacházejí.\nPochodeň, kterou síly reakce nebudou šetřit, aby uhasily.\nPochodeň, kterou my, jako přátelé a členové dělnické třídy, musíme štítit všemi prostředky.\"" # todo: NEW TRANSLATION
 lobby_events.25.a: "Zahraniční, přesto přítel. [ROOT.GetCountry.GetAdjective] dělník ti vzdává hold, soudruhu [SCOPE.sCountry('relevant_country_scope').GetRuler.GetLastName]" # todo: NEW TRANSLATION
 lobby_events.25.b: "Naši občané příliš ochotně polykají tento jed." # todo: NEW TRANSLATION
 lobby_events.26.t: "[SCOPE.sState('relevant_state_scope').GetCityHubName] je [ROOT.GetCountry.GetAdjectiveNoFormatting]!" # todo: NEW TRANSLATION
 lobby_events.26.d: "Vidíce vlastnictví [SCOPE.sCountry('relevant_country_scope').GetAdjective] [SCOPE.sState('relevant_state_scope').GetName] jako zločin proti [ROOT.GetCountry.GetAdjectiveNoFormatting] národu, [SCOPE.gsInterestGroup('relevant_ig_scope').GetName] vzalo váhu za [SCOPE.sPoliticalLobby('relevant_lobby_scope').GetName]." # todo: NEW TRANSLATION
 lobby_events.26.f: "\"Neexistuje větší oxymóron než [SCOPE.sCountry('relevant_country_scope').GetAdjectiveNoFormatting] [SCOPE.sState('relevant_state_scope').GetNameNoFormatting]. Žádný větší zločin než připoutání této velké země k jejím současným pánům.\nDokud železná pěst [SCOPE.sCountry('relevant_country_scope').GetCapital.GetCityHubName] spočívá na [SCOPE.sState('relevant_state_scope').GetStateRegion.GetCityHubName], žádný z jejích obyvatel nebude skutečně svobodný.\"" # todo: NEW TRANSLATION
 lobby_events.26.a: "Jejich vlastenectví je příkladem, který stojí za následování." # todo: NEW TRANSLATION
 lobby_events.26.b: "Neměli bychom ohrozit naše vztahy s [SCOPE.sCountry('relevant_country_scope').GetName]." # todo: NEW TRANSLATION
 lobby_events.27.t: "Rudé nebezpečí" # todo: NEW TRANSLATION
 lobby_events.27.d: "Obávajíce se domácích dopadů socialistického režimu v [SCOPE.sCountry('relevant_country_scope').GetName], [SCOPE.gsInterestGroup('relevant_ig_scope').GetName] se přiklonili k [SCOPE.sPoliticalLobby('relevant_lobby_scope').GetName]." # todo: NEW TRANSLATION
 lobby_events.27.f: "\"Zatímco muži z [SCOPE.sCountry('relevant_country_scope').GetCapital.GetCityHubName] mohou šeptat sladká slova o rovnosti a svobodě, skutečné důsledky jejich vlády jsou ničím jiným než hrozným despotismem. [ROOT.GetCountry.GetAdjectiveNoFormatting] občan by si měl poslechnout toto varování, aby ne následoval jejich příkladu a neřetězil se ve jménu svobody.\"" # todo: NEW TRANSLATION
 lobby_events.27.a: "V této věci je vláda zcela v souladu s [SCOPE.gsInterestGroup('relevant_ig_scope').GetCustom('IG_I_TT')]." # todo: NEW TRANSLATION # todo: NAME CASE
 lobby_events.27.b: "Politický realismus, ne ideologie, určují naše mezinárodní vztahy." # todo: NEW TRANSLATION
 lobby_events.28.t: "Základy tradice" # todo: NEW TRANSLATION
 lobby_events.28.d: "Nedávné zproštění viny v [SCOPE.sCountry('relevant_country_scope').GetName] prominentního spisovatele obviněného z rouhání a neslušnosti vyvolalo v [ROOT.GetCountry.GetName] široký rozruch. [SCOPE.gsInterestGroup('relevant_ig_scope').GetName] nyní obviňuje [SCOPE.sCountry('relevant_country_scope').GetAdjectiveNoFlag] soudní systém z toho, že neudržuje mravní a náboženský řád [SCOPE.sPop('relevant_religion').GetReligion.GetName]. " # todo: NEW TRANSLATION
 lobby_events.28.f: "\"Publikace tohoto skandálního, rouhačského a profánního pomluvy na naši víru, stejně jako její tichý souhlas v [SCOPE.sCountry('relevant_country_scope').GetAdjectiveNoFormatting] společnosti, jednou provždy odhalila pravou povahu toho bezbožného národa. Vyzývám všechny slušné občany víry, abyste činili vše, co je ve vašich silách, v boji proti jeho zhoubnému vlivu na svět [SCOPE.sPop('relevant_religion').GetReligion.GetNameNoFormatting], všemi dostupnými prostředky.\"" # todo: NEW TRANSLATION
 lobby_events.28.a: "S každým dnem se [SCOPE.sCountry('relevant_country_scope').GetAdjectiveNoFlag] stále více odklání od světla." # todo: NEW TRANSLATION
 lobby_events.28.b: "Vnitřní záležitosti [SCOPE.sCountry('relevant_country_scope').GetNameNoFlag] nejsou naší věcí." # todo: NEW TRANSLATION
 refused_to_condemn_blasphemy_modifier: "Odmítl odsoudit rouhání" # todo: NEW TRANSLATION
 lobby_events.29.t: "Despot z [SCOPE.sCountry('relevant_country_scope').GetCapital.GetCityHubName]" # todo: NEW TRANSLATION
 lobby_events.29.d: "Proti svévolné a neliberální vládě [SCOPE.sCountry('relevant_country_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('relevant_country_scope').GetName], [SCOPE.gsInterestGroup('relevant_ig_scope').GetName] se postavili a spojili se s [SCOPE.sPoliticalLobby('relevant_lobby_scope').GetName]." # todo: NEW TRANSLATION
 lobby_events.29.f: "\"Všem, kdo si cení svobody, [SCOPE.sCountry('relevant_country_scope').GetNameNoFormatting], pod botou toho zlověstného [SCOPE.sCountry('relevant_country_scope').GetRuler.GetPrimaryRoleTitle|l], vyčnívá jako příklad nejhorších excesů despotismu.\nV žádné zemi není nezlomné právo každé duše hledat svůj osud tak zmařeno jako v [SCOPE.sCountry('relevant_country_scope').GetNameNoFormatting], a v žádné zemi není větší hrozba pro naši vlastní svobodu než tam. [SCOPE.sCountry('relevant_country_scope').GetNameNoFormatting] musí padnout, neboť pokud ne, padneme my s ní.\"" # todo: NEW TRANSLATION
 lobby_events.29.a: "Pryč s tyrany. Pryč s [SCOPE.sCountry('relevant_country_scope').GetNameNoFormatting]!" # todo: NEW TRANSLATION
 lobby_events.29.b: "Někdy je k dobrému vládnutí zapotřebí pevná ruka." # todo: NEW TRANSLATION
 in_league_with_tyrants_modifier: "V dohodě s tyrany" # todo: NEW TRANSLATION
 lobby_events.30.t: "Akce a reakce" # todo: NEW TRANSLATION
 lobby_events.30.d: "Když se z [SCOPE.sCountry('relevant_country_scope').GetCapital.GetCityHubName] dostaly zprávy o dalším násilném potlačení [SCOPE.sCountry('relevant_country_scope').GetAdjective] dělnického hnutí, rozhněvaní členové [SCOPE.gsInterestGroup('relevant_ig_scope').GetCustom('IG_G_TT')] vyšli do ulic [ROOT.GetCountry.GetCapital.GetCityHubName], pochodujíc pod praporem [SCOPE.sPoliticalLobby('relevant_lobby_scope').GetName]." # todo: NEW TRANSLATION # todo: NAME CASE
 lobby_events.30.f: "V představivosti [ROOT.GetCountry.GetAdjectiveNoFormatting] dělnického hnutí se [SCOPE.sCountry('relevant_country_scope').GetNameNoFormatting] dlouho jevila jako bašta reakce, ale tentokrát to mělo jiný nádech. Možná, že výrostky policie byly obzvlášť kruté. Možná to byla jen poslední kapka.\n\nKaždopádně, když [ROOT.GetCountry.GetAdjectiveNoFormatting] dělníci rozvinuli své prapory a pochodovali směrem k čtvrti velvyslanectví, jejich výkřiky po svržení [SCOPE.sCountry('relevant_country_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('relevant_country_scope').GetRuler.GetFullNameNoFormatting] se ozývaly městem jako nikdy předtím." # todo: NEW TRANSLATION
