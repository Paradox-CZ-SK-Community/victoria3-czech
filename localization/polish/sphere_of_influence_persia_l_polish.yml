 je_conference_of_london_acceptance_timer_tt: "\n\nAutomaticky přijmeme výsledek konference za #variable [GetGlobalVariable('je_conference_of_london_acceptance_timer').GetValue]#! měsíců." # todo: NEW TRANSLATION
 treaty_of_london_events.1.t: "Belgická otázka" # todo: NEW TRANSLATION
 treaty_of_london_events.1.d: "Od odtržení [SCOPE.sCountry('belgium_scope').GetName] v roce 1830 selhávaly snahy [ROOT.GetCountry.GetAdjective] o znovusjednocení země. Unavení z následků současného nejistého příměří, mnozí nyní naléhají na [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle], aby se zavázal k definitivnímu vyjednanému řešení." # todo: NEW TRANSLATION
 treaty_of_london_events.1.f: "\"Revoluce z roku 1830 je a zůstane největší státní chybou tohoto století, ale naše pokusy získat tato území silou selhaly a naše vyhlídky se den za dnem zhoršují.\n\nMomentálně získáme víc z rozhodčího řízení než z použití síly. Pane, naléhavě vás prosím, pošlete misi do Bruselu co nejdříve.\"" # todo: NEW TRANSLATION
 treaty_of_london_events.1.a: "Souhlasím. Svolat konferenci a záležitost konečně vyřešit." # todo: NEW TRANSLATION
 treaty_of_london_events.1.b: "S rebely nevyjednáváme." # todo: NEW TRANSLATION
 treaty_of_london_explanation_tt: "Účastnící [Concept('concept_great_power', '$concept_great_powers$')|l] budou hlasovat o řešení, které musí ratifikovat $BEL$ a $NET$." # todo: NEW TRANSLATION
 treaty_of_london_events.2.t: "Haagská výzva ke konferenci" # todo: NEW TRANSLATION
 treaty_of_london_events.2.d: "Unavena nejistým příměřím mezi našimi dvěma zeměmi, [SCOPE.sCountry('netherlands_scope').GetAdjective] vláda nás oslovila s návrhem konference k vyřešení jejich územních a právních sporů." # todo: NEW TRANSLATION
 treaty_of_london_events.2.f: "\"Nyní Nizozemci žádají arbitráž? Bezpochyby mají oči upřené na belgické území. Ačkoliv jejich ambice jsou jasné, možná nemáme volbu. Odmítnutí kompromisu by mohlo poškodit naše postavení v Evropě způsobem, který se těžko napraví.\"" # todo: NEW TRANSLATION
 treaty_of_london_events.2.a: "Velmi dobře, souhlasíme s mediací velmocí." # todo: NEW TRANSLATION
 treaty_of_london_events.2.b: "Ani o píď nedáme zatraceným Nizozemcům!" # todo: NEW TRANSLATION
 treaty_of_london_events.3.t: "Londýn volá" # todo: NEW TRANSLATION
 treaty_of_london_events.3.d: "Nejisté vztahy mezi [SCOPE.sCountry('belgium_scope').GetAdjectiveNoFlag] a [SCOPE.sCountry('netherlands_scope').GetAdjectiveNoFlag] ohrožují evropskou stabilitu od roku 1830. Konference, která má tuto otázku definitivně vyřešit, byla svolána v Londýně a velmoci Evropy byly pozvány k arbitráži." # todo: NEW TRANSLATION
 treaty_of_london_events.3.f: "\"Už téměř deset let usilujeme o uvedení těchto dvou stran ke stolu a po téměř deset let jsme byli frustrováni. Nyní, ať už prozřetelnost nebo štěstí, je máme přesně tam, kde je chceme. Neztrácejme tuto příležitost, stabilita Evropy závisí na našem úspěchu.\"" # todo: NEW TRANSLATION
 treaty_of_london_events.3.a: "Urovnejme tuto záležitost jednou provždy." # todo: NEW TRANSLATION
 treaty_of_london_events.3.b: "Tento roztržka nás nezajímá." # todo: NEW TRANSLATION
 treaty_of_london_events.4.t: "Londýnská konference končí" # todo: NEW TRANSLATION
 treaty_of_london_events.4.d: "Konference skončila a [ROOT.GetCountry.GetCustom('treaty_of_london_coutcome')]" # todo: NEW TRANSLATION
 treaty_of_london_events.4.f: "#bold Evropské mocnosti zaručují mír a stabilitu#!\nNově ratifikovaná Londýnská smlouva je pilířem evropského míru; upevňuje neutralitu a nezávislost Belgie a otevírá novou kapitolu evropské diplomacie, která upřednostňuje mír a vzájemný respekt mezi národy. Zatímco nizozemská delegace... (pokračování na str. 3-6)" # todo: NEW TRANSLATION
 treaty_of_london_events.4.a: "Pro mír v naší době, hurá!" # todo: NEW TRANSLATION
 guarantors_of_peace_modifier: "Garant míru" # todo: NEW TRANSLATION
 treaty_of_london_events.5.t: "Neúspěch londýnské konference" # todo: NEW TRANSLATION
 treaty_of_london_events.5.d: "Jednání mezi [SCOPE.sCountry('belgium_scope').GetName] a [SCOPE.sCountry('netherlands_scope').GetName] se zcela rozpadla a zdá se, že diplomatické řešení belgické otázky opět uniklo Evropě." # todo: NEW TRANSLATION
 treaty_of_london_events.5.f: "Když delegace odcházely z Foreign Office na King Charles Street, přátelská atmosféra, kterou tak zoufale předstírali, nemohla oklamat ani vrátného — a už vůbec ne navzájem. Co to bude znamenat pro budoucí nizozemsko-belgické vztahy, zatím neřekli, ale věděli, že to nebude dobré." # todo: NEW TRANSLATION
 treaty_of_london_events.5.a: "Jaká ztráta času pro všechny." # todo: NEW TRANSLATION
 favour_belgium_loc: "rozhodl udělit Belgii všechny jejich územní nároky výměnou za převzetí nizozemských dluhů." # todo: NEW TRANSLATION
 favour_netherlands_loc: "rozhodl udělit Nizozemsku všechny jejich územní nároky výměnou za převzetí belgických dluhů." # todo: NEW TRANSLATION
 partition_compromise_loc: "rozhodl rozdělit sporná území mezi Nizozemsko a Belgii, rozděliv jak Lucembursko, tak Limburg." # todo: NEW TRANSLATION
 luxembourg_compromise_loc: "rozhodl rozdělit sporná území mezi Nizozemsko a Belgii, přičemž zachovat celistvost provincií Lucembursko a Limburg." # todo: NEW TRANSLATION
 not_yet_settled_loc: "ještě není uzavřeno." # todo: NEW TRANSLATION
 treaty_of_london_outcome_tt: "Území bude vyměněno mezi $BEL$ a $NET$ v souladu s jejich smluvními závazky." # todo: NEW TRANSLATION
