 spooky_halloween_events.1.t: "Noční nabídky" # todo: NEW TRANSLATION
 spooky_halloween_events.1.d: "V poledne přijel do [SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName] na kočáře vysoký, bledý muž, který se představil jako hrabě [SCOPE.sCharacter('dracula_scope').GetLastName] a nabídl své služby [SCOPE.GetRootScope.GetCountry.GetRuler.GetPrimaryRoleTitle], přičemž tvrdil, že pochází z Attilových Hunů a mocných vojvodů dávných časů." # todo: NEW TRANSLATION
 spooky_halloween_events.1.f: "Mužev stisk ruky byl studený a železný. Zadržujíc grimasy, vládní zástupce pozvedl oči, aby setkal hraběte. \"Připravili jsme pro vás místnost a jídlo, pane, zatímco čekáte na [SCOPE.GetRootScope.GetCountry.GetRuler.GetPrimaryRoleTitle]. Musíte být unaven z dlouhé cesty.\"\n\n\"To nebude potřeba,\" řekl hrabě s tenkým úsměvem. \"Právě jsem si pochutnal na pozdní večeři. Každopádně, dlouho jsem nevkročil do [SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName]. A tak mě velmi zajímá, co se změnilo.\"" # todo: NEW TRANSLATION
 spooky_halloween_events.1.a: "Takovým službám tak slavného pána se těžko odolává." # todo: NEW TRANSLATION
 spooky_halloween_events.1.b: "Samozřejmě, pane hrabě, soukromá audience bude zařízena ihned." # todo: NEW TRANSLATION
 spooky_halloween_events.1.c: "Zdvořile hraběte odmítněte a ukažte mu cestu k městským branám." # todo: NEW TRANSLATION
 dracula_coup_tt: "Jako v transu, [SCOPE.GetRootScope.GetCountry.GetRuler.GetPrimaryRoleTitle] [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] předává otěže moci hraběti." # todo: NEW TRANSLATION
 umbral_coup_modifier: "Stínový převrat" # todo: NEW TRANSLATION
 dracula_leaves_tt: "Beze slova hrabě nastoupí do kočáru." # todo: NEW TRANSLATION
 dracula_passive_tt: "Dracula si ponechává svou současnou ideologii" # todo: NEW TRANSLATION
 spooky_halloween_events.2.t: "Půlnoční návštěvník" # todo: NEW TRANSLATION
 spooky_halloween_events.2.d: "Tajemně doraziv ke sídlu [SCOPE.sCharacter('fair_maiden_scope').GetFullName], [SCOPE.sCharacter('dracula_scope').GetFullName] přešel kolem ochabujících stráží do dlouhých, tmavých chodeb vedoucích k jejímu pracovnému stolu, kde jediná lucerna stále svítila nad hromadami korespondence." # todo: NEW TRANSLATION
 spooky_halloween_events.2.f: "[SCOPE.sCharacter('fair_maiden_scope').GetFullNameNoFormatting] nepoznala muže, který stál u jejích dveří, ani nerozeznala slova, která z jeho úst vyšla, i když byla jasně v jejím jazyce. Představy formálních večeří a plesů se jí mihly myslí, dokud její mysl a pohled nebyly sevřeny cizáčkovýma očima.\n\nZářily tak strašlivým světlem, že se na ně nemohla dívat, ale ani se od nich nemohla odtrhnout. Když cizinec udělal krok vpřed a pomalu odhalil zuby, učinila poslední pokus odvrátit zrak, snažíc se vypustit slova, jakákoli slova ze svých úst." # todo: NEW TRANSLATION
 spooky_halloween_events.2.a: "A pak, mysl [SCOPE.sCharacter('fair_maiden_scope').GetFirstName] pohltí plíživá mlha." # todo: NEW TRANSLATION
 spooky_halloween_events.2.b: "Co... počkej. Kdo jsi a co tu děláš? Stráže!" # todo: NEW TRANSLATION
 spooky_halloween_events.2_tt: "Jakou škodu může udělat trochu šlofíka." # todo: NEW TRANSLATION
 feeling_drained_1: "Vysátý ze života" # todo: NEW TRANSLATION
 feeling_drained_2: "Vysátý ze života" # todo: NEW TRANSLATION
 feeling_invigorated: "Cítí se posílený" # todo: NEW TRANSLATION
 fair_maiden_fail: "Hrabě se vrhá na [SCOPE.sCharacter('fair_maiden_scope').GetFirstName] se vší zuřivostí a silou." # todo: NEW TRANSLATION
 fair_maiden_success: "Hrabě splyne s stíny a činí rychlý ústup." # todo: NEW TRANSLATION
 spooky_halloween_events.3.t: "Mistrovství starého a nového" # todo: NEW TRANSLATION
 spooky_halloween_events.3.d: "Zamýšlejíc se nad stále se měnícím světem kolem něj, [SCOPE.sCharacter('dracula_scope').GetFullName] uvažuje, zda se i on musí změnit s ním." # todo: NEW TRANSLATION
 spooky_halloween_events.3.f: "[SCOPE.sCharacter('dracula_scope').GetFullNameNoFormatting] listuje stránkami [SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName] [SCOPE.GetRootScope.GetCountry.GetCustom('generic_newspaper_type')], vstřebávaje informace jako houba krev. V titulcích dominovaly války, zvěrstva a vraždy, jak tomu bylo vždy. Bylo v tom jisté potěšení, pomyslel si, že některé věci mají v tomto světě stejně jednoduchá řešení jako v tom dávném.\n\nPřesto taková pozorování platila jen zčásti. Uprostřed známého chaosu byly znaky jiného světa — svět v pohybu, poháněný písty, elektrickým světlem a politickými otřesy. Přes svůj věk necítil [SCOPE.sCharacter('dracula_scope').GetLastNameNoFormatting] žádnou sentimentální bolest. Nechť menší stvoření pláčou nad starým světem, pomyslel si. Já zamýšlím formovat ten nový." # todo: NEW TRANSLATION
 spooky_halloween_events.3.a: "S kapitálem přichází moc." # todo: NEW TRANSLATION
 spooky_halloween_events.3.b: "Muži jsou jen děti a jako děti respektují pouze rákosku." # todo: NEW TRANSLATION
 spooky_halloween_events.3.c: "Proč se vzdávat pravých a osvědčených metod ve prospěch nevyzkoušených?" # todo: NEW TRANSLATION
 spooky_halloween_events.3.e: "Staré musí uvolnit místo novému." # todo: NEW TRANSLATION
