 je_conference_of_london: "Londýnská konference" # todo: NEW TRANSLATION
 je_conference_of_london_reason: "Velmoci poslaly své delegace do Londýna, aby rozhodly o řešení nevyřešených hranic mezi Nizozemskem a Belgií. \n\n#variable [GetGlobalVariable( 'je_conference_of_london_participants_var' ).GetValue]#! [Concept('concept_great_power', '$concept_great_powers$')|l] se účastní konference.\n#bold #tooltippable #tooltip:favour_belgium_button_desc $favour_belgium_button$#!#!#! je podpořen #variable [GetGlobalVariable( 'je_conference_of_london_proposal_1' ).GetValue]#! celkovým [concept_prestige]\n#bold #tooltippable #tooltip:favour_netherlands_button_desc $favour_netherlands_button$#!#!#! je podpořen #variable [GetGlobalVariable( 'je_conference_of_london_proposal_2' ).GetValue]#! celkovým [concept_prestige]\n#bold #tooltippable #tooltip:partition_compromise_button_desc $partition_compromise_button$#!#!#! je podpořen #variable [GetGlobalVariable( 'je_conference_of_london_proposal_3' ).GetValue]#! celkovým [concept_prestige]\n#bold #tooltippable #tooltip:luxembourg_compromise_button_desc $luxembourg_compromise_button$#!#!#! je podpořen #variable [GetGlobalVariable( 'je_conference_of_london_proposal_4' ).GetValue]#! celkovým [concept_prestige]\n\nKonference skončí za #variable [GetGlobalVariable('je_conference_of_london_timer').GetValue]#! měsíců. Návrh s největší prestiží #tooltippable #tooltip:london_treaty_voting_rules podpoří#!#! bude poté vybrán jako oficiální řešení konference.\n\n#Bold Výsledek#!\nKonference má [ROOT.GetCountry.GetCustom('treaty_of_london_coutcome')][ROOT.GetCountry.GetCustom('treaty_of_london_acceptance_timer')]" # todo: NEW TRANSLATION
