 je_conference_of_london_tt_3: "Buď #v $BEL$#! nebo #v $NET$#! odmítl výsledek konference." # todo: NEW TRANSLATION
 je_conference_of_london_tt_5: "Mezi #v $BEL$#! a #v $NET$#! propukly nepřátelství." # todo: NEW TRANSLATION
 london_conference_made_choice_tt: "Nepodpořili jsme žádný návrh" # todo: NEW TRANSLATION
 london_treaty_voting_rules: "V případě, že dva vedoucí návrhy získají stejný počet [concept_prestige] podporujících je, bude vybrán návrh podporovaný [concept_great_power] s nejvyšším [concept_rank].\n\nPokud jste do konce konference oficiálně nepodpořili žádné řešení, vaši delegáti budou jednat nezávisle a vyberou jedno sami." # todo: NEW TRANSLATION
 favour_belgium_button: "Podpořit belgické nároky" # todo: NEW TRANSLATION
 favour_belgium_button_desc: "#v $BEL$#! obdrží provincie Limburg a Lucembursko celé.\n\nAby #v $NET$#! byl kompenzován za ztrátu těchto dvou provincií, #v $BEL$#! musí převzít celkový veřejný [Concept('concept_credit','$concept_credit_debt$')|l] bývalého #tooltippable #tooltip:london_treaty_public_debt_info #bold Spojeného království Nizozemska#!#!#!." # todo: NEW TRANSLATION
 favour_netherlands_button: "Podpořit nizozemské nároky" # todo: NEW TRANSLATION
 favour_netherlands_button_desc: "#v $NET$#! obdrží provincie Limburg a Lucembursko celé.\n\nAby #v $BEL$#! byl kompenzován za ztrátu těchto dvou provincií, #v $NET$#! musí převzít celkový veřejný [Concept('concept_credit','$concept_credit_debt$')|l] bývalého #tooltippable #tooltip:london_treaty_public_debt_info #bold Spojeného království Nizozemska#!#!#!." # todo: NEW TRANSLATION
