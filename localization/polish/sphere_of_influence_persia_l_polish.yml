 je_earn_recognition_reason: "Stav #bold Progress Bar#! se bude #tooltippable;tooltip:[Country.GetTooltipTag],je_earn_recognition_advance posouvat vpřed#! nebo #tooltippable;tooltip:[Country.GetTooltipTag],je_earn_recognition_deplete couvat#! na základě určitých podmínek. Dosáhne-li #bold Progress Bar#! #bold 200#!, znamená to, že [SCOPE.GetRootScope.GetCountry.GetName] se stane [concept_recognized_power].\n\nPříliš dlouho byla [SCOPE.GetRootScope.GetCountry.GetNameNoFormatting] odepřena patřičná diplomatická uznání takzvanými civilizovanými národy světa, což nás nechává zranitelnými vůči jejich zásahům a bez možnosti plně vykonávat svá suverénní práva.\n\nMěli bychom udělat vše, co je v našich silách, abychom tuto situaci napravili a získali pro sebe místo u jejich stolu jako respektovaní rovní." # todo: NEW TRANSLATION
