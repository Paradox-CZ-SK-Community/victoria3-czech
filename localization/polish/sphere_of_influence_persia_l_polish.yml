 notification_persian_assistance_request_accepted_desc: "[SCOPE.sCountry('relevant_country').GetName] přijal naši žádost o vojenskou misi." # todo: NEW TRANSLATION
 notification_persian_assistance_request_accepted_tooltip: "#header $notification_persian_assistance_request_accepted_name$#!\n$TOOLTIP_DELIMITER$\n$notification_persian_assistance_request_accepted_desc$" # todo: NEW TRANSLATION
 notification_persian_assistance_request_rejected_name: "[SCOPE.sCountry('relevant_country').GetName] odmítá žádost o podporu" # todo: NEW TRANSLATION
 notification_persian_assistance_request_rejected_desc: "[SCOPE.sCountry('relevant_country').GetName] nám poslal obecnou odpověď na naši žádost o vojenskou misi, v níž uvádí, že v tuto chvíli nemůže poskytnout pomoc." # todo: NEW TRANSLATION
 notification_persian_assistance_request_rejected_tooltip: "#header $notification_persian_assistance_request_rejected_name$#!\n$TOOLTIP_DELIMITER$\n$notification_persian_assistance_request_rejected_desc$" # todo: NEW TRANSLATION
 herat_war: "Válka o Herát" # todo: NEW TRANSLATION
 je_secure_influence_over_persia: "Zajistit vliv nad Persií" # todo: NEW TRANSLATION
 je_secure_influence_over_persia_reason: "Bohatá na bohatství a zdroje, Persie slouží také jako odrazový můstek pro armády mířící do indických a středoasijských srdcí. Každá velká moc, která má zájmy v těchto regionech, by měla být moudrá a zajistit si tuto zemi pro sebe, a ještě moudřejší je ji odepřít svým protivníkům." # todo: NEW TRANSLATION
 persia_puppeted_tt: "#v $PER$#! je náš [concept_subject]" # todo: NEW TRANSLATION
 je_consolidate_persia: "Zpevnit Persii" # todo: NEW TRANSLATION
 je_consolidate_persia_reason: "Vládní kontrola perských provincií byla dlouho křehká, s autonomními šejkátmi a cizími mocnostmi držícími větší vliv než nominální guvernéři jmenovaní z [SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName].\n\nPokud chceme stát efektivně modernizovat, suverenita centrální vlády musí být vynucena." # todo: NEW TRANSLATION
 je_achieve_sovereignty: "Dosáhnout suverenity" # todo: NEW TRANSLATION
 je_achieve_sovereignty_reason: "Pokud nás široká mezinárodní komunita nebude považovat za sobě rovné, cizí vměšování do našich vnitřních záležitostí zůstane endemické.\n\nMěli bychom usilovat o získání místa u jejich stolu, aby náš národ neskončil jako Starý Chorasán." # todo: NEW TRANSLATION
 je_achieve_sovereignty_tt: "Jsme [concept_subject] po #bold 10#! po sobě jdoucích let. (Aktuálně #variable [ROOT.GetCountry.MakeScope.Var('achieve_sovereignty_var').GetValue]#!)" # todo: NEW TRANSLATION
 je_achieve_sovereignty_tt_2: "Udržením naší nezávislosti vůči evropské agresi se přiblížíme konci Velké hry ve svůj prospěch." # todo: NEW TRANSLATION
 je_achieve_sovereignty_tt_3: "[ROOT.GetCountry.GetName] je [concept_recognized_power]" # todo: NEW TRANSLATION
 request_recognition: "Požádat o vyslání velvyslanectví" # todo: NEW TRANSLATION
