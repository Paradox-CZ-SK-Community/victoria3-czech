 transoxiana_tt: "Požadované [Concept('concept_state_region','$concept_state_regions$')|l]:\n$STATE_FERGANA$\n$STATE_TAJIKISTAN$\n$STATE_UZBEKIA$" # todo: NEW TRANSLATION
 greater_khorasan_button: "Uplatnit nárok na Velký Chorasán" # todo: NEW TRANSLATION
 greater_khorasan_button_desc: "Zatímco nároky [SCOPE.GetRootScope.GetCountry.GetAdjective] na Velký Chorasán sahají po tisíciletí, v nedávných staletích byla naše kontrola nad oblastí volná až nominální. Východní tažení Nádra Šáha krátce obnovilo perskou nadvládu v Chorasánu, ale jeho úspěchy byly pomíjivé a nepřežily jeho vládu.\n\nCo Nádra Šáh započal, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] dokoná — velkým tažením, které navždy obnoví perskou vládu na východě. [SCOPE.sStateRegion('herat_scope').GetName], Perla Chorasánu a náš klíč na východ, poslouží jako opěrný bod tohoto velkého podniku." # todo: NEW TRANSLATION
 greater_khorasan_button_tt: "V závislosti na našich vzájemných [concept_relations] se [SCOPE.sCountry('britain_scope').GetName] může negativně zachovat vůči naší okupaci [SCOPE.sStateRegion('herat_scope').GetName]." # todo: NEW TRANSLATION
 persian_baluchistan_button: "Potlačit Turkmeny" # todo: NEW TRANSLATION
 persian_baluchistan_button_desc: "Na sever od nás vzdorovité [SCOPE.sCountry('turkmenia_scope').GetAdjectiveNoFlag] kmeny popírají naši autoritu nájezdy do našich zemí, rokují tisíce našich poddaných každý rok, které se prodávají na velkých trzích s otroky v Buchaře a Chivě — a přitom okupují oprávněná perská území. Zabijme dvě mouchy jednou ranou a přinutit tyto bandity k poslušnosti." # todo: NEW TRANSLATION
 je_conquest_of_central_asia_turkmen_button: "Potlačit Turkmeny" # todo: NEW TRANSLATION
 je_conquest_of_central_asia_turkmen_button_desc: "Na jihu od nás vzdorovité [SCOPE.sCountry('turkmenia_scope').GetAdjectiveNoFlag] kmeny popírají naši autoritu nájezdy do našich zemí, odmítají uznávat autoritu jakéhokoli úředníka, cara nebo chána a neplatí nikomu ani půltohalíře daní — zatímco okupují oprávněná ruská území. Zabijme dvě mouchy jednou ranou a přinutit tyto bandity k poslušnosti." # todo: NEW TRANSLATION
 modifier_turkmen_subjugation: "Pacifikační kampaně proti Turkmenům" # todo: NEW TRANSLATION
 modifier_turkmen_logistics: "Turanijská logistika" # todo: NEW TRANSLATION
 persia_russian_aid_button: "Požádat o vojenskou misi $RUS_ADJ$" # todo: NEW TRANSLATION
 persia_russian_aid_button_desc: "Požádejte vládu $RUS_ADJ$, aby vyslala vojenskou misi k modernizaci naší armády výměnou za určité diplomatické a exterritoriální ústupky.\n\nPrvní zaslaná mise založí #bold Perskou kozáckou brigádu#! jako #bold trvalou#! vojenskou instituci." # todo: NEW TRANSLATION
 if_they_accept_tt: "Pokud přijatí:" # todo: NEW TRANSLATION
 persia_russian_aid_button_cooldown_tt: "Rozhodnutí $persia_russian_aid_button$ nebylo použito v posledních #variable 10#! letech#!" # todo: NEW TRANSLATION
 persia_british_aid_button: "Požádat o vojenskou misi $GBR_ADJ$" # todo: NEW TRANSLATION
 persia_british_aid_button_desc: "Požádejte vládu $GBR_ADJ$, aby vyslala vojenskou misi k modernizaci naší armády výměnou za určité diplomatické a exterritoriální ústupky.\n\nPrvní zaslaná mise založí #bold Jižní perské střelce#! jako #bold trvalou#! vojenskou instituci." # todo: NEW TRANSLATION
 persia_british_aid_button_cooldown_tt: "Rozhodnutí $persia_british_aid_button$ nebylo použito v posledních #variable 10#! letech#!" # todo: NEW TRANSLATION
 persia_resettle_merv_button: "Obnovit [SCOPE.sStateRegion('merv_scope').GetName]" # todo: NEW TRANSLATION
 persia_resettle_merv_button_desc: "Kdysi považovaný za hlavní město východního islámského světa a mající populaci blízkou půl milionu, #bold Merv Veliký#! od té doby upadl. Po staletích úpadku byl koncem 18. století Merv definitivně srovnán se zemí šáhem Muradem z Buchary, který zlomil přehrady zásobující oázu a přestěhoval desítky tisíc jejích [SCOPE.sCulture('persian_culture').GetName] obyvatel do [SCOPE.sStateRegion('uzbekia_scope').GetName].\n\nNyní zůstávají pouze řídké trosky a kmeny [SCOPE.sCulture('turkmen_culture').GetName] zde pase dobytek v zdevastovaném těle starého města. Obnova nebude snadný úkol, ale obnovíme ho." # todo: NEW TRANSLATION
 persia_events.1.t: "Země vycházejícího slunce" # todo: NEW TRANSLATION
 persia_events.1.d: "S východními hranicemi [SCOPE.GetRootScope.GetCountry.GetName] plně obnovenými, [SCOPE.GetRootScope.GetCountry.GetRuler.GetPrimaryRoleTitle] [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] dohlédl na definitivní napravení velké historické křivdy." # todo: NEW TRANSLATION
 persia_events.1.f: "Od úrodných oáz Chorasemie, přes starobylá města Chorasánu, až po turanská srdce za Oxusem: perské starodávné východní provincie opět odpovídají svému právoplatnému pánu." # todo: NEW TRANSLATION
 persia_events.1.a: "Velké bohatství východu pohání náš pokrok." # todo: NEW TRANSLATION
 persia_events.1.b: "Ať tyto starobylé intelektuální centrály opět kvetou." # todo: NEW TRANSLATION
 persia_events.1.c: "Ya Ali! Západ se třese před lvím řevem." # todo: NEW TRANSLATION
 modifier_wealth_of_the_east: "Bohatství Východu" # todo: NEW TRANSLATION
 modifier_persianize_the_east: "Znalosti Východu" # todo: NEW TRANSLATION
 modifier_military_of_the_east: "Shiran-e Pars" # todo: NEW TRANSLATION
 darulfunun_modifier: "Dar ul-Funun" # todo: NEW TRANSLATION
 persia_events.2.t: "Perla Chorasánu" # todo: NEW TRANSLATION
 persia_events.2.d: "Navzdory tuhému afghánskému odporu a intrikám cizích mocností padlo nakonec velké město [SCOPE.sState('herat_scope').GetName] pod mocí [SCOPE.GetRootScope.GetCountry.GetAdjective]." # todo: NEW TRANSLATION
 persia_events.2.f: "#italic \"Považuj tento svět za oceán,\nA Chorasán jako ústřici v něm.\nA město Herát,\nPerlu v jeho středu.\"#!" # todo: NEW TRANSLATION
 persia_events.2.a: "Brány na Východ byly prolomeny. Pokračujme dál." # todo: NEW TRANSLATION
 modifier_herat_inspiration: "Mistři Chorasánu" # todo: NEW TRANSLATION
 persia_events.2.tt: "Tento [concept_modifier] se #bold vytratí#! pokud ztratíme kontrolu nad [SCOPE.sState('herat_scope').GetName]." # todo: NEW TRANSLATION
 persia_events.3.t: "Turanijská pohroma" # todo: NEW TRANSLATION
 persia_events.3.d: "Příliš dlouho byly kmeny [SCOPE.sCountry('turkmenia_scope').GetAdjectiveNoFlag] na severu nechávány pustošit naše země bez trestu. K nápravě této nespravedlnosti oznámil [SCOPE.GetRootScope.GetCountry.GetRuler.GetPrimaryRoleTitle] [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] zahájení rozsáhlé severní pacifikační kampaně." # todo: NEW TRANSLATION
 persia_events.3.f: "V bolestném rytmu táhnou řetězy své oběti přes Karakum; jeho velké ticho narušuje jen občasný posměch turkmenských dobyvatelů a jejich vlastní žalostné výkřiky; \n\n#italic \"Alaman nás vzali,\nChudé, chudé Qizilbashe!\nA nesou nás, a nesou nás,\nV železe a řetězech, v železe a řetězech\nDo Gurgenče a Bukhary.\"#!" # todo: NEW TRANSLATION
 persia_events.3.a: "Ukažme těmto nájezdníkům perskou ocel." # todo: NEW TRANSLATION
 persia_events.4.t: "Persie žádá vojenskou misi" # todo: NEW TRANSLATION
 persia_events.4.d: "Vláda [SCOPE.sCountry('persian_nation_scope').GetName] požádala, abychom vyslali vojenskou misi k modernizaci jejich armády výměnou za určité diplomatické a exterritoriální ústupky." # todo: NEW TRANSLATION
 persia_events.4.f: ""Deset děl, nějakých tisíc pušek, a také dost střeliva a nábojů pro pět let běžného používání?\n\"To je správně, pane.\"\n\"Vidím. A ta druhá kus zavazadel?\"\n\"Fif, buben a mosaz, pane. Hned je dáme pochodovat k [SCOPE.GetRootScope.GetCountry.GetCustom('marching_songs_custom_loc')] .\"""" # todo: NEW TRANSLATION
 persia_events.4.a: "To vyhovuje našim zájmům. Pošlete misi okamžitě." # todo: NEW TRANSLATION
 persia_events.4.b: "Zdvořile jejich žádost odmítněte." # todo: NEW TRANSLATION
 modifier_persian_cossack_brigade: "Perská kozácká brigáda" # todo: NEW TRANSLATION
 modifier_south_persia_rifles: "Jižní perské střelce" # todo: NEW TRANSLATION
 modifier_british_persian_aid: "Britská vojenská mise" # todo: NEW TRANSLATION
 modifier_russian_persian_aid: "Ruská vojenská mise" # todo: NEW TRANSLATION
 preobrazhensky_march_loc: "Preobraženský pochod" # todo: NEW TRANSLATION
 british_grenadiers_march_loc: "Britští granátníci" # todo: NEW TRANSLATION
 persia_events.5.t: "Otroci z [SCOPE.sState('persia_slave_liberate_state_scope').GetCityHubName]" # todo: NEW TRANSLATION
 persia_events.5.d: "S dobytím [SCOPE.sState('persia_slave_liberate_state_scope').GetName] jsme narazili na velké množství [SCOPE.sCulture('persian_culture').GetName] otroků. Jejich příbuzní volají po jejich svobodě, ale manumise pravděpodobně vyvolá hněv jejich nynějších turkických pánů." # todo: NEW TRANSLATION
 persia_events.5.f: "\"Agha, před lety, když jsem byl na misi, stál jsem na bukharském tržišti a sledoval prodej mladé perské dívky — ztracené v zármutku a vystavené nejhrubšímu násilí ze strany jejího pána.\n\nTehdy jsem byl bezmocný. Cizinec v jejich zemích, bez prostředků ji vykoupit. Srdce mi hořelo a já byl ničím. ‚Inshaallah‘ jsem přísahal, ‚přijde den.‘\"" # todo: NEW TRANSLATION
 persia_events.5.a: "Bismillah, osvoboďme každého nalezeného Persa." # todo: NEW TRANSLATION
 persia_events.5.b: "Osvoboďte je a umožněte jejich přesídlení." # todo: NEW TRANSLATION
 persia_events.5.c: "Nechte je na místě, nestojí to za potíže." # todo: NEW TRANSLATION
 persia_events.5.tt: "Pokud má [concept_state] [GetDecreeType('decree_emergency_relief').GetName] [concept_decree], náhodný stát s tímto dekretem bude určen jako cíl pro osvobozené [Concept('concept_pop','$concept_pops$')|l]. Pokud ne, přestěhují se do provincie, odkud byli zajati." # todo: NEW TRANSLATION
 modifier_slave_relocation_costs_persia: "Náklady na přesídlení" # todo: NEW TRANSLATION
 persia_events.6.t: "[SCOPE.sCountry('persia_scope').GetNameNoFormatting] obsazuje Herát" # todo: NEW TRANSLATION
 persia_events.6.d: "Strategicky položené město [SCOPE.sState('herat_scope').GetName], někteří v naší správě ho označili jako ‚Klíč k Indii‘, bylo zabráno jednotkami patřícími [SCOPE.sCountry('persia_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('persia_scope').GetRuler.GetFirstName] z [SCOPE.sCountry('persia_scope').GetName]." # todo: NEW TRANSLATION
 persia_events.6.f: "\"Je to názor můj, vašeho skromného služebníka, a ostatních zde přítomných pánů, že pokud by nepřátelská moc pokusila invazi do Indie ze západu, učinila by tak přes Persii a tedy přes Herát. Proto vás naléhavě žádáme, abyste zvážil možnost okamžitého perského stažení z města pod hrozbou ozbrojené odpovědi.\"" # todo: NEW TRANSLATION
 persia_events.6.a: "Vyhrožujme Peršanům válkou, pokud nevyklidí Herát." # todo: NEW TRANSLATION
 persia_events.6.b: "To město nestojí za kost jediného britského granátníka." # todo: NEW TRANSLATION
 persia_events.7.t: "Merv Veliký" # todo: NEW TRANSLATION
 persia_events.7.d: "Bazary [SCOPE.sState('merv_scope').GetName] znovu ožívají a nesou ozvěnu slavné minulosti města. S přítokem bohatství do oázy musí správa rozhodnout, jak ho nejlépe využít." # todo: NEW TRANSLATION
 persia_events.7.f: "#italic \"V té rozkošné provincii Slunce\nPrvní z perských zemí [SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe] na něm září\nKde všechny nejkrásnější děti [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] září\nKvětinky a ovoce, zčervenají nad každým potokem\nA, nejkrásnější ze všech potoků, Murga se potuluje\nMezi jasnými paláci a háji Merona.\"#!" # todo: NEW TRANSLATION
 persia_events.7.a: "Použít to k obnově velkých přehrad na řece Murghab." # todo: NEW TRANSLATION
 persia_events.7.b: "Mervovy paláce a zahrady budou znovu vystavěny, dvojnásobně vynikající." # todo: NEW TRANSLATION
 modifier_soltanbent_dam: "Soltan-Bent obnoven" # todo: NEW TRANSLATION
 modifier_merv_queen_of_the_world: "Mervi-Shah-Djihan" # todo: NEW TRANSLATION
 persia_events.8.t: "Británie požaduje stažení z Herátu" # todo: NEW TRANSLATION
 persia_events.8.d: "Emisár od [SCOPE.sCountry('britain_scope').GetName] nám oznámil, že pokud [SCOPE.GetRootScope.GetCountry.GetName] odmítne vyklidit [SCOPE.sState('herat_scope').GetName], bude to považovat za akt války." # todo: NEW TRANSLATION
 persia_events.8.f: "Delegát z Británie přečetl vládní požadavky shromážděné radě v zastřeném, avšak jasném perském jazyce. Persie má do tří měsíců ustoupit z Herátu. Dále má zříci se jakýchkoli nároků suverenity nad územím a městem Herát a již nikdy od svých náčelníků nežádat žádný znak podřízenosti jako razítko nebo tribut.\n\nZa emisárem courtiéři nervózně pobíhali. Netušili, jak odpoví [SCOPE.GetRootScope.GetCountry.GetRuler.GetPrimaryRoleTitle]. Ale věděli, že to pro něj bude znamenat potíže." # todo: NEW TRANSLATION
 persia_events.8.a: "Ať ti Farangi přijdou, když se odváží." # todo: NEW TRANSLATION
 persia_events.8.b: "Ustupme, nemůžeme si dovolit válku s [SCOPE.sCountry('britain_scope').GetAdjective]." # todo: NEW TRANSLATION
 bowed_to_britain_modifier: "Ustoupili jsme britským požadavkům" # todo: NEW TRANSLATION
