 london_treaty_public_debt_info: "Od belgického odtržení v roce 1830 od #bold Království Nizozemska#! čelily obě strany dlouhodobým problémům při dělení státního [Concept('concept_credit','$concept_credit_debt$')|l] bývalého sjednoceného království." # todo: NEW TRANSLATION
