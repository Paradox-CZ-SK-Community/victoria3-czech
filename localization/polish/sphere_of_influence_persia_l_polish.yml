 gg_afghanistan.7.t: "Muž, který by se stal králem" # todo: NEW TRANSLATION
 gg_afghanistan.7.d: "V dobře naloženém karavanu z [SCOPE.sCountry('the_man_who_would_be_king_origin_scope').GetName] dorazil cizí dobrodruh jménem [SCOPE.sCharacter('the_man_who_would_be_king_scope').GetFullName]. Přinesl dary střelných zbraní a látek a touží se ustavit jako [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetNameNoFlag], slibujíc bohatství a moc každému, kdo by ho následoval." # todo: NEW TRANSLATION
 gg_afghanistan.7.f: "\"Příteli, v tomto světě a věku, kdo chce být mužem, musí být pánem. Osud mi takový privilegium ve Západě neudělil, ale skrze Impérium si ho zde vybojím v hlubokých údolích Hindúkuše.\"" # todo: NEW TRANSLATION
