l_polish:
 je_eastern_frontier: "Východní hranice" # todo: NEW TRANSLATION
 je_eastern_frontier_reason: "Velké území na našem východě, ovládané kdysi rušnými městy jako [SCOPE.sStateRegion('merv_scope').GetName] a [SCOPE.sStateRegion('herat_scope').GetName], bylo součástí [SCOPE.GetRootScope.GetCountry.GetAdjective] Chorasánu již od dob Manochehra. Zatímco tato území nám byla odtržena plynutím času a nadvládou útlakových a mocných vládců, tak tomu již nesmí být.\n\nMusíme podniknout rozhodné kroky k opětovnému začlenění těchto odkloněných zemí, aby žádná cizí moc nemohla znovu vpadnout a podrobit je.\n\n#bold Turanijské zajetí#!\nGenerace turkmenských nájezdů na naše země si vyžádaly velké populace perských otroků pracujících v oázách jako [SCOPE.sStateRegion('uzbekia_scope').GetName] a [SCOPE.sStateRegion('khiva_scope').GetName]. Získáním těchto oblastí budeme moci osvobodit a #tooltippable #tooltip:je_eastern_frontier_tt_5 přesídlit#!#! enslavované perské komunity, pokud si to budeme přát." # todo: NEW TRANSLATION
 je_eastern_frontier_tt_1: "[GetGeographicRegion('geographic_region_greater_khorasan').GetName] patří [SCOPE.GetRootScope.GetCountry.GetName] nebo jejich poddaným." # todo: NEW TRANSLATION
 je_eastern_frontier_tt_2: "[GetGeographicRegion('geographic_region_chorasmia').GetName] patří [SCOPE.GetRootScope.GetCountry.GetName] nebo jejich poddaným." # todo: NEW TRANSLATION
 je_eastern_frontier_tt_3: "[GetGeographicRegion('geographic_region_transoxiana').GetName] patří [SCOPE.GetRootScope.GetCountry.GetName] nebo jejich poddaným." # todo: NEW TRANSLATION
 je_eastern_frontier_tt_4: "Dobytím jsme #bold obnovili#! [SCOPE.sStateRegion('merv_scope').GetName]." # todo: NEW TRANSLATION
 je_eastern_frontier_tt_5: "Použitím [GetDecreeType('decree_emergency_relief').GetName] [concept_decree] může být jakýkoli vlastněný [concept_state] označen jako cíl pro přesídlení." # todo: NEW TRANSLATION
 khorasan_tt: "Požadované [Concept('concept_state_region','$concept_state_regions$')|l]:\n$STATE_HERAT$\n$STATE_KABUL$\n$STATE_KANDAHAR$\n$STATE_BALKH$\n$STATE_CENTRAL_HIGHLANDS$\n$STATE_MERZ$\n$STATE_NORTHERN_BALUCHISTAN$" # todo: NEW TRANSLATION
