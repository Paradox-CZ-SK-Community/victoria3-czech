 partition_compromise_button_desc: "Provinicie Limburg a Lucembursko budou rozděleny mezi #v $BEL$#! a #v $NET$#!.\n\nAby byla Německá konfederace kompenzována za ztrátu západního Lucemburska, bude $LIM$ zřízen jako $NET_ADJ$ [concept_subject] a nominální člen Německé konfederace." # todo: NEW TRANSLATION
