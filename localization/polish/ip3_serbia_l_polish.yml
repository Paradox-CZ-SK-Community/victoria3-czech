 ottoman_monarchs.1.t: "Převrat Bâb-ı Âli" # todo: NEW TRANSLATION
 ottoman_monarchs.1.d: "Členové Bâb-ı Âli iniciují převrat proti [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName]. Pachatelé již informovali nového panovníka." # todo: NEW TRANSLATION
 ottoman_monarchs.1.f: "Časné ranní recitace [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstNameNoFormatting] byly náhle přerušeny zvukem cülûs děl. Očekával, co přijde dál, když eunuch vtrhl do pokoje s nešťastnou zprávou.\n\nPalác byl obklopen těmi, kteří včera salutovali jeho rozkazům, a připravila se loď pro cestu do ústraní. Oficíři už začínali stoupat po schodech, aby ho doprovodili." # todo: NEW TRANSLATION
 ottoman_monarchs.1.a: "Vallahi, to je dílo kâfirů..." # todo: NEW TRANSLATION
 ottoman_monarchs.1_tt: "Úspěšný převrat sesadil [ROOT.GetCountry.GetRuler.GetFullName] a ustanovil nového [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]." # todo: NEW TRANSLATION
 ottoman_monarchs.2.t: "Vláda šílenství" # todo: NEW TRANSLATION
 ottoman_monarchs.2.d: "Členové Bâb-ı Âli rozhodli, že musí nastoupit nový vládce kvůli nedostatku rozumu [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName]." # todo: NEW TRANSLATION
 ottoman_monarchs.2.f: "Po sériích veřejných hanebných činů byl [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] nalezen třesoucí se v posteli strachem a paranoiou.\n\nZpráva o údajné vraždě bývalého sultána Abdulazize po jeho sesazení zhoršila duševní stav [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstNameNoFormatting]. Pokusy skočit do palácového bazénu a prchnout od duchovních během ceremoniálu věrnosti nepochybně ukázaly, že jeho vláda bude krátká." # todo: NEW TRANSLATION
 ottoman_monarchs.2.a: "Zmizte ode mě!" # todo: NEW TRANSLATION
 ottoman_monarchs.2_tt: "[ROOT.GetCountry.GetRuler.GetFullName] podstupuje péči o duševní zdraví, zatímco [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] další v pořadí je připravován převzít vedení." # todo: NEW TRANSLATION
 balkan_wars.14.t: "Pověsti o Balkánské lize" # todo: NEW TRANSLATION
 balkan_wars.14.d: "Naši špióni zjistili, že několik národů, bývalí poddaní [SCOPE.sCountry('ottoman_empire_scope').GetAdjectiveNoFormatting], vytvořili alianci. Pokud by podpořili naši nezávislost, mohli bychom se připojit k jejich nadcházející válce." # todo: NEW TRANSLATION
 balkan_wars.14.f: "\"Ale strýčku, jsou to jiní lidé, chtějí svá území. Můžeme jim věřit?\"\n\n\"Nezajímá mě, odkud jsou. Nezajímá mě, čemu věří. Nezajímá mě, jaké údolí nárokují. Dokud nenávidí tyto [SCOPE.sCountry('ottoman_empire_scope').GetAdjectiveNoFormatting] tyrany alespoň tak jako my — dokud jejich válka může vést k naší svobodě — rád pro ně proliju krev.\"" # todo: NEW TRANSLATION
 balkan_wars.14.a: "Zaslouží si naši podporu" # todo: NEW TRANSLATION
 balkan_wars.14.b: "Naše místo je s $dyn_c_ottoman_empire$" # todo: NEW TRANSLATION
