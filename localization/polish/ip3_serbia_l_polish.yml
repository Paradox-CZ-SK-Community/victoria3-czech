 support_for_balkan_league: "z členství v lize" # todo: NEW TRANSLATION
 balkan_war: "Balkánská válka" # todo: NEW TRANSLATION
 dp_balkan_war: "Balkánská válka" # todo: NEW TRANSLATION
 the_cataclysm_partitioning: "Balkánská území budou rozděleny mezi národy a mohou vzniknout nové." # todo: NEW TRANSLATION
