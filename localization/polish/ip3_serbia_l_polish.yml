 je_the_balkan_league_complete_header_tt: "The [GetStrategicRegion('region_balkans').GetName] [Concept('concept_state', '$concept_states$')|l] will be partitioned once #v $dyn_c_ottoman_empire$#! is completely eradicated from the region, and they currently own:" # todo: NEW TRANSLATION
