 je_spoils_of_war: "Válečná kořist" # todo: NEW TRANSLATION
 je_spoils_of_war_reason: "Jen pár dní po vyhlášení vítězství obrátili všichni zbývající členové Balkánské ligy svou pozornost k tomu, co tvrdí, že jsou nespravedlivě rozdělená území dobytá od Osmanů.\n\nVysocí důstojníci i politici, včetně našich, požadují nápravu, zatímco válka je stále ještě horká." # todo: NEW TRANSLATION
