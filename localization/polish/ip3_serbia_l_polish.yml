l_polish:
 je_serbian_throne: "Trůn z trní" # todo: NEW TRANSLATION
 je_serbian_throne_reason: "[ROOT.GetCountry.GetCustom('serbia_throne_of_thorns_house_loc')]\n\nIf [concept_dynastic_loyalty] reaches #v 0%#!, our [concept_ruler] and their dynasty will be overthrown and replaced by a member of the [ROOT.GetCountry.GetCustom('serbia_rival_dynasty')]." # todo: NEW TRANSLATION
 je_serbian_throne_invalidation_tt: "Žádná z postav z rodu [Concept('concept_house_of_obrenovic','$concept_house_of_obrenovic_short$')|l] nebo [Concept('concept_house_of_karadjordjevic','$concept_house_of_karadjordjevic_short$')|l] není naživu" # todo: NEW TRANSLATION
 je_serbian_throne_status_loc_karadordevic_dominance: "[Concept('concept_house_of_karadjordjevic','$concept_house_of_karadjordjevic_short$')] si získal širokou věrnost" # todo: NEW TRANSLATION
 je_serbian_throne_status_loc_karadordevic_leaning: "Lidé se přiklánějí k [Concept('concept_house_of_karadjordjevic','$concept_house_of_karadjordjevic_short$')|l]" # todo: NEW TRANSLATION
 je_serbian_throne_status_loc_neutral: "Lidé jsou rozděleni mezi [Concept('concept_house_of_obrenovic','$concept_house_of_obrenovic_short$')|l] a [Concept('concept_house_of_karadjordjevic','$concept_house_of_karadjordjevic_short$')|l]" # todo: NEW TRANSLATION
 je_serbian_throne_status_loc_obrenovic_leaning: "Lidé se přiklánějí k [Concept('concept_house_of_obrenovic','$concept_house_of_obrenovic_short$')|l]" # todo: NEW TRANSLATION
 je_serbian_throne_status_loc_obrenovic_dominance: "[Concept('concept_house_of_obrenovic','$concept_house_of_obrenovic_short$')] si získal širokou věrnost" # todo: NEW TRANSLATION
 je_serbian_throne_obrenovic_desc: "Dle našich informátorů se rod [concept_house_of_karadjordjevic], rodina jejíž zakladatel byl kdysi považován za hrdinu srbského lidu, spřádá spiknutí, aby sesadil [concept_house_of_obrenovic]. $concept_house_of_karadjordjevic_short$ osvobodil srbské provincie od tyranie zrádných janičářů a za svítání století rozžehnul světlo svobody.\n\nAvšak právě on utekl z bojiště, když byla situace zoufalá. Od té doby povstal $concept_house_of_obrenovic$, aby nesl prapor. Časem se spiklenci jistě pokusí podnítit lid, aby dosáhli svých zlomyslných cílů a svrhnuli $concept_house_of_obrenovic_short$." # todo: NEW TRANSLATION
 je_serbian_throne_karadjordjevic_desc: "Rod [concept_house_of_karadjordjevic] úspěšně svržel své rivály z [concept_house_of_obrenovic], čímž v očích národa napravil velkého Karađorđa. Opět je [ROOT.GetCountry.GetName] vládl dynastií, která stála v čele hrdinského Prvního povstání proti Turkům.\n\nNicméně spiklenci $concept_house_of_obrenovic_short$ obcházejí a usilují o obnovení své vlády a navrácení $SER$ do sféry $AUS_ADJ$. Pokud dynastie vykáže sebemenší známku slabosti, udeří a pokusí se poslat $concept_house_of_karadjordjevic_short$ do hanebného exilu." # todo: NEW TRANSLATION
 je_tot_slander_button: "Pomluvit rivalní dynastii" # todo: NEW TRANSLATION
 je_tot_slander_button_desc: "Máme moc obrazu — proč ji nevyužít pro vlastní prospěch?" # todo: NEW TRANSLATION
 je_tot_slander_button_custom_tt: "Zvyšuje [Concept('concept_dynastic_loyalty','$concept_dynastic_loyalty$')|l] na základě [concept_literacy] s #bold one#! z následujících výdajů:" # todo: NEW TRANSLATION
 je_tot_slander_button_cooldown_tt: "Has not used this decision in the past #bold four years#!." # todo: NEW TRANSLATION
 je_tot_campaign_button: "Zahájit kampaň" # todo: NEW TRANSLATION
 je_tot_campaign_button_desc: "Shromažďuje královský doprovod, aby zorganizoval celonárodní tour prosazováním [concept_authority] nebo utrácením [concept_money]. Cílem je navštívit všechny [Concept('concept_state','$concept_states$')|l], hovořit s obyčejnými lidmi a nabídnout jim hmatatelné projekty výměnou za jejich cennou [Concept('concept_dynastic_loyalty','$concept_dynastic_loyalty$')|l]. Zároveň to zvýší naši [concept_popularity] a očerní našeho rivala." # todo: NEW TRANSLATION
 je_tot_campaign_button_tt: "Začínají přípravy, a brzy budeme vyzváni, abychom nápad navždy opustili nebo zvolili #bold one#! z následujících výdajů až do konce kampaně:" # todo: NEW TRANSLATION
 je_tot_campaign_button_tt_2: "Zvolená úroveň výdajů určí efektivitu investic do navštívených [Concept('concept_state','$concept_states$')|l] a naši [concept_popularity] na mnoho let." # todo: NEW TRANSLATION
 je_serbian_throne_fail_header: "#title Svrhne vládnoucí dynastii, pokud:#!\n" # todo: NEW TRANSLATION
 je_serbian_throne_on_fail_header: "#title Pokud [concept_dynastic_loyalty] klesne na nulu:#!\n$EFFECT$" # todo: NEW TRANSLATION
 obrenovic_concept_short: "[Concept('concept_house_of_obrenovic','$concept_house_of_obrenovic_short$')]" # todo: NEW TRANSLATION
 karadjordjevic_concept_short: "[Concept('concept_house_of_karadjordjevic','$concept_house_of_karadjordjevic_short$')]" # todo: NEW TRANSLATION
 obrenovic_concept: "[concept_house_of_obrenovic]" # todo: NEW TRANSLATION
 karadjordjevic_concept: "[concept_house_of_karadjordjevic]" # todo: NEW TRANSLATION
 serbian_dethrone_progress_bar: "Věrnost" # todo: NEW TRANSLATION
 serbian_dethrone_progress_bar_desc: "[concept_dynastic_loyalty]: [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|v1%] ([JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1]/500)" # todo: NEW TRANSLATION
 serbia.1.t: "Trůn z trní" # todo: NEW TRANSLATION
 serbia.1.d: "Míra moci se přelévá mezi rody [SCOPE.sCharacter('rival_dynasty_contender_scope').GetLastName] a vládnoucím rodem [ROOT.GetCountry.GetRuler.GetLastName]. Věrnosti byly slibovány zde a tam bez většího přemýšlení. Kdo je právoplatným vládcem [ROOT.GetCountry.GetName]?" # todo: NEW TRANSLATION
 serbia.1.f: "\"Nesporně, můj [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle], naše podpora je vám. Jak jsme byli svázáni vaším posvátným projevem pod dubem pro revoluci, postavíme se opět na vaši stranu pro slávu Srbska.\"\n\nJako přitakávač, jaký byl, mu sebevědomí šlo snadno. [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] se divil, jak to dokáže. Jeho nespolehlivá povaha byla již delší dobu veřejnou informací — zdálo se, že je v místnosti jediný, kdo věřil ve vlastní důvěryhodnost." # todo: NEW TRANSLATION
 serbia.1.a: "Cena věrnosti se neustále mění." # todo: NEW TRANSLATION
 serbia.2.t: "Mihailovo nástupnictví" # todo: NEW TRANSLATION
 serbia.2.d: "Jako druhorozený revolucionáře byl [ROOT.GetCountry.GetRuler.GetFullName] korunován novým knížetem [ROOT.GetCountry.GetName]. Masy si myslí, že v něm je více než v jeho starším bratrovi." # todo: NEW TRANSLATION
 serbia.2.f: "\"...a náš boj přesahuje pozemské věci, neboť držíme v rukou božské právo vládnout a nebýt vládnuti.\" Nový kníže pohlédl, aby změřil reakce. \"Ponesu pochodeň těch před sebou, dokud hořící světlo mé duše neopustí tuto smrtelnou schránku.\"\n\n\"Čas a mé právo!\"" # todo: NEW TRANSLATION
 serbia.2.a: "Ať je jeho vláda nezapomenutelná." # todo: NEW TRANSLATION
 serbian_throne.1.t: "Církevní propaganda" # todo: NEW TRANSLATION
 serbian_throne.1.d: "[SCOPE.gsInterestGroup('serb_clerical_publicity_ig').GetName] nám nabídl pomoc v naší posvátné věci oslabit vliv [SCOPE.sCharacter('rival_dynasty_contender_scope').GetFullName] na lid. Potomci dezertérů nebudou mít ve [ROOT.GetCountry.GetName] hlas." # todo: NEW TRANSLATION
 serbian_throne.1.f: "V tiché kotlině vesnice Takovo vystoupili z shromáždění [ROOT.GetCountry.GetRuler.GetFullNameNoFormatting] a jeho lidé, když vyhlásili srbské povstání proti Osmanům.\n\nRok byl 1815. Ti, kteří se nazývali „hrdiny“, už uprchli hledat úkryt pod křídly svých zahraničních pánů. Jedním z nich byl Karađorđe, otec [SCOPE.sCharacter('rival_dynasty_contender_scope').GetFirstNameNoFormatting]." # todo: NEW TRANSLATION
 serbian_throne.1.a: "To by mělo stačit." # todo: NEW TRANSLATION
 serbian_throne.1.b: "V jednotě je síla." # todo: NEW TRANSLATION
 serbian_throne.1.c: "Filantropie je podstatou víry, že ano?" # todo: NEW TRANSLATION
 serbian_throne.2.t: "Pomlouvačné letáky" # todo: NEW TRANSLATION
 serbian_throne.2.d: "Byla nám nabídnuta možnost vyrábět letáky k očernění [ROOT.GetCountry.GetCustom('serbia_rival_dynasty')]." # todo: NEW TRANSLATION
 serbian_throne.2.f: "Mezi propagandou a pomluvou je tenká hranice. A jistě, ta první může být politikovo nejnebezpečnější zbraň. Ten ráno byl knížeti předložen vzor letáku od renomovaného umělce a kaligrafa.\n\nKdyž držel papír, všiml si, že pod řadou škodolibých 'faktů' nahoře byl patriarchát [ROOT.GetCountry.GetCustom('serbia_rival_dynasty')] na všech čtyřech, žvýkající stehýnko popsané jako 'srbský rolník' v místním jazyce, zatímco jej zesměšňoval a komandoval osmanský paša." # todo: NEW TRANSLATION
 serbian_throne.2.a: "Důmyslné." # todo: NEW TRANSLATION
 serbian_throne.2.b: "Zahajte výrobu, hned teď!" # todo: NEW TRANSLATION
 serbian_throne.3.t: "Odhalení pokrytců" # todo: NEW TRANSLATION
 serbian_throne.3.d: "Ukazuje se, že [SCOPE.sCharacter('serb_busted_ig_leader').GetFullName], vůdce [SCOPE.gsInterestGroup('serb_busted_ig').GetCustom('IG_G_TT')], tajně pracoval na přesvědčování ostatních politiků ve prospěch hanebné kampaně [SCOPE.sCharacter('rival_dynasty_contender_scope').GetLastName]." # todo: NEW TRANSLATION # todo: NAME CASE
 serbian_throne.3.f: "Hostiny slouží jako důležitá shromáždění, kde se odehrávají různé nevyslovené dynamiky. Často zahrnují vyjednávání, projevy vlivu, zvuky hltání nenažraných megalomanů a stále přítomnou soutěž o udržení prestiže mezi rovnými.\n\nOrientovat se v komplexitě jednotlivců, kteří předvádějí různé stránky své povahy, je náročné i odměňující zároveň." # todo: NEW TRANSLATION
 serbian_throne.3.a: "Nechte ho zmizet." # todo: NEW TRANSLATION
 serbian_throne.3.b: "Násilím jej přimět pracovat pro nás." # todo: NEW TRANSLATION
 serbian_throne.4.t: "Odpadlí hajduci" # todo: NEW TRANSLATION
 serbian_throne.4.d: "Neregulérní oddíly pod velením [SCOPE.sCharacter('rival_dynasty_contender_scope').GetFullName] obtěžují čtvrti [SCOPE.sReligion('sunni_pop_scope').GetName] a [SCOPE.sReligion('jewish_pop_scope').GetName]." # todo: NEW TRANSLATION
 serbian_throne.4.f: "\"Víš, jací jsou, můj [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]. Rádi přepadávali osmanské obchodní karavany a šlechtice, ale teď jim zůstali jen rolníci bez ochrany,\" rádce mávl poslem rychlým gestem a pokračoval: \"Karađorđe byl jedním z nich během let povstání, teď jeho syn snaží udržet otcovy přátele spokojené.\"" # todo: NEW TRANSLATION
 serbian_throne.4.a: "Nechte je být, nebo se obrátí na své vlastní kvůli kořisti." # todo: NEW TRANSLATION
 serbian_throne.4.b: "To takto pokračovat nemůže." # todo: NEW TRANSLATION
 serbian_throne.5.t: "Městští povstalci" # todo: NEW TRANSLATION
 serbian_throne.5.d: "Skupina povstalců v [SCOPE.sState('capital_state').GetName] požaduje, abychom abdikovali trůn ve prospěch [SCOPE.sCharacter('rival_dynasty_contender_scope').GetFullName]. Nepředstavují kritickou hrozbu, ale způsob, jak s nimi naložíme, pošle jasné poselství." # todo: NEW TRANSLATION
 serbian_throne.5.f: "Soucit je vlastnost, kterou musí mít každý pozoruhodný vůdce. Když povstal proti nechtěnému útlaku, kníže dobře zná význam vzít zpět to, co je skutečně vaše.\n\n\"Nic jiného než skupina mladých, důvěřivých uličníků jsou,\" zamumlal, nakoukl z okna. \"My jsme alespoň bojovali za budoucnost našeho národa, ne za jednoho muže.\"" # todo: NEW TRANSLATION
 serbian_throne.5.a: "Zajistěte, aby byli řádně umlčeni." # todo: NEW TRANSLATION
 serbian_throne.5.b: "Ozbrojte loajalisty a pošlete je jako ukázku síly." # todo: NEW TRANSLATION
 serbian_throne.5.c: "Není třeba krveprolití, každý má svou cenu." # todo: NEW TRANSLATION
 serbian_throne.6.t: "Výzva o pomoc" # todo: NEW TRANSLATION
 serbian_throne.6.d: "Skličující zprávy o maďarizaci v [SCOPE.sState('delvidek_scope').GetName] k nám nedávno dorazily. Některé srbské vesnice čekají na podporu od svých bratří přes řeku. Je to cenná příležitost posílit naši pozici proti [SCOPE.sCharacter('rival_dynasty_contender_scope').GetFullName]." # todo: NEW TRANSLATION
 serbian_throne.6.f: "Pomocník rozvázal provázek, který svazoval všechny obálky dohromady, a otevřel tu nejvrchnější, aby ji přečetl nahlas.\n\n\"Nejjasnějšímu veličenstvu, [ROOT.GetCountry.GetRuler.GetFirstNameNoFormatting] z rodu [ROOT.GetCountry.GetRuler.GetLastNameNoFormatting], [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]i všech ctihodných Srbů.\n\nProsíme, buďte tak laskav a přijměte tuto skromnou žádost jménem naší nehodné, ale věrné vesnice o vrácení přízně. Jak si možná vzpomínáte — i když možná ne — stáli jsme při vás během vašeho revolučního vítězství nad Osmany s tím, co jsme mohli poslat...\"" # todo: NEW TRANSLATION
 serbian_throne.6.a: "Pošlete jim pomoc, aby odolali." # todo: NEW TRANSLATION
 serbian_throne.6.b: "Pozvěte je do jejich skutečné vlasti a pomozte jim při obnově." # todo: NEW TRANSLATION
 serbian_throne.6.b_move_pops_tt: "10% of Serbians in [SCOPE.sState('delvidek_scope').GetName] will move to [SCOPE.sState('capital_state').GetName]." # todo: NEW TRANSLATION
 serbian_throne.9.t: "Zůstanou zde" # todo: NEW TRANSLATION
 serbian_throne.9.d: "Jeden po druhém zrádci [ROOT.GetCountry.GetCustom('serbia_rival_dynasty')] je zradili na cestě k hroznému osudu. Všichni viděli nepopiratelné: [ROOT.GetCountry.GetName] patří [ROOT.GetCountry.GetCustom('serbia_ruling_dynasty')]!" # todo: NEW TRANSLATION
 serbian_throne.9.f: "\"Takto se chováte ke svým zachráncům?\" ozýval se v hale panický a zoufalý hlas. \"Můj otec vedl tuto zemi k svobodě, zatímco vy všichni hromadili bohatství. Nikdy nepochopíte, co znamená nést krev hrdiny!\"\n\nVěrní psi očekávali rozsudek.\n\n\"Nikdy!\"" # todo: NEW TRANSLATION
 serbian_throne.9.a: "Podělíte se o osud svého otce." # todo: NEW TRANSLATION
 serbian_throne.9.b: "Nikdy nevkročíte na srbskou půdu." # todo: NEW TRANSLATION
 serbian_throne.9.c: "Milosrdenství je dar udělovaný jen pravým vůdcům." # todo: NEW TRANSLATION
 serbian_throne.10.t: "Zúčtování" # todo: NEW TRANSLATION
 serbian_throne.10.d: "Stejně jako jejich otec je vyvedl z propasti zkázy, [ROOT.GetCountry.GetCustom('serbia_rival_dynasty')] zvítězil nad tyranií [ROOT.GetCountry.GetCustom('serbia_ruling_dynasty_short')]. Trůn [ROOT.GetCountry.GetName] nyní patří jim." # todo: NEW TRANSLATION
 serbian_throne.10.f: "\"Druzi! Svaté matky! Nyní jsme svobodni z úchopu zahnízděných politiků, kteří nic nečiní pro blaho naší vlasti...\" vykřikl nový [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullNameNoFormatting].\n\nVzpomínajíce na otcovo hrdinské úsilí, dav pokračoval v jásotu, dychtiv vyslechnout konečný rozsudek.\n\n\"...a co říkáte na osud zrádců?\" kníže se krátce odmlčel, přesvědčen, že cokoli nyní pronese, bude bez výhrad splněno." # todo: NEW TRANSLATION
 serbian_throne.10.a: "„...pošleme je k Pánu?“" # todo: NEW TRANSLATION
 serbian_throne.10.b: "„...budeme je dál živeni?“" # todo: NEW TRANSLATION
 serbian_throne.10.c: "„...bude milosrdenství jejich konečným soudem?“" # todo: NEW TRANSLATION
 serbian_throne.11.t: "Žádný důvod bojovat" # todo: NEW TRANSLATION
 serbian_throne.11.d: "Hlavní aktéři nechvalně proslulého krveprolévání mezi rody $concept_house_of_obrenovic_short$ a $concept_house_of_karadjordjevic_short$ už nejsou vzájemnou hrozbou. Nastal čas pokračovat jako sjednocený národ bez malicherných sporů." # todo: NEW TRANSLATION
 serbian_throne.11.f: "\"Není rozumné rozdělovat říši kvůli pomíjivým rodinným neshodám. Proto je solidarita podstatou pokroku, neboť rozptýlení vždy svádí muže z přímé cesty.\n\nKdyž už, vnitřní spory obvykle způsobují utrpení těm, jejichž jedinou povinností je platit daně.\n\nPánové, máme národ k vybudování!\"" # todo: NEW TRANSLATION
 serbian_throne.11.a: "Ať žije Srbsko!" # todo: NEW TRANSLATION
 serbian_throne.12.t: "Plánování kampaně" # todo: NEW TRANSLATION
 serbian_throne.12.d: "Začaly přípravy celonárodní kampaně, která má zvýšit naši popularitu a znečinit jméno [ROOT.GetCountry.GetCustom('serbia_rival_dynasty')] v očích veřejnosti. Musíme rozhodnout o úrovni výdajů." # todo: NEW TRANSLATION
 serbian_throne.12.f: "\"...a ctihodný [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstNameNoFormatting posílá své laskavé pozdravy všem svým poddaným.\n\nNyní začneme vybírat dobrovolníky na průvod.\"\n\nSvalnatí mladí muži, následovaní přehnaně nadějnými městskými dívkami, se dychtili se shromáždit na stanoveném místě. Byla to neopakovatelná příležitost upoutat pozornost královské rodiny a možná uniknout tahání sena či ježdění na oslích po polích celý život." # todo: NEW TRANSLATION
 serbian_throne.12.a: "Jaký to má smysl, když platíme my?" # todo: NEW TRANSLATION
 serbian_throne.12.b: "Zaplaťte, co je nutné." # todo: NEW TRANSLATION
 serbian_throne.12.c: "Nešetřit náklady." # todo: NEW TRANSLATION
 serbian_throne.12.e: "Možná to nakonec není dobrá iniciativa." # todo: NEW TRANSLATION
 serbian_throne.12.e_tt: "The idea is shelved for next #v 5 years#!" # todo: NEW TRANSLATION
 serbian_throne.12.prep_choice_tt: "Probíhají přípravy" # todo: NEW TRANSLATION
 each_monarch_may_only_do_this_once_tt: "Each [concept_ruler] may only take this action #b once#! per term" # todo: NEW TRANSLATION
 ser_campaign_not_on_cooldown_tt: "Has #b not#! aborted a campaign within the last #v 5 years#!" # todo: NEW TRANSLATION
 serbian_throne.13.t: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]'s Accord" # todo: NEW TRANSLATION
 serbian_throne.13.d: "Naši organizátoři kampaně navrhli podpořit zájmovou skupinu, abychom získali více věrnosti." # todo: NEW TRANSLATION
 serbian_throne.13.f: "Jeden za druhým vstupovali zástupci určitých kruhů do dvora, aby hovořili o svých nedostatcích. Vždy to byli ti stejní. \n\nPeculiar okolnost, které si poradci [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] všimli během těchto setkání, byla hektická soutěž mezi skupinami. Rychle rozpoznali potenciál tuto soutěž využít k získání větší politické moci a byli si plně vědomi, že jde o transakci, nikoli o dar." # todo: NEW TRANSLATION
 serbian_throne.13.a: "Podpoříme [SCOPE.gsInterestGroup('campaign_ig_1').GetCustom('IG_A_TT')]." # todo: NEW TRANSLATION # todo: NAME CASE
 serbian_throne.13.b: "Přivedeme [SCOPE.gsInterestGroup('campaign_ig_2').GetCustom('IG_A_TT')] s sebou." # todo: NEW TRANSLATION # todo: NAME CASE
 serbian_throne.13.c: "Dlouhodobě nám prospěje podpora [SCOPE.gsInterestGroup('campaign_ig_3').GetCustom('IG_G_TT')]." # todo: NEW TRANSLATION # todo: NAME CASE
 serbian_throne.13.e: "Ta čest patří pouze nám." # todo: NEW TRANSLATION
 serbian_throne.13.accord_chosen_tt: "Kampaň brzy začne" # todo: NEW TRANSLATION
 serbian_throne.14.t: "Kampaň v [SCOPE.sState('campaign_state').GetName]" # todo: NEW TRANSLATION
 serbian_throne.14.d: "Dorazili jsme do [SCOPE.sState('campaign_state').GetName], abychom řešili potřeby obyčejných lidí a vykreslili jim jasnější budoucnost. Dychtivě čekají na naše sliby financované kampaní." # todo: NEW TRANSLATION
 serbian_throne.14.f: "Úředníci přednesli pečlivě připravené a naučené projevy, které v srdcích posluchačů vzbudily národní hrdost.\n\nJejich cílem bylo zapojit dav před krátkým závěrečným proslovem [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstNameNoFormatting] a ukončit akci darem komunitě, aby upevnili jeho postavení v srdcích lidí i na trůnu.\n\nStoupenci [SCOPE.sCharacter('rival_dynasty_contender_scope').GetLastNameNoFormatting] nebudou s tímto spokojeni." # todo: NEW TRANSLATION
 serbian_throne.14.a: "Blaho všech nade vše!" # todo: NEW TRANSLATION
 serbian_throne.14.b: "[SCOPE.sState('campaign_state').GetName] si zaslouží lepší základy." # todo: NEW TRANSLATION
 serbian_throne.14.c: "Všichni by měli číst zrádné činy Karađorđa!" # todo: NEW TRANSLATION
 serbian_throne.14.e: "Společně jsme silnější!" # todo: NEW TRANSLATION
 serbian_throne.14_next_state_tt: "Přejdeme do dalšího státu." # todo: NEW TRANSLATION
 serbian_throne.14_campaign_ends_tt: "Kampaň jsme ukončili návštěvou všech dostupných států." # todo: NEW TRANSLATION
 serbian_throne.15.t: "Zpět do paláce" # todo: NEW TRANSLATION
 serbian_throne.15.d: "Po vyčerpávající kampani nás královský doprovod přivedl zpět do paláce. Můžeme pokračovat v běžných záležitostech." # todo: NEW TRANSLATION
 serbian_throne.15.f: "Skřípění kol vozu na kamenné cestě mírně utlumilo hukot jásotu lidí, když se jejich nejvyšší [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] vrátil domů.\n\nDovolil si zavřít oči a zasnít se o tom, že si na chvíli poleží v posteli. Brzy se to však proměnilo v noční můru, připomínající mu hady pod ní, pracující pro [SCOPE.sCharacter('rival_dynasty_contender_scope').GetLastNameNoFormatting]." # todo: NEW TRANSLATION
 serbian_throne.15.a: "Určitě si vzpomněli, kdo je jejich pravý [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]." # todo: NEW TRANSLATION
