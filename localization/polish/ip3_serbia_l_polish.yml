 je_the_balkan_league_research_mil_tech_start_button: "Věnovat vojenský výzkum" # todo: NEW TRANSLATION
 je_the_balkan_league_research_mil_tech_start_button_desc: "Dohnat standardy mocného nepřítele je zásadní. Získání technologií od ostatních velmocí urychlí náš postup modernizace armády. Budou obzvlášť vstřícné, pokud $dyn_c_ottoman_empire$ má technologie, které jsme dosud nezískali." # todo: NEW TRANSLATION
