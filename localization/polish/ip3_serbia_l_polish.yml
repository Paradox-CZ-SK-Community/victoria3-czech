 je_the_balkan_league_start_war: "Vyhlásit válku" # todo: NEW TRANSLATION
 je_the_balkan_league_start_war_desc: "Spustí #b special#! [concept_diplomatic_play] proti Vysoké Portě. Všichni členové #bold Balkan League#! se připojí na naši stranu. V tuto chvíli má [SCOPE.sCountry('ottoman_empire_scope').GetName] a jejich spojenci [concept_army_power_projection] #variable [ROOT.GetCountry.MakeScope.ScriptValue('ottoman_power_projection')|D] #!, zatímco #bold Balkan League#! a jejich spojenci dohromady #variable [ROOT.GetCountry.MakeScope.ScriptValue('balkan_league_power_projection')|D]#!.\n\nPokud vyhrajeme proti [SCOPE.sCountry('ottoman_empire_scope').GetName] pomocí #v Balkan War#! [concept_diplomatic_play], ztratí vlastnictví všech vlastněných [Concept('concept_state', '$concept_states$')|l] v [SCOPE.sStrategicRegion('balkans_scope').GetName]. Vyhrát tuto [concept_war] bez zásahu [concept_great_power] na naší straně nám udělí dodatečnou odměnu." # todo: NEW TRANSLATION
 balkan_league_members_start_the_war_header_tt: "Následující členové #bold Balkan League#! se připojí k našemu [concept_diplomatic_play]:" # todo: NEW TRANSLATION
 balkan_league_members_start_the_war_tt: "[THIS.GetCountry.GetName]" # todo: NEW TRANSLATION
 balkan_war_pp_comparison: "Kombinované [concept_army_power_projection] #bold Balkan League#! a jejich spojenců (#variable [ROOT.GetCountry.MakeScope.ScriptValue('balkan_league_power_projection')|D]#!) je alespoň polovina toho, co mají [SCOPE.sCountry('ottoman_empire_scope').GetName] a jejich spojenci (#variable [ROOT.GetCountry.MakeScope.ScriptValue('ottoman_power_projection')|D]#!)" # todo: NEW TRANSLATION
 balkan_wars.1.t: "Balkánská liga" # todo: NEW TRANSLATION
 balkan_wars.1.d: "Byla nám nabídnuta možnost stát se členem aliance [SCOPE.sStrategicRegion('balkans_scope').GetName] proti [SCOPE.sCountry('ottoman_empire_scope').GetName]. Jednotná armáda s jediným cílem může být jediným prostředkem, jak je jednou provždy vyhnat z regionu." # todo: NEW TRANSLATION
 balkan_wars.1.f: "\"Pánové! Příležitost je nablízku. Toto může být naše jediná šance splatit veliký dluh našim předkům. Ať toto bratrstvo stojí jedno po staletí, až přijde den našeho společného triumfu.\"\n\nKomitét vstál a zatleskal. Bylo to, jako by vítězství už bylo dosaženo, navzdory veverkám v místnosti." # todo: NEW TRANSLATION
 balkan_wars.1.a: "[ROOT.GetCountry.GetNameNoFormatting] odpoví na volání." # todo: NEW TRANSLATION
 balkan_wars.1.a_opener_tt: "Následující země založily #bold Balkan League#!:" # todo: NEW TRANSLATION
 balkan_wars.1.a_league_members_list_tt: "[THIS.GetCountry.GetName]" # todo: NEW TRANSLATION
 balkan_wars.1.b: "To není řešení." # todo: NEW TRANSLATION
 balkan_wars.1.b_tt: "Nebudeme součástí #bold Balkan League#!." # todo: NEW TRANSLATION
 balkan_wars.2.t: "Konec éry" # todo: NEW TRANSLATION
 balkan_wars.2.d: "Je hotovo. [SCOPE.sCountry('ottoman_empire_scope').GetName] byl konečně vyhnán z [SCOPE.sStrategicRegion('balkans_scope').GetName], jeho bývalá území nyní patří svým právoplatným vlastníkůům. Balkánská liga se ukázala být úspěšným projektem." # todo: NEW TRANSLATION
 balkan_wars.2.f: "\"Matko! Matko! Zvon zvoní. Nechť nejsme pozdní!\"\n\nMalý chlapec, oblečený v nově ušitých místních krojích, prožíval nejvzrušující den svého života. Průvod, jenž se měl vydat do hlavního města, měl projít středem vesnice.\n\nBylo to už dlouho, co k nim dorazily zprávy o slávě, ale vzdát hold svým veteránským hrdinům byl pocit jako žádný jiný." # todo: NEW TRANSLATION
 balkan_wars.2.a: "Konečně, naše země nám patří!" # todo: NEW TRANSLATION
 balkan_wars.2.tt_1: "As we won the #v Balkan War#! [concept_diplomatic_play] without involving a [concept_great_power] we will get the following additional reward:" # todo: NEW TRANSLATION
 modifier_balkan_wars_won_alone: "Sláva hrdinům" # todo: NEW TRANSLATION
 balkan_wars.3.t: "Svoboda zrušena" # todo: NEW TRANSLATION
 balkan_wars.3.d: "Útlak nahradil naši touhu po slávě. Naše podrobení [ROOT.GetCountry.GetTopOverlord.GetName] nám ukončilo schopnost spočívat v jakékoli strategické koalici." # todo: NEW TRANSLATION
 balkan_wars.3.f: "Podle místních legend zde kdysi byl vrchní vůdce, který požádal svého rádce, aby ho naučil moudrosti na celý život.\n\n\"Řekni mi, starče. Co bys jedné věci poradil vládci s potenciálem být na vrcholu světa, a přesný opak?\"" # todo: NEW TRANSLATION
 balkan_wars.3.a: "„I toto pomine.“" # todo: NEW TRANSLATION
 balkan_wars.4.t: "Zlomená aliance" # todo: NEW TRANSLATION
 balkan_wars.4.d: "S pádem Balkánské ligy už neexistuje dostatečně silná síla, která by za věc stála. Veškerá naděje na znovuzískání našich území je ztracena." # todo: NEW TRANSLATION
 balkan_wars.4.f: "Život se vrátil k monotónnosti pro obyčejné lidi na Balkáně. Zdají se být podvedeni a zlomeni sliby vůdců bez předvídavosti a odbornosti.\n\nV světě plném imperialistických kolosů je aliance oddělená hranicemi v těchto drsných krajích spíše snem než skutečnou ambicí.\n\nBoj pokračuje, tmavší než dříve." # todo: NEW TRANSLATION
 balkan_wars.4.a: "Jednoho dne..." # todo: NEW TRANSLATION
 balkan_wars.4.a_tt: "The #bold Balkan League#! has been disbanded." # todo: NEW TRANSLATION
 balkan_wars.5.t: "Vyměnitelná loajalita" # todo: NEW TRANSLATION
 balkan_wars.5.d: "Dobrovolně jsme rezignovali z Balkánské ligy. Pokud chceme budovat pevnou budoucnost, ukazovat se Ostřejší vůči [SCOPE.sCountry('ottoman_empire_scope').GetName] musí být na posledním místě našich starostí." # todo: NEW TRANSLATION
 balkan_wars.5.f: "V ovzduší byla cítit vzpoura, když prohlášení pronesl osobně [ROOT.GetCountry.GetRuler.GetFullNameNoFormatting]. Šlo o to, že možná je moudřejší zůstat klidný a nečinit prudká rozhodnutí, abychom nezpůsobili větší katastrofy honbou za iluzorními ambicemi.\n\nPublikum bylo čím dál přesvědčenější, jak řeč gradovala." # todo: NEW TRANSLATION
 balkan_wars.5.a: "Nebudeme se na tom podílet." # todo: NEW TRANSLATION
 balkan_wars.5.b: "Když je nemůžeme porazit, musíme se k nim přidat." # todo: NEW TRANSLATION
 balkan_wars_5.b_protectorate_tt: "[ROOT.GetCountry.GetName] becomes a [Concept('concept_protectorate', '$concept_protectorate$')|l] of [SCOPE.sCountry('ottoman_empire_scope').GetName] " # todo: NEW TRANSLATION
 balkan_wars.6.t: "Neuskutečněné ambice" # todo: NEW TRANSLATION
 balkan_wars.6.d: "Nepodařilo se nám dosáhnout cíle vyhnat [SCOPE.sCountry('ottoman_empire_scope').GetName] z [SCOPE.sStrategicRegion('balkans_scope').GetName], ale udrželi jsme si nezávislost." # todo: NEW TRANSLATION
 balkan_wars.6.f: "Matky a manželky prolévaly slzy a lamentovaly nad hromadami mladých mrtvých mužů. Opuštěné vesnice odcházely za chamtivostí a krví ve jménu expanzionismu politiků. Zbyly jen památníky a hromadné hroby. Neživé symboly národní ostudy.\n\n\"Tvrdý ořech je zvláštní plod, neotlučen, rozbije ti zuby!\"\n\n—Petar II Petrović Njegoš, #italic Gorski vijenac#!" # todo: NEW TRANSLATION
 balkan_wars.6.a: "Přesto je budoucnost jasnější než minulost." # todo: NEW TRANSLATION
 balkan_wars.7.t: "Místní branci" # todo: NEW TRANSLATION
 balkan_wars.7.d: "Rozhodli jsme se sáhnout trochu hlouběji do pokladen. To nám umožní zvýšit odvod pro náš boj proti [SCOPE.sCountry('ottoman_empire_scope').GetName]." # todo: NEW TRANSLATION
 balkan_wars.7.f: "Už obdivoval stání vedle profesionálních strážců, mladík se zhluboka nadechl, než vstoupil do síně.\n\nHodiny fronty od brzkého rána, jen aby získal uniformu. Ta mu pravděpodobně nebude sedět, ale je to tradice prvního přidělení rekruta.\n\nObvykle tu potkáš svého prvního druha, než se staneš jen detailem mezi zástupy mužů." # todo: NEW TRANSLATION
 balkan_wars.7.a: "Neztraťme rozum." # todo: NEW TRANSLATION
 balkan_wars.7.b: "Ozbrojte, kdo je k dispozici." # todo: NEW TRANSLATION
 balkan_wars.8.t: "Student strategie" # todo: NEW TRANSLATION
 balkan_wars.8.d: "Náš generál, [SCOPE.sCharacter('scoped_general').GetFullName], byl vyslán do zahraničí, aby vyměnil znalosti a zkušenosti s kolegy v rámci financování našeho vojenského výzkumu." # todo: NEW TRANSLATION
 balkan_wars.8.f: "Chráněn doprovodem a na expresu, muž zodpovědný za velení si užíval krásné scenérie. Změna tempa od obvyklých formalit mu připomněla, co život znamená.\n\nNavzdory rozhoupanému stolu pokračoval v psaní perem. Stále čekala kupa zpráv ke zpracování." # todo: NEW TRANSLATION
 balkan_wars.8.a: "Bez trpělivosti není disciplíny." # todo: NEW TRANSLATION
 balkan_wars.8.b: "Měl by se více učit umění útoku." # todo: NEW TRANSLATION
 balkan_wars.8.c: "Každá bitva je vyhrána dříve, než je vedena." # todo: NEW TRANSLATION
 balkan_wars.9.t: "Uprostřed konfliktu" # todo: NEW TRANSLATION
 balkan_wars.9.d: "[SCOPE.gsInterestGroup('armed_forces_scope').GetName], za pomoci místních, vyhání [SCOPE.sCulture('turkish_pop_scope').GetName] lidi z jejich domovů v [SCOPE.sState('caught_root_state_scope').GetName]. Pokud to nezastavíme, snadno se to může změnit v krveprolití." # todo: NEW TRANSLATION
 balkan_wars.9.f: "Sousedi se aktivně hledají příležitosti, jak zaútočit na nechráněné Turky. Při absenci sil [SCOPE.sCountry('ottoman_empire_scope').GetRuler.GetPrimaryRoleTitle] zůstávají zranitelné komunity denně obtěžovány a čelí hostilitě.\n\nEskalace napětí vedla k znepokojivému zmizení několika členů rodin v některých vesnicích, zatímco úřady vykazují zjevnou lhostejnost. Někteří úředníci jsou dokonce předvídatelně komplicitní v těchto nájezdech." # todo: NEW TRANSLATION
 balkan_wars.9.a: "Vytvořit koridor." # todo: NEW TRANSLATION
 balkan_wars.9.a_move_pops_tt: "All [SCOPE.sCulture('turkish_pop_scope').GetName] [Concept('concept_pop', '$concept_pops$')|l] in [SCOPE.sState('caught_root_state_scope').GetName] will safely emigrate to [SCOPE.sState('caught_ottoman_state_scope').GetName]." # todo: NEW TRANSLATION
 balkan_wars.9.b: "Nechat vojáky a místní na pokoji." # todo: NEW TRANSLATION
 balkan_wars.9.b_move_pops_tt: "75% of the [SCOPE.sCulture('turkish_pop_scope').GetName] [Concept('concept_pop', '$concept_pops$')|l] in [SCOPE.sState('caught_root_state_scope').GetName] will escape to [SCOPE.sState('caught_ottoman_state_scope').GetName]." # todo: NEW TRANSLATION
 balkan_wars.9.b_kill_pops_tt: "25% of the [SCOPE.sCulture('turkish_pop_scope').GetName] [Concept('concept_pop', '$concept_pops$')|l] in [SCOPE.sState('caught_root_state_scope').GetName] will be killed." # todo: NEW TRANSLATION
 balkan_wars.9.c: "Povzbudit vojáky." # todo: NEW TRANSLATION
 balkan_wars.9.c_move_pops_tt: "Half of the [SCOPE.sCulture('turkish_pop_scope').GetName] [Concept('concept_pop', '$concept_pops$')|l] in [SCOPE.sState('caught_root_state_scope').GetName] will escape to [SCOPE.sState('cruelty_ottoman_state_scope').GetName]." # todo: NEW TRANSLATION
 balkan_wars.9.c_kill_pops_tt: "Half of the [SCOPE.sCulture('turkish_pop_scope').GetName] [Concept('concept_pop', '$concept_pops$')|l] in [SCOPE.sState('caught_root_state_scope').GetName] will be killed." # todo: NEW TRANSLATION
 balkan_wars.9.c_cruel_trait_tt: "This option is available because the ruler is #bold Cruel#!." # todo: NEW TRANSLATION
 balkan_wars.9.e: "Žili tu po staletí, to není správné." # todo: NEW TRANSLATION
 balkan_wars.9.e_kill_pops_tt: "5% of the [SCOPE.sCulture('turkish_pop_scope').GetName] [Concept('concept_pop', '$concept_pops$')|l] in [SCOPE.sState('caught_root_state_scope').GetName] will be killed." # todo: NEW TRANSLATION
 balkan_wars.10.t: "Nakládání s přebytkem" # todo: NEW TRANSLATION
 balkan_wars.10.d: "V [SCOPE.sState('barracks_state_scope').GetName] vznikl přebytek v letošních výdajích fondu a správci se ptají, kam jej nasměrovat." # todo: NEW TRANSLATION
 balkan_wars.10.f: "Uprostřed chaosu by bylo docela snadné udělat 'chybu' v účetních zprávách. Navzdory pokušení se to však nezdálo být případ. Je to jasný znak národního ambiciózního úsilí a ukázka pravého charakteru.\n\nLidé zapojení do pohybu kapitálu podstupují největší riziko proti sobě. Národy vznikají na bedrech jedinců, kteří se neodklání od přímé cesty pravdivosti." # todo: NEW TRANSLATION
 balkan_wars.10.a: "Přeměnit nevyužitou budovu na kasárna." # todo: NEW TRANSLATION
 balkan_wars.10.b: "Mělo by to jít těm, kdo činí rozhodnutí." # todo: NEW TRANSLATION
 balkan_wars.10.c: "Muži ve službě to potřebují nejvíce." # todo: NEW TRANSLATION
 balkan_wars.11.t: "Chaos na Balkáně" # todo: NEW TRANSLATION
 balkan_wars.11.d: "Aliance našich bývalých poddaných v [SCOPE.sStrategicRegion('balkans_scope').GetName], #bold Balkánská liga#!, oficiálně vyhlásila povstání proti nám. Když vyhrají nadcházející válku, ztratíme všechna naše území v regionu a vzniknou nové státy." # todo: NEW TRANSLATION
 balkan_wars.11.f: "Starý imám se obrátil a postavil se před věřící na schodech minbaru a začal přednášet khutbu.\n\n„Ó věřící!\n\nVězte, že tento den, jako v dnech našich předků, nám sultán přikazuje povstat k obraně naší víry, našich zemí a naší cti. Tato válka není pouhý konflikt mužů, je to zkouška od Všemohoucího, boj na cestě pravdy proti tyranii a útlaku!\"" # todo: NEW TRANSLATION
 balkan_wars.11.a: "Budou toho litovat." # todo: NEW TRANSLATION
 balkan_wars.11.a_opener_tt: "The following countries of the #bold Balkan League#! have started a diplomatic play against us:" # todo: NEW TRANSLATION
 balkan_wars.11.a_league_members_list_tt: "[THIS.GetCountry.GetName]" # todo: NEW TRANSLATION
 balkan_wars.12.t: "Začíná válka" # todo: NEW TRANSLATION
 balkan_wars.12.d: "Jménem všech členů Balkánské ligy oficiálně oznámil [SCOPE.sCountry('first_balkan_war_initiator').GetName] přípravy na válku za znovuzískání všech území [SCOPE.sCountry('ottoman_empire_scope').GetName] v [SCOPE.sStrategicRegion('balkans_scope').GetName]." # todo: NEW TRANSLATION
 balkan_wars.12.f: "Stráženi několika žoldnéři, vyhlášení domovník bylo přijato se smíšenými pocity mezi vesničany všech vrstev.\n\n\"Slyšte, děti [ROOT.GetCountry.GetNameNoFormatting]!\n\nNa výslovné rozkazy ctihodného [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullNameNoFormatting] se naše armáda připravuje na posvátnou kampaň proti společnému nepříteli. Nechť je známo všem; v následujících měsících budou vybíráni stateční muži našich zemí, možná aby naposledy bojovali za očistu toho, co bývalo našimi vesnicemi, městy, loukami a horami a za uplatnění našich práv...\"" # todo: NEW TRANSLATION
 balkan_wars.12.a: "Je čas." # todo: NEW TRANSLATION
 joined_balkan_war_tt: "[ROOT.GetCountry.GetName] joins the Balkan War as a member or ally of the #v Balkan League#!" # todo: NEW TRANSLATION
 balkan_wars.13.t: "Kataklyzma" # todo: NEW TRANSLATION
 balkan_wars.13.d: "Ztratili jsme všechna území v [SCOPE.sStrategicRegion('balkans_scope').GetName] po úspěšné kampani vedené [SCOPE.sCountry('first_balkan_war_initiator').GetName]. Jakmile splnila svůj účel, Balkánská liga zanikla a z jejích popela vyrostly nové národy." # todo: NEW TRANSLATION
 balkan_wars.13.f: "\"We had struck a slap across the face of truth,\nWe had stood defiant against the rule of conscience.\nWe had built a bridge over the flames of Hell,\nThe craven’s bridge—swept away by the flood.\n\nHey, Rıza! This spilled blood was ours...\nThe beloved, now a servant to foes, was ours...\nThe land of Rum!... That cherished homeland was ours—\nBut we deemed it unworthy, and another claimed it.\"\n\n—Rıza Tevfik, \"For Rumeli\"" # todo: NEW TRANSLATION
 balkan_wars.13.a: "Musíme se vzpamatovat." # todo: NEW TRANSLATION
 balkan_wars_traitor_mod: "Dezerter z Balkánské ligy" # todo: NEW TRANSLATION
 balkan_wars_victorious_balkan_league_mod: "Spojenec vítězné Balkánské ligy" # todo: NEW TRANSLATION
 balkan_wars_victorious_second_balkan_war_mod: "Válečná kořist" # todo: NEW TRANSLATION
