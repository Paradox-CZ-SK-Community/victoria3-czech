 je_the_balkan_league: "Balkánská liga" # todo: NEW TRANSLATION
 je_the_balkan_league_reason: "Nyní, když jsou balkánské národy osvobozeny z moci Vysoké Porty, panuje shoda o vytvoření aliance, která je jednou provždy odvrhne. Taková shoda však nebude trvat věčně a naše okno příležitosti je omezené. \n\nVšechny naše národy doufají, že [SCOPE.sStrategicRegion('balkans_scope').GetName] jednou bude patřit svým pravým obyvatelům!" # todo: NEW TRANSLATION
