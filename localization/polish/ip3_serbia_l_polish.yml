 je_the_grand_collapse: "İnhidam-ı Azîm" # todo: NEW TRANSLATION
 je_the_grand_collapse_reason: "S neklidem plížícím se žilami národa se naše dominie houpe na pokraji, a ukázka imperiální strategie jistě připomene všem našim poddaným moc její dřívější slávy.\n\nMusíme uplatnit smířlivou odbornost, abychom zajistili bezpečí našich hranic. Pokud takové zkoušky nezvrátí situaci, budou rozervány a zápal #r The Grand Collapse#! bude zapálen." # todo: NEW TRANSLATION
 je_the_grand_collapse_bribe_politicians_button: "Korumpovat významné osobnosti" # todo: NEW TRANSLATION
 je_the_grand_collapse_bribe_politicians_button_desc: "Budování silnějších vztahů s vůdci různých ideologických skupin by nám mohlo pomoci realizovat naše myšlenky efektivněji a snadněji." # todo: NEW TRANSLATION
 je_the_grand_collapse_issue_khutbah_button: "Vydat páteční khutbu" # todo: NEW TRANSLATION
 je_the_grand_collapse_issue_khutbah_button_desc: "Distribuuje tištěné kázání napsané ulemou do všech koutů země, aby je imámové četli místnímu obyvatelstvu. Text znovu zdůrazňuje sjednocení mezi našimi sunnitskými poddanými." # todo: NEW TRANSLATION
 je_the_grand_collapse_law_speed_start_button: "Prosadit menší tanzimaty" # todo: NEW TRANSLATION
 je_the_grand_collapse_law_speed_start_button_desc: "Vytlačit zbytek naší autoritativní moci na její hranice nepochybně urychlí realizaci politických cílů." # todo: NEW TRANSLATION
 je_the_grand_collapse_law_speed_stop_button: "Přestat prosazovat menší tanzimaty" # todo: NEW TRANSLATION
 je_the_grand_collapse_relation_speed_start_button: "Studovat archivy Sefâretnâme" # todo: NEW TRANSLATION
 je_the_grand_collapse_relation_speed_start_button_desc: "Staletí zaznamenaných cest na cizí dvory se práší. Tyto dokumenty ukazují minulé diplomatické úspěchy a mohou pomoci našim vyslancům přesvědčit současné poddané." # todo: NEW TRANSLATION
 je_the_grand_collapse_relation_Speed_stop_button: "Stop Studying Sefâretnâme Archives" # todo: NEW TRANSLATION
 the_grand_collapse.1.t: "Fetret" # todo: NEW TRANSLATION
 the_grand_collapse.1.d: "Velký pád začal. Politická neoddanost nebyla od dob Çelebi Mehmeda za prvního interregna nikdy tak rozšířená. Naše země se rozpadnou, pokud nebude obnoven pořádek." # todo: NEW TRANSLATION
 the_grand_collapse.1.f: "\"Estağfurullah, nikdy nepochopím užitek posměšků na [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstNameNoFormatting].\"\n\n\"Je to hra, Salihu. Vzrušuje čtenáře — jako tebe právě teď — a připravuje cestu k potěšení nových guvernérů v případě pádu. Vallahi, tito lidé lámou půst naší krví.\"\n\nVdechnutí vůně máty z jeho nargile rozzářilo žhavé uhlíky, zatímco Salih pohlédl ven a složil svůj mecmua.\n\n\"Pád čeho... koho?\"" # todo: NEW TRANSLATION
 the_grand_collapse.1.a: "Obrátíme to." # todo: NEW TRANSLATION
 the_grand_collapse.2.t: "Každý přístav v bouři" # todo: NEW TRANSLATION
 the_grand_collapse.2.d: "Náš subjekt [SCOPE.sCountry('marketless_country_scope').GetName] nabízí v těchto těžkých časech svou loajalitu výměnou za tribut." # todo: NEW TRANSLATION
 the_grand_collapse.2.f: "Diplomatické dokumenty předložené Hariciye Nezâreti vykazovaly zjevných arogantní nároků skrytých pod královským uznáním. Jako hyeny obkličující vážně zraněného lva se naši poddaní snaží okusit cokoli, co mohou, zatímco příležitost je nablízku.\n\nKdyž [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullNameNoFormatting] přelétl očima přes dokumenty, zavřel oči a zamumlal modlitbu, než učinil konečné rozhodnutí." # todo: NEW TRANSLATION
 the_grand_collapse.2.a: "Udělit jim ekonomickou nezávislost." # todo: NEW TRANSLATION
 the_grand_collapse_2.a_tt: "[SCOPE.sCountry('marketless_country_scope').GetName] gains access to its own [Concept('concept_market', '$concept_market$')|l]" # todo: NEW TRANSLATION
 the_grand_collapse.2.b: "Překreslit jejich hranice." # todo: NEW TRANSLATION
 the_grand_collapse.2.c: "Dejte jim více autonomie." # todo: NEW TRANSLATION
 the_grand_collapse_2.c_tt: "[SCOPE.sCountry('marketless_country_scope').GetName] gains access to its own [Concept('concept_market', '$concept_market$')|l]" # todo: NEW TRANSLATION
 the_grand_collapse.2.e: "Opportunisté si nezaslouží naši pozornost." # todo: NEW TRANSLATION
 the_grand_collapse.3.t: "Zoufalá opatření" # todo: NEW TRANSLATION
 the_grand_collapse.3.d: "Při hledání potenciálních lidových vůdců, které bychom přesvědčili na naši stranu, předložili operativci několik možností." # todo: NEW TRANSLATION
 the_grand_collapse.3.f: "Ziyâfet-i Hükûmet — neboli Vládní banket — je chvíle, kdy [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] ukáže svou velkolepost všem důležitým hostům.\n\nZruční služebníci, hudebníci a kuchaři ze všech koutů světa se snaží zanechat trvalý dojem ve jménu svého pána.\n\nJe to také nevynechatelná příležitost pro pozvané notabili, když se zapojují do nevyřčené války konvencí." # todo: NEW TRANSLATION
 the_grand_collapse.3.a: "Chval [SCOPE.sCharacter('lobbied_ig_leader_1').GetFullName], vůdce [SCOPE.gsInterestGroup('lobbied_ig_1').GetCustom('IG_G_TT')]." # todo: NEW TRANSLATION # todo: NAME CASE
 the_grand_collapse.3.b: "Oslovit [SCOPE.sCharacter('lobbied_ig_leader_2').GetFullName], vůdce [SCOPE.gsInterestGroup('lobbied_ig_2').GetCustom('IG_G_TT')]." # todo: NEW TRANSLATION # todo: NAME CASE
 the_grand_collapse.3.c: "Nalákat [SCOPE.sCharacter('lobbied_ig_leader_3').GetFullName], vůdce [SCOPE.gsInterestGroup('lobbied_ig_3').GetCustom('IG_G_TT')]." # todo: NEW TRANSLATION # todo: NAME CASE
 the_grand_collapse.4.t: "Vznešená Porta" # todo: NEW TRANSLATION
 the_grand_collapse.4.d: "Pořádek byl obnoven a nikdo nebude odporovat našemu právu vládnout, tak jak jsme činili po staletí. Velký pád byl odvrácen a sklízíme plody naší obratnosti." # todo: NEW TRANSLATION
 the_grand_collapse.4.f: "\"Ach, jak vzácný jsi, ó nadějo dni nevydaných—\nUvolňuješ svět od smutku a zoufalství.\n\nTvé je věk impéria; šíř svoji moc po zemi.\nAť Všemohoucí střeží tvůj osud před každou skrytou pastí.\n\nPouště, jež kdysi patřily tobě, jsou nyní v pazourech tyranie. Vzbuď se, ó zraněný lvě, z tohoto bezstarostného spánku!\"\n\n—Namık Kemal, \"Óda na svobodu\"" # todo: NEW TRANSLATION
 the_grand_collapse.4.a: "Sláva našemu praporu!" # todo: NEW TRANSLATION
 the_grand_collapse.4.b: "Neměli bychom se odchýlit z přímé cesty." # todo: NEW TRANSLATION
 the_grand_collapse.5.t: "Velký pád" # todo: NEW TRANSLATION
 the_grand_collapse.5.d: "Z každého kouta našeho národa vyvstal chaos. Snížení na naše pevninské jádro nyní znemožňuje zastavit spirálu revoluce všude kolem nás. Musíme pokračovat." # todo: NEW TRANSLATION
 the_grand_collapse.5.f: "\"Jak vše, smrt a rozklad jsou konečné konce, synu. Hřbitovy jsou plné lidí, kteří kdysi byli ambiciózní a živí pro pomíjivé věci, nyní jsou hlídáni strážcem.\n\nTakový je osud národů, jednou vystavěných těmi pod hlínou, zoufale vyzdobených živými. Strážce se k nim brzy přidá, protože nic netrvá věčně.\"\n\n\"Nic?\"\n\n\"Kromě Něho.\"" # todo: NEW TRANSLATION
 the_grand_collapse.5.a: "Bylo nám to uloženo, ať se stane." # todo: NEW TRANSLATION
