 balkan_wars_muster_conscripts_high_mod: "Naverbováno mnoho branců" # todo: NEW TRANSLATION
 balkan_wars_military_tech_boost_mod: "Věnovaný vojenský výzkum" # todo: NEW TRANSLATION
 balkan_wars_military_industry_overworked_mod: "Přetížený zbrojní průmysl" # todo: NEW TRANSLATION
 balkan_wars_surplus_armed_forces_boost_mod: "Odměněné ozbrojené síly" # todo: NEW TRANSLATION
