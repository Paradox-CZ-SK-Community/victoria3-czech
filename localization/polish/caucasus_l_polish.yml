l_polish:
 je_the_eastern_border: "Vládce Východu" # todo: NEW TRANSLATION
 je_the_eastern_border_reason: "Naše ambice stát se tichomořskou námořní velmocí a náš koloniální plán ve Střední Asii vyžadují, abychom vyřešili naše dlouhotrvající hraniční spory s [SCOPE.sCountry('china_scope').GetName] způsobem výhodným pro [ROOT.GetCountry.GetName]." # todo: NEW TRANSLATION
 je_the_eastern_border_treaty_of_beijing: "Uplatnit nároky na Primorye" # todo: NEW TRANSLATION
 je_the_eastern_border_treaty_of_beijing_desc: "Region #bold Primorye#! nabízí příležitost vybudovat přístav s teplou vodou u Tichého oceánu, čímž by se výrazně zvýšila naše schopnost projekce moci. Můžeme sjednat smlouvu, která zajistí toto území využitím čínské slabosti." # todo: NEW TRANSLATION
 obligation_for_outer_manchuria_tt: "Vyměníme naši povinnost za #bold Primorye#!." # todo: NEW TRANSLATION
 transfer_of_outer_manchuria_tt: "Budeme požadovat předání #bold Primorye#! pod ruskou vládu." # todo: NEW TRANSLATION
 china_explosion_point_2_tt: "Pokrok #b $je_warlord_china$#! [concept_journal_entry] je pod #v 3#! (aktuálně #variable [SCOPE.sCountry('china_scope').MakeScope.Var('china_warlord_explosion').GetValue]#!)" # todo: NEW TRANSLATION
 war_with_china_not_russia_tt: "Není ve válce s #bold Rusko#!, a vede [concept_war] proti jiné zemi než #bold Rusko#!" # todo: NEW TRANSLATION
 russo_chinese.1.t: "Pekingská smlouva" # todo: NEW TRANSLATION
 russo_chinese.1.d: "Díky našemu současnému vlivu nad [SCOPE.sCountry('china_scope').GetAdjective] vládou jsme navrhli smlouvu, která vymezí formální hranici v Mandžusku a formálně převede [SCOPE.sState('outer_manchuria_scope').GetName] na [ROOT.GetCountry.GetName]." # todo: NEW TRANSLATION
 russo_chinese.1.f: "Články této smlouvy vstoupí v platnost dnem, kdy budou vyměněny zástupci jednoho a druhého státu, a musí být naplňovány po všechny věky posvátně a neporušeně." # todo: NEW TRANSLATION
 russo_chinese.1.a: "Otevřít území pro větší osídlení." # todo: NEW TRANSLATION
 russo_chinese.1.b: "Rozšíření našich přístavů nesmí být zpožďováno." # todo: NEW TRANSLATION
 modifier_ruler_of_the_east: "Osídlení Mandžuska" # todo: NEW TRANSLATION
 modifier_ruler_of_the_east_navy: "Osídlení Mandžuska" # todo: NEW TRANSLATION
 je_the_eastern_border_russia_chuguchak_protocol: "Vydat Čugučacký protokol" # todo: NEW TRANSLATION
 je_the_eastern_border_russia_chuguchak_protocol_desc: "Získání dalších území ve Střední Asii je prioritou ruské vlády. S Čínou v chaosu existuje příležitost rozšířit se do sporných oblastí." # todo: NEW TRANSLATION
 obligation_for_central_asia_tt: "Vyměníme naši povinnost za území ve Střední Asii." # todo: NEW TRANSLATION
 russia_chuguchak_protocol_req_tt: "Státy #BOLD Semireche#! a #BOLD Akmolinsk#! jsou pod kontrolou Ruska nebo ruského vazala" # todo: NEW TRANSLATION
 transfer_of_central_asia_tt: "Budeme požadovat předání sporných #BOLD kazašských a kyrgyzských#! území pod ruskou nadvládu." # todo: NEW TRANSLATION
 russo_chinese.2.t: "Čugučacký protokol" # todo: NEW TRANSLATION
 russo_chinese.2.d: "Zahájili jsme jednání se zástupci [SCOPE.sCountry('china_scope').GetName], abychom vymezili hranici mezi našimi národy na západě. V regionu Střední Asie je mnoho příležitostí pro územní zisky." # todo: NEW TRANSLATION
 russo_chinese.2.f: "Naším úkolem je zajistit, aby země Kyrgyzů a Kazachů, ti věrní poddaní Ruska, byly sjednoceny pod státem, který je schopen poskytnout bezpečnost proti současnému stavu banditismu a drobných krádeží v regionu." # todo: NEW TRANSLATION
 russo_chinese.2.a: "[SCOPE.sState('tomsk_scope').GetName] a [SCOPE.sState('ili_scope').GetName] budou dostačující." # todo: NEW TRANSLATION
 russo_chinese.2.b: "Území [SCOPE.sState('kirghizia_scope').GetName] je rovněž nezbytným ziskem." # todo: NEW TRANSLATION
 russo_chinese.2.c: "Území [SCOPE.sCountry('kirgiz_scope').GetAdjective] bude učiněno celistvým pod naším protektorátem." # todo: NEW TRANSLATION
 russo_chinese.3.t: "Vládce Východu" # todo: NEW TRANSLATION
 russo_chinese.3.d: "Zajištěním [SCOPE.sState('vladivostok_scope').GetName] se sen o [ROOT.GetCountry.GetAdjective] námořní nadvládě v Tichém oceánu přiblížil realitě. Město [SCOPE.sState('vladivostok_scope').GetPortHubName] se stane naším novým hlavním přístavem na Východě." # todo: NEW TRANSLATION
 russo_chinese.3.f: ""Tento přístav lze považovat za nejlepší ze všech. Mnohé připomíná Olgu, ale jen menší, teplejší a příjemnější. Nicméně kolem jsou stejné duby a stejné malebné hory. V nížinách šumí řeky; na březích je mnoho pramenů. Naše stanoviště postavené nedávno, se svými bílými stany, působí dobře mezi duby, které ještě nebyly vykáceny a právě byly vyčištěny."\n\n— Sergej Maksimov" # todo: NEW TRANSLATION
 russo_chinese.3.a: "Přesunout sibiřské lodě co nejrychleji." # todo: NEW TRANSLATION
 russo_chinese.3.b: "Přístav Vladivostok bude nejkrásnějším v naší zemi." # todo: NEW TRANSLATION
 modifier_vladivostok_navy: "Vládce Východu" # todo: NEW TRANSLATION
 modifier_vladivostok_navy_country: "Projekce moci v Tichomoří" # todo: NEW TRANSLATION
 modifier_vladivostok_civilian: "Vládce Východu" # todo: NEW TRANSLATION
 je_caucasian_war: "Kavkazská válka" # todo: NEW TRANSLATION
 je_caucasian_war_reason: "Naše územní ambice v Kavkazských horách jsou zbržděny tvrdým místním odporem. Musíme zničit veškerý zbývající odpor, abychom zajistili jižní hranici a otevřeli území k osídlení.\n\nJakmile budou prozkoumány technologie #bold Rifling#! a #bold Logistics#!, bude možné #bold eskalovat válku#! a zahájit invazi plného rozsahu do povstaleckých států." # todo: NEW TRANSLATION
 caucasus_secured_tt: "V kavkazském regionu neexistuje žádný nezávislý #bold čerkeský#! nebo #bold severokavkazský#! národ." # todo: NEW TRANSLATION
 caucasus_lost_tt: "Celé oblasti států #bold Kuban#!, #bold North Caucasus#! a #bold Dagestan#! vypadly z kontroly [SCOPE.sCountry('russia_scope').GetAdjective]." # todo: NEW TRANSLATION
 je_caucasian_war_circassia: "Čest před životem" # todo: NEW TRANSLATION
 je_caucasian_war_circassia_reason: "Imperiální ambice [SCOPE.sCountry('russia_scope').GetName] vyžadují totální zničení našich domovů. Abychom odolali [SCOPE.sCountry('russia_scope').GetAdjective] náporu, musíme sjednotit kmeny [ROOT.GetCountry.GetName] a postavit se společně v boji." # todo: NEW TRANSLATION
 je_caucasian_war_imamate: "Gazavat" # todo: NEW TRANSLATION
 je_caucasian_war_imamate_reason: "Imperiální ambice [SCOPE.sCountry('russia_scope').GetName] vyžadují podrobení Kavkazu. Abychom čelili [SCOPE.sCountry('russia_scope').GetAdjective] ortodoxní invazi, musíme sjednotit národy [ROOT.GetCountry.GetName] a postavit se společně v posvátném boji." # todo: NEW TRANSLATION
 caucasus_war_attacker: "Kavkazská válka" # todo: NEW TRANSLATION
 caucasus_war_defender_circassia: "Čest před životem" # todo: NEW TRANSLATION
 caucasus_war_defender_imamate: "Odpor a úcta" # todo: NEW TRANSLATION
 russia_escalate_caucasian_war: "Eskalovat kavkazskou válku" # todo: NEW TRANSLATION
 russia_escalate_caucasian_war_desc: "S novými a zdokonalenými metodami ochrany našich zásob a vedení války jsme konečně schopni zničit kavkazské povstalce plnou silou naší armády." # todo: NEW TRANSLATION
 no_turmoil_tt: "[STATE.GetName] má #bold nepokoje#! pod 15%" # todo: NEW TRANSLATION
 caucasian_war_non_escalated_loc: "Konflikt hoří pomalu, veden hlavně prostřednictvím nájezdů a vpádů." # todo: NEW TRANSLATION
 caucasian_war_escalated_loc: "Konflikt eskaloval v kampaň plného rozsahu." # todo: NEW TRANSLATION
 caucasian_war_milyutin_loc: "Konflikt eskaloval do kampaně za úplné vyhlazení rebelů." # todo: NEW TRANSLATION
 je_the_last_kazakh_khan: "Poslední kazašský chan" # todo: NEW TRANSLATION
 je_the_last_kazakh_khan_reason: "Prohlášen zástupci tří žuzů za chána znovusjednoceného [SCOPE.sCountry('khanate_scope').GetName], [SCOPE.sCharacter('kenesary_scope').GetFullName] se otevřeně vzbouřil proti [ROOT.GetCountry.GetAdjective] nadvládě. Abychom jednou provždy zajistili kazašská území, musí být rebelující chanát zničen." # todo: NEW TRANSLATION
 je_pacify_the_steppes: "Pacifikace stepí" # todo: NEW TRANSLATION
 je_pacify_the_steppes_reason: "Navzdory nominální kontrole [ROOT.GetCountry.GetAdjective] nad kazašskou stepí od 18. století sužuje území banditismus a neoddanost. Kazašští rebelové vedení aristokratem [SCOPE.sCharacter('kenesary_scope').GetFullName] opět opakovaně útočí na naše zásobovací konvoje a pevnosti v regionu.\n\nJen konečná pacifikace stepi umožní [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] být skutečně suverénem Kazachstánu." # todo: NEW TRANSLATION
 khanate_is_destroyed_tt: "Kazašský chanát byl zničen" # todo: NEW TRANSLATION
 kazakhstan_events.1.t: "Kazašské povstání" # todo: NEW TRANSLATION
 kazakhstan_events.1.d: "Povstalečtí zástupci kazašských žuzů vyhlásili obnovení sjednoceného [SCOPE.sCountry('kazakh_scope').GetName] pod chánen [SCOPE.sCharacter('kenesary_scope').GetFullName]. Povstání ohrožuje naše zájmy po celé Střední Asii." # todo: NEW TRANSLATION
 kazakhstan_events.1.f: "Dvacet tisíc mužů ze tří set kmenů stojí východně na svých koních, připraveni jezdit proti svým vetřelcům.\n\nA v jejich čele, chán Kenesary, vyzdvižený na bílých plstích svými stoupenci ve třech žuzech, přísahá, že se nikdy nevrátí do své domoviny, dokud car bude pokoušet nazývat jeho země svým majetkem." # todo: NEW TRANSLATION
 kazakhstan_events.1.a: "Svolejte věrné sultány a potlačte toto povstání!" # todo: NEW TRANSLATION
 kazakhstan_events.1.b: "Kazašský lid se nikdy nepodvolí vetřelcům!" # todo: NEW TRANSLATION
 kazakhstan_events.2.t: "Jízda [SCOPE.sCharacter('kenesary_scope').GetFirstName]" # todo: NEW TRANSLATION
 kazakhstan_events.2.d: "Karavana doprovázená kozáky projíždějící stepmi [SCOPE.sState('akmolinsk_state').GetStateRegion.GetName] byla napadena velkou a dobře vycvičenou skupinou kazašských rebelů vedených aristokratem [SCOPE.sCharacter('kenesary_scope').GetFullName]." # todo: NEW TRANSLATION
 kazakhstan_events.2.f: "Přišli v noci, sjíždějíc na tábor ze všech stran, jezdecký oddíl stovek mužů, tak náhlý, že to bylo, jako by se zrodili z moří trávy, které obklopovaly stany. Okamžitě pobili předvoj, meče se křížily a výstřely zaznívaly z unifikovaných mušketů vyrobených v dílnách v Tule a z ohromného množství střelných zbraní sešlých z půlky kontinentu.\n\nTrvalo to jen chvíli, než se rachot utišil a jezdci zmizeli, zanechávajíc po sobě jen pomačkané látky a dvě desítky ošlehaných přeživších." # todo: NEW TRANSLATION
 kazakhstan_events.2.a: "Postavte pohraniční linie do stavu pohotovosti." # todo: NEW TRANSLATION
 notification_kazakhstan_ride_of_kenesary_notification_name: "[SCOPE.sCharacter('kenesary_scope').GetFullName] zahajuje povstaleckou kampaň" # todo: NEW TRANSLATION
 notification_kazakhstan_ride_of_kenesary_notification_desc: "Vůdce rebelů [SCOPE.sCharacter('kenesary_scope').GetFullName] zahájil vleklou kampaň vojenských akcí proti [SCOPE.sCountry('russia_scope').GetAdjective] a jejich protektorátům ve třech žuzech." # todo: NEW TRANSLATION
 kazakhstan_events.3.t: "Tiché stepi" # todo: NEW TRANSLATION
 kazakhstan_events.3.d: "S pacifikací rebelujícího chanátu a popravou chána Kenesaryho může nyní [ROOT.GetCountry.GetAdjective] stát bez odporu projekčně působit přes celou kazašskou zemi." # todo: NEW TRANSLATION
 kazakhstan_events.3.f: "Kamene, plačte! Ticho, úsvite!\nPadněte, pyšné skály!\nBuď klid, veselá písnička potoka!\nNení již Kenesary, poslové nebes-\nJe mrtev, teď." # todo: NEW TRANSLATION
 kazakhstan_events.3.a: "Musíme se hnát dál do Turkestánu." # todo: NEW TRANSLATION
 kazakhstan_events.3.b: "Konsolidujte zde naše zisky před dalším postupem." # todo: NEW TRANSLATION
 kazakhstan_events.4.t: "Kozácká hlídka přepadena" # todo: NEW TRANSLATION
 kazakhstan_events.4.d: "Oddíl sibiřských kozáků v [SCOPE.sState('raid_state').GetName] byl přepaden a pobit skupinou kazašských jezdců nesoucích prapor [SCOPE.sCharacter('kenesary_scope').GetFullName]." # todo: NEW TRANSLATION
 kazakhstan_events.4.f: ""Všude je nepořádek. Vzniká částečně z nezapomenutelného opomenutí a částečně z bázlivosti kozáků, kteří marně snaží nafouknout bojeschopnost sil slovy, aby nějak ospravedlnili svou zavrženíhodnou nedbalost."" # todo: NEW TRANSLATION
 kazakhstan_events.4.a: "Udejte náhradu [SCOPE.sCountry('kazakh_scope').GetRuler.GetPrimaryRoleTitle] za karavanu." # todo: NEW TRANSLATION
 kazakhstan_events.4.b: "Je odpovědností Kazachů zajistit svá vlastní území." # todo: NEW TRANSLATION
 notification_kazakhstan_cossack_patrol_attacked_notification_name: "[SCOPE.sCountry('russia_scope').GetAdjective] kozácká hlídka přepadena v [SCOPE.sState('raid_state').GetName]" # todo: NEW TRANSLATION
 notification_kazakhstan_cossack_patrol_attacked_notification_desc: "Rebelové loajální [SCOPE.sCharacter('kenesary_scope').GetFullName] přepadli hlídku sibiřských kozáků v [SCOPE.sState('raid_state').GetName]." # todo: NEW TRANSLATION
 kazakhstan_events.5.t: "Hraniční pevnost přepadena" # todo: NEW TRANSLATION
 kazakhstan_events.5.d: "Jedna z našich pevností v stepích [SCOPE.sState('raid_state').GetName] byla přepadena skupinou kazašských rebelů pod vedením [SCOPE.sCharacter('kenesary_scope').GetFullName]. Po obsazení pevnosti a rozprášení posádky povstalci bez milosti zničili nejbližší ruská sídla." # todo: NEW TRANSLATION
 kazakhstan_events.5.f: "Když průzkumníkův kůň pohlédl k tomu, co kdysi bylo branou, spatřil to, co zůstalo. Vrstva popela stále pokrývala trosky, usazená požárem, který zčernal a zuhelnatil trámy a zemní valy, jež tvořily hradby. Od doby, kdy byla pevnost spálena, nepřišel déšť, takže popel zachoval to, co zbylo.\n\nTam, kde byla pevnost, byl nyní hrob. Tam, kde byla posádka, byl nyní jen trvalý zápach kouře." # todo: NEW TRANSLATION
 kazakhstan_events.5.a: "Místní jsou jediní odpovědní za tuto katastrofu." # todo: NEW TRANSLATION
 kazakhstan_events.5.b: "Musíme věnovat více zdrojů ochraně našich zájmů." # todo: NEW TRANSLATION
 notification_kazakhstan_fortress_raid_notification_name: "[SCOPE.sCountry('russia_scope').GetAdjective] hraniční pevnost zničena rebely" # todo: NEW TRANSLATION
 notification_kazakhstan_fortress_raid_notification_desc: "Hraniční pevnost [SCOPE.sCountry('russia_scope').GetAdjective] byla přepadena a spálena silami [SCOPE.sCharacter('kenesary_scope').GetFullName] v [SCOPE.sState('raid_state').GetName]." # todo: NEW TRANSLATION
 kazakhstan_events.6.t: "Věrné auly pobity" # todo: NEW TRANSLATION
 kazakhstan_events.6.d: "Rebelové [SCOPE.sCharacter('kenesary_scope').GetFullName] napadli a vyvraždili skupinu věrných aulů v [SCOPE.sState('raid_state').GetName], šíříce hrůzu mezi těmi Kazaši, kteří zůstali věrní správě staršího sultána [SCOPE.sCharacter('senior_sultan_scope').GetFullName]." # todo: NEW TRANSLATION
 kazakhstan_events.6.f: ""Jak máme proklamovat věrnost tobě, který bere ruské mince, schovávaje se za ruskými hlídkami, ve městě vystavěném Rusy? Proč bychom měli cítit ten strach, který ty tak spravedlivě cítíš?"" # todo: NEW TRANSLATION
 kazakhstan_events.6.a: "Přináší zkázu svému vlastnímu lidu." # todo: NEW TRANSLATION
 kazakhstan_events.6.b: "Musíme požádat o další pomoc [SCOPE.sCountry('russia_scope').GetRuler.GetPrimaryRoleTitle]." # todo: NEW TRANSLATION
 notification_kazakhstan_auls_slaughtered_notification_name: "Kazašské auly pobity v [SCOPE.sState('raid_state').GetName]" # todo: NEW TRANSLATION
 notification_kazakhstan_auls_slaughtered_notification_desc: "Síly [SCOPE.sCharacter('kenesary_scope').GetFullName] pobily kazašské auly v [SCOPE.sState('raid_state').GetName] věrné [ROOT.GetCountry.GetAdjective]-jmenovanému staršímu sultánovi." # todo: NEW TRANSLATION
 kazakhstan_events.7.t: "Chánova korespondence" # todo: NEW TRANSLATION
 kazakhstan_events.7.d: "Ucházející se chán Kazachů, [SCOPE.sCharacter('kenesary_scope').GetFullName], poslal korespondenci [SCOPE.sCharacter('ruler_scope').GetFullName], žádaje o alianci s [ROOT.GetCountry.GetName] proti svým rivalům v Rusku a Kazachstánu." # todo: NEW TRANSLATION
 kazakhstan_events.7.f: ""Zase a znovu jsem žádal o pokoj a přátelství od ruského cara a jeho poddaných, a přesto neprokázali žádné čisté úmysly. Jejich touha dominovat našim domovům roste rok od roku - letos to budou ruské pevnosti na řece Irtyš, ale příští rok to bude Sarysu."" # todo: NEW TRANSLATION
 kazakhstan_events.7.a: "Ruské a jejich vazalové jsou hrozbou pro nás všechny." # todo: NEW TRANSLATION
 kazakhstan_events.7.b: "Nechceme být součástí jeho boje." # todo: NEW TRANSLATION
 kazakhstan_events.8.t: "Kazašský nájezd odražen" # todo: NEW TRANSLATION
 kazakhstan_events.8.d: "Kazašská povstalecká síla věrná [SCOPE.sCharacter('kenesary_scope').GetFullName] se pokusila spáchat nájezd na [ROOT.GetCountry.GetAdjective] pevnost v [SCOPE.sState('raid_state').GetName], ale byla odražena místní posádkou." # todo: NEW TRANSLATION
 kazakhstan_events.8.f: "Když jezdci dosáhli obzoru, posádka již byla v pozici. V disciplínovaných řadách na hradbách zastavil rázný nápor salvou mušketového ohně a kozáčtí jezdci se přidali k smrtiácím soubojům.\n\nKdyž hrůza pominula, muži i koně vykřikovali, stepní tráva byla zalita krví svých synů." # todo: NEW TRANSLATION
 kazakhstan_events.8.a: "Chvalte vojáky za jejich statečnou obranu." # todo: NEW TRANSLATION
 kazakhstan_events.8.b: "Generál [SCOPE.sCharacter('casia_general').GetFullName] si zaslouží uznání za své činy." # todo: NEW TRANSLATION
 notification_kazakhstan_raid_repelled_notification_name: "[SCOPE.sCountry('russia_scope').GetAdjective] posádka pevnosti odrazila nájezd" # todo: NEW TRANSLATION
 notification_kazakhstan_raid_repelled_notification_desc: "Posádka [SCOPE.sCountry('russia_scope').GetAdjective] pevnosti v [SCOPE.sState('raid_state').GetName] odrazila nájezd sil věrných [SCOPE.sCharacter('kenesary_scope').GetFullName]." # todo: NEW TRANSLATION
 kenesary_recognition_tt: "Budeme spjati s chánen Kenesary v vojenských záležitostech proti [SCOPE.sCountry('russia_scope').GetName]." # todo: NEW TRANSLATION
 modifier_kenesary_revolt: "Povstání chána Kenesary" # todo: NEW TRANSLATION
 modifier_kazakh_ungovernable_provinces: "Neovladatelné stepi" # todo: NEW TRANSLATION
 modifier_supported_soldiers_in_casia: "Podpora kazašských garnizonů" # todo: NEW TRANSLATION
 modifier_increased_authority_kazakhstan: "Úspěchy proti Kenesary" # todo: NEW TRANSLATION
 modifier_hero_against_kenesary: "Hrdinské obranné akce" # todo: NEW TRANSLATION
 modifier_recompense_for_supply_convoy_raid: "Náhrada za napadené zásobovací konvoje" # todo: NEW TRANSLATION
 modifier_raids_on_supply_convoys: "Napadené obchodní konvoje" # todo: NEW TRANSLATION
 modifier_fortress_raid_kazakhstan: "Ruská pevnost přepadena" # todo: NEW TRANSLATION
 modifier_shoring_up_kazakhstan: "Posilování kazašských pevností" # todo: NEW TRANSLATION
 modifier_auls_raided: "Věrné auly přepadeny" # todo: NEW TRANSLATION
 modifier_excessive_russian_reliance: "Nadměrná závislost na Rusku" # todo: NEW TRANSLATION
