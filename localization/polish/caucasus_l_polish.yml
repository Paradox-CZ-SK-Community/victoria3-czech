 notification_circassians_deported_message_desc: "Lodě plné vyhoštěných [SCOPE.sCulture('circassian_culture_scope').GetName] vypluly směrem do [SCOPE.sState('expulsion_destination_state').GetName]. Mnozí již zemřeli na nemocích na březích Černého moře." # todo: NEW TRANSLATION
