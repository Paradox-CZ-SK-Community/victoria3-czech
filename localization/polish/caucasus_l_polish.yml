 caucasuswar.1.t: "Neúspěšný vpád do [SCOPE.sCountry('adversary_scope').GetName]" # todo: NEW TRANSLATION
 caucasuswar.1.d: "Vpád, který jsme zahájili z [SCOPE.sState('invasion_base_state').GetName] na území nárokované [SCOPE.sCountry('adversary_scope').GetName], selhal. Odeslané jednotky se stáhly po těžkých ztrátách v drsném kavkazském terénu." # todo: NEW TRANSLATION
 caucasuswar.1.f: ""Byli v stromech - museli být varováni dříve, než jsme začali. Čekali, až se ocitneme v tom zatraceném lese, než na nás otevřou palbu... major padl první a naše koně byli přepíchnuti. Jak to máme zvládnout, pane? Jak máme toto území vzít, když nemůžeme tvrdit, že ovládáme cokoli, kromě stínu našich vlastních nohou?"" # todo: NEW TRANSLATION
 caucasuswar.1.a: "Zakryjte ústup palbou a děly." # todo: NEW TRANSLATION
 caucasuswar.1.b: "Stažení sil a tiché přeskupení." # todo: NEW TRANSLATION
 notification_caucasus_russian_failed_attack_notification_name: "Neúspěšný [SCOPE.sCountry('russia_scope').GetAdjective] vpád do našeho území" # todo: NEW TRANSLATION
 notification_caucasus_russian_failed_attack_notification_desc: "Expedice [SCOPE.sCountry('russia_scope').GetAdjective] z [SCOPE.sState('invasion_base_state').GetName] byla odrazena poté, co se pokusila obsadit jedno z našich kontrolovaných regionů." # todo: NEW TRANSLATION
 caucasuswar.2.t: "Kavkazský zásobovací konvoj přepaden" # todo: NEW TRANSLATION
 caucasuswar.2.d: "Konvoj vyslaný, aby dodal potřebné střelivo a zásoby našim silám v [SCOPE.sState('invasion_base_state').GetName], byl přepaden silami [SCOPE.sCountry('adversary_scope').GetName]. Při boji byla ztracena značná část jeho nákladu." # todo: NEW TRANSLATION
 caucasuswar.2.f: "Ve chvíli, kdy dorazila posila, těla již začala hnít. Muži a koně leželi zamotáni tam, kde padli, jejich věci vypleněny a odneseny podnikavýma rukama. Když tam leželi, dálnice už nebyla územím Ruska, ani žádného muže - neboť jejími obyvateli byli larvy a jejím vládcem Pán Much." # todo: NEW TRANSLATION
 caucasuswar.2.a: "Zabavte zdroje od místních, aby se vyrovnal deficit." # todo: NEW TRANSLATION
 caucasuswar.2.b: "Vydržte a vyčkejte lépe chráněného konvoje." # todo: NEW TRANSLATION
 notification_caucasus_russian_supply_convoy_notification_name: "Úspěšný nájezd na konvoj [SCOPE.sCountry('russia_scope').GetAdjective]" # todo: NEW TRANSLATION
 notification_caucasus_russian_supply_convoy_notification_desc: "Úspěšně jsme přepadli a rozprášili konvoj [SCOPE.sCountry('russia_scope').GetAdjective], který měl zásobovat nepřátelské síly, a zabavili jeho náklad." # todo: NEW TRANSLATION
 caucasuswar.3.t: "Úspěšný vpád do [SCOPE.sCountry('adversary_scope').GetName]" # todo: NEW TRANSLATION
 caucasuswar.3.d: "Vpád, který jsme podnikli do území nárokovaného [SCOPE.sCountry('adversary_scope').GetName], byl úspěšný; několik vesnic ovládaných horaly bylo spáleno a nepřítel uprchl." # todo: NEW TRANSLATION
 caucasuswar.3.f: "Večer vojáci vstoupili do městečka ukrytého mezi dvěma horami - skromné, ale prosperující, obklopené poli tvrdých plodin.\n\nRáno za sebou nechali jen ohořelé kostry, obklopené pustým kruhem popela." # todo: NEW TRANSLATION
 caucasuswar.3.a: "Ať nezůstane nikdo živý." # todo: NEW TRANSLATION
 caucasuswar.3.b: "Učinili jsme je ochotné se podřídit." # todo: NEW TRANSLATION
 notification_caucasus_russian_village_burned_notification_name: "Vesnice vypálené [SCOPE.sCountry('russia_scope').GetAdjective] vojáky" # todo: NEW TRANSLATION
 notification_caucasus_russian_village_burned_notification_desc: "Řada vesnic v [SCOPE.sState('invasion_state').GetName] byla spálena přepadem [SCOPE.sCountry('russia_scope').GetAdjective], jejich obyvatelstvo a dobytek byly pobity." # todo: NEW TRANSLATION
 caucasuswar.4.t: "Kmen [SCOPE.sCulture('defector_culture').GetName] skládá věrnost" # todo: NEW TRANSLATION
 caucasuswar.4.d: "Zastrašeni našimi silami a neochotní dál bojovat, kmen [SCOPE.sCulture('defector_culture').GetName], dříve loajální [SCOPE.sCountry('adversary_scope').GetName], složil věrnost [ROOT.GetCountry.GetName]." # todo: NEW TRANSLATION
 caucasuswar.4.f: "Já, níže podepsaný, slibuji a přísahám na Všemohoucího Boha, na Jeho svaté evangelium, že jsem v úctě a vázán Jeho císařskou Výsostí, mým skutečným a vrozeným nejmilostivějším svrchovaným císařem [ROOT.GetCountry.GetRuler.GetFullNameNoFormatting], Autokratem všech Rusů, a jeho právoplatnému dědici trůnu všech Rusů." # todo: NEW TRANSLATION
 caucasuswar.4.a: "Škoda, že se tak nerozhodli dříve." # todo: NEW TRANSLATION
 caucasuswar.4.b: "Povolit jejich osídlení v našich kontrolovaných územích." # todo: NEW TRANSLATION
 notification_caucasus_tribe_defection_notification_name: "Kmen složí věrnost [SCOPE.sCountry('russia_scope').GetName]" # todo: NEW TRANSLATION
 notification_caucasus_tribe_defection_notification_desc: "Kmen [SCOPE.sCulture('defector_culture').GetName] složil věrnost [SCOPE.sCountry('russia_scope').GetAdjective] [SCOPE.sCountry('russia_scope').GetRuler.GetPrimaryRoleTitle], čímž se oslabuje naše kontrola nad vlastními zeměmi." # todo: NEW TRANSLATION
 caucasuswar.5.t: "Memorandum [SCOPE.sCharacter('milyutin_scope').GetLastName]" # todo: NEW TRANSLATION
 caucasuswar.5.d: "Nově povýšený generálporučík [SCOPE.sCharacter('milyutin_scope').GetFullName] zaslal carovi memorandum, v němž hovoří ve prospěch vyhnání nebo vyhlazení celého [SCOPE.sCulture('circassian_culture').GetName] obyvatelstva Kavkazu." # todo: NEW TRANSLATION
 caucasuswar.5.f: ""realizace této myšlenky by měla trojí či čtvrtý cíl: za prvé, zbavit kavkazskou plošinu neustále nepřátelského obyvatelstva a tím otevřít krásná a úrodná místa pro naši kozáckou populaci; za druhé, dát domorodým samotným lepší postavení, zajistit jejich budoucnost, kterou nyní nemají, protože, jak přišli do Turecka, museli se sami postarat..."" # todo: NEW TRANSLATION
 caucasuswar.5.a: "Schválit memorandum a eskalovat vyhnání." # todo: NEW TRANSLATION
 caucasuswar.5.b: "Toto opatření učiní hory navždy neovladatelnými." # todo: NEW TRANSLATION
 milyutin_available_tt: "[SCOPE.sCharacter('milyutin_scope').GetFullName] se stane [concept_general]." # todo: NEW TRANSLATION
 caucasuswar.6.t: "Dezercie k [SCOPE.sCountry('adversary_scope').GetName]" # todo: NEW TRANSLATION
 caucasuswar.6.d: "Multietnická povaha imámátu [SCOPE.sCharacter('shamil_scope').GetFullName] se ukázala být neodolatelná pro mnoho našich poddaných v [SCOPE.sState('invasion_base_state').GetName]. Důstojníci i pozemkoví vlastníci nahlásili četné dezertace k imámátu." # todo: NEW TRANSLATION
 caucasuswar.6.f: ""Špatné zacházení s našimi vojáky-dezertéry od Čečenů odrazovalo mnoho nespolehlivých vojáků, a zejména Poláky, od útěku; ale když nyní zjistí, že Šamil dává svobodu dezertérům, mám obavy, že útěky se rozmnoží. Myslím, že je třeba nechat poprvé zajaté dezertéry popravovat. Společně s tímto jsem nařídil všem soukromým velitelům zpřísnit dohled nad nespolehlivými vojáky a okamžitě mi hlásit o těch, kdo utíkají."\n\n— Melenty Jakovlevič Olševskij" # todo: NEW TRANSLATION
 caucasuswar.6.a: "Zpřísnit bezpečnost v regionu, aby se předešlo dalším dezercím." # todo: NEW TRANSLATION
 caucasuswar.6.b: "Nechceme si nadělat další nepřátelství mezi lidmi." # todo: NEW TRANSLATION
 notification_caucasus_russian_soldiers_defection_notification_name: "[SCOPE.sCountry('russia_scope').GetAdjective] vojáci přecházejí k našim armádám" # todo: NEW TRANSLATION
 notification_caucasus_russian_soldiers_defection_notification_desc: "Skupina špatně zacházených [SCOPE.sCountry('russia_scope').GetAdjective] vojáků prohlásila konverzi k islámu a touhu podpořit náš boj proti vetřelci." # todo: NEW TRANSLATION
 caucasuswar.7.t: "Parlament nezávislosti" # todo: NEW TRANSLATION
 caucasuswar.7.d: "S plnohodnotnou invazí [SCOPE.sCountry('russia_scope').GetAdjective] státu se blížící k jistotě, byl ve [SCOPE.sState('capital_scope').GetFarmHubName] ustaven [ROOT.GetCountry.GetAdjective] národní parlament, aby zvolil jediného vládce a koordinoval jednotnou obranu všech Čerkesů." # todo: NEW TRANSLATION
 caucasuswar.7.f: "I když ztratíme mnoho našich statečných bojovníků, máme muže a mladé chlapce, kteří je mohou nahradit! V nejhorším případě nebudeme moci použít pušky, protože nemáme střelný prach ani munici. Přesto budeme bojovat s meči a dýkami v rukou! Nikdy neuposlechneme nepřátele! I kdyby nás celý svět opustil a byli bychom zatlačeni na poslední kousek naší domoviny, bude vidět, čeho jsou Adygovci schopni. Pokud bude třeba, budeme milosrdně vzíti životy našich žen a dětí vlastníma rukama, aby nepadly do rukou nepřítele a aby jim nebyly uštědřeny různé horší bolesti. A pak, aby je pomstili, i my musíme zahynout." # todo: NEW TRANSLATION
 caucasuswar.7.a: "Právě naším duchem budeme odolávat až do konce." # todo: NEW TRANSLATION
 caucasuswar.7.b: "Musíme se obrátit na cizí mocnosti, aby podpořily náš boj." # todo: NEW TRANSLATION
 caucasuswar.7.c: "Navždy budeme stát po boku našich východních bratří!" # todo: NEW TRANSLATION
 caucasuswar.8.t: "Čerkeské volání" # todo: NEW TRANSLATION
 caucasuswar.8.d: "Malý kavkazský protostát [SCOPE.sCountry('circassia_scope').GetName], který je zapleten do dlouhého konfliktu s [SCOPE.sCountry('russia_scope').GetName], poslal naší zemi žádost o vojenskou pomoc. Slíbení uznání jejich boje by mohlo pomoci oslabit ruskou kontrolu v regionu." # todo: NEW TRANSLATION
 caucasuswar.8.f: "Tato země je naše a chceme vládnout s absolutní spravedlností. Usilujeme spravovat naši zemi poctivě, proto zacházíme s našimi lidmi spravedlivě a respektujeme životy a majetek návštěvníků." # todo: NEW TRANSLATION
 caucasuswar.8.a: "Budeme tento konflikt sledovat se zájmem." # todo: NEW TRANSLATION
 caucasuswar.8.b: "Nemáme důvod se do toho zapojovat." # todo: NEW TRANSLATION
 circassia_decision_tt: "Budeme mít možnost nabídnout [Concept('concept_recognized_power','Recognition')] [SCOPE.sCountry('circassia_scope').GetAdjective] státu prostřednictvím #bold Rozhodnutí#!." # todo: NEW TRANSLATION
 caucasuswar.9.t: "Vyslanec imámátu" # todo: NEW TRANSLATION
 caucasuswar.9.d: "Po smrti našeho bývalého [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] a na žádost mnoha z [SCOPE.gsInterestGroup('devout_scope').GetCustom('IG_G_TT')], [SCOPE.sCountry('imamate_scope').GetName] vyslal vysoce postaveného naiba, aby upevnil vazby mezi našimi národy a vedl [ROOT.GetCountry.GetName] v jeho boji." # todo: NEW TRANSLATION # todo: NAME CASE
 caucasuswar.9.f: "Po třetím měsíci, kdy slyšel naše volání na Východ po učiteli, který by nám osvítil cestu, přišel, jeho přítomnost jako titán a jeho vůle jako bouře ohně." # todo: NEW TRANSLATION
 caucasuswar.9.a: "Budeme poctěni, že se sjednotíme s našimi bratry v islámu." # todo: NEW TRANSLATION
 caucasuswar.9.b: "Náš boj je především národní." # todo: NEW TRANSLATION
 muhammad_amin_ruler_tt: "#v Muhammad Amin Asiyalev#! se stane naším [concept_ruler]" # todo: NEW TRANSLATION
 caucasuswar.10.t: "Výprava Kangaroo" # todo: NEW TRANSLATION
 caucasuswar.10.d: "Oddíl převážně [SCOPE.sCulture('polish_culture').GetName] a [SCOPE.sCulture('hungarian_culture').GetName] dobrovolníků z [SCOPE.sCountry('austria_scope').GetAdjective] [SCOPE.sState('galicia_scope').GetName] připlul do [ROOT.GetCountry.GetName] parníkem Kangaroo, aby pomohl jako dobrovolníci v boji proti [SCOPE.sCountry('russia_scope').GetAdjective] vetřelcům." # todo: NEW TRANSLATION
 caucasuswar.10.f: ""V životě člověka jsou některé předtuchy a touhy, které, navzdory své zdánlivé nepravděpodobnosti, se někdy splní. Zažil jsem to na vlastní kůži. Když jsem emigroval, měl jsem posedlou myšlenku jet na Kavkaz. Tehdy mi nebylo víc než dvaadvacet a téměř romantické legendy o Šamilovi a horských hrdinech, kteří odolávají gigantické síle Ruska v tak malých počtech, na mě hluboce zapůsobily. Hledal jsem cestu, jak se s nimi spojit, a kdekoliv jsem byl - v Německu, Anglii nebo Francii - snažil jsem se najít podporu pro tento nápad a vzbudit o něj zájem. Považovali mě za bezohledného snílka a vyčleňovali mi příklad některých mých krajanů a několika zoufalých darebáků z Anglie..."" # todo: NEW TRANSLATION
 caucasuswar.10.a: "Udělit jejich vůdci roli velitele a poslat ho na frontu." # todo: NEW TRANSLATION
 caucasuswar.10.b: "Uvítali bychom výcvik podle [SCOPE.sCountry('austria_scope').GetAdjective] taktik." # todo: NEW TRANSLATION
 caucasuswar_end.1.t: "Pád Čerkeska" # todo: NEW TRANSLATION
 caucasuswar_end.1.d: "S ukončením naší kampaně v [SCOPE.sState('kuban_state').GetStateRegion.GetName] padla pod naší kontrolu celá bývalá čerkeská území. Země je nyní dostupná pro osídlení donskými kozáky." # todo: NEW TRANSLATION
 caucasuswar_end.1.f: ""V tom roce bylo učiněno téměř bezprecedentní dílo v historii: žádný z horských obyvatel nepozůstává na svých původních místech a probíhají opatření k očištění regionu, aby se připravil pro nové ruské obyvatelstvo."" # todo: NEW TRANSLATION
 caucasuswar_end.1.a: "Deportace budou pokračovat, dokud země nebude čistá." # todo: NEW TRANSLATION
 caucasuswar_end.1.b: "Začněte proces integrace čerkeských národů." # todo: NEW TRANSLATION
 caucasuswar_end.2.t: "Čest a život" # todo: NEW TRANSLATION
 caucasuswar_end.2.d: "S porážkou [SCOPE.sCountry('russia_scope').GetAdjective] armád na bojišti jsme konečně dosáhli snu o nezávislém a sjednoceném [ROOT.GetCountry.GetName]. Nezrušitelná svrchovanost [ROOT.GetCountry.GetNameNoFormatting] v očích světa byla zaručena naší vítězstvím." # todo: NEW TRANSLATION
 caucasuswar_end.2.f: "Stáli jsme jako jeden proti vetřelci, hořící vášní za nezávislost naší domoviny, a vrátili jsme se domů jako vítězové." # todo: NEW TRANSLATION
 caucasuswar_end.2.a: "Naše síla vždy pramenila z našeho lidu, a vždy tak bude." # todo: NEW TRANSLATION
 caucasuswar_end.2.b: "Moderní [ROOT.GetCountry.GetName] už nikdy nebude ohrožován!" # todo: NEW TRANSLATION
 caucasuswar_end.2.c: "Nastal čas, aby naši ochránci splnili své sliby." # todo: NEW TRANSLATION
 caucasuswar_end.3.t: "Konec imámátu" # todo: NEW TRANSLATION
 caucasuswar_end.3.d: "S okupací [SCOPE.sState('dagestan_state').GetStateRegion.GetName] a kapitulací či dezercí mnoha bývalých kavkazských naibů se vůdce imámátu nakonec vzdal [ROOT.GetCountry.GetAdjective] armádě na žádost manželek a dětí jeho posledních stoupenců." # todo: NEW TRANSLATION
 caucasuswar_end.3.f: ""Celý svět zná o vašich činech a jejich sláva nezmizí. Pokud se dnes, podrobujetece osudu, vydáte k veliteli a vzdáte se štědrosti suverénního [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle], zachráníte tisíc lidí, kteří jsou naživu a věrní vám, před smrtí. Dokončete své slavné činy aktem opatrnosti a štědrosti a sardar požádá suveréna, aby zajistil budoucnost vás a vaší rodiny."\n\n— Ivan Davidovič Lazarev" # todo: NEW TRANSLATION
 caucasuswar_end.3.a: "V Čečensku byl konečně nalezen mír." # todo: NEW TRANSLATION
 caucasuswar_end.3.b: "Míru nebude, dokud bude Šamil uctíván." # todo: NEW TRANSLATION
 caucasuswar_end.4.t: "Katastrofa na Kavkaze" # todo: NEW TRANSLATION
 caucasuswar_end.4.d: "Kolaps naší vlády v regionech [SCOPE.sState('kuban_state').GetStateRegion.GetName] a [SCOPE.sState('dagestan_state').GetStateRegion.GetName] vedl k přerušení Gruzínské vojenské silnice a k ukončení schopnosti [ROOT.GetCountry.GetAdjective] státu uplatňovat moc v jižním Kavkaze." # todo: NEW TRANSLATION
 caucasuswar_end.4.f: "V těchto opuštěných horách pro nás nezůstalo nic jiného, než být chycen mezi Turky a horaly. Nic už s námi není - Bůh je vysoko a car daleko." # todo: NEW TRANSLATION
 caucasuswar_end.4.a: "Militarizujte zbývající posádky a držte se za každou cenu!" # todo: NEW TRANSLATION
 caucasuswar_end.4.b: "Nechte region na milosti místních vládců." # todo: NEW TRANSLATION
 caucasuswar_end.4.c: "Stáhněte se tváří v tvář vznikajícím kavkazským státům." # todo: NEW TRANSLATION
 caucasuswar_end.4.e: "Ponechte hory transkavkazské inteligenci." # todo: NEW TRANSLATION
 caucasuswar_end_4b_tt: "#bold Kavkaz#! bude rozdělen mezi různé nárokovatele na dědictví jeho historických království." # todo: NEW TRANSLATION
 caucasuswar_end_4c_tt: "Národní aspirace #bold kavkazských#! národů budou realizovány jako samostatné státy." # todo: NEW TRANSLATION
 caucasuswar_end_4e_tt: "Kavkazské národy #bold Kavkazu#! získají nezávislost od [ROOT.GetCountry.GetName] jako sjednocené #bold Transkavkazské#! státy." # todo: NEW TRANSLATION
 caucasuswar_end.5.t: "Svatý mír" # todo: NEW TRANSLATION
 caucasuswar_end.5.d: "Porážka [SCOPE.sCountry('russia_scope').GetAdjective] armád umožnila naše osvobození celé oblasti [SCOPE.sState('dagestan_scope').GetStateRegion.GetName] pod vládou [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetLastName]. Cesta leží otevřená pro konečný triumf [ROOT.GetCountry.GetName]." # todo: NEW TRANSLATION
 caucasuswar_end.5.f: "Vůlí Všemohoucího, Absolutního Vládce... nevěřící byli rozptýleni, koruna jejich císaře zašpiněna krví jeho padlých hord." # todo: NEW TRANSLATION
 caucasuswar_end.5.a: "Začněte snahy o obrácení a integraci našich nových ruských sousedů." # todo: NEW TRANSLATION
 caucasuswar_end.5.b: "Musíme najít způsob, jak se přizpůsobit tomuto novému míru." # todo: NEW TRANSLATION
 russia_offer_circassia_recognition: "Nabídnout Čerkesku uznání" # todo: NEW TRANSLATION
 russia_offer_circassia_recognition_desc: "Žádosti o mezinárodní podporu, které mladý čerkeský národ posílá, představují vynikající příležitost rozšířit naši sféru vlivu na Kavkaze." # todo: NEW TRANSLATION
 circassia_recognition_tt: "Čerkesku bude nabídnuta šance stát se [Concept('concept_recognized_power','$concept_recognized_power$')|l], pokud dokáže #bold konsolidovat#! a #bold získat zpět své území#! od Ruska." # todo: NEW TRANSLATION
 no_country_recognised_circassia_tt: "Žádná jiná země nenabídla #v $CIR$#! uznání" # todo: NEW TRANSLATION
 russia_out_of_kuban_tt: "#v $RUS$#! nemá [concept_state] v [SCOPE.sStateRegion('kuban_scope').GetName]" # todo: NEW TRANSLATION
 russia_out_of_north_caucasus_tt: "#v $RUS$#! nemá [concept_state] v [SCOPE.sStateRegion('north_caucasus_scope').GetName]" # todo: NEW TRANSLATION
 russia_out_of_dagestan_tt: "#v $RUS$#! nemá [concept_state] v [SCOPE.sStateRegion('dagestan_scope').GetName]" # todo: NEW TRANSLATION
 imamate_dispatch_muhammad_amin: "Poslat naiba do Čerkeska" # todo: NEW TRANSLATION
 imamate_dispatch_muhammad_amin_desc: "Smrt dvou čerkeských Thamadů v rychlém sledu zanechala naše západní bratry toužící po postavě, která by je sjednotila. Vyslání našeho emisara do Čerkeska by mohlo zajistit potřebnou alianci s našimi spolubojovníky a znovu sjednotit kmeny." # todo: NEW TRANSLATION
 circassia_muhammad_amin_tt: "Pošleme zručného naiba do #bold Čerkeska#!, aby sjednotil horské národy pod islám." # todo: NEW TRANSLATION
 muhammad_amin_possible: "Thamades #bold Ismail Berzeg#! nebo #bold Hawduqo Mansur#! už nejsou vládci Čerkeska" # todo: NEW TRANSLATION
 je_conquest_of_central_asia: "Dobytí Turkestánu" # todo: NEW TRANSLATION
 je_conquest_of_central_asia_reason: "Abychom zajistili naši jižní hranici, čelili britské moci v Indii a otevřeli trasy, jimiž můžeme rozšířit [ROOT.GetCountry.GetAdjective] vliv na Blízký východ, vláda [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] vydala pravomoc k zakládání protektorátů po celé Střední Asii a rozšiřování našeho impéria do Turkestánu." # todo: NEW TRANSLATION
 russian_central_asia.1.t: "Dobytí Turkestánu" # todo: NEW TRANSLATION
 russian_central_asia.1.d: "Jih od kazašské stepi leží chanáty Střední Asie, další soubor bariér zastavujících [ROOT.GetCountry.GetAdjective] projekci moci do Indie a na Blízký východ. Vládě [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] za každou cenu stoji za to je přivést do našeho vlivu." # todo: NEW TRANSLATION
 russian_central_asia.1.f: ""Nejsou to ani ambiciózní plány ani sobecké kalkulace, které vedou Rusko vpřed do Střední Asie, ale jen touha pacifikovat ten region, dát impuls jeho produktivním silám a otevřít nejkratší cestu pro prodej produktů Turkestánu do evropské části Ruska."" # todo: NEW TRANSLATION
 russian_central_asia.1.a: "Nejlépe bude zvolit medovější přístup." # todo: NEW TRANSLATION
 russian_central_asia.1.b: "Turkestán se musí podřídit [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle], mírem nebo válkou." # todo: NEW TRANSLATION
 central_asia_influence_tt: "Státy Střední Asie budou ochotnější se nám podřídit." # todo: NEW TRANSLATION
 notification_central_asia_bribes_notification_name: "[SCOPE.sCountry('russia_scope').GetAdjective] rozšiřuje finanční vliv" # todo: NEW TRANSLATION
 notification_central_asia_bribes_notification_desc: "Obchodníci a diplomaté zastupující [SCOPE.sCountry('russia_scope').GetName] v naší zemi začali rozhazovat peníze a získávat přízně místních úředníků [ROOT.GetCountry.GetAdjectiveNoFormatting]." # todo: NEW TRANSLATION
 russian_central_asia.2.t: "Velká hra" # todo: NEW TRANSLATION
 russian_central_asia.2.d: "S otevřením obchodních cest Střední Asie pro [SCOPE.sCountry('india_overlord').GetAdjective] Indii a Blízký východ zůstávají tyto trasy zadrhávány pouze státem [SCOPE.sCountry('afghan_scope').GetName]. Několik jastrabích postav v [SCOPE.gsInterestGroup('hawkish_ig').GetCustom('IG_L_TT')] navrhlo tento stát jako potenciální protektorát." # todo: NEW TRANSLATION # todo: NAME CASE
 russian_central_asia.2.f: "Obávám se, že získání těchto rozlehlých zemí jen popudí strach v srdcích [SCOPE.sCountry('india_overlord').GetAdjectiveNoFormatting] a že mohou začít další války o národy, které lpí na statusu nárazníků mezi našimi impérii. Musí být dosaženo míru - ať už smlouvou, nebo jejich úplnou kapitulací." # todo: NEW TRANSLATION
 russian_central_asia.2.a: "Kábul bude jednou také [ROOT.GetCountry.GetAdjective]." # todo: NEW TRANSLATION
 russian_central_asia.2.b: "Lépe nám poslouží jemnější přístup." # todo: NEW TRANSLATION
 russian_central_asia.3.t: "Turkménská pohroma" # todo: NEW TRANSLATION
 russian_central_asia.3.d: "Navzdory obecnému přijetí naší svrchovanosti nad Turkestánem mnohé [SCOPE.sCountry('turkmenia_scope').GetAdjectiveNoFlag] kmeny na jihu pokračují v nájezdech na naše země bez strachu z odplaty a odmítají se podřídit naší autoritě. Abychom napravili tuto nespravedlnost, [SCOPE.GetRootScope.GetCountry.GetRuler.GetPrimaryRoleTitle] [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] vyhlásil velkou expedici do turkménských zemí." # todo: NEW TRANSLATION
 russian_central_asia.3.f: "Pouští prst po mapě rozložené na stole mezi nimi všemi, generál pohrdavě zamručel. "Tady!" zahřměl, "Tady udeříme! Ten hnízdo #italic loupeže#! a #italic zkázy#!! Působí nám to příliš dlouho jako překážka pro naše ambice a naši milost." Mávl směrem k masám mužů a zbraní těsně za plátnem stanu. "Připravte koně. Ráno vyrazíme."" # todo: NEW TRANSLATION
 russian_central_asia.3.a: "Ukažme těmto nájezdníkům ruskou sílu." # todo: NEW TRANSLATION
 modifier_suzerain_of_central_asia: "Suzerén Střední Asie" # todo: NEW TRANSLATION
 modifier_central_asian_influence: "Ovlivňování Střední Asie" # todo: NEW TRANSLATION
 modifier_central_asian_bribe_payments: "Dary od Ruska" # todo: NEW TRANSLATION
 Milishia: "Milice" # todo: NEW TRANSLATION
 Murtazeki: "Murtazeki" # todo: NEW TRANSLATION
 Circassian_Army: "Čerkeská armáda" # todo: NEW TRANSLATION
 je_circassian_expulsions: "Vyhoštění Čerkesů" # todo: NEW TRANSLATION
 je_circassian_expulsions_reason: "Ambice vlády osídlit bývalé území Čerkeska loajálními kozáky vedly k nelítostné kampani vyhnat obyvatelstvo [SCOPE.sCulture('circassian_culture_scope').GetName] regionu za každou cenu.\n\nDokud bude tento [concept_journal_entry] aktivní, budou [SCOPE.sCulture('circassian_culture_scope').GetName] [Concept('concept_pop', '$concept_pops$')|l] deportováni z našich hranic, za cenu obrovských ztrát na životech." # todo: NEW TRANSLATION
 circassia_defeated_tt: "#v $CIR$#! byl poražen" # todo: NEW TRANSLATION
 will_lead_to_expulsions_tt: "@warning! Toto povede k drastickým následkům pro populaci [SCOPE.sCulture('circassian_culture').GetName]" # todo: NEW TRANSLATION
 has_halted_deportations_tt: "Zastavil deportace lidí [SCOPE.sCulture('circassian_culture_scope').GetName]" # todo: NEW TRANSLATION
 halt_circassian_deportations_tt: "Úsilí o pokračování vyhošťování lidí [SCOPE.sCulture('circassian_culture_scope').GetName] přestanou" # todo: NEW TRANSLATION
 modifier_halted_circassian_expulsions: "Zastavené snahy o vyhošťování Čerkesů" # todo: NEW TRANSLATION
 russia_halt_circassian_expulsions: "Zastavit vyhošťování" # todo: NEW TRANSLATION
 russia_halt_circassian_expulsions_desc: "Pokračující deportace Čerkesů již není v zájmu vlády. Nařídíme okamžité zastavení deportací." # todo: NEW TRANSLATION
 halted_expulsions_tt: "Již zastavil vyhošťování Čerkesů" # todo: NEW TRANSLATION
 caucasus_expulsions.1.t: "Přes moře" # todo: NEW TRANSLATION
 caucasus_expulsions.1.d: "Vlny charterovaných uprchlických lodí a obchodních plavidel nesoucích tisíce deportovaných [SCOPE.sCulture('circassian_culture_scope').GetName] vyplouvají přes Černé moře ke svému cíli. Vypuknutí nemocí a podvýživy decimovalo davy." # todo: NEW TRANSLATION
 caucasus_expulsions.1.f: "Na břehu stály tisíce lidí u sebe, aby sdíleli to nejnutnější útočiště a jídlo. Všichni byli bledí a hladoví. Známky neštovic a tyfu sužovaly mnohé z nich. Desítky umíraly, na pokraji připojení k hromadám mrtvol umístěným, kdekoliv bylo místo.\n\nNa moři paluby transportních lodí přetékaly umírajícími a již mrtvými." # todo: NEW TRANSLATION
 caucasus_expulsions.1.a: "Další vlna je brzy nahradí." # todo: NEW TRANSLATION
 caucasus_expulsions.1.b: "Povolit distribuci zahraniční pomoci." # todo: NEW TRANSLATION
 caucasus_expulsions.1.c: "Máme jiné věci, na které se zaměřit." # todo: NEW TRANSLATION
 caucasus_expulsions.2.t: "[SCOPE.sCountry('russia_scope').GetName] žádá o migrační smlouvu" # todo: NEW TRANSLATION
 caucasus_expulsions.2.d: "Úředníci [SCOPE.sCountry('russia_scope').GetAdjective] oslovili vládu žádostí o povolení deportovat až padesát tisíc lidí [SCOPE.sCulture('circassian_culture_scope').GetName] do našeho území. Pozorovatelé [SCOPE.sCountry('russia_scope').GetAdjectiveNoFormatting] jednání na Kavkaze varují, že deportace mohou být mnohem rozsáhlejší." # todo: NEW TRANSLATION
 caucasus_expulsions.2.f: ""Návrh komise počítá s přepravou až deseti tisíc rodin. Přeprava za pět rublů na hlavu, dva mají zaplatit migranti sami, s pobídkami pro soukromé aktéry." To byl ruský postoj. Úředník si pochybil, ale nemohl to vyslovit. Na severu probíhá válka - ne formální, ale přesto válka. Masovější exodus je jistota a jeho podmínky budou jistě mnohem chaotičtější, než je uváděno." # todo: NEW TRANSLATION
 caucasus_expulsions.2.a: "Bylo by vhodné osídlit náš východ." # todo: NEW TRANSLATION
 caucasus_expulsions.2.b: "Tato smlouva hrozí destabilizací." # todo: NEW TRANSLATION
 caucasus_expulsions.3.t: "Oceán krve" # todo: NEW TRANSLATION
 caucasus_expulsions.3.d: "Příliv [SCOPE.sCulture('circassian_culture_scope').GetName] deportovaných připlouvajících na naše severní pobřeží se změnil v humanitární katastrofu. Místní úřady byly zahlceny počtem uprchlíků, z nichž mnozí jsou hladoví a nemocní." # todo: NEW TRANSLATION
 caucasus_expulsions.3.f: "Husté masy ošuntělých mužů, žen a dětí pokryly pobřeží. Všichni vypadali bledě a hladově. Mnozí byli téměř nazí. Někteří umírali. Na moři připlouvala další plavidla proměněná v plovoucí hřbitovy nemocí, která zdecimovala jejich lidský náklad. Občas se na břeh vyplavily další těla, nepoznatelná působením raků a racků. Některá těla měla svázané ruce." # todo: NEW TRANSLATION
 caucasus_expulsions.3.a: "Důrazně vyžádejte, aby [SCOPE.sCountry('russia_scope').GetAdjective] vláda okamžitě ukončila tyto zvěrstva." # todo: NEW TRANSLATION
 caucasus_expulsions.3.b: "Nemůžeme udělat nic." # todo: NEW TRANSLATION
