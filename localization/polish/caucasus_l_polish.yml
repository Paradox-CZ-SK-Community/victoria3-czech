 three_pops_deported_tt: "Několik [SCOPE.sCulture('circassian_culture_scope').GetName] [Concept('concept_pop', '$concept_pops$')|l] bude deportováno do [SCOPE.sState('expulsion_destination_state').GetName]" # todo: NEW TRANSLATION
 notification_ottoman_circassian_refugees_arrived_name: "Připlouvají čerkesští uprchlíci" # todo: NEW TRANSLATION
 notification_ottoman_circassian_refugees_arrived_desc: "Lodě plné [SCOPE.sCulture('circassian_culture_scope').GetName] uprchlíků deportovaných z [SCOPE.sCountry('russia_scope').GetName] přistály na pobřeží [SCOPE.sState('expulsion_destination_state').GetName]. Mnozí již zemřeli na choroby během plavby." # todo: NEW TRANSLATION
