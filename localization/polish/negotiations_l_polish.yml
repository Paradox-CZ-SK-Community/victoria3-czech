 je_negotiate_army_quest_reason: "S [SCOPE.gsInterestGroup('ig').GetName] jsme složili přísahu zvýšit sílu naší armády. \n\nBuď vycvičením více vojáků, nebo modernizací jejich vybavení, zajistíme, že [ROOT.GetCountry.GetName] bude připravena hájit své zájmy." # todo: NEW TRANSLATION
