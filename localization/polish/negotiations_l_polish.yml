 notification_neg_failed_quest_toast_desc: "[SCOPE.gsInterestGroup('ig').GetName] jsou nespokojeni, že jsme nedodrželi naše sliby." # todo: NEW TRANSLATION
 negotiation.1.t: "[SCOPE.gsInterestGroup('negotiating_interest_group').GetCustom('NegotiationLevelName')|U] jednání s [SCOPE.gsInterestGroup('negotiating_interest_group').GetName]" # todo: NEW TRANSLATION
 negotiation.1.d: "Mezi mnoha výkřiky, urážkami a politováníhodnými obraty řeči se objevilo několik cest, které by přesvědčily [SCOPE.gsInterestGroup('ig').GetName], aby dovolili přijetí [SCOPE.sLaw('law').GetName]." # todo: NEW TRANSLATION
 negotiation.1.f: "\"Když člověk říká, že něco schvaluje v zásadě, znamená to, že nemá nejmenší úmysl to uvést do praxe.\" \n\n—Otto Von Bismarck" # todo: NEW TRANSLATION
 negotiation.1.d2: "[SCOPE.gsInterestGroup('ig').GetName] se dohodli setkat na místním trhu, aby potají projednali změnu svého postoje k [SCOPE.sLaw('law').GetName]" # todo: NEW TRANSLATION
 negotiation.1.f2: "Obcházel jsem náměstí několikrát, než jsem přistoupil ke stánku. Vyslovil jsem klíčovou frázi: \"To jsou pěkné lampy.\" Dva muži mě obklopili z obou stran. Za všechny roky služby mi srdce nikdy nebušilo tak zoufale. Přesvědčen, že jsem ztracen, ztuhl jsem v jejich náručí a byl doveden davem k jejich vyjednavači. Přiznávám, že jsem souhlasil se vším, co bylo řečeno, a nyní se ocitám v prekérní pozici, kdy musím přesvědčit své nadřízené o platnosti takových návrhů, abych neskončil vykuchaný jako zboží u prodejců ryb." # todo: NEW TRANSLATION
 negotiation.1.d3: "Navzdory nedůstojným poznámkám, zvýšeným hlasům a mávání pěstí, [SCOPE.gsInterestGroup('ig').GetName] přiznali několik kompromisů, které by změnily jejich pohled na [SCOPE.sLaw('law').GetName]." # todo: NEW TRANSLATION
 negotiation.1.f3: "Poté, co jsem doručil nabídku [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle], jsem byl nesmírně vděčný za lektor před sebou, můj dřevěný štít proti návalu urážek a velmi fyzického odpadu, který mi byl vrhán. Zvedl jsem paže, ale udržel klidný hlas. \"Pánové, prosím. Přiznávám, že tato nabídka možná není vše, co jste doufali. Ale [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] je docela neoblomný. [SCOPE.sLaw('law').GetNameNoFormatting] je budoucnost naší země.\"" # todo: NEW TRANSLATION
 negotiation.1.d4: "Po několika kolech stručné korespondence se [SCOPE.gsInterestGroup('ig').GetName] setkali s představiteli [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] a nastínili své požadavky." # todo: NEW TRANSLATION
 negotiation.1.f4: "\"Veškeré zákonodárství, veškerá vláda, veškerá společnost stojí na principu vzájemných ústupků, zdvořilosti a ohleduplnosti; na tom je vše postaveno... Kdo se povyšuje nad lidskost, nad její slabosti, neduhy a potřeby, ať prohlásí, že nikdy nebude dělat kompromisy; ale nechť nikdo, kdo není nad slabostmi naší společné povahy, nepohrdá kompromisy.\" \n\n—Henry Clay" # todo: NEW TRANSLATION
 negotiation.1.d5: "Šeptem v oblakách doutníkového dýmu v soukromé jídelně [SCOPE.gsInterestGroup('ig').GetLeader.GetFullName] diskutují [SCOPE.gsInterestGroup('ig').GetName], jaké kompromisy by mohli přijmout pro změnu postoje k [SCOPE.sLaw('law').GetName]." # todo: NEW TRANSLATION
 negotiation.1.f5: "\"Ač jsme konzervativci, s ohledem na současnou situaci se musíme změnit, abychom přežili.\" \n\n—Li Hongzhang" # todo: NEW TRANSLATION
 negotiation.1.d6: "[ROOT.GetCountry.MakeScope.Var('supporting_ig').GetInterestGroup.GetName] vedli tajné rozhovory s [SCOPE.gsInterestGroup('ig').GetName], hledajíce určité ujednání ohledně [SCOPE.sLaw('law').GetName]." # todo: NEW TRANSLATION
 negotiation.1.f6: "\"Rozvášněná mysl odmítá chladný dotek a neúprosné zkoumání logiky.\" \n\n—William E. Gladstone" # todo: NEW TRANSLATION
 negotiation.1.d7: "Známí členové [SCOPE.gsInterestGroup('ig').GetName] se scházejí v nejlepším podniku [ROOT.GetCountry.GetCapital.GetCityHubName], aby projednali [SCOPE.sLaw('law').GetName]. S patřičným vlivem by se možná jejich názory daly ovlivnit." # todo: NEW TRANSLATION
 negotiation.1.f7: "\"Nejlépe své straně slouží ten, kdo nejlépe slouží zemi.\" \n\n—Rutherford B. Hayes, 19. prezident USA" # todo: NEW TRANSLATION
 negotiation.1.d8: "[SCOPE.gsInterestGroup('ig').GetLeader.GetFullName] souhlasil s soukromým setkáním, zjevně hledá cestu, která prospěje jak národu, tak zájmům [SCOPE.gsInterestGroup('ig').GetName] ohledně [SCOPE.sLaw('law').GetName]." # todo: NEW TRANSLATION
 negotiation.1.f8: "\"Nemáme věčné spojence a ani věčné nepřátele. Naše zájmy jsou věčné a trvalé, a těmto zájmům je naším povinností se věnovat.\" \n\n—Lord Palmerston" # todo: NEW TRANSLATION
 negotiation.1.d9: "[SCOPE.gsInterestGroup('ig').GetName] nalévají jen své nejlepší ročníky a kouří jen svůj nejkvalitnější tabák během zdvořilé diskuse s vládními zástupci o [SCOPE.sLaw('law').GetName]." # todo: NEW TRANSLATION
 negotiation.1.f9: "\"Kompromis je dobrý jako deštník, ale špatný jako střecha; je to dočasné východisko, často moudré v stranické politice, téměř jistě nemoudré ve státnictví.\" \n\n—James Russell Lowell" # todo: NEW TRANSLATION
 negotiation.1.o1: "[SCOPE.gsInterestGroup('negotiating_interest_group').GetCustom('BribeLine')]" # todo: NEW TRANSLATION
