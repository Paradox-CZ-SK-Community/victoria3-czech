l_polish:
 tibet_expedition_events.1.t: "Do Tibetu!" # todo: NEW TRANSLATION
 tibet_expedition_events.1.d: "Rozhodli jsme se vypravit do Tibetu a zajistit tato území pro naše zájmy. Budeme muset prozkoumat trasu do Himálaje, projevit sílu a donutit Tibeťany usednout ke stolu jednání." # todo: NEW TRANSLATION
 tibet_expedition_events.1.f: ""Je to vlastně jednoduché." Kouř z cigary se vznášel, zatímco muž gestikuloval na mapu na zdi s doutnajícím cigárem mezi prsty. Ukázal na střední bod. "#italic To#! je naše slabé místo. Pokud to někdo jiný ovládá, má nám dýku u krku. Musíme zajistit, eh..." Zastavil se, když se snažil přehlédnout opar z tabáku, "Tibet! Musíme zabezpečit Tibet, abychom se zachránili."" # todo: NEW TRANSLATION
 tibet_expedition_events.1.a: "Znám toho pravého na tu práci!" # todo: NEW TRANSLATION
 tibet_expedition_events.3.t: "Expedice vyráží" # todo: NEW TRANSLATION
 tibet_expedition_events.3.d: "S [SCOPE.sCharacter('expedition_leader').GetPrimaryRoleTitle] [SCOPE.sCharacter('expedition_leader').GetFullName] v čele je naše expedice do Tibetu připravena vyrazit.\n\n#N Protože je v čele [SCOPE.sCharacter('expedition_leader').GetSheHe], pokud [SCOPE.sCharacter('expedition_leader').GetSheHe] zemře, expedice skončí neúspěchem.#!" # todo: NEW TRANSLATION
 tibet_expedition_events.3.f: "[SCOPE.sCharacter('expedition_leader').GetLastNameNoFormatting] se mračil, když [SCOPE.sCharacter('expedition_leader').GetSheHe] procházel zprávy. Pokud byla každá fáma o důležité horské stezce pravdivá, Himálaj byl napíchaný dírami jak švýcarský sýr. Nezbylo než vyrazit a zjistit, která z nich je skutečná." # todo: NEW TRANSLATION
 tibet_expedition_events.3.a: "Vpřed, do Tibetu!" # todo: NEW TRANSLATION
 tibet_expedition_events.4.t: "Překročení hranic: jakýsi jak" # todo: NEW TRANSLATION
 tibet_expedition_events.4.d: "Skupina místních pastevců jaků překročila hranici a svou chybu si uvědomili až když je zastavila tibetská hlídka a odehnala zpět. Pastevci si stěžují na hrubé zacházení, což vedlo [SCOPE.sCharacter('expedition_leader').GetPrimaryRoleTitle] [SCOPE.sCharacter('expedition_leader').GetLastName] k označení tohoto činu za bezdůvodnou agresi, která musí být adekvátně potrestána." # todo: NEW TRANSLATION
 tibet_expedition_events.4.f: ""Jde o princip, ne o detaily! Byl porušen mezinárodní státní úděl, a je třeba učinit vhodná opatření k nápravě tohoto urážky diplomacie a naší suverenity! Mohl bych tam hned poslat pluk mužů #italic právě teď#!, kdybyste mi jen dal příkaz."" # todo: NEW TRANSLATION
 tibet_expedition_events.4.a: "Musíme být připraveni na odvážný krok." # todo: NEW TRANSLATION
 tibet_expedition_events.4.b: "Tato řeč o agresi je směšná!" # todo: NEW TRANSLATION
 tibet_expedition_events.5.t: "Velké horské měření" # todo: NEW TRANSLATION
 tibet_expedition_events.5.d: "Geodeti začali zkoumat hory a průsmyky obklopující Tibet. Ponořit se do neznámého terénu a vylézt na neprobádané hory je nebezpečné, ale [SCOPE.sCharacter('expedition_leader').GetPrimaryRoleTitle] [SCOPE.sCharacter('expedition_leader').GetLastName] chce být přesto zapojen." # todo: NEW TRANSLATION
 tibet_expedition_events.5.f: ""Viděl jsi ten vrchol? My #italic musíme#! ho vylézt!\"\n\n\"Ale proč?\"\n\n\"Protože... #italic je tam#!!\"" # todo: NEW TRANSLATION
 tibet_expedition_events.5.a: "Nemůžeme riskovat [SCOPE.sCharacter('expedition_leader').GetLastName], pošlete někoho jiného." # todo: NEW TRANSLATION
 tibet_expedition_events.5.b: "Andrew Scott Waugh je pro tu práci více než kvalifikovaný." # todo: NEW TRANSLATION
 tibet_expedition_events.5.c: "Pro Charlese Granville Brucee není žádný vrchol příliš těžký!" # todo: NEW TRANSLATION
 tibet_expedition_events.5.dd: "[SCOPE.sCharacter('expedition_leader').GetLastName] je náš muž na místě a měl by převzít velení." # todo: NEW TRANSLATION
 tibet_expedition_events.6.t: "Pijavky!" # todo: NEW TRANSLATION
 tibet_expedition_events.6.d: "Předhůří Himálaje jsou plná zradné flóry a fauny. Jedna slibná trasa na tibetské náhorní plošiny vede přes oblast plnou nemilého volně žijícího života. Pokud bude tato trasa použita, [SCOPE.sCharacter('expedition_leader').GetPrimaryRoleTitle] [SCOPE.sCharacter('expedition_leader').GetLastName] ji bude muset zkontrolovat [SCOPE.sCharacter('expedition_leader').GetHerselfHimself]." # todo: NEW TRANSLATION
 tibet_expedition_events.6.f: ""Ne."\n\n\"Ne. Ne ne ne.\"\n\nPrůzkumník se naposledy podíval na bažinatou vodu. Vyk vypustil chichot. \"Hahahahahaaa, #italic ne!#\"\n\nTohle bude problém někoho jiného, ne jeho." # todo: NEW TRANSLATION
 tibet_expedition_events.6.a: "[SCOPE.sCharacter('expedition_leader').GetLastName] to může a musí udělat." # todo: NEW TRANSLATION
 tibet_expedition_events.6.b: "Možná by bylo lepší odpočinout si v horském vzduchu." # todo: NEW TRANSLATION
 tibet_expedition_events.7.t: "Budování expedičního sboru" # todo: NEW TRANSLATION
 tibet_expedition_events.7.d: "S dostatečnou znalostí terénu před námi [SCOPE.sCharacter('expedition_leader').GetPrimaryRoleTitle] [SCOPE.sCharacter('expedition_leader').GetLastName] oznámil, že je připraven shromáždit vojsko a pokračovat vpřed na tibetskou náhorní plošinu." # todo: NEW TRANSLATION
 tibet_expedition_events.7.f: "Nemělo by to být tak obtížné. Byla to práce jako každá jiná, ale nějak... získat správné muže na tu práci bylo obtížnější, než kdo očekával. Bylo dost pravidelných mužů, samozřejmě, ale proč nepoužít to nejlepší z nejlepšího? Přišlo v úvahu dělo? Co koně? Důstojníci?\n\nPo dlouhém váhání si [SCOPE.sCharacter('expedition_leader').GetSheHe] konečně vybral své oblíbené cínové figurky a položil je na stůl. [SCOPE.sCharacter('expedition_leader').GetSheHe|U] se večer pustí do řešení dalších problémů expedice." # todo: NEW TRANSLATION
 tibet_expedition_events.7.a: "Expedici nesmí, nemůže chybět dostatek mužů." # todo: NEW TRANSLATION
 tibet_expedition_events.7.b: "Jen nejotrlejší vojáci čelí tomu, co přijde." # todo: NEW TRANSLATION
 tibet_expedition_events.7.c: "Potřebujeme neortodoxní přístup." # todo: NEW TRANSLATION
 tibet_expedition_events.8.t: "Do Himálaje" # todo: NEW TRANSLATION
 tibet_expedition_events.8.d: "S připravenými mapami a hotovými muži se může [SCOPE.sCharacter('expedition_leader').GetPrimaryRoleTitle] [SCOPE.sCharacter('expedition_leader').GetLastName] konečně vydat do Tibetu." # todo: NEW TRANSLATION
 tibet_expedition_events.8.f: ""Nejsme tu ani pro slávu, ani pro zlato." Důstojník pomalu procházel před řadou shromážděných mužů. "Ne pro sebe, alespoň. Nikdo si nás nebude pamatovat."\n\nZarazil prst směrem k rozlehlým horám v dálce. "Ale #italic tohle#! bude pamatováno. Chceme stát tady na zapomenutém chomáči trávy, nebo stát hrdě #italic tam#!, na skalách, které vydrží navěky?"" # todo: NEW TRANSLATION
 tibet_expedition_events.8.a: "Na střechu světa!" # todo: NEW TRANSLATION
 tibet_expedition_events.9.t: "[SCOPE.sCountry('expedition_country').GetAdjective] vměšování v Tibetu" # todo: NEW TRANSLATION
 tibet_expedition_events.9.d: "Náš vyslanec v Lhase přeposlal zprávy, že [SCOPE.sCountry('expedition_country').GetAdjective] jednotka vedená [SCOPE.sCharacter('expedition_leader').GetFullName] porušila hranice Tibetu a míří k hlavnímu městu." # todo: NEW TRANSLATION
 tibet_expedition_events.9.f: "Poklidný hlas velvyslance zrádně prozradil jeho propocené čelo. \"Ujišťuji vás,\" diktoval poslíčkovi, nervózně klopil prsty po stole, \"že v Tibetu je vše naprosto pod kontrolou.\"\n\nZastavil se a pečlivě si promyslel další slova jak mistr taktik. \"Bylo by však vhodné, aby vláda rychle zareagovala na tuto akci všemi prostředky, které za vhodné považuje, co nejrychleji.\"\n\nZhluboka vydechl. Teď je #italic na nich#!, aby ten zmatek vyřešili." # todo: NEW TRANSLATION
 tibet_expedition_events.9.a: "Tato nepokoj je pouhá maličkost. Není třeba nic dělat na záchranu Tibetu." # todo: NEW TRANSLATION
 tibet_expedition_events.9.b: "Vzneste protest na velvyslanectví [SCOPE.sCountry('expedition_country').GetName]." # todo: NEW TRANSLATION
 tibet_expedition_events.9.c: "To je nepřijatelné! Pošlete posily do Lhasy a sdělte jim, že mají naši podporu." # todo: NEW TRANSLATION
 tibet_expedition_events.10.t: "Přicházejí [SCOPE.sCountry('expedition_country').GetAdjective]!" # todo: NEW TRANSLATION
 tibet_expedition_events.10.d: "Přicházejí hlášení o [SCOPE.sCountry('expedition_country').GetAdjective] síle, která překročila hranici a míří k hlavnímu městu. Jde o zjevné porušení naší suverenity, ale postavit se [SCOPE.sCountry('expedition_country').GetName] může být pro nás samotné příliš." # todo: NEW TRANSLATION
 tibet_expedition_events.10.f: ""Ne, neodvážili jsme se na ně střílet!" koktal strážný. \"Tam jste nebyl! Neviděl jste, kolik mužů přicházelo! Neviděl jste jejich zbraně! Byli jsme jen desítka – museli jsme ustoupit!\"" # todo: NEW TRANSLATION
 tibet_expedition_events.10.a: "Musíme teď koukat jiným směrem." # todo: NEW TRANSLATION
 tibet_expedition_events.10.b: "Ať už jsou silní jacíkoliv, teď se musíme bránit!" # todo: NEW TRANSLATION
 tibet_expedition_events.11.t: "Zablokovat [SCOPE.sCountry('expedition_country').GetAdjective] jednotku?" # todo: NEW TRANSLATION
 tibet_expedition_events.11.d: "Incursion [SCOPE.sCountry('expedition_country').GetAdjective] pokračuje v postupu směrem k našemu hlavnímu městu. Abychom získali čas, mohli bychom nařídit hlídkám postavit jednoduché zátarasy podél nejpravděpodobnějších tras [SCOPE.sCountry('expedition_country').GetAdjective] jednotky.\n\n#N To může vést k incidentům s [SCOPE.sCountry('expedition_country').GetNameNoFormatting].#!" # todo: NEW TRANSLATION
 tibet_expedition_events.11.f: "Byl to na první pohled jednoduchý návrh. Když má být nepřítel zastaven, musí narazit na skutečný odpor. Ale... můžeme si dovolit přímý střet? To byla otázka, která sužovala mysli každého ministra a generála, kteří se problémem zabývali." # todo: NEW TRANSLATION
 tibet_expedition_events.11.a: "Nemůžeme riskovat boj. Nech je projít." # todo: NEW TRANSLATION
 tibet_expedition_events.11.b: "Zátaras neuškodí. Zdržte je při příští příležitosti." # todo: NEW TRANSLATION
 tibet_expedition_events.12.t: "Expedice [SCOPE.sCharacter('expedition_leader').GetLastName] je zablokována" # todo: NEW TRANSLATION
 tibet_expedition_events.12.d: "Jedna [SCOPE.sCountry('tibet_scope').GetAdjective] hlídka postavila zátaras na trase expedice [SCOPE.sCharacter('expedition_leader').GetPrimaryRoleTitle] [SCOPE.sCharacter('expedition_leader').GetLastName]. Jakékoliv zpoždění postupu expedice by mohlo být katastrofální pro projekt." # todo: NEW TRANSLATION
 tibet_expedition_events.12.f: "[SCOPE.sCharacter('expedition_leader').GetFullNameNoFormatting] se mračil při pohledu na to, co měl před sebou. Množství tibetských vojáků stojících napříč cestou vypadalo hrozivě, ale [SCOPE.sCharacter('expedition_leader').GetSheHe] věděl, jaké zbraně přivezl s expedicí. Problémem nebylo projít zátarasem – problémem byla cena, kterou za to zaplatí." # todo: NEW TRANSLATION
 tibet_expedition_events.12.a: "Udělejme z toho co největší zisk! Vpřed!" # todo: NEW TRANSLATION
 tibet_expedition_events.12.b: "To by byla krveprolití – stáhněme se." # todo: NEW TRANSLATION
 tibet_expedition_events.13.t: "[SCOPE.sCountry('expedition_country').GetAdjective] střet v Tibetu" # todo: NEW TRANSLATION
 tibet_expedition_events.13.d: "Přišly zprávy o krvavém střetu mezi [SCOPE.sCountry('expedition_country').GetAdjective] expedicí a místními tibetskými silami. Naší povinností vůči [SCOPE.sCountry('tibet_scope').GetName] je jim pomoci, ale někteří ministři vyjádřili nechuť posilovat vládu v [SCOPE.sCountry('tibet_scope').GetCapital.GetName] vůbec." # todo: NEW TRANSLATION
 tibet_expedition_events.13.f: ""Co se stalo v tom průsmyku, je hanba, tragédie!\"\n\n\"Je to těžká urážka jim i nám!\"\n\n\"Takže pánové, jaký je náš další krok? Máme jim pomoci přímo? Vydat se na hranici? Dodávat zbraně?\"\n\nNásledující trapné ticho přerušilo pouze suché zakašlání." # todo: NEW TRANSLATION
 tibet_expedition_events.13.a: "Nemůžeme poskytnout žádnou materiální pomoc." # todo: NEW TRANSLATION
 tibet_expedition_events.13.b: "Podpoříme tibetskou armádu." # todo: NEW TRANSLATION
 tibet_expedition_events.14.t: "Himalájská vánice" # todo: NEW TRANSLATION
 tibet_expedition_events.14.d: "Expedice [SCOPE.sCharacter('expedition_leader').GetPrimaryRoleTitle] [SCOPE.sCharacter('expedition_leader').GetLastName] byla zadržena divokým a neočekávaným počasím na jedné z nejtěžších cest směrem k [SCOPE.sCountry('tibet_scope').GetCapital.GetName]. Zpoždění mohou být drahá, ale prorazit počasí může být ještě nákladnější." # todo: NEW TRANSLATION
 tibet_expedition_events.14.f: "Zmrzlý vítr fičel pod botami [SCOPE.sCharacter('expedition_leader').GetLastNameNoFormatting] a kolem jeho prstů. Mráz kousal zem pod nimi. Bylo hluboko pod nulou, a přesto [SCOPE.sCharacter('expedition_leader').GetSheHe] slyšel, jak někdo z vojáků křičí. [SCOPE.sCharacter('expedition_leader').GetSheHe|U] předpokládal, že jde o sníh, ale sotva viděl za špičkou svého nosu a nedokázal říct, kde ten voják je, natož co se kolem nich děje." # todo: NEW TRANSLATION
 tibet_expedition_events.14.a: "Musíme čelit sněhu a tlačit se dál!" # todo: NEW TRANSLATION
 tibet_expedition_events.14.b: "Lépe hrát na jistotu a přestát tuto bouři." # todo: NEW TRANSLATION
 tibet_expedition_events.18.t: "Gyantse Dzong" # todo: NEW TRANSLATION
 tibet_expedition_events.18.d: "Obrovský opevněný klášter ční z tibetské skály – Gyantse Dzong, žulový strážce údolí Tsangpo a jeden z klíčových přístupů k Lhase. Dokud není tato pevnost ovládána našimi vojáky, žádná trasa k hlavnímu městu nebude bezpečná." # todo: NEW TRANSLATION
 tibet_expedition_events.18.f: "Nepřístupná pevnost se tyčila nad okolní krajinou. Blízké vesnice byly v porovnání s kamenným obrem jako tečky prachu. Poctivé zdi a starobylé síně nesly ozvěny staletí bojů, pýchy, modliteb, bitev a intrik. Stála jako trvalé svědectví vůlí generací vůdců.\n\nDělostřelecký nápor [SCOPE.sCharacter('expedition_leader').GetLastNameNoFormatting] by ji mohl zničit během dne." # todo: NEW TRANSLATION
 tibet_expedition_events.18.a: "Oblěhněte tu pevnost hned teď!" # todo: NEW TRANSLATION
 tibet_expedition_events.18.b: "Nejsme tu pro krev – vyjednejte jejich kapitulaci." # todo: NEW TRANSLATION
 tibet_expedition_events.19.t: "Neoprávněné plenění" # todo: NEW TRANSLATION
 tibet_expedition_events.19.d: "Když se vojáci [SCOPE.sCharacter('expedition_leader').GetLastName] blíží k [SCOPE.sCountry('tibet_scope').GetName], někteří z nich se začali chovat neukázněně. Přišly zprávy o skupinách našich mužů, které vcházely do domů a klášterů a braly si, co se jim zlíbí." # todo: NEW TRANSLATION
 tibet_expedition_events.19.f: ""Ujišťuji vás, pane, že je to zcela v mezích přijatelného. Byli jsme přece napadeni, a je očekávatelné, že po tom budou následovat určité kroky. I když samozřejmě zprávy z toho jednoho kláštera musí být přehnané."" # todo: NEW TRANSLATION
 tibet_expedition_events.19.a: "A co? Takové jsou armády." # todo: NEW TRANSLATION
 tibet_expedition_events.19.b: "Zajistěte kázeň u vojáků a omluvte se místním úředníkům." # todo: NEW TRANSLATION
 tibet_expedition_events.20.t: "Vydání ultimáta" # todo: NEW TRANSLATION
 tibet_expedition_events.20.d: "S naší expedicí poblíž [SCOPE.sCountry('tibet_scope').GetCapital.GetCityHubName] je čas řešit trnitou otázku diplomatických kanálů. Musíme promluvit s tím, kdo má nad těmito zeměmi konečnou pravomoc." # todo: NEW TRANSLATION
 tibet_expedition_events.20.f: "Našel důstojníka shrbeného nad stolem, křičícího do dlaní.\n\n\"Promluvíš si s jedním úředníkem a ten tě posílá k dalšímu. Pak si promluvíš s tímhle chlapíkem a on řekne, že máš špatného muže, a ukáže tě na třetího. Pak ten třetí— ten třetí řekne, že se mýlíš, a ten #italic první#! je ten, kdo má veškerou pravomoc.\"\n\n\"Ó, kde to končí? Kdo má pravomoc? Jsem #italic já#! vůbec v čele?\"" # todo: NEW TRANSLATION
 tibet_expedition_events.20.a: "Vydáme naše požadavky [SCOPE.sCountry('tibet_scope').GetName], samozřejmě." # todo: NEW TRANSLATION
 tibet_expedition_events.20.b: "Promluvte přímo s [SCOPE.sCountry('overlord_of_tibet').GetName]." # todo: NEW TRANSLATION
 sending_tibet_ultimatum_tt: "[SCOPE.sCharacter('expedition_leader').GetFullName] vstupuje do jednání s [SCOPE.sCountry('tibet_scope').GetName]." # todo: NEW TRANSLATION
 sending_tibet_overlord_ultimatum_tt: "[SCOPE.sCharacter('expedition_leader').GetFullName] vstupuje do jednání s [SCOPE.sCountry('overlord_of_tibet').GetName]." # todo: NEW TRANSLATION
 tibet_expedition_events.21.t: "Ultimátum [SCOPE.sCountry('expedition_country').GetAdjective]" # todo: NEW TRANSLATION
 tibet_expedition_events.21.d: "Navzdory našemu nejlepšímu úsilí dorazila [SCOPE.sCountry('expedition_country').GetAdjective] expedice až k našemu hlavnímu městu. Jejich nákladná požadavky jsou jednoduché: podřiďte se jejich autoritě." # todo: NEW TRANSLATION
 tibet_expedition_events.21.f: ""Je to docela jednoduché," ušklíbl se [SCOPE.sCountry('expedition_country').GetAdjectiveNoFormatting] vyslanec. \"Už znáte štíra. Proč se neobrátit na nás místo toho? Přerušte styky s ostatními mocnostmi a nechte to na nás.\"" # todo: NEW TRANSLATION
 tibet_expedition_events.21.a: "Podřídíme se [SCOPE.sCountry('expedition_country').GetName]." # todo: NEW TRANSLATION
 tibet_expedition_events.21.b: "Váš ukáz síly nic neznamená! #bold Odejděte odsud okamžitě, s prázdnýma rukama!#!" # todo: NEW TRANSLATION
 tibet_expedition_events.22.t: "Ultimátum [SCOPE.sCountry('expedition_country').GetAdjective]" # todo: NEW TRANSLATION
 tibet_expedition_events.22.d: "Expedice [SCOPE.sCountry('expedition_country').GetAdjective] do Tibetu podlomila naši autoritu v regionu a nyní požadují, abychom jim oficiálně postoupili kontrolu. Jde o těžkou urážku, ale máme se jim postavit nyní?" # todo: NEW TRANSLATION
 tibet_expedition_events.22.f: ""Je to docela jednoduché," ušklíbl se [SCOPE.sCountry('expedition_country').GetAdjectiveNoFormatting] vyslanec. \"Vy jste byli štír, ale teď je čas, abychom my použili žihadlo. Nechte nás spravovat tento kus himálajského kamene a my vás necháme být a konečně to ukončíme.\"" # todo: NEW TRANSLATION
 tibet_expedition_events.22.a: "Podřídíme se požadavkům [SCOPE.sCountry('expedition_country').GetName]." # todo: NEW TRANSLATION
 tibet_expedition_events.22.b: "Váš ukáz síly nic neznamená! #bold Odejděte odsud okamžitě, s prázdnýma rukama!#!" # todo: NEW TRANSLATION
 tibet_expedition_events.26.t: "Dohoda v [SCOPE.sCountry('tibet_scope').GetCapital.GetCityHubName]" # todo: NEW TRANSLATION
 tibet_expedition_events.26.d: "Expedice [SCOPE.sCountry('expedition_country').GetAdjective] přímo přistoupila k [SCOPE.sCountry('tibet_scope').GetAdjective] úředníkům a donutila je uznat suverenitu [SCOPE.sCountry('expedition_country').GetAdjective]. Nyní jsou poddaní [SCOPE.sCountry('expedition_country').GetName]." # todo: NEW TRANSLATION
 tibet_expedition_events.26.f: ""Je to docela jednoduché," ušklíbl se [SCOPE.sCountry('expedition_country').GetAdjectiveNoFormatting] vyslanec. \"Měli jsme jednoduchou rozpravu s těmi, na kterých záleží, a teď jsou naši. Znali štíra, a teď je čas, aby poznali nás.\" Zasmál se a mávl úředníky [SCOPE.sCountry('ex_tibetan_overlord').GetAdjectiveNoFormatting] pryč." # todo: NEW TRANSLATION
 tibet_expedition_events.26.a: "[SCOPE.sCountry('tibet_scope').GetAdjective] území bude navždy naše!" # todo: NEW TRANSLATION
 tibet_expedition_events.26.b: "[SCOPE.sCountry('expedition_country').GetName] musí [SCOPE.sCountry('tibet_scope').GetNameNoFormatting] #bold nyní vrátit.#!" # todo: NEW TRANSLATION
 tibet_expedition_events.27.t: "Dohoda v [SCOPE.sCountry('tibet_scope').GetCapital.GetCityHubName]" # todo: NEW TRANSLATION
 tibet_expedition_events.27.d: "Expedice do Tibetu vedená [SCOPE.sCharacter('expedition_leader').GetPrimaryRoleTitle] [SCOPE.sCharacter('expedition_leader').GetFullName] byla ohromným úspěchem a tento strategický region je nyní pod naší kontrolou. [SCOPE.sCharacter('expedition_leader').GetLastName] je již oslavován v [ROOT.GetCountry.GetCapital.GetCityHubName] a [SCOPE.sCharacter('expedition_leader').GetSheHe] má před sebou zářnou budoucnost." # todo: NEW TRANSLATION
 tibet_expedition_events.27.f: ""Je to jednoduché, opravdu." Kouř z cigary se vznášel, zatímco muž gestikuloval na mapu na zdi s doutnajícím cigárem. "#italic To#! bylo naše slabé místo. Bylo nezbytné vylít kolik mužů a zlata bylo potřeba, abychom zajistili, eh..." Zastavil se, když se snažil přehlédnout závoj tabákového kouře, "Tibet! Museli jsme zabezpečit Tibet, abychom se zachránili."\n\nOtočil se zpátky k ostatním v klubu. "Tak! Kdo je připraven na kulečník?"" # todo: NEW TRANSLATION
 tibet_expedition_events.27.a: "Tři hurá pro [SCOPE.sCharacter('expedition_leader').GetFullName]!" # todo: NEW TRANSLATION
 tibet_expedition_events.29.t: "Divoká kočka" # todo: NEW TRANSLATION
 tibet_expedition_events.29.d: "Naše expedice narazila na zvířecí doupě při přechodu zrádného horského průsmyku. Vyšetřování odhalilo, že je obydleno vzácným zvířetem – manulem (Pallasova kočka)." # todo: NEW TRANSLATION
 tibet_expedition_events.29.f: "Když snížil lucernu, aby nahlédl do hlubin doupěte, zněly k němu zpět zlé zlaté oči. Kulaté zorničky a znaky kolem nich mu dávaly zvláštní nádech lidskosti, jako by to byl vousatý muž se svraštělým obočím. Kočka ho posuzovala, pomyslel si expedicionář, a byla se zabydlená stejně dobře jako kterýkoli voják v zákopech.\n\nPosunul úhel světla a tři menší páry očí mu zíraly zpět. Matka ve svém doupěti, chránící tři koťata, která byla právě dost stará na to, aby syčela na světlo. Botanické zahrady by za ně dobře zaplatily, ale vyrovná to prsty, které by to stálo?" # todo: NEW TRANSLATION
 tibet_expedition_events.29.a: "Chyťte je a pošlete do [ROOT.GetCountry.GetCapital.GetCityHubName]." # todo: NEW TRANSLATION
 tibet_expedition_events.29.b: "Nádherná kůže, připravená na získání!" # todo: NEW TRANSLATION
 tibet_expedition_events.29.c: "Pořiďme si záznamy, ale nechte je být." # todo: NEW TRANSLATION
