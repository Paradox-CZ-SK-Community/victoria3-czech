 alexei_health_deteriorates_tt: "\n@warning! Dokud [SCOPE.sCharacter('rasputin_scope').GetFullName] #b není#! [concept_favorite] vládce [ROOT.GetCountry.GetRuler.GetFullNameWithTitle], [SCOPE.sCharacter('alexei_scope').GetFullName] pravděpodobně zemře na [GetCharacterTrait('hemophilia').GetName]" # todo: NEW TRANSLATION
 alexei_health_improves_tt: "\n@information! Dokud je [SCOPE.sCharacter('rasputin_scope').GetFullName] [concept_favorite] vládce [ROOT.GetCountry.GetRuler.GetFullNameWithTitle], [SCOPE.sCharacter('alexei_scope').GetFullName] má díky požehnání [SCOPE.sCharacter('rasputin_scope').GetLastNameNoFormatting] menší šanci zemřít na [GetCharacterTrait('hemophilia').GetName] #tooltippable;tooltip:[GetPlayer.GetTooltipTag],modifier_faith_healing_tt $modifier_faith_healing$#!" # todo: NEW TRANSLATION
 rasputin.2.t: "Svatý ďábel" # todo: NEW TRANSLATION
 rasputin.2.d: "Zprávy o podivném chování [SCOPE.sCharacter('rasputin_scope').GetFullName] a jeho rostoucím vlivu na [ROOT.GetCountry.GetRuler.GetFullNameWithTitle] velmi znepokojily [SCOPE.gsInterestGroup('relevant_ig').GetAltName('A')]. [SCOPE.sCharacter('relevant_leader_scope').GetFullName] požaduje okamžité propuštění [SCOPE.sCharacter('rasputin_scope').GetLastNameNoFormatting]." # todo: CHANGED (predtym: Zprávy o podivném chování [SCOPE.sCharacter('rasputin_scope').GetFullName] a jeho rostoucím vlivu na [ROOT.GetCountry.Ge)
 rasputin.2.f: "Nedávno propuštěná vychovatelka, která se po léta svědomitě starala o děti [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle], neváhala vyprávět o svém skandálním setkání s drzým lidovým léčitelem. Jeho chování překračuje všechny meze a je nepřístojné. Taková rouhačská postava jistě poškodí nejen pověst císařské rodiny, ale i celé země [ROOT.GetCountry.GetNameNoFormatting].\n\nBývalá vychovatelka využívá všech svých společenských vazeb, aby se dostala na audienci u velkokněžny. Naléhá na ni, aby domluvila své sestře, [ROOT.GetCountry.GetCustom('get_rus_consort_title')]: „Za všechna ta léta jsem nikdy neviděla, že by se nevychovaný mužik volně potuloval po paláci, natož v dětských pokojích!“" # todo: NEW TRANSLATION
 rasputin.2.a: "[SCOPE.sCharacter('rasputin_scope').GetLastNameNoFormatting] zůstane." # todo: NEW TRANSLATION
 rasputin.2.b: "Vyhostit [SCOPE.sCharacter('rasputin_scope').GetLastNameNoFormatting]." # todo: NEW TRANSLATION
 modifier_rasputin_not_dismissed: "Svatý ďábel zůstává" # todo: NEW TRANSLATION
 revoke_rasputin_favorite_effect_tt: "[SCOPE.sCharacter('rasputin_scope').GetFullName] již nebude [concept_favorite] vládce [ROOT.GetCountry.GetRuler.GetFullNameWithTitle]" # todo: NEW TRANSLATION
 rasputin.3.t: "Napadení [SCOPE.sCharacter('rasputin_scope').GetFullNameNoFormatting]" # todo: NEW TRANSLATION
 rasputin.3.d: "V časných ranních hodinách se někdo pokusil zavraždit [SCOPE.sCharacter('rasputin_scope').GetFullName] nedaleko [SCOPE.sCharacter('rasputin_scope').GetHerHis] domova. [SCOPE.sCharacter('rasputin_scope').GetSheHe|U] utrpěl vážná zranění a potřebuje lékařskou péči." # todo: NEW TRANSLATION
 rasputin.3.f: "Císařská rodina se o pokusu zavraždit [SCOPE.sCharacter('rasputin_scope').GetFullNameNoFormatting] dozví během prázdninové plavby. Telegram jim oznamuje, že [SCOPE.sCharacter('rasputin_scope').GetSheHe] po operaci bojuje o [SCOPE.sCharacter('rasputin_scope').GetHerHis] život a je na pokraji smrti. Zatímco osud lidového léčitele zůstává nejistý, [ROOT.GetCountry.GetCustom('get_rus_consort_title')] na palubě lodi propadá zoufalství. Denně se modlí a doufá, že zachránce jejího syna přežije.\n\n„Má duše je soužena,“ naříká [ROOT.GetCountry.GetCustom('get_rus_consort_title')]. „Bude můj požehnaný spasitel brzy patřit minulosti?“" # todo: NEW TRANSLATION
 rasputin.3.a: "Zajistit [SCOPE.sCharacter('rasputin_scope').GetLastNameNoFormatting] tu nejlepší péči." # todo: NEW TRANSLATION
 rasputin.3.b: "Nechat [SCOPE.sCharacter('rasputin_scope').GetLastNameNoFormatting]ovo uzdravení náhodě." # todo: NEW TRANSLATION
 rasputin_dies_tt: "[SCOPE.sCharacter('rasputin_scope').GetFullNameNoFormatting] umírá na [SCOPE.sCharacter('rasputin_scope').GetHerHis] zranění" # todo: NEW TRANSLATION
 rasputin_lives_tt: "#b [SCOPE.sCharacter('rasputin_scope').GetFullNameNoFormatting] přežije, jen tak tak#!" # todo: NEW TRANSLATION
 modifier_survived_assassination: "Přežil pokus o atentát" # todo: NEW TRANSLATION
 modifier_rasputin_legit_instability: "Svatý ďábel přežil" # todo: NEW TRANSLATION
 modifier_tsar_saved_rasputin: "Zachránil neoblíbeného oblíbence" # todo: NEW TRANSLATION
 rasputin.4.t: "Pokus o atentát na [SCOPE.sCharacter('rasputin_scope').GetFullNameNoFormatting]" # todo: NEW TRANSLATION
 rasputin.4.d2: "Nalákán příslibem setkání s princeznou Irinou na večírku pořádaném při příležitosti kolaudace domu, byl [SCOPE.sCharacter('rasputin_scope').GetFullName] po hrůzném útoku nalezen ve sklepení Jusupovského paláce na pokraji smrti. Vyšetřovatelé označili za strůjce tohoto spiknutí [SCOPE.sCharacter('conspirator_scope').GetFullName]." # todo: NEW TRANSLATION
 rasputin.4.d: "Došlo k dalšímu pokusu o život [concept_favorite] vládce [ROOT.GetCountry.GetRuler.GetFullNameWithTitle]. [SCOPE.sCharacter('rasputin_scope').GetFullName] byl nalezen na pokraji smrti poté, co ho [SCOPE.GetRootScope.GetCountry.GetCustom('rasputin_death_perpetrator')] [SCOPE.GetRootScope.GetCountry.GetCustom('rasputin_death_reason')]." # todo: NEW TRANSLATION
 rasputin.4.f: "Zachránce [SCOPE.sCharacter('alexei_scope').GetFullNameNoFormatting] se u dvora stal nepřítelem země [ROOT.GetCountry.GetNameNoFormatting]. Přestože spiklenci zosnovali řadu plánů, jak císařskou rodinu zbavit vlivu [SCOPE.sCharacter('rasputin_scope').GetHerHis], [SCOPE.sCharacter('rasputin_scope').GetLastNameNoFormatting] se drží života, ačkoli mu smrt dýchá na záda. Došel však už tomuto lidovému léčiteli životní štěstí?\n\nPo celém městě [ROOT.GetCountry.GetCapital.GetCityHubName] lidé zatajují dech a čekají, jaký osud potká oblíbeného císařského #italic starce#!." # todo: NEW TRANSLATION
 rasputin.4.a: "Kvůli [SCOPE.sCharacter('alexei_scope').GetFullName] musí [SCOPE.sCharacter('rasputin_scope').GetLastNameNoFormatting] přežít." # todo: NEW TRANSLATION
 rasputin.4.b: "Osud [SCOPE.sCharacter('rasputin_scope').GetLastNameNoFormatting] je v rukou Božích." # todo: NEW TRANSLATION
 rasputin_ig_instability_tt: "Uděluje modifikátor #tooltippable;tooltip:[GetPlayer.GetTooltipTag],modifier_rasputin_ig_instability_tt $modifier_rasputin_ig_instability$#! po dobu #v [GetPlayer.MakeScope.ScriptValue('display_normal_modifier_time')]#! let #b každé#! [concept_interest_group] [concept_in_government], které jej ještě nemá" # todo: NEW TRANSLATION
