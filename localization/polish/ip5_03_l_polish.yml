 rasputin.5.t: "Princovy obavy" # todo: NEW TRANSLATION
 rasputin.5.d: "Byl objeven usvědčující dopis, jehož autorem je [SCOPE.sCharacter('felix_scope').GetFullName], významný aristokrat, který je ženatý s neteří [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]. [SCOPE.sCharacter('felix_scope').GetLastNameNoFormatting] se nijak netají tím, že [SCOPE.sCharacter('felix_scope').GetSheHe] důrazně odmítá vliv [SCOPE.sCharacter('rasputin_scope').GetLastName] u dvora, a obrátil se na [SCOPE.sCharacter('relevant_character_scope').GetFullName] s žádostí o podporu při odstranění #italic starce#!." # todo: NEW TRANSLATION
 rasputin.5.f: "„Není divu, že mnoho mužů i žen zlákají přísliby metod tohoto starce. Magnetismus hypnotických schopností a pronikavého pohledu [SCOPE.sCharacter('rasputin_scope').GetLastNameNoFormatting] nelze popřít,“ píše [SCOPE.sCharacter('felix_scope').GetFullNameNoFormatting]. „[SCOPE.sCharacter('rasputin_scope').GetHerHis|U] další působení u dvora je neúnosné a nyní se obávám, že [SCOPE.sCharacter('rasputin_scope').GetSheHe] představuje hrozbu pro budoucnost země [ROOT.GetCountry.GetNameNoFormatting]. [SCOPE.sCharacter('rasputin_scope').GetLastNameNoFormatting] musí odejít. [SCOPE.sCharacter('relevant_character_scope').GetLastNameNoFormatting], podpoříte mě v tomto úsilí? Vyzývám vás, abyste zvážil svůj postoj k této záležitosti.“" # todo: NEW TRANSLATION
 rasputin.5.a: "Rod [SCOPE.sCharacter('felix_scope').GetLastNameNoFormatting] zůstane vždy věrný zájmům [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]." # todo: NEW TRANSLATION
 rasputin.5.b: "Princ by měl být při řeči o [SCOPE.sCharacter('rasputin_scope').GetLastNameNoFormatting] opatrný." # todo: NEW TRANSLATION
 modifier_felix_ig_upset: "Princovy obavy ignorovány" # todo: NEW TRANSLATION
