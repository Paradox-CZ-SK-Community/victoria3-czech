 rasputin.1.t: "Léčitel [SCOPE.sCharacter('alexei_scope').GetFullNameNoFormatting]" # todo: NEW TRANSLATION
 rasputin1t_tt: "Léčitel Alexeje Romanova" # todo: NEW TRANSLATION
 rasputin.1.d: "[SCOPE.sCharacter('rasputin_scope').GetFullName], léčitel z oblasti [GetStateRegion('STATE_TOBOLSK').GetName], se objevil ve chvíli, kdy [SCOPE.sCharacter('alexei_scope').GetFullName] ležel na [SCOPE.sCharacter('alexei_scope').GetHerHis] smrtelné posteli. [ROOT.GetCountry.GetCustom('get_rus_consort_title')], ohromená [SCOPE.sCharacter('rasputin_scope').GetHerHis] zázračným působením, si přeje jmenovat [SCOPE.sCharacter('rasputin_scope').GetHerHim] [concept_favorite]." # todo: NEW TRANSLATION
 rasputin.1.f: "[ROOT.GetCountry.GetCustom('get_rus_consort_title')] neopouští lůžko [SCOPE.sCharacter('alexei_scope').GetFullNameNoFormatting], a [SCOPE.sCharacter('alexei_scope').GetSheHe] trpí život ohrožujícím krvácením. Vroucně se modlí a pokaždé se rozpláče, když [SCOPE.sCharacter('alexei_scope').GetFirstNameNoFormatting] vykřikne bolestí. Když jí lékaři oznámí, že [SCOPE.sCharacter('alexei_scope').GetFirstNameNoFormatting] nejspíš nepřežije noc, [ROOT.GetCountry.GetCustom('get_rus_consort_title')] zoufale povolá lidového léčitele z oblasti $STATE_TOBOLSK$.\n\nLéčitel dorazí záhy a sebejistě vstoupí dovnitř. [SCOPE.sCharacter('rasputin_scope').GetFullNameNoFormatting] se postaví k nohám [SCOPE.sCharacter('alexei_scope').GetFirstNameNoFormatting]ovy postele a začne se modlit. Brzy horečka ustoupí, krvácení přestane a [SCOPE.sCharacter('alexei_scope').GetFirstNameNoFormatting] má opět jasné a zářivé oči. Nebezpečí pominulo." # todo: NEW TRANSLATION
 rasputin.1.a: "Jmenovat [SCOPE.sCharacter('rasputin_scope').GetFullNameNoFormatting] [concept_favorite]." # todo: NEW TRANSLATION
 rasputin.1.b: "Žádný zázrak se nekonal, byla to pouhá náhoda." # todo: NEW TRANSLATION
