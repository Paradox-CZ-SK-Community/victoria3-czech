l_polish:
 je_russification: "Západní hranice" # todo: NEW TRANSLATION
 je_russification_reason: "Léta politických soupeření a válek utvářela hranice našich západních pohraničních oblastí. Po [Glossary('glossary_annexation_of_finland','annexation of $FIN|q$ in 1809')] a [Glossary('glossary_establishment_of_congress_poland','$dyn_c_congress_poland|q$ in 1815')] byly učiněny ústupky, aby byla zajištěna podpora vyšších vrstev. Jinde v [Glossary('glossary_annexation_baltic_governorates','Baltic borderlands')], kde si šlechta zachovala místní výsady, zůstalo uspořádání společnosti i hospodářství oddělené od samotného jádra správy [ROOT.GetCountry.GetAdjectiveNoFormatting]. Naši vládu na západ od [ROOT.GetCountry.GetCapital.GetCityHubName] lze ochránit pouze administrativním začleněním tohoto regionu." # todo: NEW TRANSLATION
 je_russification_map_owned_tt: "[THIS.GetState.GetCustom('je_russification_state_owned_by_russia')] $je_russification_is_owned_by_tt$" # todo: NEW TRANSLATION
 je_russification_map_incorporated_tt: "[THIS.GetState.GetCustom('je_russification_state_is_incorporated')] $TRIGGER_IS_INCORPORATED$" # todo: NEW TRANSLATION
 je_russification_map_turmoil_tt: "[THIS.GetState.GetCustom('je_russification_state_turmoil')] [concept_turmoil] je nižší než [THIS.ScriptValue('je_russification_state_turmoil_max')|v%1] ([THIS.GetState.CalcTurmoil|v%1])" # todo: NEW TRANSLATION
 je_russification_map_culture_tt: "[THIS.GetState.GetCustom('je_russification_state_is_assimilated')] [THIS.ScriptValue('je_russification_state_russian_culture_min')|v%1] [GetCulture('russian').GetName] [concept_culture] ([THIS.ScriptValue('russian_culture_fraction')|v%1])" # todo: NEW TRANSLATION
 je_russification_is_owned_by_tt: "Je vlastněno státem [SelectLocalization(ROOT.GetCountry.IsValid, ROOT.GetCountry.GetName, 'RUS')]" # todo: NEW TRANSLATION
 russification.1.t: "Za hranicemi [ROOT.GetCountry.GetCapital.GetCityHubName]" # todo: NEW TRANSLATION
 russification.1.d1: "Představitelé se obávají, že zahraniční vliv ohrožuje dlouhodobou stabilitu a celistvost našich západních pohraničních oblastí. Musíme upevnit svou moc za hranicemi [ROOT.GetCountry.GetCapital.GetCityHubName]." # todo: NEW TRANSLATION
 russification.1.d2: "Snaha státu $PRU$ o sjednocení Německa ohrožuje stabilitu našich západních pohraničních oblastí. Musíme upevnit svou moc za hranicemi [ROOT.GetCountry.GetCapital.GetCityHubName]." # todo: NEW TRANSLATION
 russification.1.d3: "Představitelé v [ROOT.GetCountry.GetCapital.GetCityHubName] začali mít obavy, že úspěšné sjednocení $GER$ ohrozí stabilitu našich západních pohraničních oblastí. Musíme v regionu upevnit svou moc, abychom ochránili své zájmy." # todo: NEW TRANSLATION
 russification.1.f: "„...ačkoli nejsou původem Rusové, měli by postupně a vědomě přijmout zdravé státní principy, na nichž spočívá prosperita mocného ruského státu...“\n\n–S. P. Suchodolskij, #italic zpráva kovenského gubernátora z roku 1896#!" # todo: NEW TRANSLATION
 russification.1.a: "Zaměřme své úsilí na oblast [GetGeographicRegion('geographic_region_finland_old').GetName]." # todo: NEW TRANSLATION
 russification.1.b: "Věnujme pozornost oblasti [GetGeographicRegion('geographic_region_baltic_states_old').GetName]." # todo: NEW TRANSLATION
 russification.1.c: "Musíme se soustředit na oblast [GetGeographicRegion('geographic_region_poland_old').GetName]." # todo: NEW TRANSLATION
 russification.1.d: "Investice mimo [ROOT.GetCountry.GetCapital.GetCityHubName] jsou nyní nad naše síly." # todo: NEW TRANSLATION
 modifier_regional_russification_payments: "Administrativní náklady" # todo: NEW TRANSLATION
 modifier_regional_russification_efforts: "Regionální úsilí" # todo: NEW TRANSLATION
 russification.2.t: "[ROOT.GetCountry.GetAdjectiveNoFormatting] z vůle panovníka" # todo: NEW TRANSLATION
 russification.2.d: "Úspěšným začleněním západních pohraničních oblastí jsme zajistili budoucnost [ROOT.GetCountry.GetNameNoFormatting] na západě." # todo: NEW TRANSLATION
 russification.2.f: "Západní pohraniční oblasti, dosud oddělené od samotného jádra správy [ROOT.GetCountry.GetAdjectiveNoFormatting], byly nyní začleněny. Představitelé v [ROOT.GetCountry.GetCapital.GetCityHubName] jsou s výsledky nadmíru spokojeni. Chválí [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] za úspěch v rámci jeho ambiciózního programu.\n\nJeden [ROOT.GetCountry.GetAdjectiveNoFormatting] úředník píše [SCOPE.sCharacter('relevant_character').GetFullNameNoFormatting]: „Budoucnost [ROOT.GetCountry.GetNameNoFormatting] na západě je slibná. Váš vliv bezpochyby přesvědčil [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle], aby v tomto velkolepém podniku rozhodně zakročil.“" # todo: NEW TRANSLATION
 russification.2.a: "Naše moc na západě nebude zpochybňována." # todo: NEW TRANSLATION
 russification.2.b: "Vláda [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] je stejně pevná jako kdykoli předtím." # todo: NEW TRANSLATION
 modifier_je_russification_secured_ext: "Západní hranice zajištěna" # todo: NEW TRANSLATION
 modifier_je_russification_secured_int: "Obnovené ambice" # todo: NEW TRANSLATION
 modifier_je_russification_ig_str: "Zisky na západě" # todo: NEW TRANSLATION
 modifier_je_russification_loyal_prominence_gain: "Příznivá budoucnost" # todo: NEW TRANSLATION
 russification_2b_character_modifier_tt: "[concept_character], který je [concept_favorite] nebo [concept_leader], získá na #v [GetPlayer.MakeScope.ScriptValue('display_long_modifier_time')]#! let #tooltippable;tooltip:[GetPlayer.GetTooltipTag],modifier_je_russification_loyal_prominence_gain_tt $modifier_je_russification_loyal_prominence_gain$#!" # todo: NEW TRANSLATION
 modifier_je_russification_loyal_prominence_gain_tt: "[GetStaticModifier('modifier_je_russification_loyal_prominence_gain').GetName|v]\n[GetStaticModifier('modifier_je_russification_loyal_prominence_gain').GetDesc]" # todo: NEW TRANSLATION
 russification.3.t: "Rozbité hranice" # todo: NEW TRANSLATION
 russification.3.d: "Všechna bývalá západní území státu [ROOT.GetCountry.GetAdjectiveNoFormatting] se vymkla naší kontrole. Náš plán na začlenění západních pohraničních oblastí zcela selhal." # todo: NEW TRANSLATION
 russification.3.f: "Jako významná osobnost požívá [SCOPE.sCharacter('relevant_character').GetFullNameNoFormatting] z [SCOPE.sCharacter('relevant_character').GetHerHis] mocenského postavení mnoha výsad. Málokdo se odváží zpochybňovat [SCOPE.sCharacter('relevant_character').GetHerHis] autoritu v [ROOT.GetCountry.GetCapital.GetCityHubName]. Od nedávných ztrát západních území státu [ROOT.GetCountry.GetAdjectiveNoFormatting] se však šíří zvěsti, že za tento katastrofální výsledek může právě #italic [SCOPE.sCharacter('relevant_character').GetSheHe]#!. Ačkoli [SCOPE.sCharacter('relevant_character').GetLastNameNoFormatting] ví, že za touto ztrátou stojí víc, než se na první pohled zdá, veřejné mínění je těžké obrátit v [SCOPE.sCharacter('relevant_character').GetHerHis] prospěch. Následky tohoto neúspěchu budou [SCOPE.sCharacter('relevant_character').GetHerHis] politické vyhlídky mařit ještě po mnoho let." # todo: NEW TRANSLATION
 russification.3.a: "V budoucnu musíme zajistit celistvost našich hranic." # todo: NEW TRANSLATION
 modifier_je_russification_loyal_prominence_loss: "Nešťastná ztráta přízně" # todo: NEW TRANSLATION
 modifier_je_russification_approval_loss: "Nepříjemné nezdary" # todo: NEW TRANSLATION
 modifier_je_russification_decline_approval_loss: "Odložená rusifikace" # todo: NEW TRANSLATION
 russification_3a_character_modifier_tt: "[concept_character], který je [concept_favorite] nebo [concept_leader], získá na #v [GetPlayer.MakeScope.ScriptValue('display_long_modifier_time')]#! let #tooltippable;tooltip:[GetPlayer.GetTooltipTag],modifier_je_russification_loyal_prominence_loss_tt $modifier_je_russification_loyal_prominence_loss$#!" # todo: NEW TRANSLATION
 modifier_je_russification_loyal_prominence_loss_tt: "[GetStaticModifier('modifier_je_russification_loyal_prominence_loss').GetName|v]\n[GetStaticModifier('modifier_je_russification_loyal_prominence_loss').GetDesc]" # todo: NEW TRANSLATION
 russification.4.t: "Útok" # todo: NEW TRANSLATION
 russification.4.d: "V [SCOPE.sCountry('finland_scope').GetCapital.GetCityHubName] byl tajně vystaven obraz podporující nezávislost státu [SCOPE.sCountry('finland_scope').GetName]. Po západních pohraničních oblastech státu [ROOT.GetCountry.GetNameNoFormatting] kolují tisíce reprodukcí tohoto obrazu." # todo: NEW TRANSLATION
 russification.4.f: "V soukromé vile v [SCOPE.sCountry('finland_scope').GetCapital.GetCityHubName] využije mladý muž příležitosti a prohlédne si toto umělecké dílo. Stejně jako malíř a modelka obrazu se i on narodil v nejsevernější oblasti státu [SCOPE.sCountry('finland_scope').GetNameNoFormatting]. Obdivuje, jak obraz dokonale zachycuje mladou dívku, která odhodlaně chrání svazek zákonů [SCOPE.sCountry('finland_scope').GetAdjectiveNoFormatting] před dvouhlavým orlem, jenž jí jej chce vyrvat z rukou. Mladík se nechá inspirovat a vytvoří pohlednici s motivem tohoto smělého obrazu." # todo: NEW TRANSLATION
 russification.4.a: "Zakážeme vystavování tohoto obrazu za každou cenu." # todo: NEW TRANSLATION
 russification.4.b: "Kopie tohoto díla jsou neškodné." # todo: NEW TRANSLATION
 russification.5.t: "Cílené úsilí" # todo: NEW TRANSLATION
 russification.5.d: "[SCOPE.sCharacter('relevant_character').GetFullName] byl vybrán, aby vedl naše úsilí o začlenění státu [SCOPE.sState('relevant_state').GetName] v rámci našeho plánu na integraci západních pohraničních oblastí." # todo: NEW TRANSLATION
 russification.5.f: "[SCOPE.sCharacter('relevant_character').GetFullNameNoFormatting] si plně uvědomuje, jak pomalu se státu [ROOT.GetCountry.GetNameNoFormatting] daří přebírat plnou kontrolu nad západními pohraničními oblastmi. Když [SCOPE.sCharacter('relevant_character').GetSheHe] čte dopis, v němž je žádán[SCOPE.sCharacter('relevant_character').GetHerHim] o dohled nad rozvojem státu [SCOPE.sState('relevant_state').GetNameNoFormatting], [SCOPE.sCharacter('relevant_character').GetSheHe] přemýšlí, jaké povinnosti to může obnášet a jakému zkoumání by [SCOPE.sCharacter('relevant_character').GetSheHe] mohl čelit, pokud by tento podnik selhal.\n\n[SCOPE.sCharacter('relevant_character').GetFullNameNoFormatting] bere do ruky [SCOPE.sCharacter('relevant_character').GetHerHis] pero a píše: „Bude-li na mně, abych hájil naše zájmy na západě, této výzvě dostojím.“" # todo: NEW TRANSLATION
 russification.5.a: "[SCOPE.sCharacter('relevant_character').GetFullNameNoFormatting] je na tento úkol připraven." # todo: NEW TRANSLATION
 russification.5.b: "[SCOPE.sCharacter('relevant_character').GetFullNameNoFormatting] má příliš mnoho povinností. Nechme to na místní správě." # todo: NEW TRANSLATION
 modifier_candidate_reject_approval_loss: "Odmítnutý kandidát" # todo: NEW TRANSLATION
 modifier_local_administration_autonomy: "Místní vedení" # todo: NEW TRANSLATION
 russification.6.t: "Stát [SCOPE.sState('relevant_state').GetNameNoFormatting] řádně začleněn" # todo: NEW TRANSLATION
 russification.6.d: "[SCOPE.sCharacter('relevant_character').GetFullName] úspěšně vedl iniciativu na začlenění státu [SCOPE.sState('relevant_state').GetName]. Stát [ROOT.GetCountry.GetNameNoFormatting] je o krok blíže k zajištění kontroly nad západními územími." # todo: NEW TRANSLATION
 russification.6.f: "V srdci státu [SCOPE.sState('relevant_state').GetCityHubName] se [SCOPE.sCharacter('relevant_character').GetFullNameNoFormatting] raduje z úspěchu [SCOPE.sCharacter('relevant_character').GetHerHis] správy. Před skupinou [SCOPE.sCharacter('relevant_character').GetHerHis] vrstevníků se [SCOPE.sCharacter('relevant_character').GetSheHe] chlubí: „[SCOPE.sState('relevant_state').GetCityHubName] je skvělým příkladem příležitostí a příslibu naší expanze. Jakmile se stát [SCOPE.sState('relevant_state').GetNameNoFormatting] stane nedílnější součástí [ROOT.GetCountry.GetNameNoFormatting], ostatní západní území budou bezpochyby následovat náš příklad.“" # todo: NEW TRANSLATION
 russification.6.a: "Skupina [SCOPE.gsInterestGroup('relevant_ig').GetName] bude těžit z úspěchu [SCOPE.sCharacter('relevant_character').GetFullNameNoFormatting]." # todo: NEW TRANSLATION
 russification.6.b: "Stát [SCOPE.sState('relevant_state').GetName] bude pod naší vládou bezpochyby vzkvétat." # todo: NEW TRANSLATION
 modifier_russify_state_success: "Osvědčené výsledky" # todo: NEW TRANSLATION
 modifier_western_territory_incorporated: "Západní osídlení" # todo: NEW TRANSLATION
 russia_events.31.t: "Zdvojnásobit, či nezdvojnásobit" # todo: NEW TRANSLATION
 russia_events.31.d: "V zahraničí kolují tištěné zmínky o [ROOT.GetCountry.GetAdjectiveNoFormatting] velkoknížeti, který zavedl zdvojování sázek ve vrhcábech. Tato praxe údajně nyní vzkvétá v newyorských kruzích." # todo: NEW TRANSLATION
 russia_events.31.f: "„Je třeba přiznat, že zdvojování nevzniklo s tak vznešeným cílem, jako je zvyšování hráčského umu. Bylo vymyšleno výhradně proto, aby se v co nejkratším čase dosáhlo co nejvyšších sázek — a jeho údajný otec, velkokníže Dmitrij, v tom byl mimořádně úspěšný. Je velmi pravděpodobné, že si neuvědomil... že díky tomu se pro úspěšnou hru náhle stala nezbytnou důkladná analýza vzájemného postavení kamenů, ale... zdá se jisté, že si tato moderní varianta upevní své postavení jako vrhcáby budoucnosti.“\n\n–John Longacre, #italic „Zdvojnásobit, či nezdvojnásobit“#!" # todo: NEW TRANSLATION
 russia_events.31.a: "Jak neotřelé!" # todo: NEW TRANSLATION
 russia_events.31.b: "Nápad dvojnásob vynalézavý!" # todo: NEW TRANSLATION
 modifier_doubling_origin: "Původ zdvojování" # todo: NEW TRANSLATION
 modifier_early_doubler: "Průkopník zdvojování" # todo: NEW TRANSLATION
 russia_events.32.t: "Vzpoura realistů" # todo: NEW TRANSLATION
 russia_events.32.d: "[GetBuildingType('building_art_academy').GetName] ve státě [SCOPE.sState('relevant_state').GetName] odmítá dát umělcům možnost svobodně si vybrat téma pro nadcházející celostátní soutěž. Skupina vyloučených umělců, rozčarovaná zastaralými zvyklostmi Akademie, na protest založila nezávislou uměleckou společnost." # todo: NEW TRANSLATION
 russia_events.32.f: "V den zahájení celostátní umělecké soutěže přechází umělec po konferenčním sále Akademie a čeká na oznámení soutěžního tématu. Rozčiluje ho, že další z kolektivních dopisů Akademické radě zůstal bez odpovědi. Říká si: #italic „Proč si nemůžeme svobodně vybrat téma?“#!\n\nUmělec už nedokáže skrývat svou rostoucí nespokojenost, pronese k ostatním účastníkům strhující řeč a prohlásí: „Jestliže Akademie odmítá vyhovět naší žádosti, neúčastněme se této soutěže a prodávejme svá díla nezávisle na této instituci!“" # todo: NEW TRANSLATION
 russia_events.32.a: "Neslýchané! Nařiďme policii, aby tyto umělce bedlivě sledovala." # todo: NEW TRANSLATION
 russia_events.32.b: "Škoda, že Akademie přišla o své nejlepší talenty." # todo: NEW TRANSLATION
 modifier_surveilled_artists: "Sledovaní umělci" # todo: NEW TRANSLATION
 modifier_ig_surveilled_artists_approval: "Tvůrčí kontrola" # todo: NEW TRANSLATION
 modifier_artel_of_artists: "Umělecký artěl" # todo: NEW TRANSLATION
 russia_events.33.t: "Společnost pro putovní umělecké výstavy" # todo: NEW TRANSLATION
 russia_events.33.d: "[Glossary('glossary_peredvizhniki_artists','group of realist artists')], kteří založili nezávislou uměleckou společnost, uspořádali putovní výstavy ve městech státu [ROOT.GetCountry.GetNameNoFormatting], aby přiblížili umění lidem. Jejich díla, která si získala uznání i v zahraničí, mohou brzy předčit hodnotu tvorby schválené Akademií umění." # todo: NEW TRANSLATION
 russia_events.33.f: "„Řeknu-li o ruském krajináři Levitanovi, že vyjádřil ruskou ‚duši‘ barvami tak, jak to před ním žádný Rus nedokázal, formuluji tím teorii, nebo předkládám fakt? ...Jeho obrazy ruské krajiny vyjádřily ruskou duši jako nikdy předtím: s výmluvností, naléhavostí a magickou silou, která ji přivádí k životu...“\n\n–Francis Haffkine Snow, #italic „Isaak Levitan — malíř ruské duše“#!" # todo: NEW TRANSLATION
 russia_events.33.a: "Reformujme Akademii umění a začleňme do ní peredvižniky." # todo: NEW TRANSLATION
 russia_events.33.b: "Zakročme proti neschváleným dílům." # todo: NEW TRANSLATION
 modifier_peredvizhniki_art: "Společnost peredvižniků" # todo: NEW TRANSLATION
 modifier_peredvizhniki_political_movement: "Vlivná výstava" # todo: NEW TRANSLATION
 modifier_ig_approves_peredvizhniki_rejection: "Odmítnutí realismu" # todo: NEW TRANSLATION
 russia_events.34.t: "Pozvání na velkolepou výstavu v [SCOPE.sState('relevant_state').GetCityHubName]" # todo: NEW TRANSLATION
 russia_events.34.d: "Stát [SCOPE.sCountry('relevant_country').GetName] pořádá velkolepou výstavu v [SCOPE.sState('relevant_state').GetCityHubName]. Naši ministři doporučují účast státu [SCOPE.sCountry('russia_scope').GetName], která by zlepšila jeho mezinárodní pověst." # todo: NEW TRANSLATION
 russia_events.34.f: "Když dorazí pozvání ze státu [SCOPE.sCountry('relevant_country').GetNameNoFormatting], svolá [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] ministra zahraničí, aby mu poradil, jaké výhody by účast na velkolepé výstavě v [SCOPE.sState('relevant_state').GetCityHubName] mohla státu [ROOT.GetCountry.GetNameNoFormatting] přinést.\n\nMinistr, okouzlený vyhlídkou na zastupování státu [ROOT.GetCountry.GetNameNoFormatting] na světové scéně, tvrdí, že jde o velmi cennou příležitost: „Naše účast zanechá v Evropě trvalý dojem o pokroku v našem průmyslovém rozvoji.“" # todo: NEW TRANSLATION
 russia_events.34.a: "Vyšleme vystavovatele, aby představili naše zemědělské produkty." # todo: NEW TRANSLATION
 russia_events.34.b: "Zajistěme účast a představme naši výzbroj." # todo: NEW TRANSLATION
 russia_events.34.c: "Taková marnivost si naše zdroje nezaslouží." # todo: NEW TRANSLATION
 russia_did_attend_worlds_fair_tt: "[SCOPE.sCountry('russia_scope').GetAdjective] exponáty #bold #g budou#!#! zaslány do [SCOPE.sState('relevant_state').GetCityHubName]" # todo: NEW TRANSLATION
 russia_did_not_attend_worlds_fair_tt: "[SCOPE.sCountry('russia_scope').GetAdjective] exponáty #bold #r nebudou#!#! zaslány do [SCOPE.sState('relevant_state').GetCityHubName]" # todo: NEW TRANSLATION
 modifier_russia_participation_cost: "Náklady na velkolepou výstavu" # todo: NEW TRANSLATION
 modifier_russia_participation_prestige: "Prestiž z velkolepé výstavy" # todo: NEW TRANSLATION
 modifier_russia_agricultural_showcase: "Pokroky v zemědělství" # todo: NEW TRANSLATION
 modifier_russia_armaments_showcase: "Pozoruhodná výzbroj" # todo: NEW TRANSLATION
 notification_russia_world_fair_participant_message_name: "Stát [SCOPE.sCountry('russia_scope').GetName] se účastní velkolepé výstavy" # todo: NEW TRANSLATION
 notification_russia_world_fair_participant_message_desc: "Stát [SCOPE.sCountry('russia_scope').GetName] se zúčastní naší velkolepé kulturní a hospodářské výměny na výstavě v [SCOPE.sState('relevant_state').GetCityHubName]." # todo: NEW TRANSLATION
 russia_events.35.t: "Pavilon státu [SCOPE.sCountry('russia_scope').GetAdjectiveNoFormatting]" # todo: NEW TRANSLATION
 russia_events.35.d: "Účast státu [SCOPE.sCountry('russia_scope').GetName] na naší velkolepé výstavě vzbudila značný zájem. Exponáty v pavilonu státu [SCOPE.sCountry('russia_scope').GetAdjective] zdůrazňují průmyslový pokrok státu [SCOPE.sCountry('russia_scope').GetNameNoFormatting]." # todo: NEW TRANSLATION
 russia_events.35.f: "„Žádná země nenabízí více protikladů. Žádnou nebylo pro návštěvníka výstavy těžší shrnout. Organizátorům ruské sekce se přesto podařilo podat ucelený a živý obraz této obrovské říše. Ti, kdo Rusko znají, je zde najdou; ti, kdo je neznají, je objeví.“\n\n–Maurice Normand, #italic „Rusko na výstavě“#!" # todo: NEW TRANSLATION
 russia_events.35.a: "Jak úchvatná podívaná." # todo: NEW TRANSLATION
 modifier_russia_expo_research_speed: "Úchvatná výstava" # todo: NEW TRANSLATION
 notification_russia_world_fair_showcase_message_name: "Úspěšná prezentace ve státě [SCOPE.sCountry('relevant_country').GetName]" # todo: NEW TRANSLATION
 notification_russia_world_fair_showcase_message_desc: "Účast [SCOPE.sCountry('russia_scope').GetName] na Velké výstavě pořádané zemí [SCOPE.sCountry('relevant_country').GetName] vedla k úspěšné kulturní výměně." # todo: NEW TRANSLATION
 chartering_the_stanitsas.1.t: "Nová řada kozáckých stanic" # todo: NEW TRANSLATION
 chartering_the_stanitsas.1.d: "Nyní, když se nám [SCOPE.sState('cossack_frontier_state').GetName] zodpovídá, vyslali starší vojska v [SCOPE.sState('cossack_host_state').GetName] delegaci, aby požádala o půdu za poslední hlídkovou linií." # todo: NEW TRANSLATION
 chartering_the_stanitsas.1.f: "„Kozák je služebníkem své vlasti a jejím obráncem před vnějšími i vnitřními nepřáteli.“\n\n—Generální kancelář Záporožského vojska, #italic Zápis Záporožského vojska z roku 1649#!" # todo: NEW TRANSLATION
 chartering_the_stanitsas.1.a: "Ať udrží linii." # todo: NEW TRANSLATION
 chartering_the_stanitsas.1.b: "Hranice se bez nich bude muset bránit sama." # todo: NEW TRANSLATION
