 bolsheviks.2.t_1: "Dobytí Zimního paláce" # todo: NEW TRANSLATION
 bolsheviks: "Bolševik" # todo: NEW TRANSLATION
 left_srs: "Socialistický revolucionář" # todo: NEW TRANSLATION
 bolsheviks_plural: "Bolševici" # todo: NEW TRANSLATION
 left_srs_plural: "Levicoví eserové" # todo: NEW TRANSLATION
 proletariat_loc: "proletariát" # todo: NEW TRANSLATION
 peasants_loc: "rolnictvo" # todo: NEW TRANSLATION
 bolsheviks.2.d: "[SCOPE.GetRootScope.GetCountry.GetCustom('bolsheviks_srs_plural')], pod vedením [SCOPE.sCharacter('rev_leader').GetFullName], zmobilizovali [SCOPE.GetRootScope.GetCountry.GetCustom('peasants_proletariat')] a dobyli palác v [ROOT.GetCountry.GetCapital.GetCityHubName]. Nový režim prohlásil, že se [SCOPE.sCountry('russia_scope').GetName] od nynějška stane [GetLawType('law_council_republic').GetName]." # todo: NEW TRANSLATION
 bolsheviks.2.f: "„Máme sílu masové organizace, která všechno překoná a povede proletariát ke světové revoluci. Nyní musíme začít budovat proletářský socialistický stát v Rusku. Ať žije světová socialistická revoluce!“\n\n—Vladimir Lenin" # todo: NEW TRANSLATION
 bolsheviks.2.a: "Sláva revoluci!" # todo: NEW TRANSLATION
 bolsheviks.3.t: "Vítězství socialistů" # todo: NEW TRANSLATION
 bolsheviks.3.d: "[SCOPE.GetRootScope.GetCountry.GetCustom('bolsheviks_srs_plural')] pod vedením [SCOPE.sCharacter('socialist_faction_leader').GetFullName] konečně položili základy své socialistické republiky. Moc pevně drží ve svých rukou a budoucnost [SCOPE.sCountry('russia_scope').GetName] se chystá vydat odvážným novým směrem." # todo: NEW TRANSLATION
 bolsheviks.3.f: "„Naše strana... má před sebou obrovskou budoucnost. Je stranou zářné, mocné víry v socialismus a Internacionálu. Nelze ji zničit, ani vámi, ani dočasnou reakcí, protože ona i její myšlenky žijí v masách, jsou zakořeněny v hlubinách jejich psychologie a revoluční obrození celého lidstva nevyhnutelně proběhne pod praporem její Ideje, Ideje osvobození lidské osobnosti.“\n\n—Maria Spiridonova" # todo: NEW TRANSLATION
 bolsheviks.3.a: "Ať žije socialismus!" # todo: NEW TRANSLATION
 bol_labor_add: "#b Bolševici#! získají větší podporu od [SCOPE.sPoliticalMovement('labor_movement_scope').GetName]" # todo: NEW TRANSLATION
 men_labor_add: "#b Menševici#! získají větší podporu od [SCOPE.sPoliticalMovement('labor_movement_scope').GetName]" # todo: NEW TRANSLATION
 bol_labor_subtract: "#b Bolševici#! získají menší podporu od [SCOPE.sPoliticalMovement('labor_movement_scope').GetName]" # todo: NEW TRANSLATION
 men_labor_subtract: "#b Menševici#! získají menší podporu od [SCOPE.sPoliticalMovement('labor_movement_scope').GetName]" # todo: NEW TRANSLATION
 bolsheviks.4.t: "Masy a předvoj" # todo: NEW TRANSLATION
 bolsheviks.4.d: "Na velkém shromáždění [SCOPE.sPoliticalMovement('labor_movement_scope').GetName] vedou [SCOPE.sCharacter('bolshevik_leader').GetFullName] a [SCOPE.sCharacter('menshevik_leader').GetFullName] vášnivou debatu o úloze proletariátu v organizování revoluce. Oba doufají, že získají příznivce pro své frakce, #b bolševiky#! a #b menševiky#!." # todo: NEW TRANSLATION
 bolsheviks.4.f: "Za nimi, za těmito vůdci, stojí celé masy bojovníků, revolučních dělníků, kteří roznášejí provolání, vybírají peníze, demonstrují v ulicích, jdou do vězení i do vyhnanství, ale nepatří ani k žádnému výboru, ani k jiné organizaci. Nejsou tito bojovníci, tito naši vojáci, členy strany? Máme je ze strany vyloučit? Kdo ve straně zůstane? Jen generálové bez armády.  \n\n — 23. zasedání druhého sjezdu RSDDS" # todo: NEW TRANSLATION
 bolsheviks.4.a: "#b Bolševici#! [SCOPE.sCharacter('bolshevik_leader').GetFullName] povedou předvoj lidu." # todo: NEW TRANSLATION
 bolsheviks.4.b: "Výzva #b menševiků#! ke zdrženlivosti bude mít největší ohlas." # todo: NEW TRANSLATION
 bolsheviks.4.c: "To jsou jen prázdné řeči." # todo: NEW TRANSLATION
 bolshevik_labor_activism: "Bolševický aktivismus mezi dělníky" # todo: NEW TRANSLATION
 menshevik_labor_support: "Podpora menševiků mezi dělníky" # todo: NEW TRANSLATION
 social_faction_labor_failure: "Rozčarovaní dělníci" # todo: NEW TRANSLATION
 most_popular_leftist_modifier: "Významný levičák" # todo: NEW TRANSLATION
 popular_leftist_movement_support: "Vzestup levice" # todo: NEW TRANSLATION
 bolsheviks.5.t: "Rozkolníci!" # todo: NEW TRANSLATION
 bolsheviks.5.d: "Na velké konferenci [SCOPE.GetRootScope.GetCountry.GetCustom('bolsheviks_srs_plural')] vypukl chaos. Hrozby rozkolu a obvinění z liberalismu se jen množí, dokud [SCOPE.sCharacter('most_popular_leftist').GetFullName] nezvýší [SCOPE.sCharacter('most_popular_leftist').GetHerHis] hlas a neobrátí se k davu…" # todo: NEW TRANSLATION
 bolsheviks.5.f: "Jestliže se, uneseni logikou toho, co jste začali, oddělíte a vytvoříte samostatnou politickou stranu, okamžitě sklidíte to, co nyní zaséváte: rozpadnete se na řadu frakčních skupin, neschopných dodržovat stranickou disciplínu, jednajících jako partyzáni, každá po svém, a vaše strana se stane obětí úplného rozptýlení a rozdrobení. \n\n — Victor Černov" # todo: NEW TRANSLATION
 bolsheviks.5.a: "Tento projev bude inspirovat celé generace [SCOPE.GetRootScope.GetCountry.GetCustom('bolsheviks_srs_plural')]." # todo: NEW TRANSLATION
 bolsheviks.5.b: "Pověst [SCOPE.sCharacter('most_popular_leftist').GetLastName] se z tak trapné rétoriky nikdy nevzpamatuje." # todo: NEW TRANSLATION
 mensheviks_plural: "Menševici" # todo: NEW TRANSLATION
