 je_bolsheviks_reason: "O moc v zemi [SCOPE.sCountry('russia_scope').GetName] soupeří tři socialistické frakce:\n\n#b Bolševici#! podporují [GetIdeology('ideology_vanguardist').GetName] výklad $marxism$ a čerpají podporu z hnutí #v $movement_communist$#!, #v $movement_labor$#! a zájmové skupiny [SCOPE.gsInterestGroup('unions_scope').GetName]. #b Bolševici#! provedou převrat, jakmile získají dostatečnou podporu a [concept_legitimacy] klesne na 50, nebo se vlády chopí prozatímní vláda.\n\n#b Menševici#! zastávají ideologii [GetIdeology('ideology_state_socialist').GetName] a čerpají podporu z hnutí #v $movement_socialist$#!, #v $movement_labor$#! a zájmové skupiny [SCOPE.gsInterestGroup('nerds_scope').GetName]. #b Menševici#! podporují postupný přechod k socialismu a moci se neujmou mimořádnými prostředky.\n\n#b Leví socialisté-revolucionáři#! jsou [GetIdeology('ideology_anarchist').GetName] frakce agrárních socialistů. Čerpají podporu z hnutí #v $movement_land_reform$#!, #v $movement_anarchist$#! a zájmové skupiny [SCOPE.gsInterestGroup('peasants_scope').GetName]. #b Leví eserové#! provedou převrat, jakmile získají dostatečnou podporu a $concept_legitimacy$ klesne na 50, nebo se vlády chopí prozatímní vláda.\n\nPodpora každé frakce se postupně přibližuje cílové hodnotě, kterou určují tyto zdroje a [concept_popularity] a [concept_prominence] jejího vůdce." # todo: NEW TRANSLATION
