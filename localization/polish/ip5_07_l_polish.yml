 rcw_map_red: "[SCOPE.sCountry('rcw_map_owner').GetName] se přidává k #b rudým#!" # todo: NEW TRANSLATION
 rcw_map_white: "[SCOPE.sCountry('rcw_map_owner').GetName] se přidává k #b bílému hnutí#!" # todo: NEW TRANSLATION
 rcw_map_green: "[SCOPE.sCountry('rcw_map_owner').GetName] se přidává k #b zeleným#!" # todo: NEW TRANSLATION
 rcw_map_black: "[SCOPE.sCountry('rcw_map_owner').GetName] se přidává k #b anarchistickému hnutí#!" # todo: NEW TRANSLATION
