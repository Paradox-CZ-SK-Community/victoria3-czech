 je_russia_provisional_government_reason: "Po pádu starého režimu byla v [ROOT.GetCountry.GetCapital.GetCityHubName] vyhlášena #b prozatímní vláda#!. Její moc ovládají [SCOPE.GetRootScope.GetCountry.GetCustom('provisional_government_identity_plural')], které se snaží získat legitimitu a zajistit, aby jejich vize budoucnosti země #v $RUS$#! zvítězila nad starým režimem i nad jejich soupeři z řad [SCOPE.GetRootScope.GetCountry.GetCustom('provisional_government_opponent_identity_singular')].\n\n@information! Jednota [SCOPE.sCountry('russia_scope').GetAdjective] prozatímní vlády visí na vlásku. Pokud [SCOPE.sCountry('russia_scope').GetRuler.GetPrimaryRoleTitle] rychle nezajistí legitimitu [SCOPE.sCountry('russia_scope').GetRuler.GetHerHis] nové vládě, zemi [SCOPE.sCountry('russia_scope').GetName] pohltí strašlivá [concept_revolution]." # todo: NEW TRANSLATION
