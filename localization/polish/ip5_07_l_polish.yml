 je_congress_poland_reason: "[Glossary('glossary_third_partition','$glossary_third_partition_short|q$')] přineslo [SCOPE.sCountry('russia_poland_scope').GetName] kontrolu nad velkou částí bývalé Polsko-litevské unie. Carové zpočátku drželi [SCOPE.sCountry('congress_poland_scope').GetName] v [concept_personal_union] a z velké části respektovali ústavu a [Glossary('glossary_sejm','$glossary_sejm_short|q$')].\n\nPo [Glossary('glossary_november_uprising','$glossary_november_uprising_short|q$')] ruské úřady tvrdě zakročily proti nesouhlasu a zavedly organický statut – polská autonomie byla výrazně omezena a zemi měl spravovat místodržící jmenovaný samotným carem. Touha po polské nezávislosti přetrvává, ale neúspěch by mohl Polsko odsoudit k desetiletím autokratické vlády.\n$TOOLTIP_DELIMITER$\n@information! #b Bílí#!, které tvoří [SCOPE.gsInterestGroup('poland_landowners').GetName] a [SCOPE.gsInterestGroup('poland_industrialists').GetName], se pokoušejí reformní cestou dosáhnout větší autonomie a obnovy [glossary_sejm].\n\n#b Rudí#! jsou především [SCOPE.gsInterestGroup('poland_intelligentsia').GetName] a [SCOPE.gsInterestGroup('poland_rural_folk').GetName], kteří podporují násilné povstání proti [SCOPE.sCountry('russia_poland_scope').GetName]. Jsou lehkomyslní a před zažehnutím požáru možná nezváží, zda jsou připraveni." # todo: NEW TRANSLATION
