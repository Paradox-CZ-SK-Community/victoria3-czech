 rcw.4.t1: "Rudý teror v oblasti [SCOPE.sState('rcw_terror_state').GetName]" # todo: NEW TRANSLATION
 rcw.4.t2: "Bílý teror v oblasti [SCOPE.sState('rcw_terror_state').GetName]" # todo: NEW TRANSLATION
 rcw.4.t3: "Velký teror v oblasti [SCOPE.sState('rcw_terror_state').GetName]" # todo: NEW TRANSLATION
 rcw.4.d: "Jednotky [SCOPE.GetRootScope.GetCountry.GetCustom('my_rcw_side_loc')] pod velením [SCOPE.sCharacter('rcw_terror_general').GetFullName] zahájily v oblasti [SCOPE.sState('rcw_terror_state').GetName] tažení s cílem najít a popravit všechny [SCOPE.GetRootScope.GetCountry.GetCustom('enemy_rcw_side_loc')] živly mezi civilním obyvatelstvem." # todo: NEW TRANSLATION
 rcw.4.f: "Co je lepší? Vypátrat, uvěznit, a někdy dokonce zastřelit stovky zrádců z řad kadetů, nestraníků, menševiků a socialistů-revolucionářů, kteří vystupují (někteří se zbraní v ruce, jiní se spiknutími, další zase agitací proti mobilizaci, jako menševičtí tiskaři a železničáři atd.) proti sovětské moci, jinými slovy ve prospěch Děnikina? Anebo nechat věci dojít tak daleko, že Kolčak a Děnikin budou moci zmasakrovat, postřílet a ubít k smrti desetitisíce dělníků a rolníků? Rozhodnutí není těžké. \n\n—Vladimir Lenin, #italic Boj proti kontrarevoluci v týlu#!" # todo: NEW TRANSLATION
 rcw.4.a: "Nenechte naživu ani jediného [SCOPE.GetRootScope.GetCountry.GetCustom('enemy_rcw_side_loc')] psa!" # todo: NEW TRANSLATION
 rcw.4.b: "Ujistěte se, že většina z nich skutečně sympatizuje s [SCOPE.GetRootScope.GetCountry.GetCustom('enemy_rcw_side_loc')]." # todo: NEW TRANSLATION
 rcw_whites_custom: "Bílí" # todo: NEW TRANSLATION
 rcw_reds_custom: "Rudí" # todo: NEW TRANSLATION
 rcw_generic_custom: "Ruský" # todo: NEW TRANSLATION
 rcw_generic_2_custom: "nepřítel" # todo: NEW TRANSLATION
 rcw_terror: "Teror" # todo: NEW TRANSLATION
 rcw.5.t: "Ruské zlaté rezervy" # todo: NEW TRANSLATION
 rcw.5.d: "[SCOPE.sCharacter('kazan_ruler').GetFullName] nařídil [SCOPE.GetRootScope.GetCountry.GetCustom('enemy_rcw_side_loc')] armádě přepravit většinu ruských zlatých rezerv do oblasti [SCOPE.sState('kazan_owner_capital').GetCityHubName], sídla vlády země [SCOPE.sCountry('kazan_owner').GetAdjective]. Konvoj obrněných vlaků právě odváží zlato z oblasti [SCOPE.sState('kazan_state').GetName]." # todo: NEW TRANSLATION
 rcw.5.f: "U vagónu, kde se nacházela strážnice, jsme byli svědky příznačné scény. Dorazila nová stráž, asi dva tucty mladíků, kteří neměli ponětí a vůbec je nezajímalo, co jim bylo svěřeno na hlídání. Stáli ve skupince, smáli se nebo nadávali a rozhlíželi se na všechny strany. Soudruh Šelepin, velitel první sovětské stráže, chtěl vidět jejich velitele, kterého však nebylo možné najít. Nakonec se odněkud vynořil — beze zbraně a opasku, jen ve své pláštěnce a plstěných botách. \n\n — Čila, velitel 10. českého pluku" # todo: NEW TRANSLATION
 rcw.5.a: "To zlato potřebujeme!" # todo: NEW TRANSLATION
 russian_gold_reserves_lost: "Ztráta ruských zlatých rezerv" # todo: NEW TRANSLATION
 capture_gold_reserves_capital_tt: "Část zlatých rezerv získáme zpět, pokud znovu dobudeme oblast [SCOPE.sState('kazan_owner_capital').GetName]." # todo: NEW TRANSLATION
 rcw.6.t: "Získání zlatých rezerv zpět" # todo: NEW TRANSLATION
 rcw.6.d: "Zlaté rezervy byly konečně získány zpět z trezorů v oblasti [SCOPE.sState('russian_gold_state').GetCityHubName]. Zdá se, že velká část chybí, pravděpodobně byla prodána na financování válečného úsilí [SCOPE.GetRootScope.GetCountry.GetCustom('enemy_rcw_side_loc')]." # todo: NEW TRANSLATION
 rcw.6.f: "Přeprava vlaku se zlatými rezervami probíhá následovně: vpředu jede určený vlak s rotou stráží, čítající až 150 mužů; během jízdy jsou hlídky na střechách vagónů, na zadních plošinách a na lokomotivě, při zastávkách pak u vagónů; před vlakem jede kulomet s obsluhou a hlídka obchází vlak. \n\n — Alexandr Kosuchin, důstojník Čeky" # todo: NEW TRANSLATION
 rcw.6.a: "Aspoň se nám podařilo získat část zlata zpět." # todo: NEW TRANSLATION
 rcw.7.t: "Osud cara" # todo: NEW TRANSLATION
 rcw.7.d: "Byl vydán rozkaz zastřelit bývalého cara [SCOPE.sCharacter('void_tsar_scope').GetFullName] v [SCOPE.sCharacter('void_tsar_scope').GetHerHis] dočasném domově v oblasti [SCOPE.sState('tsar_temp_state').GetFarmHubName], spolu s [SCOPE.sCharacter('void_tsar_scope').GetHerHis] přeživší rodinou." # todo: NEW TRANSLATION
 rcw.7.d2: "Od svržení cara [SCOPE.sCharacter('void_tsar_scope').GetFullName] už nějaká doba uplynula a rozhodnutí už nelze dále odkládat. Musíme rozhodnout o [SCOPE.sCharacter('void_tsar_scope').GetHerHis] osudu." # todo: NEW TRANSLATION
 rcw.7.f: "„A rodina?“\n„I rodina s ním.“\n„Všichni?“\n„Všichni.“\n\n — Lev Trockij, #italic Deník v exilu#!" # todo: NEW TRANSLATION
 rcw.7.f2: "Chtěli jsme si trochu zacvičit, a tak jsme se zabavili odklízením ledu, který ucpával propusti rybníka. Brzy se podél zábradlí parku sešel dav vojáků a civilistů, kteří sledovali naši práci. Po nějaké době přišel důstojník stráže k carovi a oznámil mu, že ho velitel posádky v Carském Selu právě varoval před obávanou nepřátelskou demonstrací, nebo dokonce pokusem o životy členů císařské rodiny, a požádal nás, abychom nezůstávali tam, kde jsme. Car odpověděl, že se nebojí a že mu dobří lidé nijak nevadí. \n\n — Pierre Gilliard, #italic Třináct let na ruském dvoře#!" # todo: NEW TRANSLATION
 rcw.7.a: "Soud a poprava [SCOPE.sCharacter('void_tsar_scope').GetFullName] budou podívanou pro masy." # todo: NEW TRANSLATION
 rcw.7.b: "Bývalý car může odejít do oblasti [SCOPE.sState('tsar_temp_state').GetFarmHubName] a zůstat v domácím vězení." # todo: NEW TRANSLATION
 rcw.7.c: "Takové vychloubání krvežíznivostí..." # todo: NEW TRANSLATION
