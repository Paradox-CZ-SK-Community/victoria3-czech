 bolsheviks.1.t: "Co dělat?" # todo: NEW TRANSLATION
 bolsheviks.1.desc: "[SCOPE.sCountry('russia_scope').GetAdjective]á levice se ostře rozdělila na tři frakce s velmi odlišnými vizemi budoucnosti. #b Bolševici#! vedou [SCOPE.sPoliticalMovement('bolshevik_movement').GetName], #b menševici#! vedou [SCOPE.sPoliticalMovement('menshevik_movement').GetName] a levicoví eserové vedou [SCOPE.sPoliticalMovement('left_sr_movement').GetName]." # todo: NEW TRANSLATION
 bolsheviks.1.f: "„Jediným vážným organizačním principem, který mohou aktivní pracovníci našeho hnutí přijmout, je přísné utajení, přísný výběr členů a výcvik profesionálních revolucionářů.“\n\n—Vladimir Lenin, #italic Co dělat?#!" # todo: NEW TRANSLATION
 bolsheviks.1.a: "Podpořit #b bolševiky#!" # todo: NEW TRANSLATION
 bolsheviks.1.b: "Podpořit #b menševiky#!" # todo: NEW TRANSLATION
 bolsheviks.1.c: "Podpořit #b levicové esery#!" # todo: NEW TRANSLATION
 bolsheviks.1.d: "Zrada! Povstání!" # todo: NEW TRANSLATION
 bolsheviks_start_at_tt: "Podpora #b bolševiků#! začne na hodnotě #v [Divide_CFixedPoint(GetPlayer.MakeScope.Var('bolshevik_current_var').GetValue, '(CFixedPoint)2')|1]%#!" # todo: NEW TRANSLATION
