 je_rus_civil_war_partitioned_header: "Rusko se rozpadne, pokud:\n" # todo: NEW TRANSLATION
 je_rus_civil_war_partitioned_effect_header: "Pokud nezůstane žádná #b ruská#! frakce:\n$EFFECT$" # todo: NEW TRANSLATION
 je_rus_civil_war_partitioned_conclusion_desc: "$concept_journal_entry$ skončil rozdělením Ruska; nezůstala žádná #b ruská#! frakce." # todo: NEW TRANSLATION
 je_rus_civil_war_frozen_conclusion_desc: "$concept_journal_entry$ skončil bez vítěze. Přeživší #b ruské#! frakce uzavřely neklidný mír." # todo: NEW TRANSLATION
