 rcw_separatist_survived_tt: "Separatistické národy přežily válku" # todo: NEW TRANSLATION
 rus_cw_pale_horse: "A hle, kůň bledý, a jméno tomu, kdož seděl na něm, smrt, a peklo šlo za ním.\n\n" # todo: NEW TRANSLATION
 rus_cw_phase_1_status: "Občanská válka zuří dál" # todo: NEW TRANSLATION
 rus_cw_phase_2_status: "Zbývající vojevůdci si stále činí nároky na svrchovanost" # todo: NEW TRANSLATION
 rcw.1.t: "Ruská občanská válka" # todo: NEW TRANSLATION
 rcw.1.d: "Prozatímní vláda selhala. Pod volným vedením země [SCOPE.sCountry('rcw_opposition_country').GetName] vznikly nesčetné legie, které vedou nespokojení vojevůdci, jako například [SCOPE.sCharacter('scariest_russian_warlord').GetFullName] v zemi [SCOPE.sCountry('scariest_russian_warlord_country').GetName]. Ještě není vše ztraceno; naši spojenci se rovněž shromažďují na naší straně. Mezi naše nejvýznamnější podporovatele patří vláda země [SCOPE.sCountry('friendliest_russian_warlord_country').GetName] vedená [SCOPE.sCharacter('friendliest_russian_warlord').GetFullName]." # todo: NEW TRANSLATION
 rcw.1.f: "„Nemyslete si, že jsem přišel přinést na zem pokoj: nepřišel jsem přinést pokoj, nýbrž meč. Neboť jsem přišel postavit člověka proti jeho otci, dceru proti matce a snachu proti tchyni. A nepřáteli člověka budou členové jeho vlastní domácnosti.“\n\n—Matouš 10, Bible krále Jakuba#!" # todo: NEW TRANSLATION
 rcw.1.a: "Do války!" # todo: NEW TRANSLATION
 rcw_warlords_button: "Znovu začlenit loajální frakci" # todo: NEW TRANSLATION
 rcw_warlords_button_desc: "Mnozí naši ruští soudruzi byli v chaosu války nuceni ustavit místní vlády. Jakmile se naskytne příležitost, musíme je znovu začlenit." # todo: NEW TRANSLATION
