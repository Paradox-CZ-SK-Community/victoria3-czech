 annex_a_russian_warlord: "Sousední přátelský #b ruský#! válečnický stát s nižším HDP bude anektován" # todo: NEW TRANSLATION
 rcw_warlords_button_ideologically_aligned: "Je ideologicky spřízněn s [ROOT.GetCountry.GetNameNoFormatting]" # todo: NEW TRANSLATION
 rcw_warlords_button_target_tt: "Menší a ideologicky spřízněná ruská frakce, která je v míru, s námi sousedí" # todo: NEW TRANSLATION
 rcw.3.t: "Konec ruské občanské války" # todo: NEW TRANSLATION
 rcw.3.d: "Rozdrtili jsme veškerý ozbrojený odpor nepřátel státu a přivedli naše spojence zpět do našich řad. Ruská občanská válka je konečně u konce." # todo: NEW TRANSLATION
 rcw.3.f: "Občanská válka je nejkrutější ze všech válek. Nelze si ji představit bez násilí nejen vůči významným osobám, ale v současných podmínkách ani bez vraždění starců, stařenek a dětí.\n\n—Leon Trockij, #italic Jejich morálka a naše#!" # todo: NEW TRANSLATION
 rcw.3.a: "Nastává éra stability a míru." # todo: NEW TRANSLATION
 rcw.3.b: "A teď ti separatisté..." # todo: NEW TRANSLATION
 rcw.3.c: "Nové Rusko bude větší než všechno, co tu bylo před ním." # todo: NEW TRANSLATION
