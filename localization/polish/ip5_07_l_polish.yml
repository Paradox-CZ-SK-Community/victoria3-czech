 poland_viceroy_cooldown_tt: "O jmenování místodržícího se neuvažovalo alespoň #b 5 let#!" # todo: NEW TRANSLATION
 poland_conciliatory_viceroy: "Smířlivý místodržící" # todo: NEW TRANSLATION
 poland_autocratic_viceroy: "Represivní místodržící" # todo: NEW TRANSLATION
 pol_viceroy_unlikely: "Místodržící Polska má nad vládou obrovskou moc a vládne v podstatě autokraticky. Zatímco #b smířlivého místodržícího#! lze možná přesvědčit k mírnějšímu postupu, #b represivní místodržící#! bude pravděpodobně jednat opačně a podněcovat tak nacionalistické napětí.\n\n@red_cross! Rusko #b pravděpodobně#! nejmenuje #b smířlivého#! místodržícího" # todo: NEW TRANSLATION
 pol_viceroy_likely: "Místodržící Polska má nad vládou obrovskou moc a vládne v podstatě autokraticky. Zatímco #b smířlivého místodržícího#! lze možná přesvědčit k mírnějšímu postupu, #b represivní místodržící#! bude pravděpodobně jednat opačně a podněcovat tak nacionalistické napětí.\n\nRusko #b pravděpodobně#! jmenuje #b smířlivého#! místodržícího" # todo: NEW TRANSLATION
 pol_viceroy_for_russia: "Místodržící Polska má nad vládou obrovskou moc a vládne v podstatě autokraticky. Zatímco #b smířlivého místodržícího#! lze možná přesvědčit k mírnějšímu postupu, #b represivní místodržící#! bude pravděpodobně jednat opačně a podněcovat tak nacionalistické napětí." # todo: NEW TRANSLATION
 congress_poland.1.t: "Místodržící Polska" # todo: NEW TRANSLATION
 congress_poland.1.d: "[SCOPE.sCharacter('tsar_scope').GetPrimaryRoleTitle] se rozhodl přezkoumat místodržitelství [SCOPE.sCountry('congress_poland_scope').GetAdjective]. Současný místodržící, [SCOPE.sCharacter('poland_viceroy_scope').GetFullName], zvolil [SCOPE.sCharacter('poland_viceroy_scope').GetCustom('ConciliatoryRepressive')] přístup, který sice některým vyhovuje, ale neobešel se bez kritiků." # todo: NEW TRANSLATION
 congress_poland.1.d2: "[SCOPE.sCharacter('tsar_scope').GetPrimaryRoleTitle] byl vyzván, aby jmenoval nového místodržícího [SCOPE.sCountry('congress_poland_scope').GetName]. Hlavní otázkou je, zda má vládu nového místodržícího charakterizovat železná ruka, nebo otevřená náruč." # todo: NEW TRANSLATION
 congress_poland.1.f: "„Čím déle vládnu, tím více jsem přesvědčen, že smířlivá politika je chybná. Krutost sice přiživuje nenávist a touhu po pomstě, slabost je však trestána ještě tvrději. Mírnost bychom měli projevit jen tehdy, když je to – což se stává zřídka – zapotřebí. Jinak svou politiku stavím na hrozbách a naší rozhodnosti a síle.“" # todo: NEW TRANSLATION
 congress_poland.1.a: "[SCOPE.sCharacter('poland_viceroy_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('poland_viceroy_scope').GetLastName] už svou práci odvádí dobře." # todo: NEW TRANSLATION
 congress_poland.1.b: "Nový místodržící nesmí šetřit ranami." # todo: NEW TRANSLATION
 congress_poland.1.b2: "S Polskem bychom měli zacházet mírněji." # todo: NEW TRANSLATION
 poland_already_conciliatory: "Místodržící není smířlivý" # todo: NEW TRANSLATION
 poland_conciliatory_loc: "#b smířlivý#!" # todo: NEW TRANSLATION
 poland_repressive_loc: "#b represivní#!" # todo: NEW TRANSLATION
 notification_poland_repressive_viceroy_notification_name: "[SCOPE.sCountry('russia_poland_scope').GetName] jmenuje represivního místodržícího" # todo: NEW TRANSLATION
 notification_poland_repressive_viceroy_notification_desc: "Tyranie [SCOPE.sCountry('russia_poland_scope').GetAdjective] znovu svírá [SCOPE.sCountry('congress_poland_scope').GetName]." # todo: NEW TRANSLATION
 notification_poland_repressive_viceroy_notification_tooltip: "#header $notification_poland_repressive_viceroy_notification_name$#!\n$TOOLTIP_DELIMITER$\n$notification_poland_repressive_viceroy_notification_desc$" # todo: NEW TRANSLATION
 notification_poland_conciliatory_viceroy_notification_name: "[SCOPE.sCountry('russia_poland_scope').GetName] jmenuje smířlivého místodržícího" # todo: NEW TRANSLATION
 notification_poland_conciliatory_viceroy_notification_desc: "Pro [SCOPE.sCountry('congress_poland_scope').GetName] stále existuje naděje." # todo: NEW TRANSLATION
 notification_poland_conciliatory_viceroy_notification_tooltip: "#header $notification_poland_conciliatory_viceroy_notification_name$#!\n$TOOLTIP_DELIMITER$\n$notification_poland_conciliatory_viceroy_notification_desc$" # todo: NEW TRANSLATION
 expand_poland_button: "Rozšířit Kongresové Polsko" # todo: NEW TRANSLATION
 expand_poland_button_desc: "Pokud by se další části Polska nějakým způsobem dostaly do ruských rukou, mohlo by být v zájmu všech začlenit tato území do správy Kongresového Polska." # todo: NEW TRANSLATION
 congress_poland.2.t: "Rozšíření [SCOPE.sCountry('congress_poland_scope').GetNameNoFormatting]" # todo: NEW TRANSLATION
 congress_poland.2.d: "[SCOPE.sCharacter('tsar_scope').GetPrimaryRoleTitle] obdržel žádost o rozšíření [SCOPE.sCountry('congress_poland_scope').GetName], území, kterému [SCOPE.sCountry('russia_poland_scope').GetName] velkodušně dovoluje jistou omezenou podobu samosprávy." # todo: NEW TRANSLATION
 congress_poland.2.f: "„Naše hranice se stále posouvají na západ a já nebudu zlehčovat slávu tohoto úspěchu nikde, kde jsou uši, které o něm mohou slyšet. Pravdou však je, že nás tíží velký počet neukázněných Poláků, kterým by lépe prospělo uzavření pod správu místodržícího, než aby zamořovali naši vlastní administrativu.“" # todo: NEW TRANSLATION
 congress_poland.2.a: "Poláci jsou méně problematičtí, když si mohou namlouvat, že mají [GetCulture('polish').GetName]." # todo: NEW TRANSLATION
 congress_poland.2.b: "Na územní celistvosti hranic [SCOPE.sCountry('russia_poland_scope').GetAdjective] nebudeme dělat kompromisy." # todo: NEW TRANSLATION
 poland_territory_cooldown_tt: "[SCOPE.sCountry('russia_poland_scope').GetName] nejméně #b 5 let#! neuvažovalo o rozšíření [SCOPE.sCountry('congress_poland_scope').GetName]" # todo: NEW TRANSLATION
 russia_decides_expand_poland: "[SCOPE.sCountry('russia_poland_scope').GetName] rozhodne, zda postoupí území [SCOPE.sCountry('congress_poland_scope').GetName]" # todo: NEW TRANSLATION
 notification_poland_expansion_accepted_name: "[SCOPE.sCountry('russia_poland_scope').GetName] souhlasí s rozšířením [SCOPE.sCountry('congress_poland_scope').GetName]" # todo: NEW TRANSLATION
 notification_poland_expansion_accepted_desc: "Krok ke znovusjednocení [GetCulture('polish').GetName] národa!" # todo: NEW TRANSLATION
 notification_poland_expansion_accepted_tooltip: "#header $notification_poland_expansion_accepted_name$#!\n$TOOLTIP_DELIMITER$\n$notification_poland_expansion_accepted_desc$" # todo: NEW TRANSLATION
 notification_poland_expansion_refused_name: "Kdy se konečně zbavíme svých utlačovatelů?" # todo: NEW TRANSLATION
 notification_poland_expansion_refused_desc: "[SCOPE.sCountry('russia_poland_scope').GetName] odmítá rozšíření [SCOPE.sCountry('congress_poland_scope').GetAdjective]." # todo: NEW TRANSLATION
 notification_poland_expansion_refused_tooltip: "#header $notification_poland_expansion_refused_name$#!\n$TOOLTIP_DELIMITER$\n$notification_poland_expansion_refused_desc$" # todo: NEW TRANSLATION
 poland_army_tt: "[SCOPE.sCountry('congress_poland_scope').GetName] má alespoň jednu [concept_army]" # todo: NEW TRANSLATION
 congress_poland.3.t: "Obnova polské ústavy" # todo: NEW TRANSLATION
 congress_poland.3.d: "Věc #b Bílých#! v [SCOPE.sCountry('congress_poland_scope').GetName] uspěla a obnovila [SCOPE.sCountry('congress_poland_scope').GetAdjectiveNoFormatting] ústavu. [SCOPE.sCountry('russia_poland_scope').GetName] bude alespoň prozatím respektovat nařízení [glossary_sejm] a z velké části ponechá Polsku samosprávu." # todo: NEW TRANSLATION
 congress_poland.3.f: "„Polské legie byly obnoveny, ale pochodují do rytmu ruských bubnů. Sejm už nezasedá tajně, nýbrž jedná přímo před očima cara. Nelze se ubránit pocitu, že jsme za autonomii zaplatili nezávislostí. Pomodlím se za polský národ, který jsme získali, ale také za ten, který jsme ztratili.“" # todo: NEW TRANSLATION
 congress_poland.3.a: "Smírné řešení." # todo: NEW TRANSLATION
 dp_polish_uprising: "Polské povstání" # todo: NEW TRANSLATION
 polish_uprising: "Polské povstání" # todo: NEW TRANSLATION
 congress_poland.4.t: "Polské povstání" # todo: NEW TRANSLATION
 congress_poland.4.d: "#b Rudí#! v [SCOPE.sCountry('congress_poland_scope').GetName] shromáždili veškerou podporu, jakou jen mohli, a chopili se zbraní ve jménu [SCOPE.sCountry('congress_poland_scope').GetAdjective] svobody. Modlí se, aby to stačilo." # todo: NEW TRANSLATION
 congress_poland.4.f: "Bohu díky, že když naši synové dnes odcházejí,\nnení to pro nové šaty, ba ani pamflety,\nani aby se v pařížské kavárně učili,\njak Francouzi své dluhy řádně hromadí.\nTeď máme svého drahého Napoleona,\njenž nemá čas na plané hovory o módě,\njenž méně dbá o kabát než o zbraň,\na přeje si, aby Polsko ze všech zemí\nse stalo tím, čím kdysi bývalo – republikou!\n\n—Adam Mickiewicz, #italic Pan Tadeusz#!" # todo: NEW TRANSLATION
 congress_poland.4.a: "Mohou tak málo porazit tak mnoho?" # todo: NEW TRANSLATION
 congress_poland_restrictions: "Organický statut: armáda" # todo: NEW TRANSLATION
 congress_poland_laws: "Organický statut: zákony" # todo: NEW TRANSLATION
 congress_poland.5.t: "Organický statut" # todo: NEW TRANSLATION
 congress_poland.5.d: "Po [glossary_november_uprising] [SCOPE.sCountry('russia_poland_scope').GetName] výrazně omezilo [SCOPE.sCountry('congress_poland_scope').GetAdjectiveNoFormatting] autonomii. [SCOPE.sCountry('congress_poland_scope').GetName] nesmí zřizovat armádu, otevírat univerzity ani přijímat vlastní zákony. Na všechny státní záležitosti bude dohlížet ruský místodržící." # todo: NEW TRANSLATION
 congress_poland.5.f: "Čas od času k nám do Litvy dorazí zprávy\no starém žebrákovi, jenž bez nohy či paže\nnatahuje jedinou ruku pro chléb.\nKdyž almužnu přijme,\nohlédne se po panském sídle s obavou: zda tam není\nruský voják, jarmulka či rudý\nlímec. Pak bez studu přizná,\nže kdysi vedl polskou legii.\n\n—Adam Mickiewicz, #italic Pan Tadeusz#!" # todo: NEW TRANSLATION
 congress_poland.5.a: "A tak se vrací se svými starými a unavenými kostmi..." # todo: NEW TRANSLATION
 congress_poland.5.a.tt: "... do vlasti, kterou už nemůže bránit" # todo: NEW TRANSLATION
 poland_has_conciliatory_viceroy: "Polsko má #b smířlivého#! místokrále" # todo: NEW TRANSLATION
 poland_has_repressive_viceroy: "Polsko má #b represivního#! místokrále" # todo: NEW TRANSLATION
 poland_army_button: "Obnovit polskou armádu" # todo: NEW TRANSLATION
 poland_army_button_desc: "Polská armáda byla po Listopadovém povstání násilně rozpuštěna. Možná by ji nyní bylo možné obnovit, pokud by nad ní byl zajištěn náležitý dohled." # todo: NEW TRANSLATION
 congress_poland_red_conscription: "Polské povstání" # todo: NEW TRANSLATION
 pol_cannot_build_unis: "Nelze postavit [GetBuildingType('building_university').GetName], dokud nebude znovu otevřena #b Varšavská univerzita#!" # todo: NEW TRANSLATION
 poland_sejm_button: "Obnovit Sejm" # todo: NEW TRANSLATION
 poland_sejm_button_desc: "Sejm pod ruským místokrálem sice zasedá v tajnosti, ale bez valného účinku. Má-li Polsko někdy získat autonomii, musí Sejm znovu dostat pravomoc vládnout." # todo: NEW TRANSLATION
