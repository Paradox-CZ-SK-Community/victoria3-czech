 rus_prov_gov.1.t: "Prozatímní už jen podle názvu" # todo: NEW TRANSLATION
 rus_prov_gov.1.d: "Navzdory všem očekáváním má země [SCOPE.sCountry('russia_scope').GetName] stabilní vládu. Budoucnost jistě nebude bez problémů, přinejmenším se však podařilo odvrátit ničivou [concept_civil_war]." # todo: NEW TRANSLATION
 rus_prov_gov.1.f: "Nebyl to nekrvavý převrat ani zcela pokojné předání moci. Nebyla to však krvavá lázeň. Nespočet ruských matek se věnuje svým každodenním povinnostem jako vždy, aniž by musely pohřbívat své syny." # todo: NEW TRANSLATION
 rus_prov_gov.1.a: "Jaké štěstí, že se to obešlo s tak malým krveprolitím." # todo: NEW TRANSLATION
 rus_prov_gov.2.t: "Prozatímní vláda" # todo: NEW TRANSLATION
 rus_prov_gov.2.d: "Revoluce! Starý režim padl a v [SCOPE.sState('russia_capital').GetCityHubName] se moci chopila nová [SCOPE.sCountry('russia_scope').GetAdjective] vláda v čele s [SCOPE.sCharacter('russia_ruler_scope').GetFullName], která prosazuje [SCOPE.sLaw('principles_law').GetName]. Zatímco zavádí nový systém [SCOPE.sLaw('power_law').GetName], reakcionáři i radikálové se začínají ozbrojovat na [concept_civil_war]." # todo: NEW TRANSLATION
 rus_prov_gov.2.f: "„Svět se domnívá, že ruská revoluce skončila. Nenechte se zmást. Ruská revoluce teprve začíná.“\n\n—Alexander Kerenskij" # todo: NEW TRANSLATION
 rus_prov_gov.2.a: "Co si počneme?" # todo: NEW TRANSLATION
 rus_prov_gov_no_civil_wars: "Neprobíhá žádná aktivní [concept_civil_war]" # todo: NEW TRANSLATION
 rus_prov_gov.3.t: "Samospráva neruských národností" # todo: NEW TRANSLATION
 rus_prov_gov.3.d: "V masách nominálně [SCOPE.sCountry('russia_scope').GetAdjective] poddaných se probudil neochvějný národní [concept_fervor] a v chaosu revoluce vyhlásily autonomní vlády. Znepokojivá je především nově vyhlášená vláda [SCOPE.sCountry('rus_autonomy_nation').GetGovernment.GetName] v zemi [SCOPE.sCountry('rus_autonomy_nation').GetName]." # todo: NEW TRANSLATION
 rus_prov_gov.3.f: "„Rusové jsou všichni víceméně převlečení imperialisté, včetně revolucionářů. Jejich povahy, vždy toužící po absolutnu, se vyznačují výrazným centralismem. Nesnášejí rozmanitost, nedokáží se smířit s nesouladem – to vše otupuje jejich vůli a představivost.“\n\n—Józef Piłsudski" # todo: NEW TRANSLATION
 rus_prov_gov.3.a: "Budou toho litovat." # todo: NEW TRANSLATION
 je_russia_civil_war: "Ruská občanská válka" # todo: NEW TRANSLATION
 je_russia_civil_war_reason: "V Rusku je snad tolik znepřátelených frakcí, kolik je mužů se zbraní v ruce. Zemi pohltila rozsáhlá občanská válka a násilí neskončí, dokud nebudou všichni Rusové opět sjednoceni pod jedinou vládou.\n$TOOLTIP_DELIMITER$\n@information! [Concept('concept_truce','$concept_truces|q$')] mezi zeměmi, jejichž [Concept('concept_primary_cultures','$concept_primary_culture|q$')] zahrnují kulturu [GetCulture('russian').GetName], budou rychle zrušeny." # todo: NEW TRANSLATION
 je_rus_civil_war_header: "K ukončení ruské občanské války:\n" # todo: NEW TRANSLATION
 je_rus_civil_war_conclusion_desc: "$concept_journal_entry$ skončil ukončením #b ruské občanské války#!" # todo: NEW TRANSLATION
