 dismissed_atocha_railway_je_tt: "#r The #bold $je_atocha_railway$#! [concept_journal_entry] bude zamítnut#!" # todo: NEW TRANSLATION
 atocha_railway_accepted: "Schváleno: výstavba nádraží" # todo: NEW TRANSLATION
 atocha_railway_rejected: "Odmítnuto: výstavba nádraží" # todo: NEW TRANSLATION
 atocha_railway.2.t: "Inaugurace $building_estacion_de_madrid_atocha$" # todo: NEW TRANSLATION
 atocha_railway.2.d: "V srdci [SCOPE.sState('relevant_state').GetCityHubName] je nyní v provozu $building_estacion_de_madrid_atocha$. Aspirae [SCOPE.gsInterestGroup('relevant_ig').GetNameNoFormatting] byly naplněny." # todo: NEW TRANSLATION
 atocha_railway.2.f: "Nově postavené nádraží je malebné se svými červenými cihlami z jemného lisovaného písku a terakotovými ozdobami. Hlavní loď haly $building_estacion_de_madrid_atocha$ vítá příliv cestujících při příjezdu do [SCOPE.sState('relevant_state').GetNameNoFormatting] a zve je do rušných ulic [SCOPE.sState('relevant_state').GetCityHubName]." # todo: NEW TRANSLATION
 atocha_railway.2.a: "Přínosy železniční stanice jsou nevyčíslitelné." # todo: NEW TRANSLATION
 atocha_railway.2.b: "$building_estacion_de_madrid_atocha$ je více než nádraží; je to umělecké dílo!" # todo: NEW TRANSLATION
 atocha_railway_reward_loc: "Robustní železnice" # todo: NEW TRANSLATION
 atocha_railway_reward_int: "Pečlivě zpracované umění" # todo: NEW TRANSLATION
 je_manila_cathedral: "Přestavba manilské katedrály" # todo: NEW TRANSLATION
 je_manila_cathedral_reason: "Poškození způsobené velmi silným zemětřesením nechalo $building_manila_cathedral_original$ zřícený. Jak se [SCOPE.sState('relevant_state').GetNameNoFormatting] zotavuje z následků katastrofy, [GetPopType('clergymen').GetNameNoFormatting] z [SCOPE.gsInterestGroup('relevant_ig').GetNameNoFormatting] shromáždili prostředky a chtějí postoupit s rekonstrukcí katedrály." # todo: NEW TRANSLATION
