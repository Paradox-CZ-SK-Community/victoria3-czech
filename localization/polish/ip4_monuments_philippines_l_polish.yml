 sagrada_familia_3_construct_tt: "Další fasáda pro $building_sagrada_familia_cathedral_3$ může být postavena v Panelu státu pro [SelectLocalization(SCOPE.sState('relevant_state').IsValid, SCOPE.sState('relevant_state').GetName, 'STATE_CATALONIA')]. Vyžaduje $pneumatic_tools$ [concept_technology]." # todo: NEW TRANSLATION
