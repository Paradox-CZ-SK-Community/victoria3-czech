l_polish:
 je_philippines_development: "Pokroky v souostroví" # todo: NEW TRANSLATION
 je_philippines_development_reason: "V dalekém souostroví [ROOT.GetCountry.GetNameNoFlag] zvýšený mezinárodní obchod připravil půdu pro to, aby se rozrůstající střední třída získala větší vliv navzdory probíhajícím politickým otřesům.\n\nRozvíjejte domácí zemědělský sektor, zvyšte [concept_sol] a stavějte přístavy, aby byla zajištěna plodná budoucnost [ROOT.GetCountry.GetNameNoFormatting]." # todo: NEW TRANSLATION
 philippines10a_tt: ""$STATE_VISAYAS$ bude jistě vzkvétat po generace."" # todo: NEW TRANSLATION
 philippines10b_tt: ""$STATE_MINDANAO$ bude pokračovat v rozvoji jako prosperující region."\n$TAB$#b #r Option only available if [JournalEntry.GetCountry.GetName] own Port of Davao#! #!" # todo: NEW TRANSLATION
 modifier_archipelagic_anger: "Přerušené obchodní vazby" # todo: NEW TRANSLATION
 modifier_developmental_dearth: "Nedostatek rozvoje" # todo: NEW TRANSLATION
 je_filipino_ethnogenesis: "Etnogeneze souostroví" # todo: NEW TRANSLATION
 je_filipino_ethnogenesis_reason: "V [ROOT.GetCountry.GetAdjective] zemi žije mnoho národů, které – přestože sdílejí společnou historii – zůstávají odlišné co se týče kultury a jazyka. Pokud chceme vybudovat silný národ, musí být tyto drobné rozdíly potlačeny." # todo: NEW TRANSLATION
 je_filipino_ethnogenesis_colonization_button: "Kolonizovat [GetStateRegion('STATE_MINDANAO').GetName]" # todo: NEW TRANSLATION
 je_filipino_ethnogenesis_colonization_button_desc: "Od válečných sultanátů v zálivu [GetCulture('moro').GetName] až po roztříštěné kmeny [GetCulture('lumad').GetName] v horách, obyvatelé [GetStateRegion('STATE_MINDANAO').GetName] dlouho odolávali našim pokusům vnést do této necivilizované země pořádek.\n\nJe čas je přivést ke filipínskému společenství, ať už to chtějí nebo ne." # todo: NEW TRANSLATION
 modifier_integrating_the_highlands: "Integrace vysočiny" # todo: NEW TRANSLATION
 modifier_settling_the_highlands_cost: "Infrastrukturní projekty na Mindanau" # todo: NEW TRANSLATION
 modifier_phi_spanish_vision: "Perla Španělského Orientu" # todo: NEW TRANSLATION
 modifier_phi_indepenent_vision: "Svoboda, spravedlnost a rovnost" # todo: NEW TRANSLATION
 modifier_popular_genesis: "Lidové zrození" # todo: NEW TRANSLATION
 je_philippines_main: "Perla del Mar de Oriente" # todo: NEW TRANSLATION
 je_philippines_main_reason: "Vzestup sociální mobility rozrůstající se střední třídy přispěl k rostoucímu národnímu vědomí. Napětí v rámci [ROOT.GetCountry.GetName] sílí. [GetCulture('spanish').GetName] [GetPopType('clergymen').GetName] dominují světskému i náboženskému životu, zatímco [GetCulture('filipino_mestizo').GetName] [GetPopType('clergymen').GetNameNoFormatting] vedou povstání proti jejich autoritě. [GetCulture('filipino_mestizo').GetNameNoFormatting] elity z [SCOPE.gsInterestGroup('intelligentsia_ig').GetName] rovněž manévrují za větší zastoupení ve vládě.\n\nNakonec vláda [SelectLocalization(ROOT.GetCountry.GetTopOverlord.IsValid, ROOT.GetCountry.GetTopOverlord.GetAdjective, 'SPA_ADJ')] očekává, že [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] udrží železnou vládu nad svým územím v Pacifiku. Toto napětí hrozí rozvrácením naší stability a ohrožuje budoucnost [ROOT.GetCountry.GetName]." # todo: NEW TRANSLATION
 philippines2a_tt: ""Budoucnost [JournalEntry.GetCountry.GetName] je světlá."" # todo: NEW TRANSLATION
 philippines3a_tt: ""Toto skutečně znamená novou kapitolu pro naši zemi."" # todo: NEW TRANSLATION
 spain_is_overlord_tt: "[concept_overlord] je #b $SPA$#!" # todo: NEW TRANSLATION
 filipino_assimilation_tooltip: "Každý [GetCulture('filipino_mestizo').GetName] [concept_pop], [concept_character] a [concept_homeland] se stane [GetCulture('filipino').GetName]" # todo: NEW TRANSLATION
 filipino_hispanophone_assimilation_tooltip: "Každý [GetCulture('filipino_mestizo').GetName] [concept_pop], [concept_character] a [concept_homeland] se stane [GetCulture('filipino_hispanophone').GetName]" # todo: NEW TRANSLATION
