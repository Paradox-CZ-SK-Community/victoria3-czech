 manila_cathedral.2.t: "Šestá $building_manila_cathedral_monument$" # todo: NEW TRANSLATION
 manila_cathedral.2.d: "Navzdory poškození a zkáze svého předchůdce je $building_manila_cathedral_monument$ opět katedrálou arcidiecéze Manily." # todo: NEW TRANSLATION
 manila_cathedral.2.f: "\"Ačkoli je jméno Manila dáno hlavnímu městu Filipínských ostrovů, původně se popisovalo pouze opevnění a posádka obsazená úřady. ... Palác zabírá jednu stranu veřejného náměstí ve fortu, katedrála druhou tutéž lokalitu, připomínající náměstí v Londýně, ale s výhodou, že má své centrum zdobeno slavnou tropickou vegetací, jejíž listy vykazují všechny varianty barev, od nejsvětlejší žluté po nejhlubší zelenou, a jejich květy jsou pozoruhodné svojí nádherou a krásou.\"\n\n— John Bowring" # todo: NEW TRANSLATION
 manila_cathedral.2.a: "Katedrála je dojemným projevem oddanosti." # todo: NEW TRANSLATION
 manila_cathedral.2.b: "Katedrála bude sloužit jako trvalý symbol Manily." # todo: NEW TRANSLATION
