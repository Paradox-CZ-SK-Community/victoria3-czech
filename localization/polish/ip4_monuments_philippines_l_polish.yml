 sagrada_familia_accepted: "Přijato: výstavba katedrály" # todo: NEW TRANSLATION
 sagrada_familia_rejected: "Odmítnuto: výstavba katedrály" # todo: NEW TRANSLATION
 sagrada_familia.2.t: "Nativitní fasáda" # todo: NEW TRANSLATION
 sagrada_familia.2.d: "Byl učiněn stálý pokrok ve vývoji $building_sagrada_familia_cathedral_3$. Ohromeni oddaností architekta projektu, [SCOPE.gsInterestGroup('relevant_ig').GetName] nyní podporují další fázi výstavby." # todo: NEW TRANSLATION
 sagrada_familia.2.f: "Z dálky východně orientovaná Nativitní fasáda $building_sagrada_familia_cathedral_1$ září, když ji zalévají zlaté paprsky úsvitu. Zakulacené, botanické tvary zobrazují narození Ježíše Krista. I v tomto částečně postaveném stavu je chrám zázrakem." # todo: NEW TRANSLATION
 sagrada_familia.2.a: "[SCOPE.gsInterestGroup('relevant_ig').GetNameNoFormatting] jsou pozorní." # todo: NEW TRANSLATION
 sagrada_familia_patron: "Modernistický mecenáš" # todo: NEW TRANSLATION
 sagrada_familia.3.t: "Nedokončené mistrovské dílo" # todo: NEW TRANSLATION
 sagrada_familia.3.d: "Nedokončená, ale nezanedbaná, výstavba $building_sagrada_familia_cathedral_3$ pokračuje i poté, co architekt, který původně navrhl velké plány chrámu, zemřel. Jeho nástupce převezme vedení, aby výstavba neutrpěla zanedbání." # todo: NEW TRANSLATION
 sagrada_familia.3.f: "\"Není důvod litovat, že nemohu kostel dokončit. Zestárnu, ale přijdou po mně další. Co se musí vždy zachovat, je duch díla, ale jeho život musí záviset na generacích, jimž je předáváno a s nimiž žije a je ztělesňováno.\"\n\n— Antoni Gaudí" # todo: NEW TRANSLATION
 sagrada_familia.3.a: "Jeho odkaz bude žít dál." # todo: NEW TRANSLATION
 sagrada_familia_construction: "Modernistické opus magnum" # todo: NEW TRANSLATION
 sagrada_familia.4.t: "Konec, prozatím" # todo: NEW TRANSLATION
 sagrada_familia.4.d: "Další fasáda $building_sagrada_familia_cathedral_3$ byla dokončena, což signalizuje konec výstavby, prozatím. Výjimečná vize modernistického architekta je zde v [SCOPE.sState('relevant_state').GetName] kulturním milníkem." # todo: NEW TRANSLATION
 sagrada_familia.4.f: "Po tolika letech výstavby byly uskutečněny ambiciózní architektonické návrhy další fasády. Cizí cestovatelé, kteří přicházejí k $building_sagrada_familia_cathedral_3$, obdivují jedinečný styl stavby. Dva návštěvníci stojí před nejnovějším přírůstkem chrámu.\n\n„Beroucí dech,“ poznamená jeden cestovatel, neschopný skrýt úžas ve svém hlasu.\n\nJeho společník se však dívá skepticky. „Snad je tento modernistický styl věc vkusu.“" # todo: NEW TRANSLATION
 sagrada_familia.4.a: "Takové výjimečné umění!" # todo: NEW TRANSLATION
 sagrada_familia.4.b: "Skutečný architektonický zázrak." # todo: NEW TRANSLATION
 sagrada_familia_reward_loc: "Modernistické mistrovské dílo" # todo: NEW TRANSLATION
 sagrada_familia_reward_int: "Architektonické uznání" # todo: NEW TRANSLATION
 je_pena_palace: "Slavný Eden" # todo: NEW TRANSLATION
 je_pena_palace_reason: "Choť [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] nedávno získal(a) starý klášter Pena na vrcholcích pohoří Sintra. S velkými uměleckými ambicemi se snaží přeměnit klášter na letní rezidenci královské rodiny." # todo: NEW TRANSLATION
 pena_palace_possible_tt: "[JournalEntry.GetCountry.GetName] má $building_pena_convent$ v [Concept('concept_state_region','$concept_state_region$')|l] $STATE_ESTREMADURA$" # todo: NEW TRANSLATION
 pena_palace_complete_tt: "[ROOT.GetCountry.GetNameNoFormatting] postavil $building_pena_palace$ v [Concept('concept_state_region','$concept_state_region$')|l] $STATE_ESTREMADURA$" # todo: NEW TRANSLATION
 pena_palace_populated_tt: "Pracovní síla $building_pena_palace$ [concept_occupancy] je větší nebo rovna #variable 50%#!" # todo: NEW TRANSLATION
 rejected_pena_palace_project_tt: "[ROOT.GetCountry.GetNameNoFormatting] odmítá návrh na výstavbu a renovaci $building_pena_palace$" # todo: NEW TRANSLATION
 does_not_have_state_estremadura_tt: "[ROOT.GetCountry.GetNameNoFormatting] nemá $STATE_ESTREMADURA$" # todo: NEW TRANSLATION
 pena_palace.1.t: "Slavný Eden" # todo: NEW TRANSLATION
 pena_palace.1.d: "Choť [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] plánuje zadat obnovu a renovaci kláštera Pena." # todo: NEW TRANSLATION
 pena_palace.1.f: "\"Hle! Cintrský slavný Eden zasahuje\nDo pestrého bludiště hor a údolí.\nAch ó! která ruka může vést tužku či pero,\nAby zachytila polovinu toho, na co oko rozšíří zrak\nS pohledy více oslnivými pro smrtelné vnímání\nNež ty, o nichž bard vypráví,\nKterý světu otevřel brány Elysia?\"\n\n— Lord Byron" # todo: NEW TRANSLATION
 pena_palace.1.a: "Palác bude uměleckým úspěchem pro [ROOT.GetCountry.GetNameNoFormatting]!" # todo: NEW TRANSLATION
 pena_palace.1.b: "Jak pošetilé." # todo: NEW TRANSLATION
 pena_palace_construct_tt: "$building_pena_palace$ může být postaven v Panelu státu pro [SelectLocalization(SCOPE.sState('relevant_state').IsValid, SCOPE.sState('relevant_state').GetName, 'STATE_ESTREMADURA')]" # todo: NEW TRANSLATION
 dismissed_pena_palace_je_tt: "#r The #bold $je_pena_palace$#! [concept_journal_entry] bude zamítnut#!" # todo: NEW TRANSLATION
 pena_palace_accepted: "Schváleno: výstavba paláce" # todo: NEW TRANSLATION
 pena_palace_rejected: "Odmítnuto: výstavba paláce" # todo: NEW TRANSLATION
 pena_palace.2.t: "Perla Sintry" # todo: NEW TRANSLATION
 pena_palace.2.d: "Renovace $building_pena_palace$ jsou nyní dokončeny. Zříceniny bývalého kláštera byly důkladně přetvořeny." # todo: NEW TRANSLATION
 pena_palace.2.f: "Za jasného dne, když se mlha v pohoří Sintra rozplyne, lze stavbu na vrcholcích spatřit z [SCOPE.sState('relevant_state').GetCityHubName]. Vznikla z královské fantazie a byla znovu přetvořena romantickým architektem; jasně červené a žluté fasády $building_pena_palace$ září — pravý poklad [ROOT.GetCountry.GetAdjectiveNoFormatting]." # todo: NEW TRANSLATION
 pena_palace.2.a: "Krása paláce je nezpochybnitelná." # todo: NEW TRANSLATION
 pena_palace.2.b: "Svět bude obdivovat náš umělecký počin." # todo: NEW TRANSLATION
 pena_palace_reward_loc: "Palácový ráj" # todo: NEW TRANSLATION
 pena_palace_reward_int: "Král-umělec" # todo: NEW TRANSLATION
 je_gran_teatro: "Gran Teatro" # todo: NEW TRANSLATION
 je_gran_teatro_reason: "V srdci [SCOPE.sState('relevant_state').GetName] se nachází Plaza de Isabella, pečlivě udržované náměstí, kde lze najít některá z nejoblíbenějších kaváren a restaurací [SCOPE.sState('relevant_state').GetCityHubName]. Lidé všech tříd se zde scházejí od devíti hodin večer až do pozdních hodin, oživujíce náměstí. Teatro Tacón je mezi mnoha výbornými podniky naproti náměstí. Přes velkolepé vnitřní vybavení však jeho vnější vzhled nechává mnoho vylepšit.\n\nČlenové [GetCulture('galician').GetName] z [SCOPE.gsInterestGroup('relevant_ig').GetName] vypracovali návrh na rozšíření a přestavbu místa, kde stojí Teatro Tacón, na $building_gran_teatro_de_la_habana$ s nadějí, že bude v dalších desetiletích velmi oslavován." # todo: NEW TRANSLATION
 gran_teatro_complete_tt: "[ROOT.GetCountry.GetNameNoFormatting] postavil $building_gran_teatro_de_la_habana$ v [Concept('concept_state_region','$concept_state_region$')|l] $STATE_WESTERN_CUBA$" # todo: NEW TRANSLATION
 gran_teatro_populated_tt: "Pracovní síla $building_gran_teatro_de_la_habana$ [concept_occupancy] je větší nebo rovna #variable 50%#!" # todo: NEW TRANSLATION
 rejected_gran_teatro_project_tt: "Návrh na výstavbu $building_gran_teatro_de_la_habana$ byl odmítnut" # todo: NEW TRANSLATION
 does_not_have_state_western_cuba_tt: "[ROOT.GetCountry.GetNameNoFormatting] nemá $STATE_WESTERN_CUBA$" # todo: NEW TRANSLATION
 gran_teatro.1.t: "Rozšíření umění v $HUB_NAME_STATE_WESTERN_CUBA_city$" # todo: NEW TRANSLATION
 gran_teatro.1.d: "Členové [GetCulture('galician').GetName] z [SCOPE.gsInterestGroup('relevant_ig').GetName] vypracovali návrh na výstavbu $building_gran_teatro_de_la_habana$ v srdci [SCOPE.sState('relevant_state').GetName] na místě Teatro Tacón. Skupina shromáždila značnou částku peněz k financování této přestavby." # todo: NEW TRANSLATION
 gran_teatro.1.f: "\"Oslavené divadlo Tacon čelí Paseo de Isabella a stojí na rohu ulice San Rafael. Je to prostorná stavba, ale z vnější strany velmi jednoduchá a nevýrazná. ... Fresky jsou v dobrém stylu a ornamentace, aniž by byla přehnaná, je vynikající a harmonická. Velký, nádherný skleněný lustr, osvětlený plynem, a četné menší vevnitř dávají tomuto elegantnímu domu zářivé světlo, což z něj činí jedno z největších divadel na světě.\" \n\n— Maturin Murray Ballou" # todo: NEW TRANSLATION
 gran_teatro.1.a: "Velkolepost $building_gran_teatro_de_la_habana$ bude nepochybná." # todo: NEW TRANSLATION
 gran_teatro.1.b: "[SCOPE.sState('relevant_state').GetCityHubName] takové podnikání nepotřebuje." # todo: NEW TRANSLATION
 gran_teatro_construct_tt: "$building_gran_teatro_de_la_habana$ může být postaven v Panelu státu pro [SelectLocalization(SCOPE.sState('relevant_state').IsValid, SCOPE.sState('relevant_state').GetName, 'STATE_WESTERN_CUBA')]" # todo: NEW TRANSLATION
 dismissed_gran_teatro_je_tt: "#r The #bold $je_gran_teatro$#! [concept_journal_entry] bude zamítnut#!" # todo: NEW TRANSLATION
 gran_teatro_accepted: "Schváleno: výstavba divadla" # todo: NEW TRANSLATION
 gran_teatro_rejected: "Odmítnuto: výstavba divadla" # todo: NEW TRANSLATION
 gran_teatro.2.t: "Palacio del Centro Gallego" # todo: NEW TRANSLATION
 gran_teatro.2.d: "Stavba a renovace navržená členy [GetCulture('galician').GetName] z [SCOPE.gsInterestGroup('relevant_ig').GetName] je nyní dokončena. Umění vzkvétá nejen v nově postaveném $building_gran_teatro_de_la_habana$, ale také v ulicích [SCOPE.sState('relevant_state').GetCityHubName]." # todo: NEW TRANSLATION
 gran_teatro.2.f: "\"Večerní hudba pod širým nebem je vždy přitažlivá, ale nikde není její vliv více patrný než pod mírným svitem tropických nocí. Nikde si nelze představit hudební představení, které by bylo posloucháno s větší chutí a oceněním než na Plaza de Armas nebo Parque de Isabella v Havaně. Tam se v době koncertů sjíždějí všechny vrstvy obyvatel. ... I prosté třídy jsou vidět ve velkém počtu, tiše se procházejí na okrajích náměstí a naslouchají krásným vystoupením orchestru a tiše vychutnávají hudbu, 'zkročenou a vedenu touto čarovnicí stále.'\"\n\n— Maturin Murray Ballou" # todo: NEW TRANSLATION
 gran_teatro.2.a: "Umění $CUB_ADJ$ bude v regionu vzkvétat." # todo: NEW TRANSLATION
 gran_teatro.2.b: "To jistě postaví $CUB_ADJ$ umění na světovou scénu." # todo: NEW TRANSLATION
 gran_teatro_reward_loc: "Vzkvétající umění" # todo: NEW TRANSLATION
 gran_teatro_reward_int: "Přítomnost na jevišti" # todo: NEW TRANSLATION
 je_atocha_railway: "Železniční stanice Atocha" # todo: NEW TRANSLATION
 je_atocha_railway_reason: "Po mnoho let se [SCOPE.gsInterestGroup('relevant_ig').GetName] snažila postavit $building_estacion_de_madrid_atocha$ v [SCOPE.sState('relevant_state').GetName]. Jejich snahy byly zhatěny protichůdnými požadavky a zájmy — od zásahů vlády až po smrt najatého architekta, který měl dohlížet na stavbu. Žádný návrh dosud nesplnil všechna kritéria.\n\nNaděje [SCOPE.gsInterestGroup('relevant_ig').GetNameNoFormatting] na postavení stanice však neuvadly. Věří, že $building_estacion_de_madrid_atocha$ bude klíčovou institucí pro [ROOT.GetCountry.GetNameNoFormatting] nejen v rámci [SCOPE.sState('relevant_state').GetNameNoFormatting], ale i napříč celým kontinentem." # todo: NEW TRANSLATION
 atocha_railway_possible_tt: "[ROOT.GetCountry.GetNameNoFormatting] má $building_railway$ v [Concept('concept_state_region','$concept_state_region$')|l] $STATE_NEW_CASTILE$" # todo: NEW TRANSLATION
 atocha_railway_complete_tt: "[ROOT.GetCountry.GetNameNoFormatting] postavil $building_estacion_de_madrid_atocha$ v [Concept('concept_state_region','$concept_state_region$')|l] $STATE_NEW_CASTILE$" # todo: NEW TRANSLATION
 atocha_railway_populated_tt: "Pracovní síla $building_estacion_de_madrid_atocha$ [concept_occupancy] je větší nebo rovna #variable 50%#!" # todo: NEW TRANSLATION
 rejected_atocha_railway_project_tt: "[ROOT.GetCountry.GetNameNoFormatting] odmítá návrh na výstavbu $building_estacion_de_madrid_atocha$." # todo: NEW TRANSLATION
 does_not_have_state_new_castile_tt: "[ROOT.GetCountry.GetNameNoFormatting] nemá $STATE_NEW_CASTILE$" # todo: NEW TRANSLATION
 atocha_railway.1.t: "Revidovaný návrh" # todo: NEW TRANSLATION
 atocha_railway.1.d: "Po sérii zamítnutých plánů se revidovaný návrh od nově najatého architekta zdá splňovat kritéria jak vlády, tak [SCOPE.gsInterestGroup('relevant_ig').GetName], aby mohla začít výstavba $building_estacion_de_madrid_atocha$." # todo: NEW TRANSLATION
 atocha_railway.1.f: "Mladý inženýr, velký znalec železné architektury v módě ve $FRA$, předkládá nejnovější návrhy $building_estacion_de_madrid_atocha$ výboru k posouzení. Členové [SCOPE.gsInterestGroup('relevant_ig').GetNameNoFormatting] pozorují s nadšením a po mnoha letech debat jsou s revidovanými plány výrazně spokojeni.\n\nInženýr všechny ujišťuje o životaschopnosti projektu: \"Jakmile bude projekt schválen, práce může začít ihned!\"" # todo: NEW TRANSLATION
 atocha_railway.1.a: "To je rozhodně v souladu se zájmy všech." # todo: NEW TRANSLATION
 atocha_railway.1.b: "[SCOPE.gsInterestGroup('relevant_ig').GetNameNoFormatting] špatně odhadli poptávku po takové stavbě." # todo: NEW TRANSLATION
