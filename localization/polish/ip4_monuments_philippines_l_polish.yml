 je_philippines_ethnogenesis_header_reliance_on_complete: "#title Pokud vyústí v #b hispanofonní etnogenezi#! výsledek:#!\n$EFFECT$" # todo: NEW TRANSLATION
 je_philippines_main_ilustrado_button: "Podpořit Ilustrados" # todo: NEW TRANSLATION
 je_philippines_main_ilustrado_button_desc: "Mnoho vyšších a středních vrstev [GetCulture('filipino_mestizo').GetCustom('getPluralDemonym')] a takzvaní #italic Indios#! byly vystaveny ideálům [GetCulture('spanish').GetName] [GetIdeology('ideology_liberal').GetName]. Tato rychle rostoucí vzdělaná třída začala tíhnout k [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName]. Usilují o reformu zákonů a zavedení liberálnější agendy v [ROOT.GetCountry.GetName]." # todo: NEW TRANSLATION
 je_philippines_development_complete: "Dokončeno $je_philippines_development$ [concept_journal_entry]." # todo: NEW TRANSLATION
 notification_filipino_mestizo_now_primary_culture_name: "[GetCulture('spanish').GetName] již není [Concept('concept_primary_cultures','$concept_primary_culture$')|l]" # todo: NEW TRANSLATION
 notification_filipino_mestizo_now_primary_culture_desc: "Teď, když již nejsme pod vládou $SPA_ADJ$, je [GetCulture('filipino_mestizo').GetName] naším [Concept('concept_primary_cultures','$concept_primary_culture$')|l]." # todo: NEW TRANSLATION
 notification_filipino_mestizo_now_primary_culture_tooltip: "#header $notification_filipino_mestizo_now_primary_culture_name$#!\n$TOOLTIP_DELIMITER$\n$notification_filipino_mestizo_now_primary_culture_desc$" # todo: NEW TRANSLATION
 philippines.1.t: "[ROOT.GetCountry.GetAdjective] identita" # todo: NEW TRANSLATION
 philippines.1.d: "Vzhledem k rostoucímu napětí více lidí usiluje o větší zastoupení ve vládě, zatímco jiní volají po nezávislosti na [ROOT.GetCountry.GetTopOverlord.GetName]. Převezme [ROOT.GetCountry.GetTopOverlord.GetAdjectiveNoFormatting] vláda otěže, nebo se lid [ROOT.GetCountry.GetName] prosadí a získá větší svobody?" # todo: NEW TRANSLATION
 philippines.1.f: ""Filipíny tedy zůstanou pod španělskou nadvládou, ale s více zákony a větší svobodou, nebo se vyhlásí za nezávislé, poté co ony i mateřská země budou ponořeny v krvi.\n\nJelikož by nikdo neměl toužit či doufat v takové nešťastné roztržení, které by bylo zlem pro všechny a jen posledním argumentem v nejzoufelé situaci, pojďme se podívat, jakými formami pokojné evoluce mohou ostrovy zůstat pod španělskou autoritou s co nejmenší újmou na právech, zájmech a důstojnosti obou stran.\"\n\n—José Rizal, #italic The Philippines a Century Hence#!" # todo: NEW TRANSLATION
 philippines.1.a: "Získání nezávislosti je zásadní." # todo: NEW TRANSLATION
 philippines.1.b: "Nakonec odpovídáme [ROOT.GetCountry.GetTopOverlord.GetNameNoFlag]." # todo: NEW TRANSLATION
 modifier_phi_lib_gain: "Vznikající hnutí za nezávislost" # todo: NEW TRANSLATION
 modifier_phi_lib_lose: "Španělsko-filipínské bratrské spolky" # todo: NEW TRANSLATION
 philippines.2.t: "Milovaná země, vyvolená země" # todo: NEW TRANSLATION
 philippines.2.d: "Nezávislé a prosperující, [ROOT.GetCountry.GetName] bude v Pacifiku pevnou silou po mnoho příštích let." # todo: NEW TRANSLATION
 philippines.2.f: ""Země jitřní,\nDítě vracejícího se slunce,\nS planoucí vášní\nTebe naše duše milují."\n\n–José Palma, #italic Lupang Hinirang#!" # todo: NEW TRANSLATION
 philippines.2.a: "Budoucnost [ROOT.GetCountry.GetName] je světlá." # todo: NEW TRANSLATION
 notification_filipino_culture_genesis_name: "Zrod kultury [GetCulture('filipino').GetName]" # todo: NEW TRANSLATION
 notification_filipino_culture_genesis_desc: "[SCOPE.sCountry('filipino_nation_scope').GetName] zažil rozsáhlé kulturní probuzení a přechází k odlišné kultuře [GetCulture('filipino').GetName]." # todo: NEW TRANSLATION
 notification_filipino_culture_genesis_tooltip: "#header $notification_filipino_culture_genesis_name$#!\n$TOOLTIP_DELIMITER$\n$notification_filipino_culture_genesis_desc$" # todo: NEW TRANSLATION
 philippines.3.t: "Závislost na [SelectLocalization(ROOT.GetCountry.GetTopOverlord.IsValid, ROOT.GetCountry.GetTopOverlord.GetNameNoFormatting, 'SPA')]" # todo: NEW TRANSLATION
 philippines.3.d: "Nadále těžíme z našich vazeb s metropolí, neboť záležitosti [ROOT.GetCountry.GetTopOverlord.GetAdjective] a [ROOT.GetCountry.GetAdjective] se stále více prolínají." # todo: NEW TRANSLATION
 philippines.3.f: "[ROOT.GetCountry.GetTopOverlord.GetAdjectiveNoFormatting] vláda v tomto souostroví zůstává pevná, jak tomu bylo po staletí, a obyvatelé [ROOT.GetCountry.GetNameNoFormatting] projevují rostoucí odhodlání posilovat vazby s [ROOT.GetCountry.GetTopOverlord.GetNameNoFormatting].\n\nPro některé členy [SCOPE.gsInterestGroup('ilustrado_ig_scope').GetNameNoFormatting] je to vítězství a příslib skvělých časů. Pro jiné jsou tyto pevné vazby znepokojující a představují hrozbu pro budoucnost země." # todo: NEW TRANSLATION
 philippines.3.a: "To skutečně znamená novou kapitolu pro naši zemi." # todo: NEW TRANSLATION
 modifier_metropole_business_networks: "Finanční vazby s metropolí" # todo: NEW TRANSLATION
 modifier_national_consolidation: "Snaha o národní konsolidaci" # todo: NEW TRANSLATION
 notification_filipino_hispanophone_culture_genesis_name: "Zrod kultury [GetCulture('filipino_hispanophone').GetName]" # todo: NEW TRANSLATION
 notification_filipino_hispanophone_culture_genesis_desc: "[SCOPE.sCountry('filipino_nation_scope').GetName] zažil rozsáhlé kulturní probuzení a přechází k odlišné kultuře [GetCulture('filipino_hispanophone').GetName]." # todo: NEW TRANSLATION
 notification_filipino_hispanophone_culture_genesis_tooltip: "#header $notification_filipino_hispanophone_culture_genesis_name$#!\n$TOOLTIP_DELIMITER$\n$notification_filipino_hispanophone_culture_genesis_desc$" # todo: NEW TRANSLATION
 philippines.4.t: "Srážka místního kléru" # todo: NEW TRANSLATION
 philippines.4.d: "Novinový článek napsaný na protest proti starému dekretu [ROOT.GetCountry.GetTopOverlord.GetAdjective] vlády tvrdí, že [GetCulture('filipino_mestizo').GetName] faráři by měli mít stejnou moc jako [GetCulture('spanish').GetName] faráři." # todo: NEW TRANSLATION
 philippines.4.f: "Článek se šířil po celém [ROOT.GetCountry.GetCapital.GetCityHubName] a rozzuřil jak faráře [GetCulture('spanish').GetNameNoFormatting], tak vládní úředníky.\n\n„Desítky let spravovali místní farnosti faráři [GetCulture('filipino_mestizo').GetNameNoFormatting],“ tvrdil anonymní pisatel. „Proč musíme opět odevzdat kontrolu [GetCulture('spanish').GetNameNoFormatting]?“" # todo: NEW TRANSLATION
 philippines.4.a: "Faráři [GetCulture('filipino_mestizo').GetNameNoFormatting] jsou stejně schopni spravovat místní farnosti." # todo: NEW TRANSLATION
 philippines.4.b: "Přínos farářů [GetCulture('spanish').GetName] byl neocenitelný." # todo: NEW TRANSLATION
 pedro_pelaez_appears_tt: "Pedro Peláez se objevuje v [ROOT.GetCountry.GetNameNoFormatting]" # todo: NEW TRANSLATION
 friar_agitator_popularity: "Podpora místního kléru" # todo: NEW TRANSLATION
 philippines.5.t: "Ilustradské reformy" # todo: NEW TRANSLATION
 philippines.5.d: "Díky našemu úsilí si Ilustrados zajistili větší postavení v [ROOT.GetCountry.GetAdjective] vládě." # todo: NEW TRANSLATION
 philippines.5.f: ""Existuje nyní početná osvícená třída uvnitř i mimo Ostrovy, třída vytvořená a neustále rozmnožovaná hloupostí určitých vládnoucích mocností, která nutí obyvatele opustit zemi, aby získali vzdělání v zahraničí, a je udržována a bojuje díky provokacím a systému špionáže v kurzu. Tato třída, jejíž počet kumulativně roste, je v neustálé komunikaci se zbytkem ostrovů, a pokud dnes tvoří jen mozek země, během několika let vytvoří celé nervové soustavy a projeví svou existenci ve všech svých činech.\"\n\n—José Rizal, #italic The Philippines a Century Hence#!" # todo: NEW TRANSLATION
 philippines.5.a: "Vliv Ilustrados bude nadále růst." # todo: NEW TRANSLATION
 ilustrados_education_fervor_add: "Zapálení pedagogové" # todo: NEW TRANSLATION
 philippines.7.t: "Guardia Civil na Filipínách" # todo: NEW TRANSLATION
 philippines.7.d: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetLastName] jménem [ROOT.GetCountry.GetTopOverlord.GetAdjectiveNoFormatting] administrace zavedl do [ROOT.GetCountry.GetAdjectiveNoFormatting] souostroví [GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetNameWithCountryVariant]." # todo: NEW TRANSLATION
 philippines.7.f: ""Přesto navzdory tolika nepříznivým okolnostem byla španělská moc udržena více než tři století a, i když byla omezena, stále pokračuje v řízení osudů filipínské skupiny.\"\n\n—José Rizal, #italic The Philippines a Century Hence#!" # todo: NEW TRANSLATION
 philippines.7.a: "Ale budou důstojníci zneužívat svou nově nabytou moc?" # todo: NEW TRANSLATION
 philippines.7.b: "Velmi dobře, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] má vše dobře pod kontrolou." # todo: NEW TRANSLATION
 ig_guardia_civil_modifier_b: "Vliv guvernéra-generála" # todo: NEW TRANSLATION
 philippines.9.t: "Plodná budoucnost" # todo: NEW TRANSLATION
 philippines.9.d: "S otevřenými přístavy pro zahraniční obchod má souostroví větší potenciál stát se prosperujícím regionem. Přístavní města a zemědělský sektor mají nejvíce co získat." # todo: NEW TRANSLATION
 philippines.9.f: "Na pravém břehu řeky Pasig sídlí [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetNameNoFormatting], který dohlíží na rozvoj těchto ostrovů jménem [ROOT.GetCountry.GetTopOverlord.GetAdjectiveNoFormatting] administrace. A na téže řece tři míle níže jsou mola a skladiště zdatných obchodníků, kteří posilují ekonomiku nezanedbatelnou měrou.\n\n[ROOT.GetCountry.GetCapital.GetCityHubName], jeden z nejfrekventovanějších přístavů regionu, nabízí příležitosti těm, kteří je hledají." # todo: NEW TRANSLATION
 philippines.9.a: "Musíme soustředit naše úsilí na přístavy." # todo: NEW TRANSLATION
 philippines.9.b: "Je nezbytné soustředit se na rozvoj zemědělského sektoru." # todo: NEW TRANSLATION
 philippines_development_modifier_a: "Vyhlídky přístavních měst" # todo: NEW TRANSLATION
 philippines_development_modifier_b: "Zemědělství souostroví" # todo: NEW TRANSLATION
 philippines.10.t: "Působivý rozvoj" # todo: NEW TRANSLATION
 philippines.10.d: "Byla položena základna pro to, aby rostoucí střední třída získala větší politický vliv. V rozvoji souostroví byl učiněn stálý pokrok." # todo: NEW TRANSLATION
 philippines.10.f: "V [ROOT.GetCountry.GetCapital.GetCityHubName] je [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] ohromen rozvojem zemědělského sektoru a prosperujícími přístavy v [ROOT.GetCountry.GetNameNoFormatting].\n\nJak rozvoj země imponuje [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle], životy mnohých se zlepšují a peníze plní kapsy rostoucí střední třídy. Tyto sociálně vzestupné rodiny nyní posílají své děti na univerzity jak v [ROOT.GetCountry.GetCapital.GetCityHubName], tak do zahraničí. Domácí vyhlídky se rozhodně zlepšují." # todo: NEW TRANSLATION
 philippines.10.a: "[SCOPE.sState('visayas_scope').GetStateRegion.GetName] bude jistě vzkvétat po generace." # todo: NEW TRANSLATION
 philippines.10.b: "[SCOPE.sState('mindanao_scope').GetStateRegion.GetName] bude pokračovat v rozvoji jako prosperující region." # todo: NEW TRANSLATION
 unlocks_je_philippines_main_ilustrado_button_tt: "Splňuje požadavek pro použití tlačítka #b $je_philippines_main_ilustrado_button$#! v #b $je_philippines_main$#! [concept_journal_entry]" # todo: NEW TRANSLATION
 modifier_growth_of_the_middle_class: "Růst střední třídy" # todo: NEW TRANSLATION
 philippines.11.t: "Ostrovní identita" # todo: NEW TRANSLATION
 philippines.11.d: "Naše rozsáhlá práce na vzdělání [ROOT.GetCountry.GetAdjective] obyvatel vedla k vytvoření pan-filipínské národní identity." # todo: NEW TRANSLATION
 philippines.11.f: "\"Vytvoření nezávislého státu je jen prvním krokem k pravému národnímu osvobození. Teprve když všechny jeho součásti budou mluvit jedním hlasem, bude naše dílo skutečně dokončeno.\"" # todo: NEW TRANSLATION
 philippines.11.a: "Kráčíme společně vstříc budoucnosti." # todo: NEW TRANSLATION
 philippines.12.t: "Milované dítě metropole" # todo: NEW TRANSLATION
 philippines.12.d: "Komplexní vzdělávací snahy a naše neochvějné vazby na národ [GetCulture('spanish').GetName] vedly ke vzniku nové, odlišné a hispanofonní pan-filipínské identity." # todo: NEW TRANSLATION
 philippines.12.f: "\"Matko Španělsko, tvůj jazyk je klíčem: s ním otevíráme úřady, noviny a brány univerzit.\"" # todo: NEW TRANSLATION
 philippines.12.a: "Naše kulturní pouto se Španělskem je zdrojem síly." # todo: NEW TRANSLATION
 je_sagrada_familia: "Katedrála Sagrada Família" # todo: NEW TRANSLATION
 je_sagrada_familia_reason: "Příznivci [SCOPE.gsInterestGroup('relevant_ig').GetName] shromáždili prostředky na vybudování katedrály v [SCOPE.sState('relevant_state').GetCityHubName]. Jeden filantrop již koupil pozemek pro toto ambiciózní dílo a najal proslulé architekty, aby navrhli chrám.\n\n$building_sagrada_familia_cathedral_3$ bude potřeba postavit ve třech fázích a může být zkonstruován v Panelu státu pro [SelectLocalization(SCOPE.sState('relevant_state').IsValid, SCOPE.sState('relevant_state').GetName, 'STATE_CATALONIA')]" # todo: NEW TRANSLATION
 no_cathedral_status_loc: "" # todo: NEW TRANSLATION
 cathedral_0_built_cathedral_1_ready_status_loc: "První fáze [GetBuildingType('building_sagrada_familia_cathedral_1').GetName] je připravena ke stavbě" # todo: NEW TRANSLATION
 cathedral_1_built_cathedral_2_ready_status_loc: "Druhá fáze [GetBuildingType('building_sagrada_familia_cathedral_2').GetName] je připravena ke stavbě" # todo: NEW TRANSLATION
 cathedral_2_built_cathedral_3_ready_status_loc: "Třetí fáze [GetBuildingType('building_sagrada_familia_cathedral_3').GetName] je připravena ke stavbě" # todo: NEW TRANSLATION
 cathedral_3_built_complete_status_loc: "$building_sagrada_familia_cathedral_3$ je dokončen" # todo: NEW TRANSLATION
 sagrada_familia_complete_tt: "[ROOT.GetCountry.GetNameNoFormatting] postavil tři fáze $building_sagrada_familia_cathedral_3$ v [Concept('concept_state_region','$concept_state_region$')|l] $STATE_CATALONIA$" # todo: NEW TRANSLATION
 sagrada_familia_populated_tt: "Pracovní síla $building_sagrada_familia_cathedral_3$ [concept_occupancy] je větší nebo rovna #variable 50%#!" # todo: NEW TRANSLATION
 rejected_sagrada_familia_project_tt: "[ROOT.GetCountry.GetNameNoFormatting] odmítá návrh na výstavbu $building_sagrada_familia_cathedral_3$" # todo: NEW TRANSLATION
 does_not_have_state_catalonia_tt: "[ROOT.GetCountry.GetNameNoFormatting] nemá $STATE_CATALONIA$" # todo: NEW TRANSLATION
 sagrada_familia.1.t: "Modernistická architektura" # todo: NEW TRANSLATION
 sagrada_familia.1.d: "Spolek ctitelů sv. Josefa najal architekta, který navrhl koncepci $building_sagrada_familia_cathedral_3$ v modernistickém stylu typickém pro $STATE_CATALONIA$. Po schválení může okamžitě začít výstavba." # todo: NEW TRANSLATION
 sagrada_familia.1.f: "\"V přírodě nejsou žádné přímé linie ani ostré rohy.\nProto nesmějí mít budovy přímé linie ani ostré rohy.\"\n\n— Antoni Gaudí" # todo: NEW TRANSLATION
 sagrada_familia.1.a: "Důvěřovat tomuto architektovi dohlížet na výstavbu." # todo: NEW TRANSLATION
 sagrada_familia.1.b: "Tento podnik je skandální." # todo: NEW TRANSLATION
