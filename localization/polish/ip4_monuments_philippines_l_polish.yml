 manila_cathedral_complete_tt: "[ROOT.GetCountry.GetNameNoFormatting] znovu postavil $building_manila_cathedral_monument$ v [Concept('concept_state_region','$concept_state_region$')|l] $STATE_LUZON$" # todo: NEW TRANSLATION
 manila_cathedral_populated_tt: "Pracovní síla $building_manila_cathedral_monument$ [concept_occupancy] je větší nebo rovna #variable 50%#!" # todo: NEW TRANSLATION
 rejected_manila_cathedral_project_tt: "[ROOT.GetCountry.GetNameNoFormatting] odmítá návrh na obnovu $building_manila_cathedral_monument$" # todo: NEW TRANSLATION
 does_not_have_state_luzon_tt: "[ROOT.GetCountry.GetNameNoFormatting] nemá $STATE_LUZON$" # todo: NEW TRANSLATION
 manila_cathedral.1.t: "Zemětřesení v [SelectLocalization(SCOPE.sState('relevant_state').IsValid, SCOPE.sState('relevant_state').GetNameNoFormatting, 'STATE_LUZON')]" # todo: NEW TRANSLATION
 manila_cathedral.1.d: "$building_manila_cathedral_original$ je nyní v troskách po intenzivním zemětřesení, které zasáhlo [SCOPE.sState('relevant_state').GetName]. [GetPopType('clergymen').GetName] z [SCOPE.gsInterestGroup('relevant_ig').GetName] předložili návrh na obnovu katedrály. Skupina shromáždila značnou sumu peněz, která má být použita na její výstavbu." # todo: NEW TRANSLATION
 manila_cathedral.1.f: "\"Zničující pohromy a změny způsobené zemětřeseními nejsou nikde více pozoruhodné než na Filipínách. Převalily hory, naplnily údolí, zpustošily obsáhlé pláně; otevřely průchody moře do vnitrozemí a z jezer do moře. Existuje mnoho tradičních příběhů o těchto teritoriálních revolucích, ale o nedávných katastrofách jsou záznamy důvěryhodné. ... Následná zemětřesení přinesla Luzonu řadu pohrom.\"\n\n— John Bowring" # todo: NEW TRANSLATION
 manila_cathedral.1.a: "Musíme rychle obnovit katedrálu." # todo: NEW TRANSLATION
 manila_cathedral.1.b: "[SCOPE.sState('relevant_state').GetNameNoFormatting] má mnohem naléhavější problémy." # todo: NEW TRANSLATION
