 iberia_union_desc_monarchy: "Iberské státy dostatečně harmonizovaly své zákony a vytvořily základ pro iberský právní kodex. Nyní můžeme přivést koruny do trvalé Unie."
 iberia_union_desc_theocracy: "Iberské státy dostatečně harmonizovaly své zákony a vytvořily základ pro iberský právní kodex. Nyní můžeme podepsat trvalý konkorát, který je sjednotí."
 iberia_union_desc_republic: "Iberské státy dostatečně harmonizovaly své zákony a vytvořily základ pro iberský právní kodex. Nyní můžeme vydat novou Ústavu, zřídit Federální shromáždění a udělit mu nejvyšší legislativní pravomoc nad poloostrovem."
 iberia_union_desc_communist: "Iberské republiky dostatečně harmonizovaly svá opatření a vytvořily administrativní cestu ke svému sjednocení. Nyní můžeme zřídit nové Shromáždění rad pro Iberii a přivést republiky do federace."
 iberia_union_desc_anarchy: "Iberské komuny dostatečně harmonizovaly svá opatření a dosáhly širokého konsenzu směrem k unifikaci. Nyní je můžeme považovat za jednotky v rámci jedné Iberské konfederace."
 je_iberia_preserve_union_button: "Zachovat personalní unii"
 je_iberia_preserve_union_button_desc: "Personalní unie, která v současnosti existuje mezi iberskými státy, je dostatečným základem pro politickou organizaci poloostrova. Vydáme ústavu, která tuto volnou Unii trvale zakotví a zaručí plnou vnitřní autonomii jejích členů."
