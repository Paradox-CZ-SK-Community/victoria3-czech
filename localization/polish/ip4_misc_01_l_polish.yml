 je_the_two_spains: "Dvě Španělska"
 je_the_two_spains_reason: "Ukazatel #b pokroku#! se bude v průběhu času posouvat k #tooltippable;tooltip:[GetPlayer.GetTooltipTag],two_spains_liberal_pivot_factors_tt [SCOPE.ScriptValue('two_spains_liberal_display')|%0o]#!/#tooltippable;tooltip:[GetPlayer.GetTooltipTag],two_spains_conservative_pivot_factors_tt [SCOPE.ScriptValue('two_spains_conservative_display')|%0u]#!.\nUkazatel #b napětí#! se bude v průběhu času posouvat k #tooltippable;tooltip:[GetPlayer.GetTooltipTag],two_spains_tension_pivot_factors_tt [SCOPE.ScriptValue('two_spains_tension_pivot')|%0v]#!.\nVysoké #b napětí#! bude způsobovat zvýšené [concept_activism] a zvýšenou šanci na [concept_coup].\n\n#italic \"Tady leží polovina Španělska. Zemřela na druhou polovinu.\"#!\n— Mariano José de Larra\n\nOd války za nezávislost je [ROOT.GetCountry.GetCustom('getNameIBEorSPA')] uvězněna ve často násilném boji mezi \"dvěma Španělskami\", jedním loajálním Církvi a Koruně, a druhým osvícení a ústavě. Neusmiřitelná nepřátelství obou stran, zrozená z nedokončeného liberálního projektu, upevnila politický řád, který spoléhá víc na armádu než na hlasovací lístek. Pokud se [ROOT.GetCountry.GetCustom('getNameIBEorSPANoFormatting')] má dočkat míru, musí si vybrat, která vize ji bude definovat."
