 je_spain_provisional_government_portuguese_button: "Oslovit dům Bragança"
 je_spain_provisional_government_portuguese_button_desc: "\"Konstituční\" větev domu Bragança má silné liberální zásady a kulturní vazby na $SPA$. Umístit Bragança na španělský trůn by mohlo přispět k vytvoření unie mezi $SPA$ a $POR$."
 spa_becomes_personal_union_of_por_tt: "[ROOT.GetCountry.GetName] se stává mladším partnerem v [concept_personal_union] s #v $POR$#!"
 summoning_country_becomes_junior_in_personal_union_with_owner_tt: "[SCOPE.sCountry('summoning_country').GetName] se stává mladším partnerem v [concept_personal_union] s [SCOPE.sCountry('yoink_country').GetName]"
 summoning_country_becomes_senior_in_personal_union_with_owner_tt: "[SCOPE.sCountry('summoning_country').GetName] se stává starším partnerem v [concept_personal_union] s [SCOPE.sCountry('yoink_country').GetName]"
 je_spain_provisional_government_espartero_button: "Oslovit generála Espartera"
 je_spain_provisional_government_espartero_button_desc: "Generál Baldomero Espartero je jedním z velkých vojenských hrdinů $SPA$, odhodlaným liberálem a inspirujícím příkladem sociální mobility. Více než kterýkoli nižší španělský rodák má záznam potřebný k legitimizaci své korunovace. Ustanovit ho by znamenalo vytvořit královskou dynastii z rodiny truhlářů."
 je_spain_provisional_government_hohenzollern_button: "Oslovit dům Hohenzollern"
 je_spain_provisional_government_hohenzollern_button_desc: "Dům Hohenzollern, vládnoucí dynastie $PRU$ a Hohenzollern-Sigmaringen, je hlavním rodem mezi německými státy. Ustanovit Hohenzollerna by dalo $SPA$ bližší vazby na pány Německa, ale vyvolalo by obavy z obklíčení ve $FRA$."
 je_spain_provisional_government_italian_button: "Oslovit dům Savoia"
 je_spain_provisional_government_italian_button_desc: "Více než kterákoli jiná italská dynastie, dům Savoia spojil své jméno s myšlenkou italské národní identity. Korunovat savojského prince by bylo mezi evropskými mocnostmi neproblematické a zajistilo by to suveréna oddaného ústavní vládě."
 je_spain_provisional_government_isabelist_button: "Krunovat isabelinského krále"
 je_spain_provisional_government_isabelist_button_desc: "\"Konstituční\" větev domu Borbón, vedená bývalou královnou Isabel II, vznikla po sporném následnictví Ferdinanda VII. Přestože po nějakou dobu vládla jako konstituční monarchie, dům Borbón ztratil důvěru mnohých kvůli selháním, které vedly ke Gloriózní revoluci. Vrátit je na trůn by znamenalo návrat k předrevolučnímu statusu quo."
 je_spain_provisional_government_carlist_button: "Krunovat carlistického krále"
 je_spain_provisional_government_carlist_button_desc: "\"Carlistická\" větev domu Borbón vedená Don Carlosem de Borbón vznikla po sporném následnictví Ferdinanda VII. Carlistická linie reprezentuje pevný tradicionalismus, na rozdíl od konstitucionalismu isabelinské linie. Přítomnost carlistů v Prozatímní vládě činí restauraci tradiční monarchie reálnou možností - korunovat je by posílilo konzervativní síly ve Španělsku ve snaze zvrátit revoluci."
 je_spain_provisional_government_bonaparte_button: "Oslovit dům Bonaparte"
 je_spain_provisional_government_bonaparte_button_desc: "Dům Bonaparte vládnul $SPA$ krátce mezi lety 1808 a 1813. Král v té době, Joseph I Bonaparte, nebyl většinou španělského lidu považován za legitimního a byl vyhnán povstáním. Minulé události však nezaručují budoucí výsledky. Pokud by Prozatímní vláda chtěla učinit krok směrem k $FRA$, může pozvat prince Bonaparta a doufat v lepší výsledek."
 je_spain_provisional_government_republic_button: "Vyhlásit republiku"
 je_spain_provisional_government_republic_button_desc: "Republikanismus je v $SPA$ nová pozice, teprve nedávno se prosazující proti konstitučnímu monarchismu obvyklému mezi španělskými liberálními doktrinary. Pokud nebude nalezen král nebo pokud republikánství politicky překoná konstitucionalismus, prohlásit republiku může být jedinou možností."
