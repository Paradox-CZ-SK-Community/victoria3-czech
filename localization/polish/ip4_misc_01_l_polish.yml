 spain_provisional_government.1.t: "$SPA_ADJ$ trůn"
 spain_provisional_government.1.d: "Prozatímní vláda [SCOPE.sCountry('spain_scope').GetName] nabídla prázdný trůn [SCOPE.sCountry('spain_scope').GetNameNoFormatting] jakémukoli členovi domu Bragança, který je ochoten přísahat věrnost [SCOPE.sCountry('spain_scope').GetAdjectiveNoFormatting] ústavě."
 spain_provisional_government.1.f: "\"Ústavodárné Cortes $SPA_ADJ$ národa, po dokončení vážného a delikátního závazku, který jim byl svěřen svobodným hlasováním lidu, zvolily Vaši Výsost, abyste zaujala trůn. Jejich ctihodná důvěra přichází přinést Vám hlas Nadace reprezentace lidu a pozvat vás, přijetím takové spontánní nabídky, položit na Vaši královskou hlavu korunu $SPA$, kterou stovky králů svými slavným skutky tak ozdobili.\""
 spain_provisional_government.1.a: "[SCOPE.sCountry('portugal_scope').GetRuler.GetPrimaryRoleTitle] přijme druhou korunu."
 spain_provisional_government.1.b: "Navrhněte kandidáta z naší dynastie."
 spain_provisional_government.1.c: "Držení [SCOPE.sCountry('spain_scope').GetAdjectiveNoFormatting] trůnu by ohrozilo naši suverenitu."
 spain_provisional_government.11.t: "Iberské sňatky"
 spain_provisional_government.11.d_1: "[SCOPE.sCountry('portugal_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('portugal_scope').GetRuler.GetFullName] přijal naši nabídku [SCOPE.sCountry('spain_scope').GetAdjective] trůnu. [SCOPE.sCountry('portugal_scope').GetRuler.GetHerHis|U] nástup přivede naše dvě země opět do Unie."
 spain_provisional_government.11.d_2: "Dům Bragança přijal naši nabídku [SCOPE.sCountry('spain_scope').GetAdjective] trůnu a nabídl [SCOPE.sCountry('portugal_scope').GetCustom('getCurrentPeripheralBraganza')] nástup, který zajistí silné vztahy mezi našimi zeměmi."
 spain_provisional_government.11.f: "\"Jak zajímavé,\" řekl opisovač, \"že #italic Señor#! [SCOPE.sCountry('spain_scope').GetRuler.GetLastNameNoFormatting] se zdá, že chce být Garibaldi.\"\n\nNervózní pohyby jeho prstů kontrastovaly s pomalým, pečlivým tónem. Pracoval na rohu kusu papíru, ohýbal ho dopředu a zpět. Tiché šustění vyplnilo vzduch mezi jeho slovy.\n\nFranciscou to dávalo smysl. Věděl, že jeho soudruh chápal stejně. \"Chtějí kooptovat naši věc. Vidí Iberii jako novou Německo nebo Itálii. Ví, že toužíme po svobodné Iberii. Nerozumí však tomu, co 'svobodná' znamená, a tak to z jejich vize mizí. Zjistí, že pro lid to slovo znamená něco víc než jen další kousek půdy.\""
 spain_provisional_government.11.a: "Potvrďte nástup [SCOPE.sCountry('portugal_scope').GetRuler.GetPrimaryRoleTitle] a přiveďte Unii k životu."
 spain_provisional_government.11.b: "Bragança to bude."
 spain_provisional_government.11.c: "To není to, co jsme chtěli."
 ana_de_jesus_maria_de_braganca_loc: "$Ana_de_Jesus_Maria$ $de_Braganca$, teta královny Marie II, aby byla královnou $SPA$. Její"
 fernando_de_saxe_coburg_gotha_loc: "$Fernando$ $de_SaxO_nia-Coburgo_e_Gota$, manžel a spoluvládce královny Marie II, aby byl králem $SPA$. Jeho"
 afonso_de_braganca_loc: "$Afonso$ $de_Braganca$, vévoda z Porta, aby byl králem $SPA$. Jeho"
 spain_provisional_government.2.t: "Král z ničeho"
 spain_provisional_government.2.d: "Maršál [SCOPE.sCharacter('espartero_scope').GetFullName], hrdina karlistické války, souhlasil, že bude korunován jako král [SCOPE.sCountry('spain_scope').GetName]. Rod Espartero, dříve pokorní dělníci, se stali nejváženější šlechtou [SCOPE.sCountry('spain_scope').GetNameNoFormatting]."
 spain_provisional_government.2.f: ""Espartero! Můžeš tomu uvěřit?"\n\nByl to už devátýkrát, co to dnes Francisco slyšel, obvykle doprovázené podrobným proslovem o tom, jak je ten starý voják geniální. Každé další vyslovení zatloulo hřebíky strachu hlouběji do jeho srdce. Neoblíbený despot byl sice nepříjemný — mohl vydávat nařízení, kolik chtěl, a za to ho vyhnat za hranice. Ale někdo, kdo dokáže pobláznit davy? Ten by mohl #italic vládnout#!. Mohl by proměnit obyvatele Barcelony v sto tisíc policistů. Mohl by lid přivést k tomu, aby ho pověsil, aby pověsil jeho spolu-revolucionáře, aby...\n\nFrancisco si na tvář vynutil úsměv a obrátil se na úředníka, který promluvil. "Čekal jsem nic menšího.""
 spain_provisional_government.2.a: "Ať žije Espartero, maršál a král!"
 spain_provisional_government.3.t: "Trůn $SPA_ADJ$"
 spain_provisional_government.3.d: "Prozatímní vláda [SCOPE.sCountry('spain_scope').GetName] nabídla prázdný trůn [SCOPE.sCountry('spain_scope').GetNameNoFormatting] kterémukoliv princi z rodu Hohenzollernů, který je ochoten přísahat věrnost [SCOPE.sCountry('spain_scope').GetAdjectiveNoFormatting] Ústavě."
 spain_provisional_government.3.f: "$spain_provisional_government.1.f$"
 spain_provisional_government.3.a: "Předložme kandidáta na trůn."
 spain_provisional_government.3.b: "Nechceme riskovat naše krve v tak nestabilní zemi."
 spain_provisional_government.31.t: "Bezmilostné objetí"
 spain_provisional_government.31.d: "Nominace prince z rodu Hohenzollernů na [SCOPE.sCountry('spain_scope').GetAdjective] trůn hrozí vytvořením prstence [SCOPE.sCountry('hohenzollern_scope').GetAdjective] spojenců kolem [SCOPE.sCountry('france_scope').GetName]. Válečné ministerstvo vyzvalo k poplachu, že takové uspořádání by představovalo vážné riziko pro naši národní integritu."
 spain_provisional_government.31.f: ""Co si #italic myslí#!?" Velvyslanec znovu pohlédl na svůj výtisk #italic Gaceta de Madrid#!. Prohlédnutí dopisu Cortes mu neposkytlo víc odpovědí než poprvé.\n\nMinistr zahraničí pohrdlivě cukl koutkem rtu, jednou-dvakrát-třikrát, ve geste, které rozcuchalo jeho bohaté vousy. Neodpověděl. Jeho pohled zůstal upřený na stůl, zatvrzele obrácený k úkolu čtení novin naruby.\n\n\"Válečný ministr trvá na tom, abych se nevracel do [SCOPE.sCountry('spain_scope').GetCapital.GetCityHubName],\" pokračoval velvyslanec, \"a tuto otázku překládám na vás. Tvrdí, že jde o záměrné provokování, avšak já věřím, že na vině je spíše naivita...\""
 spain_provisional_government.31.a: "To je pobuřující! Připravte armádu."
 spain_provisional_government.31.b: "Co se dá dělat?"
 spain_provisional_government.32.t: "Býk a orel"
 spain_provisional_government.32.d_1: "Dom rodu Hohenzollernů přijal naši nabídku na [SCOPE.sCountry('spain_scope').GetAdjective] trůn a nabídl prince, aby se stal králem [SCOPE.sCountry('spain_scope').GetNameNoFormatting]. [SCOPE.sCountry('france_scope').GetName], obávajíc se obklíčení [SCOPE.sCountry('hohenzollern_scope').GetAdjective] spojenci, pohrozil válkou, pokud by nastoupil na trůn."
 spain_provisional_government.32.d_2: "Dom rodu Hohenzollernů přijal naši nabídku na [SCOPE.sCountry('spain_scope').GetAdjective] trůn a nabídl prince, aby se stal králem [SCOPE.sCountry('spain_scope').GetNameNoFormatting]. Jeho nastoupení by znepokojilo [SCOPE.sCountry('france_scope').GetName], ale zajistilo by silné vztahy s [SCOPE.sCountry('hohenzollern_scope').GetName]."
 spain_provisional_government.32.f: "Nad Barcelonou se stahovaly černé mraky. Francisco ležel zády na střešních taškách a sledoval, jak se stále šedé nebe zbarvuje do černa jako dehet.\n\nUslyšel klapot nohou po taškách vedle sebe a otočil hlavu. Stál tam opisovač, s rozpaženýma rukama, aby ho udržel v rovnováze. Tlustá kapka deště, naplněná kouřem z textilních továren, mu zanechala šedou čáru na tváři. Bylo to podivně krásné.\n\n\"Všichni zemřeme,\" řekl a znovu pohlédl směrem k vzdáleným Pyrenejím. Francisco následoval jeho pohled.\n\n\"...možná,\" pronesl. \"Skoro by mi to nevadilo, kdyby s námi šel i král.\""
 spain_provisional_government.32.a: "Bude to Hohenzollern."
 spain_provisional_government.32.b: "Stáhněte nabídku - nemůžeme riskovat další invazi."
 spain_provisional_government.4.t: "Trůn $SPA_ADJ$"
 spain_provisional_government.4.d: "Prozatímní vláda [SCOPE.sCountry('spain_scope').GetName] nabídla prázdný trůn [SCOPE.sCountry('spain_scope').GetNameNoFormatting] kterémukoliv savojskému princi, který je ochoten přísahat věrnost [SCOPE.sCountry('spain_scope').GetAdjectiveNoFormatting] Ústavě."
 spain_provisional_government.4.f: "$spain_provisional_government.1.f$"
 spain_provisional_government.4.a: "$spain_provisional_government.3.a$"
 spain_provisional_government.4.b: "$spain_provisional_government.3.b$"
 spain_provisional_government.41.t: "Král zvolen"
 spain_provisional_government.41.d: "Dom Savojský přijal naši nabídku na [SCOPE.sCountry('spain_scope').GetAdjective] trůn a vyslal prince do [SCOPE.sCountry('spain_scope').GetCapital.GetCityHubName], aby se oficiálně ucházel o funkci. Cortes svým kandidátem zvolil krále drtivou většinou."
 spain_provisional_government.41.f: "Všude panovalo příliš mnoho veselí, pomyslel si Francisco. Ulice byly ucpané barety a čepicemi — oděvem vynikajících městských vrstev. Zastihla ho novinka, když proud slavících vyrazil a jeho cesta se zdvojnásobila. Kolem další řady klobouků uviděl svůj cíl, dvoupatrový měšťanský dům, v němž sídlily dvě tiskárny — jedna legální, druhá tajná.\n\nLoktem strčil do jednoho veselce, vetkl klíč do zámku a vplížil se dovnitř.\n\n\"Radujte se!\" křikl po schodech, \"má je náš červenec!\""
 spain_provisional_government.41.a: "Ať žije koruna a Cortes!"
 spain_provisional_government.5.t: "Restaurace Bourbonů"
 spain_provisional_government.5.d: "Nebyl-li k dispozici jiný kandidát, Cortes zvolil [ROOT.GetCountry.GetRuler.GetFullName], dalšího člena rodu Bourbon v \"konstituční\" linii nástupnictví, jako [ROOT.GetCountry.GetRuler.GetCustom('getQueenKing')] [ROOT.GetCountry.GetName]."
 spain_provisional_government.5.f: "Ulice byly vyzdobené červeno-žlutými pruhy, přesto tam nebyl nikdo k vidění. Francisco přitiskl čelo k zašlému oknu a rozhlížel se sem a tam. V jiné místnosti hlučela tiskárna a zahlušovala mu myšlenky. V tom bylo pro něj lépe — chytit je a pořádně se podívat by ho ještě víc uvrhlo do propasti.\n\n\"Čekali, že budou slavit?\" zeptal se. \"K sakru. Ti zrádci, hrobníci... k sakru s nimi!\"\n\nV dálce zazněla vojenská trubka a pak dupot bot."
 spain_provisional_government.5.a: "Prává dynastie se vrací na trůn."
 spain_provisional_government.6.t: "Restaurace Bourbonů"
 spain_provisional_government.6.d: "Cortes nakloněný k carlismu zvolil [ROOT.GetCountry.GetRuler.GetFullName], současného člena rodu Bourbon ve carlistické linii nástupnictví, jako [ROOT.GetCountry.GetRuler.GetCustom('getQueenKing')] [ROOT.GetCountry.GetName]. Opět bude zemi vládnout striktní traditionalista."
 spain_provisional_government.6.f: "Francisco vběhl do měšťanského domu a zavřel za sebou dveře. Dával vše do toho, aby je nepráskl, aby neupozornil sousedy na svůj rozrušený stav. Zvuk šustících nohou zněl na schodech. Bledé, pavučinaté prsty sevřely roh zdi a strašidelné oči se na něj podívaly.\n\n\"Řekni mi, že to není konec,\" řekl opisovač.\n\nFrancisco zavrtěl hlavou. \"Budeš muset odvrátit zrak,\" odpověděl, \"neboli ti nemohu lhát do očí.\"\n\nOpisovačovy klouby zbělely. \"Revoluce je mrtvá, tedy i my. Ať nám Bůh pomůže.\""
 spain_provisional_government.6.a: "$spain_provisional_government.5.a$"
 spain_provisional_government.7.t: "Trůn $SPA_ADJ$"
 spain_provisional_government.7.d: "Prozatímní vláda [SCOPE.sCountry('spain_scope').GetName] nabídla prázdný trůn [SCOPE.sCountry('spain_scope').GetNameNoFormatting] kterémukoliv princi z rodu Bonaparte, který je ochoten přísahat věrnost [SCOPE.sCountry('spain_scope').GetAdjectiveNoFormatting] Ústavě."
 spain_provisional_government.7.f: "$spain_provisional_government.1.f$"
 spain_provisional_government.7.a: "Vypadá to, že se konečně shodli."
 spain_provisional_government.7.b: "$spain_provisional_government.3.b$"
 spain_provisional_government.71.t: "Restaurace Bonaparteů"
 spain_provisional_government.71.d: "Dom rodu Bonaparte přijal naši nabídku na [SCOPE.sCountry('spain_scope').GetAdjective] trůn a vyslal prince do [SCOPE.sCountry('spain_scope').GetCapital.GetCityHubName], aby tam sloužil jako král [SCOPE.sCountry('spain_scope').GetNameNoFormatting]. Po svém zvolení se před Cortes korunoval."
 spain_provisional_government.71.f: ""Karl Marx řekl — no, citoval Hegela... že světově historické osobnosti se objeví, řekněme, dvakrát."" Francisco chodil po místnosti a zuřivě zíral na knihu v ruce, ""A Hegel zapomněl dodat: poprvé jako tragédie, podruhé jako fraška.""\n\nOpisovač s rudýma okrajema očí ho sledoval, jak chodí. \"Uděláš mi tady stopu v podlaze,\" řekl. \"Oba víme, co je třeba udělat, a uděláme to.\"\n\nFrancisco přestal kroutit kolem místnosti a položil knihu na židli půlpohozenou mezi brožurami. Jeho oči sklouzly k stolu, k dózám s prachem, které se staly novým středobodem, k balíčku hřebíků.\n\n\"Tak tedy,\" řekl. \"Tak tedy.\""
 spain_provisional_government.71.a: "Ať žije Bonaparte, konečně obnoven!"
 spain_provisional_government.8.t: "Vyhlášení republiky"
 spain_provisional_government.8.d: "Nebyl-li k dispozici žádný král, Cortes se prohlásil zákonodárným sborem Španělské republiky, s [ROOT.GetCountry.GetRuler.GetFullName] jako přechodným výkonným představitelem."
 spain_provisional_government.8.f: ""Máme republiku!\"\n\nVýkřik z ulice dole Franciska vyrazil na nohy, rozházel hromadu papírů kamkoli. Vyrazil po schodech, přes půdu až k okraji koberce přitisknutého ke zdi. Na něm ležela tenká přikrývka, z níž bledá ruka sahala po pistoli, o které věděl, že je schovaná ve střešních trámech.\n\n\"Máme republiku!\" zopakoval, zadýchaný, a ruka se zastavila, přehodila přikrývku a odhalila dvojici širokých, zarudlých očí.\n\n\"Pane bože,\" řekl opisovač. \"Málem jsem tě zastřelil.\"\n\n\"A odpouštím ti!\" Francisco vybuchl smíchem. \"Vstaň, Àngel! Neříkal jsi, že půjdeš tancovat?\""
 spain_provisional_government.8.a: "Přivítejme ji jako slunce."
