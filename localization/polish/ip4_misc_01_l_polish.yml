 anarchism_events.6.t: "Nejlepší ze všech světů"
 anarchism_events.6.d: "Spektrum anarchismu bylo z [ROOT.GetCountry.GetAdjective] půdy vyhnáno. Pořádek se vrátil do ulic a naši občané se už nemusí obávat anarchistického teroru."
 anarchism_events.6.f: "Arkády [ROOT.GetCountry.GetCapital.GetCityHubName] se leskly sklem a plynovým osvětlením. Postavy v hedvábí přeskakovaly z obchodu do obchodu a vydávaly desetiletou výplatu za náhrdelník nebo klobouk. Pokladní s pevně přilepeným úsměvem naplňovaly dlaně pesetami, které putovaly do kapes jejich zaměstnavatelů.\n\nNa polích za [SCOPE.sState('agricultural_state_scope').GetFarmHubName] se srpy zvedaly a klesaly v hypnotické vlně. Dělník uprostřed řady, oslepen potem a prachem ve vzduchu, udělal klopýtnutí. Spadl a prasknutí jeho kotníku znělo jako výstřel.\n\nOkno tiskárny nic jiného neukazovalo než modrou a mosaz. První policista, jenž prošel dveřmi, byl hrozně mladý — bez vousů, s akné, hlas se mu lámal při jekotu. Francisco se podíval do jeho očí a zabořil dýku do vlastního hrudi."
 anarchism_events.6.a: "Mír znovu vládne."
 anarchism_events.6.b: "To je vše, to je vše, co kdy bude."
 anarchism_events.7.t: "Internacionalisté"
 anarchism_events.7.d: "Přilákaný zájmem o rostoucí [ROOT.GetCountry.GetAdjective] [SCOPE.sPoliticalMovement('anarchist_movement_scope').GetName], představitel Mezinárodní dělnické asociace jménem [SCOPE.sCharacter('international_man_scope').GetFullName] překročil hranice z [SCOPE.sCountry('relevant_border_country').GetName]."
 anarchism_events.7.f: "Internacionalista přišel o půlnoci. Proplížil se zadními dveřmi dílny jako vánek, pozdravil čekající muže pokývnutím a zašeptaným heslem, a pak se vytratil nahoru.\n\nTam, za jistotou zataženého závěsu, si vyměnili aliasy, krycí příběhy a příběhy svých bitevních jizev. Tvrdá podlaha postačí prozatím, řekl internacionalista. Jeho hostitelé se usmáli na [SCOPE.sCharacter('international_man_scope').GetWomanMan] a nabídli mu čestné místo na jediném koberci v půdě. Opisovač vzal první hlídku a usedl u okna se zastřenou svíčkou.\n\nDo sedmi ráno byl [SCOPE.sCharacter('international_man_scope').GetWomanMan] na voze směřujícím na jih a místní si blahopřáli k dobře odvedené práci."
 anarchism_events.7.a: "Vítej v [ROOT.GetCountry.GetNameNoFormatting], camarada!"
 anarchism_events.7.b: "Mějme tohoto cizince pod přísným dohledem."
