 spain_politics.1.t: "Nevěsta Kristova"
 spain_politics.1.d: "Zarytě konzervativní arcibiskup Toleda, [SCOPE.sCharacter('pedro_inguanzo_scope').GetFullName], zemřel. [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] má nyní příležitost jmenovat nástupce více nakloněného isabelinskému směru."
 spain_politics.1.f: "\"Rád bych řekl 'dobrý konec',\" řekl [SCOPE.sCharacter('name_a_scope').GetFirstNameNoFormatting]. \"Opravdu bych si přál věřit, že to bude přínosem pro královnu. Bohužel zůstává příliš mnoho nezodpovězených otázek.\"\n\n\"Je tomu tak?\" pozvedl obočí [SCOPE.sCharacter('name_b_scope').GetFirstNameNoFormatting]. Všude kolem jejich člunu tiše tekla řeka Manzanares. [SCOPE.sCharacter('name_a_scope').GetFirstNameNoFormatting] proutek hodil do vody. Háček elegantně dopadl.\n\n\"Papež to nedovolí, za prvé. Řím je přátelský k pretendentům. Za druhé... deficit Církve nelze připsat jednomu muži. Loajální náhrada může podnítit další povstání, bůh pomáhej.\"\"
 spain_politics.1.a: "Konstitucionalistický arcibiskup nám poslouží dobře."
 spain_politics.1.b: "Jmenujte smířlivějšího kandidáta."
 spain_politics.101.t: "Liberální prvenství"
 spain_politics.101.d_1: "Se smrtí předchozího arcibiskupa Toleda byla do úřadu jmenována stálá liberální Prezident Senátu, [SCOPE.sCharacter('spanish_archbishop_scope').GetFullName]. Schválit jmenování [SCOPE.sCharacter('spanish_archbishop_scope').GetHerHis] by implicitně znamenalo uznat legitimitu [SCOPE.sCharacter('spanish_queen_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('spanish_queen_scope').GetFirstName]."
 spain_politics.101.d_2: "Se smrtí předchozího arcibiskupa Toleda byla do úřadu jmenována umírněná liberální biskup Kanárských ostrovů, [SCOPE.sCharacter('spanish_archbishop_scope').GetFullName], jako jeho náhrada. Schválit jmenování [SCOPE.sCharacter('spanish_archbishop_scope').GetHerHis] by implicitně znamenalo uznat legitimitu [SCOPE.sCharacter('spanish_queen_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('spanish_queen_scope').GetFirstName]."
 spain_politics.101.f: "Spor o [SCOPE.sCountry('spain_scope').GetAdjectiveNoFormatting] následnictví přinesl Svatému stolci nemalé bolesti hlavy. Ferdinand VII., byť byl dobrým katolíkem, podepsal dekret, který dovolil jeho dceři Isabelle nastoupit na trůn. Čelíc povstání ze strany strýce, regent Isabellin rozhodl se spojit s liberály—a to se církvi příliš nezamlouvalo. Církev tak musela volit—zbožného rebela, nebo nepřátelskou královnu?"
 spain_politics.101.a: "[SCOPE.sCountry('spain_scope').GetAdjective] [SCOPE.sCharacter('spanish_queen_scope').GetPrimaryRoleTitle] je pretendent. [SCOPE.sCharacter('spanish_queen_scope').GetSheHe|U] nemá právo jmenovat arcibiskupa."
 spain_politics.101.b: "Vláda [SCOPE.sCountry('spain_scope').GetNameNoFormatting] prokázala, že není nepřátelská. Potvrďte jmenování."
 spain_politics.101.c: "Odmítněte jmenování a požadujte, aby biskup veřejně prohlásil, že ho neuznává."
 spain_politics.2.t: "Prapor republiky"
 spain_politics.2.d: "Pád monarchie a vyhlášení [ROOT.GetCountry.GetName] položilo otázku, kterou vlajku si Republika zvolí. Demokratická levice se shromáždila kolem přidání fialové pruhy, která by reprezentovala historické Kastílii a León."
 spain_politics.2.f: "\"Republika chrání všechny. Stejně tak vlajka, která znamená mír a spolupráci občanů pod vládou spravedlivých zákonů. Značí i víc: nový fakt v dějinách Španělska, že čin státu nemá jiný motiv než zájem země a jiné pravidlo než respekt k svědomí, svobodě a práci.\"\n\n— Předsednictví prozatímní vlády Republiky, 1931"
 spain_politics.2.a: "Vlajka Republiky bude @spa_republic_2_flag_small! #tooltippable;tooltip:[GetPlayer.GetTooltipTag],spa_republic_2_tt červená, žlutá a fialová#! trikolóra."
 spain_politics.2.b: "Trikolóra @spa_republic_3_flag_small! #tooltippable;tooltip:[GetPlayer.GetTooltipTag],spa_republic_3_tt červená, bílá a fialová#! udělá rozhodný dojem."
 spain_politics.2.c: "Prozatímní dvoubarevná @spa_republic_1_flag_small! #tooltippable;tooltip:[GetPlayer.GetTooltipTag],spa_republic_1_tt by měla být trvalá."
