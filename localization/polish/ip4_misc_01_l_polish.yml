 je_iberia: "Iberská unie"
 je_iberia_reason: "Jak se německé národy snaží o sjednocení #v $GER$#! a Italové touží po #v $ITA$#!, tak i nesčetné národy Pyrenejského poloostrova hledí k myšlence jednotného [GetGeographicRegion('geographic_region_iberia_old').GetName]. [GetPlayer.GetCustom('iberian_union_political_text')]\n\nOficiální podpora sjednocení jednou nebo více mocnostmi poloostrova proměnila myšlenku sjednocené $geographic_region_iberia$ z dalekého snu v cílově dosažitelný plán — pokud je možno sladit vůli všech mocností poloostrova.\n\n@information! Všechny [Concept('concept_country','$concept_countries$')] zapojené v tomto [concept_journal_entry] jsou obecně příznivě nakloněny nějaké formě [Concept('concept_unification','$concept_unification_short$')]. Pro diplomatické sjednocení poloostrova musí všechny jeho politické entity harmonizovat své [Concept('concept_law','$concept_laws$')] a mít kompatibilní #b Principy vládnutí#!."
 iberia_union_political_text_monarchy: "Na vrcholu španělské a portugalské říše byla celá Iberie svázána pod #v Iberian Union#!. Dynastičtí unionisté volají po obnovení této Unie, snažíce se odstranit ekonomické bariéry mezi Španělskem a Portugalskem a navrátit nové zlaté období."
 iberia_union_political_text_theocracy: "Všemocná katolická církev stojí nad všemi národy. Horliví univerzalisté volají po #v Iberian Concordat#!, aby přivedli celý poloostrov do svaté jednoty."
 iberia_union_political_text_republic: "Natočeni příkladem evropských liberálních revolucí, radikální republikáni volají po sjednocení všech národů poloostrova pod jednou #v Iberian Federation#!."
 iberia_union_political_communist: "Proletariát nezná národ — feudální a buržoazní konstrukty, které vládly poloostrovu po staletí, musí být zničeny a socialistická #v Iberian Federation#! se musí zrodit z jejich popela."
