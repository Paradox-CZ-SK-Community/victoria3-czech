 je_devorismo: "Vládnutí požírače (Devorismo)"
 je_devorismo_reason: "Rozhodné vítězství Liberálů v Portugalské občanské válce vyhnalo pretendentního krále Miguela do Říma a učinilo jeho příznivce bezmocnými v domácí politice. V následcích dominantní [GetIdeology('ideology_cartist').GetName] frakce Liberálů začala upevňovat svou monopolní kontrolu nad vládou – a svůj neomezený přístup k [ROOT.GetCountry.GetAdjective] pokladnici.\n\nBěhem posledního roku vláda $ideology_cartist$ spustila rozsáhlý program prodeje státního majetku soukromým investorům, politiku, kterou její odpůrci nazvali \"Devorismo\" nebo \"Požiračství\". Tyto privatizace, daleko od toho, aby skutečně zmírnily značné dluhy [ROOT.GetCountry.GetNameNoFormatting], vedly ke koncentraci majetku do rukou bohatých příznivců Liberálů a přispěly ke štěpení [ROOT.GetCountry.GetAdjectiveNoFormatting] liberalismu, které den za dnem narůstá."
 je_devorismo_cartist_header: "#title Dokončí se #b Cartist#! vítězstvím pokud:#!\n"
 je_devorismo_constitutionalist_header: "#title Dokončí se #b Konstitucionalistům#! vítězstvím pokud:#!\n"
