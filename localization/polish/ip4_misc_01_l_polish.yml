 iberia.1.t: "Jeden poloostrov"
 iberia.1.d: "Vzestup pan-nacionalistických nálad šířících se [GetGeographicRegion('geographic_region_europe').GetName] dorazil i do [ROOT.GetCountry.GetName]. Dynastičtí unionisté i internacionalističtí radikálové volají po sjednocení [GetGeographicRegion('geographic_region_iberia_old').GetName] pod jejich preferovanou formou vlády."
 iberia.1.f: "\"Sjednocení Španělska a Portugalska je oboustranně výhodné: je to přirozené, spravedlivé, legitimní, nutné — ano, řekneme více, je to nevyhnutelné. Cokoliv, co je proti této unii, škodí oběma národům; cokoliv, co ji posiluje, je prospěšné. Obtíž spočívá pouze v nalezení prostředků, jak uskutečnit tuto velkou myšlenku spontánním, svobodným a čestným způsobem pro obě strany.\" \n\n—Fernández Cuesta"
 iberia.1.a_1: "Byli jsme rozděleni příliš dlouho."
 iberia.1.a_2: "Dělníci světa, spojte se!"
 iberia.1.b: "[ROOT.GetCountry.GetNameNoFormatting] je svrchovaný stát a zůstane jím."
 iberia.11.t: "Jeden poloostrov"
 iberia.11.d: "S rostoucími pan-nacionalistickými náladami v [GetGeographicRegion('geographic_region_iberia_old').GetName] vláda [SCOPE.sCountry('iberia_forming_country').GetName] prohlásila sjednocení poloostrova za oficiální politiku. Když je postoj [SCOPE.sCountry('iberia_forming_country').GetNameNoFormatting] jasný, musíme vyhlásit ten náš."
 iberia.11.f: "\"Sjednocení Španělska a Portugalska je oboustranně výhodné: je to přirozené, spravedlivé, legitimní, nutné — ano, řekneme více, je to nevyhnutelné. Cokoliv, co je proti této unii, škodí oběma národům; cokoliv, co ji posiluje, je prospěšné. Obtíž spočívá pouze v nalezení prostředků, jak uskutečnit tuto velkou myšlenku spontánním, svobodným a čestným způsobem pro obě strany.\" \n\n—Fernández Cuesta"
