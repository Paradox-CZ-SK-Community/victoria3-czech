 two_spains.4.t_1: "Slavná revoluce"
 two_spains.4.t_2: "Vrácení koruny"
 two_spains.4.d_1: "Snahy [SCOPE.sCharacter('golpista_general').GetPrimaryRoleTitle] [SCOPE.sCharacter('golpista_general').GetFullName] vedly k tomu, že nepopulární dynastie [SCOPE.sCharacter('deposed_spanish_monarch').GetLastName] byla vyvržena z moci. S [ROOT.GetCountry.GetAdjective] trůnem prázdným bylo ustanoveno regentství pod [ROOT.GetCountry.GetRuler.GetFullName], aby rozhodlo o budoucnosti koruny."
 two_spains.4.d_2: "Snahy [SCOPE.sCharacter('golpista_general').GetCustom('getGeneralAdmiral')] [SCOPE.sCharacter('golpista_general').GetFullName] vedly k tomu, že nepopulární dynastie [SCOPE.sCharacter('deposed_spanish_monarch').GetLastName] byla vyvržena z moci. S [ROOT.GetCountry.GetAdjective] trůnem prázdným bylo ustanoveno regentství, aby rozhodlo o budoucnosti koruny."
 two_spains.4.f: "\"Je to ono? Máme Republiku?\"\n\nFrancisco se podíval na otevřené okno, na bledého přepisovatele vyklánějícího se ven. Vzduch voněl inkoustem a voskem z svíček.\n\n\"Ještě ne, ale brzy,\" odpověděl. \"Můžeme doufat! To je víc, než jsme mohli říci minulý týden!\""
 two_spains.4.a: "A teď, vládnout."
