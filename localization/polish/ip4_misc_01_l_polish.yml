 caciquismo.1.t: "Hned, šéfe"
 caciquismo.1.d: "S nástupem volební sezóny se patronážní sítě prorostlé venkovským [ROOT.GetCountry.GetName] probudily k životu. [ROOT.GetCountry.GetCustom('get_political_boss_name')] čekají na pochodové rozkazy provinčních guvernérů."
 caciquismo.1.f: "Atmosféra v kasinu byla těžká kouřem. V rohové lóži mával muž v panamském klobouku kubánským doutníkem ve vzduchu s falešně melancholickým výrazem.\n\n\"My, liberálové, jsme si byli jisti, že volby vyhrajeme. Avšak boží vůle rozhodla jinak.\"\n\nVložil doutník do úst a vydechl obláček dýmu. Úsměv mu hrál na rtech.\n\n\"Zdá se, že tentokrát vyhráli konzervativci.\""
 caciquismo.1.a: "Přispějme na podporu [SCOPE.sParty('party_1_scope').GetName]."
 caciquismo.1.b: "[SCOPE.sParty('party_2_scope').GetName] by si mohl zasloužit období u moci."
 caciquismo.1.c: "Rozdělíme úřady mezi [SCOPE.sParty('party_3_scope').GetName]."
 caciquismo.1.e: "[SCOPE.sParty('party_4_scope').GetName] potřebuje pomoc."
 caciquismo.1.g: "Nechme kostky padnout, jak chtějí."
 caciquismo.1.h: "$caciquismo.1.g$"
 boss_caciques: "caciques"
 boss_kazikes: "kazikes"
 boss_mandaos: "mandãos"
 boss_bosses: "bossové"
 caciquismo.2.t: "Správný výsledek"
 caciquismo.2.d: "Volební sezóna začala v [ROOT.GetCountry.GetName] — a s ní i stratégování vládních fixerů. Chceme-li, můžeme využít státní moc k zajištění příznivého výsledku."
 caciquismo.2.f: "Na stole ležela mapa [SCOPE.sState('rural_state').GetNameNoFormatting] rozprostřená přes knihy, prázdné hrnky a ztracené kreslící potřeby. Čtyři muži vytvořili kruh kolem ní a rozebírali intuici o sklonu [SCOPE.sState('rural_state').GetFarmHubName]. Bylo jasné, že to půjde vládě, rozhodli se — ale o kolik? Mohli vyždímat dalších tisíc hlasů z předměstí? Jak ovlivní nedávné nashromáždění dělníků v oblasti volební vzorce?\n\nPo půl hodině, která měla být obědovou přestávkou, dospěli k rozhodnutí. Město přidělí jejich straně osm tisíc hlasů, s pevnou — ale bezvýslednou — opozicí v dělnických čtvrtích. V mnohem vkusnějším provedení než 101% účast."
 caciquismo.2.a: "[SCOPE.sParty('party_1_scope').GetName] je přirozená vládnoucí strana."
 caciquismo.2.b: "Podpořte [SCOPE.sParty('party_2_scope').GetName]."
 caciquismo.2.c: "Změňme kurz — dejme [SCOPE.sParty('party_3_scope').GetName] období u moci."
 caciquismo.2.e: "[SCOPE.sParty('party_4_scope').GetName] potřebuje pomoc."
 caciquismo.2.g: "[SCOPE.sParty('party_5_scope').GetName] bude mít naši podporu."
 caciquismo.2.h: "Chceme-li něčeho dosáhnout, volby musí být svobodné."
 caciquismo.2.i: "$caciquismo.1.h$"
