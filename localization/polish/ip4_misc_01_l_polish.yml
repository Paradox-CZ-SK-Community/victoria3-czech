 independence.1.t: "Válka za nezávislost"
 independence.1.d: "Naše válka za nezávislost od [SCOPE.sCountry('former_colonial_overlord').GetName] poslala zbytky koloniální správy běžet do [SCOPE.sCountry('former_colonial_government').GetCapital.GetName]. Pokud chceme být nezávislí, musíme si vybrat strukturu, která zaplní vakuum."
 independence.1.f: "\"Slyšíš kanóny? Zní každá rána blíž a blíž? Raduj se! Je to vzácný moment, kdy si muž smí vzít pero a rozhodnout o svém osudu. Okupanti prchají a máme prázdné plátno před sebou. Rychle! Granáty padají a nebylo by dobré, kdyby tento podnik byl zrušen na začátku.\""
 independence.1.a: "Sestavte prozatímní vládu."
 independence.1.b: "Budeme mít republiku pod vedením [ROOT.GetCountry.GetRuler.GetFullName]."
 independence.1.c: "[ROOT.GetCountry.GetRuler.GetFullName] dostane korunu, pokud [ROOT.GetCountry.GetRuler.GetSheHe] bude chtít."
 independence.1.e: "Jednota tříd zajistí naše vítězství."
 independence.1.g: "Proletariát stojí v čele našeho boje."
 independence.1.h: "Toto dílo vede [SCOPE.GetRootScope.GetCountry.GetCustom('GetDivinity')]."
 independence.2.t: "Den nezávislosti"
 independence.2.d: "Staré koloniální struktury, které dříve spravovaly naše území, jsou žalostně nedostatečné pro nezávislý stát. Musíme položit základy svobodného a nezávislého [ROOT.GetCountry.GetName]."
 independence.2.f: "Guvernér neměl čas sbalit nábytek, než odjel. Půl tuctu jemných evropských židlí zdobilo jeho jídelnu, obklopujíc stůl, který byl rychle zbaven stříbra a hedvábného ubrusu uprchlými předchozími obyvateli. Tyto jemné židle nyní hostily šest výborných pánů. Někteří z nich, šťastní, že byli pozváni na guvernérovy večeře, tu už byli dříve. Ostatní byli drsnější, novější. Kdyby si některý z nich troufl představit něco odvážného, byl by jedním z nich."
 independence.2.a: "[SCOPE.GetRootScope.GetCountry.GetCustom('country_legislature_name')|U] bude nejvyšší autoritou."
 independence.2.b: "Budeme mít republiku."
 independence.2.c: "[ROOT.GetCountry.GetRuler.GetFullName] dostane korunu, pokud bude [ROOT.GetCountry.GetRuler.GetSheHe] chtít."
 independence.2.e: "Jednota tříd udrží naši nezávislost."
 independence.2.g: "Proletariát si vybojoval naše vítězství."
 independence.2.h: "[ROOT.GetCountry.GetName] bude vedeno božskou prozřetelností."
