 je_portugal_and_brazil_reason: "Od našeho uznání její nezávislosti v roce 1825 bývalá [ROOT.GetCountry.GetAdjective] kolonie [SCOPE.sCountry('brazil_scope').GetName] dominuje Jižní Americe. I když krátké období osobní unie pod králem a císařem Pedro IV a I skončilo neúspěchem, kulturní vazby mezi #b $POR$#! a #b $BRZ$#! zůstávají silné. Tyto existující vazby představují vynikající příležitost k navázání trvalého ekonomického a diplomatického vztahu."
