 is_great_power_tt: "[ROOT.GetCountry.GetName] se stal [concept_great_power]"
 miguelist_monarch_tt: "Pretendent [GetIdeology('ideology_miguelist').GetName] je [concept_ruler] [ROOT.GetCountry.GetName]"
 second_liberalism.1.t: "Z temnoty"
 second_liberalism.1.d: "Hrdinské úsilí Koruny a Cortes ustanovilo [ROOT.GetCountry.GetName] jako zcela moderní a liberální národ. Ústavní řád zvítězil nad všemi, kdo jej napadali."
 second_liberalism.1.f: "Silná vrstva kouře se usadila u stropu důstojnického klubu, zabarvujíc světlo lamp do načervenala. Bylo téměř dvě ráno a kromě největších buřičů už všichni odešli. Muž v generálském stejnokroji seděl v rohu, obklopen svým štábem a nadšeně si povídal se servírkou.\n\n\"Někdo mi poslal dopis,\" řekl, \"a byl hrozný. Urážka proti Bohu, ale hodná smíchu. Ten gentleman použil pseudonym a zdál se být odhodlán mě verbovat do nějakého bláhového spiknutí. Jako bych zvedl zbraně proti své zemi! Měl by se přizpůsobit době.\""
 second_liberalism.1.a: "Ať žije Ústava!"
 second_liberalism.1.b: "Duch Vintisma nikdy nezemře."
 second_liberalism.2.t: "Nejvyšší povolání"
 second_liberalism.2.d_1: "S sesazením monarchie jsme odstranili kompromisy a ústupky starých konstitucionalistů. [ROOT.GetCountry.GetName] bude nyní mít vládu z lidu, pro lid a od lidu."
 second_liberalism.2.d_2: "Triumf proletariátu přinesl dobu liberalismu v [ROOT.GetCountry.GetName] ke konci. Už se nebudeme spokojovat s dokonalější formou buržoazní vlády."
 second_liberalism.2.d_3: "Vláda Církve ukončila konstitucionalistický experiment. Už nebudeme definováni rozporem mezi božským právem a zákony člověka."
 second_liberalism.2.f: "\"Jakmile se existence Koruny stane veřejnou debatou,\" řekl exilant, \"nemůže již plnit svou sjednocující roli. A jaký jiný důvod měla k existenci?\"\n\nAmbasador kývl při tom, co řekl. \"A podle tvých slov, je to důvod, proč padla?\"\n\n\"Příznak, ale ne příčina. Koruna se stále znovu podbízela. Smlouvání s liberály bylo marné. Jejich ústavy zbavují krále božského práva a činí z nich glorifikované úředníky.\" Každé slovo vychrlil s hořkostí. \"Kéž bych to viděl dřív.\""
 second_liberalism.2.a: "Tak začíná nová kapitola dějin."
 second_liberalism.2.b: "Třetí liberalismus čeká za horizontem."
 second_liberalism.3.t: "Lid a král"
 second_liberalism.3.d: "Návrat [SCOPE.sCharacter('miguelist_claimant_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('miguelist_claimant_scope').GetFullName] na [ROOT.GetCountry.GetAdjective] trůn znamená definitivní porážku konstitucionalistického projektu. Koruna už nebude muset kompromitovat svou božskou moc."
 second_liberalism.3.f: "\"Za pár měsíců, z jednoho rohu do druhého Království, národní duch se probudil; nejhlubší odpudivost revolučních principů se projevila s takovou intenzitou, že jen úcta k milosrdenství mého nejctihodnějšího otce, kterou věrný portugalský národ mu projevuje, zabránila lidu obětovat ty, kdo propagovali a podporovali revoluci.\"\n\n— #italic Manifesto of His Most Faithful Majesty, Our King D. Miguel#!"
 second_liberalism.3.a: "Liberalistická aberrace skončila."
 second_liberalism.3.b: "Nelze nyní ignorovat přítomnost."
 je_portugal_regeneration: "Naše šťastné oživení"
 je_portugal_regeneration_reason: "#italic \"Nad kočárovým koněm je tramvaj, nad tou lokomotiva, a nad tím vším pokrok.\"#!\n— Fontes Pereira de Melo\n\nMnozí považují [ROOT.GetCountry.GetName] za národ pozadu, který už se nikdy nepřiblíží slávě svého Zlatého věku. Tento pocit bídy přiměl [ROOT.GetCountry.GetAdjectiveNoFormatting] liberální politiky snít o \"Regeneraci\", období rychlých změn, které by vytáhlo národ z jeho stagnačního stavu a obnovilo bývalou prestiž.\n\nVytvoření sjednocující vlády proměnilo tento dlouho toužený plán Regenerace z ideálu v realitu. Vláda předložila plány ambiciózních institucionálních reforem. Pokud budou dokončeny, slibují obrátit dlouhodobý úpadek [ROOT.GetCountry.GetNameNoFormatting]—a postavit základ pro nezlomný liberální řád."
 je_portugal_regeneration_agriculture_complete_tt: "Dokončil #v $je_portugal_regeneration_agriculture$#!"
 je_portugal_regeneration_public_works_tt: "Dokončil #v $je_portugal_regeneration_public_works$#!"
 je_portugal_regeneration_institutions_tt: "Dokončil #v $je_portugal_regeneration_institutions$#!"
 je_portugal_regeneration_agriculture: "Regenerace: venkov"
 je_portugal_regeneration_agriculture_reason: "$regeneration_shared_loc$\n\nNeefektivní a archaická povaha [ROOT.GetCountry.GetAdjectiveNoFormatting] zemědělství dlouho brzdila rozvoj. Venkov je doménou obrovských, neefektivních šlechtických statků a církevních pozemků využívajících techniky neměnné po staletí. Pokud se Regenerace má dostavit na venkov, musí jí doprovázet nové technologie a podnikatelský způsob vlastnictví půdy."
 je_portugal_regeneration_public_works: "Regenerace: veřejné práce"
 je_portugal_regeneration_public_works_reason: "$regeneration_shared_loc$\n\nPevninské [ROOT.GetCountry.GetNameNoFormatting] je drsné, řídké osídlené území s mnoha odlehlými oblastmi a nedostatečnými komunikačními cestami. Pokud se vezme v úvahu zámořské impérium, problém dopravy nabývá nové naléhavosti. Telegraf a železnice jsou politiky Regenerace považovány za vtělení pokroku - technologie, které sváží národ a impérium víc než kdykoli dřív."
 je_portugal_regeneration_institutions: "Regenerace: národní instituce"
 je_portugal_regeneration_institutions_reason: "$regeneration_shared_loc$\n\nStát samotný - rámec, v němž se vynucují smlouvy, přidělují prostředky a zajišťuje stabilní prostředí - je středem programu Regenerace. K vybudování moderního státu je potřeba moderní populace - vzdělané, schopné a vlastenecké. Nová generace juristů, úředníků a důstojníků zaplní řady byrokracie a vytvoří instituce potřebné pro další rozvoj."
 regeneration_shared_loc: "Po léta snili [ROOT.GetCountry.GetAdjective] liberální politici o \"Regeneraci\" - ambiciózním programu vybudování fyzické a právní infrastruktury, která poslouží jako základ pro národní rozvoj. Relativní politická stabilita, kterou [ROOT.GetCountry.GetNameNoFormatting] dosáhla, vytvořila příležitost tyto reformy uskutečnit."
 surplus_50_percent_of_the_time_tt: "[ROOT.GetCountry.GetNameNoFlag] měl kladný rozpočet více než polovinu doby, po kterou je tento [concept_journal_entry] aktivní (aktuálně [ROOT.GetCountry.MakeScope.Var('surplus_time_var').GetValue|v0]/[ROOT.GetCountry.MakeScope.Var('je_age_in_months_var').GetValue|v0] #v měsíců#!)"
 no_notable_miguelists_tt: "#b Žádná#! ne-[concept_marginalized] [concept_interest_group] nemá [concept_leader] s [GetIdeology('ideology_miguelist').GetName] [concept_ideology]"
 je_portugal_regeneration_tt: "Dokončil #v $je_portugal_regeneration$#!"
 modifier_second_liberalism_over: "Pád monarchie"
 modifier_traditionalism_over_conservatism: "Tradičnost nad konzervatismem"
 modifier_unabashed_reaction: "Bezcitná reakce"
 portugal_regeneration.1.t: "Duch Regenerace"
 portugal_regeneration.1.d: "Ideál velké \"Regenerace\", která by obrátila dlouhý úpadek [ROOT.GetCountry.GetName], dlouho ovládal [ROOT.GetCountry.GetAdjectiveNoFormatting] liberalismus. Využitím své relativní popularity prohlásila vláda [SCOPE.sCharacter('pm_scope').GetLastName] sama sebe za první vládu Regenerace."
 portugal_regeneration.1.f: "\"Odměny a pocty budou udělovány v důsledku skutečné služby. Veřejné vzdělání učiní mládež ctnostnou a disciplinovanou. Armáda bude pevnou oporou míru, jak zahraničního, tak vnitřního, její síla bude vyvážena organizací národních legií pod kontrolou civilních autorit. Počet majitelů půdy poroste. Zemědělec bude sklízet plody své práce. Továrny dodají veřejnosti zboží potřebné k spotřebě a zaměstnají ruce, které nyní schnou v nečinnosti a chudobě.\"\n\n— Manuel Borges Carneiro, #italic Regenerated Portugal#!"
 portugal_regeneration.1.a: "Pro dobro země."
 portugal_regeneration.2.t: "Konečně"
 portugal_regeneration.2.d: "Regenerace přinesla modernitu do všech oblastí [ROOT.GetCountry.GetAdjective] společnosti. Pokud bylo kdysi pravdou, že náš národ upadá, naše úspěchy dokazují, že to nemusí být trvalé."
 portugal_regeneration.2.f: "Prostor kolem nemocniční postele byl přeplněn příbuznými, až João sotva viděl pramínek na hlavě dědečka. Jeho hlas, kdysi silné barytonové, zjemněl s léty. I přesto mluvil co nejhlasitěji, a ti s proudy slz mu ztichli, aby mohl být slyšen.\n\n\"Když jsem byl mladý, bojoval jsem s Francouzi,\" řekl, \"a v Évoře nebyla pouliční světla. A teď máme vlaky, a může vás všech někam zavést. Co jiného mohu dělat než děkovat Bohu, že mě položil zde a nyní?\""
 portugal_regeneration.2.a: "Ať žije regenerované [ROOT.GetCountry.GetNameNoFormatting]!"
 portugal_regeneration.2.b: "Našimi hrdiny jsou ti, kdo sní o infrastruktuře."
 portugal_regeneration.3.t: "Žebřík pro Icaruse"
 portugal_regeneration.3.d: "Období politické a fiskální stability, které dovolilo ambiciózní program Regenerace, skončilo. [ROOT.GetCountry.GetName] už možná nemůže snít."
 portugal_regeneration.3.f: "Bylo to u konce. Vše, na čem ministr pracoval, všechna opatření, která pečlivě rýsoval poslední dekádu. Možná je stav země jednoduše nenapravitelný. Možná to bylo marné od začátku, a nikdy nebylo možné ho obnovit. Možná bylo dokonce horší: mohlo být plně zachránitelné, nebýt pošetilosti generálů a dalších bláznů.\n\nAkademici budou o tom debatovat příští století, věděl. Bude muset snášet, že v knihovnách budou knihy o neúspěšné Regeneraci a cítit zoufalou touhu vědět, co o něm napíšou. Co dělat než plakat?"
 portugal_regeneration.3.a: "Přežití má přednost před vším ostatním."
 portugal_regeneration.4.t: "Barva pokroku"
 portugal_regeneration.4.d: "Zemědělské reformy Regenerace zvýšily produktivitu a přešly k podnikatelsky orientovanému vlastnictví. Sklizně nyní doprovází rachot strojů a oblak dýmu."
 portugal_regeneration.4.f: "\"Teď, António, řekni mi, jak jsi k tomu přišel?\" Maria pohladila mramorový sál, obrazy na zdech, velké schodiště.\n\n\"Pamatuješ na vinohrad mého otce? Dal jsem ho na burzu a měl jsem štěstí přitáhnout pozornost anglických investorů. Za dva roky jsem zhodnotil dvakrát. Za čtyři jsem to zopakoval. Teď si mohu najmout muže, aby to řídil. A s časem, co ušetřím...\"\n\nJeho prsty jemně pohladily její ruku a ona ucítila, jak jí zrudla tvář."
 portugal_regeneration.4.a: "Venkov, dlouho nezměněný, získává nový život."
 portugal_regeneration.4.b: "Regenerace pozvedá vše, čeho se dotkne."
 portugal_regeneration.5.t: "Tisíc mil"
 portugal_regeneration.5.d: "Regenerace přinesla železnici a telegraf do všech provincií [ROOT.GetCountry.GetName]. Široce dostupná doprava otevřela dříve izolované komunity volnému obchodu a výměně informací."
 portugal_regeneration.5.f: "\"Jel jsem minulý měsíc vlakem do Porta.\"\n\nCarlos se obrátil na souseda skeptickým výrazem. Manuelovy bělostné zuby se leskly skrze prach z cihlové práce. Vytáhl lžíci a nanesl maltu na další místo.\n\n\"Opravdu? Kolik stál lístek?\" zeptal se Carlos.\n\n\"Ach, mám tě za milionáře? Byl jsem uhelníkem!\""
 portugal_regeneration.5.a: "Nemusíme být už cizí lidé."
 portugal_regeneration.5.b: "Politika se zredukuje na dopravu."
 portugal_regeneration.6.t: "Podepsáno a potvrzeno"
 portugal_regeneration.6.d: "Regenerace změnila tvář [ROOT.GetCountry.GetAdjective] veřejné správy. Nevídané množství studentů nastupuje do škol každý rok a množství absolventů poskytuje nábor do soukromého podnikání i státní byrokracie."
 portugal_regeneration.6.f: "Studenti seděli v přísných řadách, knihy v klíně, oči vpřed. Nikdo se neodvážil pohnout. Profesor je pozoroval a mluvil. Jeho hlas se odrážel od podlahy z dlažby, stěny zdobené obrazy rektorů.\n\n\"Popište, jak se liší enumerované povinnosti Cortes mezi Ústavou z roku 1822 a Ústavní chartou z roku 1828.\" \n\nVše najednou, tucet per se spustil."
