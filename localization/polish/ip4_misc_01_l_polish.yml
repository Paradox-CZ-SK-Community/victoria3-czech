 regency.1.t: "Regentství"
 regency.1.d: "Titul [SCOPE.sCharacter('monarch_scope').GetPrimaryRoleTitle] přechází na [SCOPE.sCharacter('monarch_scope').GetFullName], která ještě nedosáhla plnoletosti. Sestavení regentství padlo na bedra současné vlády."
 regency.1.f: "\"Vaším úkolem bude především udržet stabilitu [ROOT.GetCountry.GetNameNoFormatting] po dobu nezletilosti [SCOPE.sCharacter('monarch_scope').GetPrimaryRoleTitle]. Královská rodina je připravena převzít odpovědnost za výchovu dítěte. Můžete si být jisti, že nejste povoláváni jako náhradní rodič.\"\n\nEmisář se zastavil a čekal na odpověď ministra.\n\n\"Rozumím,\" přišla odpověď. \"Co se týče vzdělání, [SCOPE.GetRootScope.GetCountry.GetCustom('country_legislature_name')] je připraven uhradit potřebnou sumu. Co ještě požadujete?\""
 regency.1.a: "[SCOPE.gsInterestGroup('ig_candidate_1').GetLeader.GetFullName] je zřejmá volba."
 regency.1.b: "[SCOPE.gsInterestGroup('ig_candidate_2').GetLeader.GetFullName] lze důvěřovat, že udrží monarchii."
 regency.1.c: "Můžeme se dohodnout s [SCOPE.gsInterestGroup('ig_candidate_3').GetLeader.GetFullName]."
 regency.1.e: "Jmenování [SCOPE.gsInterestGroup('ig_candidate_4').GetLeader.GetFullName] bude populární volba."
 regency.2.t: "Nedovolení"
 regency.2.d: "Z důvodu špatného zdravotního stavu [SCOPE.sCharacter('regent_scope').GetFullName] prohlásil [SCOPE.sCharacter('regent_scope').GetHerselfHimself] za neschopného vykonávat povinnosti [SCOPE.sCharacter('regent_scope').GetHerHis] jako [SCOPE.sCharacter('regent_scope').GetPrimaryRoleTitle]. Vláda musí rozhodnout, kdo [SCOPE.sCharacter('regent_scope').GetHerHim] nahradí."
 regency.2.f: "\"S hlubokým zármutkem oznamuji...\"\n\n[SCOPE.sCharacter('regent_scope').GetLastNameNoFormatting] si znovu přečetl půlvětu, pečlivě papír složil a hodil do krbu. Ne, nepřijatelné. Může být špatně vyloženo a zneužito k nařčení z touhy po moci. Musí být neutrálnější. Něco, co ani jeho nejhorší nepřátelé neotočí proti němu. Vzal další list papíru.\n\n\"Považoval jsem za svou povinnost počkat na panovníka...\""
 regency.2.a: "Jmenujte nového kandidáta z řad [SCOPE.gsInterestGroup('ig_candidate_1').GetName]."
 regency.2.b: "[SCOPE.gsInterestGroup('ig_candidate_2').GetLeader.GetFullName] nejlépe odráží současnou vládu."
 regency.2.c: "[SCOPE.gsInterestGroup('ig_candidate_3').GetLeader.GetFullName] prokázal loajalitu Koruně."
 regency.2.e: "Zvolte populárního kandidáta - [SCOPE.gsInterestGroup('ig_candidate_4').GetLeader.GetFullName]."
 regency.3.t: "Den korunovace"
 regency.3.d: "[SCOPE.sCharacter('monarch_scope').GetFullName] dosáhl plnoletosti a nyní může nastoupit na [ROOT.GetCountry.GetAdjective] trůn. Regentství [SCOPE.sCharacter('regent_scope').GetFullName] skončilo."
 regency.3.f: "[SCOPE.sCharacter('regent_scope').GetFullNameNoFormatting] sledoval, jak kněz vykonává poslední pomazání. Rozdíl mezi [SCOPE.sCharacter('monarch_scope').GetPrimaryRoleTitle] dneška a včerejšího dne byl výraznější, než by kdy čekal. [SCOPE.sCharacter('monarch_scope').GetSheHe|U] stál výš než dřív, s natrénovaným výrazem rozhodnosti na tváři. Koruna vypadala bez tíhy, když byla položena na [SCOPE.sCharacter('monarch_scope').GetHerHis] hlavu.\n\nKněz ustoupil a rozezněla se fanfára, doprovázená duněním děl z hradeb paláce.\n\n\"Věci, které jsem zde slíbil, budu plnit a zachovám,\" recitoval [SCOPE.sCharacter('monarch_scope').GetPrimaryRoleTitle]. \"A tak mi pomozí [SCOPE.GetRootScope.GetCountry.GetCustom('GetDivinity')].\""
 regency.3.a: "Ať žije [SCOPE.sCharacter('monarch_scope').GetPrimaryRoleTitle]!"
 proclaim_regent_monarch: "Vyhlásit regenta králem"
 proclaim_regent_monarch_desc: "Nebýt legitimního nástupce trůnu, čelíme nelehkému úkolu volby nového panovníka, který bude vládnout [Character.GetCountry.GetName]. Současný [Character.GetPrimaryRoleTitle] je silným kandidátem na tuto pozici."
 no_heir_tt: "Neexistuje legitimní [Concept('concept_heir','claimant')] na trůn"
 eterna_regency_tt: "Současný [Concept('concept_ruler','$RULER_TITLE_REGENT$')] je u moci déle než #v 10 let#! (aktuálně [Character.MakeScope.Var('regency_years').GetValue|v0])"
