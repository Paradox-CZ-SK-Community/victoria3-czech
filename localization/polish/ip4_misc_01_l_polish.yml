 decision_revoke_banishment_law_desc: "V roce 1834, v reakci na zrušení kapitulace sesazeného krále Miguela během Liberálních válek, královna Maria II vydala akt, kterým ho a jeho potomky doživotně vyhnala z Portugalska. S vládou nakloněnou cause sesazeného krále můžeme tento akt zrušit a přivítat ho zpět na našich březích."
 miguel_invited_back_tt: "#b $Miguel$ $de_Braganca$#! se objeví v [ROOT.GetCountry.GetName] jako [GetIdeology('ideology_miguelist').GetName] [concept_agitator]"
 je_second_liberalism: "Druhý liberalismus"
 je_second_liberalism_reason: "Liberální revoluce z roku 1820 uvedla éru ústavní vlády v [ROOT.GetCountry.GetName], počínaje tím, co se nazývá \"První liberalismus\". I když král Miguel I krátce obnovil absolutismus, jeho porážka v Liberálních válkách a následné vyhnanství učinily ústavní vládu realitou.\n\nAčkoli jsou nyní všechny úrovně [ROOT.GetCountry.GetAdjectiveNoFormatting] vlády obsazeny bývalými revolucionáři, od umírněné [GetIdeology('ideology_cartist').GetName] tendence po pokrokové radikály, přesná identita tohoto \"Druhého liberalismu\" ještě není definována. Převezmou stabilizační kompromisy umírněných denní pořad? Nebo se duch roku 1820 opět probudí?"
 if_republic_instated_tt: "Pokud [ROOT.GetCountry.GetNameNoFlag] nemá [GetLawType('law_monarchy').GetName]: #indent_newline:3 \n• Spustí událost #v $second_liberalism.2.t$#!#!"
