 two_spains.1.t: "Dvě Španělska"
 two_spains.1.d_1: "Od války za nezávislost byla [ROOT.GetCountry.GetCustom('getNameIBEorSPA')] podrobena divokému přeskakování reforem a reakce. Když liberální [ROOT.GetCountry.GetCustom('getNameIBEorSPANoFormatting')] nastupuje na trůn, konzervativní [ROOT.GetCountry.GetCustom('getNameIBEorSPANoFormatting')] se shromažďuje, aby ho znovu svrhl."
 two_spains.1.d_2: "Od války za nezávislost byla [ROOT.GetCountry.GetName] vystavena divokému přeskakování reforem a reakce. Když konzervativní [ROOT.GetCountry.GetCustom('getNameIBEorSPANoFormatting')] nastupuje na trůn, liberální [ROOT.GetCountry.GetCustom('getNameIBEorSPANoFormatting')] se shromažďuje, aby ho znovu svrhl."
 two_spains.1.f: "V chalupě na okraji Barcelony žena s puchýřovatýma rukama obmotává vlněnou přízi kolem kolíků stavu. Továrna požadovala pět metrů do konce týdne, a jak požadovala, tak bude.\n\nV Andalusii muž kyjem udeří do neúrodné půdy. Po jedné straně stojí sto lidí. Ani jeden z nich už nikdy nic víc nepozná.\n\nPřed stanem v Toledu důstojník kráčí řadou odvedenců. Jeho hlava je plná dýmu z pušek, jejich hlavy prázdné. Budou se muset naučit, věděl. Jak shánět, jak udělat jednu nábojnici za práci deseti. Kdyby morálka opravdu převážila nad materiálem, bylo by to tady dokázáno."
 two_spains.1.a: "Koruna nebo Cortes—která budoucnost zvítězí?"
 two_spains.2.t: "Nejvyšší"
 two_spains.2.d: "Duch městského, osvíceného [ROOT.GetCountry.GetCustom('getSpainName')] zvítězil nad [ROOT.GetCountry.GetCustom('getSpainNameNoFormatting')] Koruny a Církve. Kam nás budoucnost zavede, půjdeme bez břemene tradice."
 two_spains.2.f: "\"Svět neviděl nikdy ušlechtilejší smělost,\nAni den větší statečnosti,\nNež ten, kdy zapáleni pocítili jsme oheň,\nVzbudiv v Riego lásku k vlasti.\n\nDůstojníci, vlast volá k boji,\nPřísaháme jí dobýt nebo zemřít.\"\n\n— Evaristo Fernández de San Miguel, #italic Himno de Riego#!"
 two_spains.2.a: "Libertad!"
 two_spains.2.b: "Duch plukovníka Riega je živý."
 modifier_god_fatherland_fuero_king: "Bůh, Vlast, Fuero, Král"
 two_spains.3.t: "Duch Dona Carlose"
 two_spains.3.d: "Duch venkovského, tradicionalistického [ROOT.GetCountry.GetCustom('getSpainName')] zvítězil nad [ROOT.GetCountry.GetCustom('getSpainNameNoFormatting')] osvícenství a ústavy. Bezbožná budoucnost, kdysi považovaná za neodvratnou, byla vyhnána z našich břehů."
 two_spains.3.f: "\"Skrze katolicismus člověk poznal zákon řádu, a skrze člověka tento řád vstoupil do společnosti. Odpuštění navrácené morálnímu světu zákony, které ztratil skrze prohřešky a hřích. Katolické dogma se stalo kritériem pro vědy, katolická etika průvodcem lidských činů, a katolická charita měřítkem náklonnosti. Lidsé svědomí, osvobozené od korozivního vlivu omylu a hříchu, bylo tak osvíceno ve svém nitru i vnější temnotě. A, vedené světlem těchto tří kritérií, bylo navráceno do blaženosti ztracené nevinnosti.\"\n\n— Juan Donoso Cortés, #italic Essays on Catholicism, Liberalism, and Socialism#!"
 two_spains.3.a: "Pro Boha, Vlast a Krále stojíme vítězně."
 two_spains.3.b: "Zjevení napraví svět."
