 modifier_devorismo: "Devorismo"
 devorismo.1.t: "Sliby a plnění"
 devorismo.1.d: "Navzdory pochybám radikální opozice vláda [SCOPE.sCharacter('pm_scope').GetLastName] dokázala obrovský čin splacení dluhů [ROOT.GetCountry.GetName]. Vítězství \"Devorisma\" jednoho dne možná zastíní jeho odpornou korupci."
 devorismo.1.f: "Ministr financí vystoupil na pódium a přehlédl sněmovnu. Na první pohled poznal, kteří z nich mu budou vstřícní, kteří méně. Kolik z těchto poslanců zastupuje regiony, jejichž statky byly prodány jeho spojencům? Kolik čelilo peticím zoufalých mužů a žen, kteří nyní musí platit za palivové dřevo? Ne většina, a to stačí.\n\n\"První povinností vlády,\" řekl, \"bylo obrátit se k ekonomickému řízení. A touto cestou jsme šli přesně podle plánu...\""
 devorismo.1.a: "Cíl ospravedlňuje prostředky."
 devorismo.1.b: "Záležitost [GetIdeology('ideology_cartist').GetName] získala další vítězství."
 devorismo.2.t_dummy: "Revoluce [SCOPE.GetRootScope.GetCountry.GetCustom('getCurrentMonthName')]"
 devorismo.2.t: "Revoluce [SCOPE.GetRootScope.GetCountry.GetCustom('getPortugalRevolutionMonthName')]"
 devorismo.2.d: "Zneužívání vlády \"Požíračů\" se stalo neudržitelným. Masy z [ROOT.GetCountry.GetCapital.GetCityHubName] a Národní garda se sesypaly před Cortes Geraes a požadují, aby [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] předal moc opozici."
 devorismo.2.f: "\"Jsme na prahu občanské války. Zítra, Vaše Excelence, budete velením armád [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] a já budu velením republiky. Pokud se meč Bouças setká s mečem Asseiceiry, mé přátelství a respekt k Vaší Excelenci nijak neutrpí.\"\n\n— Manuel da Silva Passos, markýz Sá da Bandeira"
 devorismo.2.a: "Listina dokončila svůj běh - ať žije Ústava!"
 devorismo.2.b: "Nevrátí nás do anarchie!"
 modifier_september_revolution_radicalism: "Radikalizovaní pokrokoví"
 devorismo.3.t: "Klub Camilos"
 devorismo.3.d: "[SCOPE.sCharacter('intelligentsia_ig_char').GetFullName], [SCOPE.sCharacter('trade_unions_ig_char').GetFullName] a skupina dalších levicových politiků založili společnost k diskusi o radikálních reformách v [ROOT.GetCountry.GetName]. Členové současné vlády ji označili jako zrádnou konspiraci a požadují její uzavření."
 devorismo.3.f: "\"Jak je možné, že lze být současně vlastencem i zrádcem?\"\n\nAntónio natáhl ruku a zatáhl žaluzie. Pohlédl na muže naproti a snížil hlas.\n\n\"Dokud je Dom Miguel на trůně,\" začal, \"ten, kdo proti němu bojuje, je vlastenec. Může ničit, co chce, je to prostředek k cíli. Ale pokud by jmenoval liberála do své vlády? Ach, teď je království hodné ochrany a všichni, kdo pokračují v boji, se stávají zrádci. Držení trůnu dělá z nás všechny reakcionáře.\"\"
 devorismo.3.a: "Okamžitě nařizujeme uzavření této organizace."
 devorismo.3.b: "Kdysi jsme byli všichni revolucionáři."
