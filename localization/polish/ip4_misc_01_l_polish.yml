 je_portugal_united_kingdom: "Spojené království"
 je_portugal_united_kingdom_reason: "Od 1807 do 1821 soud [ROOT.GetCountry.GetName] vládal z Rio de Janeira. Aby vyhověl [SCOPE.sCountry('brazil_scope').GetAdjective] zájmům, král João VI povýšil #b $BRZ$#! na úroveň rovnocenného království, čímž vzniklo #b Spojené království Portugalska, Brazílie a Algarvů#!. I když nezávislost #b $BRZ$#! ukončila první Spojené království, #b $POR$#! a #b $BRZ$#! byly brzy po tom opět umístěny pod krátkou osobní unii pod králem a císařem Pedro IV a I.\n\nNedávný návrat $POR_ADJ$ moci a současná přívětivá atmosféra mezi námi a naší bývalou kolonií zvyšují naděje na obnovení #b Spojeného království#!. Pokud budou #b $BRZ_ADJ$#! zákony o následnictví pozměněny, mohou se tyto naděje stát realitou.\n\nDokud je tento [concept_journal_entry] aktivní, budeme schopni podepsat [concept_treaty] o $amend_succession$ s [SCOPE.sCountry('brazil_scope').GetName], čímž připravíme půdu pro budoucí [concept_personal_union]."
