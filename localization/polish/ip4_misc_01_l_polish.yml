 effects_depend_on_popularity_tt: "Efekty této interakce se budou lišit podle [concept_popularity] [Character.GetFullName]"
 espartero_becomes_monarch_tt: "[SCOPE.sCharacter('espartero_scope').GetFullName] bude korunován jako [SCOPE.sCharacter('espartero_scope').GetCountry.GetCustom('country_male_royal_title')] [ROOT.GetCountry.GetName]"
