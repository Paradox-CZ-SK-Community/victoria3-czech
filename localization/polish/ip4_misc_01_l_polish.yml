 notification_pope_confirms_archbishop_of_toledo_desc: "[SCOPE.sCountry('papacy_scope').GetRuler.GetPrimaryRoleTitle] potvrdil jmenování [SCOPE.sCountry('spain_scope').GetRuler.GetFullName] [SCOPE.sCharacter('spanish_archbishop_scope').GetFullName] jako arcibiskupa Toleda, čímž implicitně uznal legitimitu [SCOPE.sCountry('spain_scope').GetHeir.GetPrimaryRoleTitle] [SCOPE.sCountry('spain_scope').GetHeir.GetFirstName]ovy vlády."
