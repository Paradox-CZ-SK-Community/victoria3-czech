 anarchism_events.1.t: "Poslové smrti"
 anarchism_events.1.d_1: "Zatímco [SCOPE.sCharacter('propaganda_of_the_deed_victim').GetCustom('anarchist_assassination_circumstances')] v [SCOPE.sState('anarchist_terror_state_scope').GetCityHubName], [SCOPE.sCharacter('propaganda_of_the_deed_victim').GetPrimaryRoleTitle] [SCOPE.sCharacter('propaganda_of_the_deed_victim').GetFullName] přistoupil militant [SCOPE.sPoliticalMovement('anarchist_terror_movement_scope').GetName]. Militantský střelec na [SCOPE.sCharacter('propaganda_of_the_deed_victim').GetPrimaryRoleTitle] vystřelil z pistole a smrtelně jej zranil."
 anarchism_events.1.d_2: "Zatímco [SCOPE.sCharacter('propaganda_of_the_deed_victim').GetCustom('anarchist_assassination_circumstances')] v [SCOPE.sState('anarchist_terror_state_scope').GetCityHubName], [SCOPE.sCharacter('propaganda_of_the_deed_victim').GetFullName] přistoupil militant [SCOPE.sPoliticalMovement('anarchist_terror_movement_scope').GetName]. Militantský střelec vystřelil na [SCOPE.sCharacter('propaganda_of_the_deed_victim').GetLastNameNoFormatting] z pistole a smrtelně jej zranil."
 anarchism_events.1.f: "[SCOPE.sCharacter('name_a_scope').GetFirstNameNoFormatting] zapálil dýmku a podal rychle slábnoucí zápalku doprava. Jeho soused si zapálil svou a vůně levného tabáku se mu vplížila do nosu.\n\nMuž, který se k němu přidal, zvedl dýmku k rtům a vypustil spokojený kouřový kroužek. V dálce, na okraji jejich slyšení, zazněl ostrý zvuk. Pak další, pak další.\n\n\"Slyšel jsi to taky?\", zeptal se, ač už znal odpověď. A pak, dřív než očekával, se ozval hrozný výkřik."
 anarchism_events.1.a: "Musíme mít odvetu."
 anarchism_events.1.b: "Ať žije anarchie!"
 anarchism_events.2.t: "A pak nic"
 anarchism_events.2.d_1: "Militant [SCOPE.sPoliticalMovement('anarchist_terror_movement_scope').GetName] zavraždil [SCOPE.sCharacter('propaganda_of_the_deed_victim').GetPrimaryRoleTitle] [SCOPE.sCharacter('propaganda_of_the_deed_victim').GetFullName] v ulicích [SCOPE.sState('anarchist_terror_state_scope').GetCityHubName] pomocí vlastnoručně vyrobené bomby. Ve městě se po atentátu rozhostilo atmosféra teroru."
 anarchism_events.2.d_2: "Militant [SCOPE.sPoliticalMovement('anarchist_terror_movement_scope').GetName] zavraždil [SCOPE.sCharacter('propaganda_of_the_deed_victim').GetFullName] v ulicích [SCOPE.sState('anarchist_terror_state_scope').GetCityHubName] pomocí vlastnoručně vyrobené bomby. Ve městě se po atentátu rozhostilo atmosféra teroru."
 anarchism_events.2.f: "Na krátkou, šílenou chvíli si [SCOPE.sCharacter('name_a_scope').GetFirstNameNoFormatting] myslel, že muž zamával. Pak však uviděl objekt ve vzduchu, muž se otočil a běžel pryč, [SCOPE.sCharacter('propaganda_of_the_deed_victim').GetLastNameNoFormatting] zvedl [SCOPE.sCharacter('propaganda_of_the_deed_victim').GetHerHis] ruku, aby si chránil obličej. A pak to udeřilo.\n\nZaznělo hrozné prasknutí, výbuch tlaku, obláček dýmu mnohem menší, než by měl být. Hrozivý zvon zakryl všechny ostatní zvuky. Viděla, jak [SCOPE.sCharacter('propaganda_of_the_deed_victim').GetLastNameNoFormatting|U] kráčí vpřed, vyjde z dýmu a bezmocně se podívá na místo, kde byla [SCOPE.sCharacter('propaganda_of_the_deed_victim').GetHerHis] ruka. Poté se [SCOPE.sCharacter('propaganda_of_the_deed_victim').GetHerHis] kolena podlomila a kluzká skvrna rudého zmaru se rozlila po dlažbě."
 anarchism_events.2.a: "[SCOPE.sCharacter('propaganda_of_the_deed_victim').GetLastName|U] bude pomstěn."
 anarchism_events.2.b: "Ať žije anarchie!"
 anarchism_events.3.t: "Pekelný skutek"
 anarchism_events.3.d: "Militant [SCOPE.sPoliticalMovement('anarchist_terror_movement_scope').GetName] spáchal teroristický útok v [SCOPE.sState('anarchist_terror_state_scope').GetCityHubName], když hodil do orchestřiště zaplněného divadla dvě bomby. Desítky diváků byly zabity nebo zraněny."
 anarchism_events.3.f: "\"Nemůžete tu být,\" řekl muž u dveří. \"Víte to? Vaše činy přivolají na nás všechny státní psovody.\"\n\nTvář [SCOPE.sCharacter('name_a_scope').GetFirstNameNoFormatting] se roztáhla do úšklebku. \"Vy jsi zbabělec,\" odpověděl. \"Ty fňukající, hloupý zbabělče. Obětoval jsem se ve prospěch lidského pokroku. Máš povinnost-\"\n\n\"Drž hlas #italic potichu#!. Pokrok... ty jsi řezník dětí a tu být nemůžeš. Rozumíš, co jsi udělal? Tvá bezohledná masakra vrátila lidem důvěru v nás o sto let zpět... Přivedl jsi je do náruče státu. Musíš odejít. #italic Teď#!.\""
 anarchism_events.3.a: "Tento teror nelze tolerovat."
 anarchism_events.3.b: "Neexistuje nevinná buržoazie."
 circumstances_spa: "navštěvoval lázně"
 circumstances_fair: "navštěvoval jarmark"
 circumstances_walking: "šel na procházku"
 circumstances_parade: "navštěvoval přehlídku"
 circumstances_store: "nakupoval v obchodním domě"
 anarchism_events.4.t: "Propaganda činem"
 anarchism_events.4.d: "Považujíce otevřenou politickou organizaci za neuskutečnitelnou, [SCOPE.sPoliticalMovement('propaganda_of_the_deed_movement_scope').GetName] přijala doktrínu „Propaganda činem“. Prostřednictvím veřejných atentátů na politiky a podnikatele doufá hnutí inspirovat masy k dalším revolučním aktivitám."
 anarchism_events.4.f: "Fasáda budovy, spálená do černa, se před detektivem rozevřela jako čelist veliké vyplavené mořské panny. Výstavní skříňky a ramena s oblečením, rozbitá a rozházená po zemi, tvořila její zkažené zuby.\n\nVětrem pohozený kus papíru, okraje zčernalé, se přilepil k boku jeho boty. \"#b Válka!#\" hlásal v pečlivém písmu. Zvedl ho a otočil se zády ke větru, aby zastavil jeho lítání. \"#b Třídní válka#!,\" pokračovalo, \"zapálená #b vámi#!...\"\n\nVstrčil ho do kapsy. Teď, pomyslel si. Kde je nejbližší tiskárna?"
 anarchism_events.4.a: "Násilné časy nás čekají."
 anarchism_events.4.b: "O to více důvodů k ostražitosti."
 anarchist_terrorism_start_tt: "Dokud je [Concept('concept_activism','$concept_activism_short$')] [SCOPE.sPoliticalMovement('propaganda_of_the_deed_movement_scope').GetName] nad @activism_red! $RADICALISM_PROTESTING$ (#v [GetDefine('NPolitics', 'RADICALISM_PROTESTING_THRESHOLD')|%0]#!), hnutí může provádět #r teroristické útoky#! na naše [Concept('concept_executive','$concept_executives$')], [Concept('concept_politician', '$concept_politicians$')], nebo [concept_ruler]"
 modifier_propaganda_of_the_deed_security: "Bezpečnostní síly v pohotovosti"
 anarchism_events.5.t: "Černý vír"
 anarchism_events.5.d: "[SCOPE.sPoliticalMovement('anarchist_movement_scope').GetName] se chopili zbraní a zahájili revoluční boj proti vládě ze svého srdce v [SCOPE.sState('revolutionary_country_capital_scope').GetName]."
 anarchism_events.5.f: "\"Není už čas. Musíme jít. #italic Teď#!.\"\n\nFrancisco mávl rukou přes stůl ve velkém oblouku a jeho věci skončily v ošuntělém koženém vaku. Napříč místností jeho soudruh sypal lahvičky střelného prachu do tiskárenských strojů. Zvenku se linul zvuk trubek. Vojáci pochodovali, kdesi v dálce. Dvě ulice odtud? Tři?\n\n\"Dost toho,\" řekl. \"Vyndej zápalky, vystačíme s tím, co máme.\"\n\nNabil rameno batohem a vyrazil ke dveřím, za ním se záhadně přibližovaly pavučinaté kroky. Nadšení mu hrozilo, že mu vyhodí srdce do povětří. [SCOPE.sState('revolutionary_country_capital_scope').GetFarmHubName] byla tak, tak blízko a svobodný svět jen o kousek dál."
 anarchism_events.5.a: "Viva España!"
 anarchism_events.5.b: "A las barricadas!"
