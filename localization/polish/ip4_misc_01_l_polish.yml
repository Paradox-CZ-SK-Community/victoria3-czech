 je_spanish_anarchism_reason: "Chudoba a politické napětí, které [ROOT.GetCountry.GetName] sužují, vytvořily půdu úrodnou pro růst [SelectLocalization(SCOPE.sPoliticalMovement('anarchist_movement_scope').IsValid, SCOPE.sPoliticalMovement('anarchist_movement_scope').GetName, 'movement_anarchist')]. Anarchističtí agitátoři nalezli pevnou základnu podpory mezi těmi, jejichž živobytí se stalo nejistým modernizací $SPA$.\n\nOd továren v [SelectLocalization(SCOPE.sState('relevant_urban_state').IsValid, SCOPE.sState('relevant_urban_state').GetCityHubName, ROOT.GetCountry.GetCapital.GetCityHubName)] až po jižní vesnice plné zbídačených najatých dělníků, unavené tváře hledí na ty s ohnivýma očima a prsty poničenými prachem. Naslouchají, učí se — a dostanou-li sebemenší příležitost, zasáhnou."
