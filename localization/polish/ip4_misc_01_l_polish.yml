 devorismo.4.t: "Pravděpodobný příběh"
 devorismo.4.d: "Požár v budově Královské pokladny zničil mnoho dokumentů týkajících se výdajů vlády [SCOPE.sCharacter('prime_minister_scope').GetLastName]. Přestože praví pachatelé nejsou známí, opoziční činitelé obvinili vládu, že požár zinscenovala, aby zakryla svou korupci."
 devorismo.4.f: "\"Čistá náhoda-\"\n\"Tragédie pro #italic celý#! národ-\"\n\"Probíhá vyšetřování-\"\n\nMinistr se odmlčel nad svým rozmazaným světem psaní dopisů, přerušeným náhle mihotavým světlem. Svíčka znovu uběhla a večerní světlo zmizelo. Obrátil se k nejbližšímu služebníku a ukázal na něj.\n\n\"Chtějí po mně vysvětlit, jak tu ten žár vypukl, zrovna tady,\" zabručel. \"Musí pochopit, že žádné požární ochrany nejsou dokonalé...\""
 devorismo.4.a: "Absurdní konspirace!"
 devorismo.4.b: "Shoďte vinu na ministra financí."
 devorismo.5.t: "Pozřeno"
 devorismo.5.d: "Politiky \"Devorisma\" pohltily většinu bývalého státního majetku [ROOT.GetCountry.GetName]. Zatímco peněženky politiků [GetIdeology('ideology_cartist').GetName] se naplnily, státní pokladnice zůstala vyčerpaná."
 devorismo.5.f: "\"Národ a soudy mají právo znát pravdu a celou pravdu, a protože naše ills jsou tak hluboké, je nutné, aby byly známy, aby je bylo možno napravit. Národ byl unaven občanskou válkou a krvavým bojem, naše majetky byly promrhány pachatelem usurpace, a první povinnost vlády byla vstoupit na cestu ekonomického řízení. Bohužel, touto cestou jsme nešli: snadnost získání peněz skrze půjčky vyvolala jisté poblouznění ve prospěch kreditu, a jeho zázraky byly mnohokrát přehnané v této komnatě.\"\n\n— Francisco Antonio de Campos"
 devorismo.5.a: "Došli jsme tuto cestu ke svému trpkému konci."
 devorismo.5.b: "Soukromé vlastnictví je cílem samo o sobě."
 devorismo.6.t: "Preč s charitou"
 devorismo.6.d: "Zavedení přímých voleb a odstranění vlády [GetIdeology('ideology_cartist').GetName] vytvořilo příležitost nahradit nepopulární Ústavní Chartu z roku 1826. [SCOPE.gsInterestGroup('septemberist_ig').GetName] požaduje novou ústavu, prosazenou demokratickými prostředky spíše než královskou vůlí."
 devorismo.6.f: "\"Jaký je rozdíl mezi ústavou darovanou a vykonanou? Je to rozdíl mezi charitou a poctivou prací, mezi dětstvím a dospělostí. První představuje národ jako poddané suveréna, odevzdávající se za drobky dobrovolnosti. Druhá ztělesňuje národ jako sebeurčitý celek, jehož suverén je jen jeho zástupcem.\"\n\nKonec projevu přešel v zuřivé škrábání pera sekretáře. Spokojené \"cvak\" oznamovalo jeho dokončení.\n\n\"Dobře,\" řekl řečník. \"Teď ještě šest bodů...\""
 devorismo.6.a: "Lid [ROOT.GetCountry.GetAdjective] dostane svou ústavu!"
 devorismo.6.b: "Naše problémy nejsou systémem, ale těmi, kdo ho řídí."
