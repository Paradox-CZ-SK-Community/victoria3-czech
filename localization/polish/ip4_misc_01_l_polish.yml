l_polish:
 je_ip4_coup: "Puč!"
 je_ip4_coup_reason: "[ROOT.GetCountry.GetCustom('get_coup_je_text')], [SCOPE.sCharacter('golpista_general').GetCustom('ordered_personality_traits_loc')|l] [SCOPE.sCharacter('golpista_general').GetRankName] [SCOPE.sCharacter('golpista_general').GetFullName] a [SCOPE.sCharacter('golpista_general').GetHerHis] spojenci mezi [SCOPE.gsInterestGroup('golpista_ig').GetName] začali manévrovat směrem k uchopení státní moci silou zbraní.\n\nDokud bude tento [concept_journal_entry] aktivní, rychlost, jakou se $concept_coup$ bude #tooltippable;tooltip:[GetPlayer.GetTooltipTag],coup_progress_factors_tt posouvat#! nebo #tooltippable;tooltip:[GetPlayer.GetTooltipTag],coup_regress_factors_tt klesat#!, bude určena [SCOPE.sCharacter('golpista_general').GetPrimaryRoleTitle] [SCOPE.sCharacter('golpista_general').GetLastName]'s [concept_coup_strength] ([SCOPE.sCharacter('golpista_general').MakeScope.Var('monthly_cached_commander_coup_strength').GetValue|v2]) sníženou o [ROOT.GetCountry.GetName]'s [concept_coup_resistance] ([SCOPE.ScriptValue('country_coup_resistance')|v2]). Pokud #b Pokrok#! dosáhne #v 100%#!, a [SCOPE.sCharacter('golpista_general').GetLastNameNoFormatting] bude schopen spustit [SCOPE.sCharacter('golpista_general').GetHerHis] [concept_coup], hrozí, že naše vláda bude svržena."
 coup_je_reason_text_1: "Usilují o zamezení přijetí [ROOT.Var('coup_loc_law_var').GetLaw.GetName]"
 coup_je_reason_text_2: "Rozzuření z neschopnosti současné vlády prosadit jejich legislativní program"
 coup_je_reason_text_3: "Na pomstu za zradu závazků ze strany současné vlády"
 coup_je_reason_text_4: "Ve snaze naplnit osobní ambice [ROOT.Var('coup_loc_char_var').GetCharacter.GetHerHis]"
 coup_je_reason_text_5: "Ve jménu svrhnutí a nahrazení vládnoucí dynastie [ROOT.GetCountry.GetRuler.GetLastName]"
 coup_je_reason_text_6: "Chtějí ustanovit režim vstřícnější k [ROOT.Var('coup_loc_lobby_country_var').GetCountry.GetName]"
 coup_je_reason_text_7: "Ve vytrvalém úsilí [ROOT.Var('coup_loc_char_var').GetCharacter.GetHerHis] o Republiku práce"
 coup_je_reason_text_0: "Ve bezostyšném projevu ambicí"
 coup_progress_factors_tt: "Faktory, které budou #b zvyšovat#! postup [concept_coup], zahrnují:\n• Nízké [concept_government] [concept_legitimacy]\n• Vysoké [concept_popularity] pučistického [concept_commander]\n• Podíl celkových [Concept('concept_unit','$concept_units$')] velených pučistickým [concept_commander]\n• [concept_clout] $ig_approval_unhappy$ [Concept('concept_interest_group','$concept_interest_groups$')] podporujících $concept_coup$\n• Blízkost pučistického [concept_commander] [concept_military_formation] k [concept_capital_state]"
 coup_regress_factors_tt: "Faktory, které budou #b snižovat#! postup [concept_coup], zahrnují:\n• Vysoké [concept_government] [concept_legitimacy]\n• Nízké [concept_popularity] pučistického [concept_commander]\n• Úroveň investic do [GetInstitutionType('institution_home_affairs').GetName] v rámci [GetLawType('law_secret_police').GetName] nebo [GetLawType('law_national_guard').GetName] [Concept('concept_law', '$concept_laws$')]\n• Zvýšení [concept_approval] [Concept('concept_interest_group','$concept_interest_groups$')] podporujících $concept_coup$\n• Vzdálenost pučistického [concept_commander] [concept_military_formation] od [concept_capital_state]"
 ip4_coup.1.t: "[SCOPE.sCharacter('golpista_general').GetPrimaryRoleTitle] [SCOPE.sCharacter('golpista_general').GetLastName]'s Pokus"
 ip4_coup.1.d_1: "[SCOPE.sCharacter('golpista_general').GetPrimaryRoleTitle] [SCOPE.sCharacter('golpista_general').GetFullName], prominentní odpůrce [SCOPE.sLaw('current_law_scope').GetName], začal manévrovat tak, aby násilím zamezil prosazení zákona. [SCOPE.sCharacter('golpista_general').GetHerHis|U] pokus o uchopení moci je podpořen frakcí [SCOPE.gsInterestGroup('golpista_ig').GetName]."
 ip4_coup.1.d_2: "Frakce [SCOPE.gsInterestGroup('golpista_ig').GetName], rozzuřená neschopností současné vlády naplnit jejich legislativní program, zahájila spiknutí s [SCOPE.sCharacter('golpista_general').GetPrimaryRoleTitle] [SCOPE.sCharacter('golpista_general').GetFullName], aby uchvátili moc nad [ROOT.GetCountry.GetName]."
 ip4_coup.1.d_3: "Frakce [SCOPE.gsInterestGroup('golpista_ig').GetName], rozzuřená zradou závazků ze strany současné vlády, ztratila víru v politický proces. Oslovila [SCOPE.sCharacter('golpista_general').GetPrimaryRoleTitle] [SCOPE.sCharacter('golpista_general').GetFullName] s plánem uchvátit moc nad [ROOT.GetCountry.GetName]."
 ip4_coup.1.d_4: "Vytušen příležitost naplnit [SCOPE.sCharacter('golpista_general').GetHerHis] osobní ambice, [SCOPE.sCharacter('golpista_general').GetCustom('personality_traits_loc')|l] [SCOPE.sCharacter('golpista_general').GetPrimaryRoleTitle] [SCOPE.sCharacter('golpista_general').GetFullName] zmobilizoval své stoupence mezi [SCOPE.gsInterestGroup('golpista_ig').GetName], aby uchvátili moc nad [ROOT.GetCountry.GetName]."
 ip4_coup.1.d_7: "Vytušen příležitost prosadit emancipaci dělnické třídy, [SCOPE.sCharacter('golpista_general').GetCustom('personality_traits_loc')|l] [SCOPE.sCharacter('golpista_general').GetFullName] zorganizoval své sympatizanty mezi [SCOPE.gsInterestGroup('golpista_ig').GetName], aby se pokusili uchvátit moc nad [ROOT.GetCountry.GetName]."
 ip4_coup.1.d: "[SCOPE.sCharacter('golpista_general').GetCustom('personality_traits_loc')|l] [SCOPE.sCharacter('golpista_general').GetPrimaryRoleTitle] [SCOPE.sCharacter('golpista_general').GetFullName] začal činit hrozivé kroky směřující k uchvácení moci nad [ROOT.GetCountry.GetName]. [SCOPE.sCharacter('golpista_general').GetSheHe|U] je podporován frakcí [SCOPE.gsInterestGroup('golpista_ig').GetName]."
 ip4_coup.1.f: "Plukovník [SCOPE.sCharacter('name_a_scope').GetLastNameNoFormatting] zvedl plachtu stanu a vplížil se dovnitř. Vzduch už byl těžký kouřem a další židle se zaplnily. Mapy byly rozložené po stole – terén, vládní objekty, důležitá infrastruktura. Pozdravil [SCOPE.sCharacter('golpista_general').GetPrimaryRoleTitle] sedícího na konci stolu a zaujal místo.\n\nNebyl sám. Plukovník [SCOPE.sCharacter('name_b_scope').GetLastNameNoFormatting] seděl nalevo od něj a jeho dýmka přispívala k dusivé mlze.\n\n\"Omlouvám se za zpoždění,\" začal [SCOPE.sCharacter('name_a_scope').GetLastNameNoFormatting]. \"Byl tam nový hlídač brány.\"\n\n[ SCOPE.sCharacter('golpista_general').GetPrimaryRoleTitle ] přikývl. \"Odpouští se. Váš hlášení, prosím. Stav dvacáté čtyřky?\""
 ip4_coup.1.a: "Ať se vám daří, [SCOPE.sCharacter('golpista_general').GetPrimaryRoleTitle] [SCOPE.sCharacter('golpista_general').GetLastName]!"
 ip4_coup.1.b: "Současný režim musí přetrvat."
 ip4_coup.11.t: "Plán [SCOPE.sCountry('coupist_lobby_country').GetAdjective]"
 ip4_coup.11.d: "Předvojem [SCOPE.sCharacter('golpista_general').GetPrimaryRoleTitle] [SCOPE.sCharacter('golpista_general').GetFullName] se [SCOPE.sPoliticalLobby('relevant_lobby').GetName] pokouší manévrovat tak, aby násilím ustanovila pro-[SCOPE.sCountry('coupist_lobby_country').GetAdjective] vládu v [ROOT.GetCountry.GetName]. Schéma je podpořeno značným zahraničním financováním."
 ip4_coup.11.f: "Plukovník [SCOPE.sCharacter('name_a_scope').GetLastNameNoFormatting] zvedl plachtu stanu a vplížil se dovnitř. Vzduch už byl těžký kouřem a další židle se zaplnily. Mapy byly rozložené po stole - terén, vládní objekty, důležitá infrastruktura. Pozdravil [SCOPE.sCharacter('golpista_general').GetPrimaryRoleTitle] sedícího na konci stolu a zaujal místo.\n\nNebyl sám. Plukovník [SCOPE.sCharacter('name_b_scope').GetLastNameNoFormatting] seděl nalevo od něj a jeho dýmka přispívala k dusivé mlze.\n\n\"Omlouvám se za zpoždění,\" začal [SCOPE.sCharacter('name_a_scope').GetLastNameNoFormatting]. \"Byl tam nový hlídač brány.\"\n\n[ SCOPE.sCharacter('golpista_general').GetPrimaryRoleTitle ] přikývl. \"Odpouští se. Váš hlášení, prosím. Stav dvacáté čtyřky?\""
 ip4_coup.11.a: "Pro-[SCOPE.sCountry('coupist_lobby_country').GetAdjectiveNoFormatting] spojenectví by mohlo být výhodné."
 ip4_coup.11.b: "Současný režim musí přetrvat."
 ip4_coup.2.t: "Prohlášení (Pronunciamento)!"
 ip4_coup.2.d: "[SCOPE.sCharacter('golpista_general').GetRankName] [SCOPE.sCharacter('golpista_general').GetFullName] vydal pronunciamento z [SCOPE.sCharacter('golpista_general').GetHerHis] štábu v [SCOPE.sState('pronunciamento_state').GetName]. [SCOPE.sCharacter('golpista_general').GetCustom('getGeneralAdmiral')] a [SCOPE.sCharacter('golpista_general').GetHerHis] spojenci v [SCOPE.gsInterestGroup('golpista_ig').GetName] se otevřeně postavili proti naší vládě."
 ip4_coup.2.d_1: "[SCOPE.sCharacter('golpista_general').GetRankName] [SCOPE.sCharacter('golpista_general').GetFullName] vydal pronunciamento z [SCOPE.sCharacter('golpista_general').GetHerHis] štábu v [SCOPE.sState('pronunciamento_state').GetName]. [SCOPE.sCharacter('golpista_general').GetCustom('getGeneralAdmiral')] a [SCOPE.sCharacter('golpista_general').GetHerHis] spojenci v [SCOPE.sPoliticalLobby('relevant_lobby').GetName] se otevřeně postavili proti naší vládě."
 ip4_coup.2.f: "Občané,\n\nRežim v [ROOT.GetCountry.GetCapital.GetCityHubName] vyhlásil rozsudek smrti pro [ROOT.GetCountry.GetNameNoFormatting] a zbavil nás jakékoli naděje ukončit občanské spory. Není už nic jiného než volání na lid.\n\nMoji krajané! Vyslyšte křik vlasti! Zavřete uši před návrhem režimu, který v své zášti a bezmoci vkládá veškerou naději do nesjednocenosti lidu a armády.\n\nObce [SCOPE.sState('pronunciamento_state').GetNameNoFormatting], [TimeKeeper.GetCurrentDate.GetString]\n[SCOPE.sCharacter('golpista_general').GetFullNameNoFormatting]"
 ip4_coup.2.f_7: "Občané,\n\nRoky škrcení! Roky urážek! Národ námi pohrdán, vyrabován, pošliapán! Copak to nestačí? Ne! Teď hlad trhá lidu útroby! Žádné dílny! Žádná manželství! To vše je revoluční. Nic než paláce a vězení, kláštery a nevěstince!\n\nK zbraním, lidu [SCOPE.sState('pronunciamento_state').GetCityHubName]! Už dost! Dostali jste svobodu od svých otců; nenecháte otroctví svým synům.\n\nUtlačovatelé naplnili pohár až po okraj. K zbraním! Ať hromové tresty dopadnou na jejich urážky. Hodina velké revoluce lidu zazněla! Pochodujme!"
 ip4_coup.2.a: "Vojáci promluvili. Náš mandát skončil."
 ip4_coup.2.b: "Nevzdáme se!"
 ip4_coup.3.t: "Ztráta zájmu"
 ip4_coup.3.d: "Spiknutí za svržení sedící [ROOT.GetCountry.GetAdjective] vlády ztratilo mezi [SCOPE.gsInterestGroup('golpista_ig').GetName] jakýkoli moment. Plán [SCOPE.sCharacter('golpista_general').GetPrimaryRoleTitle] [SCOPE.sCharacter('golpista_general').GetFullName] byl opuštěn."
 ip4_coup.3.f: "\"Problém s tebou, [SCOPE.sCharacter('golpista_general').GetLastNameNoFormatting], je ten, že jen proto, že se ti podařilo přimět hrstku polointeligentů, aby zohyzdili scénu v [SCOPE.sState('capital_scope').GetCityHubName] chozením v krátkých kalhotách, myslíš si, že jsi někdo. Slyšíš je křičet 'Ať žije, [SCOPE.sCharacter('golpista_general').GetLastNameNoFormatting]!' a myslíš si, že je to Hlas lidu. Tam děláš chybu. Co Hlas lidu skutečně říká je: 'Podívejte se na toho hrozného osla [SCOPE.sCharacter('golpista_general').GetLastNameNoFormatting] tupě pobíhajícího v ponožkách! Viděl jsi někdy takového blbce?'\"
 ip4_coup.3.a: "Modleme se, aby se nikdo nedozvěděl, co se málem stalo."
 ip4_coup.3.b: "Víme, jaké plány [SCOPE.sCharacter('golpista_general').GetSheHe] chystal. Spravedlnost bude vykonána."
 ip4_coup.4.t: "Utahování obrouček"
 ip4_coup.4.d: "[SCOPE.sCharacter('golpista_general').GetPrimaryRoleTitle] [SCOPE.sCharacter('golpista_general').GetFullName] si povšiml snah státu snížit množství vojenských sil, které má [SCOPE.sCharacter('golpista_general').GetHerHim] k dispozici. Obvinil vládu, že hazarduje s vojenskými záležitostmi."
 ip4_coup.4.f: "[SCOPE.sCharacter('golpista_general').GetPrimaryRoleTitle] [SCOPE.sCharacter('golpista_general').GetLastNameNoFormatting] přecházel sem a tam po podlaze svého stanu. Před ním stáli jeho věrní důstojníci—ti, kteří nebyli nuceni se přemístit. Nemohl otevřeně odmítnout příkazy, které znenadání dorazily z [ROOT.GetCountry.GetCapital.GetCityHubName], a zůstal tak jen se skeletonem klíčového štábu.\n\nVláda byla po něm. Jiného vysvětlení nebylo. Žádné jiné velení nebylo tak těžce zasaženo. Chce-li získat své pozice zpět, bude muset odpovědět. Ukázal na dva muže v první řadě.\n\n\"Plukovníku [SCOPE.sCharacter('name_a_scope').GetLastNameNoFormatting], majoru [SCOPE.sCharacter('name_b_scope').GetLastNameNoFormatting]...\""
 ip4_coup.4.a: "\"...oznamte svým mužům, aby se rozestavili.\""
 ip4_coup.4.b: "\"...předejte zprávu našim vzdáleným kolegům.\""
