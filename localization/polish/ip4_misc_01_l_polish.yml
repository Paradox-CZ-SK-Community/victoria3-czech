 brazilian_succession_explanation_tt: "Pokud je #b průběh#! #v $BRZ_ADJ$#! #v $je_pedro_brazil$#! [concept_journal_entry] #v 50%#! nebo méně (aktuálně [GetPlayer.MakeScope.ScriptValue('brazil_pedropoints_as_percent')|v%0]), #v $BRZ$#! padne k republikánskému puči po smrti #b $Pedro$ $de_Braganca$#!. Pokud k tomuto puči dojde, náš [concept_ruler] nebude schopen úspěšně nastoupit na #v $BRZ_ADJ$#! trůn."
 lusofonia.1.t: "Zpět v řádu"
 lusofonia.1.d: "Podle podmínek [SCOPE.sTreaty('relevant_treaty_scope').GetName] byli [SCOPE.sCharacter('portuguese_monarch_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('portuguese_monarch_scope').GetFullName] a jeho potomci navráceni do své správné pozice v [SCOPE.sCountry('brazil_scope').GetAdjective] linii následnictví. Jakmile [SCOPE.sCharacter('brazil_monarch_scope').GetFullName] opustí trůn, [SCOPE.sCountry('brazil_scope').GetAdjective] bude opět vládnuto [SCOPE.sCountry('portugal_scope').GetAdjectiveNoFormatting] monarchou."
 lusofonia.1.f: "Zákon z 30. října, než byl pozměněn, stanovil, že žádný cizinec nemůže držet trůn Brazílie. Vylučoval královnu Marii z následnictví a rozdělil dům Bragança na dvě větve—portugalskou a brazilskou.\n\nMůže někdo skutečně tvrdit, že kterékoli Portugalec je cizincem? Ano, prohlásili nacionalisté, kteří ukázali na brazilskou nezávislost, zneužívání portugalských Cortes, na její tvrdě získanou nezávislost. Ne, řekli unionisté, kteří prohlásili univerzálnost portugalské identity a její plurikontinentální historii. Jak by země, která kdysi hostila portugalský dvůr, mohla někdy považovat sama sebe za odlišný národ?"
 lusofonia.1.a: "Držet a vlastnit."
 lusofonia.2.t: "Spojení $POR_ADJ$"
 lusofonia.2.d: "V obavě z republikánské hrozby proti Koruně nabídli agenti [SCOPE.sCountry('portugal_scope').GetName] diplomatickou pomoc na podporu [SCOPE.sCharacter('pedro_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('pedro_scope').GetFullName]."
 lusofonia.2.f: "\"Jsme si dobře vědomi problémů, kterým čelíte,\" řekl muž v panamovém klobouku. \"Brazílie dlouho profitovala z velkorysosti svého císaře, přesto někteří nemají úctu k jeho roli. Touží po monopolu na moc. A co s ní udělají?\n\nÚředník zdvihl kubánskou cigaru k rtům a vydechnul obláček dýmu. Chvíli počkal, než odpověděl. \"Rozdělit zemi, myslím. Předpokládají, že svoboda jednotlivce se nejlépe projeví svobodou provincií.\"\n\nMuž v panamovém klobouku přikývl. \"Vaše slova, ne má. Naše #italic Regeneração#! výrazně rozšířila naše možnosti. Stačí říct slovo a dáme vše, co můžeme.\"\"
 lusofonia.2.a: "Jejich dobrá vůle je nám velmi ceněna."
 lusofonia.2.b: "Stojíme na vlastních zásluhách."
 lusofonia.3.t: "Plurikontinentální"
 lusofonia.3.d: "Prostřednictvím obratné diplomacie jsme získali zpět, co se jevilo jako nenávratně ztracené. [SCOPE.sCountry('portugal_scope').GetName] a [SCOPE.sCountry('brazil_scope').GetName] jsou opět spojeny transoceánským svazkem."
 lusofonia.3.d2: "Prostřednictvím rozhodného projevu síly jsme získali zpět, co se jevilo jako nenávratně ztracené. [SCOPE.sCountry('portugal_scope').GetName] a [SCOPE.sCountry('brazil_scope').GetName] jsou znovu svázány v věčném svazku."
 lusofonia.3.f: "Antônio stál s rukama za zády a sledoval umělce, jak črtá návrh na papír. Hrubé tvary se začaly rozplétat do něčeho detailnějšího—dvě ženy oblečené do vlajek Spojeného království, Jižní kříž na nebi, pár andělských křídel. Když uhel dokončil první tah přes jejich tváře, odkašlal si.\n\n\"Hm?\" zeptal se umělec s upřeným pohledem.\n\n\"Musí se docela líbat tak vášnivě?\" \n\n\"Ano,\" odpověděl umělec. \"Ujišťuji vás, že je to naprosto nezbytné.\""
 lusofonia.3.a: "Nechť naše vazby jsou silnější než kdy dřív."
 lusofonia.3.b: "Naše je Páté impérium, a největší ze všech."
 lusofonia.4.t: "Republika meče"
 lusofonia.4.d: "Na předvečer nástupu [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] na trůn [SCOPE.sCountry('brazil_scope').GetName], [SCOPE.sCountry('brazil_scope').GetAdjectiveNoFormatting] [SCOPE.gsInterestGroup('brz_armed_forces').GetName] učinila pokus o uchopení moci. Vyhlásili Republiku a přísahali bránit zemi proti jakémukoli cizímu vládcovi."
 lusofonia.4.f: "Ambasadorovo obličej se trhl, když četl telegram. Bylo to příliš studené. Krb hřál za růžovým mramorovým ohništěm, ale už ho necítil.\n\n\"Ne tady,\" řekl prázdné místnosti. \"Ne teď. Ne takhle. Bylo to příliš dlouho...\"\n\nChlad nahradilo něco bílého žhavého. Vstal, přešel místnost a otevřel dveře."
 lusofonia.4.a: "Povolat námořního ministra."
 lusofonia.4.b: "Kotvy pryč! Ukončíme to tady a teď."
 lusofonia.4.c: "Udělali jsme, co jsme mohli."
