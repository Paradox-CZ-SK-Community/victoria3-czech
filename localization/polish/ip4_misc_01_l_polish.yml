 iberia.2.t: "Iberské jitro"
 iberia.2.d_1: "Malé národní státy Iberského poloostrova byly poraženy a poloostrov osvobodili sjednocení dělníci [ROOT.GetCountry.GetName]. Od Alenteja po Pyreneje vlaje černá vlajka vysoko a svobodně."
 iberia.2.d_2: "Proletariát Iberského poloostrova se spojil pod jedním [ROOT.GetCountry.GetName]. Poloostrov již nebude rozdělován rozkazy malých králů a generálů."
 iberia.2.d_3: "Opět jsou trůny $SPA$ a $POR$ v rukou jednoho [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]. Tento nový [ROOT.GetCountry.GetName] slibuje nové zlaté období pro poloostrov, větší než kdy předtím."
 iberia.2.d_4: "[ROOT.GetCountry.GetName] přivedl věřící poloostrova do jednoho velkého shromáždění. Od Alenteja po Pyreneje zvuk kostelních zvonů ohlásil nové zlaté období."
 iberia.2.d_5: "Konečně se $SPA$ a $POR$ sjednotily pod jedním [ROOT.GetCountry.GetName]. Od Alenteja po Pyreneje lidé Iberie hledí k novému zlatému věku."
 iberia.2.f: "Když kameny dopadly na hladinu Douro, vychrlily oblak vody, který přemokřil lodníky až na kůži. Mraky bahna a rozvířených ryb se zvedly z říčního dna a obarvily vodu kolem člunu do matně zelenohnědé.\n\nZa týden doufali, že hráz vystoupí o tři metry nad hladinu. Za měsíc k ní přibyly další kusy, každý spojený se svými bratry mřížkou podpěrných trámů. Do konce roku to bude most, jeden z dvanácti nových staveb přemosťujících bývalou hranici. Unaveně, s triumfem, lodníci sledovali kameny usazovat se a zvedli opět své pádla."
 iberia.2.a: "Vztyčíme @ibe_republic_1_flag_small! #tooltippable;tooltip:[GetPlayer.GetTooltipTag],ibe_republic_1_tt vlajka unie#!!"
 iberia.2.b: "Vyvěsme @ibe_republic_2_flag_small! #tooltippable;tooltip:[GetPlayer.GetTooltipTag],ibe_republic_2_tt trikolóra#!!"
 iberia.2.c: "Pozdravujeme @ibe_republic_3_flag_small! #tooltippable;tooltip:[GetPlayer.GetTooltipTag],ibe_republic_3_tt federální vlajka#!!"
 iberia.2.e: "Mír mezi námi, válka tyranům!"
 iberia.2.g: "¡Viva Ibérica!"
 iberia.3.t: "Všichni muži jsou bratři"
 iberia.3.d: "Sjednocením [GetGeographicRegion('geographic_region_iberia_old').GetName] usilujeme o vytvoření nové společnosti na principech proletářského internacionalismu. Konstruovaný jazyk #b $language_esperanto$#!, populární mezi iberskými socialisty, může posloužit jako vhodný mezinárodní administrativní jazyk."
 iberia.3.f: "\"Bude to obtížné,\" začal řečník. \"Budeme muset podniknout velký podnik, abychom jazyk vyučili. Reakcionáři zatvrzele lpí na starých národních jazycích a skrývají se za masami, které se ještě Esperanta nenaučily. Ale Revoluce byla také velký podnik, nebyla? A nezalekli jsme se jí kvůli odporu, který nám stál v cestě. Naléhám na vás, radní, dovolte nám přispět k průběhu Revoluce rozpuštěním staré společnosti. V příštích letech nechť naše děti zopakují — #italic proletoj de la mondo, unuiĝu!#'\""
 iberia.3.a: "Vyhlásit esperanto za úřední jazyk."
 iberia.3.b: "Národní jazyky, buržoazní kultury... to všechno musí pryč."
 iberia.3.c: "Naděje nade vše je to, co nás definuje."
 je_iberia_adopt_esperanto_language: "Přijmout jazyk esperanto"
 je_iberia_adopt_esperanto_language_desc: "Iberské socialistické hnutí má historii zájmu o #b $language_esperanto$#!, konstruovaný jazyk záměrně vytvořený jako mezinárodní pomocný jazyk. Přijetím $language_esperanto$ jako úředního jazyka uděláme velký krok směrem k vytvoření skutečně mezinárodní federace."
 je_iberia_forsake_unification: "Opustit sjednocení"
 je_iberia_forsake_unification_desc: "Sjednocení [GetGeographicRegion('geographic_region_iberia_old').GetName] je ztracená věc. Soustřeďme naše úsilí na záležitosti s větší šancí na úspěch."
