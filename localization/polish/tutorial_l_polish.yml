 je_tutorial_increase_market_access_by_decree_status_second: "Udržujte [GetDecreeType('decree_road_maintenance').GetName] $concept_decree$ ve [SCOPE.sJE('journal_entry').GetTarget.GetState.GetName] po dobu [SCOPE.sJE('journal_entry').CalcCurrentGoalValue|v0]/[SCOPE.sJE('journal_entry').GetTotalGoalValue|v0] týdnů"
