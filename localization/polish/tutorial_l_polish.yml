 TOOLTIPS_EXPLAINER: "Toto je #tooltippable #tooltip:[GetPlayer.GetTooltipTag],NESTED_TOOLTIPS_EXPLAINER tooltip#!#!"
 NESTED_TOOLTIPS_EXPLAINER: "Tooltips obvykle poskytují podrobné informace, které jsou relevantní k tomu, na co míří kurzor, a často obsahují vnořené tooltipy, jako je tento."
