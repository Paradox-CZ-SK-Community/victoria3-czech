 je_tutorial_increase_relations_status: "Zvyšte vztahy z [JournalEntry.CalcCurrentGoalValue] na [JournalEntry.GetTotalGoalValue]"
 je_tutorial_increase_relations_reason: "Vaše schopnost projít bouřlivým 19. stoletím se výrazně zvýší, pokud si udržíte dobré vztahy se zeměmi kolem vás a případně si vytvoříte jednoho nebo dva silné spojence. [GetDiplomaticActionType('increase_relations').GetName] s [JournalEntry.GetTarget.GetCountry.GetAltAdjective('I')] pro vytvoření blížších vazeb mezi vašimi zeměmi, zvýšení pravděpodobnosti, že souhlasí s budoucími [Concept('concept_diplomatic_pact', '$concept_diplomatic_pacts$')] a podporují vás ve [Concept('concept_diplomatic_play', '$concept_diplomatic_plays$')] ." # todo: CONCEPT CASE
 je_tutorial_improve_rank: "Upevnění naší pozice"
 je_tutorial_improve_rank_reason: "Abychom získali uznání na mezinárodní scéně, měli bychom se snažit zvyšovat postavení naší [Concept('concept_country','$concept_country_possessive$')] na světové scéně. Můžeme toho dosáhnout buď zvýšením našeho národního [Concept('concept_prestige','prestiže')], nebo povýšením naší národa na vyšší $concept_country$ [Concept('concept_rank','hodnost')]." # todo: CONCEPT CASE
