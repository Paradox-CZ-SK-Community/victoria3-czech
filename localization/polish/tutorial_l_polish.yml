 je_tutorial_colonize_state: "Kolonizovat stát"
 je_tutorial_colonize_state_reason: "Měli bychom se pokusit rozšířit naši říši do zahraničí tím, že [Concept('concept_colony','$concept_colonizing$')] decentralizovanou [Concept('concept_decentralized_nation','decentralizovaný národ')]."
 je_tutorial_colonize_state_status: "Založte kolonii v [JournalEntry.GetTarget.GetState.GetName]"
 je_tutorial_colonize_state_status_first: "Zahájit [Concept('concept_colony','kolonie')] v vhodné oblasti"
 je_tutorial_colonize_state_status_second: "Pěstujte nebo dobyjte sousední země, dokud nebude [Concept('concept_colony','kolonie')] zahrnovat celý [Concept('concept_state_region','státní oblast')]"
 je_tutorial_colonize_state_grow_a_colony: "Úplně [Concept('concept_colony','$concept_colonized$')] [Concept('concept_state_region','státní oblast')]"
 je_tutorial_make_peace: "Uzavřít mír"
 je_tutorial_make_peace_reason: "Všechny války nakonec skončí. Měli bychom se snažit zajistit, abychom z tohoto konfliktu získali co nejvíce. Je důležité si pamatovat, že někdy je lepší nezískat nic, než ztratit vše."
 je_tutorial_make_peace_status: "Ukončit probíhající válku"
 je_tutorial_research_technology: "Prozkoumejte technologii"
 je_tutorial_research_technology_reason: "Měli bychom vybrat [Concept('concept_technology','technologie')], kterou budeme zkoumat, aby co nejlépe vyhovovala našim potřebám pro budoucnost. Je lepší nespadnout za ostatními v této nové éře."
 je_tutorial_research_technology_status_not_progressing: "Vyberte $concept_technology$ k prozkoumání"
 je_tutorial_research_technology_status_progressing: "Dokončete výzkum [GetPlayer.GetCurrentlyResearchedTechnology.GetName]"
 je_tutorial_research_technology_complete_trigger: "Vyberte $concept_technology$ k prozkoumání a dokončete výzkum"
 suppress_localization_errors: "#debug custom_tooltip použit na vyvolání, které není pro hráče viditelné, měly by být nikdy viditelné pro hráče"
 tut_customs_union_block_txt: "Nelze vytvořit/zúčastnit se celních unií před dokončením #b Zlepšit přístup k spotřebním statkům#!."
 je_tutorial_create_formation: "Vytvořit formaci"
 je_tutorial_create_formation_status: "Vytvořte novou [Concept('concept_army','$concept_army_long$')]"
 je_tutorial_create_formation_reason: "[Concept('concept_army','Armáda')] je páteří naší moci. Vytváření nových $concept_armies$ je nezbytné nejen pro udržení bezpečnosti našich hranic, ale také pro zvýšení našeho vlivu. Mít více $concept_armies$ pod velením také zvýší flexibilitu našich nasazení a umožní [Concept('concept_unit','$concept_units$')] bránit naše potenciálně rozptýlené území."
 lesson_create_formation_how_1: "Jak vytvořit novou formaci"
 lesson_create_formation_how_1_desc: "Formace je shromáždění vojenských jednotek a velitelů, které můžete ovládat a směřovat na místa. Mít více armád je dobré pro flexibilitu nasazení správného množství [Concept('concept_unit','$concept_units$')] potřebného v určitém konfliktu."
 lesson_create_formation_how_1_continue: "Otevřete vojenský panel"
 lesson_create_formation_how_2: "$lesson_create_formation_how_1$"
 lesson_create_formation_how_2_desc: "Zde na vojenském panelu můžete vidět svůj celkový počet [Concept('concept_unit','$concept_units$')], schopnost mobilizovat všechny $concept_units$ a vaše aktuální formace spolu s jejich $concept_units$ a velitelé.\n\nNa spodní části panelu vidíte tlačítko Vytvořit armádu."
 lesson_create_formation_how_2_continue: "Klikněte na vytvořit armádu"
 lesson_create_formation_how_2_back: "Zavřete vojenský panel"
 lesson_create_formation_how_3: "$lesson_create_formation_how_1$"
 lesson_create_formation_how_3_desc: "Nyní můžete kliknout na [Concept('concept_strategic_region','strategický region')], v němž by se tato armáda měla formovat. Vytvoření armády v tomto $concept_strategic_region$ neomezuje vás pouze na nábor jednotek v uvedeném $concept_strategic_region$.\n\nUpozorňujeme, že tuto armádu přesunete do jiného $concept_strategic_region$ poté, co byla vytvořena."
 lesson_create_formation_how_3_continue: "Vyberte si $concept_strategic_region$, abyste vytvořili armádu"
 lesson_create_formation_how_3_back: "Vraťte se na vojenskou záložku"
 lesson_create_formation_how_4: "$lesson_create_formation_how_1$"
 lesson_create_formation_how_4_desc: "Gratulujeme, vytvořili jste novou armádu!\n\nNásledující položky vám poskytnou více informací o tom, jak najímat [Concept('concept_unit','$concept_units$')] a organizovat vaši novou armádu."
 je_tutorial_create_formation_complete_trigger: "Postupujte podle kroků a vytvořte novou [Concept('concept_army','armádu')]" # todo: CONCEPT CASE
 je_tutorial_establish_company: "Založit společnost"
 je_tutorial_establish_company_status: "Založit [Concept('concept_company','společnost')]"
 je_tutorial_establish_company_reason: "S rozsáhlými a [Concept('concept_productivity', '$concept_productive$')] [Concept('concept_building', '$concept_buildings$')] se můžeme pokusit zvýšit jejich [Concept('concept_throughput','efektivita')]. Získání $concept_company$ k řízení našich odvětví pomůže zlepšit jejich účinnost. Tyto $concept_companies$ zlepšují všechna ovlivněná $concept_buildings$."
 lesson_establish_company_how_1: "Jak založit společnost"
 lesson_establish_company_how_1_desc: "Společnosti jsou způsobem, jak zvýšit efektivitu skupiny [Concept('concept_building','$concept_buildings$')], které s nimi souvisejí. Odměny za založení [Concept('concept_company','společnost')] jsou okamžité a zvýší [Concept('concept_throughput','efektivita')] a efektivitu konstrukce na všech budovách spojovaných se společností.\n\nUdržování produktivních budov také umožní získat dodatečné bonusy prostřednictvím [Concept('concept_prosperity','prosperity')] bonusů." # todo: CONCEPT CASE
 lesson_establish_company_how_1_continue: "Otevřete záložku společnosti"
 lesson_establish_company_how_2: "$lesson_establish_company_how_1$"
 lesson_establish_company_how_2_desc: "Na této záložce můžete vidět všechny vaše dostupné, dosažitelné a potenciální [Concept('concept_company','$concept_companies$')].\n- #b Dostupné společnosti#! jsou společnosti, které můžete nyní založit.\n- #b Dosažitelné společnosti#! jsou společnosti, které lze dosáhnout s určitou námahou, ale chybí dodatečné požadavky.\n- #b Potenciální společnosti#! jsou všechny ostatní společnosti, které můžete založit. Některé z nich vyžadují značné úsilí, jako je dobytí jiného [Concept('concept_state','státu')].\n\nPodívejte se na požadavky pro společnost, která vás zajímá, a splňte je. Poté založte společnost." # todo: CONCEPT CASE
 lesson_establish_company_how_2_continue: "Založte dostupnou společnost"
 lesson_establish_company_how_2_back: "Zavřete záložku společností"
 lesson_establish_company_how_3: "$lesson_establish_company_how_1$"
 lesson_establish_company_how_3_desc: "Vaše [Concept('concept_company','společnost')] byla nyní založena a bonusy byly aplikovány na jejich spojené [Concept('concept_building','$concept_buildings$')]. Určitě se vraťte k obrazovce společností, abyste zkontrolovali [Concept('concept_prosperity','prosperita')] vašich společnosti, abyste dosáhli dalších bonusů."
 lesson_establish_company_how_3_back: "Vrátit se na záložku společnosti"
 je_subject_liberty: "Podřízenost $concept_liberty_desire$"
 je_subject_liberty_status: "Snížit [JournalEntry.GetTarget.GetCountry.GetNameNoFlag][Concept('concept_liberty_desire','touha po svobodě')]"
 je_subject_liberty_reason: "Váš [Concept('concept_subject','závislá země')] [JournalEntry.GetTarget.GetCountry.GetNameNoFlag] se blíží nebezpečné úrovni [Concept('concept_liberty_desire','touhy po svobodě')]. Jakmile dosáhne konečné úrovně, může se pokusit zvýšit svou [Concept('concept_autonomy','autonomii')] nebo dokonce se pokusit o nezávislost. Riskujeme, že ztratíme kontrolu nad nimi, pokud se to posune dál." # todo: CONCEPT CASE
 lesson_subject_liberty_how_1: "Interakce s $concept_subject$"
 lesson_subject_liberty_how_1_desc: "Můžete si prohlédnout přehled vašich [Concept('concept_subject', '$concept_subjects$')] v"
 lesson_subject_liberty_how_1_continue: "Otevřete záložku #b $concept_subjects$#! na panelu #b Diplomacie#!"
 lesson_subject_liberty_how_2: "$lesson_subject_liberty_how_1$"
 lesson_subject_liberty_how_2_desc: "Zde můžete vidět vaše různé [Concept('concept_subject', '$concept_subjects$')], jejich [Concept('concept_liberty_desire','touha po svobodě')] a vaše dostupné [Concept('concept_overlord_action', '$concept_overlord_actions$')].\n\nPod jménem vašeho $concept_subject$ a [Concept('concept_subject_type','typ závislé země')] je bar [$concept_liberty_desire$]. Tento bar ukazuje jejich aktuální úroveň [Concept('concept_liberty_desire','touha po svobodě')]. Můžete k každé části baru přejíždět, abyste viděli účinky každé úrovně. Rozsah se pohybuje od #g Pozitivní#! - žádný - #r Negativní#! účinky na generaci [Concept('concept_radical','$concept_radicals$')] a [Concept('concept_loyalist','$concept_loyalists$')] v $concept_subject$ [Concept('concept_country','země')]."
 lesson_subject_liberty_how_2_back: "Zavřete záložku #b Předměty#!, abyste se vrátili"
 lesson_subject_liberty_how_3: "$lesson_subject_liberty_how_1$"
 lesson_subject_liberty_how_3_desc: "Na pravé stránce najdete tlačítko pro otevření a zobrazení vašich dostupných [Concept('concept_overlord_action', '$concept_overlord_actions$')]. Tyto mohou být použity k přizpůsobení a nastavení očekávání pro vaše [Concept('concept_subject', '$concept_subjects$')]. Pokud najíždíte na jednotlivé akce a zkontrolujete účinky, mějte na paměti, že mnohé z těchto akcí ovlivňují [Concept('concept_subject_possessive','závislé země')] [Concept('concept_liberty_desire','touhy po svobodě')] buď přímo tím, že určují určitou částku, nebo nepřímo tím, že zvyšují nebo snižují týdenní zisk/ztrátu." # todo: CONCEPT CASE
 lesson_subject_liberty_how_4: "$lesson_subject_liberty_how_1$"
 lesson_subject_liberty_how_4_desc: "[Concept('concept_overlord_action', '$concept_overlord_actions$')] nejsou jediným způsobem, jak změnit [Concept('concept_liberty_desire','touha po svobodě')] [Concept('concept_subject','závislá země')].\n\n$concept_liberty_desire$ je také ovlivňováno následujícími:\n - [Concept('concept_relations','vztahy')]: Podpora vztahů mezi $concept_subject$ a $concept_overlord$\n - [Concept('concept_economic_dependence','Ekonomická závislost')]: Dopad na jejich ekonomiku.\n - [Concept('concept_prestige','prestiž')]: Rozdíl v $concept_prestige$, vyšší rozdíl znamená nižší $concept_liberty_desire$ pro $concept_subject$.\n - $concept_subject$ [Concept('concept_political_lobby', '$concept_political_lobbies_short$')]: Směrem k jejich [Concept('concept_overlord','vládce')].\n\nJe vždy důležité dávat pozor na své $concept_subjects$ a jejich $concept_liberty_desire$." # todo: CONCEPT CASE
 lesson_subject_liberty_how_5: "$lesson_subject_liberty_how_1$"
 lesson_subject_liberty_how_5_desc: "Když úroveň [Concept('concept_liberty_desire','touha po svobodě')] dosáhne dostatečně vysoké nebo nízké hodnoty pro jednu z vašich [Concept('concept_subject', '$concept_subjects$')], máte možnost [GetDiplomaticActionType('da_decrease_autonomy').GetName] nebo [GetDiplomaticActionType('da_increase_autonomy_of_subject').GetName] pomocí tlačítek na obou stranách lišty, které buď sníží, nebo zvýší množství kontroly, kterou máte nad $concept_subject$. Můžete vidět, co každý [Concept('concept_subject_type','typ závislé země')] vede k zvýšení nebo snížení autonomie v #b Tabulce typů subjektů#!.\n\nToto může být užitečné, pokud můžete obětovat [Concept('concept_autonomy','autonomie')] za nižší $concept_liberty_desire$, nebo pokud chcete učinit kroky směrem k anexi $concept_subject$."
 lesson_subject_liberty_why_1: "Proč snížit $concept_liberty_desire$"
 lesson_subject_liberty_why_1_desc: "Největším rizikem vysoké úrovně [Concept('concept_liberty_desire','touhy po svobodě')] je šance, že se váš [Concept('concept_subject','závislá země')] pokusí zahájit [Concept('concept_diplomatic_play','diplomatická hra')] o nezávislost a vzbouřit se proti vám.\n\n$concept_subject$ se může pokusit o [Concept('concept_diplomatic_play','diplomatickou hru')] o nezávislost, pokud je [Concept('concept_liberty_desire','touha po svobodě')] " # todo: CONCEPT CASE
 lesson_subject_liberty_why_1_continue: "Otevřete"
 lesson_subject_liberty_why_2: "$lesson_subject_liberty_why_1$"
 lesson_subject_liberty_why_2_desc: "Dále $concept_subject$, který má vysokou [Concept('concept_liberty_desire','touhu po svobodě')], odemkne možnosti zvýšit jejich [Concept('concept_autonomy','autonomie')]. $concept_subject$ se zvýšenou [Concept('concept_autonomy','autonomií')] zaplatí méně tributů své [Concept('concept_overlord','vládce')].\n\nBuďte opatrní, když odmítáte žádosti o [Concept('concept_autonomy','autonomii')], protože to obvykle bývá prvním krokem k [GetDiplomaticPlayType('dp_independence').GetName] [Concept('concept_diplomatic_play','diplomatické hře')]." # todo: CONCEPT CASE
 lesson_subject_liberty_why_2_back: "Zavřete"
 lesson_subject_liberty_why_3: "$lesson_subject_liberty_why_1$"
 lesson_subject_liberty_why_3_desc: "[Concept('concept_subject','$concept_subjects$')] s vysokou úrovní [Concept('concept_liberty_desire','touhy po svobodě')] mohou potenciálně blokovat určité [Concept('concept_overlord_action', '$concept_overlord_actions$')], které by byly obvykle dostupné, pokud by [Concept('concept_liberty_desire','touha po svobodě')] bylo nižší." # todo: CONCEPT CASE
 je_tutorial_form_power_bloc: "Vytvořit mocenský blok"
 je_tutorial_form_power_bloc_status: "Stát se [Concept('concept_power_bloc_leader','lídrem mocenského bloku')]" # todo: CONCEPT CASE
 je_tutorial_form_power_bloc_reason: "Jako velká mocnost musíme ukázat sílu. Ostatní velké mocnosti jsou [Concept('concept_power_bloc_leader','$concept_power_bloc_leaders$')]. Měli bychom usilovat o vytvoření naší vlastní sféry vlivu, pokud doufáme, že budeme soupeřit s ostatními. Vytvoření $concept_power_bloc$ nám umožní udržovat těsnější kontrolu nad [Concept('concept_country','$concept_countries$')], nad kterými chceme udržet vliv."
 lesson_form_power_bloc_how_1: "Vytváření $concept_power_bloc$"
 lesson_form_power_bloc_how_1_desc: "Vytvoření [Concept('concept_power_bloc','mocenský blok')] vám umožňuje vytvořit skupinu [Concept('concept_country', '$concept_countries$')], které mohou spolupracovat na zlepšení své situace.\n\nMůžete si prohlédnout detaily o všech již existujících $concept_power_blocs$ na "
 lesson_form_power_bloc_how_1_continue: "Otevřete "
 lesson_form_power_bloc_how_2: "$lesson_form_power_bloc_how_1$"
 lesson_form_power_bloc_how_2_desc: "Zde si můžete přizpůsobit svůj vlastní [Concept('concept_power_bloc','mocenský blok')].\n\nPovinné věci k výběru:\n - Název pro váš $concept_power_bloc$\n - [Concept('concept_power_bloc_identity','identita mocenského bloku')]\n - [Concept('concept_power_bloc_principle','princíp')] z [Concept('concept_power_bloc_primary_principle_group','primární principiální skupiny')]\n\n$concept_power_bloc_identity$ je hlavní vodítko pro to, jak váš $concept_power_bloc$ bude fungovat, ale $concept_power_bloc_principles$ jsou tím, co bude definovat váš $concept_power_bloc$ v průběhu času, jak získáváte [Concept('concept_power_bloc_mandate','$concept_power_bloc_mandates$')] pro nové a vylepšené verze.\n\nPokud jste spokojeni s názvem vašeho $concept_power_bloc$ a $concept_power_bloc_identity$, zbývá vám jen vybrat váš počáteční $concept_power_bloc_principle$." # todo: CONCEPT CASE
 lesson_form_power_bloc_how_2_continue: "Klikněte "
 lesson_form_power_bloc_how_2_back: "Zavřete "
 lesson_form_power_bloc_how_3: "$lesson_form_power_bloc_how_1$"
 lesson_form_power_bloc_how_3_desc: "$concept_power_bloc_principles$ jsou vaším způsobem, jak přizpůsobit váš [Concept('concept_power_bloc','mocenský blok')] do jeho jedinečné entity. Když však začínáte $concept_power_bloc$, musíte vybrat [Concept('concept_power_bloc_principle','princíp')] z [Concept('concept_power_bloc_primary_principle_group','primární principiální skupiny')]. $concept_power_bloc_primary_principle_group$ závisí na [Concept('concept_power_bloc_identity','identitě mocenského bloku')] vašeho bloku.\n\nChcete-li získat více principů, potřebujete [Concept('concept_power_bloc_mandate', '$concept_power_bloc_mandates$')]. $concept_power_bloc_mandates$ se hromadí v průběhu času a obvykle je můžete rychleji získat pozváním více členů do vašeho mocenského bloku." # todo: CONCEPT CASE
 lesson_form_power_bloc_how_3_continue: "Vyberte jakýkoli z dostupných $concept_power_bloc_principles$ a poté"
 lesson_form_power_bloc_how_3_back: "Zavřete okno výběru principů, abyste se vrátili."
 lesson_form_power_bloc_how_4: "$lesson_form_power_bloc_how_1$"
 lesson_form_power_bloc_how_4_desc: "Teď už stačí kliknout na tlačítko #b $FORM_POWER_BLOC$#! a váš [Concept('concept_power_bloc','mocenský blok')] bude vytvořen! Ujistěte se, že pozvete více [Concept('concept_country','$concept_countries$')] do vašeho nově vytvořeného $concept_power_bloc$, jakmile budete mít dostatek [Concept('concept_power_bloc_leverage_advantage','páková výhoda')] nad nimi."
 lesson_form_power_bloc_why_1: "Proč tvořit mocenský blok"
 lesson_form_power_bloc_why_1_desc: "Vytvoření [Concept('concept_power_bloc','mocenský blok')] vám umožňuje mít přístup k novému způsobu interakcí s jinými [Concept('concept_country','$concept_countries$')], o které můžete mít zájem, a to buď pro [Concept('concept_alliance','$concept_alliances$')], nebo jen pro udržení blízkých vztahů pro pozdější dobu. Vytvoření $concept_power_bloc$ a získání [Concept('concept_power_bloc_mandate','$concept_power_bloc_mandates$')] může být použito k odemknutí dalších bonusů pro [Concept('concept_power_bloc_member','$concept_power_bloc_members_short$')]."
 lesson_form_power_bloc_why_2: "$lesson_form_power_bloc_why_1$"
 lesson_form_power_bloc_why_2_desc: "Vytvoření [Concept('concept_power_bloc','mocenský blok')] otevře přístup k [Concept('concept_power_bloc_principle','$concept_power_bloc_principles$')]. $concept_power_bloc_principles$ jsou způsobem, jak může [Concept('concept_country','země')] přizpůsobit svůj Bloc, aby lépe odpovídal potřebám skupiny [Concept('concept_countries','země')] nebo co by mohli chtít zkusit dosáhnout.\n\n$concept_power_bloc_principles$ jsou rozděleny do [Concept('concept_power_bloc_principle_group','$concept_power_bloc_principle_groups$')] a skupina má tři úrovně. Každá úroveň poskytuje nový efekt, ale zvýšení úrovně [Concept('concept_power_bloc_principle_group','skupiny principů')] bude stát další $concept_power_bloc_mandate$." # todo: CONCEPT CASE
 lesson_form_power_bloc_why_3: "$lesson_form_power_bloc_why_1$"
 lesson_form_power_bloc_why_3_desc: "Mít jiné [Concept('concept_country', 'země')] uvnitř vašeho [Concept('concept_power_bloc','mocenského nloku')] může umožnit určitý stupeň kontroly nad nimi. [Concept('concept_power_bloc_member', '$concept_power_bloc_members_short$')] mohou být integrováni do [Concept('concept_customs_union','celní unie')], což umožní otevřenější přístup k zboží.\n\nPokud nechcete mít všechny členy bloku v celní unií, můžete jednomu nebo několika členům bloku umožnit, aby si udrželi svůj vlastní trh, přičemž stále zůstávají v bloku. To může být užitečné, pokud nejsou přímo spojeni s vaší země, a pokud nemáte požadované [GetGoods('merchant_marine').GetName|l] pro udržení obchodu."
 lesson_form_power_bloc_why_4: "$lesson_form_power_bloc_why_1$"
 lesson_form_power_bloc_why_4_desc: "Hlavním argumentem pro vytvoření [Concept('concept_power_bloc','mocenský blok')] je schopnost zabezpečit [Concept('concept_country', '$concept_countries$')] se kterými byste jinak nemuseli mít diplomatický [Concept('concept_influence','vliv')], zatímco je také udržujete mimo ostatní $concept_power_blocs$.\n\nPřidání více $concept_countries$ do vašeho $concept_power_bloc$ bude vyžadovat [Concept('concept_power_bloc_leverage','páka')] a sníží vaši [Concept('concept_power_bloc_possessive','mocenské bloky')] [Concept('concept_power_bloc_cohesion','soudržnost')]." # todo: CONCEPT CASE
 je_tutorial_foreign_investment: "Zvýšit naše $concept_foreign_investment$"
 je_tutorial_foreign_investment_status: "Vybudujte [JournalEntry.GetTarget.GetCountry.GetNameNoFlag]"
 je_tutorial_foreign_investment_reason: "Národ [JournalEntry.GetTarget.GetCountry.GetName] v současnosti umožňuje, abychom stavěli ve své [Concept('concept_country','zemi')]. Měli bychom toho využít expanzí [Concept('concept_building', '$concept_buildings$')], které mohou posílit jak ekonomiku $concept_countries_possessive$." # todo: CONCEPT CASE
 lesson_foreign_investmen_why_1: "Proč investovat do zahraničního $concept_country$"
 lesson_foreign_investmen_why_1_desc: "Mít možnost rozšířit [Concept('concept_building','$concept_buildings$')] v jiné [Concept('concept_country','zemi')] může být nesmírně užitečné pro zlepšení vaší ekonomické situace. Například můžete stavět v $concept_country$, které má přístup k [Concept('concept_good', '$concept_goods$')] momentálně nedostupným pro vás. Kromě toho můžete pomoci industrializovat $concept_countries$, které mohou mít mnoho [GetPopType('peasants').GetName] ale žádné stavební schopnosti využít tyto velké počty [Concept('concept_pop','$concept_pops$')]." # todo: CONCEPT CASE
 lesson_foreign_investmen_why_2: "$lesson_foreign_investmen_why_1$"
 lesson_foreign_investmen_why_2_desc: "Potenciál rozšířit [Concept('concept_building','$concept_buildings$')] v jiných [Concept('concept_country','$concept_countries$')] může snížit vaši závislost na jiných $concept_countries$, které nemusí být v budoucnu s vámi sladěny. Schopnost efektivně budovat vlastní [Concept('concept_trade_capacity','obchodní kapacitu')] může umožnit rozšíření průmyslu ve vaší domovině." # todo: CONCEPT CASE
 lesson_foreign_investmen_why_3: "$lesson_foreign_investmen_why_1$"
 lesson_foreign_investmen_why_3_desc: "Dalším důvodem investovat do jiné [Concept('concept_country','země')] by mohlo být, že tato $concept_country$ není schopna rychle expandovat sama. Tato [Concept('concept_country','země')] nemusí mít schopnost rozvíjet svou ekonomiku kvůli absenci [GetBuildingType('building_construction_sector').GetName] [Concept('concept_building', '$concept_buildings$')]. Tím byste nejen umožnili potenciální začlenění jejich zdrojů do vaší ekonomiky, ale také rozvoj jejich ekonomiky a využití jich [Concept('concept_pop','$concept_pops$')]. V rámci [Concept('concept_subject','závislé země')] to povede k silnější [Concept('concept_army','armádě')], zvýšení tributu a větší možnosti soukromé investice vašich $concept_pops$." # todo: CONCEPT CASE
 je_tutorial_lobbies: "Lobby $concept_political_lobby_appeasement$"
 je_tutorial_lobbies_status: "Zvyšte [Concept('concept_political_lobby','politické lobby')] [Concept('concept_political_lobby_appeasement','vyhovění')]"
 je_tutorial_lobbies_reason: "Jedna z našich [Concept('concept_interest_group','$concept_interest_groups$')] začala [Concept('concept_political_lobby','politické lobby')] cílenou na [SCOPE.sPL('target').GetTargetCountry.GetName]. $concept_political_lobby_appeasing$ našim $concept_interest_groups$ jim poskytne více [Concept('concept_approval','spokojenost')] pro použití při schvalování nových [Concept('concept_law', '$concept_laws$')] a potenciálně odemkne více [Concept('concept_interest_group_trait', '$concept_interest_group_traits$')]."
 je_tutorial_lobbies_goal: "Zvyšte [SCOPE.sPL('target').GetName] $concept_political_lobby_appeasement$ na [JournalEntry.GetTotalGoalValue|v0] (aktuálně úroveň [JournalEntry.CalcCurrentGoalValue|v0])"
 lesson_lobbies_how_1: "Jak $concept_political_lobby_appease$ $concept_political_lobby$"
 lesson_lobbies_how_1_desc: "[Concept('concept_political_lobby', '$concept_political_lobbies$')] jsou způsobem, jak vaši [Concept('concept_interest_group', '$concept_interest_groups$')] vyjadřují svůj názor na diplomatické [Concept('concept_relations','vztahy')] vaší [Concept('concept_country','země')]. Můžete vidět seznam aktivních $concept_political_lobbies_short$ v přehledu na pravé straně obrazovky a v " # todo: CONCEPT CASE
 lesson_lobbies_how_1_continue: "Otevřete panel pro [GetTutorialJournalEntry.GetTarget.GetPoliticalLobby.GetName] [concept_political_lobby]."
 lesson_lobbies_how_2: "$lesson_lobbies_how_1$"
 lesson_lobbies_how_2_desc: "Zde vidíte seznam aktivních [Concept('concept_political_lobby','$concept_political_lobbies_short$')] a [Concept('concept_interest_group','$concept_interest_groups$')] které je podporují. Je také viditelná aktuální úroveň $concept_political_lobby_appeasement$."
 lesson_lobbies_how_2_back: "Zavřete panel #b $POLITICS$#!, aby se vrátil."
 lesson_lobbies_how_2_continue: "Otevřete panel pro [GetTutorialJournalEntry.GetTarget.GetPoliticalLobby.GetName] [concept_political_lobby]."
 lesson_lobbies_how_3: "$lesson_lobbies_how_1$"
 lesson_lobbies_how_3_desc: "Toto je panel [Concept('concept_political_lobby','politické lobby')]. Zde můžete vidět všechny detaily toho, kdo podporuje $concept_political_lobby_short$ a jak jej dále ovlivnit.\nNa vrcholu můžete vidět Bar [Concept('concept_political_lobby_appeasement','vyhovění')], [Concept('concept_interest_group','$concept_interest_groups$')] podporující tuto $concept_political_lobby_short$ a kombinovaný [Concept('concept_clout','politický vliv')] $concept_interest_groups$.\n\nBar [Concept('concept_political_lobby_appeasement','vyhovění')] ukazuje úroveň $concept_political_lobby_appeasement$ z dodržování požadavků vašich $concept_interest_groups$. Čím více zvýšíte $concept_political_lobby_appeasement$, tím více [Concept('concept_approval','spokojenost')] získají podporující $concept_interest_groups$."
 lesson_lobbies_how_3_back: "Zavřete panel [GetTutorialJournalEntry.GetTarget.GetPoliticalLobby.GetName] [Concept('concept_political_lobby','politické lobby')], abyste se vrátili."
 lesson_lobbies_how_4: "$lesson_lobbies_how_1$"
 lesson_lobbies_how_4_desc: "Pod tím máte podporující [Concept('concept_interest_group','$concept_interest_groups$')] [Concept('concept_political_lobby','$concept_political_lobby_short$')], a [Concept('concept_clout','politický vliv')] $concept_political_lobby_short$. $concept_political_lobby_short_possessive$ $concept_clout$ je určeno z kombinované hodnoty $concept_clout$ všech podporujících $concept_interest_groups$. Tato $concept_clout$ hodnota ovlivňuje náklady na [Concept('concept_influence','vliv')] [Concept('concept_diplomatic_pact','$concept_diplomatic_pacts$')] s cílovým [Concept('concept_country','zemí')] $concept_political_lobby$." # todo: CONCEPT CASE
 lesson_lobbies_how_5: "$lesson_lobbies_how_1$"
 lesson_lobbies_5_how_desc: "Nakonec v dolní části záložky jsou způsoby, jak zvyšovat nebo snižovat [Concept('concept_political_lobby_appeasement','vyhovění')]. Splnění kterékoliv z podmínek v kategorii zvýšení uvedených níže posílí $concept_political_lobby_appeasement$ a zvýší [Concept('concept_interest_group','zájmová skupina')] [Concept('concept_approval','spokojenost')], zatímco cokoliv v dolní kategorii sníží $concept_political_lobby_appeasement$."
