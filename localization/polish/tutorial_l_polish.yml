 je_tutorial_increase_immigration_reason: "Rozvoj v [JournalEntry.GetTarget.GetState.GetName] vyvíjí tlak na místní pracovní sílu. Je zde dostatek dostupné pracovní síly jinde v [JournalEntry.GetCountry.GetCapital.GetMarket.GetAltAdjective('L')]. Podporování [Concept('concept_migration','migrace')] do [JournalEntry.GetTarget.GetState.GetName] by nám mohlo pomoci v této záležitosti." # todo: CONCEPT CASE
