 je_tutorial_enact_institution_law_reason: "V naší [Concept('concept_bureaucracy','byrokracii')] je přebytek. Měli bychom se zaměřit na schválení zákona, který nám umožní investovat tento přebytek zpět do našich [Concept('concept_pop', '$concept_pops$')]." # todo: CONCEPT CASE
 je_tutorial_reform_government: "Reformujte vládu"
 je_tutorial_reform_government_status: "Aktuální $concept_government$ $concept_legitimacy$: [JournalEntry.CalcCurrentGoalValue]"
 je_tutorial_reform_government_reason: "Naše $concept_legitimacy$ klesá na nízkou úroveň. Pokud bude i nadále klesat, bude pro nás stále obtížnější schválit nové [Concept('concept_law','$concept_laws$')]. Můžeme tento problém vyřešit pomocí [Concept('concept_government_reform', '$concept_government_reform_short$')] na naši [Concept('concept_government','vládu')]." # todo: CONCEPT CASE
 je_tutorial_increase_relations: "Zvýšit vztahy"
