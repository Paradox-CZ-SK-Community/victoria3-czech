 je_tutorial_incorporate_state: "Inkorporovat stát"
 je_tutorial_incorporate_state_reason: "V současnosti [SelectLocalization(GreaterThan_int32(GetPlayer.GetNumStatesThatCanBeIncorporated, '(int32)1'), 'jsou','je')] [GetPlayer.GetNumStatesThatCanBeIncorporated] [Concept('concept_unincorporated_state', '$concept_unincorporated_states$')] které mohou být [Concept('concept_incorporated_state', '$concept_incorporated$')] v [GetPlayer.GetNameNoFlag]. [Concept('concept_incorporated_state', '$concept_incorporating$')] [Concept('concept_state','stát')] zvýší vaše [Concept('concept_taxes', '$concept_tax$')] příjmy a usnadní vám správu."
 je_tutorial_incorporate_state_status: "Nařídit $concept_incorporation$ dalšího $concept_state$"
 je_tutorial_incorporate_state_status_progressing: "Počkejte, až se dokončí $concept_incorporation$"
