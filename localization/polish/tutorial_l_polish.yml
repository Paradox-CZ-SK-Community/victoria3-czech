 je_tutorial_grow_gdp_reason: "Toto je otevřený úkol, který využívá vše, co jste se naučili o [Concept('concept_building', '$concept_buildings$')], [Concept('concept_market', '$concept_markets$')] a [Concept('concept_trade','obchod')] pro růst [Concept('concept_gdp','hrubý domácí produkt')] vaší země.\n\nVýstavba $concept_buildings$, růst vaší [Concept('concept_pop','$concept_population$')], úpravy [Concept('concept_production_method', '$concept_production_methods$')] a manipulace s cenami $concept_market$ jsou potenciální způsoby, jak zvýšit váš $concept_gdp$."
