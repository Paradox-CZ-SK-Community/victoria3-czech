 je_tutorial_improve_supply_network: "Zlepšit dodavatelskou síť"
 je_tutorial_improve_supply_network_reason: "Naše [Concept('concept_supply_network','zásobovací síť')] začíná být přetížena. Měli bychom se pokusit tento problém vyřešit dříve, než se to stane větším problémem a začne ovlivňovat náš [Concept('concept_trade','obchod')] [Concept('concept_treaty', '$concept_treaties$')] nebo [Concept('concept_market_access','přístup na trh')] a válečné úsilí [Concept('concept_supply','zásobování')] v zahraničí."
 je_tutorial_improve_consumer_goods_access: "Zlepšit přístup k spotřebnímu zboží"
 je_tutorial_improve_consumer_goods_access_reason: "Mnozí z vašich [Concept('concept_pop', '$concept_pops$')] ve [JournalEntry.GetTarget.GetStateGoods.GetState.GetName] hlásí, že mají obtíže s přístupem k [JournalEntry.GetTarget.GetStateGoods.GetGoods.GetName]. Zmírnění těchto potíží pro vaše $concept_pops$ zvýší [Concept('concept_sol','životní standard')] a pomůže vybudovat [Concept('concept_loyalist','$concept_loyalty$')]."
 je_tutorial_make_interest_group_happy: "Udělej zájmové skupině radost"
 je_tutorial_make_interest_group_happy_reason: "[JournalEntry.GetTarget.GetInterestGroup.GetName] se zdají mít nízkou [Concept('concept_approval','spokojenost')|l] vůči naší [Concept('concept_government','vládě')|l]. Měli bychom je udržet spokojené, abychom předešli možnosti, že se stanou [Concept('concept_radicalized_interest_group','radikalizoványmi')] a obrátí se proti nám." # todo: CONCEPT CASE
 je_tutorial_enact_institution_law: "Schvalování institucionálního zákona"
