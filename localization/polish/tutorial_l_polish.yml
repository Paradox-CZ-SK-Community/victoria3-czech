 je_tutorial_capacity_deficit_reason: "Nadměrné využívání [Concept('concept_capacity', '$concept_capacities$')] vaší země způsobuje vážné tresty. Vyřešte tento problém co nejdříve, buď zvýšením vaší výroby, nebo snížením vašeho využití."
