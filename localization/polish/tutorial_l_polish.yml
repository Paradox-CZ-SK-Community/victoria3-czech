 je_tutorial_invest_into_an_institution: "Investovat do instituce"
 je_tutorial_invest_into_an_institution_reason: "Můžete zvýšit svou investici do [JournalEntry.GetTarget.GetInstitution.GetName] [Concept('concept_institution','instituce')], abyste zvýšili jeho vliv na vaši populaci." # todo: CONCEPT CASE
