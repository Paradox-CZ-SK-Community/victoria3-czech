 je_tutorial_declare_an_interest: "Deklarovat zájem"
 je_tutorial_declare_an_interest_reason: "Abychom rozšířili svůj vliv za naše hranice, měli bychom prozkoumat možnost deklarovat [Concept('concept_interest','zájem')] na [Concept('concept_strategic_region','strategický region')], ve které leží hlavní město jiné země. \nDeklarujte $concept_interest$ na $concept_strategic_region$, kde se nachází [SCOPE.sC('target').GetCapital.GetName] hlavní město [SCOPE.sC('target').GetName] a čekejte, až se aktivuje."
