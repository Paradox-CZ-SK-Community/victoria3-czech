 lesson_basics_camera: "Kamera ($lesson_basics$)"
 lesson_basics_camera_keys: "Použijte klávesy"
 lesson_basics_camera_scroll_wheel: "Použijte #v Scroll Wheel#! pro přiblížení a oddálení, nebo držte, abyste mohli panovat po mapě."
 lesson_basics_camera_map: "Můžete také pohybovat mapou posunutím kurzoru na okraj obrazovky."
 lesson_basics_camera_tab: "Držením"
 lesson_basics_camera_desc: "Použijte klávesy #v W#!, #v A#!, #v S#!, a #v D#! pro prohlížení mapy. Také můžete panovat mapu pohybováním kurzoru k okraji obrazovky, nebo držet kolečko myši/middle mouse button při pohybu myší.\n\nPoužijte #v Scroll Wheel#! pro přiblížení a oddálení.\n\nDržením #v Tab#! můžete vidět okamžitý přehled celého světa. Poté můžete kliknout kdekoli a uvolnit #v Tab#! pro okamžitý přechod tam."
 lesson_basics_pausing: "Pauza ($lesson_basics$)"
 lesson_basics_pausing_short: "Upravit rychlost hry a pozastavit/pokračovat pomocí zvýrazněných ovládacích prvků rychlosti. Můžete také pozastavit a pokračovat stisknutím"
 lesson_basics_pausing_spacebar: "Můžete také pozastavit a pokračovat stisknutím"
 lesson_basics_pausing_show_more: "Časová osa Victoria 3 zahrnuje 100 let od 1836 do 1936, ale můžete si tempo upravit sami. Teď čas v podstatě stojí, protože je hra pozastavena. Zatímco je hra pozastavena, můžete ji stále ovládat, ale mnohé akce se vyvíjejí v průběhu času a vyžadují, aby hodiny běžely, aby měly jakýkoli efekt.\n\nV této části výukového programu budeme hru udržovat pozastavenou, zatímco vás provedeme některými základními prvky. Všimněte si zvýrazněných ovládacích prvků rychlosti, protože brzy předáme opratě zpět vám."
 lesson_basics_pausing_desc: "Nyní začíná vaše cesta 19. stoletím, ale učení hry tímto nekončí!\n\nPo skončení této lekce budete připraveni"
 lesson_basics_pausing_continue: "Znovu spustit hru"
 lesson_basics_nested_tooltips: "Vnořené nápovědy ($lesson_basics$)"
 lesson_basics_nested_tooltips_desc: "Někdy uvidíte $tooltip_hinter$ nebo barevný $tooltip_hinter_name$ nebo $tooltip_hinter_concept$. Přejděte kurzorem nad takový text, abyste získali více informací v novém okně, které se nazývá #b tooltip#!.\n\nNechte kurzor chvíli stát a tooltip získá pevný okraj a uzamkne se na místě. Poté najdete nové $tooltip_hinter$, $tooltip_hinter_names$ nebo $tooltip_hinter_concepts$, nad kterými můžete v tooltipu přejet."
 lesson_basics_nested_tooltips_complete: "$lesson_basics_nested_tooltips$"
 lesson_basics_nested_tooltips_complete_desc: "$lesson_basics_nested_tooltips_desc$"
 lesson_basics_nested_tooltips_continue: "Umístěte kurzor myši nad tooltip uvnitř jiného tooltipu"
 lesson_basics_capacities: "Kapacity ($lesson_basics$)"
 lesson_basics_capacities_short: "Tři kapacity měří různé aspekty moci vaší země.\n\n@bur![Nbsp][Concept('concept_bureaucracy','Byrokracie')] je rozsah byrokratického dosahu vaší vlády.\n\n@aut![Nbsp][Concept('concept_authority','Autorita')] je schopnost [Concept('concept_head_of_state','hlava státu')] vládnout na základě dekretu.\n\n@inf![Nbsp][Concept('concept_influence','Vliv')] vám umožňuje uplatnit svůj vliv ve světových záležitostech."
 lesson_basics_capacities_show_more: "Kapacity pocházejí z některých [Concept('concept_government_building', '$concept_government_buildings$')], určitých [Concept('concept_law', '$concept_laws$')] a vaší [Concept('concept_rank','hodnost')]. Rozhodujete o tom, jak je alokovat pro prosazení svých zájmů.\n\nNepoužitá kapacita poskytne malý impuls jedné stránce vaší země, zatímco její překročení přinese velkou penalizaci."
 lesson_basics_capacities_desc: "Tři kapacity měří různý aspekt moci vaší země.\n\n@bur![Nbsp][Concept('concept_bureaucracy','Byrokracie')] je míra byrokratického dosahu vaší vlády.\n\n@aut![Nbsp][Concept('concept_authority','Autorita')] je schopnost [Concept('concept_head_of_state','hlava státu')] vládnout nařízeními.\n\n@inf![Nbsp][Concept('concept_influence','Vliv')] vám umožňuje uplatnit svůj vliv v mezinárodních záležitostech.\n\nKapacity vycházejí z některých [Concept('concept_government_building', '$concept_government_buildings$')], určitých [Concept('concept_law', '$concept_laws$')] a vaší [Concept('concept_rank','hodnost')]. Máte možnost rozhodnout, jak je alokovat pro dosažení vašich zájmů.\n\nNevyužitá kapacita poskytne drobný bonus jednomu aspektu vaší země, zatímco překročení bude mít za následek velký trest."
 lesson_basics_capacities_desc_1: "Tři kapacity měří různé aspekty síly vaší země. Načtěte myší nad oranžový text pro více informací."
 lesson_basics_capacities_desc_B: "[Concept('concept_bureaucracy','Byrokracie')]"
 lesson_basics_capacities_desc_A: "[Concept('concept_authority','Autorita')]"
 lesson_basics_capacities_desc_I: "[Concept('concept_influence','Vliv')]"
 lesson_basics_capacities_desc_R: "Kapacity pocházejí z některých [Concept('concept_government_building', '$concept_government_buildings$')], určitých [Concept('concept_law', '$concept_laws$')] a vaší [Concept('concept_rank','hodnost')]. Můžete se rozhodnout, jak je rozdělit k dosažení vašich zájmů.\n\nNevyužitá kapacita poskytne malé výhody jednomu aspektu vaší země, zatímco nadměrné využití způsobí veliké sankce."
 lesson_basics_treasury: "Pokladna ($lesson_basics$)"
 lesson_basics_treasury_short: "[Concept('concept_money','Peníze')] v [Concept('concept_treasury','státní pokladně')] se používá k financování státního aparátu, rozšiřování průmyslu a infrastruktury, vyplácení armády a dokonce i k ovlivňování menších národů." # todo: CONCEPT CASE
 lesson_basics_treasury_show_more: "Většina peněz ve vaší zemi je obíhána [Concept('concept_building', '$concept_buildings$')] a [Concept('concept_pop', '$concept_pops$')] a je mimo vaši přímou kontrolu. Zvyšte příjmy své státní pokladny tím, že porostete a zdaníte svou ekonomiku. Snižte své výdaje minimalizací provozních nákladů [Concept('concept_government_building', '$concept_government_buildings$')].\n\nZůstatek uvedený v horním panelu odráží změnu za týden. Na rozdíl od kapacit lze [Concept('concept_money','peníze')] šetřit na pozdější utrácení, přičemž zadlužení kvůli zápornému týdennímu zůstatku často přináší lepší návratnost investic. Úvěry budou automaticky spláceny, pokud bude váš týdenní zůstatek kladný."
 lesson_basics_treasury_desc: "[Concept('concept_money','Peníze')] v [Concept('concept_treasury','státní pokladně')] se používá k financování státního aparátu, rozšiřování průmyslu a infrastruktury, placení armády a dokonce ovlivňování menších národů.\n\nVětšina peněz ve vaší zemi je cirkulována [Concept('concept_building', '$concept_buildings$')] a [Concept('concept_pop', '$concept_pops$')] a je mimo vaši přímou kontrolu. Zvyšte příjmy vašeho $concept_treasury$ tím, že vyrostete a zdaníte svou ekonomiku. Snižte své výdaje minimalizací provozních nákladů [Concept('concept_government_building', '$concept_government_buildings$')].\n\nBalanc, který vidíte v horním panelu, odráží týdenní změnu. Na rozdíl od kapacit, [Concept('concept_money','peníze')] může být uloženo na pozdější výdaje, ačkoliv zadlužení provozováním negativního týdního zůstatku může často přinést lepší návratnost investic. Půjčky budou automaticky splaceny, dokud bude váš týdenní zůstatek pozitivní." # todo: CONCEPT CASE
 lesson_basics_treasury_part_1_desc: "[Concept('concept_money','Peníze')] v [Concept('concept_treasury','státní pokladně')] je používáno k financování státního aparátu." # todo: CONCEPT CASE
 lesson_basics_treasury_part_2_desc: "Většina peněz ve vaší zemi je obíhána [Concept('concept_building', '$concept_buildings$')] a [Concept('concept_pop', '$concept_pops$')] a je mimo vaši přímou kontrolu."
 lesson_basics_treasury_part_3_desc: "Zvyšte příjmy vašeho $concept_treasury$ růstem a zdaněním vaší ekonomiky. Snižte své náklady minimalizací provozních nákladů [Concept('concept_government_building', '$concept_government_buildings$')].\n\nZůstatek zobrazený v horní liště odráží týdenní změnu. Na rozdíl od kapacit lze [Concept('concept_money','peníze')] uložit, aby se utratili později, i když rozkročení dluhy provozem negativního týdenního zůstatku nám často může přinést lepší návratnost investice. Půjčky budou automaticky splaceny, pokud bude váš týdenní zůstatek pozitivní."
 lesson_basics_treasury_part_4_desc: "Zůstatek zobrazený v horní liště odráží týdenní změnu. Na rozdíl od kapacit lze [Concept('concept_money','peníze')] uložit, aby se utratili později, i když rozkročení dluhy provozem negativního týdenního zůstatku nám často může přinést lepší návratnost investice. Půjčky budou automaticky splaceny, pokud bude váš týdenní zůstatek pozitivní."
 lesson_basics_treasury_part_5_desc: "Budovy a Pops mohou být zdaněny, abyste rozšířili a zlepšili svou ekonomiku. Snižte své výdaje minimalizací provozních nákladů [Concept('concept_government_building', '$concept_government_buildings$')].\n\nZůstatek uvedený v horním panelu odráží změnu za týden. Na rozdíl od kapacit lze [Concept('concept_money','peníze')] šetřit na pozdější utrácení, i když zadlužení kvůli zápornému týdennímu zůstatku často přináší lepší návratnost investic. Úvěry budou automaticky spláceny, pokud bude váš týdenní zůstatek kladný."
 lesson_basics_treasury_influence_nations: "#black Ovlivnit menší národy"
 lesson_basics_treasury_Expand_industry: "#black Rozšířit průmysl a infrastrukturu"
 lesson_basics_treasury_Fund: "#black Financovat státní aparát"
 lesson_basics_treasury_Pay: "#black Platit armádě#!"
 lesson_basics_treasury_Influence: "#black Ovlivnit menší národy"
 lesson_basics_treasury_Taxes: "#black Daně#!"
 lesson_basics_info_panels: "Infopanel ( $lesson_basics$ )"
 lesson_basics_info_panels_desc: "Na levé straně obrazovky je několik tlačítek, která vás mohou přivést k obrazovkám ukazujícím přehled různých aspektů [GetPlayer.GetName].\n\nNěkteré slouží k řízení vaší země, zatímco jiné jsou informační. Nebojte se je procházet a když budete připraveni, stiskněte Další."
 lesson_basics_lenses: "Objektiv ($lesson_basics$)"
 lesson_basics_lenses_short: "Ve spodní části obrazovky jsou čtyři čočky. Tyto poskytují snadný přístup k akcím, které můžete podniknout k utváření své země, kombinované s informacemi potřebnými k činění dobrých rozhodnutí."
 lesson_basics_lenses_production: "#b Produkce"
 lesson_basics_lenses_politics: "#b Politika"
 lesson_basics_lenses_diplomacy: "#b Diplomacie"
 lesson_basics_lenses_military: "#b Vojenské"
 lesson_basics_lenses_trade: "#b Obchod!„ umožňuje rozšířit obchod [Concept('concept_infrastructure','infrastruktura')] a poskytuje informace o [Concept('concept_market', '$concept_markets$')]."
 lesson_basics_lenses_desc: "Podél spodní části obrazovky jsou čtyři čočky. Tyto poskytují snadný přístup k akcím, které můžete podniknout k formování své země, v kombinaci s informacemi potřebnými k tomu, abyste činili správná rozhodnutí.\n\n#b Výroba#! slouží k rozšiřování průmyslu a poskytuje podrobnosti o vašem ekonomickém výstupu.\n\n#b Politika#! je pro řízení vlády a vašeho lidu a poskytuje podrobnosti o mocenském rozložení ve vaší zemi.\n\n#b Diplomacie#! je pro iniciování nebo zrušení dohod s jinými zeměmi nebo začínání [Concept('concept_diplomatic_play', '$concept_diplomatic_plays$')] proti nim. Poskytuje podrobnosti o tom, jak vás vnímají jiné země.\n\n#b Vojenská#! je pro rozšiřování armády a námořnictva a poskytuje podrobnosti o příkazech [Concept('concept_commander','velitelů')] a dalších záležitostech spojených s válkou.\n\n#b Obchod#! vám umožňuje rozšířit obchod [Concept('concept_infrastructure','infrastruktura')] a dává vám informace o [Concept('concept_market', '$concept_markets$')]." # todo: CONCEPT CASE
 lesson_basics_lenses_continue: "Otevřete rozhraní objektivů kliknutím na jakékoli tlačítko objektivu"
 lesson_basics_lenses_complete: "$lesson_basics_lenses$"
 lesson_basics_lenses_complete_desc: "Každý objektiv má svůj vlastní režim mapy! Otočte se a podívejte se na mapu, abyste viděli, jaké detaily se právě změnily. Kliknutím na každý objektiv a pohledem na mapu můžete získat dobrý pocit o tom, co se právě ve vaší zemi děje.\n\nAž budete připraveni pokračovat, zavřete objektiv a stiskněte Další."
 lesson_basics_lenses_complete_continue: "Zavřete rozhraní objektivů kliknutím na tlačítko objektivu znovu"
 TRIGGER_LESSON_BASICS_LENSES_CONTINUE: "Otevřete jakoukoliv čočku"
 TRIGGER_LESSON_BASICS_LENSES_COMPLETE_CONTINUE: "Zavřete čočku"
 lesson_pops_intro: "Pops"
 lesson_pops_intro_desc: "Populace (pops) jsou způsobem, jak rozdělit populaci země do vhodných skupin lidí stejného [Concept('concept_profession','profese')], [Concept('concept_building','pracoviště')] ve [Concept('concept_state','státě')], [Concept('concept_culture','kultuře')] a [Concept('concept_religion','náboženství')] - jinými slovy, jedinečné demografické skupiny lidí, kteří sdílejí ekonomickou a politickou roli ve společnosti.\n\nV této lekci se nejprve podíváme na" # todo: CONCEPT CASE
 lesson_pops_intro_continue: "Otevřete panel populace"
 lesson_pops_summary: "Shrnutí Pops"
 lesson_pops_summary_desc: "Zde můžete vidět přehled o druzích Pops, které žijí ve vaší zemi a jaký mají podíl na [Concept('concept_political_strength','politické síle')]. Ale chceme více podrobností, tak klikněte na zvýrazněný 'Podrobný seznam', abyste viděli seznam všech jednotlivých Pops v [GetPlayer.GetName]." # todo: CONCEPT CASE
 lesson_pops_summary_continue: "Otevřete podrobný seznam"
 lesson_pops_intro_back: "Panel populace je"
 lesson_pops_country_details: "Pops ve vaší zemi"
 lesson_pops_country_details_desc: "Tento seznam [Concept('concept_profession', '$concept_professions$')] zobrazuje:\n$TAB$total"
 lesson_pops_country_details_continue: "Klikněte na jakýkoliv z vašich států a otevřete kartu Přehled"
 lesson_pops_country_details_back: "Podrobný seznam je"
 lesson_pops_state_population: "Státní pops"
 lesson_pops_state_population_desc: "Panel přehledu státu poskytuje pouze několik základních statistik populace. Získejte podrobnosti o populaci tohoto konkrétního státu kliknutím na zvýrazněnou záložku."
 lesson_pops_state_population_continue: "Klikněte na záložku populace"
 lesson_pops_state_population_back: "Záložka Přehled státu je"
 lesson_pops_state_population_details: "Podrobnosti o populaci státu"
 lesson_pops_state_population_details_desc: "Toto je podobný pohled na předchozí, ale tentokrát pouze na Pops ve státě, na který se díváte, na rozdíl od všech v vaší zemi. Podobné pohledy jsou v celém hře k dispozici pro shromažďování a kategorizaci informací o vašich Pops.\n\nPodívejme se blíže kliknutím na jednu z těchto kategorií, abychom zobrazili seznam všech Pops této profese. Tyto jednotlivé Pops jsou také klikatelné, abyste získali nejjemnější dostupné podrobnosti o této konkrétní demografii."
 lesson_pops_state_population_details_continue: "Roztáhněte seznam popů, poté klikněte na jednotlivého Popu"
 lesson_pops_state_population_details_back: "Karta obyvatel není #b otevřená#!"
 lesson_pops_stats_1: "Vlastnosti obyvatel"
 lesson_pops_stats_1_desc: "Zde vidíme jednotlivého Popa v jeho celé slávě. Ačkoli přímo neinteragujete s Popem, každá akce, kterou podniknete, ovlivňuje vlastnosti Popů ve vaší zemi. Vaše země se mění v důsledku změn schopností, podmínek, mobility a přání vaší populace.\n\nNyní se podíváme na vlastnosti Popa. Při řízení vaší země se téměř vždy budete zabývat těmito hodnotami jakožto průměry nebo agregáty, ale někdy je nezbytné přejít na jednotlivou úroveň, aby se zjistilo"
 lesson_pops_stats_1_back: "Panel jednotlivých Popů není #b otevřený#!"
 lesson_pops_stats_2: "Profese"
 lesson_pops_stats_2_desc: "Profese Popu [Concept('concept_profession','profesi')] určuje, jakou práci Popus [Concept('concept_workforce','pracovní síla')] vykonává, což ovlivňuje jejich [Concept('concept_building_wage','mzda')] a jaké [Concept('concept_interest_group', '$concept_interest_groups$')] by mohli podporovat. Každá profese je považována za součást [Concept('concept_lower_strata','Lower')], [Concept('concept_middle_strata','Middle')], nebo [Concept('concept_upper_strata','Upper Strata')], což může ovlivnit jejich [Concept('concept_taxes','$concept_tax_rate$')] mimo jiné.\n\nPop se neupravuje v profesi najednou. Když jsou vytvořena volná pracovní místa v [Concept('concept_building','budově')] v té samé [Concept('concept_state','státech')], Pops, kteří [Concept('concept_pop_qualifications','qualify')] pro novou práci, budou mít nabídku určitého počtu. Pokud je nová práce lepší než jejich současná, někteří jednotlivci v [Concept('concept_workforce','pracovní síle')] si vezmou své [Concept('concept_dependents','závislé osoby')] a připojí se k existujícímu Popu odpovídající profese, nebo vytvoří nového, pokud jeden již neexistuje.\n\nTo vše se děje bez vašeho zásahu a zřídka si toho budete vědomi, pokud nová volná místa nejsou obsazena v přiměřeném čase. V průběhu času si všimnete, jak se demografie mění spolu s profesemi nabízenými ve vaší zemi." # todo: CONCEPT CASE
 lesson_pops_stats_3: "Životní standard"
 lesson_pops_stats_3_desc: "Koncept [Concept('concept_sol','životní standard')] je kombinací jejich [Concept('concept_wealth','bohatství')] a podmínek, ve kterých žijí. Určuje jejich obecnou spokojenost s jejich situací a ovlivňuje jejich [Concept('concept_pop_growth','Růst')].\n\nJak se zvyšuje životní úroveň, řada jednotlivců v populaci se stane [Concept('concept_loyalist', '$concept_loyalists$')]. Když se sníží, populace se stane více [Concept('concept_radical','radikál')], a čím déle zůstane pod očekávaným národním minimem, tím více z nich se promění na [Concept('concept_radical', '$concept_radicals$')]."
 lesson_pops_stats_4: "Zaměstnatelnost"
 lesson_pops_stats_4_desc: "Tato sekce uvádí, ve které [Concept('concept_state','státě')] žije a pracuje [Concept('concept_pop','populace')], její míru [Concept('concept_literacy','gramotnost')] a její [Concept('concept_culture','kultura')] a [Concept('concept_religion','náboženství')].\n\nTyto aspekty jsou obzvlášť důležité při určování zaměstnatelnosti popu. $concept_pops$ mohou zaujmout pouze pracovní místa dostupná v [Concept('concept_state','státě')] , kde žijí. $concept_pops$ s nízkým [Concept('concept_acceptance_status','statusem přijetí')] mají těžší čas [Concept('concept_pop_qualifications','qualifying')] pro lepší [Concept('concept_profession', '$concept_professions$')], a vysoká úroveň [Concept('concept_literacy','gramotnost')] je klíčová pro kvalifikaci na technické nebo akademické práce, které se s modernizací objevují." # todo: CONCEPT CASE
 lesson_pops_stats_5: "Politika"
 lesson_pops_stats_5_desc: "Tato sekce uvádí různé hodnoty o tomto [Concept('concept_pop','populace')], mezi nimiž je jeho velikost, jejich [Concept('concept_social_class','sociální třída')], [Concept('concept_interest_group', '$concept_interest_groups$')] které Pop podporuje, kolik [Concept('concept_political_strength','politické síly')] je schopno je podporovat a kolik jeho členů je v současnosti [Concept('concept_radical', '$concept_radicals$')] a [Concept('concept_loyalist', '$concept_loyalists$')].\n\nZájmové skupiny vyjadřují různá [Concept('concept_law', '$concept_laws$')] v závislosti na své [Concept('concept_ideology', '$concept_ideologies$')]. Loajalisté a radikálové přispívají oběma [Concept('concept_approval','spokojenosti')] zájmovým skupinám, které Pop podporuje. Radikálové také vytvářejí [Concept('concept_turmoil','nepokoje')] v Popově [Concept('concept_state','stát')]." # todo: CONCEPT CASE
 lesson_pops_stats_5_continue: "Otevřete záložku Ekonomika v panelu jednotlivého popu"
 lesson_pops_stats_6: "Populace a příjem"
 lesson_pops_stats_6_desc: "Jeden Pop se skládá z [Concept('concept_workforce','pracovní síly')] a [Concept('concept_dependents','závislých osob')]. První pracuje na [Concept('concept_building', '$concept_buildings$')] v zemi výměnou za [Concept('concept_building_wage','mzdu')]. Druhý buď není schopen pracovat kvůli věku nebo zranění, nebo dohlíží na domácnost, vychovává děti, stará se o staré lidi nebo vykonává různé práce. Obvykle přispívají jak pracovníci, tak závislí na celkovém příjmu Popu, ale mzdy obvykle představují větší část.\n\nJak pracovní síla, tak závislí mají [Concept('concept_pop_needs','potřeby populace')], které musí být splněny, a utratí svůj příjem za [Concept('concept_good', '$concept_goods$')] k uspokojení těchto potřeb. Pokud zbydou nějaké peníze, bohatství Popu se časem zvýší. Pokud příjem nestačí na pokrytí výdajů, bohatství se sníží." # todo: CONCEPT CASE
 lesson_pops_stats_6_back: "Záložka ekonomika v panelu jednotlivých pops je"
 lesson_pops_conclusion: "Pops - Závěr"
 lesson_pops_conclusion_desc: "Pops jsou stavebními kameny vaší země a správa vašich Pops je klíčem k úspěšnému budování společnosti. Tvorba pracovních míst a přijímání politik s cílem učinit vaše Pops bohatšími, šťastnějšími a vzdělanějšími přinese mnoho výhod, ale také nové výzvy. Změny, které provedete, ovlivní vaše Pops, kteří budou spíše nakloněni akceptaci budoucích změn."
 lesson_expand_building_how_1: "Jak rozšířit $concept_buildings$ "
 lesson_expand_building_how_1_desc: "[Concept('concept_building', '$concept_buildings$')] se staví ve [Concept('concept_state', '$concept_states$')]. Kliknutím na [Concept('concept_state','stát')] na mapě můžete vidět, které [concept_buildings] již existují, nebo které mohou být postaveny.\n\nNajděte [Concept('concept_state','stát')] nazvaný [GetTutorialJournalEntry.GetTarget.GetBuilding.GetState.GetName] na mapě. Pokud najedete kurzorem na název [Concept('concept_state','stát')], mělo by se zvýraznit někde v [GetTutorialJournalEntry.GetTarget.GetBuilding.GetState.GetCountry.GetName]."
 lesson_expand_building_how_1_continue: "Klikněte na $concept_state$ [GetTutorialJournalEntry.GetTarget.GetBuilding.GetState.GetName] na mapě"
 lesson_expand_building_how_2: "$lesson_expand_building_how_1$"
 lesson_expand_building_how_2_desc: "Všechny [Concept('concept_building', '$concept_buildings$')] v [GetTutorialJournalEntry.GetTarget.GetBuilding.GetState.GetName] naleznete pod kartou $concept_buildings$."
 lesson_expand_building_how_2_continue: "Otevřete záložku $concept_buildings$"
 lesson_expand_building_how_3: "$lesson_expand_building_how_1$"
 lesson_expand_building_how_3_desc: "V panelu přehledu budov uvidíte přehled [Concept('concept_building', '$concept_buildings$')], které jsou přítomny ve [Concept('concept_state','státě')] [GetTutorialJournalEntry.GetTarget.GetBuilding.GetState.GetName], rozdělené do čtyř kategorií" # todo: CONCEPT CASE
 lesson_expand_building_how_3_continue: "Klikněte na [GetTutorialJournalEntry.GetTarget.GetBuilding.GetName] v panelu $concept_state$"
 lesson_expand_building_how_4: "$lesson_expand_building_how_1$"
 lesson_expand_building_how_4_desc: "Nyní můžete vidět podrobné informace o [GetTutorialJournalEntry.GetTarget.GetBuilding.GetName] [Concept('concept_building','budově')] v [GetTutorialJournalEntry.GetTarget.GetBuilding.GetState.GetName]. Můžete požadovat jeho rozšíření v panelu kliknutím na zvýrazněné tlačítko '+'.\n\nTaké můžete použít objektivy k rozšíření [GetTutorialJournalEntry.GetTarget.GetBuilding.GetName], ale to pokryjeme později.\n\nZačněte rozšiřování [GetTutorialJournalEntry.GetTarget.GetBuilding.GetName] v [GetTutorialJournalEntry.GetTarget.GetBuilding.GetState.GetName]." # todo: CONCEPT CASE
 lesson_expand_building_how_4_continue: "Zahájení rozšíření [GetTutorialJournalEntry.GetTarget.GetBuilding.GetName] v [GetTutorialJournalEntry.GetTarget.GetBuilding.GetState.GetName]"
 lesson_expand_building_how_5: "$concept_building$ Rozšiřování probíhá"
 lesson_expand_building_how_5_desc: "Úspěšně jste nařídili rozšíření [GetTutorialJournalEntry.GetTarget.GetBuilding.GetName] v [GetTutorialJournalEntry.GetTarget.GetBuilding.GetState.GetName]!\n\n[Concept('concept_building', '$concept_buildings$')] potřebují čas na rozšíření. [GetTutorialJournalEntry.GetTarget.GetBuilding.GetName] byly umístěny do [Concept('concept_construction_queue','stavební fronty')] a budou postaveny během několika týdnů.\n\nZatímco čekáte na dokončení tohoto procesu, pokračujte ve hře! Další [Concept('concept_journal_entry', '$concept_journal_entries$')] se objeví, aby vás seznámily s různými herními mechanikami ve Victoria 3." # todo: CONCEPT CASE
 lesson_expand_building_why_1: "Proč rozšířit $concept_buildings$"
 lesson_expand_building_why_1_desc: "$lesson_expand_building_why_1K_desc$"
 lesson_expand_building_why_1K_desc: "Bezpečný způsob, jak růst vaší ekonomiky, je rozšíření základního zdroje [Concept('concept_building','budova')], který produkuje základní [Concept('concept_good','zboží')], jako je [GetTutorialJournalEntry.GetBuildingTarget.GetDefaultOutputGoods.GetName].\n\nZákladní produkty jsou [Concept('concept_good_consumption','$concept_good_consumed$')] přímo většinou vašich [Concept('concept_pop','$concept_pops$')], kteří je nakupují od vyrábějícího [Concept('concept_building','budovy')]. To obohacuje vaši [Concept('concept_workforce','pracovní sílu')], kterou můžete [Concept('concept_taxes','$concept_tax$')] vytěžit k získání [Concept('concept_money','peněz')] pro [Concept('concept_treasury','státní pokladnu')]. Tyto prostředky mohou být použity k rozšíření dalších částí vašeho průmyslu." # todo: CONCEPT CASE
 lesson_expand_building_why_1K_expand: "Rozšířit budovu"
 lesson_expand_building_why_1K_enrich: "Obohatit lidi"
 lesson_expand_building_why_1K_taxes: "Vybírat daně"
 lesson_expand_building_why_1K_original_desc: "Rozšíření [Concept('concept_building','budova')] je jedním z nejlepších způsobů, jak zvýšit vaši ekonomiku. Obecně to znamená, že obohacujete své [Concept('concept_pop', '$concept_pops$')], od kterých pak vybíráte daně a získáváte příjmy. Bohatší $concept_pops$ znamená více bohatství, které můžete zdanit.\n\nPoužijme například váš [GetTutorialJournalEntry.GetTarget.GetBuilding.GetName] ve [GetTutorialJournalEntry.GetTarget.GetBuilding.GetState.GetName]. Pokud najedete na název [GetTutorialJournalEntry.GetTarget.GetBuilding.GetState.GetName], měla by se [Concept('concept_state','stát')] zvýraznit někde na mapě [GetTutorialJournalEntry.GetTarget.GetBuilding.GetState.GetCountry.GetName]." # todo: CONCEPT CASE
 lesson_expand_building_why_1K_p2_desc: "Použijeme vaše [GetTutorialJournalEntry.GetTarget.GetBuilding.GetName] ve [GetTutorialJournalEntry.GetTarget.GetBuilding.GetState.GetName] jako příklad. Přejděte myší přes název [Concept('concept_state','stát')]: [GetTutorialJournalEntry.GetTarget.GetBuilding.GetState.GetName]. Tím zviditelníte jeho polohu na mapě [GetTutorialJournalEntry.GetTarget.GetBuilding.GetState.GetCountry.GetName]."
 lesson_expand_building_why_1_continue: "Klikněte na [GetTutorialJournalEntry.GetTarget.GetBuilding.GetState.GetName] na mapě"
 lesson_expand_building_why_2: "$lesson_expand_building_why_1$"
 lesson_expand_building_why_2_desc: "Všechny [Concept('concept_building', '$concept_buildings$')] v [GetTutorialJournalEntry.GetTarget.GetBuilding.GetState.GetName] lze nalézt na záložce $concept_buildings$."
 lesson_expand_building_why_2_continue: "Otevřete kartu $concept_buildings$"
 lesson_expand_building_why_2_back: "Panel $concept_state$ musí být zavřen, abyste se vrátili"
 lesson_expand_building_why_3: "$lesson_expand_building_why_1$"
 lesson_expand_building_why_3_desc: "Na přehledovém panelu [Concept('concept_building','budovy')] uvidíte přehled $concept_buildings$, které jsou přítomny v [Concept('concept_state','státě')] [GetTutorialJournalEntry.GetTarget.GetBuilding.GetState.GetName], rozdělené do čtyř kategorií #b Městské#!, #b Zdroje#!, #b Zemědělství#! a #b Rozvoj#!." # todo: CONCEPT CASE
 lesson_expand_building_3_icon_text: "Hledejte [GetTutorialJournalEntry.GetTarget.GetBuilding.GetName] ve [GetTutorialJournalEntry.GetTarget.GetBuilding.GetState.GetName] $concept_state$ Panelu."
 lesson_expand_building_why_3_continue: "Klikněte na [GetTutorialJournalEntry.GetTarget.GetBuilding.GetName] v $concept_state$ Panelu"
 lesson_expand_building_why_3_back: "$concept_buildings$ panel musí být zavřen, abyste se vrátili"
 lesson_expand_building_why_4: "$lesson_expand_building_why_1$"
 lesson_expand_building_why_4_desc: "Pod"
 lesson_expand_building_why_4_back: "Panel #b Informace#! [GetTutorialJournalEntry.GetTarget.GetBuilding.GetName] musí být zavřen, aby se vrátil."
 lesson_expand_building_why_5: "$lesson_expand_building_why_1$"
 lesson_expand_building_why_5_desc: "Toto jsou [Concept('concept_building', '$concept_building_possessive$')] výdaje. Výdaje vždy zahrnují [Concept('concept_building_wage', '$concept_building_wages$')] [Concept('concept_workforce','pracovní síla')] $concept_building$. Mohou se také zahrnovat další výdaje, v @money![Concept('concept_money','penězích')] nebo jiné měny, jako jsou [Concept('concept_good', '$concept_goods$')] požadované v procesu výroby nebo [Concept('concept_infrastructure_usage','využití infrastruktury')] uvalené na jeho [Concept('concept_state','stát')]." # todo: CONCEPT CASE
 lesson_expand_building_why_6: "$lesson_expand_building_why_1$"
 lesson_expand_building_why_6_desc: "$lesson_expand_building_why_6k1_desc$"
 lesson_expand_building_why_6k1_desc: "Toto jsou příjmy [Concept('concept_building', '$concept_building_possessive$')].\n\n[GetTutorialJournalEntry.GetTarget.GetBuilding.GetName] produkují [GetTutorialJournalEntry.GetBuildingTarget.GetDefaultOutputGoods.GetTextIcon][Nbsp][GetTutorialJournalEntry.GetBuildingTarget.GetDefaultOutputGoods.GetName] jako své hlavní výstupní [Concept('concept_good','zboží')], ale mohou mít také vedlejší produkty. Mnoho [Concept('concept_building', '$concept_buildings$')] může vyrábět několik různých typů $concept_goods$."
 lesson_expand_building_why_6k2_desc: "Vyrobené $concept_goods$ se prodávají za ceny, které se liší v závislosti na podmínkách [Concept('concept_market','trhu')]." # todo: CONCEPT CASE
 lesson_expand_building_why_6k3_desc: "[GetTutorialJournalEntry.GetBuildingTarget.GetDefaultOutputGoods.GetTextIcon]"
 lesson_expand_building_why_6k_desc_Grain: "[GetTutorialJournalEntry.GetBuildingTarget.GetDefaultOutputGoods.GetNameNoFormatting]"
 lesson_expand_building_why_7: "$lesson_expand_building_why_1$"
 lesson_expand_building_why_7_desc: "[Concept('concept_building', '$concept_buildings$')] neposkytují vaše příjmy přímo vám, ale poskytují vašim [Concept('concept_pop', '$concept_pops$')] [Concept('concept_profession','$concept_profession_jobs$')] a [Concept('concept_building_wage','$concept_building_wages$')]. Můžete vidět, kteří $concept_pops$ zde pracují pod záložkou #v Pracovní síla#!."
 lesson_expand_building_why_7_continue: "Klikněte na záložku Pracovní síla v panelu [GetTutorialJournalEntry.GetTarget.GetBuilding.GetName]"
 lesson_expand_building_why_8: "$lesson_expand_building_why_1$"
 lesson_expand_building_why_8_desc: "Jedním ze způsobů, jak získat příjem je zdanění zaměstnaných [Concept('concept_pop', '$concept_pops$')]. Kolik budete zdaněno, závisí na vás a může být změněno na panelu rozpočtu."
 lesson_expand_building_why_8_back: "Záložka Pracovní síla v panelu [GetTutorialJournalEntry.GetTarget.GetBuilding.GetName] musí být zavřena, abyste se vrátili"
 lesson_expand_building_why_9: "$lesson_expand_building_why_1$"
 lesson_expand_building_why_9_desc: "$lesson_expand_building_why_9k_desc$"
 lesson_expand_building_why_9k_desc: "Rozšíření [Concept('concept_building','budova')], jako je [GetTutorialJournalEntry.GetTarget.GetBuilding.GetName], zvyšuje, kolik [Concept('concept_pop', '$concept_pops$')] tam může pracovat, a obohacuje ostatní vaše [Concept('concept_country','$concept_country_possessive$')] $concept_pops$ tím, že jim umožňuje přístup k [GetTutorialJournalEntry.GetBuildingTarget.GetDefaultOutputGoods.GetTextIcon][Nbsp][GetTutorialJournalEntry.GetBuildingTarget.GetDefaultOutputGoods.GetName] za nižší cenu než předtím."
 lesson_expand_building_why_9k_desc_Building: "Budova"
 lesson_expand_building_why_9k_desc_Workforce: "Pracovní síla"
 lesson_expand_building_why_9k_desc_Grain: "[GetTutorialJournalEntry.GetBuildingTarget.GetDefaultOutputGoods.GetNameNoFormatting]"
 lesson_expand_building_why_9k_desc_Country_Pops: "Pops země"
 lesson_expand_building_why_10: "$lesson_expand_building_why_1$"
 lesson_expand_building_why_10_desc: "Ale než se rozhodnete rozšířit všechny vaše [Concept('concept_building', '$concept_buildings$')], pamatujte, že existuje"
 lesson_expand_basic_building_started_1: "$concept_building$ rozšíření probíhá"
 lesson_expand_basic_building_started_1_desc: "Úspěšně jste objednali expanzi [GetTutorialJournalEntry.GetTarget.GetBuilding.GetName] ve [GetTutorialJournalEntry.GetTarget.GetBuilding.GetState.GetName]!\n\n[Concept('concept_building', '$concept_buildings$')] vyžadují čas na expanzi. [GetTutorialJournalEntry.GetTarget.GetBuilding.GetName] byly zařazeny do [Concept('concept_construction_queue','stavební fronty')] [GetTutorialJournalEntry.GetTarget.GetBuilding.GetState.GetName] a budou v průběhu času sestaveny [Concept('concept_workforce','pracovní síla')]em [Concept('concept_state', '$concept_state_possessive$')] [GetTutorialJournalEntry.GetTarget.GetBuilding.GetState.GetBuilding('building_construction_sector').GetName].\n\nZatímco čekáte na dokončení tohoto procesu, pokračujte ve hře! Další [Concept('concept_journal_entry', '$concept_journal_entries$')] se objeví, aby vám ukázaly různé herní mechanismy ve Victorii 3." # todo: CONCEPT CASE
 lesson_expand_basic_building_complete: "$concept_building$ rozšířen"
 lesson_expand_basic_building_complete_desc: "Rozšíření [GetTutorialJournalEntry.GetTarget.GetBuilding.GetName] v [GetTutorialJournalEntry.GetTarget.GetBuilding.GetState.GetName], které jste objednali před nějakým časem, je nyní dokončeno! [Concept('concept_building','Budova')] nyní může podpořit větší [Concept('concept_workforce','pracovní síla')] a vyprodukovat více [Concept('concept_good', '$concept_goods$')]. Již také nebudete muset platit týdenní náklady na materiály pro $concept_goods$ potřebné k jeho rozšíření.\n\nRychlost, kterou můžete objednat rozšíření $concept_buildings$ po celé [GetPlayer.GetNameNoFlag], je omezena vaším [GetBuildingType('building_construction_sector')]."
 lesson_expand_productive_building_how_1: "Jak rozšiřovat [Concept('concept_productivity', '$concept_productive$')] $concept_buildings$"
 lesson_expand_productive_building_how_1_desc: "Do této chvíle už víte, že můžete rozšířit [Concept('concept_building', '$concept_buildings$')] přes panel [Concept('concept_state','stát')], výběrem $concept_building$ a stisknutím tlačítka + nebo použít objektiv Produkce. Můžete tuto [Concept('concept_journal_entry','záznam v deníku')] dokončit stejným způsobem, pokud chcete.\n\nAle pro naše aktuální účely je lepší projít přehledovým panelem $concept_buildings$ a hledat a rozšířit obzvlášť [Concept('concept_productivity', '$concept_productive$')] $concept_building$."
 lesson_expand_productive_building_how_1_continue: "Otevřete panel $concept_buildings$"
 lesson_expand_productive_building_how_2: "$lesson_expand_building_how_1$"
 lesson_expand_productive_building_how_2_desc: "Zde jsou zobrazeny všechny [Concept('concept_building', '$concept_buildings$')] napříč celým [GetPlayer.GetName] v přehledném seznamu. Z této nabídky můžete přímo přistupovat k $concept_buildings$ a vykonávat běžné operace jako je expanze, [Concept('concept_subsidies', '$concept_subsidizing$')] nebo změna jeho [Concept('concept_production_method', '$concept_production_methods$')]. Co je důležité, z tohoto panelu můžete vykonat tyto operace na všech $concept_buildings$ určitého typu ve vaší zemi najednou!\n\n[GetTutorialJournalEntry.GetTarget.GetBuilding.GetBuildingType.GetName], který chceme posílit, je pod "
 lesson_expand_productive_building_how_2_icon_text: "Naleznete $concept_building$ rozšířením: "
 lesson_expand_productive_building_how_2_continue: "Rozšiřte rozbalovací nabídku [GetTutorialJournalEntry.GetTarget.GetBuilding.GetBuildingType.GetName] v kartě [GetTutorialJournalEntry.GetTarget.GetBuilding.GetBuildingType.GetTabName], abyste našli [GetTutorialJournalEntry.GetTarget.GetBuilding.GetName] v [GetTutorialJournalEntry.GetTarget.GetBuilding.GetState.GetName]"
 lesson_expand_productive_building_how_2_back: "Panel $concept_buildings$ musí být uzavřen pro zpětné sledování"
 lesson_expand_productive_building_how_3: "$lesson_expand_building_how_1$"
 lesson_expand_productive_building_how_3_desc: "Jedním z nejdůležitějších aspektů [Concept('concept_building','budovy')] je jeho [Concept('concept_productivity','produktivita')]. Vysoká $concept_productivity$ budovy [GetTutorialJournalEntry.GetTarget.GetBuilding.GetName] ve [GetTutorialJournalEntry.GetTarget.GetBuilding.GetState.GetName] nás vedla k jejímu výběru pro expanzi. $concept_productivity$ je lepším měřítkem než zisk pro určení hodnoty $concept_building$ pro vás, protože měří hodnotu, kterou přidává k vaší ekonomice, aniž by zohledňovalo aspekty jako [Concept('concept_building_wage', '$concept_building_wages$')], [Concept('concept_taxes','daně')], [Concept('concept_subsidies','dotace')] a [Concept('concept_dividends','dividendy')], které se mohou drasticky lišit od budovy k budově." # todo: CONCEPT CASE
 lesson_expand_productive_building_how_3_back: "Zavřete rozbalovací nabídku [GetTutorialJournalEntry.GetTarget.GetBuilding.GetBuildingType.GetName] v záložce [GetTutorialJournalEntry.GetTarget.GetBuilding.GetBuildingType.GetTabName], abyste se vrátili zpět"
 lesson_expand_productive_building_how_4: "$lesson_expand_building_how_1$"
 lesson_expand_productive_building_how_4_desc: "Nyní začněte expanze této budovy. Buď klikněte na + tlačítko, jako obvykle, nebo *klikněte pravým tlačítkem* a vyberte odpovídající možnost."
 lesson_expand_productive_building_how_4_continue: "Zahájení rozšíření [GetTutorialJournalEntry.GetTarget.GetBuilding.GetName]"
 lesson_expand_productive_building_how_5: "$lesson_expand_building_how_1$"
 lesson_expand_productive_building_how_5_desc: "Skvělá práce! Nyní pokračujte v prozkoumávání hry, zatímco čekáte na dokončení rozšíření. Můžete se podívat na podrobnější"
 lesson_expand_productive_building_how_5_back: "Zastavte rozšíření [GetTutorialJournalEntry.GetTarget.GetBuilding.GetName], abyste se vrátili"
 lesson_expand_productive_building_why_1: "Proč rozšířit [Concept('concept_productivity', '$concept_productive$')] $concept_buildings$"
 lesson_expand_productive_building_why_1_desc: "Zaměřením svých expanzních snah na vysoce [Concept('concept_productivity', '$concept_productive$')] [Concept('concept_building', '$concept_buildings$')] maximalizujete hodnotu, kterou vaše [Concept('concept_workforce','pracovní síla')] přidává k vaší ekonomice. Produkce nízkohodnotných [Concept('concept_good', '$concept_goods$')] jako [GetGoods('grain').GetTextIcon][Nbsp][GetGoods('grain').GetName] při vynaložení pouze malého množství [Concept('concept_money','peníze')] na vstup $concept_goods$ jako [GetGoods('tools').GetTextIcon][Nbsp][GetGoods('tools').GetName] umožňuje vašim [Concept('concept_pop', '$concept_population$')] se uživit a zároveň vydělávat malou částku [Concept('concept_building_wage', '$concept_building_wages$')]. Přesměrování této $concept_workforce$ na produkci vysokohodnotných $concept_goods$ jako [GetGoods('wine').GetTextIcon][Nbsp][GetGoods('wine').GetName] nebo [GetGoods('clippers').GetTextIcon][Nbsp][GetGoods('clippers').GetName] místo toho, pokud poptávka existuje, tyto $concept_pops$ zajistí generování více $concept_money$ celkově — i když jejich vlastní $concept_building_wages$ může zůstat stejné."
 lesson_expand_productive_building_why_1_continue: "Otevřete panel podrobností o $concept_building$ pro [GetTutorialJournalEntry.GetTarget.GetBuilding.GetName] v [GetTutorialJournalEntry.GetTarget.GetBuilding.GetState.GetName]"
 lesson_expand_productive_building_why_2: "$lesson_expand_building_why_1$"
 lesson_expand_productive_building_why_2_desc: "Relativní [Concept('concept_productivity','produktivita')] je indikována ikonou ozubeného kola [GetTutorialJournalEntry.GetTarget.GetBuilding.GetProfitabilityCompareIconInType]. Přejděte přes něj pro více podrobností."
 lesson_expand_productive_building_why_3: "$lesson_expand_building_why_1$"
 lesson_expand_productive_building_why_3_desc: "[Concept('concept_productivity','Produktivita')] se zakládá pouze na rozdílu mezi náklady na vstupní [Concept('concept_good', '$concept_goods$')] a příjem z prodeje výstupů $concept_goods$, rozdělený mezi celkovou [Concept('concept_workforce','pracovní sílu')] [Concept('concept_building','budovy')]. Můžete si to představit jako 'kolik hodnoty každý zaměstnanec přidává ekonomice svého $concept_building$ ročně.'" # todo: CONCEPT CASE
 lesson_expand_productive_building_why_4: "$lesson_expand_building_why_1$"
 lesson_expand_productive_building_why_4_desc: "I když je hodnota [Concept('concept_productivity','produktivita')] mnohem vyšší než průměrné [Concept('concept_building_wage', '$concept_building_wages$')] rozdíl není zbytečný. Je rozdělen mezi [Concept('concept_building','budovou')][Concept('concept_cash_reserves','hotovostními rezervami')] a [Concept('concept_dividends','dividendami')] vyplácené [Concept('concept_building_owners','vlastníkům budov')]. Naopak, pokud je $concept_productivity$ nedostatečné na pokrytí požadovaného $concept_building$$concept_building_wages$ rozdíl bude krátkodobě odečten z [Concept('concept_cash_reserves','hotovostních rezerv')] před snížením $concept_building_wages$ a potenciálně [Concept('concept_throughput','efektivita')] v dlouhodobém horizontu." # todo: CONCEPT CASE
 lesson_expand_productive_building_why_5: "$lesson_expand_building_why_1$"
 lesson_expand_productive_building_why_5_desc: "Přidávání hodnoty vaší ekonomice rozšiřováním pouze vysoce [Concept('concept_productivity', '$concept_productive$')] [Concept('concept_building', '$concept_buildings$')] nemusí být nejlepší krok ve všech okolnostech. Přesycení [Concept('concept_market','trh')] sníží [Concept('concept_market_price','tržní cena')] pro vyprodukované [Concept('concept_good', '$concept_goods$')] a způsobí velký tlak na poptávku po konzumovaných $concept_goods$, což v průběhu času povede k poklesu $concept_productivity$."
 lesson_journal_1: "Deník"
 lesson_journal_1_desc_short: "Právě jste dostali svou první výukovou výzvu! Hru jsme #v pozastavili#!, abychom vám dali čas přečíst si to. Nezapomeňte #v znovu spustit#! pomocí ovládacích prvků rychlosti nebo #v mezerníku#!, až budete připraveni pokračovat.\n\n#v Otevřete deník#! kliknutím na zvýrazněné tlačítko vlevo, abyste začali."
 lesson_journal_1_desc: "Právě jste dostali svou první výukovou výzvu! Všechny výukové výzvy, které obdržíte, mají formu zápisů ve vašem [Concept('concept_journal_entry','$concept_journal$')]. Můžete je plnit vlastním tempem s tolika nebo tak málo vodítky, kolik cítíte, že potřebujete.\n\nNyní jsme #v pozastavili hru#! znovu, abychom vám dali čas na čtení, a budeme tak pokračovat, když začneme nové lekce. Nezapomeňte #v zrušit pozastavení#! pomocí ovládacích prvků rychlosti nebo #v mezerníku#!, když budete připraveni pokračovat.\n\n#v Otevřete deník#! kliknutím na zvýrazněné tlačítko vlevo, abyste začali."
 lesson_journal_1_continue: "Otevřete panel deníku kliknutím na zvýrazněné tlačítko"
 lesson_journal_2: "$lesson_journal_1$"
 lesson_journal_2_desc: "Toto je váš deník. Všechny výukové výzvy vám udělené můžete najít zde. Další významné události ve vaší zemi se zde také mohou občas objevit.\n\nMěli byste prozkoumat výukovou výzvu, kterou jste dostali. Otevřete"
 lesson_journal_2_back: "Panel deníku musí být zavřen, aby se vrátil"
 lesson_journal_2_continue: "Vyberte"
 lesson_journal_3: "$lesson_journal_1$"
 lesson_journal_3_desc_short: "Byli jste pověřeni rozšířením základního zemědělského [Concept('concept_building','budovy')] v jednom z vašich [Concept('concept_state', '$concept_states$')]. Jak budete hrát hru, objeví se více výukových výzev, jako je tato, ve vašem [Concept('concept_journal_entry','$concept_journal$')].\n\nMůžete se buď pokusit dokončit výzvu sami bez jakékoliv pomoci, nebo kliknout na" # todo: CONCEPT CASE
 lesson_journal_3_desc: "Byli jste pověřeni rozšířením základní zemědělské [Concept('concept_building','budova')] v jednom z vašich [Concept('concept_state', '$concept_states$')].\n\nDokončením výukových úkolů se naučíte #b jak#! a #b proč#! utvářet svou zemi v požadovaném směru. Můžete se pokusit dokončit tyto úkoly pouze s informacemi poskytnutými v [Concept('concept_journal_entry','záznamu v deníku')], nebo můžete kliknout na tlačítko 'Guide Me' v $concept_journal_entry$, abyste získali pokyny krok za krokem.\n\nKdyž postoupíte, budou vám přiděleny další výukové úkoly. Zkontrolujte svůj žurnál od času k času pro další kroky!" # todo: CONCEPT CASE
 lesson_journal_3_back: "Panel [Concept('concept_journal_entry','záznam v deníku')] musí být uzavřen pro zpětné sledování"
 lesson_budget_balance_1: "Vyvážení rozpočtu"
 lesson_budget_balance_1_desc: "V současnosti utrácíte více peněz na fixních nákladech, než přinášíte, což vede k rozpočtovému deficitu, který vyčerpá vaše [Concept('concept_gold_reserves','zlaté rezervy')], pokud nějaké máte, a zvýší [Concept('concept_loans','půjčky')], pokud nemáte. Abychom začali řešit tento problém, nejprve otevřete panel Rozpočet."
 lesson_budget_balance_1_continue: "Otevřete panel rozpočtu"
 lesson_budget_balance_2: "$lesson_budget_balance_1$"
 lesson_budget_balance_2_desc: "Zde můžete vidět rozpis všech výdajů a zdrojů příjmů a upravit úrovně daní a vládních mezd. Nejjednodušší způsob, jak vyřešit rozpočetní deficit, je obvykle zvýšit míru, kterou zdaníte své [Concept('concept_pop', '$concept_pops$')] nebo zavést novou [Concept('concept_consumption_tax', '$concept_consumption_taxes$')], ale mějte na paměti, že to má nevýhody ve formě snížení [Concept('concept_wealth','bohatství')] a možné [Concept('concept_turmoil','nepokoje')]. Můžete také zkusit snížit výdaje tím, že snížíte úrovně svých [Concept('concept_government_building', '$concept_government_buildings$')], například [GetBuildingType('building_barrack').GetName] nebo [GetBuildingType('building_naval_base').GetName], nebo omezit [Concept('concept_government_wage','$concept_government_wages$')].\n\nMéně spolehlivý, ale lepší způsob, jak zlepšit příjmy, je růst vašeho [Concept('concept_gdp','hrubého domácího produktu')] zlepšením efektivity vašich [Concept('concept_building', '$concept_buildings$')], nebo dokonce deficitem financované výdaje na rozšíření ziskových [Concept('concept_building', '$concept_buildings$')], ačkoli to může být komplikované a není to doporučený postup pro nové hráče." # todo: CONCEPT CASE
 lesson_budget_balance_how: "Jak vyvážit svůj rozpočet"
 lesson_budget_balance_how_1: "Jak vyvážit váš rozpočet"
 lesson_budget_balance_how_1_desc: "Snížit svůj deficit a splatit své půjčky můžete buď zvýšením svých příjmů, snížením výdajů, nebo obojím."
 lesson_budget_balance_how_1_continue: "Otevřete panel rozpočtu"
 lesson_budget_balance_how_2: "$lesson_budget_balance_how_1$"
 lesson_budget_balance_how_2_desc: "Vaše příjmy se skládají z [Concept('concept_budget_minting','ražby mincí')] a [Concept('concept_taxes','daní')]. Nová měna bude automaticky emitována, aby udržela tempo s vaším rostoucím hospodářstvím, ale [Concept('concept_taxes','daně')] jsou nezbytné pro udržení silných vlád.\n\nMezi nimi mohou být:\n - [Concept('concept_budget_income_taxes','daně z příjmu')]\n - [Concept('concept_budget_poll_taxes','daně z hlavy')]\n - [Concept('concept_consumption_tax', '$concept_consumption_taxes$')]\n - [Concept('concept_budget_dividends_taxes','daně z dividend')]\n - [Concept('concept_tariffs','cla')]\na další.\n\nPřidání nových nebo zvýšení existujících [Concept('concept_taxes','daní')] okamžitě zvýší vaše příjmy." # todo: CONCEPT CASE
 lesson_budget_balance_how_2_continue: "Zvyšte úroveň jakékoli daně nebo přidejte novou [Concept('concept_consumption_tax','spotřební daň')], abyste pokračovali"
 lesson_budget_balance_how_2_back: "Zavřete panel rozpočtu, abyste se vrátili"
 lesson_budget_balance_how_3: "$lesson_budget_balance_how_1$"
 lesson_budget_balance_how_3_desc: "Náklady na konstrukci nejsou považovány za součást vašich fixních výdajů, protože končí, jakmile konstrikce skončí. I přesto zatěžují vaši [Concept('concept_treasury','státní pokladnu')], jakmile konstrukce probíhá. Pozastavme je na chvíli, a můžete je restartovat, jakmile vyřešíte tento problém." # todo: CONCEPT CASE
 lesson_budget_balance_how_3_continue: "Pozastavte veškerou výstavbu, abyste zastavili stavební náklady v všech [Concept('concept_state', '$concept_states$')]"
 lesson_budget_balance_how_4: "$lesson_budget_balance_how_1$"
 lesson_budget_balance_how_4_desc: "Pevné výdaje jsou způsobeny [Concept('concept_government_building', '$concept_government_buildings$')] jako [SelectLocalization(GetPlayer.IsValid,'lesson_budget_balance_how_4_desc_added','Government Administration')] a [SelectLocalization(GetPlayer.IsValid,'lesson_budget_balance_how_4_desc_added_2','Barracks')], a zahrnují jak [Concept('concept_good', '$concept_goods$')] použité, tak i [Concept('concept_budget_wages','mzdy')] vyplácené jimi. Můžete řídit své výdaje úpravou $concept_budget_wages$ vyplácených ve vaší [Concept('concept_country','zemi')].\n\nPokud chcete, můžete nyní snížit [Concept('concept_budget_government_wages','vládní mzdy')] nebo [Concept('concept_budget_military_wages','vojenské mzdy')]. Změny mezd jsou vždy reverzibilní, ale poznamenejte si důsledky v tooltips!" # todo: CONCEPT CASE
 lesson_budget_balance_how_4_desc_added: "[GetBuildingType('building_government_administration').GetName]"
 lesson_budget_balance_how_4_desc_added_2: "[GetBuildingType('building_barrack').GetName]"
 lesson_budget_balance_how_5: "$lesson_budget_balance_how_1$"
 lesson_budget_balance_how_5_desc: "Dalším způsobem, jak kontrolovat své výdaje, je zmenšení [Concept('concept_government_building', '$concept_government_buildings$')] v konkrétních [Concept('concept_state', '$concept_states$')], čímž trvale snížíte náklady na [Concept('concept_budget_wages','mzdy')] placené a [Concept('concept_good', '$concept_goods$')] konzumované, ale odstraníte výhody, které úroveň [Concept('concept_building','budova')] poskytuje."
 lesson_budget_balance_how_5_continue: "Klikněte na záložku [Concept('concept_state', '$concept_states$')] pro pokračování"
 lesson_budget_balance_how_6: "$lesson_budget_balance_how_1$"
 lesson_budget_balance_how_6_desc: "Karta [Concept('concept_state', '$concept_states$')] seskupuje všechny příjmy a výdaje [Concept('concept_treasury','státní pokladna')] podle [Concept('concept_state','státu')], aby usnadnila nalezení vhodných kandidátů na snížení. Na základě třídění a najetí na hodnotu výdajů můžete rychle zjistit, které [Concept('concept_building', '$concept_buildings$')] vás stojí nejvíce.\n\nPokud chcete, můžete nyní snížit své výdaje downsizingem [Concept('concept_government_building', '$concept_government_buildings$')]. To může být zvráceno pouze expanzí budovy znovu, což vyžaduje [Concept('concept_money','peníze')] a čas." # todo: CONCEPT CASE
 lesson_budget_balance_how_6_back: "Zavřete záložku [Concept('concept_state', '$concept_states$')] abyste se vrátili"
 lesson_budget_balance_how_7: "$lesson_budget_balance_how_1$"
 lesson_budget_balance_how_7_desc: "Potenciálně hlavní přispěvatel k vašim pevným výdajům je [Concept('concept_budget_interest','úrok')], placený na vašich [Concept('concept_loans','půjčkách')]." # todo: CONCEPT CASE
 lesson_budget_balance_how_7_continue: "Klikněte na kartu Aktiva pro pokračování"
 lesson_budget_balance_how_8: "$lesson_budget_balance_how_1$"
 lesson_budget_balance_how_8_desc: "Své platby [Concept('concept_budget_interest','úrok')] můžete snížit pouze splácením svého [Concept('concept_principal','jistiny')]. Dokud je váš zůstatek [Concept('concept_treasury','státní pokladna')] záporný, váš $concept_principal$ se bude zvyšovat, a tím vzrostou vaše platby [Concept('concept_budget_interest','úrok')]. Pokud bude váš zůstatek [Concept('concept_treasury','státní pokladna')] kladný, automaticky snížíte své platby [Concept('concept_principal','jistina')] a [Concept('concept_budget_interest','úrok')].\n\nPokud jste schopní snížit svou $concept_budget_interest_rate$, můžete vzít mnohem větší [Concept('concept_loans','půjčky')], než byste byli ochotni pod tíhou tohoto spirálovitě umírajícího úvěru." # todo: CONCEPT CASE
 lesson_budget_balance_how_9: "$lesson_budget_balance_how_1$"
 lesson_budget_balance_how_9_desc: "Pokud zůstane váš zůstatek záporný, pokračujte ve zvyšování nebo přidávání více [Concept('concept_taxes','daně')] a/nebo zmenšování [Concept('concept_government_building', '$concept_government_buildings$')] dokud nebude váš zůstatek kladný."
 lesson_budget_balance_why: "Proč vyrovnat váš rozpočet"
 lesson_budget_balance_why_1: "Proč vyrovnat váš rozpočet"
 lesson_budget_balance_why_1_desc: "Existuje mnoho různých zdrojů příjmů a výdajů. Panel Rozpočet vám ukazuje úplné rozdělení."
 lesson_budget_balance_why_1_continue: "Otevřete záložku Přehled na panelu rozpočtu"
 lesson_budget_balance_why_2: "$lesson_budget_balance_why_1$"
 lesson_budget_balance_why_2_desc: "Pokud výdaje převyšují příjmy, vaše [Concept('concept_gold_reserves','zlaté rezervy')] se každý týden vyčerpají jako negativní"
 lesson_budget_balance_why_2_back: "Zavřete kartu Přehled na panelu rozpočtu, abyste se vrátili"
 lesson_budget_balance_why_3: "$lesson_budget_balance_why_1$"
 lesson_budget_balance_why_3_desc: "Většina výdajů je"
 lesson_budget_balance_why_4: "$lesson_budget_balance_why_1$"
 lesson_budget_balance_why_4_desc: "Ale pokud vaše [Concept('concept_treasury','státní pokladna')] má větší #v fixní#! výdaje než zdroje příjmů (výnosů), vaše finance jsou neudržitelné. I když máte [Concept('concept_gold_reserves','zlaté rezervy')], nakonec se budete muset uchýlit k [Concept('concept_loans','půjčkám')] od svých domácích průmyslů jen abyste mohli pokračovat v činnosti." # todo: CONCEPT CASE
 lesson_budget_balance_why_4_continue: "Otevřete záložku Aktiva"
 lesson_budget_balance_why_5: "$lesson_budget_balance_why_1$"
 lesson_budget_balance_why_5_desc: "Neměli byste se bát vzít si [Concept('concept_loans','půjčky')] abyste se dostali dál, zejména protože většina @money! které utratíte se stejně vrátí zpět do kapes vašich [Concept('concept_pop', '$concept_pops_possessive$')]! Pamatujte, že každé [Concept('concept_good','zboží')] koupené a každý @money! [Concept('concept_budget_wages','mzdy')] zaplacený nakonec obohatí buď výrobce, spotřebitele, nebo oba. Utrácení peněz z [Concept('concept_treasury','státní pokladny')] vždy zvyšuje průměrný [Concept('concept_wealth','bohatství')], což zvyšuje poptávku po [Concept('concept_pop_needs','potřebách populace')], což je to, co způsobuje, že se vaše ekonomické kola točí." # todo: CONCEPT CASE
 lesson_budget_balance_why_5_k_desc: "Neměli byste se bát vzít si [Concept('concept_loans', '$concept_loans$')] abyste se dostali dál, zejména protože většina @money! které utratíte se stejně vrátí zpět do kapes vašich [Concept('concept_pop', '$concept_pops_possessive$')]!"
 lesson_budget_balance_why_5_k2_desc: "Pamatujte, že každé [Concept('concept_good','zboží')] zakoupené a každý @money! z [Concept('concept_budget_wages','mezd')] zaplacený skončí obohacování výrobce, spotřebitele, nebo obojího. Výdajem peněz z [Concept('concept_treasury','státní pokladny')] se vždy zvyšuje průměrné [Concept('concept_wealth','bohatství')], což zvyšuje poptávku po [Concept('concept_pop_needs','potřebách populace')], což je to, co pohání kola vaší ekonomiky." # todo: CONCEPT CASE
 lesson_budget_balance_why_5_k_Pop_Wealth: "#black Bohatství Pops"
 lesson_budget_balance_why_5_k_Taxes: "#black Daně#!"
 lesson_budget_balance_why_5_k_Interest: "#black Úroky"
 lesson_budget_balance_why_5_k_Treasury: "#black Trezor"
 lesson_budget_balance_why_5_k_Expand_industry: "#black Rozšiřte průmysl"
 lesson_budget_balance_why_5_k_Take_Loans: "#black Vzít půjčky#!"
 lesson_budget_balance_why_5_k_Demand_Increase: "#black Zvýšení poptávky#!"
 lesson_budget_balance_why_5_back: "Zavřete panel aktiv a vraťte se zpět"
 lesson_budget_balance_why_6: "$lesson_budget_balance_why_1$"
 lesson_budget_balance_why_6_desc_common: "Celkové [Concept('concept_credit','kredit')] jsou součtem všech budov [Concept('concept_cash_reserves','hotovostních rezerv')]. Čím větší a úspěšnější průmysly máte, tím více si můžete půjčit." # todo: CONCEPT CASE
 lesson_budget_balance_why_6_desc: "$lesson_budget_balance_why_6_desc_common$ Zbývající $concept_credit$ je:\n\n"
 lesson_budget_balance_why_6_encyclopedia_desc: "$lesson_budget_balance_why_6_desc_common$ Zbývající [Concept('concept_credit','kredit')] se vypočítá takto:\n\n[Concept('concept_credit','Kredit')] - [Concept('concept_principal','jistina')] = zbývající [Concept('concept_credit','kredit')]."
 lesson_budget_balance_why_7: "$lesson_budget_balance_why_1$"
 lesson_budget_balance_why_7_desc: "Pokud váš [Concept('concept_principal','jistina')] dosáhne vaší [Concept('concept_credit','kredit')], je vaše země považována za [Concept('concept_default','platební neschopnost')], protože nemůže splnit své dluhy. To zastaví veškerou výstavbu a [Concept('concept_radical', '$concept_radicalize$')] populaci země [Concept('concept_pop', '$concept_pops$')] s [Concept('concept_privately_owned','soukromě vlastněno')] [Concept('concept_building','$concept_buildings$')], což může být katastrofální pro politickou stabilitu."
 lesson_budget_balance_why_8: "$lesson_budget_balance_why_1$"
 lesson_budget_balance_why_8_desc: "Každá změna, kterou provedete ve své ekonomice, bude mít široké, nepřímé účinky, jak pozitivně, tak negativně."
 lesson_budget_balance_why_8_continue: "Znovu otevřete záložku Přehled"
 lesson_budget_balance_why_9: "$lesson_budget_balance_why_1$"
 lesson_budget_balance_why_9_desc: "Všechny [Concept('concept_taxes','daně')] jsou vybrány přímo z [Concept('concept_pop', '$concept_pops$')], i když různé daňové [Concept('concept_law', '$concept_laws$')] ovlivní jejich osobní finance různými způsoby. Podobně všechny výdaje ovlivňují vaši ekonomiku a lidi, kteří se z ní živí. Jednoduchým aktem, jako je zvýšení daní nebo upravení [Concept('concept_budget_government_wages','vládní mzdy')], abyste pokryli své výdaje, efektivně přerozdělujete [Concept('concept_wealth','bohatství')] mezi vaše $concept_pops$. Každá akce má důsledky pro atributy jako [Concept('concept_pop_growth','populační růst')] a [Concept('concept_turmoil','nepokoje')]."
 lesson_budget_balance_why_9_back: "Zavřete záložku Přehled na panelu Rozpočet, abyste se vrátili"
 lesson_budget_balance_complete_1: "Rozpočet byl vyrovnán!"
 lesson_budget_balance_complete_1_desc: "Podařilo se vám obnovit kladnou bilanci [Concept('concept_treasury','státní pokladny')] pomocí kombinace nástrojů, které máte k dispozici. Jak vaše země postupuje v průběhu 19. století a dále, budete muset neustále upravovat svůj rozpočet, abyste dosáhli stabilního růstu, aniž byste zůstali pozadu, nebo abyste se zotavili z nákladných událostí. The" # todo: CONCEPT CASE
 lesson_budget_balance_fail_1: "Bez peněz!"
 lesson_budget_balance_fail_1_desc: "Nejhorší se stalo - vaše [Concept('concept_treasury','státní pokladna')] je prázdná a nyní jste v [Concept('concept_default','platební neschopnosti')]. Ale nebojte se, i to je něco, z čeho se můžete dostat zpět. Pokračujte ve snaze obnovit svou rovnováhu a dostat se z jámy, a pokud vaše platby [Concept('concept_budget_interest','úrok')] jsou příliš vysoké, můžete vyhlásit [Concept('concept_bankruptcy','bankrot')] na " # todo: CONCEPT CASE
 lesson_production_methods_how_1: "Jak změnit $concept_production_methods$"
 lesson_production_methods_how_1_desc: "[Concept('concept_production_method', '$concept_production_methods$')] lze změnit z panelu podrobností [Concept('concept_building','budovy')]. Budeme i nadále používat váš [GetTutorialJournalEntry.GetTarget.GetBuilding.GetName] ve [GetTutorialJournalEntry.GetTarget.GetBuilding.GetState.GetName] jako příklad." # todo: CONCEPT CASE
 lesson_production_methods_how_1_continue: "Otevřete panel pro [GetTutorialJournalEntry.GetTarget.GetBuilding.GetName] v [GetTutorialJournalEntry.GetTarget.GetBuilding.GetState.GetName]"
 lesson_production_methods_how_2: "$lesson_production_methods_how_1$"
 lesson_production_methods_how_2_desc: "Toto jsou [Concept('concept_production_method', '$concept_production_methods$')] momentálně účinné v této [Concept('concept_building','budově')]. Můžete na některý z nich kliknout a zobrazit seznam alternativních možností. " # todo: CONCEPT CASE
 lesson_production_methods_how_2_continue: "Vyberte jakoukoliv $concept_production_method$"
 lesson_production_methods_how_2_back: "[GetTutorialJournalEntry.GetTarget.GetBuilding.GetName] panel musí být zavřen, abyste se vrátili"
 lesson_production_methods_how_3: "$lesson_production_methods_how_1$"
 lesson_production_methods_how_3_desc: "Přejděte na jakoukoli z možností pro rozpad, jak se [Concept('concept_building','budova')] změní, pokud by byla vybrána ta [Concept('concept_production_method','výrobní metoda')]." # todo: CONCEPT CASE
 lesson_production_methods_how_3_continue: "Změňte jakékoliv $concept_production_methods$"
 lesson_production_methods_how_3_back: "Zrušte výběr $concept_production_method$ pro návrat zpět"
 lesson_production_methods_how_4: "$lesson_production_methods_how_1$"
 lesson_production_methods_how_4_desc: "Dobrá práce! Můžete vidět nové účinky na [Concept('concept_building','budovu')] okamžitě, ale důsledky na [Concept('concept_workforce','pracovní sílu')] a po celé ekonomice se mohou projevit až později. Udržujte tento [Concept('concept_production_method','výrobní metoda')] aktivní po dobu alespoň [GetTutorialJournalEntry.GetTotalGoalValue|0] týdnů, abyste dokončili lekci." # todo: CONCEPT CASE
 lesson_production_methods_why_1: "Proč měnit [Concept('concept_production_method', '$concept_production_methods$')]"
 lesson_production_methods_why_1_desc: "[Concept('concept_production_method', '$concept_production_methods$')] určují a mění funkce [Concept('concept_building','$concept_buildings$')]. Pro ukázku se podíváme na [GetTutorialJournalEntry.GetTarget.GetBuilding.GetName] ve [GetTutorialJournalEntry.GetTarget.GetBuilding.GetState.GetName]."
 lesson_production_methods_why_1_continue: "Otevřete panel pro [GetTutorialJournalEntry.GetTarget.GetBuilding.GetName] ve [GetTutorialJournalEntry.GetTarget.GetBuilding.GetState.GetName]"
 lesson_production_methods_why_2: "Proč měnit $concept_production_methods$"
 lesson_production_methods_why_2_desc: "Pokud najedete na jakýkoli z aktivních [Concept('concept_production_method', '$concept_production_methods$')], můžete vidět na tooltips, kolik [Concept('concept_good', '$concept_goods$')] spotřebovává a produkuje $concept_production_method$. Můžete také vidět, kolik každého [Concept('concept_profession','profese')] potřebuje v [Concept('concept_workforce','pracovní síle')], aby [GetTutorialJournalEntry.GetTarget.GetBuilding.GetName] fungovalo." # todo: CONCEPT CASE
 lesson_production_methods_why_3: "$lesson_production_methods_why_1$"
 lesson_production_methods_why_3_desc: "[Concept('concept_production_method', '$concept_production_methods$')] jsou barevně odlišeny podle různých typů:\n\n"
 lesson_production_methods_why_4: "$lesson_production_methods_why_1$"
 lesson_production_methods_why_4_desc: "Pokud kliknete na jakékoli aktivní [Concept('concept_production_method', '$concept_production_methods$')], můžete vidět, že každý typ zahrnuje různá $concept_production_methods$, ale pouze jedna může být aktivní najednou. Některé lze považovat za vylepšené verze předchozích ve svém typu. Ty často vyžadují nové [Concept('concept_technology', '$concept_technologies$')] k odemknutí. Jiné jsou prostě alternativy, které nejsou inherentně lepší nebo horší než ostatní. Musíte se rozhodnout, co je nejlepší pro vaši [Concept('concept_country','zemi')] na základě toho, jaké [Concept('concept_good', '$concept_goods$')] a [Concept('concept_profession', '$concept_professions$')] máte a chcete." # todo: CONCEPT CASE
 lesson_production_methods_why_5: "$lesson_production_methods_why_1$"
 lesson_production_methods_why_5_desc: "Někdy není žádoucí přecházet na modernější [Concept('concept_production_method','výrobní metodu')], zejména pokud jsou [Concept('concept_market_price','tržní cena')] jeho vstupních [Concept('concept_good', '$concept_goods$')] velmi drahé nebo dokonce v [Concept('concept_shortage','$concept_input_goods_shortage$')]. Dalším důvodem, proč okamžitě nemodernizovat, je to, že $concept_production_method$ vyžaduje [Concept('concept_profession', '$concept_professions$')], pro které mají vaše [Concept('concept_pop', '$concept_pops$')] slabé [Concept('concept_pop_qualifications','kvalifikace')]. Můžete se také rozhodnout odložit modernizace, protože nové $concept_professions$ mohou být náchylné k politickým příslušnostem, s nimiž se necítíte pohodlně." # todo: CONCEPT CASE
 lesson_fix_unproductive_building_how_1: "Zlepšit ziskovost neproduktivního $concept_building$"
 lesson_fix_unproductive_building_how_1_desc: "Neexistuje jednotné řešení pro [Concept('concept_building', '$concept_building_possessive$')] s nízkou [Concept('concept_productivity','produktivitou')]! Podívejme se na procesní analýzu $concept_building$, abychom viděli, jaké mohou být problémy." # todo: CONCEPT CASE
 lesson_fix_unproductive_building_how_1_continue: "Otevřete záložku $concept_state$ [GetTutorialJournalEntry.GetTarget.GetBuilding.GetState.GetName] kliknutím na mapu. Na záložce $concept_state$ $concept_building$ vyberte [GetTutorialJournalEntry.GetTarget.GetBuilding.GetName] $concept_building$"
 lesson_fix_unproductive_building_how_2_back: "[GetTutorialJournalEntry.GetTarget.GetBuilding.GetName] panel musí být zavřen, abyste se vrátili"
 lesson_fix_unproductive_building_how_2: "$lesson_fix_unproductive_building_how_1$"
 lesson_fix_unproductive_building_how_2_desc: "Pokud jsou [Concept('concept_good', '$concept_goods$')] na vstupní straně procesu příliš drahé, můžete se zaměřit na snížení jejich ceny. Toho lze dosáhnout expanzí [Concept('concept_building', '$concept_buildings$')] které je vyrábí, nebo importováním těchto $concept_goods$ na váš [Concept('concept_market','trh')]."
 lesson_fix_unproductive_building_how_3: "$lesson_fix_unproductive_building_how_1$"
 lesson_fix_unproductive_building_how_3_desc: "Pokud jsou [Concept('concept_good', '$concept_goods$')] na výstupní straně procesu příliš levné, můžete se zaměřit na zvýšení jejich ceny. To by mohlo být příležitostí k rozšíření [Concept('concept_building', '$concept_buildings$')] , které spotřebovávají tyto $concept_goods$, vyvážet tyto $concept_goods$ do jiných [Concept('concept_market', '$concept_markets$')], nebo povzbudit své [Concept('concept_pop', '$concept_pops$')] k jejich spotřebě namísto jiných $concept_goods$."
 lesson_fix_unproductive_building_how_4: "$lesson_fix_unproductive_building_how_1$"
 lesson_fix_unproductive_building_how_4_desc: "Pokud se chcete věnovat [Concept('concept_trade','obchod')], abyste zvýšili zisky z [Concept('concept_good', '$concept_goods$')], můžete tak učinit postavením [GetBuildingType(„building_trade_center“).GetName], které může $concept_import$ nebo $concept_export$ $concept_goods$ autonomně prostřednictvím [Concept('concept_world_market','světového trhu')].„" # todo: CONCEPT CASE
 lesson_fix_unproductive_building_how_4_continue: "Zůstaňte na/přejděte zpět na panel podrobností $concept_building$ pro [GetTutorialJournalEntry.GetTarget.GetBuilding.GetName] v [GetTutorialJournalEntry.GetTarget.GetBuilding.GetState.GetName]"
 lesson_fix_unproductive_building_how_5: "$lesson_fix_unproductive_building_how_1$"
 lesson_fix_unproductive_building_how_5_desc: "Odlišná kombinace [Concept('concept_production_method', '$concept_production_methods$')] by mohla učinit [Concept('concept_building','budova')] produktivnějším [Concept('concept_productivity', '$concept_productive$')]. Modernější $concept_production_methods$ nejsou vždy lepší, zejména pokud jsou jejich vstupní [Concept('concept_good', '$concept_goods$')] dražší! Dopad $concept_production_method$ na zůstatek $concept_building$ je zobrazen v jeho tooltipu, takže můžete experimentovat s různými metodami, abyste zjistili, zda jedna funguje lépe."
 lesson_fix_unproductive_building_how_6: "$lesson_fix_unproductive_building_how_1$"
 lesson_fix_unproductive_building_how_6_desc: "[Concept('concept_decree', '$concept_decrees$')] mohou pomoci zvýšit [Concept('concept_throughput','efektivita')] určité třídy [Concept('concept_building', '$concept_buildings$')]. Často není dobrý nápad zvyšovat $concept_throughput$ [Concept('concept_productivity', '$concept_unproductive$')] $concept_building$ samotného, protože to by mohlo znamenat ještě dražší vstupní [Concept('concept_good', '$concept_goods$')] a ještě levnější výstupy.\n\nMísto toho zvyšte $concept_throughput$ budov produkující vstupní $concept_goods$, které $concept_building$ potřebuje, nebo těch, které konzumují jeho výstupní $concept_goods$. Najít způsoby, jak vaši $concept_buildings$ udělat vzájemně přínosné, je klíčové pro budování silné ekonomiky."
 lesson_fix_unproductive_building_how_7: "$lesson_fix_unproductive_building_how_1$"
 lesson_fix_unproductive_building_how_7_desc: "Pokud neexistuje dobrý způsob, jak učinit [Concept('concept_building','budova')] produktivnějším [Concept('concept_productivity', '$concept_productive$')], ale vaše ekonomika stále potřebuje to, co [Concept('concept_building','budova')] vyrábí, můžete [Concept('concept_subsidies', '$concept_subsidize$')] jej. To zajišťuje, že má vždy všechny potřebné prostředky k nákupu vstupů [Concept('concept_good', '$concept_goods$')] a udržení konkurenceschopné [Concept('concept_building_wage','mzda')] pokrytím jakýchkoli rozpočtových nedostatků za [Concept('concept_treasury','státní pokladnu')]. Váš zákon o ekonomickém systému určuje, které $concept_buildings$ můžete $concept_subsidize$." # todo: CONCEPT CASE
 lesson_fix_unproductive_building_how_8: "$lesson_fix_unproductive_building_how_1$"
 lesson_fix_unproductive_building_how_8_desc: "[Concept('concept_building', '$concept_buildings$')] jehož [Concept('concept_productivity','produktivita')] klesne natolik, že nedokáže nabídnout konkurenceschopnou [Concept('concept_building_wage','mzdu')], se přirozeně přizpůsobí [Concept('concept_market','trh')], protože jejich [Concept('concept_throughput','efektivita')] bude ovlivněn nižším zaměstnáním, což zvyší příjmy na zbývající zaměstnance. Pokud chcete urychlit tento proces, vždy můžete zmenšit $concept_building$, abyste donutili pracovní sílu odejít jinam. Všimněte si, že to naštve [Concept('concept_pop', '$concept_pops$')], kteří přijdou o práci." # todo: CONCEPT CASE
 lesson_fix_unproductive_building_how_9: "$lesson_fix_unproductive_building_how_1$"
 lesson_fix_unproductive_building_how_9_desc: "Použijte jakékoliv nástroje, které máte k dispozici, ke zlepšení [Concept('concept_productivity','produktivity')] tohoto [Concept('concept_building','budovy')]. Pokud selže všechno ostatní, můžete [Concept('concept_subsidies', '$concept_subsidize$')] nebo dokonce snížit jeho velikost." # todo: CONCEPT CASE
 lesson_fix_unproductive_building_complete: "Neproduktivní $concept_building$ bylo obnoveno!"
 lesson_fix_unproductive_building_complete_desc: "Produktivita [GetTutorialJournalEntry.GetTarget.GetBuilding.GetName] v [GetTutorialJournalEntry.GetTarget.GetBuilding.GetState.GetName] se obnovila, čímž se otevřela cesta k dalšímu zvýšení [Concept('concept_building_wage', '$concept_building_wages$')], [Concept('concept_dividends','dividendy')], nebo obojího! Samozřejmě, že byste mohli profitovat na rostoucím objemu zvyšováním [Concept('concept_taxes','daní')], než se [Concept('concept_workforce','pracovní silou')] zvyknout na finanční vylepšení...\n\nKontrolováním $concept_buildings$' $concept_productivity$ za čas můžete zajistit, že máte dobrou směs $concept_buildings$ a že nepřicházíte o příležitosti." # todo: CONCEPT CASE
 lesson_promote_movement_how_0: "Aktuálně nemůžete [Concept('concept_bolster','posílení')] [Concept('concept_political_movement', '$concept_political_movements$')]"
 lesson_promote_movement_how_0_desc: "Vaše země nemá žádné $country_bolster_ig_attraction_mult$ a proto vám neumožňuje [Concept('concept_bolster','posílení')] [Concept('concept_political_movement', '$concept_political_movements$')]. Nejprve musíte schválit [Concept('concept_law','zákon')], který to povolí.[ConcatIfNeitherEmpty('\n\n', GetPlayer.GetModifier.GetDescFor('country_bolster_ig_attraction_mult'))]"
 lesson_promote_movement_how_0_continue: "Otevřete panel Politika, klikněte na záložku Zákony a klikněte na [GetPlayer.GetActiveLawFromGroup('lawgroup_free_speech').GetName] [Concept('concept_law','zákon')], abyste viděli své možné možnosti. Restartujte tuto lekci, jakmile byl váš nový $concept_law$ přijat!"
 lesson_promote_movement_how_1: "Jak $concept_bolster$ $concept_political_movements$"
 lesson_promote_movement_how_1_desc: "Aby bylo možné [Concept('concept_bolster','posílení')] [Concept('concept_political_movement','politické hnutí')], musíte mít nejprve [Concept('concept_law','zákon')], který to umožňuje. To je většinou definováno vaším postojem k [GetLawGroup('lawgroup_free_speech').GetName] (aktuálně [GetPlayer.GetActiveLawFromGroup('lawgroup_free_speech').GetName]). Přijetím různých $concept_laws$ si můžete přidělit více nebo méně moci, abyste na toto měli vliv."
 lesson_promote_movement_how_2: "$lesson_promote_movement_how_1$"
 lesson_promote_movement_how_2_desc: "Seznam vašich aktuálně aktivních [Concept('concept_political_movement', '$concept_political_movements$')] naleznete na panelu $politics$."
 lesson_promote_movement_how_2_continue: "Otevřete panel #v Politika#! a záložku #v Přehled#!"
 lesson_promote_movement_how_3: "$lesson_promote_movement_how_1$"
 lesson_promote_movement_how_3_desc: "Všechny [Concept('concept_political_movement', '$concept_political_movements$')] mohou být [Concept('concept_bolster', '$concept_bolstered$')], i když to může být riskantní $concept_bolster$ [concept_political_movement_short] s vysokým [Concept('concept_activism','aktivismem hnutí')]." # todo: CONCEPT CASE
 lesson_promote_movement_how_3_continue: "Klikněte na [Concept('concept_political_movement','politické hnutí')], který vám připadá zajímavý"
 lesson_promote_movement_how_3_continue_close: "Zavřete panel $concept_political_movement$, abyste se vrátili."
 lesson_promote_movement_how_3_back: "Zavřete"
 lesson_promote_movement_how_4: "$lesson_promote_movement_how_1$"
 lesson_promote_movement_how_4_desc: "[Concept('concept_bolster', '$concept_bolstering$')] [Concept('concept_political_movement','politické hnutí')] stojí [Concept('concept_authority','autorita')], a v tuto chvíli nemáte dostatek na to, abyste to mohli udělat. Zkontrolujte své výdaje [Concept('concept_authority','autorita')] a zrušte dostatek z nich, abyste měli alespoň [GetDefine('NPolitics', 'BOLSTER_COST')|0v] @aut! $concept_authority$ k dispozici."
 lesson_promote_movement_how_4_continue: "Mějte alespoň [GetDefine('NPolitics','BOLSTER_COST')|0v] @aut! $concept_authority$"
 lesson_promote_movement_how_5: "$lesson_promote_movement_how_1$"
 lesson_promote_movement_how_5_desc: "Můžete se rozhodnout [Concept('concept_bolster','posílení')] jakýkoli [Concept('concept_political_movement','politické hnutí')], ale pamatujte, že to má cenu [Concept('concept_authority','autority')]. Vy [Concept('concept_bolster','posílení')] [Concept('concept_political_movement','politické hnutí')] použitím" # todo: CONCEPT CASE
 lesson_promote_movement_how_5_continue: "[Concept('concept_bolster','Posílení')] jakýkoli jeden [Concept('concept_political_movement','politické hnutí')]"
 lesson_promote_movement_how_6: "$lesson_promote_movement_how_1$"
 lesson_promote_movement_how_6_desc: "[Concept('concept_bolster', '$concept_bolstered$')] [Concept('concept_political_movement','politické hnutí')] se radikálně nezmění hned. Pouze přitažlivost se změní, což způsobí, že více způsobilých [Concept('concept_pop', '$concept_pops$')] je podpoří v průběhu času. Počkejte chvíli a brzy uvidíte dopad na [concept_political_movement] [Concept('concept_clout','politický vliv')] a členství."
 lesson_promote_movement_why_1: "Proč $concept_bolster$ $concept_political_movements$"
 lesson_promote_movement_why_1_desc: "[Concept('concept_political_movement', '$concept_political_movements$')] jsou klíčové při určování a formování politiky [Concept('concept_interest_group','zájmové skupiny')] ve vaší [Concept('concept_country','zemi')]." # todo: CONCEPT CASE
 lesson_promote_movement_why_1_continue: "Otevřete panel jakéhokoliv $concept_political_movement$, abyste pokračovali"
 lesson_promote_movement_why_1_continue_close: "Zavřete panel $concept_political_movement$"
 lesson_promote_movement_why_2: "$lesson_promote_movement_why_1$"
 lesson_promote_movement_why_2_desc: "[Concept('concept_political_movement', '$concept_political_movements$')] poroste nebo klesne v [Concept('concept_political_movement_support','podpoře politického hnutí')] v průběhu času. [Concept('concept_political_movement_support','Podpora politického hnutí')] roste a klesá spolu se měnícími se podmínkami, které ovlivňují [Concept('concept_pop', '$concept_pops$')] ve vaší [Concept('concept_country','zemi')]. Tato měnící se politická krajina by vás mohla překvapit a narušit vaše plány.\n\nPokud zaujmete aktivnější roli při rozhodování, které [concept_political_movements] podpoříte, můžete ovlivnit a snadněji předpovědět, kam se vaše země ubírá." # todo: CONCEPT CASE
 lesson_promote_movement_why_3: "$lesson_promote_movement_why_1$"
 lesson_promote_movement_why_3_desc: "Bude-li [Concept('concept_bolster', '$concept_bolstered$')] [Concept('concept_political_movement','politické hnutí')] zvyšovat jak jeho [Concept('concept_pop','populací')] členství, tak [Concept('concept_political_movement_support','podpora politického hnutí')] v průběhu času. To jim umožní snáze ovlivnit [Concept('concept_ideology', '$concept_ideologies$')] vašich [Concept('concept_interest_group','$concept_interest_groups$')], což může nakonec usnadnit některé [Concept('concept_law', '$concept_laws$')] s legislativou." # todo: CONCEPT CASE
 lesson_promote_movement_why_4: "$lesson_promote_movement_why_1$"
 lesson_promote_movement_why_4_desc: "Kromě [Concept('concept_bolster', '$concept_bolstering$')] [Concept('concept_political_movement', '$concept_political_movements$')] podpořených můžete také [Concept('concept_suppress','potlačení')] ty, které odporujete. Každá z těchto akcí stojí určité množství @aut![Nbsp][Concept('concept_authority','autorita')]."
 lesson_promote_movement_why_4_continue: "Přejděte do záložky [Concept('concept_law', '$concept_laws$')] na panelu politiky."
 lesson_promote_movement_why_5: "$lesson_promote_movement_why_1$"
 lesson_promote_movement_why_5_desc: "Vaše schopnost [Concept('concept_bolster','posílení')] a [Concept('concept_suppress','potlačení')] [Concept('concept_political_movement', '$concept_political_movements$')] se řídí dvěma aspekty:\n\n* Vaší kapacitou @aut![Nbsp][Concept('concept_authority','autority')]\n* Vašimi hodnotami v $country_bolster_attraction_factor$ (aktuálně [GetTutorialJournalEntry.GetCountry.GetModifier.GetValueWithBreakdownFor('country_bolster_attraction_factor')]) a $country_suppression_attraction_factor$ (aktuálně [GetTutorialJournalEntry.GetCountry.GetModifier.GetValueWithBreakdownFor('country_suppression_attraction_factor')])\n\nVýznamným zdrojem pro obě tyto hodnoty je vaše aktuální [Concept('concept_law','zákon')] o [GetPlayer.GetActiveLawFromGroup('lawgroup_free_speech').GetName] pod [GetPlayer.GetActiveLawFromGroup('lawgroup_free_speech').GetGroup.GetName] [Concept('concept_law_group','skupinou zákonů')]." # todo: CONCEPT CASE
 lesson_market_access_by_decree_how_0: "$lesson_market_access_by_decree_how_1$"
 lesson_market_access_by_decree_how_0_desc: "Tato lekce vyžaduje, abyste mohli vydat [GetDecreeType('decree_road_maintenance').GetName] [Concept('concept_decree','dekret')], ale v současnosti máte nedostatečné @aut![Nbsp][Concept('concept_authority','autority')]. Najížděním @aut![Nbsp][Concept('concept_authority','autoritou')] na horním panelu se zobrazí tooltip, který vysvětlí, proč je vaše rovnováha tak nízká. Využijte tyto informace k zajištění toho, aby vaše rovnováha byla alespoň" # todo: CONCEPT CASE
 lesson_market_access_by_decree_how_0_continue: "Potřebujete alespoň [GetDecreeType('decree_road_maintenance').GetCost( GetPlayer.Self )] dostupné @aut![Nbsp][Concept('concept_authority','autorita')] pro pokračování. Přeskočte tuto lekci a vraťte se, jakmile je budete mít."
 lesson_market_access_by_decree_how_1: "Jak zlepšit $concept_market_access$ vydáním $concept_decree$"
 lesson_market_access_by_decree_how_1_desc: "Můžete snadno zvýšit množství [Concept('concept_infrastructure','infrastruktura')] dostupného v [Concept('concept_state','státě')] vydáním [Concept('concept_decree','dekretu')] k údržbě silnic tam." # todo: CONCEPT CASE
 lesson_market_access_by_decree_how_1_continue: "Otevřete [Concept('concept_political_lens','politická čočka')], poté přejděte na kartu $concept_decrees$"
 lesson_market_access_by_decree_how_2: "$lesson_market_access_by_decree_how_1$"
 lesson_market_access_by_decree_how_2_desc: "Existuje mnoho různých typů [Concept('concept_decree', '$concept_decrees$')] k vydání. Dekrety se vždy vydávají v [Concept('concept_state','státě')] a náklady na udržení [Concept('concept_authority','autoritu')]. " # todo: CONCEPT CASE
 lesson_market_access_by_decree_how_2_continue: "Vydávejte Decret o údržbě silnic v [GetTutorialJournalEntry.GetTarget.GetState.GetName]"
 lesson_market_access_by_decree_how_2_back: "Zavřete záložku $concept_decrees$ v [Concept('concept_political_lens','politické čočce')], abyste se vrátili zpět" # todo: CONCEPT CASE
 lesson_market_access_by_decree_how_3: "$lesson_market_access_by_decree_how_1$"
 lesson_market_access_by_decree_how_3_desc: "Skvělá práce! Nyní jste vydali [GetDecreeType('decree_road_maintenance').GetName] [Concept('concept_decree','dekret')] v [GetTutorialJournalEntry.GetTarget.GetState.GetName] s náklady @aut![Nbsp]#v [GetDecreeType('decree_road_maintenance').GetCost( GetPlayer.Self )|-0]#! [Concept('concept_authority','autorita')]."
 lesson_market_access_by_decree_how_3_continue: "Zavřete [Concept('concept_political_lens','politická čočka')]"
 lesson_market_access_by_decree_how_3_back: "Odstraňte nařízení o údržbě silnic v [GetTutorialJournalEntry.GetTarget.GetState.GetName], abyste se vrátili"
 lesson_market_access_by_decree_how_4: "$lesson_market_access_by_decree_how_1$"
 lesson_market_access_by_decree_how_4_desc: "Můžete vidět a spravovat vaše aktivní [Concept('concept_decree', '$concept_decrees$')] v $concept_political_lens$. Tyto jsou také viditelné v panelu přehledu [Concept('concept_state','státu')], a v tomto případě panelového přehledu [GetTutorialJournalEntry.GetTarget.GetState.GetName]." # todo: CONCEPT CASE
 lesson_market_access_by_decree_how_4_continue: "Klikněte na [Concept('concept_state','stát')] [GetTutorialJournalEntry.GetTarget.GetState.GetName] a přejděte na záložku Přehled"
 lesson_market_access_by_decree_how_4_back: "Otevřete panel [Concept('concept_political_lens','politická čočka')], abyste se vrátili"
 lesson_market_access_by_decree_how_5: "$lesson_market_access_by_decree_how_1$"
 lesson_market_access_by_decree_how_5_desc: "Množství [Concept('concept_infrastructure','infrastruktura')] a [Concept('concept_infrastructure_usage','využití infrastruktury')] je také viditelné na tomto panelu. Přejděte myší přes hodnotu $concept_infrastructure$ [GetTutorialJournalEntry.GetTarget.GetState.GetInfrastructure|v1], abyste zjistili, kolik přidává vaše [GetDecreeType('decree_road_maintenance').GetName] [Concept('concept_decree','dekret')]."
 lesson_market_access_by_decree_how_5_back: "Zavřete záložku Přehled pro [GetTutorialJournalEntry.GetTarget.GetState.GetName], abyste se vrátili"
 lesson_market_access_by_decree_why_1: "Proč zlepšit $concept_market_access$ prostřednictvím $concept_decree$"
 lesson_market_access_by_decree_why_1_desc: "[Concept('concept_market_access','Přístup na trh')] představuje, jak dobře jsou vaše [Concept('concept_state', '$concept_states$')] spojeny s jejich [Concept('concept_market','trh')].\n\nS"
 lesson_market_access_by_decree_why_1_continue: "Otevřete panel trhu na kartě Podrobnosti pro [GetTutorialJournalEntry.GetTarget.GetState.GetMarket.GetName]"
 lesson_market_access_by_decree_why_2: "$lesson_market_access_by_decree_why_1$"
 lesson_market_access_by_decree_why_2_desc: "[Concept('concept_sell_orders','Prodejní objednávky')] a [Concept('concept_buy_orders','nákupní objednávky')] určují standardní [Concept('concept_market_price','tržní cena')] používanou ve vašich [Concept('concept_market','trhu')]. Ale s méně než 100% [Concept('concept_market_access','přístup na trh')], [Concept('concept_state', '$concept_states$')] nebudou schopni plně využít trh. Některé lokálně vyráběné zboží může klesnout na ceně, zatímco zboží, jejichž poptávka nemůže být lokálně uspokojena, vzroste na ceně, ve vztahu k $concept_market_price$." # todo: CONCEPT CASE
 lesson_market_access_by_decree_why_2_back: "Zavřete panel Trh a vraťte se na Záložku Podrobnosti pro [GetTutorialJournalEntry.GetTarget.GetState.GetMarket.GetName]"
 lesson_market_access_by_decree_why_3: "$lesson_market_access_by_decree_why_1$"
 lesson_market_access_by_decree_why_3_desc: "Místní cenové podmínky mohou některým [Concept('concept_pop', '$concept_pops$')] dávat výhodu na úkor jiných. V [Concept('concept_state','státě')] s vysokou [GetGoods('grain').GetTextIcon][Nbsp][GetGoods('grain').GetName] produkci, ale špatným [Concept('concept_market_access','přístupem na trh')], se [GetGoods('grain').GetTextIcon][Nbsp][GetGoods('grain').GetName] prodá za nižší cenu než za [Concept('concept_market_price','tržní cenu')].\n\nZatímco to může usnadnit splnění [Concept('concept_pop_needs','potřeby populace')] nižší třída, také to omezuje [Concept('concept_building_wage', '$concept_building_wages$')], které [GetGoods('grain').GetTextIcon][Nbsp][GetGoods('grain').GetName]-produkující [Concept('concept_building', '$concept_buildings$')] mohou vyplácet. Dlouhodobě $concept_states$ se špatným [Concept('concept_market_access','přístupem na trh')] budou finančně zaostávat." # todo: CONCEPT CASE
 lesson_market_access_by_decree_why_4: "$lesson_market_access_by_decree_why_1$"
 lesson_market_access_by_decree_why_4_desc: "[Concept('concept_decree', '$concept_decrees$')] mohou být použity k uvalení účinku na [Concept('concept_state','stát')] na úkor @aut![Nbsp][Concept('concept_authority','autorita')]. Účinek zůstane pouze po dobu, po kterou $concept_decree$ zůstane v platnosti, takže se musíte pečlivě rozhodnout, které $concept_decrees$ použít, protože @aut![Nbsp]$concept_authority$ je omezený zdroj. Řešení nedostatku [Concept('concept_infrastructure','infrastruktury')] trvaleji vyžaduje jiné přístupy, které se později dozvíte." # todo: CONCEPT CASE
 lesson_market_access_with_railways_how_1: "Jak zlepšit $concept_market_access$ s železnicemi"
 lesson_market_access_with_railways_how_1_desc: "Železnice mohou být postaveny z [Concept('concept_production_lens','stavební čočky')]" # todo: CONCEPT CASE
 lesson_market_access_with_railways_how_1_continue: "Otevřete $concept_production_lens$, poté přejděte na záložku $development_lens_tab$"
 lesson_market_access_with_railways_how_2: "$lesson_market_access_with_railways_how_1$"
 lesson_market_access_with_railways_how_2_desc: "Najděte železnice a postavte je v [GetTutorialJournalEntry.GetTarget.GetState.GetName]."
 lesson_market_access_with_railways_how_2_continue: "Začněte budovat železnice v [GetTutorialJournalEntry.GetTarget.GetState.GetName]"
 lesson_market_access_with_railways_how_2_back: "Zavřete záložku $development_lens_tab$ v $concept_production_lens$ pro zpětné sledování"
 lesson_market_access_with_railways_how_3: "$lesson_market_access_with_railways_how_1$"
 lesson_market_access_with_railways_how_3_desc: "Skvělá práce! Konstrukce nyní probíhá.\n\nŽeleznice fungují jako většina ostatních [Concept('concept_building', '$concept_buildings$')]. Vyžadují čas a peníze na výstavbu, po které musí najímat [Concept('concept_pop', '$concept_pops$')] k provozování. Potřebují [GetGoods('engines').GetTextIcon] [GetGoods('engines').GetName] a nějaký druh paliva k provozu, a poskytují [GetGoods('transportation').GetTextIcon] [GetGoods('transportation').GetName] k prodeji na [Concept('concept_market','trh')]. "
 lesson_market_access_with_railways_how_3_continue: "Zavřete [Concept('concept_production_lens','stavební čočka')]"
 lesson_market_access_with_railways_how_3_back: "Zrušit výstavbu železnic v [GetTutorialJournalEntry.GetTarget.GetState.GetName] pro návrat zpět"
 lesson_market_access_with_railways_how_4: "$lesson_market_access_with_railways_how_1$"
 lesson_market_access_with_railways_how_4_desc: "Jak [Concept('concept_pop', '$concept_pops$')], tak ostatní [Concept('concept_building', '$concept_buildings$')] mohou kupovat [GetGoods('transportation').GetTextIcon] [GetGoods('transportation').GetName], aby splnili [Concept('concept_pop_needs','potřeby populace')] nebo jako součást [Concept('concept_production_method','výrobní metody')]. Pokud je však poptávka nízká a náklady na vstupní zboží vysoké, železnice se mohou snadno stát neproduktivními a ztratit zaměstnance kvůli nízkým [Concept('concept_building_wage', '$concept_building_wages$')]. Aby bylo zajištěno optimální přístup k železniční [Concept('concept_infrastructure','infrastruktuře')], možná budete muset [Concept('concept_subsidies', '$concept_subsidize$')] železnice - buď ve specifických [Concept('concept_state', '$concept_states$')] nebo najednou, pokud již nejsou dotovány." # todo: CONCEPT CASE
 lesson_market_access_with_railways_how_4_continue: "Otevřete panel $concept_buildings$, klikněte na záložku Rozvoj a zjistěte, jestli jsou železnice $concept_subsidized$"
 lesson_market_access_with_railways_how_4_back: "Otevřete [Concept('concept_production_lens','stavební čočka')], abyste se vrátili"
 lesson_market_access_with_railways_how_5: "$lesson_market_access_with_railways_how_1$"
 lesson_market_access_with_railways_how_5_desc: "Je možné, že po dokončení výstavby a plném zaměstnání železnice, [Concept('concept_state','stát')] [Concept('concept_infrastructure','infrastruktura')] bude stále nedostatečné v porovnání s [Concept('concept_infrastructure_usage','využitím infrastruktury')]. Pokud je tomu tak, můžete zkonstruovat další železnice, pokud zajistíte, že zůstanou ziskové, nebo je dotovat. Dále můžete také snížit státní budovy, které přispívají k nadměrnému $concept_infrastructure_usage$ v $concept_state$." # todo: CONCEPT CASE
 lesson_market_access_with_railways_how_5_back: "Zavřete záložku Rozvoj v panelu $concept_buildings$, abyste se vrátili"
 lesson_market_access_with_railways_why_1: "Proč zlepšit $concept_market_access$ pomocí železnic"
 lesson_market_access_with_railways_why_1_desc: "[Concept('concept_infrastructure','Infrastruktura')] je klíčový pro industrializaci. Většina [Concept('concept_building', '$concept_buildings$')] zvyšuje váš [Concept('concept_infrastructure_usage','využití infrastruktury')], přičemž těžší výrobní odvětví přidávají nejvíce. Mít [Concept('concept_market_access','přístup na trh')] pod 100% není vždy na konci světa, ale ovlivňuje jak [Concept('concept_local_price','místní cena')], tak [Concept('concept_market_price','tržní cena')] [Concept('concept_good', '$concept_goods$')], což způsobí, že bude průmysl dlouhodobě nekonkurenční."
 lesson_market_access_with_railways_why_2: "$lesson_market_access_with_railways_why_1$"
 lesson_market_access_with_railways_why_2_desc: "Malé nedostatky v [Concept('concept_infrastructure','infrastruktuře')] lze snadno řešit nařízením o údržbě silnic, ale to je v nejlepším případě dočasné řešení, protože [Concept('concept_authority','autorita')] je pro mnohé země těžko dosažitelné a nelze je použít všude ve větší zemi současně. Železnice jsou vždy lepší alternativou v dlouhodobém horizontu, pokud si můžete dovolit náklady na jejich výstavbu a pracovní sílu (a potenciálně dotace) potřebné k jejich provozu." # todo: CONCEPT CASE
 lesson_increase_immigration_how_1: "Jak zvýšit $concept_immigration$"
 lesson_increase_immigration_how_1_desc: "Stát [Concept('concept_state','stát')] se stane atraktivním cílem pro [Concept('concept_migration','migrace')], pokud je průměrný [Concept('concept_sol','životní standard')] vysoký. [Concept('concept_pop', '$concept_pops$')] se přesunou ze států s nižším [Concept('concept_migration_pull','migrační přitažlivostí')] do těch, které mají vyšší $concept_migration_pull$ v téže [Concept('concept_market','trhu')].\n\nExistuje několik režimů mapy [Concept('concept_migration','migrace')], které můžete aktivovat v seznamu režimů mapy vedle objektivů, které vám poskytnou přehled o tom, kde $concept_pops$ migrují. Nebojte se je prozkoumat a pokračujte, kdykoli budete hotovi." # todo: CONCEPT CASE
 lesson_increase_immigration_how_2: "$lesson_increase_immigration_how_1$"
 lesson_increase_immigration_how_2_desc: "Přejděte na jakýkoliv [Concept('concept_state','stát')], abyste viděli rozpad [Concept('concept_migration_pull','migrační přitažlivost')] tooltipu.\n\nAž budete hotovi se sledováním tooltipů $concept_migration_pull$, nalezněte [GetTutorialJournalEntry.GetTarget.GetState.GetName] na mapě."
 lesson_increase_immigration_how_2_continue: "Klikněte na [GetTutorialJournalEntry.GetTarget.GetState.GetName] a otevřete záložku Populace"
 lesson_increase_immigration_how_2_back: "Zavřete režim mapy [Concept('concept_migration', 'migrace')], abyste se vrátili"
 lesson_increase_immigration_how_3: "$lesson_increase_immigration_how_1$"
 lesson_increase_immigration_how_3_desc: "[Concept('concept_pop', '$concept_pop_possessive$')] [Concept('concept_sol','životní standard')] závisí na mnoha faktorech. Mezi nejdůležitější patří [Concept('concept_wealth','bohatství')], který zase závisí na tom, jak vysoké jsou jejich [Concept('concept_building_wage', '$concept_building_wages$')] ve srovnání s náklady na jejich [Concept('concept_pop_needs','potřeby populace')].\n\nNajděte průměrnou hodnotu $concept_sol$ u jakékoli ze skupin, abyste viděli, zda jsou nad nebo pod svým [Concept('concept_expected_sol','očekávaným minimálním životním standardem')]." # todo: CONCEPT CASE
 lesson_increase_immigration_how_3_back: "Zavřete kartu Počet obyvatel pro [GetTutorialJournalEntry.GetTarget.GetState.GetName], abyste se vrátili"
 lesson_increase_immigration_how_4: "$lesson_increase_immigration_how_1$"
 lesson_increase_immigration_how_4_desc: "Pokud je přirozený [Concept('concept_migration_pull','migrační přitažlivost')] státu [Concept('concept_state', '$concept_state_possessive$')] nedostatečný, můžete jej uměle zvýšit vydáním $decree_greener_grass_campaign$ $concept_decree$."
 lesson_increase_immigration_how_4_continue: "Vydat $decree_greener_grass_campaign$ $concept_decree$ v [GetTutorialJournalEntry.GetTarget.GetState.GetName]"
 lesson_increase_immigration_how_5: "$lesson_increase_immigration_how_1$"
 lesson_increase_immigration_how_5_desc: "Můžete vidět, jak velký dopad má $decree_greener_grass_campaign$ na [Concept('concept_migration_pull','migrační přitažlivost')] a předpovězenou migraci do/z [Concept('concept_state','státu')] v tooltipu pro přitažlivost migrace." # todo: CONCEPT CASE
 lesson_increase_immigration_how_5_back: "Odstraňte $decree_greener_grass_campaign$ $concept_decree$ v [GetTutorialJournalEntry.GetTarget.GetState.GetName], abyste se vrátili"
 lesson_increase_immigration_why_1: "Proč zvýšit $concept_immigration$"
 lesson_increase_immigration_why_1_desc: "Nejčastějším důvodem k podpoře [Concept('concept_migration','migrace')] do určité [Concept('concept_state','státu')] je zvýšení její pracovní síly pro účinnější využití svých zdrojů. Migrace se přirozeně vyskytuje, když se chudší [Concept('concept_pop', '$concept_pops$')] snaží najít lepší místa k životu a práci ve stejné [Concept('concept_market','trzích')]. Zásah do tohoto procesu pomocí [Concept('concept_law', '$concept_laws$')] nebo [Concept('concept_decree', '$concept_decrees$')] může urychlit, zpomalit nebo dokonce zvrátit migraci." # todo: CONCEPT CASE
 lesson_increase_immigration_why_1_continue: "Otevřete kartu [Concept('concept_culture', '$concept_cultures$')] v panelu společnosti"
 lesson_increase_immigration_why_2: "$lesson_increase_immigration_why_1$"
 lesson_increase_immigration_why_2_desc: "Vysoký [Concept('concept_migration_pull','migrační přitažlivost')] nejen že učiní [Concept('concept_state','stát')] atraktivnější destinací pro [Concept('concept_pop', '$concept_pops$')] ve stejném [Concept('concept_market','trhu')] a/nebo [Concept('concept_country','zemi')], ale také zvýší šanci, že bude náhodně vybrán jako [Concept('concept_migration_target','cíl migrace')] pro masový pohyb $concept_pops$ kultury [Concept('concept_culture', '$concept_cultures$')] s vysokým průměrným [Concept('concept_turmoil','nepokojem')]. Najedete na hodnotu $concept_turmoil$, aby jste viděli globální a národní $concept_turmoil$ této kultury." # todo: CONCEPT CASE
 lesson_increase_immigration_why_2_back: "Zavřete panel [Concept('concept_culture', '$concept_cultures$')] abyste se vrátili"
 lesson_increase_immigration_why_3: "$lesson_increase_immigration_why_1$"
 lesson_increase_immigration_why_3_desc: "Abychom zjistili, zda má určitá [Concept('concept_culture','kultura')] nějaké [Concept('concept_migration_target', '$concept_migration_targets$')], můžeme se podívat na tu konkrétní $concept_culture$." # todo: CONCEPT CASE
 lesson_increase_immigration_why_3_continue: "Klikněte na jakoukoli konkrétní $concept_culture$"
 lesson_increase_immigration_why_4: "$lesson_increase_immigration_why_1$"
 lesson_increase_immigration_why_4_desc: "Cílová [Concept('concept_culture', '$concept_culture_possessive$')] [Concept('concept_migration_target','cíl migrace')] funguje jako most, který umožňuje [Concept('concept_pop', '$concept_pops$')] této $concept_culture$ se tam přesunout, ať už jsou v jakémkoli [Concept('concept_market','trhu')]. $concept_pops$ se nebudou přesouvat do zahraničí, pokud na to nemají dobrý důvod. Pokud nemá $concept_pop$ jeho $concept_culture$ aktuální [Concept('concept_migration_targets','cíle migrace')], jsou jejich [Concept('concept_migration','migrace')] možnosti omezeny na státy v rámci stejného $concept_market$." # todo: CONCEPT CASE
 lesson_increase_immigration_why_4_back: "Zavřete konkrétní $concept_culture$, abyste se vrátili"
 lesson_increase_immigration_why_5: "$lesson_increase_immigration_why_1$"
 lesson_increase_immigration_why_5_desc: "Být vybrán jako [Concept('concept_migration_target','cíl migrace')] může mít silné účinky na vaši ekonomiku. Tyto účinky mohou být jak prospěšné, tak škodlivé, protože pracovní síla, poptávka po [Concept('concept_good', '$concept_goods$')] a [Concept('concept_turmoil','nepokoje')] all will increase." # todo: CONCEPT CASE
 lesson_grow_gdp_how_1: "Jak zvýšit své $concept_gdp$"
 lesson_grow_gdp_how_1_desc: "Nejjednodušší způsob, jak zvýšit váš [Concept('concept_gdp','hrubý domácí produkt')], je utratit peníze z [Concept('concept_treasury','státní pokladny')] nebo [Concept('concept_investment_pool','investičního fondu')] na rozšíření vašich produktivních budov nebo opravy těch, které jsou neproduktivní." # todo: CONCEPT CASE
 lesson_grow_gdp_how_2: "$lesson_grow_gdp_how_1$"
 lesson_grow_gdp_how_2_desc: "Jak se vaše ekonomika optimalizuje, vytváří se více [Concept('concept_wealth','bohatství')|l], což v průběhu času vede k větší [Concept('concept_good_consumption','spotřeby zboží')] [Concept('concept_pop','populace')]. Pokud může být zvýšená poptávka po [Concept('concept_good','zboží')] uspokojena místní [Concept('concept_good_production','výrobou')], tyto budovy budou ještě produktivnější. Pokud může být poptávka uspokojena pouze [Concept('concept_trade','obchodem')], $concept_pops$, kteří pracují v [GetBuildingType('building_trade_center').GetName] a ti, kteří to vyrábějí na exportním trhu, z toho mají prospěch."
 lesson_grow_gdp_how_3: "$lesson_grow_gdp_how_1$"
 lesson_grow_gdp_how_3_desc: "Nejrychlejší způsob, jak rozvinout vaše [Concept('concept_gdp','hrubý domácí produkt')], je obvykle vyrábět spotřebitelské [Concept('concept_good', '$concept_goods$')] s vysokou poptávkou z základních zdrojů. Pokud k těmto zdrojům nemáte přístup sami, můžete je dovážet z trhu, který k nim má přístup. To však znamená, že váš obchodní partner bude mít prospěch z vaší ekonomiky, což se také stává zranitelnějším vůči narušení nepřátelskou diplomacií nebo válkami, takže si pečlivě vyberte, s kým obchodujete!"
 lesson_grow_gdp_why_1: "Proč růst váš $concept_gdp$"
 lesson_grow_gdp_why_1_desc: "Váš [Concept('concept_gdp','hrubý domácí produkt')] je užitečným způsobem, jak změřit, jak silná je vaše ekonomika ve srovnání s ostatními. Zvyšování $concept_gdp$ znamená, že vaše [Concept('concept_pop','$concept_population$')] se nyní věnují více produktivním činnostem, což zvyšuje [Concept('concept_wealth','bohatství')] vaší země jako celku. To pak zvyšuje jak poptávku po zboží, tak i [Concept('concept_sol','životní standard')], což vytváří více ekonomických příležitostí a růst populace."
 lesson_grow_gdp_why_2: "$lesson_grow_gdp_why_1$"
 lesson_grow_gdp_why_2_desc: "[Concept('concept_gdp','Hrubý domácí produkt')] není pouze metrikou, ale ovlivňuje mnoho dalších faktorů.\n\n* Generuje [Concept('concept_prestige','prestiž')]\n* Umožňuje vám dělat více [Concept('concept_budget_minting','ražba mincí')]\n* V [Concept('concept_customs_union','celní unii')] určuje váš [Concept('concept_market_share','tržní podíl')]." # todo: CONCEPT CASE
 lesson_grow_gdp_complete: "Váš $concept_gdp$ vzrostl!"
 lesson_grow_gdp_complete_desc: "Prokázali jste, že jste schopni růst ekonomiky vaší země. Jak se budeme zabývat dalšími aspekty, jako je politika a diplomacie, nezapomeňte pokračovat v expanze v produktivních směrech, abyste nezůstali pozadu! Růst vašeho [Concept('concept_gdp','hrubého domácího produktu')] nejen zvýší vaše [Concept('concept_wealth','bohatství')], [Concept('concept_sol','životní standard')] a [Concept('concept_pop_growth','populační růst')], ale také váš [Concept('concept_prestige','prestiž')], který ovlivňuje vaši [Concept('concept_rank','hodnost')], [Concept('concept_interest','zájem')] a schopnost zapojit se do diplomacie." # todo: CONCEPT CASE
 lesson_enact_institution_law_how_1: "Jak získat $concept_institution$"
 lesson_enact_institution_law_how_1_desc: "Můžete vidět, které [Concept('concept_law','$concept_laws$')] můžete přijmout, vaše šance na úspěch a jejich účinky na každém konkrétním panelu [Concept('concept_law_group','skupiny zákonů')]. Najdete je na záložce #b $concept_laws$#! panelu #b Politika#!." # todo: CONCEPT CASE
 lesson_enact_institution_law_how_1_continue: "Klikněte na [GetTutorialJournalEntry.GetTarget.GetLawType.GetGroup.GetName] $concept_law_group$ pod záložkou $concept_laws$ na panelu politiky"
 lesson_enact_institution_law_how_2: "$lesson_enact_institution_law_how_1$"
 lesson_enact_institution_law_how_2_desc: "Váš aktuální [Concept('concept_law','zákon')] v kategorii [GetTutorialJournalEntry.GetTarget.GetLawType.GetGroup.GetName] je [GetTutorialJournalEntry.GetTarget.GetLawType.GetName]. Tento $concept_law$ zakazuje [GetTutorialJournalEntry.GetTarget.GetLawType.GetGroup.GetFirstInstitutionType.GetName] [Concept('concept_institution','instituce')], takže musíme schválit alternativu, abychom k němu získali přístup.\n\nJakýkoli jiný $concept_laws$ v kategorii nám poskytne požadované $concept_institution$, ale různé $concept_laws$ mají různé dopady jak na vaši [Concept('concept_country','zemi')], tak na $concept_institution$. Máte-li více než jednu možnost, prozkoumejte účinky, než se rozhodnete, kterou schválíte." # todo: CONCEPT CASE
 lesson_enact_institution_law_how_2_back: "Zavřete [GetTutorialJournalEntry.GetTarget.GetLawType.GetGroup.GetName] $concept_law_group$ pro návrat zpět"
 lesson_enact_institution_law_how_3: "$lesson_enact_institution_law_how_1$"
 lesson_enact_institution_law_how_3_desc: "Abyste se pokusili o přijetí [Concept('concept_law','zákon')], musí mít podporu alespoň jedné vládní [Concept('concept_interest_group','zájmová skupina')] nebo aktuálně aktivního [Concept('concept_political_movement','politického hnutí')].\n\nSchopnost vaší současné [Concept('concept_government','vláda')] přijmout $concept_law$ se měří šancí, že $concept_law$ projde, tedy vaší so-called [Concept('concept_enactment_success','úspěšné uzákonění zákona')] šancí. Pokud byste na první pokus neuspěli, dojde k jinému incidentu, jehož výsledek může zvýšit nebo snížit vaše šance na úspěch při dalším pokusu. Doba mezi pokusy je určena vaší [Concept('concept_legitimacy','legitimitou')]." # todo: CONCEPT CASE
 lesson_enact_institution_law_how_4: "$lesson_enact_institution_law_how_1$"
 lesson_enact_institution_law_how_4_desc: "Vyberte jiný [GetTutorialJournalEntry.GetTarget.GetLawType.GetGroup.GetName] [Concept('concept_law','zákon')] a začněte ho schvalovat.\n\n@information! Pokud nemůžete schválit žádný $concept_law$, musíte dostat [Concept('concept_interest_group','zájmová skupina')], která [Concept('concept_endorse_oppose','$concept_endorse$')] jakýkoli z $concept_laws$ [Concept('concept_in_government','ve vládě')]."
 lesson_enact_institution_law_how_4_continue: "Začněte schvalovat cokoliv jiného než [GetTutorialJournalEntry.GetTarget.GetLawType.GetName]"
 lesson_enact_institution_law_how_5: "$lesson_enact_institution_law_how_1$"
 lesson_enact_institution_law_how_5_desc: "[Concept('concept_law', '$concept_laws$')] se neschvalují [Concept('concept_enactment_of_laws', '$concept_enactment_of_laws_enacted$')] okamžitě. Bude potřeba projít cykly, ve kterých možná budete muset zasáhnout, abyste zvýšili šanci [Concept('concept_enactment_success','úspěšné uzákonění zákona')], že zákon projde."
 lesson_enact_institution_law_how_5_back: "Zrušit přijetí zákona, abyste se vrátili"
 lesson_enact_institution_law_why_1: "Proč získat $concept_institution$"
 lesson_enact_institution_law_why_1_desc: "Můžete vidět, které [Concept('concept_law','$concept_laws$')] můžete schválit, vaše šance na úspěch a jejich účinky na"
 lesson_enact_institution_law_why_1_continue: "Otevřete záložku $concept_laws$ na panelu politiky"
 lesson_enact_institution_law_why_2: "$lesson_enact_institution_law_why_1$"
 lesson_enact_institution_law_why_2_desc: "[Concept('concept_law','$concept_laws$')] určují základní provozní principy vašeho [Concept('concept_country','$concept_country_possessive$')], od toho, kdo drží moc a jak jsou vaše byrokracie organizovány, po to, jak získává a utrácí své [Concept('concept_money','peníze')], a jaká práva má různorodá část [Concept('concept_pop','$concept_population$')]. Přetváření vašich $concept_laws$ tak, aby držely krok s dobou, je nutností, nejen z praktických důvodů, ale také abyste se vyhnuli tomu, aby se vaše $concept_population$ vzbouřila proti vám."
 lesson_enact_institution_law_why_2_back: "Zavřete záložku $concept_laws$ na panelu politiky"
 lesson_enact_institution_law_why_3: "$lesson_enact_institution_law_why_1$"
 lesson_enact_institution_law_why_3_desc: "Můžete vidět své aktuální [Concept('concept_institution','$concept_institutions$')] na záložce $concept_institution$."
 lesson_enact_institution_law_why_3_continue: "Otevřete záložku $concept_institutions$ na panelu Politika"
 lesson_enact_institution_law_why_4: "$lesson_enact_institution_law_why_1$"
 lesson_enact_institution_law_why_4_desc: "[Concept('concept_institution','$concept_institutions$')] se používají k poskytování výhod pro váš národ nebo dodatečné pravomoci pro vás. Přitom používají @bur![Nbsp][Concept('concept_bureaucracy','byrokracie')], což se promítá do výdajů pro [Concept('concept_treasury','státní pokladnu')] v závislosti na velikosti vaší [Concept('concept_incorporated_state', '$concept_incorporated$')] populace. K vytvoření nové $concept_institution$ musíte přijmout [Concept('concept_law','zákon')], který umožňuje její vznik." # todo: CONCEPT CASE
 lesson_enact_institution_law_why_4_back: "Zavřít záložku $concept_institutions$ pro návrat"
 lesson_enact_institution_law_why_5: "$lesson_enact_institution_law_why_1$"
 lesson_enact_institution_law_why_5_desc: "Mějte na paměti, že schválení [Concept('concept_law','$concept_laws$')] s mnoha odpory mezi obyvatelstvem může být obtížný a nebezpečný proces. Některé $concept_laws$ mohou vyžadovat mnoho důvtipu a státní správy, aby prošly legislativou."
 lesson_enact_institution_law_complete: "Nové $concept_institution$ k dispozici!"
 lesson_enact_institution_law_complete_desc: "Úspěšně jste reformovali první z mnoha [Concept('concept_law','$concept_laws$')] na cestě vaší země skrze viktoriánskou éru! Postupem času se naučíte, které kombinace vládních [Concept('concept_interest_group','$concept_interest_groups$')], [Concept('concept_clout','politického vlivu')], [Concept('concept_legitimacy','legitimity')], a [Concept('concept_political_movement', '$concept_political_movements$')] poskytují nejlepší příležitosti k přijetí $concept_laws$, které si přejete. Do té doby se nebojte experimentovat!" # todo: CONCEPT CASE
 lesson_reform_government_how_1: "Jak reformovat svou vládu"
 lesson_reform_government_how_1_desc: "Můžete vidět aktuální složení vaší vlády na panelu #b $concept_government_reform$#! v panelu #b Politika#!."
 lesson_reform_government_how_1_continue: "Otevřete záložku $concept_government_reform$ na panelu politiky"
 lesson_reform_government_how_1_back: "Panel vlády musí být zavřen, abyste se vrátili"
 lesson_reform_government_how_2: "$lesson_reform_government_how_1$"
 lesson_reform_government_how_2_desc: "Chcete-li reformovat vaši vládu, stiskněte tlačítko Reform Government."
 lesson_reform_government_how_3: "$lesson_reform_government_how_1$"
 lesson_reform_government_how_3_desc: "Zde můžete experimentovat s různými konfiguracemi podle libosti. Žádná změna se neprojeví, dokud nepotvrdíte novou vládu. Můžete také resetovat své změny, abyste se vrátili k počáteční konfiguraci."
 lesson_reform_government_how_4: "$lesson_reform_government_how_1$"
 lesson_reform_government_how_4_desc: "Zde vidíte faktory určující vaši legitimitu na základě vašich aktuálních zákonů a jak aktuální návrh vlády ovlivňuje."
 lesson_reform_government_how_5: "$lesson_reform_government_how_1$"
 lesson_reform_government_how_5_desc: "Vyloučení zájmových skupin, které byly u moci, způsobí radikalismus v jejich řadách. Příliš časté reformování vaší vlády může způsobit významnou politickou nestabilitu.\n\nVaše první reforma hned po demokratických volbách nezpůsobí žádný radikalismus. Využijte tuto příležitost k vybudování efektivní vlády na zbytek volebního období."
 lesson_reform_government_how_6: "$lesson_reform_government_how_1$"
 lesson_reform_government_how_6_desc: "Legitimita ovlivňuje pouze to, jak efektivně vaše vláda funguje, ne to, co je schopná dosáhnout. Pokud neexistuje politický pohyb, který by podporoval zákon, musí mít v podporu alespoň jednoho zájmového hnutí ve vládě, pokud má být enacted. Zákony, které je nová vláda ochotna přijmout, jsou uvedeny při jejím koncipování, takže zajistěte, že máte jak správnou směs zájmových skupin, tak dostatečnou legitimitu, abyste to dokázali během nadcházejícího období."
 lesson_reform_government_how_7: "$lesson_reform_government_how_1$"
 lesson_reform_government_how_7_desc: "Zájmové skupiny mohou být přesouvány dovnitř a ven z vlády. Pokud je zájmová skupina členem strany v demokratickém volebním systému, celá strana musí být buď ve vládě nebo mimo ni.\n\nZjistěte, zda můžete reformovat svou vládu tak, abyste měli více než #v 60#! [Concept('concept_legitimacy','legitimity')]. Pokud ne, vraťte se později a zkuste to znovu." # todo: CONCEPT CASE
 lesson_reform_government_complete: "$lesson_reform_government_how_1$"
 lesson_reform_government_complete_desc: "Vaše nová vláda má mnohem rozumnější [Concept('concept_legitimacy','legitimita')] skóre [GetPlayer.GetGovernmentLegitimacy], což jí umožňuje pokusit se schválit nové zákony každých [GetDefine('NPolitics','LAW_ENACTMENT_COOLDOWN_DAYS')|0] dnů. Doufejme, že také bude schopna provést politické změny, které si přejete! Pokud ne, můžete vždy provést změny ve své vládě, pokud jste ochotni zaplatit cenu v legitimnosti a/nebo radikalismu."
 lesson_increase_relations_how_0: "Nemůžete zlepšit vztahy"
 lesson_increase_relations_how_0_desc: "Potřebujete alespoň"
 lesson_increase_relations_how_0_continue: "Mějte k dispozici alespoň #v [GetDiplomaticActionType('increase_relations').GetMaintenanceCostFormatted(GetPlayer.Self, GetTutorialJournalEntry.GetTarget.GetCountry.Self)]#! @inf![Nbsp][Concept('concept_influence','vliv')]"
 lesson_increase_relations_how_1: "Jak zlepšit vztahy"
 lesson_increase_relations_how_1_desc: "[GetDiplomaticActionType('increase_relations').GetName] je typ [Concept('concept_diplomatic_pact','diplomatický pakt')] a lze ho najít pod #b Diplomacie#! čočkou."
 lesson_increase_relations_how_1_continue: "Vyberte [GetDiplomaticActionType('increase_relations').GetName] pod #b Diplomatickými akcemi#! v #b Diplomacii#! čočce"
 lesson_increase_relations_how_2: "$lesson_increase_relations_how_1$"
 lesson_increase_relations_how_2_desc: "Chceme [GetDiplomaticActionType('increase_relations').GetName] s [GetTutorialJournalEntry.GetTarget.GetCountry.GetAltAdjective('I')]. Většina [Concept('concept_diplomatic_pact','$concept_diplomatic_pacts$')] vyžaduje @inf![Nbsp][Concept('concept_influence','vliv')] k udržení, a můžeme vidět, kolik by nás to předem stálo." # todo: CONCEPT CASE
 lesson_increase_relations_how_2_continue: "Najděte a klikněte na [GetTutorialJournalEntry.GetTarget.GetCountry.GetAltAdjective('A')] na mapě nebo na @map_list_plus_small! tlačítko plus v seznamu map pro zahájení zvyšování vztahů s vašimi $concept_countries$" # todo: CONCEPT CASE
 lesson_increase_relations_how_2_back: "Zavřete #b Diplomacie#! objektiv, abyste se vrátili."
 lesson_increase_relations_how_3: "$lesson_increase_relations_how_1$"
 lesson_increase_relations_how_3_desc: "Některé [Concept('concept_diplomatic_pact','$concept_diplomatic_pacts$')] vyžadují schválení druhé strany, a v takovém případě by byla vaše žádost odeslána a vrácena o několik týdnů později s pozitivní nebo negativní odpovědí. Obvykle můžete říct, zda by země přijala $concept_diplomatic_pact$ před jeho odesláním.\n\n[GetDiplomaticActionType('increase_relations').GetName] nevyžaduje schválení a obě země by mohly vlastně [GetDiplomaticActionType('increase_relations').GetName] (nebo [GetDiplomaticActionType('damage_relations').GetName]!) ve stejnou dobu."
 lesson_increase_relations_how_3_back: "Zrušit [GetDiplomaticActionType('increase_relations').GetName] s [GetTutorialJournalEntry.GetTarget.GetCountry.GetAltAdjective('I')], abyste se vrátili" # todo: CONCEPT CASE
 lesson_increase_relations_why_1: "Proč zvýšit vztahy"
 lesson_increase_relations_why_1_desc: "Utrácení svého @inf![Nbsp][Concept('concept_influence','vlivu')] na udržování [Concept('concept_diplomatic_pact', '$concept_diplomatic_pacts$')] se strategicky vybranými zeměmi je klíčové pro zvýšení vaší měkké moci a rozšíření vašeho vlivu. Zvyšování [Concept('concept_relations','vztahy')] nejenže je povzbuzuje, aby vás podporovaly v konfliktech, ale také vám umožňuje uzavřít další $concept_diplomatic_pacts$ s nimi." # todo: CONCEPT CASE
 lesson_increase_relations_why_1_continue: "Otevřete jakoukoliv $concept_country$'s"
 lesson_increase_relations_why_2: "$lesson_increase_relations_why_1$"
 lesson_increase_relations_why_2_desc: "Zde můžete vidět všechny [Concept('concept_diplomatic_action', '$concept_diplomatic_actions$')] které můžete podniknout proti zemi, a zda by byly ochotny akceptovat nabídku, pokud to vyžaduje jejich schválení. Některé $concept_diplomatic_actions$ vyžadují určité úrovně [Concept('concept_relations','vztahů')] - ne vždy pozitivní!\n\nJe obvyklé, že některé [Concept('concept_diplomatic_pact', '$concept_diplomatic_pacts$')] vyžadují určitou úroveň $concept_relations$ nebo lepší, takže zajistěte jejich udržení." # todo: CONCEPT CASE
 lesson_increase_relations_why_2_back: "Zavřít $concept_country$'s"
 lesson_increase_relations_why_3: "$lesson_increase_relations_why_1$„je_tutorial_expand_productive_building_goal:0 ‚Úroveň [JournalEntry.GetTotalGoalValue|v0] [JournalEntry.GetTarget.GetBuilding.GetName] v [JournalEntry.GetTarget.GetBuilding.GetState.GetName] (aktuálně úroveň [JournalEntry.CalcCurrentGoalValue|v0])"
 lesson_increase_relations_why_3_desc: "[Concept('concept_relations','Vztahy')] přirozeně [Concept('concept_decay','odeznívaným')] směrem k" # todo: CONCEPT CASE
 lesson_increase_relations_complete: "Vztahy se zlepšili!"
 lesson_increase_relations_complete_desc: "Úspěšným zlepšením [Concept('concept_relations', 'vztahů')] s vaším protějškem, nyní můžete zvolit, zda chcete udržovat tento [GetDiplomaticActionType('increase_relations').GetName] [Concept('concept_diplomatic_pact','diplomatický pakt')], nebo ho zrušit, abyste získali více @inf![Nbsp][Concept('concept_influence','vliv')] pro jiné záležitosti. Pamatujte, že pokud žádná země nepracuje na vašich vzájemných $concept_relations$, postupně se to [Concept('concept_decay','odeznívaným')] směrem k #b Neutrálnímu#!." # todo: CONCEPT CASE
 lesson_expand_military_how_1: "Jak rozšířit svou armádu"
 lesson_expand_military_how_1_desc: "Vaše vojenské síly jsou vytvářeny a udržovány [Concept('concept_military_building','$concept_military_buildings$')]. Rozšiřování vaší armády znamená jednoduše rozšiřování těchto budov.\n\nNa rozdíl od jiných budov se však tyto budují na specifické záložce Formace."
 lesson_expand_military_how_1_continue: "Otevřete panel #b Vojenský#!"
 lesson_expand_military_how_2: "$lesson_expand_military_how_1$"
 lesson_expand_military_how_2_desc: "Kasárna vytvářejí a udržují [Concept('concept_battalion', '$concept_battalions$')], které tvoří vaši [Concept('concept_army','armádu')]. K batalionům velí [Concept('concept_general', '$concept_generals$')] k postupu nebo obraně [Concept('concept_front', '$concept_fronts$')] a jsou používány k ochraně integrity vašich hranic tím, že jsou rozmístěny na frontové linii.\n\nBez ohledu na batalion, který chcete rekrutovat, vždy vybuduje kasárna.\n\nUvnitř panelu [Concept('concept_military_formation','formace')] najdete tlačítka pro stavbu nových kasáren pro různé typy jednotek: pěchota, dělostřelectvo a kavalerie." # todo: CONCEPT CASE
 lesson_expand_military_how_2_continue: "Otevřete [GetTutorialJournalEntry.GetTarget.GetMilitaryFormation.GetName] formaci, abyste pokračovali a naverbovali jednotky"
 lesson_expand_military_how_2_back: "Zavřete"
 lesson_expand_military_how_3: "$lesson_expand_military_how_1$"
 lesson_expand_military_how_3_desc: "Jako všechny budovy, [Concept('concept_military_building','$concept_military_buildings$')] jsou stavěny v [Concept('concept_state','$concept_states$')], ale [Concept('concept_unit','$concept_units_short$')] které poskytují, budou přiřazeny k [Concept('concept_military_formation','formaci')], ze které byla postavena, a mohou být později převedeny na jiné formace. Ujistěte se, že vaše armáda pochází ze států, kde můžete šetřit [Concept('concept_workforce','pracovní síla')], ale stále máte dobrý přístup k [Concept('concept_infrastructure','infrastruktuře')] a [Concept('concept_military_good','$concept_military_goods$')].\n\nUjistěte se, že náklady na vaši rozšířenou armádu jsou větší než je vaše [Concept('concept_treasury','státní pokladna')]! Pokud váš rozpočet není vyrovnaný, čekejte se zpětnou expanze, dokud neprovedete nezbytná vylepšení." # todo: CONCEPT CASE
 lesson_expand_military_how_3_continue: "Začněte expanze v jakémkoli [Concept('concept_state','státě')] pro pokračování" # todo: CONCEPT CASE
 lesson_expand_military_how_3_back: "Zavřete "
 lesson_expand_military_why_1: "Proč rozšiřovat svou armádu"
 lesson_expand_military_why_1_desc: "Jednoduše řečeno, [Concept('concept_country','země')] bez armády se nedokáže bránit a proto nemůže zaručit svou vlastní existenci. I když je možné se chránit před agresí přislíbením jako [Concept('concept_protectorate','protektorát')] zemi s vysokým [Concept('concept_rank','hodností')], nebo dokonce udržováním dobrých [Concept('concept_relations','vztahů')] s zeměmi, které mají [Concept('concept_interest','$concept_interests$')] překrývající se s vašimi, pokud doufáte, že se stanete významným hráčem na světové scéně, potřebujete podpořit vaši diplomacii něčím hmatatelným." # todo: CONCEPT CASE
 lesson_expand_military_why_2: "$lesson_expand_military_why_1$"
 lesson_expand_military_why_2_desc: "Každá [Concept('concept_unit','vojenská jednotka')] přispívá k vašemu [Concept('concept_power_projection','projekci síly')], což se přímo překládá do [Concept('concept_prestige','prestiže')]. Velká armáda může být drahá na údržbu, ale také ovlivňuje, jak schopní jste a jak důvěryhodní se zdáte.\n\n@ships! [Concept('concept_ship','$concept_ships$')] zlepšují váš $concept_power_projection$ více než @battalions![Nbsp][Concept('concept_battalion','$concept_battalions$')] , ale také mohou být nákladné na údržbu." # todo: CONCEPT CASE
 lesson_expand_military_why_3: "$lesson_expand_military_why_1$"
 lesson_expand_military_why_3_desc: "Mít silnou ekonomiku je nutné k udržení silné armády. Jak [Concept('concept_military_wage','$concept_military_wages$')], tak [Concept('concept_military_good','$concept_military_goods$')] mohou být významné výdaje, zejména v době [Concept('concept_war','válce')] v důsledku [Concept('concept_mobilize_battalion','$concept_mobilize_battalion_mobilization$')]. Zajistěte, aby vaše odvětví byla schopna vyrábět potřebné vybavení, nebo abyste měli spolehlivé obchodní partnery!\n\nMůže být lákavé spoléhat se na [Concept('concept_conscription_center','$concept_conscription$')] pro zvyšování @battalions![Nbsp][Concept('concept_battalion','$concept_battalions$')] podle potřeby, ale mějte na paměti, že noví vojáci jsou rekrutováni z vaší běžné [Concept('concept_workforce','pracovní síly')] a vaše ekonomika může být narušena neočekávanými způsoby. Stálá armáda může být dražší, ale je dlouhodobě udržitelnější a poskytuje [Concept('concept_power_projection','projekce síly')] v mírovém období." # todo: CONCEPT CASE
 lesson_expand_military_complete: "Vaše armáda se rozrostla!"
 lesson_expand_military_complete_desc: "Vaše armáda je nyní schopnější! To se jistě hodí do budoucna, ať už z důvodů obrany, agresivních nebo diplomatických. Jak vaše země získává moc, měli byste se občas vrátit k armádním silám, abyste zajistili, že mají odpovídající velikost a mohou konkurovat globálně. Také získáte přístup k [Concept('concept_technology', '$concept_technologies$')] které vám umožňují modernizovat své síly výměnou za větší [Concept('concept_good_consumption','spotřebu')] [Concept('concept_military_good','$concept_military_goods$')] ." # todo: CONCEPT CASE
 lesson_fix_capacity_deficit_how: "Jak opravit deficit kapacity"
 lesson_fix_capacity_deficit_how_1: "Jak opravit deficit kapacity"
 lesson_fix_capacity_deficit_how_1_desc: "Podobně jako váš rozpočet mají vaše tři [Concept('concept_capacity','$concept_capacities$')] příjmy a výdaje. Hodnota, kterou vidíte v horní části obrazovky, je velikost vašeho nadbytku nebo deficitu. Místo akumulace je zůstatek převeden na pozitivní účinek, pokud je nad nulou, a na negativní účinek, pokud je pod nulou.\n\nNegativní účinek je mnohem závažnější než pozitivní, takže je obvykle lepší alokovat své $concept_capacities$ až na limit než udržovat vysoký pozitivní zůstatek. Nicméně, je vždy velmi špatné mít deficit a budete chtít to co nejdříve napravit."
 lesson_fix_capacity_deficit_how_2: "$lesson_fix_capacity_deficit_how_1$"
 lesson_fix_capacity_deficit_how_2_desc: "Abyste vyřešili svůj deficit, musíte vzít v úvahu své příjmy a výdaje, a buď zvýšit generaci [Concept('concept_capacity','kapacit')], snížit její alokaci, nebo obojí. Přejití myší nad kapacitu zobrazí přispívající faktory. Projdeme si každou z nich postupně." # todo: CONCEPT CASE
 lesson_fix_capacity_deficit_how_3: "$lesson_fix_capacity_deficit_how_1$"
 lesson_fix_capacity_deficit_how_3_desc: "Začněte pohybem myši nad @bur![Nbsp][Concept('concept_bureaucracy','byrokracií')].\n\n@bur![Nbsp]$concept_bureaucracy$ je primárně generováno [SelectLocalization(GetPlayer.IsValid,'lesson_fix_capacity_deficit_how_3_desc_added','Government Administration')], a generování více může být zcela jednoduché, jen musíte postavit více těchto.\n\nJe vynakládáno na udržení efektivity sběru [Concept('concept_taxes','$concept_tax$')] napříč vašimi [Concept('concept_incorporated_state','$concept_incorporated_states$')], a tento náklad se zvyšuje velikostí vaší populace. Navíc každá [Concept('concept_institution','instituce')] [Concept('concept_investment_level','úroveň investice')] stojí určité množství @bur![Nbsp]$concept_bureaucracy$ v závislosti na velikosti vaší $concept_incorporated$ populace.\n\nKromě toho @bur![Nbsp]$concept_bureaucracy$ se alokuje na udržování [Concept('concept_commander','$concept_commanders$')], přičemž vyšší [Concept('concept_commander_rank','hodnost velitele')] vyžaduje více $concept_bureaucracy$." # todo: CONCEPT CASE
 lesson_fix_capacity_deficit_how_3_desc_added: "[GetBuildingType('building_government_administration').GetName]"
 lesson_fix_capacity_deficit_how_4: "$lesson_fix_capacity_deficit_how_1$"
 lesson_fix_capacity_deficit_how_4_desc: "Udržování @bur![Nbsp][Concept('concept_bureaucracy','byrokracie')] přebytku zvyšuje @construction![Nbsp][Concept('concept_construction','výstavba')] efektivitu, což vám umožní získat lepší hodnotu za peníze z vašich [SelectLocalization(GetPlayer.IsValid,'lesson_fix_capacity_deficit_how_4_desc_added','Stavební sektor')].\n\nPokud běžíte deficit, vzniká vám [Concept('concept_tax_waste','daňové plýtvání')], což může rychle potopit vaši ekonomiku.\n\nZatímco stavění dalších [SelectLocalization(GetPlayer.IsValid,'lesson_fix_capacity_deficit_how_4_desc_added_2','Vládní administrativa')] nebo jejich přepínání na efektivnější [Concept('concept_production_method','$concept_production_methods$')] je obvykle nejlepší způsob, jak vyřešit @bur![Nbsp][Concept('concept_bureaucracy','byrokracie')] deficit, pokud to není možné, můžete vždy snížit [Concept('concept_institution','$concept_institution_possessive$')] [Concept('concept_investment_level','úroveň investice')] nebo odejít z [Concept('concept_commander','velitele')]." # todo: CONCEPT CASE
 lesson_fix_capacity_deficit_how_4_desc_added: "[GetBuildingType('building_construction_sector').GetName]"
 lesson_fix_capacity_deficit_how_4_desc_added_2: "[GetBuildingType('building_government_administration').GetName]"
 lesson_fix_capacity_deficit_how_5: "$lesson_fix_capacity_deficit_how_1$"
 lesson_fix_capacity_deficit_how_5_desc: "Nejprve se podíváme na @aut![Nbsp][Concept('concept_authority','autoritu')], takže na něj přejeďte, abyste viděli jeho rozpad.\n\n@aut![Nbsp]$concept_authority$ pochází z [Concept('concept_law', '$concept_laws$')], zejména méně liberálních.\n\nJe přidělováno k vymáhání [Concept('concept_consumption_tax', '$concept_consumption_taxes$')] na [Concept('concept_pop_needs','potřeby populace')], prosadit svou vůli na vaše [Concept('concept_pop', '$concept_population$')] pomocí [Concept('concept_decree', '$concept_decrees$')], [Concept('concept_suppress','potlačení')] a [Concept('concept_bolster','posílení')] [Concept('concept_interest_group', '$concept_interest_groups$')], a podobné akce." # todo: CONCEPT CASE
 lesson_fix_capacity_deficit_how_6: "$lesson_fix_capacity_deficit_how_1$"
 lesson_fix_capacity_deficit_how_6_desc: "Udržování @aut![Nbsp][Concept('concept_authority','autorita')] nadbytek zvyšuje vaši legislativní efektivitu, což vám umožní rychleji [Concept('concept_enactment_of_laws','$concept_enactment_of_laws_enact$')] [Concept('concept_law','$concept_laws$')] (i když ne nutně snazší).\n\nPokud máte deficit [Concept('concept_authority','autorita')], sníží se [Concept('concept_approval','spokojenost')] [Concept('concept_interest_group','$concept_interest_groups$')] [Concept('concept_in_opposition','v opozici')], což způsobí aktivaci negativních [Concept('concept_interest_group_trait','$concept_interest_group_traits$')], častější a [Concept('concept_radical','radikál')] [Concept('concept_political_movement','$concept_political_movements$')], možná dokonce [Concept('concept_revolution','revoluce')].\n\nPřijetí přísnějších $concept_laws$ je jedním ze způsobů, jak zvýšit generaci @aut![Nbsp][Concept('concept_authority','autority')], ale když už máte deficit, může být bezpečnější za krátký čas zrušit [Concept('concept_decree','dekret')] nebo dokonce vydat dočasné uvolnění [Concept('concept_consumption_tax','spotřební daň')]." # todo: CONCEPT CASE
 lesson_fix_capacity_deficit_how_7: "$lesson_fix_capacity_deficit_how_1$"
 lesson_fix_capacity_deficit_how_7_desc: "Konečně se podívejme na @inf![Nbsp][Concept('concept_influence','vliv')] a zjistíme jeho přílivy a odlivy.\n\n@inf![Nbsp]$concept_influence$ pochází především z vaší [Concept('concept_rank','hodnosti')], což je důsledek vašeho relativního [Concept('concept_prestige','prestiže')]. Také můžete získat @inf![Nbsp]$concept_influence$ z [Concept('concept_rivalry','$concept_rivalries$')], kde každé překrývající se [Concept('concept_interest','zájem')] přináší malé množství.\n\nJe rozděleno na udržení [Concept('concept_diplomatic_pact','$concept_diplomatic_pacts$')], včetně vztahů [Concept('concept_subject','závislé země')]. Ovlivňování [Concept('concept_country','$concept_countries$')] s vyššími [Concept('concept_rank','hodnostmi')] obvykle vyžaduje dodatečné @inf!$concept_influence$." # todo: CONCEPT CASE
 lesson_fix_capacity_deficit_how_8: "$lesson_fix_capacity_deficit_how_1$"
 lesson_fix_capacity_deficit_how_8_desc: "Udržování @inf![Nbsp][Concept('concept_influence','vliv')] nadměrného množství zvyšuje vaši [concept_infamy] [Concept('concept_decay','odeznívané')], což pomáhá zvládat následky zahájení a vyjednávání nároků ve [Concept('concept_diplomatic_play','$concept_diplomatic_plays$')].\n\nDohled nad deficitem může být katastrofální, protože penalizuje vaši [Concept('concept_prestige','prestiž')], což zase může ovlivnit vaši [Concept('concept_rank','hodnost')] a způsobit pokles generace @inf![Nbsp]$concept_influence$." # todo: CONCEPT CASE
 lesson_fix_capacity_deficit_how_9: "$lesson_fix_capacity_deficit_how_1$"
 lesson_fix_capacity_deficit_how_9_desc: "Použijte informace z předchozích kroků, abyste přivedli rovnováhu relevantní [Concept('concept_capacity','kapacita')] nad nulu. V závislosti na vašem přístupu to může trvat chvíli; to je v pořádku, pokud máte na paměti důsledky a jdete správným směrem.\n\nHodně štěstí!"
 lesson_fix_capacity_deficit_complete: "Vaše [Concept('concept_capacity','kapacita')] se vrátila do pozitivní bilance!"
 lesson_fix_capacity_deficit_complete_desc: "Skvělá práce! Udržení alespoň malého nadbytku v každé [Concept('concept_capacity','kapacitě')] je vždy dobrý nápad, protože vás chrání před neočekávanými deficity a dává vám malý bonus. Ale nepřehánějte to, protože výhoda, kterou získáte alokací $concept_capacity$, je obvykle cennější než bonus, který získáte z nadbytku, a často je možné odvolat alokace, abyste se vrátili do kladného zůstatku." # todo: CONCEPT CASE
 lesson_recruit_promote_commander_how_1: "Jak naverbovat velitele"
 lesson_recruit_promote_commander_how_1_desc: "Nové [Concept('concept_commander','$concept_commanders$')] lze naverbovat na jakémkoli informačním panelu [Concept('concept_military_formation','$concept_military_formation_possessive$')], buď v [Concept('concept_army','armádě')], nebo v [Concept('concept_fleet','loďstvu')]." # todo: CONCEPT CASE
 lesson_recruit_promote_commander_how_1_continue: "Otevřete jakoukoli záložku $concept_military_formation_possessive$"
 lesson_recruit_promote_commander_how_2: "$lesson_recruit_promote_commander_how_1$"
 lesson_recruit_promote_commander_how_2_desc: "Můžete mít až čtyři [Concept('concept_commander', '$concept_commanders$')] v [Concept('concept_army','armádě')] nebo [Concept('concept_fleet','loďstvu')]. Ovlivňují maximální [Concept('concept_command_limit','velitelský limit')], kterou má vaše [Concept('concept_military_formation','formace')] k dispozici. Když stisknete velké + tlačítko v sekci $concept_commanders$, uvidíte několik kandidátů na nového." # todo: CONCEPT CASE
 lesson_recruit_promote_commander_how_2_continue: "Otevřete okno náboru $concept_commander$ pomocí tlačítka + v sekci $concept_commanders$"
 lesson_recruit_promote_commander_how_2_back: "Zavřete panel [Concept('concept_military_formation','formace')], abyste se vrátili"
 lesson_recruit_promote_commander_how_3: "$lesson_recruit_promote_commander_how_1$"
 lesson_recruit_promote_commander_how_3_desc: "Máte na výběr mezi několika $concept_commanders$. Podívejme se, proč byste měli jednoho vybrat před druhým."
 lesson_recruit_promote_commander_how_3_continue: "Vyberte si svého nového [Concept('concept_commander','velitele')]." # todo: CONCEPT CASE
 lesson_recruit_promote_commander_how_3_back: "Zavřete obrazovku pro výběr [Concept('concept_commander','velitel')], abyste se vrátili"
 lesson_recruit_promote_commander_how_4: "$lesson_recruit_promote_commander_how_1$"
 lesson_recruit_promote_commander_how_4_desc: "Jejich [Concept('concept_character_trait','$concept_character_traits$')] ovlivňuje jejich chování a schopnosti ve a mimo [Concept('concept_battle','bitvy')]. Tooltip je zobrazí, abyste zjistili, co dělají. Některé $concept_character_traits$ mají vliv pouze tehdy, pokud [Concept('concept_character','postava')] jedná v určité roli. V současné době nás zajímají pouze účinky, které mají $concept_character_traits$ pro $concept_commanders$.\n\n#u Modré#! $concept_character_traits$ jsou #u Osobnost#! $concept_character_traits$, které mají $concept_characters$ pouze jedno. Obecně se to nebude měnit. #v Bílé#! $concept_character_traits$ jsou #v Dovednost#! $concept_character_traits$, které ovlivňují schopnosti $concept_character_possessive$ v jejich současné [Concept('concept_character_role','role')]. #v Dovednost#! $concept_character_traits$ se mohou získávat nebo vyvíjet postupem času s [Concept('concept_life_experience','životní zkušeností')]. #r Červené#! $concept_character_traits$ jsou #r Podmínky#!, které mají negativní vliv na $concept_character$ a obvykle se nemění." # todo: CONCEPT CASE
 lesson_recruit_promote_commander_how_5: "$lesson_recruit_promote_commander_how_1$"
 lesson_recruit_promote_commander_how_5_desc: "Všichni charakteri jsou členy [Concept('concept_interest_group','zájmových skupin')], jejichž politiku podporují. $concept_commanders$ zvyšují [Concept('concept_clout','politický vliv')] jejich $concept_interest_group$. Když se $concept_interest_group$ vzbouří, $concept_commanders$, kteří je podporují, se připojí k revoluci. Je moudré zajistit, aby vaši nejvyšší $concept_commanders$ podporovali politiky, které chcete vidět ve vaší zemi." # todo: CONCEPT CASE
 lesson_recruit_promote_commander_how_6: "$lesson_recruit_promote_commander_how_1$"
 lesson_recruit_promote_commander_how_6_desc: "[Concept('concept_commander_rank','Hodnost velitele')] určuje $concept_commander$[Concept('concept_command_limit','velitelský limit')] a také míru, do jaké zvyšují [Concept('concept_interest_group','zájmové skupiny')] [Concept('concept_clout','politický vliv')]. Většina $concept_commanders$ začíná svou kariéru jako první hodnost, ale můžete je kdykoliv povýšit na zvýšení za cenu @bur![Concept('concept_bureaucracy','byrokracie')]." # todo: CONCEPT CASE
 lesson_recruit_promote_commander_how_7: "$lesson_recruit_promote_commander_how_1$"
 lesson_recruit_promote_commander_how_7_desc: "Zhodnoťte své možnosti a vyberte [Concept('concept_commander','velitel')] k náboru."
 lesson_recruit_promote_commander_how_7_continue: "Naverbujte $concept_commander$"
 lesson_recruit_promote_commander_how_8: "$lesson_recruit_promote_commander_how_1$"
 lesson_recruit_promote_commander_how_8_desc: "Najdete [Concept('concept_general','generál')], kterého jste naverbovali v záložce Formation. Najděte [Concept('concept_commander','velitel')], kterého jste naverbovali a vyberte jejich portrét, abyste mohli pokračovat."
 lesson_recruit_promote_commander_how_8_continue: "Přejděte k nově naverbovanému"
 lesson_recruit_promote_commander_how_8_back: "Otevřete panel pro naverbování velitele, abyste se vrátili"
 lesson_recruit_promote_commander_how_9: "$lesson_recruit_promote_commander_how_1$"
 lesson_recruit_promote_commander_how_9_desc: "Odtud můžete povýšit [Concept('concept_commander','velitel')] na vyšší [Concept('concept_commander_rank','hodnost velitele')]. To nezvýší jejich schopnosti, ale pouze jejich [Concept('concept_command_limit','velitelský limit')], který určuje velikost síly, kterou mohou mít pod svým přímým velením."
 lesson_recruit_promote_commander_how_9_back: "Zavřete panel u rekrutovaného #b velitele#!, abyste se vrátili"
 lesson_recruit_promote_commander_how_10: "$lesson_recruit_promote_commander_how_1$"
 lesson_recruit_promote_commander_how_10_desc: "Můžete povýšit [Concept('concept_commander','velitel')] kliknutím na"
 lesson_recruit_promote_commander_how_10_continue: "Povýšit $concept_commander$ k dokončení výukového programu."
 lesson_recruit_promote_commander_complete: "Nový $concept_commander$ povýšen!"
 lesson_recruit_promote_commander_complete_desc: "Nábor a povýšení dalšího $concept_commander$ zvýšilo potenciální počet [Concept('concept_unit','$concept_units$')] , které můžete přikazovat, a zvýšilo počet $concept_units$ pod přímým velením $concept_commander$.\n\nTaké vám to dalo přístup k charakteru s novými [Concept('concept_character_trait','$concept_character_traits$')], které by se mohly ukázat jako užitečné. [Concept('concept_clout','Politický vliv')] nového $concept_commander$ [Concept('concept_interest_group','zájmové skupiny')] se také zvýšil. To vše přišlo s náklady na @bur![Concept('concept_bureaucracy','byrokracie')].\n\nTyto účinky zůstanou, dokud $concept_commander$ nezemře nebo nebude nucen odejít do důchodu. Pokud se v budoucnu rozhodnete $concept_commander$ odejít do důchodu, ovlivní to [Concept('concept_approval','spokojenost')] jejich $concept_interest_group$." # todo: CONCEPT CASE
 lesson_declare_interest_how_1: "Jak deklarovat zájem"
 lesson_declare_interest_how_1_desc: "[Concept('concept_interest', '$concept_interests$')] jsou deklarovány prostřednictvím"
 lesson_declare_interest_how_1_continue: "Najděte a klikněte"
 lesson_declare_interest_how_2: "$lesson_declare_interest_how_1$"
 lesson_declare_interest_how_2_desc: "Nyní vyberte jakýkoli [Concept('concept_strategic_region','strategický region')] a deklarujte v něm [Concept('concept_interest','zájem')]. \nVšimněte si dalších [Concept('concept_country','$concept_countries$')] , které jsou přítomné nebo mají [Concept('concept_interests','zájmy')] v této $concept_strategic_region$, protože mají stejný vliv v tomto regionu jako vy při deklaraci vašeho zájmu.\n\nVáš nový [Concept('concept_interest','zájem')] začíná jako neaktivní. Aktivace nového $concept_interest$ trvá #v [GetDefine('NDiplomacy','INTEREST_NUM_DAYS_CHANGE')|0] dní#!. Během této doby vám nepřináší žádné výhody."
 lesson_declare_interest_how_2_back: "Zavřete objektiv, abyste se vrátili"
 lesson_declare_interest_why_1: "Proč prohlásit zájem"
 lesson_declare_interest_why_1_desc: "Ve výchozím nastavení vždy získáte [Concept('concept_interest','$concept_interests$')] ve všech [Concept('concept_strategic_region','$concept_strategic_regions$')], kde vlastníte pozemky vy nebo vaše [Concept('concept_subject','$concept_subjects$')]. Kromě toho máte několik $concept_interests$, které můžete prohlásit podle libosti, v závislosti na vaší [Concept('concept_rank','hodnost')]."
 lesson_declare_interest_why_2: "$lesson_declare_interest_why_1$"
 lesson_declare_interest_why_2_desc: "Zájem může znamenat mnohé! Možná plánujete dobýt nebo kolonizovat zemi v [Concept('concept_strategic_region','strategickém regionu')], nebo si prostě přejete mít možnost zasáhnout, pokud jiní začnou konflikty tam.\n\nPokud máte [GetDiplomaticActionType('rivalry').GetName] s jiným [Concept('concept_country','zemí')], získáte další @inf![Nbsp][Concept('concept_influence','vliv')] za každý $concept_strategic_region$, kde oba máte $concept_interests$." # todo: CONCEPT CASE
 lesson_declare_interest_complete: "Zájem deklarován!"
 lesson_declare_interest_complete_desc: "Váš nový [Concept('concept_interest','zájem')] je nyní [Concept('concept_active_interest','$concept_active_interest_short$')], což rozšiřuje váš dosah na novou [Concept('concept_strategic_region','strategický region')]. To otevírá dveře k zahájení nebo účasti v [Concept('concept_diplomatic_play','$concept_diplomatic_plays$')], ustanovení nových [Concept('concept_diplomatic_pact','$concept_diplomatic_pacts$')] a dokonce se zapojení do [Concept('concept_colony','$concept_colonization$')] pokud existuje vhodná půda v $concept_strategic_region$."
 lesson_start_diplomatic_play_how_1: "Jak začít $concept_diplomatic_play_short$"
 lesson_start_diplomatic_play_how_1_desc: "Můžete začít [Concept('concept_diplomatic_play','$concept_diplomatic_plays$')] prostřednictvím"
 lesson_start_diplomatic_play_how_1_continue: "Přejděte na"
 lesson_start_diplomatic_play_how_2: "$lesson_start_diplomatic_play_how_1$"
 lesson_start_diplomatic_play_how_2_desc: "The"
 lesson_start_diplomatic_play_how_2_continue: "Vyberte a zahajte jakoukoli $concept_diplomatic_play$"
 lesson_start_diplomatic_play_how_2_back: "Zavřete záložku #b Diplomatické jednání#! na panelu [Concept('concept_diplomatic_lens','diplomatické čočky')], abyste se vrátili" # todo: CONCEPT CASE
 lesson_start_diplomatic_play_how_3: "$lesson_start_diplomatic_play_how_1$"
 lesson_start_diplomatic_play_how_3_desc: "Nyní jste zahájili [Concept('concept_diplomatic_play','diplomatická hra')], kde jste [Concept('concept_initiator','iniciátor')]. Nyní se to bude vyvíjet ve 3 fázích v nadcházejících měsících. První fáze je [Concept('concept_opening_moves','počáteční kroky')] následována [Concept('concept_diplomatic_maneuvers','diplomatické manévry')] a poté [Concept('concept_countdown_to_war','odpočet do války')]. Pokud žádná strana nepovstane před začátkem $concept_countdown_to_war$, válka [Concept('concept_war','válka')] je nevyhnutelná!"
 lesson_incorporate_state_how_1: "Jak $concept_incorporate$ [Concept('concept_state','stát')]"
 lesson_incorporate_state_how_1_desc: "Můžete začít [Concept('concept_incorporated_state', '$concept_incorporating$')] [Concept('concept_unincorporated_state','nezačleněný stát')] pod "
 lesson_incorporate_state_how_1_continue: "Přejděte na záložku #b Státní akce#! v $concept_political_lens$"
 lesson_incorporate_state_how_2: "$lesson_incorporate_state_how_1$lesson_enact_institution_law_how_5_desc:1 „[Concept('concept_law','$concept_laws$')] nejsou [Concept('concept_enactment_of_laws','$concept_enactment_of_laws_enacted$')] okamžitě. Budou muset projít cykly, kde můžete zasáhnout, abyste zvýšili šanci na [Concept('concept_enactment_success','úspěšné uzákonění zákona')] na schválení zákona."
 lesson_incorporate_state_how_2_desc: "Aby bylo možné [Concept('concept_incorporated_state','$concept_incorporate$')] stát, musí být $concept_state$ [Concept('concept_unincorporated_state','$concept_unincorporated_state_short$')] a #b ne#! probíhající [Concept('concept_colony','$concept_colonization$')]. V současné době máte [GetPlayer.GetNumStatesThatCanBeIncorporated] [SelectLocalization(GreaterThan_int32(GetPlayer.GetNumStatesThatCanBeIncorporated,'(int32)1'),'$concept_unincorporated_states$','$concept_unincorporated_state$')] které mohou být [Concept('concept_incorporated_state', '$concept_incorporated$')]."
 lesson_incorporate_state_how_2_continue: "Klikněte na možnost #b $concept_incorporate_state$#! a začněte $concept_incorporate$ jeden z vašich $concept_unincorporated_states$"
 lesson_incorporate_state_how_2_back: "Zavřete"
 lesson_incorporate_state_how_3: "$lesson_incorporate_state_how_1$"
 lesson_incorporate_state_how_3_desc: "Nyní jste začali [Concept('concept_incorporated_state','$concept_incorporate$')] váš vybraný [Concept('concept_state','stát')]. [Concept('concept_incorporated_state','$concept_incorporating$')] [Concept('concept_state','$concept_states$')] může trvat mnoho let v závislosti na tom, jak kulturně podobné je území vašim [Concept('concept_primary_cultures','primárním kulturám')]. Plný @bur![Nbsp][Concept('concept_bureaucracy','byrokracie')] náklad je okamžitě uplatněn, ale výhody $concept_incorporation$ se budou hromadit v průběhu času." # todo: CONCEPT CASE
 lesson_incorporate_state_how_3_back: "Zrušit incorporaci státu, abyste se vrátili"
 lesson_incorporate_state_complete: "$concept_state$ $concept_incorporated$!"
 lesson_incorporate_state_complete_desc: "Dobrá práce! Nyní jste [Concept('concept_incorporated_state','$concept_incorporated$')] [Concept('concept_unincorporated_state','nezačleněný stát')]. To znamená, že nyní budou platit daně, získají přístup k výhodám z [Concept('concept_institution', '$concept_institutions$')] a plně se účastní politického systému vaší země."
 lesson_interest_group_1: "Co jsou [Concept('concept_interest_group', '$concept_interest_groups$')]?"
 lesson_interest_group_1_desc: "Skupiny zájmů lze zobrazit na panelu $POLITICS$ na kartě $OVERVIEW$."
 lesson_interest_group_1_continue: "Otevřete panel $POLITICS$ na kartě $OVERVIEW$"
 lesson_interest_group_2: "$lesson_interest_group_1$"
 lesson_interest_group_2_desc: "K [Concept('concept_interest_group','Zájmová skupina')] je frakce ve vaší zemi, jejíž podporovatelé [Concept('concept_pop','populace')] sdílejí politický zájem. $concept_interest_groups$ mohou mít jeden z tří různých statusů ve vaší zemi.\n\n[Concept('concept_in_government','Ve vládě')]: součást vládnoucí třídy, ať už volbami, božím právem, násilným násilím nebo jinými prostředky\n\n[Concept('concept_in_opposition','V opozici')]: prosazují svůj vliv mimo mocenské sály\n\n[Concept('concept_marginalized','Marginalizována')]: nejsou dostatečně silní, aby měly význam, nečinní zcela\n\nVšechny země mají stejné druhy $concept_interest_groups$, ale mnohé mají jedinečné variace v závislosti na historických, kulturních nebo náboženských podmínkách." # todo: CONCEPT CASE
 lesson_interest_group_2_back: "Zavřete panel $POLITICS$ na kartě $OVERVIEW$, abyste se vrátili"
 lesson_interest_group_3: "$lesson_interest_group_1$"
 lesson_interest_group_3_desc: "#b Vy"
 lesson_interest_group_3_continue: "Přejděte k jakémukoli panelu podrobností vašeho $concept_interest_group$"
 lesson_interest_group_4: "$lesson_interest_group_1$"
 lesson_interest_group_4_desc: "Nejdůležitějším aspektem [Concept('concept_interest_group', '$concept_interest_groups$')] je jeho [Concept('concept_ideology', '$concept_ideologies$')]. Tyto specifikují nejen to, jak se $concept_interest_group$ cítí ohledně [Concept('concept_law', '$concept_laws$')], ale také které $concept_laws$ preferují před ostatními.\n\nPřejděte přes $concept_ideology$, abyste viděli $concept_laws$, na kterých jim záleží a jak se na ně dívají."
 lesson_interest_group_4_back: "Zavřete záložku $concept_interest_group$, abyste se vrátili"
 lesson_interest_group_5: "$lesson_interest_group_1$"
 lesson_interest_group_5_desc: "[Concept('concept_ideology','Ideologie')] na vrcholu seznamu $concept_ideologies$ pochází od svého [Concept('concept_leader','vůdce')]. $concept_leaders$ se během hry změní a ideologie vůdce s tím, ale v některých případech mohou $concept_leaders$ převratně a trvale změnit, co $concept_interest_group$ představuje.\n\n$concept_leaders$ mohou mít další efekty na $concept_interest_group$, kvůli svým [Concept('concept_character_trait', '$concept_character_traits$')] nebo aktuální [Concept('concept_popularity','popularitě')]." # todo: CONCEPT CASE
 lesson_interest_group_6: "$lesson_interest_group_1$"
 lesson_interest_group_6_desc: "[Concept('concept_interest_group', '$concept_interest_groups$')] mají své vlastní [Concept('concept_interest_group_trait', '$concept_interest_group_traits$')] s přímými účinky na celou zemi. $concept_interest_group_traits$ se aktivuje a deaktivuje na různých úrovních [Concept('concept_approval','spokojenosti')] a mění svou sílu, pokud je $concept_interest_group$ [Concept('concept_powerful','silná')].\n\nUdržujte $concept_interest_group$ šťastné a vaši lidé budou mít prospěch. Ale pokud je naštvete, budou se vzpouzet, dokud nezměníte svůj způsob." # todo: CONCEPT CASE
 lesson_interest_group_7: "$lesson_interest_group_1$"
 lesson_interest_group_7_desc: "Síla [Concept('concept_interest_group','zájmová skupina')] se měří podle její [Concept('concept_clout','politický vliv')], která je rovna jejímu podílu na celkové [Concept('concept_political_strength','politickou sílu')] ve vaší zemi. $concept_political_strength$ pochází především z [Concept('concept_pop', '$concept_pops$')], kteří podporují tyto $concept_interest_groups$, o nichž si myslí, že nejlépe reprezentují jejich zájmy při formování země pro svůj prospěch." # todo: CONCEPT CASE
 lesson_interest_group_8: "$lesson_interest_group_1$"
 lesson_interest_group_8_desc: "Všechny [Concept('concept_pop', '$concept_pops$')] podporující [Concept('concept_interest_group','zájmová skupina')] můžete vidět na jejich panelu. Mějte na paměti, že každý jednotlivec v $concept_pop$ může rozhodnout sám, kterou [Concept('concept_interest_group','zájmovou skupinu')] podporovat, takže podpora napříč celým $concept_pop$ je obvykle rozdělená v různých proporcích mezi dvě až čtyři [concept_interest_groups]." # todo: CONCEPT CASE
 lesson_interest_group_9: "$lesson_interest_group_1$"
 lesson_interest_group_9_desc: "[Concept('concept_law', '$concept_laws$')] podporovaný [Concept('concept_interest_group','zájmová skupina')] je také k dispozici v seznamové podobě seřazené od nejžádanějších po nejméně žádané. Přejíždění nad tlačítkem $enact$ objasní účinky [Concept('concept_approval','spokojenost')] $concept_law$ na tomto a dalších $concept_interest_groups$ v zemi."
 JOURNAL_ENTRY_IN_PROGRESS: "@green_checkmark!"
 je_tutorial_expand_basic_building: "Rozšířit základní $concept_building$"
 je_tutorial_expand_basic_building_status: "Rozšiřte [JournalEntry.GetTarget.GetBuilding.GetName] v [JournalEntry.GetTarget.GetBuilding.GetState.GetName]"
 je_tutorial_expand_basic_building_reason: "Jedním ze způsobů, jak růst vaši ekonomiku, je výstavba nebo rozšíření [Concept('concept_building', '$concept_buildings$')]. Nemůžete vždy vědět předem, zda bude určitý $concept_building$ výnosný nebo ne, ale rozšíření základní zemědělské $concept_building$ jako [JournalEntry.GetTarget.GetBuilding.GetBuildingType.GetName] je relativně bezpečná investice."
 je_tutorial_expand_basic_building_goal: "Úroveň [JournalEntry.GetTotalGoalValue|v0] [JournalEntry.GetTarget.GetBuilding.GetName] ve [JournalEntry.GetTarget.GetBuilding.GetState.GetName] (aktuálně úroveň [JournalEntry.CalcCurrentGoalValue|v0])"
 je_tutorial_expand_basic_building_header: ""
 je_tutorial_expand_basic_building_reason_long: "Růst vaší ekonomiky prostřednictvím stavby [Concept('concept_building', '$concept_buildings$')] je zásadní částí toho, aby [Country.GetName] prospívalo. Rozšíření základní zemědělské $concept_building$, jako je [JournalEntry.GetTarget.GetBuilding.GetBuildingType.GetName], je relativně bezpečná investice. Má nízké materiálové náklady a produkuje základní potravinové dodávky, které jsou obecně v poptávce, protože je konzumuje každý ve vaší zemi. Díky tomu je obvykle schopna získat malý zisk při minimálním riziku.\n\n@information! [JournalEntry.GetTarget.GetBuilding.GetBuildingType.GetName] nejsou [Concept('concept_government_building', '$concept_government_buildings$')] a nepřispívají přímo k vašemu příjmu. Příjmy jsou vypláceny jako [Concept('concept_building_wage', '$concept_building_wages$')] těm [Concept('concept_pop', '$concept_pops$')], kteří pracují v budově a ti přispějí nějakým z těchto [Concept('concept_money','peněz')] státu prostřednictvím [Concept('concept_budget_income_taxes','daní z příjmu')]." # todo: CONCEPT CASE
 je_tutorial_expand_basic_building_complete_tooltip: "[JournalEntry.GetTarget.GetBuilding.GetName] v [JournalEntry.GetTarget.GetBuilding.GetState.GetName] bylo úspěšně rozšířeno"
 je_tutorial_expand_basic_building_invalid_tooltip: "[JournalEntry.GetTarget.GetBuilding.GetName] v [JournalEntry.GetTarget.GetBuilding.GetState.GetName] již není vlastněn [GetPlayer.GetName]"
 je_tutorial_fix_budget_deficit: "Vyřešit rozpočtový deficit"
 je_tutorial_fix_budget_deficit_status: "Mít stálý příjem, který překračuje fixní výdaje"
 je_tutorial_fix_budget_deficit_reason: "Naše ekonomika je momentálně nezdravá, protože naše fixní výdaje převyšují naše příjmy, což má za následek týdenní deficit. Existuje několik způsobů, jak to řešit, například zvýšením daní, snížením vládních/vojenských platů nebo snížením úrovně vládou financovaných budov."
 je_tutorial_change_production_method: "Změnit $concept_production_method$"
