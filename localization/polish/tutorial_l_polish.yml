 je_tutorial_increase_market_access_by_decree_reason: "[Concept('concept_market_access','Přístup na trh')] v [JournalEntry.GetTarget.GetState.GetName] kleslo pod 100%, což způsobilo nepříznivé cenové podmínky. Zlepšete to vydáním [GetDecreeType('decree_road_maintenance').GetName] [Concept('concept_decree','dekretu')] v [JournalEntry.GetTarget.GetState.GetName]." # todo: CONCEPT CASE
