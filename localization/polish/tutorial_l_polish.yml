 tooltip_hinter_concept: "[Concept('concept_concept','Koncept')]"
 tooltip_hinter_concepts: "[Concept('concept_concept', '$concept_concepts$')]"
 lesson_basics_welcome: "Vítejte v éře pokroku!"
 lesson_basics_welcome_desc: "Je rok 1836. [GetPlayer.GetRuler.GetFullName] je [GetPlayer.GetRuler.GetPrimaryRoleTitle] [GetPlayer.GetName]. Průmyslová revoluce je v plném proudu a přináší katastrofální společenské změny. Uplynulo více než 20 let od okamžiku, kdy Vídeňský kongres uložil Evropě nějaký řád, a nespokojenost se opět začíná zvyšovat mezi [Concept('concept_great_power', '$concept_great_powers$')]. Bude na vás, abyste vedli [GetPlayer.GetName] k slávě v následujícím století.\n\nNeexistuje jeden způsob, jak 'vyhrát' ve Victoria 3. Stanovíte si své vlastní cíle a prožijete různé příběhy v procesu jejich dosažení."
 lesson_basics_core_gameplay: "Základní herní mechanika"
 lesson_basics_core_gameplay_short: "Victoria 3 je o převzetí, růstu a formování země z viktoriánské éry, s primárním zaměřením na"
 lesson_basics_core_gameplay_show_more: "Politika, ekonomika, diplomacie a válka jsou všechny nástroje k tomuto cíli, ale musí být používány opatrně, protože vaše populace má vlastní potřeby a touhy. Vaše rozhodnutí na ně budou mít vliv a oni se na oplátku pokusí ovlivnit vás.\n\nVictoria 3 je dynamická simulace s mnoha pohyblivými částmi. Všechny vaše akce budou mít důsledky, i neúmyslné. To je normální a očekávané! Nemusíte se učit, jak všechno funguje, než začnete hrát. Berte to pomalu a učte se z vašich chyb, a brzy budete odborníkem na politiku!"
 lesson_basics_core_gameplay_desc: "Victoria 3 je o převzetí vedení, růstu a formování země z viktoriánské éry, s hlavním zaměřením na #b Ekonomiku#! a #b Politiku#!. Budete budovat společnost podle vlastní představy a překonávat vnitřní i vnější překážky.\n\nPolitika, Ekonomika, Diplomacie a Válka jsou všechny nástroje k tomuto účelu, ale musí být používány s opatrností, protože vaše populace má své vlastní potřeby a touhy. Vaše rozhodnutí na ně budou mít dopad a oni se naopak pokusí ovlivnit vás.\n\nVictoria 3 je dynamická simulace s mnoha pohyblivými částmi. Všechny vaše akce budou mít důsledky, dokonce i ty neúmyslné. To je normální a očekávané! Nemusíte se učit, jak všechno funguje, než začnete hrát. Jděte na to pomalu a učte se ze svých chyb, a brzy se stanete odborníkem na politiku!"
 lesson_basics_core_gameplay_part_1_desc: "Victoria 3 je o převzetí kontroly, růstu a tvarování země z viktoriánské éry, s primárním zaměřením na #bold Ekonomiku#! a #bold Politiku#!. Budete budovat společnost dle své vlastní představy, zatímco se budete potýkat s vnitřními a vnějšími překážkami."
 lesson_basics_core_gameplay_part_2_desc: "Politika, ekonomika, diplomacie a válka jsou všechny nástroje k tomuto cíli, ale musí být používány opatrně, protože vaše populace má své vlastní potřeby a touhy. Vaše rozhodnutí je ovlivní a oni zase budou usilovat o vliv na vás.\n\nVictoria 3 je dynamická simulace s mnoha pohyblivými částmi. Všechny vaše akce budou mít důsledky, i když neúmyslné. To je normální a očekávané! Nemusíte se učit, jak vše funguje, než začnete hrát. Berte to pomalu a učte se ze svých chyb, a brzy budete expertem na politiku!"
