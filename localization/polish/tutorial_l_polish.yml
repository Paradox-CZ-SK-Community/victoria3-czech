 je_tutorial_earn_obligation: "Získat závazek"
 je_tutorial_earn_obligation_reason: "[Concept('concept_obligation', '$concept_obligations$')] jsou důležitým aspektem globální politiky. Umožňují nám vyzvat jiné národy, aby nám pomohly v časech války a umožňují nám vynucovat určité [Concept('concept_diplomatic_action', '$concept_diplomatic_actions$')] na jiné národy."
