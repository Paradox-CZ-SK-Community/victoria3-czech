l_polish:
 je_russian_revolution: "Ruská revoluce" # todo: NEW TRANSLATION
 je_russian_revolution_reason: "Po staletí žili vládci [ROOT.GetCountry.GetName] v hrůze z #b revoluce#!. Nemilosrdné represivní snahy těchto vládců způsobily, že se v celé [ROOT.GetCountry.GetAdjectiveNoFormatting] společnosti nahromadil velký tlak. Pokud tyto snahy selžou a do [ROOT.GetCountry.GetAltAdjectiveNoFormatting('G')] přijde #b revoluce#!, uvolněné síly mohou vést ke katastrofě dosud nepředstavitelných rozměrů.\n\n@information! [concept_revolution] bude vždy stát proti [concept_ideology] státu, kterou určuje současná politická situace [Concept('concept_country','$concept_country_possessive|q$')], ideologie jejího [concept_ruler] a souhrn $concept_ideologies$ minulých [Concept('concept_government','$concept_governments|q$')]. I když se charakter $concept_government$ v současnosti radikálně změní, setrvá v něm ideologická setrvačnost, na kterou revolucionáři nezapomenou.\n\nRevolucionáři budou vždy patřit k nejsilnějšímu ideologickému táboru, který není $concept_ideology$ [ROOT.GetCountry.GetName] a $concept_government$. Pokud některé [concept_political_movement] stojící na straně revolucionářů přeroste v plnohodnotné povstání, stane se z tohoto $concept_revolution$ #italic ta#! revoluce." # todo: CHANGED (predtym: Po staletí žili vládci [ROOT.GetCountry.GetName] v hrůze z b revoluce !. Nemilosrdné represivní snahy těchto vládců způs)
