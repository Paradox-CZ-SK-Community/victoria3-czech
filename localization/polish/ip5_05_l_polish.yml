 ip5_revolutions.1.t: "Povstaňte!" # todo: NEW TRANSLATION
 ip5_revolutions.1.d: "Poslední šance na kompromis zůstala bez odezvy. Revolucionáři obsadili [ROOT.GetCountry.GetCapital.GetCityHubName] a [SCOPE.sCharacter('deposed_tsar').GetFullName] byl zadržen [SCOPE.sCharacter('deposed_tsar').GetHerHis] rádci. Po celém území [ROOT.GetCountry.GetName] se vojenské jednotky a gubernátoři přidávají k revoluci." # todo: NEW TRANSLATION
 ip5_revolutions.1.f: "„Je zřejmé, že Jeho Veličenstvo ani vy si neuvědomujete, co se zde děje. Vypukla jedna z nejstrašnějších revolucí a nebude snadné ji potlačit... pokud nebudou okamžitě učiněny ústupky, které by mohly uspokojit zemi... Veřejné mínění se rozhořelo natolik, že je sotva možné je ovládnout; vojska jsou zcela demoralizována; nejenže neuposlechnou rozkazy, ale zabíjejí i své vlastní důstojníky... Považuji za nutné vás informovat, že to, co jste zamýšlel, již nestačí a otázka dynastie byla vznesena zcela otevřeně.“\n\n—Michail Rodzjanko" # todo: NEW TRANSLATION
 ip5_revolutions.1.a: "Váha staletí se zřítí." # todo: NEW TRANSLATION
 ip5_revolutions.2.t: "Přízraky revoluce" # todo: NEW TRANSLATION
 ip5_revolutions.2.d: "Ve vzduchu se vznáší slovo, šeptá se všude kolem — slovo, které v každém, kdo je uslyší, zažehne jiskřičku naděje, i kdyby byl sebevíc poražený: #italic revoluce.#!" # todo: NEW TRANSLATION
 ip5_revolutions.2.f: "Revoluce znamená pro každého něco jiného. Může přijít zahalená do rudého praporu, ale stejně tak může nést korunu. Ať už ji pohání jakékoli přesvědčení, jedno zůstává stejné: revoluce bojuje proti těm, kdo drží otěže moci. Ať už je [ROOT.GetCountry.GetNameNoFormatting] jakékoli a ať už se [ROOT.GetCountry.GetNameNoFormatting] utváří jakkoli, vždy proti němu povstane revoluce." # todo: NEW TRANSLATION
 ip5_revolutions.2.a: "Revoluce? Zrovna v #italic [ROOT.GetCountry.GetNameNoFormatting]#!?" # todo: NEW TRANSLATION
 russian_revolution_radicalism: "Šeptanda o revoluci" # todo: NEW TRANSLATION
 russian_revolution_radicalism_tt: "Vedoucí opoziční politické hnutí získává větší podporu a aktivismus, čím déle narůstá #bold setrvačnost#! vládnoucí ideologie Ruska." # todo: NEW TRANSLATION
 rcw.102.t: "Konec starého řádu" # todo: NEW TRANSLATION
 rcw.102.d: "Po smetení staré vlády mnozí tvrdí, že [SCOPE.GetRootScope.GetCountry.GetPowerBloc.GetName] je zastaralá instituce, která by měla zaniknout. Pokud se později rozhodneme vytvořit nový blok, naše zkušenosti nám samozřejmě jeho obnovu značně usnadní." # todo: NEW TRANSLATION
 rcw.102.f: "„Jestliže se máme odpoutat od minulosti a založit něco nového, proč bychom si měli [SCOPE.GetRootScope.GetCountry.GetPowerBloc.GetNameNoFormatting] ponechávat? Ano, udržování vztahů s některými z těchto národů nám prospívá, ale nechceme, aby nám tu všude připomínal starý řád.“" # todo: NEW TRANSLATION
 rcw.102.a: "[SCOPE.GetRootScope.GetCountry.GetPowerBloc.GetName] musí zaniknout." # todo: NEW TRANSLATION
 refund_mandates_tooltip: "Získáme zpět část mandátů, které můžeme znovu použít při příštím vytvoření nového mocenského bloku." # todo: NEW TRANSLATION
 russian_mandates_refund: "Zkušenosti ze starého řádu" # todo: NEW TRANSLATION
 rcw.102.b: "Cože? [SCOPE.GetRootScope.GetCountry.GetPowerBloc.GetName] potřebujeme víc než kdy dřív!" # todo: NEW TRANSLATION
