 springtime_liberal_country_expanded_tt: "Aby měl [concept_country] liberální [Concept('concept_revolution','$concept_revolutionary|q$')] vládu:\n$EFFECT_LIST_BULLET$ #b Nezvítězil#! v #v $je_springtime_of_the_peoples$#! #b konzervativně#!\n$EFFECT_LIST_BULLET$ #b Nezvítězil#! v #v $je_red_summer$#! #b kontrarevolučně#!\n$EFFECT_LIST_BULLET$ Platí některá z následujících podmínek: #indent_newline:3 \n$EFFECT_LIST_BULLET$ Proběhla úspěšná [concept_revolution]\n$EFFECT_LIST_BULLET$ Má aktivní [concept_journal_entry] #v $je_red_summer$#!\n$EFFECT_LIST_BULLET$ V #v $je_red_summer$#! zvítězili #b liberálové#! nebo #b radikálové#!\n$EFFECT_LIST_BULLET$ Platí všechny následující podmínky: #indent_newline:3 \n$EFFECT_LIST_BULLET$ Nedávno proběhla [concept_revolution] nebo [concept_coup]\n$EFFECT_LIST_BULLET$ $has_census_voting_or_universal_suffrage_tt$\n$EFFECT_LIST_BULLET$ $has_national_guard_or_guaranteed_liberties_tt$\n$EFFECT_LIST_BULLET$ $has_right_of_assembly_or_protected_speech_tt$#!#!\n\n#tooltippable;tooltip:[GetPlayer.GetTooltipTag],springtime_revolutionary_countries_list_tt Současné [Concept('concept_country','$concept_countries|q$')] s liberálními [Concept('concept_revolution','$concept_revolutionary|q$')] vládami#!" # todo: NEW TRANSLATION
