 tsarpoints_events.14.t: "Vláda Caesarů" # todo: NEW TRANSLATION
 tsarpoints_events.14.d: "S tíhou více než tří set let samovlády za sebou vládne [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] zemi [ROOT.GetCountry.GetName] železnou rukou. Samoděržaví, které přežilo napoleonské války, nyní musí čelit světu, který po sobě zanechalo." # todo: NEW TRANSLATION
 tsarpoints_events.14.f: "A konečně vyzýváme všechny své věrné poddané, aby se k nám připojili v horoucích modlitbách k Všemohoucímu, aby nám udělil sílu nést břímě, které na nás ve své Božské prozřetelnosti vložil, a aby nám zachoval pevné odhodlání žít výhradně pro naši milovanou zemi a kráčet ve stopách Monarchy, nad nímž nyní truchlíme.\n\nKéž naše vláda není ničím jiným než pokračováním té jeho a kéž naplníme všechna přání pro štěstí Ruska, která ho vedla a jejichž posvátná památka v nás zachová snahu i naději, že si zasloužíme požehnání Nebes a lásku našeho lidu.\n\n#italic Manifest o nástupu císaře Mikuláše I. na trůn#!" # todo: NEW TRANSLATION
 tsarpoints_events.14.a: "Bůh ochraňuj cara!" # todo: NEW TRANSLATION
 tsarpoints_events.14.b: "Jednou se snad [ROOT.GetCountry.GetAdjective] lid zbaví svého jha." # todo: NEW TRANSLATION
 tsarpoints_events.14.tt_1: "Jako [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] země [ROOT.GetCountry.GetName] nyní velíte @tsarpoints! [concept_tsarpoints], jejichž počet se sleduje v [concept_journal_entry] #b $je_tsarpoints_master$#!" # todo: NEW TRANSLATION
 tsarpoints_events.14.tt_2: "Plňte #b agendy#! svého [concept_ruler] a [concept_favorite], abyste #g získali#! [concept_tsarpoints], a poté je #g utrácejte#! za mocné [Concept('concept_ukaz','$concept_ukase|q$')]" # todo: NEW TRANSLATION
 tsarpoints_events.15.t: "Císařský $concept_ukaz$ č. [ROOT.Var('ukaz_no_var').GetValue]" # todo: NEW TRANSLATION
 tsarpoints_events.15.d: "Vypuknutí revolucí v celé Evropě přimělo [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] k činu. [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] vydal rozkaz [ROOT.GetCountry.GetAdjective] velvyslanectvím na Západě, aby pomohla ohroženým monarchiím, a nařídil armádě připravit se na válku." # todo: NEW TRANSLATION
 tsarpoints_events.15.f: "Dveře se rozletěly a dovnitř vtrhl vír studeného vzduchu, kabátů a dupajících bot. Tucet párů očí se obrátilo ke zdroji hluku.\n\n„Mám zprávy od Sergeje Alexandroviče!“ vydechl muž, který právě vběhl dovnitř. „Doslechl se to od svého seržanta, ten od palácového gardisty, který říkal, že [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] promluvil na plese, mezi... mezi....“ Zpráva přerývaná dechem zanikla v záchvatu kašle. Muž se zhroutil na rám postele.\n\nJeden z mužů na pryčnách, jehož ruce zůstaly strnule viset uprostřed leštění knoflíku, promluvil. „Co říkal? Tak dělej, chlape!“\n\n„Říkal... ten gardista slyšel: ‚Osedlejte koně, pánové, Francie je republika!‘“" # todo: NEW TRANSLATION
 tsarpoints_events.15.a: "[ROOT.GetCountry.GetAdjectiveNoFormatting] armáda dá Evropu do pořádku." # todo: NEW TRANSLATION
