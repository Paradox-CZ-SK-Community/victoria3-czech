 je_tp_tsar_crown_of_perfection_button_1_name: "Podporovat inteligenci" # todo: NEW TRANSLATION
 je_tp_tsar_crown_of_perfection_button_1_desc: "Od mládí vyhledával [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] společnost [ROOT.GetCountry.GetAdjective] [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName]. [ROOT.GetCountry.GetRuler.GetSheHe|U] si přeje znovuzrození [ROOT.GetCountry.GetAdjectiveNoFormatting] intelektuálního myšlení, které vzejde z nejkultivovanějšího a nejliberálnějšího dvora v Evropě." # todo: NEW TRANSLATION
 je_tp_tsar_crown_of_perfection_button_2_name: "Zdokonalit Velké reformy" # todo: NEW TRANSLATION
 je_tp_tsar_crown_of_perfection_button_2_desc: "Ačkoli Velké reformy cara Alexandra II. přinesly značné úspěchy, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] považuje jejich opatření za nedokončená a nedokonalá. [ROOT.GetCountry.GetRuler.GetSheHe|U] si přeje pokračovat tam, kde [ROOT.GetCountry.GetRuler.GetHerHis] otec skončil, rozvíjet [ROOT.GetCountry.GetRuler.GetHerHis] úspěchy a napravit [ROOT.GetCountry.GetRuler.GetHerHis] nezdary." # todo: NEW TRANSLATION
 je_tp_tsar_crown_of_perfection_button_3_name: "Podpořit veřejný život" # todo: NEW TRANSLATION
 je_tp_tsar_crown_of_perfection_button_3_desc: "Veřejný život v zemi [ROOT.GetCountry.GetName] po staletí dusil policejní stát, kvůli němuž zůstali její obyvatelé věrní svým vládcům, ale nepřipraveni na zastupitelskou vládu. [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] chce vytvořit prosperující, početnou a politicky angažovanou střední třídu, aby [ROOT.GetCountry.GetNameNoFormatting] jednoho dne mohla být připravena omezit moc koruny." # todo: NEW TRANSLATION
 je_tp_tsar_crown_of_perfection_button_4_name: "Zracionalizovat říši" # todo: NEW TRANSLATION
 je_tp_tsar_crown_of_perfection_button_4_desc: "[ROOT.GetCountry.GetAdjective] říše je rozlehlou a různorodou směsicí gubernií, oblastí a pozůstatků feudálních území s rozdílnými výsadami, která byla pohlcena během jejího rozšiřování. [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName], inspirován [ROOT.GetCountry.GetRuler.GetHerHis] studiem občanského a státního práva, si přeje sjednotit roztříštěnou správu říše do jednotného systému a rozšířit jediný právní řád od Baltu až k Tichému oceánu." # todo: NEW TRANSLATION
