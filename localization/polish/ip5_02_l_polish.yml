 notification_je_tp_counter_revolution_ukaz_desc: "Na příkaz [SCOPE.sCountry('counter_revolution_sponsor_scope').GetRuler.GetPrimaryRoleTitle] navázali [SCOPE.sCountry('counter_revolution_sponsor_scope').GetAdjective] agenti kontakt s #b kontrarevolučními#! silami v zemi [SCOPE.sCountry('counter_revolution_target_scope').GetName] a posílili postup #b kontrarevoluce#! v [concept_journal_entry] #v $je_red_summer$#! o [SCOPE.sCountry('counter_revolution_target_scope').MakeScope.Var('tp_counter_revolution_ukaz_var').GetValue|v0]\n\n@information! Tento účinek lze odstranit pomocí [concept_diplomatic_action] [GetDiplomaticActionType('expel_diplomats').GetName]" # todo: NEW TRANSLATION
