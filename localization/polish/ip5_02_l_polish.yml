 da_tsarpoints_install_subject_ruler: "Dosadit oblíbeného vládce" # todo: NEW TRANSLATION
 da_tsarpoints_install_subject_ruler_desc: "Dosadit na trůn jednoho z našich [Concept('concept_subject','$concept_subjects|q$')] vládce podle vlastního výběru, jak povoluje [concept_ukaz] #b $je_tsarpoints_button_7_name$#!. Každý [concept_ukaz] umožňuje jedno jmenování." # todo: NEW TRANSLATION
