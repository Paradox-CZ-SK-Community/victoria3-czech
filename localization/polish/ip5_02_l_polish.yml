l_polish:
 je_tsarpoints_master: "Císař a samovládce" # todo: NEW TRANSLATION
 je_tsarpoints_title: "Vláda [ROOT.GetCountry.GetRuler.GetFirstNameNoFormatting]" # todo: NEW TRANSLATION
 je_tsarpoints_title_fallback: "Císař a samovládce" # todo: NEW TRANSLATION
 je_tsarpoints_master_reason: "#bold @tsarpoints! [concept_tsarpoints]:\n#!Vaše [concept_tsarpoints] budou #g růst#! a #r klesat#! v rámci skupin [concept_journal_entry] #b $je_group_tsarpoints$#! a #b $je_group_russia_expansion$#!, stejně jako při řadě #tooltippable;tooltip:je_tsarpoints_additional_goals významných událostí#!.\n[concept_tsarpoints] poskytují pasivní #g bonus#! a umožňují vydávat mocné [Concept('concept_ukaz','$concept_ukase|q$')]. Účinnost [Concept('concept_ukaz','$concept_ukase|q$')] bude výrazně nižší, pokud [ROOT.GetCountry.GetName] přijme [Concept('concept_election', '$concept_election_voting_franchise|q$')].\n\n[ROOT.GetCountry.GetCustom('tsarpoints_tsar_quote')]\n\nV očích mnohých jsou [ROOT.GetCountry.GetName] a [GetLawType('law_monarchy').GetName] dvěma stranami téže mince. Carové vládnou zemi již po staletí — nejprve z Moskvy a poté z Petrohradu — ale navzdory neustále se měnícím podobám císařského režimu zůstává jedna zásadní skutečnost:\n\nMoc [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] je absolutní a vůle [ROOT.GetCountry.GetRuler.GetHerHis] bude naplněna." # todo: NEW TRANSLATION
 je_tsarpoints_additional_goals: "Následující události zvýší @tsarpoints! [concept_tsarpoints] o #g#!:\n• #g 20#!: Obsazení města #b Konstantinopol#! v oblasti [GetStateRegion('STATE_EASTERN_THRACE').GetName]\n• #g 10#!: Dosažení #b vítězství#! ve válce #v $je_caucasian_war$#!\n\nNásledující události sníží @tsarpoints! [concept_tsarpoints] o #r#!:\n• #r 10#!: Utrpění #b porážky#! ve válce #v $je_caucasian_war$#!" # todo: NEW TRANSLATION
 tsarpoints_quote_nicholas_i: "„#italic Ve státě, kde láska k panovníkům a oddanost trůnu vycházejí z přirozených vlastností lidu, kde platí zákony vlasti a pevnost ve správě, bude veškeré úsilí zlovolných lidí marné a pošetilé.#!“\n\n— Mikuláš I., #italic Manifest o zřízení Nejvyššího trestního soudu pro soud nad zločinci#!" # todo: NEW TRANSLATION
 tsarpoints_quote_alexander_ii: "„#italic Je lepší zrušit nevolnictví shora, než čekat, až se zruší samo zdola.#!“\n\n— Alexandr II., #italic Projev k moskevské šlechtě#!„" # todo: NEW TRANSLATION
 tsarpoints_quote_nixa: "„#italic Utěšuji se však myšlenkou, že celá naše budoucnost je před námi. Tady v Evropě je léto — zatímco v Rusku je stále jaro se vším jeho nepořádkem, ale také s nadějemi a prvními výhonky probouzejícího se života. Veškerá práce je teprve před námi.#!“\n\n— carevič Nikolaj Alexandrovič, #italic Soukromé dopisy#!" # todo: NEW TRANSLATION
 tsarpoints_quote_alexander_iii: "„#italic Uprostřed našeho velkého zármutku nám však Boží hlas přikazuje pevně se věnovat vládnutí, důvěřovat Boží prozřetelnosti a věřit v moc a pravdu samovládné autority, kterou máme potvrzovat a střežit pro dobro lidu před každým útokem.#!“\n\n— Alexandr III., #italic Manifest o neotřesitelné samovládě#!" # todo: NEW TRANSLATION
 tsarpoints_quote_nicholas_ii: "„#italic Co se stane se mnou a s celým Ruskem? Nejsem připraven stát se carem. Nikdy jsem jím nechtěl být. O vládnutí nic nevím.#!“\n\n— Mikuláš II., #italic Soukromé dopisy#!" # todo: NEW TRANSLATION
 tsarpoints_quote_alexei_ii: "„#italic Proč mohou mít ostatní chlapci všechno a já nic?#!“\n\n— Alexej II." # todo: NEW TRANSLATION
 tsarpoints_quote_fallback: "#italic Nejvyšší moc je strážkyní myšlenky ruského státu; ztělesňuje jeho sílu a celistvost. Má-li Rusko existovat, může tak činit pouze díky společnému úsilí všech svých synů, kteří tuto moc chrání a brání — moc, jež Rusko sjednotila a chrání ho před rozpadem.#!\n\n— Pjotr Stolypin" # todo: NEW TRANSLATION
