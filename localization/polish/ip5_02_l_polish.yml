 tsarpoints_events.1.t: "Žalozpěv za třetí Řím" # todo: NEW TRANSLATION
 tsarpoints_events.1.d: "Vláda carů země $RUS_ADJ$ skončila způsobem, který byl dříve nepředstavitelný, a z [ROOT.GetCountry.GetCapital.GetCityHubName] nyní vládne [ROOT.GetCountry.GetGovernment.GetName]. Revolucionáři oslavují zánik četníka Evropy, zatímco věrní přívrženci dynastie truchlí nad zkázou třetího Říma." # todo: NEW TRANSLATION
 tsarpoints_events.1.f: "„Když jsem byl v zahraničí, četl jsem v #italic Poslednie Novosti#! popis střelby, pálení těl a tak dále. Nakolik je to všechno pravda a nakolik výmysl, nemám nejmenší tušení, protože mě nikdy nezajímalo, #italic jak#! byl rozsudek vykonán, a upřímně řečeno, takovou zvědavost nechápu.“\n\n—Lev Trockij, #italic Deník v exilu#!" # todo: NEW TRANSLATION
 tsarpoints_events.1.a: "[ROOT.GetCountry.GetName] se připojila k modernímu světu." # todo: NEW TRANSLATION
 tsarpoints_events.1.b: "Copak už Bůh nestojí při nás?" # todo: NEW TRANSLATION
 notify_upgraded_decrees_removed_tt: "\n@information! Všechny [Concept('concept_decree', '$concept_decrees|q$')], které byly prosazeny pomocí [Concept('concept_ukaz', '$concept_ukase|q$')], byly navráceny do výchozího stavu" # todo: NEW TRANSLATION
 tsarpoints_events.2.t: "Carský $concept_ukaz$ č. [ROOT.Var('ukaz_no_var').GetValue]" # todo: NEW TRANSLATION
 tsarpoints_events.2.d: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] se osobně zvlášť zajímal o přijetí zákona [SCOPE.sLaw('current_law_scope').GetName], a proto vydal ukaz nařizující jeho rychlé zavedení v celé říši." # todo: NEW TRANSLATION
 tsarpoints_events.2.f: "„[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] mě jmenoval do [GetPlayer.GetCustom('country_legislature_name')], protože důvěřuje mému úsudku! O těchto reformách stále zůstává mnoho nezodpovězených otázek.“\n\n„Ovšem. V tuto chvíli se však váš dobrý úsudek lépe uplatní při činech než při otázkách. [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] věří, že ten rozdíl znáte.“" # todo: NEW TRANSLATION
 tsarpoints_events.2.a: "Budiž vykonáno." # todo: NEW TRANSLATION
 tsarpoints_events.3.t: "Carský $concept_ukaz$ č. [ROOT.Var('ukaz_no_var').GetValue]" # todo: NEW TRANSLATION
 tsarpoints_events.3.d: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] znepokojil vzestup národního cítění mezi menšinami říše, a proto vydal ukaz zakazující veškeré publikace a představení v jazycích menšin." # todo: NEW TRANSLATION
 tsarpoints_events.3.f: "„Ach, tuhle hudbu už jsem slyšel! Zvláštní. Přísahal bych, že minule se k ní také zpívalo. Pamatuji si ta slova.“\n\nJeho přítel se usmál. Byl to zvláštní úsměv, zároveň smutný i vítězoslavný.\n\n„Jestli si je pamatuješ, zpívej si je v srdci. Všichni to děláme.“" # todo: NEW TRANSLATION
 tsarpoints_events.3.a: "Žádná samostatná kultura [GetCulture('ukrainian').GetName] neexistuje." # todo: NEW TRANSLATION
 tsarpoints_events.3.b: "Dialekt [GetCulture('byelorussian').GetName] je rozvratným polským výmyslem." # todo: NEW TRANSLATION
 tsarpoints_events.3.c: "Musíme potlačit každé revoluční spiknutí [GetCulture('polish').GetName]." # todo: NEW TRANSLATION
 tsarpoints_events.3.e: "Jazyk [GetCulture('czech').GetName] je beznadějně poněmčený." # todo: NEW TRANSLATION
 tsarpoints_events.3.g: "Zakázat jazyk [GetCulture('slovak').GetName] coby pomaďarštěný dialekt." # todo: NEW TRANSLATION
 tsarpoints_events.3.h: "Lidé [GetCulture('sorb').GetName] jsou jen nejzápadnější Rusové." # todo: NEW TRANSLATION
 tsarpoints_events.4.t: "Carský $concept_ukaz$ č. [ROOT.Var('ukaz_no_var').GetValue]" # todo: NEW TRANSLATION
 tsarpoints_events.4.d: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] vydal ukaz, v němž zdůraznil [ROOT.GetCountry.GetRuler.GetHerHis] roli panovníka mnoha národů a nařídil přísnější dohled nad loajalitou poddaných vládců země [ROOT.GetCountry.GetName]." # todo: NEW TRANSLATION
 tsarpoints_events.4.f: "„Nesmíme nikdy dopustit, aby byla pragmatičnost zaměňována za slabost. Kolik říší se rozpadlo, protože místním vládcům dovolily uvěřit, že pravomoc řešit místní problémy jim dává svrchovanost? V těchto nejistých časech, kdy se nacionalismus může zmocnit i těch nejmírnějších obyvatel, je nezbytné, aby se ti, kdo vládnou pod [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle], považovali za prodlouženou ruku [ROOT.GetCountry.GetRuler.GetHerHis] moci, nikoli za ruku pozvednutou proti [ROOT.GetCountry.GetRuler.GetHerHim].“" # todo: NEW TRANSLATION
 tsarpoints_events.4.a: "Budiž vykonáno." # todo: NEW TRANSLATION
 tsarpoints_events.5.t: "Carský $concept_ukaz$ č. [ROOT.Var('ukaz_no_var').GetValue]" # todo: NEW TRANSLATION
 tsarpoints_events.5.d: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] vydal ukaz, v němž pochválil [ROOT.GetCountry.GetRuler.GetHerHis] ministry za to, že uskutečňují [ROOT.GetCountry.GetRuler.GetHerHis] vizi říše, a tím chce posílit důvěru v [GetPlayer.GetCustom('country_legislature_name')]." # todo: NEW TRANSLATION
 tsarpoints_events.5.f: "„To je až příliš dramatické chválení důležité práce mužů, kteří, pokud vím, tráví většinu času přít se o podrobnosti státního rozpočtu.“\n\n„Ano, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] má dobrý úsudek. Právě ve státním rozpočtu bych čekal, že se jinak stabilní vláda začne hroutit.“" # todo: NEW TRANSLATION
 tsarpoints_events.5.a: "Budiž vykonáno." # todo: NEW TRANSLATION
 tsarpoints_events.6.t: "Ucho [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]" # todo: NEW TRANSLATION
 tsarpoints_events.6.d: "Nový oblíbenec [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName], [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [SCOPE.sCharacter('favourite_scope').GetFullName], si získal jeho důvěru a navrhl, aby se říšský správní aparát využil k prosazení [SCOPE.sCharacter('favourite_scope').GetHerHis] osobních záměrů." # todo: NEW TRANSLATION
 tsarpoints_events.6.f: "Když [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] předčítal text výnosu, lidé v místnosti si začali vyměňovat nesmělé pohledy.\n\nAčkoli do něj byly vloženy některé z rozpoznatelných řečnických obratů [ROOT.GetCountry.GetRuler.GetFirstNamePossessive], vše podstatné v něm znělo úplně jiným hlasem.\n\nJak tento hlas začínal být čím dál rozpoznatelnější, nepřítomnost [SCOPE.sCharacter('favourite_scope').GetFullNamePossessive] v místnosti začala působit téměř záměrně." # todo: NEW TRANSLATION
 tsarpoints_events.6.a: "Slova [SCOPE.sCharacter('favourite_scope').GetCustom('getGospodinGospozha')|l] [SCOPE.sCharacter('favourite_scope').GetLastName] mají své opodstatnění." # todo: NEW TRANSLATION
 tsarpoints_events.6.b: "Máme za to, že vážený [SCOPE.sCharacter('favourite_scope').GetCustom('getGospodinGospozha')|l] zapomíná [SCOPE.sCharacter('favourite_scope').GetHerselfHimself]." # todo: NEW TRANSLATION
 modifier_favorite_rebuffed: "Ponižující odmítnutí" # todo: NEW TRANSLATION
 tsarpoints_events.7.t: "Ve městě Konstantinově" # todo: NEW TRANSLATION
 tsarpoints_events.7.d: "Dobytím Konstantinopole [ROOT.GetCountry.GetAdjective] skončilo čtyřstoleté turecké jho nad městem. Nyní, když se tento dlouholetý sen naplnil, je [ROOT.GetCountry.GetCapital.GetCityHubName] připravena plně převzít dědictví Říma." # todo: NEW TRANSLATION
 tsarpoints_events.7.f: "Když [ROOT.GetCountry.GetRuler.GetFirstName] projížděl městem, jeho starobylá krása prosvítala i přes válečné škody. Město už zažilo horší časy. Možná by bylo troufalé myslet si, že v budoucnu nezažije ještě horší.\n\n„Měl to být starý Konstantin Pavlovič,“ pomyslel si [ROOT.GetCountry.GetRuler.GetSheHe] o [ROOT.GetCountry.GetRuler.GetHerselfHimself], „ale budu muset stačit já.“" # todo: NEW TRANSLATION
 tsarpoints_events.7.a: "Kříž opět zdobí kopuli Hagie Sofie." # todo: NEW TRANSLATION
 tsarpoints_events.7.b: "Musíme uskutečnit Kateřinin sen." # todo: NEW TRANSLATION
 tsarpoints_events.7.c: "Mramorový král se probouzí z dlouhého spánku." # todo: NEW TRANSLATION
 tsarpoints_events.7.tt_1: "Zpřístupní [concept_decision], která urovná vztahy mezi #b ekumenickým patriarchátem#! a #b ruskou církví#!." # todo: NEW TRANSLATION
 tsarpoints_events.7.tt_2: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] bude prohlášen #b císařem Hellénů#! a [GetCulture('greek').GetName] stát v [concept_personal_union] s [ROOT.GetCountry.GetAltAdjective('I')] bude ustaven s hlavním městem v #b Konstantinopoli#!" # todo: CHANGED (predtym: [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] bude prohlášen b císařem Hellénů )
 tsarpoints_events.7.tt_3: "Všechny [GetCulture('greek').GetName] [concept_homeland] [Concept('concept_state', '$concept_states|q$')] vlastněné námi nebo našimi [Concept('concept_subject', '$concept_subjects|q$')] budou převedeny na nový stát" # todo: NEW TRANSLATION
 tsarpoints_events.7.tt_4: "Všechny [concept_subject] nebo #b nezávislé#! [GetCulture('greek').GetName] [Concept('concept_country', '$concept_countries|q$')] budou pozvány, aby se #g připojily#! k tomuto novému státu: " # todo: NEW TRANSLATION
 tsarpoints_events.7.tt_5: "Změní aktivně ovládanou zemi hráče z [ROOT.GetCountry.GetAltAdjective('G')] na #b $dyn_c_empire_of_the_hellenes$#!" # todo: CHANGED (predtym: Změní aktivně ovládanou zemi hráče z [ROOT.GetCountry.GetName] na b $dyn_c_empire_of_the_hellenes$ !)
 modifier_true_heir_of_rome: "Moderní Konstantin" # todo: NEW TRANSLATION
 modifier_restoration_of_second_rome: "Návrat do Druhého Říma" # todo: NEW TRANSLATION
 modifier_orthodox_messianism: "Mesiášské nadšení" # todo: NEW TRANSLATION
 modifier_the_restorer: "Obnovitel" # todo: NEW TRANSLATION
 tsarpoints_events.8.t: "Rusko navrhuje unii s Konstantinopolí" # todo: NEW TRANSLATION
 tsarpoints_events.8.d: "Poté, co nedávno dobylo Konstantinopol a vyhlásilo novou [GetCulture('greek').GetName] říši pod svou ochranou, nyní [SCOPE.sCountry('russia_scope').GetName] navrhlo připojení našeho státu k tomu svému." # todo: NEW TRANSLATION
 tsarpoints_events.8.f: "Jaké máme štěstí, bědují, ó nebesa!\nNaši hrdinové dnes žijí v Rusech, kteří přišli!\nJak jsou k nám pokorní, jak děsivý je jejich pohled pro Turky!\nObyvatelé Argu a Nauplia se připravují na válku,\nKorintští, nebojte se —\nLeonidas je ve Spartě.\n\n— V. P. Petrov, #italic O vítězstvích v Moreji#!" # todo: NEW TRANSLATION
 tsarpoints_events.8.a: "Mramorový král procitá a svět se třese." # todo: NEW TRANSLATION
 tsarpoints_events.8.b: "Svou svobodu nevyměníme, ani za tak skvělou odměnu." # todo: NEW TRANSLATION
 tsarpoints_events.9.t: "Polocká synoda" # todo: NEW TRANSLATION
 tsarpoints_events.9.d: "V katedrále Svaté Moudrosti v Polocku se pod přísným dohledem kozácké stráže scházejí [GetPopType('clergymen').GetName] rusínské [GetReligion('catholic').GetName] církve, aby jednali o možném ukončení Brestské unie." # todo: NEW TRANSLATION
 tsarpoints_events.9.f: "Mladý kněz zvedl hlavu a rozhlédl se po místnosti. Rusofilská delegace byla pestrým shromážděním duchovních. Mnozí z nich měli jistě svá jména na nějaké moskevské výplatní listině, mezi nimi se však nepochybně našlo i mnoho opravdových věřících.\n\nI tak odhadoval, že Rusofilové mohli být přehlasováni. Rychlý pohled směrem ke strážnici, kde si muž z některého donského kozáckého pluku okázale brousil svou šašku, však ukázal, že to není možné. Ne, hlasování nedopadne v jeho prospěch, ale jako dávní mučedníci neustoupí ze svého přesvědčení. Ať už to bude mít jakékoli následky." # todo: NEW TRANSLATION
 tsarpoints_events.9.a: "Rozděleny násilím, znovu spojeny láskou. Unie je ukončena." # todo: NEW TRANSLATION
 tsarpoints_events.9.tt_1: "Všichni [GetReligion('catholic').GetName] [GetCulture('ukrainian').GetName] a [GetCulture('byelorussian').GetName] [Concept('concept_pop', '$concept_pops|q$')] přijmou [GetReligion('orthodox').GetName] [concept_religion]" # todo: NEW TRANSLATION
 tsarpoints_events.9.tt_2: "Následující se bude vztahovat na všechny [ROOT.GetCountry.GetAdjective] [Concept('concept_state', '$concept_states|q$')] s [GetReligion('catholic').GetName] [GetCulture('ukrainian').GetName] nebo [GetCulture('byelorussian').GetName] [concept_pop]:" # todo: NEW TRANSLATION
 tsarpoints_events.9.tt_3: "[GetReligion('catholic').GetName] [GetPopType('clergymen').GetName], kteří odmítnou vstoupit do [GetReligion('orthodox').GetName] církve, čeká vnitřní vyhnanství nebo smrt" # todo: NEW TRANSLATION
 modifier_uniate_dioceses_converted: "Hromadné obrácení uniatských diecézí" # todo: NEW TRANSLATION
