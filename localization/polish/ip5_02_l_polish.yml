 tsarpoints_events.11.t: "Císařský $concept_ukaz$ č. [ROOT.Var('ukaz_no_var').GetValue]" # todo: NEW TRANSLATION
 tsarpoints_events.11.d: "Ve snaze posunout rovnováhu [ROOT.GetCountry.GetRuler.GetHerHis] vlády ve prospěch [ROOT.GetCountry.GetRuler.GetHerHis] preferovaných zájmů vydal [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] ukaz, jenž uděluje [GetPlayer.GetCustom('country_legislature_name')|U] vyšší postavení a výsady jejich zástupcům." # todo: NEW TRANSLATION
 tsarpoints_events.11.f: "„Skuteční služebníci [ROOT.GetCountry.GetName]! Ne ti, kteří pouze staví zájmy říše nad své vlastní, nýbrž ti, pro které jsou jedním a tím samým. Kdo by si více zasloužil naši důvěru? Kdo by lépe vykonával naši vůli?“" # todo: NEW TRANSLATION
