 je_tp_fav_rasputin_reason: "#italic „Bůh viděl tvé slzy a vyslyšel tvé modlitby. Netruchli. Malý nezemře. Nedovol lékařům, aby ho příliš obtěžovali.“ —Grigorij Rasputin#!\n\n [SCOPE.sCharacter('fav_character_scope').GetFullName], současný [concept_favorite] [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName], si získal obdiv [ROOT.GetCountry.GetCustom('get_rus_consort_title')], když zachránil [SCOPE.sCharacter('alexei_scope').GetFullNameWithTitle] před smrtí, ačkoli dvorní lékaři selhali. Metody [SCOPE.sCharacter('fav_character_scope').GetLastNameNoFormatting] jsou sice velmi neobvyklé, ale zdravotní stav [SCOPE.sCharacter('alexei_scope').GetFirstNameNoFormatting] se pod péčí léčitele vírou výrazně zlepšil. S rostoucím vlivem [SCOPE.sCharacter('fav_character_scope').GetLastNameNoFormatting] v městě [ROOT.GetCountry.GetCapital.GetCityHubName] mnozí žádají [SCOPE.sCharacter('fav_character_scope').GetHerHis] odvolání. [ROOT.GetCountry.GetCustom('get_rus_consort_title')] však trvá na svém — [SCOPE.sCharacter('fav_character_scope').GetFullNameNoFormatting] musí zůstat. [SCOPE.sCharacter('fav_character_scope').GetHerHis|U] léčba je pro přežití [SCOPE.sCharacter('alexei_scope').GetFirstNameNoFormatting] zásadní. Poslat [SCOPE.sCharacter('fav_character_scope').GetLastNameNoFormatting] pryč by mladému [SCOPE.sCharacter('alexei_scope').GetPrimaryRoleTitle] jistě zpečetilo tragický osud." # todo: NEW TRANSLATION
