 notification_je_tp_mission_partial_completed_desc: "Předchozí [concept_ruler] země [SCOPE.sJournalEntry('je_tp_partial_mission_scope').GetCountry.GetName] pokročil v plnění své agendy #b [SCOPE.sJournalEntry('je_tp_partial_mission_scope').GetName]#!, ale nedokončil ji. Získal tak #v [SCOPE.sJournalEntry('je_tp_partial_mission_scope').MakeScope.Var('tp_partial_reward_var').GetValue|0]#! @tsarpoints! [concept_tsarpoints]." # todo: NEW TRANSLATION
