 notification_je_tp_mission_failed_desc: "Vzhledem ke změnám v celostátní situaci byla agenda #b [SCOPE.sJournalEntry('je_tp_failed_mission_scope').GetName]#! odložena. V důsledku toho [concept_tsarpoints] #r klesly#! o [GetPlayer.MakeScope.ScriptValue('tsarpoints_value_low')|v0]." # todo: NEW TRANSLATION
 notification_je_tp_mission_failed_favorite_died_name: "[SCOPE.sJournalEntry('je_tp_failed_mission_scope').GetName] opuštěno" # todo: NEW TRANSLATION
 notification_je_tp_mission_failed_favorite_died_desc: "Oblíbenec [concept_ruler] zemřel dříve, než se podařilo dokončit agendu #b [SCOPE.sJournalEntry('je_tp_failed_mission_scope').GetName]#!. V důsledku toho [concept_tsarpoints] #r klesly#! o [GetPlayer.MakeScope.ScriptValue('tsarpoints_value_low')|v0]." # todo: NEW TRANSLATION
 notification_je_tp_mission_failed_favorite_dismissed_name: "[SCOPE.sJournalEntry('je_tp_failed_mission_scope').GetName] opuštěno" # todo: NEW TRANSLATION
 notification_je_tp_mission_failed_favorite_dismissed_desc: "Oblíbenec [concept_ruler] upadl v nemilost dříve, než se podařilo dokončit agendu #b [SCOPE.sJournalEntry('je_tp_failed_mission_scope').GetName]#!. V důsledku toho [concept_tsarpoints] #r klesly#! o [GetPlayer.MakeScope.ScriptValue('tsarpoints_value_low')|v0]." # todo: NEW TRANSLATION
