 je_tp_pool_develop_frontier_reason: "Snad více než cokoli jiného definují [ROOT.GetCountry.GetName] její rozlehlé pohraničí a neustálé pokusy o jeho osídlení. [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] považuje osidlování východního a jižního pohraničí za romantický podnik i za zásadní úkol pro bezpečnost říše. [ROOT.GetCountry.GetRuler.GetSheHe|U] chce vyslat kozáky a rolnické osadníky, aby osídlili ruské periferie, a zajistit rozvoj bohatých zdrojů v oblasti [GetGeographicRegion('geographic_region_siberia').GetName]." # todo: NEW TRANSLATION
