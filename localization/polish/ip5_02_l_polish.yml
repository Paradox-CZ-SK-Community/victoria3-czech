 je_tp_fav_finance_reason: "[SCOPE.sCharacter('fav_character_scope').GetFullName], současný [concept_favorite] [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName], je přesvědčeným ekonomickým liberálem, který zastává názor, že státní kontrola [ROOT.GetCountry.GetAdjective] ekonomiky brzdí podnikání. [SCOPE.sCharacter('fav_character_scope').GetCustom('getGospodinGospozha')] [SCOPE.sCharacter('fav_character_scope').GetLastName] proto navrhuje prodat mnoho státních podniků do soukromých rukou a přijmout liberální ekonomické zákony." # todo: NEW TRANSLATION
