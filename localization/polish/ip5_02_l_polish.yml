 notification_je_tp_mission_failed_new_ruler_desc: "Předchozí [concept_ruler] země [SCOPE.sJournalEntry('je_tp_failed_mission_scope').GetCountry.GetName] nedokázal dokončit svou agendu #b [SCOPE.sJournalEntry('je_tp_failed_mission_scope').GetName]#!. V důsledku toho [concept_tsarpoints] #r klesly#! o [GetPlayer.MakeScope.ScriptValue('tsarpoints_value_low')|v0]." # todo: NEW TRANSLATION
