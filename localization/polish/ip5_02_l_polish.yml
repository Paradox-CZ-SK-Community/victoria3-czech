 je_tsarpoints_button_1_name: "Uplatnit císařskou výsadu" # todo: NEW TRANSLATION
 je_tsarpoints_button_1_desc: "Příprava a zavádění zákonů v zemi [ROOT.GetCountry.GetName] bývá často zdlouhavý proces, do něhož se zapojuje #b Státní rada#! a právníci #b Druhé sekce#!. Pokud [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] považuje nějakou záležitost za obzvlášť důležitou, [ROOT.GetCountry.GetRuler.GetSheHe] může využít [concept_tsarpoints] k urychlení [Concept('concept_enactment_of_laws','$concept_enactment_of_laws_enactment|q$')] [concept_law], který si přeje [ROOT.GetCountry.GetRuler.GetHerselfHimself] nebo [ROOT.GetCountry.GetRuler.GetHerHis] [concept_favorite]." # todo: NEW TRANSLATION
 je_tsarpoints_button_1_short_desc: "Naší svrchovanou vůlí nechť zákon urychleně vejde v platnost a nikdo jej nezdržuje..." # todo: NEW TRANSLATION
 je_tsarpoints_button_1_desc_tt: "[Concept('concept_enactment_of_laws', '$concept_enactment_of_laws_enactment|q$')] právě přijímaného zákona v zemi [ROOT.GetCountry.GetNameNoFlag] postoupí o #v 2#! [Concept('concept_enactment_phase','$concept_enactment_phases_short|q$')]" # todo: NEW TRANSLATION
 currently_enacting_law_favored_by_tsar_tt: "[Concept('concept_enactment_of_laws','$concept_enactment_of_laws_enactment|q$')] zákona [ROOT.GetCountry.GetLawBeingEnacted.GetName] je [Concept('concept_endorse_oppose','$concept_endorsed|q$')] [concept_ruler]" # todo: NEW TRANSLATION
 currently_enacting_law_favored_by_favorite_tt: "[Concept('concept_enactment_of_laws','$concept_enactment_of_laws_enactment|q$')] zákona [ROOT.GetCountry.GetLawBeingEnacted.GetName] je [Concept('concept_endorse_oppose','$concept_endorsed|q$')] [concept_favorite]" # todo: NEW TRANSLATION
 je_tsarpoints_button_2_name: "Potlačit provinční kulturu" # todo: NEW TRANSLATION
 je_tsarpoints_button_2_desc: "Čím blíže se člověk dostává k západním hranicím říše, tím více se dominance [GetCulture('russian').GetName] jazyka rozplývá v tom, co vláda [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] považuje za řadu podivných nářečí. Pokud [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] pocítí hrozbu v rostoucí [concept_fervor] [concept_culture] #b $language_east_slavic$#! či #b $language_west_slavic$#!, může využít [concept_tsarpoints] k potlačení publikací, vystoupení a vzdělávání v daném jazyce." # todo: NEW TRANSLATION
 je_tsarpoints_button_2_short_desc: "Abychom potlačili nebezpečnou činnost separatistů a polské zájmy..." # todo: NEW TRANSLATION
 je_tsarpoints_button_2_name_tt_1: "Okamžitě sníží [concept_fervor] vybrané [concept_culture] #b $language_east_slavic$#! nebo #b $language_west_slavic$#! o #v 5#! a přidá modifikátor $concept_fervor$ typu Proportional s hodnotou #v -10#!" # todo: NEW TRANSLATION
 je_tsarpoints_button_2_name_tt_2: "[GetPlayer.MakeScope.ScriptValue('large_radicals')|-=1%] [Concept('concept_pop', '$concept_pops|q$')] typu [GetPopType('academics').GetName] vybrané [concept_culture] se stanou více [concept_radical]" # todo: NEW TRANSLATION
 je_tsarpoints_can_suppress_any_slavic_culture_tt: "[ROOT.GetCountry.GetNameNoFlag] nebo některý z jejích [Concept('concept_subject','$concept_subjects|q$')] ovládá libovolný [concept_state] [concept_homeland] nenáležící [concept_culture] [GetCulture('russian').GetName] jazyka #b $language_east_slavic$#! nebo #b $language_west_slavic$#!, která již není potlačována" # todo: NEW TRANSLATION
 je_tsarpoints_culture_not_suppressed_tt: "Tato [concept_culture] již není potlačována" # todo: NEW TRANSLATION
 je_tsarpoints_button_3_name: "Posílit svrchovanost" # todo: NEW TRANSLATION
 je_tsarpoints_button_3_desc: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] nevládne všem [ROOT.GetCountry.GetRuler.GetHerHis] poddaným přímo. Na rozmanitých hranicích říše je ke státní moci Ruska nezbytná spolupráce drobných panovníků. Ať už mají titul knížete, chána, agha-sultána či šamchala, využití [concept_tsarpoints] jim může připomenout jejich věrnost [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName]." # todo: NEW TRANSLATION
 je_tsarpoints_button_3_short_desc: "My, dědičný svrchovaný vládce těchto zemí a krajů..." # todo: NEW TRANSLATION
 modifier_tsarpoints_liberty_desire_boost: "Bdělý otec" # todo: NEW TRANSLATION
 modifier_tsarpoints_ig_boost: "Císařská záštita" # todo: NEW TRANSLATION
 je_tsarpoints_button_4_name: "Zajistit vládě důvěru" # todo: NEW TRANSLATION
 je_tsarpoints_button_4_desc: "Úcta, kterou lid projevuje [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName], se často nevztahuje na [ROOT.GetCountry.GetRuler.GetHerHis] ministry. Představa zlého rádce, který klame dobrého [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle], je dobře známá každému rolníkovi v říši. Pokud snahu [GetPlayer.GetCustom('country_legislature_name')] maří síly malé či velké, může [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] využít [ROOT.GetCountry.GetRuler.GetHerHis] [concept_tsarpoints] a ujistit lid, že [ROOT.GetCountry.GetRuler.GetHerHis] ministři mají [ROOT.GetCountry.GetRuler.GetHerHis] důvěru a není se čeho bát." # todo: NEW TRANSLATION
 je_tsarpoints_button_4_short_desc: "[GetPlayer.GetCustom('country_legislature_name')|U] nezapomene učinit veškerá náležitá opatření..." # todo: NEW TRANSLATION
 modifier_tsarpoints_legitimacy_boost: "Císařská důvěra" # todo: NEW TRANSLATION
 je_tsarpoints_button_5_name: "Podpořit zájmovou skupinu" # todo: NEW TRANSLATION
 je_tsarpoints_button_5_desc: "Skutečná moc [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] pramení z [ROOT.GetCountry.GetRuler.GetHerHis] schopnosti upřednostnit jednu mocnou zájmovou skupinu před druhou. Využitím [ROOT.GetCountry.GetRuler.GetHerHis] [concept_tsarpoints] ve prospěch určitých osobností v rámci [GetPlayer.GetCustom('country_legislature_name')] může [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] zvýšit [concept_clout] skupin, s nimiž jsou tyto osobnosti spojeny." # todo: NEW TRANSLATION
 je_tsarpoints_button_5_short_desc: "Upozornit na chvályhodnou práci váženého ministra..." # todo: NEW TRANSLATION
 je_tsarpoints_button_6_name: "Posílit menší ukaz" # todo: NEW TRANSLATION
 je_tsarpoints_button_6_desc: "Aby mohl [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] vládnout rozsáhlé říši, musí věnovat značnou část [ROOT.GetCountry.GetRuler.GetHerHis] svého času rozhodnutím o různých provinčních iniciativách a záležitostech. Pokud [ROOT.GetCountry.GetRuler.GetSheHe] si to přeje, může [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] využít [concept_tsarpoints] k vyčlenění dalších prostředků na to, aby [ROOT.GetCountry.GetRuler.GetHerHis] rozhodnutí menšího rozsahu byla provedena včas a účinně." # todo: NEW TRANSLATION
 je_tsarpoints_button_6_short_desc: "My, s neochvějným odhodláním tyto potřeby neprodleně uspokojit..." # todo: NEW TRANSLATION
 je_tsarpoints_button_7_name: "Dosadit oblíbeného vládce" # todo: NEW TRANSLATION
 je_tsarpoints_button_7_desc: "V [ROOT.GetCountry.GetCapital.GetCityHubName] není nouze o ambiciózní syny, stejně jako o věrné agenty na dvorech drobných panovníků v okolí. Stejně jako císařovna Kateřina dosadila na polský trůn loutkového krále, může [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] využít své [concept_tsarpoints] k nahrazení vládců poddaných zemí [ROOT.GetCountry.GetName] vstřícnějšími kandidáty — syny [ROOT.GetCountry.GetAdjectiveNoFormatting] dvora, [GetCulture('east_german').GetName] dobrodruhy z Pobaltí nebo místními uchazeči věrnými [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]." # todo: NEW TRANSLATION
 je_tsarpoints_button_7_short_desc: "Neschopnost tohoto muže je zřejmá a jeho trůn je již v duchu uprázdněn..." # todo: NEW TRANSLATION
