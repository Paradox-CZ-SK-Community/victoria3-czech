 je_tsarpoints_button_8_name: "Svolat synod v Polocku" # todo: NEW TRANSLATION
 je_tsarpoints_button_8_desc: "Roku #b 1596#! se v #b Polsko-litevské unii#! konala #b Brestská unie#!. [GetReligion('orthodox').GetName] církve na území #b Rusi#! tehdy přijaly papežskou autoritu, zachovaly si však východní ritus. Takto vzniklá #b rusínská [GetReligion('catholic').GetName] církev#! měla v těchto zemích od té doby značný vliv, a to i po jejich připojení k zemi [ROOT.GetCountry.GetName] v důsledku #b druhého#! a #b třetího dělení Polska#!. \n\nVláda #b uniatů#! nad [GetCulture('ukrainian').GetName] lidem byla z velké části zlomena za vlády #b Kateřiny Veliké#!, ale církev zůstává pevně zakořeněna v důsledněji polonizovaných [Concept('concept_homeland','$concept_homelands|q$')] [GetCulture('byelorussian').GetName].\n\nProruské živly v #b rusínské [GetReligion('catholic').GetName] církvi#! nyní prosazují opětovné sjednocení a ukončení #b Brestské unie#!. Podporují je [GetReligion('orthodox').GetName] metropolité z Moskvy a Kyjeva." # todo: NEW TRANSLATION
 je_tsarpoints_button_8_short_desc: "Za sjednocení uniatů s pravoslavnou církví celé Rusi..." # todo: NEW TRANSLATION
 je_tsarpoints_button_9_name: "Posílit kontrarevoluci" # todo: NEW TRANSLATION
 je_tsarpoints_button_9_desc: "Reakcionářské názory [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] vynesly [ROOT.GetCountry.GetName] v západním tisku přezdívku „Žandarm Evropy“. Během [glossary_revolutions_of_1830] požádal [ROOT.GetCountry.GetRuler.GetSheHe] Vídeň o povolení použít ruské síly k rozdrcení #b Belgie#! a francouzské #b Červencové monarchie#!, ale král Friedrich Wilhelm a kancléř Metternich žádosti nevyhověli. [ROOT.GetCountry.GetRuler.GetHerHis|U] zdrženlivost byla odměněna krvavým Listopadovým povstáním v Polsku, které přineslo revoluci až do #b Minsku#! a #b Podolí#!.\n\nNyní, když se [GetGeographicRegion('geographic_region_europe').GetName] šíří vzpoura a bezpráví, může [ROOT.GetCountry.GetRuler.GetSheHe] využít [ROOT.GetCountry.GetRuler.GetHerHis] [concept_tsarpoints] a znovu nabídnout [ROOT.GetCountry.GetRuler.GetHerHis] vojska právoplatným panovníkům, kteří se ocitli uvězněni vynucenými ústavami." # todo: NEW TRANSLATION
 je_tsarpoints_button_9_short_desc: "Slyšte, národy, a poddejte se, neboť Bůh je s námi!" # todo: NEW TRANSLATION
 je_tsarpoints_button_9_any_target_tt: "Alespoň jeden [concept_country] v [GetGeographicRegion('geographic_region_europe').GetName] má [concept_journal_entry] #v $je_red_summer$#! a nevyhostil [GetPlayer.GetAdjective] diplomaty" # todo: NEW TRANSLATION
 je_tsarpoints_button_9_effect_tt: "Každý [concept_country] v [GetGeographicRegion('geographic_region_europe').GetName] s [concept_journal_entry] #v $je_red_summer$#! získá po dobu [GetPlayer.MakeScope.ScriptValue('tsarpoints_counter_revolution_ukaz_duration_years_value')|v0] let měsíčně [GetPlayer.MakeScope.ScriptValue('tsarpoints_counter_revolution_ukaz_value')|+v0] postupu k #b kontrarevoluci#!" # todo: NEW TRANSLATION
 je_tsarpoints_button_9_effect_subject_tt: "Každý [concept_subject] [ROOT.GetCountry.GetAdjective] s [concept_journal_entry] #v $je_red_summer$#! získá po dobu [GetPlayer.MakeScope.ScriptValue('tsarpoints_counter_revolution_ukaz_duration_years_value')|v0] let měsíčně [GetPlayer.MakeScope.ScriptValue('tsarpoints_counter_revolution_ukaz_subject_value')|+v0] postupu k #b kontrarevoluci#!" # todo: NEW TRANSLATION
