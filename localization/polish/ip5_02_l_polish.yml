 je_tp_tsar_gendarme_of_europe: "Žandarm Evropy" # todo: NEW TRANSLATION
 je_tp_tsar_gendarme_of_europe_reason: "Ideologická doktrína „#b pravoslaví, samoděržaví a národnost#!“, kterou v roce #b 1833#! formuloval #b Sergej Uvarov#!, vystihuje osobní i politické smýšlení [SCOPE.sCharacter('nicholas_i_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('nicholas_i_scope').GetFullName].\n\nJako zapřisáhlý ultrareakcionář se [SCOPE.sCharacter('nicholas_i_scope').GetPrimaryRoleTitle] hlásí k zásadám pořádku a samoděržaví doma i v zahraničí a neváhá použít značnou sílu, aby zabránil opakování dalšího [Glossary('glossary_decembrists','děkabristického')] či [GetCulture('polish').GetName] povstání." # todo: NEW TRANSLATION
 je_tp_tsar_great_reform: "Velký reformátor" # todo: NEW TRANSLATION
 je_tp_tsar_great_reform_reason: "$je_great_reformer_reason$" # todo: NEW TRANSLATION
 je_tp_tsar_crown_of_perfection: "Koruna dokonalosti" # todo: NEW TRANSLATION
 je_tp_tsar_crown_of_perfection_reason: "Od útlého věku byl [SCOPE.sCharacter('nixa_scope').GetFullName] svými učiteli oslavován jako zlaté dítě, předurčené stát se nejosvícenějším panovníkem na světě. Jeho nástup na trůn uvítala [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName] jako příchod nového Petra Velikého.\n\n[SCOPE.sCharacter('nixa_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('nixa_scope').GetFirstNameNoFormatting], celý život obklopen nadějemi $ig_intelligentsia$, začal sám sebe považovat za osvíceného patriarchu, jehož úkolem je pokračovat v díle [SCOPE.sCharacter('nixa_scope').GetHerHis] otce a pozvednout [ROOT.GetCountry.GetName] ze zaostalosti do čela Evropy. Pod [SCOPE.sCharacter('nixa_scope').GetHerHis] laskavým vedením se říše rolníků promění v moderní národ a dvůr v [ROOT.GetCountry.GetCapital.GetCityHubName] se stane světlem, které povede svět." # todo: NEW TRANSLATION
 je_tp_tsar_unshakable_autocracy: "Neotřesitelné samoděržaví" # todo: NEW TRANSLATION
 je_tp_tsar_unshakable_autocracy_reason: "Strohé, vousaté a mohutné postavy, [SCOPE.sCharacter('alexander_iii_scope').GetFullName] měl podle představ svého reformně smýšlejícího otce sloužit v běžné vojenské kariéře velkoknížete. Osud tomu však chtěl jinak. Předčasná smrt [SCOPE.sCharacter('alexander_iii_scope').GetHerHis] staršího bratra mu na bedra vložila odpovědnost za vládu, na niž nebyl připraven.\n\nJako [SCOPE.sCharacter('alexander_iii_scope').GetPrimaryRoleTitle] přistupoval [SCOPE.sCharacter('alexander_iii_scope').GetFirstNameNoFormatting] k vládnutí s hrubým, nacionalistickým smýšlením ruského vojáka. Obklopil se reakcionářskými poradci a každý ústupek liberalismu považuje za smrtelnou hrozbu pro říši. Samoděržaví je pro něj posvátným závazkem mezi [SCOPE.sCharacter('alexander_iii_scope').GetPrimaryRoleTitle] a poddanými a jeho popření znamená zapřít samotného Boha." # todo: NEW TRANSLATION
 je_tp_tsar_heir_of_alexander: "Neochotný samovládce" # todo: NEW TRANSLATION
 je_tp_tsar_heir_of_alexander_reason: "V [SCOPE.sCharacter('nicholas_ii_scope').GetHerHis] mládí se [SCOPE.sCharacter('nicholas_ii_scope').GetFullName] zdráhal nastoupit na trůn. Přísná výchova milovaného otce a reakcionářských učitelů sice [SCOPE.sCharacter('nicholas_ii_scope').GetHerHim] připravila na [SCOPE.sCharacter('nicholas_ii_scope').GetHerHis] úlohu nezpochybnitelného samovládce, ale [SCOPE.sCharacter('nicholas_ii_scope').GetHerHis] nerozhodnost a touha zavděčit se všem přetrvávají.\n\nVýsledkem této výchovy je zvláštní rozpor: panovník, který chce soustředit veškerou moc do vlastních rukou, ale neumí ji účinně využívat. Bez vlastní vize si [SCOPE.sCharacter('nicholas_ii_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('nicholas_ii_scope').GetFirstNameNoFormatting] přeje pokračovat ve šlépějích [SCOPE.sCharacter('nicholas_ii_scope').GetHerHis] otce. Zbožná víra a zachování toho, co [SCOPE.sCharacter('nicholas_ii_scope').GetSheHe] považuje za [SCOPE.sCharacter('nicholas_ii_scope').GetHerHis] božské právo vládnout, zůstávají vždy středem [SCOPE.sCharacter('nicholas_ii_scope').GetHerHis] myšlenek." # todo: NEW TRANSLATION
 je_tp_pool_establish_duma: "Svolat [GetPlayer.GetCustom('rus_duma_or_zemsky_sobor')]" # todo: NEW TRANSLATION
 je_tp_pool_establish_duma_concluded: "Svolat Dumu" # todo: NEW TRANSLATION
 je_tp_pool_establish_duma_reason: "Ukázalo se, že [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] nemůže vládnout sám. [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] uznal(a), že je třeba rozšířit okruh [ROOT.GetCountry.GetRuler.GetHerHis] poradců a zapojit veřejnost do stále složitější správy říše. Za tímto účelem chce [ROOT.GetCountry.GetRuler.GetSheHe] svolat [GetPlayer.GetCustom('rus_duma_or_zemsky_sobor')][GetPlayer.GetCustom('rus_duma_or_zemsky_sobor_2')]." # todo: NEW TRANSLATION
 je_tp_pool_bureaucratic_reform: "Zahájit byrokratickou reformu" # todo: NEW TRANSLATION
 je_tp_pool_bureaucratic_reform_reason: "Nedostatky státní byrokracie [ROOT.GetCountry.GetAdjective] jsou zjevné každému, kdo je spatří. Gubernie rozlohou srovnatelné s evropskými zeměmi spravuje hrstka úředníků a nepočetná vojenská posádka, zatímco v sibiřských lesích nerušeně žijí celé komunity odpůrců režimu. [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] se rozhodl(a) rozšířit působnost státní správy do každé vesnice říše a zmapovat [ROOT.GetCountry.GetRuler.GetHerselfHimself] její rozsáhlá území." # todo: NEW TRANSLATION
 je_tp_pool_educational_reform: "Zahájit reformu školství" # todo: NEW TRANSLATION
 je_tp_pool_educational_reform_reason: "Stát [ROOT.GetCountry.GetAdjective] se vznáší nad mořem negramotných rolníků, ale často nedokáže proniknout pod jeho hladinu. Rozšířená negramotnost ohrožuje zamýšlený hospodářský program [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] a podporuje šíření povrchního radikalismu. [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] chce podporovat vědecký výzkum, vzdělávání obyvatelstva a vznik domácí ruské vrstvy učitelů." # todo: NEW TRANSLATION
 je_tp_pool_citizenship_reform: "Zahájit reformu občanství" # todo: NEW TRANSLATION
 je_tp_pool_citizenship_reform_reason: "Na území [ROOT.GetCountry.GetName] žije nesmírné množství národů a rozsáhlé oblasti, kde rusky mluví pouze vysocí státní úředníci. Odcizit si tyto komunity by vážně ohrozilo schopnost státu vládnout. [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] proto chce v říši zavést systém občanství a rozšířit práva menšinových komunit." # todo: NEW TRANSLATION
 je_tp_pool_decrease_landowner_influence: "Oslabit šlechtu" # todo: NEW TRANSLATION
 je_tp_pool_decrease_landowner_influence_reason: "Ruští šlechtici, kteří se tradičně drží zastaralých způsobů výroby a mají sklon k palácovým převratům, představují hrozivou protiváhu jakémukoli reformnímu programu. [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] chce oslabit jejich politický vliv ve prospěch vstřícných intelektuálů, státní byrokracie a produktivních tříd." # todo: NEW TRANSLATION
 landowners_ideology_close_enough_tt: "[concept_leader] [GetInterestGroupVariant('ig_landowners',GetPlayer).GetName] ([GetInterestGroupVariant('ig_landowners',GetPlayer).GetLeader.GetIdeology.GetName]) má [concept_ideology] slučitelnou s [concept_ruler] ([ROOT.GetCountry.GetRuler.GetIdeology.GetName])" # todo: NEW TRANSLATION
 legislature_zemsky_sobor_followup: ", dávný parlament ruského carství" # todo: NEW TRANSLATION
 legislature_duma_followup: " coby široce volená dolní komora Státní rady" # todo: NEW TRANSLATION
 je_tp_pool_abolish_duma: "Rozpustit [GetPlayer.GetCustom('rus_duma_or_zemsky_sobor')]" # todo: NEW TRANSLATION
 je_tp_pool_abolish_duma_concluded: "Rozpustit Dumu" # todo: NEW TRANSLATION
 je_tp_pool_abolish_duma_reason: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] považuje svolání [GetPlayer.GetCustom('rus_duma_or_zemsky_sobor')] za smrtelnou hrozbu pro celistvost říše. Intriky politiků ohrožují postavení [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] i [ROOT.GetCountry.GetRuler.GetHerHis] rodiny a revolucionáři zneužívají svých zákonodárných výsad k pronášení vlastizrádných řečí. [ROOT.GetCountry.GetRuler.GetSheHe|U] si přeje tento orgán rozpustit a obnovit [ROOT.GetCountry.GetRuler.GetHerHis] náležité samovládné pravomoci." # todo: NEW TRANSLATION
 je_tp_pool_secret_police: "Posílit veřejnou bezpečnost" # todo: NEW TRANSLATION
 je_tp_pool_secret_police_reason: "Osud západního absolutismu pod revoluční gilotinou poučil [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName], že za každým rohem číhají potenciální atentátníci a revolucionáři. Za každého agitátora, kterého bezpečnostní složky pošlou do $geographic_region_siberia$, se jich deset skrývá mimo jejich dosah v rolnických vesnicích, předměstských sklepích a švýcarských hotelech.\n\nV boji proti těmto hrozbám si [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] přeje [GetLawType('law_secret_police').GetName], která dokáže vnést světlo do nejtemnějších zákoutí [ROOT.GetCountry.GetName] a zajistit, aby nezůstalo žádné skryté místo, odkud by revolucionáři mohli vzdorovat [ROOT.GetCountry.GetRuler.GetHerHim].[ROOT.GetCountry.GetCustom('getOkhranaInstructions')]" # todo: NEW TRANSLATION
 je_tp_pool_suppress_revolts: "Potlačit politický nesouhlas" # todo: NEW TRANSLATION
 je_tp_pool_suppress_revolts_reason: "Carové se po celé století obávali dvojí hrozby: palácového převratu a rolnické vzpoury. [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName], dobře obeznámený s pustošením Pugačovova povstání a osudy dědiců Kateřiny, chce zajistit, aby žádné spiknutí proti [ROOT.GetCountry.GetRuler.GetHerHis] vládě nemohlo [ROOT.GetCountry.GetRuler.GetHerHim] svrhnout z trůnu — ať už vzejde z polí u Orenburgu, nebo z chodeb Zimního paláce." # todo: NEW TRANSLATION
 je_tp_pool_suppress_revolts_goal: "Po dobu [ROOT.GetCountry.MakeScope.ScriptValue('tsarpoints_goal_duration_years_value')|v0] let nedošlo k žádné [concept_insurrection] ani [concept_coup]" # todo: NEW TRANSLATION
 je_tp_pool_develop_capital: "Rozvíjet hlavní město" # todo: NEW TRANSLATION
 je_tp_pool_develop_capital_reason: "[ROOT.GetCountry.GetCapital.GetCityHubName], sídlo [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] a dvorské šlechty, je již nyní považován za jedno z nejvýznamnějších měst Evropy. [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] vnímá postavení města jako odraz prestiže ruského samoděržaví a přeje si, aby soupeřilo s Paříží či Londýnem jako vzorové císařské hlavní město — kulturní, prosperující a klidné." # todo: NEW TRANSLATION
 je_tp_pool_cultural_dominance: "Udržet ruskou nadvládu" # todo: NEW TRANSLATION
 je_tp_pool_cultural_dominance_reason: "Doktrína hraběte #b Sergeje Uvarova#!, ministra školství Mikuláše I., ustanovila národní identitu [GetCulture('russian').GetName] jako jeden ze tří pilířů říše. [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName], zapřisáhlý stoupenec národnosti $russian$, se domnívá, že kultura [GetCulture('russian').GetName] musí zaujímat nejvyšší postavení a že národnostní menšiny i cizí kultury nesmějí ohrozit její nadvládu." # todo: NEW TRANSLATION
 je_tp_pool_cultural_dominance_goal: "Podíl [concept_political_strength] [concept_culture] [GetCulture('russian').GetName] zůstává po dobu [ROOT.GetCountry.MakeScope.ScriptValue('tsarpoints_goal_duration_years_value')|v0] let nad [ROOT.GetCountry.MakeScope.ScriptValue('tsarpoints_cultural_dominance_polstr_share_value')|v0%]" # todo: NEW TRANSLATION
 okhrana_button_hint_tt: "\n\n@information! [concept_decision] #v $rus_upgrade_secret_police$#! lze využít k reformě [concept_law] [GetLawType('law_third_section').GetName] na [GetLawType('law_okhrana').GetName]" # todo: NEW TRANSLATION
