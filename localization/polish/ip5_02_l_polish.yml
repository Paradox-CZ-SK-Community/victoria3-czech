 tsarpoints_events.13.t: "Císařský $concept_ukaz$ č. [ROOT.Var('ukaz_no_var').GetValue]" # todo: NEW TRANSLATION
 tsarpoints_events.13.d: "Selhání [SCOPE.sCharacter('old_ruler_scope').GetPrimaryRoleTitle] v zemi [SCOPE.sCountry('relevant_country_scope').GetName] jsou příliš závažná, než aby je bylo možné přehlížet. [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] vydal ukaz [ROOT.GetCountry.GetRuler.GetHerHis] agentům na dvoře [SCOPE.sCountry('relevant_country_scope').GetAdjectiveNoFormatting], aby [SCOPE.sCharacter('old_ruler_scope').GetPrimaryRoleTitle] nahradili vstřícnějším uchazečem." # todo: NEW TRANSLATION
 tsarpoints_events.13.f: "„[ROOT.GetCountry.GetRuler.GetSheHe|U] kdysi stavěl [ROOT.GetCountry.GetRuler.GetHerHis] malé hračkové vojáčky do řady,“ přemítala stará carevna-vdova, „od nejmilejšího po nejméně oblíbeného. Ačkoli si [ROOT.GetCountry.GetRuler.GetSheHe] nějak hrál víc s těmi oblíbenými, vždycky se jako první ztratili ti nejméně oblíbení a bylo třeba je nahradit.“\n\nPovzdechla si.\n\n„Možná se toho tolik nezměnilo!“„" # todo: NEW TRANSLATION
 tsarpoints_events.13.a: "Povoláme kandidáta z pobaltské německé šlechty." # todo: NEW TRANSLATION
 tsarpoints_events.13.b: "Jmenujeme syna dvora [ROOT.GetCountry.GetAdjectiveNoFormatting]." # todo: NEW TRANSLATION
 tsarpoints_events.13.c: "Máme vznešeného místního kandidáta v osobě [SCOPE.sCharacter('local_puppet_ruler_scope').GetFullName]." # todo: NEW TRANSLATION
