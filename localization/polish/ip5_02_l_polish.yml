 je_tp_tsar_gendarme_of_europe_button_1_name: "Posílit Svatou alianci" # todo: NEW TRANSLATION
 je_tp_tsar_gendarme_of_europe_button_1_desc: "#b Svatá aliance#! vznikla po napoleonských válkách jako konzervativní spojenectví, jehož cílem bylo zastavit šíření liberálních a revolučních myšlenek a hnutí.\n\n[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] považuje tuto síť konzervativních spojenectví za důležitý prvek v boji za zachování politické stability v oblasti [GetGeographicRegion('geographic_region_europe').GetName] a chce ji využít k potlačení všech revolučních nepokojů." # todo: NEW TRANSLATION
 je_tp_tsar_gendarme_of_europe_button_2_name: "Potírat podvratné živly" # todo: NEW TRANSLATION
 je_tp_tsar_gendarme_of_europe_button_2_desc: "Zkušenosti [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] s rádoby liberálními pučisty a [GetCulture('polish').GetName] povstalci zasely do již tak reakční mysli jeho veličenstva téměř paranoidní strach z podvratných živlů. Neodpočine si, dokud nebudou jejich vůdci, skuteční či domnělí, zastřeleni nebo uvězněni." # todo: NEW TRANSLATION
 je_tp_tsar_gendarme_of_europe_button_3_name: "Hájení pravoslaví" # todo: NEW TRANSLATION
 je_tp_tsar_gendarme_of_europe_button_3_desc: "Prvním z pilířů pravoslaví, samoděržaví a národnosti je víra [GetReligion('orthodox').GetName]. [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] si přeje posílit pravoslaví na hranicích říše, a to jak prostřednictvím misionářské činnosti v nezkroceném Dálném východě, tak zajišťováním konverzí z odlišných křesťanských vyznání Západu." # todo: NEW TRANSLATION
 je_tp_tsar_gendarme_of_europe_button_4_name: "Rozšiřovat ruský vliv" # todo: NEW TRANSLATION
 je_tp_tsar_gendarme_of_europe_button_4_desc: "Ačkoli [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] zůstává pevně odhodlán zachovat stabilitu a povídeňský #italic status quo#! v Evropě, [ROOT.GetCountry.GetRuler.GetHerHis] postoj k jižním a východním hranicím země [ROOT.GetCountry.GetName] je pružnější." # todo: NEW TRANSLATION
 je_tp_tsar_unshakable_autocracy_button_1_name: "Posílit samovládu" # todo: NEW TRANSLATION
 je_tp_tsar_unshakable_autocracy_button_1_desc: "Reformní povaha předchůdce [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] na jeho syna nepřešla. [ROOT.GetCountry.GetRuler.GetFirstNameNoFormatting] považuje každý ústupek liberalismu za dávku jedu, který rozleptává [ROOT.GetCountry.GetAdjective] monarchii, a přeje si rozdrtit každou možnou hrozbu tradičnímu řádu." # todo: NEW TRANSLATION
 je_tp_tsar_unshakable_autocracy_button_2_name: "Přijmout ruskou národnost" # todo: NEW TRANSLATION
 je_tp_tsar_unshakable_autocracy_button_2_desc: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] ztělesňuje a přijímá myšlenku ruského nacionalismu: nosí vousy a odmítá dvorské protokoly inspirované Západem. [ROOT.GetCountry.GetRuler.GetSheHe|U] si přeje pravoslavné Rusko pro pravoslavné Rusy a pohlíží s podezřením na Židy, Poláky i další národnosti." # todo: NEW TRANSLATION
 je_tp_tsar_unshakable_autocracy_button_3_name: "Železná cesta" # todo: NEW TRANSLATION
 je_tp_tsar_unshakable_autocracy_button_3_desc: "Železnice prokázala svou hodnotu jako prostředek k uplatňování státní moci. [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] si přeje vybudovat nezbytná průmyslová odvětví, která podpoří železniční síť země [ROOT.GetCountry.GetName], a omezit její závislost na dovozu zahraničního průmyslového zboží." # todo: NEW TRANSLATION
 je_tp_tsar_unshakable_autocracy_button_4_name: "Mír skrze sílu" # todo: NEW TRANSLATION
 je_tp_tsar_unshakable_autocracy_button_4_desc: "Doba, kterou [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] strávil v armádě, v něm vzbudila hluboký odpor ke korupci a hrůzám války. [ROOT.GetCountry.GetRuler.GetSheHe|U] si přeje prosazovat politiku ozbrojeného míru a dávat přednost diplomatickým prostředkům k dosažení [ROOT.GetCountry.GetAdjective] cílů." # todo: NEW TRANSLATION
