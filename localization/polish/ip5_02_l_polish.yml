 je_tp_tsar_heir_of_alexander_button_1_name: "Velký asijský program" # todo: NEW TRANSLATION
 je_tp_tsar_heir_of_alexander_button_1_desc: "Od mládí je [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] přesvědčen o postavení Ruska jako bašty evropské civilizace v jinak barbarském Východě. [ROOT.GetCountry.GetRuler.GetSheHe|U] si přeje ustanovit $RUS$ dominantní mocností v Asii, posílit její dosavadní državy na Dálném východě a čelit „žlutému nebezpečí“, které představuje modernizovaná Čína a Japonsko." # todo: NEW TRANSLATION
 je_tp_tsar_heir_of_alexander_button_2_name: "Otevřít se zahraničním investicím" # todo: NEW TRANSLATION
 je_tp_tsar_heir_of_alexander_button_2_desc: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] navazuje na politiku [ROOT.GetCountry.GetRuler.GetHerHis] otce a je přesvědčen o nutnosti přivést průmysl do země [ROOT.GetCountry.GetName]. [ROOT.GetCountry.GetRuler.GetHerHis|U] poradci upřednostňují industrializaci prostřednictvím otevřeného přístupu k zahraničním investicím: využití cel na hotové výrobky a výhodných dohod s kapitálově silnými západními mocnostmi k budování průmyslu na území [ROOT.GetCountry.GetNameNoFormatting]." # todo: NEW TRANSLATION
 je_tp_tsar_heir_of_alexander_button_2b_name: "Rozšířit vývoz surovin" # todo: NEW TRANSLATION
 je_tp_tsar_heir_of_alexander_button_2b_desc: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] navazuje na politiku [ROOT.GetCountry.GetRuler.GetHerHis] otce a je přesvědčen o nutnosti přivést průmysl do země [ROOT.GetCountry.GetName]. [ROOT.GetCountry.GetRuler.GetHerHis|U] poradci vidí příležitost ve využití nerostného bohatství a ropných zdrojů říše ke zvýšení vývozu a vybudování průmyslové základny." # todo: NEW TRANSLATION
 je_tp_tsar_heir_of_alexander_button_3_name: "Modernizovat plán mobilizace" # todo: NEW TRANSLATION
 je_tp_tsar_heir_of_alexander_button_3_desc: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] v tradici [ROOT.GetCountry.GetAdjective] císařské rodiny chová k [ROOT.GetCountry.GetRuler.GetHerHis] armádě nejvyšší úctu a považuje ji za věrný základ autokracie. Přeje si podpořit generální štáb v jeho snaze přizpůsobit armádu požadavkům moderní války." # todo: NEW TRANSLATION
 je_tp_tsar_heir_of_alexander_button_4_name: "Vyřešit agrární otázku" # todo: NEW TRANSLATION
 je_tp_tsar_heir_of_alexander_button_4_desc: "Když hrozí nespokojenost městského obyvatelstva, hledá [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] útěchu v [ROOT.GetCountry.GetRuler.GetHerHis] představě sebe sama jako milovaného otce prostých, zbožných a věrných [ROOT.GetCountry.GetAdjectiveNoFormatting] rolníků. Tuto oddanost považuje [ROOT.GetCountry.GetRuler.GetSheHe] za samozřejmou, ale [ROOT.GetCountry.GetRuler.GetHerHis] poradci předložili program, jak si ji skutečně získat — vytvořením agrární střední třídy, která vděčí za svou existenci dobrodiní monarchie." # todo: NEW TRANSLATION
