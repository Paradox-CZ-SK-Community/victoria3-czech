 je_tp_great_reform_zemstvos_button_desc: "[ROOT.GetCountry.GetName] je natolik rozsáhlá, že ji nelze spravovat pouze z [ROOT.GetCountry.GetCapital.GetCityHubName]. Carovi poradci vycházejí z předpokladu, že obyvatelé daného kraje vědí lépe než jakýkoli ústřední orgán, co potřebují, a proto předložili návrhy, jak místnímu obyvatelstvu poskytnout větší pravomoci při správě vlastních záležitostí. Reforma by zřídila provinční [Glossary('glossary_zemstvo','zemstva')] odpovědná za hospodářskou činnost ve svých obvodech a rozšířila pravomoci městských samospráv." # todo: NEW TRANSLATION
