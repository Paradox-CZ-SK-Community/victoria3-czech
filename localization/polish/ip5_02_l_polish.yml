 tsarpoints_events.12.d: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] vydal ukaz obsahující nové pokyny pro správu provincií. [ROOT.GetCountry.GetRuler.GetSheHe|U] chce zavést nový standard pro dodržování budoucích ukazů." # todo: NEW TRANSLATION
 tsarpoints_events.12.f: "„Takže jestli jsem to pochopil správně, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] očekává, že odteď budeme tyto postupy dodržovat do puntíku?“\n\n„Tak se to dá vykládat. Jiný výklad je, že [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] očekává určité výsledky. Což znamená, že ani jeden z těchto postupů nelze dodržovat do puntíku.“" # todo: NEW TRANSLATION
