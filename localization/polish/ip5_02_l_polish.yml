 notification_je_tp_mission_completed_desc: "[SCOPE.GetRootScope.GetJournalEntry.GetCountry.GetName] úspěšně dokončilo agendu #b [SCOPE.GetRootScope.GetJournalEntry.GetName]#! a získalo #v [SCOPE.GetRootScope.GetJournalEntry.GetCountry.MakeScope.Var('tp_last_mission_reward').GetValue|0]#! @tsarpoints! [concept_tsarpoints]." # todo: NEW TRANSLATION
