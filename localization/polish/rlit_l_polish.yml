 glossary_pochvennichestvo: "Pochvenničestvo" # todo: NEW TRANSLATION
 glossary_pochvennichestvo_desc: "#b;italic Pochvenničestvo#! je konzervativní hnutí z konce 19. století v Ruském impériu, blízce příbuzné slavjanofilství. Jedním z jeho hlavních požadavků bylo zrušení nevolnictví, odtud také název — „návrat k rodné půdě“." # todo: NEW TRANSLATION
 glossary_silver_age: "Stříbrný věk" # todo: NEW TRANSLATION
 glossary_silver_age_desc: "#b;italic Stříbrný věk#! je období ruské literatury a mimořádné tvůrčí činnosti na konci 19. a počátku 20. století, kdy vzkvétala poezie a spisovatelé, rozčarovaní stavem světa, opouštěli realismus. Má se také za to, že tato éra připravila půdu pro to, aby ženská tvorba získala vliv ve společnosti, zejména pak na akademické půdě. V západních dějinách lze najít paralely v pojmech, jako je „La Belle Époque“." # todo: NEW TRANSLATION
