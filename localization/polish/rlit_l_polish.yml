 je_rlit_golden_age: "Duše Ruska: Zlatý věk" # todo: NEW TRANSLATION
 je_rlit_golden_age_reason: "Kritici prohlásili, že [ROOT.GetCountry.GetAdjectiveNoFlag] literatura konečně našla svůj hlas a že ruský jazyk byl vysvobozen ze svého vězení. Básníci i spisovatelé zažívají prudký nárůst počtu literárních časopisů i nabídky vydavatelů, ale může tato literární horečka zůstat bez kontroly? Trůn musí rozhodnout, koho bude chránit, koho potlačí a koho nechá zemřít jako mučedníka. Tato rozhodnutí budou po mnoho let utvářet intelektuální prostředí říše." # todo: NEW TRANSLATION
 je_rlit_golden_age_status: "Zlatý věk ruské literatury je v plném proudu" # todo: NEW TRANSLATION
 je_rlit_crossroads: "Duše Ruska: Křižovatka" # todo: NEW TRANSLATION
 je_rlit_crossroads_reason: "Zlatý věk [ROOT.GetCountry.GetAdjectiveNoFlag] literatury skončil. Jeho idoly a mučedníci položili základy debaty, která nyní nabývá nové podoby: slouží literatura Bohu, carovi, revoluci, nebo celému lidstvu? Jak moc se může próza proměnit, když si autor nyní uvědomuje sám sebe i svůj vztah ke státu a zná dlouhou historii takového vztahu? Je ruský básník něčím víc než jen básníkem?\n\nNa tyto otázky zatím neexistují odpovědi, ale někteří jsou ochotni pokusit se je vydolovat z úrodné černozemě." # todo: NEW TRANSLATION
