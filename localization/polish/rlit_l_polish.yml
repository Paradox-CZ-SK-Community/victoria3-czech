l_polish:
 rlit.001.t: "Souboj per" # todo: NEW TRANSLATION
 rlit.001.d: "Konzervativní redaktor #italic Severní včely#!, [SCOPE.sCharacter('bulgarin_scope').GetFullName], vydal dopis, v němž odsuzuje básníka [SCOPE.sCharacter('pushkin_scope').GetFullName] a jeho společníky kvůli jejich napojení na [Glossary('glossary_decembrists','Decembrists')] a „nebezpečným zahraničním sympatiím“, které bují v jejich salonech." # todo: NEW TRANSLATION
 rlit.001.f: "Dopis byl zanechán v kanceláři bez podpisu, ale jeho autor byl zřejmý každému, kdo kdy listoval stránkami #italic Severní včely#!. Tento časopis byl známý svou věrností trůnu a Třetí oddělení vždy jako by znalo obsah příštího čísla. Ministři souhlasně přikyvovali, aby si důstojníci hlídající u dveří nevšimli ničeho jiného než naprostého souhlasu.\n\n„Bulgarin ví, o čem mluví,“ zamumlal jeden z nich a předal dopis k dalšímu stolu.\n\n„Vskutku,“ povzdechl si jeho kolega. „Literatura #italic musí#! sloužit vládě. Spisovatelé jako [SCOPE.sCharacter('pushkin_scope').GetLastNameNoFormatting] jsou nebezpeční snílci.“" # todo: NEW TRANSLATION
 rlit.001.a: "Literatura musí sloužit říši. [SCOPE.sCharacter('pushkin_scope').GetLastNameNoFormatting]ovo chování je nepřijatelné." # todo: NEW TRANSLATION
 rlit.001.b: "Co zlého se může stát, když někdo napíše pár básní?" # todo: NEW TRANSLATION
 rlit.001.c: "Nechme je, ať si to vyřídí mezi sebou." # todo: NEW TRANSLATION
 rlit.002.t: "Souboj u Černé říčky" # todo: NEW TRANSLATION
 rlit.002.d: "[SCOPE.sCharacter('pushkin_scope').GetFullName] byl odnesen z místa souboje u Čorné rečky s kulkou, která mu pronikla do břicha. O dva dny později básník zemřel. Pozornost na sebe strhl významný mladý spisovatel [SCOPE.sCharacter('lermontov_scope').GetFullName], který napsal rozhněvanou elegii #italic Smrt básníka#! a obvinil stát a šlechtu ze smrti svého idolu." # todo: NEW TRANSLATION
 rlit.002.f: "Třetí oddělení bylo v pohotovosti. Před bytem [SCOPE.sCharacter('pushkin_scope').GetFullNameNoFormatting] v [GetStateRegion('STATE_INGRIA').GetCityHubName] zaplnily ulice tisíce truchlících. Někteří plakali, jiní byli ochromeni příliš brzkým odchodem jednoho z největších spisovatelů své doby.\n\n„Naše nejčerstvější sny a rozjímání, v rychlém sledu uvadají, jak podzimní listí, které zpráchniví.“\n\n— Alexandr Puškin" # todo: NEW TRANSLATION
 rlit.002.a: "#italic My#! určíme jeho odkaz — uspořádejme mu státní pohřeb." # todo: NEW TRANSLATION
 rlit.002.b: "Dovolme, aby se Lermontovova elegie šířila." # todo: NEW TRANSLATION
 rlit.002.c: "Nebezpečná sentimentalita! Omezme veřejné truchlení." # todo: NEW TRANSLATION
 rlit.003.t: "Hrdina naší doby" # todo: NEW TRANSLATION
 rlit.003.d: "Rukopis, jehož autorem je [SCOPE.sCharacter('lermontov_scope').GetFullName], se stal oblíbeným mezi důstojníky v [GetStateRegion('STATE_NORTH_CAUCASUS').GetCityHubName]. [SCOPE.sCharacter('lermontov_scope').GetLastNameNoFormatting], poslaný sloužit do [GetStateRegion('STATE_NORTH_CAUCASUS').GetName] za [SCOPE.sCharacter('lermontov_scope').GetHerHis] elegii o Puškinově smrti, strávil své působení psaním románu, jehož hrdina pohrdá jak [SCOPE.sCharacter('lermontov_scope').GetHerHis] službou, tak vírou a morálkou říše." # todo: NEW TRANSLATION
 rlit.003.f: "Důstojník seděl na posteli a vzhlížel k muži ve dveřích. Mluvil tiše, aby nevzbudil dojem, že si svá slova předem nacvičil a celé týdny nad nimi trápil — nad touto pobuřující řečí.\n\n„Hlavní hrdina Pečorin je zjevně nadaný muž, který obrátil svou inteligenci proti světu i sobě samému. Je to mimořádně přesný portrét jistého typu ruské duše. Řekl bych… možná v něm vidím sám sebe. Možná bych řekl, že se v něm vidí mnozí z nás. Mohl byste… říct totéž?“\n\n„‚Proč jsem žil — za jakým účelem jsem se narodil?‘… Nějaký účel tu být musel a můj osud byl jistě vznešený, protože cítím, že v mé duši dřímají nezměrné síly…“\n\n— Michail Lermontov" # todo: NEW TRANSLATION
 rlit.003.a: "Ať oslavuje naše kavkazská tažení." # todo: NEW TRANSLATION
 rlit.003.b: "Na ruském odcizení něco bude." # todo: NEW TRANSLATION
 rlit.003.c: "Fronta ho pokoří." # todo: NEW TRANSLATION
 rlit.004.t: "Císařská literární cena" # todo: NEW TRANSLATION
 rlit.004.d: "[SCOPE.sCharacter('bulgarin_scope').GetFullName] zaslal ministerstvu školství návrh na zřízení císařské literární ceny. Cena by se každoročně udělovala dílům, která prokazují věrnost carovi, pravoslavné víře a [ROOT.GetCountry.GetAdjective] národnímu charakteru." # todo: NEW TRANSLATION
 rlit.004.f: "V posluchárně ministerstva školství Bulgarin čtyřicet minut velebil carovu vládu a útočil na ty, které považoval za její nepřátele. Daleko od ministerstva, v salonech za těžkými závěsy a ve sklepních místnostech, tito nepřátelé odpověděli: nazvali ho policejním špehem a pisálkem.\n\nPosláním #italic Severní včely#! je ukázat, že správně vedená ruská literatura slouží stejným cílům jako ruské zákony: pořádku, zbožnosti a velikosti ruského lidu." # todo: NEW TRANSLATION
 rlit.004.a: "Věrné umění — a [SCOPE.sCharacter('bulgarin_scope').GetLastName] — si zaslouží oslavu." # todo: NEW TRANSLATION
 rlit.004.b: "Nechme čtenářskou veřejnost, ať si své hrdiny vybírá sama." # todo: NEW TRANSLATION
 rlit.004.c: "[ROOT.GetCountry.GetNameNoFlag] už má [SCOPE.sCharacter('bulgarin_scope').GetLastNameNoFormatting]a a jeho novin dost." # todo: NEW TRANSLATION
 rlit.005.t: "Rouhavá komedie" # todo: NEW TRANSLATION
 rlit.005.d: "Nejnovější dílo [SCOPE.sCharacter('gogol_scope').GetFullName] je troufalým komickým útokem na všechny vrstvy provinčního [ROOT.GetCountry.GetAdjective] života. Jeho čtenáři považují za zázrak, že první díl prošel cenzurou." # todo: NEW TRANSLATION
 rlit.005.f: "Je to nejvtipnější a nejničivější dílo napsané v ruštině za mnoho let. Inteligence se o něm přela celé týdny; někteří ho označují za obžalobu nevolnického hospodářství, sám Gogol trvá na tom, že jde o alegorii — Dantovo #italic Peklo#! zasazené do dobře známého prostředí.\n\n„Ach, Rusko, Rusko… U tebe je všechno ploché a otevřené; tvá města vystupují jako tečky či značky z hladiny roviny a zrak tu nic neočaruje ani neoklame. A přece, jaké tajemství, jaká neodolatelná síla mě k tobě přitahuje?“\n\n— Nikolaj Gogol, #italic Mrtvé duše#!" # todo: NEW TRANSLATION
 rlit.005.a: "Takové vykreslení naší pozemkové šlechty je příliš nebezpečné." # todo: NEW TRANSLATION
 rlit.005.b: "Všichni se umíme zasmát, nebo snad ne?" # todo: NEW TRANSLATION
 rlit.005.c: "Zadejme mu, aby také napsal něco, co bude [ROOT.GetCountry.GetNameNoFlag] #italic opěvovat#!." # todo: NEW TRANSLATION
 rlit.006.t: "Muž s rolnickým plnovousem" # todo: NEW TRANSLATION
 rlit.006.d: "Filozof [SCOPE.sCharacter('aksakov_scope').GetFullName] se objevil u dvora v hrubém rolnickém oděvu. Jeho vzhled vzbuzuje rozruch — muž vypadá, jako by přišel ze středověku, a někteří se domnívají, že právě tam chce [ROOT.GetCountry.GetNameNoFlag] vrátit." # todo: NEW TRANSLATION
 rlit.006.f: "Hovoří o vesnické obci jako o nejvyšší formě společenského uspořádání, o Petrovi jako o největším ruském omylu a o tom, jak západní orientace ničivě přetrhla pouto mezi carem a narodem. Mluví překotně, jako by se blížila smrt — mnozí věří, že ho hanba z porážky zlomila a otevřela cestu tuberkulóze.\n\nStát je vnější pravdou lidu. Půda je jeho vnitřní pravdou." # todo: NEW TRANSLATION
 rlit.006.a: "Filozofie „narodu“ musí proniknout do oficiálního diskurzu." # todo: NEW TRANSLATION
 rlit.006.b: "Jeho vous je trapný." # todo: NEW TRANSLATION
 rlit.007.t: "Rozhořčený dopis" # todo: NEW TRANSLATION
 rlit.007.d: "Salony [ROOT.GetCountry.GetCapital.GetCityHubName] obletěl zdrcující dopis. Jeho autorem je liberální kritik [SCOPE.sCharacter('belinsky_scope').GetFullName] — přestože píše z nemocničního lůžka, jeho próza odsuzující cara a jeho vlastní literární kolegy je stejně ohnivá a živá jako vždy." # todo: NEW TRANSLATION
 rlit.007.f: "Bylo to mistrovské dílo ovládaného hněvu, adresované přímo Gogolovi. Obvinilo ho, že zradil každého čtenáře, který považoval #italic Mrtvé duše#! za odsouzení nevolnictví a samoděržaví. Jak mohl Gogol dovolit, aby sebeuspokojení vyšších vrstev otupilo úder, který jim mohl svou prózou zasadit? Proč nezaujal odvážnější postoj, když se ukázalo, jak úspěšné jeho dílo je?\n\nNa třetí straně dopis přitvrdil a zaměřil se na [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetNameNoFormatting] jako celek — na jejich pošetilou víru v cara jako otce lidu, přestože car byl podle [SCOPE.sCharacter('belinsky_scope').GetLastNameNoFormatting]a jejich #italic žalářníkem#!.\n\nTřetí oddělení zuřilo — co mohli udělat muži, který už stál jednou nohou v hrobě? Tuberkulóza to vyřeší dřív, než budou moci zasáhnout." # todo: NEW TRANSLATION
 rlit.007.a: "Jeho dopis je pobuřování, ať je jeho stav jakýkoli." # todo: NEW TRANSLATION
 rlit.007.b: "Dopis zanikne spolu s jeho životem." # todo: NEW TRANSLATION
 rlit.007.c: "Uspořádejme mezi těmi dvěma veřejnou debatu." # todo: NEW TRANSLATION
 rlit.008.t: "#italic Zvony#! zní z Londýna" # todo: NEW TRANSLATION
 rlit.008.d: "V kanceláři ministerstva vnitra ležel výtisk nejnovějšího čísla #italic Zvonu#! — socialistických novin proslulých očerňováním cara. Nikdo se k němu nehlásí; spojení s jejich exilovým redaktorem [SCOPE.sCharacter('herzen_scope').GetFullName] by mohlo mít vážné následky." # todo: NEW TRANSLATION
 rlit.008.f: "#italic Zvon#! [SCOPE.sCharacter('herzen_scope').GetFullNameNoFormatting]a se stal nejčtenějším politickým tiskem v říši, přestože byl zcela nezákonný. Cesta k jeho čtenářům byla dlouhá a spletitá, ale nakonec mu věnoval pozornost i nejbližší carův okruh. [SCOPE.sCharacter('herzen_scope').GetLastNameNoFormatting] psal o nevolnictví a morálním bankrotu samoděržaví s jasností, které žádný domácí tisk nedokázal konkurovat. #italic Protože tu#! #italic není žádný nezávislý domácí tisk#!, pomyslel si ministr, zatímco důstojníci prohledávali jeho stůl a hledali cokoli, co by prozradilo, že je tím hlupákem, který nechal svůj výtisk ležet na očích.\n\n„Rusové, kteří chtějí být svobodní, musí být svobodní hned — ne za dvacet let, ne ‚až přijde správný čas‘, ale teď, ve své duši, ještě než se změní jediný zákon.“\n\n— Alexandr Herzen" # todo: NEW TRANSLATION
 rlit.008.a: "Možná v těchto novinách najdou reformátoři moudrost." # todo: NEW TRANSLATION
 rlit.008.b: "#italic Zvon#! nesmí v Rusku znít." # todo: NEW TRANSLATION
 rlit.008.c: "Přiveďme vyhnance [SCOPE.sCharacter('herzen_scope').GetLastName]a domů v rámci podmíněné amnestie." # todo: NEW TRANSLATION
 rlit.009.t: "Memorandum vychovatele" # todo: NEW TRANSLATION
 rlit.009.d: "Uznávaný právník a vychovatel careviče [SCOPE.sCharacter('pobedonostsev_scope').GetFullName] předložil memorandum o „nihilistickém literárním jevu“. [SCOPE.sCharacter('pobedonostsev_scope').GetSheHe|U] tvrdí, že nihilismus není pouhým filozofickým postojem, ale právní hrozbou, kterou [ROOT.GetCountry.GetName] už nemůže dlouho přehlížet." # todo: NEW TRANSLATION
 rlit.009.f: "„Nihilisté popírají základy vlastnictví, rodiny a státu, a podle toho je třeba přistupovat i k jejich spisům — nejde o otázku pro literární kritiky, nýbrž pro Třetí oddělení Jeho Císařského Veličenstva,“ prohlásil vyzáblý muž, udeřil pěstí do stolu a převrhl sklenici vody. Jak pokračoval, loužička se pomalu rozlévala směrem k několika důležitým dokumentům na stole.\n\nJeho asistent spěchal situaci napravit a tiše přemítal, zda má tato nově se rodící šedá eminence na mysli nějaká konkrétní opatření." # todo: NEW TRANSLATION
 rlit.009.a: "Má pravdu — právní systém nemá pro nihilismus místo." # todo: NEW TRANSLATION
 rlit.009.b: "Možná si tato hrozba zaslouží #italic trochu#! naší pozornosti." # todo: NEW TRANSLATION
 rlit.009.c: "Tohle je literární problém — pokračujme dál." # todo: NEW TRANSLATION
 rlit.010.t: "Popraviště na Semjonovském náměstí" # todo: NEW TRANSLATION
 rlit.010.d: "Autor zdrcujících #italic Chudých lidí#! [SCOPE.sCharacter('dostoevsky_scope').GetFullName] byl zatčen za to, že na schůzi Petraševského kroužku předčítal Belinského pobuřující dopis. Poprava je naplánována na úsvit a [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] musí rozhodnout, zda [SCOPE.sCharacter('dostoevsky_scope').GetHerHim] omilostní." # todo: NEW TRANSLATION
 rlit.010.f: "Tři muži jsou přivázáni ke kůlům a zvuk bubnů sílí, zatímco se proti nim zvedají pušky. Pak se ozve klapot koňských kopyt o dláždění. Netuší, že car rozhodl, že je všechny čeká vyhnanství, nikoli smrt. Je to skutečně konec?\n\n„Být člověkem mezi lidmi a navždy jím zůstat, ať už se ocitneme v jakýchkoli podmínkách, nepropadat zoufalství a neztrácet odvahu — o tom je život, to je jeho úkol.“\n\n— Fjodor Dostojevskij" # todo: NEW TRANSLATION
 rlit.010.a: "Jestli [SCOPE.sCharacter('dostoevsky_scope').GetLastName] přežije, musí být tato lekce nezapomenutelná." # todo: NEW TRANSLATION
 rlit.010.b: "Přehodnoťme své metody — omilostněme je všechny." # todo: NEW TRANSLATION
 rlit.010.c: "Radikalismus nesmí mít žádné romantické mučedníky." # todo: NEW TRANSLATION
 rlit.011.t: "Otcové a děti" # todo: NEW TRANSLATION
 rlit.011.d: "Nový román [SCOPE.sCharacter('turgenev_scope').GetFullName] se v [ROOT.GetCountry.GetCapital.GetCityHubName] stal okamžitou senzací. Hlavním hrdinou příběhu je nihilista, který nevěří ničemu, co nelze rozebrat nebo dokázat — toto zpodobnění rozhořčilo některé části [ROOT.GetCountry.GetAdjective] [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName], zatímco zbytek je chválí." # todo: NEW TRANSLATION
 rlit.011.f: "Jeden recenzent označuje knihu za pomluvu ruské mládeže, jiný za její obhajobu. I sám autor se zdá být popularitou románu upřímně překvapen. Jedno je jisté: slovo „nihilista“ vstoupilo do ruského jazyka a už z něj nezmizí.\n\n„Ano, kdysi tu byli hegelovci a teď jsou tu nihilisté. Uvidíme, jak se vám bude dařit v prázdné, bezvzdušné nicotě; a teď zazvoň, bratře Nikolaji, je čas, abych se napil kakaa.“\n\n— Ivan Turgeněv" # todo: NEW TRANSLATION
 rlit.011.a: "Turgeněv zradil ruské duchovní hodnoty." # todo: NEW TRANSLATION
 rlit.011.b: "Rusko se musí obrátit k Západu a přijmout pokrok." # todo: NEW TRANSLATION
 rlit.011.c: "Nihilismus je dost nebezpečný i bez smyšlených hrdinů." # todo: NEW TRANSLATION
 rlit.012.t: "#italic Co dělat?#!" # todo: NEW TRANSLATION
 rlit.012.d: "Ve své cele Petropavlovské pevnosti napsal [SCOPE.sCharacter('chernyshevsky_scope').GetFullName] rukopis líčící socialistickou utopii, v níž jsou ženy svobodné, práce důstojná a není tu ani Boha, ani cara. Cenzorům jeho radikalismus nepřipadal nebezpečný — považovali ho za příliš nudný a poučující." # todo: NEW TRANSLATION
 rlit.012.f: "„Žijí vesele a přátelsky; pracují a odpočívají; užívají si života a hledí do budoucnosti, ne-li bez obav, tedy s pevným a hlubokým přesvědčením, že čím dál se dostanou, tím lépe jim bude.“\n\n— Nikolaj Černyševskij" # todo: NEW TRANSLATION
 rlit.012.a: "Tuto knihu nelze nechat šířit." # todo: NEW TRANSLATION
 rlit.012.b: "Můžeme důvěřovat úsudku cenzorů." # todo: NEW TRANSLATION
 rlit.012.c: "Vyšleme [SCOPE.sCharacter('chernyshevsky_scope').GetLastName]a do [GetStateRegion('STATE_TOMSK').GetName] za pobuřování." # todo: NEW TRANSLATION
 rlit.013.t: "[SCOPE.sCharacter('katkov_scope').GetLastName] a #italic Moskevské vědomosti#!" # todo: NEW TRANSLATION
 rlit.013.d: "Úvodník [SCOPE.sCharacter('katkov_scope').GetFullName]a v #italic Moskevských vědomostech#! upoutal pozornost vyšší společnosti. [SCOPE.sCharacter('katkov_scope').GetLastName], kdysi liberál obdivující Anglii, který se zasazoval o volný obchod, náhle obrátil a stal se zapáleným nacionalistou." # todo: NEW TRANSLATION
 rlit.013.f: "Svou prací pro #italic Vědomosti#! a #italic Ruského posla#! se proměnil v nejagresivnějšího nacionalistického novináře v Rusku a jeho čtenářská obec prudce roste. Jeho hněv se obrací od jednoho ruského nepřítele k druhému: polským separatistům, nihilistům, liberálům i v zahraničí vzdělané inteligenci, která miluje všechno na Rusku kromě samotných Rusů. Zatímco Herzen píše z [SCOPE.sStateRegion('herzen_exile_state').GetCityHubName] o ruských hříších, Katkov píše z [SCOPE.sStateRegion('katkov_home_state').GetCityHubName] o její slávě a o zkaženosti jejích nepřátel.\n\n„Veškerá moc pochází od Boha; ruskému carovi však byl přiznán zvláštní význam, který ho odlišuje od ostatních vládců světa… V tom spočívá tajemství hlubokého rozdílu mezi Ruskem a všemi národy světa.“\n\n— Michail Katkov" # todo: NEW TRANSLATION
 rlit.013.a: "[SCOPE.sCharacter('katkov_scope').GetLastName] je naší odpovědí Herzenovi a jeho #italic Zvonu#!." # todo: NEW TRANSLATION
 rlit.013.b: "Jeho nacionalismus se hodí, ale je nepředvídatelný." # todo: NEW TRANSLATION
 rlit.013.c: "Už máme Bulgarina." # todo: NEW TRANSLATION
 rlit.014.t: "Filozof půdy" # todo: NEW TRANSLATION
 rlit.014.d: "Do [SCOPE.sStateRegion('relevant_state').GetCityHubName] dorazilo první číslo nového časopisu s podpisem konzervativního vydavatele [SCOPE.sCharacter('strakhov_scope').GetFullName]. Díky tomuto listu se výraz „[Glossary('glossary_pochvennichestvo','$glossary_pochvennichestvo|q$')]“ stal slovem měsíce, a to navzdory svým zpátečnickým konotacím." # todo: NEW TRANSLATION
 rlit.014.f: "Ruská inteligence se vzdálila lidu, ztratila kořeny i spojení s půdou pod nohama. Není to ani slavjanofilská mystika, ani západní racionalismus — Dostojevskij ji označuje za jedinou vážnou myšlenku v ruském intelektuálním životě.\n\nVzdělaný Rus se od #italic narodu#! odpoutal jako balon. Musí se znovu naučit stát nohama na zemi." # todo: NEW TRANSLATION
 rlit.014.a: "Tento časopis šířící zakořeněnou filozofii si zaslouží podporu." # todo: NEW TRANSLATION
 rlit.014.b: "Nemůžeme rozhazovat peníze na každého akademika s perem." # todo: NEW TRANSLATION
 rlit.014.c: "$glossary_pochvennichestvo$ není žádná vážná filozofie." # todo: NEW TRANSLATION
 rlit.015.t: "Zlatý věk končí" # todo: NEW TRANSLATION
 rlit.015.d: "Skončil „zlatý věk“ [ROOT.GetCountry.GetAdjective] literatury. Tato éra otevřela otázku vztahu mezi uměním a státem a odpověď se zapsala do dějin. To, co říše udělala svým básníkům, určí, co básníci udělají se svou říší." # todo: NEW TRANSLATION
 rlit.015.f: "Na balkóně alpské vily, ve stínu papírového slunečníku, si muž pročítal čerstvý překlad Gogola. Bylo pro něj nezvyklé, že vůbec potřebuje překlad. Jeho vlastní jazyk po staletí vládl literárnímu světu — Racine, Voltaire, Delille, Rousseau. Byl jazykem důvěryhodnosti, jazykem nejliberálnější a nejcivilizovanější země Evropy. Francouzská intelektuální tradice — největší na světě — odvrátila lid od uctívání králů a podnítila ho k osvobození lidstva. Co znamenalo, že taková tradice nyní rozkvétala v srdci evropského četníka?\n\nMožná, pomyslel si, je pro Rusko přece jen naděje." # todo: NEW TRANSLATION
 rlit.015.a: "Literatura se stává nástrojem státu." # todo: NEW TRANSLATION
 rlit.015.b: "Plačte, neboť říše učinila ze svých největších synů mučedníky." # todo: NEW TRANSLATION
 rlit.015.c: "Pozornost inteligence se obrací k #italic narodu#!." # todo: NEW TRANSLATION
 rlit.015.opt_d: "Ruská literatura patří celému světu." # todo: NEW TRANSLATION
 rlit.015.e: "Pokračujeme v budování toho, co jsme započali." # todo: NEW TRANSLATION
 rlit.016.t: "Návrat marnotratného syna" # todo: NEW TRANSLATION
 rlit.016.d: "[SCOPE.sCharacter('dostoevsky_scope').GetFullName] se vrátil z [GetStateRegion('STATE_TOMSK').GetName]. Kdysi jen o vlásek unikl popravě za svou opovážlivost vůči vládě, nyní se z něj stal horlivý [ROOT.GetCountry.GetAdjectiveNoFlag] pravoslavný křesťan a panslovanský nacionalista. Jeho nejnovější dílo líčí ničivý pád provinilého muže." # todo: NEW TRANSLATION
 rlit.016.f: "Jeho nové dílo, #italic Zločin a trest#!, vypráví o studentovi, který zavraždí lichvářku — a pak ho nezničí zákon, nýbrž vlastní svědomí. Někteří ho označují za mistrovské dílo, jiní za reakční brak. Bezpochyby jde o nejvýznamnější ruský román od dob #italic Mrtvých duší#!.\n\n„Přijmi utrpení a dosáhni skrze ně vykoupení — to musíš udělat.“\n\n— Fjodor Dostojevskij" # todo: NEW TRANSLATION
 rlit.016.a: "Jeho konzervativní hlas nám dobře slouží." # todo: NEW TRANSLATION
 rlit.016.b: "Jeho nový román je třeba vydat." # todo: NEW TRANSLATION
 rlit.016.c: "Příliš mnoho temnoty ve veřejném prostoru není zdravé." # todo: NEW TRANSLATION
 rlit.016.opt_d: "Dostojevského liberální hlas — omilostněný a neumlčený — promlouvá svobodně." # todo: NEW TRANSLATION
 rlit.017.t: "Válka a mír" # todo: NEW TRANSLATION
 rlit.017.d: "Hrabě [SCOPE.sCharacter('tolstoy_scope').GetFullName] vydal více než tisícistránkový román o napoleonských válkách, v němž líčí dějiny tak, že ministři, maršálové ani císaři nerozhodují vůbec o ničem. Dílo se stalo oblíbeným napříč [ROOT.GetCountry.GetAdjective] společností a úřady začaly zvažovat, proč je takový odpůrce státu ponechán, aby tvořil tak svobodně." # todo: NEW TRANSLATION
 rlit.017.f: "Je to meditace o povaze historické kauzality, o vztahu jednotlivce k širšímu dění ve státě, ale také o tom, co znamená být Rusem. Kritici jen těžko hledají dostatečná slova, car si ji přečetl a Flaubert se od ní nemohl odtrhnout; Tolstoj mezitím už usilovně pracuje na dalším díle. Někdo se může ptát, jak ho zkrotit, jiný však řekne, že to je špatná otázka, a zeptá se: má vůbec cenu se o to pokoušet?\n\n„Není velikosti tam, kde není prostota, dobrota a pravda.“\n\n— Lev Tolstoj" # todo: NEW TRANSLATION
 rlit.017.a: "Pověřte Tolstého, aby napsal o slávě ruských zbraní." # todo: NEW TRANSLATION
 rlit.017.b: "Nechte spisovatele na pokoji. Tolik si zaslouží." # todo: NEW TRANSLATION
 rlit.017.c: "Omezte zahraniční vydávání — jeho čtenářstvo nemusí být světové." # todo: NEW TRANSLATION
 rlit.018.t: "Vladaři města Hlupova" # todo: NEW TRANSLATION
 rlit.018.d: "Nová kniha si získává pozornost čtenářské veřejnosti. Satirická historie fiktivního města Hlupova od [SCOPE.sCharacter('saltykov_scope').GetFullName] nedávno prošla cenzurou — cenzoři stejně jako mnozí čtenáři nedokážou určit, zda jde o historickou studii, nebo komedii." # todo: NEW TRANSLATION
 rlit.018.f: "Vladař s hracím strojkem místo mozku, který si jej nechal voperovat, aby nahradil lidský mozek, šest žen, které se dostaly k moci díky převratům, a muž, jenž terorizoval vlastní poddané požáry a hladomorem. Lidé se smějí, dokud se nerozpláčou — někdy radostí, jindy hořkým poznáním.\n\n„Idealismus je despotou myšlení, stejně jako je politika despotou vůle.“\n\n— Michail Saltykov-Ščedrin" # todo: NEW TRANSLATION
 rlit.018.a: "Satira, která nikoho konkrétního neztrapňuje, nikoho neohrožuje." # todo: NEW TRANSLATION
 rlit.018.a_tt: "Tenhle „Hlupov“ by přece mohl znázorňovat kterékoli místo na světě. #italic Že ano?#!" # todo: NEW TRANSLATION
 rlit.018.b: "Stíhejte ho za urážku důstojnosti ruské vlády." # todo: NEW TRANSLATION
 rlit.018.c: "Využijte jeho postřehů k reformě státní správy." # todo: NEW TRANSLATION
 rlit.019.t: "Spravedliví lidé" # todo: NEW TRANSLATION
 rlit.019.d: "Z pozice někde mezi slavjanofily a zapadniky vydal [SCOPE.sCharacter('leskov_scope').GetFullName] povídky o „dobrých lidech“, kteří nikam nezapadají. Někteří učenci ho označili za nej[ROOT.GetCountry.GetAdjective] ze všech [ROOT.GetCountry.GetAdjectiveNoFormatting] spisovatelů, jiní s tím však nesouhlasí." # todo: NEW TRANSLATION
 rlit.019.f: "Někteří spisovatelé jsou posedlí myšlenkami, ale [SCOPE.sCharacter('leskov_scope').GetFullNameNoFormatting] se upíná k duši. Jeho svatí blázni kráčejí po Zemi a laskavostí a dobrou povahou překonávají krize. Jsou prostě lidští.\n\n„V našich končinách se občas objeví takové postavy, že ať už jste je potkali před kolika lety, nikdy si na ně nevzpomenete bez vnitřního zachvění.“\n\n— Nikolaj Leskov" # todo: NEW TRANSLATION
 rlit.019.a: "Nejruštější ze všech ruských spisovatelů, vskutku." # todo: NEW TRANSLATION
 rlit.019.b: "Tohle není politická záležitost. Nechte ho být." # todo: NEW TRANSLATION
 rlit.019.c: "Jeho morální vize může být naším darem Evropě." # todo: NEW TRANSLATION
 rlit.020.t: "Mrazík" # todo: NEW TRANSLATION
 rlit.020.d: "[SCOPE.sCharacter('pobedonostsev_scope').GetFullName] rozšiřuje vládní memorandum odsuzující parlamentní vládu a velebící samoděržaví. Úředníci se neshodnou, jak na něj reagovat." # todo: NEW TRANSLATION
 rlit.020.f: "„Čtyřicet sedm stran,“ řekl ministr s brýlemi a poklepal prstem na stoh papírů. „A přece je v té bezútěšnosti tak elegantní, to se musí uznat.“\n\nJeho kolega se opřel v židli. „No, jak by řekl [SCOPE.sCharacter('pobedonostsev_scope').GetFirstNameNoFormatting], ‚takový je složitý mechanismus parlamentní frašky; taková je velká politická lež, která vládne naší době.‘“" # todo: NEW TRANSLATION
 rlit.020.a: "Svěřte [SCOPE.sCharacter('pobedonostsev_scope').GetLastName]ovi plnou moc nad cenzurou a kulturními záležitostmi." # todo: NEW TRANSLATION
 rlit.020.b: "Nechte ho v synodu, náboženství má být jeho jedinou doménou." # todo: NEW TRANSLATION
 rlit.020.c: "Mrazík už toho zmrazil dost." # todo: NEW TRANSLATION
 rlit.021.t: "Exkomunikace hraběte" # todo: NEW TRANSLATION
 rlit.021.d: "Pod tlakem [GetInterestGroupVariant('ig_devout',GetPlayer).GetName] začal [SCOPE.sCharacter('tolstoy_scope').GetFullName] zavrhovat vše, co s ním kdy mohlo být spojováno: své sídlo, své romány, dokonce i svou aristokratickou identitu. Na panství [SCOPE.sCharacter('tolstoy_scope').GetLastNameNoFormatting] panuje zmatek." # todo: NEW TRANSLATION
 rlit.021.f: "„Začal chodit bos a sám orá svá pole, jako obyčejný rolník,“ řekla služebná tichým hlasem.\n\nPověsti o tom, jak velký šlechtic kárá zkorumpované církevní hodnostáře, se šířily z vesnice do vesnice. Někteří si šeptali, že exkomunikace od [GetInterestGroupVariant('ig_devout',GetPlayer).GetNameNoFormatting] se už obrací proti nim — autorův domov se pomalu měnil v poutní místo prostých lidí.\n\n„Každý přemýšlí, jak změnit svět, ale nikdo nepřemýšlí, jak změnit sám sebe.“\n\n— Lev Tolstoj" # todo: NEW TRANSLATION
 rlit.021.a: "Kacíř jako [SCOPE.sCharacter('tolstoy_scope').GetLastName] si exkomunikaci zaslouží." # todo: NEW TRANSLATION
 rlit.021.b: "[GetInterestGroupVariant('ig_devout',GetPlayer).GetNameNoFormatting] bývají občas přehnaně horliví." # todo: NEW TRANSLATION
 rlit.021.c: "Nechte [SCOPE.sCharacter('tolstoy_scope').GetLastNameNoFormatting]a, ať v exilu přemítá o své situaci." # todo: NEW TRANSLATION
 rlit.022.t: "Knížecí věstník" # todo: NEW TRANSLATION
 rlit.022.d: "Díky přízni, kterou chová k monarchii, se #italic Občan#! — reakční věstník knížete [SCOPE.sCharacter('meshchersky_scope').GetFullName] — dlouho těšil královské podpoře. V poslední době však jeho význam začínají zpochybňovat i ti nejtradičnější konzervativci." # todo: NEW TRANSLATION
 rlit.022.f: "„Je to odporný člověk,“ povzdechl si ministr a odložil noviny. „Pomlouvá každého, a přitom má sám ve skříni kdovíkolik kostlivců? Z takového pokrytectví se mi zvedá žaludek, povídám vám. A car nám to chce servírovat každý týden?“ Zavrtěl hlavou.\n\n„Jeho románům se od srdce zasměju,“ řekl druhý ministr a poškrábal se ve vousech. „A Dostojevskij přece #italic Občana#! nějakou dobu redigoval, nebo ne?“\n\n„Ano, ale musí ho číst statisíce lidí?“" # todo: NEW TRANSLATION
 rlit.022.a: "#italic Občan#! je hlasem státu v literatuře." # todo: NEW TRANSLATION
 rlit.022.b: "Využijme #italic Občana#!, ale nepodporujme jeho vydavatele." # todo: NEW TRANSLATION
 rlit.022.c: "Podlézavost [SCOPE.sCharacter('meshchersky_scope').GetLastNameNoFormatting]a vrhá na korunu špatné světlo." # todo: NEW TRANSLATION
 rlit.023.t: "Vydavatel a dramatik" # todo: NEW TRANSLATION
 rlit.023.d: "Dopis [SCOPE.sCharacter('chekhov_scope').GetFullName] jeho příteli [SCOPE.sCharacter('suvorin_scope').GetFullName], v němž kritizuje #italic Nové časy#!, koluje literárními kruhy, zřejmě omylem. Konzervativní hlasy naléhají na oficiální prohlášení na obranu novin." # todo: NEW TRANSLATION
 rlit.023.f: "Přátelství mezi velkým dramatikem a mocným konzervativním vydavatelem se zhoršuje od Dreyfusovy aféry, kdy jeden podpořil odpůrce Dreyfuse, zatímco Čechov se přiklonil k Zolovi. Suvorin býval liberálem, za svou novinářskou činnost byl poslán do vyhnanství a po návratu se proměnil v něco nového. Nové časy čte každý, ale co si z jejich obsahu čtenáři odnášejí?" # todo: NEW TRANSLATION
 rlit.023.a: "Masový konzervatismus je v zájmu [ROOT.GetCountry.GetNameNoFormatting]." # todo: NEW TRANSLATION
 rlit.023.b: "Využijme Suvorinův tisk, ale kroťme jeho nejvyhraněnější postoje." # todo: NEW TRANSLATION
 rlit.023.c: "#italic Nové časy#! jsou pro [ROOT.GetCountry.GetNameNoFormatting] ostudou." # todo: NEW TRANSLATION
 rlit.024.t: "Král je mrtev" # todo: NEW TRANSLATION
 rlit.024.d: "Král konzervativního tisku [SCOPE.sCharacter('katkov_scope').GetFullName] zemřel, vyčerpán dlouhými léty polemických bojů. Mnozí si kladou otázku, kdo převezme jeho měsíčník #italic Ruský věstník#!." # todo: NEW TRANSLATION
 rlit.024.f: "Jeho smrt zanechává v samém srdci ruské konzervativní tvorby prázdné místo, které nedokáže zaplnit žádná jednotlivá osobnost. #italic Ruský věstník#!, jenž vydal #italic Vojnu a mír#!, #italic Annu Kareninovou#!, #italic Bratry Karamazovy#! a #italic Zločin a trest#! — čtyři největší ruské romány — musí najít nový směr. Co čeká konzervativní tisk? Vydá se cestou čisté reakce, nebo umírněnosti? Převezme jej stát a ukončí předstírání nezávislosti?\n\nRuská literatura by bez Katkova vypadala jinak. Jeho ochota vydávat Tolstého a Dostojevského vedle politických úvodníků komplikuje jeho odkaz — nacionalista, který nevědomky sloužil myšlence univerzálního lidství." # todo: NEW TRANSLATION
 rlit.024.a: "#italic Ruský věstník#! přechází do rukou zarytého reakcionáře." # todo: NEW TRANSLATION
 rlit.024.b: "#italic Ruský věstník#! přechází do rukou umírněného nacionalisty." # todo: NEW TRANSLATION
 rlit.024.c: "Stát přímo odkoupí #italic Ruský věstník#!." # todo: NEW TRANSLATION
 rlit.025.t: "Tři sestry" # todo: NEW TRANSLATION
 rlit.025.d: "Hry [SCOPE.sCharacter('chekhov_scope').GetFullNamePossessive] už léta plní moskevské umělecké divadlo. Jeho nejnovější dílo, #italic Tři sestry#!, mělo premiéru a publikum mu ve stoje aplaudovalo. " # todo: NEW TRANSLATION
 rlit.025.f: "„Po nás budou létat v horkovzdušných balonech, móda se změní, možná objeví šestý smysl a budou ho rozvíjet, ale život zůstane stejný — těžký život plný tajemství, a přece šťastný. A za tisíc let si bude člověk stále povzdechovat: ‚Ach, ten život je tak těžký!‘ a stejně jako dnes se bude bát smrti a nebude chtít zemřít.“\n\n— Anton Čechov" # todo: NEW TRANSLATION
 rlit.025.a: "Vize [SCOPE.sCharacter('chekhov_scope').GetLastNamePossessive] by se měla dostat do každého ruského města." # todo: NEW TRANSLATION
 rlit.025.b: "Pověřte ho, aby pro změnu napsal něco nadějného." # todo: NEW TRANSLATION
 rlit.025.c: "Vydejte ho na turné! Ať jede kamkoli, pozvedá Rusko." # todo: NEW TRANSLATION
 rlit.026.t: "Filosof božské moudrosti" # todo: NEW TRANSLATION
 rlit.026.d: "Přednáškový sál univerzity v [ROOT.GetCountry.GetCapital.GetCityHubName] praská ve švech, zatímco [SCOPE.sCharacter('solovyov_scope').GetFullName] hovoří o mystické teologii. Někteří tvrdí, že filosof přináší [ROOT.GetCountry.GetNameNoFlag] duchovní obrodu, jiní zůstávají skeptičtí." # todo: NEW TRANSLATION
 rlit.026.f: "Jak přednáška pokračovala, studenti natahovali krky v naději, že zahlédnou muže s hlubokýma očima a dlouhým vousem. Ať už byl tento [SCOPE.sCharacter('solovyov_scope').GetFullNameNoFormatting] skutečným helénistickým učencem, povídalo se, že tak alespoň vypadal.\n\n„Bez lásky k přírodě pro ni samu nelze uspořádat hmotný život mravným způsobem,“ řekl filosof a nechal svá slova doznít. Řady studentů přikyvovaly a pak se ozval zvuk per klouzajících po papíře — horlivě zapisované poznámky." # todo: NEW TRANSLATION
 rlit.026.a: "Posláním Ruska je duchovno." # todo: NEW TRANSLATION
 rlit.026.b: "Mysticismus víc destabilizuje, než pozvedá." # todo: NEW TRANSLATION
 rlit.026.c: "Takové myšlení by se mohlo stát největším darem Ruska civilizaci." # todo: NEW TRANSLATION
 rlit.027.t: "Na dně" # todo: NEW TRANSLATION
 rlit.027.d: "Hra #italic Na dně#! od [SCOPE.sCharacter('gorky_scope').GetFullNamePossessive] měla premiéru a kritici se rozdělili. Někteří ji označují za mistrovské dílo o lidském utrpení, jiní těžko snášejí beznaděj a ponurost zobrazených životů. Politický podtext díla však nelze přehlédnout." # todo: NEW TRANSLATION
 rlit.027.f: "„Co si #italic já#! myslím?“ Muž si sundal brýle a přimhouřil oči na časopis před sebou. „Zatím o tom psalo třiadvacet novin, a to ve čtyřech jazycích. #italic Pozoruhodné#! na — nebo možná právě proto, že #italic jde#! o hru z útulku pro bezdomovce, v níž na jevišti účinkují opilci, prostitutky a zloději.“\n\n„Takže se ti líbí?“ zamyslel se jeho přítel.\n\n„Líbí? Kdybych to už nikdy nemusel vidět, prožil bych život plný radosti.“" # todo: NEW TRANSLATION
 rlit.027.a: "Politická činnost [SCOPE.sCharacter('gorky_scope').GetLastNamePossessive] je stejně nebezpečná jako jeho hry." # todo: NEW TRANSLATION
 rlit.027.b: "Krotký génius je lepší než rozzuřený." # todo: NEW TRANSLATION
 rlit.027.c: "Chudobu je třeba nejprve vidět, než se s ní dá něco dělat." # todo: NEW TRANSLATION
 rlit.029.t: "Blíží se bouře" # todo: NEW TRANSLATION
 rlit.029.d: "Ministr dorazil na schůzi pozdě. Při výslechu vyšlo najevo, že byl na soukromé literární akci, kde [SCOPE.sCharacter('blok_scope').GetFullName] dvě hodiny předčítal před čtyřiceti mlčícími posluchači. Ministr tvrdí, že zlověstná poezie [SCOPE.sCharacter('blok_scope').GetLastNamePossessive] a jeho neobyčejný cit pro rytmus mají moc změnit [ROOT.GetCountry.GetName]." # todo: NEW TRANSLATION
 rlit.029.f: "Začal básněmi #italic Verše o krásné dámě#! — smutnými, a přece nadějnými. Pak se atmosféra v místnosti změnila, Dáma zmizela, zkažená a nahrazená továrním kouřem. Na konci předčítání všichni cítili, že se svět změní — ne-li z vůle Boží, tedy z vůle lidu.\n\n„Ó, má Rusi! Ó, ženo! Dlouhá cesta je nám jasná až k bolesti. Naši hruď proťala naše cesta — jako šíp tatarský dávné vůle.“\n\n— Alexandr Blok" # todo: NEW TRANSLATION
 rlit.029.a: "Zdůrazněme duchovní stránku jeho slov." # todo: NEW TRANSLATION
 rlit.029.b: "Musíme tyto verše vydat." # todo: NEW TRANSLATION
 rlit.029.c: "[SCOPE.sCharacter('blok_scope').GetLastName] je bardem revoluce — poskytněme mu plnou podporu." # todo: NEW TRANSLATION
 rlit.033.t: "Kabaret Toulavý pes" # todo: NEW TRANSLATION
 rlit.033.d: "Kabaret Toulavý pes se stal nočním útočištěm [Glossary('glossary_silver_age','$glossary_silver_age|q$')]. [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName] tam zažívá svobodu, jaká jinde v říši nemá obdoby, a na malém pódiu se tísní básníci, malíři i tanečníci." # todo: NEW TRANSLATION
 rlit.033.f: "Bylo to rouhavé a zároveň posvátné. Policisté z horního konce schodiště pozorně sledovali básnická čtení, divadelní hry a diskuse lidí, kteří se cítili vyloučeni z uhlazené společnosti — skuteční toulaví psi! — a v jejich tvářích se mísilo zaujetí s obavami.\n\n„Tady jsme samí opilci a děvky, bez radosti namačkaní na sebe!“\n\n— Anna Achmatovová" # todo: NEW TRANSLATION
 rlit.033.a: "Pták v kleci zpívá, svobodný vzlétá." # todo: NEW TRANSLATION
 rlit.033.b: "Lepší, když zaplní sklep než barikády." # todo: NEW TRANSLATION
 rlit.033.c: "Bohéma je předsíní revoluce." # todo: NEW TRANSLATION
 rlit.035.t: "Stříbrný věk na vrcholu" # todo: NEW TRANSLATION
 rlit.035.d: "Literární salony se protahují až za třetí hodinu ranní. U Merežkovských na Litejné se [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName] už dva dny v kuse probírají nejrůznějšími myšlenkami a nemohou usnout." # todo: NEW TRANSLATION
 rlit.035.f: "V kabaretu Toulavý pes předčítali [SCOPE.sCharacter('akhmatova_scope').GetFullNameNoFormatting] a [SCOPE.sCharacter('gumilev_scope').GetFullNameNoFormatting] v přeplněných místnostech a zároveň na tomtéž jevišti předváděli své manželství. [SCOPE.sCharacter('tsvetaeva_scope').GetFullNameNoFormatting] ještě není ani dvacet a už je přírodní silou, zatímco Mandelštam píše básně s křišťálovou přesností v chladných a levných pokojích. Nikdo neví, jak zužitkovat tuhle hromadu kultury, která vyrůstá z ruského bláta a špíny.\n\n„Proč je toto století horší než ta ostatní? Snad proto, že v žalu a úzkosti se dotklo jen nejčernějších vředů, ale nedokázalo je za svůj čas vyléčit.“\n\n— Anna Achmatovová" # todo: NEW TRANSLATION
 rlit.035.a: "Musíme tento zázrak institucionalizovat." # todo: NEW TRANSLATION
 rlit.035.b: "Kavárny a salony mohou ukázat cestu." # todo: NEW TRANSLATION
 rlit.035.c: "Prázdná malichernost! Literatura má sloužit vládě." # todo: NEW TRANSLATION
 rlit.036.t: "Za rozcestím" # todo: NEW TRANSLATION
 rlit.036.d: "Díky divadelní obrodě a mecenášům podzemních salonů, kteří podporují mistrovská díla, kritici prohlásili, že [ROOT.GetCountry.GetAdjective] literatura dosáhla výšin, které už možná nikdy nepřekoná. Co přinesou nadcházející desetiletí nyní dospělému [ROOT.GetCountry.GetAdjectiveNoFormatting] [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName]?" # todo: NEW TRANSLATION
 rlit.036.f: "„Viděl jste, co poslední dobou vychází z $RUS$?“\n\nPierrovi se z absintu točila hlava. Očima zamířil k hlasu. Nedokázal ho úplně dostat do zorného pole a nechtěl riskovat nevolnost, kterou by mu způsobilo otáčení hlavy. „Hm?“\n\n„Ptám se, jestli jste viděl, co vychází z $RUS$. Achmatovová? Čechovovy hry?“\n\n„Ano, ano, no — kdo by neznal Čechova? Ruskou literaturu?“\n\nOzvaly se kroky. Zdroj hlasu vstoupil do jeho zorného pole. Jean, který nesl košík s chlebem a tvářil se povýšeně. Posadil se vedle něj a položil košík na stůl. „Vsadil bych se, že většina lidí. Jaká škoda pro ně.“" # todo: NEW TRANSLATION
 rlit.036.a: "Sláva [ROOT.GetCountry.GetRuler.GetFirstName], [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]ovi a Múze!" # todo: NEW TRANSLATION
 rlit.036.b: "Revoluce bude mít své básníky." # todo: NEW TRANSLATION
 rlit.036.c: "Ruskou duši najdeme v #italic miru#!." # todo: NEW TRANSLATION
 rlit.036.opt_d: "Naše literatura je literaturou celého světa." # todo: NEW TRANSLATION
 rlit.036.e: "Věk končí." # todo: NEW TRANSLATION
 rlit.052.t: "Muž v anglickém obleku" # todo: NEW TRANSLATION
 rlit.052.d: "[SCOPE.sCharacter('kharms_scope').GetFullName] — v [ROOT.GetCountry.GetCapital.GetCityHubName] známý tím, že se obléká jako anglický dandy a kouří z kalabašky — byl zatčen spolu s několika dalšími členy svého kroužku za členství ve skupině protivládních autorů dětské literatury." # todo: NEW TRANSLATION
 rlit.052.f: "Důkazem byly některé dětské básně, které byly uznány za nedostatečně materialistické. Při výslechu se přiznal, že vážně poškodil snahy o výchovu nastupující generace tím, že ji sváděl od soudobé konkrétní reality. Byl odsouzen ke třem letům v nápravných táborech, ale nejspíš bude poslán do vyhnanství. Jeho skutečná tvorba — absurdní próza a hry — mezitím nikdy nevyšla a jeho vyšetřovatelé o ní téměř jistě nevědí. Jeho psaní odráží naše století — nesmysly plodí další nesmysly.\n\n„Poezii je třeba psát tak, aby se při jejím vhození do okna rozbila tabulka.“\n\n— Daniil Charms" # todo: NEW TRANSLATION
 rlit.052.a: "OBERIU jsou protivládní nesmysly, ať shnije." # todo: NEW TRANSLATION
 rlit.052.b: "Nechte ho, ať se vrátí k psaní pro děti." # todo: NEW TRANSLATION
 rlit.052.c: "Povolte mu poslední vystoupení, než přijde zákaz." # todo: NEW TRANSLATION
 rlit.052.opt_d: "Obviňte ho z nepříčetnosti." # todo: NEW TRANSLATION
