l_polish:
 CHARACTER_INTERACTION_HEADER: "#header [CharacterInteraction.GetName]#!\n$TOOLTIP_DELIMITER$\n"
 CHARACTER_INTERACTION_ERRORS: "[AddTextIf(And(Not(CharacterInteraction.ShouldShowRequirements), Not(StringIsEmpty(CharacterInteraction.GetCommandDesc(Character.Self)))), Concatenate(Localize('CHARACTER_INTERACTION_ERRORS_IMPL'), '\n\n'))]"
 CHARACTER_INTERACTION_ERRORS_IMPL: "#title Požadavky:#!\n[CharacterInteraction.GetCommandDesc(Character.Self)]"
 CHARACTER_INTERACTION_REQUIREMENTS: "[AddTextIf(And(CharacterInteraction.ShouldShowRequirements, Not(StringIsEmpty(CharacterInteraction.GetRequirements(Character.Self)))), Concatenate(Localize('CHARACTER_INTERACTION_REQUIREMENTS_IMPL'), '\n\n'))]"
 CHARACTER_INTERACTION_REQUIREMENTS_IMPL: "#title Požadavky:#!\n[CharacterInteraction.GetRequirements(Character.Self)][AddTextIf(CharacterInteraction.IsOnCooldown(Character.Self), Concatenate('\n\n@red_cross! ', CharacterInteraction.GetCooldownDesc(Character.Self)))]"
 CHARACTER_INTERACTION_COOLDOWN_DURATION_INFO: "[AddLocalizationIf(Not(StringIsEmpty(CharacterInteraction.GetCooldownDuration(Character.Self))), 'CHARACTER_INTERACTION_COOLDOWN_DURATION_INFO_IMPL')]"
 CHARACTER_INTERACTION_COOLDOWN_DURATION_INFO_IMPL: "@information! Tuto akci lze provést pouze jednou každých [CharacterInteraction.GetCooldownDuration(Character.Self)]\n\n"
 CHARACTER_INTERACTION_INFO: "[ConcatIfNeitherEmpty(CharacterInteraction.GetInfo, '\n\n')]"
 CHARACTER_INTERACTION_EFFECTS: "#title Efekty:#!\n[Select_CString(Not(StringIsEmpty(CharacterInteraction.GetEffects(Character.Self))), CharacterInteraction.GetEffects(Character.Self), Localize('CHARACTER_INTERACTION_NO_EFFECT'))]"
 CHARACTER_INTERACTION_NO_EFFECT: "#italic Žádný efekt#!"
 CHARACTER_INTERACTION_DESC: "[AddTextIf(Not(StringIsEmpty(CharacterInteraction.GetDesc)), Concatenate('\n\n', CharacterInteraction.GetDesc))]"
 CHARACTER_INTERACTION_TOOLTIP: "$CHARACTER_INTERACTION_HEADER$$CHARACTER_INTERACTION_ERRORS$$CHARACTER_INTERACTION_REQUIREMENTS$$CHARACTER_INTERACTION_COOLDOWN_DURATION_INFO$$CHARACTER_INTERACTION_INFO$$CHARACTER_INTERACTION_EFFECTS$$CHARACTER_INTERACTION_DESC$"
 CHARACTER_INTERACTION_CONFIRMATION: "$CHARACTER_INTERACTION_TOOLTIP$\n\nJste si jisti?"
 CHARACTER_INTERACTION_ON_COOLDOWN: "[CharacterInteraction.GetName|v] je na cooldownu do [Date.GetString|v]"
 CHARACTER_INTERACTION_NAME: "[CharacterInteraction.GetName][AddLocalizationIf(CharacterInteraction.IsOnCooldown(Character.Self), 'INTERACTION_COOLDOWN')]"
 INTERACTION_COOLDOWN: " ([CharacterInteraction.GetCooldownRemaining(Character.Self)])"
 grant_command_to_ruler: "Udělte příkaz"
 remove_command_from_ruler: "Uvolnit z velení"
 retire_commander: "Penzionovat"
 retire_commander_info: "Pokud bude poslán do důchodu, [Character.GetFullName] ztratí svou roli [Concept('concept_general','generála')] a přestane ovlivňovat [Concept('concept_clout','politický vliv')] [Character.GetInterestGroup.GetName] skrze svůj [Concept('concept_commander_rank','hodnost velitele')]" # todo: CONCEPT CASE
 exile_character: "Vyhostit disidenta"
 exile_character_info: "Pokud bude [Concept('concept_exile', Select_CString(Character.IsFemale, 'exilována','exilován'))], [Character.GetFullName] opustí [Character.GetCountry.GetAltAdjective('A')] a bude [Select_CString(Character.IsFemale, 'dostupná','dostupný')] pro ostatní [Concept('concept_country', 'země')] jako [Concept('concept_agitator','agitátor')|l]"
 exile_dissident_tt: "[Character.GetFullName] bude [Select_CString(Character.IsFemale, 'poslána','poslán')] do [Concept('concept_exile','exilu')]"
 invite_exile: "Pozvat exulanta"
 invite_exile_start_join_movement_effect: "[SelectLocalization(Character.PredictMovementToJoin(GetPlayer.Self).IsValid, 'invite_exile_join_movement', 'invite_exile_do_not_join_movement')]"
 invite_exile_do_not_join_movement: "[SelectLocalization(Character.PredictMovementTypeToStart(GetPlayer.Self).IsValid, 'invite_exile_start_movement', 'invite_exile_no_movement')]"
 invite_exile_start_movement: "Začne [Character.PredictMovementTypeToStart(GetPlayer.Self).GetName]"
 invite_exile_join_movement: "Připojí se k [Character.PredictMovementToJoin(GetPlayer.Self).GetName]"
 invite_exile_no_movement: "Nebude #b začínat ani se připojovat k [Concept('concept_political_movement','politickému hnutí')]" # todo: CONCEPT CASE
 invite_exile_info: "[Concept( 'concept_character_role', '$concept_character_roles$' )]: #v [Character.GetAllRoleNames]#!\n[Concept('concept_interest_group','Zájmová skupina')]: [Character.GetInterestGroup.GetName]\n[Concept('concept_ideology','Ideologie')]: [Character.GetIdeology.GetName]\n[Concept('concept_popularity','Popularita')]: #v #tooltip:[Character.GetTooltipTag],POPULARITY_BREAKDOWN [LabelingHelper.GetLabelForPopularityCFixedPoint(Character.GetPopularity)]#!#! (#v #tooltippable #tooltip:[Character.GetTooltipTag],POPULARITY_BREAKDOWN [Character.GetPopularity|0]#!#!#!)\n\n$concept_popularity$ [Concept('concept_agitator','agitátor')] ovlivní, kolik podpory dostane $concept_political_movement$, který [Concept('concept_agitator','agitátor')] začne nebo se k němu připojí"
 invite_exile_devout_tt: "Zbožný [Concept('concept_character','postavy')] musí mít naši [Concept('concept_state_religion','státní náboženství')]"
 invite_exile_state_religion_tt: "Dokud máme [Concept('concept_law','zákon')] Státní náboženství, postavy musí mít naši [Concept('concept_state_religion','státní náboženství')]"
 adopt_random_antigovernment_ideology_tt: "Tato [Concept('concept_character','postava')|l] přijme [Concept('concept_ideology','ideologií')] proti naší vládě."
 notification_exile_notification_name: "[SCOPE.sCharacter('exile_scope').GetFullName] byl vyhoštěn z [SCOPE.sCountry('exiling_country_scope').GetAltAdjective('G')]." # todo: CONCEPT CASE
 notification_exile_notification_desc: "[SCOPE.sCharacter('exile_scope').GetFullName] z [SCOPE.sCountry('exiling_country_scope').GetAltAdjective('G')] byl poslán do [Concept('concept_exile','exilu')]."
 notification_exile_notification_tooltip: "#header $notification_exile_notification_name$#!\n$TOOLTIP_DELIMITER$\n$notification_exile_notification_desc$"
 grant_leadership_to_agitator: "Udělat lídrem"
 grant_leadership_to_agitator_info: "[Concept('concept_ideology','Ideologie')]: [Character.GetIdeology.GetName]\n[Concept('concept_popularity','Popularita')]: #v #tooltip:[Character.GetTooltipTag],POPULARITY_BREAKDOWN [LabelingHelper.GetLabelForPopularityCFixedPoint(Character.GetPopularity)]#!#! (#v #tooltippable #tooltip:[Character.GetTooltipTag],POPULARITY_BREAKDOWN [Character.GetPopularity|0]#!#!#!)\n\nPokud mu bude uděleno vedení, $concept_ideology$ [Character.GetFullName] bude přidáno do [Character.GetInterestGroup.GetName] a [Character.GetHerHis] $concept_popularity$ ovlivní jejich [Concept('concept_interest_group_attraction','atraktivita zájmové skupiny')]"
 make_agitator_ig_leader_tt: "Stává se [Concept('concept_leader','vůdcem')] [Character.GetInterestGroup.GetName]" # todo: CONCEPT CASE
 grant_command_to_agitator: "Udělat velitelem"
 grant_command_to_agitator_info: "Pokud [Select_CString(Character.IsFemale, 'jí','mu')] bude svěřeno velení, [Character.GetFullName] zůstane [Concept('concept_agitator','agitátorem')], ale také získá možnost vést armády jako [Concept('concept_general','generál')], s [Select_CString(Character.IsFemale, 'její','jeho')] [Concept('concept_commander_rank','hodností velitele')|l], který ovlivní [Concept('concept_clout','politický vliv')|l] [Character.GetInterestGroup.GetCustom('IG_G')|l]" # todo: CONCEPT CASE
 marry_ruler_or_heir: "Hledat královský sňatek"
 marry_ruler_or_heir_info: "Královský sňatek zvýší [Concept('concept_relations','vztahy')] mezi [Character.GetCountry.GetAltAdjective('I')] a domovskou [Concept('concept_country','zemí')] nového člena královské rodiny a potenciálně zvýší [Character.GetHerHis] [Concept('concept_popularity','popularita')]" # todo: CONCEPT CASE
 marry_ruler_or_heir_desc: "#lore [Character.GetFullName] bude hledat partnera z urozených rodů přátelských zemí.#!"
 abdicate_monarch: "Abdikovat"
 abdicate_monarch_info: "[Concept('concept_ruler','Vládce')] se vzdává trůnu [Character.GetCountry.GetName] a předává roli [Character.GetPrimaryRoleTitle] [Character.GetHerHis] [Concept('concept_heir','dědici')]" # todo: CONCEPT CASE
