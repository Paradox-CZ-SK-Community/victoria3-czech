 je_ukraine_cultural_renaissance_reason: "Po potlačení hajdamáckých povstání se sen o nezávislém ukrajinském státě zdá vzdálenější než kdy dřív. Zatímco však meče selhaly, zastánci ukrajinské věci si brousili pera. Autoři, básníci a novináři, povzbuzení liberálním duchem doby, jsou ochotni riskovat vězení či vyhnanství, aby sen udrželi při životě. Možná se jim podaří znovu zažehnout plamen." # todo: NEW TRANSLATION
