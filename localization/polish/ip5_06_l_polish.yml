 je_belarus_cultural_renaissance_reason: "Obyvatelé zemí zvaných Bílá Rus byli nejprve poddanými Polsko-litevského společenství a později Ruské říše, a jejich vlastní kulturní identita je proto zpochybňována. Z této bouřlivé doby však může vzejít něco nového: touha vytvořit vlastní národ." # todo: NEW TRANSLATION
 je_belarus_cultural_renaissance_trigger_poland: "[concept_journal_entry] #v $je_congress_poland$#! skončil vítězstvím #b Červených#!" # todo: NEW TRANSLATION
 je_belarus_cultural_renaissance_map_fervor: "[GetCulture('byelorussian').GetName] [concept_fervor]: [GetCulture('byelorussian').GetCurrentFervor|v0]" # todo: NEW TRANSLATION
