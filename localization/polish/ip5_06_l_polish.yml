 cultural_renaissances_events.10.d: "V [SCOPE.sState('homan_state').GetCityHubName] se objevilo nové politické uskupení, které prosazuje běloruský separatismus a revoluční socialismus. Jeho členové šíří noviny propagující jejich názory a tajně vyrábějí jejich kopie pomocí hektografu." # todo: NEW TRANSLATION
 cultural_renaissances_events.10.f: "„To se velice mýlíte. Sbírám lidové pohádky. Údajná společenská satira, kvůli níž byla tato díla zabavena, mi zcela uniká.“\n\n„A ten hektograf?“\n\n„Na tisk dalších pohádek. Nic víc.“" # todo: NEW TRANSLATION
