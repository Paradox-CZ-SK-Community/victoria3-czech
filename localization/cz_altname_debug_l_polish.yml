 cz_altname_debug.1.t: "Debug GetAltName 1/3: tovary"
 cz_altname_debug.1.d: "#header Tovary: GetAltNameNoFormatting('adj_<pád>')#!\n#i (pod riadkom očakávaný tvar z cz_goods)#!\n#b grain#!: [GetGoods('grain').GetAltNameNoFormatting('adj_N')] / [GetGoods('grain').GetAltNameNoFormatting('adj_G')] / [GetGoods('grain').GetAltNameNoFormatting('adj_D')] / [GetGoods('grain').GetAltNameNoFormatting('adj_A')] / [GetGoods('grain').GetAltNameNoFormatting('adj_L')] / [GetGoods('grain').GetAltNameNoFormatting('adj_I')]\n   #i očakávané: Obilí / Obilí / Obilí / Obilí / Obilí / Obilím#!\n#b ammunition#!: [GetGoods('ammunition').GetAltNameNoFormatting('adj_N')] / [GetGoods('ammunition').GetAltNameNoFormatting('adj_G')] / [GetGoods('ammunition').GetAltNameNoFormatting('adj_D')] / [GetGoods('ammunition').GetAltNameNoFormatting('adj_A')] / [GetGoods('ammunition').GetAltNameNoFormatting('adj_L')] / [GetGoods('ammunition').GetAltNameNoFormatting('adj_I')]\n   #i očakávané: Munice / Municí / Municím / Munice / Municích / Municemi#!\n#b merchant_marine#!: [GetGoods('merchant_marine').GetAltNameNoFormatting('adj_N')] / [GetGoods('merchant_marine').GetAltNameNoFormatting('adj_G')] / [GetGoods('merchant_marine').GetAltNameNoFormatting('adj_D')] / [GetGoods('merchant_marine').GetAltNameNoFormatting('adj_A')] / [GetGoods('merchant_marine').GetAltNameNoFormatting('adj_L')] / [GetGoods('merchant_marine').GetAltNameNoFormatting('adj_I')]\n   #i očakávané: Obchodní loďstvo / Obchodního loďstva / Obchodnímu loďstvu / Obchodní loďstvo / Obchodním loďstvu / Obchodním loďstvem#!\n#b tools#!: [GetGoods('tools').GetAltNameNoFormatting('adj_N')] / [GetGoods('tools').GetAltNameNoFormatting('adj_G')] / [GetGoods('tools').GetAltNameNoFormatting('adj_D')] / [GetGoods('tools').GetAltNameNoFormatting('adj_A')] / [GetGoods('tools').GetAltNameNoFormatting('adj_L')] / [GetGoods('tools').GetAltNameNoFormatting('adj_I')]\n   #i očakávané: Nástroje / Nástrojů / Nástrojům / Nástroje / Nástrojích / Nástroji#!\n#b copper#!: [GetGoods('copper').GetAltNameNoFormatting('adj_N')] / [GetGoods('copper').GetAltNameNoFormatting('adj_G')] / [GetGoods('copper').GetAltNameNoFormatting('adj_D')] / [GetGoods('copper').GetAltNameNoFormatting('adj_A')] / [GetGoods('copper').GetAltNameNoFormatting('adj_L')] / [GetGoods('copper').GetAltNameNoFormatting('adj_I')]\n   #i očakávané: Měď / Mědi / Mědi / Měď / Mědi / Mědí#!\n#b telephones#!: [GetGoods('telephones').GetAltNameNoFormatting('adj_N')] / [GetGoods('telephones').GetAltNameNoFormatting('adj_G')] / [GetGoods('telephones').GetAltNameNoFormatting('adj_D')] / [GetGoods('telephones').GetAltNameNoFormatting('adj_A')] / [GetGoods('telephones').GetAltNameNoFormatting('adj_L')] / [GetGoods('telephones').GetAltNameNoFormatting('adj_I')]\n   #i očakávané: Telefony / Telefonů / Telefonům / Telefony / Telefonech / Telefony#!\n\n#header Formátovanie (grain, G)#!\n• GetName: [GetGoods('grain').GetName]\n• GetAltName('adj_G'): [GetGoods('grain').GetAltName('adj_G')]\n• GetAltNameNoIcon('adj_G'): [GetGoods('grain').GetAltNameNoIcon('adj_G')]\n• GetAltNameNoFormatting('adj_G'): [GetGoods('grain').GetAltNameNoFormatting('adj_G')]\n• makrá CZGoods / CZGoodsNF: [CZGoods(GetGoods('grain'),'G')] / [CZGoodsNF(GetGoods('grain'),'G')]\n• v texte (prejdi myšou, má byť tooltip tovaru): cena [GetGoods('grain').GetAltName('adj_G')] na trhu\n• chýbajúci kľúč ('neexistuje'): [GetGoods('grain').GetAltNameNoFormatting('neexistuje')]"
 cz_altname_debug.2.t: "Debug GetAltName 2/3: kultúry"
 cz_altname_debug.2.d: "#header Kultúry: GetAltNameNoFormatting('adj_aa' / 'adj_ee' / 'adj_ou_cz')#!\n#i (pod riadkom očakávaný tvar z cz_cultures)#!\n#b czech#!: [GetCulture('czech').GetAltNameNoFormatting('adj_aa')] / [GetCulture('czech').GetAltNameNoFormatting('adj_ee')] / [GetCulture('czech').GetAltNameNoFormatting('adj_ou_cz')]\n   #i očakávané: Česká / České / Českou#!\n#b slovak#!: [GetCulture('slovak').GetAltNameNoFormatting('adj_aa')] / [GetCulture('slovak').GetAltNameNoFormatting('adj_ee')] / [GetCulture('slovak').GetAltNameNoFormatting('adj_ou_cz')]\n   #i očakávané: Slovenská / Slovenské / Slovenskou#!\n#b french#!: [GetCulture('french').GetAltNameNoFormatting('adj_aa')] / [GetCulture('french').GetAltNameNoFormatting('adj_ee')] / [GetCulture('french').GetAltNameNoFormatting('adj_ou_cz')]\n   #i očakávané: Francouzská / Francouzské / Francouzskou#!\n#b miao#!: [GetCulture('miao').GetAltNameNoFormatting('adj_aa')] / [GetCulture('miao').GetAltNameNoFormatting('adj_ee')] / [GetCulture('miao').GetAltNameNoFormatting('adj_ou_cz')]\n   #i očakávané: Miaoská / Miaoské / Miaoskou#!\n#b dagestani#!: [GetCulture('dagestani').GetAltNameNoFormatting('adj_aa')] / [GetCulture('dagestani').GetAltNameNoFormatting('adj_ee')] / [GetCulture('dagestani').GetAltNameNoFormatting('adj_ou_cz')]\n   #i očakávané: Dagestánská / Dagestánské / Dagestánskou#!\n#b crimean_tatar#!: [GetCulture('crimean_tatar').GetAltNameNoFormatting('adj_aa')] / [GetCulture('crimean_tatar').GetAltNameNoFormatting('adj_ee')] / [GetCulture('crimean_tatar').GetAltNameNoFormatting('adj_ou_cz')]\n   #i očakávané: Krymskotatarská / Krymskotatarské / Krymskotatarskou#!\n#b promethean#!: [GetCulture('promethean').GetAltNameNoFormatting('adj_aa')] / [GetCulture('promethean').GetAltNameNoFormatting('adj_ee')] / [GetCulture('promethean').GetAltNameNoFormatting('adj_ou_cz')]\n   #i očakávané: Prométheovská / Prométheovské / Prométheovskou#!\n\n#header Kontroly#!\n• miao, kolízia hashu: starý kľúč miao_adj_ou nie je, 'adj_ou_cz' musí dať #b Miaoskou#!: [GetCulture('miao').GetAltNameNoFormatting('adj_ou_cz')]\n• event 7.a s rovnakým hashom ostal: $natural_disaster_events.7.a$\n• GetName / GetAltName('adj_aa'): [GetCulture('czech').GetName] / [GetCulture('czech').GetAltName('adj_aa')]\n• v texte: První [GetCulture('czech').GetAltNameNoFormatting('adj_aa')|l] populace (má byť malé č); [Concept('concept_state','Stát')] je [GetCulture('czech').GetAltNameNoFormatting('adj_ou_cz')|l] domovinou\n• chýbajúci kľúč ('neexistuje'): [GetCulture('czech').GetAltNameNoFormatting('neexistuje')]"
 cz_altname_debug.3.t: "Debug GetAltName 3/3: záujmové skupiny"
 cz_altname_debug.3.d: "#header Záujmové skupiny: GetAltNameNoFormatting('<pád>') = kľúč <aktuálny názov>_<pád>#!\n#i (pod riadkom očakávané tvary pre uvedený kľúč názvu; varianty len ak daná krajina a názov existujú)#!\n#b hráč: ig_landowners#!: [SCOPE.gsInterestGroup('cz_dbg_ig_landowners').GetName] → [SCOPE.gsInterestGroup('cz_dbg_ig_landowners').GetAltNameNoFormatting('G')] / [SCOPE.gsInterestGroup('cz_dbg_ig_landowners').GetAltNameNoFormatting('D')] / [SCOPE.gsInterestGroup('cz_dbg_ig_landowners').GetAltNameNoFormatting('A')] / [SCOPE.gsInterestGroup('cz_dbg_ig_landowners').GetAltNameNoFormatting('L')] / [SCOPE.gsInterestGroup('cz_dbg_ig_landowners').GetAltNameNoFormatting('I')]\n#b hráč: ig_rural_folk#!: [SCOPE.gsInterestGroup('cz_dbg_ig_rural_folk').GetName] → [SCOPE.gsInterestGroup('cz_dbg_ig_rural_folk').GetAltNameNoFormatting('G')] / [SCOPE.gsInterestGroup('cz_dbg_ig_rural_folk').GetAltNameNoFormatting('D')] / [SCOPE.gsInterestGroup('cz_dbg_ig_rural_folk').GetAltNameNoFormatting('A')] / [SCOPE.gsInterestGroup('cz_dbg_ig_rural_folk').GetAltNameNoFormatting('L')] / [SCOPE.gsInterestGroup('cz_dbg_ig_rural_folk').GetAltNameNoFormatting('I')]\n#b hráč: ig_trade_unions#!: [SCOPE.gsInterestGroup('cz_dbg_ig_trade_unions').GetName] → [SCOPE.gsInterestGroup('cz_dbg_ig_trade_unions').GetAltNameNoFormatting('G')] / [SCOPE.gsInterestGroup('cz_dbg_ig_trade_unions').GetAltNameNoFormatting('D')] / [SCOPE.gsInterestGroup('cz_dbg_ig_trade_unions').GetAltNameNoFormatting('A')] / [SCOPE.gsInterestGroup('cz_dbg_ig_trade_unions').GetAltNameNoFormatting('L')] / [SCOPE.gsInterestGroup('cz_dbg_ig_trade_unions').GetAltNameNoFormatting('I')]\n#b hráč: ig_armed_forces#!: [SCOPE.gsInterestGroup('cz_dbg_ig_armed_forces').GetName] → [SCOPE.gsInterestGroup('cz_dbg_ig_armed_forces').GetAltNameNoFormatting('G')] / [SCOPE.gsInterestGroup('cz_dbg_ig_armed_forces').GetAltNameNoFormatting('D')] / [SCOPE.gsInterestGroup('cz_dbg_ig_armed_forces').GetAltNameNoFormatting('A')] / [SCOPE.gsInterestGroup('cz_dbg_ig_armed_forces').GetAltNameNoFormatting('L')] / [SCOPE.gsInterestGroup('cz_dbg_ig_armed_forces').GetAltNameNoFormatting('I')]\n#b PRU: ig_junkers#!: [SCOPE.gsInterestGroup('cz_dbg_ig_pru_landowners').GetName] → [SCOPE.gsInterestGroup('cz_dbg_ig_pru_landowners').GetAltNameNoFormatting('G')] / [SCOPE.gsInterestGroup('cz_dbg_ig_pru_landowners').GetAltNameNoFormatting('D')] / [SCOPE.gsInterestGroup('cz_dbg_ig_pru_landowners').GetAltNameNoFormatting('A')] / [SCOPE.gsInterestGroup('cz_dbg_ig_pru_landowners').GetAltNameNoFormatting('L')] / [SCOPE.gsInterestGroup('cz_dbg_ig_pru_landowners').GetAltNameNoFormatting('I')]\n   #i očakávané: Junkerové → Junkerů / Junkerům / Junkery / Junkerech / Junkery#!\n#b JAP: ig_samurai#!: [SCOPE.gsInterestGroup('cz_dbg_ig_jap_armed_forces').GetName] → [SCOPE.gsInterestGroup('cz_dbg_ig_jap_armed_forces').GetAltNameNoFormatting('G')] / [SCOPE.gsInterestGroup('cz_dbg_ig_jap_armed_forces').GetAltNameNoFormatting('D')] / [SCOPE.gsInterestGroup('cz_dbg_ig_jap_armed_forces').GetAltNameNoFormatting('A')] / [SCOPE.gsInterestGroup('cz_dbg_ig_jap_armed_forces').GetAltNameNoFormatting('L')] / [SCOPE.gsInterestGroup('cz_dbg_ig_jap_armed_forces').GetAltNameNoFormatting('I')]\n   #i očakávané: Samurajové → Samurajů / Samurajům / Samuraje / Samurajích / Samuraji#!\n#b PAN: ig_jats#!: [SCOPE.gsInterestGroup('cz_dbg_ig_pan_rural_folk').GetName] → [SCOPE.gsInterestGroup('cz_dbg_ig_pan_rural_folk').GetAltNameNoFormatting('G')] / [SCOPE.gsInterestGroup('cz_dbg_ig_pan_rural_folk').GetAltNameNoFormatting('D')] / [SCOPE.gsInterestGroup('cz_dbg_ig_pan_rural_folk').GetAltNameNoFormatting('A')] / [SCOPE.gsInterestGroup('cz_dbg_ig_pan_rural_folk').GetAltNameNoFormatting('L')] / [SCOPE.gsInterestGroup('cz_dbg_ig_pan_rural_folk').GetAltNameNoFormatting('I')]\n   #i očakávané: Džátové → Džátů / Džátům / Džáty / Džátech / Džáty#!\n\n#header Formátovanie (ig_landowners hráča, G)#!\n• GetAltName('G'): [SCOPE.gsInterestGroup('cz_dbg_ig_landowners').GetAltName('G')]\n• GetAltNameNoIcon('G'): [SCOPE.gsInterestGroup('cz_dbg_ig_landowners').GetAltNameNoIcon('G')]\n• makrá CZIG / CZIGNF: [CZIG(SCOPE.gsInterestGroup('cz_dbg_ig_landowners'),'G')] / [CZIGNF(SCOPE.gsInterestGroup('cz_dbg_ig_landowners'),'G')]\n• v texte: Zavražděn vůdce [SCOPE.gsInterestGroup('cz_dbg_ig_landowners').GetAltName('G')] (prejdi myšou, má byť tooltip IG); spolupráce s [SCOPE.gsInterestGroup('cz_dbg_ig_landowners').GetAltNameNoFormatting('I')]\n• chýbajúci kľúč ('N' – nominatív nemá _N v custom loc, ale v cz súbore áno): [SCOPE.gsInterestGroup('cz_dbg_ig_landowners').GetAltNameNoFormatting('N')]\n• chýbajúci kľúč ('neexistuje'): [SCOPE.gsInterestGroup('cz_dbg_ig_landowners').GetAltNameNoFormatting('neexistuje')]"
